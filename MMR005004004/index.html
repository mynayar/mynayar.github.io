
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bone Bwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bone Bwet</div><div class="name-mm">ဘုန်းဘွက်</div></div>
        <span class="pcode-badge">MMR005004004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6786089132708, 22.476807017829685], [95.67750614659144, 22.475195283435653], [95.67619168489841, 22.479664460746335], [95.67353132840816, 22.48179274503923], [95.67349384466524, 22.48174868185623], [95.67155588839358, 22.480836539075085], [95.6676653249948, 22.481267745110415], [95.66619695962203, 22.483068480126292], [95.66614728017288, 22.49119377027631], [95.6629918801712, 22.491176040142193], [95.66262467978521, 22.49374436990678], [95.66262467978521, 22.495903109740766], [95.66262467978521, 22.499295390270106], [95.66239211960072, 22.501506059657004], [95.66493768032973, 22.501916639741182], [95.66940959967337, 22.503150270368735], [95.67218484005838, 22.504846409734057], [95.6741893200811, 22.50577151983981], [95.67789012023292, 22.5042296402857], [95.68159092038474, 22.5042296402857], [95.6842776000313, 22.504357530175923], [95.68436651959928, 22.501608299983104], [95.68374948035432, 22.499295390270106], [95.68390392002993, 22.496519880088442], [95.68401767977218, 22.492188899797952], [95.68434136106504, 22.488077030330714], [95.68302689577467, 22.484133638956337], [95.68092375382821, 22.480190247581902], [95.6786089132708, 22.476807017829685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
