
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wun Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wun Twin</div><div class="name-mm">ဝန်တွင်း</div></div>
        <span class="pcode-badge">MMR009014024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78955546571223, 19.206756844352924], [94.78967199986295, 19.207013220383885], [94.80202465491396, 19.21071901626965], [94.81067151228052, 19.2076308531814], [94.81623020655883, 19.207013220383885], [94.82425943202725, 19.198983994915466], [94.82439206044529, 19.198859168116144], [94.82055363614143, 19.19651346372541], [94.81808310495137, 19.186631340763824], [94.81990037040583, 19.184087168588007], [94.81067151228052, 19.165014197347375], [94.80078938931894, 19.145867583322342], [94.79864171204542, 19.141572227876054], [94.79152489915481, 19.151426276701386], [94.77484881631989, 19.160073134967263], [94.75940799818062, 19.163778930853027], [94.74890824242152, 19.166867094840597], [94.74149664975067, 19.16254366615732], [94.74098726205256, 19.16224121695865], [94.73284979238406, 19.16563182924557], [94.72547488575742, 19.172416742838436], [94.72852636280146, 19.17613158500467], [94.73284979238406, 19.180455013688004], [94.75137877271226, 19.179219748992296], [94.76496669155961, 19.183543177675574], [94.77855461220565, 19.18601370796631], [94.7865838367747, 19.200219261409813], [94.78955546571223, 19.206756844352924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
