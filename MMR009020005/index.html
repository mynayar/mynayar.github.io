
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyan Seint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyan Seint</div><div class="name-mm">ကြန်စိမ့်</div></div>
        <span class="pcode-badge">MMR009020005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06793634858366, 21.577908536249993], [95.07041962226782, 21.577268661419623], [95.07116758931284, 21.57750874623173], [95.07262095399392, 21.576404190800815], [95.07687765927659, 21.574701507968257], [95.08241137668375, 21.575127178676382], [95.08496539913392, 21.577894038279283], [95.08964777512477, 21.577468366671837], [95.09096619023757, 21.577472025113934], [95.09600146559524, 21.57748599608192], [95.0990272454111, 21.575753420683895], [95.1018631342763, 21.5733901777146], [95.10284356168108, 21.572573154427573], [95.10710026786313, 21.569167789661833], [95.11987038371132, 21.563846909407403], [95.12178590099859, 21.56256989728297], [95.11667785429961, 21.557674685938082], [95.11199548100672, 21.554269320272965], [95.10645440804456, 21.548728247310805], [95.10497191612109, 21.547245755387337], [95.09624566930228, 21.543627557965465], [95.09411731486227, 21.542563382094443], [95.09416888108905, 21.540655452387284], [95.0868595647172, 21.545476491247143], [95.07578120493872, 21.54773737967639], [95.07039155892335, 21.54933431302817], [95.06967680294218, 21.54954609167885], [95.06741591271424, 21.55293742702071], [95.06741591271424, 21.56017227413122], [95.06854635782821, 21.5687636550187], [95.06809417960278, 21.573963700564377], [95.06718982405118, 21.57667676901775], [95.06793634858366, 21.577908536249993]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
