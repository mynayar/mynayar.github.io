
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saing Naing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saing Naing Gyi</div><div class="name-mm">စိုင်နိုင်ကြီး</div></div>
        <span class="pcode-badge">MMR005006048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67995111994827, 22.43423699993764], [95.67652139974285, 22.435484220220644], [95.6710486797528, 22.43464227042449], [95.66726004011883, 22.433379390246728], [95.65926192040138, 22.429169820231095], [95.65336871969072, 22.42874888984943], [95.644949399795, 22.435484220220644], [95.64159455984111, 22.437832680134136], [95.64326568006715, 22.44221954969254], [95.64663312042222, 22.44937581044536], [95.64663312042222, 22.457374020095017], [95.64663312042222, 22.463162189883235], [95.64663312042222, 22.463267399770757], [95.65000091960684, 22.46579316012628], [95.66052479967982, 22.467056040304044], [95.6685229202966, 22.467897990100198], [95.67778427992062, 22.467056040304044], [95.68215360010862, 22.4696777403355], [95.68283579973246, 22.46873984996415], [95.68536156008798, 22.467056040304044], [95.68451952035963, 22.464109349566854], [95.68367747973195, 22.45863690027278], [95.68157291955464, 22.453164450079385], [95.68241459955419, 22.44811293026754], [95.68578239963807, 22.441377599896384], [95.68409867991022, 22.43800997967685], [95.67988884009793, 22.43464227042449], [95.67995111994827, 22.43423699993764]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
