
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gar Ra Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waingmaw</div><div class="name-mm">ဝိုင်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gar Ra Yang</div><div class="name-mm">ဂါးရာယန်</div></div>
        <span class="pcode-badge">MMR001002023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.50518428262859, 25.133416311014003], [97.4968632379481, 25.14423366864895], [97.5085127014001, 25.17002890940671], [97.5135053282084, 25.186670998767624], [97.52598689567873, 25.20747361091844], [97.54512529889348, 25.225779911014115], [97.55178213463785, 25.236597268649064], [97.56093528513537, 25.24824673210105], [97.56343159898915, 25.262392509406823], [97.56676001686134, 25.282363016639977], [97.57840948031333, 25.28652353942988], [97.58649278111699, 25.289851957302062], [97.590058942866, 25.277370389831674], [97.59255525582046, 25.24575041914659], [97.58673052499381, 25.214962551580527], [97.58173789818551, 25.198320462219613], [97.56759212087974, 25.188335207703744], [97.56183178420952, 25.182129570823065], [97.55726812862127, 25.17800055038515], [97.55466032671279, 25.17256762809359], [97.55444301003695, 25.16735202157861], [97.55226984058072, 25.164526902994226], [97.54879277017028, 25.1590939798034], [97.54270789695192, 25.156486176995543], [97.54466374883299, 25.152574473233415], [97.54357716455456, 25.149532037073925], [97.53770960891137, 25.14931472039808], [97.53379790424992, 25.151705205630776], [97.53053815141459, 25.1501839871014], [97.52445327819629, 25.145620332412477], [97.51510865124334, 25.137579607313057], [97.50518428262859, 25.133416311014003]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
