
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Ka Zaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Ka Zaung</div><div class="name-mm">ရွှေကဇောင်း</div></div>
        <span class="pcode-badge">MMR007010024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.36143512982744, 19.250044836899747], [96.35497672589526, 19.24766247524309], [96.34582534796152, 19.24800141533308], [96.33972442993854, 19.246645654973065], [96.32786153398268, 19.24596777479303], [96.3241017158216, 19.244133503158707], [96.32313731703363, 19.250275610131325], [96.32278381332236, 19.2577902821958], [96.32243849613974, 19.262575830210437], [96.32345349887993, 19.269366129843092], [96.32515001506118, 19.275794485627046], [96.32345531461112, 19.27986176490856], [96.33248468961682, 19.277900502706075], [96.33996120794347, 19.281686964182086], [96.3438721409866, 19.278511598331647], [96.33802791016001, 19.272015010984035], [96.33283710694701, 19.264173280672424], [96.33577111004877, 19.261383798623456], [96.3448844115864, 19.260175570246417], [96.35333914588495, 19.262923414583952], [96.35820205088402, 19.265852555051424], [96.35755266932028, 19.262575831109757], [96.3581918049079, 19.261297558135823], [96.36060312833177, 19.256474912187514], [96.36090139208562, 19.25418048803914], [96.36143512982744, 19.250044836899747]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
