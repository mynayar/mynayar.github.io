
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daunt Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daunt Thit</div><div class="name-mm">ဒေါင့်သစ်</div></div>
        <span class="pcode-badge">MMR010017060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31540954271628, 21.41116054572268], [95.3139334215902, 21.411559497572796], [95.31081992100263, 21.41322744499064], [95.30692804459363, 21.414895392408482], [95.30470411560253, 21.416563338027686], [95.30192420503812, 21.418453677894945], [95.30550502034049, 21.42061283141709], [95.30672785730485, 21.423330247193178], [95.31624604172151, 21.42460928638951], [95.3279762337163, 21.425618334718422], [95.33693154055823, 21.42965452983276], [95.34237038488544, 21.438259765675696], [95.34783461347666, 21.43572896462007], [95.35263261260502, 21.433424662318373], [95.35414777060316, 21.43282491253973], [95.35524161061193, 21.431186954814166], [95.35485568454226, 21.43076886808882], [95.35420966554369, 21.429941543067798], [95.35321895439131, 21.428756997437517], [95.35171135069834, 21.427184781952178], [95.35450116999306, 21.421648615691083], [95.35022208508121, 21.41879589331586], [95.34618072695906, 21.41546771556267], [95.34047528130924, 21.412377266397755], [95.33572074191875, 21.40999999580322], [95.3316793837966, 21.409286815434257], [95.32644939082678, 21.409286815434257], [95.3204940118892, 21.409335568581696], [95.31804769044862, 21.410447534426226], [95.31540954271628, 21.41116054572268]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
