
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Yun Nar Than</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsihseng</div><div class="name-mm">ဆီဆိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Yun Nar Than</div><div class="name-mm">လွယ်ယွန်းနားသံ</div></div>
        <span class="pcode-badge">MMR014004007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.32175217832042, 20.58948515121881], [97.32182381022074, 20.589482168167592], [97.32826918837242, 20.5921191728616], [97.33735140574282, 20.59153337336653], [97.34467587569117, 20.586259747989004], [97.34672682907996, 20.58010706229112], [97.35200053809444, 20.572196515856547], [97.36020397213565, 20.565164985675608], [97.37337317113497, 20.55955227181994], [97.3789272887634, 20.558522601137156], [97.38745092192255, 20.551688094430062], [97.3924315904456, 20.545828457317498], [97.39990587575562, 20.541344935820177], [97.3999220626531, 20.540810749316677], [97.39751980889213, 20.495648366379044], [97.39367620179536, 20.46537995981737], [97.39944161244051, 20.443279218561145], [97.38856390400105, 20.415375531655513], [97.38839124226206, 20.414932616447118], [97.37202106561972, 20.431745228959187], [97.37061455921457, 20.433189749707253], [97.35764238458842, 20.448564178094387], [97.35043562240611, 20.46441905759349], [97.33794389889187, 20.49468746415522], [97.33848200374155, 20.4962345157104], [97.34178750598869, 20.505737834333615], [97.34418975974967, 20.515827303187564], [97.34178750598869, 20.524475418705663], [97.32929578337377, 20.548497962610952], [97.32353037182924, 20.573481409639385], [97.32175217832042, 20.58948515121881]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
