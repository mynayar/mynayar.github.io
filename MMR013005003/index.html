
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chaung</div><div class="name-mm">သရက်ချောင်း</div></div>
        <span class="pcode-badge">MMR013005003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.90275858314214, 17.270750110429276], [95.90820375599861, 17.269298064154384], [95.91437495064349, 17.276195282386425], [95.9285324002501, 17.27546925879932], [95.93169135437256, 17.25665584269302], [95.92816938890621, 17.254414591859984], [95.92779606233847, 17.24881469244417], [95.9276839330671, 17.247132749776654], [95.92744336621843, 17.243524247046423], [95.92805242757754, 17.241453434828202], [95.92891522186005, 17.23851993624612], [95.92892832498228, 17.23847538473126], [95.92885825070778, 17.23849290262541], [95.9286386560492, 17.238547800840365], [95.92550867178784, 17.23545251512155], [95.92494587155477, 17.234895954384854], [95.92264142716022, 17.232617056132312], [95.92002436942914, 17.233158203388427], [95.90988829860618, 17.23594318702851], [95.90846797771508, 17.23509293109396], [95.90844209432726, 17.23514125706339], [95.90787586677789, 17.23619844340351], [95.9078407437554, 17.23626401657117], [95.90744170916759, 17.23776039942294], [95.90638869837977, 17.2417091903269], [95.90275858314214, 17.246791350940157], [95.90130653686725, 17.250784478420996], [95.90173861434562, 17.254529140307625], [95.90239557179825, 17.26022277606029], [95.90348460582993, 17.265304937572864], [95.90283500663031, 17.270176935617144], [95.90275858314214, 17.270750110429276]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
