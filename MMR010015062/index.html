
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myit Son Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myit Son Gyi</div><div class="name-mm">မြစ်ဆုံကြီး</div></div>
        <span class="pcode-badge">MMR010015062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18581190089856, 21.39090735009421], [96.1881906796562, 21.390175417961245], [96.19221630503853, 21.388528571336565], [96.19417812392135, 21.3889209347534], [96.19496105031226, 21.38907752021146], [96.19752281232797, 21.388345588078494], [96.1993526413114, 21.385234878087203], [96.1977057937874, 21.383588030563203], [96.19843772592037, 21.38175820068045], [96.1981493628029, 21.38022026285489], [96.19788877704548, 21.37883047394729], [96.19624193132012, 21.37571976305668], [96.194085913734, 21.375230483300243], [96.18912026029182, 21.37249972608157], [96.1813917771089, 21.372821746326565], [96.17495137490607, 21.373304775794793], [96.1714927918589, 21.375474533223155], [96.17377480356441, 21.377585394050755], [96.17556485373507, 21.380843286188735], [96.18105434428264, 21.387064707969955], [96.18581190089856, 21.39090735009421]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
