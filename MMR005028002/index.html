
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Khat Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Khat Taw</div><div class="name-mm">ကျခတ္တော</div></div>
        <span class="pcode-badge">MMR005028002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.38812243999865, 23.416503930212286], [94.3936768795844, 23.416076700079714], [94.3977049196464, 23.4157104898473], [94.40490707999783, 23.4157104898473], [94.4108888396483, 23.4157104898473], [94.41634176016419, 23.416658820448276], [94.4188844403647, 23.413330079719458], [94.42150884016093, 23.408874539728288], [94.42309571999152, 23.40747071959811], [94.41827387983574, 23.404907249769792], [94.41607680010429, 23.39990234991359], [94.4108888396483, 23.397094709653175], [94.40048555956099, 23.40037889976645], [94.38886151994325, 23.399948340343656], [94.38105816010608, 23.399948340343656], [94.3815308401762, 23.40167238027618], [94.38348384030706, 23.406127920267352], [94.38452136027263, 23.40930176986086], [94.3862914796681, 23.413330079719458], [94.38730452008758, 23.416428600299696], [94.38803388015953, 23.41649574008636], [94.38812243999865, 23.416503930212286]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
