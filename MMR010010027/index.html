
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar U Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar U Yin</div><div class="name-mm">ကြာဥယျာဉ်</div></div>
        <span class="pcode-badge">MMR010010027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9952794197095, 22.449736264117348], [95.99807708289114, 22.451007928872855], [96.00011174685972, 22.454568590368183], [96.00392674202556, 22.454568590368183], [96.0079960699627, 22.453805592054493], [96.01257406344234, 22.45227959362842], [96.0136350341296, 22.44831508167573], [96.01592835211181, 22.44418710984729], [96.0141000609691, 22.443123605769813], [96.0097764002607, 22.443123605769813], [96.00697873797844, 22.442360606556804], [96.00112907884397, 22.438545612290227], [95.99950580614808, 22.436020521030287], [95.9990944148754, 22.437019613864152], [95.99705975090683, 22.44032594258823], [95.99604241892257, 22.442106273785555], [95.99248175742724, 22.44286927299862], [95.99044709255935, 22.442614940227372], [95.99121009177236, 22.44592126895145], [95.99299042296968, 22.447701600148775], [95.9952794197095, 22.449736264117348]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
