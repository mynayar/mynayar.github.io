
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Taw Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Taw Kyun</div><div class="name-mm">ရှားတောကျွန်း</div></div>
        <span class="pcode-badge">MMR008013031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38846924176215, 18.29448179539861], [95.38006101230593, 18.289921398953425], [95.37353330032164, 18.286191278204967], [95.36514052841272, 18.281342121142018], [95.35040654862337, 18.275560432767804], [95.3388033606866, 18.269597647013825], [95.33863596807555, 18.269849823210848], [95.33862275703467, 18.26987818513021], [95.33623271426842, 18.275708965696253], [95.33474496400896, 18.286088793263275], [95.33187595491142, 18.28880073756403], [95.3341805234125, 18.294397544211336], [95.33921618637794, 18.29533007462328], [95.35469618887805, 18.290107904855972], [95.3619699253718, 18.287869832227045], [95.36234293717689, 18.292905496091805], [95.36178341856998, 18.298127664959793], [95.36327546668952, 18.302230799311985], [95.36672924375966, 18.31095612972166], [95.36905715506373, 18.3106235712209], [95.37651739656064, 18.307452968179973], [95.38155306042546, 18.302417305214533], [95.38602920568337, 18.298500677664208], [95.38846924176215, 18.29448179539861]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
