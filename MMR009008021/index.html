
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Haung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Haung</div><div class="name-mm">ကုလားဟောင်း</div></div>
        <span class="pcode-badge">MMR009008021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.68846006917693, 20.336764063111048], [94.69059469369023, 20.33365915374702], [94.69307631262177, 20.332580189424277], [94.69236051612495, 20.330758160260928], [94.6887811532277, 20.32739355816625], [94.68605400768638, 20.324830041573193], [94.69223438620804, 20.30918990219226], [94.69841476383033, 20.29682914604831], [94.70043284699835, 20.292036200210532], [94.70052356970706, 20.291582584868422], [94.69771995930876, 20.291582584868422], [94.69594089255821, 20.290126986271446], [94.69076542908135, 20.288186187242786], [94.68429609928563, 20.285598454605065], [94.68154663436974, 20.283981122830596], [94.67766503631242, 20.281716857447066], [94.67523903685213, 20.280746458382396], [94.66553504260821, 20.282202056979372], [94.65663971425147, 20.28284898968917], [94.65659444597696, 20.282792943939285], [94.64584925623825, 20.291441510917025], [94.63455425787276, 20.300854009704835], [94.6329406861638, 20.314838293952164], [94.63289447719842, 20.315346597967164], [94.64379062533715, 20.31956762714435], [94.65682237285426, 20.324615961557413], [94.67852422071627, 20.327585689328146], [94.68492055613882, 20.332839821001016], [94.68846006917693, 20.336764063111048]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
