
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htone Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htone Pan</div><div class="name-mm">ထုံးပန်း</div></div>
        <span class="pcode-badge">MMR005029018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.42492739977973, 22.741068149775344], [94.42483380013982, 22.742611020382355], [94.42366199970161, 22.76253351011343], [94.42354176034405, 22.764576779694664], [94.41647603973752, 22.783204709729603], [94.44001608027793, 22.783204709729603], [94.46499684013213, 22.791818699573355], [94.48739315976655, 22.792680090014187], [94.48956072015119, 22.79395512003282], [94.49041896026688, 22.794459840249488], [94.4891161196133, 22.787511660135067], [94.48725744127796, 22.775740555282425], [94.48567055964867, 22.775452020394482], [94.48136352021032, 22.760808210230778], [94.46671944025002, 22.75305551999628], [94.46241239991241, 22.741857269797208], [94.4615512801675, 22.731520499971168], [94.44346164024256, 22.730659019598136], [94.4365705203133, 22.72893623961579], [94.42592639998344, 22.724581949797198], [94.42492739977973, 22.741068149775344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
