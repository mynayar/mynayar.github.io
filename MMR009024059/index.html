
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Swea Lwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Swea Lwe</div><div class="name-mm">ဆွဲလွဲ</div></div>
        <span class="pcode-badge">MMR009024059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.27541125692403, 21.709402740144412], [94.27541125692403, 21.712624384208027], [94.28336254804321, 21.72084985703532], [94.29103965655497, 21.734558980212796], [94.29652330600584, 21.74086517658668], [94.30063604331878, 21.74388118436923], [94.30611969187032, 21.745252095607782], [94.31571607773486, 21.747171372960565], [94.31982881504786, 21.74826810339033], [94.32448991667638, 21.747445554668673], [94.3253124635994, 21.745800460822636], [94.3310702956577, 21.74552627821521], [94.33500761121235, 21.746488732668922], [94.33667220236032, 21.74052615555769], [94.34202782972062, 21.733329515244975], [94.34263787493802, 21.731325142241587], [94.33956995199173, 21.72907533076193], [94.32915101920423, 21.722769134388102], [94.31982881504786, 21.71783385015209], [94.31860173598142, 21.715379692918532], [94.3140709829895, 21.71618875540679], [94.30502296233988, 21.71701130322913], [94.30091022592626, 21.71701130322913], [94.29899094767416, 21.713446931131045], [94.29707167122069, 21.711253471170835], [94.28445927757366, 21.70933419381805], [94.27541125692403, 21.709060012109944], [94.27541125692403, 21.709402740144412]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
