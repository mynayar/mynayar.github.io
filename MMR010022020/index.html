
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mee Laung Hpyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mee Laung Hpyar</div><div class="name-mm">မီးလောင်ဖျား</div></div>
        <span class="pcode-badge">MMR010022020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83100981794883, 20.993509016727785], [94.84421564813374, 20.992210082729173], [94.85930041478235, 20.988288043958107], [94.86797294869268, 20.983113352099565], [94.87345736256731, 20.983113352099565], [94.87836447104354, 20.983113352099565], [94.88731272720065, 20.98224739220342], [94.89197005797183, 20.980931190322224], [94.8923837811866, 20.97811787893704], [94.8925889651087, 20.968884600643833], [94.89248142687643, 20.959196613432994], [94.88505942635152, 20.959196613432994], [94.87720083734882, 20.959196613432994], [94.86977883682391, 20.959196613432994], [94.86628612990103, 20.959196613432994], [94.86759589533438, 20.95002825899701], [94.8620156730849, 20.952687994955056], [94.85930041478235, 20.956610033726122], [94.85326650794303, 20.9614371591976], [94.8415003898312, 20.96324733079973], [94.83276788463024, 20.963489901337937], [94.83228713943998, 20.9707678817324], [94.8309060038091, 20.991981521829814], [94.83100981794883, 20.993509016727785]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
