
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Zin</div><div class="name-mm">မကြီးဇင်</div></div>
        <span class="pcode-badge">MMR009016078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5868670721577, 19.286986362330822], [95.59266908880744, 19.263488190627527], [95.5990026362627, 19.263488190627527], [95.58522907935861, 19.256420181246426], [95.56700105355583, 19.240796160414504], [95.56799599062253, 19.237527083408224], [95.56551305238554, 19.23819215634302], [95.56067704610882, 19.243400162687408], [95.55584103893284, 19.25009617200078], [95.5505802001162, 19.25272659185879], [95.54815392186606, 19.256770388942357], [95.54956059824309, 19.26802379366319], [95.55284284132415, 19.271774928869945], [95.55612508440515, 19.27599495620234], [95.55706286775722, 19.279277199283342], [95.55766574807586, 19.281344214563887], [95.55918904403921, 19.281344214563887], [95.55997768472241, 19.28171621643031], [95.56737305542225, 19.28171621643031], [95.58671708142822, 19.2869242227747], [95.5868670721577, 19.286986362330822]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
