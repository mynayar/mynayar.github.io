
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (168) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (Seikkan)</div><div class="name-mm">ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (168) Ward</div><div class="name-mm">အမှတ် (၁၆၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013021701535</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.28942008057231, 16.860531352240173], [96.28752327008289, 16.860120773055257], [96.28536796565913, 16.859741210588425], [96.284343719687, 16.859552384435062], [96.28252792372479, 16.859230041333376], [96.28134267122738, 16.859014906412824], [96.28023529102592, 16.864720027407373], [96.28012148541825, 16.865451177130183], [96.27983093155228, 16.86728286771023], [96.27952232379624, 16.869301986897256], [96.27908490074765, 16.871930043336874], [96.2794202165698, 16.874903997021875], [96.28222579018814, 16.874214325830508], [96.2857507072294, 16.873182297125368], [96.28944969165002, 16.872671126971], [96.29116821334242, 16.872357686258283], [96.29239082367764, 16.871316909847565], [96.29378395086871, 16.870119094720508], [96.29397496327397, 16.86980282204263], [96.2938353219426, 16.86945152256976], [96.2899063107277, 16.861295127568155], [96.28942008057231, 16.860531352240173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
