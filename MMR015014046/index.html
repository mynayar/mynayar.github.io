
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sei Hkan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sei Hkan</div><div class="name-mm">စယ်ခန်</div></div>
        <span class="pcode-badge">MMR015014046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.4705824496204, 22.45323467903728], [97.47567817560736, 22.455507230774117], [97.51245237587648, 22.44748376906074], [97.53050516608062, 22.442469106164367], [97.54989519870452, 22.437788752748816], [97.5625990138335, 22.430768223974383], [97.57095678682629, 22.419735963443998], [97.57697438266172, 22.418733031404315], [97.58025155176779, 22.41811302619527], [97.57766936255109, 22.415308025445086], [97.57597144972266, 22.415055610927766], [97.56360194587319, 22.4030204183577], [97.54220604827054, 22.381958830235874], [97.5141239313744, 22.364908972970795], [97.4816957723421, 22.351536537081586], [97.47930691038567, 22.35220840439439], [97.47099782309112, 22.354545334999273], [97.4489333020303, 22.360562930834647], [97.4378222402043, 22.367613309906403], [97.43589517742055, 22.373935367623176], [97.43622948780069, 22.382961763174876], [97.43790104239923, 22.39700282072363], [97.43255206732408, 22.412715433770302], [97.432217756944, 22.423413383021284], [97.43380049809457, 22.424254214960115], [97.44291570619492, 22.429096669375838], [97.45896262962174, 22.441131861945905], [97.4705824496204, 22.45323467903728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
