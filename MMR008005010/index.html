
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dar Thway Kyauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dar Thway Kyauk</div><div class="name-mm">ဒါးသွေးကျောက်</div></div>
        <span class="pcode-badge">MMR008005010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53592485075131, 18.70116869917615], [95.53601864824208, 18.700918575232095], [95.5387739893282, 18.700083623960154], [95.5389113149053, 18.699319273965386], [95.53742975557884, 18.69505979157617], [95.5355778077697, 18.690059530423014], [95.53298507939797, 18.68339251525242], [95.53057754571722, 18.67746627884577], [95.52909598729002, 18.671540043338382], [95.52594767394606, 18.66968809462992], [95.52020663402902, 18.670243678702832], [95.51576195694884, 18.670984459265412], [95.51242844891385, 18.671910432720324], [95.51002091613242, 18.674132770810786], [95.50650221340646, 18.67561433013725], [95.50298351068051, 18.67635510980051], [95.50113156197204, 18.67598472041857], [95.49779805393712, 18.67468835578302], [95.4952053255654, 18.67524394075531], [95.49261259809299, 18.679133032863206], [95.49446454680145, 18.6819109559259], [95.49483493708271, 18.68394810022471], [95.49483493708271, 18.686726023287406], [95.49343110795934, 18.68706912364121], [95.49403928618415, 18.691022284350993], [95.49525564263388, 18.699840869960212], [95.49647199998287, 18.70409811843348], [95.50194560490581, 18.70409811843348], [95.51958277702357, 18.702577672421683], [95.53296270066818, 18.701361315972008], [95.53592485075131, 18.70116869917615]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
