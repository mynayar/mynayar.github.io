
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo Kan</div><div class="name-mm">အုပ်ဖိုကန်</div></div>
        <span class="pcode-badge">MMR010029023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74857688341649, 21.1239652114254], [95.74942880579482, 21.118569700931005], [95.7517005994032, 21.114310089039407], [95.7548243153899, 21.11317419223525], [95.76050379761222, 21.111186373052703], [95.76249161769408, 21.1094825282961], [95.76277559211997, 21.104087018701023], [95.76334354007236, 21.099259457957658], [95.76419546335, 21.09443189721435], [95.7684550752416, 21.09017228442343], [95.76966099326029, 21.088363407845065], [95.7610717473633, 21.088184465240943], [95.75340444415986, 21.088184465240943], [95.74857688341649, 21.085628697206687], [95.74232945144308, 21.079665239659107], [95.73750188980046, 21.0748376789158], [95.73409420028719, 21.083072930071694], [95.7329583043823, 21.089604335571664], [95.73011856192215, 21.096419716396838], [95.72727882036133, 21.10153125066671], [95.72727882036133, 21.105919943150923], [95.72898266511794, 21.10607483788351], [95.73267432905709, 21.111186373052703], [95.73352625233474, 21.118001752978557], [95.73494612266546, 21.12027354568761], [95.74289740029485, 21.121693416917708], [95.74857688341649, 21.1239652114254]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
