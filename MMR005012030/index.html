
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Mee Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Mee Laung</div><div class="name-mm">မြင်းမီးလောင်</div></div>
        <span class="pcode-badge">MMR005012030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19215148030662, 22.18187628006632], [95.1960200399929, 22.179555180227453], [95.20067663961527, 22.175956710333992], [95.20554527959104, 22.173416639966035], [95.211048599913, 22.172781599890982], [95.211048599913, 22.167066419979335], [95.20723872009091, 22.159657890399387], [95.2030051201902, 22.15161422991281], [95.20131167969032, 22.152460949713088], [95.19559667964313, 22.154154300280766], [95.19051635994214, 22.159022850324334], [95.18437800044444, 22.16240963959325], [95.17718087989374, 22.16240963959325], [95.17241916031605, 22.16323772993735], [95.17231259964683, 22.163256270360648], [95.16892572044571, 22.168759859579893], [95.16596904183785, 22.169498945819726], [95.16553884034528, 22.16960649034729], [95.17040748032105, 22.176168390059217], [95.17802759969402, 22.1789201401524], [95.18882292034158, 22.181460209621036], [95.19215148030662, 22.18187628006632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
