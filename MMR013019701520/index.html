
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (45) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (45) Ward</div><div class="name-mm">အမှတ် (၄၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19260631582887, 16.898594282799934], [96.19342483945468, 16.89903792025108], [96.19427154886544, 16.897444624029834], [96.19488117964119, 16.89631580601885], [96.19542307366406, 16.895359816104456], [96.19607221754563, 16.89408515534886], [96.19656330900392, 16.89327498513768], [96.1971616503209, 16.89229737511759], [96.19656613136866, 16.892005711478593], [96.19632693703858, 16.891841616197667], [96.19389915422266, 16.890581130914484], [96.1924896242968, 16.889848710449655], [96.19062979392993, 16.888903181236856], [96.18935966521644, 16.891172409079445], [96.18834877057935, 16.892961502371463], [96.18817075067966, 16.893292109343406], [96.18763160711302, 16.894262314154503], [96.18686561585554, 16.895640373204685], [96.18826103182124, 16.89636039741447], [96.18985939059843, 16.897192001409792], [96.1911411286602, 16.897851943712283], [96.19260631582887, 16.898594282799934]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
