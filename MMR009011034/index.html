
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Se</div><div class="name-mm">သံဆယ်</div></div>
        <span class="pcode-badge">MMR009011034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.29692605209567, 20.415300801590774], [94.31398721563755, 20.413775761841976], [94.32545576067486, 20.4150500454233], [94.36527709785986, 20.41791718123295], [94.39429476059479, 20.422880337257823], [94.39445860178313, 20.42225776178634], [94.39596847176762, 20.41652044776049], [94.3984790425738, 20.406645881802035], [94.4018264577249, 20.39426083586892], [94.40534115756844, 20.385725215646232], [94.41136625914561, 20.37635280683662], [94.41237044214228, 20.374846526945703], [94.4117010821393, 20.370829725711303], [94.41345024912977, 20.368198536932994], [94.41404425583778, 20.36296355092719], [94.41454638420834, 20.360285699925157], [94.41214369337683, 20.357562433159785], [94.39585988402649, 20.36662729991002], [94.38152420317948, 20.367901581692706], [94.36909994590582, 20.361848738728384], [94.36400281517786, 20.369494435719673], [94.36623281009616, 20.38032583896637], [94.36272853159653, 20.387015823721356], [94.3318271749842, 20.38000726941999], [94.32619469402994, 20.38235413573483], [94.30889008490954, 20.389564389085365], [94.30092581837187, 20.405811495304306], [94.29692605209567, 20.415300801590774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
