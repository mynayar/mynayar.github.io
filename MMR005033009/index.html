
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Laung Sauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Laung Sauk</div><div class="name-mm">လောင်ဆောက်</div></div>
        <span class="pcode-badge">MMR005033009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65007621624443, 26.103593849276763], [95.67386424034248, 26.099086680106268], [95.65832520004801, 26.07769772976644], [95.62908924037617, 26.057678220273715], [95.61309803984273, 26.03912354991195], [95.59307844041774, 26.015075639729048], [95.58508283970133, 26.003112749953516], [95.547729600141, 26.019104040419165], [95.5322877603719, 26.029113750199485], [95.53936977489525, 26.036511876422026], [95.55325661669957, 26.038580129169702], [95.56123416442523, 26.044193959083998], [95.5668479934402, 26.048921393807348], [95.57748472314154, 26.053057900201964], [95.58546226996782, 26.05660347736864], [95.59166702911017, 26.059558124407943], [95.59668992889715, 26.06339916483961], [95.60082643529182, 26.067240206170652], [95.60732665859848, 26.07108124660232], [95.6129404894121, 26.076695077415934], [95.61796338919913, 26.081422512139284], [95.62328175404974, 26.084081695014277], [95.62771372370946, 26.08526355436959], [95.63539580727075, 26.09028645415657], [95.64366881916072, 26.098559466046595], [95.65007621624443, 26.103593849276763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
