
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ko Maung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlaingbwe</div><div class="name-mm">လှိုင်းဘွဲ့</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ko Maung</div><div class="name-mm">ကိုမောင်</div></div>
        <span class="pcode-badge">MMR003002032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.67087400043482, 17.252102999653744], [97.67021449430354, 17.243205289892273], [97.6687174612419, 17.236318939967134], [97.66722042907958, 17.228234964671913], [97.66632220960236, 17.22104920975329], [97.66692102318672, 17.21595929968197], [97.66627100040643, 17.210945000111735], [97.66473599976666, 17.210835000434997], [97.64961200019371, 17.209630999770866], [97.6421590000379, 17.209630999770866], [97.63918269642437, 17.208460272223817], [97.63747608085652, 17.207626424420027], [97.63599922768225, 17.210772763752118], [97.63488938333842, 17.216321993565202], [97.63505622016851, 17.218824555009235], [97.635444307309, 17.22464583693585], [97.64016115161593, 17.236299222331297], [97.6412709977584, 17.243235760721802], [97.64016115161593, 17.250727221284308], [97.64280757490974, 17.253057364705683], [97.64303654230264, 17.25325896662804], [97.64566599988603, 17.25286899990448], [97.64851600001344, 17.253088000111177], [97.65169399997819, 17.252978999581217], [97.65388600033873, 17.25363600020131], [97.65596800012315, 17.25374499983195], [97.65947499997134, 17.253416999994613], [97.66221500042201, 17.252760000273838], [97.66429800025259, 17.2524320004365], [97.66813399998415, 17.251774999816462], [97.67087400043482, 17.252102999653744]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
