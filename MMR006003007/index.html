
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yan Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayetchaung</div><div class="name-mm">သရက်ချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yan Taung</div><div class="name-mm">ရန်တောင်</div></div>
        <span class="pcode-badge">MMR006003007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.26531771603982, 13.972950151928046], [98.26146612026531, 13.970542770232726], [98.25757164031899, 13.970313630169926], [98.25344855990318, 13.96802268010265], [98.24909579983137, 13.966189920228658], [98.24359823966711, 13.964586300417466], [98.23810031977399, 13.962524399581412], [98.23237343968253, 13.961378880031361], [98.23145525165859, 13.961019571196289], [98.23118196567526, 13.960959747394497], [98.22914906257921, 13.968649063303701], [98.22808174267834, 13.970331743415272], [98.227403116061, 13.972153116073514], [98.22681682373747, 13.973006357757242], [98.22712309775284, 13.973155171274186], [98.2305406798086, 13.974436889550873], [98.23443480002607, 13.975124129874757], [98.23878720036907, 13.978331460328661], [98.24199443999146, 13.980164220202653], [98.24634684033447, 13.980393360265396], [98.24994534170423, 13.98202917400721], [98.2511575199037, 13.980164310134853], [98.25505164012117, 13.977415349738635], [98.25802992044453, 13.9755826797969], [98.26398575983501, 13.973520959724567], [98.26531771603982, 13.972950151928046]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
