
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Nyaung Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Nyaung Pin</div><div class="name-mm">ရွှေညောင်ပင်</div></div>
        <span class="pcode-badge">MMR007003063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.76014519634379, 16.938631199170572], [96.75715079117612, 16.93620205927766], [96.75704708675369, 16.936461317635747], [96.75636094899863, 16.939891995619178], [96.75464561180559, 16.939548927640942], [96.75293027371322, 16.93714745269284], [96.7477842567381, 16.93337370763055], [96.74263824425964, 16.931658370437503], [96.73783529616207, 16.928570761331628], [96.7348992947667, 16.92933194661208], [96.72857246704575, 16.93097223627973], [96.72430751677854, 16.93613506967779], [96.72205418085582, 16.938862792583848], [96.72205418085582, 16.944351874839185], [96.72050419301416, 16.94587861970257], [96.72507267436447, 16.94892427543499], [96.72790281206517, 16.948385603113138], [96.72833814059277, 16.952711720769344], [96.74269194187968, 16.94984096069186], [96.76014519634379, 16.938631199170572]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
