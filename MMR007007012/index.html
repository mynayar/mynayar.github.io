
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Tan</div><div class="name-mm">သပြေတန်း</div></div>
        <span class="pcode-badge">MMR007007012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56745384761706, 17.843408104700302], [96.56981737477207, 17.8369591544415], [96.57141029714757, 17.830906050673775], [96.57555189280566, 17.822304273623388], [96.57841915182246, 17.816569755589796], [96.57841915182246, 17.810198068785894], [96.57873773665727, 17.805419304357486], [96.57841915182246, 17.79809186484772], [96.57841915182246, 17.79331310041931], [96.57626306318986, 17.786198004334494], [96.57141029714757, 17.786423714382977], [96.56400321097948, 17.787379467088783], [96.55560285778574, 17.791112956697646], [96.55547713526164, 17.791444003438073], [96.55452532698229, 17.793950268290303], [96.55325099034098, 17.799684786323894], [96.55038373132419, 17.8073308097691], [96.54912438458274, 17.810209315707425], [96.54815364107776, 17.8124281599317], [96.54805862410626, 17.81375839033751], [96.54783505624289, 17.81688834132393], [96.54939611923555, 17.817668872820263], [96.55229523673586, 17.819118430671097], [96.55994126108038, 17.819755600340727], [96.56376427280298, 17.82039276821172], [96.56089701378619, 17.825808702309814], [96.55930409231007, 17.831543220343406], [96.55834833870495, 17.836321984771814], [96.5561387682896, 17.842052201348054], [96.56185276739137, 17.843012256410532], [96.56745384761706, 17.843408104700302]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
