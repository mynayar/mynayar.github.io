
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Chaung Pway Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Chaung Pway Su</div><div class="name-mm">ညောင်ချောင်းပွေးစု</div></div>
        <span class="pcode-badge">MMR017014087</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08499871631778, 16.525040677585253], [95.07830148032912, 16.52289570007656], [95.06906460025118, 16.520916330024647], [95.05900260028983, 16.517947229980734], [95.05603368011032, 16.520586390349706], [95.05471391961174, 16.525204919871214], [95.05685844026488, 16.532462609761694], [95.06114712004359, 16.53460694965105], [95.06543579982235, 16.537575959762762], [95.06626020024811, 16.543349100080945], [95.06807496019132, 16.547472810022214], [95.07335292030109, 16.551596519963482], [95.07589140606359, 16.55342525357264], [95.07626566972493, 16.552639300063674], [95.08355980643995, 16.548237668133936], [95.08695535420628, 16.54270418365121], [95.08997361568987, 16.538302548124136], [95.09049219715723, 16.536962882930766], [95.0914827482303, 16.53440396007477], [95.09117627726346, 16.531069517644198], [95.09020073857329, 16.52964949173071], [95.08778110181646, 16.52684438486051], [95.08499871631778, 16.525040677585253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
