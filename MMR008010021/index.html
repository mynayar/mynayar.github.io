
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Ywar</div><div class="name-mm">ရှမ်းရွာ</div></div>
        <span class="pcode-badge">MMR008010021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71664008157455, 18.02756734685562], [95.71107355240258, 18.02844622101634], [95.7034561543781, 18.031961950583593], [95.69812939705412, 18.03222821555977], [95.69945771640056, 18.037429553431195], [95.70064775419058, 18.039477525567406], [95.70275107869941, 18.040888966552586], [95.7044186825762, 18.04141454744348], [95.70443698827643, 18.045973655160083], [95.70543977282733, 18.04868061002219], [95.70618512194591, 18.051214797924615], [95.70588698229847, 18.05374898492778], [95.70463378422181, 18.05791087378782], [95.71556352563624, 18.05621069196991], [95.72224349913824, 18.054027454603386], [95.72278683984086, 18.051636752634067], [95.7235168267402, 18.048424812255348], [95.72479015524152, 18.043331500048737], [95.72786903372901, 18.03826332119536], [95.73070716910064, 18.036466598954405], [95.73187844073749, 18.032205675851287], [95.73278384939522, 18.028584046616515], [95.73246077514472, 18.023465771927874], [95.72601527108793, 18.02727450691299], [95.71664008157455, 18.02756734685562]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
