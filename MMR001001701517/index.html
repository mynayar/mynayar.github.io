
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Myint Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myay Myint Ward</div><div class="name-mm">မြေမြင့်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.38506672205165, 25.39024493565529], [97.38450718276033, 25.3889894658912], [97.38336701687439, 25.386856473647413], [97.38300847426171, 25.386244263761796], [97.38254371272222, 25.383649627028717], [97.38239671043988, 25.383147537329023], [97.38006820558326, 25.383958302233907], [97.37972927988244, 25.382898446706008], [97.37530876758564, 25.384185727289548], [97.37441888572306, 25.384658861517323], [97.37409868660518, 25.38487892831995], [97.37382681435605, 25.385162450386815], [97.37365498988595, 25.385415832574665], [97.37340204117135, 25.385957890844054], [97.37349736930821, 25.385990924741407], [97.37395526902048, 25.386122793232346], [97.37410854587273, 25.386237785945127], [97.37415426021101, 25.38632362443576], [97.37441958179829, 25.38654874992494], [97.37530697523675, 25.387258943645406], [97.37624456433525, 25.38782579892154], [97.37675548807539, 25.38825984771387], [97.37730674730858, 25.38864854549405], [97.37890495230175, 25.389574938033036], [97.37938002097127, 25.389764426986744], [97.37983178460922, 25.389997643676338], [97.38081598467, 25.390656800870715], [97.38119245436832, 25.39093374259818], [97.3815930879507, 25.39065832791954], [97.38162808416882, 25.3908624830172], [97.38175178141961, 25.391633383673764], [97.38211480625336, 25.391369399378334], [97.382695645088, 25.3910616864477], [97.38357766058061, 25.39073615884672], [97.38506672205165, 25.39024493565529]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
