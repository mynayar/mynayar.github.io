
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Thar</div><div class="name-mm">မြို့သာ</div></div>
        <span class="pcode-badge">MMR009020007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89574985727018, 21.56320214856038], [94.90008017206236, 21.566487216411986], [94.90822024706682, 21.56670142772873], [94.91100842779679, 21.570264104604803], [94.93585365801994, 21.55969166743654], [94.93585365801994, 21.557061866312154], [94.9364962946683, 21.5527776165938], [94.93671050778374, 21.54485175380546], [94.93692471999987, 21.53714010503188], [94.93588664155533, 21.530081170709536], [94.93585365801994, 21.530071092906667], [94.91530954789738, 21.526002952074634], [94.91421819631279, 21.525786843188314], [94.90886288371519, 21.53328427974577], [94.90736339730302, 21.53692589191644], [94.90479284711228, 21.541852780081797], [94.89750962187162, 21.544209117157095], [94.89751234501875, 21.54424724031793], [94.89793804720318, 21.55020706730238], [94.89772383498706, 21.553634467256927], [94.89601013456013, 21.557276079427595], [94.89601013456013, 21.56070347938214], [94.89574985727018, 21.56320214856038]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
