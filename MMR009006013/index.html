
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Thar</div><div class="name-mm">စည်သာ</div></div>
        <span class="pcode-badge">MMR009006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41696829784871, 20.43649107999937], [95.41653537500758, 20.42436924404541], [95.41686228037003, 20.41325448600577], [95.41702983036242, 20.40755777816895], [95.42939120164272, 20.406568868358647], [95.43631357031506, 20.402118773762425], [95.42593001775617, 20.39717422471074], [95.42472919889349, 20.393571768122627], [95.41900764908382, 20.394207496179035], [95.40537462383986, 20.39539297710428], [95.39626272524464, 20.396185315799755], [95.38587917178643, 20.39667977025522], [95.37450689197954, 20.399887336331574], [95.36659543183379, 20.402118773762425], [95.36615042210434, 20.402044605773995], [95.36481539381543, 20.40182210090927], [95.36066197297174, 20.40112986395212], [95.35472851500901, 20.40854668797931], [95.35324514984387, 20.41695242091754], [95.35594072738274, 20.427734726576432], [95.35670633373036, 20.42684151812159], [95.39527381543428, 20.430797157362974], [95.39527381543428, 20.43722507068054], [95.41109637060106, 20.43722507068054], [95.41696829784871, 20.43649107999937]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
