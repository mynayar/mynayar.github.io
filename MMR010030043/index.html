
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Aing</div><div class="name-mm">ညောင်အိုင်</div></div>
        <span class="pcode-badge">MMR010030043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.94522230116831, 20.882466185765907], [95.9430549143529, 20.88771028100473], [95.94224749942259, 20.89859952324946], [95.93895294102549, 20.904703417129042], [95.93162853942562, 20.907340161019647], [95.9307439662611, 20.91073088392318], [95.9332825662375, 20.910038538148058], [95.93758029229673, 20.90970794286733], [95.93987177296401, 20.909198325842112], [95.94010644835396, 20.9087391212135], [95.94193657321432, 20.9087391212135], [95.95043252434158, 20.9087391212135], [95.95074718813231, 20.914403088331937], [95.95074718813231, 20.916920405852125], [95.95483783090123, 20.916920405852125], [95.97371772039656, 20.920067054550998], [95.97623503881607, 20.915032417711984], [95.97529104384665, 20.905592473413947], [95.97418587957475, 20.903382143970816], [95.97277372632647, 20.900557835675613], [95.96679509361871, 20.900557835675613], [95.96113112739965, 20.902760490304445], [95.95609648966132, 20.904333813754533], [95.95294984186177, 20.90213116002508], [95.95294984186177, 20.896467192906698], [95.95294984186177, 20.892691214827778], [95.95169118310167, 20.886397919228614], [95.94571255129324, 20.882621941149694], [95.94522230116831, 20.882466185765907]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
