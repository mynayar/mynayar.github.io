
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (5) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyinegyun</div><div class="name-mm">မော်လမြိုင်ကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (5) Ward</div><div class="name-mm">အမှတ် (၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017018701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27058804510227, 16.376651656848537], [95.27074779257663, 16.376194428030487], [95.27055945025847, 16.37616910222232], [95.26960843518123, 16.376071254185092], [95.26837441065061, 16.375785048541218], [95.2678899800386, 16.37571410821954], [95.26784408583597, 16.375873111954604], [95.26735965522397, 16.375892681202345], [95.2673279802022, 16.37618141304182], [95.26600266728934, 16.37602760828753], [95.2647358282959, 16.375991678573143], [95.26471185686677, 16.376242488699916], [95.26313235597348, 16.37613852527278], [95.26314127994618, 16.37668035781229], [95.26371221274849, 16.376709006615386], [95.26381593156003, 16.376711103834452], [95.26414186565461, 16.37672346321733], [95.26448731683627, 16.3767361661412], [95.2645721256032, 16.376747931971522], [95.26464574230721, 16.37682633576685], [95.2646467126757, 16.376918684449777], [95.2645960106974, 16.37698770292019], [95.26447346547809, 16.377689411537176], [95.26592293429604, 16.37771876540876], [95.26708046968798, 16.37772365772065], [95.26718245550597, 16.37776891250536], [95.26815641678525, 16.377903451982775], [95.2689417047959, 16.378024537602357], [95.27025865401373, 16.37818571230082], [95.27043466842525, 16.377603655784128], [95.27058804510227, 16.376651656848537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
