
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koe Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koe Pin</div><div class="name-mm">ကိုးပင်</div></div>
        <span class="pcode-badge">MMR005003004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30599859975564, 21.721186799731072], [95.3046716401841, 21.7207002602089], [95.30075448023513, 21.716888939672856], [95.2966997968582, 21.715560633816267], [95.29696799987335, 21.71582882963685], [95.29645355978403, 21.71788641012978], [95.29593911969465, 21.719772450338382], [95.29662492020395, 21.720972690037684], [95.29662492020395, 21.72320163005122], [95.29645355978403, 21.724573320102706], [95.29525332008473, 21.726802350048445], [95.29319592035552, 21.73057442956633], [95.2919956797569, 21.733832159826363], [95.2907954400576, 21.737432879823587], [95.29233839969743, 21.73846158013788], [95.29439580032596, 21.739490370384317], [95.29645355978403, 21.7401762599265], [95.29868231993316, 21.7413764096936], [95.30125452037987, 21.7413764096936], [95.30421048042939, 21.740492699878246], [95.30581068011884, 21.73134816038936], [95.30581068011884, 21.72334661965084], [95.30599859975564, 21.721186799731072]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
