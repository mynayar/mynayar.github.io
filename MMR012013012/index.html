
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Gyi</div><div class="name-mm">ရွာကြီး</div></div>
        <span class="pcode-badge">MMR012013012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.83564353092424, 19.13859670667273], [93.83564282585581, 19.138456568016238], [93.83563648563535, 19.137196101618827], [93.8356181430629, 19.133550114246418], [93.83559276329544, 19.12850351822283], [93.83816731816728, 19.12121130335902], [93.84013408691862, 19.11723634757942], [93.84161368032716, 19.11424600105215], [93.83715705665293, 19.115916789428354], [93.83223130523061, 19.117763454619762], [93.82803870632131, 19.114803971026504], [93.82696384380642, 19.108686539652126], [93.8225586730444, 19.108482991596816], [93.81390575874383, 19.108082861634784], [93.81241726924162, 19.108527419904533], [93.80539586632625, 19.11062426389873], [93.80434581340864, 19.110937819724654], [93.80105685508983, 19.11475791134859], [93.79850220131561, 19.1265171919149], [93.80301330861738, 19.126259283439254], [93.80476762422654, 19.126158955971107], [93.81243700036731, 19.12811084723785], [93.81736897240023, 19.129227978788265], [93.81888548837463, 19.129571452360665], [93.82369542240588, 19.134100299689123], [93.82465744068838, 19.135006052787162], [93.82902708013569, 19.138461193229546], [93.83560544823291, 19.138595926960534], [93.83564353092424, 19.13859670667273]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
