
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tin Ngoke Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tin Ngoke Pyin</div><div class="name-mm">တင်ငုတ်ပြင်</div></div>
        <span class="pcode-badge">MMR009021064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73465374877156, 21.498419790740797], [94.73566486733984, 21.494664354076747], [94.73683678289126, 21.474915179891696], [94.73466141908926, 21.46018692698516], [94.73482888184748, 21.455668042346304], [94.73315539640447, 21.450647030236325], [94.7291387921216, 21.447801750650342], [94.72945540923979, 21.44526918062826], [94.72061012815493, 21.449152475706228], [94.70587211220828, 21.451335884843274], [94.6982301779804, 21.449698328215334], [94.68785898210638, 21.43332275474137], [94.683128260361, 21.430619485301065], [94.6834921620337, 21.432231049723214], [94.67857949035124, 21.442056393987457], [94.67857949035124, 21.451335884843274], [94.6725751127513, 21.46279878663472], [94.66981063455319, 21.463351681734764], [94.6692999985961, 21.466619754198348], [94.66820829357795, 21.488453850964504], [94.66875414608705, 21.501008457774162], [94.67639608031493, 21.511379653648135], [94.6801885987249, 21.518824228055735], [94.6944092113161, 21.52065914630259], [94.71515160396342, 21.5244801129669], [94.7218144903465, 21.52590787394928], [94.72311238113156, 21.522446895108146], [94.72980695602627, 21.511735587327564], [94.7333216639637, 21.503367347125447], [94.73465374877156, 21.498419790740797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
