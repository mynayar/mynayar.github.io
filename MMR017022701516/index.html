
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (16) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (16) Ward</div><div class="name-mm">အမှတ် (၁၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701516</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58693304462435, 17.272285491482307], [95.5854759009921, 17.27137498186994], [95.5841333157, 17.270421981089612], [95.58344766447817, 17.271431385550045], [95.58314850679818, 17.272638978106386], [95.58302272491886, 17.27352843728761], [95.58342386751752, 17.273843317814908], [95.58451149411025, 17.27489723961594], [95.58497064747746, 17.274515276858608], [95.5849821579003, 17.274403236620117], [95.58522901101009, 17.274158197442887], [95.58542618287208, 17.27376865519932], [95.58576613469944, 17.273466759083703], [95.58569559457607, 17.273319869216664], [95.58577038399608, 17.27318677494975], [95.58603894584076, 17.272914094210137], [95.58607549069143, 17.272882443470053], [95.58620127257075, 17.272895428781055], [95.58627861156873, 17.272914905398636], [95.58635850014474, 17.272897052057374], [95.58640079526054, 17.27287464904589], [95.58642139153403, 17.272799665372304], [95.58648938207938, 17.272723379480453], [95.58658796756072, 17.272713640721975], [95.58663762722477, 17.272691994040315], [95.58666785613673, 17.272617878212543], [95.58668485422271, 17.27251399932169], [95.58679703745338, 17.272470175358364], [95.58685274325956, 17.272399592067586], [95.58693304462435, 17.272285491482307]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
