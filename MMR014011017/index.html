
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pinlon (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Loilen</div><div class="name-mm">လွိုင်လင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pinlon (East)</div><div class="name-mm">ပင်လုံ (အရှေ့)</div></div>
        <span class="pcode-badge">MMR014011017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.6211581647176, 20.976230532013517], [97.60184577416322, 20.976230532013517], [97.56239947765386, 20.974207644667104], [97.54257973186918, 20.961144630420392], [97.54181242130625, 20.962190963742046], [97.54115916456385, 20.963081767409676], [97.53509050432336, 20.972184758220067], [97.53497394858891, 20.976147647795756], [97.53489434869527, 20.97885404327951], [97.53741690206846, 20.978949231122158], [97.53874939966511, 20.979187178245752], [97.54027225496066, 20.980234140193488], [97.54117645043289, 20.982090119663326], [97.54117645043289, 20.984184046256757], [97.5406529685597, 20.986373149901], [97.54046261176018, 20.988133951420764], [97.54034653626371, 20.99016056106109], [97.54239096866831, 20.991693886263874], [97.54391001713367, 20.992833171713528], [97.54390093308166, 21.00405254518887], [97.54268740769777, 21.015259805695507], [97.54268740769777, 21.023825866170853], [97.54215343073628, 21.03281364933048], [97.56996950119157, 21.017835765308348], [97.57475371910891, 21.015388024737604], [97.60063850086618, 21.002144648756598], [97.62335972307284, 20.991494075791024], [97.62252473492862, 20.985705053445486], [97.62202294560251, 20.982226115143135], [97.6211581647176, 20.976230532013517]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
