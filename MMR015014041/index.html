
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Maw Swe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Maw Swe</div><div class="name-mm">နမ့်မော်ဆွေ</div></div>
        <span class="pcode-badge">MMR015014041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.46452589785196, 22.128915005123417], [97.45815000671752, 22.131916070670172], [97.44348545818741, 22.134950115255663], [97.42730388736459, 22.136972811945782], [97.40859394455498, 22.145569272204227], [97.37066838723632, 22.16731325780063], [97.3623488129474, 22.17244578494507], [97.36712866825349, 22.18248348072808], [97.37724214990533, 22.193102637676645], [97.39241237283278, 22.205238816018607], [97.40758259665955, 22.212823928381624], [97.4131450123325, 22.221926062138095], [97.41462313624879, 22.22340418605438], [97.41692657520133, 22.2257076241076], [97.42528118977515, 22.22445443232624], [97.43994573920457, 22.227994151309076], [97.44512500501503, 22.23013729510012], [97.45107056965111, 22.22546578022161], [97.46927483716405, 22.203216120227808], [97.4768599486278, 22.197653704554853], [97.49304152034995, 22.197653704554853], [97.51176704301469, 22.18630555086054], [97.51295096901208, 22.169335955390068], [97.51326848455295, 22.16478488761254], [97.50568337308925, 22.15568275385607], [97.49658123933278, 22.14759196799497], [97.4824223643007, 22.145569272204227], [97.47837697092052, 22.140006855631952], [97.46826348926868, 22.13545578875369], [97.46452589785196, 22.128915005123417]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
