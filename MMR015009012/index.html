
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Han</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Han</div><div class="name-mm">မန်းဟန်</div></div>
        <span class="pcode-badge">MMR015009012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.93152485079128, 23.9468902458882], [97.9318821100714, 23.945675564875444], [97.94016259173026, 23.93738406742085], [97.94660960215145, 23.93325136785637], [97.95193959433686, 23.92811173157122], [97.95593708892557, 23.919736028794716], [97.95734830867758, 23.917094322445053], [97.9592581629339, 23.913519205247155], [97.96183815240886, 23.903365336840864], [97.96412243490249, 23.900509983948666], [97.96811992859188, 23.894989634963736], [97.965264576599, 23.88851750018256], [97.96012494031379, 23.88337786479667], [97.95561197321405, 23.87978963458403], [97.95579535307314, 23.87943252639002], [97.95501906457821, 23.878929847634424], [97.93532284697187, 23.866175739718642], [97.93349994456685, 23.864995334567084], [97.91233672855725, 23.851291285364596], [97.90352611184068, 23.856955253382296], [97.90370552209225, 23.857349277846936], [97.90366596810998, 23.857363649912543], [97.90374189067575, 23.857420464582844], [97.90932785239852, 23.868354263738354], [97.91017212244554, 23.86791136831505], [97.91647827475265, 23.879472647844466], [97.91731050557541, 23.88099840255427], [97.9225759776993, 23.897453005751686], [97.92302121135987, 23.898844361278293], [97.9213139455822, 23.9001988670841], [97.90808716029426, 23.910692695411626], [97.90878182362235, 23.912821989643135], [97.91682803368684, 23.937485375150004], [97.91726888315247, 23.938836672174716], [97.93152485079128, 23.9468902458882]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
