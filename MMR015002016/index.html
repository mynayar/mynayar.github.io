
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Aing</div><div class="name-mm">ကောင်းအိုင်</div></div>
        <span class="pcode-badge">MMR015002016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.81020456388956, 23.247507756877553], [97.81017345813865, 23.247678835809666], [97.80693280420559, 23.25334998131666], [97.80280456977516, 23.252182045265215], [97.79011370578297, 23.24890698417005], [97.78253519174575, 23.25409228263277], [97.78338234232132, 23.256210157273017], [97.78509555441639, 23.26154014855905], [97.78852197770715, 23.26706049934262], [97.79290018589495, 23.271057993931322], [97.7972783940827, 23.273722990023998], [97.79551759256293, 23.278457107609484], [97.79472655608578, 23.282570503226168], [97.79432786234105, 23.284643706741747], [97.79837294635445, 23.288688790755145], [97.80693900593042, 23.289878520977027], [97.8145532824081, 23.294399497438917], [97.82454701843022, 23.296303065434188], [97.83715816112027, 23.29820663432878], [97.84066826992478, 23.29881415335052], [97.84292407538584, 23.291482784702794], [97.8412865439389, 23.283704514152078], [97.83346543957845, 23.27858034260879], [97.8310537870027, 23.27171640468839], [97.82800807731098, 23.265815341205098], [97.82210701382769, 23.256487854430986], [97.8173480920409, 23.2517289326442], [97.81020456388956, 23.247507756877553]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
