
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Hne Boke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Hne Boke</div><div class="name-mm">အုန်းနှဲဘုတ်</div></div>
        <span class="pcode-badge">MMR005006022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70430440032789, 22.462939979996122], [95.70346272032833, 22.46284647028841], [95.69588544016102, 22.464951300262328], [95.69251764007709, 22.466214089608627], [95.68662444026575, 22.466214089608627], [95.68536156008798, 22.467056040304044], [95.68283579973246, 22.46873984996415], [95.68215360010862, 22.4696777403355], [95.67946799964852, 22.47337044029365], [95.6786089132708, 22.476807017829685], [95.68092375382821, 22.480190247581902], [95.68302689577467, 22.484133638956337], [95.68434136106504, 22.488077030330714], [95.69045433629861, 22.489511306901363], [95.69725569759242, 22.489545534199067], [95.69643443040468, 22.483344961400917], [95.69906336008609, 22.483082067983105], [95.70652556570235, 22.483270240329375], [95.70855124904097, 22.483280298347154], [95.7103959600056, 22.483289969656425], [95.71146084004579, 22.48094762962944], [95.71651235985757, 22.477580010309282], [95.71651235985757, 22.474212300157603], [95.706409320234, 22.47210756011583], [95.70430440032789, 22.467897990100198], [95.70430440032789, 22.462939979996122]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
