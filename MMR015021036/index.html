
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Yawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Yawng</div><div class="name-mm">ပန်ရောင်း</div></div>
        <span class="pcode-badge">MMR015021036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.73505771893866, 23.125542469909135], [98.73776539595633, 23.13474857069002], [98.7399161210322, 23.140996185225845], [98.74214071372302, 23.138030060139215], [98.74679486988737, 23.14063216394328], [98.75882161602482, 23.142131921051373], [98.77112719876129, 23.14650723881806], [98.78042475070174, 23.14896835590497], [98.7889019302799, 23.14787452578878], [98.79373134272737, 23.144974452309157], [98.79190996197525, 23.141858463297467], [98.78698772780143, 23.133107826864773], [98.78698772780143, 23.128732508198766], [98.78425315386005, 23.123810274924324], [98.77659634664417, 23.11779421243301], [98.77468214506501, 23.11287197915857], [98.77463271113078, 23.10899767190506], [98.7708537419067, 23.11150469218785], [98.75389938275038, 23.118341127041447], [98.74296108698462, 23.119708414012166], [98.73776539595633, 23.123810274924324], [98.73505771893866, 23.125542469909135]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
