
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Ma Nar Haung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Ma Nar Haung</div><div class="name-mm">ပျဉ်းမနားဟောင်း</div></div>
        <span class="pcode-badge">MMR018006014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17476460640154, 19.699409712288457], [96.17428871395305, 19.70250301140493], [96.17453557875399, 19.703561004436835], [96.17486459932184, 19.70497109194241], [96.17492797994237, 19.70524272317317], [96.17681005414073, 19.705167440025377], [96.17816342590146, 19.705114016698587], [96.17850176974093, 19.705024979319376], [96.17880449683014, 19.704722251330907], [96.1791784556213, 19.704366100914854], [96.18026960216048, 19.703363039372846], [96.17863219571933, 19.703514094000298], [96.17838158614137, 19.697624758575785], [96.17835687367085, 19.697044024062507], [96.1756036531861, 19.690298632076235], [96.17051019439003, 19.684516867259674], [96.16307649638327, 19.673228659674976], [96.15659167396666, 19.669199151020052], [96.1563061590021, 19.669993148964693], [96.15548175857634, 19.67228616837201], [96.15756779541749, 19.673581017649894], [96.16084475857883, 19.675615101555763], [96.16584162658984, 19.685727811589288], [96.17238514505846, 19.691557491385197], [96.17416974084091, 19.69786306273022], [96.17418499064485, 19.69790271204056], [96.17437579710543, 19.69839880955749], [96.17476460640154, 19.699409712288457]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
