
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Aye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Aye</div><div class="name-mm">ရေအေး</div></div>
        <span class="pcode-badge">MMR018003031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1542596545595, 20.11131460218718], [96.15304981100002, 20.110958764735244], [96.14650901298063, 20.107844098626288], [96.14059114836289, 20.105975300219995], [96.13809941475625, 20.100368901403726], [96.13778794895472, 20.0922707698802], [96.13903381485875, 20.085729971860758], [96.141525547566, 20.081369439847833], [96.141525547566, 20.07751204614408], [96.14059114836289, 20.077631841236553], [96.13654208215144, 20.074517175127596], [96.12968981833052, 20.066419043604014], [96.12501781871742, 20.060812644787802], [96.1206572867045, 20.059255313082303], [96.11723115389469, 20.05525815843731], [96.11723115389469, 20.066730511204184], [96.11847702069798, 20.102237700709395], [96.1162967537922, 20.105975300219995], [96.1147394220867, 20.109712898831276], [96.12674933471408, 20.111279700397915], [96.13861498709201, 20.111279700397915], [96.14454781283138, 20.114839395122033], [96.14994444028378, 20.119722058226444], [96.1511810116944, 20.118433962857125], [96.1542596545595, 20.11131460218718]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
