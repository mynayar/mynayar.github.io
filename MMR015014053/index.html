
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Pang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Pang</div><div class="name-mm">မန်ပန်း</div></div>
        <span class="pcode-badge">MMR015014053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.78923694143174, 22.26033273426833], [97.78350034326627, 22.268698604756878], [97.76611912359874, 22.291149346864927], [97.76770792707924, 22.29577131899123], [97.77447610518817, 22.299719422813155], [97.7840643575841, 22.30197548278238], [97.7942166260965, 22.304795557069326], [97.80606093756228, 22.31325577993033], [97.8117010870356, 22.32284403322558], [97.8286344524181, 22.34715860858296], [97.84038462105349, 22.342724684696464], [97.85378834435664, 22.336132773708584], [97.85780709082462, 22.332505505724555], [97.84441394894463, 22.304795557069326], [97.84384993372754, 22.28561905137815], [97.85343818702279, 22.268698604756878], [97.85424082295566, 22.266436629946554], [97.85854269039288, 22.254313186904085], [97.85061811183647, 22.255162249438285], [97.8376457708357, 22.25911035326027], [97.80549692324445, 22.260238381895874], [97.79353512434659, 22.254064551338047], [97.78923694143174, 22.26033273426833]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
