
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aik Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghpyak</div><div class="name-mm">မိုင်းဖြတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aik Ngu</div><div class="name-mm">အိုက်ငု</div></div>
        <span class="pcode-badge">MMR016010011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.02900061238842, 20.834141793708852], [100.01128948092486, 20.821939695060905], [99.99676379221529, 20.8114526251386], [99.99317805582268, 20.807866574882553], [99.98535459343981, 20.801672452022103], [99.97687913876132, 20.796456308611823], [99.9690556134259, 20.792870169322896], [99.95992799558059, 20.79580395478871], [99.94489871800147, 20.80492642221668], [99.93580492096038, 20.80590938121304], [99.92993720523788, 20.806235254153705], [99.92341746664283, 20.808843097431065], [99.92086602524694, 20.810665614926222], [99.91657168963184, 20.813732917340303], [99.91135590235308, 20.815688791704417], [99.90831793312617, 20.822416874439227], [99.91294777971632, 20.828369533826958], [99.91674158415685, 20.83546229794672], [99.92055395689965, 20.842589777696162], [99.9278294308836, 20.848542438882475], [99.93378209117066, 20.855156505568345], [99.94039615785647, 20.860447758557257], [99.94899444463795, 20.86309338595106], [99.94923507803651, 20.863288183602833], [99.95593921542252, 20.868715343038673], [99.9742381338828, 20.873234955229066], [99.98834814425152, 20.87962855401463], [99.99280148090367, 20.88216234891331], [100.00945671475563, 20.866941593080128], [100.02162805569026, 20.856230813201535], [100.02900061238842, 20.834141793708852]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
