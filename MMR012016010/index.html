
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Lone Maw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Toungup</div><div class="name-mm">တောင်ကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Lone Maw</div><div class="name-mm">ငလုံးမော်</div></div>
        <span class="pcode-badge">MMR012016010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.17812012844121, 18.94960939475783], [94.17663048241087, 18.951121527436612], [94.17236699444129, 18.953249619274573], [94.16427515997071, 18.956352508761313], [94.1646295144406, 18.960231491590093], [94.1648198703408, 18.965878746606904], [94.16285284977926, 18.973556473852227], [94.1594898781554, 18.978823014370676], [94.15447496165024, 18.981869564928502], [94.15497894891939, 18.983213384090448], [94.1563590359408, 18.985830791657747], [94.15821501541069, 18.987591592278193], [94.16130831542648, 18.987877127927163], [94.16568652361423, 18.98578320223305], [94.1715875861982, 18.981404994045306], [94.17805972008006, 18.975884644161056], [94.18181926844454, 18.975170806387666], [94.18883426189171, 18.974024121316177], [94.1897175031603, 18.96946971615455], [94.19003266517541, 18.967844539593898], [94.19009055903211, 18.95655092168772], [94.18934274487185, 18.953272798400974], [94.18753100934867, 18.95078938981851], [94.18502468064457, 18.947653815371325], [94.18183769375463, 18.94583571264809], [94.18157015084182, 18.94610729531547], [94.17812012844121, 18.94960939475783]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
