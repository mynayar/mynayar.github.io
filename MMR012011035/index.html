
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hmyaw Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hmyaw Chaung</div><div class="name-mm">မျှောချောင်း</div></div>
        <span class="pcode-badge">MMR012011035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.71670377735751, 19.241043634056496], [93.72137648473705, 19.23820545911468], [93.72482352138849, 19.23523387604257], [93.72589329104261, 19.233569789414275], [93.729578055383, 19.232262292071198], [93.73480804205758, 19.23178683939119], [93.74110779928554, 19.23190570188666], [93.74119881517322, 19.231951210280158], [93.74200667706657, 19.23088091002603], [93.7406138601416, 19.23088654877523], [93.73704394282379, 19.22854891040396], [93.73616159278333, 19.227717828015386], [93.73327161958963, 19.226128343748144], [93.73033762727971, 19.221727353034964], [93.729522629266, 19.21667436463025], [93.72893706809128, 19.215556476750066], [93.72243458478829, 19.21434781759774], [93.72227812973193, 19.214384926323362], [93.72060623339104, 19.21478148237958], [93.71424146776957, 19.216290977346773], [93.7142668709194, 19.222171013781292], [93.71242760804773, 19.22629426956496], [93.71414705604184, 19.23025666091621], [93.71602899803986, 19.23598243394224], [93.71670377735751, 19.241043634056496]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
