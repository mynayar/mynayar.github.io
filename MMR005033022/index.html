
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Shey Kauk Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Shey Kauk Taung</div><div class="name-mm">အရှေ့ကောက်တောင်း</div></div>
        <span class="pcode-badge">MMR005033022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45092776040786, 25.661682090056445], [95.45690916032953, 25.67272949966673], [95.46789563997186, 25.68670650030481], [95.47589123978895, 25.712707499651458], [95.48791487966804, 25.726684590221737], [95.53088376037732, 25.74871829960989], [95.5408093196944, 25.760217239933752], [95.54089356008978, 25.76031498005233], [95.54357628002134, 25.759165230091355], [95.543517959886, 25.75909421962257], [95.55029280017266, 25.75628658026153], [95.58508283970133, 25.736328089769586], [95.61969000029336, 25.721679690365477], [95.65832520004801, 25.709716799690625], [95.71832280035699, 25.697692890014935], [95.74768079982908, 25.684326180109167], [95.75035847995991, 25.68286304969007], [95.73028560020038, 25.673706089664336], [95.68511963975965, 25.66308591018668], [95.63311764016703, 25.657714800098006], [95.57171639959222, 25.657714800098006], [95.53570559963379, 25.664306669717064], [95.51031480018793, 25.669677689873538], [95.47167960043328, 25.661682090056445], [95.45092776040786, 25.661682090056445]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
