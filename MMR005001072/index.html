
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Thar</div><div class="name-mm">အောင်သာ</div></div>
        <span class="pcode-badge">MMR005001072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8807738796109, 21.998539619907604], [95.88028319961, 21.99412340996747], [95.87836439979725, 21.98699630973198], [95.87452680017174, 21.983980950360603], [95.86712555959696, 21.982336200055613], [95.85369360027948, 21.982062059716327], [95.85095219958441, 21.980417400242857], [95.85095219958441, 21.974934960380153], [95.85095219958441, 21.96780777021246], [95.84875944019609, 21.961228859824075], [95.8440992396882, 21.954924089774977], [95.8388551201677, 21.94902459021273], [95.83477920019999, 21.953553479809273], [95.83258608018349, 21.95931006001132], [95.83160580026754, 21.959205029988198], [95.83203780040424, 21.966985440026065], [95.83286040038723, 21.977676180311505], [95.83724627979205, 21.982610340394956], [95.8440992396882, 21.985077419986965], [95.84985564002585, 21.99384935956033], [95.8567089596508, 21.999605849830175], [95.86548072025909, 22.001250600135165], [95.86803672031846, 22.002848100059794], [95.86904436030903, 22.002072930321503], [95.8769938797638, 22.00152473957513], [95.8790577600077, 22.00019795986799], [95.88014856030787, 21.99919806034228], [95.8807738796109, 21.998539619907604]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
