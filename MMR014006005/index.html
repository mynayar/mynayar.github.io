
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Su</div><div class="name-mm">ကျောက်စု</div></div>
        <span class="pcode-badge">MMR014006005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71858670980885, 20.961917558148855], [96.71827602012229, 20.961063158138302], [96.70728064438629, 20.94059954093609], [96.70699129201455, 20.94006102509627], [96.6994681393432, 20.939434096006778], [96.68190561095525, 20.937451230290094], [96.68280709587083, 20.946985571027312], [96.68135678169017, 20.94779130062807], [96.67922159689925, 20.948073307337324], [96.67728784585745, 20.947751014597713], [96.67438721839545, 20.947146716947486], [96.6732994820855, 20.946945284996957], [96.67168802198466, 20.947549581747865], [96.67116429819384, 20.948194166327767], [96.6697889128281, 20.94926692712704], [96.68254104673196, 20.967332451731295], [96.68777388515673, 20.975522979601863], [96.68818341123551, 20.975795997587284], [96.68924436933224, 20.976519378066882], [96.71012593836144, 20.96607859265299], [96.71858670980885, 20.961917558148855]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
