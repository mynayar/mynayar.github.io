
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hai</div><div class="name-mm">နမ့်ဟိုင်း</div></div>
        <span class="pcode-badge">MMR015019001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.53157513178695, 23.276299119608723], [97.52978877782988, 23.275219764080873], [97.52041379695925, 23.268187899352142], [97.5051793345587, 23.26144889255238], [97.4937535450901, 23.254123997224724], [97.49326389301433, 23.253772694154577], [97.48249831384618, 23.24604886586252], [97.4765218530012, 23.272942939664972], [97.4710036965634, 23.283289482423697], [97.45996738638581, 23.306741643911778], [97.44755153507532, 23.34260965671035], [97.44405474433103, 23.344460898551688], [97.45375946073057, 23.349507350683723], [97.47438491992818, 23.349196278785314], [97.49445585985012, 23.339160808824317], [97.51413072665179, 23.32762726618546], [97.51307963501722, 23.30950072168099], [97.51514894356893, 23.29846440970482], [97.51583871278643, 23.289497407179624], [97.53157513178695, 23.276299119608723]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
