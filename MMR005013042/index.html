
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Chan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Chan</div><div class="name-mm">ကွမ်းခြံ</div></div>
        <span class="pcode-badge">MMR005013042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06781287976065, 22.26701294968791], [95.07491495995748, 22.26701294968791], [95.08296527992377, 22.266589229609338], [95.0833770462138, 22.26630615090818], [95.08237203224354, 22.265910236068578], [95.07658838874323, 22.262229735413996], [95.07317078240573, 22.260652376705877], [95.07054185632165, 22.256446092813007], [95.0670939149523, 22.249058937420102], [95.06613345069826, 22.248147952965724], [95.06419559964729, 22.247678790144107], [95.06363685985326, 22.247146779100603], [95.0632374142753, 22.24676689467651], [95.05791288007543, 22.245817140448708], [95.05646691771415, 22.24490163330381], [95.04920015995947, 22.243932719919144], [95.04425257119925, 22.250136666074354], [95.03952050316872, 22.254605844284356], [95.03846738626095, 22.258046022705855], [95.04150876032111, 22.260514769640963], [95.05161144021588, 22.26362327989051], [95.06008548026074, 22.26447072004777], [95.06771208014845, 22.26701294968791], [95.06781287976065, 22.26701294968791]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
