
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Poke Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Poke Pin</div><div class="name-mm">သစ်ပုတ်ပင်</div></div>
        <span class="pcode-badge">MMR018007039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95137253801227, 19.535200588836176], [95.94327031277476, 19.534660439827462], [95.92382497274434, 19.533580143608788], [95.91032126461471, 19.535740736945513], [95.90113874405785, 19.531419551171382], [95.8892554811556, 19.52979910594405], [95.87899266258137, 19.5254779192706], [95.8795328106907, 19.535740736945513], [95.88223355213677, 19.55356563174854], [95.88223355213677, 19.57355111988835], [95.88007295880004, 19.584354085672544], [95.8762919211353, 19.607040316157736], [95.8762919211353, 19.626485655288832], [95.87641657076819, 19.62972654484423], [95.88331384925482, 19.62972654484423], [95.89519711215706, 19.625945507179438], [95.90275918928523, 19.626485655288832], [95.91896363796155, 19.623244764834055], [95.93570823564664, 19.617303133832593], [95.94435060989281, 19.61460239238653], [95.94759149944821, 19.60974105670448], [95.94867179566688, 19.60055853614756], [95.94975209278493, 19.591376013792058], [95.94975209278493, 19.584354085672544], [95.94975209278493, 19.581563320291025], [95.94975209278493, 19.57517156511568], [95.94921194377622, 19.563828450322774], [95.94705135133887, 19.55194518742053], [95.94759149944821, 19.544923259301015], [95.95137253801227, 19.540061923618907], [95.95137253801227, 19.535200588836176]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
