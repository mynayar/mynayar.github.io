
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Din</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Din</div><div class="name-mm">မဲဒင်</div></div>
        <span class="pcode-badge">MMR005017036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8206710804061, 22.449743099864236], [94.81363236014539, 22.443486570348966], [94.81043124040946, 22.44268628974055], [94.80562992008481, 22.450688729801072], [94.80122855975031, 22.4590913097162], [94.79722716030528, 22.469094449948955], [94.79442636028836, 22.481498250344032], [94.79522663999751, 22.486299749633815], [94.79722716030528, 22.49510238037061], [94.79722716030528, 22.502704769609466], [94.79122523965316, 22.510707209670045], [94.78842443963623, 22.5207102599706], [94.78322279959258, 22.530713400203297], [94.78322279959258, 22.535013149737097], [94.78344815980478, 22.53491469016086], [94.79455127971784, 22.540016250049973], [94.79465063591817, 22.540339082382786], [94.80082824003131, 22.533914340074773], [94.80469931961795, 22.52849490041939], [94.81083156012846, 22.519910070193646], [94.81563287955379, 22.505505659558594], [94.81563287955379, 22.500142469799187], [94.81563287955379, 22.48549946992466], [94.81603284044331, 22.469894639725908], [94.81770333564049, 22.46293455438621], [94.81843367957072, 22.459891590324673], [94.82083451959744, 22.449888540024176], [94.8206710804061, 22.449743099864236]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
