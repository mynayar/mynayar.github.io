
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Pant Saing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Pant Saing</div><div class="name-mm">ပေါက်ပံ့ဆိုင်း</div></div>
        <span class="pcode-badge">MMR009025028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.19896442956485, 20.978180678595493], [94.19958656167057, 20.97475894976577], [94.20212117585163, 20.9680767864146], [94.20756438279011, 20.95560276965216], [94.20742082311256, 20.955864556004485], [94.20327327304318, 20.955864556004485], [94.19313481811741, 20.955864556004485], [94.17539251974904, 20.95240826442989], [94.15235057591838, 20.953790781419457], [94.14935512304055, 20.95955126737715], [94.14721871337298, 20.9615350755833], [94.15188973722167, 20.96600301093025], [94.1576502231793, 20.97406769217031], [94.1643323874298, 20.97959775922925], [94.1705537120842, 20.98558866408564], [94.1712590782439, 20.98612474186342], [94.17631419804184, 20.98996663395303], [94.1825355226963, 20.993422924628305], [94.19100986761134, 20.98451399942161], [94.19152188222915, 20.983975728197322], [94.19705194838878, 20.979136919633163], [94.19896442956485, 20.978180678595493]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
