
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Hpyu Pyin Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayetchaung</div><div class="name-mm">သရက်ချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Sin Hpyu Pyin Ward</div><div class="name-mm">ဆင်ဖြူပြင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006003701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.24342429189761, 13.84859109720145], [98.23962339720208, 13.84867524946327], [98.23969352453656, 13.849334445328452], [98.23965144795602, 13.851255930516857], [98.23939899027124, 13.853317671273544], [98.2395749228445, 13.85393847687925], [98.23991756544336, 13.856127581422811], [98.24189727723763, 13.856032402573362], [98.2420305270872, 13.853405477480862], [98.24067899354077, 13.853557763280207], [98.24066128049378, 13.853317671273544], [98.24067530542106, 13.851634617043999], [98.24761520367878, 13.851132505760575], [98.24761545728757, 13.850729960219553], [98.24669437524528, 13.850798981387925], [98.24663716397401, 13.84973159044057], [98.24549336662562, 13.849763573929863], [98.24545695127733, 13.848513305844449], [98.2452756506508, 13.84853499569357], [98.24342429189761, 13.84859109720145]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
