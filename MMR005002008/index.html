
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Twin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Twin Gyi</div><div class="name-mm">တွင်းကြီး</div></div>
        <span class="pcode-badge">MMR005002008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40706571980718, 21.964020299697097], [95.41233468040122, 21.962911049805143], [95.4201592804265, 21.963537000432268], [95.42751408001084, 21.96494531987065], [95.43111336019348, 21.968544600053292], [95.43455603962957, 21.969014039866124], [95.43457511964613, 21.969661499578592], [95.44065875989389, 21.96744911968119], [95.44090932000915, 21.967039170021735], [95.44238027992606, 21.96463238997285], [95.44144140030045, 21.96150264043456], [95.44065875989389, 21.95680805974422], [95.44065875989389, 21.951956970038168], [95.43831155993058, 21.95007911995549], [95.43455603962957, 21.94992261004046], [95.4306439203807, 21.94757532014495], [95.42501028020035, 21.947105880332174], [95.41859436024157, 21.94647992970505], [95.41530551343874, 21.944749831939248], [95.41465714361237, 21.945597699274458], [95.40554352641266, 21.94664927024769], [95.40053014864748, 21.945256664663418], [95.39642990831368, 21.944896651659178], [95.39327519359534, 21.947350316064274], [95.38686123595733, 21.95154239876274], [95.38381105393705, 21.95506183893275], [95.38205843265058, 21.958917602165684], [95.38055045663833, 21.95922098665926], [95.38729704022626, 21.960720179892462], [95.39559072033552, 21.962128590162365], [95.40263267995425, 21.963223979702946], [95.40701423991533, 21.963223979702946], [95.40706571980718, 21.964020299697097]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
