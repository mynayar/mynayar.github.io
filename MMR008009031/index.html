
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Kone</div><div class="name-mm">ပေါက်ကုန်း</div></div>
        <span class="pcode-badge">MMR008009031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6208316608525, 17.93943624508671], [95.62378823783695, 17.942560298319165], [95.62867269329024, 17.946494997746015], [95.63369282766195, 17.94730907305535], [95.6384416032974, 17.94581660135509], [95.64658236178661, 17.9436457323647], [95.65350200731183, 17.940796466983443], [95.65607991395694, 17.940389429328775], [95.66299955768352, 17.941339183556522], [95.67168303364514, 17.942424617602057], [95.67521069631664, 17.941881901028978], [95.67846452531762, 17.937887586443026], [95.67944564160314, 17.930823544870748], [95.67855914299014, 17.927657478010246], [95.67552117466255, 17.928272641269416], [95.67081181361436, 17.92964620460873], [95.66531756025728, 17.9329820023176], [95.66158931639387, 17.93357067244864], [95.65943085894702, 17.93357067244864], [95.65413282866717, 17.93357067244864], [95.64785368120249, 17.932393332186564], [95.64373299028534, 17.932393332186564], [95.63411804601105, 17.932000885132766], [95.62345585560331, 17.931454990355576], [95.6208316608525, 17.93943624508671]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
