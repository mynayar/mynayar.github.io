
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Cho Maw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Cho Maw</div><div class="name-mm">ဇီးချိုမော်</div></div>
        <span class="pcode-badge">MMR012007019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.08100607487052, 20.09974762005669], [93.07790946984619, 20.09896730889426], [93.06722277561067, 20.09685306571646], [93.05429338623082, 20.093741873688543], [93.0499398410509, 20.09305771803929], [93.04925177155206, 20.095360377279633], [93.04959871560828, 20.097303263634785], [93.05055709073719, 20.099459606775497], [93.05139566807566, 20.10257432414579], [93.05211444942233, 20.106767211737463], [93.05298021236695, 20.111626049102938], [93.0515300807487, 20.115115992409187], [93.0478373628041, 20.120102047871285], [93.04667593874365, 20.12171029019777], [93.0431852247184, 20.126543641675767], [93.04671474269128, 20.127341409578435], [93.04922745388393, 20.127067296218797], [93.0553458601234, 20.12618127244781], [93.05799552367455, 20.12532018687716], [93.06363366226378, 20.124295699886716], [93.06753403366878, 20.122778888934647], [93.06774537165165, 20.122696701691495], [93.06814439904485, 20.122405885223486], [93.06968868968136, 20.12128038458212], [93.07223779373925, 20.119422564200022], [93.07596878862876, 20.114549427614065], [93.07817692822272, 20.10967629192737], [93.07882362710876, 20.1073050629783], [93.08023278291665, 20.102138159248682], [93.08100607487052, 20.09974762005669]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
