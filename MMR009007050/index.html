
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Kone</div><div class="name-mm">ရေတွင်းကုန်း</div></div>
        <span class="pcode-badge">MMR009007050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8361154373776, 20.123227574193265], [94.83672680190045, 20.114668463678697], [94.84198672161, 20.10579235023681], [94.84771169873596, 20.10292986122414], [94.84368811391539, 20.09805278830561], [94.83663013467304, 20.087587509855723], [94.83638675744294, 20.078582502880238], [94.84067092082637, 20.075466746792983], [94.83807397373494, 20.06903621105232], [94.83807397373494, 20.065555485797063], [94.83744111541523, 20.059226896304267], [94.83870683385334, 20.054164022551674], [94.8425039882685, 20.049417579757574], [94.8425039882685, 20.04688614378057], [94.84028898055209, 20.04245613014632], [94.83582436730075, 20.03769387457271], [94.8339061700338, 20.038892748201818], [94.82864625122357, 20.042259095880638], [94.8235967279067, 20.049622984013524], [94.81539125420306, 20.063509171111434], [94.80974380043608, 20.06662500813769], [94.81075594962743, 20.069959148396038], [94.8147008887351, 20.077849026611318], [94.81634461381293, 20.09099882633484], [94.82061829919519, 20.111052269047036], [94.82785068755925, 20.118942148161636], [94.8361154373776, 20.123227574193265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
