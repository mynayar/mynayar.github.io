
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Swe Hnit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Swe Hnit</div><div class="name-mm">မင်းဆွေနှစ်</div></div>
        <span class="pcode-badge">MMR005010022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.32789740004506, 22.587449129773574], [95.33868408000637, 22.58532711015806], [95.3385008404415, 22.576477050075823], [95.33288591964953, 22.57269290975006], [95.32128924010641, 22.567321799661386], [95.32507319966851, 22.5603026999097], [95.31768816038033, 22.55511474035302], [95.31188964029474, 22.557922379714114], [95.30651844027386, 22.557128940248447], [95.29949952038663, 22.55249024972528], [95.28880608033637, 22.550738220192784], [95.29168716013442, 22.5587158200791], [95.29388423986586, 22.565673809998373], [95.28851303984499, 22.57031249962222], [95.27834267967097, 22.574880179676597], [95.27832036029645, 22.574890170245226], [95.2799072401271, 22.57727049044081], [95.29009991967558, 22.582092329697332], [95.30169660011808, 22.58367921042725], [95.30572499990888, 22.584472649892916], [95.30889875957018, 22.585083029658165], [95.32751471962865, 22.587524369753908], [95.32789740004506, 22.587449129773574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
