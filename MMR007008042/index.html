
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Chaung (Upper)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Chaung (Upper)</div><div class="name-mm">ကျုံချောင်း(အထက်)</div></div>
        <span class="pcode-badge">MMR007008042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.95905578059984, 17.790392739133665], [96.96224173866534, 17.7817451398264], [96.96224173866534, 17.775373224594716], [96.96679310681651, 17.765815352196796], [96.96832314139994, 17.75816518017899], [96.96997906488201, 17.75853316297514], [96.97089615033713, 17.755048239684584], [96.92058251187348, 17.736752371724606], [96.88945551985643, 17.72807069440705], [96.86731984713327, 17.731988199695706], [96.8673313296772, 17.738112439837266], [96.87360745811776, 17.740147759411627], [96.8815434382791, 17.747778508771205], [96.88429050830035, 17.751746500200852], [96.88642711941611, 17.758461561651814], [96.88766615766713, 17.76608466677402], [96.8876741526401, 17.770048441282597], [96.8926058072123, 17.770821857342867], [96.89288300884385, 17.766941030004602], [96.89988799643396, 17.76809103627238], [96.91081127981676, 17.76991158335295], [96.92309997328522, 17.771276993438562], [96.92992702641118, 17.777193771675286], [96.9366403377814, 17.781669312588747], [96.93675407773856, 17.7817451398264], [96.94904277210628, 17.78447596089694], [96.95905578059984, 17.790392739133665]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
