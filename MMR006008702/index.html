
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR006008702</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.64217435826009, 11.785067043309425], [99.6286893973978, 11.784851536968915], [99.62353173240359, 11.782984952693482], [99.6172934141598, 11.786030432158782], [99.61748989714113, 11.791286338194027], [99.61105509591602, 11.793987970868216], [99.60864818636475, 11.798949153780484], [99.60889378941692, 11.80268232143203], [99.609728838715, 11.805678678128515], [99.61537770981352, 11.808232949690932], [99.62004416870349, 11.809117120858502], [99.62446502364196, 11.80877327676535], [99.62937708558411, 11.806857573318382], [99.63384706239208, 11.804155938845554], [99.63983977668443, 11.801650788253312], [99.64797289813083, 11.796683427897904], [99.64642752920719, 11.78962345305996], [99.64256899786102, 11.790680693359377], [99.64043416920163, 11.789645698690094], [99.6408237860889, 11.786906620044533], [99.64217435826009, 11.785067043309425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
