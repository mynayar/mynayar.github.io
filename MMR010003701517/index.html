
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Myaing (2) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Har Myaing (2) Ward</div><div class="name-mm">မဟာမြိုင်ရပ်ကွက် (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10865469718283, 21.96436883022227], [96.10870833306012, 21.965673132935933], [96.110344135383, 21.965574030460004], [96.11038766473632, 21.96763257422782], [96.1107530414348, 21.96761751970024], [96.11381228095945, 21.967508968314405], [96.1156904683354, 21.967438896578926], [96.11655569611298, 21.967406616513244], [96.11652087065704, 21.966566584317604], [96.11622779917673, 21.961682306848388], [96.11606825940794, 21.955890463836795], [96.11585733514835, 21.95102665568851], [96.11140995069013, 21.95130940958103], [96.10814387822774, 21.951522769131827], [96.10831047220438, 21.955765224604647], [96.10848747865407, 21.959983526901055], [96.10865469718283, 21.96436883022227]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
