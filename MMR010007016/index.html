
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Naw Ma Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Naw Ma Ya</div><div class="name-mm">မနောမယ</div></div>
        <span class="pcode-badge">MMR010007016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14925101442282, 22.053318759253386], [96.14708616819217, 22.05340202208572], [96.13231018466735, 22.053145048904923], [96.1199241710637, 22.052019660678866], [96.11704166943753, 22.054290723138422], [96.1129813113385, 22.058618023403085], [96.11469126968643, 22.065647856563373], [96.11475523036967, 22.065910799443884], [96.12484633598967, 22.064617068023324], [96.12613634511627, 22.06445168179971], [96.13012919110935, 22.063939778697886], [96.13539386823248, 22.065865243386327], [96.14348853736618, 22.069591361252378], [96.14925101442282, 22.07585688398808], [96.14925101442282, 22.072554068015904], [96.14925101442282, 22.070283380573585], [96.14925101442282, 22.06698056460141], [96.14904458763766, 22.064297026286795], [96.14925101442282, 22.062232765629687], [96.14925101442282, 22.060374930858416], [96.14925101442282, 22.056865689000404], [96.14925101442282, 22.053975723900578], [96.14925101442282, 22.053318759253386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
