
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Tee Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Tee Kone</div><div class="name-mm">ပုတီးကုန်း</div></div>
        <span class="pcode-badge">MMR010023036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05662419455098, 20.41500113399519], [96.06592410091656, 20.408531634227586], [96.07239359978485, 20.40327516611609], [96.07684138132475, 20.39761435292013], [96.07320228815513, 20.394783947221413], [96.07077622484297, 20.38871879073963], [96.07077622484297, 20.383462322628134], [96.07401097472678, 20.379418886172687], [96.07037188065783, 20.375375447918657], [96.06309369431858, 20.36971463562196], [96.05419813213814, 20.36647988573816], [96.04772863326986, 20.371736354749032], [96.04085479021643, 20.376588479574707], [96.03822438115031, 20.37632543866812], [96.03964175766106, 20.38305797934231], [96.03964175766106, 20.390740509866703], [96.03964175766106, 20.399636072047144], [96.03964175766106, 20.410149009169515], [96.0411243521072, 20.413114196263223], [96.04125913260293, 20.41338375905326], [96.05015469478337, 20.41500113399519], [96.05662419455098, 20.41500113399519]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
