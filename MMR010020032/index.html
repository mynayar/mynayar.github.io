
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moe Nan Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moe Nan Kyin</div><div class="name-mm">မိုးနံကျင်း</div></div>
        <span class="pcode-badge">MMR010020032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44718706633012, 20.812974226779204], [95.44184612220084, 20.812974226779204], [95.43290326557332, 20.813967876916024], [95.42048263166816, 20.811483750674597], [95.41253342697615, 20.811483750674597], [95.40309374528016, 20.811483750674597], [95.39564136475724, 20.811483750674597], [95.38471120785601, 20.814464702883754], [95.37775565330082, 20.818936131197574], [95.36886552842145, 20.820572560075618], [95.37066074339867, 20.822111315384973], [95.37409782635365, 20.82589210573616], [95.3760176370044, 20.82721197595197], [95.37959715818238, 20.829672896986665], [95.38200311535155, 20.83345368733785], [95.3919706550218, 20.83551593711087], [95.40056336061065, 20.83654706199735], [95.41156202516737, 20.83654706199735], [95.41534281641788, 20.83654706199735], [95.42049843995107, 20.835859645406344], [95.42427923120164, 20.830704020973826], [95.43012227132584, 20.830704020973826], [95.43493418656351, 20.829329187791814], [95.44043351929156, 20.824173565157935], [95.44747953755069, 20.818502378282176], [95.44747953755069, 20.81575271191815], [95.44718706633012, 20.812974226779204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
