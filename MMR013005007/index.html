
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U To</div><div class="name-mm">ဥတို</div></div>
        <span class="pcode-badge">MMR013005007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.91169030256549, 17.380631612658874], [95.91338293007823, 17.376117943188603], [95.91394713775026, 17.373673038180243], [95.9173323909771, 17.371228134071202], [95.91846080811985, 17.36840709031503], [95.91996536490973, 17.36765481192009], [95.9205295743804, 17.366150255130208], [95.92241026991809, 17.36032009779433], [95.92203413027096, 17.357122915290347], [95.9202741588254, 17.351030673926516], [95.9186556111676, 17.347646437832907], [95.9174784858435, 17.345292187184725], [95.91497709441745, 17.343967920183445], [95.90865004276532, 17.34426220173924], [95.90673721355165, 17.346469311609496], [95.90041016369815, 17.34676359406467], [95.88437182699829, 17.348235000944612], [95.87186486716996, 17.350294970936204], [95.86627352030678, 17.352796363261632], [95.86686208341848, 17.35750486455788], [95.86951061562246, 17.365597603746494], [95.87009917873416, 17.368834699961496], [95.86995203795624, 17.37118895060962], [95.86984436572493, 17.374447865276807], [95.87380738840034, 17.376335017946758], [95.8779591248138, 17.37746731026823], [95.88890461335728, 17.376335017946758], [95.90435559023837, 17.37592987336501], [95.91169030256549, 17.380631612658874]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
