
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Pyin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Pyin Gyi</div><div class="name-mm">ကိုင်းပြင်ကြီး</div></div>
        <span class="pcode-badge">MMR008009014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70318866902193, 17.948483647902094], [95.71437339971271, 17.944755404038688], [95.71280361419548, 17.9473063067407], [95.70868292327833, 17.958098592176327], [95.70750558301631, 17.965358856825844], [95.70879886297718, 17.967676044613825], [95.71146175195832, 17.966896663350383], [95.73846740464705, 17.95899256865215], [95.7406382736375, 17.962369477069785], [95.7479275953823, 17.962415506170714], [95.75342184873938, 17.960845718854898], [95.75708468491035, 17.959275932438402], [95.75629979170208, 17.95273515420405], [95.75760794824828, 17.949333948802746], [95.76014452834738, 17.94504127513477], [95.75603816093246, 17.94462458775456], [95.7500206442374, 17.94357806377667], [95.74217171035622, 17.94383969544566], [95.73065993940475, 17.94488621942355], [95.72673547156484, 17.94148501402225], [95.72228774308496, 17.936775653873383], [95.72071795576909, 17.93311281770241], [95.7154865751454, 17.933135662281018], [95.70573957262326, 17.93317822539484], [95.70436600928394, 17.937495139389227], [95.70318866902193, 17.948483647902094]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
