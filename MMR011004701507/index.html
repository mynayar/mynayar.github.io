
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanbyuzayat</div><div class="name-mm">သံဖြူဇရပ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyaung Paing Ward</div><div class="name-mm">ကျောင်းပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011004701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.72262400999011, 15.971774271765298], [97.72323342388347, 15.97152000734252], [97.72323557056518, 15.971523280874749], [97.72435395846844, 15.970938949073286], [97.72580041006091, 15.970231017147796], [97.7268144775062, 15.969762875056688], [97.72773532302682, 15.969339342936394], [97.72804378149539, 15.969212530433992], [97.72808680236409, 15.966055515249877], [97.72821387836785, 15.96329518562436], [97.72829681204831, 15.960626424070256], [97.72870782560574, 15.959177423799133], [97.7287584808193, 15.958457336636798], [97.72877048856725, 15.958286648010471], [97.72860006344223, 15.95846555733965], [97.72807457338291, 15.959219334904446], [97.72662050902932, 15.96207719870381], [97.7263184330493, 15.962670907736253], [97.72606195539498, 15.963086998865947], [97.72560537408879, 15.963827721871894], [97.72458216503497, 15.965487699497771], [97.72458438186379, 15.96553954091712], [97.72357374982874, 15.967692290366983], [97.72340225451052, 15.968462371741111], [97.72310343767356, 15.969804185414887], [97.72262400999011, 15.971774271765298]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
