
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Ni Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Ni Taw</div><div class="name-mm">သစ်နီတော</div></div>
        <span class="pcode-badge">MMR008005013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42111885974765, 18.676755612081877], [95.42713966796134, 18.677338271144322], [95.44356048273016, 18.679162805818862], [95.45085862322696, 18.689501838339197], [95.46302219042178, 18.694671353700073], [95.47305713338005, 18.688589569652947], [95.47913891742718, 18.683115964730064], [95.47822664874093, 18.680075072706472], [95.48096345210172, 18.677946449369188], [95.48096345210172, 18.674905557345653], [95.48339616500107, 18.671560576659317], [95.48126754076446, 18.668823774197847], [95.47579393584152, 18.665174703949504], [95.46180583397211, 18.661525633701103], [95.45541996126224, 18.665174703949504], [95.44659539156413, 18.664599188202033], [95.44469576439809, 18.664475299395576], [95.44143185939288, 18.664262436162574], [95.42713966796134, 18.661829723263168], [95.42550925464843, 18.66148482786258], [95.42111885974765, 18.676755612081877]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
