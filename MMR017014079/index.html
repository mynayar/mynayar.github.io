
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Tar Moke Soe Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Tar Moke Soe Ma</div><div class="name-mm">ကျုံတာမုဆိုးမ</div></div>
        <span class="pcode-badge">MMR017014079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.05545748807265, 16.498245917714996], [95.0530647599308, 16.499143260353208], [95.04613691978307, 16.500957659668302], [95.04151811956564, 16.503596820037274], [95.04118835975504, 16.5083803202956], [95.04250812025361, 16.510689540090254], [95.04910583996258, 16.513163819654608], [95.05537379986106, 16.517452410400495], [95.05603368011032, 16.520586390349706], [95.05900260028983, 16.517947229980734], [95.06906460025118, 16.520916330024647], [95.07830148032912, 16.52289570007656], [95.08499871631778, 16.525040677585253], [95.08407362599712, 16.523879299390217], [95.08211057144575, 16.521975729596306], [95.08078997008113, 16.520607540605567], [95.07955265043455, 16.51956057775851], [95.07755390269051, 16.515848617919403], [95.07752327807685, 16.511012417389225], [95.07784639189754, 16.509377859100994], [95.07436183463102, 16.504617753806315], [95.0733874398785, 16.50323286980114], [95.0657374432285, 16.49847525742723], [95.06274242472318, 16.49812905800968], [95.05979189298154, 16.49812905800968], [95.0579835029364, 16.498700128408245], [95.05545748807265, 16.498245917714996]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
