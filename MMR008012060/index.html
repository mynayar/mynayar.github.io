
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dhamma Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dhamma Nge</div><div class="name-mm">ဓမ္မငယ်</div></div>
        <span class="pcode-badge">MMR008012060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66419329078781, 18.44921188012421], [95.66124790766486, 18.439066674887158], [95.66222970203916, 18.436448556855453], [95.66484782007092, 18.43284864624809], [95.67237490817553, 18.43055779330757], [95.68121105394704, 18.43055779330757], [95.6894453239426, 18.432583407398397], [95.68484030673483, 18.427087096392427], [95.67447947374876, 18.415784369253288], [95.67385154461317, 18.421121768255034], [95.67102586305322, 18.42488934396812], [95.66631639318706, 18.42740106140991], [95.66129295920274, 18.427715024628753], [95.65752538259039, 18.424261413933152], [95.6415131855851, 18.426145202239354], [95.63962939907759, 18.43085467210551], [95.63868750492446, 18.435250176954128], [95.64245507973823, 18.437761894395976], [95.6499902320636, 18.442471364262076], [95.65909520587911, 18.44780876236456], [95.66419329078781, 18.44921188012421]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
