
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwepyithar</div><div class="name-mm">ရွှေပြည်သာ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013007701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09580212706658, 16.96686695444646], [96.09477233857262, 16.966531753737513], [96.09277305573198, 16.965961075443317], [96.09130668685418, 16.965230941954474], [96.08996899926996, 16.96449724804961], [96.08878059374945, 16.96370735191283], [96.08887429681141, 16.96324140326817], [96.08827247589409, 16.96218833942038], [96.08796310461366, 16.96224022040991], [96.08759193372083, 16.962320328420446], [96.08710464955999, 16.96217478214055], [96.08660262011489, 16.963471276278426], [96.08614921611348, 16.96497917135173], [96.08565139819353, 16.96664047277966], [96.08531379719403, 16.967786789129093], [96.08481216434996, 16.96952819856756], [96.08455200217321, 16.970492076648043], [96.09469036536814, 16.972151816852943], [96.09488563516402, 16.97153511035708], [96.09495519862355, 16.97119923875391], [96.094961167424, 16.971170425374908], [96.09497182259162, 16.971116626131447], [96.0950794219778, 16.970573425723046], [96.0951315556768, 16.9702625273938], [96.09520912130398, 16.969831467048607], [96.09526252844302, 16.969568252572856], [96.09532101944956, 16.9692999524309], [96.09558296228391, 16.968011856162263], [96.09568087237443, 16.96749305705896], [96.09580212706658, 16.96686695444646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
