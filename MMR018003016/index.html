
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Pin</div><div class="name-mm">မကျီးပင်</div></div>
        <span class="pcode-badge">MMR018003016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.23947303005633, 20.203436264771824], [96.24105511739981, 20.189593004113874], [96.2402640737281, 20.18484674298287], [96.23746455524508, 20.18025521290781], [96.23185815732813, 20.177763481099817], [96.22594029181107, 20.17464881499086], [96.22282562570211, 20.171845614683434], [96.21784216028755, 20.166239216766485], [96.20662936265501, 20.164681884161666], [96.1947397118683, 20.1672296662162], [96.19354776661618, 20.167485082670453], [96.18888542032596, 20.168675470296762], [96.18917993480619, 20.17574381422571], [96.18920079458104, 20.17586434136632], [96.1989792149189, 20.182943458274053], [96.20542533141395, 20.184979072826025], [96.21820447195887, 20.19063356109001], [96.22125789603513, 20.192103727804863], [96.223654821313, 20.193635939646924], [96.22958498685773, 20.197503439032516], [96.23153952842654, 20.198676163973857], [96.23947303005633, 20.203436264771824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
