
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku</div><div class="name-mm">ကူ</div></div>
        <span class="pcode-badge">MMR010017052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4261480439971, 21.39404386073562], [95.42557465514625, 21.391877726675773], [95.42435149442599, 21.388875422762624], [95.42123799383842, 21.389542601909625], [95.41801329657642, 21.3900985843822], [95.41534458178705, 21.391655334226357], [95.41200868875006, 21.393545674093616], [95.40767202744217, 21.394991227263404], [95.40422493683144, 21.39699276380503], [95.40022186464739, 21.400328656842078], [95.39744195408298, 21.404220533251078], [95.39499563174309, 21.407667622962492], [95.39372611456861, 21.41142635833984], [95.39634111105352, 21.41570544325168], [95.4006201959653, 21.42141088890145], [95.40180883081297, 21.426403155081573], [95.4020465576026, 21.42901815066716], [95.40157110402328, 21.43020678641409], [95.40466155408751, 21.433297235579005], [95.40822745773107, 21.433297235579005], [95.4144083587588, 21.433297235579005], [95.4175533473092, 21.43359675928309], [95.41726108203335, 21.420697709431806], [95.41488381323745, 21.416418623620643], [95.41607244718574, 21.41475453519371], [95.4206820122651, 21.40955796193043], [95.42090440381526, 21.40700044381549], [95.42246115455868, 21.404331729026126], [95.42401790530215, 21.399327888571236], [95.42557465514625, 21.39510242393777], [95.4261480439971, 21.39404386073562]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
