
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Chaung</div><div class="name-mm">ရွှေချောင်း</div></div>
        <span class="pcode-badge">MMR009013051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.68414529826697, 19.688863634249344], [94.69581641829313, 19.695937266191947], [94.70639225939533, 19.698958935206747], [94.71772351842571, 19.694048723170113], [94.72829936042723, 19.685361424190432], [94.73519027171375, 19.68086735184687], [94.72662352055909, 19.669445016674217], [94.72581441220541, 19.66054481758931], [94.73390550203737, 19.64436263792544], [94.7356874448198, 19.643195158729668], [94.72621896593262, 19.63705818238924], [94.72500530295241, 19.636271548093532], [94.72034714660361, 19.64469206138955], [94.71448688626083, 19.65528561014287], [94.70922767701575, 19.664994917581453], [94.70032747793084, 19.670254125927215], [94.69979022473916, 19.670644855275896], [94.69142727884588, 19.676726999051823], [94.6892623660654, 19.677358431946118], [94.69102272511873, 19.67955887963865], [94.68414529826697, 19.688863634249344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
