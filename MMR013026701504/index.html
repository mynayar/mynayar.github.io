
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kayan</div><div class="name-mm">ခရမ်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward</div><div class="name-mm">အမှတ် (၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013026701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.55834790929015, 16.905602345730358], [96.55832341405147, 16.905904453674736], [96.55837100327147, 16.906266131747657], [96.55854232446393, 16.90701804142543], [96.55855184230802, 16.907360683810282], [96.55766391802956, 16.90761061532612], [96.5578245203937, 16.907802708349948], [96.55806008703331, 16.90824528809702], [96.55861509631308, 16.908124887370093], [96.55905410686864, 16.908157010093646], [96.55953594772245, 16.908096333837932], [96.55989286687321, 16.907967842943606], [96.56033544662029, 16.90774655307007], [96.56083513343151, 16.90743960260039], [96.56132411266833, 16.907143359705117], [96.56166675505318, 16.906786440554185], [96.56181666109649, 16.90653659714866], [96.56175003618841, 16.906317686735974], [96.56175003618841, 16.90546108077399], [96.56174051834432, 16.904804349536448], [96.5605793413734, 16.905066090246976], [96.55893275435733, 16.905437286163988], [96.55834790929015, 16.905602345730358]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
