
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Ka Lay</div><div class="name-mm">ကံကလေး</div></div>
        <span class="pcode-badge">MMR007005013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67996065615944, 18.100917917228173], [96.69308178909336, 18.099980692355132], [96.70404424064924, 18.09468847259501], [96.70411876297061, 18.08306702482338], [96.70461239004982, 18.078658079606726], [96.70461239004982, 18.075749993167676], [96.70461239004982, 18.07152004811178], [96.70487676105375, 18.068083217866274], [96.70434801814656, 18.06385327281032], [96.70381927523943, 18.05883021384335], [96.70143993080819, 18.06015207066156], [96.69562375703083, 18.060945186371328], [96.69165818387813, 18.06015207066156], [96.68742823882224, 18.059623327754423], [96.68240517985521, 18.058565841940094], [96.67870397770645, 18.05697961321863], [96.67710190293053, 18.056819405291378], [96.67870397770645, 18.075749993167676], [96.67870397770645, 18.079451195316437], [96.67764649189212, 18.08658922591212], [96.67711774898498, 18.089497313250433], [96.67764649189212, 18.09346288730245], [96.6786640226266, 18.096515480405174], [96.67996065615944, 18.100917917228173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
