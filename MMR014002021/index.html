
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung To</div><div class="name-mm">တောင်တို</div></div>
        <span class="pcode-badge">MMR014002021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.83683065610995, 20.36240266894805], [96.83364366292477, 20.365421936773032], [96.83056851032853, 20.379566835441153], [96.84617898737042, 20.390980514639068], [96.8618402374371, 20.399184026921375], [96.86668776672713, 20.40291289581353], [96.8670606544257, 20.414099504288743], [96.87153529691648, 20.420065693976653], [96.87265395821368, 20.421930128872418], [96.87332379755526, 20.422106402288705], [96.87265395821368, 20.41708259868301], [96.87675571390514, 20.410370633597893], [96.893820407286, 20.402757155718234], [96.89353562436963, 20.401048461817084], [96.89316273757032, 20.38538721175047], [96.89689160736185, 20.36898018808529], [96.90361289302064, 20.360658594818347], [96.90472223194553, 20.359285127706528], [96.90399637473297, 20.348760200822653], [96.90397645834696, 20.348471407829265], [96.89390851116889, 20.351081616323597], [96.88607788568595, 20.35481048521575], [96.86780642802427, 20.36674286639021], [96.85475538555266, 20.369353074884543], [96.83683065610995, 20.36240266894805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
