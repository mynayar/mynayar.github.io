
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Chaung Hone Lan Ward (Pan Hlaing Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Chin Chaung Hone Lan Ward (Pan Hlaing Ward)</div><div class="name-mm">ချင်းချောင်းဟုမ်းလမ်းရပ်ကွက် (ပန်းလှိုင်ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR013038701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12624203074517, 16.800810554263705], [96.12631368602786, 16.800286770218293], [96.12624253166757, 16.799887127688862], [96.12624931255579, 16.799394607675026], [96.12626075732817, 16.798748651629012], [96.12623596212, 16.797784805924096], [96.12580888936878, 16.797889882711956], [96.12531089787967, 16.797910690326148], [96.12483024621895, 16.79792976404741], [96.12442398108192, 16.797941207920474], [96.12395159419077, 16.797960281641735], [96.12346034581839, 16.797991222816734], [96.12307167142058, 16.79802131683033], [96.12278671223703, 16.798034286852896], [96.12223176398476, 16.798188938768533], [96.12222099280461, 16.798772811915796], [96.12224006742525, 16.799800872812057], [96.12224753269754, 16.800745705949623], [96.12252616874775, 16.80085868867758], [96.12285041841216, 16.800840377581437], [96.1231880194116, 16.800821304759438], [96.12355422964401, 16.80079078716517], [96.12415313765723, 16.800760269570844], [96.12476349044277, 16.800741195849582], [96.12542152438391, 16.800730705257877], [96.12624203074517, 16.800810554263705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
