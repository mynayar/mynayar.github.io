
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Han Zar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Han Zar</div><div class="name-mm">ဟံဇား</div></div>
        <span class="pcode-badge">MMR010030032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04892261188911, 20.973245408748653], [96.04357331036005, 20.972930744058658], [96.03570669041147, 20.971672085298565], [96.02407923606796, 20.973997575627664], [96.02312009741462, 20.97418940371807], [96.02060277809579, 20.97796538179699], [96.01653911498823, 20.985780119856713], [96.01651213622614, 20.985832001745507], [96.01871478905633, 20.988978650444437], [96.0193441193357, 20.994957282252813], [96.01950333800869, 20.998141660209512], [96.0196587840257, 21.00125057785192], [96.0218614377552, 21.001879908131286], [96.0350773601321, 21.00345323158143], [96.04609062877955, 21.008487869319765], [96.04658054795397, 21.009257742051204], [96.05437538671481, 21.009835137381742], [96.05395724872812, 21.00502655593084], [96.05395724872812, 20.99936258881246], [96.05678923273695, 20.99558661073354], [96.05993588143582, 20.99023731010385], [96.05993588143582, 20.984888007675465], [96.05804789239636, 20.97607739275753], [96.04892261188911, 20.973245408748653]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
