
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yon Pang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yon Pang</div><div class="name-mm">ယုံပန်</div></div>
        <span class="pcode-badge">MMR015021025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.85169352723454, 23.211847447901448], [98.85371133431067, 23.208855526661296], [98.8679311186263, 23.198737603257825], [98.8701187779593, 23.195729570663218], [98.88419835706856, 23.19015742522504], [98.88555664272496, 23.189978264085653], [98.88605101983876, 23.181971242878603], [98.88576291572605, 23.17845169838722], [98.86191505613499, 23.18287707421763], [98.84878910103623, 23.180689413985306], [98.84441378326954, 23.17522026610243], [98.84230087468569, 23.17403181381718], [98.83156128502532, 23.18369744568065], [98.81460692586899, 23.194088826837913], [98.80585628943629, 23.194635742345667], [98.80749703326154, 23.196276486170973], [98.81077852181141, 23.2020190918077], [98.81077852181141, 23.208035154298955], [98.80968469259454, 23.212137016110432], [98.80726280933123, 23.21312778571877], [98.80912803293245, 23.226802286796158], [98.82865656744667, 23.219428883835974], [98.82960345193783, 23.219071368249104], [98.83621006144523, 23.212957387573454], [98.84933601564467, 23.210769728240393], [98.85169352723454, 23.211847447901448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
