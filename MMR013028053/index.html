
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tar Taik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawhmu</div><div class="name-mm">ကော့မှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tar Taik</div><div class="name-mm">တာတိုက်</div></div>
        <span class="pcode-badge">MMR013028053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.22845777480654, 16.50326493333006], [96.22853136003431, 16.50339612013488], [96.22928519965228, 16.503040889725355], [96.2298867597662, 16.502595120068804], [96.23111004009633, 16.505624519655896], [96.23101715991407, 16.508365830418768], [96.23134368036659, 16.50944348982523], [96.2325536399386, 16.509459960009224], [96.23333196000203, 16.507920419591755], [96.23509811968256, 16.50579813017964], [96.23911427970029, 16.505137259776745], [96.24080807992902, 16.505160300407567], [96.24369131989857, 16.505795700211422], [96.24679632009418, 16.507030320093236], [96.24735504010306, 16.507192320369313], [96.24895379997793, 16.50765582016004], [96.2508650400896, 16.508397240140596], [96.25375260040227, 16.508913299908897], [96.25699872041469, 16.509553469716877], [96.25930631963098, 16.50652749025153], [96.2611077597154, 16.501342139628093], [96.26155991995438, 16.497581129865296], [96.26070563955369, 16.493962950429875], [96.25942368025869, 16.493384609911857], [96.25634171979459, 16.4906980201975], [96.25372632041342, 16.49106342014079], [96.25101947976526, 16.49415257967786], [96.25033692041262, 16.494105150332473], [96.2467181995853, 16.49385386986023], [96.24170160044855, 16.493064480041767], [96.23706443967222, 16.493081579751163], [96.22951775983682, 16.499833200441913], [96.22890305073525, 16.499814033191115], [96.22845777480654, 16.50326493333006]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
