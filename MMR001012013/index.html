
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khon Sint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khon Sint</div><div class="name-mm">ခုံဆင့်</div></div>
        <span class="pcode-badge">MMR001012013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.29148220513969, 24.41495536669686], [97.29289021700998, 24.416197730640818], [97.30605551025366, 24.421463849377176], [97.31282623344396, 24.420335395362258], [97.31696389636676, 24.410931613703042], [97.32448692133443, 24.407170101219265], [97.33614761012416, 24.41017931102641], [97.3504413573828, 24.415069278424482], [97.35261558534103, 24.416125330719467], [97.36002760518988, 24.410909465199722], [97.36383520163332, 24.402025072599088], [97.36129680400438, 24.395679077627392], [97.34860481406099, 24.386371618755277], [97.33922922794659, 24.37643559312818], [97.33747877312692, 24.36943069816823], [97.33600645523376, 24.366422204221408], [97.33591611383764, 24.366028802087612], [97.33084755457105, 24.366489484302292], [97.32251393826772, 24.372218790764634], [97.31730524933783, 24.38263593480059], [97.31730505958092, 24.389736732564188], [97.31730488691107, 24.396178373133466], [97.30912952520748, 24.403536142279165], [97.30688780582761, 24.405553674162775], [97.29148220513969, 24.41495536669686]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
