
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Chan Thar</div><div class="name-mm">အောင်ချမ်းသာ</div></div>
        <span class="pcode-badge">MMR005004003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6842776000313, 22.504357530175923], [95.68159092038474, 22.5042296402857], [95.67789012023292, 22.5042296402857], [95.6741893200811, 22.50577151983981], [95.67218484005838, 22.504846409734057], [95.66940959967337, 22.503150270368735], [95.66493768032973, 22.501916639741182], [95.66239211960072, 22.501506059657004], [95.66231651989153, 22.50222507033078], [95.66015760019314, 22.504383810164768], [95.65769051970176, 22.50577151983981], [95.65542791986269, 22.5058847399888], [95.656611239717, 22.508547030021475], [95.65923240015519, 22.51132254020314], [95.66262467978521, 22.514560649954092], [95.66586288036768, 22.51887812962201], [95.66776079972118, 22.521445560064592], [95.66843291974351, 22.520773440042262], [95.6727504003108, 22.516918559943633], [95.67799308001668, 22.513217939656215], [95.68292724010013, 22.51167597016996], [95.68760291973899, 22.5106201795777], [95.68652507956881, 22.508392860142408], [95.68482912006789, 22.504383810164768], [95.6842776000313, 22.504357530175923]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
