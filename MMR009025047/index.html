
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Neint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Neint</div><div class="name-mm">အနိမ့်</div></div>
        <span class="pcode-badge">MMR009025047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.25209571684394, 21.380799941564078], [94.2496727606894, 21.38032588463193], [94.2286564570299, 21.37660147727638], [94.22386793136002, 21.375803389215093], [94.2172172020123, 21.379527798369224], [94.21056647266465, 21.38405029378606], [94.20817221027932, 21.385380438756272], [94.20484413504886, 21.386922717609366], [94.20497985983275, 21.387242644232686], [94.21017990268041, 21.392096017317385], [94.21296073594925, 21.394691459843045], [94.2209416111665, 21.395755577258114], [94.22679425155354, 21.399479984613663], [94.23397703960876, 21.404534539637325], [94.24115982766398, 21.40639674421442], [94.24674643959656, 21.407194831376444], [94.24907699131018, 21.40936737760245], [94.25425880130268, 21.408533524402685], [94.25419525700556, 21.405864684607536], [94.25446128635934, 21.403470423121576], [94.25339716894428, 21.39655366442014], [94.2531311395905, 21.388306759849115], [94.25209571684394, 21.380799941564078]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
