
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Htet Wea Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Htet Wea Gyi</div><div class="name-mm">အထက်ဝဲကြီး</div></div>
        <span class="pcode-badge">MMR005020021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.45788592009922, 24.26428223973363], [96.45770267963502, 24.26428223973363], [96.44287103976671, 24.258483900411704], [96.43029768029379, 24.249328649997267], [96.41571047975492, 24.24230955024558], [96.41491704028925, 24.241271940347815], [96.41131595966385, 24.244323750141007], [96.40631087994319, 24.248107889567507], [96.39778571973523, 24.253065809739383], [96.40527335997763, 24.257690460046717], [96.42010499984593, 24.2612915397728], [96.42431628037212, 24.27447510004589], [96.4346925601136, 24.284301750125735], [96.43591295991524, 24.294494610437994], [96.44409180019647, 24.29290772970802], [96.44952384025311, 24.289917029747187], [96.45391836034412, 24.28271487029508], [96.4550782798388, 24.274108889813476], [96.45727535957025, 24.267517110126562], [96.45788592009922, 24.26428223973363]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
