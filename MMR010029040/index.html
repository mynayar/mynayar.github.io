
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Oke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Oke</div><div class="name-mm">ညောင်အုပ်</div></div>
        <span class="pcode-badge">MMR010029040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71389795692522, 21.261908504074256], [95.71563587879285, 21.26538434780946], [95.71591985321874, 21.27276767658708], [95.71610531141107, 21.27944414902828], [95.72074741396204, 21.279299082986313], [95.7243822839153, 21.279299082986313], [95.72699484593545, 21.279299082986313], [95.74715701218645, 21.28213882364787], [95.76675122958562, 21.2855465140604], [95.77328263598491, 21.285830489385603], [95.77725827434995, 21.28497856610801], [95.77924609443176, 21.280151005364644], [95.7798140423842, 21.27475549576957], [95.77583840401917, 21.270779857404534], [95.76362751359892, 21.26339652862697], [95.75510828891646, 21.259420891161255], [95.74460124505146, 21.25601319984935], [95.73863778660461, 21.250901664680157], [95.73211917306145, 21.24638877941868], [95.73125445872637, 21.245790130410228], [95.72500702675296, 21.24522218155846], [95.71563587879285, 21.246926027214442], [95.71393203403619, 21.250049743201146], [95.71393203403619, 21.25601319984935], [95.71421600756275, 21.26197665829619], [95.71389795692522, 21.261908504074256]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
