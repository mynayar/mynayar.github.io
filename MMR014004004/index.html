
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsihseng</div><div class="name-mm">ဆီဆိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Son</div><div class="name-mm">ပင်စုံ</div></div>
        <span class="pcode-badge">MMR014004004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.31707951770562, 20.314114801057258], [97.31632360874761, 20.307311616837694], [97.31536596656616, 20.213144057752118], [97.29012267392233, 20.205931751249352], [97.26827852003771, 20.19969061812759], [97.24634621280751, 20.20202384172694], [97.24569732766957, 20.202092871888567], [97.24089281924824, 20.21362369407825], [97.23224470283083, 20.222752259809], [97.22840109573406, 20.234763533110595], [97.22695974329758, 20.248696608161993], [97.22215523397693, 20.25590337214294], [97.21879207799208, 20.2727191529666], [97.21350711755946, 20.288093581353735], [97.2014958460565, 20.30058530486798], [97.20148734296657, 20.30073836858088], [97.20197629716841, 20.301546206192484], [97.22455748863723, 20.306831165725782], [97.24761913121802, 20.317881536803554], [97.25626724673612, 20.317881536803554], [97.26635671559, 20.31980334035194], [97.31707951770562, 20.314114801057258]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
