
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kawng</div><div class="name-mm">မန်ကောင်း</div></div>
        <span class="pcode-badge">MMR015004039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.52020425831995, 22.08158992533481], [98.5505595771628, 22.081203404813323], [98.57056137270922, 22.080721433847145], [98.57610403927004, 22.0816853757795], [98.5778002029171, 22.08178265274728], [98.58935824128986, 22.07662468108424], [98.60140751634384, 22.06578033389536], [98.60984200780246, 22.054454015740305], [98.61591232729211, 22.04241505591017], [98.61393876056542, 22.038789958889538], [98.60610779873599, 22.02262687003406], [98.59899766061363, 22.016137322579425], [98.59225006708698, 22.011799583883715], [98.58381557472904, 22.007220860154632], [98.57146610058015, 22.000094573805598], [98.57056137270922, 22.005774947256043], [98.56646461994632, 22.010112685951754], [98.5594760395876, 22.01493239471432], [98.55778914165563, 22.01999309120822], [98.5570661847567, 22.026258712869378], [98.56116293931825, 22.033488278261473], [98.56501870704773, 22.0371030600582], [98.5635727941492, 22.040717842754304], [98.54622183756783, 22.04939332014567], [98.52983482471745, 22.05999668230112], [98.5145756120749, 22.070657324975627], [98.51730357959656, 22.074214826253296], [98.52020425831995, 22.08158992533481]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
