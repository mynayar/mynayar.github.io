
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bo Sein Hman Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bahan</div><div class="name-mm">ဗဟန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Bo Sein Hman Ward</div><div class="name-mm">ဗိုလ်စိန်မှန်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013044701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17101732838705, 16.81154855122469], [96.17034721385289, 16.811586380307233], [96.16999244659422, 16.811601639104424], [96.16917800975739, 16.811647414596564], [96.16851997401767, 16.811689376963216], [96.16777324713769, 16.811738968278803], [96.16744740657259, 16.811737069809965], [96.16779994980789, 16.812222480682976], [96.16803169340801, 16.812620162690393], [96.16823005687166, 16.812948227278923], [96.16858100920626, 16.813514710235722], [96.16894340541387, 16.814126968684718], [96.16916618367247, 16.814550400080975], [96.16956520117316, 16.81403160097767], [96.16999244659422, 16.813489914128297], [96.17016029336293, 16.813280105892204], [96.1704921719762, 16.81286811836901], [96.17073059124385, 16.81249427828834], [96.1708793642913, 16.81221103680997], [96.17097282543563, 16.811965941874746], [96.17101732838705, 16.81154855122469]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
