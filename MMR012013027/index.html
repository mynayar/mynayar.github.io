
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Taung Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Taung Chaung</div><div class="name-mm">လေးတောင်ချောင်း</div></div>
        <span class="pcode-badge">MMR012013027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.76862048794521, 19.064428235274875], [93.76528668223466, 19.057573315755974], [93.75173640271288, 19.047093750676083], [93.74652713192165, 19.043493385911063], [93.73582399987777, 19.050120911850627], [93.73137468859107, 19.051651934788993], [93.71032864435153, 19.058892131966388], [93.71084021110693, 19.05995486712345], [93.71135178505688, 19.061017599582613], [93.71089895482294, 19.063708377439696], [93.70948473763059, 19.07211134316401], [93.70784514493755, 19.075344325879996], [93.71698158243413, 19.07522628986146], [93.72011204603416, 19.07471767917758], [93.72324248894978, 19.0742090163331], [93.72863460090616, 19.073525905696044], [93.73802717071743, 19.072330263331025], [93.74333139462823, 19.071481609089062], [93.74863555828443, 19.07063280376093], [93.75168440121422, 19.07136501558307], [93.76862048794521, 19.064428235274875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
