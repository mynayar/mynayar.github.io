
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Kwet Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyar Kwet Thit Ward</div><div class="name-mm">ကျားကွက်သစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1790575984295, 16.8058438304285], [96.17902946493791, 16.805192947896273], [96.17900657629252, 16.804639816274573], [96.17897987362232, 16.804101944349327], [96.17896079990106, 16.80360984791622], [96.17893218976883, 16.803192138906127], [96.17895833216136, 16.802807190399562], [96.17890474605724, 16.8028202287706], [96.17841100656278, 16.802940368303382], [96.17789077843673, 16.8029727933598], [96.1774330154214, 16.80299186708106], [96.17683410740818, 16.803030013624266], [96.17675141474604, 16.803034636139614], [96.17632509202946, 16.80305846637515], [96.17610613499022, 16.80307070434958], [96.17560227722339, 16.803058766748734], [96.1750143957978, 16.8028742141737], [96.17532271307283, 16.803335486343656], [96.17555999739602, 16.803800583330315], [96.17565907660514, 16.804010637081262], [96.17578506442925, 16.804277738426947], [96.17589759839552, 16.8047876360406], [96.17594623642975, 16.805286407241965], [96.1759500612464, 16.805339801790467], [96.1760034557949, 16.80608526872021], [96.17636585290182, 16.806099891696704], [96.17679023757944, 16.806039809789468], [96.17716980004627, 16.806005478170334], [96.177773157905, 16.805955886854747], [96.17832756026877, 16.805917740311543], [96.1790575984295, 16.8058438304285]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
