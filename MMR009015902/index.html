
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kamma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009015902</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08132863161114, 18.86264938566069], [95.08065042767515, 18.85942790887094], [95.07673168132209, 18.85771345840942], [95.0747723067966, 18.85257010162894], [95.07624183679138, 18.847671667113786], [95.07403754089984, 18.843997841227463], [95.07036371591283, 18.840813857173828], [95.06473051640029, 18.8383646408156], [95.06328115100439, 18.836726228932378], [95.06323794487531, 18.836677386752058], [95.05948710464622, 18.832437307235978], [95.05878918577235, 18.83231055588749], [95.05732511825966, 18.832044662331327], [95.05539132494977, 18.836095690863488], [95.05076997605363, 18.838119720348857], [95.04685122880124, 18.845222448057598], [95.0424426388168, 18.851835336631552], [95.04097310792264, 18.854774396621167], [95.04044968090813, 18.855185661089422], [95.04231430376217, 18.856920933554306], [95.04564909602902, 18.85970822305609], [95.05943792701879, 18.869171145931716], [95.07079343357015, 18.870793361024823], [95.07863414225193, 18.865385976781454], [95.08132863161114, 18.86264938566069]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
