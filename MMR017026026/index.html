
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Du (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dedaye</div><div class="name-mm">ဒေးဒရဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Du (North)</div><div class="name-mm">ကျုံဒူး (မြောက်)</div></div>
        <span class="pcode-badge">MMR017026026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.86438055981506, 16.33100310041283], [95.86444932018003, 16.33215986958237], [95.865407639551, 16.33258431001792], [95.86658412006113, 16.332568290394363], [95.86777139963044, 16.333022609905584], [95.86862855966035, 16.332919199561445], [95.86908000044173, 16.331625540086634], [95.87049048005167, 16.33153058966502], [95.87151539961604, 16.331895360082854], [95.87240640023526, 16.33280318971549], [95.87387988005247, 16.33269618028453], [95.87402243968393, 16.331709689650495], [95.87512907974332, 16.332300449805984], [95.87561292039999, 16.333202700044637], [95.87531700027938, 16.334418419774295], [95.87603159977857, 16.33501458035863], [95.87743524004435, 16.3344653104258], [95.8772552398375, 16.332877349610044], [95.87770704034767, 16.331583690135233], [95.87878235971817, 16.330054320150794], [95.88014892003667, 16.328028240211154], [95.87382444044562, 16.323533190304545], [95.86796904003921, 16.319977650448266], [95.86738836038461, 16.322478389865864], [95.86795212019427, 16.324462619854046], [95.86693008025907, 16.32772242035344], [95.86589508019387, 16.330097250187976], [95.86438055981506, 16.33100310041283]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
