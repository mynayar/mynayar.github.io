
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Lin</div><div class="name-mm">ပုလင်း</div></div>
        <span class="pcode-badge">MMR010022014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00739918112737, 21.185714867347315], [94.99786698167594, 21.184593430742268], [94.98747546022435, 21.183150163649202], [94.97506336268412, 21.183150163649202], [94.96726972092097, 21.183150163649202], [94.96351722683863, 21.183150163649202], [94.95687819767073, 21.18372747084618], [94.9487959032084, 21.18372747084618], [94.9444661019291, 21.185170737939245], [94.94475475462826, 21.19180976620777], [94.94475475462826, 21.199892061569415], [94.94533206182524, 21.206242437138826], [94.94570181538654, 21.222192166335446], [94.9457057867927, 21.222363491681847], [94.9649519629628, 21.22755218688394], [94.97196806077744, 21.2295578818908], [94.98142451842682, 21.23226095078229], [94.98554372456329, 21.233438449325035], [94.9929007301846, 21.235753633423485], [94.99482418938487, 21.237369469625378], [94.99844428887292, 21.230489323223765], [94.99820404308218, 21.23025868668907], [95.00260569659571, 21.223308706131945], [95.01075147060396, 21.21516293302301], [95.01720676108323, 21.208840316827207], [95.0177840682802, 21.205087822744872], [95.0186500281763, 21.198737448074837], [95.0186500281763, 21.19325303330089], [95.0174954137824, 21.189211885620068], [95.01258830620543, 21.186902657731537], [95.00768119772914, 21.185748045136222], [95.00739918112737, 21.185714867347315]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
