
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thar</div><div class="name-mm">ရွာသာ</div></div>
        <span class="pcode-badge">MMR018006016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18917348576781, 19.73058186466136], [96.1892300729096, 19.729859827768905], [96.18949181339656, 19.729193579420212], [96.1899439115823, 19.72890804377124], [96.19099087442936, 19.72878907065916], [96.19791353538142, 19.72801404391305], [96.20317371499499, 19.727385187576374], [96.20367340170617, 19.726980680613963], [96.20431585579217, 19.72619545825387], [96.20580419870487, 19.724410313884903], [96.20755932999913, 19.7223138332169], [96.19870283796564, 19.71316405877434], [96.19047164275219, 19.704552962049604], [96.19033510767912, 19.704643986031158], [96.18901218696294, 19.705525933175352], [96.1881520456804, 19.707446277124063], [96.1865086029897, 19.711115413945265], [96.1813365650305, 19.720647338204117], [96.18258068624971, 19.728943171290382], [96.18636246585515, 19.729886576304523], [96.18917348576781, 19.73058186466136]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
