
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Loke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Loke Kone</div><div class="name-mm">တလုပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009004071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60822056312855, 19.81363139127575], [95.60857503990621, 19.814635743344923], [95.60860448640796, 19.815489690996515], [95.61001944644033, 19.815533907963527], [95.61678159909161, 19.81576708598226], [95.62517599517611, 19.816932975176712], [95.63613534586955, 19.812036243078182], [95.64639516430543, 19.80270913581802], [95.64942647315326, 19.799211470932676], [95.650248326699, 19.798572251708094], [95.64940078132105, 19.795747098050185], [95.6500281151055, 19.789787422151846], [95.65661512478823, 19.780063740849016], [95.66006546375019, 19.7737903967095], [95.66853447658491, 19.762184713154056], [95.66929869887593, 19.759673698082736], [95.66771414109479, 19.75944733332784], [95.6659841197714, 19.758829467605892], [95.66346679235863, 19.761214305096132], [95.64141207031088, 19.77297682322188], [95.62719902731334, 19.780818502272098], [95.6169068242906, 19.786209655551204], [95.6162182466748, 19.785107932984772], [95.6129859843158, 19.79111070619416], [95.6080849345721, 19.799442489679222], [95.60758039242126, 19.800855211298995], [95.60563440970031, 19.806303958960598], [95.60822056312855, 19.81363139127575]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
