
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sa Yit Kone (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sa Yit Kone (South)</div><div class="name-mm">ကျောက်စရစ်ကုန်း (တောင်)</div></div>
        <span class="pcode-badge">MMR010009029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1386894806351, 22.255494031824185], [96.1340366060046, 22.253943073613982], [96.12957565569201, 22.252381740824717], [96.12957565569201, 22.248589932879156], [96.1286834661691, 22.243236792144273], [96.12444556301239, 22.240783268932773], [96.11820023185527, 22.239668032253917], [96.10637871280738, 22.238552793776478], [96.10258690486182, 22.241452412199124], [96.10102557207256, 22.248589932879156], [96.10191776159547, 22.255281359247363], [96.10303300007297, 22.26018840387178], [96.10347909528406, 22.263980211817398], [96.10883223601894, 22.262641927083337], [96.11440842390971, 22.264426307028486], [96.11775413664412, 22.26598763981775], [96.12288423022312, 22.266210687873013], [96.12712213337983, 22.266433735028897], [96.13359051079351, 22.26286497513854], [96.13938974673948, 22.264677235865804], [96.13938974673948, 22.263980211817398], [96.13938974673948, 22.25773488066028], [96.1386894806351, 22.255494031824185]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
