
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Au Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Au Kone Ward</div><div class="name-mm">မအူကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17401058691911, 16.79265138755153], [96.17363166836685, 16.79319190977884], [96.17294120757072, 16.794068019423605], [96.1726017000085, 16.794486999175717], [96.17232045232709, 16.794838472217748], [96.17216110235307, 16.795070648391743], [96.17188415522963, 16.795473479917234], [96.17187031826063, 16.795759894203798], [96.17203140302689, 16.79606056184548], [96.17228611980863, 16.796505147994253], [96.17278099065027, 16.796279907391863], [96.17306327884728, 16.796115876446606], [96.17335319509391, 16.795942306392362], [96.17384834292676, 16.795666121894044], [96.17465639097969, 16.797000884883005], [96.17490450493904, 16.797347640980888], [96.17531172425674, 16.796978314597595], [96.17568779015943, 16.79677200292565], [96.17664337109477, 16.796217918022535], [96.17661822964766, 16.795839656874705], [96.17640495272644, 16.795439720266927], [96.17622331485416, 16.795146501709723], [96.17596626343237, 16.79479599004293], [96.17571258536759, 16.794466018891683], [96.1752465566833, 16.793934504273977], [96.17491340642863, 16.793577194631894], [96.17448806757034, 16.79312706056544], [96.17401058691911, 16.79265138755153]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
