
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Kyat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Kyat</div><div class="name-mm">မကြီးကြပ်</div></div>
        <span class="pcode-badge">MMR010021037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57346213836706, 21.818034201817], [95.5668704773907, 21.81777053588155], [95.5574890106094, 21.816011511422175], [95.55514364436374, 21.8207022439135], [95.55162559364629, 21.825686148197235], [95.54781437293502, 21.83037688068856], [95.54341681133684, 21.83418810229915], [95.54195095687123, 21.836533467645438], [95.54224412776432, 21.84796713067857], [95.54277183465251, 21.850077960929184], [95.54341681133684, 21.852657864069215], [95.5475212029412, 21.854710060321054], [95.55074608186624, 21.857934939246093], [95.55191876543876, 21.85998713459861], [95.55778218240187, 21.85998713459861], [95.56012754774821, 21.855882742994254], [95.56071389043376, 21.850898838710464], [95.5648182811388, 21.84650127711228], [95.57038852720882, 21.84005151836294], [95.57332023524071, 21.83418810229915], [95.57332023524071, 21.82861785622913], [95.57332023524071, 21.8215817556935], [95.57346213836706, 21.818034201817]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
