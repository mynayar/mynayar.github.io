
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aint Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aint Ma</div><div class="name-mm">အိုင့်မ</div></div>
        <span class="pcode-badge">MMR009021031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.57720542179283, 21.57639788925121], [94.57377582119727, 21.57906535668093], [94.56285877191488, 21.581248766717238], [94.56154872589303, 21.582313179109974], [94.55412513266879, 21.588344848436066], [94.53884126511235, 21.600899455245724], [94.52574080579359, 21.606357979437234], [94.52737836422017, 21.617275027820313], [94.5268325108118, 21.62491696204819], [94.51536960991962, 21.62819207710271], [94.511073988274, 21.629910325401227], [94.51022427912721, 21.630250208880113], [94.50827352820085, 21.642930093049415], [94.50827352820085, 21.657668108996063], [94.50903629898608, 21.672415014741205], [94.51427790490146, 21.676227091607018], [94.51646131493777, 21.65985151813311], [94.52410324916565, 21.65821396060585], [94.52770271101139, 21.658767723551648], [94.5268325108118, 21.654938845551328], [94.52792421582996, 21.64402179806757], [94.53938711672214, 21.635834011330587], [94.54921246098633, 21.64183838803126], [94.56504218195118, 21.62982963373065], [94.57268411617906, 21.62164184699367], [94.57377582119727, 21.611270651119696], [94.57633693030516, 21.61246583483046], [94.57486752621543, 21.601445306855453], [94.57978019789789, 21.59817019180099], [94.5825094604433, 21.5894365525549], [94.58414701797057, 21.57906535668093], [94.57868849287968, 21.57524439001662], [94.57720542179283, 21.57639788925121]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
