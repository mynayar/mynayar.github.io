
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Paw Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Paw Thaung</div><div class="name-mm">ရေပေါ်သောင်</div></div>
        <span class="pcode-badge">MMR013006006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8577964459493, 17.209847841604642], [95.85196770324694, 17.216231703430424], [95.84919211212633, 17.220395089661736], [95.84669407876879, 17.225113595915786], [95.84447360587228, 17.232885252852213], [95.84444822790346, 17.2348647299234], [95.84523393230018, 17.23510046471472], [95.84767231812305, 17.236235167219263], [95.8494569139055, 17.236949004992653], [95.851271252966, 17.237573612931953], [95.85418334768343, 17.23812467611299], [95.85608559727257, 17.238484643251752], [95.85917306788286, 17.231911317653214], [95.8610534486578, 17.227523762811472], [95.86178470809784, 17.22512105489284], [95.86272489803565, 17.22230048418004], [95.86230703614086, 17.218957585424278], [95.86679905623151, 17.215614685769197], [95.87111928602627, 17.212345874062862], [95.86640077977222, 17.212900993186338], [95.8577964459493, 17.209847841604642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
