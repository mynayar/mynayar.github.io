
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nauk Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nauk Pyin</div><div class="name-mm">အနောက်ပြင်</div></div>
        <span class="pcode-badge">MMR012008072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.77301038392216, 20.408286935893443], [92.78088184761924, 20.408827137962078], [92.7861003517499, 20.409470420323714], [92.79131890084665, 20.410113547102583], [92.79788027805245, 20.410758141575002], [92.79966894326719, 20.410933817841453], [92.80279951298718, 20.41180575103465], [92.80593011868007, 20.41267762936917], [92.80798297233639, 20.41313839881809], [92.81294230264518, 20.402843841370213], [92.81388505385223, 20.400629023410772], [92.81639043107361, 20.394742768164292], [92.81369082097467, 20.39311895587514], [92.80460765481945, 20.39009868260814], [92.80202498176754, 20.39322188508197], [92.79808884882135, 20.39831177716684], [92.79342442599653, 20.39680114815451], [92.78888241888859, 20.395637888577767], [92.78667555003665, 20.393088001210344], [92.78361080709311, 20.38937920428691], [92.78140248044019, 20.387987068148732], [92.77894696073372, 20.38775240894654], [92.77827044392592, 20.388562025417173], [92.77759392082282, 20.389371635592568], [92.77640903614815, 20.395390622679145], [92.77586209006347, 20.39816883802149], [92.77376416958083, 20.40522881196017], [92.77301038392216, 20.408286935893443]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
