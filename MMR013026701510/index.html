
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (10) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kayan</div><div class="name-mm">ခရမ်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (10) Ward</div><div class="name-mm">အမှတ် (၁၀) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013026701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.54369573303921, 16.89188819103066], [96.54393367913974, 16.90206038683084], [96.543681202463, 16.90400219357366], [96.5437570582481, 16.904577951213412], [96.54461851181134, 16.904990185440965], [96.54662439743925, 16.906082358042568], [96.54759521752953, 16.906660567067036], [96.54831619421446, 16.907031762983934], [96.54864455983324, 16.90713170034627], [96.5494440587313, 16.907288744772643], [96.5496324719843, 16.907302598688375], [96.54978939783848, 16.906230836409406], [96.54972396266083, 16.905677611725594], [96.54958714365296, 16.904850749026025], [96.54939678677249, 16.90469608406056], [96.54930160833226, 16.904446240654863], [96.54927781372226, 16.904267781079568], [96.54943247868749, 16.903607480650294], [96.54965852748319, 16.901965652556385], [96.55067574706322, 16.90013346758178], [96.55089108828417, 16.897203161353048], [96.55398914651386, 16.897331652247374], [96.55486002924209, 16.897417312843515], [96.5549742433704, 16.89519013734207], [96.55495996660432, 16.893105729500917], [96.55297563096184, 16.89301843500857], [96.54369573303921, 16.89188819103066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
