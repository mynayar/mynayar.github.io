
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Thoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Thoe</div><div class="name-mm">နသိုး</div></div>
        <span class="pcode-badge">MMR009025038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13178372733722, 21.452703062096703], [94.13234382061091, 21.452642061981635], [94.13908500107198, 21.45984815057176], [94.13963835482627, 21.460248449606297], [94.15555493321364, 21.45733688099233], [94.16421437389431, 21.454581603758072], [94.16506724595672, 21.45550008136371], [94.16469121782552, 21.451865142162603], [94.16384932738458, 21.449844604744783], [94.16368094911655, 21.447655690857516], [94.1641787868216, 21.445963042660367], [94.15904245374628, 21.444378430020606], [94.1544966173251, 21.441018463031696], [94.15034607071465, 21.436077335900393], [94.146590813915, 21.42935740372127], [94.13670855965239, 21.42548201008674], [94.13670855965239, 21.43133385367446], [94.13433681898908, 21.43884436727376], [94.13354623936749, 21.44398313931049], [94.13236036813652, 21.450307781678816], [94.13178372733722, 21.452703062096703]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
