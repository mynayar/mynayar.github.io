
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oh Ma Twayt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oh Ma Twayt</div><div class="name-mm">အိုမတွေ့</div></div>
        <span class="pcode-badge">MMR010031042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8798620785721, 21.056566614257918], [95.8863273101573, 21.056566614257918], [95.89642923462156, 21.05292992137879], [95.9018143372619, 21.052417054203715], [95.90491485073983, 21.052121767205847], [95.91097600613784, 21.051717690119347], [95.9146126981176, 21.051717690119347], [95.9146126981176, 21.044444305260527], [95.91259231268515, 21.035554611156442], [95.91097600613784, 21.025452686692176], [95.90774339034527, 21.00848145355627], [95.90159371917485, 21.01101098207124], [95.89621898661699, 21.01107137154662], [95.88770396086915, 21.011856445518617], [95.87333108136437, 21.013728542638205], [95.86491123086864, 21.015350763127287], [95.87066803769983, 21.021747214562367], [95.86733569338759, 21.022624147986107], [95.85965822964363, 21.028685303384066], [95.85544551290013, 21.033161314642996], [95.8584459992835, 21.03878722694901], [95.8584459992835, 21.045252459433527], [95.86289084633557, 21.050505458859902], [95.86895200083421, 21.052121767205847], [95.87380092407346, 21.05333399756597], [95.8798620785721, 21.056566614257918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
