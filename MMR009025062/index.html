
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taunt Tet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taunt Tet</div><div class="name-mm">တောင့်တက်</div></div>
        <span class="pcode-badge">MMR009025062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.08394018928834, 21.357612240112815], [94.08176322829041, 21.349706436702718], [94.07721739096985, 21.333499540071784], [94.07602768682835, 21.3289106809832], [94.06918508532351, 21.32941135874728], [94.06410663891029, 21.33118881481198], [94.0610095428562, 21.332272799150417], [94.05767595388221, 21.330969200368372], [94.05965400462867, 21.337380909701267], [94.06101049523824, 21.338440667203088], [94.06792807322205, 21.353856983313165], [94.0718809740278, 21.36709920366536], [94.0748456503066, 21.37243562060746], [94.07445035959648, 21.37974848930139], [94.07445416103076, 21.37995375775978], [94.07742951496022, 21.383970485249733], [94.08066443031925, 21.38754591721039], [94.08184527883662, 21.388216853724884], [94.08233871615886, 21.38849721557409], [94.08256187573005, 21.38782773596131], [94.08314674442676, 21.3860731307704], [94.08650670961703, 21.381329649443842], [94.08887845117965, 21.37619087740711], [94.08789022575337, 21.369866235038785], [94.08743907185573, 21.368625560920975], [94.08551848509006, 21.36334394686571], [94.08394018928834, 21.357612240112815]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
