
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Oe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Oe</div><div class="name-mm">မဲအိုး</div></div>
        <span class="pcode-badge">MMR005010037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39491463969892, 22.685964570108865], [95.38909919976834, 22.68432621038636], [95.3804930403216, 22.676513670269742], [95.37725339992454, 22.667786999870202], [95.37268068006938, 22.672119150178673], [95.3712766800748, 22.673278799876755], [95.3712766800748, 22.678894080397527], [95.37187659532867, 22.688729267741564], [95.37849976405295, 22.68792645913885], [95.38013316941027, 22.693526713786866], [95.38316664202699, 22.69772690477288], [95.38496086235398, 22.69917008013516], [95.38552907830439, 22.699108288616685], [95.390432227965, 22.69857508777011], [95.39287700437029, 22.69723659888996], [95.39483779622736, 22.695443859746376], [95.39582943278214, 22.693193208299988], [95.39730623019841, 22.69094621529564], [95.39636333509992, 22.687326638313777], [95.39498186582051, 22.686027723200937], [95.39491463969892, 22.685964570108865]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
