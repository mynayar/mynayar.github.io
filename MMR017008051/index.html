
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mway Lone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mway Lone</div><div class="name-mm">မွေးလုံး</div></div>
        <span class="pcode-badge">MMR017008051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47490411962946, 17.513179019795984], [95.4784310403603, 17.513655659581048], [95.48052803993716, 17.515276020272154], [95.48214839972894, 17.517944879852394], [95.48567495983161, 17.520899759816132], [95.4916801198417, 17.52347331014522], [95.49644580003371, 17.5254749995716], [95.49761580002922, 17.524378170216437], [95.49797112037095, 17.524045260080754], [95.49549288019233, 17.519755949877208], [95.4923472000633, 17.516610449612585], [95.49199763987923, 17.516040929645214], [95.49162863994985, 17.51543982009167], [95.48901108039712, 17.51117733036955], [95.4834829199009, 17.504791109622033], [95.48148095977854, 17.501073750253397], [95.48073107987551, 17.500420439551704], [95.47852644044292, 17.498500109992108], [95.47679015983806, 17.497803419592174], [95.47606915087067, 17.496853665364426], [95.47166303761912, 17.500231685344033], [95.47136929655585, 17.502141000007214], [95.47151616663785, 17.506987727102], [95.46933724421848, 17.509578878962145], [95.47033283958893, 17.51017572033328], [95.47164467975824, 17.510832899918455], [95.47328375983773, 17.51165397015467], [95.47490411962946, 17.513179019795984]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
