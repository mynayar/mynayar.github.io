
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kan (Mone Koe)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kan (Mone Koe)</div><div class="name-mm">မန့်ကန် (မုံးကိုး)</div></div>
        <span class="pcode-badge">MMR015009047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.33127367743833, 24.103223021425322], [98.3322559916208, 24.10306846573718], [98.33519369813075, 24.1026062555743], [98.3435746844242, 24.101287619228287], [98.3536413410751, 24.10429480106427], [98.35533297034038, 24.103324976666386], [98.35857836459991, 24.101464366587322], [98.36103654540028, 24.099592989824657], [98.36174851168454, 24.099741414834455], [98.34957615631464, 24.071351378163627], [98.34345747668124, 24.061453515267544], [98.34134635505029, 24.05803846390404], [98.3346981411064, 24.0472840003564], [98.32550877940668, 24.028905275158365], [98.32539738757941, 24.028397832693884], [98.3124964752322, 24.02497514158955], [98.30021845581712, 24.018693365406534], [98.28993918414608, 24.01755122281071], [98.28657605244291, 24.020710528568088], [98.29312721604822, 24.037219460709593], [98.30931799772748, 24.068288256697713], [98.31114045316946, 24.070978548920948], [98.32733961383218, 24.09489159497116], [98.32769672292551, 24.095418755071535], [98.32782863098657, 24.095706554314063], [98.32791503874807, 24.095895080993216], [98.33127367743833, 24.103223021425322]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
