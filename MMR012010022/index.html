
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Taung (a) Pyin Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Taung (a) Pyin Shey</div><div class="name-mm">ကျောက်တောင် (ခ) ပြင်ရှည်</div></div>
        <span class="pcode-badge">MMR012010022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.56507578102253, 20.894043760111515], [92.55924035006217, 20.89402880168791], [92.55812292982938, 20.894025930152623], [92.5539015589099, 20.894014965618226], [92.55497631800273, 20.90848566977786], [92.55594803727217, 20.915838818206964], [92.551350405297, 20.916876891255583], [92.55355932730117, 20.925750081001468], [92.55229876917292, 20.932047296745395], [92.55179437001425, 20.934612846705534], [92.55128996456028, 20.93717839756505], [92.55127884174522, 20.94091200318644], [92.55549670171149, 20.94255650797652], [92.55698158493226, 20.944427186865255], [92.56244094009736, 20.946308092844276], [92.56592597310521, 20.94375011967236], [92.5696752826882, 20.935592276762236], [92.57315135035458, 20.936067710556472], [92.57911000192513, 20.937015920648264], [92.58286359587828, 20.926990954768826], [92.5861250942977, 20.91509786587386], [92.58016725661366, 20.914149912988137], [92.57371082399538, 20.913900568756276], [92.56824513940171, 20.914586900764903], [92.56677179358348, 20.90874933931059], [92.56507578102253, 20.894043760111515]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
