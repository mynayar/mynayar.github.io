
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (6) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">South Okkalapa</div><div class="name-mm">တောင်ဥက္ကလာပ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (6) Ward</div><div class="name-mm">အမှတ် (၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013011701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17998356289115, 16.84629631002673], [96.1792736056924, 16.845672607704728], [96.17869758632463, 16.84514808621526], [96.17802238432563, 16.844572066847434], [96.17767906183929, 16.84428978044906], [96.17718315138137, 16.843852996818384], [96.17663001975967, 16.843423843035964], [96.17612266542875, 16.843023300285154], [96.17573356655089, 16.842713037776548], [96.17497062669315, 16.842155456309285], [96.17384147660295, 16.841241836841334], [96.17357940696411, 16.841052246264212], [96.17296028129203, 16.841974258205482], [96.17248916604223, 16.84268379272288], [96.1720085143815, 16.84344482421932], [96.17123222318861, 16.84464073188434], [96.17099952720645, 16.84499931316782], [96.17073249870589, 16.845403671742133], [96.17045211797091, 16.845840453574112], [96.16998551102256, 16.846565766696813], [96.17101097107951, 16.84729067512461], [96.17139244100838, 16.847532272596368], [96.17222404500376, 16.848083495856713], [96.17253303497165, 16.848283767681778], [96.17323875456492, 16.84873771667236], [96.17357826212714, 16.84895896968078], [96.17411994897651, 16.849332809761393], [96.17460060243593, 16.849660872551283], [96.17534017520899, 16.85016250629468], [96.17659299557033, 16.85113426333561], [96.17998356289115, 16.84629631002673]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
