
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Taw</div><div class="name-mm">တောင်တော်</div></div>
        <span class="pcode-badge">MMR010013067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3225413956689, 21.482231003757875], [96.32082000783714, 21.482350514664574], [96.31257944258726, 21.48588218471508], [96.30248895570082, 21.486554883900794], [96.29458473959414, 21.485545835571884], [96.29223029289375, 21.47898701873595], [96.29499626216784, 21.472249985048848], [96.29593914557518, 21.468005697604895], [96.28938277939181, 21.464593906283824], [96.28953735576442, 21.465410044637906], [96.29065250341034, 21.467101717070648], [96.29123487738775, 21.467985156190082], [96.2873532235725, 21.470241930220936], [96.28432607768639, 21.472932726064528], [96.27104026899326, 21.476128046971837], [96.2722174932428, 21.48386408805726], [96.2742387797959, 21.48984709686607], [96.27642186337835, 21.496309021644095], [96.28281250519302, 21.501354265986663], [96.29744371225758, 21.501858791050438], [96.31493389018692, 21.492104653307138], [96.32721064965182, 21.486891233943368], [96.32829267616614, 21.486450408759424], [96.32348644014718, 21.483086044085724], [96.3225413956689, 21.482231003757875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
