
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Du (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thar Du (West) Ward</div><div class="name-mm">သာဓု (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11999756923251, 16.81432478805857], [96.11972084064433, 16.81428947437979], [96.11961021414015, 16.814619827742888], [96.11992073025755, 16.814775467114146], [96.11984920537657, 16.815052032925053], [96.11971092202151, 16.815351485582653], [96.1195926665684, 16.815610886033596], [96.11941909831279, 16.81599235596252], [96.11922073394976, 16.81637382499207], [96.11906454329409, 16.81665950363322], [96.11992263861896, 16.81677055371813], [96.12192993172101, 16.81690578477418], [96.12193107565867, 16.816312789803476], [96.12191963178566, 16.81562232990666], [96.12191200283672, 16.814924240161588], [96.1219071833699, 16.8145068324244], [96.12075042679083, 16.814447403424992], [96.11999756923251, 16.81432478805857]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
