
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maw Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maw Lel</div><div class="name-mm">မောလယ်</div></div>
        <span class="pcode-badge">MMR009023021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.12512640236162, 21.95157081284276], [94.12402142514873, 21.953236786248738], [94.12018036583129, 21.95357702406045], [94.11966110987237, 21.953623242918354], [94.11943789544256, 21.953723336562803], [94.11771155594363, 21.9544993921333], [94.11424634399361, 21.954088853417886], [94.11207233906725, 21.95508526627208], [94.10855781639015, 21.954583106425275], [94.10710714877598, 21.95208856063863], [94.10614888606233, 21.951623201049927], [94.10303506081948, 21.950064131854276], [94.10571286865405, 21.946716862393316], [94.10598436498651, 21.943941969146636], [94.10633647025196, 21.94034319977891], [94.10097366540242, 21.942971278701577], [94.09868381610528, 21.94504308377134], [94.09449988216392, 21.94336935101478], [94.09533672381082, 21.941026243866133], [94.09526608026545, 21.937021196770843], [94.09108358973594, 21.936555698686618], [94.09275633503688, 21.946189215759773], [94.09553792373623, 21.961835650395017], [94.09831951243564, 21.975917440937224], [94.10724850961111, 21.985015159022396], [94.11674753397159, 21.9753958926064], [94.12512640236162, 21.95157081284276]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
