
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Paw Hkon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Paw Hkon</div><div class="name-mm">အင်းပေါခုံ</div></div>
        <span class="pcode-badge">MMR014002026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.87295960270359, 20.443198945974643], [96.87116241011717, 20.445794891221283], [96.86322996878806, 20.455462552854556], [96.8692115179972, 20.457954864725252], [96.89610509807187, 20.46375544066109], [96.90086789773534, 20.46413646542561], [96.90100503355552, 20.46267366865493], [96.9007874839553, 20.4610420385593], [96.9007874839553, 20.460389386161296], [96.9008962596547, 20.45951918326375], [96.9012225858537, 20.458213877568426], [96.90231033925079, 20.456473472672656], [96.90437707124488, 20.45353653868034], [96.90535604894256, 20.4504908280893], [96.90589992564111, 20.44864164659475], [96.90579115084103, 20.445487162102893], [96.90513849844302, 20.443746756307803], [96.90307176644893, 20.44102737191571], [96.9027411891546, 20.4380837029006], [96.89987470175612, 20.437964265738344], [96.88123035729524, 20.43871003933691], [96.87265395821368, 20.44467622992414], [96.87295960270359, 20.443198945974643]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
