
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aye Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aye Chan Thar</div><div class="name-mm">အေးချမ်းသာ</div></div>
        <span class="pcode-badge">MMR010018039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3104608046225, 21.200363310818204], [95.31232414594263, 21.200363310818204], [95.32090262155879, 21.200363310818204], [95.33095770483425, 21.200750045378356], [95.34255972365236, 21.19958984259722], [95.34913420218174, 21.19804290705457], [95.35657433663641, 21.18751423359504], [95.35847934804355, 21.184818416836492], [95.36529864271824, 21.17692239085568], [95.3656575531536, 21.17387165395371], [95.36332463622307, 21.16453998803007], [95.3609917201918, 21.160950886374337], [95.35273678377558, 21.16077143025734], [95.34251672616602, 21.16202761588181], [95.34178625723007, 21.164010317921907], [95.34062605534825, 21.17097153011207], [95.33714544880348, 21.177546006842817], [95.32438322810356, 21.175225603079184], [95.3162618149309, 21.17290519931555], [95.31720467135858, 21.181229314281495], [95.31594848483479, 21.19002261455205], [95.3104608046225, 21.200363310818204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
