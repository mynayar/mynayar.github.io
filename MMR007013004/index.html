
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khaung Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khaung Yan</div><div class="name-mm">ခေါင်ရမ်း</div></div>
        <span class="pcode-badge">MMR007013004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5001009782776, 18.843373003961005], [96.50003973534558, 18.842146001336914], [96.49833341655398, 18.842145995041676], [96.49577050160741, 18.84214598514916], [96.49482092184815, 18.84350308190176], [96.49007557712622, 18.845761470215734], [96.48033691401741, 18.847460526082443], [96.48037821178508, 18.84832785834402], [96.48300462876068, 18.85071550981297], [96.48539228022963, 18.853580692295168], [96.48467598460905, 18.858117229726417], [96.48324339426728, 18.86002735198076], [96.4815720384189, 18.862653768056987], [96.48111497327744, 18.86539615620768], [96.48348215887461, 18.86814536661541], [96.4863473413568, 18.86910042774258], [96.4916001753079, 18.87148807921153], [96.49446535689077, 18.87387573068048], [96.49766694157614, 18.87467327105469], [96.49762168229483, 18.868214754707196], [96.50063468724107, 18.856270569930928], [96.501462844135, 18.85298758041256], [96.50051325718113, 18.851633020647455], [96.50769868384725, 18.84833764386724], [96.5120667341925, 18.8503536657891], [96.51425075756646, 18.84800163916435], [96.50853869470507, 18.842625578307832], [96.50010720698208, 18.8434978001834], [96.5001009782776, 18.843373003961005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
