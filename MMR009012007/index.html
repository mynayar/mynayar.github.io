
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Mun Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Mun Taw</div><div class="name-mm">အုန်းမွန်းတော</div></div>
        <span class="pcode-badge">MMR009012007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01544888595737, 19.4298239328283], [95.01543286993109, 19.429199306003227], [95.01606505915521, 19.423193503877144], [95.01985819809744, 19.414975037667887], [95.02428352536447, 19.407704856194187], [95.017961627727, 19.40201514868022], [95.00626611898628, 19.39190011389917], [95.00334407866637, 19.386932645625166], [95.00310517016754, 19.386526500997263], [94.9967832734294, 19.389687449815995], [94.97212787480163, 19.397273725901755], [94.9718296722017, 19.397452647821467], [94.97276006492513, 19.406756572358006], [94.9743405388848, 19.41339456370821], [94.98034634101089, 19.41623941701556], [94.98477166917723, 19.4181359855873], [94.98571995391279, 19.419400365834292], [94.98319119521756, 19.426986641920053], [94.97794401980076, 19.43748099095501], [94.98192681497062, 19.43899824617216], [94.99046137579194, 19.4402626264191], [94.99551889408178, 19.44310747972645], [95.00089250608437, 19.449113281852533], [95.00120860069643, 19.451958135159884], [95.00310517016754, 19.451009851323647], [95.00531783425072, 19.44626842764586], [95.00942706690569, 19.438049962335924], [95.01544888595737, 19.4298239328283]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
