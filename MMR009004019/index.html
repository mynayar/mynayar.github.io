
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pwint Hla Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pwint Hla Gyi</div><div class="name-mm">ပွင့်လှကြီး</div></div>
        <span class="pcode-badge">MMR009004019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55923537980897, 19.97720909172625], [95.55923537980897, 19.981183656300743], [95.55962696171497, 19.982201769795893], [95.5637752402352, 19.980944716325666], [95.56703211793797, 19.979035512279097], [95.57113090586665, 19.98127797000234], [95.574527540014, 19.982139416201164], [95.57787269966542, 19.984289875977026], [95.5786112418154, 19.984593981726903], [95.57978422036553, 19.983811996026873], [95.58241256009165, 19.983334116076662], [95.58432407989244, 19.981183656300743], [95.58575771974301, 19.97712167582472], [95.58595969668272, 19.973688068749425], [95.5840851399173, 19.97162605639744], [95.58193468014144, 19.9706702955977], [95.57858951959071, 19.96684725599613], [95.576916939765, 19.961829515619684], [95.5733328401385, 19.961112695694396], [95.57202183633876, 19.962185335085223], [95.57070450041243, 19.963263156369635], [95.5685540397372, 19.967086195971206], [95.56592570001112, 19.969714535697335], [95.56281948033478, 19.9706702955977], [95.5594743197841, 19.97258181629786], [95.55780173995839, 19.97329863622315], [95.55779157222332, 19.973400312674357], [95.5590291229957, 19.975566025851435], [95.55923537980897, 19.97592697594922], [95.55923537980897, 19.97720909172625]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
