
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Gyi (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Gyi (West) Ward</div><div class="name-mm">ဈေးကြီး (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12167306376097, 16.803693771750204], [96.12163352956378, 16.803970337561054], [96.12162208569077, 16.80427360514284], [96.12161064181771, 16.804630279863602], [96.12161064181771, 16.80504798887364], [96.12161445584252, 16.805566787976943], [96.12162208569077, 16.8058605191477], [96.12163352956378, 16.80617523240113], [96.12163734358859, 16.80656623874097], [96.12164268556154, 16.806943893745768], [96.12172279357213, 16.807254409863162], [96.12171618175643, 16.80775006581291], [96.12162399315281, 16.808034897292714], [96.12150669098105, 16.808318137871822], [96.12145042399794, 16.808628082919768], [96.12139129627138, 16.808881760085228], [96.12135921835329, 16.809202193926183], [96.12192367064097, 16.809291951662317], [96.12191963178566, 16.80882326727999], [96.12191677104221, 16.808278083866526], [96.12195396430405, 16.807888666628685], [96.12203025828984, 16.807453156438044], [96.12211036719975, 16.80696296656771], [96.12220223744339, 16.80648167908629], [96.12224006742525, 16.806131362572387], [96.1222591402472, 16.805852890198764], [96.1222705841202, 16.80517387417501], [96.1222705841202, 16.80473232233885], [96.12226041188853, 16.8042926788641], [96.12226113044687, 16.803801577980494], [96.12167306376097, 16.803693771750204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
