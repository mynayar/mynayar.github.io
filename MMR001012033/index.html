
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Hsa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Hsa</div><div class="name-mm">ကောင်းဆာ</div></div>
        <span class="pcode-badge">MMR001012033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.72026373568292, 24.298222113259953], [97.72236433164863, 24.297990277929046], [97.72983241793179, 24.29243843738402], [97.73853437136421, 24.289854658166007], [97.74354759264736, 24.284896216387324], [97.74970553398327, 24.280899752421703], [97.75047449929878, 24.27961536495718], [97.75480167185975, 24.27166859832721], [97.75615436103499, 24.271115890286183], [97.762805063403, 24.26584492240528], [97.76416895992963, 24.265542862613074], [97.76954562962715, 24.262579416606854], [97.75823385980482, 24.25417146504111], [97.74554893943207, 24.247854126067125], [97.73738859460803, 24.238449130323147], [97.73233940134236, 24.240779527353368], [97.73283848280977, 24.24626943698496], [97.73184031807625, 24.25425476024901], [97.73034307007669, 24.2572492562482], [97.72784765644423, 24.263238249145957], [97.72580049729515, 24.26589955621961], [97.72285682917936, 24.269726324410385], [97.71686783718098, 24.27621439877555], [97.71986233318017, 24.284698805305652], [97.72003260721908, 24.294282890243267], [97.72026373568292, 24.298222113259953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
