
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Pan Taw (a) Tha Man Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Pan Taw (a) Tha Man Kyin</div><div class="name-mm">သင်ပန်းတော (ခ) သမန်းကျင်း</div></div>
        <span class="pcode-badge">MMR009010093</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59317249891177, 20.780224147326578], [94.59301980661883, 20.780185973803725], [94.58851919800264, 20.788437089899844], [94.58439363995456, 20.793687799652275], [94.5738922204497, 20.80043871257658], [94.5712668646741, 20.803814168589042], [94.570891814106, 20.811690235016385], [94.56864150979789, 20.81769104590512], [94.56714130662607, 20.825567112332408], [94.5697666624016, 20.828942568344928], [94.57651757532591, 20.824441958829368], [94.58814414833381, 20.814690641360073], [94.5937699086544, 20.8026890168847], [94.59827051727063, 20.795563053392243], [94.6053720084115, 20.79355319812163], [94.60464637962679, 20.789562241604244], [94.6061239045946, 20.788119896316232], [94.60277112588682, 20.78281132867994], [94.59752041613433, 20.781311126407388], [94.59317249891177, 20.780224147326578]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
