
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Pon Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Pon Lay</div><div class="name-mm">ပျဉ်ပုံလေး</div></div>
        <span class="pcode-badge">MMR007007011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58988818788964, 17.78694141271609], [96.58860006644, 17.784365168917475], [96.58168464233245, 17.785945837130726], [96.57626306318986, 17.786198004334494], [96.57841915182246, 17.79331310041931], [96.57841915182246, 17.79809186484772], [96.57873773665727, 17.805419304357486], [96.57841915182246, 17.810198068785894], [96.57841915182246, 17.816569755589796], [96.57555189280566, 17.822304273623388], [96.57141029714757, 17.830906050673775], [96.56981737477207, 17.8369591544415], [96.56745384761706, 17.843408104700302], [96.57109171321207, 17.84428659305189], [96.57523330887017, 17.843012256410532], [96.57905632059277, 17.840782166164104], [96.58319791715019, 17.835047648130512], [96.58574659223149, 17.830906050673775], [96.5884267499946, 17.82733250728944], [96.59245461468879, 17.822830493032882], [96.592948828126, 17.819741664446326], [96.59371119961224, 17.81497683411368], [96.59339261567675, 17.807649394603914], [96.59243686297089, 17.800321955094205], [96.59052535665995, 17.79331310041931], [96.59052535665995, 17.788852919027022], [96.58988818788964, 17.78694141271609]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
