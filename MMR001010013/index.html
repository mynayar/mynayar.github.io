
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hseng Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hseng Kin</div><div class="name-mm">ဆိုင်ကင်</div></div>
        <span class="pcode-badge">MMR001010013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.30881861698566, 24.324083927231527], [97.30107438757301, 24.325099492947288], [97.29973285898433, 24.32478990942684], [97.297647394112, 24.32430864802575], [97.29618708126884, 24.32438166398265], [97.29237509523449, 24.324572262699803], [97.2890140049924, 24.32635166309882], [97.28789364127857, 24.326944796565158], [97.28841339006595, 24.329296444575334], [97.28913682720287, 24.33190885730795], [97.28998083734581, 24.334280124028567], [97.29026217406016, 24.333998787314215], [97.29066408378048, 24.33347630458786], [97.29102580279863, 24.33331554087954], [97.29134733021516, 24.33331554087954], [97.29174923993554, 24.33331554087954], [97.29239229566798, 24.33359687759389], [97.29243248637022, 24.334320314730803], [97.2922315310604, 24.335164324873745], [97.29122675720913, 24.336651390749125], [97.29070427448272, 24.33725425488001], [97.29038274706619, 24.337897310612448], [97.29014160105413, 24.338580557047123], [97.28990045504202, 24.33902265746974], [97.28937797321493, 24.340348959636856], [97.28868448620011, 24.341970849175425], [97.29422039975168, 24.341970849175425], [97.29709328402788, 24.343387483745403], [97.30028354265141, 24.331689866094507], [97.30687391669795, 24.326417567216993], [97.30881861698566, 24.324083927231527]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
