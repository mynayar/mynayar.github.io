
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009023702</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.36376803007062, 21.946817004601144], [94.37334905641387, 21.943417285779162], [94.40734624643221, 21.944962613333985], [94.42118411025854, 21.94949333844687], [94.42088567383485, 21.947915646989543], [94.42001272710576, 21.94330077860809], [94.42033685086506, 21.941680263233593], [94.42135187968557, 21.93660621000862], [94.42419693174304, 21.932087338859674], [94.42202131972817, 21.92940944289154], [94.419008973985, 21.92405367973356], [94.41905805718363, 21.922189904940183], [94.41917646282354, 21.917693776746432], [94.41893517741659, 21.915360772581664], [94.4186744873378, 21.912840155448862], [94.41816678586855, 21.908904661021325], [94.41733583208304, 21.902463444032776], [94.41567451896395, 21.890832047061394], [94.41499314761575, 21.886061541107267], [94.41375319925078, 21.882728829871667], [94.41151424528624, 21.876711008306415], [94.39591082792242, 21.88685832425233], [94.39180098642646, 21.889657780682057], [94.37458531665908, 21.90138439607307], [94.35449606923828, 21.926418690769992], [94.3563504614047, 21.932599998291323], [94.36376803007062, 21.946817004601144]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
