
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lel</div><div class="name-mm">ကူလည်</div></div>
        <span class="pcode-badge">MMR010020010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31702123664081, 20.95664836912698], [95.31927635861712, 20.957360512577623], [95.32546310793612, 20.95839163836348], [95.33268098124233, 20.95839163836348], [95.33749289558074, 20.95839163836348], [95.34333593660426, 20.95839163836348], [95.35021010161495, 20.95804793006795], [95.35433460116099, 20.955641971999455], [95.35742797492117, 20.952548598239275], [95.35742797492117, 20.949455223579776], [95.35674055922948, 20.945330724933058], [95.35674055922948, 20.941893641978027], [95.35845909980765, 20.936738018444828], [95.36155247356788, 20.93605060185382], [95.35467830855714, 20.93364464378533], [95.34917897672847, 20.932269810603316], [95.34402335319527, 20.93192610320716], [95.33714918818453, 20.93192610320716], [95.33199356375201, 20.93364464378533], [95.32649423192333, 20.93914397561406], [95.32374456555931, 20.945674433228533], [95.32202602498114, 20.94979893187525], [95.31996377520812, 20.95289230563543], [95.3172141088441, 20.95529826370398], [95.31702123664081, 20.95664836912698]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
