
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Yay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Yay</div><div class="name-mm">စာရေး</div></div>
        <span class="pcode-badge">MMR005001025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97686688000255, 22.00032557996161], [95.96750184023779, 22.000660019844076], [95.95507500011121, 21.993350129704766], [95.94593747983089, 21.9845782800636], [95.94045503996819, 21.979704960015965], [95.93935848040962, 21.978730350325463], [95.93314523976107, 21.97946133007639], [95.92546967988187, 21.97946133007639], [95.91742907978823, 21.98055779970275], [95.91730703998797, 21.980923289578186], [95.91633252022967, 21.983847300312732], [95.9115808802535, 21.99188817020297], [95.91011891985232, 21.998467079692034], [95.90865696035053, 22.007238930232518], [95.90829156040724, 22.01345234984609], [95.90829156040724, 22.01735097027114], [95.90829156040724, 22.018203809957924], [95.91450515988527, 22.017838320082433], [95.91788375992763, 22.018016160117725], [95.918525279618, 22.017107340331563], [95.92583543955396, 22.015279890054956], [95.93972424008166, 22.015279890054956], [95.953247280038, 22.01893478970885], [95.96530872022134, 22.022224290318775], [95.97627359994675, 22.023686249820628], [95.98139063986622, 22.020396750109967], [95.98541112022707, 22.015279890054956], [95.98906584001656, 22.00614245970678], [95.99038919960196, 22.00557536970757], [95.98760387961539, 22.00321853980381], [95.98309343961063, 22.00188213015622], [95.97773556034787, 22.00029452996864], [95.97686688000255, 22.00032557996161]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
