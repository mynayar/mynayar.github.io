
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Pyoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kale</div><div class="name-mm">ကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Pyoke</div><div class="name-mm">ကျောက်ပြုတ်</div></div>
        <span class="pcode-badge">MMR005027017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.19273100003568, 22.663205189667792], [94.18784849611126, 22.667513203071906], [94.18683678129247, 22.668405895315857], [94.18480986228536, 22.670697947052645], [94.17685840928823, 22.679689685430674], [94.17634861509657, 22.68469596934358], [94.17445600803842, 22.686943442585857], [94.17277820674889, 22.688935834820995], [94.16474492084149, 22.692283001759165], [94.15521971991421, 22.69478961015244], [94.15830383965056, 22.698402569922735], [94.16795436020561, 22.704192809950257], [94.17781908038631, 22.712556420442525], [94.18894272013051, 22.718013299774043], [94.18918500018765, 22.71813210021628], [94.19004287967522, 22.710197430367145], [94.19175827982082, 22.698402569922735], [94.19390279957457, 22.68617885966671], [94.1945461197077, 22.677815250073763], [94.1943849791835, 22.671039419633587], [94.1943319200821, 22.66880832034775], [94.1940195495626, 22.667715039717336], [94.19273100003568, 22.663205189667792]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
