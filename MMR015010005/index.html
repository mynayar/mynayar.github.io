
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Hkan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Hkan</div><div class="name-mm">နောင်ခန်</div></div>
        <span class="pcode-badge">MMR015010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.7527551791083, 23.894320939559748], [97.75675377356788, 23.888476840034173], [97.76144747741921, 23.884956562595335], [97.761753049064, 23.88472738386173], [97.76389215759707, 23.883123052686756], [97.76732162329432, 23.881408319838158], [97.77207062465965, 23.876170859797412], [97.77171820822878, 23.870581123620013], [97.77171820822878, 23.86384775467019], [97.76404444609437, 23.86564374216499], [97.75785784786143, 23.866357579938438], [97.74992988155884, 23.865891229296835], [97.74976768073395, 23.865881686590626], [97.74548464959696, 23.863264280821966], [97.74298045768205, 23.85957389212149], [97.74190689288884, 23.860915847888123], [97.73617791198109, 23.862272711716344], [97.72984588078282, 23.86528796496765], [97.72729662204154, 23.867958617796035], [97.72774315612179, 23.868660313822488], [97.73135350785816, 23.87433372382236], [97.73361494757182, 23.87961041678733], [97.73889163963753, 23.885791684738535], [97.74537443408292, 23.890465327412983], [97.7527551791083, 23.894320939559748]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
