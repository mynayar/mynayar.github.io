
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Chaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Chaing</div><div class="name-mm">ညောင်ချိုင်း</div></div>
        <span class="pcode-badge">MMR010020089</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22745454708974, 20.841153774427198], [95.24689064298883, 20.8433133398388], [95.26362728077447, 20.849792038771625], [95.27766446224518, 20.85681062860766], [95.27983388602507, 20.858546168171188], [95.28206242314235, 20.85307612186557], [95.28625948358837, 20.849228816756522], [95.29290482869493, 20.84468200097359], [95.29495683429053, 20.841945995311505], [95.29365774470921, 20.841166542102314], [95.28959087371993, 20.831468618282145], [95.29178072829802, 20.826150401819632], [95.29584759928736, 20.820519348988796], [95.29928879843936, 20.810195752432094], [95.29835028933445, 20.803000518659076], [95.29496404055806, 20.799257823589755], [95.28695899426225, 20.80376066342393], [95.2757668333727, 20.811105519204375], [95.26982099714138, 20.817401108974025], [95.26772246691837, 20.821598170319362], [95.26562393669536, 20.824745964754527], [95.26037761203725, 20.826844494977536], [95.25303275625674, 20.827544004752042], [95.24988496092226, 20.82789376008901], [95.2379932902582, 20.83418935075798], [95.22745454708974, 20.841153774427198]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
