
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Gaung</div><div class="name-mm">ကျွဲခေါင်း</div></div>
        <span class="pcode-badge">MMR017005062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17728096004834, 17.22675824999328], [95.17632263977805, 17.223061770184586], [95.17473364384267, 17.218195675290247], [95.17087329316803, 17.211985545396658], [95.16076110384193, 17.204027460798727], [95.15606132237218, 17.203996685998334], [95.15323513809119, 17.204881313122144], [95.15323420189696, 17.205010855066973], [95.15323145986406, 17.20538802443781], [95.1532154582269, 17.20759155860361], [95.15180339940741, 17.208035544904533], [95.15131600103268, 17.21028917670418], [95.152719251892, 17.21120227726334], [95.15297038667404, 17.216482449705325], [95.15124920568633, 17.22164599716507], [95.14811562323746, 17.226033012413666], [95.14310189293809, 17.22979330991336], [95.147488079911, 17.230495589599855], [95.14811987972871, 17.230728600344662], [95.14962576032065, 17.231960790258313], [95.15126844038627, 17.233192890239764], [95.15250072023213, 17.233740539594294], [95.15619720004082, 17.234151300442193], [95.1583878001569, 17.23346675988313], [95.16194747959258, 17.231960790258313], [95.16523320035196, 17.230044059785598], [95.16769740031481, 17.229222629820583], [95.17016196000651, 17.22840119985551], [95.17728096004834, 17.22675824999328]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
