
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Ton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Ton</div><div class="name-mm">နောင်တုံ</div></div>
        <span class="pcode-badge">MMR015014019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.59662872873292, 22.62265912032217], [97.59847059604124, 22.61995110066283], [97.60392167024895, 22.615365485428867], [97.60671032492161, 22.61387918037991], [97.60470763005316, 22.607107526391303], [97.60357960141755, 22.58116284169182], [97.61260383769701, 22.561986336000643], [97.62670421003133, 22.545065890278636], [97.64588071572251, 22.536041653099858], [97.65490495380061, 22.526197029169623], [97.65490495380061, 22.520249236013456], [97.63572844810943, 22.496560612182577], [97.62323270462565, 22.479873941629137], [97.62049829975678, 22.479794631317247], [97.61055906265068, 22.478552226903787], [97.6006198264439, 22.478552226903787], [97.58943818492435, 22.485592519179477], [97.5844685663713, 22.49180454214593], [97.56873144140297, 22.496774160699033], [97.56251941843647, 22.504228588978265], [97.55232209299027, 22.52437967738024], [97.55164986864656, 22.526061479753537], [97.55886080098526, 22.559821753271365], [97.56902165982183, 22.57621023471461], [97.59360438333567, 22.620786906290732], [97.59662872873292, 22.62265912032217]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
