
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Yin</div><div class="name-mm">အင်းရင်း</div></div>
        <span class="pcode-badge">MMR010015036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11550806004897, 21.476366666788294], [96.11535031266686, 21.475209519004125], [96.11119966083572, 21.468416794799282], [96.11209994065979, 21.461889758205814], [96.11007430858251, 21.455587791343532], [96.11089691126352, 21.45357698728816], [96.11209994065979, 21.45063624556633], [96.108948958128, 21.450411175835143], [96.10150846214589, 21.449630962698848], [96.09782891297402, 21.45434078509919], [96.09400218165541, 21.45772596997756], [96.09002826908943, 21.458461879811978], [96.086643084211, 21.45905060839891], [96.0856128100832, 21.46066961021438], [96.08502408329485, 21.463613248652564], [96.08427597865358, 21.465525068826935], [96.08369944487356, 21.466998434430252], [96.08193326091134, 21.469058980887326], [96.08717406103415, 21.46881057284969], [96.09468786435349, 21.469239932576897], [96.10434846720807, 21.471601413774295], [96.11078886941084, 21.476109695406194], [96.1112640792739, 21.47645696411763], [96.11550806004897, 21.476366666788294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
