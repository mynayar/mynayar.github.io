
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Kar</div><div class="name-mm">ပျဉ်ကာ</div></div>
        <span class="pcode-badge">MMR010009058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02227973941848, 22.15293312076699], [96.01718970434143, 22.15460673211504], [96.0051664781505, 22.158942977036816], [95.9976524500006, 22.161217684448616], [95.99374604774198, 22.165124087606614], [95.98866765528811, 22.173327597190905], [95.98866763370438, 22.17428413860216], [95.988667319841, 22.18074992956565], [95.9902298811042, 22.187972322864482], [95.99135351025637, 22.19316648684395], [95.99351636179074, 22.19485627609629], [95.99515397057934, 22.19507005483922], [96.0006331297152, 22.19284453314873], [96.00477227382146, 22.189888002029704], [96.00930562135738, 22.18574885882282], [96.01261720841751, 22.17950819874443], [96.01478952711506, 22.177467401399497], [96.01658058182846, 22.175592421952786], [96.01878929069329, 22.17186164919582], [96.01924323968382, 22.16969871492381], [96.01976203878712, 22.166193008300752], [96.02073097195682, 22.161287308162798], [96.02227973941848, 22.15293312076699]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
