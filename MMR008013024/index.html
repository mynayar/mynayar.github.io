
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myauk Loke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myauk Loke Kone</div><div class="name-mm">မြောက်လုပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR008013024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50057072765702, 18.20822552558758], [95.50628145772316, 18.20394243419605], [95.51038318103906, 18.199254700943754], [95.50950436893152, 18.19280896486191], [95.51126234658011, 18.185191320423144], [95.51419214714991, 18.181968505442228], [95.51438799431054, 18.18199299038423], [95.51397235913714, 18.180815356943242], [95.50986922568427, 18.166267884855074], [95.5087501902691, 18.15936716106569], [95.50639542071218, 18.14700462336475], [95.50520657542319, 18.148363303823487], [95.50240898418735, 18.15563704031723], [95.49681380171563, 18.165708367147488], [95.49420271728161, 18.172982102741912], [95.49382970457725, 18.179136802921164], [95.49401621137912, 18.181747887355186], [95.49364319867476, 18.188089093436986], [95.49271066916214, 18.193497769106784], [95.49103211514006, 18.197973914364695], [95.48674247488538, 18.202636564625834], [95.48344091616542, 18.20706789576684], [95.48469090905826, 18.206553193075422], [95.48991307792625, 18.206926204880517], [95.49457572998602, 18.205993673569253], [95.49886536934139, 18.206926204880517], [95.50057072765702, 18.20822552558758]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
