
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mway Shwe Khe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mway Shwe Khe</div><div class="name-mm">မြွေရွှေခဲ</div></div>
        <span class="pcode-badge">MMR010009008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03436871774221, 22.299507778161455], [96.03991054973216, 22.2996678170162], [96.0450406433111, 22.300113912227346], [96.05217816399113, 22.30725143290738], [96.0555238767256, 22.307474480063263], [96.06132311177225, 22.30212133932838], [96.06333053977266, 22.295652961015378], [96.06399968303901, 22.291638105913933], [96.05976177988231, 22.288515440335345], [96.05329340066999, 22.28360839481161], [96.05686216235898, 22.277586110810432], [96.06288444456152, 22.270002495818574], [96.05663911430372, 22.27223297097487], [96.04794026083442, 22.274686494186426], [96.04303321531069, 22.274017350920076], [96.0396875016769, 22.27245601813081], [96.03455740899727, 22.274463446131165], [96.03188083862983, 22.275355635654137], [96.03232693384098, 22.28182401396714], [96.03321912426321, 22.292753342592732], [96.03436871774221, 22.299507778161455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
