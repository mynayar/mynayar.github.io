
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Tauk Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Tauk Yin</div><div class="name-mm">ခတောက်ရင်း</div></div>
        <span class="pcode-badge">MMR005007030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41015053921609, 23.11806419160922], [95.41143903118638, 23.12075858833822], [95.41150524017473, 23.12089703986652], [95.41415015980209, 23.12859194955888], [95.41796616041006, 23.139345690051584], [95.42221416025535, 23.144124600170187], [95.43035304006082, 23.135210279930504], [95.44648824004031, 23.119695720081495], [95.45867063993813, 23.110793459750425], [95.45751179962991, 23.109512850337808], [95.44918644000228, 23.106737699885002], [95.44433003979958, 23.104309409851453], [95.43808583998958, 23.100840540358718], [95.43080123968554, 23.097371580034462], [95.42663136034906, 23.096329110200315], [95.42409100759397, 23.095032114240723], [95.42287879072364, 23.100184027171167], [95.41924214820665, 23.10836647283452], [95.41326810383998, 23.114738788264503], [95.41015053921609, 23.11806419160922]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
