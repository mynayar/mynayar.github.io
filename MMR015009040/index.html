
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ton Aw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ton Aw</div><div class="name-mm">တုံအော်</div></div>
        <span class="pcode-badge">MMR015009040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.16053784564514, 24.069127995060967], [98.16053784564514, 24.066187088763172], [98.16053784564514, 24.064349959083415], [98.16115568888398, 24.063471971654224], [98.15309883804099, 24.050784709446816], [98.14347188691812, 24.030655630153262], [98.13997117692833, 24.01884073641088], [98.1429498844297, 24.0116666537931], [98.13346742468195, 23.992270712623338], [98.13340734727132, 23.992147826560995], [98.09808071555261, 23.990163183783977], [98.09457911793203, 23.98996646518026], [98.09446195425585, 23.989959883042218], [98.09399318263934, 23.99304596060267], [98.08988141659415, 24.02011509013937], [98.08930592243041, 24.023903760350322], [98.08921089017048, 24.02452938902013], [98.09533713130361, 24.027154921062788], [98.10671443742143, 24.034156340143056], [98.11502862207328, 24.042908113318845], [98.12290521910063, 24.052535064441713], [98.12553075114329, 24.0630371926124], [98.12532785509649, 24.065370495352113], [98.12850881293144, 24.065840251726286], [98.12871782526747, 24.065871118257576], [98.14969168182574, 24.068968493101522], [98.15704946536061, 24.069076695033516], [98.16053784564514, 24.069127995060967]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
