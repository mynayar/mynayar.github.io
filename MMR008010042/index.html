
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnaw Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnaw Kone</div><div class="name-mm">နှောကုန်း</div></div>
        <span class="pcode-badge">MMR008010042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.77984243128321, 18.19141983156004], [95.78896669195933, 18.186585025878287], [95.79369194133011, 18.186880354244977], [95.79753120470139, 18.18540371421011], [95.8066863750762, 18.179497153171155], [95.80963965514604, 18.173590592132143], [95.80929990836415, 18.171823903650306], [95.80672613320456, 18.172028224223197], [95.80288788516782, 18.173227677015745], [95.79976930880662, 18.173347622294955], [95.79581111638998, 18.175146800584457], [95.79281248530799, 18.17466702036677], [95.78945401928763, 18.174427128908917], [95.78417642789987, 18.17154844310619], [95.7782991110152, 18.16747030541029], [95.775034172689, 18.16497951429318], [95.77458413395067, 18.166479644619926], [95.77239818512822, 18.16842271083948], [95.76996935370278, 18.17230884058057], [95.77045511980799, 18.173280373690318], [95.76705475617212, 18.17352325719264], [95.76292574202944, 18.176680738225514], [95.7618907203805, 18.185157606638313], [95.76773546292134, 18.1893324241521], [95.77984243128321, 18.19141983156004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
