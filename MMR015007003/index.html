
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Yaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Yaing</div><div class="name-mm">ရောင်ရိုင်း</div></div>
        <span class="pcode-badge">MMR015007003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.17354413495394, 22.992766732998405], [99.16410637690785, 22.99190875458538], [99.15545411821307, 22.9962348839328], [99.15487730024728, 23.00488714442622], [99.15978024666111, 23.01440462917037], [99.16554842002364, 23.020461210616418], [99.16453188573797, 23.030016632361765], [99.1663355822214, 23.030016632361765], [99.17063310143652, 23.035671266315944], [99.1695021751853, 23.039968784631753], [99.17063310143652, 23.043361563385474], [99.17606154870157, 23.047206714618255], [99.18171618265575, 23.051730419623198], [99.1864660707526, 23.05331371565552], [99.193783151871, 23.057703963067468], [99.20563722188035, 23.05045570976324], [99.21629055306664, 23.047091499772932], [99.21428948237377, 23.042091859152038], [99.2096749431442, 23.03228596542499], [99.19525451108689, 23.017288715401946], [99.18804429460857, 23.007482820775635], [99.18083407902958, 22.997965336031484], [99.17354413495394, 22.992766732998405]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
