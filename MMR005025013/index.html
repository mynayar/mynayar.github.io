
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Gyi Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Gyi Taw</div><div class="name-mm">လက်ပံကြီးတော</div></div>
        <span class="pcode-badge">MMR005025013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68295352008892, 23.84110601982701], [95.68593936011342, 23.840359560045727], [95.68911167996015, 23.839986329705425], [95.69153771988994, 23.839053300169724], [95.69402280031204, 23.838742620375683], [95.6969103597254, 23.834156669694607], [95.698963080282, 23.826692160015227], [95.69924296818851, 23.824103873395075], [95.69095854929765, 23.82207879260227], [95.67985856801857, 23.81808279988138], [95.6715928397378, 23.81454034516088], [95.67066744005035, 23.8164491696935], [95.66432243972889, 23.825779830175065], [95.65536491965537, 23.830071930075576], [95.65652686622195, 23.83064685586777], [95.66446863442002, 23.834576403977906], [95.67210978443904, 23.837748203117144], [95.67623461313696, 23.839460396280288], [95.67804002282884, 23.839902584836466], [95.68295352008892, 23.84110601982701]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
