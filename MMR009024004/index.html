
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lone Paung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lone Paung</div><div class="name-mm">လုံးပေါင်</div></div>
        <span class="pcode-badge">MMR009024004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14580478216504, 21.782174528431767], [94.15180658590526, 21.780789496038437], [94.15933811486218, 21.77811701758634], [94.16589783461745, 21.775687492783618], [94.17027098142074, 21.77422977718254], [94.17053166700288, 21.774032931774457], [94.16857031306955, 21.772772061581406], [94.16711259656915, 21.767913010177324], [94.16978507592057, 21.76572643722534], [94.16881326492029, 21.76135329132137], [94.16589783461745, 21.759166718369386], [94.16404414302286, 21.757107060442536], [94.1605528777132, 21.75770900186899], [94.15496496895821, 21.755279477066267], [94.14743343910197, 21.751878141263262], [94.1420884830971, 21.74701908895986], [94.14111667209681, 21.74580432700816], [94.14152829899189, 21.74553970869067], [94.1410045410268, 21.744701696126413], [94.139658957395, 21.746047278858896], [94.13795828904387, 21.74896271006105], [94.13795828904387, 21.75333585596502], [94.14087372024608, 21.758437860119216], [94.14111667209681, 21.76378281702341], [94.13771533719313, 21.77301501433152], [94.13650057434211, 21.775201587283505], [94.13654192696839, 21.77617339828373], [94.13893009914483, 21.77617339828373], [94.1420884830971, 21.780060638687587], [94.1454898189001, 21.78224721163957], [94.14580478216504, 21.782174528431767]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
