
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Lu Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Lu Lin</div><div class="name-mm">မြို့လုင်</div></div>
        <span class="pcode-badge">MMR009005040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45065124855631, 20.10695545692886], [95.45146498931786, 20.110719001880454], [95.45394647784775, 20.119935961075782], [95.45536447219268, 20.128443924447595], [95.46098004859044, 20.141657047235014], [95.46174544359741, 20.142269363240587], [95.46883541172491, 20.142269363240587], [95.47911586690378, 20.14014237217276], [95.48372434740077, 20.1436873566862], [95.49116881388971, 20.153967810965753], [95.49565343255995, 20.156658583426918], [95.49648629110953, 20.157158297117746], [95.50322176087565, 20.150422827351633], [95.50180376742998, 20.141205868156362], [95.49861328127798, 20.12915292117043], [95.4957772943867, 20.120999456160007], [95.49400480168032, 20.11851796673085], [95.48927815566242, 20.11142799860329], [95.48904182372127, 20.111782496964736], [95.47592538075179, 20.1153274805788], [95.46635392319507, 20.112491493687514], [95.45784596072258, 20.10575602302208], [95.45811899129848, 20.104254359351273], [95.45065124855631, 20.10695545692886]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
