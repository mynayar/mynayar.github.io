
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Gar</div><div class="name-mm">ဦးဂါ</div></div>
        <span class="pcode-badge">MMR012008075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.81346486271332, 20.376793430572434], [92.8200993539021, 20.373211144878496], [92.82661102108182, 20.36939691683432], [92.82768051284546, 20.367301394843537], [92.82808756398993, 20.366503815798524], [92.82993909181567, 20.35747459187894], [92.82552059040296, 20.356428190208874], [92.81967656372251, 20.354447205873896], [92.81729841359095, 20.35364099963249], [92.81128669842246, 20.35050847928295], [92.8116513384386, 20.353519219736256], [92.81115675807797, 20.3564132488724], [92.81005227279422, 20.356064704022913], [92.80808627656046, 20.357451944251864], [92.80599921179424, 20.357449638390165], [92.80391346273615, 20.35640526738922], [92.80354442683387, 20.35698376438927], [92.80219029244807, 20.359876797076595], [92.80022417840314, 20.361263948272665], [92.7964194759781, 20.36033329384651], [92.78991403840223, 20.35928354669835], [92.78988541837742, 20.35949726518669], [92.78985679655398, 20.35971098187639], [92.7895839422452, 20.361748422951393], [92.78854969491255, 20.36947074218108], [92.78830390300277, 20.3733529742604], [92.79591043361967, 20.37399501106097], [92.80443120603542, 20.374941016914477], [92.80855522264545, 20.375398726869776], [92.81346486271332, 20.376793430572434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
