
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htaw Ka Loet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htaw Ka Loet</div><div class="name-mm">ထော်ကလို့</div></div>
        <span class="pcode-badge">MMR017014008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00900864922983, 16.605289609228123], [95.01019837855239, 16.603921419338064], [95.01192950963923, 16.60298036515178], [95.01263732735083, 16.601185039558004], [95.01376757101667, 16.59892455132706], [95.01436243657724, 16.597258928656686], [95.01448140968938, 16.595533819430273], [95.01495730213782, 16.594046656428077], [95.01578830808398, 16.593211841853076], [95.01178787990682, 16.59107789992521], [95.00920955957355, 16.589273219583447], [95.0062194001053, 16.586070480168587], [95.00143607971137, 16.593658019801808], [95.00127119980607, 16.59893633964043], [95.0011079638615, 16.606194832625476], [95.00079950899021, 16.608561368012772], [95.00210821232417, 16.609156233573344], [95.0037143484385, 16.609751099133973], [95.0056179173331, 16.609632126021836], [95.00674816099888, 16.60873982768095], [95.00754319316388, 16.60759573535495], [95.00835429711316, 16.606003447900832], [95.00900864922983, 16.605289609228123]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
