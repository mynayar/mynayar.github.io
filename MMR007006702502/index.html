
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Taw Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Gon Taw Ward</div><div class="name-mm">ဂုဏ်တော် ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007006702502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56541981047593, 18.224392905108516], [96.56232906093749, 18.22904063741555], [96.5626202821004, 18.229194892730163], [96.56306212261893, 18.229465867455872], [96.56378736829248, 18.229831715261525], [96.56416106538092, 18.229539161303308], [96.56439082777456, 18.229124823851578], [96.56472935777373, 18.228603656833343], [96.565070189138, 18.228085589778175], [96.56541866653828, 18.227491844772885], [96.56572597117668, 18.227046287356302], [96.56609900006885, 18.226458441903617], [96.56651399762296, 18.225860564513482], [96.56668967388941, 18.225560333942326], [96.56686282036293, 18.22530125724728], [96.56685363378824, 18.22529564367909], [96.56633526546017, 18.224955277264257], [96.56589956281465, 18.224674240923548], [96.56541981047593, 18.224392905108516]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
