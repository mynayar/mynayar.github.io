
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (7) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Labutta</div><div class="name-mm">လပွတ္တာ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (7) Ward</div><div class="name-mm">အမှတ် (၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017016701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76350422394086, 16.154589800878682], [94.76372400925567, 16.15447370020115], [94.76412187472482, 16.15437694214222], [94.76442292817563, 16.154141253216324], [94.76457208253566, 16.154313905962056], [94.76519164437894, 16.153990641954636], [94.76510081375159, 16.153901560508643], [94.76497747443096, 16.153714673293564], [94.76487182387564, 16.153512172948467], [94.76474991987294, 16.153247224579786], [94.76465622040831, 16.153001101719497], [94.764498461335, 16.15265303980601], [94.76438277164766, 16.15242344738425], [94.76431063882501, 16.15234462360553], [94.763869338799, 16.151996403411317], [94.76314651589905, 16.151519767223533], [94.76248966636507, 16.15106608892893], [94.76144558944247, 16.15016791351843], [94.76130408471579, 16.150072401919886], [94.7593648460109, 16.149063671051636], [94.75800158710359, 16.151852640486993], [94.75991231640035, 16.152785617862037], [94.76275474873273, 16.15426305109895], [94.76291282616603, 16.154397744360438], [94.7631013645364, 16.15463625895626], [94.76319385531224, 16.154775100790346], [94.76350422394086, 16.154589800878682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
