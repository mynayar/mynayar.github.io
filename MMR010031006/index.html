
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Din</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Din</div><div class="name-mm">ပဒင်း</div></div>
        <span class="pcode-badge">MMR010031006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92449594613106, 21.258700177171477], [95.91905754516961, 21.253756175806927], [95.91178416031079, 21.250119482927857], [95.90612708199927, 21.248099098394732], [95.90168223494726, 21.24682914235109], [95.90168223494726, 21.246886868034608], [95.89925777332763, 21.250119482927857], [95.8927925417425, 21.249715405841357], [95.88228654109105, 21.246886868034608], [95.87541723241941, 21.245674636775107], [95.86571938504164, 21.242442020982537], [95.86854792374777, 21.24365425224198], [95.86652753921464, 21.255372484152872], [95.86376409433757, 21.26746255335422], [95.8701642311944, 21.268707024409707], [95.8802661556586, 21.274768178908403], [95.8802661556586, 21.28446602628611], [95.8802661556586, 21.289719026611863], [95.8867313872438, 21.290527180784807], [95.8927925417425, 21.290527180784807], [95.89481292717488, 21.289719026611863], [95.89521700426138, 21.28082933340704], [95.89521700426138, 21.275980410167847], [95.9028944662067, 21.278404870888153], [95.91097600613784, 21.285678256646293], [95.9125536769107, 21.2874813101144], [95.91542085229054, 21.282849717940167], [95.91542085229054, 21.262645869011692], [95.92449594613106, 21.258700177171477]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
