
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Pin Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Pin Zin</div><div class="name-mm">ဂွေးပင်ဇင်</div></div>
        <span class="pcode-badge">MMR009010003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.5926659872456, 20.588213258035466], [94.59310211167315, 20.58565102297638], [94.59330990093122, 20.577339465244165], [94.59276515458828, 20.572709123127595], [94.59164758956467, 20.5632098172793], [94.59077155186566, 20.562797563556785], [94.58811517757346, 20.56154750501338], [94.5744070103753, 20.557777759236274], [94.57514151906594, 20.558851271868775], [94.55940251271585, 20.55907937321456], [94.55105287139298, 20.559288113955347], [94.55175211227021, 20.56383318415419], [94.55258326840317, 20.579625142586337], [94.55341442363681, 20.581910821727092], [94.55642073223106, 20.584563446745733], [94.5571546248861, 20.584196499968527], [94.56650512710996, 20.582949767118123], [94.58146593120784, 20.585235445359558], [94.58639865957053, 20.586184046656456], [94.58645286620686, 20.58585881223445], [94.5926659872456, 20.588213258035466]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
