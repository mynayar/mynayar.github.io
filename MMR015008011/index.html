
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kein Hsan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kein Hsan</div><div class="name-mm">ကိန်းဆန်</div></div>
        <span class="pcode-badge">MMR015008011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.08815758330587, 22.912673167332855], [99.08815176559159, 22.912465261162936], [99.08366485994537, 22.9071980200726], [99.07914115224241, 22.902448128378467], [99.07956299903321, 22.89702520295083], [99.08132573139744, 22.894334753346243], [99.08419887737637, 22.88994948188315], [99.08127116683096, 22.886289507354945], [99.07386411393776, 22.886479732853445], [99.06571695407422, 22.8828136753109], [99.05812606086909, 22.87660322615801], [99.05522440817998, 22.871275768262137], [99.04034020024011, 22.875694516988403], [99.02227729895822, 22.876424940958316], [99.01251307082163, 22.88294116500282], [98.98043523279983, 22.903491030786483], [98.99454138327826, 22.907579769690642], [99.01946985295143, 22.916275747128054], [99.03599221107174, 22.925551457234008], [99.04468818940848, 22.9336677029022], [99.04806568868065, 22.939653354818518], [99.063239608721, 22.943233278892762], [99.07669265174457, 22.943757423566296], [99.07650920983224, 22.942350362279456], [99.08255531687445, 22.929434117390656], [99.08553481757781, 22.926028978354736], [99.08640119026279, 22.925038841869082], [99.08748588416626, 22.921478174977835], [99.08832670261529, 22.91871806388758], [99.08815758330587, 22.912673167332855]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
