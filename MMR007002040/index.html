
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yit Kan Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yit Kan Lay</div><div class="name-mm">ရစ်ကံလေး</div></div>
        <span class="pcode-badge">MMR007002040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67380322383974, 17.234319530322125], [96.6749926788691, 17.231702727998538], [96.67607660385227, 17.226644412909366], [96.6767992199081, 17.218695630898708], [96.67354744585799, 17.21146946494389], [96.66885043789745, 17.2038819918605], [96.66487604779144, 17.200991525838276], [96.65909511484773, 17.20026890888306], [96.65548203276967, 17.20063021691101], [96.65096505919018, 17.201161626308078], [96.65114633373639, 17.204243299888446], [96.65114633373639, 17.210024231932834], [96.65150764176434, 17.21472123989338], [96.65078502480912, 17.21833432197144], [96.64933979179801, 17.224115254915148], [96.64464278473679, 17.22772833699321], [96.64355885975363, 17.230257494987427], [96.6490507460951, 17.23538807330101], [96.65223025782018, 17.23856758502609], [96.65728857380867, 17.236399735959083], [96.66234688979716, 17.23676104398703], [96.66740520488634, 17.236399735959083], [96.67318613783004, 17.235677119003867], [96.67380322383974, 17.234319530322125]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
