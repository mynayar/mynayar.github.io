
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Du Rit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Du Rit</div><div class="name-mm">ဒူရစ်</div></div>
        <span class="pcode-badge">MMR001015038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39729466181927, 26.281481706015995], [97.39740742870993, 26.277823611970177], [97.39838039084242, 26.246242888598488], [97.40610113625848, 26.233696679658067], [97.40590910312267, 26.233741863396347], [97.38969455416043, 26.23755705191644], [97.37340860892022, 26.250585808288463], [97.36037985344751, 26.267957481652502], [97.3386652603935, 26.257100186024843], [97.31912212628515, 26.265786022706834], [97.31043628870384, 26.273386131265], [97.28872169475045, 26.273386131265], [97.24203531977423, 26.279900509001322], [97.20015403328205, 26.291176240291293], [97.19817314427524, 26.290073827045546], [97.20086533316862, 26.29587238939928], [97.2033637658252, 26.3008692556117], [97.20443452383427, 26.306579963194793], [97.20764679786151, 26.311576832105175], [97.21228674563685, 26.316573698317598], [97.21442825985639, 26.324069000783823], [97.2165697749752, 26.3333488990325], [97.21692669431155, 26.340130361926697], [97.22299431943236, 26.346197987047503], [97.22834810677978, 26.35012409794882], [97.23698950526153, 26.35360481870748], [97.28112158799092, 26.375940186790217], [97.31369347757197, 26.37702591581342], [97.34083671933917, 26.37376872694523], [97.3852251727036, 26.369438146853042], [97.37123714997455, 26.350968403968693], [97.34517963812988, 26.314053595596988], [97.37449433884274, 26.283653164961663], [97.39729466181927, 26.281481706015995]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
