
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Kan</div><div class="name-mm">ကျောက်ကန်</div></div>
        <span class="pcode-badge">MMR010022047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91561568341712, 21.0898232476448], [94.91790998795562, 21.09049241968944], [94.92541497701961, 21.090203766990328], [94.9271468968119, 21.078946283843948], [94.92743555130971, 21.07288456187308], [94.92916747110195, 21.067111494400024], [94.9326313115858, 21.06393630571597], [94.93609515296902, 21.061627078726758], [94.93955899435218, 21.055854011253643], [94.94071360784676, 21.049792289282777], [94.93984764705135, 21.0419986466203], [94.93869303355672, 21.034205004857142], [94.93638380566813, 21.033916352157974], [94.9317653516897, 21.03449365935495], [94.92846645586229, 21.034699839725874], [94.9271468968119, 21.03478231205412], [94.9271468968119, 21.042864608315085], [94.92512632432044, 21.048060368591166], [94.92252844283342, 21.053256129766623], [94.91906460234958, 21.0584518918414], [94.91444614657246, 21.061915733224566], [94.91011634619247, 21.06595688000607], [94.90492058501707, 21.07057533488387], [94.89914751664463, 21.07317321637089], [94.90925038629632, 21.07605974965776], [94.91213691958325, 21.081255510833216], [94.91444614657246, 21.086739925607105], [94.91561568341712, 21.0898232476448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
