
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Taw</div><div class="name-mm">သပြေတော</div></div>
        <span class="pcode-badge">MMR009013006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12892651714509, 19.868508900265567], [95.12996882330259, 19.865630148812386], [95.13610645434943, 19.857828082200285], [95.13754411686756, 19.857389006197707], [95.13803251259043, 19.85603541859973], [95.13947094402891, 19.855145916251104], [95.13988821596843, 19.853989442059174], [95.13995933705382, 19.85379232775375], [95.140263047102, 19.853510116898406], [95.14140463121879, 19.85244934586069], [95.14189301884778, 19.851098808763084], [95.14285832864903, 19.849752046120102], [95.14525364414044, 19.848867037683704], [95.14573661335407, 19.84796600962369], [95.1324166879798, 19.847593576982035], [95.12274871877838, 19.83851082631361], [95.11382584868403, 19.83432217003218], [95.10839312424332, 19.831771889661013], [95.0984320327122, 19.830599775359417], [95.09022872367672, 19.83265054528647], [95.07944897119313, 19.834590795728673], [95.08382296515776, 19.850646135011175], [95.08330000758934, 19.850641979244017], [95.08617411224554, 19.858822119944932], [95.09445786024213, 19.875849825109412], [95.1087243148753, 19.885053988750656], [95.11362826133524, 19.888531332554976], [95.11650101610905, 19.886417419428426], [95.12382047503496, 19.882611297873154], [95.12892651714509, 19.868508900265567]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
