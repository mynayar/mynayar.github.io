
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Haung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Haung Kone</div><div class="name-mm">ရွာဟောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010014011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09403844142099, 21.791256163041567], [96.09526387922472, 21.788396809065546], [96.09472093961972, 21.783872318053113], [96.09598779839826, 21.78188154189968], [96.09598779839826, 21.77663313171371], [96.09453996005118, 21.774099416854654], [96.08874861205885, 21.771384723326378], [96.08386216190928, 21.77102276418924], [96.07788983434841, 21.77029884501576], [96.07571807772717, 21.772108640701276], [96.0730033841989, 21.778985867903543], [96.06956477059776, 21.78640603291211], [96.06938379102917, 21.788939747771167], [96.0720984845575, 21.79129248306168], [96.07390828204166, 21.79726481062255], [96.07752787521133, 21.79708383105401], [96.07860043726043, 21.79724272956838], [96.07890460416422, 21.794032863026246], [96.08288959188121, 21.789605098596496], [96.08997401299035, 21.78849815906284], [96.09403844142099, 21.791256163041567]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
