
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoe Yoe Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpoe Yoe Su</div><div class="name-mm">ဖိုးရိုးစု</div></div>
        <span class="pcode-badge">MMR007003030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65596494442673, 17.07085020986932], [96.65251295430943, 17.068261220878696], [96.64495948279398, 17.066958899133965], [96.64119369583244, 17.071512874419682], [96.63630901375006, 17.073005415367675], [96.6295247341792, 17.07436227200128], [96.62545416607696, 17.07829715399049], [96.62287613892272, 17.07789009655079], [96.61496099425455, 17.077254263273687], [96.62043886016534, 17.087751782418877], [96.62351633121375, 17.095274454852245], [96.62727767912168, 17.09869385084062], [96.6373230614102, 17.09775939857741], [96.63780943455782, 17.096300273738677], [96.64122883144546, 17.091171179306514], [96.6439959239728, 17.090151724922237], [96.64255055156679, 17.087523774602573], [96.64322898033322, 17.082503408205753], [96.65218422961857, 17.076126184276006], [96.65421951411935, 17.074633643328013], [96.65611911340642, 17.07354815802114], [96.65596494442673, 17.07085020986932]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
