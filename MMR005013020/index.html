
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kone</div><div class="name-mm">တောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR005013020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07495888014824, 22.456241279911183], [95.06489363992961, 22.45095702005051], [95.05640340039668, 22.440875039851278], [95.04924012043529, 22.434772860079477], [95.0451346802214, 22.42949454024091], [95.04181116005702, 22.42973187042952], [95.03570880042088, 22.43291561976008], [95.0319035997714, 22.433486489609834], [95.03213436041244, 22.433699520116818], [95.03118107994294, 22.441087799662284], [95.02975115968832, 22.446331109792936], [95.029036199561, 22.45300443011041], [95.02736795986351, 22.459677659596366], [95.02801704015434, 22.4646548396492], [95.0397480001701, 22.46276277038561], [95.04822204021502, 22.465305000025808], [95.04864576029365, 22.472931599913466], [95.05330631963102, 22.475473829553664], [95.06050920033937, 22.468694579891007], [95.06813580022708, 22.466576070329438], [95.07576240011474, 22.46191533022835], [95.07680316033765, 22.461792929799913], [95.07703356035057, 22.461765840421265], [95.07550607984177, 22.45652865017712], [95.07495888014824, 22.456241279911183]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
