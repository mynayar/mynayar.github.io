
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Lel Kyaung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Lel Kyaung Ward</div><div class="name-mm">မြို့လယ်ကျောင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017019701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64718662526258, 16.728165424694623], [95.64798389404154, 16.7280983721422], [95.64732755442316, 16.725341527389617], [95.64725616444048, 16.72498909746895], [95.64701819843117, 16.724885728493632], [95.64784444156777, 16.72309040379912], [95.64523345246192, 16.722043474227007], [95.64526744683525, 16.72198161436006], [95.64502268195127, 16.721867663062255], [95.6449410936566, 16.721756967310228], [95.64307454625339, 16.7261316438603], [95.64289097304004, 16.72652232554492], [95.6426130618434, 16.727157183057614], [95.6425527209314, 16.72739973021345], [95.64204279364009, 16.72755600180807], [95.64165864822809, 16.727674833726667], [95.64151416854412, 16.727689483682752], [95.64083001559283, 16.727625998740905], [95.64054700613946, 16.727617859876375], [95.64058610056816, 16.72799877132627], [95.64067788717483, 16.728464329665144], [95.64080366995347, 16.728881052118936], [95.64137818745343, 16.728757337780962], [95.64718662526258, 16.728165424694623]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
