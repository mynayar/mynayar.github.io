
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Yay Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Sar Yay Kone Ward</div><div class="name-mm">စာရေးကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017019701501</span>

    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6554980795728, 16.72785718476132], [95.65561026370278, 16.727603243195176], [95.6555890163201, 16.727197064393067], [95.65564000967879, 16.72671522472791], [95.65561621271809, 16.726500349711444], [95.65564340911612, 16.7263017533233], [95.65566040630279, 16.726210594443444], [95.65571139966141, 16.72613896883837], [95.65572499741074, 16.72600223051859], [95.65570459988743, 16.72588176992781], [95.65564315730592, 16.725792879138112], [95.65569780101276, 16.72573851961704], [95.65564680855346, 16.725572478687013], [95.65566720607677, 16.72543248392202], [95.6555890163201, 16.72526969853783], [95.65562981136674, 16.725191561841143], [95.65570459988743, 16.725139470410284], [95.65575227025113, 16.72503855298686], [95.65441023444481, 16.72439069127745], [95.65425385673018, 16.724371156203972], [95.65334278594088, 16.724250694713817], [95.6519200881416, 16.72404314287678], [95.65182830153492, 16.724669868719502], [95.65182830153492, 16.725296591864264], [95.65185549793296, 16.726187024111937], [95.65187759427562, 16.726843044470968], [95.65190139123627, 16.727375345995483], [95.65191328926693, 16.7276537059538], [95.65385951210686, 16.727430692972177], [95.65390710602816, 16.727811605321392], [95.6554980795728, 16.72785718476132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
