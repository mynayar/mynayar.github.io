
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnan Khar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnan Khar</div><div class="name-mm">နှမ်းခါး</div></div>
        <span class="pcode-badge">MMR009023042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.08898839779636, 22.524880496337914], [94.08154122434809, 22.51607929012721], [94.07092854431693, 22.506527877559563], [94.05458501728475, 22.496127451920415], [94.03692376312125, 22.489953565604594], [94.02350332232055, 22.541895446417755], [94.04800515541365, 22.546856062757115], [94.08026770339188, 22.55555846135394], [94.08812108621919, 22.558317756759095], [94.08727207224837, 22.56192606883309], [94.08557404340746, 22.57317551024164], [94.10128080996145, 22.574873538183283], [94.11889785884915, 22.57890635724266], [94.1227184226172, 22.58442494985161], [94.12123264816825, 22.577632835387078], [94.11571405465997, 22.570203958645834], [94.10234207832434, 22.56171381534034], [94.10446461415069, 22.55768099718034], [94.11209335532413, 22.5560958035785], [94.10276658530972, 22.545794795293602], [94.09554996206117, 22.53263507065202], [94.08898839779636, 22.524880496337914]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
