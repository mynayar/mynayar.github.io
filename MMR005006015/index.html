
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Thar Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Thar Kan</div><div class="name-mm">မင်းသားကန်</div></div>
        <span class="pcode-badge">MMR005006015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74742376009851, 22.466470050152736], [95.74640028034872, 22.466214089608627], [95.74597943989932, 22.460741640314495], [95.74597943989932, 22.45374845992353], [95.74188156028583, 22.455358380385007], [95.73826752042976, 22.455358380385007], [95.73276095985045, 22.456390949582726], [95.72777028007442, 22.456907190114805], [95.7227796002984, 22.45966055988697], [95.72070671963945, 22.461401880292613], [95.72114268039047, 22.46158359011065], [95.72408964002494, 22.465372229744673], [95.72703623993061, 22.47337044029365], [95.72958071967452, 22.477611420031053], [95.72998283983623, 22.477159079927674], [95.73713927955419, 22.477580010309282], [95.73759647959389, 22.47763076984421], [95.7375601200036, 22.477159079927674], [95.74219080026529, 22.473791369775938], [95.74597943989932, 22.46873984996415], [95.74742376009851, 22.466470050152736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
