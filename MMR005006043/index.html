
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Htwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Htwet</div><div class="name-mm">ရေထွက်</div></div>
        <span class="pcode-badge">MMR005006043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68409867991022, 22.385149650036396], [95.67904716009843, 22.38539021958303], [95.67062784020271, 22.384969200168484], [95.65884107995191, 22.383285389609114], [95.64789599970067, 22.381180559635197], [95.63526756034969, 22.378654890111136], [95.63050943985883, 22.375747259628383], [95.6251645198268, 22.377392009933374], [95.62390163964903, 22.384969200168484], [95.62555151968695, 22.389507180112332], [95.62642740000456, 22.389178770184174], [95.63021603963858, 22.392546480335852], [95.63021603963858, 22.39717697983383], [95.63316264044357, 22.402649430027225], [95.63821416025536, 22.40349137982338], [95.64024960033885, 22.406205420443825], [95.64284447988888, 22.401386549849462], [95.64537024024446, 22.39591409965601], [95.65042176005625, 22.39465122037757], [95.6558944800463, 22.396756050351485], [95.66178767985758, 22.39717697983383], [95.6702069997533, 22.398018929629927], [95.67946799964852, 22.398439860011592], [95.68121508021181, 22.39863399036642], [95.68409867991022, 22.392546480335852], [95.68409867991022, 22.386653009828592], [95.68409867991022, 22.385149650036396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
