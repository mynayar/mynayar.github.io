
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bone Taw Pyayt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bone Taw Pyayt</div><div class="name-mm">ဘုန်းတော်ပြည့်</div></div>
        <span class="pcode-badge">MMR009019024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34173167827441, 21.57404929084214], [95.34168778326466, 21.573759207321586], [95.34096990034067, 21.565634415396005], [95.33903449274771, 21.565473661580256], [95.32010694997581, 21.565239988934366], [95.31680933478304, 21.567300997642974], [95.31961230756201, 21.568702484931805], [95.3146658852225, 21.57562747602725], [95.30823553564153, 21.582057824708897], [95.30627683201027, 21.583670875710368], [95.3072462517132, 21.589972100631996], [95.30886111305, 21.5949961137797], [95.31565517005009, 21.590466743045795], [95.3242886553972, 21.594927377696365], [95.32732373510237, 21.596340250402307], [95.33007612011693, 21.586068989892], [95.33931552009523, 21.57755462964252], [95.34076883981015, 21.577112190175512], [95.34201666983353, 21.57594449963898], [95.34173167827441, 21.57404929084214]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
