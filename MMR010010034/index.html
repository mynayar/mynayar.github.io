
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngwe Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngwe Taung</div><div class="name-mm">ငွေတောင်</div></div>
        <span class="pcode-badge">MMR010010034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06038866490502, 22.482545218587006], [96.06394932729967, 22.48686888019472], [96.06954465276357, 22.490938208131865], [96.07183365040271, 22.495261868840203], [96.0708163184184, 22.500602860633535], [96.0708163184184, 22.50441785579943], [96.07386831437128, 22.50696118620982], [96.07768330773854, 22.50721551898107], [96.07997230537762, 22.503654856586422], [96.07997230537762, 22.498822531234907], [96.08073530369137, 22.494753203297762], [96.0820069693462, 22.491192540903114], [96.08302430133051, 22.487377545737218], [96.08556763084152, 22.48381688424189], [96.08633063005459, 22.47796722510742], [96.0876022948101, 22.473643565298346], [96.08327863410176, 22.473897898069595], [96.07666597665354, 22.473897898069595], [96.07157931673214, 22.47313489885653], [96.0670013232525, 22.472626233314088], [96.06267766164484, 22.471608901329773], [96.05937133292076, 22.470082902903698], [96.05715331337478, 22.467371989225967], [96.05657366973912, 22.468048238935125], [96.05301300914311, 22.46982857013245], [96.04868934843472, 22.472626233314088], [96.04816386557002, 22.47273132898772], [96.0507240124033, 22.4751695628251], [96.0542846729993, 22.47796722510742], [96.06038866490502, 22.482545218587006]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
