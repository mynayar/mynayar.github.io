
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tu Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tu Chaung</div><div class="name-mm">တူးချောင်း</div></div>
        <span class="pcode-badge">MMR017017012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31484812024462, 16.633572569918215], [95.31482328007036, 16.6330409401873], [95.31479843989615, 16.632509309557065], [95.31361691958523, 16.625997719719066], [95.30963568024254, 16.618154220440942], [95.30913168038279, 16.616514779733336], [95.30654795962067, 16.611766110217843], [95.30203967978747, 16.605133649698246], [95.29431767981714, 16.600716810232655], [95.28636708027659, 16.59842712011556], [95.27929200042553, 16.59722823029864], [95.27574528022058, 16.595848619917945], [95.27305175493461, 16.59525265988242], [95.27167835976854, 16.594948799647455], [95.27280659974485, 16.597725389914842], [95.27375412005665, 16.603083539873523], [95.2743193196809, 16.606281779980236], [95.27596775990423, 16.611145919748424], [95.28224580030349, 16.620462629946473], [95.28364296005464, 16.63321644018663], [95.28397667958018, 16.636263120246838], [95.28487236027127, 16.637985449668804], [95.28620724017208, 16.640551620161204], [95.28914520029082, 16.64465057986041], [95.29194960029389, 16.63975881022094], [95.2944393598886, 16.63746750042486], [95.29914239960215, 16.634947500226986], [95.30243459997689, 16.634490929712683], [95.30712467956039, 16.634038950237425], [95.31003851986185, 16.634192841326637], [95.31064548310263, 16.634224921043312], [95.31134243970189, 16.63426169971774], [95.31484812024462, 16.633572569918215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
