
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hseng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hseng</div><div class="name-mm">နမ့်ဆိုင်း</div></div>
        <span class="pcode-badge">MMR015021008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.81303249175613, 23.300913846396952], [98.8094112348407, 23.30921439283003], [98.80148097077023, 23.312222423625997], [98.79847293907494, 23.317691572408194], [98.79878434192392, 23.320638040113522], [98.80339517234938, 23.320152688595726], [98.80831740562382, 23.326989124348643], [98.8225371899394, 23.330270612898516], [98.83265511424219, 23.33081752840627], [98.83816270364593, 23.32909640587451], [98.84578107024026, 23.326715666594794], [98.86164159928046, 23.32480146501564], [98.87368665831269, 23.32574617494606], [98.87588899727945, 23.3192560105565], [98.85836010983127, 23.314956997567435], [98.84190270344709, 23.30780160376105], [98.83949154909578, 23.30675327574312], [98.83019399805465, 23.29608843773127], [98.82472485017178, 23.291062733858155], [98.82472485017178, 23.293080406035983], [98.81952915914343, 23.299369927180464], [98.81802807283736, 23.30050702098231], [98.81303249175613, 23.300913846396952]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
