
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Chaung</div><div class="name-mm">ရွှေချောင်း</div></div>
        <span class="pcode-badge">MMR010009062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09051167537359, 22.127997952043927], [96.08735804164036, 22.127997952043927], [96.08065657074422, 22.124844319210013], [96.0777000396252, 22.122281992420085], [96.07356089731763, 22.11932546130106], [96.06764783418026, 22.117157337940853], [96.0609463641834, 22.115383418909687], [96.05523040366023, 22.11400370510694], [96.05641301574815, 22.117157337940853], [96.05523040366023, 22.122084889805876], [96.05582170970422, 22.128392156372968], [96.05798983306443, 22.135093626369837], [96.05858113910836, 22.138641464432112], [96.05798983306443, 22.14258350502479], [96.06114346589828, 22.153029914798765], [96.07395510074736, 22.153227017412974], [96.08716093902615, 22.153818322557584], [96.0950450220102, 22.15460673211504], [96.09110298141752, 22.1477081586047], [96.08873775634243, 22.142780606739677], [96.08873775634243, 22.139626973905763], [96.09307400216352, 22.13292550390895], [96.09051167537359, 22.127997952043927]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
