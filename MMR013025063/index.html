
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zaw Ti Ka</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zaw Ti Ka</div><div class="name-mm">ဇောတိက</div></div>
        <span class="pcode-badge">MMR013025063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7435689598397, 16.775393130388693], [96.74910863975197, 16.77496842015654], [96.7516628402679, 16.776622439773803], [96.75347292013919, 16.770353940282178], [96.75413532028887, 16.765564050340686], [96.76117636439778, 16.76171982540967], [96.7608439578824, 16.76005239690062], [96.760904568591, 16.758949071742336], [96.76039730419228, 16.75610359340618], [96.75941701258512, 16.75422402202105], [96.75925923462603, 16.753089445421608], [96.7595174767502, 16.748649880087953], [96.75950095710357, 16.74862250742285], [96.7525514576837, 16.750821062941725], [96.75066708032153, 16.751760299598175], [96.74759052028634, 16.753293269568758], [96.74323992038609, 16.7533566304042], [96.73567379990601, 16.753950270188852], [96.73159896002403, 16.754480460105185], [96.7297431604186, 16.75421693985993], [96.73013771997984, 16.756124759849854], [96.73346376004457, 16.7632026302972], [96.7341261601942, 16.765801199765633], [96.7344163201571, 16.765658370337576], [96.7353548400539, 16.76371913972656], [96.74166168034236, 16.763847570109306], [96.74188667992638, 16.76675879967894], [96.7432104001399, 16.76997395963059], [96.74323992038609, 16.770420810272242], [96.7435689598397, 16.775393130388693]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
