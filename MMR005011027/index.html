
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Bet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Bet Gyi</div><div class="name-mm">နဘက်ကြီး</div></div>
        <span class="pcode-badge">MMR005011027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3746948799648, 23.016113279904005], [95.37268068006938, 23.018676749732265], [95.36968980024415, 23.017517100034183], [95.36529528015313, 23.01593022020353], [95.35949711979629, 23.015686049771432], [95.35430916023961, 23.017883310266598], [95.3508909603496, 23.023071269823276], [95.34832776031794, 23.028320340111634], [95.34851064015396, 23.030273430174702], [95.35272228040895, 23.030517599707537], [95.36029056016127, 23.030090369574964], [95.36389163988736, 23.029907219942288], [95.36712660021249, 23.030273430174702], [95.37231455976917, 23.03088380993995], [95.3753050798656, 23.03167725030488], [95.38128647978726, 23.033081070435117], [95.38568099987828, 23.03350829966837], [95.38690176030804, 23.0343017400333], [95.38751231993768, 23.02227783035761], [95.38751231993768, 23.018920920164362], [95.38647444024326, 23.016113279904005], [95.37847884042623, 23.01507567000624], [95.3746948799648, 23.016113279904005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
