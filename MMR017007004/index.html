
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Chaung</div><div class="name-mm">ဝက်ချောင်း</div></div>
        <span class="pcode-badge">MMR017007004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2702678801586, 17.153118810184992], [95.26195116031784, 17.149636709866343], [95.24633076015652, 17.149542930361974], [95.24356776044385, 17.15171885983756], [95.24191320033401, 17.153620020347716], [95.24049451171243, 17.1546896937744], [95.23982027738396, 17.156185158418396], [95.24012835633863, 17.15646522978659], [95.24226987055812, 17.15839259384319], [95.24405446723995, 17.15960611832776], [95.24503380376711, 17.16009578659134], [95.24576767933502, 17.160462724375293], [95.24862303222721, 17.160748260024207], [95.25097869840829, 17.160819643711648], [95.25340574917607, 17.161533482384357], [95.25604695010674, 17.16281839055631], [95.25768877941368, 17.1640319159402], [95.25940344031659, 17.164928790031695], [95.26106375968482, 17.16475761037549], [95.26154277637806, 17.16479551769902], [95.26114283977029, 17.164014048209822], [95.26663349044327, 17.162151011759818], [95.2679366098867, 17.16186143006098], [95.26779107979456, 17.161515989671216], [95.26958315973508, 17.154132029569553], [95.2702678801586, 17.153118810184992]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
