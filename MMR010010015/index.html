
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hin Thar Hpo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hin Thar Hpo</div><div class="name-mm">ဟင်္သာဖို</div></div>
        <span class="pcode-badge">MMR010010015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99519815517078, 22.358153813447757], [95.98978452693444, 22.356123701847423], [95.98179817214799, 22.35719864440199], [95.97809565608969, 22.360661788810546], [95.97596574042666, 22.36265396700702], [95.97300911487883, 22.365419393989896], [95.97274188672873, 22.36580111572897], [95.96855735833549, 22.371778487587164], [95.96409797733986, 22.37900733891763], [95.96164894084598, 22.384317397629843], [95.96104312514018, 22.386808071835105], [95.95900917073669, 22.395170211935806], [95.95955451962544, 22.406329660885206], [95.95962205871109, 22.407711518671704], [95.95782845981563, 22.415538141272236], [95.95937885055355, 22.41856958501836], [95.97105799523035, 22.41783561322302], [95.9835801032392, 22.416164308635985], [95.9835801032392, 22.41158631515634], [95.98459743522352, 22.408025653661014], [95.98612343185096, 22.40548232415], [95.98612343185096, 22.40268466096836], [95.9889210950326, 22.397852333818207], [95.98764943027703, 22.39505467063657], [95.98586909907971, 22.389459345172668], [95.98688643106402, 22.383864019708767], [95.98815809581953, 22.378268694244866], [95.9901927597881, 22.37140170312614], [95.99248175742724, 22.36250004893816], [95.99519815517078, 22.358153813447757]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
