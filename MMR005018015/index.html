
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baik Tha Yet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Baik Tha Yet</div><div class="name-mm">ဘိုက်သရက်</div></div>
        <span class="pcode-badge">MMR005018015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.94239620971734, 22.027408027558465], [94.94570088009158, 22.018028130094194], [94.94671644041148, 22.013488800267965], [94.94812007977794, 22.005676260151347], [94.9503175201375, 21.99847409979992], [94.95690911995996, 21.98968505961784], [94.96191419968062, 21.985107389894154], [94.96008287962127, 21.984680159761638], [94.95877393167166, 21.98430014043919], [94.95251459986895, 21.982482900165735], [94.94654083609078, 21.980705534932554], [94.9451295596815, 21.98028563967057], [94.9392701995601, 21.98028563967057], [94.93707275920053, 21.984497055095062], [94.93487531974029, 21.988708469620235], [94.92767352001698, 21.99871827023202], [94.92359435979193, 22.00071654043603], [94.92557106874989, 22.006376602698083], [94.93056603379546, 22.012948922854548], [94.93299432922498, 22.01841258577224], [94.93372074671515, 22.02004702714862], [94.94239620971734, 22.027408027558465]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
