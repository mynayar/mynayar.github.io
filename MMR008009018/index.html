
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Kone</div><div class="name-mm">စီကုန်း</div></div>
        <span class="pcode-badge">MMR008009018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78952694801029, 17.887850628903436], [95.79388746743274, 17.890990202635805], [95.798073565143, 17.89482745961959], [95.80156197960173, 17.896222826122596], [95.8039081867135, 17.892486024310642], [95.80369863208625, 17.892474995025054], [95.80405635361791, 17.888540063573146], [95.80083686343056, 17.886214875416215], [95.80012142216594, 17.882995384329547], [95.80119458496216, 17.88120678026877], [95.79904825936973, 17.87906045017968], [95.79761737324321, 17.876198682423308], [95.80077672396669, 17.872117853056523], [95.80078637908821, 17.869580700089273], [95.79984427809103, 17.869126350900444], [95.7993791082593, 17.86731544904876], [95.7979675341744, 17.866407311848036], [95.7975017806827, 17.865049628737438], [95.79608335016655, 17.86549860357775], [95.7956095513398, 17.86639939061945], [95.79277641080279, 17.86638834604537], [95.79082067133697, 17.867255653125937], [95.78885320381238, 17.866897930695018], [95.7845605499295, 17.864393881772287], [95.78080447834407, 17.864215021905807], [95.77939088707984, 17.864026542890713], [95.7793233327057, 17.865088718669483], [95.77225929203274, 17.870321342156274], [95.77539886576511, 17.875292333974073], [95.78246290733739, 17.88104821900015], [95.78952694801029, 17.88628084158762], [95.78952694801029, 17.887850628903436]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
