
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Pin</div><div class="name-mm">အင်ပင်</div></div>
        <span class="pcode-badge">MMR018007053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.27315550232464, 19.481181130205073], [96.27226825097904, 19.481965956863462], [96.2691439738154, 19.483205492439595], [96.26673727110824, 19.483145833213655], [96.26578969413913, 19.48709371130576], [96.26575021659926, 19.487258200905273], [96.2593260336696, 19.502630353108373], [96.25469667631063, 19.515222206239855], [96.26051742763724, 19.514945027091358], [96.26411841743106, 19.51350463063426], [96.26411841743106, 19.508103147742133], [96.26663910920757, 19.505942555304728], [96.26987999876297, 19.505582455965623], [96.27024009720276, 19.501261269292172], [96.27312088921775, 19.496940082618778], [96.27852237210982, 19.494059292402483], [96.28356375566284, 19.494059292402483], [96.2875248438965, 19.491178500387548], [96.2875248438965, 19.48790385118184], [96.28212336100438, 19.48469672127669], [96.27579333079763, 19.47768161001835], [96.27431675011798, 19.480153936255192], [96.27315550232464, 19.481181130205073]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
