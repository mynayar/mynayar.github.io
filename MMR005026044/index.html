
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maing Tone Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maing Tone Tar</div><div class="name-mm">မိုင်းတုံးတာ</div></div>
        <span class="pcode-badge">MMR005026044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57952444040069, 24.18301836020919], [95.5725098399572, 24.184326149831975], [95.55133067986702, 24.186096180194625], [95.5496523596687, 24.18643188002727], [95.54968260027186, 24.186523410327197], [95.54831027979566, 24.186789720269417], [95.55212412023201, 24.196899420272075], [95.55712884022387, 24.215271030034046], [95.56292736030952, 24.23028563967057], [95.56750476023655, 24.2409057301154], [95.58288575996988, 24.233276339631402], [95.60290536029419, 24.22509768011389], [95.60968019968152, 24.222900419618725], [95.61431880027249, 24.221679660088284], [95.61969000029336, 24.21667485016428], [95.62925412028147, 24.211447109996186], [95.62652604034457, 24.20550539985436], [95.61947723958298, 24.180719759609246], [95.6137086003717, 24.179687460208186], [95.59411632011216, 24.180297839973377], [95.57952444040069, 24.18301836020919]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
