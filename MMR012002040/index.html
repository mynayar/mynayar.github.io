
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Seik</div><div class="name-mm">အောင်ဆိပ်</div></div>
        <span class="pcode-badge">MMR012002040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.98919766324161, 20.561004327088085], [92.97772303878725, 20.56418982739865], [92.97935380913106, 20.56662922226087], [92.97853252215822, 20.571420067282304], [92.9740154388615, 20.574568336559537], [92.95991317615221, 20.573374359738978], [92.95781621614555, 20.573925959815256], [92.95062449692307, 20.57581749937816], [92.93786635644727, 20.592325108616933], [92.93268140242486, 20.60170481272695], [92.94781943861625, 20.60923345036349], [92.9540730282477, 20.605467085137946], [92.95699244344655, 20.60358889601082], [92.96397776376284, 20.6065691143732], [92.9661598769768, 20.600588808027112], [92.97138108357024, 20.59329663992804], [92.9723389200052, 20.591958788667228], [92.98150578876118, 20.585392851898632], [92.98310966397986, 20.5848560276836], [92.99047240727583, 20.582391446408167], [92.99923945903384, 20.573197669936576], [93.00163030039812, 20.57150896166928], [92.99306345571398, 20.564754020681562], [92.98919766324161, 20.561004327088085]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
