
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Yar Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Yar Kauk</div><div class="name-mm">သစ်ရာကောက်</div></div>
        <span class="pcode-badge">MMR009001003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2323353719799, 19.994188538370395], [95.23336537001586, 19.99432587114211], [95.23686534615888, 19.99782584728507], [95.24596528287157, 19.994675868396655], [95.25471522322903, 19.99257588307057], [95.26636747457934, 19.996040066196144], [95.26686875309053, 19.99558435813168], [95.272516565687, 19.988275423971686], [95.28613776214809, 19.98030204100644], [95.30042340561573, 19.97764424668469], [95.31470905088207, 19.97166421013526], [95.33006308534317, 19.971984084597864], [95.33198471442307, 19.96402305112298], [95.32999136800731, 19.95040185466189], [95.33006344057537, 19.950370967446247], [95.32002463862625, 19.94541849087068], [95.30906123828555, 19.942760697448307], [95.29012445318102, 19.94176402379071], [95.25856314617232, 19.93312619202021], [95.25868898920555, 19.932635405899305], [95.25823092221935, 19.932793968067244], [95.25821939111205, 19.932823515293023], [95.25291533267654, 19.946415163628956], [95.24793196888533, 19.955052995399456], [95.23658097243401, 19.960036360089987], [95.23431077332361, 19.961033031948944], [95.23264965176008, 19.98428873293875], [95.2323353719799, 19.994188538370395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
