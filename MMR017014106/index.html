
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Put Kha Yaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Put Kha Yaing</div><div class="name-mm">ပွတ်ခရိုင်</div></div>
        <span class="pcode-badge">MMR017014106</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02854977605136, 16.384668536423874], [95.02800803973929, 16.385779170372473], [95.02561008024105, 16.387281180282287], [95.02430080763622, 16.387911832565067], [95.01562151981733, 16.39209249027624], [95.01034319997876, 16.394566769840594], [95.01314724025298, 16.39951515000422], [95.01479675966277, 16.404958439680286], [95.01628140006665, 16.409082059689354], [95.01578639972263, 16.413205769630622], [95.01578639972263, 16.42046346042042], [95.01529176000679, 16.42508198994193], [95.0182606801863, 16.426731420318845], [95.02452864008472, 16.427391209736584], [95.03327088044682, 16.424257229787372], [95.04208613856451, 16.420886694865146], [95.04240041204946, 16.41435061558849], [95.04180554738815, 16.409710666014462], [95.0407014712959, 16.406523097263175], [95.03814770155526, 16.399150129574878], [95.03810993722391, 16.39904109756867], [95.03658758734736, 16.396803881993606], [95.03634912940885, 16.396453402702434], [95.03588058622012, 16.396077582314604], [95.03359194561187, 16.392072911135983], [95.03222313968621, 16.39010744730092], [95.03080797640706, 16.3880754174466], [95.02854977605136, 16.384668536423874]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
