
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyat Khoe Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyat Khoe Su</div><div class="name-mm">ကြပ်ခိုးစု</div></div>
        <span class="pcode-badge">MMR017014080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.04151811956564, 16.503596820037274], [95.04613691978307, 16.500957659668302], [95.0530647599308, 16.499143260353208], [95.05545748807265, 16.498245917714996], [95.05389082859892, 16.497082095162625], [95.05274868870106, 16.493941206621457], [95.05242660910079, 16.492366594442842], [95.05042559956183, 16.492050540300227], [95.04531215962851, 16.488421739871455], [95.04333251978, 16.484133060092688], [95.0421779998149, 16.47901971009162], [95.04349776031347, 16.472586780355698], [95.04663156039823, 16.467638400192072], [95.0408585999445, 16.467638400192072], [95.03030196026731, 16.470607410303785], [95.02568351977868, 16.47225683978138], [95.02601327958922, 16.478194949937063], [95.02667315983854, 16.481658869561215], [95.02551828014458, 16.4872670400419], [95.01892056043556, 16.487761949554397], [95.01661115987719, 16.487596979716898], [95.02023996030596, 16.492215510137726], [95.02667315983854, 16.495349490086937], [95.02836552025263, 16.49726766037429], [95.02914707967403, 16.498153620293408], [95.03426051960736, 16.500132990345264], [95.03887896009599, 16.502277240302476], [95.04151811956564, 16.503596820037274]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
