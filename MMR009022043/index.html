
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Ni Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Ni Chaung</div><div class="name-mm">ညောင်နီချောင်း</div></div>
        <span class="pcode-badge">MMR009022043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.54672115185974, 21.016755504163257], [94.54627535522354, 21.0122975422978], [94.53367128210402, 20.989790267906585], [94.53142693130792, 20.981810354064635], [94.53162894961639, 20.981839841935198], [94.53100492803509, 20.980176973888263], [94.52401172066442, 20.980176853379135], [94.51648056942281, 20.980176722078113], [94.50554198677332, 20.979191646077652], [94.50513046869622, 20.978961232574875], [94.50126080823975, 20.98123750390772], [94.49000717239318, 20.99429172278485], [94.47650280775844, 21.014098124428926], [94.46893232916369, 21.01667896915916], [94.469442287032, 21.019993697551172], [94.46630401461863, 21.024925266687774], [94.47426040489381, 21.027956271564733], [94.48034644902947, 21.03323084392838], [94.48010706568857, 21.034667142174897], [94.48730629874677, 21.036605397021503], [94.49901008125033, 21.03390452427442], [94.51026371799622, 21.025801906033166], [94.51567644331328, 21.02420992794589], [94.51791619137919, 21.02355117814443], [94.52826953660991, 21.02265088662915], [94.54402462823407, 21.01769928689265], [94.54672115185974, 21.016755504163257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
