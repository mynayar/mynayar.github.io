
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hlar Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hpa-An</div><div class="name-mm">ဘားအံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hlar Kar</div><div class="name-mm">လှာကာ</div></div>
        <span class="pcode-badge">MMR003001077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.54315999963433, 16.936867000012114], [97.54165899966318, 16.936579000220718], [97.53926399983379, 16.935393000386682], [97.53387699962389, 16.934997000111537], [97.52988699998514, 16.93420599960723], [97.52549799993278, 16.93282299968172], [97.52310300010345, 16.932032000076788], [97.51991100039243, 16.931833999939215], [97.51871400005115, 16.93064800010518], [97.51731700037931, 16.9334139999562], [97.51711800019564, 16.93519200011076], [97.5159209998543, 16.93696900021922], [97.51671899978209, 16.941513000224802], [97.51791600012336, 16.94546399986376], [97.51871400005115, 16.947043999880748], [97.51991100039243, 16.949415000401984], [97.52070900032015, 16.95119299965728], [97.522105999992, 16.953168999949412], [97.52250500040549, 16.955539000424608], [97.52290399991972, 16.958107000138], [97.52370199984745, 16.956527000121014], [97.52549799993278, 16.954551999874923], [97.52689399955847, 16.952971999857937], [97.5284900003133, 16.951193999703378], [97.53028600039863, 16.948627000036083], [97.53361199999387, 16.946516999859682], [97.53721799991081, 16.943989000192232], [97.53992299964676, 16.941906000361655], [97.54157600033221, 16.938930999865818], [97.54315999963433, 16.936867000012114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
