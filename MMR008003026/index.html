
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pe Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pe Gyi</div><div class="name-mm">ပဲကြီး</div></div>
        <span class="pcode-badge">MMR008003026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99475784369957, 18.526025604797894], [94.99826904607966, 18.545969383280465], [95.00638357404279, 18.564411490897612], [94.99790020443095, 18.57289485961013], [94.99236757160622, 18.588755072988306], [94.9878479648118, 18.592833939135005], [94.9909818341444, 18.59557607367691], [95.00743464499294, 18.597534742234643], [95.01056851432554, 18.592833939135005], [95.01409411575088, 18.588524869027538], [95.01997011962538, 18.587741402144047], [95.02584612260051, 18.586174468377067], [95.03093865959153, 18.581081931386052], [95.02703873514957, 18.57732096569009], [95.02482568165993, 18.57178833376463], [95.02962063028792, 18.564042648349584], [95.03294020872369, 18.561460753211236], [95.03330905127177, 18.548551278418813], [95.0347635760782, 18.546369490759446], [95.02815299876193, 18.54317082527342], [95.00840075968739, 18.53225511418225], [95.00657660542606, 18.531247028127893], [95.00168921908227, 18.52854610411947], [94.99475784369957, 18.526025604797894]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
