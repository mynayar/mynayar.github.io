
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyeik Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyeik Taw Gyi</div><div class="name-mm">ဂျိတ်တောကြီး</div></div>
        <span class="pcode-badge">MMR008012033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57622703474993, 18.375701160280357], [95.5819393260391, 18.369988869890506], [95.58366914591443, 18.367683430845716], [95.58276741998048, 18.36756046834097], [95.57880454299533, 18.36650370108498], [95.57884032791884, 18.359243701735522], [95.57600954270629, 18.357876964250522], [95.56986077535458, 18.357393441054512], [95.56750225922195, 18.35648063367438], [95.56694799985036, 18.355944885947792], [95.56427399794671, 18.354615072827414], [95.56427399794671, 18.353029923292354], [95.56657201039002, 18.35331175103653], [95.56754028885331, 18.348538252138667], [95.56211431922054, 18.34646767464352], [95.55606601063795, 18.342099453427068], [95.55438592596977, 18.338739283191444], [95.54766558459909, 18.340083350566204], [95.53657702111269, 18.341763436133704], [95.54430541436346, 18.355540136168372], [95.55035372114736, 18.360580391971553], [95.55304185769563, 18.364276580399917], [95.55976219906631, 18.37166895455863], [95.56715457502366, 18.370996920871278], [95.57622703474993, 18.375701160280357]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
