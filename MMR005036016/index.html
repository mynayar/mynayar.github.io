
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Kyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Kyan</div><div class="name-mm">မကျန်</div></div>
        <span class="pcode-badge">MMR005036016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59679148034263, 26.370602640299637], [95.59051524038608, 26.36468504997515], [95.56872551976699, 26.339721659626946], [95.5452880801808, 26.310119669587152], [95.53009032001233, 26.31549068974357], [95.51647943967447, 26.32189940973001], [95.48968499996283, 26.330078160079097], [95.4794019601324, 26.332971299785697], [95.46972660030241, 26.33569334976835], [95.46252443995098, 26.34448238995037], [95.45678351964375, 26.356839299694002], [95.45611571996454, 26.358276329988712], [95.44152815969687, 26.38391112000221], [95.43927096028665, 26.399600730189604], [95.43908700036485, 26.400878909634002], [95.461730999586, 26.414489789971867], [95.48010252031514, 26.4251098804167], [95.49792468027982, 26.435485800429376], [95.51470932027894, 26.44671626974008], [95.5253138398619, 26.453907630133074], [95.53088376037732, 26.442321749649068], [95.56091316041409, 26.405883810389582], [95.59411632011216, 26.37249759009177], [95.59679148034263, 26.370602640299637]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
