
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Thayt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin Thayt</div><div class="name-mm">ခြင်္သေ့</div></div>
        <span class="pcode-badge">MMR012002054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.04367648388268, 20.520407521589902], [93.04281817721716, 20.519402076844415], [93.04341027826177, 20.514879008559433], [93.03865524694214, 20.50728924760074], [93.03380877255688, 20.504088746598427], [93.02658478386076, 20.498785057784232], [93.02649368523544, 20.49873191684452], [93.02492981276072, 20.503020671266995], [93.02254007306595, 20.503208633171937], [93.02159422729181, 20.503959292787158], [93.0206483716251, 20.504709947905837], [93.01875663421134, 20.506211241955327], [93.01285410033654, 20.512082422765673], [93.01158771819871, 20.513341993438303], [93.00934018380252, 20.51540530890793], [93.00382062801964, 20.520472457138226], [93.00645268464376, 20.525596256362178], [93.00979646563445, 20.532105561922208], [93.0201535430516, 20.5279767105568], [93.02293307590077, 20.527162724280345], [93.03223668657387, 20.524438159793306], [93.03837851475669, 20.52263913888521], [93.04367648388268, 20.520407521589902]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
