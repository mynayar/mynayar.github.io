
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Ngun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Ngun</div><div class="name-mm">နမ့်ငွန်</div></div>
        <span class="pcode-badge">MMR015011032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.78046068511259, 23.682223518800413], [97.77538365693027, 23.689959943896326], [97.76473842593765, 23.698427740847592], [97.74877058079772, 23.705685853419425], [97.74592574098023, 23.70853069323698], [97.74663951490174, 23.708744853292387], [97.7489218881347, 23.709429650158256], [97.75009392419531, 23.710015725745222], [97.75360940644902, 23.71177364044121], [97.7612266902596, 23.712945752044845], [97.77038782313957, 23.71266833637469], [97.7708948249363, 23.7126529831487], [97.77880514024508, 23.71177420161814], [97.78612942493305, 23.7138252638249], [97.78726977967665, 23.714395496954694], [97.78750632655579, 23.711604254932467], [97.78750632655579, 23.70632185127249], [97.78950507340045, 23.700753912862865], [97.79307426496541, 23.69390106358327], [97.79478747706048, 23.69076017684074], [97.79721452692894, 23.685477773180764], [97.7994988103219, 23.68162304596683], [97.79778559822682, 23.679053227824284], [97.79278873021576, 23.679053227824284], [97.78522204406215, 23.68233688463954], [97.78046068511259, 23.682223518800413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
