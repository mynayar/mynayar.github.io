
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ya Thit</div><div class="name-mm">ရသစ်</div></div>
        <span class="pcode-badge">MMR010018052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25895084210771, 21.38460256475662], [95.2694978140729, 21.388997546199846], [95.27559465007312, 21.39224947673199], [95.27927696286162, 21.394213551114547], [95.28268147956669, 21.396029454096094], [95.28590422619914, 21.394271596057365], [95.28718351990358, 21.38705265795386], [95.28453636186367, 21.38611030604585], [95.28498960668509, 21.38064441280943], [95.28646757411929, 21.37561932677056], [95.28708383365205, 21.371819057103835], [95.28824113432097, 21.36468237369263], [95.28351164104947, 21.35699694825064], [95.27819096134385, 21.353449827847328], [95.27050553500248, 21.352563047746514], [95.26607163629706, 21.354927795281583], [95.26222892312637, 21.35965728765376], [95.258090616289, 21.363500000824445], [95.25365671668419, 21.36734271399513], [95.25599730123452, 21.376247288281775], [95.25895084210771, 21.38460256475662]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
