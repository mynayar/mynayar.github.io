
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Taw Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Taw Pauk</div><div class="name-mm">သစ်တော်ပေါက်</div></div>
        <span class="pcode-badge">MMR005011044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26708980015422, 23.075317349915792], [95.27447520007047, 23.0747070600828], [95.27947992006233, 23.07427982995023], [95.28527844014798, 23.07427982995023], [95.28906168025242, 23.074519230378257], [95.2891236003739, 23.07427982995023], [95.29492175983142, 23.074890119783277], [95.30010972028742, 23.075500500447788], [95.30352792017743, 23.075073270315215], [95.30670167983874, 23.074890119783277], [95.31091296036487, 23.07287600982005], [95.31408707975498, 23.071289040057195], [95.31628416038575, 23.06787110996379], [95.3167716001293, 23.06732453979572], [95.31390384019011, 23.063110379640364], [95.31170639983054, 23.054321250425403], [95.31154260001102, 23.054294789672838], [95.31152351999452, 23.054321250425403], [95.29809588012085, 23.052123989930237], [95.28308099978835, 23.051086469964673], [95.26971419995044, 23.052673349795327], [95.26788323961989, 23.061279330276932], [95.26708980015422, 23.075317349915792]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
