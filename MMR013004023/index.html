
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saing Di Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saing Di Kone</div><div class="name-mm">စိုင်ဒီကုန်း</div></div>
        <span class="pcode-badge">MMR013004023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.38443274337646, 17.12458884709764], [96.3905744573454, 17.116741102120216], [96.39151575704659, 17.108972400356038], [96.39320565331832, 17.106901067430385], [96.39341905614458, 17.10535250141686], [96.39243494331805, 17.103410789576344], [96.38662824659639, 17.106475956999873], [96.3816471940628, 17.107354966958212], [96.3757871306716, 17.11028499775449], [96.36816904916236, 17.10881998235635], [96.35556991332089, 17.106475956999873], [96.35379760857285, 17.111756711303258], [96.35189647144506, 17.11429156110671], [96.34777733995236, 17.114925272883113], [96.34365820756028, 17.118727548037953], [96.33732108260193, 17.124430961219957], [96.33098395764358, 17.12918380538838], [96.3316176703193, 17.132352367867554], [96.33446937735994, 17.13552093034673], [96.3363705135884, 17.138055781049502], [96.34144021409469, 17.138055781049502], [96.34544473958312, 17.137610833373287], [96.34714362727664, 17.13742206837378], [96.34938829913074, 17.13170835705506], [96.35062904609367, 17.128550092712658], [96.35379760857285, 17.124430961219957], [96.35855045274127, 17.12284668043003], [96.3620358715583, 17.12284668043003], [96.36488757769962, 17.12094554240292], [96.3740764096986, 17.123480392206375], [96.38122354772861, 17.123136719883746], [96.38443274337646, 17.12458884709764]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
