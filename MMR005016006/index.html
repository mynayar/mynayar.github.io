
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Taunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Taunt</div><div class="name-mm">နတ္တောင့်</div></div>
        <span class="pcode-badge">MMR005016006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8601191602711, 22.108746239647303], [94.8600964802684, 22.10883642006479], [94.85137835972358, 22.11140061025003], [94.8431728797247, 22.114990440356564], [94.83496776035389, 22.114990440356564], [94.82830091965178, 22.121144459749075], [94.82573664043366, 22.13088831014744], [94.82188680013576, 22.138160310050296], [94.82368535969164, 22.143196259899526], [94.82676228035501, 22.150888739623667], [94.8334291201578, 22.15037592011265], [94.83958332031403, 22.152427289887555], [94.84881407960614, 22.147298910416453], [94.85070444015787, 22.145660910422748], [94.8565065602296, 22.140632069714286], [94.8621477601111, 22.133965229911496], [94.86881459991389, 22.124734289855667], [94.87496880007012, 22.118580269563836], [94.87599443999147, 22.113451890092676], [94.87506563996737, 22.113018450141396], [94.86830196026733, 22.109862059986142], [94.8601191602711, 22.108746239647303]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
