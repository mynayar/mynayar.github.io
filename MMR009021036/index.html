
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Ku</div><div class="name-mm">ချောင်းကူး</div></div>
        <span class="pcode-badge">MMR009021036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.40346985904682, 21.569240013316005], [94.40565326908319, 21.56487319324333], [94.4105659407656, 21.557231259015452], [94.41711616997532, 21.547951768159635], [94.42093713663962, 21.53430545723114], [94.43567515258627, 21.53485130884087], [94.4416795301862, 21.5244801129669], [94.43513677793999, 21.514011710272257], [94.43349174344928, 21.511379653648135], [94.41929958001168, 21.508104538593614], [94.39964889238252, 21.504283571929363], [94.39036939972806, 21.512471358666346], [94.38370191421205, 21.51051033298552], [94.3854567280456, 21.513017211175395], [94.37999820385409, 21.5135630636845], [94.37235626962621, 21.51738403124807], [94.37235626962621, 21.52666352210389], [94.37039120059347, 21.53321375221293], [94.36908115457169, 21.537580571386286], [94.37508553217162, 21.543039095577853], [94.37999820385409, 21.549589324787576], [94.38818599059107, 21.557231259015452], [94.39328761163404, 21.567245551740882], [94.3969196298371, 21.570877569943946], [94.40346985904682, 21.565419045752435], [94.40346985904682, 21.569240013316005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
