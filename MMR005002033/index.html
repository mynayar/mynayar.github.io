
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Kan</div><div class="name-mm">မကျီးကန်</div></div>
        <span class="pcode-badge">MMR005002033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66344461687561, 22.017685137659043], [95.66128008001175, 22.016838149860803], [95.66048916044645, 22.016779559928807], [95.65376867968087, 22.016281769887826], [95.6451445203034, 22.016003579901337], [95.63679863994531, 22.0179509997389], [95.62706135999383, 22.019341949671286], [95.62569552003231, 22.020161670025118], [95.62604687975977, 22.020385229794556], [95.62625532012697, 22.0253928303149], [95.6275074003463, 22.03019171977212], [95.62768631956806, 22.0328791197756], [95.63135471984452, 22.03376840988426], [95.64296328033117, 22.035426749844703], [95.64989868018, 22.036180590361994], [95.65205294858475, 22.03695004490868], [95.65430663344443, 22.036432227865077], [95.65807320011817, 22.036452030037196], [95.65871975960926, 22.033959210049545], [95.66078111995279, 22.030523010228762], [95.66284284002512, 22.026949470441764], [95.66462988016491, 22.0239256502486], [95.6676535195943, 22.023100980026243], [95.6687774464221, 22.022866805558692], [95.66279690895027, 22.022331325830066], [95.66217465633537, 22.018286697772908], [95.66344461687561, 22.017685137659043]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
