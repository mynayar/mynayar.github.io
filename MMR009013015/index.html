
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Nan Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Nan Ma</div><div class="name-mm">ရေနံမ</div></div>
        <span class="pcode-badge">MMR009013015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.81098834703465, 19.773028029719853], [94.81190886070544, 19.771934919960643], [94.81543749734271, 19.76311332971642], [94.81896613308066, 19.758261455801573], [94.82470016637961, 19.74811662827983], [94.82215410832549, 19.744821729938963], [94.81720181521166, 19.738412878651502], [94.81263521973966, 19.735893379376023], [94.80441050863811, 19.7313556071756], [94.79542841189175, 19.72812205159147], [94.79338352173221, 19.72738589174554], [94.78294239727387, 19.73311167016749], [94.77971005757314, 19.73488424291355], [94.77222566658133, 19.736328599085653], [94.77309386578935, 19.73753072016666], [94.7676913954416, 19.744433876622168], [94.76515443492929, 19.747675547688402], [94.76080172611881, 19.756948710015024], [94.76427227644444, 19.769288442707534], [94.7653261901516, 19.771063456213597], [94.77265278609724, 19.783402986558656], [94.77256133673637, 19.783669381037157], [94.77630565867929, 19.782363221885248], [94.78928975291984, 19.78041560779411], [94.80097543926519, 19.777494187107095], [94.8048706674474, 19.772949753628268], [94.80941510092623, 19.772300549231034], [94.81076125562748, 19.77329770132792], [94.81098834703465, 19.773028029719853]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
