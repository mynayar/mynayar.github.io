
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Pang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Pang</div><div class="name-mm">နမ့်ပန်း</div></div>
        <span class="pcode-badge">MMR015009001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.00382428816044, 24.054572211438483], [98.01919670116689, 24.042470524794908], [98.02237249419534, 24.04047431223978], [98.02766864489212, 24.03714530261368], [98.00112408540826, 24.019344833397383], [97.98470580402972, 24.008280339366195], [97.97676556557843, 24.000340101814288], [97.97506898734395, 23.99864352268048], [97.95079848506208, 24.01434796538632], [97.94579796760218, 24.02303307541615], [97.9487092960972, 24.0242662608793], [97.95168913404638, 24.025528465666184], [97.9599847117251, 24.02813661471305], [97.96729554525325, 24.031445478625983], [97.97474021768693, 24.032876443892803], [97.97607525496909, 24.033133056445422], [97.98131954715944, 24.035829216745014], [97.9867203753451, 24.043727792303798], [97.99535161868232, 24.050660630883442], [98.00382428816044, 24.054572211438483]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
