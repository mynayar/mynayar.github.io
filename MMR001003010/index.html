
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sha Dan Lawt Hkum</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sha Dan Lawt Hkum</div><div class="name-mm">ရှဒန်လော့ခွမ်</div></div>
        <span class="pcode-badge">MMR001003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.92950818675348, 26.245180092287455], [97.94991818907323, 26.241259369224565], [97.9826835632959, 26.244067829666676], [98.00608740061313, 26.248748597669703], [98.02293816506432, 26.25998244033741], [98.02574662640575, 26.268407821663686], [98.05008661840276, 26.267471668782548], [98.07349045661931, 26.26653551500209], [98.09408583529313, 26.271216283005117], [98.08472429928702, 26.244067829666676], [98.06412892061326, 26.234706293660565], [98.04540585039973, 26.233770140779427], [98.02855508594854, 26.22628091323361], [98.00327894107033, 26.224408604773316], [97.99517393512906, 26.223671786623697], [97.9826835632959, 26.22253629811172], [97.96115203084162, 26.220663990550747], [97.9452374210702, 26.228153219895205], [97.93868434640552, 26.238450908782454], [97.92950818675348, 26.245180092287455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
