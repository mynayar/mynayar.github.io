
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Yoke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Yoke Kone</div><div class="name-mm">ငြုပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009016074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52069077685792, 19.179351846810334], [95.51977326962077, 19.180498440150927], [95.51969740641022, 19.18059343104204], [95.51958837710197, 19.18079772913194], [95.51873589264738, 19.182397489052903], [95.51208274142544, 19.182359647379883], [95.51160207357691, 19.183259979364607], [95.50778379768417, 19.18549902865732], [95.49969664418484, 19.186357478315017], [95.49446642818316, 19.186780865644494], [95.49268967358961, 19.18744343486668], [95.49208245674004, 19.18766987336602], [95.49036496567066, 19.187894049171064], [95.48971358311542, 19.187979071077336], [95.48925294766548, 19.188716087977127], [95.4881369456636, 19.20731611384764], [95.49011334885205, 19.219503931261443], [95.49036894876804, 19.221080133441433], [95.50934097470628, 19.225544138751047], [95.51290274866295, 19.229429710013164], [95.51343298084743, 19.23000814495998], [95.51864098809119, 19.221824133576945], [95.52756899960968, 19.218104129302162], [95.53277700685345, 19.217732128335115], [95.53168994323636, 19.211937326046836], [95.53091700471606, 19.202108106603873], [95.52124499216274, 19.180160077425683], [95.52069077685792, 19.179351846810334]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
