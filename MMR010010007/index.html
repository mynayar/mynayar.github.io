
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Kone</div><div class="name-mm">လက်ပန်ကုန်း</div></div>
        <span class="pcode-badge">MMR010010007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96031289182656, 22.46572006143174], [95.97105799523035, 22.4648773076417], [95.9792048808007, 22.46303768773913], [95.98183290936134, 22.459358449732747], [95.9852493447815, 22.454627999582556], [95.98866578110096, 22.450948760676795], [95.9952794197095, 22.449736264117348], [95.99299042296968, 22.447701600148775], [95.99121009177236, 22.44592126895145], [95.99044709255935, 22.442614940227372], [95.98586909907971, 22.44032594258823], [95.98205410481313, 22.43752828030597], [95.97976510807337, 22.433967617911264], [95.97976510807337, 22.429389625330998], [95.98052810728637, 22.426337629378168], [95.98103677282887, 22.42303129975471], [95.98154543927069, 22.419470638259384], [95.9835801032392, 22.416164308635985], [95.97105799523035, 22.41783561322302], [95.95937885055355, 22.41856958501836], [95.9614034097396, 22.423378998342173], [95.96188545175227, 22.424524306551575], [95.96303406137287, 22.426375102329132], [95.96565414172534, 22.43059721339074], [95.96556261862003, 22.431563401829578], [95.96851163230605, 22.43720874308906], [95.96851163230605, 22.444886101612326], [95.96447091629983, 22.454179745099225], [95.96060494756034, 22.460623028729856], [95.96052626767317, 22.461995713431463], [95.96031289182656, 22.46572006143174]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
