
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Ta Dar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Than Ta Dar Ward</div><div class="name-mm">သံတံတားရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12944316756818, 16.809560060248657], [96.12641438761398, 16.80948140464318], [96.12636756890822, 16.810613632213403], [96.12630496260402, 16.81142818236475], [96.12673187257792, 16.81131362942051], [96.12754821777611, 16.811311721958475], [96.12814331086514, 16.811330795679737], [96.1284969332869, 16.811357498349935], [96.12879972242928, 16.81144635496537], [96.12897148124893, 16.810424422948813], [96.12924385082312, 16.810104687881108], [96.12944316756818, 16.809560060248657]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
