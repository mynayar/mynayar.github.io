
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Taw</div><div class="name-mm">အုံးတော</div></div>
        <span class="pcode-badge">MMR009024062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14899406682281, 21.81477558842272], [94.14840525010226, 21.811158568213386], [94.14767639185209, 21.801197511755788], [94.14840525010226, 21.787592167644448], [94.14580478216504, 21.782174528431767], [94.1454898189001, 21.78224721163957], [94.1420884830971, 21.780060638687587], [94.13893009914483, 21.77617339828373], [94.13654192696839, 21.77617339828373], [94.13309923763978, 21.77617339828373], [94.12338113483156, 21.779088827687303], [94.11609255772544, 21.782004258889515], [94.11552034608718, 21.781600344580283], [94.11074760082118, 21.78613445294269], [94.10613150306648, 21.79172236169768], [94.10624210169169, 21.792238493411787], [94.10686036041739, 21.795123698400005], [94.10880398061926, 21.798039128702897], [94.11099055357124, 21.803869991107263], [94.11317712742255, 21.811158568213386], [94.11730732057646, 21.813102188415314], [94.12508180318275, 21.814316951266335], [94.13063731835763, 21.81530900690518], [94.13261333303893, 21.81407399761696], [94.14500391429925, 21.81455990401639], [94.14899406682281, 21.81477558842272]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
