
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ge Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ge Gyi</div><div class="name-mm">ဃဲကြီး</div></div>
        <span class="pcode-badge">MMR010024015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80738301061751, 20.549825137120422], [95.810206817091, 20.550354601283857], [95.8190498076026, 20.547138967389458], [95.8277141531857, 20.54020749128273], [95.83117989123906, 20.535875319390527], [95.83117989123906, 20.530243494042054], [95.82294876437402, 20.529810277122635], [95.81515085262981, 20.524178452673482], [95.80778615960367, 20.51768019438549], [95.80648650794603, 20.51334802069465], [95.80778615960367, 20.50858263188303], [95.80827352920005, 20.502815427090354], [95.80193772714443, 20.502328056594592], [95.79072823002383, 20.501597003099278], [95.77683820192152, 20.500622263906394], [95.76294817291989, 20.499647525612886], [95.7570997395614, 20.503384024353295], [95.75839939211829, 20.50858263188303], [95.75926323860762, 20.510803950142247], [95.76143191325224, 20.516380541828596], [95.76290719171357, 20.520560498068562], [95.76403121656745, 20.523745235754063], [95.77078530409858, 20.527497505905217], [95.77182912741233, 20.52807740764632], [95.78135990683427, 20.538474621806415], [95.79262355573258, 20.542806794597936], [95.79998824875872, 20.547138967389458], [95.80691972486545, 20.549738270704665], [95.80738301061751, 20.549825137120422]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
