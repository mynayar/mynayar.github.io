
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hmun Nyaung Pin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hmun Nyaung Pin Thar</div><div class="name-mm">မွှန်းညောင်ပင်သာ</div></div>
        <span class="pcode-badge">MMR009017012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22413840406415, 19.569976660994143], [95.22199827569995, 19.559276018273692], [95.21486451418605, 19.556422512588938], [95.20844412909332, 19.554282385123997], [95.2063039998298, 19.55035881570683], [95.20273711862319, 19.543581742403546], [95.19417660516626, 19.542154989561197], [95.17747061357801, 19.545396451085423], [95.17650697561652, 19.54577444963121], [95.17635665303715, 19.549226955059964], [95.17635537689921, 19.549249686324004], [95.17579917319335, 19.55915854073413], [95.176737279402, 19.560971904929545], [95.17756111685213, 19.567637307615712], [95.17801541567894, 19.568293515933078], [95.18022695471024, 19.579793521054228], [95.18066926287622, 19.595274296971297], [95.18111157104221, 19.61031276472238], [95.19521551368507, 19.600037953688684], [95.20899155811395, 19.596757943624254], [95.22164158838865, 19.594944825843072], [95.224851779586, 19.582817432078855], [95.22462589416972, 19.575814953597273], [95.22449509227476, 19.571760101147788], [95.22413840406415, 19.569976660994143]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
