
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009012701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1860214979938, 19.346803846420414], [95.18604718532941, 19.34657265770204], [95.19293143533753, 19.347337575169036], [95.19499358798373, 19.347062620943234], [95.1943381027213, 19.342746075670902], [95.19047403694731, 19.332219826783614], [95.18740943160003, 19.324624938789952], [95.18754267605374, 19.318229242785378], [95.18814575332391, 19.31625925805838], [95.1866564391434, 19.316519428329002], [95.1867219799355, 19.315977513951168], [95.17727656686014, 19.31877999929759], [95.17667695557708, 19.317505823634917], [95.17659713714824, 19.314392889620194], [95.1688376741194, 19.314689030974023], [95.16078383510597, 19.321558481738577], [95.15895697838192, 19.329130490080104], [95.16487841061024, 19.334287867291266], [95.17049574518256, 19.34003583738405], [95.17285237183955, 19.339497178551994], [95.17782433132788, 19.337202428849082], [95.17807321690549, 19.337237984445494], [95.17916293532124, 19.337393657990958], [95.18088399759847, 19.34121824172854], [95.1831787482007, 19.344660367182257], [95.18528226876174, 19.346381428560107], [95.1860214979938, 19.346803846420414]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
