
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (38) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (38) Ward</div><div class="name-mm">အမှတ် (၃၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19632693703858, 16.891841616197667], [96.19656613136866, 16.892005711478593], [96.1971616503209, 16.89229737511759], [96.1973930842265, 16.891867981270114], [96.19785877440243, 16.890911968816884], [96.1985220301075, 16.88976420735462], [96.19925020020075, 16.888419292099627], [96.19958323923562, 16.887706321089173], [96.20007433069387, 16.886950136771198], [96.20041865918759, 16.886285772334492], [96.20072347457547, 16.885767242368793], [96.20106780306917, 16.885108275148617], [96.20129923697478, 16.884676164247182], [96.2005386348502, 16.88425350189766], [96.19954872139641, 16.883749008310133], [96.19812011774928, 16.88301086455982], [96.19716834993943, 16.88253021289904], [96.19483392934245, 16.88133997815754], [96.19310951259399, 16.884453773722726], [96.19242095925995, 16.885744094914116], [96.19105339080141, 16.888174056787363], [96.19062979392993, 16.888903181236856], [96.1924896242968, 16.889848710449655], [96.19389915422266, 16.890581130914484], [96.19632693703858, 16.891841616197667]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
