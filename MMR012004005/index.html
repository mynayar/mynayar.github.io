
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mun Htaunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mun Htaunt</div><div class="name-mm">မွန်ထောင့်</div></div>
        <span class="pcode-badge">MMR012004005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00639653816978, 21.07076666564916], [93.00481231043983, 21.068118515657034], [92.9888962842362, 21.063635128158694], [92.97389365986459, 21.06229560775614], [92.95487247698327, 21.059616567850355], [92.94601979717595, 21.059855829782748], [92.94576374220298, 21.067921592007906], [92.94388841381931, 21.08855019883265], [92.9438391273739, 21.090251265583504], [92.95246134061841, 21.090693430757256], [92.9647849250843, 21.089889719235202], [92.97630479622944, 21.090961335197505], [92.98498299586862, 21.091748947955637], [92.98507484272989, 21.091260700620865], [92.98556681415721, 21.09081838256236], [92.98614281913586, 21.086771023264134], [92.98663478696591, 21.086332093851127], [92.9871880795663, 21.083185144778668], [92.98768004829566, 21.082742827619427], [92.98768501075472, 21.082462202268857], [92.98768800999375, 21.082292620707904], [92.9878375591561, 21.082159193691894], [92.98817997512583, 21.081853692194215], [92.98919456687582, 21.079618432644622], [92.99033972669707, 21.079795682724637], [92.992547525448, 21.080137408914368], [92.99419038627735, 21.080172120946656], [92.99698367065992, 21.080231139855243], [93.00023399680157, 21.075270092740652], [93.00639653816978, 21.07076666564916]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
