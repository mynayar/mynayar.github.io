
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Taw Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Taw Aing</div><div class="name-mm">ဇီးတောအိုင်</div></div>
        <span class="pcode-badge">MMR010030063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09549300579766, 20.77893160211181], [96.09549300579766, 20.770601264736626], [96.0964369998677, 20.764937297618246], [96.09297568737816, 20.758329337329087], [96.0939196814482, 20.75046271738057], [96.0901437042686, 20.745113414952186], [96.08888504370987, 20.741022772183214], [96.08322107839012, 20.739449447833806], [96.07913043472183, 20.741337436873266], [96.07315180291346, 20.744169419982768], [96.0690611610438, 20.744169419982768], [96.06402652420479, 20.743854755292773], [96.06402652420479, 20.74731606778238], [96.062453198956, 20.75298003490076], [96.05930655115645, 20.75581201890958], [96.06841138018109, 20.760783443301307], [96.07417076626791, 20.768058455933044], [96.08326453183275, 20.772908464653995], [96.08888504370987, 20.7775238906151], [96.09517834110761, 20.778782550274514], [96.09549300579766, 20.77893160211181]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
