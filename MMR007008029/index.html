
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Hpyu Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Hpyu Aing</div><div class="name-mm">ဆင်ဖြူအိုင်</div></div>
        <span class="pcode-badge">MMR007008029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93466044792137, 18.10420956811714], [96.94719188279919, 18.110960763428523], [96.95265352494027, 18.11642240377097], [96.95447407202084, 18.125525140073194], [96.95629461910147, 18.13462787637542], [96.95629461910147, 18.136473091859727], [96.95875017118351, 18.135180695932434], [96.96479050457816, 18.133565892152262], [96.97480351487036, 18.128559387006135], [96.99255384958053, 18.121732334779495], [97.00893877510447, 18.11445014555784], [97.01326154188672, 18.110127378775587], [97.00167357857288, 18.1042443440013], [96.98605488802275, 18.09513344095558], [96.96783308283057, 18.092096472674143], [96.96002373710581, 18.086890243390087], [96.95221439228044, 18.077779340344307], [96.9460388691985, 18.068253759903143], [96.94376318512298, 18.07371540204423], [96.94330804812796, 18.084638685427024], [96.93693613199696, 18.090555463663748], [96.9328399008408, 18.096017105804833], [96.93466044792137, 18.10420956811714]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
