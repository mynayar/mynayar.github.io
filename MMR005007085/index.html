
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpoke Kone</div><div class="name-mm">ဖုတ်ကုန်း</div></div>
        <span class="pcode-badge">MMR005007085</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62553028039821, 22.96775520014245], [95.62298003959722, 22.976999460057073], [95.61717108018127, 22.985560169566213], [95.61638916013169, 22.986712530259126], [95.61881736023304, 22.99573169975821], [95.61881736023304, 23.00509791044027], [95.61534839990878, 23.01134193038581], [95.61222647986818, 23.017239179844353], [95.6117282401662, 23.030027460199165], [95.61204647966139, 23.02995131999745], [95.62748976014439, 23.0262583502427], [95.63650920033939, 23.026605299694893], [95.64622199984547, 23.01897357007425], [95.65732259985816, 23.010301260095105], [95.66183232040532, 23.003363430278114], [95.66807652021532, 23.00058827982531], [95.6795237998835, 22.996078650109666], [95.68646171963269, 22.990528350103318], [95.69097144017991, 22.986018720387676], [95.6947870801597, 22.981162230252778], [95.6994123599925, 22.974415109769552], [95.6937466796656, 22.975264979894973], [95.68299276020775, 22.975264979894973], [95.67050472031667, 22.97318364021288], [95.65315991959466, 22.971449160050724], [95.63893740044074, 22.969020959949376], [95.62575527998223, 22.966939530335083], [95.62553028039821, 22.96775520014245]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
