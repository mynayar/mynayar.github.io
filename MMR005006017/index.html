
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ta Wea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ta Wea</div><div class="name-mm">စင်းတဝဲ</div></div>
        <span class="pcode-badge">MMR005006017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70430440032789, 22.462939979996122], [95.70430440032789, 22.467897990100198], [95.706409320234, 22.47210756011583], [95.71651235985757, 22.474212300157603], [95.71651235985757, 22.477580010309282], [95.71146084004579, 22.48094762962944], [95.7103959600056, 22.483289969656425], [95.70855124904097, 22.483280298347154], [95.70836319360654, 22.492119008085808], [95.71072862642501, 22.49408837407924], [95.71083499733732, 22.493972332756982], [95.71431114324474, 22.490180174975137], [95.71536271421792, 22.48886570968483], [95.71918994286165, 22.490061676705068], [95.72414867961794, 22.49166991633365], [95.72414867961794, 22.489227360354448], [95.72296716020634, 22.489221690128943], [95.72324760029659, 22.484736270162784], [95.72958071967452, 22.477611420031053], [95.72703623993061, 22.47337044029365], [95.72408964002494, 22.465372229744673], [95.72114268039047, 22.46158359011065], [95.72070671963945, 22.461401880292613], [95.71609152030749, 22.459478760136733], [95.70977712031788, 22.45863690027278], [95.70867011963037, 22.459488300144983], [95.70430440032789, 22.46284647028841], [95.70430440032789, 22.462939979996122]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
