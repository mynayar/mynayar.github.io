
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hmone Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hmone Pin</div><div class="name-mm">သမှုန်းပင်</div></div>
        <span class="pcode-badge">MMR009006008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23722913811429, 20.442548719048204], [95.24594844126761, 20.442169618832907], [95.25583753937099, 20.43574170641466], [95.25929872325753, 20.440191800111563], [95.26078208662403, 20.449091988404575], [95.25880426790269, 20.46392563376105], [95.25880426790269, 20.471314987996323], [95.25929872325753, 20.47134245688892], [95.28402146671738, 20.467386817647593], [95.2899549246801, 20.463908584413673], [95.2899549246801, 20.45453099101246], [95.29489947373179, 20.441180709921866], [95.30033847813831, 20.433269432338477], [95.30182184330346, 20.42634706276681], [95.31881547585357, 20.42634706276681], [95.31813885382508, 20.419919150348562], [95.31368876012823, 20.412996780776837], [95.3042941173797, 20.410524506700654], [95.30132738794867, 20.405579957648968], [95.29341611036529, 20.402613229117264], [95.27907691766569, 20.39816313542042], [95.27858246321017, 20.38926294712735], [95.27603938640863, 20.389692762810796], [95.24347616719143, 20.395196405989395], [95.2355648878094, 20.407063322814167], [95.23255434700559, 20.412158085627198], [95.2380371627849, 20.413985690587197], [95.23952052795005, 20.423380334235105], [95.23902607259521, 20.432280521628797], [95.23722913811429, 20.442548719048204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
