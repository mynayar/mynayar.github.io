
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Kha Yaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Kha Yaing</div><div class="name-mm">နတ်ခရိုင်</div></div>
        <span class="pcode-badge">MMR005001069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.76816767979466, 21.96819936021234], [95.76816767979466, 21.96945251961813], [95.76515232042328, 21.974934960380153], [95.76434088012758, 21.98115549003387], [95.76734544043978, 21.98178801020856], [95.77693944040288, 21.98178801020856], [95.78708207987415, 21.982062059716327], [95.79256451973686, 21.982336200055613], [95.79503160022824, 21.98069153968288], [95.79503160022824, 21.97411263019376], [95.7961281597868, 21.969178380178164], [95.79996576031164, 21.96616310983967], [95.803816679796, 21.966625169815757], [95.8040478001659, 21.960386189670942], [95.80380335993715, 21.96040652963768], [95.80199184025128, 21.955198230114263], [95.79886919985375, 21.955198230114263], [95.79229020043249, 21.958213590384958], [95.7851632800614, 21.96369594031546], [95.77830996043639, 21.969178380178164], [95.77310183987805, 21.96890423983882], [95.76816767979466, 21.96819936021234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
