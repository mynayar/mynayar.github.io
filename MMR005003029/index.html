
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pauk Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pauk Pin</div><div class="name-mm">ရွှေပေါက်ပင်</div></div>
        <span class="pcode-badge">MMR005003029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4735764513922, 21.86284121405083], [95.47503284229191, 21.860818449012243], [95.47681004025122, 21.857974933896116], [95.476473718987, 21.857779112815876], [95.47061438314734, 21.85152863393938], [95.46006756316757, 21.840980938919245], [95.45577677987455, 21.834115078248317], [95.45307403923556, 21.829790308675854], [95.44846571971726, 21.83651055022176], [95.44502448009575, 21.840133139932504], [95.4441223197893, 21.841082820415863], [95.43680639969563, 21.843140310077274], [95.43334532912371, 21.844252831702875], [95.43238208506523, 21.844562455692824], [95.43040524030965, 21.845197889670942], [95.4315485996882, 21.847712580271434], [95.43277208416441, 21.84852828874955], [95.43513103287091, 21.84448437565345], [95.43784861771957, 21.844190582429462], [95.44376475923633, 21.84355099897948], [95.45286516989171, 21.849851285008867], [95.4735764513922, 21.86284121405083]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
