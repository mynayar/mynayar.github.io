
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Chaung</div><div class="name-mm">ဆင်ချောင်း</div></div>
        <span class="pcode-badge">MMR010017028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3703100122973, 21.60719449193232], [95.37197409982491, 21.604104041868084], [95.37316273467252, 21.59768541494998], [95.37292500788288, 21.585561340583467], [95.36935910423932, 21.576052262701808], [95.3643668380592, 21.577716352028062], [95.35366912622925, 21.580093620824016], [95.3467750448325, 21.58175771015027], [95.34353424161202, 21.58307771886166], [95.34388511390694, 21.583543679197476], [95.3442821618923, 21.5843064967475], [95.34472605556306, 21.58491852497002], [95.345018284866, 21.585321446427656], [95.34508037495942, 21.58571559589808], [95.3452854563588, 21.58701784839502], [95.34549522412533, 21.58835029562971], [95.34552869869054, 21.588522522996072], [95.3456216400267, 21.589001459649694], [95.34569633321928, 21.589385193172177], [95.34575830819944, 21.589704225869355], [95.34593112731972, 21.59121127917723], [95.34596040025235, 21.59146673969832], [95.34598761014013, 21.591572506266175], [95.34613907126118, 21.592161599977885], [95.34628105172919, 21.59271430981761], [95.34634971586678, 21.597043990587736], [95.34639569280705, 21.597805880936733], [95.34642973394512, 21.59837139532368], [95.34642191883654, 21.600404730094283], [95.34639523685075, 21.601430793596307], [95.34607153667213, 21.60486842064114], [95.35271821817128, 21.605292676715692], [95.36151411478465, 21.6064813115633], [95.3703100122973, 21.60719449193232]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
