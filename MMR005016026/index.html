
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byama Dat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byama Dat</div><div class="name-mm">ဗြဟ္မဒါတ်</div></div>
        <span class="pcode-badge">MMR005016026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93299432922498, 22.01841258577224], [94.93056603379546, 22.012948922854548], [94.92557106874989, 22.006376602698083], [94.92359435979193, 22.00071654043603], [94.92335907915822, 22.000058100900674], [94.92309510475536, 21.999318893252394], [94.9229625338939, 21.99894765491041], [94.9227574497965, 21.9983733577443], [94.92070903699255, 21.997471969955484], [94.91857352035174, 21.996532253061105], [94.91715767898376, 21.995777072553892], [94.91713711058924, 21.995766101724257], [94.91606315998689, 21.995193239876187], [94.91305074409661, 21.993184837010688], [94.91020568574385, 21.991343754810487], [94.90653806787759, 21.992040070193127], [94.90150297238432, 21.993184622072704], [94.901125201367, 21.993546660350148], [94.89748628266585, 21.99703396504549], [94.89532962835972, 21.997670307338865], [94.89194205398269, 21.998669840840535], [94.88374559688185, 21.995879034989514], [94.88696220024542, 21.9993850797577], [94.8872768397544, 22.004731259739913], [94.89137940033913, 22.01550075005963], [94.89804624014192, 22.024218869705123], [94.90420007966998, 22.03139861985045], [94.91496983978635, 22.029347250075602], [94.92368796033116, 22.022680410272756], [94.93167600044711, 22.021402319861238], [94.93189307970192, 22.018577759755885], [94.93299432922498, 22.01841258577224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
