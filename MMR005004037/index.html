
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Son</div><div class="name-mm">ချောင်းဆုံ</div></div>
        <span class="pcode-badge">MMR005004037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74802545690937, 22.499851650633218], [95.74627860027726, 22.50016973994161], [95.74724737876357, 22.500623539644664], [95.74481008561702, 22.501966374048948], [95.74383261608244, 22.503316644947233], [95.74471944025004, 22.506915690406856], [95.74135667996688, 22.514638050105987], [95.73923915965958, 22.52011841972933], [95.73761987995357, 22.522111290403757], [95.74359840024601, 22.527591660027156], [95.74833167966335, 22.527716219727836], [95.75406107965517, 22.524602309948705], [95.75729928023765, 22.524228629947345], [95.75914067989851, 22.523578830198915], [95.75829575964167, 22.52273399987422], [95.75642772026316, 22.5183746702549], [95.7555557996605, 22.51227150032952], [95.75518211965914, 22.505794740335034], [95.75530668025914, 22.501435319884138], [95.75530668025914, 22.4975741400346], [95.75443296011309, 22.49524511986641], [95.75359163984234, 22.49568747030054], [95.75128710281763, 22.49822905872412], [95.75114646503738, 22.498384163898095], [95.74968829437933, 22.498829936252605], [95.7487116630129, 22.49972707924138], [95.74802545690937, 22.499851650633218]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
