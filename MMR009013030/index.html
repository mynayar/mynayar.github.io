
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Ga</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Ga</div><div class="name-mm">ပင်္ဂ</div></div>
        <span class="pcode-badge">MMR009013030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97129611612291, 19.611806874088018], [94.98652716289831, 19.61258709082165], [94.99282731223076, 19.61302663716964], [94.99546458402341, 19.609363758730524], [94.99868791611448, 19.596909974915434], [95.00176473425512, 19.583577101102378], [95.00406512360661, 19.579129678392007], [95.00084243093352, 19.578796777249522], [94.99838472857243, 19.57854289863593], [94.99786674605355, 19.578440493733865], [94.9960076962982, 19.5780719641499], [94.99604175002679, 19.57446045768404], [94.99260956298099, 19.574430753076854], [94.99127728302028, 19.57441922196955], [94.98618263891768, 19.575706044798153], [94.98192174099563, 19.57318824074474], [94.98067177867972, 19.577631655176788], [94.97916229720232, 19.583395132279577], [94.97504552732926, 19.588335255767504], [94.96733345137773, 19.601075306380324], [94.97056988659108, 19.60835728695929], [94.97129611612291, 19.611806874088018]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
