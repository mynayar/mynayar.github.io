
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Pyay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namtu</div><div class="name-mm">နမ္မတူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Pyay</div><div class="name-mm">လွယ်ပြေး</div></div>
        <span class="pcode-badge">MMR015015013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.48542310519218, 23.0848925711353], [97.48349985373534, 23.086983061419176], [97.48517850758213, 23.088080642607622], [97.49366079710813, 23.093626755370508], [97.52691261642417, 23.107068980449128], [97.5303965135883, 23.108477363739382], [97.55760173842953, 23.118940911893617], [97.56014185826024, 23.107958390167596], [97.56775613383854, 23.09272983991025], [97.58108111520136, 23.077025397204352], [97.5920075291242, 23.067063078098613], [97.59154850705801, 23.065533005743646], [97.59191425773685, 23.059089714019137], [97.5898538830503, 23.05606754767922], [97.58897512490216, 23.049621836778385], [97.58487353468593, 23.0478638321502], [97.5790140657466, 23.047570719713008], [97.57198265067882, 23.04932848512152], [97.5617284961732, 23.05225812561207], [97.55147443519706, 23.051378946581167], [97.54385710911833, 23.051671770335986], [97.54383976929, 23.051246661704113], [97.54172987343497, 23.052592177886766], [97.53352295721874, 23.04516687325264], [97.52414362632737, 23.042431235413233], [97.51163785000682, 23.04399445677882], [97.50851140637639, 23.042040428722885], [97.48389065862705, 23.04477606836093], [97.46435038526215, 23.047902511991367], [97.44754574793797, 23.04516687325264], [97.44090205488601, 23.04516687325264], [97.43536458910455, 23.05255016156076], [97.43894802683002, 23.053764594360587], [97.45770669131082, 23.052982982778474], [97.48467227020916, 23.052982982778474], [97.49092515836941, 23.058845066047013], [97.492488379735, 23.077212923837408], [97.48542310519218, 23.0848925711353]]]]};
        const layer = L.geoJSON(geojsonData, {

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
