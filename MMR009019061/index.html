
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Thaung</div><div class="name-mm">အလယ်သောင်</div></div>
        <span class="pcode-badge">MMR009019061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2700835650046, 21.5063130432124], [95.27163200960962, 21.4999472127937], [95.27361057926487, 21.49005436811467], [95.27262129443727, 21.48214009219157], [95.26652121368312, 21.479344222258078], [95.2666855872701, 21.481645448878396], [95.24689989791204, 21.48214009219157], [95.24057307828497, 21.48214009219157], [95.24043416180717, 21.48363343803277], [95.23997490591722, 21.488570440873218], [95.23997490591722, 21.497894108226546], [95.23997490591722, 21.501431139135832], [95.24499336395263, 21.509090890732068], [95.24937310908177, 21.515775763740578], [95.2503623930101, 21.52171147090769], [95.25013526203276, 21.522670471964773], [95.25234096176604, 21.522206114220864], [95.26173916493059, 21.516765048568175], [95.26470701761485, 21.505388276647693], [95.26915879933915, 21.505388276647693], [95.2700835650046, 21.5063130432124]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
