
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myauk Hti Bwar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlaung</div><div class="name-mm">ပင်လောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myauk Hti Bwar</div><div class="name-mm">မြောက်ထိဗွာ</div></div>
        <span class="pcode-badge">MMR014009012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58365536180554, 20.213654008425806], [96.58865648271058, 20.214368454140924], [96.60497882441325, 20.23514234194556], [96.62822579478467, 20.256905464215833], [96.64152819956684, 20.260575092966235], [96.66268406991395, 20.258224441404877], [96.69499900789793, 20.25558648702679], [96.71676212926889, 20.26020290673881], [96.73324934188366, 20.264819325551457], [96.73352200733484, 20.2633348182473], [96.73918473878473, 20.232504387567474], [96.75180905834145, 20.201574806632095], [96.7517150207317, 20.201508427671854], [96.7517150207317, 20.19359456543691], [96.74775809006388, 20.191616100102976], [96.71478366393501, 20.183042748823823], [96.68114974876198, 20.180404795345055], [96.65872713924614, 20.17183144406596], [96.62641220126216, 20.156663207740905], [96.60586050535812, 20.154028374909615], [96.58765983243535, 20.202047171040135], [96.58486442385413, 20.209422289906797], [96.58455666056147, 20.210499459182756], [96.58365536180554, 20.213654008425806]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
