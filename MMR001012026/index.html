
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kon Pyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kon Pyi</div><div class="name-mm">ကုန်ပြီ</div></div>
        <span class="pcode-badge">MMR001012026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.4926705239256, 24.30344986871654], [97.49375498220672, 24.296581634734707], [97.49375498220672, 24.292067819574243], [97.49902109914444, 24.289058609767096], [97.50315876296662, 24.28567324862155], [97.50503951875885, 24.281911737037092], [97.50391106474387, 24.276645619199996], [97.50203030895165, 24.270251048247303], [97.49844188988135, 24.26361526563204], [97.48080171762524, 24.263737332412006], [97.46682740236281, 24.25974466988066], [97.46103804277152, 24.256849989635384], [97.45934116236481, 24.260243753146767], [97.45984024383222, 24.272720820409575], [97.45934116236481, 24.280706143673626], [97.44836134220225, 24.281704309306463], [97.43987693567209, 24.286695135672005], [97.43988136033659, 24.29972215275518], [97.44087510220425, 24.311150187830947], [97.44038351838475, 24.31582022872061], [97.45049758909255, 24.313508441361535], [97.45726831138353, 24.311627684669986], [97.46968130195057, 24.30824232442376], [97.47532357112595, 24.30824232442376], [97.48472735188585, 24.306737719070554], [97.4926705239256, 24.30344986871654]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
