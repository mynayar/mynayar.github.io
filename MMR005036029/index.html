
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Khaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Khaw</div><div class="name-mm">ထန်ခေါ်</div></div>
        <span class="pcode-badge">MMR005036029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6004663602344, 26.14358384981489], [95.57888004018179, 26.14845438016556], [95.57884619959248, 26.148472649892938], [95.57221751982274, 26.15205320978788], [95.5654786802969, 26.17152093034673], [95.56023744040561, 26.189491050371714], [95.55274980016321, 26.202220020437665], [95.5479005999328, 26.21272706969853], [95.55950916041945, 26.21331782985402], [95.55987564044852, 26.21331782985402], [95.58709703959676, 26.21331782985402], [95.58892835965611, 26.21331782985402], [95.60571299965528, 26.209472669628042], [95.64942383993832, 26.197754489877866], [95.64456589919695, 26.188442200747033], [95.64455582319272, 26.18842288600746], [95.64317421182045, 26.18577451837939], [95.64217356226015, 26.182915151812836], [95.63952852032503, 26.17535718008986], [95.62963284008356, 26.163898020377417], [95.62182047983134, 26.15764752621243], [95.6082787195873, 26.156605499744046], [95.6066762050429, 26.155430198245085], [95.6004663197649, 26.150875865029207], [95.6004663602344, 26.14941745425216], [95.6004663602344, 26.14358384981489]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
