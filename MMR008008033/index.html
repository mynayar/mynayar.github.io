
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ma Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ma Ni</div><div class="name-mm">ဆင်မနီ</div></div>
        <span class="pcode-badge">MMR008008033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55652320078514, 17.781869446817552], [95.54543583519569, 17.78045796896015], [95.5472989417928, 17.784982656924115], [95.5472989417928, 17.78870887101766], [95.542508095872, 17.795096664679363], [95.53292640403038, 17.80414604060735], [95.52555290034616, 17.81464162441148], [95.52885154256472, 17.81556114972733], [95.52977152473613, 17.819631432744472], [95.52438136520789, 17.82307768338842], [95.52438136520789, 17.82870940711348], [95.52606823256292, 17.835882002252674], [95.53013783928992, 17.83905921980721], [95.5306388363133, 17.846856076646645], [95.53433412002369, 17.84811517877256], [95.53857226329939, 17.849489424697254], [95.54044710514984, 17.8443045183389], [95.54530732027666, 17.84019202833946], [95.54979367194045, 17.831593185776967], [95.55390616193989, 17.823742069241177], [95.56100955334824, 17.820377305268494], [95.57484247270202, 17.821872756422636], [95.58194586500974, 17.82673297065014], [95.58568449244541, 17.83271477436739], [95.58942311898181, 17.835331813212633], [95.59615264692718, 17.83495794974965], [95.59615264692718, 17.830471598085808], [95.59193235339546, 17.81814833827525], [95.58680608013657, 17.803179621042716], [95.58456290385499, 17.792711464762363], [95.58531062898243, 17.7904682893801], [95.57185157219237, 17.78299103540803], [95.55652320078514, 17.781869446817552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
