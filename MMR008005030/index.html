
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Kan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Kan Gyi</div><div class="name-mm">ချောင်းကမ်းကြီး</div></div>
        <span class="pcode-badge">MMR008005030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40619159676481, 18.57912895193965], [95.40505205500841, 18.576447677218596], [95.40223615987094, 18.570346571237337], [95.40143161917393, 18.564312509714625], [95.40151636139103, 18.553080579904872], [95.39918918123578, 18.552364524403345], [95.39310270902286, 18.551827482552312], [95.3866582086095, 18.551290440701337], [95.38021370909547, 18.551290440701337], [95.37699145888877, 18.551827482552312], [95.3721580840284, 18.553438608105353], [95.36696326084586, 18.55530044665835], [95.36837453275854, 18.56112194442227], [95.3689860843404, 18.565097026106912], [95.36943298714272, 18.56800189477167], [95.37066784984148, 18.571882892981193], [95.36994083160414, 18.574772464177954], [95.37737139277561, 18.575058255234353], [95.38901438740413, 18.57682234467552], [95.39518870179722, 18.577527980631828], [95.40171583461813, 18.578586435016007], [95.40619159676481, 18.57912895193965]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
