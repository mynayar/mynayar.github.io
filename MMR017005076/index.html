
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Ma</div><div class="name-mm">အိုင်မ</div></div>
        <span class="pcode-badge">MMR017005076</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.29214688007454, 17.19444798039001], [95.29255764002312, 17.19458495972816], [95.29378956014017, 17.19581705970961], [95.29598016025625, 17.19787067958822], [95.29707528000023, 17.19855522014734], [95.29858152032097, 17.199376740044556], [95.30008740001358, 17.199787410060992], [95.30282555955199, 17.199787410060992], [95.3083018804275, 17.199787410060992], [95.30990135975998, 17.19937016959767], [95.31145079991455, 17.198965980095977], [95.31980207980217, 17.198281440436176], [95.32760580026752, 17.19636470996346], [95.32185588044456, 17.18719191017857], [95.31952812022661, 17.184179970029618], [95.31733787983933, 17.181715590202373], [95.31459972030092, 17.178429780410113], [95.3121351597099, 17.176239270226176], [95.31008171969569, 17.174596410296147], [95.30761716000399, 17.176102379920962], [95.30575308034042, 17.177574240059187], [95.30241479960335, 17.180209619678237], [95.29762320005068, 17.180894160237358], [95.29036703990704, 17.17815599979963], [95.28576516043387, 17.178432210378276], [95.28721812042, 17.180483400288722], [95.28940871963675, 17.185275179705854], [95.29132536017727, 17.189656290005814], [95.29214688007454, 17.19444798039001]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
