
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Nyaung Pin Ward</div><div class="name-mm">ညောင်ပင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45763086204806, 17.662153973910108], [95.4558058154563, 17.660354308236037], [95.45429485771768, 17.659902210644816], [95.45243887813308, 17.659176475038123], [95.45065428237888, 17.658593507091666], [95.44974244517738, 17.65841735672325], [95.44818163575701, 17.660398632013028], [95.4451212845396, 17.664170191612072], [95.44561299766121, 17.66441604817294], [95.44949627802265, 17.666243474225382], [95.4522374171014, 17.66751886532444], [95.45284655911894, 17.66778536495707], [95.45358895095262, 17.66788054339736], [95.45389700826632, 17.668058892368492], [95.45391859395141, 17.668028254621902], [95.45428669035988, 17.667628963602453], [95.4546699855789, 17.66700543360224], [95.4550982885599, 17.66647005487596], [95.45564556459112, 17.6658632923195], [95.45613335409735, 17.66525652976304], [95.45690667892427, 17.66419766961542], [95.45738257112549, 17.66351952322873], [95.45783039866495, 17.66287897857478], [95.45802911283897, 17.66246626452073], [95.45783311623336, 17.6622967415704], [95.45763086204806, 17.662153973910108]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
