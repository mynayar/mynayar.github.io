
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (8) Ward (Ah Pyaung Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (8) Ward (Ah Pyaung Ward)</div><div class="name-mm">ရပ်ကွက် (၈)အပြောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67878909604002, 16.288973380816913], [95.67915064148895, 16.289033281960428], [95.67941374085154, 16.288016771057187], [95.67387076672259, 16.28650439736009], [95.67378067983458, 16.28673933984868], [95.67372118788256, 16.286811128231022], [95.67363789986922, 16.2869122839748], [95.67349002074792, 16.286956335466584], [95.67343052969522, 16.286948177716283], [95.6733693380246, 16.287011808348325], [95.67334724168194, 16.287130910962844], [95.6733693380246, 16.28731364420935], [95.67332854387723, 16.287328327440434], [95.6733119235065, 16.287452513922403], [95.67328095085526, 16.287543690788766], [95.67330134747925, 16.287615479171052], [95.67329709818262, 16.287729686775663], [95.67328520015195, 16.287907524112995], [95.67326140319125, 16.288003784846865], [95.67320616143525, 16.288078020284445], [95.67319341354528, 16.288179990814], [95.67312542299993, 16.28857645334068], [95.67303703583059, 16.288904391124788], [95.67299093838113, 16.288944334513474], [95.67524654149474, 16.28948220913668], [95.67842375455268, 16.290356155012603], [95.67878909604002, 16.288973380816913]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
