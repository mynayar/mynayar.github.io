
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Ma</div><div class="name-mm">သင်းမ</div></div>
        <span class="pcode-badge">MMR009020039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75828893758444, 21.70495163111292], [94.76450037599164, 21.697537978994603], [94.78421581211012, 21.682993803821034], [94.79067988986509, 21.68073137665175], [94.79423513204574, 21.677499339123244], [94.79576256578986, 21.672000578364077], [94.79552794795649, 21.671358465121102], [94.79682076296791, 21.669419241704702], [94.80065176696553, 21.66726430240567], [94.79843678173216, 21.66683361078259], [94.79326551988788, 21.663924776107592], [94.78712464678506, 21.66230875734334], [94.77847165064622, 21.658462981081755], [94.7783981418608, 21.658430309611163], [94.77225726875798, 21.66521759201828], [94.75835950288882, 21.6762065232125], [94.74564681684717, 21.67747779226636], [94.74575455203103, 21.677499339123244], [94.74575455203103, 21.682024192562494], [94.74801697920032, 21.688165065665316], [94.75254183263951, 21.69818438560094], [94.75642027857305, 21.70270923993951], [94.75828893758444, 21.70495163111292]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
