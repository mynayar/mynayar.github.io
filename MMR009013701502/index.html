
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Ward (No-2 Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Ward (No-2 Ward)</div><div class="name-mm">မြို့မရပ်ကွက် (အမှတ် (၂) ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR009013701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.04567458461446, 19.969023142304252], [95.04199506691884, 19.967505115468782], [95.04142163669923, 19.96728087761045], [95.04107378432775, 19.968522523895388], [95.0417166539005, 19.968711400410825], [95.0414533971566, 19.9696115300481], [95.04233355285123, 19.969973809343855], [95.04176218657568, 19.97070585389207], [95.04217296091349, 19.971118552779046], [95.04148650659704, 19.9717124713535], [95.04157149432905, 19.97184559979462], [95.04163811970352, 19.971883670794796], [95.0421363099428, 19.972379774606964], [95.04219155259813, 19.97232119816482], [95.04257399829146, 19.972092219080707], [95.04276947043479, 19.971903177089985], [95.04304001528453, 19.97171679799186], [95.04303718242011, 19.97164623988209], [95.04310942226209, 19.97160763288599], [95.04315474899255, 19.97161295867113], [95.04323548742786, 19.971595651218365], [95.04336721832254, 19.97150379356526], [95.0433530540003, 19.971321407457026], [95.04343520886783, 19.971268155900702], [95.04353062963492, 19.97126455681388], [95.04358818714519, 19.971180291237488], [95.04369014508421, 19.97117205344756], [95.04458537881226, 19.970252382441572], [95.04497665135142, 19.969906040931107], [95.0452948503771, 19.969446448694725], [95.04548748965595, 19.96930799356909], [95.04567458461446, 19.969023142304252]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
