
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Chan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Chan</div><div class="name-mm">ကွမ်းခြံ</div></div>
        <span class="pcode-badge">MMR017015070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06127672044437, 16.608066120355204], [95.06152223985953, 16.60770161973403], [95.06328048011011, 16.605091260153586], [95.06531106025727, 16.602061679802716], [95.06538146997889, 16.601929480361264], [95.06294882812597, 16.60163073457079], [95.0622064368776, 16.601288092871243], [95.06174958037889, 16.60031727292386], [95.06192090122869, 16.59843273997899], [95.06192090122869, 16.596319778335157], [95.06174958037889, 16.594263923641222], [95.06112140213105, 16.592436497646304], [95.06015058218367, 16.591408570748968], [95.0583802631387, 16.591237249899223], [95.0569525866926, 16.59175121334789], [95.05449698334917, 16.592265176796502], [95.0526124504043, 16.59237939069635], [95.05101345220913, 16.59197964114759], [95.05006739959089, 16.59134564968201], [95.04993491956094, 16.591674330306148], [95.0492109599179, 16.594090289735107], [95.04846072028607, 16.597297259560946], [95.0481752403951, 16.598516760040468], [95.04805140015208, 16.60082246978118], [95.05293695997278, 16.603169849608946], [95.0563666801782, 16.60547852981034], [95.06127672044437, 16.608066120355204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
