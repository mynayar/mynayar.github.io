
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Myet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Myet</div><div class="name-mm">ရေမြက်</div></div>
        <span class="pcode-badge">MMR005009006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19310178491952, 22.88930861330192], [95.19447066908617, 22.888063238427776], [95.1974011423489, 22.887185364313154], [95.19887289726648, 22.8862933123865], [95.20179937484136, 22.885865973435955], [95.20376301664993, 22.884527211161924], [95.20815469128604, 22.883660869053926], [95.21936180520322, 22.88375212236258], [95.22123097413021, 22.884418674682138], [95.22340384501149, 22.88288961586312], [95.23040416332157, 22.881489553100437], [95.23413766372227, 22.87868942757507], [95.24067129504431, 22.870055702109028], [95.24533817211903, 22.863288729091607], [95.24049443976662, 22.865697090148615], [95.23225260017739, 22.869054899663922], [95.22797903980091, 22.86844434003433], [95.22584207974825, 22.864781340186767], [95.21149499999433, 22.861118250407003], [95.19897960002857, 22.866307559846064], [95.19346799964853, 22.865305500148736], [95.19114455977365, 22.868354879973765], [95.18564988013793, 22.8750704999037], [95.18473404024382, 22.881786119833635], [95.1902287198796, 22.88728071043647], [95.19310178491952, 22.88930861330192]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
