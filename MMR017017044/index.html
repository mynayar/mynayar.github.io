
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Kha Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Kha Yar</div><div class="name-mm">ကျုံခရာ</div></div>
        <span class="pcode-badge">MMR017017044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26901414428738, 16.529346737661854], [95.26657725943306, 16.528754609637588], [95.26400744129046, 16.52732693229217], [95.26060632492204, 16.525682730573635], [95.2585822702556, 16.525899255846014], [95.25591727416293, 16.526470326244635], [95.25391852641894, 16.52770764679053], [95.2516915145518, 16.528341083374357], [95.25039692427868, 16.528469073988617], [95.2490062801158, 16.527850919584296], [95.25044088044234, 16.5354484497862], [95.25053843889788, 16.537521870038347], [95.25063600005143, 16.539595380222693], [95.24941560024979, 16.545317939971028], [95.25475403976719, 16.54502786994027], [95.26605912043215, 16.546190939760095], [95.27540327973765, 16.547721930322894], [95.27730119999046, 16.547831459654162], [95.28085324777925, 16.539542135860927], [95.28104016017534, 16.538263379951047], [95.28123167979822, 16.536952440003176], [95.27914081359773, 16.535512278269096], [95.27666617430458, 16.533799066174026], [95.27476260540999, 16.5322762117778], [95.27152653801937, 16.53075335558293], [95.26901414428738, 16.529346737661854]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
