
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Gar Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Gar Twin</div><div class="name-mm">နဂါးတွင်း</div></div>
        <span class="pcode-badge">MMR005010015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2701893045928, 22.71297115629386], [95.26428215989381, 22.708496070437377], [95.26365791977724, 22.708453320264596], [95.26367195999302, 22.708496070437377], [95.25268548035069, 22.70770263007239], [95.23767095974705, 22.70770263007239], [95.23468007992182, 22.716308609654675], [95.22228996001371, 22.726318320334258], [95.2191388803551, 22.733045099951426], [95.23309320009116, 22.739685030240025], [95.24468987963428, 22.74328610996605], [95.24467799959007, 22.7433370502647], [95.24700917363452, 22.743909307768376], [95.2478271726859, 22.74252893386324], [95.25132762277161, 22.737564662679063], [95.25143093239166, 22.737418152325915], [95.25599421026465, 22.732495147433156], [95.25739427392665, 22.7322618021405], [95.25926102727465, 22.726428205797106], [95.26277809233517, 22.723192505329905], [95.26401318526035, 22.72205621911928], [95.26509462271872, 22.721061296441746], [95.26719471866141, 22.71826116911774], [95.27010865878765, 22.71304471274334], [95.2701893045928, 22.71297115629386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
