
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Yin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Yin Kone</div><div class="name-mm">သက်ရင်းကုန်း</div></div>
        <span class="pcode-badge">MMR008014029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69417613202296, 18.276123499200196], [95.68742974268855, 18.276766011742097], [95.68100461007475, 18.276766011742097], [95.67425822163966, 18.276123499200196], [95.67040314189154, 18.274838473217017], [95.66397801017706, 18.280299834769608], [95.66116314386403, 18.280679550121192], [95.6624245950191, 18.283707032353732], [95.66368604617418, 18.290771155764276], [95.66368604617418, 18.295816958585817], [95.67136691205343, 18.29604140868412], [95.67811330138778, 18.29796894900784], [95.68228963695725, 18.29700517884595], [95.68485968982287, 18.29861146244906], [95.68746278018324, 18.29965771033511], [95.69319640339137, 18.300928053986524], [95.69321350310076, 18.298327996140188], [95.69321236186107, 18.29315009999715], [95.69289110514046, 18.28929502024903], [95.69224859169918, 18.28640371066274], [95.69385487530229, 18.280299834769608], [95.69417613202296, 18.276123499200196]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
