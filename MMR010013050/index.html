
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Inn</div><div class="name-mm">ရွှေအင်း</div></div>
        <span class="pcode-badge">MMR010013050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10032463057729, 21.503114699683692], [96.11115275669442, 21.502008279058884], [96.11675858264255, 21.500887114049135], [96.11944938028472, 21.49348742300623], [96.11855244773733, 21.483396936119732], [96.11570930494054, 21.477834702109874], [96.11550806004897, 21.476366666788294], [96.1112640792739, 21.47645696411763], [96.11013070866534, 21.476481077639676], [96.11022104826282, 21.479281558397247], [96.11015426730563, 21.479314353974303], [96.10918574332743, 21.479725909822946], [96.10582980170403, 21.478170720302558], [96.10260411968443, 21.475866661717134], [96.09937844216142, 21.476634680945835], [96.10056340867442, 21.47825621615152], [96.1024989637562, 21.480826401217485], [96.10177826325628, 21.483395957657365], [96.10175122963562, 21.48367821707609], [96.0986104220334, 21.485697309283466], [96.09553834421928, 21.486465327612848], [96.09461137791283, 21.48807401960039], [96.09694439916473, 21.48896278990088], [96.09840774092459, 21.48952025355692], [96.10045335413906, 21.490287358175067], [96.10198756067746, 21.49194941773152], [96.10063354320351, 21.49495108312601], [96.09886768929249, 21.497617170096362], [96.09884166291249, 21.497651459447354], [96.0987110777541, 21.49782351324461], [96.10058120266041, 21.49898120781654], [96.10032463057729, 21.503114699683692]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
