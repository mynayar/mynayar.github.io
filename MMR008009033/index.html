
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byet Gyi</div><div class="name-mm">ဗျက်ကြီး</div></div>
        <span class="pcode-badge">MMR008009033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62345585560331, 17.931454990355576], [95.63411804601105, 17.932000885132766], [95.64373299028534, 17.932393332186564], [95.64785368120249, 17.932393332186564], [95.64804990427973, 17.93062732179351], [95.64824612825629, 17.925525513691525], [95.64883479838727, 17.92336705714405], [95.6509932549348, 17.921208599697195], [95.65393660469061, 17.919246367126163], [95.66021575305462, 17.91630301557177], [95.66904580412063, 17.915321900185575], [95.67846452531762, 17.917872802887587], [95.68395877867476, 17.91669546262557], [95.690434150116, 17.915910570316612], [95.69102282024704, 17.91002386900641], [95.69279933202364, 17.90670771339029], [95.68650968317542, 17.905706955012022], [95.67395138824605, 17.905314507958224], [95.66727979372757, 17.905706955012022], [95.65844974266156, 17.90708051835128], [95.65118947801204, 17.908257858613354], [95.64255565002327, 17.910416316060207], [95.6385462169344, 17.91236843485541], [95.63871571665703, 17.914232937200325], [95.63726663364827, 17.916768832016032], [95.6249494325703, 17.926912410379487], [95.62345585560331, 17.931454990355576]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
