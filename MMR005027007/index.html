
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maw Laik Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kale</div><div class="name-mm">ကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maw Laik Ka Lay</div><div class="name-mm">မော်လိုက်ကလေး</div></div>
        <span class="pcode-badge">MMR005027007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.15818575956519, 23.294031299704784], [94.15360007958009, 23.294239740071987], [94.1422341597787, 23.293381949617356], [94.13515691975613, 23.293381949617356], [94.12679340009538, 23.295097619559556], [94.11649992003532, 23.292953099805743], [94.10920848038711, 23.28973632017511], [94.10020163969398, 23.28544727976822], [94.09162355977952, 23.28308828969284], [94.0821876003775, 23.28072929961752], [94.07639736034997, 23.28051492012753], [94.07253743955124, 23.28566175008973], [94.07196647976929, 23.288189040192094], [94.07190347956197, 23.288468669993165], [94.0710362399306, 23.29230968974042], [94.0671759603024, 23.298099929768], [94.06438812041546, 23.304319019607135], [94.0628869198955, 23.30753580013709], [94.06052819961678, 23.31396927036559], [94.05820943981388, 23.31725400007207], [94.06138572027481, 23.32061729994848], [94.0688917201768, 23.322976290023803], [94.0770241203669, 23.326026029577633], [94.0924472398483, 23.31831446983699], [94.11349391990854, 23.315470290121823], [94.12885187991037, 23.316607980174183], [94.14477900015078, 23.315470290121823], [94.15485288015634, 23.314953689860943], [94.15543848719648, 23.31127736385929], [94.1572094402635, 23.300159670432492], [94.15818575956519, 23.294031299704784]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
