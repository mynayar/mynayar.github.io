
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Sei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Sei</div><div class="name-mm">စင်းစယ်</div></div>
        <span class="pcode-badge">MMR009024069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.32067886503768, 21.888566955200872], [94.3201007916183, 21.882619536162736], [94.32194187561714, 21.87592493159036], [94.3219820762119, 21.875611987303444], [94.31736117337948, 21.875488763095973], [94.30557132665547, 21.876859675233902], [94.30383864873471, 21.876089595658357], [94.30294882802605, 21.877019861577423], [94.29415051043776, 21.885018332929747], [94.28428572910315, 21.888750952894213], [94.27335448492158, 21.88848433808181], [94.2725359282905, 21.888601275128792], [94.27388771634509, 21.890350648063986], [94.27575402632732, 21.895416345687863], [94.28215280340919, 21.89754927228114], [94.2925508161673, 21.898082502805323], [94.30241559660254, 21.898615735128146], [94.31388007220761, 21.899415582263373], [94.32057010102938, 21.899833707659525], [94.32127205516127, 21.894669903892975], [94.32067886503768, 21.888566955200872]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
