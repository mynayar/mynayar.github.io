
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Hka</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Hka</div><div class="name-mm">ဝါးခ</div></div>
        <span class="pcode-badge">MMR015007017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.08753137727132, 22.9554048248728], [99.08411722972642, 22.959220638421755], [99.08208156121515, 22.962387229587023], [99.07823641178106, 22.964875268778655], [99.0771054864291, 22.968041864440522], [99.07452352474093, 22.969536684270622], [99.06794498037658, 22.9770892735512], [99.0652307580931, 22.984327204436966], [99.05889757036664, 22.988172352971787], [99.05188582617001, 22.9872676134097], [99.05346912310159, 22.993148431355053], [99.05291197510763, 22.993761293249122], [99.04668356469483, 23.00061254443341], [99.04736211936637, 23.005136252136367], [99.05098108390996, 23.008529030890088], [99.05527860492373, 23.011017070081778], [99.06093323617995, 23.009659957141366], [99.06590931366395, 23.01146943986282], [99.07744476286558, 23.014862217717223], [99.079602618666, 23.017527804664496], [99.08121129716369, 23.015699761734652], [99.09016983616908, 23.00837004783949], [99.0875015611482, 23.007649821282257], [99.08969694565758, 22.999984197113065], [99.09402307590432, 22.990178303386017], [99.09258103278847, 22.98008399977681], [99.09085058068979, 22.965375158736663], [99.09038048706987, 22.95573823143428], [99.08753137727132, 22.9554048248728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
