
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Taw</div><div class="name-mm">လယ်တော်</div></div>
        <span class="pcode-badge">MMR017008062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48143343960163, 17.622746369949084], [95.48057556011406, 17.62379486973748], [95.47924103994211, 17.623985490038365], [95.47872047996623, 17.623872359821576], [95.47704900001139, 17.623508940185502], [95.47342668009725, 17.622651059798613], [95.47266419979303, 17.622746369949084], [95.47190172038813, 17.622841680099498], [95.47047180013351, 17.629704539732757], [95.47038171144686, 17.630097736821142], [95.4700787523326, 17.6314200181194], [95.47104253508496, 17.631628242649356], [95.47109635861011, 17.63170598814088], [95.47659240791336, 17.633101126216047], [95.47671977889473, 17.63313345864225], [95.47685362409555, 17.633282175032377], [95.48065036841984, 17.633812603269064], [95.48158547898674, 17.632293449583074], [95.48162423976692, 17.63223047995274], [95.48305380029268, 17.62889436028655], [95.48305380029268, 17.627893559640142], [95.48305380029268, 17.626892669960796], [95.48171928012073, 17.624700450165676], [95.48143343960163, 17.622746369949084]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
