
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hto Pu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogaung</div><div class="name-mm">မိုးကောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hto Pu</div><div class="name-mm">ထိုပူး</div></div>
        <span class="pcode-badge">MMR001008016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.82061355397241, 25.231488631994807], [96.82358326105873, 25.233520536843344], [96.84078261532551, 25.24060262421176], [96.84783997313633, 25.24350859544535], [96.87994444458053, 25.25349665314809], [96.87307423928479, 25.239216894843878], [96.8931858663347, 25.213126135063135], [96.90623124577542, 25.19410162289165], [96.89916499816621, 25.171272207746256], [96.89916499816621, 25.1620317312794], [96.91601528058078, 25.16583663425331], [96.93330235022336, 25.158897010288854], [96.92478282067071, 25.144431932287887], [96.92478282067071, 25.13470140624497], [96.91667404926801, 25.117672985220167], [96.91018703160626, 25.09821193223496], [96.91062883705126, 25.08760861414629], [96.90634145589354, 25.09012056091518], [96.87780414714376, 25.10795637888384], [96.8742369826507, 25.122225034158078], [96.86781608944102, 25.13292652403993], [96.86353549276885, 25.14719517931411], [96.85568773340225, 25.157183236117476], [96.84141907902733, 25.15861010227445], [96.83143102132465, 25.15861010227445], [96.82215639490175, 25.16075039971122], [96.80360714475398, 25.184293679609652], [96.79861311590264, 25.195708602569994], [96.80146684731722, 25.207836958608823], [96.81002803886298, 25.224245911319827], [96.82061355397241, 25.231488631994807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
