
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Hto</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Hto</div><div class="name-mm">ညောင်ထို</div></div>
        <span class="pcode-badge">MMR010020093</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23833306491906, 20.7458080818775], [95.23833306491906, 20.748557748241524], [95.23695823173705, 20.753025956083036], [95.23730194003258, 20.75749416302523], [95.23917671173592, 20.75918145755827], [95.24073902298755, 20.760587536785465], [95.24589464562143, 20.762306079162272], [95.25276881243082, 20.762649786558427], [95.2586118516557, 20.75886899620724], [95.2641111843837, 20.756463038138747], [95.27167276598544, 20.75577562244706], [95.2730475991674, 20.750963706310074], [95.27407872315462, 20.74408954129933], [95.27545355633663, 20.74099616663983], [95.27648468122311, 20.736184251402108], [95.27648468122311, 20.731716043560596], [95.27682838861932, 20.72793525320941], [95.27717209781412, 20.72484187944923], [95.27820322180128, 20.72174850389041], [95.27820322180128, 20.71212467341502], [95.27180217483055, 20.721545222034422], [95.26611865555157, 20.726630476315506], [95.26193079966674, 20.73500618808515], [95.25475161789291, 20.740390574865216], [95.24864431198546, 20.74271470811732], [95.24417610504327, 20.74408954129933], [95.23833306491906, 20.7458080818775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
