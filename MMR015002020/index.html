
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Kauk</div><div class="name-mm">ကွန်ကောက်</div></div>
        <span class="pcode-badge">MMR015002020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.2062861638754, 23.362432489867558], [98.21429516808757, 23.34592908855666], [98.21628110408972, 23.34183685758495], [98.21095912756175, 23.325461550310365], [98.21647021982483, 23.313666107105234], [98.20775441323565, 23.311085497098077], [98.19110734073126, 23.300459706750132], [98.17198091828482, 23.30293905759146], [98.14683321368193, 23.301876478916427], [98.13299316899963, 23.301160614970456], [98.1348139454073, 23.316455129600627], [98.14382036521772, 23.334877352308013], [98.15557624005152, 23.359464363789414], [98.16209563240756, 23.356862804075206], [98.17057222023186, 23.356744494662735], [98.17302108315653, 23.35595532697681], [98.17766315333193, 23.355390285633234], [98.18203865815758, 23.355329224364255], [98.18308387092395, 23.355722297346176], [98.18361818692983, 23.35592437231196], [98.1858919419596, 23.35678238220123], [98.19155676703122, 23.35516656038851], [98.20449530431489, 23.361636470246935], [98.2062861638754, 23.362432489867558]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
