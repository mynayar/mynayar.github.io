
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Myaing (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Har Myaing (1) Ward</div><div class="name-mm">မဟာမြိုင်ရပ်ကွက် (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701516</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11038766473655, 21.967632574227878], [96.11034413538329, 21.96557403046029], [96.10870833306035, 21.965673132936217], [96.10865469718311, 21.964368830222554], [96.1084874786543, 21.95998352690134], [96.10831047220466, 21.95576522460493], [96.10814387822796, 21.95152276913211], [96.10521926171441, 21.951713822721047], [96.10178665005316, 21.95193023253347], [96.10204635999048, 21.95889518084931], [96.10125075641508, 21.958912596435823], [96.10139672593704, 21.962350762239225], [96.10151352744617, 21.963785742071252], [96.10155466379257, 21.96623223932403], [96.10140628497987, 21.966521353373025], [96.10125162001458, 21.96702104018425], [96.10126351731958, 21.967413651250183], [96.10135985140607, 21.968095035021804], [96.10144436154525, 21.968088582042867], [96.10377769138091, 21.967919629190988], [96.1037870424741, 21.967919195383672], [96.10567805048368, 21.967831469422606], [96.10661208477552, 21.967788138535298], [96.10879161398725, 21.967698335920716], [96.11038766473655, 21.967632574227878]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
