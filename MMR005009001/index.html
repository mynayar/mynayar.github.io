
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnaw Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnaw Kone</div><div class="name-mm">နှောကုန်း</div></div>
        <span class="pcode-badge">MMR005009001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34866796035817, 22.777613459993233], [95.3524213195883, 22.77961515031899], [95.35913675965378, 22.78266777040136], [95.36371560029477, 22.785720299652155], [95.36768388040679, 22.78266777040136], [95.3774521204191, 22.781752020439455], [95.38386228022011, 22.78266777040136], [95.38681500001229, 22.783405860192318], [95.38660979990243, 22.780530990213094], [95.38660979990243, 22.776257429836562], [95.38660979990243, 22.77106802956598], [95.38595136036707, 22.770409769895025], [95.38264151979035, 22.767099750353225], [95.37806268004869, 22.76282618997675], [95.3783679603132, 22.757942069970625], [95.37623100026053, 22.7530580398967], [95.37477156065904, 22.753170276187348], [95.37226272014846, 22.753363230228956], [95.36859972030089, 22.756110570046815], [95.369515560195, 22.760078850158834], [95.37012611982465, 22.764962970165016], [95.36829444003644, 22.768320779680266], [95.36066316007685, 22.767405029718418], [95.35486320017662, 22.770152279604076], [95.3524213195883, 22.77198378042715], [95.34866796035817, 22.777613459993233]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
