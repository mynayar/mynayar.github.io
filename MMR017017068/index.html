
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Za Li</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Za Li</div><div class="name-mm">မဲဇလီ</div></div>
        <span class="pcode-badge">MMR017017068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15419617881065, 16.682343872871513], [95.15426111975495, 16.682203170340074], [95.15659391977363, 16.683092550380934], [95.15719583961635, 16.683321960240335], [95.17054787978088, 16.685747369745343], [95.17762548043163, 16.685183879732335], [95.18220935997402, 16.683853877754302], [95.18242787994274, 16.682635169577452], [95.18154984035289, 16.678119150178702], [95.18330699961842, 16.674224219672055], [95.18232474029458, 16.673778022837553], [95.18053930994125, 16.673160988988514], [95.17922705518453, 16.672701277142266], [95.17686516029897, 16.67173689004551], [95.17509216037496, 16.671012870147877], [95.17307706025821, 16.670192174928957], [95.16863051978271, 16.668622980266377], [95.16763259966478, 16.66142865031202], [95.1737101200261, 16.6525812000624], [95.17158828027499, 16.652325330349754], [95.16737843956338, 16.652367000436755], [95.16464675964028, 16.65635391000501], [95.16300444020283, 16.65813159000095], [95.161362119866, 16.659909359929088], [95.15576519990412, 16.66226744978303], [95.15326716025129, 16.663319730321348], [95.1509431672934, 16.664298769172888], [95.15403251119147, 16.674690194396987], [95.15493571111426, 16.67980833238869], [95.15419617881065, 16.682343872871513]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
