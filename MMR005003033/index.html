
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thaung Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thaung Gyi</div><div class="name-mm">သောင်ကြီး</div></div>
        <span class="pcode-badge">MMR005003033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33781684037496, 21.772727279840126], [95.34084588023325, 21.77144873976755], [95.3486186397385, 21.768933960134177], [95.35456259998404, 21.76801947012251], [95.35822056003087, 21.76801947012251], [95.36210711964793, 21.76596197956178], [95.36393591980692, 21.760246619785732], [95.36507892035593, 21.752473770348274], [95.3630215197274, 21.746529810102686], [95.35890635964086, 21.742643340417885], [95.35616316030166, 21.73898556023545], [95.35530167992863, 21.737016900209824], [95.35450571966328, 21.737749319775332], [95.349247559927, 21.740264100308025], [95.34193163983338, 21.738892410256597], [95.3348446799381, 21.73294845001101], [95.3348446799381, 21.737749319775332], [95.33301587977911, 21.744379079630846], [95.3314156800896, 21.749180040226747], [95.32501451980431, 21.756495689624444], [95.32363067991201, 21.76049258976127], [95.3268433199633, 21.76152515985831], [95.33187288012937, 21.76586882958287], [95.33507328040764, 21.769069409725546], [95.33781684037496, 21.772727279840126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
