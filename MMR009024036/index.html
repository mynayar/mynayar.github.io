
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Boe Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Boe Chaung</div><div class="name-mm">ဝါးဘိုးချောင်</div></div>
        <span class="pcode-badge">MMR009024036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.09510520504125, 21.79674392958873], [94.09588950469697, 21.796038059808666], [94.1058537447546, 21.792301470236737], [94.10624210169169, 21.792238493411787], [94.10613150306648, 21.79172236169768], [94.11074760082118, 21.78613445294269], [94.11552034608718, 21.781600344580283], [94.1119623636722, 21.779088827687303], [94.11165842429688, 21.778765891932437], [94.10734626501818, 21.777631112985546], [94.1024872136141, 21.77495863543271], [94.09714225760916, 21.77301501433152], [94.0934979690561, 21.77301501433152], [94.08912482315213, 21.773257967081577], [94.08490109241154, 21.77392487193532], [94.08475167634884, 21.774472729932597], [94.0849946290989, 21.779574734086736], [94.08280805614692, 21.7890498841449], [94.08175873437813, 21.79240771524394], [94.08450872359879, 21.792694171798644], [94.09106844335406, 21.79463779289989], [94.09510520504125, 21.79674392958873]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
