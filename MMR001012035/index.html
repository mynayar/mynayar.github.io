
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bum Tawm</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bum Tawm</div><div class="name-mm">ဘွမ်တောန်</div></div>
        <span class="pcode-badge">MMR001012035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.67994984790721, 24.25294809118151], [97.67092221758634, 24.26047111614912], [97.6630230421797, 24.270627198686327], [97.6600138323725, 24.276645619199996], [97.66791300777913, 24.28454479460663], [97.67494488959505, 24.286695135672005], [97.68043480012597, 24.289190549304465], [97.68492654412478, 24.291186879670818], [97.69291186738883, 24.28819238367163], [97.7078843482841, 24.28519788767244], [97.71237609318223, 24.283201557306086], [97.71686783718098, 24.27621439877555], [97.72285682917936, 24.269726324410385], [97.72580049729515, 24.26589955621961], [97.71906957809858, 24.26536108174855], [97.70628043529393, 24.260847266588144], [97.69386744382751, 24.25859036035689], [97.68371136129036, 24.25708575500363], [97.67994984790721, 24.25294809118151]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
