
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward (North)</div><div class="name-mm">အမှတ် (၄) ရပ်ကွက် (မြောက်)</div></div>
        <span class="pcode-badge">MMR013013701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.20294003065794, 16.78016808259099], [96.1996517180524, 16.781440734802118], [96.19845008890053, 16.78199577298659], [96.1977596281044, 16.782318751009598], [96.1980495452504, 16.782926559613088], [96.19841194055869, 16.783681869622626], [96.19860267597278, 16.784074783424558], [96.1987457284327, 16.784372330418762], [96.19935035703338, 16.785610198651796], [96.19952201872627, 16.785959244423623], [96.19965418669142, 16.786233453111436], [96.1999893190519, 16.78608322136364], [96.20112037660414, 16.7855701446465], [96.20255470263749, 16.784925461141142], [96.20318031332084, 16.784631729071066], [96.20364952110856, 16.78441143024338], [96.20411987283393, 16.784114074804734], [96.20412127127969, 16.783460618412846], [96.2040859234267, 16.782730484024682], [96.20403584557789, 16.782337361580005], [96.2038946151444, 16.781997680448626], [96.20370101898692, 16.781641006627183], [96.20341173766161, 16.781171798839466], [96.20325224739338, 16.780892235588226], [96.20310656261785, 16.780555089645702], [96.20294003065794, 16.78016808259099]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
