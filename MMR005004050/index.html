
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin See</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin See</div><div class="name-mm">မြင်းစီး</div></div>
        <span class="pcode-badge">MMR005004050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54621723993375, 22.62711240031706], [95.54503643997975, 22.624750529713253], [95.54060771957069, 22.62297906043534], [95.53795056017026, 22.620617189831478], [95.53505076008457, 22.613947379567946], [95.53499820010688, 22.613826689650068], [95.52230279993432, 22.61235051006804], [95.51167415963482, 22.60703619036792], [95.50606464017108, 22.609988640363497], [95.50724579985382, 22.615302870131416], [95.51167415963482, 22.618845719654303], [95.51108376010751, 22.62445532994957], [95.50931255972694, 22.625931510430917], [95.5031122801077, 22.626226710194544], [95.49661715955432, 22.62917907025792], [95.4924836398082, 22.633902899599207], [95.49366480039026, 22.63921722019859], [95.49691236021732, 22.641874379599017], [95.49691236021732, 22.641903370144462], [95.49809351990007, 22.644236250202823], [95.50104587996344, 22.644236250202823], [95.5075409996175, 22.644531539898708], [95.50783620028045, 22.648074390320915], [95.51049335968088, 22.650731549721286], [95.51787444015338, 22.650436260025458], [95.52348395961712, 22.652798219662145], [95.52850307955356, 22.655455379961893], [95.53442291998181, 22.65648488966599], [95.53558859963425, 22.654569599907177], [95.53736015974363, 22.643350560080307], [95.5391313601242, 22.63833153007613], [95.54326487987038, 22.635674369776382], [95.54621723993375, 22.62711240031706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
