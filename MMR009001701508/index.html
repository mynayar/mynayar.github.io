
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyi Taw Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pyi Taw Thar Ward</div><div class="name-mm">ပြည်တော်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009001701508</span>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93516846904964, 20.149965140778647], [94.93419303558017, 20.149750291842565], [94.93162555027897, 20.148930979780914], [94.93173406967162, 20.14804683019713], [94.93244056537986, 20.145610043368833], [94.93290123500407, 20.144089576672684], [94.9301107214327, 20.143353933037645], [94.92819763861019, 20.14293591016417], [94.92780376882894, 20.14472123439748], [94.92768589918495, 20.14525427426537], [94.92748765623043, 20.146129991805708], [94.92695344364654, 20.14815567964098], [94.92747856498386, 20.148169155981805], [94.92798559555882, 20.1481880624292], [94.92740835940833, 20.150812151959315], [94.9272153954742, 20.15170138630998], [94.92687206039733, 20.152824066677397], [94.92636706229013, 20.15441869057014], [94.92801769506065, 20.15476934972577], [94.92894630622709, 20.155031852837794], [94.92908194557538, 20.15464789268617], [94.92924054011888, 20.154401060260795], [94.92981796152975, 20.15431137357109], [94.9302547082882, 20.152982745757186], [94.9310059443689, 20.153214887756917], [94.93141077688591, 20.151713305025055], [94.93438438972788, 20.152498556163494], [94.93514641137784, 20.15004414082449], [94.93516846904964, 20.149965140778647]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
