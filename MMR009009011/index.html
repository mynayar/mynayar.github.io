
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Paung Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngape</div><div class="name-mm">ငဖဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Paung Ka Lay</div><div class="name-mm">ပေါင်းကလေး</div></div>
        <span class="pcode-badge">MMR009009011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.51418353004595, 20.048673115571887], [94.51264408225865, 20.047623493429512], [94.50676870970824, 20.03770880331865], [94.50642895483247, 20.037284110173573], [94.50471602062788, 20.038900334882612], [94.50265382121694, 20.041081507405693], [94.4961896193555, 20.042271237627574], [94.49428354584904, 20.043216963791906], [94.49391633467116, 20.051662810090647], [94.4965693553915, 20.055350600649774], [94.4994627801832, 20.058777023940536], [94.50207918140916, 20.06542053443019], [94.50443490244885, 20.064040391650792], [94.50524391907169, 20.063183785603258], [94.50767096894015, 20.06104227138377], [94.50919382423564, 20.059662182563727], [94.5101456082333, 20.058044150217427], [94.51124016140437, 20.055759867723793], [94.51214435597728, 20.0552839752753], [94.5141906922467, 20.056378528446373], [94.51528524541783, 20.057044776795067], [94.51842613305968, 20.057330312444037], [94.52128148595187, 20.057235133594588], [94.51718881341304, 20.05119130273647], [94.51418353004595, 20.048673115571887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
