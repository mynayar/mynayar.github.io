
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Thit</div><div class="name-mm">မြို့သစ်</div></div>
        <span class="pcode-badge">MMR005005020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53308119983757, 22.753723139811086], [95.53747571992858, 22.745300309861477], [95.540283360189, 22.737304710044384], [95.543517959886, 22.72930911022729], [95.53070051991313, 22.71868892985026], [95.52148452029445, 22.709472660434983], [95.51147471968261, 22.707519570371915], [95.50811771955716, 22.708129860204963], [95.49609371994927, 22.711303709798415], [95.49530027958428, 22.716491670254413], [95.49310319985284, 22.72491459013628], [95.48968499996283, 22.732116659656185], [95.49127187979349, 22.73950196964023], [95.48968499996283, 22.745483369561896], [95.48071272021593, 22.746704129991656], [95.47290035996372, 22.74847416035425], [95.47052003976808, 22.750671419950095], [95.46929928023764, 22.758117659902155], [95.47088616006829, 22.759887690264748], [95.47711163959053, 22.759277309600236], [95.48712144020237, 22.75848387013457], [95.49291996028802, 22.757324220436487], [95.49749771994385, 22.763671919623448], [95.5111082396536, 22.76788329008184], [95.51770020010423, 22.766296410251186], [95.52569579992127, 22.766296410251186], [95.52648924028625, 22.759521480032333], [95.5270994401871, 22.753723139811086], [95.53308119983757, 22.753723139811086]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
