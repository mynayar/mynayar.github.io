
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Myaung Ah Htet Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyauk Myaung Ah Htet Ward</div><div class="name-mm">ကျောက်မြောင်းအထက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17675141474604, 16.803034636139614], [96.17689588723545, 16.80279874666485], [96.1770208075643, 16.80259054371868], [96.1771338325604, 16.802394237903798], [96.17722306239449, 16.802191983972932], [96.17724685665718, 16.802073010860795], [96.17731229222858, 16.8017874761112], [96.17734798362261, 16.801537631856263], [96.1773955730473, 16.801204507681916], [96.17742545122366, 16.80100742575212], [96.17713165260375, 16.800956725572462], [96.17692139560597, 16.800885706110478], [96.17670249972065, 16.800811767449147], [96.17624006023067, 16.80062780033279], [96.17600250341286, 16.80053329507558], [96.17551532537203, 16.800365749579726], [96.1754296667458, 16.80057892038093], [96.17537212362464, 16.800722122128263], [96.17530250530643, 16.80097007780688], [96.17522239729584, 16.80125999495283], [96.17514228838598, 16.80165290875476], [96.17505912807638, 16.802084732624337], [96.1748540286905, 16.802421731078084], [96.1750143957978, 16.8028742141737], [96.17560227722339, 16.803058766748734], [96.17610613499022, 16.80307070434958], [96.17632509202946, 16.80305846637515], [96.17675141474604, 16.803034636139614]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
