
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Char (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Char (North)</div><div class="name-mm">မြေခြား (မြောက်)</div></div>
        <span class="pcode-badge">MMR014006025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.72374740282044, 20.846363584811627], [96.74272626360624, 20.843200441647127], [96.74878297185671, 20.843873408830802], [96.75355425842235, 20.828730232114594], [96.75225863302956, 20.808316374401215], [96.75199225473881, 20.804119319351173], [96.75160195706474, 20.788493354184993], [96.74770081044409, 20.78102668343473], [96.74620148770856, 20.781600567812006], [96.73943064580772, 20.784192197212178], [96.73192757769561, 20.784200885562484], [96.72810710026255, 20.783253913837086], [96.72220200421918, 20.781905277906276], [96.7174620770133, 20.78082274867097], [96.71764909013348, 20.781134436605043], [96.72001748981535, 20.783206786663925], [96.72015680829014, 20.783328689767245], [96.72203759555867, 20.795553811958882], [96.72109720237404, 20.809973187312778], [96.72266452464817, 20.817182874090406], [96.72799342505658, 20.825332954951932], [96.72956074823003, 20.830034926270855], [96.72454531281602, 20.843513905742213], [96.72374740282044, 20.846363584811627]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
