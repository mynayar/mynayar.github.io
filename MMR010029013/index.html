
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Pin Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Pin Kan</div><div class="name-mm">ထန်းပင်ကန်</div></div>
        <span class="pcode-badge">MMR010029013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73750188980046, 21.069087202412504], [95.7434653482473, 21.068590246942392], [95.74573714095635, 21.06631845423334], [95.74545316742979, 21.059219098982283], [95.74431727062557, 21.048996028643842], [95.74232945144308, 21.043316546421522], [95.7420454770172, 21.03593321674458], [95.73664996832144, 21.035081295265627], [95.73352625233474, 21.034797320839743], [95.7292666386445, 21.034797320839743], [95.72188331076626, 21.03451334641386], [95.71308011165786, 21.03451334641386], [95.71222818927959, 21.037069114448116], [95.7105243436236, 21.041328727239033], [95.708820498867, 21.045588339130575], [95.70654870615795, 21.049280003069725], [95.70200511894114, 21.049280003069725], [95.69944935090689, 21.048712055117278], [95.69433781573764, 21.05410756381309], [95.69518973901529, 21.05836717660395], [95.698313455002, 21.06631845423334], [95.69985322564588, 21.067088339555255], [95.7011531956635, 21.06773832456406], [95.70910447329288, 21.068874221368276], [95.7201794660096, 21.070862039651445], [95.7247230532264, 21.070862039651445], [95.73153843315225, 21.070862039651445], [95.73664996832144, 21.06915819489484], [95.73750188980046, 21.069087202412504]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
