
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Du Oe Thei Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Du Oe Thei Ma</div><div class="name-mm">ဒုအိုးသည်မ</div></div>
        <span class="pcode-badge">MMR012010076</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.62334462895154, 20.628328336283744], [92.62583088658619, 20.62530003027223], [92.62649269767991, 20.62471429822631], [92.62716425023001, 20.621798771696035], [92.62766320309441, 20.619632546804667], [92.62381607874909, 20.61998151073817], [92.62360572372523, 20.620000590754728], [92.62358663471548, 20.620014234369478], [92.62098446256294, 20.621873792241786], [92.61948529271217, 20.622624902417385], [92.61717979701007, 20.62158023643883], [92.61495612522504, 20.61727150177842], [92.61162056583652, 20.613657702940714], [92.6099527587129, 20.613657678658967], [92.60842390224133, 20.615186545922427], [92.60790012898781, 20.615435962100037], [92.60782441506478, 20.615573973859853], [92.60674464135218, 20.617656637344], [92.60526743384503, 20.621170438764807], [92.60426720067085, 20.624551897751928], [92.60996007020111, 20.627831911413637], [92.60621720875724, 20.63739124790783], [92.61215790536312, 20.640905116777787], [92.61489307825303, 20.63764417593802], [92.62334462895154, 20.628328336283744]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
