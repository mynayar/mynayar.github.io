
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Hpein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kunlong</div><div class="name-mm">ကွမ်းလုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Hpein</div><div class="name-mm">ဖာဖိန်</div></div>
        <span class="pcode-badge">MMR015020025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.59012629199486, 23.39606663526706], [98.59032921142403, 23.39322577315096], [98.5882126650825, 23.39257279609774], [98.58677095921246, 23.38175999982417], [98.58245773243846, 23.370584819034207], [98.58539856858914, 23.359605694047616], [98.58108534091582, 23.35235163022361], [98.56363637531854, 23.34333306327028], [98.55560674155794, 23.337491419793253], [98.54942393396743, 23.33625206228288], [98.5427832734294, 23.333126726617195], [98.5380957200415, 23.331954677066733], [98.53536121444853, 23.33507980139177], [98.53106409723034, 23.341330076122176], [98.52598574794399, 23.34640838763704], [98.5185635864404, 23.352267943810602], [98.50996954895555, 23.35734617708448], [98.50567247400551, 23.362033858176062], [98.50137532710971, 23.369456077236237], [98.50137525336532, 23.37224237298716], [98.50137514095007, 23.376487744114172], [98.50068767579569, 23.38129929692508], [98.50651774769597, 23.382756814675304], [98.52155594115379, 23.382947170575505], [98.55201304256792, 23.3856121675675], [98.56476695443143, 23.388848234958118], [98.58418335517774, 23.393797514443804], [98.59012629199486, 23.39606663526706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
