
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan In</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyawng</div><div class="name-mm">မိုင်းယောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan In</div><div class="name-mm">ဝမ်အင်</div></div>
        <span class="pcode-badge">MMR016011009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.50595693996087, 21.273013457704963], [100.52129977336591, 21.274328557916647], [100.55724583832483, 21.26687632488256], [100.56382133668541, 21.26599959200763], [100.58047927030213, 21.258985726310243], [100.60458943515437, 21.246273093328625], [100.61686370079923, 21.234437194121256], [100.61357595116925, 21.21222661686494], [100.61708288356829, 21.1870935963924], [100.60890004040459, 21.167805464150888], [100.58961190816308, 21.143841421144714], [100.57499968668623, 21.119292888955727], [100.55337359861272, 21.097082311699353], [100.53759239966956, 21.085977024420174], [100.52239568990922, 21.09006844600202], [100.48732635782522, 21.12922919876854], [100.5001851126529, 21.142672442779087], [100.52648711239038, 21.161960575020544], [100.53350097808772, 21.17540381903109], [100.52940955560655, 21.197029907104593], [100.51888875571154, 21.20988866193227], [100.52707159977456, 21.22157843929358], [100.52940955560655, 21.240866570635774], [100.51655080077887, 21.26307714789209], [100.50595693996087, 21.273013457704963]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
