
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Kan</div><div class="name-mm">လွယ်ကန်</div></div>
        <span class="pcode-badge">MMR015001031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.04560877522488, 22.94000777583824], [98.05301933007809, 22.937082557314227], [98.06104813376442, 22.931667782442275], [98.0588007036896, 22.930748345259985], [98.04669115517271, 22.929185489918495], [98.02676905574737, 22.924106629817175], [98.0205191335512, 22.916684177832565], [98.02012878821307, 22.90535536855549], [98.01936453804308, 22.90295313188159], [98.00882029911759, 22.897222568167024], [98.0083541040587, 22.896969201267666], [98.00067282359197, 22.894977757817344], [97.98758619674567, 22.896115724860863], [97.9730771113197, 22.896969201267666], [97.95145572759981, 22.896798506346045], [97.94974877568552, 22.89782267677515], [97.94718834916307, 22.90977133567867], [97.94519690571269, 22.919159568059683], [97.93752097261483, 22.92976705090871], [97.94946428504875, 22.936798064878815], [97.9628354034312, 22.942203410359127], [97.97592203027756, 22.94447934624486], [97.99782790463416, 22.945901804824473], [98.01432843440978, 22.948177739810887], [98.03139794725752, 22.945617313288437], [98.04560877522488, 22.94000777583824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
