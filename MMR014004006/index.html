
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Bwee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsihseng</div><div class="name-mm">ဆီဆိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Bwee</div><div class="name-mm">ဘန့်ဗွီး</div></div>
        <span class="pcode-badge">MMR014004006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.38856390400105, 20.415375531655513], [97.38887169337403, 20.414452165335206], [97.40568747419763, 20.40292134404484], [97.41769874570059, 20.394753678739335], [97.42106190168545, 20.383703307661563], [97.42154235279742, 20.371211585046638], [97.41706083588895, 20.355526277215972], [97.4013634159889, 20.352474000674647], [97.38214537960562, 20.355837156659504], [97.37205591165105, 20.357278509095977], [97.35139652283135, 20.36496572418889], [97.32593262559027, 20.37361383970699], [97.29614467103977, 20.389949170318005], [97.2519431894267, 20.410608558238437], [97.2442559752331, 20.4490446292063], [97.24374066460007, 20.449869124960173], [97.24906048365443, 20.45000553143018], [97.29037926039462, 20.443759669673057], [97.30142963057307, 20.443279218561145], [97.3105581981024, 20.443279218561145], [97.32160856828085, 20.442318317236584], [97.36148599168524, 20.43078749594622], [97.37202106561972, 20.431745228959187], [97.38839124226206, 20.414932616447118], [97.38856390400105, 20.415375531655513]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
