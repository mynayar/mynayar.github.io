
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hlay Tone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hlay Tone</div><div class="name-mm">လှေတုံး</div></div>
        <span class="pcode-badge">MMR008014038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73109996419203, 18.218382733176668], [95.73093127835585, 18.216527194374578], [95.72934612792153, 18.208205153245274], [95.72931560942789, 18.208016951221396], [95.72258207770079, 18.208686061212802], [95.7190594809104, 18.20912638637367], [95.71245461338975, 18.20912638637367], [95.70695055562368, 18.206704601136494], [95.70562958283904, 18.205163465321732], [95.70408844702428, 18.200099732716524], [95.70210698604865, 18.198118271740896], [95.69792390286591, 18.196577135926134], [95.69087871018439, 18.196577135926134], [95.68911741223883, 18.19547632527224], [95.68625530274011, 18.20120054426974], [95.68449400479454, 18.204282815899262], [95.67943027218939, 18.208465899082], [95.68260700590866, 18.211820399991495], [95.6878997877451, 18.21446679180906], [95.6908402227981, 18.215054879179377], [95.69348661371629, 18.21828935656862], [95.69378065695184, 18.220641704251307], [95.7023079179761, 18.22005361688099], [95.70936496102416, 18.219465530409934], [95.71789222114916, 18.221229790722305], [95.7243611768269, 18.221229790722305], [95.72908166518675, 18.224077899575434], [95.7307112151505, 18.22176222534648], [95.73132756731343, 18.22088635582071], [95.73109996419203, 18.218382733176668]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
