
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Hmyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Hmyar</div><div class="name-mm">ကြက်မျှား</div></div>
        <span class="pcode-badge">MMR010014023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10015032937429, 21.70062168504279], [96.10051228761205, 21.698268949752276], [96.10087424764845, 21.69555425532468], [96.10177914639053, 21.69157270301787], [96.10177914639053, 21.689219967727354], [96.09942641110007, 21.68650527329976], [96.09797857365231, 21.68650527329976], [96.09616877706748, 21.68650527329976], [96.09345408263988, 21.685962333694818], [96.08965350990161, 21.68650527329976], [96.08874861205885, 21.688134090316055], [96.08838665292177, 21.69030584603803], [96.08693881637333, 21.69175368258641], [96.0862148971998, 21.693382498703386], [96.08368118234074, 21.6946493565826], [96.0818713857559, 21.695192296187543], [96.07969963003399, 21.697002091873117], [96.07861375172331, 21.698449929320816], [96.07788983434841, 21.698992868026494], [96.08006158917107, 21.70116462374841], [96.08027380129494, 21.70158904709689], [96.08169040618736, 21.704422256881685], [96.08494804021996, 21.7067749921722], [96.08639841195719, 21.707953419714613], [96.09019644860729, 21.705146176055223], [96.09345408263988, 21.703517359038926], [96.09653073620456, 21.70116462374841], [96.10015032937429, 21.70062168504279]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
