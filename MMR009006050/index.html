
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Pin Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Pin Kone Gyi</div><div class="name-mm">ထန်းပင်ကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR009006050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46987234263457, 20.668278059784654], [95.46728295164695, 20.669516464912988], [95.46766995420506, 20.688866531665155], [95.46572776662322, 20.69313934290642], [95.47540998108582, 20.694284551291048], [95.47863049200367, 20.697674562830855], [95.49089003484727, 20.69544555536811], [95.51411011638879, 20.690801539059805], [95.52223714402902, 20.693897549632254], [95.53771719779053, 20.68847953090568], [95.53965220428586, 20.683448512938583], [95.54855323524367, 20.68190050810199], [95.54851762209063, 20.682505938898032], [95.54932723766194, 20.681513507342515], [95.550488241739, 20.676095487716623], [95.54700523040714, 20.667194456758807], [95.53887820186759, 20.66022843229638], [95.5272681610968, 20.65829342580099], [95.51604512198486, 20.653262407833893], [95.51462422013174, 20.65346539381295], [95.50520908543103, 20.654810413569805], [95.48276300630778, 20.65829342580099], [95.47618398260477, 20.665259450263477], [95.46987234263457, 20.668278059784654]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
