
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yaing</div><div class="name-mm">သရိုင်</div></div>
        <span class="pcode-badge">MMR005006011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83045884000353, 22.398794280131995], [95.83816931965845, 22.402649430027225], [95.84195796019179, 22.40812188022062], [95.85374472044253, 22.408542899635165], [95.85921707980447, 22.40812188022062], [95.86721520042124, 22.404333329619533], [95.87310875996138, 22.404333329619533], [95.87142504023348, 22.39717697983383], [95.8680572401496, 22.392125549954244], [95.87100384005521, 22.38539021958303], [95.87100384005521, 22.380338699771244], [95.8680572401496, 22.372340490121587], [95.86258487988835, 22.36602609013198], [95.86431576006436, 22.364193510122448], [95.86132199971058, 22.363921350090266], [95.85037692035866, 22.36181652011635], [95.84069508001397, 22.36181652011635], [95.83395947984616, 22.362237449598695], [95.82642936012695, 22.363426439678506], [95.8259613601287, 22.363500329776457], [95.82427764040085, 22.37065667956216], [95.8259613601287, 22.377812940314982], [95.82677260167429, 22.380594832085876], [95.82704280028508, 22.381521390100147], [95.82890796003437, 22.387915890006354], [95.82932916021264, 22.39465122037757], [95.8296027600594, 22.395655260382], [95.83045884000353, 22.398794280131995]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
