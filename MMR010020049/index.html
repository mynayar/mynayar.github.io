
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Taing Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Taing Kan</div><div class="name-mm">ဆင်တိုင်းကန်</div></div>
        <span class="pcode-badge">MMR010020049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06716635444377, 20.831735145860364], [95.0706034356001, 20.83517222881534], [95.07300939366866, 20.83654706199735], [95.07846227371505, 20.842493563727032], [95.08469547481639, 20.85373247407449], [95.08847626516757, 20.84823314224576], [95.09122593243092, 20.843077518712562], [95.09107931505838, 20.84014517755793], [95.09452754960677, 20.837741861697623], [95.09639047903744, 20.83533101311582], [95.09639047903744, 20.831465010202123], [95.0981153139706, 20.826810568952624], [95.09329518342605, 20.826208051960066], [95.08706918139768, 20.823998825985086], [95.08265072764902, 20.82339630899253], [95.07542053183215, 20.822191276806052], [95.06854118672646, 20.82008535505514], [95.06854118672646, 20.82073648220296], [95.06751006183993, 20.82589210573616], [95.06716635444377, 20.831735145860364]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
