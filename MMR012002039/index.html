
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Hlyar Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Hlyar Shey</div><div class="name-mm">ပြင်လျှားရှည်</div></div>
        <span class="pcode-badge">MMR012002039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.99346016825223, 20.605658082254763], [92.99774470305567, 20.605189109190064], [92.99901493519116, 20.60107589793438], [93.00182977992046, 20.59196099110693], [93.00649809231317, 20.585052667146897], [93.0074087332265, 20.583704981799542], [93.0156499558808, 20.579903110440227], [93.01214489766897, 20.577804680041993], [93.00863993658385, 20.57570617859733], [93.00163030039812, 20.57150896166928], [92.99923945903384, 20.573197669936576], [92.99047240727583, 20.582391446408167], [92.98310966397986, 20.5848560276836], [92.98150578876118, 20.585392851898632], [92.9723389200052, 20.591958788667228], [92.97138108357024, 20.59329663992804], [92.9661598769768, 20.600588808027112], [92.97373207057865, 20.601809736630116], [92.981304385589, 20.60303033518187], [92.98431769000945, 20.603681816662572], [92.99346016825223, 20.605658082254763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
