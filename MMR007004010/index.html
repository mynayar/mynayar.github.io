
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawt Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawt Win</div><div class="name-mm">ကော့ဝင်း</div></div>
        <span class="pcode-badge">MMR007004010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.66462913442706, 17.42391903683415], [96.67124326406542, 17.421513898048033], [96.67843015932448, 17.41702208929803], [96.67843015932448, 17.412081097964347], [96.67528589292965, 17.412081097964347], [96.67391554916333, 17.402522891917954], [96.6645055486922, 17.40219911709562], [96.65956455915716, 17.403097478665757], [96.64968257828843, 17.40174993631058], [96.64907483173818, 17.401694685561324], [96.64474158695475, 17.401300754626163], [96.64372948362882, 17.40014406639557], [96.63845305326583, 17.40174993631058], [96.6303677964367, 17.40174993631058], [96.61779072905898, 17.39905484980153], [96.61410549167516, 17.39667028480585], [96.61509564344925, 17.406241745959846], [96.61476972014651, 17.411782434012196], [96.62003663388361, 17.412979460433803], [96.6324213569601, 17.416564019613872], [96.65529808633767, 17.41881176265275], [96.65753288003845, 17.42560182936097], [96.65919776526471, 17.425386789768595], [96.6613612831967, 17.425107346127163], [96.66258672639634, 17.424661730254684], [96.66462913442706, 17.42391903683415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
