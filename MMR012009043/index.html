
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngan Chaung</div><div class="name-mm">ငန်းချောင်း</div></div>
        <span class="pcode-badge">MMR012009043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.34869389830482, 21.011281499042013], [92.34912352872794, 21.011330727031464], [92.35841596442526, 21.01731568467119], [92.39353821711506, 21.02393063898785], [92.39511320610961, 21.024875632204726], [92.3953479192711, 21.024949596946385], [92.39602055370563, 21.021218961785735], [92.39598259961735, 21.021181462754328], [92.39581637702423, 21.021017236656178], [92.39508056701459, 21.020324708318697], [92.39495365558679, 21.019415178068073], [92.39493939773507, 21.019312997097188], [92.39469573362129, 21.01768941233655], [92.39044734436953, 21.015229237739163], [92.38627662056962, 21.0114755871287], [92.38494466436481, 21.008589683367234], [92.38298579166104, 21.0078657507039], [92.3642434228957, 21.000148305799712], [92.35423024532963, 20.998066358175947], [92.34833603378098, 20.996840828641382], [92.34172108126296, 20.99999080663048], [92.34569561166319, 21.002905462617036], [92.3464460482466, 21.003455782058722], [92.3486510321195, 21.011015728692996], [92.34869389830482, 21.011281499042013]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
