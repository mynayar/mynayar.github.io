
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Man Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Man Kan</div><div class="name-mm">သမန်းကန်</div></div>
        <span class="pcode-badge">MMR010030057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03067205267314, 20.811822357116114], [96.03193071233255, 20.806473054687785], [96.03197868756644, 20.805417586952103], [96.02815473425363, 20.804270400958274], [96.01619747063683, 20.800494422879353], [96.0064428616488, 20.800809087569405], [96.00420718931042, 20.801524502753637], [96.0021516700636, 20.803465826986383], [95.99917434392091, 20.80313501317039], [95.99218920077107, 20.802358885654087], [95.98842026798104, 20.802149501898043], [95.98766442827082, 20.80287747701402], [95.98376642568007, 20.80663177063974], [95.98345224032869, 20.81637150034453], [95.9833728445812, 20.818832720853436], [95.98572264088722, 20.81828763816401], [95.98819230243288, 20.818744982994644], [95.99511492831135, 20.818115652715278], [95.999520234871, 20.818115652715278], [96.00675752633884, 20.822206296383513], [96.01210682786785, 20.825352944183066], [96.01777079498623, 20.825352944183066], [96.02217610334458, 20.824094285422973], [96.02532275114413, 20.820632972034105], [96.02563741583413, 20.816856993955184], [96.03067205267314, 20.811822357116114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
