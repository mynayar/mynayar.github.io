
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Se Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Se Kone</div><div class="name-mm">လေးဆယ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010013051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12924940863337, 21.47701482527401], [96.12929741264554, 21.47823442018239], [96.13010979273281, 21.485545835571884], [96.13137302184754, 21.498739566278005], [96.143890783433, 21.492590491358158], [96.15061777529013, 21.491917792172444], [96.15398127121875, 21.49124509298673], [96.1551024362285, 21.48519080031525], [96.15532666869086, 21.477118410086632], [96.15622360123825, 21.470615650691798], [96.15495490964145, 21.467233658406656], [96.15482942633702, 21.46496079100774], [96.15221816023995, 21.462963939034637], [96.15016295395719, 21.465761028448753], [96.14957949000154, 21.467862148719234], [96.14745644336023, 21.468186470329385], [96.1451523847748, 21.466957640282942], [96.1416194970422, 21.469415302174525], [96.14182493637179, 21.471509003038136], [96.13956664068797, 21.472855822338374], [96.14087031681174, 21.473472337278565], [96.1411495257301, 21.473604268722056], [96.14118146155528, 21.47405859722653], [96.1412426145551, 21.47493580584279], [96.13931543755746, 21.475405851798655], [96.13749882770878, 21.478867558191325], [96.13455372067773, 21.47893874043058], [96.13209605878615, 21.476481077639676], [96.12924940863337, 21.47701482527401]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
