
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa-Gway Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa-Gway Cho</div><div class="name-mm">ပ-ဂွေးချို</div></div>
        <span class="pcode-badge">MMR009006052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40910926098366, 20.610688772868627], [95.4100067529094, 20.60837025228534], [95.411688634423, 20.609260659352003], [95.41155475774593, 20.603236264641964], [95.41619877495356, 20.597044244396386], [95.42664781074791, 20.596657241838273], [95.43167882781569, 20.580790187317348], [95.43271967527284, 20.58092594987272], [95.43051782373863, 20.579242181581492], [95.4189309378126, 20.57550447595088], [95.41852078310774, 20.575372167691455], [95.41194176030405, 20.582725193812678], [95.39762270972034, 20.59240022718876], [95.36898461035156, 20.595883239420004], [95.35840550560965, 20.596718431710315], [95.3616315851296, 20.606719276873207], [95.36265385259327, 20.60999053383614], [95.3641264052095, 20.6147027007691], [95.36434059404326, 20.614459303753904], [95.38717367392599, 20.609428286686125], [95.40884574883228, 20.610202289104393], [95.40910926098366, 20.610688772868627]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
