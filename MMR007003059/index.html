
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyawbwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div>
        <span class="pcode-badge">MMR007003059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6759608566083, 17.025978202731892], [96.67364493506574, 17.027570400253808], [96.67056748020508, 17.036460830902683], [96.6702255426747, 17.0426157451206], [96.67177807739643, 17.044873976952545], [96.67075536117102, 17.04540756810485], [96.67088839967994, 17.04673796488521], [96.66875976555082, 17.04740316282573], [96.66569985466464, 17.04939875664735], [96.66410337906774, 17.04939875664735], [96.66071962411144, 17.048770659338516], [96.66208738322621, 17.056977211329297], [96.66413902279771, 17.06366368603034], [96.66995199498865, 17.060054667988595], [96.67610690560929, 17.055951392442864], [96.67862173830264, 17.053880353595503], [96.68191987780017, 17.05116423733972], [96.68841672864914, 17.045693201779898], [96.6949135803975, 17.041931865563186], [96.69525551612924, 17.0253477923668], [96.69559745365962, 17.020560636364337], [96.69529757742134, 17.018911311208115], [96.68663863766307, 17.02038966714946], [96.67911596702834, 17.023809063137776], [96.6759608566083, 17.025978202731892]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
