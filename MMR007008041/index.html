
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Waing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Waing</div><div class="name-mm">မဲဝိုင်</div></div>
        <span class="pcode-badge">MMR007008041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.95811428214847, 17.793028937135773], [96.95905578059984, 17.790392739133665], [96.94904277210628, 17.78447596089694], [96.93675407773856, 17.7817451398264], [96.9366403377814, 17.781669312588747], [96.93372117079548, 17.784953376796977], [96.93031090562386, 17.787226887211148], [96.92273254177343, 17.791521292973357], [96.91692246180224, 17.791268680605185], [96.91085977036215, 17.790258232031817], [96.89785024419348, 17.78621643773846], [96.87944633438087, 17.785961775815338], [96.87798138193529, 17.790356570199606], [96.8797128826435, 17.796369799826437], [96.87856710139067, 17.80324804596063], [96.8770494990352, 17.80685233536701], [96.87982549485076, 17.80946958825092], [96.89017348192073, 17.818335535756432], [96.88843807185958, 17.83959430923005], [96.88748774296505, 17.843337962077328], [96.89943285943895, 17.844098882957155], [96.91217668990237, 17.84364374596214], [96.92810647843129, 17.84227833497721], [96.93825421795788, 17.84039325434526], [96.94130544588967, 17.82862423142319], [96.94949790820198, 17.815425263964812], [96.95450441334805, 17.803136569597086], [96.95811428214847, 17.793028937135773]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
