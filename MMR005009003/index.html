
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Pauk</div><div class="name-mm">မြင်းပေါက်</div></div>
        <span class="pcode-badge">MMR005009003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38477812011422, 22.80525659981231], [95.38477812011422, 22.80067776007064], [95.38508340037868, 22.793962140140707], [95.38691508016689, 22.788162360104877], [95.3913682801221, 22.784544179770137], [95.38681500001229, 22.783405860192318], [95.38386228022011, 22.78266777040136], [95.3774521204191, 22.781752020439455], [95.36768388040679, 22.78266777040136], [95.36371560029477, 22.785720299652155], [95.35913675965378, 22.78266777040136], [95.3524213195883, 22.77961515031899], [95.34866796035817, 22.777613459993233], [95.34784247984663, 22.777173179798467], [95.34417912027027, 22.780530990213094], [95.34417912027027, 22.783888799728402], [95.34439331989586, 22.787529029641064], [95.34814776011109, 22.788467550437133], [95.35255668014673, 22.790672189869724], [95.35730507986563, 22.789993860028687], [95.36218919987175, 22.79121489025505], [95.36463144018887, 22.797014760223078], [95.36812775968843, 22.8034250998885], [95.37378911967221, 22.8034250998885], [95.37897851994279, 22.803730290220756], [95.38203096016076, 22.80464613011486], [95.38477812011422, 22.80525659981231]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
