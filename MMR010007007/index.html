
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Yae Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Yae Kone</div><div class="name-mm">ကျွဲရေကုန်း</div></div>
        <span class="pcode-badge">MMR010007007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14677390109472, 22.022329519092068], [96.14042244004361, 22.02298095021075], [96.13426319918733, 22.023217844228157], [96.13003148966158, 22.02140423361851], [96.12893538066334, 22.02093446825114], [96.12835664624231, 22.020686436130177], [96.128378578009, 22.021597468248615], [96.12828700364236, 22.021946930406557], [96.12807019418415, 22.02225969662777], [96.12804165869568, 22.022300861295776], [96.12775354828767, 22.02248925307663], [96.1273287607138, 22.022596435177377], [96.12660683623659, 22.02263381190096], [96.12587748785586, 22.022671574433673], [96.12040586773668, 22.02295486177752], [96.11255675399104, 22.0233393300461], [96.1124740388459, 22.02458498191146], [96.11271360384978, 22.02714033895552], [96.11353930919182, 22.029411024599142], [96.11415858684938, 22.03333312002752], [96.11457143862106, 22.03333312002752], [96.12241562767912, 22.032094563813132], [96.12840198286528, 22.030443154927696], [96.13480119072244, 22.03023672904186], [96.14008224360072, 22.03023672904186], [96.14140682356611, 22.03023672904186], [96.14698032698055, 22.029617451384297], [96.14677390109472, 22.024456799741586], [96.14677390109472, 22.022329519092068]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
