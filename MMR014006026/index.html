
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyone</div><div class="name-mm">ကျုံး</div></div>
        <span class="pcode-badge">MMR014006026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65027110542724, 20.821313345134797], [96.65464269190676, 20.81812326817436], [96.66436009594173, 20.813734762749164], [96.66530049002563, 20.813264565707186], [96.66530049002563, 20.81279436866521], [96.66530049002563, 20.80777893415052], [96.66718127819348, 20.790538377444193], [96.66718127819348, 20.773924748928096], [96.6612254495949, 20.75323608088047], [96.6558965500858, 20.740697493694427], [96.64273103381021, 20.746653323192334], [96.63364055886478, 20.75448993995883], [96.62923569387226, 20.760118377561128], [96.62967420330187, 20.75791771582999], [96.62956439787871, 20.757559071593903], [96.62871990120254, 20.75475622561936], [96.62341215644591, 20.759356273173523], [96.62053410826252, 20.762012929852858], [96.62053410826252, 20.765997917569905], [96.6189843893182, 20.76865457784652], [96.61265359468769, 20.778554463317903], [96.62212993275028, 20.77315566490205], [96.62239331360058, 20.7735120041757], [96.62661295422453, 20.78483840596772], [96.6354964070336, 20.799051931001884], [96.6423810833204, 20.808601642951487], [96.65027110542724, 20.821313345134797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
