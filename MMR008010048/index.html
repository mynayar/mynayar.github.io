
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Hnit Hpyar Lein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Hnit Hpyar Lein</div><div class="name-mm">သရက်နှစ်ဖျားလိန်</div></div>
        <span class="pcode-badge">MMR008010048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8066863750762, 18.179497153171155], [95.82204343305807, 18.187175681712404], [95.8453743488472, 18.196330852087215], [95.85098558241873, 18.193672898585476], [95.85216689408696, 18.191310275249066], [95.85128090988616, 18.190128962681513], [95.84626033304801, 18.183927074175187], [95.83946778780825, 18.182450433240945], [95.8376958203059, 18.178020513136232], [95.83621918027103, 18.17654387220199], [95.83090327506613, 18.175362559634493], [95.83001729086533, 18.173295263765453], [95.83001729086533, 18.172409279564647], [95.83385655513598, 18.168274686927305], [95.83297057093517, 18.16679804689238], [95.82735933826291, 18.165616735224205], [95.82204343305807, 18.16236812588835], [95.81347892031596, 18.16236812588835], [95.81111629518091, 18.160596158386056], [95.80786768674443, 18.161186814220173], [95.80432374994115, 18.162958781722466], [95.80816301511112, 18.165912062691575], [95.80929990836415, 18.171823903650306], [95.80963965514604, 18.173590592132143], [95.8066863750762, 18.179497153171155]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
