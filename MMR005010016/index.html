
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Taing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Taing Gyi</div><div class="name-mm">အင်တိုင်းကြီး</div></div>
        <span class="pcode-badge">MMR005010016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24700917363452, 22.743909307768376], [95.24467799959007, 22.7433370502647], [95.24468987963428, 22.74328610996605], [95.23309320009116, 22.739685030240025], [95.2191388803551, 22.733045099951426], [95.2191162003524, 22.73309324965379], [95.21667468039226, 22.73187258005555], [95.20031735955854, 22.73107913969062], [95.1809083197632, 22.73571774028153], [95.17150871995153, 22.739074740406977], [95.17150871995153, 22.747497570356643], [95.17633056010732, 22.75909424989976], [95.18951412038041, 22.75909424989976], [95.2064819999444, 22.75909424989976], [95.2144775997615, 22.7614745700954], [95.22119195974119, 22.764651839810597], [95.22131887656496, 22.764678571259083], [95.2291596616891, 22.766330013419406], [95.23725077310473, 22.758238902003768], [95.24036016828717, 22.755129506821334], [95.24700917363452, 22.743909307768376]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
