
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Lel</div><div class="name-mm">ညောင်လယ်</div></div>
        <span class="pcode-badge">MMR005009007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24533817211903, 22.863288729091607], [95.246203425148, 22.863214881261797], [95.25393604521236, 22.862554977630168], [95.25392567962649, 22.858370999621968], [95.25392567962649, 22.85104482006244], [95.25122495976416, 22.845343319738447], [95.24843099999072, 22.843108259838345], [95.24476800014315, 22.840971479650136], [95.23896804024292, 22.840666200284943], [95.23347335970783, 22.843413450170658], [95.22858960032983, 22.844939759762156], [95.22004211984802, 22.844939759762156], [95.21637048021353, 22.843511819814694], [95.21302140041735, 22.845550230358867], [95.20264259987613, 22.850129070100536], [95.19256944022754, 22.851960659956546], [95.19200712023246, 22.85188029024323], [95.19104303980453, 22.85501319010666], [95.19073776043933, 22.85959202984833], [95.19226415996309, 22.865086619551903], [95.19346799964853, 22.865305500148736], [95.19897960002857, 22.866307559846064], [95.21149499999433, 22.861118250407003], [95.22584207974825, 22.864781340186767], [95.22797903980091, 22.86844434003433], [95.23225260017739, 22.869054899663922], [95.24049443976662, 22.865697090148615], [95.24533817211903, 22.863288729091607]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
