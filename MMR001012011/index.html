
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Jang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Jang</div><div class="name-mm">မင်းဂျမ်း</div></div>
        <span class="pcode-badge">MMR001012011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.36812046578694, 24.43199608415199], [97.38203806170725, 24.439895259558625], [97.38843263265994, 24.442152166689198], [97.39670796030418, 24.435381445297537], [97.40836864909392, 24.42861072210718], [97.40686404374071, 24.41920694134734], [97.40949710310889, 24.407922403895896], [97.4102494048862, 24.39776631956005], [97.40836864909392, 24.386481783007923], [97.4096842070606, 24.378325323255126], [97.40499782638864, 24.377499580141546], [97.40107154821345, 24.379781723148028], [97.39787292499557, 24.3807010650022], [97.38925720575548, 24.382105199895136], [97.38831873712007, 24.382977765311693], [97.38730417864497, 24.387986388361185], [97.38316651572217, 24.396261715106107], [97.38354266706051, 24.400399378928228], [97.38880878399823, 24.40453704275035], [97.38467112107543, 24.415069278424482], [97.37677194387015, 24.424096906946772], [97.36812046578694, 24.43199608415199]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
