
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tei Taw (1)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tei Taw (1)</div><div class="name-mm">တည်တော (၁)</div></div>
        <span class="pcode-badge">MMR009004047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49143847470589, 19.946086992021094], [95.49152284280501, 19.94565912606788], [95.49174393303616, 19.945755852650507], [95.49501883135406, 19.94248095523193], [95.4999449973638, 19.936283520168388], [95.50054531821195, 19.933582074553158], [95.49708464334168, 19.929132634663404], [95.49009266624358, 19.92198174915842], [95.48516650023384, 19.918962485830093], [95.4764894571228, 19.91697916235853], [95.47404290005983, 19.916419948621808], [95.47044625579014, 19.916810889311137], [95.46673310614801, 19.91721449155557], [95.46136888216824, 19.922055376654384], [95.46021785516996, 19.92309410890607], [95.46301216657827, 19.930153423641627], [95.46323711669964, 19.93072171963172], [95.46482620256728, 19.938826058275993], [95.4642988356228, 19.941873066588812], [95.46609747162108, 19.940574051651197], [95.47308944871912, 19.94025623483742], [95.48198832939795, 19.942163136619513], [95.4907282998712, 19.945341309254047], [95.49143847470589, 19.946086992021094]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
