
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kyawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyai</div><div class="name-mm">မိုင်းရယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kyawng</div><div class="name-mm">မန်ကျောင်း</div></div>
        <span class="pcode-badge">MMR015003023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.21417183506219, 22.440137086757204], [98.21460914029967, 22.439863041746037], [98.22207824731333, 22.438626742829967], [98.22658686978826, 22.432710138162406], [98.2319392622872, 22.42651143055815], [98.23063799544718, 22.420133871181235], [98.23303558082745, 22.410017794086002], [98.24827051627136, 22.39868931126273], [98.25304848390044, 22.39092520233629], [98.25221225738983, 22.38977538942271], [98.24219777490742, 22.37441985039584], [98.23285092483036, 22.366742079983055], [98.21983209787305, 22.366074447577716], [98.20581182275748, 22.369746425357278], [98.1924591800472, 22.374086033743538], [98.17743745677325, 22.37608893006012], [98.16074665293576, 22.369412608704977], [98.15005170022584, 22.366267034695966], [98.15006453894739, 22.367743529040695], [98.15206743616329, 22.387104860700788], [98.15306888432161, 22.419485020217564], [98.15312757677628, 22.432776952394477], [98.1664215270319, 22.434172926839153], [98.17944035308989, 22.437511087067037], [98.18678430685031, 22.437511087067037], [98.1937944439585, 22.432837662028533], [98.19946931805464, 22.43150239811723], [98.20781471907407, 22.435174374997473], [98.21417183506219, 22.440137086757204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
