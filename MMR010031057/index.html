
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar</div><div class="name-mm">ကုလား</div></div>
        <span class="pcode-badge">MMR010031057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92234279288562, 21.193810168704374], [95.92734112319437, 21.193810168704374], [95.93202705780254, 21.195372147206854], [95.93733778291244, 21.194434960105355], [95.9401491112925, 21.193701571070676], [95.93966547118458, 21.190316092114017], [95.94087770064544, 21.17617339768418], [95.94292078676494, 21.172768254151663], [95.94451439442383, 21.170112243185542], [95.94653477895696, 21.162434780340902], [95.94653477895696, 21.151928778790136], [95.93845323992514, 21.151928778790136], [95.93279616161362, 21.152736932963137], [95.92956354582105, 21.156777702928707], [95.9247146225818, 21.160414395807777], [95.91784531391016, 21.166071473219972], [95.91080765574878, 21.170763245327578], [95.91422050557196, 21.173816848368915], [95.9182816487791, 21.17943996917927], [95.92171800058532, 21.185375486589464], [95.92234279288562, 21.190998608299196], [95.92234279288562, 21.193810168704374]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
