
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Sa Lat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Sa Lat</div><div class="name-mm">နမ့်စလပ်</div></div>
        <span class="pcode-badge">MMR015002021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.25957904313839, 23.36244923344543], [98.25786769443863, 23.362485645196443], [98.25123413764538, 23.362485645196443], [98.2474650717557, 23.361882594905865], [98.24444981940371, 23.3603749687299], [98.24324371792329, 23.357208953130737], [98.24369600586601, 23.355701326055396], [98.24614788511684, 23.354304776943934], [98.2452495838013, 23.35403861359117], [98.24213967690463, 23.353117159229555], [98.23515001016489, 23.351778712617545], [98.22726804508426, 23.350588982395664], [98.22087324390515, 23.349399251274463], [98.2165604712888, 23.347019790830757], [98.21429516808757, 23.34592908855666], [98.2062861638754, 23.362432489867558], [98.21855788623753, 23.367887153269578], [98.22832345706195, 23.376481627824887], [98.23038354306613, 23.378404547431956], [98.24004212514404, 23.387420035106572], [98.24863581189328, 23.39562383697057], [98.24878165225152, 23.395701625629556], [98.25449520618889, 23.398749151951847], [98.26152654841155, 23.399921252763647], [98.26738613786006, 23.395624255155326], [98.27012067402995, 23.39132718739984], [98.26918586833324, 23.384107299612253], [98.27008571828134, 23.379883406094393], [98.26667786868876, 23.37810150018413], [98.26429840734568, 23.373937443058594], [98.26221637878291, 23.369475954052064], [98.26102664856103, 23.365758046097028], [98.25957904313839, 23.36244923344543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
