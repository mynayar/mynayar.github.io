
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Kyun</div><div class="name-mm">ရေတွင်းကျွန်း</div></div>
        <span class="pcode-badge">MMR012009036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.30462848321798, 20.98275110607875], [92.3070713233829, 20.980460943817548], [92.30502383777997, 20.976523470881546], [92.3105362988112, 20.975420979394755], [92.31431627257797, 20.967388535252724], [92.3144737717472, 20.96759853414511], [92.31715125312786, 20.96045858439618], [92.31624260511222, 20.95947724417954], [92.31321378019186, 20.956206113121652], [92.29667639619879, 20.954631125026424], [92.28612396984539, 20.951953642746446], [92.27706179656474, 20.949394912345383], [92.27618946677052, 20.94931252635206], [92.27497399075713, 20.951603231803745], [92.27400317080975, 20.954001728197227], [92.27534666261846, 20.960122701101852], [92.27768439541859, 20.97077345123381], [92.29163643177594, 20.971326008188782], [92.29683389536802, 20.975735976833903], [92.30462848321798, 20.98275110607875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
