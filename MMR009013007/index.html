
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Taw (Kan Nar)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Taw (Kan Nar)</div><div class="name-mm">ပေတော (ကန္နား)</div></div>
        <span class="pcode-badge">MMR009013007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09173687955342, 19.898928979288996], [95.09803941388788, 19.898629641744606], [95.10308193598263, 19.89629183340145], [95.11362826133524, 19.888531332554976], [95.1087243148753, 19.885053988750656], [95.09445786024213, 19.875849825109412], [95.08617411224554, 19.858822119944932], [95.08330000758934, 19.850641979244017], [95.08382296515776, 19.850646135011175], [95.07944897119313, 19.834590795728673], [95.078171828667, 19.834820668738928], [95.07037962042318, 19.85222126879654], [95.0702263219872, 19.85223815356801], [95.06684536572112, 19.858822119944932], [95.06320460790641, 19.880211575703697], [95.06316370044448, 19.880451906930034], [95.06558745969357, 19.886107346676738], [95.06868619880908, 19.893337736747185], [95.07678244805157, 19.90252321877159], [95.08081611607093, 19.902555457668313], [95.08559561434618, 19.90214315897964], [95.08703803607654, 19.900800282307216], [95.0894335602107, 19.899915439346103], [95.08984884195053, 19.89914419514855], [95.08991853671114, 19.899015069589836], [95.09173687955342, 19.898928979288996]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
