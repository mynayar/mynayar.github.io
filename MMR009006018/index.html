
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Htwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Htwet</div><div class="name-mm">ရေထွက်</div></div>
        <span class="pcode-badge">MMR009006018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22386997621851, 20.527799266223212], [95.22385910521359, 20.527771002329928], [95.2002520229126, 20.52815800398872], [95.19651898656201, 20.52486414886141], [95.1955533251259, 20.523498459986], [95.19066560513363, 20.528396070722124], [95.1882538293508, 20.529286120757945], [95.18776676822182, 20.53018558939351], [95.18439579263179, 20.531966351366066], [95.1839048383377, 20.533317353413167], [95.18150024544002, 20.534202235045143], [95.17909950343937, 20.534635535601524], [95.17488305091211, 20.5358643332724], [95.17424454305126, 20.542462226550583], [95.17339320073569, 20.547144603440756], [95.17360603788842, 20.551188474268713], [95.17530871892228, 20.556296520967692], [95.17594722588382, 20.56055322714974], [95.17889738260817, 20.562381761109464], [95.19909101883553, 20.56569713431537], [95.20594774239447, 20.56727945458323], [95.2076050481345, 20.557957107434618], [95.21108806036574, 20.542090052014316], [95.22192409781894, 20.53744603570601], [95.22579411170892, 20.532802020297027], [95.22386997621851, 20.527799266223212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
