
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Ba</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Ba</div><div class="name-mm">တောင်ဘ</div></div>
        <span class="pcode-badge">MMR010022044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.94937321040538, 21.158037317668118], [94.95197109009376, 21.162944425245087], [94.95543493057767, 21.166119613029764], [94.95918742555932, 21.16207846534894], [94.962362613344, 21.15486212988344], [94.9649604939317, 21.15255290289423], [94.96755837541878, 21.15053232860413], [94.97131086860179, 21.14735714081945], [94.97564066988105, 21.14475926113107], [94.97881585676646, 21.14129541974785], [94.98372296524269, 21.138697539160148], [94.98503380356726, 21.138766530650912], [94.98312806910519, 21.13421394032116], [94.98018109777951, 21.129957203562128], [94.97461459738582, 21.122753498175427], [94.97199506831782, 21.114567466915105], [94.96904809699214, 21.116532115065127], [94.96642856702482, 21.11849676231577], [94.96375195978516, 21.12068671312136], [94.95889741938043, 21.127665115852437], [94.95627789031244, 21.133559057604486], [94.95234859491177, 21.138470676180816], [94.95202115355346, 21.14141764660718], [94.95169371309447, 21.147966471075847], [94.95038394766112, 21.152223206036183], [94.94937321040538, 21.158037317668118]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
