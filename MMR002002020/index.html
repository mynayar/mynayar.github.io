
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Pet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Demoso</div><div class="name-mm">ဒီးမော့ဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Pet</div><div class="name-mm">ပန်ပက်</div></div>
        <span class="pcode-badge">MMR002002020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.02894471202887, 19.547421913190817], [97.01672568094546, 19.550114242378413], [97.00388534513263, 19.552392366314677], [96.9945657454129, 19.555706001131114], [96.98980239536434, 19.56523270302688], [96.98089699999662, 19.57703752885891], [96.97344131986108, 19.589670763395077], [96.96971348069263, 19.59567672739911], [96.9670211524043, 19.59774774915934], [96.96308621016055, 19.6058247349236], [96.95915126791675, 19.609759677167403], [96.95625183655307, 19.613073311983783], [96.95398140002163, 19.613656945911373], [96.95566761177093, 19.616735226349647], [96.95831456206747, 19.620939074878436], [96.96038613601144, 19.6238763479152], [96.96399500386639, 19.628305251786003], [96.96627202973042, 19.630307947553774], [96.96873668564956, 19.632131485779496], [96.97094153462416, 19.63341320855278], [96.97448905522577, 19.63532074435693], [96.97661777568987, 19.636495452303336], [96.97962371915935, 19.637983197166875], [96.97999667340781, 19.63806249398897], [96.98546889787139, 19.64078662410344], [96.99673539222465, 19.638959624387212], [96.9972248275638, 19.63590052738749], [96.9997433007128, 19.631505409247268], [97.00471375293739, 19.621771605175468], [97.01092682001678, 19.603960815339406], [97.01713988619684, 19.586150026402663], [97.02273164494949, 19.57041025832683], [97.0277020980734, 19.55425628589893], [97.02894471202887, 19.547421913190817]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
