
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Pan</div><div class="name-mm">ဆပန်</div></div>
        <span class="pcode-badge">MMR009021038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.40883596800558, 21.48935606972691], [94.40183230241888, 21.49118311440924], [94.39309866317285, 21.48954555598266], [94.3890047693547, 21.486816294336563], [94.3832733189086, 21.482995326772937], [94.37781479381772, 21.48899970437293], [94.37781479381772, 21.495549932683275], [94.38108990887224, 21.501554310283268], [94.38163576138135, 21.507558686983884], [94.38370191421205, 21.51051033298552], [94.39036939972806, 21.512471358666346], [94.39964889238252, 21.504283571929363], [94.41929958001168, 21.508104538593614], [94.43349174344928, 21.511379653648135], [94.43513677793999, 21.514011710272257], [94.43840441513169, 21.513017211175395], [94.4569633977427, 21.521204997912378], [94.46023851279716, 21.52666352210389], [94.47385127991271, 21.523260330100186], [94.47825164379839, 21.50701283357546], [94.47224726709777, 21.501554310283268], [94.45750925115107, 21.501008457774162], [94.44822975939593, 21.49282067103718], [94.44428738065812, 21.491783203232274], [94.43785856262264, 21.490091409391084], [94.42148299004799, 21.496641637701487], [94.41274935080196, 21.4960957860917], [94.40883596800558, 21.48935606972691]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
