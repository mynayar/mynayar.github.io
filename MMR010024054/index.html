
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yar Gyi</div><div class="name-mm">ယာကြီး</div></div>
        <span class="pcode-badge">MMR010024054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99017062477458, 20.570965916843647], [95.98757132056005, 20.573132003239436], [95.98280593084911, 20.573132003239436], [95.97717410729928, 20.574431654897012], [95.97067584811197, 20.576164524373326], [95.95984541703245, 20.582662782661316], [95.95724611281793, 20.586561737634156], [95.95681289589851, 20.591327128244416], [95.95508002732146, 20.59695895179425], [95.95508002732146, 20.60129112458577], [95.95637967897903, 20.606489732115506], [95.96504402366281, 20.606922949034924], [95.96807654479676, 20.606922949034924], [95.97804054113811, 20.606489732115506], [95.98453880032542, 20.60778938287376], [95.98583845198306, 20.60562329737735], [95.98583845198306, 20.599558256008777], [95.98583845198306, 20.594359647579722], [95.98713810364063, 20.58872782402989], [95.98843775619753, 20.582229564842578], [95.988870973117, 20.576164524373326], [95.99017062477458, 20.570965916843647]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
