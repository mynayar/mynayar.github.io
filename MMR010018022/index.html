
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pa Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pa Taw</div><div class="name-mm">လက်ပတော</div></div>
        <span class="pcode-badge">MMR010018022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61336537231415, 21.21114528102993], [95.61428998059819, 21.208802908627376], [95.61709365035176, 21.201920951890486], [95.62248388991964, 21.19763328564767], [95.62463186486872, 21.19182741180566], [95.62443261917008, 21.19079746862832], [95.62349128709326, 21.185930252279377], [95.61655150574745, 21.183413689290376], [95.60139131475745, 21.18499758966709], [95.59248882509928, 21.18948424979834], [95.59095327497374, 21.191062453869222], [95.57956805572127, 21.202763928712386], [95.57059530023298, 21.21442851066729], [95.56521164640043, 21.224657452679367], [95.56826238420172, 21.222145082329746], [95.57562004273086, 21.22160671577734], [95.58495170955382, 21.22376017838957], [95.59141209379317, 21.22376017838957], [95.6027177671113, 21.222145082329746], [95.61393202074623, 21.222145082329746], [95.61601025416996, 21.22275964304316], [95.6124053972913, 21.217450993568548], [95.61261312899279, 21.214190020353215], [95.61269968244443, 21.21283131291483], [95.61304573257456, 21.211954726629358], [95.61336537231415, 21.21114528102993]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
