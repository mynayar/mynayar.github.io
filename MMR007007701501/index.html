
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Paing Ward</div><div class="name-mm">ဈေးပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007007701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67339563417761, 17.800136175646173], [96.67316626245542, 17.79944982651557], [96.67302846636551, 17.79906705959877], [96.67273245994971, 17.799153820099946], [96.67249769624078, 17.79849035744411], [96.67230886456178, 17.797918758848255], [96.67206899729405, 17.79718894992692], [96.67186995849721, 17.796474451682343], [96.67150917712837, 17.79543258123425], [96.67112483889917, 17.7955711217586], [96.67010923067983, 17.795882438850867], [96.66921610787404, 17.79621927373779], [96.6684496628111, 17.79652257372345], [96.66876650211452, 17.797227268036295], [96.66918776570384, 17.79818915323233], [96.6698337032077, 17.799747828513432], [96.67033601625286, 17.800937084279497], [96.67056803070142, 17.800765221725044], [96.67085112115012, 17.80056791626083], [96.67121016904144, 17.80040201331383], [96.67143445904418, 17.800293404310594], [96.67171754949288, 17.800199040827692], [96.67217220991029, 17.80007894184945], [96.67254108534343, 17.800061784852744], [96.67297858876412, 17.800087520347915], [96.67339563417761, 17.800136175646173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
