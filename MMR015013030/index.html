
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Hko (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Hko (North)</div><div class="name-mm">ဟိုခို (မြောက်)</div></div>
        <span class="pcode-badge">MMR015013030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5016927189439, 22.359431786048162], [96.48802352836321, 22.348516834884094], [96.48022938208038, 22.344029296115195], [96.47697046561456, 22.351012688284982], [96.46971620573834, 22.35031516331418], [96.46484775192226, 22.357430594846107], [96.4609256978627, 22.37169261132499], [96.45771674413248, 22.38631117661953], [96.45985604691907, 22.394155285637964], [96.46698705470885, 22.39986009276913], [96.46912635659612, 22.403425597113653], [96.47625736528522, 22.403425597113653], [96.50299864517137, 22.418044163307513], [96.50513794795802, 22.42374897043868], [96.495154536153, 22.458690909058248], [96.48807446416527, 22.490197230617753], [96.50391922808996, 22.491176782082903], [96.52118271570981, 22.462612963117806], [96.5554115540001, 22.431593077658476], [96.5678472812271, 22.41635544424838], [96.56182946056123, 22.412695906790702], [96.53580128190367, 22.386667728133204], [96.5016927189439, 22.359431786048162]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
