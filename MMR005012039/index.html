
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Ye</div><div class="name-mm">ကျွဲရဲ</div></div>
        <span class="pcode-badge">MMR005012039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15776859984106, 22.207881869552693], [95.15653883989563, 22.20124194016347], [95.15304612038221, 22.193462969940185], [95.14907747964202, 22.18647770987843], [95.14733112033497, 22.18028624991058], [95.14748988035376, 22.172824709792565], [95.14854324007854, 22.173472889862012], [95.14403856023142, 22.16967966008832], [95.13919583961638, 22.166366129593257], [95.13867635972628, 22.166010630286394], [95.12174231985222, 22.158672659715535], [95.11685855957495, 22.158393570406986], [95.1135577203126, 22.16939741955531], [95.11327547977965, 22.17899330989337], [95.1104530798458, 22.18435569026292], [95.10528456003448, 22.189708800420874], [95.10661548022028, 22.19132510966614], [95.10796584015145, 22.194363149939477], [95.10836184042665, 22.193865180034095], [95.12153855955694, 22.196564100352987], [95.13074663974567, 22.19894540980289], [95.13374183991402, 22.20228648023692], [95.13383688026789, 22.20203574025726], [95.14542600010986, 22.203623249613315], [95.15510999972679, 22.207115880093852], [95.15776859984106, 22.207881869552693]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
