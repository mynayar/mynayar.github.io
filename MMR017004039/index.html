
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngapudaw</div><div class="name-mm">ငပုတော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Chaung</div><div class="name-mm">ကုလားချောင်း</div></div>
        <span class="pcode-badge">MMR017004039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59865259963783, 16.238917381931685], [94.58964632102095, 16.232597944839313], [94.58787738962991, 16.232145030968468], [94.5829402806695, 16.232388010698173], [94.5745356341123, 16.231881570977748], [94.57438190580035, 16.231872307960714], [94.57383328967461, 16.23257878298449], [94.57308649264758, 16.234961395552034], [94.57159228795376, 16.237092822076136], [94.57052829914176, 16.240891335366882], [94.56632408458887, 16.247501502592343], [94.56655373007067, 16.250024084743757], [94.56807655388991, 16.254173417269442], [94.57031606813212, 16.256933932155277], [94.57509433613478, 16.260155662553814], [94.57948552064033, 16.262097813263495], [94.58109535836417, 16.263154641673452], [94.58148122867584, 16.263300712258115], [94.58295884087784, 16.260970915975065], [94.58379648022344, 16.259876549862952], [94.58556444034673, 16.258749300040222], [94.59185579970546, 16.25473727960184], [94.59278567981534, 16.253509320099113], [94.5980463603513, 16.246561139984692], [94.59822167958691, 16.245159480026018], [94.59839699972184, 16.2437578200674], [94.59839699972184, 16.23978657039396], [94.59865259963783, 16.238917381931685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
