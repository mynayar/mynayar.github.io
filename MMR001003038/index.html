
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Kyee Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Kyee Htu</div><div class="name-mm">ကကျီးထူ</div></div>
        <span class="pcode-badge">MMR001003038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.82092548991949, 26.339363518111895], [97.83298876382048, 26.322525192183946], [97.84494048941212, 26.298621740101282], [97.8174745672975, 26.28844917568898], [97.80527192995567, 26.28295798902002], [97.79428955571848, 26.293330229906246], [97.78330718327993, 26.31163418636868], [97.77232480994206, 26.334209063697358], [97.76360893230645, 26.338106155274886], [97.75694534894876, 26.34051477173938], [97.75694534894876, 26.34512722813912], [97.7583730271935, 26.355120966859204], [97.7583730271935, 26.359047075062506], [97.75016388695389, 26.36654237662941], [97.74552393558122, 26.371539247338433], [97.7430255029247, 26.377963790896274], [97.7430255029247, 26.38403141601708], [97.74552393558122, 26.38795752601908], [97.75266231961041, 26.39116980004627], [97.7644406523143, 26.393311314265816], [97.7726497916546, 26.39366823270285], [97.77907433611176, 26.396166666258694], [97.78110302228669, 26.39262400829142], [97.79451670018562, 26.378873939880464], [97.8113674637375, 26.3526616412218], [97.82092548991949, 26.339363518111895]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
