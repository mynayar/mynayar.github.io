
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Kaing</div><div class="name-mm">သပြေကိုင်း</div></div>
        <span class="pcode-badge">MMR010020007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44607636223441, 20.95926128817797], [95.45459634774329, 20.95926128817797], [95.4605605912983, 20.958888522787163], [95.46503377418941, 20.957397462123254], [95.46652483485332, 20.952551513841343], [95.46987972157194, 20.946960034777817], [95.47509843524466, 20.935031547667847], [95.47808055657248, 20.927949008839732], [95.48277640081028, 20.922274864993085], [95.47411487010521, 20.917379216577615], [95.46422142288043, 20.91049681917292], [95.45561842634936, 20.907055620020913], [95.44443453022944, 20.903614420868905], [95.43649330162464, 20.902479960281994], [95.43462891709089, 20.912600906306807], [95.43454108300466, 20.91307771786245], [95.43119007686062, 20.920737160991223], [95.43196018431513, 20.921250565061598], [95.43927273195106, 20.923401315318472], [95.45088677830222, 20.925121914444844], [95.45303752676051, 20.927702813134374], [95.45303752676051, 20.93200431184954], [95.45260737742859, 20.935445510102284], [95.44873602804529, 20.93931685858621], [95.4418536306406, 20.93974700881745], [95.43884258171983, 20.941037458611902], [95.43927273195106, 20.947489705785358], [95.44271393110307, 20.953511803626895], [95.44615512935582, 20.959103752136514], [95.44607636223441, 20.95926128817797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
