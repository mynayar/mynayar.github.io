
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwar Ku Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwar Ku Gyi</div><div class="name-mm">နွားကူးကြီး</div></div>
        <span class="pcode-badge">MMR010015079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.30155381365762, 21.32918742755777], [96.30527009204116, 21.320581310379225], [96.31374839037596, 21.30590733155816], [96.32340787177594, 21.3059480168875], [96.32346518017397, 21.30594817336953], [96.32248494522412, 21.305078215087633], [96.32225577098711, 21.304967695602727], [96.32017517324573, 21.303817699227466], [96.31995932156548, 21.302034215906417], [96.32010048365044, 21.299119749676777], [96.32025911956276, 21.29810429817485], [96.32051528695098, 21.29646454180522], [96.32058915456588, 21.295991698957778], [96.32026863079273, 21.293018760607367], [96.32063082735084, 21.290536022919184], [96.32063850126588, 21.290483421572674], [96.32147006209374, 21.28833167936358], [96.30719592185437, 21.291904640886514], [96.29807043090574, 21.29478637539097], [96.28894493995705, 21.301990709403753], [96.28270118441219, 21.31351764472356], [96.2777712070756, 21.31890980794134], [96.2844650463249, 21.319822603630314], [96.29326692882574, 21.325404286378784], [96.30155381365762, 21.32918742755777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
