
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pat Ta Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pat Ta Lar</div><div class="name-mm">ပတ္တလား</div></div>
        <span class="pcode-badge">MMR007011008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.77917343530584, 18.259296255617755], [96.78256486327786, 18.259129077045316], [96.78736309443133, 18.260001483281883], [96.7921613237861, 18.25869287527604], [96.79914056828267, 18.25869287527604], [96.80437500120541, 18.258256671708068], [96.80472303523993, 18.25763020936671], [96.80655601364919, 18.25433084679122], [96.80742841988575, 18.24866021119982], [96.80801198816278, 18.24496427817894], [96.8087370278916, 18.24037235869747], [96.80917323056019, 18.229467290183322], [96.80857345200326, 18.228717566762327], [96.80742841988575, 18.227286276840232], [96.80541517327168, 18.226279653083566], [96.80306639230025, 18.225105262597822], [96.80006019072528, 18.22318282322874], [96.79172512111751, 18.22379665459198], [96.7808200517041, 18.22423285815995], [96.77340460633758, 18.225105262597822], [96.7677411698192, 18.22695756024325], [96.77113635066212, 18.232738810647618], [96.77200875689869, 18.23753704090177], [96.76918272999905, 18.24235983793625], [96.77157255423003, 18.245824894303496], [96.77331736490453, 18.251931731664115], [96.77549837914694, 18.25585755658102], [96.77917343530584, 18.259296255617755]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
