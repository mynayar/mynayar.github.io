
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Pyauk Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Pyauk Kone</div><div class="name-mm">သားပျောက်ကုန်း</div></div>
        <span class="pcode-badge">MMR005001033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66555508020286, 22.216844610190662], [95.65952492623444, 22.218431611429764], [95.6584865267319, 22.226187477170413], [95.65682719212128, 22.23531381707903], [95.65890136060938, 22.244025322210916], [95.6626348619094, 22.247758826208894], [95.67259087137165, 22.247758826208894], [95.68171721128033, 22.25066266065329], [95.68676344127982, 22.250347271109717], [95.6883545470248, 22.25024782677582], [95.70121439003213, 22.242365987600294], [95.71407423124083, 22.24153632164399], [95.72112640176209, 22.2411214868672], [95.7232005711495, 22.239047321077066], [95.72490315415729, 22.235913630709547], [95.72817857498131, 22.22909131161481], [95.7239971195715, 22.22892827981633], [95.72047056036814, 22.22822303956167], [95.71498811960612, 22.224659400411042], [95.70374928030509, 22.216984020396296], [95.692510080376, 22.21753230017555], [95.68209348042984, 22.218902910141253], [95.66893584041674, 22.21862876980191], [95.66555508020286, 22.216844610190662]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
