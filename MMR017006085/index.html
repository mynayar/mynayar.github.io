
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daunt Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daunt Gyi</div><div class="name-mm">ဒေါင့်ကြီး</div></div>
        <span class="pcode-badge">MMR017006085</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09424623987212, 17.45824509003893], [95.09686199988147, 17.458726950388495], [95.0983761596321, 17.462168820434783], [95.09850971974782, 17.463568859815098], [95.09892696021109, 17.46795105020084], [95.09851404009095, 17.47318266015168], [95.10415848022973, 17.471668229705074], [95.11010110318341, 17.473128750291664], [95.11551647970185, 17.4669184801038], [95.11778807995597, 17.46347669998977], [95.12246339986609, 17.458861499758484], [95.1231574804334, 17.458176239741704], [95.12997228029656, 17.453426580072687], [95.1312459604328, 17.453288880377556], [95.13012707970103, 17.452875870325215], [95.12900855959742, 17.452462860272817], [95.1271002000143, 17.45146313971219], [95.1203350796003, 17.447919569832322], [95.11606728028084, 17.44551035981533], [95.11262532030236, 17.44151778002157], [95.10959664017287, 17.436974580412596], [95.10575651974767, 17.43423993002881], [95.10505343966457, 17.433739260358607], [95.10216228026508, 17.43126111011219], [95.09916995972594, 17.430855389964336], [95.09810111997075, 17.430710490296917], [95.09703515984484, 17.438277779895657], [95.09672412032194, 17.44048520992453], [95.09796324041127, 17.448470279579794], [95.09534748040198, 17.452875870325215], [95.09424623987212, 17.45824509003893]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
