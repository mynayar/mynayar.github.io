
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar U Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar U Yin</div><div class="name-mm">ကြာဥယျာဉ်</div></div>
        <span class="pcode-badge">MMR009024061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.17749344306799, 21.84334540226854], [94.17877432137789, 21.837154491786407], [94.17755955762755, 21.819661907271268], [94.1776244338206, 21.819502666115227], [94.17342936357431, 21.818204191670134], [94.1598240203623, 21.815045808617242], [94.15399315885725, 21.815045808617242], [94.14899406682281, 21.81477558842272], [94.14500391429925, 21.81455990401639], [94.13261333303893, 21.81407399761696], [94.13063731835763, 21.81530900690518], [94.13188447478876, 21.815531714117355], [94.13382809499063, 21.818447145319567], [94.1321274266395, 21.82840819997847], [94.13164152203865, 21.837640398185897], [94.13237038028888, 21.84808735834497], [94.13332751884997, 21.84993782766867], [94.15375020610719, 21.845900785392985], [94.17002802777131, 21.84492897529202], [94.17749344306799, 21.84334540226854]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
