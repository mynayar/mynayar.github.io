
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (72) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (72) Ward</div><div class="name-mm">အမှတ် (၇၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701523</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24403100372791, 16.87410819863453], [96.24693502073467, 16.87694817222041], [96.24699417723957, 16.877057742920556], [96.2488435556856, 16.879088983170107], [96.25039798527888, 16.880837558406654], [96.25165384534876, 16.87977041207489], [96.25262466529614, 16.879013743189773], [96.25359548524352, 16.878199968253966], [96.25377029186552, 16.878045024958], [96.25333850306953, 16.87752895979372], [96.25251045139629, 16.876615245896915], [96.2522068034013, 16.876233509768724], [96.25043750688548, 16.874266578240054], [96.25125694215421, 16.8735202794374], [96.24992942770098, 16.87203025838977], [96.24949455243171, 16.871534347931856], [96.2481387453069, 16.870018322987278], [96.24750729712412, 16.870538221961397], [96.247158753174, 16.870839910333643], [96.24698448164855, 16.870990753620447], [96.24654511786298, 16.87138269525525], [96.24576123459337, 16.872081969407418], [96.24403100372791, 16.87410819863453]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
