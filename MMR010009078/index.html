
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Pyone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Pyone</div><div class="name-mm">တောင်ပြုံး</div></div>
        <span class="pcode-badge">MMR010009078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13880168185221, 22.09094276219878], [96.13451895378677, 22.09285862212778], [96.1340208094129, 22.085798162555193], [96.1332828239432, 22.085818108618867], [96.12677845566128, 22.086212312947907], [96.11850016924745, 22.087394925035824], [96.11022188193436, 22.089168844066933], [96.1015493911915, 22.08936594578182], [96.09327110387841, 22.08936594578182], [96.0891319597722, 22.088380436308114], [96.08479571485043, 22.09725002876587], [96.08321889843347, 22.105331214364128], [96.08972326581613, 22.10690802988171], [96.09405951163723, 22.103951498762683], [96.1025349006652, 22.102374683245102], [96.10805375857416, 22.102374683245102], [96.11101028969318, 22.09744713138008], [96.11850016924745, 22.09744713138008], [96.1261871496173, 22.09803843742401], [96.13190311014046, 22.09803843742401], [96.13861314977709, 22.09803843742401], [96.13840747842244, 22.096855825336092], [96.13880168185221, 22.09094276219878]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
