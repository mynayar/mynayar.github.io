
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Zi Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Zi Chaung</div><div class="name-mm">မင်းဇီချောင်း</div></div>
        <span class="pcode-badge">MMR012002044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.03917636269904, 20.595726046020275], [93.04111231887845, 20.594362318566198], [93.04671485240857, 20.59156485233609], [93.0521324286687, 20.58963237473438], [93.05410949735546, 20.58860720515844], [93.06164431243513, 20.586786786680932], [93.07614316717348, 20.58414311801056], [93.07935449961053, 20.582587327743056], [93.07998994258185, 20.58181810702007], [93.08022252704802, 20.58153655806575], [93.08075486814272, 20.578641760009248], [93.08072467160639, 20.575466113570315], [93.08050772185396, 20.574368735628696], [93.08036484116457, 20.573646017050123], [93.08037074701241, 20.572922338894898], [93.06359206682049, 20.569996223746784], [93.0449636628428, 20.56990824666832], [93.0462597846614, 20.573566757999515], [93.04865219534258, 20.578444571060174], [93.04008436680016, 20.57732096708901], [93.0367968491953, 20.577321697338505], [93.03350933069112, 20.57732236373613], [93.02111718640907, 20.578747517583906], [93.01717157011194, 20.579201089758556], [93.02972548444359, 20.58651708629452], [93.03579978523197, 20.592436140715392], [93.03917636269904, 20.595726046020275]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
