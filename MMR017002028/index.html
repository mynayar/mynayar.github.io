
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kangyidaunt</div><div class="name-mm">ကန်ကြီးထောင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Kwin</div><div class="name-mm">ကုလားကွင်း</div></div>
        <span class="pcode-badge">MMR017002028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92450588024224, 16.799083470126106], [94.9166301600539, 16.797033630097985], [94.91172155960237, 16.796548079830075], [94.9068126003213, 16.796062620393684], [94.89796596036086, 16.796278439698256], [94.89397427988916, 16.796494169970003], [94.89095316036014, 16.797249360369733], [94.88890332033202, 16.799515019702426], [94.88588255963248, 16.801780590002295], [94.88372507974867, 16.802212139578614], [94.87682028023181, 16.80188849965458], [94.87984104003203, 16.804909350286323], [94.88663783996441, 16.80857747986687], [94.88940767992057, 16.81027271991013], [94.89267935956485, 16.810167150293807], [94.89447359967693, 16.81037829042583], [94.89647915978543, 16.812594630038177], [94.89764016026527, 16.813544580318194], [94.89953988006147, 16.81386120013434], [94.90249511975401, 16.813966769750664], [94.9032338399698, 16.814600010282277], [94.90365612023385, 16.81734410984285], [94.90428935986614, 16.818082919990786], [94.91104404005046, 16.821143730199026], [94.91452703969117, 16.822093589647466], [94.91801004023125, 16.815022199714804], [94.91899571967679, 16.81325955008822], [94.92349824025166, 16.80520662028937], [94.92450588024224, 16.799083470126106]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
