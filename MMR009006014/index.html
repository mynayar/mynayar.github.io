
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Ein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Ein</div><div class="name-mm">လေးအိမ်</div></div>
        <span class="pcode-badge">MMR009006014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35594072738274, 20.427734726576432], [95.34780614633667, 20.43722507068054], [95.34766541232898, 20.438310734952495], [95.34640175243896, 20.448058967747215], [95.35225624003351, 20.447608623239432], [95.38044016917854, 20.447608623239432], [95.39626272524464, 20.45304762674664], [95.3957682698898, 20.46244227039449], [95.40664627690421, 20.46392563376105], [95.43928029884677, 20.458981084709364], [95.43631357031506, 20.449586442860095], [95.43820178688304, 20.450235516855685], [95.43136902126338, 20.442664074187746], [95.4226728001097, 20.439965245599637], [95.41702983036242, 20.438213979591524], [95.41696829784871, 20.43649107999937], [95.41109637060106, 20.43722507068054], [95.39527381543428, 20.43722507068054], [95.39527381543428, 20.430797157362974], [95.35670633373036, 20.42684151812159], [95.35594072738274, 20.427734726576432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
