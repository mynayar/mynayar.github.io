
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hton San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hton San</div><div class="name-mm">ထုံစံ</div></div>
        <span class="pcode-badge">MMR005036026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34604319993377, 26.18382329980551], [95.34832776031794, 26.18151858021838], [95.36450183978815, 26.170715340140873], [95.38085268010718, 26.15761152005564], [95.37188723970439, 26.143920900429237], [95.36579819992704, 26.117477910377318], [95.3472898797242, 26.11492920022249], [95.32788083992887, 26.11389159032467], [95.31512459972055, 26.109680219866277], [95.31533412017359, 26.108229959644973], [95.30565984042937, 26.116112789873398], [95.29592579983586, 26.134831799647884], [95.2966745996531, 26.140073040438494], [95.31314747977245, 26.14830938966668], [95.32662515972339, 26.159540760098025], [95.32962000016295, 26.17152093034673], [95.33860524003984, 26.176013460352976], [95.34604319993377, 26.18382329980551]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
