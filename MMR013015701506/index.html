
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bo Lein Aung Min Ga Lar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Bo Lein Aung Min Ga Lar Ward</div><div class="name-mm">ဘိုလိန်းအောင်မင်္ဂလာရပ်ကွက်</div></div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17622331485416, 16.795146501709723], [96.17640495272644, 16.795439720266927], [96.17661822964766, 16.795839656874705], [96.17664337109477, 16.796217918022535], [96.17676492166385, 16.796568957591376], [96.17677116385818, 16.79696083087771], [96.1767749787823, 16.797369956758132], [96.17705865373392, 16.797316984890983], [96.17740058856634, 16.79753685024548], [96.17775154090094, 16.79776954622764], [96.17818260214545, 16.79805946337359], [96.17867088365443, 16.798431396891488], [96.17912419682426, 16.798756280577948], [96.17954254165505, 16.79896068568712], [96.17994117694383, 16.79910405470838], [96.18037096744627, 16.799118041864176], [96.18079862835407, 16.799020359302176], [96.1808182110916, 16.798702760124343], [96.18031120299969, 16.796428680439305], [96.1802577976593, 16.796155929552583], [96.18004989598597, 16.795068740929707], [96.1799755085629, 16.794744491265305], [96.17975698229895, 16.793840408208325], [96.17845344557014, 16.7942905431741], [96.17709350606049, 16.794780731245794], [96.17622331485416, 16.795146501709723]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
