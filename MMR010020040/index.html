
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Pauk</div><div class="name-mm">ဆည်ပေါက်</div></div>
        <span class="pcode-badge">MMR010020040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15937792674998, 20.866549498560573], [95.1596937407736, 20.87507665976011], [95.1628615424263, 20.883674977118574], [95.16733372167397, 20.89193130838322], [95.17291577044648, 20.892743242406766], [95.183005296857, 20.894210810080892], [95.19654781433024, 20.895363365027322], [95.20432755797049, 20.89853288978111], [95.2109547466643, 20.90227869290743], [95.21614124302403, 20.902854970380645], [95.22046332272424, 20.903143108667564], [95.23371770101113, 20.900837999673968], [95.24063302889124, 20.895939641601217], [95.24502711011309, 20.89437730157124], [95.24342217189576, 20.892451377329223], [95.23860204225053, 20.88923795666642], [95.23324634114579, 20.88468561095226], [95.23030070531337, 20.878794340186687], [95.22414164881809, 20.87209971403064], [95.2171792378316, 20.864869518213766], [95.21450138772894, 20.857907107227277], [95.21503695828903, 20.851480265901614], [95.21071239825864, 20.849578572093492], [95.20371729691578, 20.852726367427977], [95.19602268669769, 20.856923426974618], [95.19136131797052, 20.864820667040192], [95.18732737655722, 20.86597322198668], [95.18127646533668, 20.86597322198668], [95.17637810816319, 20.864244389566977], [95.17205602756366, 20.864244389566977], [95.16744580957652, 20.864532528753273], [95.16341186906254, 20.86597322198668], [95.15937792674998, 20.866549498560573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());

</body>
</html>
