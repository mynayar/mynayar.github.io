
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Chaung</div><div class="name-mm">ကန်ချောင်း</div></div>
        <span class="pcode-badge">MMR009017038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65335838468178, 19.531259917910916], [95.65104586437519, 19.53417198205136], [95.63905873787053, 19.541612266692823], [95.63327184961622, 19.544919060366396], [95.62788839003724, 19.550791924707596], [95.63492524600338, 19.563106423322836], [95.64236553064478, 19.57550689802497], [95.64649902341125, 19.580880437182486], [95.65145921257266, 19.580880437182486], [95.6642730372709, 19.57550689802497], [95.670473274622, 19.573853501637814], [95.6787402583563, 19.572200105250715], [95.68535384480413, 19.57550689802497], [95.69315553999621, 19.577735954051093], [95.69072738396164, 19.5659998670003], [95.69899436679663, 19.560626327842783], [95.70271450956704, 19.56145302693568], [95.70726134963166, 19.55690618597174], [95.70602130324062, 19.54863920223744], [95.70519460504704, 19.538305473019193], [95.71056814420456, 19.529625141087422], [95.7118081905956, 19.52135815735312], [95.70767469962772, 19.515571269098814], [95.7085013978213, 19.50730428626383], [95.70695771692516, 19.5059009400764], [95.70023441498631, 19.511437777231663], [95.69279413034491, 19.518464712776336], [95.68039365474345, 19.518464712776336], [95.66716648094842, 19.52590499831706], [95.65559270533913, 19.529211791990633], [95.65335838468178, 19.531259917910916]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
