
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Ri Min Ga Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thi Ri Min Ga Lar</div><div class="name-mm">သီရိမင်္ဂလာ</div></div>
        <span class="pcode-badge">MMR009004050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48803367021776, 19.891699360836867], [95.48943053139396, 19.886710574133758], [95.49633120841861, 19.876673224589695], [95.50887789399968, 19.866008542160557], [95.509283498135, 19.864872850401753], [95.50668222440521, 19.86287186964114], [95.49727221044424, 19.858794196894735], [95.48598019243201, 19.850011516718155], [95.48338280827005, 19.847847030216315], [95.48252985257068, 19.84875684824999], [95.46966949964775, 19.85942153067913], [95.46245515528125, 19.873850221210773], [95.46088681857185, 19.881064564677956], [95.46010571600607, 19.881943305739014], [95.46228366625826, 19.88289024059219], [95.46403165963346, 19.88829313182265], [95.4641820640511, 19.889109611019762], [95.4671601618121, 19.889219911070086], [95.47406083973601, 19.892356582690184], [95.47845217982427, 19.89549325431028], [95.4834708545963, 19.896747922778445], [95.48654149079721, 19.896747922778445], [95.48723486000085, 19.894552253183974], [95.48803367021776, 19.891699360836867]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
