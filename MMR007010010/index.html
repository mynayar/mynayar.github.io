
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Yaing Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Yaing Pyin</div><div class="name-mm">ကျွဲရိုင်းပြင်</div></div>
        <span class="pcode-badge">MMR007010010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.44069323070806, 19.15055935183267], [96.43991925437012, 19.15027437196477], [96.43706322428841, 19.145570319614592], [96.4333671797516, 19.141706276323646], [96.43051114966988, 19.133642185038866], [96.42883112885357, 19.127762118027363], [96.42447016876332, 19.123116709568535], [96.41876711890745, 19.122662687732884], [96.41438296889896, 19.121210045207476], [96.41253494663056, 19.118018010422873], [96.40878861919947, 19.115430090726136], [96.40546214566155, 19.11497631980137], [96.40509068158974, 19.114267299696166], [96.40498855098087, 19.11407235905216], [96.40213576835112, 19.11407185992846], [96.40189566375392, 19.12045696371797], [96.40285945909682, 19.127169341591866], [96.40285945909682, 19.13733753889636], [96.40285131933297, 19.14276057673925], [96.40862143702975, 19.14547209566075], [96.41607811541274, 19.146827856020764], [96.42455161226712, 19.147844675391525], [96.43301697025703, 19.15055619521229], [96.43810920777378, 19.152589833953698], [96.44069323070806, 19.15055935183267]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
