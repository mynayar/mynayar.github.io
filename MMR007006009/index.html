
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baw Di Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Baw Di Kwin</div><div class="name-mm">ဗောဓိကွင်း</div></div>
        <span class="pcode-badge">MMR007006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67015340805341, 18.19989338776969], [96.66876630362208, 18.19834309595717], [96.66783363921115, 18.189327333989297], [96.66972527230354, 18.18057852767697], [96.66441386730617, 18.177824466326115], [96.66128368789197, 18.176781073787595], [96.65788521193303, 18.17564824816816], [96.64980211527546, 18.171917587826442], [96.64560659716676, 18.171187931877625], [96.64265168392814, 18.170674034079468], [96.6348546049561, 18.170674034079468], [96.6348794757073, 18.17378291844699], [96.63305027894728, 18.175815359291448], [96.63208148067588, 18.17689180101587], [96.63036827667469, 18.178833431917383], [96.62741815592324, 18.18217690174265], [96.62088950144937, 18.189016445552568], [96.62151127742356, 18.197410430646926], [96.62190974004255, 18.20219198117502], [96.6249310493285, 18.202695532273026], [96.62555282620201, 18.208291522335912], [96.63239236911261, 18.213887512398856], [96.64047546577018, 18.214198399936265], [96.64669323180726, 18.21513106524651], [96.65850698880655, 18.2117112942409], [96.66410297886944, 18.204560861994253], [96.67015340805341, 18.19989338776969]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
