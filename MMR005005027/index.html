
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Poke Ta Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Poke Ta Yar</div><div class="name-mm">စည်ပုတ္တရာ</div></div>
        <span class="pcode-badge">MMR005005027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57391348022298, 22.82312016006739], [95.58111563967509, 22.825927710395547], [95.59588607977884, 22.8275146801584], [95.60009772003383, 22.82250978030214], [95.6101075197463, 22.814514179585785], [95.61187728031229, 22.814697240185524], [95.61188592009921, 22.814667270278335], [95.61431880027249, 22.80609134963612], [95.62109363965982, 22.7985229799516], [95.6234739598554, 22.794494670093002], [95.61969000029336, 22.79388429032781], [95.61138735664127, 22.79344728906119], [95.6113673746047, 22.79344623685438], [95.60809331985087, 22.79327390966324], [95.59771739983819, 22.790893590366977], [95.5894773597924, 22.79272463973041], [95.5776978004132, 22.79272463973041], [95.57891855994365, 22.79827881041882], [95.57147231999164, 22.79827881041882], [95.56030259988512, 22.800476070014668], [95.54309100044935, 22.79571533969124], [95.54168699955545, 22.800109859782253], [95.53912343979499, 22.806518579768692], [95.53967279966002, 22.811889689857367], [95.55310044043301, 22.811889689857367], [95.56488036044033, 22.81231691998994], [95.56768799980142, 22.815673830183187], [95.57391348022298, 22.82312016006739]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
