
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Paing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Paing</div><div class="name-mm">စီပိုင်း</div></div>
        <span class="pcode-badge">MMR007010026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.36534828599468, 19.27782812616715], [96.37212708509696, 19.27477766715566], [96.37382178374838, 19.273760847784956], [96.37856694320993, 19.270371448683477], [96.38026164186135, 19.26664311039127], [96.38534574141289, 19.263931590570508], [96.38907932994715, 19.259439324065625], [96.38634795579361, 19.2557970329068], [96.38702583507427, 19.252068693715273], [96.38872053462501, 19.244950957220965], [96.38838159543434, 19.23986685766937], [96.38634795489429, 19.232410180185695], [96.3832974958828, 19.228003960814192], [96.37854729931848, 19.224098592775874], [96.37754060361601, 19.227393236608634], [96.37528452655971, 19.232549984294394], [96.37056796104264, 19.23817215811863], [96.36582280158109, 19.24088367704013], [96.36378916283968, 19.24427307614161], [96.36143512982744, 19.250044836899747], [96.36090139208562, 19.25418048803914], [96.36060312833177, 19.256474912187514], [96.3581918049079, 19.261297558135823], [96.35755266932028, 19.262575831109757], [96.35820205088402, 19.265852555051424], [96.36026418824173, 19.270710388773466], [96.36433146662392, 19.27477766805498], [96.36534828599468, 19.27782812616715]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
