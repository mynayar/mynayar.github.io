
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Ya</div><div class="name-mm">အောင်ယ</div></div>
        <span class="pcode-badge">MMR012004011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.92352770963618, 20.97737004319299], [92.95165762909636, 20.979513275117597], [92.95303900934289, 20.97035430780511], [92.95404364919511, 20.95829862777947], [92.95630408886268, 20.94875454828383], [92.96132728902325, 20.931675668997002], [92.96409004861692, 20.919619989870682], [92.95228552855434, 20.91635491035089], [92.94374608981025, 20.91509910963623], [92.93897404961274, 20.92439202916887], [92.93646244998212, 20.93393610866451], [92.93445317027766, 20.93996394867736], [92.933197369563, 20.94322902909647], [92.92869667730986, 20.942860119998613], [92.92850695633103, 20.942955571342566], [92.92518160964363, 20.9455580150904], [92.92257916589585, 20.949750843326797], [92.92445870940196, 20.95813649800101], [92.92743780900776, 20.967166896435174], [92.92716953044953, 20.969098507989827], [92.92352770963618, 20.97737004319299]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
