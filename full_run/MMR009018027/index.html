
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tin Gat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tin Gat</div><div class="name-mm">တင်းဂါတ်</div></div>
        <span class="pcode-badge">MMR009018027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00881887788898, 21.33003274081841], [95.00719549457648, 21.33003274081841], [95.00288728422083, 21.32716060118082], [95.00288728422083, 21.317586799990863], [95.00685357323385, 21.31362051097784], [95.00575942385836, 21.313278589635274], [95.00575942385836, 21.30179002928645], [95.00872652560872, 21.29895779616544], [95.01930072185087, 21.275900357015928], [95.0148225486218, 21.26869953125839], [94.98848995484758, 21.270196486978364], [94.98974402526659, 21.2729402726755], [94.99200993011425, 21.27638155096787], [94.99235610255215, 21.285035878103315], [94.98948396291462, 21.29125884761777], [94.9933134839302, 21.298439199409586], [94.99494079817936, 21.300567224697716], [94.99953645434397, 21.30657692898211], [94.99905776410458, 21.315193349693402], [94.99235610255215, 21.323331081064566], [94.99139872297275, 21.33290488135526], [94.99044134339334, 21.342957371885234], [94.98754902386844, 21.346138923272747], [94.99666431380712, 21.344393441704028], [95.0033659735609, 21.338649162428965], [95.00863156529454, 21.334340951174], [95.00881887788898, 21.33003274081841]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
