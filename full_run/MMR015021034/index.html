
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kawng (3)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kawng (3)</div><div class="name-mm">မန်ကောင်း (၃)</div></div>
        <span class="pcode-badge">MMR015021034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.74488963275041, 23.281162403222368], [98.74323454383921, 23.275852590025067], [98.74296108698462, 23.255343284564958], [98.74651603328834, 23.24741301959523], [98.75007097869275, 23.243858074190825], [98.76018890299554, 23.242217330365577], [98.77329671157406, 23.242057477670528], [98.77468214506501, 23.22389568423847], [98.77189062874959, 23.21907397358507], [98.76292347693698, 23.212137016110432], [98.74324379336645, 23.204996349601913], [98.72163140916228, 23.23045866133822], [98.71905558894434, 23.237886662139772], [98.71939778458017, 23.238013740841495], [98.7197858843112, 23.2384018396732], [98.7233381065684, 23.24195406013183], [98.72652626257701, 23.246808170660586], [98.7233381065684, 23.2609611479387], [98.7233381065684, 23.279714805893605], [98.72405627187948, 23.280512768949166], [98.72404689284991, 23.280824422708974], [98.72573327007439, 23.28077482329951], [98.73776539595633, 23.282689024878664], [98.74488963275041, 23.281162403222368]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
