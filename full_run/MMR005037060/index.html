
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Yan</div><div class="name-mm">နောင်ယမ်း</div></div>
        <span class="pcode-badge">MMR005037060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1696261509262, 27.247620353896252], [96.17306661982872, 27.247764735554142], [96.1861183224027, 27.24970718304013], [96.19345641258343, 27.258570929904522], [96.1969065878688, 27.260496497115696], [96.20761007244693, 27.259481694025], [96.21010476931968, 27.26087364130558], [96.20834517289148, 27.257138151604465], [96.20690904012014, 27.2540893500435], [96.21069336031042, 27.240478559637893], [96.22229003985353, 27.229492169927767], [96.24057958108284, 27.218441056909285], [96.24249252001385, 27.21728519965228], [96.24329375300437, 27.21677916013016], [96.25988771964262, 27.206298809942155], [96.26849352025982, 27.196716330294464], [96.24969468036528, 27.19189449013868], [96.22369368011931, 27.178894080397527], [96.20489519995357, 27.174499470374315], [96.18969743978505, 27.16589357982491], [96.18609636005903, 27.160095239603663], [96.18530255996524, 27.16070553033603], [96.16290300007347, 27.17089847968117], [96.1499023196364, 27.176879879602836], [96.15771467988861, 27.183288599589275], [96.17730696014814, 27.194091839666726], [96.18530255996524, 27.20129391008595], [96.18530255996524, 27.21728519965228], [96.17928504237085, 27.22740572209642], [96.17590331988237, 27.23309324965379], [96.1696261509262, 27.247620353896252]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
