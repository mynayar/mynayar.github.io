
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hla Pa Chin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hla Pa Chin</div><div class="name-mm">လှပခြင်း</div></div>
        <span class="pcode-badge">MMR008012017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4880957099491, 18.425187653587386], [95.48437388274857, 18.417982120778277], [95.48123423617113, 18.412958686794013], [95.47781283829192, 18.407474072370576], [95.4738394320442, 18.40570811413818], [95.47119049514532, 18.401513962999047], [95.46519359360951, 18.40269126818754], [95.455775150303, 18.4046534441012], [95.43907243674363, 18.404142671447175], [95.44434815844085, 18.41152868110379], [95.44909630724885, 18.417068188346263], [95.45753746088519, 18.419442261850975], [95.46437923141644, 18.41988656201528], [95.46540129293538, 18.41909528811709], [95.46777645282111, 18.418595255166963], [95.4710473977193, 18.419233487835243], [95.47109049862769, 18.419221982808324], [95.47290179438238, 18.419439339953612], [95.4792680276974, 18.420203290649397], [95.48149053755833, 18.42331480823185], [95.48383188203576, 18.42331480823185], [95.48384630806072, 18.42335690189958], [95.4880957099491, 18.425187653587386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
