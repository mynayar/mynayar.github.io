
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Shwe Kyaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Shwe Kyaw</div><div class="name-mm">ဖားရွှေကျော်</div></div>
        <span class="pcode-badge">MMR008007030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88052708855435, 17.728197360319996], [95.87879659508684, 17.71906283118477], [95.88005452539608, 17.715603525082656], [95.87753866567692, 17.713402149289834], [95.87282143106427, 17.709628361959403], [95.86873316070688, 17.70396768006441], [95.86778971432392, 17.698935963324118], [95.866531784914, 17.695791140248957], [95.86244351455662, 17.693589763556815], [95.856782833561, 17.689187011071738], [95.85280367255149, 17.68943364474694], [95.84936891344466, 17.690660345198808], [95.84961425299542, 17.692868403853822], [95.84838755344288, 17.71298628209132], [95.84789687344204, 17.72598929986634], [95.8481422129928, 17.732122799427714], [95.85991853211465, 17.727216000318208], [95.86531601122499, 17.725498619865448], [95.87120417033623, 17.7242719203129], [95.88052708855435, 17.728197360319996]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
