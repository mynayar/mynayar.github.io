
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Pu Htoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Pu Htoe</div><div class="name-mm">ကုန်းပုထိုး</div></div>
        <span class="pcode-badge">MMR010018055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28708383365205, 21.371819057103835], [95.29399498867787, 21.365222045161318], [95.2954225410175, 21.362886050750717], [95.29628121910304, 21.36148094189201], [95.29586553986286, 21.352336023788496], [95.29607337858363, 21.345477336110207], [95.29794393066794, 21.339242163694962], [95.29899171279737, 21.33642121256895], [95.29482634535958, 21.33279915435753], [95.2908774033695, 21.328226695305773], [95.28609710469766, 21.32510910909815], [95.28152464564596, 21.3228228795723], [95.27986193408105, 21.32261504085153], [95.27445811924684, 21.321368006728164], [95.26946998185423, 21.318873937582225], [95.2675144033671, 21.318126216951384], [95.2664188717336, 21.330177064020347], [95.26408595480302, 21.33484289698214], [95.26480377567378, 21.34273892206363], [95.26480377567378, 21.35171167755192], [95.26607163629706, 21.354927795281583], [95.27050553500248, 21.352563047746514], [95.27819096134385, 21.353449827847328], [95.28351164104947, 21.35699694825064], [95.28824113432097, 21.36468237369263], [95.28708383365205, 21.371819057103835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
