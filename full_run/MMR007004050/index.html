
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da La Nwan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da La Nwan</div><div class="name-mm">ဒလနွမ်း</div></div>
        <span class="pcode-badge">MMR007004050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.8627488791575, 17.66671543257121], [96.8639208297825, 17.663785572646134], [96.8680224928438, 17.662906676002365], [96.87305592459131, 17.655892178980935], [96.87023043098964, 17.653965047848715], [96.86528944055527, 17.64902405741435], [96.85989926933587, 17.64273552372549], [96.84998838065928, 17.64071455013641], [96.83968612591406, 17.63959125733072], [96.83384677301024, 17.63734535160677], [96.8275582402207, 17.633302722742485], [96.82216806810192, 17.629260094777578], [96.81733073532524, 17.62511380915504], [96.81408281127278, 17.628361733207498], [96.80959100072414, 17.63195518038731], [96.80509919107487, 17.63689617082167], [96.81004018240856, 17.64543060933522], [96.81812543923769, 17.648125694944895], [96.8257615161811, 17.652617504594218], [96.83339759222514, 17.655761771888308], [96.8459746587036, 17.661601123892808], [96.85316155486191, 17.66384702871744], [96.85989926933587, 17.668338839266085], [96.8627488791575, 17.66671543257121]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
