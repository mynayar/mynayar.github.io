
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pon Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pon Su</div><div class="name-mm">ရွေပုံစု</div></div>
        <span class="pcode-badge">MMR007003061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.69497265326538, 17.017124232397464], [96.69799102986218, 17.013721842589007], [96.70175236517957, 17.01064438592971], [96.70482982004023, 17.00380559215438], [96.70920364403298, 17.0009938473882], [96.70653951668538, 16.998334558393196], [96.69970072380943, 16.997308738607444], [96.69115223608691, 16.99901843705129], [96.68499732276831, 16.99936037727963], [96.68412996262771, 16.996324620384996], [96.68021016856449, 16.998676496822895], [96.6761068948174, 17.00483141104081], [96.67412987199606, 17.00906285796458], [96.6713197442109, 17.016457359919286], [96.66956521186512, 17.02289065028333], [96.6759608566083, 17.025978202731892], [96.67911596702834, 17.023809063137776], [96.68663863766307, 17.02038966714946], [96.69529757742134, 17.018911311208115], [96.69497265326538, 17.017124232397464]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
