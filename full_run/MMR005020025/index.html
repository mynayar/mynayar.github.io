
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Seik Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Seik Thar</div><div class="name-mm">ဆိပ်သာ</div></div>
        <span class="pcode-badge">MMR005020025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.38534744832612, 24.01846855737807], [96.38601461218468, 24.01728216184233], [96.3890992796081, 24.014818258655737], [96.3890992796081, 24.0140991598484], [96.39227304016873, 24.0100707600576], [96.39788831979018, 24.0026855400057], [96.40887443970371, 24.00067143004253], [96.41650392011985, 23.997680640149497], [96.42071519974672, 23.99188229992825], [96.42132576027569, 23.985290520241392], [96.42132576027569, 23.984680139576824], [96.41552724019004, 23.98309325974617], [96.40667735997226, 23.98309325974617], [96.39050291987394, 23.987670930369177], [96.38891604004328, 23.99328612005843], [96.3856810797181, 24.00250248030528], [96.38330076042183, 24.010681139822793], [96.38051039973521, 24.016489559645493], [96.38040240015073, 24.016713929704167], [96.38049312016142, 24.016723649576818], [96.38330076042183, 24.018127469706997], [96.38534744832612, 24.01846855737807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
