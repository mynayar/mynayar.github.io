
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Kyaung Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chaung-U</div><div class="name-mm">ချောင်းဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Kyaung Lay</div><div class="name-mm">တောကျောင်းလေး</div></div>
        <span class="pcode-badge">MMR005015015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22187739962237, 21.910385970336336], [95.21743247972523, 21.906371070268733], [95.21074187983396, 21.905606429792954], [95.20366896015446, 21.90541526989881], [95.19793415973373, 21.90904721975346], [95.19143508036473, 21.909620700335097], [95.18149475957557, 21.91248809964611], [95.17490567965348, 21.915782550124618], [95.17423068000193, 21.91612005040008], [95.16792275962769, 21.918605129922867], [95.15874708021363, 21.9237663598297], [95.14995371968848, 21.925104390055594], [95.1446012399553, 21.92278490989571], [95.13985562993344, 21.920637534794423], [95.14024356778646, 21.925852340013535], [95.14254671985532, 21.925900440253145], [95.15894255955152, 21.928455630023336], [95.16894732036258, 21.927368159912703], [95.17220963986307, 21.927368159912703], [95.17808196011441, 21.92606315998688], [95.18351939970057, 21.92454072017813], [95.18982659971789, 21.92562819028882], [95.19352415961231, 21.926498129685], [95.1946365598294, 21.925563750266917], [95.19896124036899, 21.921930810258743], [95.20265880026346, 21.91410098966901], [95.21027100020655, 21.910403609638934], [95.21788355987843, 21.911273549934435], [95.22187739962237, 21.910385970336336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
