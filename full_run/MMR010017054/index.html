
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Taw</div><div class="name-mm">ရှားတော</div></div>
        <span class="pcode-badge">MMR010017054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31900898837415, 21.45433436214114], [95.3297672272758, 21.45058631880363], [95.33193172007287, 21.44805568322323], [95.33344497510558, 21.447429508664925], [95.33263488469225, 21.44727020995225], [95.33143917847536, 21.447124392077058], [95.33036012691838, 21.446686939350798], [95.32893111228105, 21.44589952264488], [95.3292810753614, 21.44216658701845], [95.33138085114541, 21.44164164374689], [95.33546374985224, 21.441175026006704], [95.33925501280868, 21.439687684938747], [95.34237038488544, 21.438259765675696], [95.33693154055823, 21.42965452983276], [95.3279762337163, 21.425618334718422], [95.31624604172151, 21.42460928638951], [95.30672785730485, 21.423330247193178], [95.30415736017409, 21.425199700305996], [95.30328941097758, 21.429828759989334], [95.30328941097758, 21.432432605780207], [95.30994368455345, 21.439665512153738], [95.31664459786998, 21.44725988033923], [95.31900898837415, 21.45433436214114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
