
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Say Khin Khon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Say Khin Khon</div><div class="name-mm">ဆေးခင်းခုံ</div></div>
        <span class="pcode-badge">MMR005025024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75636039971272, 23.93486856023594], [95.75289644321634, 23.94551058064883], [95.74845644980536, 23.95172656962552], [95.74379445784803, 23.96216055166815], [95.73757846887128, 23.970818538145068], [95.73418212610432, 23.976212729334065], [95.74359696043143, 23.982190379982114], [95.75341991969361, 23.992640459889344], [95.75561376006704, 23.991349949840355], [95.76183419978855, 23.98960817977371], [95.76606419970312, 23.98587596990012], [95.76880128005507, 23.982641370203112], [95.7715379997789, 23.976918539758856], [95.77178712007958, 23.97069818996954], [95.7732800396422, 23.962984829786137], [95.77601676026535, 23.958506160131208], [95.77974923993554, 23.953281029795733], [95.78323260020437, 23.94929997031744], [95.78621844022888, 23.94457245015849], [95.78615435993584, 23.94441855007608], [95.78497428033882, 23.94158661013398], [95.78124216039743, 23.93760554975637], [95.77651464023853, 23.93287802959742], [95.77380131997501, 23.931672119672612], [95.77203587975208, 23.930887499858272], [95.76855252038257, 23.931633959639555], [95.76233207976173, 23.932629269924917], [95.75636039971272, 23.93486856023594]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
