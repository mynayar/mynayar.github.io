
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sha Dan Pong War</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sha Dan Pong War</div><div class="name-mm">ရှဒန်ပုန်ဝါ</div></div>
        <span class="pcode-badge">MMR001003020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.0185281811307, 25.777055932785117], [98.01612458827918, 25.776170399144632], [97.99544305904999, 25.76692735511341], [97.99516962377919, 25.766685102935185], [97.99393199476583, 25.76558861802033], [97.99242935533056, 25.765152635685638], [97.99217610624237, 25.76470568342063], [97.99192168803552, 25.764256667211498], [97.99154696482066, 25.764259852610166], [97.99092317436504, 25.764265156811575], [97.9852063945595, 25.7614715864446], [97.97658984884254, 25.751334474206658], [97.968480159232, 25.744745351117103], [97.96315817730812, 25.73764937102169], [97.95884990220128, 25.73055339272497], [97.9505705887617, 25.724508594196323], [97.95057249262652, 25.724661067054626], [97.95058186895812, 25.725412134062765], [97.94511222824678, 25.726369858082535], [97.94310808816778, 25.725485862282767], [97.93911900044156, 25.725076237278586], [97.93350712205608, 25.72421769768863], [97.93173312568325, 25.722443702215116], [97.92907457233372, 25.717886180902553], [97.90966358640543, 25.731055686570755], [97.88629005534182, 25.747346329869288], [97.8918766690731, 25.759140292790335], [97.9049828184024, 25.78067182524461], [97.92557819617684, 25.80220335590019], [97.94055665306712, 25.809692585244647], [97.95647126283859, 25.821862580793493], [97.96208818462208, 25.82560719501606], [97.98549202283863, 25.81530950612887], [98.0004704797289, 25.80220335590019], [98.0185281811307, 25.777055932785117]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
