
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Ma</div><div class="name-mm">အိုင်းမ</div></div>
        <span class="pcode-badge">MMR009007025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64415455398955, 20.115939443150808], [94.6443530028888, 20.11197045707098], [94.6465551503, 20.10618982090358], [94.6564648123013, 20.099583379569367], [94.66224544756943, 20.097105964968364], [94.6694024250819, 20.08361781421081], [94.67848628191643, 20.071230736709197], [94.6778324370174, 20.065019211067806], [94.66909325255165, 20.065019211067806], [94.66374792242874, 20.067691875679543], [94.65335422461783, 20.075115946443816], [94.64533622898387, 20.089073197070434], [94.63820912155376, 20.096497266935387], [94.63761371100401, 20.095753003298512], [94.63747129436479, 20.097105964968364], [94.6338928047092, 20.09930811237956], [94.63003904786382, 20.10095972181375], [94.63003904786382, 20.104538210570013], [94.62715358656885, 20.106374413048798], [94.62701109618519, 20.107015626070336], [94.6217809961961, 20.11197045707098], [94.62040465485097, 20.115548945827243], [94.62343260742892, 20.11830163031601], [94.62866270561943, 20.117475825149256], [94.6338928047092, 20.114998408749614], [94.64407773479968, 20.117475825149256], [94.64415455398955, 20.115939443150808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
