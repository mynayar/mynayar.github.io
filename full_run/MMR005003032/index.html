
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Hpu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Hpu Kone</div><div class="name-mm">ကျောက်ဖူးကုန်း</div></div>
        <span class="pcode-badge">MMR005003032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38765451984028, 21.791930849729], [95.39405568012558, 21.79604582995114], [95.39885663982216, 21.80016090010548], [95.40274320033848, 21.801761189727188], [95.40822995964498, 21.799703700065777], [95.41257335957295, 21.797188920432404], [95.412808079929, 21.796969049681934], [95.40655200007478, 21.794883479588975], [95.40554365231776, 21.79365087418853], [95.40303646386178, 21.790586274237228], [95.40403642813868, 21.788586362770502], [95.405380351622, 21.78589854188425], [95.40972725800663, 21.78040770774959], [95.41280254909844, 21.776523128439692], [95.41324238322949, 21.7758464614451], [95.41370267963504, 21.775138110435478], [95.41074456031328, 21.77387028038919], [95.40845856011452, 21.775013369971077], [95.40777275960522, 21.780957330216665], [95.40434340002793, 21.787358580434216], [95.40022823994138, 21.788272979614362], [95.39085527984736, 21.790787760147055], [95.38765451984028, 21.791930849729]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
