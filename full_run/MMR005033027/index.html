
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yat Nar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yat Nar</div><div class="name-mm">ရပ်နား</div></div>
        <span class="pcode-badge">MMR005033027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3425292402323, 25.618530239578945], [95.3623047600567, 25.624328579800192], [95.39031996019804, 25.61627196008294], [95.39447004006036, 25.61627196008294], [95.44232160006186, 25.61627196008294], [95.4702759601675, 25.61511231038486], [95.49688716031426, 25.608276360265847], [95.51428235994302, 25.60308839980985], [95.53027355957715, 25.583129910217224], [95.53027355957715, 25.570129409644608], [95.53027355957715, 25.565673869653438], [95.51171880018256, 25.561706579694942], [95.49829116030884, 25.54968258008705], [95.4622803603504, 25.544311559930577], [95.42510999972677, 25.544311559930577], [95.41308600011888, 25.54028316013978], [95.39410391976014, 25.533081089720554], [95.3928831602297, 25.548278849889073], [95.38629156040724, 25.57507319966851], [95.37310800013415, 25.585693380045484], [95.34509279999281, 25.60308839980985], [95.3425292402323, 25.618530239578945]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
