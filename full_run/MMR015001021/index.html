
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hkon Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hkon Son</div><div class="name-mm">ခုန်စုန်</div></div>
        <span class="pcode-badge">MMR015001021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.960786766696, 22.75342083180601], [97.95617245409557, 22.752322034734163], [97.94870163297406, 22.751662655407245], [97.93595726111874, 22.751882119664117], [97.93134283700238, 22.755178116077218], [97.92475084597481, 22.758254329873466], [97.91903790897237, 22.756056810373536], [97.90980929006673, 22.75363947498181], [97.90409629011174, 22.753859091224115], [97.90402301964667, 22.75360993674923], [97.89597980972053, 22.75955962117962], [97.88619328918901, 22.766035632038836], [97.8927989382205, 22.780310460259557], [97.90110066366475, 22.79825051684793], [97.90400944617903, 22.80553408922691], [97.91504076691791, 22.803940354763597], [97.9255669663425, 22.799388484790768], [97.93979156023238, 22.791707204324098], [97.95486962962974, 22.782034480406992], [97.96676587244713, 22.775550213771396], [97.95847891656882, 22.764871250108172], [97.95674283201612, 22.762632454424306], [97.9614458528439, 22.757595900230683], [97.960786766696, 22.75342083180601]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
