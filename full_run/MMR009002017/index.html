
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpaung Kwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpaung Kwe</div><div class="name-mm">ဖောင်းကွဲ</div></div>
        <span class="pcode-badge">MMR009002017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07498444067943, 20.45665022183033], [95.07041130713617, 20.448790148046953], [95.07089272232133, 20.43916185963218], [95.07137413570786, 20.42905215693156], [95.07317365933699, 20.416455497822994], [95.07329979375055, 20.41557255423004], [95.06934066513963, 20.406774490250598], [95.06896706427864, 20.405944265815265], [95.06367150533578, 20.414128311372508], [95.05115473120594, 20.417979625659257], [95.04537775797723, 20.430977814974256], [95.0328609838474, 20.431940644445262], [95.01793713738903, 20.435791958731954], [94.99194075875909, 20.43916185963218], [94.98782712572131, 20.442727008744498], [94.98616378732896, 20.453122878418128], [94.98953368732987, 20.455048534662183], [94.99531065965925, 20.456492778419033], [94.99531065965925, 20.469972382019876], [94.99531065965925, 20.480604698747925], [95.01811678416232, 20.484052135597608], [95.02082562400341, 20.4781564266778], [95.03141674009055, 20.473342282920044], [95.0357494695624, 20.467083895405494], [95.05019190173493, 20.464195408791113], [95.054043216921, 20.459862679319258], [95.0588573606787, 20.456492778419033], [95.07329979375055, 20.456974192704877], [95.07498444067943, 20.45665022183033]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
