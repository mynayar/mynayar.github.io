
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Ni</div><div class="name-mm">ကန်နီ</div></div>
        <span class="pcode-badge">MMR009020034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91163156624384, 21.66357632658628], [94.90824927538381, 21.66326884568076], [94.89468393671439, 21.664851469020107], [94.88405775516134, 21.671860226568242], [94.88337948827285, 21.672175136773205], [94.88337948827285, 21.679321163241127], [94.87840552959159, 21.690173434356552], [94.87772726270305, 21.69876481524409], [94.87795335226548, 21.70306050613749], [94.88216088261868, 21.707365885427294], [94.88440901236606, 21.706587686772366], [94.89494694704405, 21.70786501186086], [94.89992279789885, 21.70335564834454], [94.91479017592593, 21.688165065665316], [94.9193150302645, 21.68331700757392], [94.922547067793, 21.672651281031847], [94.92354583237432, 21.672059421005542], [94.91977981338772, 21.66892107125051], [94.91322323226643, 21.66372102390619], [94.91163156624384, 21.66357632658628]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
