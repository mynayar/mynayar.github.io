
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Wun Au Mar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Wun Au Mar</div><div class="name-mm">မဝန်အူမား</div></div>
        <span class="pcode-badge">MMR001003049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.16196834506314, 26.31102346036448], [98.1539996610556, 26.30491781010892], [98.13560618967398, 26.293281124224563], [98.12685120861647, 26.303981657227723], [98.10812813840295, 26.32457703500222], [98.0894050672901, 26.3526616412218], [98.08004353128399, 26.378873939880464], [98.07927758769057, 26.38729932210606], [98.08566045306753, 26.38729932210606], [98.10157506283895, 26.38729932210606], [98.11468121306757, 26.38355470788349], [98.11775007850338, 26.3826454150539], [98.12027931923524, 26.377142917611593], [98.12254533649815, 26.37147787400471], [98.1265108673827, 26.36524632675662], [98.13699119778562, 26.354624369319254], [98.14067347639985, 26.351083717739414], [98.14407250274388, 26.342444526193958], [98.1504456761271, 26.33295557783771], [98.15313657179541, 26.32955655149368], [98.15554421609278, 26.324882890832782], [98.15696047654484, 26.317659959739387], [98.15993462448341, 26.313411177483886], [98.16196834506314, 26.31102346036448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
