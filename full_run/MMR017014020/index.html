
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Chaung</div><div class="name-mm">ကံချောင်</div></div>
        <span class="pcode-badge">MMR017014020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9747147198085, 16.718028209934005], [94.98048768026229, 16.720997309977918], [94.98428172032521, 16.72396632008963], [94.98922991972506, 16.717368419616946], [94.99417847975309, 16.710770520043525], [94.99632263977804, 16.708296330411372], [95.00110631990083, 16.708131449606753], [95.00127119980607, 16.704337590307603], [95.00094143999553, 16.699389210143977], [95.00127119980607, 16.69526550020271], [94.99912668005231, 16.696750049775005], [94.99500323990765, 16.696750049775005], [94.99153932028344, 16.69526550020271], [94.98939479963036, 16.691966550415998], [94.98791051985467, 16.689162510141784], [94.98758040031527, 16.685368649943314], [94.98758040031527, 16.680420269779688], [94.98180743986154, 16.681904820251304], [94.97685887983351, 16.681904820251304], [94.97125080018435, 16.680420269779688], [94.96960127987523, 16.6847088596262], [94.96613736025103, 16.68701817025243], [94.9628383196328, 16.688502719824726], [94.95920952010334, 16.689162510141784], [94.96052927970254, 16.693121250245554], [94.96349819988205, 16.695925289620448], [94.96679723960096, 16.699884029724217], [94.96927152006464, 16.703347950247746], [94.97042604002979, 16.706976749777255], [94.97092104037375, 16.710605640138226], [94.97273543968885, 16.713244799607878], [94.9747147198085, 16.718028209934005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
