
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Laing Su Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myeik</div><div class="name-mm">မြိတ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ta Laing Su Ward</div><div class="name-mm">တလိုင်းစုရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006005701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.59604886546282, 12.437111056230322], [98.5960110417762, 12.43687333033995], [98.59596399284408, 12.43660088702137], [98.59584899383606, 12.435809087019777], [98.59584430836821, 12.43514194114772], [98.59592751634187, 12.43476688338501], [98.59593015135545, 12.434306872064553], [98.5959218973777, 12.434097298551535], [98.5955438574631, 12.434103746690596], [98.59448567737218, 12.434134376700172], [98.59392480348697, 12.434151396369884], [98.59365368486971, 12.434185286421894], [98.59387783009782, 12.437591611663606], [98.59401526988887, 12.438117459653085], [98.59472826859479, 12.437917289451377], [98.59508042871886, 12.437745968601632], [98.59503283929416, 12.437479468902438], [98.59508327687178, 12.43724572251216], [98.59551084065282, 12.43719735967045], [98.59604886546282, 12.437111056230322]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
