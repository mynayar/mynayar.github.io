
<!DOCTYPE html>
<html>
<head>
    <title>Map View - La Mu Ta Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">La Mu Ta Pin</div><div class="name-mm">လမုတပင်</div></div>
        <span class="pcode-badge">MMR012004073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00477796712954, 20.742468477338434], [93.00301984738809, 20.750756756119472], [93.00829420661239, 20.75427299560232], [93.01256392688379, 20.758793875836773], [93.01206160695767, 20.764570555886507], [93.02034988663803, 20.76507287581262], [93.02939164620756, 20.766077515664847], [93.02436844604699, 20.75628227620615], [93.02023882755992, 20.748883375667276], [93.01834060693352, 20.74548239599585], [93.01256392688379, 20.736691797288643], [93.00628492690788, 20.731166277201964], [93.00000592693203, 20.72388263737389], [92.99501621572585, 20.715527381583456], [92.99479677035475, 20.714115292187046], [92.98831697065174, 20.715585497572704], [92.98398122755168, 20.71676676697274], [92.98537167206507, 20.71869199783748], [92.98518748821209, 20.72338031744772], [92.98945720758411, 20.72815235674591], [92.99648968744918, 20.73267323698036], [93.00201520663654, 20.737194117214813], [93.00477796712954, 20.742468477338434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
