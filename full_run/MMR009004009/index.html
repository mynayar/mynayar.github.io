
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Hne Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Hne Tan</div><div class="name-mm">အုန်းနှဲတန်း</div></div>
        <span class="pcode-badge">MMR009004009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37037081366219, 20.01722353493824], [95.36185567729774, 20.01911578766351], [95.35991086189682, 20.021338434221434], [95.35881998065764, 20.024465833831243], [95.35604654071534, 20.031870425279976], [95.35624526570649, 20.032178995264474], [95.36254777575931, 20.03286048712181], [95.36708527906245, 20.03335112755252], [95.37400176616865, 20.034721912886027], [95.37884575662645, 20.036627162613513], [95.3825965392989, 20.036130855554575], [95.3827142542595, 20.036168763777482], [95.38402650721758, 20.03659135430763], [95.3859380351123, 20.036603399827072], [95.38690016221278, 20.035706202879], [95.38785274300972, 20.036163819304875], [95.38806142439529, 20.037613031816022], [95.38830834135695, 20.039327777255153], [95.388504893586, 20.039329059688384], [95.38963874982852, 20.031896001998916], [95.38963874982852, 20.02772854093945], [95.38963874982852, 20.023561079879983], [95.38963874982852, 20.01925470414136], [95.38658261159833, 20.017726634576547], [95.37935901320793, 20.01717097316191], [95.37185758276132, 20.01689314200496], [95.37037081366219, 20.01722353493824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
