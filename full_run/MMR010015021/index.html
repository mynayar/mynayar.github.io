
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Swea</div><div class="name-mm">ကျွဲဆွဲ</div></div>
        <span class="pcode-badge">MMR010015021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1112640792739, 21.47645696411763], [96.11078886941084, 21.476109695406194], [96.10434846720807, 21.471601413774295], [96.09468786435349, 21.469239932576897], [96.08717406103415, 21.46881057284969], [96.08193326091134, 21.469058980887326], [96.08046144214188, 21.468175888906217], [96.07781216709787, 21.466115342449143], [96.07857134868885, 21.47063826594325], [96.08226155932357, 21.477403648959296], [96.08308160523194, 21.482323928006906], [96.08533673260416, 21.482118916754644], [96.09046202380341, 21.486219148994564], [96.09388923579968, 21.48932838409769], [96.09678459233515, 21.48908424424252], [96.09694439916473, 21.48896278990088], [96.09461137791283, 21.48807401960039], [96.09553834421928, 21.486465327612848], [96.0986104220334, 21.485697309283466], [96.10175122963562, 21.48367821707609], [96.10177826325628, 21.483395957657365], [96.1024989637562, 21.480826401217485], [96.10056340867442, 21.47825621615152], [96.09937844216142, 21.476634680945835], [96.10260411968443, 21.475866661717134], [96.10582980170403, 21.478170720302558], [96.10918574332743, 21.479725909822946], [96.11015426730563, 21.479314353974303], [96.11022104826282, 21.479281558397247], [96.11013070866534, 21.476481077639676], [96.1112640792739, 21.47645696411763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
