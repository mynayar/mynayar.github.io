
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shauk Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shauk Taw</div><div class="name-mm">ရှောက်တော</div></div>
        <span class="pcode-badge">MMR010031051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8962393751471, 21.106072755952994], [95.89337912994296, 21.108217940305735], [95.88404542975286, 21.113648456011504], [95.87912402475399, 21.118060751202734], [95.87697154689943, 21.12069105684685], [95.86611896461858, 21.123404201742574], [95.85716174941524, 21.125597805594282], [95.85682969093756, 21.12808823788191], [95.85885007637, 21.132937162020482], [95.86329492342202, 21.135765699827232], [95.86854792374777, 21.1389983156198], [95.87258869281396, 21.143443162671872], [95.87824577112548, 21.144655393931316], [95.88349877235055, 21.144655393931316], [95.89158031138231, 21.144251316844873], [95.89966185041413, 21.141826855225247], [95.90612708199927, 21.136977931086676], [95.90491485073983, 21.130108623314356], [95.90208631203376, 21.119602620864327], [95.89723738879451, 21.108692543126438], [95.8962393751471, 21.106072755952994]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
