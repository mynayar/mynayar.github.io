
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mun Hkam Hing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyang</div><div class="name-mm">မိုင်းယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mun Hkam Hing</div><div class="name-mm">မွန်ခမ်းဟိန်း</div></div>
        <span class="pcode-badge">MMR016003011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.44668225897914, 21.860588460888835], [99.4332631069069, 21.861564145269142], [99.42301575487323, 21.862295904732264], [99.4135003853346, 21.861807708658887], [99.40447304639406, 21.858879579029406], [99.3930057729981, 21.8596113124122], [99.38873689269349, 21.860243791218068], [99.37983058181595, 21.86156297974776], [99.36689934972526, 21.864490630937894], [99.35868548444762, 21.871659736707556], [99.35152813461576, 21.872054129894252], [99.3415247443715, 21.873761873211947], [99.33444920496692, 21.873761717629236], [99.3271295409956, 21.87937342964011], [99.32127381863188, 21.883521206338628], [99.31785793179819, 21.88791303116153], [99.31330768330298, 21.892463294045854], [99.3110262057948, 21.89474472388997], [99.30102280385938, 21.896940454638298], [99.31806769956472, 21.921020754804033], [99.33882906161199, 21.94639575316154], [99.35959042455852, 21.95408514731173], [99.3772760296651, 21.96485029840261], [99.38957906012558, 21.97792226719895], [99.40418890739221, 21.961005601327486], [99.41649193695338, 21.947933631631827], [99.43571542142962, 21.929479088189396], [99.44571163238601, 21.91025560371321], [99.45032526779693, 21.885649543691557], [99.45109420793142, 21.872577574895217], [99.44668225897914, 21.860588460888835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
