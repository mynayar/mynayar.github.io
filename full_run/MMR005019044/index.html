
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khaw Than Ti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khaw Than Ti</div><div class="name-mm">ခေါ်သန္တီ</div></div>
        <span class="pcode-badge">MMR005019044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.74603731956671, 22.0003328698661], [94.74618959997014, 22.00134761989682], [94.75400951992344, 22.001637330198662], [94.75980227985139, 22.00047875968704], [94.76907047971895, 21.99874095023472], [94.77146267995874, 21.99759281995273], [94.77631151956103, 21.995265420362898], [94.78731743984804, 21.994396470220977], [94.78731743984804, 21.99335381962311], [94.78731743984804, 21.988314179855593], [94.78644839977392, 21.98136303017975], [94.77862847982055, 21.979625219828108], [94.77254628028669, 21.979625219828108], [94.76762219980475, 21.975860069586588], [94.75864380017128, 21.975570360184008], [94.75227180040332, 21.97672892979631], [94.7487772804472, 21.97838430019533], [94.7496650399097, 21.97933560035773], [94.74618959997014, 21.986866079805793], [94.74425603958463, 21.987569249821092], [94.74532055989596, 21.995555039833278], [94.74603731956671, 22.0003328698661]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
