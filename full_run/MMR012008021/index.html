
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Chaung</div><div class="name-mm">နတ်ချောင်း</div></div>
        <span class="pcode-badge">MMR012008021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.69548862839753, 20.460750439681078], [92.69622486558512, 20.46142442489736], [92.69530196421431, 20.46487629810275], [92.69502019312745, 20.466545887682628], [92.70407887434061, 20.46618651409642], [92.70731030392744, 20.46563456238522], [92.70950100296898, 20.465260338294], [92.71835913176858, 20.463979852088528], [92.71936145496721, 20.46414034869821], [92.72698338917212, 20.46536061360149], [92.73126201722835, 20.465586727445555], [92.73202899144485, 20.46559002525953], [92.73558830575575, 20.45608829933559], [92.73822095323447, 20.450347116426315], [92.73769438129074, 20.450178679702333], [92.73136183568022, 20.44989864340772], [92.72166764134863, 20.44966756080936], [92.71395659422149, 20.4503025846966], [92.71243001932999, 20.450228120831184], [92.71063600314909, 20.450297094335497], [92.70884198606888, 20.450366048954038], [92.70296637160084, 20.449204953146136], [92.69731872537892, 20.44861963658701], [92.69703929522734, 20.450763611351647], [92.69615616727339, 20.45753912972708], [92.69548862839753, 20.460750439681078]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
