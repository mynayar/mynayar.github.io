
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Hko</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Hko</div><div class="name-mm">ဟိုခို</div></div>
        <span class="pcode-badge">MMR015014052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.59556431903815, 22.228172711701347], [97.5885631121979, 22.212519042919553], [97.58659122990139, 22.200687749140343], [97.59114229677965, 22.18855157079838], [97.57951179193572, 22.1764153915571], [97.5699039837819, 22.17338134697161], [97.56137976426476, 22.17338134697161], [97.55726213194191, 22.17338134697161], [97.5425975834118, 22.166807584302603], [97.53804651563422, 22.163267865319767], [97.52237061920874, 22.169335955390068], [97.51295096901208, 22.169335955390068], [97.51176704301469, 22.18630555086054], [97.51352132175168, 22.19664235576016], [97.52591033729232, 22.19664235576016], [97.53804651563422, 22.199170726847626], [97.5476543237881, 22.209789882896814], [97.55827347983728, 22.209789882896814], [97.57344370276473, 22.20726151270867], [97.57546640035417, 22.22243173563612], [97.58204016302318, 22.230016847099876], [97.591647971177, 22.2305225205979], [97.59556431903815, 22.228172711701347]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
