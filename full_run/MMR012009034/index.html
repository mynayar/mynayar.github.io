
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Khu Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Khu Ya</div><div class="name-mm">ငါးခူရ</div></div>
        <span class="pcode-badge">MMR012009034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.29555866210262, 21.02866068624172], [92.29935387757945, 21.02739561531547], [92.30062016888576, 21.026129323109842], [92.29793638775413, 21.017630683009656], [92.299944099041, 21.010402919858905], [92.29368391737893, 21.00660576004782], [92.28045400964487, 20.998100820196726], [92.27214163442892, 20.997728624976105], [92.2721805031278, 20.998253357806277], [92.27159801133922, 21.000322536855663], [92.27104978372063, 21.00169310635181], [92.2703188129629, 21.00580481484036], [92.26831737894395, 21.011877070570392], [92.26732487993934, 21.014888264282035], [92.26561166784427, 21.016887012026018], [92.26548951293074, 21.017263657991464], [92.26710828901639, 21.017680744670656], [92.27572904266123, 21.018890674565057], [92.28124150459183, 21.019205672004205], [92.28895895039528, 21.02062316272884], [92.2938414156489, 21.023615642447965], [92.29494390893433, 21.027710612754618], [92.29555866210262, 21.02866068624172]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
