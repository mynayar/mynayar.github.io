
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hman Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hman Tan</div><div class="name-mm">မန္တံ</div></div>
        <span class="pcode-badge">MMR005026024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3515015199792, 24.055480979963306], [95.35009751998462, 24.055480979963306], [95.35009751998462, 24.051696749705286], [95.34930407961963, 24.041503890292347], [95.34490956042794, 24.02728272012149], [95.34167495983161, 24.01647948004404], [95.34027095983697, 24.004272419836354], [95.33471687998008, 23.999877899745343], [95.34139128038333, 23.998425750048398], [95.33032235988907, 23.99310306035801], [95.318481599846, 23.98687740007199], [95.31549072002076, 23.999328629812453], [95.31311039982518, 24.019287120304398], [95.31109619992975, 24.025085459626325], [95.31091296036487, 24.02990720984991], [95.31066563960763, 24.02990720984991], [95.31066059980691, 24.029963910306265], [95.31048600002896, 24.031921409745337], [95.31011951999989, 24.041503890292347], [95.30389403957832, 24.048706049744453], [95.30969255966397, 24.051696749705286], [95.31451404009096, 24.054077159833128], [95.32171620044238, 24.057312030226058], [95.32147211994243, 24.05792232005905], [95.33911140007109, 24.05712887969412], [95.3504949600744, 24.057494099772953], [95.3515015199792, 24.055480979963306]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
