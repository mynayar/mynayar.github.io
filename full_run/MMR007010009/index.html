
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ke Lin Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ke Lin Seik</div><div class="name-mm">ကဲလင်းဆိပ်</div></div>
        <span class="pcode-badge">MMR007010009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4574203239888, 19.146642545317263], [96.45537542843334, 19.14758634333515], [96.4515546353382, 19.145711656168032], [96.45155465782125, 19.145485750067337], [96.45155472437108, 19.144807777257142], [96.45012824492261, 19.144807649553456], [96.45012817657414, 19.145487752857548], [96.45012810912499, 19.14616219582871], [96.44822523810433, 19.146615232906697], [96.44727485704908, 19.148873569060015], [96.445374565284, 19.148873383799696], [96.44537192667315, 19.151389164378486], [96.4453717243257, 19.151582479048216], [96.44347142176878, 19.151582286593282], [96.44069323070806, 19.15055935183267], [96.43810920777378, 19.152589833953698], [96.43301697025703, 19.15055619521229], [96.42906898694423, 19.1505985622739], [96.423476478157, 19.151361176577097], [96.42322227398881, 19.154665840656094], [96.42525591273022, 19.1592415291733], [96.42500170766272, 19.162037784016547], [96.42042601914551, 19.167121881769503], [96.420171814078, 19.17068075091595], [96.42195124865128, 19.173985414994945], [96.42118863434808, 19.179069512747844], [96.41950531661712, 19.180905859118127], [96.42389761088612, 19.183346022900707], [96.43249218886348, 19.18506493759685], [96.4397975805939, 19.182916293552182], [96.44839216036996, 19.167016323844337], [96.4574203239888, 19.146642545317263]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
