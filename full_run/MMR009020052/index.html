
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Soe (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Soe (South)</div><div class="name-mm">မြို့စိုး (တောင်)</div></div>
        <span class="pcode-badge">MMR009020052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7746680031259, 21.63154787033801], [94.77690503523922, 21.629870095128865], [94.77903554265623, 21.626461284160996], [94.78201825304001, 21.6209219648768], [94.78390601185305, 21.61525868843779], [94.78436180984971, 21.61389129174978], [94.78052689829775, 21.61069553107393], [94.7781833396894, 21.608351973364904], [94.77392232485545, 21.605369262981128], [94.77297881462067, 21.605369262981128], [94.7698743621122, 21.605369262981128], [94.7660394487616, 21.608351973364904], [94.76050013037678, 21.61879145835917], [94.76010851789385, 21.618901599229446], [94.7609262318602, 21.62006976191003], [94.75964792830928, 21.6247568782274], [94.75949672979033, 21.627100435936427], [94.7660394487616, 21.627100435936427], [94.77392232485545, 21.629870095128865], [94.7746680031259, 21.63154787033801]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
