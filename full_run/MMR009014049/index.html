
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saing Doe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saing Doe</div><div class="name-mm">စိုင်ဒိုး</div></div>
        <span class="pcode-badge">MMR009014049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87741429413444, 19.379353054200124], [94.87372551611975, 19.37461033999523], [94.87431734197179, 19.37017164610461], [94.8840824694305, 19.35596782475534], [94.88552554316936, 19.35491327073089], [94.88545212971206, 19.354884351231874], [94.8799396875666, 19.352712782568915], [94.85419526300103, 19.35034547916058], [94.83504270715525, 19.350619087101222], [94.83348135817818, 19.35064139208663], [94.83150440730259, 19.370850216964016], [94.83081814094453, 19.37786538218171], [94.8285769647552, 19.390293725075423], [94.8373282262167, 19.390293725075423], [94.84354239676424, 19.390293725075423], [94.84798109065486, 19.389997812149375], [94.85330752422294, 19.387038682888942], [94.86396038866104, 19.384967292406657], [94.87076638685932, 19.383783640702518], [94.87520508074994, 19.381120424368135], [94.87741429413444, 19.379353054200124]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
