
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htauk Lay Min Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htauk Lay Min Tan</div><div class="name-mm">ထောက်လေမင်တန်</div></div>
        <span class="pcode-badge">MMR012004023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.90292033130828, 20.858845235918977], [92.90280701133457, 20.858839271615125], [92.88999785231908, 20.858839271615125], [92.86723544925661, 20.85640833577611], [92.86003446521846, 20.885478974874843], [92.85628380935037, 20.909590334026745], [92.85199734460184, 20.925396669021097], [92.86488185331496, 20.92640130887338], [92.87693753244122, 20.927657108688663], [92.88949553239297, 20.928159428614777], [92.89677917132178, 20.92790826865172], [92.90305817129763, 20.925647828984154], [92.90858369138431, 20.92589898894721], [92.91084413105187, 20.91911766994457], [92.91662081110161, 20.91233635004255], [92.92013705058446, 20.906810829955873], [92.91737429099078, 20.899778350090855], [92.91687197106467, 20.894252830903497], [92.9198858906214, 20.88822499089065], [92.92390445003042, 20.882950630767027], [92.92566256977182, 20.878178590569576], [92.92541140980876, 20.86838335201014], [92.9279230103387, 20.85909043157818], [92.90757905063276, 20.85909043157818], [92.90292033130828, 20.858845235918977]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
