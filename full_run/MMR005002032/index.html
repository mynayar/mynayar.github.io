
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyawt</div><div class="name-mm">ပျော့</div></div>
        <span class="pcode-badge">MMR005002032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65965791977726, 22.00957515037294], [95.65988904014716, 22.009883220334416], [95.66489663976819, 22.007657609611044], [95.67129528015312, 22.004319239841095], [95.67738559067254, 22.00458402543245], [95.67990879335616, 21.998996934161255], [95.68652021243793, 21.99369953520545], [95.68313783973957, 21.992326739887176], [95.68307022241288, 21.992199544273603], [95.68265724023951, 21.99142269010514], [95.67773197355177, 21.990303294961166], [95.67399741464902, 21.991841055620284], [95.6690194099179, 21.989040928296276], [95.67157505294642, 21.98233534929699], [95.67450091988161, 21.978737943301496], [95.67499297674453, 21.9773843997703], [95.6754411385977, 21.977386326118108], [95.67596177141866, 21.977388357686607], [95.67645443982059, 21.97603799955408], [95.67791567986478, 21.97423745969104], [95.67792216037947, 21.97310040006346], [95.67794555983977, 21.969108539727358], [95.6779498801829, 21.968370449936344], [95.67698471966912, 21.967462530371506], [95.67262835961117, 21.96743966960514], [95.66826048013712, 21.96922491020149], [95.66673650338697, 21.96921665622375], [95.66435253284317, 21.974418041759293], [95.65937453081, 21.974418041759293], [95.65541699309983, 21.9720728337943], [95.65261848005889, 21.9752324102476], [95.64553223962122, 21.9847619701888], [95.63820191958297, 21.99600198040713], [95.63664636044126, 22.004751599706594], [95.63763311997258, 22.004597429827584], [95.65126487987038, 22.003206389962997], [95.65655076030941, 22.005431999786992], [95.65965791977726, 22.00957515037294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
