
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lan Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lan Gwa</div><div class="name-mm">လမ်းခွ</div></div>
        <span class="pcode-badge">MMR010015063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17166363337003, 21.41501227010025], [96.17648637464652, 21.41459889222517], [96.18034456784761, 21.41446109900056], [96.18378938317358, 21.41501227010025], [96.18737199082477, 21.414047721125485], [96.19081680615074, 21.41459889222517], [96.19378943423504, 21.413435690205006], [96.19329707340125, 21.412669795174963], [96.19412382915147, 21.407295882798792], [96.19453720702654, 21.403299898171838], [96.19439941380199, 21.40013066839566], [96.19453720702654, 21.394067792594626], [96.19417812392135, 21.3889209347534], [96.19221630503853, 21.388528571336565], [96.1881906796562, 21.390175417961245], [96.18581190089856, 21.39090735009421], [96.17827767937149, 21.3955835117697], [96.17193921891987, 21.400268459821632], [96.1704234997448, 21.401508594346183], [96.1715258410448, 21.409500565398844], [96.17166363337003, 21.41501227010025]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
