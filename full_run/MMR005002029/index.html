
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pyar</div><div class="name-mm">ကန်ပြား</div></div>
        <span class="pcode-badge">MMR005002029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59250820009339, 22.04832446959864], [95.59662731989494, 22.04938746016319], [95.60455595978976, 22.05168263974207], [95.60998079987405, 22.05543833990754], [95.61394512027113, 22.058150759949683], [95.62083048004268, 22.061697749951236], [95.6243775599765, 22.057316189990217], [95.6239603204125, 22.05043074028646], [95.6250035996365, 22.044379859642845], [95.62667255969092, 22.04062425030895], [95.62673160018323, 22.040650440365596], [95.62646412022303, 22.038955019558557], [95.62729860025024, 22.036868550143538], [95.62771583981424, 22.033321470209728], [95.62768631956806, 22.0328791197756], [95.6275074003463, 22.03019171977212], [95.62625532012697, 22.0253928303149], [95.62604687975977, 22.020385229794556], [95.62569552003231, 22.020161670025118], [95.62375152031649, 22.018924710107342], [95.61582288042166, 22.017255480256267], [95.60768580015963, 22.017255480256267], [95.60557331965305, 22.017447540371734], [95.60719872014488, 22.020315660039728], [95.61053699998263, 22.02532325966075], [95.61032855961537, 22.02970490955397], [95.60594699965435, 22.03408656034651], [95.60010456027732, 22.03659036015705], [95.59050696032801, 22.03763355034812], [95.58837468034727, 22.038166619893616], [95.59057355962216, 22.039902629802555], [95.59151244014703, 22.043814839882998], [95.59276415973824, 22.048039979861244], [95.59250820009339, 22.04832446959864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
