
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Char Hlar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Char Hlar Kone</div><div class="name-mm">ချားလျားကုန်း</div></div>
        <span class="pcode-badge">MMR008005037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41012798421917, 18.5311450468065], [95.41474978907155, 18.528406200186055], [95.42159690697173, 18.52446910676389], [95.42347986520366, 18.522928505146467], [95.42347986520366, 18.51933376833881], [95.42517847680534, 18.51614722481463], [95.42399339877642, 18.516081387246288], [95.42056983982633, 18.512486650438632], [95.41851570373677, 18.509063089689903], [95.41937159392398, 18.50444128483747], [95.41697510211935, 18.502215971789724], [95.41423625459953, 18.502044793932157], [95.4111550522639, 18.504098930021655], [95.40601971293944, 18.509063089689903], [95.40156908594463, 18.511288403636968], [95.3996861277127, 18.511459582393854], [95.39437961143, 18.511288403636968], [95.38838838281765, 18.511288403636968], [95.38171244187578, 18.51214429382418], [95.37454801527872, 18.513095245049556], [95.37478542370837, 18.515231927211744], [95.37561635591015, 18.52140456436922], [95.37549765079598, 18.526390155781087], [95.37953360669064, 18.52532181514971], [95.3819076981818, 18.52579663290834], [95.38250122105455, 18.52876424727225], [95.3834541301041, 18.531940611370146], [95.3935237221421, 18.530973868948934], [95.39900141628237, 18.530460336275553], [95.4056773572243, 18.530289158417986], [95.41012798421917, 18.5311450468065]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
