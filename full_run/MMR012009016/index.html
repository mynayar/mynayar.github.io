
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Mi Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Mi Chaung</div><div class="name-mm">မြိုမိချောင်း</div></div>
        <span class="pcode-badge">MMR012009016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.32799788009817, 21.100247265199187], [92.32833367435967, 21.0996876080967], [92.33132615317948, 21.096537630107605], [92.33243693731487, 21.093066431370744], [92.33258614473488, 21.092600158070866], [92.33297828871713, 21.092699749893598], [92.33311675643324, 21.09089967587937], [92.33337363878246, 21.087560192748754], [92.33211364812644, 21.08393771815122], [92.33225044670081, 21.083952538079245], [92.33496241258536, 21.084246334900513], [92.33534349940305, 21.084287619178326], [92.33464772811021, 21.08264265393541], [92.33339137341324, 21.080900889264683], [92.33142117824485, 21.07910201674474], [92.33024694783842, 21.078370249187685], [92.32945098487511, 21.077874214623364], [92.32611022200922, 21.076360876853016], [92.32339763559247, 21.075789805555132], [92.321227567898, 21.075447163855586], [92.32017108662643, 21.075447163855586], [92.32003334106588, 21.075683592923497], [92.31998700439681, 21.075763126267304], [92.31992331171153, 21.07612139278808], [92.31825374461471, 21.085512707145767], [92.31391142027587, 21.088769450849554], [92.3143552626853, 21.08886687980271], [92.31585470233273, 21.09467720528886], [92.32016558817139, 21.098425801709425], [92.32646489933569, 21.09989075775229], [92.3277192260615, 21.100182461851205], [92.32799788009817, 21.100247265199187]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
