
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Swea Da Lwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Swea Da Lwe</div><div class="name-mm">ဆွှဲဒလွဲ</div></div>
        <span class="pcode-badge">MMR007005031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.77334899316156, 18.00410530271762], [96.77625707960061, 18.00516278943121], [96.77890079503572, 18.00807087587026], [96.78022265275331, 18.009392733587845], [96.78154451137016, 18.01177207801902], [96.78365948299881, 18.011243335111885], [96.78656757033718, 18.010185849297557], [96.78868254196578, 18.00912836168459], [96.79079751539308, 18.006484647148795], [96.78894691386904, 18.003576559810426], [96.78577445462741, 17.999875357661665], [96.78154451137016, 17.99643852831548], [96.77890079503572, 17.990886724642678], [96.777050194411, 17.987449895296493], [96.77678582340707, 17.982559022281123], [96.77440647897589, 17.984673993909723], [96.76885467620241, 17.984409622006524], [96.76706059616964, 17.984446086817513], [96.76436036014258, 17.985467108720115], [96.76013041508662, 17.985731479724052], [96.75457861321252, 17.986260222631245], [96.75510735611965, 17.990093610731606], [96.7588085573691, 17.995116669698575], [96.76171664380814, 17.996174156412224], [96.76330287432825, 17.997760386033065], [96.76722098575993, 18.000053804739366], [96.77064323979374, 18.00249827177788], [96.77334899316156, 18.00410530271762]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
