
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pying Nyawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pying Nyawng</div><div class="name-mm">ပြိန်းညောင်</div></div>
        <span class="pcode-badge">MMR015014054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.68077602269534, 22.222381184743938], [97.67859357763155, 22.222449385730613], [97.67859357763155, 22.239933846669715], [97.67408145859252, 22.255726262856797], [97.66956933955345, 22.269262619973972], [97.6735174442747, 22.27885087326922], [97.67238941384045, 22.28561905137815], [97.66734530534166, 22.29497753958185], [97.68310569667062, 22.294643288556983], [97.68987387477955, 22.28956715609945], [97.7079223509358, 22.28561905137815], [97.71751060423105, 22.280542918021297], [97.72597082709206, 22.270954664726048], [97.73217498998383, 22.262494441865044], [97.73612309380582, 22.243317936173867], [97.73932426030643, 22.24011677057257], [97.73781513855783, 22.23654975806494], [97.74232725759691, 22.225269460916934], [97.74607061726522, 22.22251119613486], [97.74176324327914, 22.219065297125837], [97.71469052904473, 22.221321357095007], [97.68077602269534, 22.222381184743938]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
