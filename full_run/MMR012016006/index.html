
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Toungup</div><div class="name-mm">တောင်ကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Cho</div><div class="name-mm">သဖန်းချို</div></div>
        <span class="pcode-badge">MMR012016006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.26343743768768, 18.91887068233615], [94.26373312488386, 18.9214949598246], [94.26280695088013, 18.94513784863284], [94.261658063369, 18.975873156221212], [94.26051618427454, 18.982046386031925], [94.26195017755873, 18.982177530568606], [94.26266401713076, 18.983962127250436], [94.26343734235951, 18.985925181801747], [94.26409169267754, 18.988542589369047], [94.26486501790629, 18.990624617931815], [94.26611423468427, 18.992409213714268], [94.26754191202969, 18.99330151115589], [94.26932650781214, 18.993777403604327], [94.27087315737037, 18.993896376716464], [94.273133644702, 18.993123052387034], [94.27503721359659, 18.99330151115589], [94.27682181027836, 18.99478867505735], [94.27860640606087, 18.995561999386837], [94.28033151528729, 18.99591891872319], [94.2819932097189, 18.99582374437034], [94.28330485923192, 18.99392231586222], [94.28370537410382, 18.992106049554593], [94.28335873761569, 18.990137271717742], [94.28293104073498, 18.98840559564178], [94.28284363112874, 18.987814847177503], [94.28200484604685, 18.98328390982465], [94.2862584513665, 18.96198171618329], [94.28918567987529, 18.947779567573036], [94.28934876203579, 18.933071356058292], [94.29117160058894, 18.918876840893518], [94.26343743768768, 18.91887068233615]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
