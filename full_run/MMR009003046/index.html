
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Pwar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Pwar</div><div class="name-mm">ဇီးပွါး</div></div>
        <span class="pcode-badge">MMR009003046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0194816627486, 20.816208419083353], [95.02028862711853, 20.81595624288633], [95.03823841527071, 20.81283454138105], [95.03846075915675, 20.81133839595026], [95.03869202701549, 20.808998103679585], [95.03874160304258, 20.808473541720616], [95.0383338252459, 20.80648730174761], [95.0382099409361, 20.805886919745603], [95.03840954186694, 20.8044988503417], [95.03995015967217, 20.79378502356002], [95.03808493876898, 20.785951084075293], [95.03659275665046, 20.779236278031874], [95.03677186203186, 20.777982542160657], [95.03110759004329, 20.776595516869634], [95.02834103531058, 20.775741642063167], [95.0184667490413, 20.77332344871826], [95.00436062824048, 20.77070374068512], [95.00243426602862, 20.770350575118982], [94.99226966601236, 20.768487064726287], [94.99226966601236, 20.768688581213098], [94.99228731700612, 20.768704760916023], [94.9928742136741, 20.77594315765066], [94.9938817943094, 20.78521289535888], [94.99811363063958, 20.78944473168906], [94.9983633346003, 20.789453493783753], [95.00960004430664, 20.789847763763362], [95.02189252212224, 20.7930720203575], [95.02229555419655, 20.800125081207568], [95.01967584616341, 20.813425138759214], [95.0194816627486, 20.816208419083353]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
