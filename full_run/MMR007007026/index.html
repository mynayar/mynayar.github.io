
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Bo Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Bo Gyi</div><div class="name-mm">စစ်ဘိုကြီး</div></div>
        <span class="pcode-badge">MMR007007026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58128641083925, 17.900835313099265], [96.57791778697634, 17.896935764573925], [96.56822445419527, 17.901472480970256], [96.56269908339607, 17.905008718677493], [96.56025984501588, 17.906569831132856], [96.55420674304679, 17.909755674085147], [96.54656071870227, 17.914534439412876], [96.54369345968547, 17.918357451135535], [96.54114478460417, 17.93046365597297], [96.54114925243613, 17.93350647794165], [96.54204763109334, 17.93408007183791], [96.54440843869855, 17.933175978888357], [96.54629636028886, 17.93001339330351], [96.54771182214296, 17.929562591940112], [96.54771180235787, 17.929337210144183], [96.54771174120395, 17.92865867255972], [96.55683298195663, 17.928655705696315], [96.56344568886749, 17.922499046793632], [96.57236604985337, 17.91803886720004], [96.57873773665727, 17.910074258020643], [96.58128641083925, 17.900835313099265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
