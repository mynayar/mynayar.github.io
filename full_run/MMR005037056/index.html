
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sheik Nyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sheik Nyu</div><div class="name-mm">ရှိတ်ညူ</div></div>
        <span class="pcode-badge">MMR005037056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49652104001404, 26.540710470112174], [95.50170899957072, 26.550292949759864], [95.50610351966174, 26.56628415029337], [95.51831040000502, 26.581481909562513], [95.52662568003115, 26.59366016988099], [95.55310044043301, 26.588073690148747], [95.57550036005364, 26.58728024978376], [95.59832759973898, 26.57952882039882], [95.5986937200392, 26.579284649966667], [95.5986937200392, 26.564880330163135], [95.59522987056215, 26.55161205465265], [95.59509264031317, 26.55108639012485], [95.59507287591254, 26.551020223404635], [95.59228500005275, 26.54168697017758], [95.5890306557402, 26.53466216872414], [95.58728028006095, 26.53088382003233], [95.58648683969597, 26.53149410986532], [95.57128908042677, 26.535888629956332], [95.5560913202583, 26.538696270216747], [95.52990708044746, 26.538696270216747], [95.50610351966174, 26.537292450086568], [95.50048824004028, 26.536071779589008], [95.50048824004028, 26.53668216025352], [95.49847404014491, 26.538879419849422], [95.4981079198447, 26.5402832399796], [95.49652104001404, 26.540710470112174]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
