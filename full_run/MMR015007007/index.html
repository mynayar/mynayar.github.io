
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Kaing Yaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Kaing Yaik</div><div class="name-mm">စီကိုင်ရိုက်</div></div>
        <span class="pcode-badge">MMR015007007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.34573884607096, 23.136550276973765], [99.34806360165396, 23.136161852587463], [99.35165468271748, 23.131734044090933], [99.35601706733382, 23.128200527732247], [99.36097139741213, 23.12784885234271], [99.36458261699426, 23.12410570131709], [99.36469391619136, 23.12385937880731], [99.3636851601421, 23.119673784717463], [99.36541561224078, 23.105253352660156], [99.37060696763751, 23.076412487646223], [99.37125084085369, 23.053837907093794], [99.36975954456739, 23.054397294399678], [99.35416767539795, 23.06891386308439], [99.34378496370516, 23.074105219380442], [99.33513270411106, 23.083911113107433], [99.32758931759298, 23.08637943016663], [99.33109498284722, 23.095735867016685], [99.33715156519264, 23.118808558668093], [99.34524586290632, 23.133985369129505], [99.34573884607096, 23.136550276973765]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
