
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Shaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Shaw</div><div class="name-mm">ပန်ရှော်</div></div>
        <span class="pcode-badge">MMR015001067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.20471290157923, 23.057235705863206], [98.19875764584873, 23.057302728737966], [98.1883035864414, 23.05767608768133], [98.18195647810904, 23.06103632176888], [98.17822288507813, 23.06402319601375], [98.17672944840535, 23.06887686677402], [98.17523601083332, 23.076717411779157], [98.17187577674576, 23.083811237998304], [98.16888890340022, 23.086424753299752], [98.16405739103584, 23.089293747108798], [98.16814218461417, 23.096132094820348], [98.1729958553745, 23.099865687851263], [98.17934296280754, 23.110319748157906], [98.18103364688534, 23.11640620867962], [98.18344991478182, 23.114800059075492], [98.19054374190023, 23.10957302937186], [98.19987772357814, 23.107332873913037], [98.20473139523779, 23.107332873913037], [98.2140653769157, 23.108826310585812], [98.22675713663261, 23.10943056416926], [98.22638623283842, 23.096132094820348], [98.22302599965025, 23.083064520111577], [98.21705225116051, 23.074850616163076], [98.21033178388478, 23.070370304346113], [98.20697155069655, 23.064396554957113], [98.2051047541811, 23.059542885096107], [98.20471290157923, 23.057235705863206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
