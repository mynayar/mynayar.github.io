
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hlay Seik Taung Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Hlay Seik Taung Paing Ward</div><div class="name-mm">လှေဆိပ်တောင်ပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017019701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64928424986829, 16.734779464400788], [95.64936811434706, 16.734811312991724], [95.64950069510104, 16.735011528159532], [95.64959758176303, 16.735032689207287], [95.64998172717503, 16.73490735069373], [95.65014745334236, 16.734808057445946], [95.65024943826103, 16.73470062443431], [95.65037522103967, 16.734508547231712], [95.65065772057739, 16.734212645097557], [95.65023244107437, 16.733181908718166], [95.65150895947096, 16.732579627347945], [95.65050504896891, 16.7308093136989], [95.65038718202288, 16.73059627060144], [95.64940465919773, 16.73076789002613], [95.6474437747105, 16.731112814205062], [95.64605932148055, 16.73135372909138], [95.64497487578996, 16.731539297900326], [95.64440545654662, 16.73163045498154], [95.6433227105747, 16.731817651563404], [95.64193961082447, 16.73210831964326], [95.64324436163804, 16.735835624614424], [95.64524938664994, 16.73545085597226], [95.64726360093448, 16.735161113294794], [95.64856072909441, 16.7349350228331], [95.6489421117891, 16.734864045639256], [95.64928424986829, 16.734779464400788]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
