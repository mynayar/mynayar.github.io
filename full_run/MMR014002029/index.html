
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Kan</div><div class="name-mm">လုံကန်</div></div>
        <span class="pcode-badge">MMR014002029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.94080452440932, 20.15250837136432], [96.94201092176667, 20.15196000704873], [96.94835000005253, 20.141146287171466], [96.94760422555464, 20.12175616821264], [96.94685845195607, 20.10497625684883], [96.952451755744, 20.0922981020758], [96.95506196423833, 20.08260304259636], [96.95362778389517, 20.078013664598984], [96.95319753024188, 20.076636852009187], [96.94462113116032, 20.075145304811997], [96.92746833299725, 20.06955200102408], [96.91971574528549, 20.06707117259657], [96.91922861940532, 20.0694399769734], [96.91679353679234, 20.073647031585267], [96.91277028741888, 20.080597942940756], [96.90918944783482, 20.090398718626034], [96.90921174292765, 20.098409068223987], [96.90921212603882, 20.098844501072904], [96.9081819652256, 20.118104149986607], [96.90794824941224, 20.12115982056929], [96.90748429816188, 20.12722563625414], [96.90784603876375, 20.127225462685033], [96.90499987694284, 20.141080577306866], [96.90502222689429, 20.150051071899497], [96.91814616031712, 20.15196000704873], [96.94126514906742, 20.151587121148793], [96.94080452440932, 20.15250837136432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
