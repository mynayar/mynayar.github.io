
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Twin</div><div class="name-mm">ကျောက်တွင်း</div></div>
        <span class="pcode-badge">MMR008007029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83931097302303, 17.7612893862962], [95.84184038732405, 17.761298191558353], [95.84659567225253, 17.76553939162966], [95.85022164701144, 17.768102211248106], [95.85210250802436, 17.7694639619923], [95.85595999615697, 17.7728747811463], [95.85861322282204, 17.775840150802367], [95.8631393128291, 17.77615229469268], [95.8645866556497, 17.774925201237124], [95.86623137537771, 17.774930782429692], [95.870477096341, 17.774492292785112], [95.87236574818081, 17.773595492438062], [95.87284599424731, 17.771337506121085], [95.87426516490552, 17.769986970822117], [95.87851136340873, 17.769097740967993], [95.88181503013959, 17.768204946201365], [95.88418331920485, 17.765500790928797], [95.89225543064367, 17.767117452708305], [95.8921984981622, 17.765526934220702], [95.8908313667742, 17.757147475875342], [95.88715126811661, 17.74340843764935], [95.88543388766385, 17.732613479428608], [95.88052708855435, 17.728197360319996], [95.87120417033623, 17.7242719203129], [95.86531601122499, 17.725498619865448], [95.85991853211465, 17.727216000318208], [95.8481422129928, 17.732122799427714], [95.84544347433695, 17.736784258986404], [95.84397143433426, 17.745125817202734], [95.83980065387715, 17.7537127158692], [95.83931097302303, 17.7612893862962]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
