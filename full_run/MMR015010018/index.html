
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Awng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Awng</div><div class="name-mm">မန်အောင်</div></div>
        <span class="pcode-badge">MMR015010018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.70322657144919, 23.76340603306204], [97.70317195741995, 23.76334301666691], [97.69718159215682, 23.76308897257809], [97.69004320902695, 23.76308897257809], [97.68290482589708, 23.76237513390538], [97.67623749686305, 23.7633752339799], [97.67578157026333, 23.763265785587578], [97.67569332158956, 23.76345686004612], [97.67338698232345, 23.76380281035148], [97.67099917796975, 23.76336062359394], [97.66934189831, 23.76642021791878], [97.66714250462297, 23.77037912619579], [97.66886600586156, 23.770465301932177], [97.67433876632106, 23.774272438822038], [97.677114335858, 23.776565300848006], [97.68360996812561, 23.778586163820478], [97.69103388690439, 23.781060803113633], [97.69597843955341, 23.782034730218697], [97.69731566398679, 23.78229812365953], [97.70197940692412, 23.78372580010563], [97.70369254257685, 23.78386309240784], [97.70503381306008, 23.7833143908465], [97.7095547904213, 23.78069698417852], [97.71359987443469, 23.776413953940846], [97.71443390300226, 23.77524631196775], [97.71597933397913, 23.773082708600157], [97.71664815079157, 23.771272968672633], [97.71211270963391, 23.76963249014733], [97.70590812585937, 23.765754625175873], [97.70449843495487, 23.764873568360542], [97.70322657144919, 23.76340603306204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
