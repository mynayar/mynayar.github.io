
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Kone</div><div class="name-mm">ကြို့ကုန်း</div></div>
        <span class="pcode-badge">MMR017006075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8519756003937, 17.319470490171057], [94.85418275972665, 17.32200633012809], [94.85789183993654, 17.324820270139412], [94.86494850437003, 17.327461853281932], [94.86952883968428, 17.329176450332966], [94.87049256038341, 17.328281579931], [94.87386575999687, 17.324151300442225], [94.87586195996153, 17.320158809681345], [94.87744523980604, 17.317130039619656], [94.8783402001402, 17.313137459825953], [94.87875312026034, 17.30914496996445], [94.87496699962742, 17.307217530364767], [94.87147571992858, 17.30512269006016], [94.87014839972892, 17.30432637006595], [94.86450395959014, 17.30432637006595], [94.8592724395715, 17.30432637006595], [94.85349011987319, 17.30432637006595], [94.84908444009488, 17.30529008986582], [94.84633116025492, 17.308594260216978], [94.84853364041521, 17.313963479930692], [94.8519756003937, 17.319470490171057]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
