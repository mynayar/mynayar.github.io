
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (46) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (46) Ward</div><div class="name-mm">အမှတ် (၄၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701521</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18697765879199, 16.908710207010472], [96.18776317586139, 16.909229296585192], [96.18804541233165, 16.908727031803753], [96.18867762202501, 16.907565876916422], [96.18896550322467, 16.9071068137089], [96.1892195160479, 16.90659374174218], [96.18951868670636, 16.90608066837898], [96.18968802858853, 16.9057296173785], [96.19007187018808, 16.905086922314446], [96.19041619868179, 16.904411820097717], [96.19070407988141, 16.90393654668712], [96.19118388188086, 16.90298059540334], [96.19161288131563, 16.902235274090724], [96.19224509100901, 16.901101083831875], [96.19293374799642, 16.899848065709865], [96.19342483945468, 16.89903792025108], [96.19260631582887, 16.898594282799934], [96.1911411286602, 16.897851943712283], [96.18985939059843, 16.897192001409792], [96.18826103182124, 16.89636039741447], [96.18686561585554, 16.895640373204685], [96.18585014366926, 16.89743995708841], [96.18458448098909, 16.899698257268824], [96.1840941112543, 16.900722504140276], [96.18402290383398, 16.901437759245255], [96.1840496074035, 16.902952194188458], [96.1840801240985, 16.90391731243409], [96.18414115928715, 16.90542030440355], [96.18416595359594, 16.906579335368065], [96.18464987339303, 16.907400997358195], [96.18697765879199, 16.908710207010472]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
