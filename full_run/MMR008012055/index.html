
<!DOCTYPE html>
<html>
<head>
    <title>Map View - But Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">But Taw</div><div class="name-mm">ဘွတ်တော</div></div>
        <span class="pcode-badge">MMR008012055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5381270826988, 18.45089264198191], [95.53980354489772, 18.453239689959787], [95.54047413067667, 18.456257327313836], [95.54282118315115, 18.45726320373393], [95.54501565934527, 18.45673350304878], [95.54849799888359, 18.457120439057064], [95.55182026629234, 18.45578156796506], [95.55181317064137, 18.45668551702306], [95.55275934916472, 18.45668951540887], [95.55275530581275, 18.457593463567548], [95.55606239896059, 18.458963373860684], [95.55653145026628, 18.459870845563103], [95.55874759112851, 18.46162200994786], [95.5610946400057, 18.463801412605164], [95.56314262563171, 18.462613680676895], [95.56811162365256, 18.46010398401171], [95.58003021822003, 18.453145301614427], [95.5707469196347, 18.447564816762906], [95.55180122494664, 18.438760909888117], [95.54861801880656, 18.437281701389452], [95.53920581679506, 18.449600612078655], [95.5381270826988, 18.45089264198191]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
