
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thee Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thee Kone</div><div class="name-mm">သီးကုန်း</div></div>
        <span class="pcode-badge">MMR010028022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.79211037289548, 20.81235663355187], [95.78543646801864, 20.81187992721692], [95.78112033823311, 20.809482077435973], [95.7765731932983, 20.80695588540584], [95.76721751277807, 20.804001459599704], [95.76541450517533, 20.80290397733671], [95.7651014187955, 20.80853953127439], [95.75831713562735, 20.81771830975225], [95.75461689305524, 20.82272454510172], [95.75730132169872, 20.824573063795924], [95.76336806368528, 20.82695642729732], [95.76878479817998, 20.828039774016418], [95.77463487100255, 20.828689782407594], [95.78054184572966, 20.83644268578138], [95.78319275124454, 20.836646601659368], [95.78815166516728, 20.83829957266721], [95.79178820336296, 20.836977196040834], [95.79311057998933, 20.834001846607975], [95.79013523055653, 20.830365310210937], [95.78782107078587, 20.827720555159544], [95.78914344831156, 20.823753424381096], [95.78947404269297, 20.81978629180395], [95.79211037289548, 20.81235663355187]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
