
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (22) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwepyithar</div><div class="name-mm">ရွှေပြည်သာ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (22) Ward</div><div class="name-mm">အမှတ် (၂၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013007701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04905552359361, 16.989091025130733], [96.04761314413133, 16.986207962327626], [96.0461215969342, 16.98322410530824], [96.03835662016195, 16.979342260836745], [96.03599071519943, 16.98348140764091], [96.03651237504613, 16.984739303775882], [96.03677940444601, 16.985399246078373], [96.03717231734862, 16.98633155795511], [96.03807067891876, 16.987892150602306], [96.03845977779656, 16.98875236562924], [96.03873920435086, 16.98988056243803], [96.03882916803173, 16.990850448889148], [96.03873062122125, 16.99205970788927], [96.0384721758503, 16.99319076544151], [96.038449547109, 16.993556456765134], [96.03906205736808, 16.993531795555953], [96.03936831159837, 16.99351946495142], [96.04145584131408, 16.992871093326357], [96.04318682311344, 16.991643905441947], [96.0450210578756, 16.99087905902138], [96.04905552359361, 16.989091025130733]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
