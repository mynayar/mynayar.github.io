
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawt Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyine</div><div class="name-mm">မော်လမြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawt Pauk</div><div class="name-mm">ကော့ပေါက်</div></div>
        <span class="pcode-badge">MMR011001008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.64056497779154, 16.536737802407686], [97.63781166107935, 16.535692214624078], [97.63586997981577, 16.53463172957072], [97.6322498317644, 16.533250808877767], [97.63000679038112, 16.532461166349776], [97.62817573562177, 16.53148460423114], [97.62800878187983, 16.5314378286929], [97.62729072538673, 16.53123664855252], [97.62669944722177, 16.53130531269005], [97.62608909623486, 16.53256416300576], [97.62479972832489, 16.53811454844771], [97.6248111721979, 16.539396285610167], [97.62529563878275, 16.54219627443854], [97.62703882887888, 16.547046765196114], [97.627611160127, 16.548639297265822], [97.62820406516556, 16.551349175823873], [97.62830447806925, 16.551320086352973], [97.63409991977551, 16.54625462884809], [97.63937629887715, 16.539030253443514], [97.64056497779154, 16.536737802407686]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
