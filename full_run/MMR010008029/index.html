
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Mauk (Naung Pein)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Mauk (Naung Pein)</div><div class="name-mm">မဲမောက် (နောင်ပိန်)</div></div>
        <span class="pcode-badge">MMR010008029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4794467470698, 22.201655157959237], [96.47173160443003, 22.20442469664249], [96.46539756144836, 22.20442469664249], [96.46051553326532, 22.201402488933752], [96.45760181617095, 22.208322568831534], [96.45272947458562, 22.217580017303987], [96.45272947458562, 22.22878640007235], [96.45516564537832, 22.2375566129474], [96.4561401129759, 22.248275762816263], [96.45857628376854, 22.257533210389397], [96.46020426711328, 22.272185061391497], [96.46060728210045, 22.272348114773706], [96.462301201939, 22.272123349912704], [96.46679970524224, 22.26286292468427], [96.4726000329652, 22.256356943917865], [96.4726201238197, 22.25633440870604], [96.47359286022237, 22.253088010803083], [96.47385243963845, 22.25189244488047], [96.4745652036213, 22.248609619938065], [96.47517199599088, 22.24575604590484], [96.47346688678743, 22.238921683988565], [96.48138988793306, 22.2291122541273], [96.48148530510281, 22.22879226904803], [96.48169689039923, 22.21708138729622], [96.48172197069243, 22.21569317220218], [96.47949083633307, 22.208755464693013], [96.47949083633307, 22.20249285126414], [96.4794467470698, 22.201655157959237]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
