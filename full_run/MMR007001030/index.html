
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baw Nat Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Baw Nat Gyi</div><div class="name-mm">ဘောနတ်ကြီး</div></div>
        <span class="pcode-badge">MMR007001030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.39477915663281, 17.524411794968387], [96.39939093764173, 17.525013331699938], [96.40059361540307, 17.52535695366055], [96.4043866734063, 17.52644068439014], [96.4129507904467, 17.530722743359945], [96.4175896869146, 17.533220611242257], [96.42210962915613, 17.537094847449282], [96.42258542177984, 17.5375026693128], [96.42829483433917, 17.5375026693128], [96.4347179209953, 17.533763004059438], [96.4347179209953, 17.528938552272393], [96.43685895137958, 17.524299654905178], [96.43864314156781, 17.51609237626218], [96.44185468624482, 17.511810318191692], [96.4429862420215, 17.510395872571507], [96.43932202089462, 17.508165478354215], [96.42945476102847, 17.50660748924429], [96.42010683086562, 17.507126818947597], [96.41179756010939, 17.51335877178991], [96.40660426577432, 17.515955419407135], [96.39829499501809, 17.518552067024302], [96.39477915663281, 17.524411794968387]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
