
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Khu Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Khu Aing</div><div class="name-mm">ငါးခူအိုင်</div></div>
        <span class="pcode-badge">MMR008002033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39234754470351, 18.88583089707828], [95.39233641469383, 18.887565602070936], [95.3968304537625, 18.892967724381037], [95.39890838231605, 18.8987859207337], [95.41262270537362, 18.90044826267723], [95.42135000080197, 18.904604117985684], [95.43296611289583, 18.899482648005858], [95.44684195599154, 18.895401518265487], [95.44953951743486, 18.89422133524647], [95.45337176519485, 18.892544725558707], [95.45622855610304, 18.888463595818337], [95.45704478169137, 18.883566239590323], [95.46520704297069, 18.8725471874028], [95.45582044285919, 18.874179640378145], [95.44684195599154, 18.8725471874028], [95.43174177406365, 18.86928228325081], [95.42521196486035, 18.878260770118516], [95.4194983821447, 18.879893222194482], [95.40851049506335, 18.881409656330618], [95.40825733680668, 18.88140807262448], [95.406140354294, 18.881394838201288], [95.40564473161913, 18.884553506339273], [95.40324188700356, 18.889055292168052], [95.40039564334432, 18.88903951356275], [95.3989840881452, 18.887223955920888], [95.39566983369593, 18.885850198328058], [95.39567689517264, 18.884946366181907], [95.3933041976307, 18.884931493193903], [95.39234754470351, 18.88583089707828]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
