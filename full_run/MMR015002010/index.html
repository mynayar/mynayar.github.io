
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Kyawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Kyawng</div><div class="name-mm">နောင်ကျောင်း</div></div>
        <span class="pcode-badge">MMR015002010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.01581968303202, 23.268120631861734], [98.03369641565712, 23.265282292343954], [98.05416555199866, 23.265691675430503], [98.06440011927015, 23.266510439805018], [98.06590436399529, 23.266717273983033], [98.07105121104462, 23.255235846157404], [98.07319272526411, 23.249287194148735], [98.07533424038297, 23.240007295900057], [98.07985521684486, 23.229061774981005], [98.08512518108228, 23.219107397788207], [98.07608554211413, 23.211272342244854], [98.07559071533927, 23.210843452863116], [98.0702333226098, 23.20778179729217], [98.06153444036221, 23.22025019419118], [98.0398371565596, 23.227619082554668], [98.0177639012831, 23.233341778999943], [98.01445542857522, 23.228437847828445], [98.01381499076928, 23.227930834340555], [97.99823486584643, 23.240201905593494], [97.99310893612858, 23.250755292422866], [97.99047919076213, 23.260616836198096], [97.99603320676715, 23.259141551441473], [98.00606794467996, 23.259428258007745], [98.00773291264386, 23.263570117167205], [98.01584342783201, 23.267812332573158], [98.01581968303202, 23.268120631861734]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
