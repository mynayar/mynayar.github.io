
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hmaing Wei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hmaing Wei</div><div class="name-mm">မှိုင်းဝယ်</div></div>
        <span class="pcode-badge">MMR005034019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18715438656574, 25.132038171024817], [95.17335351365381, 25.139176554154687], [95.18144368078129, 25.156784564855855], [95.17382940610224, 25.19723540229205], [95.15526960960489, 25.21817465923317], [95.1514624718157, 25.240065700171954], [95.14924181815542, 25.27144705193996], [95.14694149625313, 25.30395422810517], [95.16538231873909, 25.350948583110664], [95.1802539505594, 25.343810199980794], [95.20047936882787, 25.30692855500888], [95.22284630311447, 25.295745087865555], [95.22474987110974, 25.27670939981897], [95.21999094932289, 25.25910138911786], [95.20381061416856, 25.26766744779451], [95.20190704617329, 25.240541592620445], [95.22284630311447, 25.22531304236304], [95.2908988872739, 25.166778301777242], [95.37322823769307, 25.101105178061573], [95.3815478326664, 25.09518546623633], [95.35966531010604, 25.078976189999196], [95.34634032874322, 25.070410131322546], [95.3242113406809, 25.07778645977737], [95.2728149841243, 25.114906051872822], [95.18715438656574, 25.132038171024817]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
