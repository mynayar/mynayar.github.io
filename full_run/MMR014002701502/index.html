
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Si Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thar Si Ward</div><div class="name-mm">သာစည်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014002701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93416245529818, 20.661070618878682], [96.93341088933437, 20.66106187973969], [96.93363064576329, 20.66162681788876], [96.93365919929545, 20.66192187105355], [96.9336020922313, 20.662055120869923], [96.93344980672691, 20.662112227934074], [96.93303102158984, 20.662216924218228], [96.93251705801254, 20.662321620502553], [96.93204116581137, 20.662445352474776], [96.93198405874722, 20.662768959171615], [96.9316461752843, 20.663035458804302], [96.9310893814091, 20.663349547656992], [96.93111793494108, 20.66436319804552], [96.93104319012241, 20.665995528124427], [96.9311434718623, 20.667658084569496], [96.93120533784844, 20.669385573259717], [96.93129575736668, 20.670556268074563], [96.93132431089867, 20.671584195229173], [96.93135762335282, 20.673635290616232], [96.93135286443083, 20.674447373617227], [96.93399372176953, 20.674447373617227], [96.93407426846363, 20.671676215302], [96.93425763373841, 20.670693159186385], [96.93425763373841, 20.66974137478394], [96.93429570511432, 20.6688466974457], [96.93370559878502, 20.666238808183266], [96.93473352593941, 20.66615314758718], [96.93459504479074, 20.66426980396477], [96.93419100883017, 20.664268614470586], [96.93416245529818, 20.661070618878682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
