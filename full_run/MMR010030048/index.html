
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Win</div><div class="name-mm">ဇဝင်း</div></div>
        <span class="pcode-badge">MMR010030048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1294258592161, 20.929634437279503], [96.12853281173994, 20.931080323198387], [96.12884747732926, 20.938317613766912], [96.13482610823837, 20.946184234614805], [96.13105013015945, 20.951848200833865], [96.13199412512881, 20.961917476310532], [96.13151902228509, 20.978553705689023], [96.13435114389023, 20.974305523281316], [96.14036940432459, 20.974305523281316], [96.14744970833743, 20.97678363036033], [96.15594607405211, 20.974659537807497], [96.15275993702153, 20.969703325448165], [96.14780372376288, 20.96439309586475], [96.15346796697315, 20.958728851755154], [96.16231834811333, 20.95200256316781], [96.17152274467901, 20.94917044066335], [96.17966509496824, 20.94917044066335], [96.18603736992873, 20.95058650236524], [96.18840686138759, 20.95096562056699], [96.18202583062765, 20.94649890020412], [96.1710125619802, 20.940205602806373], [96.16912457294075, 20.932653646648532], [96.16314594203163, 20.929821664438293], [96.15590865056384, 20.923528367939866], [96.14804203061527, 20.917864400821486], [96.14017540976738, 20.915032417711984], [96.13514077292837, 20.920381719240993], [96.12972775982831, 20.92914564495561], [96.1294258592161, 20.929634437279503]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
