
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyay Paw Hkon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyay Paw Hkon</div><div class="name-mm">ကျေးပေါခုံ</div></div>
        <span class="pcode-badge">MMR014002023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.81989688063658, 20.398726230631098], [96.81293910385659, 20.415424648129033], [96.80395432263396, 20.42675330721943], [96.79809469901119, 20.43339423395679], [96.79340693068536, 20.44198842792366], [96.79340680028366, 20.448238814169997], [96.78950038723315, 20.452535881925485], [96.78871892583783, 20.461911447355476], [96.78842676128608, 20.463700558633946], [96.81549119995896, 20.47853973841825], [96.83014484960518, 20.465930783778674], [96.83834836188743, 20.462947687585768], [96.85192144641769, 20.468376921757567], [96.85923002894276, 20.460337479990756], [96.86322996878806, 20.455462552854556], [96.87116241011717, 20.445794891221283], [96.87295960270359, 20.443198945974643], [96.87489127900938, 20.43386251004688], [96.87332379755526, 20.422106402288705], [96.87265395821368, 20.421930128872418], [96.87153529691648, 20.420065693976653], [96.8670606544257, 20.414099504288743], [96.86668776672713, 20.40291289581353], [96.8618402374371, 20.399184026921375], [96.84617898737042, 20.390980514639068], [96.83056851032853, 20.379566835441153], [96.82973696388984, 20.383391727646142], [96.82788310142405, 20.385657565943973], [96.8227054022326, 20.39198587934493], [96.81989688063658, 20.398726230631098]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
