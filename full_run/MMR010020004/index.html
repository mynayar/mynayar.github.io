
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Hpyu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Hpyu Kone</div><div class="name-mm">ဆူးဖြူကုန်း</div></div>
        <span class="pcode-badge">MMR010020004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36909551834356, 21.052515181030856], [95.36918252685217, 21.052547669039768], [95.37225094442562, 21.050842988812917], [95.37258114130668, 21.049522203986555], [95.37721408875927, 21.048658484301654], [95.3788991826512, 21.049649716161525], [95.3959459507451, 21.04317194622837], [95.39870638738995, 21.041225239553228], [95.40225354106815, 21.034860164564975], [95.40443059379692, 21.026637279087197], [95.39539744703461, 21.02319607993519], [95.39019230233293, 21.023743990093124], [95.39076767598749, 21.023008789823848], [95.3966107161117, 21.016478333108637], [95.39008025939654, 21.015103499926624], [95.3890464221547, 21.015139149951835], [95.3801127197263, 21.015447209121476], [95.36808293118241, 21.018196874586124], [95.36017764128519, 21.02438362300586], [95.35330347627445, 21.028851830847373], [95.34983474797531, 21.02835629810471], [95.35013836359468, 21.029494856902147], [95.35222927116399, 21.03242212677975], [95.35557472309506, 21.03534939755673], [95.3574565400873, 21.041622120264662], [95.3593383570796, 21.047476660919244], [95.35974649190712, 21.0519661530156], [95.36208446212828, 21.051479099081234], [95.3649099512333, 21.05095234367576], [95.36909551834356, 21.052515181030856]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
