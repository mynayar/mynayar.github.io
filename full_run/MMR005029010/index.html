
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nauk Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nauk Taing</div><div class="name-mm">အနောက်တိုင်း</div></div>
        <span class="pcode-badge">MMR005029010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.39956935993808, 22.81674222027732], [94.40222184016585, 22.812384690201327], [94.4046727202699, 22.80398103020042], [94.38736284022298, 22.79687948959679], [94.37444172010936, 22.794941339970933], [94.35441420035511, 22.789772910091756], [94.3272799203321, 22.778143919706167], [94.29949943964749, 22.76263863006875], [94.28524236044666, 22.75575588012981], [94.27073492078, 22.74775096063837], [94.26674184276192, 22.748321400612213], [94.26185235919905, 22.75174403955583], [94.26103744662095, 22.752314478630353], [94.25800908844872, 22.75422712528166], [94.25561826776891, 22.755737116674652], [94.25171006956413, 22.754825203220605], [94.2470616726581, 22.753740576766234], [94.24278337465307, 22.758874535631378], [94.25014020040999, 22.760728020381862], [94.27624163964003, 22.77491364035228], [94.30919028040717, 22.787188649736436], [94.35247595989767, 22.80657024042432], [94.37379552034707, 22.81303080003147], [94.39188516027201, 22.81561496955527], [94.39872228040895, 22.81813397959951], [94.39956935993808, 22.81674222027732]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
