
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Hpyit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongping</div><div class="name-mm">မိုင်းပျဉ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Hpyit</div><div class="name-mm">ဝမ်ဖြစ်</div></div>
        <span class="pcode-badge">MMR016007003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.9956493516363, 21.422643615710342], [98.99548131061403, 21.423135278670202], [98.99546361555349, 21.423237705155998], [98.99004004171462, 21.42672464472662], [98.98758886033767, 21.428636934347082], [98.98452492588467, 21.429784150018577], [98.98146101481404, 21.430357574842276], [98.97921370434904, 21.433799723678362], [98.97594470558374, 21.438771657985683], [98.97512685492046, 21.443361417295648], [98.97267463122932, 21.448333400166348], [98.97063062780131, 21.45426164026253], [98.9714468560876, 21.459042895813013], [98.97205879887451, 21.46401535532442], [98.97307912200392, 21.4705178314328], [98.9747130282837, 21.473960482090604], [98.97705193919569, 21.477014991648616], [98.97704350805151, 21.47689635937951], [98.9770336101131, 21.476635879742105], [98.98338892026254, 21.473332302044128], [98.99488181264559, 21.47082296780576], [99.00714038602007, 21.466519896176294], [99.01256071780296, 21.466730922094428], [99.01058770415926, 21.461499546866662], [99.01135291300659, 21.449666235908126], [99.00905392659752, 21.436757343876366], [99.005223601588, 21.427075721167625], [98.9956493516363, 21.422643615710342]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
