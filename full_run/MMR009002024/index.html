
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Lut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Lut</div><div class="name-mm">ဝက်လွတ်</div></div>
        <span class="pcode-badge">MMR009002024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89225036136514, 20.329265052740027], [94.88840682261684, 20.331220536798412], [94.88762501498252, 20.332686428136185], [94.88539425204317, 20.336869099429464], [94.88263275329899, 20.3407603193333], [94.8784906567185, 20.338626327043414], [94.87548537694863, 20.338746491757263], [94.8722146865586, 20.338877269370528], [94.87008083186498, 20.340258004803104], [94.86618968300752, 20.342893958189677], [94.86347703813487, 20.346174384640165], [94.86079222727955, 20.349421152164496], [94.85742052683588, 20.35578967785142], [94.85692359384882, 20.35759159097921], [94.85595300322859, 20.359377339692514], [94.8549688409393, 20.361185163164805], [94.84959092298277, 20.368593324922074], [94.84928470562471, 20.369971234684783], [94.8482730303761, 20.374523565110508], [94.85189683956753, 20.378806594448804], [94.8634272408745, 20.38737272597058], [94.86369058035604, 20.387711333311415], [94.86763431796948, 20.38613845502573], [94.86737405596796, 20.385971316023472], [94.87736413085003, 20.379947888084644], [94.88747383355064, 20.3741709157552], [94.88843666302165, 20.362616970197053], [94.88939949069402, 20.347693122839416], [94.89276939159419, 20.33517634870958], [94.89264069321348, 20.331572773364826], [94.89225036136514, 20.329265052740027]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
