
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mone Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mone Long</div><div class="name-mm">မုံးလုံ</div></div>
        <span class="pcode-badge">MMR015009042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.1665665606983, 24.099141290038574], [98.16658886478433, 24.099787248782548], [98.16672010734715, 24.106219620039496], [98.18470018466587, 24.10498800838991], [98.19500220918468, 24.10257098776094], [98.19838529864268, 24.10177726141154], [98.19928073202021, 24.102620399212128], [98.2055266864075, 24.10850157778566], [98.20936218161944, 24.11254456188209], [98.22044226989487, 24.1162311788259], [98.23017619537518, 24.115373537658684], [98.2321180627984, 24.114967963200968], [98.22748891408219, 24.09979464210909], [98.22543146219226, 24.091564837247518], [98.22059961977669, 24.086338557578415], [98.20865841985028, 24.08101094589847], [98.18966662681345, 24.072537683767166], [98.16587201698007, 24.06920643842642], [98.16053784564514, 24.069127995060967], [98.16053784564514, 24.081415917810432], [98.16622649825433, 24.089292513938403], [98.1665665606983, 24.099141290038574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
