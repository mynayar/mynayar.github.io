
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawt La</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Matman</div><div class="name-mm">မက်မန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawt La</div><div class="name-mm">နော့လ</div></div>
        <span class="pcode-badge">MMR015024018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.02873778661962, 21.989023297986876], [99.01237267136173, 21.99707200187146], [99.00998762343016, 22.005942302095605], [98.98332809371664, 22.008922956629192], [98.97047900480231, 22.011778310420766], [98.9571540234395, 22.02462739933509], [98.95181746980046, 22.044662405045983], [98.96449232855815, 22.045536532584947], [98.97917280588035, 22.042039442366445], [98.99808075242487, 22.025579184232015], [99.01521287157681, 22.016537232207554], [99.0294896378366, 22.014157770864472], [99.0422908801201, 22.009706553015064], [99.04040636336305, 22.00658518335956], [99.03923940667335, 22.000821850148327], [99.03869352628527, 22.000634870303088], [99.03747375241181, 21.999333941608143], [99.0362377817483, 21.99845303767762], [99.03371747398228, 21.99822372404566], [99.03236955571049, 21.99755975727703], [99.03111846294678, 21.996648860056894], [99.03012986879844, 21.99567896461258], [99.02940123178149, 21.994642442894474], [99.0293236319801, 21.99304576944678], [99.02932112467022, 21.99299418433418], [99.02933424398026, 21.990774221353263], [99.02933702108669, 21.990304265329655], [99.02873778661962, 21.989023297986876]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
