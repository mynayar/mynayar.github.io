
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Auk Si Dee (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Auk Si Dee (East)</div><div class="name-mm">အောက်စီဒီး (အရှေ့)</div></div>
        <span class="pcode-badge">MMR007001009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.53163518061916, 17.279687056712362], [96.53520356279427, 17.276118675436578], [96.53877194586869, 17.271122939671955], [96.54071537541432, 17.269611450907803], [96.5320369671324, 17.256232767428344], [96.53154567019658, 17.25591810993285], [96.53103267801572, 17.254684548553143], [96.53060643174149, 17.253659584921934], [96.53041836371659, 17.253569073553933], [96.52806679934338, 17.26113146994146], [96.52307106357875, 17.265770367308676], [96.51700481442072, 17.26648404320406], [96.51188840942262, 17.26707439776527], [96.51120611357135, 17.28015170673592], [96.51343643224561, 17.279687056712362], [96.51827492604707, 17.279364490578814], [96.51878900460895, 17.279330219214273], [96.52521209306371, 17.279330219214273], [96.52830447397236, 17.279502017604102], [96.53163518061916, 17.279687056712362]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
