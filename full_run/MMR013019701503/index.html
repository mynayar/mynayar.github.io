
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (28) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (28) Ward</div><div class="name-mm">အမှတ် (၂၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.20926123401881, 16.865741919853747], [96.20929167067413, 16.86570772673025], [96.20953657315437, 16.8654326061299], [96.20948282337366, 16.865183226824513], [96.20947329235861, 16.865139008058804], [96.20954238097619, 16.864713669200512], [96.20968055731191, 16.863862990584607], [96.20983250856347, 16.862377166672957], [96.20883019795531, 16.86185264608281], [96.2081789970631, 16.861661434028008], [96.20517253918138, 16.86114120500264], [96.20309990583604, 16.860889270723305], [96.20295906031242, 16.862401961881062], [96.20290946989616, 16.8630523686719], [96.20287132155431, 16.86345291142277], [96.20277976967071, 16.864511489913355], [96.20269012434983, 16.86548137726379], [96.20238113438188, 16.867099762144335], [96.20217470759673, 16.868096204676135], [96.20308113068967, 16.86820348120574], [96.20402336118923, 16.868520736842584], [96.20473289480731, 16.868780136394207], [96.20581054701921, 16.869180679145074], [96.20754718825219, 16.869822979447008], [96.20812034597725, 16.868410110338345], [96.20869255042095, 16.86701965323448], [96.20923423727027, 16.865772247691154], [96.20926123401881, 16.865741919853747]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
