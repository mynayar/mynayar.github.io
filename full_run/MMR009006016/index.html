
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon Kone</div><div class="name-mm">ဝါးရုံကုန်း</div></div>
        <span class="pcode-badge">MMR009006016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2596121954465, 20.519607115975646], [95.2629462412761, 20.51345195174622], [95.27571728522457, 20.509968940414296], [95.293906348799, 20.509581938755503], [95.30318769405687, 20.510907846120233], [95.3028107522145, 20.495076292337046], [95.3039387268908, 20.493948316761475], [95.30231629685966, 20.492109562006704], [95.30083293259383, 20.486670559398874], [95.30182184330346, 20.466892363192073], [95.29885511297317, 20.46442008911589], [95.2899549246801, 20.464914543571354], [95.2899549246801, 20.463908584413673], [95.28402146671738, 20.467386817647593], [95.25929872325753, 20.47134245688892], [95.25880426790269, 20.471314987996323], [95.25039853496446, 20.47084800333272], [95.24594844126761, 20.467386817647593], [95.24248725738107, 20.47233136669928], [95.24545398591277, 20.485187194233674], [95.24347616719143, 20.50743766361734], [95.23745597411397, 20.522488146310934], [95.24088716381164, 20.52390098933921], [95.25791522330894, 20.5208049778675], [95.2596121954465, 20.519607115975646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
