
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Tat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyawng</div><div class="name-mm">မိုင်းယောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Tat</div><div class="name-mm">ဝမ်တပ်</div></div>
        <span class="pcode-badge">MMR016011005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.3703758200881, 21.25146449009418], [100.38345375768483, 21.262423657325996], [100.39923495842663, 21.27645138872066], [100.40449535657552, 21.29281707684669], [100.40507984575834, 21.307429299222804], [100.40250241305597, 21.318165222347204], [100.40863954587837, 21.315973389260535], [100.42485880818748, 21.318805323806714], [100.43625664402896, 21.320795421871253], [100.45729824291965, 21.320357056333137], [100.47833984181034, 21.312028088625425], [100.49192920766689, 21.29668525701902], [100.49894307426354, 21.280027324301614], [100.50595693996087, 21.273013457704963], [100.51655080077887, 21.26307714789209], [100.52940955560655, 21.240866570635774], [100.52707159977456, 21.22157843929358], [100.51888875571154, 21.20988866193227], [100.49843164600372, 21.213980084413436], [100.4785590245794, 21.21164212768207], [100.45050355999138, 21.210473150215762], [100.43822929434651, 21.220993950110767], [100.42420324738202, 21.22631417386009], [100.42127911703767, 21.227423326625285], [100.42069462785486, 21.241451059818587], [100.41777218373937, 21.250802882247285], [100.39448598583965, 21.24269715774767], [100.38133498642054, 21.23962859088681], [100.37832566689605, 21.24287865622506], [100.3703758200881, 21.25146449009418]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
