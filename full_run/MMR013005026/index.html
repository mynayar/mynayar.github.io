
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Chan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Chan Kone</div><div class="name-mm">ကွမ်းခြံကုန်း</div></div>
        <span class="pcode-badge">MMR013005026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8658381432158, 17.439771774148085], [95.86862851379493, 17.432903167846973], [95.8708052787407, 17.429552738168354], [95.87154280375745, 17.42634457764018], [95.87286381071635, 17.423702562823053], [95.87248638144143, 17.421626694616293], [95.87248638144143, 17.419739541047022], [95.86683152535466, 17.41408468585962], [95.8643889576843, 17.415587803734184], [95.86118079805544, 17.417663672840263], [95.8587101616447, 17.416908811592407], [95.8585214470072, 17.412757075178945], [95.85550585381219, 17.41124927813172], [95.85418099505694, 17.41143606732072], [95.84927439559692, 17.413323220889993], [95.84736929515691, 17.4153285903422], [95.84741466235687, 17.41542202810416], [95.84802269489154, 17.41744880411909], [95.85069008857681, 17.422168037025358], [95.85081306726931, 17.42238561360523], [95.85338879395772, 17.422600258395278], [95.85295950617632, 17.427537068780737], [95.8551059459827, 17.435049606753978], [95.85627207529609, 17.437343801575253], [95.85703774099903, 17.439127841576692], [95.86088399569991, 17.439127841576692], [95.86455027897227, 17.439771774148085], [95.8658381432158, 17.439771774148085]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
