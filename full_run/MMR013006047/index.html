
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw La Teit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw La Teit</div><div class="name-mm">တော်လတဲ့</div></div>
        <span class="pcode-badge">MMR013006047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8750051135952, 17.210680519390507], [95.87111928602627, 17.212345874062862], [95.86679905623151, 17.215614685769197], [95.86230703614086, 17.218957585424278], [95.86272489803565, 17.22230048418004], [95.86178470809784, 17.22512105489284], [95.8610534486578, 17.227523762811472], [95.85917306788286, 17.231911317653214], [95.85608559727257, 17.238484643251752], [95.85739241562754, 17.238691960365713], [95.85938521525554, 17.23904887880275], [95.86152673037435, 17.239822204031555], [95.8636087580378, 17.240387326314135], [95.86545284037635, 17.241011935152756], [95.86699948993459, 17.241309367033693], [95.8681260535746, 17.24168235725506], [95.86945393135392, 17.238436435992753], [95.87139684468872, 17.230942337718773], [95.87333975892278, 17.228721864822262], [95.87444999627036, 17.22261556255819], [95.87417243580933, 17.21539902474524], [95.8750051135952, 17.210680519390507]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
