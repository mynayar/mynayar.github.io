
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mee Thway Taik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mee Thway Taik</div><div class="name-mm">မီးသွေးတိုက်</div></div>
        <span class="pcode-badge">MMR010016021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95729599281589, 21.834812394576375], [95.95371916780539, 21.839184069189514], [95.9529243182028, 21.84295960570131], [95.95113590569753, 21.846735143112426], [95.94934749409163, 21.849318405220288], [95.94855264358966, 21.851702954927475], [95.9491454263204, 21.855696306339496], [95.95258294904392, 21.856809870279335], [95.95644061164495, 21.85816005214474], [95.96077515594874, 21.859677141886664], [95.96815414909474, 21.86149350981765], [95.97403660110831, 21.862941498351518], [95.9736824318988, 21.858210331441683], [95.9734598631822, 21.855094365812363], [95.97295533901774, 21.847021975583743], [95.97253230242387, 21.840428027631447], [95.96874920800963, 21.840428027631447], [95.9647859658997, 21.840428027631447], [95.96082272468908, 21.837545669896826], [95.95729599281589, 21.834812394576375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
