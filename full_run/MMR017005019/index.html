
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lan Kone</div><div class="name-mm">ဖလံကုန်း</div></div>
        <span class="pcode-badge">MMR017005019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25846744032015, 17.434721249885797], [95.25805668037157, 17.434584269648383], [95.25258036039537, 17.435679570156083], [95.24984219995764, 17.435953349867248], [95.24286000028883, 17.435953349867248], [95.2394371203269, 17.435679570156083], [95.23861596015848, 17.435268810207447], [95.2383419996836, 17.43609033010472], [95.23861596015848, 17.4371855397809], [95.24080619964644, 17.43882848964313], [95.24395512003281, 17.44170354038613], [95.24669327957128, 17.44526312988961], [95.24915784016224, 17.44964415025737], [95.25080052022787, 17.4530668503549], [95.25148523975207, 17.456626439858383], [95.25080052022787, 17.461007550158342], [95.24967659969536, 17.462737979773976], [95.25331980006877, 17.46319806034228], [95.25504456035821, 17.461144439564293], [95.259699720166, 17.45361449970943], [95.26106880038486, 17.44923348024099], [95.25942575969111, 17.445947670448675], [95.25764592042293, 17.44457859022981], [95.2568243996264, 17.44348328972211], [95.25586608025549, 17.44047134957316], [95.25627684020407, 17.438554619999763], [95.25663972024694, 17.43739307992672], [95.25696155972827, 17.436364109815884], [95.25846744032015, 17.434721249885797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
