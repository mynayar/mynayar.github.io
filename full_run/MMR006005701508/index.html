
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myeik</div><div class="name-mm">မြိတ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Gyi Ward</div><div class="name-mm">ကံကြီးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006005701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.5974846582904, 12.450795839256614], [98.59769973835228, 12.454985515369287], [98.59798832000502, 12.454969606362283], [98.59877741574519, 12.45493091842718], [98.59945095309905, 12.454863215664943], [98.5999957264217, 12.454808408281451], [98.60050748293406, 12.454769721245668], [98.60101417536396, 12.454619955346686], [98.60154172577006, 12.454422340118924], [98.60199322770535, 12.45429902328135], [98.60234650478742, 12.454202303893283], [98.6023456792098, 12.453900057941382], [98.60225488365603, 12.453242367541293], [98.60187519348545, 12.45196244700935], [98.60167049070066, 12.45140147150073], [98.60133042016281, 12.450669623004728], [98.60085126767194, 12.44963914832806], [98.60085126767194, 12.44963914832806], [98.60028750966092, 12.448634057915513], [98.59999778946644, 12.448065822180013], [98.5997254037045, 12.447462925673506], [98.59942660395467, 12.44693418186705], [98.598852115233, 12.445960516464709], [98.59879715676345, 12.445682884057874], [98.59770355237708, 12.445636900822365], [98.59781415819691, 12.445925454596079], [98.59667673794115, 12.446280101345621], [98.59767298442074, 12.44924893429095], [98.59747358044143, 12.450309052420891], [98.5974846582904, 12.450795839256614]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
