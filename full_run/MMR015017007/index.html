
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmit</div><div class="name-mm">မိုးမိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Pin</div><div class="name-mm">မန်ကျည်းပင်</div></div>
        <span class="pcode-badge">MMR015017007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61352667541581, 23.16369912601391], [96.6104070513444, 23.150908669299724], [96.60500593357705, 23.115903830297555], [96.58874594007312, 23.112480673344464], [96.58060330739676, 23.10348092110769], [96.56903219737808, 23.073910306615403], [96.56131812403225, 23.057625041262668], [96.54760421556216, 23.051196646807853], [96.54142827159751, 23.050424654374353], [96.53722973536406, 23.06971192056875], [96.53572609228542, 23.08224228435398], [96.54925888269133, 23.09627628941928], [96.55527345680463, 23.11081151004322], [96.55928317317995, 23.135371020256457], [96.55928317317995, 23.169763447025503], [96.56529774729324, 23.170456033818937], [96.61541919613904, 23.17145846313764], [96.6141967216015, 23.16644631834299], [96.61352667541581, 23.16369912601391]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
