
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Hpeik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Hpeik</div><div class="name-mm">ဖာဖိတ်</div></div>
        <span class="pcode-badge">MMR015009030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11327826797776, 23.941825127427762], [98.10452649390265, 23.934823709246814], [98.09271159926095, 23.92432158017681], [98.08746053517564, 23.91469462905394], [98.08333278997634, 23.896807729593093], [98.07923005042653, 23.89951971076607], [98.06858180490644, 23.906558381564082], [98.0510927664181, 23.923690500716077], [98.04856282421503, 23.925230465613538], [98.04491503639986, 23.927450857571046], [98.04288362617848, 23.92868736872714], [98.03014876105652, 23.934347307782105], [98.03003453636484, 23.93439807541091], [98.02862470606539, 23.935807905710305], [98.03039145570119, 23.941893377877136], [98.03717291859539, 23.953671709681714], [98.04288362617848, 23.9690192330512], [98.0428368623314, 23.981678354572466], [98.0432640780748, 23.98077052044323], [98.07214493144352, 23.989084705095138], [98.07708029481984, 23.982861856089812], [98.07862647942852, 23.980912320147524], [98.10233855038388, 23.95101449002675], [98.10758961356987, 23.947076192412396], [98.11327826797776, 23.941825127427762]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
