
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Shey Lay Ein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Shey Lay Ein</div><div class="name-mm">အရှေ့လေးအိမ်</div></div>
        <span class="pcode-badge">MMR009008043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.86369058035604, 20.387711333311415], [94.8634272408745, 20.38737272597058], [94.85189683956753, 20.378806594448804], [94.8482730303761, 20.374523565110508], [94.84928470562471, 20.369971234684783], [94.84764513361608, 20.369971234684783], [94.84187229367149, 20.370568424992882], [94.83510413804561, 20.37335531339704], [94.83124456798248, 20.37586403429782], [94.83112286902525, 20.37594313776566], [94.83809008868673, 20.387687879891814], [94.84207135770703, 20.393659782073314], [94.84485824611124, 20.39644666957821], [94.84414906143007, 20.3995670859523], [94.84386292863132, 20.40082606577039], [94.84585356269184, 20.40261763579531], [94.84903857826782, 20.406598904815667], [94.849436703641, 20.409783920391646], [94.84724700734358, 20.413566125376462], [94.84465122037756, 20.416869854160495], [94.84744606958049, 20.417547392598124], [94.85262171921704, 20.42073240817416], [94.85680205137362, 20.42431555002264], [94.85972918905088, 20.424007429699145], [94.8637562209729, 20.411423238791485], [94.86414612384459, 20.401874716644897], [94.864415422234, 20.39527975875393], [94.8657332959549, 20.390337895977154], [94.86369058035604, 20.387711333311415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
