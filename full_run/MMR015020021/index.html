
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Huong</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kunlong</div><div class="name-mm">ကွမ်းလုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Huong</div><div class="name-mm">ပန်ဟုန်း</div></div>
        <span class="pcode-badge">MMR015020021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.58248487487714, 23.266608492887713], [98.57559801773436, 23.270233099777784], [98.56661335792018, 23.27492067744737], [98.56426942159658, 23.280389700324463], [98.56733323913772, 23.286901014070565], [98.56739430400398, 23.28703078983915], [98.5686817545594, 23.287185320346282], [98.56922142333008, 23.29028841128121], [98.56979249372864, 23.295999117964982], [98.56960213692912, 23.303613392644024], [98.56973062756646, 23.305431301113686], [98.57017320822706, 23.310656597823765], [98.56845999613199, 23.315796233209653], [98.56674678403692, 23.31922265739979], [98.56564396699554, 23.322776180076687], [98.56560424394075, 23.322828315574327], [98.57669943363203, 23.32575621407807], [98.59028024693589, 23.32643525438351], [98.60793530477054, 23.323719092262365], [98.61294017584851, 23.320382510344643], [98.61147399043239, 23.319022142757717], [98.60441598061306, 23.311179910624446], [98.60225936767574, 23.30235740037375], [98.59931853062574, 23.289809828960472], [98.59088813108247, 23.279418871383882], [98.58284984314582, 23.26804763479055], [98.58248487487714, 23.266608492887713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
