
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baung Kya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Baung Kya</div><div class="name-mm">ဘောင်းကျ</div></div>
        <span class="pcode-badge">MMR005014033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5351867717522, 22.387512240097863], [95.53472891970392, 22.387512240097863], [95.53149432000691, 22.38470459983745], [95.51452644044292, 22.38311772000685], [95.50750715992757, 22.384277369704876], [95.50750715992757, 22.384887660437244], [95.50750715992757, 22.392517050021866], [95.50830096002136, 22.40051273977116], [95.50830096002136, 22.40789795982306], [95.50830096002136, 22.416076620239892], [95.5104980397528, 22.416076620239892], [95.52331547972568, 22.416503940304665], [95.52378227463231, 22.416611363423726], [95.52378227463231, 22.412911217079056], [95.52728243063973, 22.410811122035682], [95.52851778167036, 22.410687586662846], [95.53428274894975, 22.41011108975505], [95.53655785386195, 22.41256120183806], [95.53920782857847, 22.414970271560833], [95.5397126171436, 22.41542917041994], [95.54190135026715, 22.414766067000414], [95.54075804215, 22.411336147145505], [95.53585782158126, 22.40731096602832], [95.52938252568305, 22.402410742761617], [95.53270878428305, 22.398980542318213], [95.53229932655273, 22.392056105205143], [95.5351867717522, 22.387512240097863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
