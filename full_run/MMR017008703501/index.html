
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (1) Ward</div><div class="name-mm">အမှတ် (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008703501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48224654645105, 17.565997498509546], [95.48234094949606, 17.566652766703726], [95.47942000822377, 17.567063697605136], [95.47905350228456, 17.567741178280414], [95.47798730318897, 17.568463083918118], [95.47670239008824, 17.569332871247923], [95.47706826178103, 17.569708371142895], [95.47828994824465, 17.570952270087844], [95.47873419786788, 17.571396519711016], [95.4792228724533, 17.57195183173991], [95.47926675590179, 17.572004670994318], [95.48331845909024, 17.57137159237101], [95.48378753733118, 17.571233628182483], [95.48484438701928, 17.57112089754912], [95.48472046153984, 17.57083380352168], [95.48418736199204, 17.569234504878295], [95.48388547500087, 17.567865950518296], [95.48388733002122, 17.567439750446965], [95.48388471693687, 17.567303870057742], [95.48380142013241, 17.56708729836646], [95.4838402919745, 17.566520880096846], [95.4838402919745, 17.56618769287968], [95.48370701708757, 17.56574344325645], [95.48364257300796, 17.56564122161285], [95.48352262560184, 17.565677165883358], [95.48224654645105, 17.565997498509546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
