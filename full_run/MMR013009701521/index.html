
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Moe Yeik Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Nga Moe Yeik Ward</div><div class="name-mm">ငမိုးရိပ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701521</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.20501136808025, 16.84238079583713], [96.20441627499116, 16.841775893842453], [96.20409202532676, 16.841482162671696], [96.2037506103025, 16.841150284058415], [96.20351982088306, 16.84092140210106], [96.20300865162801, 16.840429305667953], [96.20019421968755, 16.83772498042356], [96.200002670387, 16.83791923488485], [96.19834136985838, 16.839681148865964], [96.19925880425046, 16.840490340856604], [96.19957923899074, 16.840770721591582], [96.19975090068357, 16.840978622365583], [96.20007133542384, 16.84134101857319], [96.20034217884853, 16.84163284318123], [96.20069313028381, 16.841962814332476], [96.20153694167658, 16.842811965899557], [96.2010784151368, 16.843263626115515], [96.20067469238319, 16.84367179871458], [96.20170021089609, 16.844652175757346], [96.20207023605263, 16.845007488005194], [96.20276959743904, 16.84443346693098], [96.2033189132373, 16.843941369598554], [96.2035770420469, 16.843700408846814], [96.20389556932514, 16.843402862751987], [96.20430183356285, 16.84301185641209], [96.20456123311448, 16.84277153058173], [96.20501136808025, 16.84238079583713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
