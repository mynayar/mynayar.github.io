
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Sang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Sang</div><div class="name-mm">နောင်ဆန်း</div></div>
        <span class="pcode-badge">MMR015019002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.44405474433103, 23.344460898551688], [97.44755153507532, 23.34260965671035], [97.45996738638581, 23.306741643911778], [97.4710036965634, 23.283289482423697], [97.4765218530012, 23.272942939664972], [97.48249831384618, 23.24604886586252], [97.48027700008356, 23.24445517096939], [97.46445664915507, 23.235372265617627], [97.4559606188875, 23.22716847634416], [97.44306989406044, 23.222480424731884], [97.44267368244454, 23.222143614236472], [97.44065384110195, 23.25224985594616], [97.43927430176768, 23.26604524479228], [97.4185812171495, 23.281220172972667], [97.41513237016284, 23.289497407179624], [97.41168352317612, 23.3026030268083], [97.39030066934049, 23.319847264439773], [97.37754727188917, 23.3279630622456], [97.37995412658171, 23.331573344734124], [97.39579927181899, 23.34024163024708], [97.39719836421318, 23.33985057894114], [97.41996075558444, 23.35364596778726], [97.43582545388165, 23.348817582365598], [97.44405474433103, 23.344460898551688]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
