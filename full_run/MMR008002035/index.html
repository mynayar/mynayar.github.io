
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Ngar Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Ngar Gwa</div><div class="name-mm">အင်ငါးခွ</div></div>
        <span class="pcode-badge">MMR008002035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46765572243368, 18.908461134873505], [95.47540986867057, 18.909277361361205], [95.48275590436157, 18.908869248117355], [95.48928571266555, 18.908869248117355], [95.4958155218689, 18.908869248117355], [95.5019372169291, 18.905604343965365], [95.50928325172077, 18.90356377864549], [95.51499683533575, 18.90111510008188], [95.51826173858842, 18.894177179433314], [95.52601588662395, 18.885606804910196], [95.52992427728361, 18.875723485850244], [95.51499683533575, 18.87581209155485], [95.50275344341674, 18.872955299747332], [95.48765326058958, 18.868874170007018], [95.4782666613774, 18.870506622082985], [95.46520704297069, 18.8725471874028], [95.45704478169137, 18.883566239590323], [95.45622855610304, 18.888463595818337], [95.45337176519485, 18.892544725558707], [95.44953951743486, 18.89422133524647], [95.45704478169137, 18.90111510008188], [95.46357459089472, 18.905604343965365], [95.46765572243368, 18.908461134873505]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
