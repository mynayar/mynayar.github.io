
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Pin</div><div class="name-mm">အင်ပင်</div></div>
        <span class="pcode-badge">MMR005010040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38409412004768, 22.554687510220447], [95.38690176030804, 22.554687510220447], [95.39227296032891, 22.546081529738842], [95.39787852007771, 22.540110300250205], [95.3928831602297, 22.5297241198723], [95.39275715981512, 22.5297241198723], [95.38531487957806, 22.5297241198723], [95.37750252022516, 22.5234985504178], [95.37623712014704, 22.51911770991444], [95.37449184002645, 22.512518099830515], [95.37437232012655, 22.51206657001626], [95.36655396319492, 22.515428796102128], [95.36166745099212, 22.521618377386233], [95.35238307861624, 22.530251215221483], [95.34917958107286, 22.53225340107366], [95.35327164027404, 22.542297390312342], [95.34837420040907, 22.549431599688603], [95.34832776031794, 22.549499549764448], [95.34900275996944, 22.549578750359103], [95.36029056016127, 22.550903279962426], [95.37432875966459, 22.554077129555935], [95.38409412004768, 22.554687510220447]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
