
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Sum</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Sum</div><div class="name-mm">ဟိုဆွမ်</div></div>
        <span class="pcode-badge">MMR015021047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.90052625298426, 23.442371169793716], [98.90059681109403, 23.442233464702667], [98.9078684269864, 23.434994883607033], [98.91531464535467, 23.4250143748136], [98.9193584451362, 23.418077588210167], [98.9135594484099, 23.405656361651836], [98.91146308105641, 23.401595855164658], [98.91124341175413, 23.397903378238368], [98.91075580024005, 23.397982953850317], [98.90758244167642, 23.397814590870723], [98.88762005172407, 23.39453310232085], [98.86879500198779, 23.38949541318283], [98.85097676036924, 23.388517038930274], [98.84507124434253, 23.390349786213733], [98.85453170577364, 23.395080016929285], [98.86273542759795, 23.41094054596948], [98.86355741873996, 23.4146395034104], [98.86464963007643, 23.413401663056334], [98.87995401566536, 23.42888690770468], [98.88846719510502, 23.437500690704383], [98.89887889104807, 23.441609638274258], [98.90052625298426, 23.442371169793716]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
