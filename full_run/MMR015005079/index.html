
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Huong Put</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Huong Put</div><div class="name-mm">ဟုန်းပွတ်</div></div>
        <span class="pcode-badge">MMR015005079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.90252024871057, 22.529991239204378], [98.91545399710435, 22.524190073313264], [98.92005572998801, 22.524190073313264], [98.9258078963174, 22.52471299670748], [98.9348863734075, 22.527558490332126], [98.9349274526399, 22.52639587556928], [98.92823828087205, 22.505770931683173], [98.9241358947558, 22.49838663523508], [98.91987681796081, 22.490720296104826], [98.90789205307584, 22.46702948242472], [98.90765345214515, 22.457246854159052], [98.90526399843486, 22.457043495860717], [98.8973465218246, 22.457043495860717], [98.89041873113956, 22.46021048722423], [98.88843936198703, 22.465950655698236], [98.88539530075258, 22.473893135260028], [98.8801260128053, 22.47564956427601], [98.87237871400652, 22.47408682224909], [98.86132200900357, 22.4798062388669], [98.85773751277605, 22.483252761106087], [98.8602317078271, 22.488490571882437], [98.86783406289175, 22.493856939845955], [98.87444619693451, 22.498524328634915], [98.88475866887751, 22.502147629709384], [98.89005426289395, 22.506328362064323], [98.89797531790663, 22.518558415238715], [98.8981802913874, 22.520034405063768], [98.90252024871057, 22.529991239204378]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
