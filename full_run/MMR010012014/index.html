
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Zin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabeikkyin</div><div class="name-mm">သပိတ်ကျင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Zin Kone</div><div class="name-mm">ဆယ်ဇင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010012014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.98445325771172, 23.28934845696574], [95.9850573826921, 23.295594341205913], [95.98562845309067, 23.29864005089769], [95.98677059478717, 23.303208615884955], [95.9882934491834, 23.31101324826284], [95.99191023017306, 23.32034073503695], [95.99555080542541, 23.33090554235696], [96.00662136358511, 23.32988436577091], [96.01065871702622, 23.328432708902426], [96.01325038869453, 23.328062469707277], [96.01707618831551, 23.327527680657965], [96.02040833657554, 23.326704927790217], [96.02489233921017, 23.325676487380065], [96.02649670635799, 23.324772133627107], [96.03218252070684, 23.324772133627107], [96.04432407069936, 23.324772133627107], [96.05454853408764, 23.324772133627107], [96.06605105461256, 23.32924533720262], [96.05774367872783, 23.319659903281945], [96.05646562069188, 23.310713497030292], [96.05599438223499, 23.305058628353095], [96.0558265921236, 23.303045149713967], [96.0583827081955, 23.29473777382924], [96.05916920939154, 23.293951271733874], [96.06349493943998, 23.28962554168544], [96.05454853408764, 23.285791369376227], [96.04368504213107, 23.28387428187267], [96.03282155017445, 23.28387428187267], [96.02643126089401, 23.28515233990862], [96.01492874036916, 23.287069427412177], [95.99959204483707, 23.28643039794457], [95.99322763984378, 23.287074459119026], [95.98445325771172, 23.28934845696574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
