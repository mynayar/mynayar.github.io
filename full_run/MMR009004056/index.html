
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Tar</div><div class="name-mm">စစ်တား</div></div>
        <span class="pcode-badge">MMR009004056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56334631937722, 19.8629999097181], [95.56816098743968, 19.857853195768428], [95.58258967617269, 19.850638851401925], [95.58478534576716, 19.85189351987009], [95.58472429708871, 19.852442963372084], [95.58980402143851, 19.8465611777562], [95.59325436040046, 19.8465611777562], [95.59890036805757, 19.84718851243997], [95.60459264043806, 19.847757740127633], [95.60612451503442, 19.84502224797842], [95.60906514524032, 19.828848786342462], [95.60860448640796, 19.815489690996515], [95.60857503990621, 19.814635743344923], [95.60822056312855, 19.81363139127575], [95.60556403685086, 19.814497649746784], [95.60326689764929, 19.814880506430256], [95.59063263608732, 19.817177644732567], [95.57761551784193, 19.815263363113786], [95.56421554291302, 19.814880506430256], [95.56153554792724, 19.822920491387606], [95.54736986143001, 19.822920491387606], [95.54736986143001, 19.82560048637339], [95.5500498564158, 19.83134333302843], [95.549666998833, 19.83593760963305], [95.54698700384722, 19.843211882122716], [95.54622129137954, 19.850869010396536], [95.549666998833, 19.856229000368103], [95.54897578800228, 19.858648241423225], [95.54996829240281, 19.858794196894735], [95.56000564104755, 19.860362532704755], [95.56334631937722, 19.8629999097181]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
