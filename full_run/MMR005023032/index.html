
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Tat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Tat</div><div class="name-mm">နန်းတပ်</div></div>
        <span class="pcode-badge">MMR005023032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56928279996129, 24.440311890281578], [95.58032220020942, 24.424682579637363], [95.58447263980054, 24.40887452963591], [95.58172620020406, 24.395874029962556], [95.57287596025742, 24.389526329876276], [95.5576782000889, 24.382690469689464], [95.5363158004339, 24.372314459744587], [95.53200876009623, 24.360931889894857], [95.53021026888888, 24.355692260689352], [95.51998317138629, 24.36436306160607], [95.51998317138629, 24.366514263322642], [95.51976118812837, 24.366647816243756], [95.5173152327119, 24.36947661035731], [95.51375798144574, 24.367920312872172], [95.5132258741748, 24.366904983678126], [95.50750715992757, 24.372314459744587], [95.49987804013949, 24.373718279874765], [95.48547372033596, 24.379882830328427], [95.47650143968974, 24.394287150131902], [95.47308360042786, 24.40332026991456], [95.47068312012993, 24.40770578959058], [95.47028892029749, 24.408425790417937], [95.46990983986728, 24.409118610135806], [95.48608392023681, 24.414306659624685], [95.50811771955716, 24.422485320041517], [95.5322877603719, 24.43432617001679], [95.54608151964646, 24.439514129573467], [95.55321528026104, 24.44001407978601], [95.56928279996129, 24.440311890281578]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
