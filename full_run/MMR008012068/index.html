
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Kan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Kan Gyi</div><div class="name-mm">ချောင်းကမ်းကြီး</div></div>
        <span class="pcode-badge">MMR008012068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68327048434543, 18.492077776768042], [95.68075876690364, 18.48203090790014], [95.67730515620804, 18.479205227239504], [95.67730515620804, 18.477321438933302], [95.66568846405141, 18.476693509797713], [95.66061672658071, 18.475679161763935], [95.65852126304588, 18.48244804584067], [95.64914126755554, 18.479263479026372], [95.64821484893616, 18.480768910856625], [95.64501912513259, 18.48454262624125], [95.63161246194562, 18.496819881232568], [95.63302037309182, 18.499082589889667], [95.63443926226222, 18.49954044463584], [95.6349084169899, 18.500447882164053], [95.6420037963382, 18.501836217767277], [95.64247296095846, 18.502740600298523], [95.64484554518583, 18.501847944926794], [95.64721462475518, 18.501405733887566], [95.6529805866848, 18.505561085575664], [95.65722413668465, 18.507164206263155], [95.65939306313942, 18.508107215575592], [95.6604439443326, 18.507337538896365], [95.66474656989834, 18.50149671560098], [95.67102586305322, 18.496159316599233], [95.67573533291932, 18.498043104905435], [95.68327048434543, 18.492077776768042]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
