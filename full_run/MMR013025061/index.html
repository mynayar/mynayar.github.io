
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Ga Ra</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Ga Ra</div><div class="name-mm">သာဂရ</div></div>
        <span class="pcode-badge">MMR013025061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.68417364000152, 16.68559949961724], [96.68293884025536, 16.682543999905704], [96.6810333603014, 16.679581470308676], [96.6771950403189, 16.672199039953796], [96.67397412020955, 16.670717459942864], [96.6716290804178, 16.66869992985795], [96.6620693527185, 16.662497841702077], [96.66017380038062, 16.663603580640768], [96.65995489460278, 16.668857333699066], [96.65929817457118, 16.674111088555946], [96.65731550400739, 16.679300417780098], [96.65800622111027, 16.67937953923439], [96.65839549085928, 16.67938813225652], [96.65952787581085, 16.679303620265898], [96.6604710317128, 16.67937250563665], [96.660771605825, 16.679452816894013], [96.66156171779909, 16.679708373642598], [96.66209207498935, 16.680074191770586], [96.66210010683454, 16.680818363676565], [96.661599651203, 16.681622939447152], [96.66258177203122, 16.684180783116688], [96.66017380038062, 16.687245471201607], [96.65797383742273, 16.687819375363915], [96.65947151979486, 16.689255209560315], [96.67306332011617, 16.688558879788502], [96.67715399975737, 16.688737799909575], [96.68100132015485, 16.68892913966812], [96.68417364000152, 16.68559949961724]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
