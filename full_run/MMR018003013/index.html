
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Thun Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Thun Khin</div><div class="name-mm">ကြက်သွန်ခင်း</div></div>
        <span class="pcode-badge">MMR018003013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.28021176925779, 20.218861612773253], [96.26399537758465, 20.211742220627002], [96.23947303005633, 20.203436264771824], [96.23904831173024, 20.203476082255463], [96.23402818994907, 20.20394671816655], [96.22681633400668, 20.204622830279447], [96.21508751617597, 20.210194018838934], [96.21366626718452, 20.210869112019964], [96.21099546506872, 20.212137743362234], [96.20348055198593, 20.214115351642192], [96.18794136779997, 20.221991734630876], [96.19012163470575, 20.229778400352927], [96.19603950022281, 20.229778400352927], [96.20476056424872, 20.229778400352927], [96.20849816286, 20.229155466951283], [96.21535042758023, 20.226352266643858], [96.22407149160614, 20.22697520094482], [96.230300823824, 20.230089866154458], [96.23235363880946, 20.22479443941188], [96.23512229076118, 20.220839221053268], [96.24580137763155, 20.220443699217412], [96.25410733438605, 20.220443699217412], [96.25924911735297, 20.218861612773253], [96.26755507320814, 20.217675047265686], [96.28021176925779, 20.218861612773253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
