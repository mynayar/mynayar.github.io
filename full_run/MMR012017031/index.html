
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Da Nar Myaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gwa</div><div class="name-mm">ဂွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ya Da Nar Myaing</div><div class="name-mm">ရတနာမြိုင်</div></div>
        <span class="pcode-badge">MMR012017031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.50144175903, 17.954806664296143], [94.50192932288002, 17.95142080582559], [94.50260767160682, 17.94712144839616], [94.50262073965547, 17.943967264277887], [94.50321767005948, 17.942894160836886], [94.50260732986442, 17.94058359115985], [94.50185758935635, 17.93804600741737], [94.50237664116912, 17.936834886820634], [94.50918197926501, 17.93706557641525], [94.51397962765776, 17.93792229937469], [94.51467592055735, 17.937641499555582], [94.51688506199605, 17.93599023186374], [94.51881693075683, 17.934417108962464], [94.52140461932777, 17.931347013254083], [94.51949614193347, 17.930317638448287], [94.51398996626398, 17.929997284647015], [94.51057271515873, 17.929842211848666], [94.50771245016949, 17.928229483703774], [94.5044573783054, 17.924803169230927], [94.50025672416854, 17.921747407816667], [94.49800105360578, 17.924308039384584], [94.49687090616743, 17.925315873628733], [94.49284133995593, 17.93134164879808], [94.49427448158212, 17.93251142756037], [94.49205208773373, 17.9390682730824], [94.49227688766831, 17.943244730959634], [94.49440410086862, 17.947951537933193], [94.49632942436352, 17.95120659001219], [94.49634470474439, 17.953023070358483], [94.4993305249838, 17.953986958331484], [94.50144175903, 17.954806664296143]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
