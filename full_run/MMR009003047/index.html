
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit To Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit To Kan</div><div class="name-mm">သစ်တိုကန်</div></div>
        <span class="pcode-badge">MMR009003047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99174106879536, 20.76866992477727], [94.97514080420478, 20.76808403265204], [94.94854068820229, 20.764658259571092], [94.9440786056432, 20.764020820104804], [94.94289823916245, 20.763852196321864], [94.93463608208958, 20.766471904354944], [94.93100879432046, 20.76808403265204], [94.93129051774326, 20.768498334130868], [94.93443456560277, 20.773121933130767], [94.93866640283227, 20.777958318022], [94.9412861108654, 20.785414410946373], [94.94471188394635, 20.795087179829522], [94.94481278967856, 20.79690348840529], [94.9451149160206, 20.802341757166403], [94.94491340043317, 20.809596333603963], [94.94549863785193, 20.81125450898844], [94.94692855990519, 20.81020088216502], [94.95801194059862, 20.806170562321654], [94.97332715942093, 20.802543272753894], [94.98118628441955, 20.801535693017854], [94.99126208627632, 20.799722049133322], [94.9967030188293, 20.79669930902594], [94.99791211505215, 20.791258375573648], [94.9983633346003, 20.789453493783753], [94.99811363063958, 20.78944473168906], [94.9938817943094, 20.78521289535888], [94.9928742136741, 20.77594315765066], [94.99228731700612, 20.768704760916023], [94.99226966601236, 20.768688581213098], [94.99174106879536, 20.76866992477727]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
