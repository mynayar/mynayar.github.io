
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpan Khar Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpan Khar Pin</div><div class="name-mm">ဖန်ခါးပင်</div></div>
        <span class="pcode-badge">MMR008013035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36208862868733, 18.346611778410875], [95.35749377921462, 18.339345503592142], [95.35152558583718, 18.327409115937996], [95.3462075393465, 18.320318386984013], [95.34425185024276, 18.317710800912778], [95.3380971500635, 18.318643331324722], [95.33100992037157, 18.322746464777595], [95.32522823199736, 18.329647188566923], [95.32205762895649, 18.335615381944365], [95.3127323257363, 18.342329599831203], [95.31291883163885, 18.34848430001051], [95.3104942540067, 18.355758035604936], [95.30781141266664, 18.363135847941066], [95.30820660804858, 18.363164689199095], [95.31761988924654, 18.36391524539232], [95.3180810373101, 18.363952014174174], [95.3318036143454, 18.359568412752083], [95.33830565158462, 18.35895884597403], [95.33899057075831, 18.35838513156864], [95.33947525767707, 18.356580953048592], [95.34231344520941, 18.3565994242241], [95.35254574528994, 18.354827354199074], [95.3614352289527, 18.34712313382562], [95.36208862868733, 18.346611778410875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
