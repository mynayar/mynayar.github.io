
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyaunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyaunt</div><div class="name-mm">ချောင်းဖြောင့်</div></div>
        <span class="pcode-badge">MMR008002026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65765591378943, 18.92449876560562], [95.66642180901931, 18.9232696198971], [95.67816809078482, 18.922834571957992], [95.68291131490531, 18.921584508018668], [95.682051107073, 18.91412937197299], [95.69946392981655, 18.91122723544862], [95.70817034208767, 18.91412937197299], [95.7125235482232, 18.91412937197299], [95.71322034834049, 18.90768935737799], [95.71835655641001, 18.90302007731475], [95.71041878030252, 18.894615373200963], [95.70357336931562, 18.89417373413056], [95.70002699265166, 18.89762426195017], [95.69665930228501, 18.900751402555215], [95.69256996443238, 18.902074423995543], [95.68667650561628, 18.902916346811992], [95.68306826728679, 18.901352775610178], [95.6794600271586, 18.89762426195017], [95.6770545340396, 18.895820141886077], [95.67464904092054, 18.895459317693394], [95.67296519618691, 18.89762426195017], [95.66827448527931, 18.89858645919776], [95.66755283689395, 18.900510853692992], [95.66767311132509, 18.903517719866954], [95.66466624515112, 18.906163761848177], [95.65985525891313, 18.904720465976766], [95.65802853708738, 18.904809575301726], [95.65816784836755, 18.906899240007988], [95.65765591378943, 18.92449876560562]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
