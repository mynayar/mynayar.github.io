
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Gyi</div><div class="name-mm">ကိုင်းကြီး</div></div>
        <span class="pcode-badge">MMR008010039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8066863750762, 18.179497153171155], [95.79753120470139, 18.18540371421011], [95.79369194133011, 18.186880354244977], [95.78896669195933, 18.186585025878287], [95.77984243128321, 18.19141983156004], [95.78025991276485, 18.19517716669293], [95.78485221086089, 18.19976946478903], [95.78359976641616, 18.20185687309629], [95.79027947281946, 18.206449172091652], [95.78902702837473, 18.218556139554266], [95.78860954599384, 18.225653328338467], [95.79808959106185, 18.233026696225124], [95.80489133097018, 18.222730956168732], [95.81031859202943, 18.220226066379894], [95.81535506888139, 18.22349977579404], [95.815546216185, 18.218480455308793], [95.8202714646564, 18.215822502706374], [95.82263408889213, 18.210211270034108], [95.82352007309294, 18.208734629999242], [95.83828647614001, 18.20696266069831], [95.84183041204392, 18.212278565903148], [95.84566967721389, 18.21109725423497], [95.84330705297816, 18.20194208475948], [95.8453743488472, 18.196330852087215], [95.82204343305807, 18.187175681712404], [95.8066863750762, 18.179497153171155]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
