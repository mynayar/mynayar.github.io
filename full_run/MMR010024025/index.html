
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Shwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Shwe</div><div class="name-mm">ညောင်ရွှေ</div></div>
        <span class="pcode-badge">MMR010024025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0235402220037, 20.65998909572022], [96.02872696118038, 20.653710413205033], [96.03565843728711, 20.643746415964358], [96.04042382699805, 20.637248156777048], [96.04475599889031, 20.629450245932162], [96.04724848163215, 20.623357509941172], [96.04302313031326, 20.62511807403996], [96.0373913058641, 20.62511807403996], [96.02786052644223, 20.62511807403996], [96.01746331228208, 20.62555129095938], [96.01206475758255, 20.625351344688852], [96.00966540143719, 20.628150595173906], [96.00230070841104, 20.628150595173906], [95.99493601538484, 20.6298834637509], [95.99147027643215, 20.632915983985527], [95.99796853472014, 20.63681493985763], [96.00143427277351, 20.64331319904494], [96.00143427277351, 20.65197754372872], [96.01139827001418, 20.65630971562092], [96.0235402220037, 20.65998909572022]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
