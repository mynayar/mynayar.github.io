
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Hnyin Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gon Hnyin Tan</div><div class="name-mm">ဂုံညင်းတန်း</div></div>
        <span class="pcode-badge">MMR013005043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9136372682454, 17.539688079441362], [95.91307415324962, 17.540673531358436], [95.90735909384716, 17.54099103430883], [95.9054540743461, 17.539721020708612], [95.90323155189469, 17.53749849825715], [95.89751649339149, 17.539721020708612], [95.89592897594156, 17.547658602562535], [95.89370645438942, 17.547658602562535], [95.88824542019006, 17.54843875094764], [95.88671433969506, 17.555328610926722], [95.88516267102051, 17.557526809414753], [95.89111073577192, 17.55946639615729], [95.89938630533379, 17.561535288322943], [95.9055929818307, 17.563604179589277], [95.91037729507616, 17.565026543740032], [95.91399785681568, 17.565802378077308], [95.91658397157306, 17.56696612958325], [95.92201481463206, 17.559337089834855], [95.92110967397235, 17.550027075089474], [95.91710119506416, 17.546923735941732], [95.91529091464406, 17.543173868779093], [95.91425646766191, 17.539811918785063], [95.9136372682454, 17.539688079441362]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
