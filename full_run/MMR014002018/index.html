
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Pyoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Pyoe</div><div class="name-mm">မိုင်းပျိုး</div></div>
        <span class="pcode-badge">MMR014002018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.87295960270359, 20.443198945974643], [96.87265395821368, 20.44467622992414], [96.88123035729524, 20.43871003933691], [96.89987470175612, 20.437964265738344], [96.9027411891546, 20.4380837029006], [96.91742906969586, 20.43869569784823], [96.9345531839823, 20.43013364115467], [96.94126514906742, 20.423794562868807], [96.94536690475888, 20.415963938285188], [96.94835000005253, 20.39731959292493], [96.9488908910019, 20.39587721705999], [96.94835000005253, 20.395828044828477], [96.92858699429439, 20.400302688218517], [96.90099336305332, 20.39955691372063], [96.893820407286, 20.402757155718234], [96.87675571390514, 20.410370633597893], [96.87265395821368, 20.41708259868301], [96.87332379755526, 20.422106402288705], [96.87489127900938, 20.43386251004688], [96.87295960270359, 20.443198945974643]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
