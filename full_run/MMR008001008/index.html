
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Khwet Sauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Khwet Sauk</div><div class="name-mm">သခွက်စောက်</div></div>
        <span class="pcode-badge">MMR008001008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33520497982602, 18.90767504107032], [95.33187197181411, 18.904527199870415], [95.32687245979622, 18.900453523711178], [95.32409495311964, 18.898416686081248], [95.32400960475951, 18.901920141701225], [95.32243219389068, 18.903891906186573], [95.32046043030465, 18.90560076826091], [95.31756851007873, 18.9063894736953], [95.31296772777847, 18.907572531846938], [95.3086298469899, 18.90875558999852], [95.30508067163572, 18.910990255995557], [95.30468631891853, 18.913487822604964], [95.3090241997071, 18.9151966846793], [95.31060161057593, 18.915722488602], [95.31191611993307, 18.91611684221857], [95.3149394913645, 18.914670881655923], [95.31927737215307, 18.913750725015973], [95.3233523496313, 18.91401362742704], [95.32729587770262, 18.91545958709031], [95.32861038705977, 18.91598539101301], [95.3305821506458, 18.914539431349738], [95.33465712992268, 18.910595903278363], [95.33520497982602, 18.90767504107032]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
