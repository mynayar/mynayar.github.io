
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mohnyin</div><div class="name-mm">မိုးညှင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Yin</div><div class="name-mm">နန့်ရင်း</div></div>
        <span class="pcode-badge">MMR001007037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58807504582677, 25.037124450732847], [96.58972765980371, 25.03655802713132], [96.59517854695241, 25.036103793055645], [96.59716129665657, 25.03474914066038], [96.60089982156956, 25.035170866042677], [96.6011250738631, 25.03519627638707], [96.60162162823559, 25.037904739412227], [96.60410118142443, 25.037000656355247], [96.60508918831545, 25.03474235527551], [96.60756492568083, 25.033388138152077], [96.6115282190521, 25.03248028064047], [96.61277023675706, 25.03256633137113], [96.61157833017586, 25.030986771122627], [96.61099047303196, 25.030581802808], [96.59018645883805, 25.016250149125142], [96.58712859570818, 25.012458398736158], [96.56882994974245, 24.989768078134375], [96.56059988137946, 24.981538008872064], [96.55601604500453, 24.986351036571136], [96.54999607765694, 24.99514945128618], [96.54491066059859, 25.002581983771563], [96.53599755534299, 25.005417971562167], [96.55037808987703, 25.012920858910547], [96.56926880001515, 25.021691545728288], [96.58208749634093, 25.031136901247066], [96.58579509177014, 25.034844496676214], [96.58645054375762, 25.035499948663755], [96.58807504582677, 25.037124450732847]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
