
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Yin (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">U Yin (North) Ward</div><div class="name-mm">ဥယျာဉ်မြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46506869275635, 17.64973857649295], [95.46469699601539, 17.649492523720653], [95.46424965734639, 17.64903566720767], [95.46392605064955, 17.648502667942353], [95.46351678335662, 17.647931597300897], [95.46325028372394, 17.647836418860663], [95.4631551052837, 17.64764606198014], [95.46328835510002, 17.64705595565067], [95.46325980156786, 17.646161278312604], [95.46325980156786, 17.64566635042337], [95.46337401569633, 17.64526660097431], [95.46354533688861, 17.644762155241153], [95.46373724896824, 17.643279198262576], [95.46270407466034, 17.643740615914624], [95.46100794836849, 17.644691474593515], [95.45967160644142, 17.64577082768841], [95.45825816786476, 17.647569749513252], [95.45750727743246, 17.648529268515972], [95.45855171345721, 17.648961448940042], [95.46026492538135, 17.64958962664565], [95.46226367262625, 17.650003652860562], [95.46367707246378, 17.650303464947342], [95.46458791878979, 17.650558946233957], [95.46506869275635, 17.64973857649295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
