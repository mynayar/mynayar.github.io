
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Ta Loke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Ta Loke</div><div class="name-mm">အိုင်တလုပ်</div></div>
        <span class="pcode-badge">MMR008008038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4349569852767, 17.717016631612296], [95.4320414398606, 17.72058672789524], [95.4300880943901, 17.73152489865521], [95.43165048658074, 17.73972857371473], [95.44102554569241, 17.7471510688668], [95.44284289478384, 17.74880333120882], [95.44574387657872, 17.751440789161165], [95.44961933316574, 17.754964201636653], [95.45665058185892, 17.763167961232455], [95.467237561964, 17.769816129310982], [95.4725085118584, 17.763423849830872], [95.4772993577792, 17.758633003910063], [95.4807594139159, 17.753842157989254], [95.4807594139159, 17.75304368321946], [95.48262252141228, 17.74984978593892], [95.4867065253859, 17.744286087832734], [95.48342099528276, 17.74303445727446], [95.4766297603552, 17.74065752482494], [95.47221545787716, 17.73590366082533], [95.47493195184813, 17.730810235304148], [95.47595063731211, 17.72198163124733], [95.47561107489128, 17.72062338426184], [95.47085721089161, 17.71552995784134], [95.46529579166753, 17.71359443693376], [95.44290002241814, 17.70729035126874], [95.4349569852767, 17.717016631612296]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
