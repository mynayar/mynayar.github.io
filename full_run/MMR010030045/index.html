
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bu Yon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bu Yon</div><div class="name-mm">ဘူးရုံ</div></div>
        <span class="pcode-badge">MMR010030045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97906702192557, 20.902760490304445], [95.97529104384665, 20.90307515409512], [95.97418587957475, 20.903382143970816], [95.97529104384665, 20.905592473413947], [95.97623503881607, 20.915032417711984], [95.97371772039656, 20.920067054550998], [95.970885737287, 20.924472362009965], [95.96257972657321, 20.93117713881395], [95.96517968369551, 20.934657355052934], [95.96912864996727, 20.933709635091645], [95.9720583030483, 20.937811499601082], [95.97193559774968, 20.94320586885584], [95.97466850344875, 20.947031020964914], [95.98441632435396, 20.953421526082593], [95.99448559803199, 20.953421526082593], [95.9982615761109, 20.95216286642318], [96.00329621294992, 20.94303758681525], [96.00486953729938, 20.935485630657354], [96.00486953729938, 20.931709652578434], [96.00014956515037, 20.931709652578434], [95.99794691142091, 20.929192334158927], [95.99794691142091, 20.92510169228933], [95.9968897772415, 20.922987422131882], [95.99511492831135, 20.91943772517095], [95.99417093424125, 20.914088422742566], [95.99385626865194, 20.908424455624186], [95.99322693927189, 20.903389818785172], [95.99230302976105, 20.903389818785172], [95.98976562588297, 20.903389818785172], [95.98693364277347, 20.903389818785172], [95.98347233028386, 20.902760490304445], [95.97906702192557, 20.902760490304445]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
