
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Hnyin Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gon Hnyin Tan</div><div class="name-mm">ဂုံညင်းတန်း</div></div>
        <span class="pcode-badge">MMR008010022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74027255263627, 18.02965029092826], [95.73951547635818, 18.028766966022715], [95.73773426022797, 18.02668871820981], [95.73246077514472, 18.023465771927874], [95.73278384939522, 18.028584046616515], [95.73187844073749, 18.032205675851287], [95.73070716910064, 18.036466598954405], [95.72786903372901, 18.03826332119536], [95.72479015524152, 18.043331500048737], [95.7235168267402, 18.048424812255348], [95.72278683984086, 18.051636752634067], [95.73523706234062, 18.053296094439247], [95.74640968815663, 18.05523915886016], [95.75515348074862, 18.05791087378782], [95.76275894476953, 18.060092475287547], [95.76243997592422, 18.054510510152], [95.76171132631674, 18.048924196794303], [95.76195420981901, 18.047709781081608], [95.7651433856588, 18.0463357482962], [95.76263689777466, 18.03899458333342], [95.75707040277695, 18.037822541876835], [95.74655875618168, 18.036129810942043], [95.74635364690334, 18.03593988132053], [95.7430076949492, 18.032841538805997], [95.74027255263627, 18.02965029092826]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
