
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaung Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaung Gyi</div><div class="name-mm">ကောင်းကြီး</div></div>
        <span class="pcode-badge">MMR009011043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.40517484684176, 20.331498537027926], [94.40969366583005, 20.324803962133217], [94.41258830020996, 20.32530734685662], [94.41504905576937, 20.33066186805081], [94.41655524303007, 20.333005020165615], [94.41856645897496, 20.332430399243606], [94.41856365129155, 20.32831879507637], [94.41722493398356, 20.320117825177533], [94.41722499963407, 20.316603134327238], [94.41237162025413, 20.314929388980147], [94.40902453155695, 20.31007571192464], [94.40651427641279, 20.303213651788667], [94.40467342084173, 20.298192633383394], [94.40099162066684, 20.2930042169711], [94.400646370034, 20.288144629571036], [94.39044816595015, 20.28497045622163], [94.38827253415019, 20.28312939020924], [94.38894207311824, 20.277606315379217], [94.37674564289716, 20.277427505874755], [94.34871142209454, 20.272011803801774], [94.34104300193303, 20.27053710810111], [94.33668299242623, 20.26969864497653], [94.33214574632916, 20.285710343757387], [94.33533145258451, 20.291444616276067], [94.33119003409286, 20.307054579805083], [94.34839285074952, 20.307691721595745], [94.39458560134449, 20.3223459728884], [94.40517484684176, 20.331498537027926]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
