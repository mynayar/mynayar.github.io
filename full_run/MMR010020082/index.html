
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Hlar (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Hlar (North)</div><div class="name-mm">အိုင်လျား (မြောက်)</div></div>
        <span class="pcode-badge">MMR010020082</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21049269568141, 20.703875675222264], [95.20499336385274, 20.702157133744777], [95.199494032024, 20.70181342634862], [95.19124503383131, 20.700094883971758], [95.1847145771161, 20.697001510211578], [95.17887153699189, 20.69493926133788], [95.17234108027668, 20.69287701066554], [95.16340466459366, 20.691158470087373], [95.15515566730028, 20.69081476089258], [95.14965633457223, 20.69081476089258], [95.14690666910758, 20.696314093620572], [95.14690666910758, 20.700094883971758], [95.14759408479921, 20.705937924995283], [95.14805369502204, 20.706213691308847], [95.15274970923173, 20.709031298755463], [95.15687420787845, 20.711437256824013], [95.16131663395555, 20.714152072660056], [95.1630609571975, 20.71521804807452], [95.1689039973217, 20.720373670708398], [95.17337220516322, 20.72484187944923], [95.18059007757006, 20.72484187944923], [95.18918278405829, 20.723467046267217], [95.198806615433, 20.723467046267217], [95.20293111497904, 20.722092213085205], [95.20636819703475, 20.71624917206168], [95.20816138314137, 20.711093764365785], [95.20911786339872, 20.708343883063776], [95.21071347204918, 20.70395595680202], [95.21049269568141, 20.703875675222264]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
