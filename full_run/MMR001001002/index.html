
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Nang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Nang</div><div class="name-mm">နောင်နန်း</div></div>
        <span class="pcode-badge">MMR001001002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.4987829469755, 25.56285137529079], [97.49735785428163, 25.559489617751694], [97.49634414296787, 25.55315392271541], [97.49330300992602, 25.543270239430058], [97.48756949013989, 25.527990221871278], [97.4862677700416, 25.525291282666615], [97.48605127714478, 25.524842413946317], [97.48506575867788, 25.523230879201776], [97.48302624196754, 25.519895827030837], [97.48251584343149, 25.519669410115227], [97.48253552779244, 25.51973182126659], [97.4587445422269, 25.53093677231425], [97.44027273270052, 25.54611004394343], [97.43641886973512, 25.549275716900866], [97.43385513280822, 25.554745022165093], [97.42445868871755, 25.5747907702779], [97.41917519777724, 25.582539891103124], [97.4265477077106, 25.581925514750765], [97.44203435799926, 25.575969110586016], [97.48372918625302, 25.564056303155894], [97.4987829469755, 25.56285137529079]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
