
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Sut Khar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Sut Khar</div><div class="name-mm">နောင်ဆွတ်ခါး</div></div>
        <span class="pcode-badge">MMR005034022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75122493288438, 24.36448419758767], [94.75212230070366, 24.369644065021646], [94.75249579904192, 24.371791680241927], [94.74952147303759, 24.40272467320517], [94.74212325418489, 24.41561871113464], [94.72870118920855, 24.439011452616512], [94.70769299473596, 24.45555740714866], [94.75046830536803, 24.462051372972553], [94.75388774002727, 24.456189553205377], [94.7551196169768, 24.45150867458574], [94.75437692895218, 24.4448437071714], [94.75404209696524, 24.44183888425715], [94.75034702909215, 24.432415410143108], [94.74924581644132, 24.4251495768915], [94.74835755335846, 24.417917198420014], [94.74961982019857, 24.41743984187525], [94.75182835189696, 24.41660462710189], [94.76420499276628, 24.40784094420428], [94.77141098422959, 24.401004503954766], [94.77381308240791, 24.39453751509427], [94.77473710883055, 24.38622276926543], [94.77418295198169, 24.380494809088248], [94.77333159437762, 24.37623731240211], [94.77210410162303, 24.3753147662635], [94.77017008887856, 24.372586766366226], [94.7677206557837, 24.371656011215975], [94.7657793396449, 24.369375307124756], [94.76431005516497, 24.368909360278792], [94.75122493288438, 24.36448419758767]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
