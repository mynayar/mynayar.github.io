
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Aw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Aw</div><div class="name-mm">နားအော်</div></div>
        <span class="pcode-badge">MMR015012056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.2620495493473, 22.466469722799502], [97.26797952513505, 22.461651631018015], [97.26993278696858, 22.457354539880157], [97.2687611070395, 22.448369604873392], [97.26876128510526, 22.44094728778714], [97.27266775301445, 22.43469699596966], [97.27657423081615, 22.428056055742445], [97.280090076396, 22.421415107421296], [97.28829342859893, 22.417899441705913], [97.30118441063212, 22.412430632867483], [97.30704401986566, 22.40696167833886], [97.3109508160274, 22.38703869398057], [97.31364342400485, 22.377278476820322], [97.31720146667442, 22.364381219317863], [97.31986217300096, 22.349558687783258], [97.30985728538548, 22.344686205903713], [97.30628353605641, 22.358623827028055], [97.29871648477803, 22.37303725696387], [97.28286171229826, 22.3979004241653], [97.27097063158942, 22.40871049729168], [97.25547619407115, 22.415917211809926], [97.2370990705657, 22.419880905379557], [97.23169174028163, 22.417878189826638], [97.23785100362096, 22.436355983441956], [97.2375093970411, 22.45958531271208], [97.24141652415335, 22.463213674271685], [97.24493202259481, 22.47102671171342], [97.25430714016244, 22.472980148015495], [97.26172929267278, 22.466729929942346], [97.2620495493473, 22.466469722799502]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
