
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Taw</div><div class="name-mm">ရုံးတော</div></div>
        <span class="pcode-badge">MMR009005026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26895604358663, 20.143657306739385], [95.27067078362984, 20.140851368895596], [95.2813057371701, 20.13659738765938], [95.28632410617263, 20.136211359966353], [95.28632410617263, 20.13000593172842], [95.28853972093145, 20.127236412830257], [95.29186314396895, 20.11837395199632], [95.29238808634119, 20.10840006311247], [95.28355458727447, 20.10729587640361], [95.27579993292062, 20.107849779643686], [95.26582966470733, 20.11061929944117], [95.25475158911462, 20.11172710682058], [95.25458234030282, 20.111303985690427], [95.25419768497522, 20.11172710682058], [95.25087426193772, 20.114496625718743], [95.25142816607706, 20.123359086552625], [95.24843748859928, 20.13133422679317], [95.2482420749119, 20.131855329959535], [95.2481047430395, 20.132221548285884], [95.25641329973405, 20.138314490221603], [95.26582966470733, 20.14219181559986], [95.26895604358663, 20.143657306739385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
