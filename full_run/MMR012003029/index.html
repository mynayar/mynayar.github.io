
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Zar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mrauk-U</div><div class="name-mm">မြောက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Zar</div><div class="name-mm">ဇီးဇာ</div></div>
        <span class="pcode-badge">MMR012003029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.23125630733279, 20.473159361715204], [93.22912287532051, 20.46569529360295], [93.22572708203927, 20.46556639827071], [93.22635407587995, 20.46731723979883], [93.22726778887744, 20.46885913014478], [93.22726778887744, 20.46954441534257], [93.22772464537616, 20.471600269137184], [93.22772464537616, 20.47377033773097], [93.22601143328109, 20.47496958637737], [93.22475507768473, 20.47576908457563], [93.22355582993765, 20.478510223568037], [93.22292765168982, 20.48199375560739], [93.22287054473992, 20.48313589640452], [93.22230130715968, 20.4849654735778], [93.22199152219105, 20.485428279091877], [93.22275101494745, 20.486670867866337], [93.22338116181123, 20.48961886172117], [93.22383614772008, 20.491699006204215], [93.22861282662069, 20.49054727323812], [93.23334797303062, 20.489797166705955], [93.2355256328018, 20.489287427372915], [93.2339648333105, 20.48648945662319], [93.23324522728547, 20.47849019476672], [93.23125630733279, 20.473159361715204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
