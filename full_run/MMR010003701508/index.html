
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Aung Myay (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Har Aung Myay (West) Ward</div><div class="name-mm">မဟာအောင်မြေ (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07960397960001, 21.95932019898221], [96.07520170841346, 21.959427294112395], [96.07472341691627, 21.959287662407444], [96.07466666726549, 21.960442884323275], [96.07460323078458, 21.961734226419757], [96.07456302847365, 21.963011631031392], [96.0745436392551, 21.96395788021708], [96.07439818036192, 21.964666323274773], [96.07426710636568, 21.965015061140395], [96.07669551495896, 21.96506517289157], [96.07831024132453, 21.96492537704404], [96.078411352883, 21.96491662325373], [96.07999845022947, 21.96475493203725], [96.07960397960001, 21.95932019898221]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
