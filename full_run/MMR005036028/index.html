
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pon Nyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pon Nyo</div><div class="name-mm">ပုံညို</div></div>
        <span class="pcode-badge">MMR005036028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25567636017593, 26.260498080122375], [95.2570800004417, 26.259887700357126], [95.28387444015334, 26.23413086964399], [95.30925696044045, 26.21416580960448], [95.3093260796349, 26.214111360151207], [95.30871587973411, 26.213684040086434], [95.31628416038575, 26.20629882003459], [95.30010972028742, 26.19769283955293], [95.27392584020544, 26.191284210398067], [95.27331527967647, 26.19110105986607], [95.23352052015593, 26.189086949902844], [95.18212908019296, 26.1942749103589], [95.14648439963537, 26.200927709945915], [95.13304709564699, 26.202002717251673], [95.13930151355407, 26.208170883879234], [95.14010479160294, 26.208631377236316], [95.14255518697234, 26.2119101786119], [95.14102964809985, 26.214783979297238], [95.13442451797721, 26.215136584585764], [95.12846321700391, 26.220935373568693], [95.12273488540671, 26.22530674600955], [95.11727480898531, 26.229911115705477], [95.11393001625731, 26.23447898911411], [95.11724367355674, 26.241067127446], [95.12345295089301, 26.24689270093745], [95.12594348300541, 26.25207164029399], [95.12161868735262, 26.260457744629264], [95.12187533857605, 26.272802276104187], [95.12524389319117, 26.282006688857678], [95.12638134402386, 26.286437772685133], [95.17449959977677, 26.277099569589495], [95.22491472043805, 26.270690940434577], [95.25567636017593, 26.260498080122375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
