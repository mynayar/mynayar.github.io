
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (32) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (32) Ward</div><div class="name-mm">အမှတ် (၃၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1973041592596, 16.86048976399144], [96.19450939459296, 16.86028259526563], [96.19442367571213, 16.860776901332997], [96.19243812641844, 16.86171245616498], [96.1817516424839, 16.865703171565187], [96.18341636687188, 16.86623954801678], [96.18438911406645, 16.866731643550565], [96.18578338699376, 16.86748123207326], [96.18676312731651, 16.86803966070181], [96.18862851459431, 16.86898104314065], [96.191102982117, 16.870201111092456], [96.19336859288632, 16.871395513292327], [96.1959743245555, 16.866719356113435], [96.19698715183563, 16.864870707017587], [96.19704246643676, 16.86432456942339], [96.19719123858488, 16.86259078983312], [96.1973041592596, 16.86048976399144]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
