
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Yoe Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ah Yoe Kone Ward</div><div class="name-mm">အရိုးကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17664337109477, 16.796217918022535], [96.17568779015943, 16.79677200292565], [96.17531172425674, 16.796978314597595], [96.17490450493904, 16.797347640980888], [96.17472267191386, 16.797772090409694], [96.17452888510002, 16.79872245797509], [96.17411136674622, 16.798860549774588], [96.17371265681373, 16.79894799355509], [96.17376403778019, 16.799254989726023], [96.17399152129173, 16.799866994566173], [96.17437616942476, 16.799882253363364], [96.17551532537203, 16.800365749579726], [96.17584673543854, 16.79959424367945], [96.17606926008835, 16.79909324665607], [96.17624092088187, 16.798681259132877], [96.17638079333898, 16.798353195443667], [96.17658996575437, 16.797833443059005], [96.1767749787823, 16.797369956758132], [96.17677116385818, 16.79696083087771], [96.17676492166385, 16.796568957591376], [96.17664337109477, 16.796217918022535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
