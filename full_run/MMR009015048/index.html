
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dhamma Thaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dhamma Thaw</div><div class="name-mm">ဓမ္မသော်</div></div>
        <span class="pcode-badge">MMR009015048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1540943701591, 19.10484010868413], [95.15326820076689, 19.103187624209568], [95.15280111987585, 19.102253379689785], [95.14825121222373, 19.0931527621903], [95.14397957909438, 19.087782283425668], [95.14374807561325, 19.087958665659926], [95.13861522021631, 19.09145833963072], [95.1331343802475, 19.094769681175876], [95.13676771865534, 19.095950983850855], [95.13676184158578, 19.096668513341285], [95.12892282003219, 19.10412200992289], [95.12027100380385, 19.110070133130193], [95.10756364984263, 19.114396041244333], [95.11472029100867, 19.134138499292362], [95.11540435762504, 19.136025579117245], [95.11513398904242, 19.15143662609944], [95.11432288059655, 19.153599580156538], [95.1157287313959, 19.156957997613574], [95.1237140321769, 19.157605454628083], [95.12432654333537, 19.15765511788942], [95.12486728139999, 19.150355149070947], [95.1273006040397, 19.141432964259934], [95.13324872724701, 19.130077455909884], [95.14325238908657, 19.11899231794115], [95.15680335928766, 19.10995833840667], [95.15557529996016, 19.107802229988977], [95.1540943701591, 19.10484010868413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
