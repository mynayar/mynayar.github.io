
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Tan</div><div class="name-mm">တောတန်း</div></div>
        <span class="pcode-badge">MMR005010043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35563821792948, 22.488508712107432], [95.35174947835583, 22.488339636864794], [95.34964938241313, 22.49131477135967], [95.35052442096531, 22.49463992289418], [95.348774341163, 22.498490097739875], [95.35314953931982, 22.499715152432373], [95.35378600571966, 22.502442858251356], [95.34964938241313, 22.503390318308618], [95.34921023356549, 22.506399058669672], [95.34853332015666, 22.50639468706521], [95.34851064015396, 22.506530759886687], [95.3447266796926, 22.520507849557646], [95.34790044025317, 22.52911374010705], [95.34917958107286, 22.53225340107366], [95.35238307861624, 22.530251215221483], [95.36166745099212, 22.521618377386233], [95.36655396319492, 22.515428796102128], [95.37437232012655, 22.51206657001626], [95.37591564039457, 22.496276879674326], [95.3764941796627, 22.487771897555092], [95.37170038126766, 22.490439731908168], [95.36756747395981, 22.490206892034507], [95.36742865011217, 22.490199070630638], [95.36731920441781, 22.490274166719473], [95.36149004173211, 22.490232380619943], [95.35998362694289, 22.489779633123646], [95.3557746585737, 22.48851464403566], [95.35563821792948, 22.488508712107432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
