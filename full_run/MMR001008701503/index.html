
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogaung</div><div class="name-mm">မိုးကောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ah Lel Ward</div><div class="name-mm">အလယ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001008701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93809845192396, 25.311729370350633], [96.93763518441318, 25.311347382975384], [96.93723464181056, 25.311002361129454], [96.93691738034295, 25.31062957890532], [96.93662629294664, 25.3101116495597], [96.93639548522901, 25.309654793046548], [96.93606236068825, 25.308843396843542], [96.93594814655995, 25.308562620444945], [96.93588866003489, 25.30832467434425], [96.9358854874202, 25.307940787968562], [96.9358299666635, 25.306647947488784], [96.93576651436996, 25.305680300013194], [96.93517958065519, 25.30566443693965], [96.93445781081658, 25.305727889233196], [96.93395812400558, 25.305783409990113], [96.9340850285925, 25.306877962052795], [96.9342031625037, 25.3078267963661], [96.93433641232002, 25.30879761645656], [96.93436179323731, 25.309222746823025], [96.93446966213634, 25.309527317831794], [96.93456484057657, 25.3097557460884], [96.9346853999341, 25.31007935278518], [96.93488210204401, 25.31047275700479], [96.93513591121803, 25.310929613517942], [96.93540875607994, 25.31141185094839], [96.93566891048323, 25.31183063608546], [96.93590368396917, 25.31209713571809], [96.936373230941, 25.312541301772455], [96.93660800442694, 25.312649170671534], [96.9372760204833, 25.313059821519232], [96.93776828667501, 25.312183347567668], [96.93809845192396, 25.311729370350633]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
