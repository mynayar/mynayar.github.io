
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR015005701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.15604013084743, 22.181548621971388], [99.15869771202983, 22.183378062447673], [99.16141967657688, 22.18578125689953], [99.1657730230067, 22.187929504343174], [99.17094092498377, 22.188937161420938], [99.17490197904317, 22.188932956191024], [99.17468636298531, 22.188427079446228], [99.17704036542057, 22.184488492250182], [99.1759396123233, 22.180405792293527], [99.1768220181217, 22.176731766757655], [99.18024416423685, 22.175735542761117], [99.18566857264659, 22.175832049909218], [99.18880551855989, 22.173473092209463], [99.19424269014809, 22.174025733700717], [99.19716546341544, 22.172813320778175], [99.19583704244559, 22.169421693156664], [99.19533806889683, 22.169205572579187], [99.18936350382268, 22.167068292367844], [99.18911080511964, 22.166846181406186], [99.18195039759286, 22.16633538986639], [99.17363571831379, 22.168591484909143], [99.16743438918576, 22.167144139390587], [99.15978735400324, 22.166872989297076], [99.15962726658512, 22.16670846282534], [99.15791918871963, 22.168775795566546], [99.15483972657216, 22.17380265057193], [99.15633631357008, 22.181252431154803], [99.15604013084743, 22.181548621971388]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
