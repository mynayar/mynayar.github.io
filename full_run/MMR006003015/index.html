
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayetchaung</div><div class="name-mm">သရက်ချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ku</div><div class="name-mm">ဆင်ကူး</div></div>
        <span class="pcode-badge">MMR006003015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.31611905684906, 13.849043413922459], [98.31690431967866, 13.84546157968822], [98.31690468030683, 13.841338049611352], [98.31827916005523, 13.838589000182253], [98.31759191973134, 13.834694520235985], [98.31896640037911, 13.831945469907566], [98.31713400023398, 13.826218230087306], [98.31677885975665, 13.824837224858072], [98.30641823990993, 13.820058179841169], [98.29336103978022, 13.813185329639282], [98.28946655983395, 13.810665330340782], [98.28534311968929, 13.81020714014744], [98.28259416019239, 13.810665240408582], [98.28002340135896, 13.81012397893852], [98.28002339956032, 13.813159770007417], [98.28139788020809, 13.817512440147027], [98.28115444811937, 13.822781399841801], [98.2807106398842, 13.826905019850813], [98.27887788001021, 13.830341309603796], [98.27829148876128, 13.830956953100952], [98.28300132015488, 13.835152169936748], [98.28368819985059, 13.840192170332443], [98.286666480174, 13.844315790341511], [98.28781163999525, 13.847752080094494], [98.28851848014381, 13.848553208763633], [98.29124783981604, 13.851646649972963], [98.29493280470524, 13.853004394237473], [98.29545912034217, 13.853198317748195], [98.29880712005263, 13.851646739905163], [98.30590883962134, 13.8509595904128], [98.31438468010896, 13.84981424982783], [98.31611905684906, 13.849043413922459]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
