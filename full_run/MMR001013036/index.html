
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Hkam Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mansi</div><div class="name-mm">မံစီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Hkam Gyi</div><div class="name-mm">စီခမ်းကြီး</div></div>
        <span class="pcode-badge">MMR001013036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.0315086611958, 23.80393630581591], [97.03542794714213, 23.811774875010542], [97.03325056706007, 23.82614558535056], [97.03237961322861, 23.832677725596625], [97.03237961322861, 23.843564627805392], [97.04393903206073, 23.839332431746357], [97.06413679437765, 23.836656266973193], [97.07133407141032, 23.83357171915958], [97.08624271662813, 23.83357171915958], [97.0980668149316, 23.837170358125604], [97.10423590965956, 23.8402549050399], [97.11348955220114, 23.834085810311933], [97.12634183280937, 23.832543536854814], [97.142792753283, 23.829458989041143], [97.14639139224903, 23.827402624431613], [97.1458773001973, 23.818663073042444], [97.14433502674012, 23.811465796009713], [97.12839819831828, 23.80889534024783], [97.10680636632082, 23.80581079243416], [97.09086953789893, 23.804782610129394], [97.08007362190017, 23.80375442692531], [97.08261164990779, 23.781927385340623], [97.07339043601985, 23.78319077813194], [97.05282678632716, 23.791416238368754], [97.03814332865176, 23.79770755186206], [97.0315086611958, 23.80393630581591]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
