
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Wut Hti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Wut Hti</div><div class="name-mm">သာဝတ္တိ</div></div>
        <span class="pcode-badge">MMR018007050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25619624096379, 19.548794321800585], [96.26051742763724, 19.54735392624275], [96.26447851497153, 19.5383514535568], [96.26483861431063, 19.53331007000378], [96.26951990032319, 19.52934898177017], [96.27196501577293, 19.52568130814592], [96.27132039432081, 19.52574799287561], [96.26411841743106, 19.52502779509672], [96.26411841743106, 19.51350463063426], [96.26051742763724, 19.514945027091358], [96.25469667631063, 19.515222206239855], [96.25379880577032, 19.51526496180861], [96.25295535140839, 19.515305126430462], [96.24719376917716, 19.515305126430462], [96.24498996341612, 19.513101320669477], [96.24395287872244, 19.512064235975743], [96.23711100027248, 19.509543543299912], [96.23691022392774, 19.51905790559789], [96.23635957983078, 19.530254340065767], [96.23479384216216, 19.536686649269484], [96.23675090093337, 19.537991355117015], [96.24213669155512, 19.540890734319987], [96.24351795488974, 19.541634320767344], [96.2515940710096, 19.546223023373898], [96.25619624096379, 19.548794321800585]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
