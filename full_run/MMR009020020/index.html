
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Taw</div><div class="name-mm">ကွမ်းတော</div></div>
        <span class="pcode-badge">MMR009020020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9531812870868, 21.649878409860776], [94.94917137915587, 21.649477419247546], [94.94306697715933, 21.65151221991306], [94.93967564181747, 21.657616621909597], [94.93854519760282, 21.66417320213162], [94.93819865644292, 21.665082875374424], [94.93967687388869, 21.664571183613305], [94.95389784441005, 21.67071205671607], [94.96197794092927, 21.67491370820113], [94.96518759703002, 21.67837026057913], [94.96518759703002, 21.67735983988473], [94.97503028471994, 21.67342276534839], [94.98487297240979, 21.6728603257435], [94.99949639314411, 21.673985204053963], [95.00508172714007, 21.67591858997099], [95.00579067440015, 21.674095582345274], [95.01004738238083, 21.670264546871408], [95.01526225325046, 21.667027731244843], [95.01473718227521, 21.666660181022564], [95.0111197582703, 21.662364490129164], [95.00614580138767, 21.660103600800596], [94.9995892211657, 21.65648617679568], [94.9932328363264, 21.651122978043077], [94.99235437315588, 21.650381774799143], [94.98738041627325, 21.650381774799143], [94.97584987826934, 21.65106004168763], [94.95595404894027, 21.65015568613603], [94.9531812870868, 21.649878409860776]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
