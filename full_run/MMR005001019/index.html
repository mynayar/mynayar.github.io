
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Taw</div><div class="name-mm">ထန်းတော</div></div>
        <span class="pcode-badge">MMR005001019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01979796040763, 21.957928470222782], [96.01881999894385, 21.956498906999002], [96.0156269973881, 21.951822807376686], [96.01570047109993, 21.951013985007478], [96.01582211969514, 21.94967483962222], [96.01007471977255, 21.949461989878955], [96.00185088011409, 21.94452782979556], [95.99691672003064, 21.936578310340792], [95.99644799338023, 21.93189219137156], [95.99636844025139, 21.93109586957877], [95.99455079977963, 21.929480009994506], [95.9943329938726, 21.929286441715988], [95.99390135976, 21.928902840393846], [95.99341824035957, 21.929693849891294], [95.99088600038868, 21.93383709040944], [95.99088600038868, 21.936852359848558], [95.99088600038868, 21.94014185955922], [95.99280480020144, 21.945350159981956], [95.994723959743, 21.949461989878955], [95.99664275955575, 21.954396149962406], [95.9963144395598, 21.95636454019143], [96.00404400013053, 21.95686322955447], [96.01583112011019, 21.957685649673067], [96.01979796040763, 21.957928470222782]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
