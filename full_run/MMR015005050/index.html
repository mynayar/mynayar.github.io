
<!DOCTYPE html>
<html>
<head>
    <title>Map View - To Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">To Lar</div><div class="name-mm">တိုလာ</div></div>
        <span class="pcode-badge">MMR015005050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.76198047122182, 22.5011971479301], [98.7650962848657, 22.50580313280841], [98.76951881973781, 22.509341161065777], [98.77526811543123, 22.51243693511651], [98.78293384122384, 22.518333647679754], [98.78890814999119, 22.520284155789227], [98.79207374560696, 22.520839750654034], [98.79959205542906, 22.517006886858383], [98.80044418195348, 22.51390824397032], [98.80121365088934, 22.51111017519446], [98.80150848642757, 22.50329702983413], [98.80003430783711, 22.494746797426785], [98.79575919073415, 22.488555249325373], [98.78927280709445, 22.482363700324584], [98.78426060204521, 22.477351494376023], [98.77939581386579, 22.467474500248045], [98.7771608196162, 22.46537097698905], [98.77644745668482, 22.46924351437673], [98.7712878338665, 22.475729898016425], [98.76566126415605, 22.480832504716375], [98.76716013543194, 22.489734590578962], [98.76804464204668, 22.495631304041524], [98.76198047122182, 22.5011971479301]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
