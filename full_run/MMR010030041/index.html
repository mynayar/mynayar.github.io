
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Wa</div><div class="name-mm">သပြေဝ</div></div>
        <span class="pcode-badge">MMR010030041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9982615761109, 20.95216286642318], [95.99448559803199, 20.953421526082593], [95.98441632435396, 20.953421526082593], [95.97466850344875, 20.947031020964914], [95.97193559774968, 20.94320586885584], [95.9717650602094, 20.95070289981902], [95.9632684867513, 20.966524013372577], [95.96824876137129, 20.980001482882187], [95.9692530028239, 20.982344948860373], [95.97176427689993, 20.9882051687336], [95.97252713581872, 20.990301238411462], [95.97494697582232, 20.989889144768256], [95.99039495616233, 20.987405326094972], [96.00392554322929, 20.985517337055512], [96.01653911498823, 20.985780119856713], [96.02060277809579, 20.97796538179699], [96.02312009741462, 20.97418940371807], [96.02407923606796, 20.973997575627664], [96.02374942679467, 20.967896107219644], [96.02028811430512, 20.96254680479126], [96.01179216317786, 20.95877082761166], [96.00298154825992, 20.951533537043133], [95.9982615761109, 20.95216286642318]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
