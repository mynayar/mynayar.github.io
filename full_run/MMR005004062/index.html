
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Taw</div><div class="name-mm">ရွာတော်</div></div>
        <span class="pcode-badge">MMR005004062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63619131967374, 22.62930479997658], [95.63929128006856, 22.627533419731606], [95.64371963984956, 22.625983350051627], [95.64327683975444, 22.62133340990897], [95.64526980036106, 22.61601909020891], [95.64798995996875, 22.61057903989081], [95.64581772041151, 22.610007449684133], [95.64257951982904, 22.6087739098881], [95.63934132014589, 22.607848709850145], [95.63810796021426, 22.60507319966848], [95.63733684012311, 22.60198925979654], [95.63749092006998, 22.597826039939832], [95.63749092006998, 22.59643824033259], [95.63726807975814, 22.596457590145747], [95.63394455959383, 22.596746670022867], [95.63126328037617, 22.598335530160625], [95.63170860037167, 22.598571329703134], [95.63006411986328, 22.605355889862494], [95.62492404021236, 22.610701350387046], [95.62698000012699, 22.616457929689773], [95.630269679702, 22.62262572040072], [95.63088384021711, 22.627386359892625], [95.6326482003542, 22.627533419731606], [95.63619131967374, 22.62930479997658]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
