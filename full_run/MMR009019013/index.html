
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Lin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Lin Kone</div><div class="name-mm">ဆားလင်းကုန်း</div></div>
        <span class="pcode-badge">MMR009019013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09727793632777, 21.686919054970474], [95.09836203218208, 21.686485415369646], [95.09850722412915, 21.68642733895058], [95.10041514214515, 21.68430743004393], [95.11186256480556, 21.671588071932035], [95.11252541011964, 21.6719668402975], [95.11292620018406, 21.672195863448394], [95.11387844733252, 21.668958223143534], [95.11186256480556, 21.668125575934653], [95.12274469431225, 21.663673796008936], [95.13115361174982, 21.657738088841768], [95.12670183182416, 21.646361316921286], [95.11981484338037, 21.64074969664125], [95.09257151696198, 21.646855959335085], [95.07773224994344, 21.652791665602933], [95.0727858267046, 21.66515772325039], [95.06882868919269, 21.66952421956711], [95.06882868919269, 21.681888269028434], [95.07773224994344, 21.67900770544128], [95.09727793632777, 21.686919054970474]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
