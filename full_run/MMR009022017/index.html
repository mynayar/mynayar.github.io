
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Se</div><div class="name-mm">လက်ဆည်</div></div>
        <span class="pcode-badge">MMR009022017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70330886091529, 21.090917211759972], [94.70478958117428, 21.08726476815457], [94.7068062326216, 21.08207909197654], [94.70565386113685, 21.078910068145206], [94.70363720879021, 21.071707741419175], [94.70478958117428, 21.061048295742296], [94.70478958117428, 21.056726900426156], [94.7073824192633, 21.048948386159168], [94.70981811521392, 21.041100031441374], [94.70984197962372, 21.04102313311114], [94.70968716403144, 21.040881778571247], [94.70363720879021, 21.039729407086497], [94.69557060210167, 21.038865127123984], [94.6880801811555, 21.038865127123984], [94.67742073727726, 21.038865127123984], [94.67739379988404, 21.039632827992648], [94.67684455063556, 21.05528643382189], [94.67338743258398, 21.060760203320797], [94.67223506109923, 21.065369692857075], [94.67540408493062, 21.07660532337701], [94.68404687826086, 21.089569512922708], [94.69326585733353, 21.096195653906364], [94.69338410559203, 21.096232607049217], [94.69907917216614, 21.090917211759972], [94.70330886091529, 21.090917211759972]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
