
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpaung Gyi (West)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpaung Gyi (West)</div><div class="name-mm">ဖေါင်ကြီး (အနောက်)</div></div>
        <span class="pcode-badge">MMR013004002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18582289870784, 17.314764545647336], [96.18632921342254, 17.311557892382893], [96.18548535706361, 17.301262843905192], [96.18244747417168, 17.30109407263342], [96.17822819237722, 17.30109407263342], [96.16540157482285, 17.298731274828526], [96.15628792704626, 17.29805618974143], [96.14835567727278, 17.296537249194728], [96.14025465622746, 17.29569339193654], [96.13826484234863, 17.297145595592838], [96.13751808399246, 17.301999520861273], [96.14021462380589, 17.3070929823553], [96.14087849434708, 17.30834696014415], [96.14294608339509, 17.310774129622416], [96.14946620600068, 17.318428186711515], [96.15357337201357, 17.322161974895266], [96.15424234440871, 17.324168887584165], [96.1543201303698, 17.324402248165256], [96.1543201303698, 17.326642521435247], [96.16029419092422, 17.33224320326127], [96.16692034180039, 17.335082981694313], [96.16813514512091, 17.335603611817305], [96.17074879711936, 17.338590641644828], [96.17232119786507, 17.334848327888096], [96.17670925093125, 17.330122732278312], [96.17957836165215, 17.325903449584587], [96.18278501581591, 17.320502768887707], [96.18582289870784, 17.314764545647336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
