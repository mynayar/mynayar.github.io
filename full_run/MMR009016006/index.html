
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Pyin</div><div class="name-mm">ရွာပြင်း</div></div>
        <span class="pcode-badge">MMR009016006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24350332401923, 19.44985725500834], [95.23800152085357, 19.447317960755356], [95.23295162521737, 19.43584092611792], [95.22629494505571, 19.434922763274983], [95.2083907696184, 19.433775060170944], [95.19392970619106, 19.432627356167586], [95.19061781156279, 19.432412123220956], [95.18588458790344, 19.432161395831827], [95.18574570290195, 19.432432221270062], [95.17607735418659, 19.4435655602025], [95.17516163480167, 19.44536647328414], [95.16728781398149, 19.4608516378928], [95.16435782095675, 19.473743015627747], [95.1641387775826, 19.47669955573997], [95.16377174087319, 19.481653643900586], [95.1764260797998, 19.48218849680171], [95.19499347376984, 19.4829732712995], [95.211187237601, 19.48263758675529], [95.22024296364191, 19.481798414065622], [95.22396151461226, 19.481824932374764], [95.23723756026527, 19.481918055374024], [95.23881413656324, 19.48192911433722], [95.24453559464206, 19.48106559430181], [95.2488214532475, 19.48109525034556], [95.25025700325813, 19.480201889905345], [95.25491435291514, 19.479974097027025], [95.25521707370905, 19.471649276093274], [95.2526302502859, 19.455050489088876], [95.25246258518024, 19.45397464181633], [95.24695360812257, 19.451449694447888], [95.24350332401923, 19.44985725500834]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
