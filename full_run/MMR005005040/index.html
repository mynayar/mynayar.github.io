
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee Kan</div><div class="name-mm">ကျီးကန်</div></div>
        <span class="pcode-badge">MMR005005040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67869766826283, 22.689400641326586], [95.67437983965795, 22.688393148824787], [95.66887781705765, 22.68445809506511], [95.66352911177916, 22.684017224015747], [95.66304190495998, 22.683977064789758], [95.66223922765829, 22.682088066710946], [95.66208072034902, 22.681715039617416], [95.66136420799188, 22.68126555576083], [95.66062739973478, 22.680803340202033], [95.65903859085836, 22.680795034063635], [95.6386960736649, 22.680688078592027], [95.6365460770399, 22.680676775013183], [95.63144456121756, 22.678126017102045], [95.62304417924554, 22.675559232372734], [95.61861064566483, 22.67742598482141], [95.61812249275891, 22.68455828673558], [95.61774636030634, 22.69005389986762], [95.62831452029894, 22.69201562971756], [95.64052176037103, 22.69317528031496], [95.64741827982982, 22.69885131003997], [95.64587388037535, 22.713928200426153], [95.65474283971037, 22.715025840070496], [95.66133480016094, 22.70782367971907], [95.66975736031401, 22.707213299953878], [95.67828864040848, 22.691317770198964], [95.67869766826283, 22.689400641326586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
