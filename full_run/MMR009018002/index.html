
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Hla</div><div class="name-mm">ကန်လှ</div></div>
        <span class="pcode-badge">MMR009018002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9913688043269, 21.40738710103392], [94.99518823674777, 21.39765861914998], [94.99541147455994, 21.39808693386493], [94.9975259560581, 21.394703764367307], [94.99944071611623, 21.3862788201115], [95.00020662013947, 21.375173210875005], [95.00250433220924, 21.365982362596014], [95.00394784032062, 21.36558415358587], [95.00384466380024, 21.361147592887164], [95.01150370493207, 21.35253117307525], [95.01772667534584, 21.338170472189574], [95.01743604233957, 21.33003274081841], [95.00881887788898, 21.33003274081841], [95.00863156529454, 21.334340951174], [95.0033659735609, 21.338649162428965], [94.99666431380712, 21.344393441704028], [94.98754902386844, 21.346138923272747], [94.98581534680085, 21.348045968047018], [94.98565444279836, 21.348222961820284], [94.97703802208713, 21.356360693191505], [94.96794291203582, 21.3673705642002], [94.96245010928516, 21.380187103052435], [94.96219863096212, 21.38077388460715], [94.97009618938768, 21.397739010447026], [94.97193658630448, 21.39801170737445], [94.97816990341835, 21.39893531561239], [94.98904807590804, 21.406634354092205], [94.9913688043269, 21.40738710103392]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
