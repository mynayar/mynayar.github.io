
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shauk Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shauk Chaung</div><div class="name-mm">ရှောက်ချောင်း</div></div>
        <span class="pcode-badge">MMR017017094</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1503029201437, 16.47758384981489], [95.14818864009374, 16.477016310154625], [95.14757805888036, 16.47724449333873], [95.14167336033739, 16.479450810006938], [95.14335023982176, 16.474657679808104], [95.14602215979488, 16.47170802040887], [95.14664279992536, 16.469283420293664], [95.14539431969217, 16.463105370116807], [95.14476971984675, 16.460839619952537], [95.14044972027841, 16.461651869638104], [95.13926172035218, 16.4619777596659], [95.13999000033829, 16.468087769834767], [95.1400490426293, 16.468583219839786], [95.14017756024629, 16.46966159960317], [95.13829368020924, 16.469399879800676], [95.13493559999802, 16.468746569998245], [95.13289331967104, 16.468457849849926], [95.13395819971123, 16.473017790338815], [95.13545867987426, 16.479441359930888], [95.13720864006672, 16.48637900988342], [95.1404857201399, 16.48748681996085], [95.14385100032348, 16.488780480334924], [95.14686924022334, 16.489163700344534], [95.15008800016113, 16.489517490040157], [95.1541340401539, 16.48950390038476], [95.15443356026066, 16.489436040241117], [95.15473271973929, 16.489368270029672], [95.15294639995648, 16.486634879596068], [95.1503029201437, 16.47758384981489]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
