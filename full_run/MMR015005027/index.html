
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Au (Pang Leik)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Au (Pang Leik)</div><div class="name-mm">ယောင်အူ (ပန်လိပ်)</div></div>
        <span class="pcode-badge">MMR015005027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.72376132842265, 22.645220441270396], [98.72662023543558, 22.632287620976967], [98.72883150197231, 22.616071660978434], [98.72838924776562, 22.608258517416687], [98.72724216699248, 22.60497741827328], [98.72087093974216, 22.602509221723267], [98.71082961789261, 22.598287303116592], [98.70789817156344, 22.597054763366714], [98.70170662256265, 22.596612509160025], [98.69315639015537, 22.601477297339443], [98.68902869082149, 22.603688564775496], [98.68913583515075, 22.605438580725945], [98.6894709441288, 22.61091203816011], [98.68785819979615, 22.619742468740014], [98.6881441842068, 22.624032224107907], [98.69028356613376, 22.62873886290822], [98.69418831543845, 22.629339264695375], [98.70509723305094, 22.631550532131428], [98.71615357023114, 22.637594663363075], [98.72376132842265, 22.645220441270396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
