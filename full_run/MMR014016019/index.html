
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Kon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongkaing</div><div class="name-mm">မိုင်းကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Kon</div><div class="name-mm">လွိုင်ကုန်</div></div>
        <span class="pcode-badge">MMR014016019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.43133277818521, 21.544960185064554], [97.42973956892604, 21.54537441909423], [97.41895439442982, 21.532628301654825], [97.40392051322118, 21.52380406830315], [97.38921345463729, 21.514326186104654], [97.38968959709729, 21.51379290791641], [97.386925690868, 21.514253558654843], [97.36252286863555, 21.546209633867534], [97.35380757555924, 21.558992065031816], [97.34741636087642, 21.590948141143826], [97.35322655596087, 21.639753782910816], [97.3511737472707, 21.639398490448002], [97.35458226775751, 21.66803006883265], [97.35305318735476, 21.731486942868173], [97.35303288336092, 21.73232956715583], [97.38944344186143, 21.734653644650052], [97.40571198971662, 21.723033253581832], [97.40958545340601, 21.705990012629], [97.40571198971662, 21.677326382406648], [97.41268422399781, 21.64788805728807], [97.41680017998436, 21.637483835610567], [97.44057316292117, 21.57739101688196], [97.43902377762532, 21.559573083730868], [97.43133277818521, 21.544960185064554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
