
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Sint (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Sint (South)</div><div class="name-mm">ကန်ဆင့် (တောင်)</div></div>
        <span class="pcode-badge">MMR010017049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44670050612353, 21.438215929121895], [95.45142837342075, 21.43949373085104], [95.45875169043825, 21.44128387455123], [95.46656322871007, 21.43737810541529], [95.47209640202738, 21.433309595861203], [95.47225914334484, 21.43070574917101], [95.47242188286367, 21.428915604571557], [95.4733983253725, 21.425335317171175], [95.47502572865449, 21.422568730062892], [95.47876875827166, 21.417686518418122], [95.47876875827166, 21.41361800796477], [95.477629576244, 21.41003771966507], [95.47658591121092, 21.409202788178163], [95.47311407305608, 21.408045386785204], [95.4716195553982, 21.40718308982781], [95.47112612257257, 21.40689839324631], [95.46894127002366, 21.40844599788454], [95.46660614525746, 21.40844599788454], [95.46338144799546, 21.40855719365959], [95.46314238121596, 21.40849923864897], [95.46314238121596, 21.4107131770715], [95.46147829278902, 21.414279080715062], [95.45815011593515, 21.421886343380095], [95.45672375429785, 21.42355043180703], [95.45577284623994, 21.42568997381329], [95.45339557744398, 21.428542697987154], [95.4514937613281, 21.430682239993416], [95.4500673996908, 21.432821781999678], [95.44697694962656, 21.435912232963233], [95.44670050612353, 21.438215929121895]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
