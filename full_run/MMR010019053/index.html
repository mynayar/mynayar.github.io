
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Zauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Zauk</div><div class="name-mm">တောဇောက်</div></div>
        <span class="pcode-badge">MMR010019053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71796746292813, 21.590529791816493], [95.71408014788057, 21.58722557380122], [95.70954363203305, 21.583644112785635], [95.70954363203305, 21.584751109875867], [95.70748157921156, 21.590937269239646], [95.70748157921156, 21.598773071220307], [95.7099560422376, 21.6074336927108], [95.7132553265721, 21.614444674282367], [95.71366773767602, 21.626404581006682], [95.71392852128429, 21.632272206796983], [95.72317139984028, 21.634636664750303], [95.73076580130078, 21.63626403475746], [95.74459845895177, 21.638976322599262], [95.7513791727107, 21.63924755093376], [95.75653251826117, 21.641417380307928], [95.76202737056678, 21.642215710286848], [95.76361836479578, 21.640095138579852], [95.76443205159796, 21.63663697461675], [95.76463807818482, 21.628164254776607], [95.76666968805574, 21.625041954322796], [95.76712882523515, 21.62492112770792], [95.76645629422268, 21.62310529577286], [95.76109495706669, 21.616506727103797], [95.75532120790746, 21.61155779925309], [95.7462481753131, 21.61155779925309], [95.74006201594932, 21.613207441869974], [95.73635032141027, 21.610320567740075], [95.7305765722511, 21.603309587067827], [95.72232836006583, 21.59423655357415], [95.71796746292813, 21.590529791816493]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
