
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Twin Byee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Twin Byee</div><div class="name-mm">တွင်းဗြည်း</div></div>
        <span class="pcode-badge">MMR008001027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3388092710311, 18.834562854891885], [95.33524090594312, 18.82918502866619], [95.3307457049504, 18.82625813740316], [95.32682154467858, 18.823550896556696], [95.32115495783512, 18.819873977901807], [95.31494759065885, 18.818680253790717], [95.30945645884856, 18.818918998612958], [95.30611403133753, 18.8213064477344], [95.30396532703827, 18.822022682201066], [95.29274431769619, 18.82273891666773], [95.29187587836913, 18.82564601385252], [95.2916907106578, 18.830275192246347], [95.29187587836913, 18.83360820025831], [95.29206104518113, 18.835089536552914], [95.29243137880513, 18.836015372411566], [95.29650505496437, 18.83545987107624], [95.2985418925943, 18.835089536552914], [95.29965289616428, 18.835089536552914], [95.3003935643116, 18.83768187641749], [95.30057873112361, 18.839533547235476], [95.30280073736418, 18.840089047671484], [95.30650407900009, 18.8412000512414], [95.31057775515933, 18.842125886200733], [95.31419571605949, 18.843888700403227], [95.31834257814751, 18.843888700403227], [95.32041600919155, 18.842333626895424], [95.32067518661063, 18.839223480779083], [95.32171190258231, 18.835335797908783], [95.32378533362629, 18.83248483101022], [95.33622591899103, 18.83429908283648], [95.3388092710311, 18.834562854891885]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
