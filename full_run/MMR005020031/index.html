
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bwet</div><div class="name-mm">ဘွက်</div></div>
        <span class="pcode-badge">MMR005020031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.31171115974229, 24.047728469593267], [96.319274760322, 24.046081560016034], [96.32849111966948, 24.047485380146213], [96.33630383965055, 24.056701649561546], [96.34728995956402, 24.057312030226058], [96.36187751983175, 24.05847167992414], [96.37792956040096, 24.0596923504217], [96.39288324006952, 24.058105469691725], [96.39769403115469, 24.05670486733578], [96.4129088100936, 24.057020247886157], [96.41201336142757, 24.052990726640758], [96.40529748968748, 24.041797609771947], [96.39007485157322, 24.027918143307716], [96.39007485157322, 24.02433634684496], [96.38534744832612, 24.01846855737807], [96.38330076042183, 24.018127469706997], [96.38049312016142, 24.016723649576818], [96.38040240015073, 24.016713929704167], [96.38030987969722, 24.016906710176556], [96.36907968018318, 24.015502890046378], [96.356323080246, 24.014892600213386], [96.34570307973343, 24.016906710176556], [96.33392352035423, 24.021301230267625], [96.32373048017757, 24.024108869628662], [96.3156736796966, 24.025512689758898], [96.30817308022353, 24.026117580062305], [96.30908207987414, 24.0266723403563], [96.31048572013992, 24.038513190331514], [96.31171115974229, 24.047728469593267]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
