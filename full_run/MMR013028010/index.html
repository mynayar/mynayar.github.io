
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Popa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawhmu</div><div class="name-mm">ကော့မှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Popa</div><div class="name-mm">ပုပ္ပါး</div></div>
        <span class="pcode-badge">MMR013028010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89428504042235, 16.468601850195284], [95.89505652024229, 16.47228825040247], [95.89523147974904, 16.475158620174227], [95.90298299996556, 16.475413050072234], [95.90418612019334, 16.47666036028744], [95.90722847991049, 16.476843060259057], [95.90870376017045, 16.476684390172522], [95.90945436043046, 16.476603749763285], [95.9136094800935, 16.476666749970605], [95.9212565998123, 16.475963040362046], [95.92212780005798, 16.47092348962741], [95.92405991972959, 16.47009620957249], [95.92566003488275, 16.46940449781937], [95.92449543261819, 16.467760350959452], [95.91922818703125, 16.46565345344419], [95.9141927776746, 16.4655008645733], [95.91278446093418, 16.464634207702545], [95.90968411293153, 16.45848959881596], [95.90670870684141, 16.459146746924887], [95.90290757742281, 16.45998626495424], [95.90046753774675, 16.458591956053965], [95.90028983980432, 16.45899191964145], [95.8999478402207, 16.45893171003047], [95.89971492030736, 16.459203959994795], [95.89970735970695, 16.459700220288994], [95.8993624795948, 16.459805340244316], [95.89810824010328, 16.459621380322517], [95.89742351967976, 16.459556040079235], [95.89676616023019, 16.459771680418783], [95.89588128039685, 16.460186939675566], [95.89182588026023, 16.46234153993015], [95.89092480003956, 16.463350709667566], [95.8910705999283, 16.46412021007967], [95.89215204008462, 16.46533007971948], [95.89428504042235, 16.468601850195284]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
