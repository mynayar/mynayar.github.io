
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mon Hnyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mon Hnyin</div><div class="name-mm">မုန်ညှင်း</div></div>
        <span class="pcode-badge">MMR009011039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.40517484684176, 20.331498537027926], [94.39458560134449, 20.3223459728884], [94.34839285074952, 20.307691721595745], [94.33119003409286, 20.307054579805083], [94.3275052868396, 20.317892069663344], [94.32577433201988, 20.32298311467906], [94.32290719621022, 20.335088800607707], [94.3423400077852, 20.340185932235045], [94.35890568355052, 20.348787340563376], [94.36909994590582, 20.361848738728384], [94.38152420317948, 20.367901581692706], [94.39585988402649, 20.36662729991002], [94.41214369337683, 20.357562433159785], [94.40952572103527, 20.35459516233692], [94.41019527079516, 20.348569987914686], [94.40900224995391, 20.342870443616107], [94.40805748066828, 20.341955581285106], [94.40762290577254, 20.341950374210455], [94.40566436311991, 20.3419279972793], [94.4016601371057, 20.340536255943505], [94.40216228705998, 20.33668684102497], [94.40517484684176, 20.331498537027926]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
