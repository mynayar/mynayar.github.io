
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ton Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ton Kin</div><div class="name-mm">တုံကင်း</div></div>
        <span class="pcode-badge">MMR008003036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0137478947496, 18.43877975158432], [95.00970315337787, 18.443062420294495], [95.00017473557563, 18.44687378669596], [94.99740841376735, 18.44798031613874], [94.99727306759803, 18.448109216866897], [94.98708083411327, 18.45781610692785], [94.98462188619118, 18.468143686581925], [94.9864337431228, 18.47176740044523], [94.98806441274252, 18.47502874058398], [94.99544125560953, 18.48043842619245], [95.004785258433, 18.48633989976662], [95.00569318159512, 18.488609707671912], [95.00773599522006, 18.493716742633637], [95.01806357487413, 18.495683901690768], [95.03429262990102, 18.49224137513943], [95.03576799919387, 18.485848110901657], [95.0323254717432, 18.479454846663884], [95.03330905127177, 18.464701160030586], [95.02298147071838, 18.461750423243473], [95.02150610232485, 18.45339000084789], [95.02435742985159, 18.446736902685984], [95.0137478947496, 18.43877975158432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
