
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pya Tauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pya Tauk</div><div class="name-mm">ပြတောက်</div></div>
        <span class="pcode-badge">MMR009010084</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.44676786734328, 20.7136259917462], [94.4602554191523, 20.707513217061376], [94.47215930260978, 20.69414424086409], [94.47765340308217, 20.679493308069766], [94.48088229568145, 20.669409523830495], [94.47531394628163, 20.670135830704055], [94.47047190195678, 20.669409523830495], [94.46248252904553, 20.669409523830495], [94.4622404270541, 20.681030430210228], [94.46006150733274, 20.6870829853915], [94.45788258671206, 20.69095662085141], [94.45183003243011, 20.695314460294185], [94.44626168123165, 20.694346051429193], [94.44069333093256, 20.69119872284284], [94.44094848118749, 20.69059274166176], [94.44069333093256, 20.690714517960657], [94.4365775925819, 20.69628286915912], [94.43136594218453, 20.700660655564832], [94.43343026489487, 20.702577526331822], [94.43754600234621, 20.705724854918174], [94.44359855662816, 20.706451161791733], [94.44626168123165, 20.710082695260212], [94.44676786734328, 20.7136259917462]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
