
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Pa Ni (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Pa Ni (North)</div><div class="name-mm">ဇီးပနီ (မြောက်)</div></div>
        <span class="pcode-badge">MMR005018026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92547607965741, 21.879364320407092], [94.92547607965741, 21.875915520185174], [94.92547607965741, 21.865722659872915], [94.92370596026194, 21.85467525026263], [94.92449939972755, 21.846130379613385], [94.92071544016551, 21.83947758002637], [94.92118920122073, 21.8345486441047], [94.9179074653573, 21.835526163101974], [94.9053554791721, 21.838873252698477], [94.90359094906313, 21.839933962582336], [94.90039199669337, 21.841856946041275], [94.90028039982064, 21.84305526029209], [94.90031495986756, 21.843237870331507], [94.90448016003143, 21.846130379613385], [94.90911875972301, 21.85589600979307], [94.909912200088, 21.866882309570997], [94.91027832038822, 21.87628173041759], [94.91210927981945, 21.881713860406364], [94.91308595974931, 21.881713860406364], [94.92150887963118, 21.879089369778626], [94.92547607965741, 21.879364320407092]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
