
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit Hpya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit Hpya</div><div class="name-mm">ရွာသစ်ဖျ</div></div>
        <span class="pcode-badge">MMR009020029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97441916481267, 21.832680132582084], [94.96968711207063, 21.827249908256704], [94.96237540080415, 21.819656978087096], [94.95589490592522, 21.815490945151055], [94.9545012508321, 21.814595024340974], [94.94437734423911, 21.81318892622801], [94.93425343674676, 21.814595024340974], [94.92684772024614, 21.8157171030619], [94.9272229461821, 21.819656978087096], [94.9263792867747, 21.82612502904692], [94.9226135888461, 21.833077087037964], [94.92286641075628, 21.83404906801013], [94.92571738574884, 21.833199861584376], [94.9311287971563, 21.83586111559805], [94.93800624019588, 21.833696068818597], [94.94107127991572, 21.833800105090802], [94.94456651573216, 21.833936738189948], [94.94465955419514, 21.833921884987035], [94.94470223961673, 21.83392332030502], [94.94989020007273, 21.83312987994003], [94.95227052026837, 21.83312987994003], [94.96868903996727, 21.833313029572707], [94.96876536003339, 21.833313029572707], [94.96875348718373, 21.833262211581825], [94.9706859602889, 21.833280269968554], [94.97441916481267, 21.832680132582084]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
