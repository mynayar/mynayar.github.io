
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Pin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Pin Kone</div><div class="name-mm">ထန်းပင်ကုန်း</div></div>
        <span class="pcode-badge">MMR008013003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53310852933521, 18.14228978004934], [95.53302925859344, 18.140633825091015], [95.5321971141056, 18.138975257602112], [95.53196458180008, 18.137421807370572], [95.53167540659479, 18.13576263193994], [95.53187687002162, 18.133737755293225], [95.53283853397124, 18.131558438071522], [95.53499030765664, 18.128537619815347], [95.5374805142144, 18.12490252233357], [95.53788148774055, 18.12451853610162], [95.53803887089725, 18.124367821417877], [95.53691260403349, 18.121692938178626], [95.53374200099262, 18.114605707587373], [95.53073143230984, 18.108082808774668], [95.52460320367499, 18.109197031917518], [95.52068657702398, 18.110129562329462], [95.50930970797668, 18.114419201684882], [95.50352801960247, 18.118895346942736], [95.49830585073448, 18.123371492200647], [95.49252416325959, 18.128220650162916], [95.48854500764605, 18.13239277870383], [95.49327018686967, 18.138291976993173], [95.49830585073448, 18.140530048722837], [95.50110344197032, 18.141649085936592], [95.5087501902691, 18.14332763995867], [95.50867502403321, 18.143158516152653], [95.51248031101761, 18.14332763995867], [95.51732946808056, 18.14332763995867], [95.52572224088874, 18.143514145861218], [95.52982537434161, 18.142581616348593], [95.53310852933521, 18.14228978004934]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
