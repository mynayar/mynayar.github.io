
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Tan</div><div class="name-mm">ကျောက်တန်း</div></div>
        <span class="pcode-badge">MMR005024036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88232044013625, 23.79462327024777], [95.88171384022161, 23.78588868041834], [95.88171384022161, 23.77893068959969], [95.88250727968727, 23.770873979950238], [95.8845214795827, 23.765075639729048], [95.88470472004684, 23.760070829804988], [95.88568104024785, 23.754516570083695], [95.88049307979185, 23.73828128994961], [95.88049307979185, 23.731872569963173], [95.87030040024331, 23.73712155031933], [95.85913068013684, 23.74609374013403], [95.84692379979356, 23.752075229987952], [95.84387207993262, 23.759704619572574], [95.84350595963241, 23.76812745042156], [95.84228520010197, 23.776489259571747], [95.84112564033609, 23.785522470185924], [95.83831800007567, 23.79608153983122], [95.8363038001803, 23.801879880052468], [95.84887679992443, 23.804321310080468], [95.86108403999651, 23.803894079947895], [95.88031019995583, 23.801513669820054], [95.88507084034705, 23.801330610119635], [95.8823240401224, 23.794677719701042], [95.88232044013625, 23.79462327024777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
