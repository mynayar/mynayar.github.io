
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan</div><div class="name-mm">ရှမ်း</div></div>
        <span class="pcode-badge">MMR017007018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18825663973217, 16.984107449998874], [95.1912053998094, 16.986042360266765], [95.19353351975622, 16.986553650031], [95.19622199984548, 16.98607772970354], [95.20077311978372, 16.986028589847592], [95.20391340038316, 16.98447501011367], [95.20926912037368, 16.9817354098613], [95.21166866088004, 16.980577002127006], [95.21121811762208, 16.97381888023716], [95.20910295173991, 16.971233678291696], [95.20839789674562, 16.965593230243428], [95.20628272816543, 16.961832931844356], [95.20416755958524, 16.957602598281312], [95.2015823567404, 16.95548742970118], [95.1992321701286, 16.955722447732853], [95.19312168511772, 16.9571325613187], [95.18231082958118, 16.969118508812187], [95.18151147077782, 16.969171799039316], [95.18182344019965, 16.970019390282687], [95.18221655994637, 16.970864399572406], [95.182669439643, 16.97187635990616], [95.18320439956346, 16.972954469872946], [95.18355035976134, 16.97375529007462], [95.18391935969078, 16.974522269687043], [95.18477759980647, 16.976457269887135], [95.18554187965407, 16.9782815698386], [95.18625791986716, 16.979949990299872], [95.18678315991497, 16.98119576986892], [95.18752080004492, 16.982729819925282], [95.18825663973217, 16.984107449998874]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
