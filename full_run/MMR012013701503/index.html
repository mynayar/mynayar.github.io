
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012013701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.87055010550301, 19.092880771230682], [93.869783651994, 19.092179896285245], [93.86837025228539, 19.091594549149193], [93.86775635167436, 19.09173731652396], [93.86672842477702, 19.092408324084943], [93.86542923896826, 19.093307760344942], [93.86464401660811, 19.09352191230647], [93.86433693680027, 19.09343343160765], [93.8634883949735, 19.095835824763526], [93.86321752996508, 19.09680794782855], [93.86290402899778, 19.097911178558093], [93.86270594522324, 19.098628235904414], [93.86214677195602, 19.10092441552939], [93.86198178323275, 19.101557378170526], [93.86196831228784, 19.101899994689063], [93.86194451802515, 19.10263762762446], [93.86195398069174, 19.102990875928242], [93.86251837542272, 19.102967290308243], [93.86334368776102, 19.101433724087144], [93.86336148714298, 19.100157039315945], [93.86418025961137, 19.098591710838832], [93.8660978669231, 19.098229676158667], [93.8680252309797, 19.097694297154135], [93.86879855530913, 19.09770619428548], [93.86961233114425, 19.097149400624403], [93.86980268794377, 19.096930490349905], [93.87020243749254, 19.094731868281144], [93.87055010550301, 19.092880771230682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
