
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Au Pin Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Au Pin Seik</div><div class="name-mm">မအူပင်ဆိပ်</div></div>
        <span class="pcode-badge">MMR007011001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.77200875689869, 18.314963029420312], [96.76328470172768, 18.315399232088964], [96.75761406613628, 18.31365442141447], [96.75237963321354, 18.314090623183745], [96.74976241720185, 18.314526825852397], [96.74186825821363, 18.31548572168873], [96.73929355135635, 18.317580245432055], [96.73449532110226, 18.316707840094807], [96.72969708994879, 18.316271637426155], [96.72228164368295, 18.32237847568615], [96.7183558187661, 18.325868097934404], [96.71434950992199, 18.330732901402314], [96.71617480542301, 18.333719746868894], [96.71573860185504, 18.338081775353714], [96.72114751674457, 18.339826586028153], [96.72332853008766, 18.341135194034052], [96.72681815233591, 18.343316207377143], [96.72812676034175, 18.34811443763124], [96.73124997180884, 18.34889523982349], [96.73859562618725, 18.346369626956744], [96.74252145110415, 18.3406989913654], [96.74862829026347, 18.33851797712299], [96.7503731009379, 18.3319749361944], [96.75473512762409, 18.330230124620584], [96.7608419667834, 18.329357720182713], [96.76345918279509, 18.333719746868894], [96.76825741304924, 18.334319526325146], [96.76825741304924, 18.32892151661474], [96.76912981928581, 18.324995691697836], [96.77200875689869, 18.314963029420312]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
