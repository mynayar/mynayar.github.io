
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Kone</div><div class="name-mm">နောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR007011021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71421948324263, 18.259837696952218], [96.7139937911806, 18.263927308198788], [96.71224897960678, 18.270034145559407], [96.71050416983161, 18.272215159801817], [96.71050416983161, 18.276577187387318], [96.71137657516886, 18.282684025647313], [96.70745075025201, 18.28879086390731], [96.71050416983161, 18.29097187814972], [96.71573860185504, 18.2953339048359], [96.7170472107602, 18.296206311072467], [96.72577126593126, 18.29969593332072], [96.7331867121971, 18.302313149332406], [96.73798494335051, 18.302749352001058], [96.7375487397826, 18.305366568012744], [96.73798494335051, 18.313218217846554], [96.74186825821363, 18.31548572168873], [96.74976241720185, 18.314526825852397], [96.75237963321354, 18.314090623183745], [96.75761406613628, 18.31365442141447], [96.76328470172768, 18.315399232088964], [96.75475279030911, 18.30642717267591], [96.74503910317213, 18.29569099324482], [96.73021295096697, 18.278819853753305], [96.73144190062328, 18.270688450012017], [96.7270798739371, 18.268507435769607], [96.72184544101435, 18.265890219757864], [96.71791961609745, 18.261964394841016], [96.71421948324263, 18.259837696952218]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
