
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Taw Gyi</div><div class="name-mm">ကိုင်းတောကြီး</div></div>
        <span class="pcode-badge">MMR009007040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.72340378575615, 20.12025677622927], [94.72414464186181, 20.120303078724135], [94.72338989482785, 20.127347384674124], [94.72489938889572, 20.132379031267305], [94.73093736516734, 20.14319707058837], [94.73722692318404, 20.16282049257171], [94.74125224099816, 20.16810372180936], [94.7419882551539, 20.169897756876026], [94.75366320359404, 20.168758737625694], [94.76527171192004, 20.166091917707888], [94.76565572693033, 20.16558789896243], [94.7674168027433, 20.15778884687785], [94.77420952604882, 20.13866858928401], [94.75961775065872, 20.125837890606192], [94.73892674437383, 20.106151302040985], [94.73370477065868, 20.10118282202967], [94.72565413592969, 20.10671763301241], [94.72489938889572, 20.112755609283965], [94.72364147657294, 20.120051496979045], [94.72340378575615, 20.12025677622927]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
