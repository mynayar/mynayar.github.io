
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Lat (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Lat (North)</div><div class="name-mm">ကွန်လပ် (မြောက်)</div></div>
        <span class="pcode-badge">MMR009020074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76010851789385, 21.618901599229446], [94.76050013037678, 21.61879145835917], [94.7660394487616, 21.608351973364904], [94.7698743621122, 21.605369262981128], [94.77297881462067, 21.605369262981128], [94.77328317308002, 21.603238755564178], [94.77413537604684, 21.59961689430429], [94.77647893375587, 21.593012321761307], [94.77626874870384, 21.589439183971194], [94.77626588256447, 21.5893904596021], [94.76859605766197, 21.591094864636318], [94.755386912576, 21.591307915827713], [94.74558658025654, 21.593012321761307], [94.73654223423677, 21.593204755095428], [94.73685150119587, 21.593651474436058], [94.73685150119587, 21.60174740082192], [94.73642539971246, 21.60643451713929], [94.73727760267928, 21.61133468284936], [94.74153861661392, 21.61474349471655], [94.75176505131611, 21.616447899750824], [94.75943487711794, 21.6179392553924], [94.76010851789385, 21.618901599229446]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
