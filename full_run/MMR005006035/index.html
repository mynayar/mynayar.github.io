
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Chi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Chi</div><div class="name-mm">မင်းချီ</div></div>
        <span class="pcode-badge">MMR005006035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6018963533341, 22.43274124930923], [95.60790503958594, 22.436747100398406], [95.61506148020322, 22.43464227042449], [95.62390163964903, 22.430011770027193], [95.63274179999411, 22.43127465020501], [95.63842979969559, 22.43294756997443], [95.64073991971156, 22.42832787043494], [95.64200279988938, 22.41948780002201], [95.64316595964141, 22.4187123595878], [95.64284447988888, 22.414857209692514], [95.64073991971156, 22.406859000042857], [95.64024960033885, 22.406205420443825], [95.63821416025536, 22.40349137982338], [95.63316264044357, 22.402649430027225], [95.63021603963858, 22.39717697983383], [95.63021603963858, 22.392546480335852], [95.62642740000456, 22.389178770184174], [95.62555151968695, 22.389507180112332], [95.61969179983674, 22.39170452964038], [95.61548231975331, 22.39423028999596], [95.60748420003586, 22.396756050351485], [95.6011698000463, 22.39465122037757], [95.59527623960685, 22.39170452964038], [95.58847044015874, 22.389229619651303], [95.58727811988939, 22.39717697983383], [95.58854100006715, 22.405175190382806], [95.58601523971163, 22.411910519854644], [95.58164376025138, 22.4140962600344], [95.58813239039756, 22.416120089870276], [95.59022850144424, 22.419962984704057], [95.5906572658202, 22.42074905872215], [95.5994860803184, 22.41948780002201], [95.60076119037672, 22.427064990257122], [95.6018963533341, 22.43274124930923]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
