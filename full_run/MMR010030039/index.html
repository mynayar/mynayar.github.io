
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnget Gyi Thaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnget Gyi Thaik</div><div class="name-mm">ငှက်ကြီးသိုက်</div></div>
        <span class="pcode-badge">MMR010030039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07535445664291, 20.929192334158927], [96.0700051551139, 20.93800294907686], [96.07724244568237, 20.945869569924753], [96.08506726424292, 20.951623113116227], [96.08794104963977, 20.953736189873325], [96.10052764263668, 20.96443479383072], [96.10398895602555, 20.96286147038063], [96.10650627444505, 20.961288146031166], [96.105876945065, 20.955309515122053], [96.10776493410447, 20.951848200833865], [96.11594621874303, 20.950904206763767], [96.12507149925034, 20.951848200833865], [96.13105013015945, 20.951848200833865], [96.13482610823837, 20.946184234614805], [96.12884747732926, 20.938317613766912], [96.12853281173994, 20.931080323198387], [96.1294258592161, 20.929634437279503], [96.11405822970357, 20.92761900980952], [96.0964369998677, 20.927933675398833], [96.08196241783139, 20.926360351049425], [96.07535445664291, 20.929192334158927]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
