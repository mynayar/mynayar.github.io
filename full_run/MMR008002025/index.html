
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Yar Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Yar Taw</div><div class="name-mm">အရာတော်</div></div>
        <span class="pcode-badge">MMR008002025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70815192667015, 19.014355490113815], [95.71322034834049, 19.00247574356075], [95.70901799628354, 18.995471824365268], [95.68987394712502, 18.988000976264118], [95.68847316310604, 18.99453796835263], [95.67866767497327, 18.997806464396888], [95.67119682687212, 18.993137184333648], [95.66419290587794, 18.98566633533318], [95.66559368989692, 18.98099705526994], [95.66139133784003, 18.97165849514346], [95.6520527777136, 18.96372071903602], [95.64722546068651, 18.9656423067471], [95.64940206375428, 18.97652532208599], [95.65375526899055, 18.993938144829542], [95.64649992633059, 18.993938144829542], [95.63706798060286, 18.995389212642124], [95.63634244624694, 19.002644556201346], [95.63924458277131, 19.013527570640917], [95.63924458277131, 19.0280382568601], [95.67552129786964, 19.033842530808215], [95.68640431320853, 19.029489324672625], [95.69623417926402, 19.018255192423226], [95.70164053288437, 19.012076501929073], [95.70295075427396, 19.012535079730185], [95.70815192667015, 19.014355490113815]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
