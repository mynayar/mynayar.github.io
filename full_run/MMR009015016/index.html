
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Put Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Put Su</div><div class="name-mm">ပွတ်စု</div></div>
        <span class="pcode-badge">MMR009015016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99054206836183, 19.025574581202022], [94.99652925991745, 19.025859685176385], [95.00859650792256, 19.025412749998452], [95.00948540232952, 19.02556089891641], [95.01185294225951, 19.023011239976768], [95.02191913486024, 19.018179466808988], [95.0228984309179, 19.008876151113554], [95.02692084661982, 19.002619060421353], [95.03541261410089, 18.99144568277211], [95.05540460973504, 18.98114677620282], [95.05545143743393, 18.980874325689626], [95.05592312735052, 18.978129947339255], [95.0510564802724, 18.975696623800218], [95.0437565105546, 18.974885516253607], [95.03618617315345, 18.970559609038787], [95.03158989555732, 18.967855916017754], [95.02618251131389, 18.959744838753352], [95.02481575943983, 18.958159405931895], [95.01440666433615, 18.963735707137232], [95.00591489685507, 18.969992797829434], [94.99921087098494, 18.972227473718988], [94.99100188363008, 18.97343467776824], [94.99060673411356, 18.98299730757975], [94.99043016571966, 19.005068248001294], [94.99161234073699, 19.01746797716544], [94.98902979359013, 19.02550256798918], [94.99054206836183, 19.025574581202022]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
