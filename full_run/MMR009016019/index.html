
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htauk Kyant Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htauk Kyant Taing</div><div class="name-mm">ထောက်ကြံ့တိုင်း</div></div>
        <span class="pcode-badge">MMR009016019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25424943196577, 19.266014995995306], [95.25297187934882, 19.25643334732115], [95.25799308121577, 19.25177080138144], [95.26552488626453, 19.252129459107323], [95.27223612469743, 19.252562442202986], [95.27200465089396, 19.25121217400266], [95.27059266132233, 19.242387239179777], [95.27051664882435, 19.241912160617744], [95.26679664365025, 19.238564157310066], [95.25935663420137, 19.238936157377793], [95.24856861874684, 19.233728150134084], [95.23789297897787, 19.228206266905715], [95.23629260212198, 19.228892142958102], [95.23145659494594, 19.224428136749168], [95.23220059598077, 19.215872126197723], [95.22587658763445, 19.21438412412806], [95.21795601285976, 19.218754096324517], [95.21925808819026, 19.22630612982408], [95.22248600412587, 19.235631220804237], [95.22571392006142, 19.24280436812711], [95.23252840965841, 19.248901543171712], [95.2368322978723, 19.260019920083323], [95.2368322978723, 19.270444893617025], [95.24185350063863, 19.26826903878515], [95.24687470430422, 19.266834409680314], [95.25424943196577, 19.266014995995306]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
