
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Yar Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Yar Pyin</div><div class="name-mm">တောင်ယာပြင်</div></div>
        <span class="pcode-badge">MMR009023053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.09934983063022, 22.341659955742387], [94.09533770856848, 22.341182322206464], [94.08047995598525, 22.34012105384363], [94.06456093593852, 22.346488662222043], [94.04227430841269, 22.352856269701135], [94.02081221711018, 22.352390694275186], [94.01836882656016, 22.366474985831985], [94.04354783026821, 22.36155866829796], [94.08111671736265, 22.3611341604132], [94.10679940257046, 22.36304444274691], [94.11507729418184, 22.36622824693609], [94.11635081513805, 22.375779658604415], [94.11911011234184, 22.3840575502158], [94.12335518399459, 22.380449238141864], [94.13418011841782, 22.381298253012005], [94.13778842869311, 22.376416419981865], [94.13524138588133, 22.370473318588836], [94.133331104447, 22.36092190692051], [94.125689974213, 22.348398943656377], [94.11316701094887, 22.34330485803281], [94.09934983063022, 22.341659955742387]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
