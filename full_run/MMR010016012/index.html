
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Toet Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Toet Seik</div><div class="name-mm">ကူးတို့ဆိပ်</div></div>
        <span class="pcode-badge">MMR010016012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.93007238493266, 21.83362012017244], [95.92927753533007, 21.828851020758066], [95.92748912192548, 21.824081922242954], [95.92629684842086, 21.819511535229196], [95.9255019979189, 21.816530848320042], [95.92073289940384, 21.811960461306285], [95.9175534991947, 21.809575911599097], [95.91477152468616, 21.80401196258208], [95.91338053698223, 21.80182612527551], [95.91224072992583, 21.799039929349306], [95.91159212537633, 21.79745445066243], [95.90940628806982, 21.794473763753217], [95.90772097474326, 21.79202239891464], [95.90298442089437, 21.790870264850867], [95.89609589460991, 21.787839313033942], [95.88953504080956, 21.785531703025697], [95.89191959141607, 21.794076338951925], [95.89430414022394, 21.79924286316765], [95.89430414022394, 21.8059990865886], [95.89648997842983, 21.81176174890561], [95.8984771024364, 21.81613342261943], [95.90205392744684, 21.820306384831838], [95.90443847625471, 21.824479347044303], [95.90454853528672, 21.824868784966498], [95.9067335820892, 21.832600488621722], [95.90741916316392, 21.83222913336789], [95.91437409988487, 21.83262655816918], [95.92510457311761, 21.832030420067895], [95.92490585981761, 21.833818832573115], [95.92331616061239, 21.83580595657969], [95.9217264614071, 21.836402094680977], [95.93007238493266, 21.83362012017244]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
