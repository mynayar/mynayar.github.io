
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Gyi Kone</div><div class="name-mm">အင်းကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR009015039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02738331668678, 19.171030292214255], [95.0288862034356, 19.166306934117756], [95.02834546537099, 19.158195856853354], [95.02780472640706, 19.150895887135505], [95.02838275665897, 19.14800573317808], [95.02753435692512, 19.146569979920685], [95.0105010948497, 19.144136656381647], [95.00509371060633, 19.143325548835037], [95.00563444867095, 19.149003302560402], [95.0068948763975, 19.15278458214283], [95.00076780339145, 19.15143662609944], [94.99432712599611, 19.150363180016768], [94.99427894122022, 19.150355149070947], [94.99346783367366, 19.153869948739214], [94.99335901660538, 19.154370508692068], [94.99211598806244, 19.160088441428456], [94.98887155697685, 19.167388411146305], [94.98914192555947, 19.171173580296568], [94.99481968018415, 19.1741476410009], [95.00157891093806, 19.17333653435361], [95.01488295788226, 19.17152795904815], [95.02561310735905, 19.171080870086143], [95.02738331668678, 19.171030292214255]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
