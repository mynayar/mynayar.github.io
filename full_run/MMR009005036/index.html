
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Cho</div><div class="name-mm">ဂွေးချို</div></div>
        <span class="pcode-badge">MMR009005036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31994499016923, 20.13517131290581], [95.3192370699349, 20.129861916993946], [95.31994606665774, 20.121708452882842], [95.31959156919561, 20.1153274805788], [95.31985555708837, 20.113479564430406], [95.31781907738855, 20.111782496964736], [95.31569208632078, 20.093703076935526], [95.30505713278052, 20.08944909479993], [95.30489799504647, 20.088706451741416], [95.2957404711459, 20.091232665355278], [95.29241704810835, 20.097325607290998], [95.29241704810835, 20.107849779643686], [95.29238808634119, 20.10840006311247], [95.29186314396895, 20.11837395199632], [95.28853972093145, 20.127236412830257], [95.28632410617263, 20.13000593172842], [95.28632410617263, 20.136211359966353], [95.29052269726475, 20.135888390936543], [95.29903065883792, 20.13305240314594], [95.30470263441913, 20.13482489585232], [95.31994499016923, 20.13517131290581]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
