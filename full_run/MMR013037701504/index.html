
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Super Pin (South) Ward (Saw Yan Paing_South Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ahlone</div><div class="name-mm">အလုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Super Pin (South) Ward (Saw Yan Paing_South Ward)</div><div class="name-mm">ဆူပါပင် (တောင်) ရပ်ကွက် (စောရန်ပိုင်(တောင်))</div></div>
        <span class="pcode-badge">MMR013037701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13346227016768, 16.786952972801487], [96.1331920625637, 16.786748886052294], [96.13280296368589, 16.7864532474195], [96.13242149375696, 16.7861423490902], [96.13191032540124, 16.785760879161273], [96.13126818338003, 16.785242080957346], [96.13056882199362, 16.784621556839454], [96.13010915241551, 16.784254074066325], [96.12971687443428, 16.783952713047313], [96.12867409883063, 16.783212934329526], [96.1285057070728, 16.783658981876556], [96.12810961416744, 16.784578323730727], [96.12768872605392, 16.785462908586396], [96.12741279606377, 16.78609085121184], [96.12712974524163, 16.786722183382096], [96.12737846444463, 16.786840438835213], [96.12885856597012, 16.7874622345945], [96.12946371617761, 16.787721287007855], [96.12980376333309, 16.787897533444436], [96.13009198525697, 16.788139978976915], [96.13055992140329, 16.788591384684707], [96.13086891227056, 16.788868904676235], [96.13120269744661, 16.78913593317685], [96.131573104815, 16.789369583339635], [96.13205528262523, 16.788751603403796], [96.13265037571432, 16.78797340384955], [96.13314628617223, 16.78735160809032], [96.13346227016768, 16.786952972801487]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
