
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Lel</div><div class="name-mm">စမ်းလယ်</div></div>
        <span class="pcode-badge">MMR009013049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64488217477259, 19.62840161414323], [94.65764145468944, 19.626173954764226], [94.66819054275942, 19.62636930909639], [94.67971639799345, 19.627736783126068], [94.69378184695472, 19.623634360137657], [94.6993005825559, 19.620691847650676], [94.70032747793084, 19.606334514726143], [94.6809088621543, 19.609166396212288], [94.68028614099268, 19.60843988789054], [94.67882688125565, 19.60856352218883], [94.67642382979597, 19.6103451070411], [94.67595772377001, 19.61162185026825], [94.67593170368525, 19.611693263633242], [94.67580718535339, 19.611808758167683], [94.67496858912915, 19.61258657371144], [94.66842590163412, 19.612520128201425], [94.66734518363336, 19.612509152875134], [94.66724801368497, 19.612351886630336], [94.66594129155743, 19.610238418668132], [94.66533928178251, 19.609064724257678], [94.66454331971846, 19.607514797569877], [94.66263747643842, 19.607495617728603], [94.66214120984904, 19.609296326664207], [94.655398401615, 19.609226383690725], [94.65118180699483, 19.609183227923666], [94.65068976721903, 19.610532764975176], [94.65064632816558, 19.610526428352046], [94.64806913468288, 19.616992341623302], [94.64611560125405, 19.623243653272027], [94.64488217477259, 19.62840161414323]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
