
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Say Min Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Say Min Taw</div><div class="name-mm">ဆေးမင်းတော</div></div>
        <span class="pcode-badge">MMR009024022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.17030301886928, 21.898787020904365], [94.17051393327148, 21.896677872385965], [94.16905621767035, 21.889875199880635], [94.16906765075151, 21.889852333718295], [94.16273945066519, 21.889389295279784], [94.14451800789982, 21.8884174842795], [94.13479990599092, 21.887931578779387], [94.12216637198054, 21.888174532428764], [94.10831807601846, 21.89011815173137], [94.10761569740657, 21.890908329355966], [94.10637445491722, 21.892304725582676], [94.1085610278692, 21.899836255438913], [94.11390598477345, 21.902265781140954], [94.12119456187958, 21.907367785295094], [94.13018189357956, 21.91347029421877], [94.13018380733689, 21.913441598650934], [94.13771533719313, 21.912712741300027], [94.14524686614999, 21.909068452746965], [94.15132068040515, 21.904938258693733], [94.16030992496314, 21.899350349938743], [94.17027098142074, 21.898135587087722], [94.17030301886928, 21.898787020904365]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
