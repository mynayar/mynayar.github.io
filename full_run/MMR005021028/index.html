
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hton</div><div class="name-mm">မံထုံ</div></div>
        <span class="pcode-badge">MMR005021028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07150043989344, 24.362853209607977], [96.07312008022757, 24.359313960071233], [96.07348619962846, 24.353881830082457], [96.0709229995968, 24.347290050395543], [96.0637208401447, 24.341918940306925], [96.05169683963749, 24.34051512017669], [96.0394895995654, 24.339721679811703], [96.02807615958716, 24.34112549994194], [96.0186769204036, 24.34667966973103], [96.0106813196872, 24.35070797958963], [96.00250248030528, 24.356506319810876], [95.9937134401232, 24.358520519706246], [95.98571784030617, 24.360473609769315], [95.97448728016388, 24.364074690394716], [95.9704048796815, 24.36448886956572], [95.97035553028354, 24.364493996600686], [95.96657787227105, 24.366207997401204], [95.96922643864929, 24.367101901931278], [95.96929931970789, 24.367126500187908], [95.9697431998888, 24.367239630404697], [95.9755248001295, 24.368713380018505], [95.98071275968618, 24.37011720014874], [95.98669415960785, 24.373291049742193], [95.99987807960974, 24.377502420200585], [96.0098875195934, 24.378906240330764], [96.02252207973027, 24.37908938996344], [96.03527831993858, 24.378906240330764], [96.05151360007267, 24.373291049742193], [96.06048587981957, 24.369323759783754], [96.0709229995968, 24.36267087026448], [96.07150043989344, 24.362853209607977]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
