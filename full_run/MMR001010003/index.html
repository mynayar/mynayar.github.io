
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Laik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Laik</div><div class="name-mm">နောင်လိုက်</div></div>
        <span class="pcode-badge">MMR001010003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.38640082313952, 24.353137609613043], [97.38247096026669, 24.354170531345005], [97.3760775899089, 24.355516504383218], [97.36665578133932, 24.355180010449146], [97.35757046490511, 24.359554421699272], [97.35050410757856, 24.364265325984036], [97.34540389037733, 24.36831032725985], [97.35323154989618, 24.375542956642164], [97.35340838808668, 24.37574281567845], [97.3548568937307, 24.377379885773166], [97.35720769008287, 24.380036707028466], [97.35851746720738, 24.381516992015634], [97.35879548992, 24.381831207943947], [97.35947707890415, 24.38260152404115], [97.3611803346048, 24.384526510290243], [97.36886846880486, 24.38576226961311], [97.37425767415237, 24.389579977134304], [97.38136842741108, 24.39461722200724], [97.38827714797208, 24.383015865989478], [97.38831873712007, 24.382977765311693], [97.38925720575548, 24.382105199895136], [97.39386910727353, 24.375866437386208], [97.39491089991816, 24.371699553691485], [97.3912653307305, 24.35971962176319], [97.38640082313952, 24.353137609613043]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
