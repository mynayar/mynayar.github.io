
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Hpyu Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Hpyu Thaung</div><div class="name-mm">ဇီးဖြူသောင်</div></div>
        <span class="pcode-badge">MMR007014012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.48406797006083, 18.791153678699345], [96.48431761016963, 18.78839624938746], [96.48850437607615, 18.783565364749848], [96.4920470241509, 18.78066683540618], [96.49269114198268, 18.77390359727326], [96.49269114198268, 18.767140359140285], [96.49075878938669, 18.76069917992328], [96.49049131572173, 18.75428529423101], [96.48463966818622, 18.752003588294997], [96.4836180770127, 18.749407557612756], [96.47819848896916, 18.747494762573297], [96.47143525083624, 18.745240350162078], [96.46499407161917, 18.742663877935684], [96.45831032366254, 18.74140005436908], [96.45498873344337, 18.741853015004665], [96.45356856094037, 18.74094900659145], [96.446648663605, 18.738791076147322], [96.44346285033032, 18.74197689032127], [96.44835029782803, 18.74591614391494], [96.45546096565113, 18.755403804442096], [96.4545114398511, 18.756760837342824], [96.45167670931272, 18.758213478069592], [96.44834633541512, 18.75992010892594], [96.44834342520898, 18.763535675830838], [96.4464127588418, 18.767378354827258], [96.44976574709159, 18.768956611058798], [96.45468818631082, 18.77132712504681], [96.46048524679674, 18.775835949869247], [96.4698249571561, 18.78227712908631], [96.47691025420494, 18.787108013723923], [96.48406797006083, 18.791153678699345]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
