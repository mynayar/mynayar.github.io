
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ha Sheik Nauk Nyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ha Sheik Nauk Nyu</div><div class="name-mm">ဟရှိတ်နောက်ညူ</div></div>
        <span class="pcode-badge">MMR005037046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59149155968777, 26.77050783027221], [95.61346524562464, 26.76212090215796], [95.61100316986045, 26.751964836707884], [95.60824549863094, 26.74014624855056], [95.60824549863094, 26.729115566330393], [95.6149426986467, 26.71769093069196], [95.61770036987622, 26.70902396628304], [95.61848827581332, 26.698387235682446], [95.6141547927096, 26.688932365336427], [95.61021526392335, 26.684992835650917], [95.6090538740371, 26.67889554099645], [95.59667952014382, 26.6760863997676], [95.59649664030775, 26.677124009665363], [95.58447263980054, 26.68048091985861], [95.5733032803222, 26.680114709626196], [95.56829819970221, 26.69067387010307], [95.55731207978869, 26.705871540339388], [95.55655680035613, 26.706495689624433], [95.55278652038169, 26.709610860253065], [95.540283360189, 26.720092800442444], [95.5401001197248, 26.726501429597363], [95.54107679965466, 26.739685079802655], [95.55090335980225, 26.75909421042951], [95.55729624002953, 26.769444659843202], [95.57269271979322, 26.76910401014203], [95.59149155968777, 26.77050783027221]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
