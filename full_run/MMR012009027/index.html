
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Yoe Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Yoe Pyin</div><div class="name-mm">ကြက်ရိုးပြင်</div></div>
        <span class="pcode-badge">MMR012009027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.3915265640997, 21.040736566839144], [92.39107295235493, 21.040045029554506], [92.39107295235493, 21.036082844147984], [92.39341973143553, 21.03196166939557], [92.39337377428029, 21.030171533789314], [92.39430511668786, 21.03019240165804], [92.39469058140526, 21.02845781357729], [92.3946996960342, 21.028416799096078], [92.39488772089169, 21.027501989824998], [92.3953479192711, 21.024949596946385], [92.39511320610961, 21.024875632204726], [92.39353821711506, 21.02393063898785], [92.35841596442526, 21.01731568467119], [92.34912352872794, 21.011330727031464], [92.34869389830482, 21.011281499042013], [92.33400363456013, 21.00959823886768], [92.33368863712099, 21.013063215195302], [92.33006616162413, 21.01668568979278], [92.32597119131748, 21.02062316182952], [92.32620356624165, 21.020948487982366], [92.32644368792592, 21.020308164390315], [92.340933586316, 21.022985644871653], [92.35936095674282, 21.026923117807712], [92.37652833741288, 21.033695570394286], [92.38676576542781, 21.03952302976404], [92.3915265640997, 21.040736566839144]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
