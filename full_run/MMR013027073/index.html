
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Twantay</div><div class="name-mm">တွံတေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Su</div><div class="name-mm">ကျောင်းစု</div></div>
        <span class="pcode-badge">MMR013027073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83800463490604, 16.575482069242128], [95.83814016004044, 16.57555857007202], [95.8421894402905, 16.57802754003899], [95.84695727975469, 16.580943000019488], [95.85173304044753, 16.58337290973202], [95.85233207976171, 16.581959820289512], [95.85293147970407, 16.580546729947685], [95.85472896007349, 16.57627280984235], [95.85593063958743, 16.573238550318877], [95.85645480044872, 16.571997809651236], [95.85669492033435, 16.57054466980071], [95.85656748010518, 16.56957158985705], [95.85609840002121, 16.567552979686297], [95.85584712044829, 16.565398829992034], [95.85615168035582, 16.56389483977506], [95.85623916010923, 16.56346238997736], [95.85661500028209, 16.562496779802586], [95.85716076016104, 16.561366289722514], [95.85655816402812, 16.56020878041096], [95.85454542643032, 16.556776417997355], [95.85347438243684, 16.555754429323486], [95.85149682541822, 16.55594290564062], [95.8493081786296, 16.556636496976807], [95.84724971230446, 16.557753176168205], [95.84501355523145, 16.56159508264699], [95.84359010110234, 16.563806524551524], [95.84214436267229, 16.567126370085987], [95.84050632041044, 16.570887801630818], [95.8389099374437, 16.573218815595908], [95.83800463490604, 16.575482069242128]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
