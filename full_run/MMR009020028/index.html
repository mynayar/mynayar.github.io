
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Kan</div><div class="name-mm">အလယ်ကန်</div></div>
        <span class="pcode-badge">MMR009020028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92695820375815, 21.61659697856777], [94.92633639271043, 21.616694518137535], [94.9249798589334, 21.62799896567975], [94.93784172631467, 21.639122179145318], [94.9472757395838, 21.64534862813673], [94.9531812870868, 21.649878409860776], [94.95595404894027, 21.65015568613603], [94.97584987826934, 21.65106004168763], [94.98738041627325, 21.650381774799143], [94.99235437315588, 21.650381774799143], [94.9932328363264, 21.651122978043077], [94.99438917382139, 21.649477419247546], [94.9971022422747, 21.636816436129664], [95.00191472138732, 21.63608727210999], [94.99529353027225, 21.629129410793723], [94.98964130560182, 21.624381542574156], [94.97675423382088, 21.621216296794728], [94.9521105362723, 21.617372784126758], [94.93741475338823, 21.61556407302362], [94.93741475338823, 21.61495673566486], [94.92695820375815, 21.61659697856777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
