
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Mu Zi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Mu Zi</div><div class="name-mm">တောင်မူဇီ</div></div>
        <span class="pcode-badge">MMR012004008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.92352770963618, 20.97737004319299], [92.92716953044953, 20.969098507989827], [92.92743780900776, 20.967166896435174], [92.92445870940196, 20.95813649800101], [92.92257916589585, 20.949750843326797], [92.92518160964363, 20.9455580150904], [92.92850695633103, 20.942955571342566], [92.92869667730986, 20.942860119998613], [92.91787661091689, 20.941973229281132], [92.90456513107597, 20.942475549207302], [92.89828613110012, 20.959303267631753], [92.8972814912479, 20.965079947681488], [92.89828613110012, 20.96960082791594], [92.9010488906938, 20.974121707251015], [92.90255585137152, 20.980149547263863], [92.90102377532702, 20.983531835425936], [92.89754102299986, 20.989693626759504], [92.89754102299986, 20.993980090608773], [92.9015595833082, 20.99585541899245], [92.91629430323957, 20.997462842036555], [92.91709801476162, 20.991033147162057], [92.92058076708878, 20.983263930985686], [92.92352770963618, 20.97737004319299]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
