
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Hpe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Hpe</div><div class="name-mm">စဖဲ</div></div>
        <span class="pcode-badge">MMR009021062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.53876406371063, 21.522151384179097], [94.53938711672214, 21.521750850421483], [94.54266223177666, 21.52939278464936], [94.5486666093766, 21.528846932140254], [94.55521683768694, 21.520113292894223], [94.5710465586518, 21.510833802038405], [94.58414701797057, 21.504829425337732], [94.58417838002828, 21.50506986897932], [94.59178895219844, 21.497187490210536], [94.59381844776323, 21.496336411396328], [94.59124309879002, 21.487907999354718], [94.5857845745985, 21.474261688426225], [94.59451821384454, 21.456794409934105], [94.59506406635364, 21.45079003323349], [94.5825094604433, 21.443693950615398], [94.58261236716709, 21.442973605347674], [94.58011039028236, 21.444422118186253], [94.57759678786152, 21.445877360651707], [94.56777144359728, 21.451881738251643], [94.55139587102269, 21.45406514828801], [94.54429978930392, 21.461707081616566], [94.53661219469711, 21.471655732825866], [94.53502029844805, 21.4737158350178], [94.53571266490763, 21.477004579297954], [94.53720370668577, 21.484087031791148], [94.5404788217403, 21.49118311440924], [94.53751321106591, 21.498102872349705], [94.53720370668577, 21.498825047737796], [94.5377495600942, 21.511379653648135], [94.53993297013051, 21.516838177839702], [94.53876406371063, 21.522151384179097]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
