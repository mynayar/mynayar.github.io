
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saik Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saik Khan</div><div class="name-mm">ဆိုက်ခန်း</div></div>
        <span class="pcode-badge">MMR009022021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70133219602411, 21.114016726590705], [94.70353956939567, 21.111395460032497], [94.70822567937165, 21.108382952411375], [94.71257700772281, 21.108550395384498], [94.71933168970577, 21.111135609920495], [94.72028461494307, 21.112050269904103], [94.72462676121614, 21.11373895388965], [94.72894412756949, 21.112139002413073], [94.72992836720044, 21.110343094058578], [94.73014972542956, 21.108383331025948], [94.73148870084293, 21.103195003646533], [94.73064045309451, 21.101309828585784], [94.7291036574079, 21.101060619252223], [94.72261187693664, 21.097003255895572], [94.717337304573, 21.092134420766968], [94.70922257875907, 21.090917211759972], [94.70330886091529, 21.090917211759972], [94.69907917216614, 21.090917211759972], [94.69338410559203, 21.096232607049217], [94.69299312803048, 21.096597519559907], [94.68771855566689, 21.105117981709554], [94.6820382478669, 21.106740927052215], [94.68152573862199, 21.10917534506615], [94.6852841376529, 21.10917534506615], [94.69948490760248, 21.112015499415804], [94.70133219602411, 21.114016726590705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
