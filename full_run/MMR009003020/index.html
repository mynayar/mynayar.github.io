
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Ye</div><div class="name-mm">ကျောက်ရဲ</div></div>
        <span class="pcode-badge">MMR009003020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8589958557742, 20.60509574067595], [94.85929301066398, 20.60053935790512], [94.86121349670555, 20.593817656759484], [94.86073337564483, 20.585655592431692], [94.86025325368479, 20.578453769326018], [94.86249041619982, 20.572637148585613], [94.86265386168645, 20.572212190140533], [94.84728997425299, 20.56020915283017], [94.8357670580034, 20.557328423767785], [94.82568450673466, 20.558768787849317], [94.82280377767228, 20.549166357641354], [94.81332496017882, 20.549166357641354], [94.8133098326827, 20.54908311639275], [94.80868632091705, 20.548990139983005], [94.809450894843, 20.55327241838745], [94.81007825200976, 20.56557384895399], [94.81026283066518, 20.571053099820745], [94.8104545922057, 20.57674555386427], [94.80668886999541, 20.584151445732687], [94.80380178002821, 20.59168287756279], [94.80304386288401, 20.594097578840262], [94.79992624430082, 20.604030214023226], [94.80237893743805, 20.604893732259995], [94.80229328510705, 20.6051777075852], [94.81368146942435, 20.610141788113083], [94.83052393223375, 20.61970102388318], [94.84152851612816, 20.6072610590507], [94.85833276764316, 20.604860451948355], [94.8589958557742, 20.60509574067595]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
