
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Do Mo Saw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hpruso</div><div class="name-mm">ဖရူဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Do Mo Saw</div><div class="name-mm">ဒိုမိုစော</div></div>
        <span class="pcode-badge">MMR002003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.94715960163438, 19.259525015067425], [96.96309536885627, 19.271276642403166], [96.97462677920254, 19.282808050950848], [96.97702915617066, 19.29001518185521], [96.98615818775022, 19.286972171928255], [96.99640833038018, 19.283769001738108], [97.00858037278601, 19.276081396339407], [97.02779938943036, 19.26775315618329], [97.0393307988773, 19.263268719176097], [97.0508622083243, 19.25301857744546], [97.0508622083243, 19.248534140438267], [97.05279761321935, 19.242691345828973], [97.05279761321935, 19.231596193909297], [97.05858638825129, 19.225083822560407], [97.06919914202683, 19.222671832738968], [97.07209352909314, 19.217365455851166], [97.05542413271763, 19.202362999652735], [97.04573713655964, 19.204971038082988], [97.035486994829, 19.204330404224834], [97.02908065714666, 19.21073674190717], [97.02395558628132, 19.2177837152463], [97.01947114927418, 19.22226815225349], [97.0053772043945, 19.23059639240961], [96.99128325861557, 19.235080829416802], [96.9749070556162, 19.24222789999766], [96.96806028215633, 19.24691253598479], [96.95833065543547, 19.254119665989833], [96.94715960163438, 19.259525015067425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
