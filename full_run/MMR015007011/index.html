
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Pang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Pang</div><div class="name-mm">ယောင်ပန်</div></div>
        <span class="pcode-badge">MMR015007011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.1756913517745, 22.969474598673855], [99.17708476584932, 22.979507182710392], [99.17477749668416, 22.987294216255123], [99.17354413495394, 22.992766732998405], [99.18083407902958, 22.997965336031484], [99.18804429460857, 23.007482820775635], [99.19525451108689, 23.017288715401946], [99.2096749431442, 23.03228596542499], [99.21428948237377, 23.042091859152038], [99.21629055306664, 23.047091499772932], [99.23380167530712, 23.042908532602723], [99.2324592258127, 23.040072998070457], [99.22870991443108, 23.027383018111834], [99.2281330973646, 23.01498144623679], [99.22354797316046, 23.004168363978863], [99.22178810603634, 23.002579874361743], [99.21486629944025, 22.997100109982114], [99.20679085691256, 22.99421602375054], [99.19756178025204, 22.979507182710392], [99.18890952065789, 22.969701288983345], [99.17778118105673, 22.967698833334566], [99.1756913517745, 22.969474598673855]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
