
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thone Daunt Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thone Daunt Kan</div><div class="name-mm">သုံးဒေါင့်ကန်</div></div>
        <span class="pcode-badge">MMR008007027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.81063342039607, 17.76998668124037], [95.81132312935898, 17.770090679741145], [95.816248318705, 17.767741744086265], [95.82373977926744, 17.76664923687281], [95.82886983777286, 17.76630723369192], [95.82948882674799, 17.763966847891766], [95.83090752256419, 17.763067101365664], [95.83373814140214, 17.76262472035461], [95.83704493057917, 17.76128149744318], [95.83931097302303, 17.7612893862962], [95.83980065387715, 17.7537127158692], [95.8371019152213, 17.751504657214184], [95.82679763610207, 17.74978727676148], [95.81747471698463, 17.749541937210665], [95.8115865578734, 17.751504657214184], [95.80937849831912, 17.757147475875342], [95.80471703876037, 17.758619515878024], [95.79858354009838, 17.756902136324584], [95.79416742098977, 17.758864856328103], [95.79343140143811, 17.76205427498485], [95.79416537683073, 17.767003830562373], [95.79471036868864, 17.767429596598674], [95.80017289126596, 17.769614608327572], [95.80376254870271, 17.770707111943693], [95.80919071987586, 17.76976914243204], [95.81063342039607, 17.76998668124037]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
