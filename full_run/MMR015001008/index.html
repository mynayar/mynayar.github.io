
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tar Pong</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tar Pong</div><div class="name-mm">တာပုံ</div></div>
        <span class="pcode-badge">MMR015001008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.7685678561217, 23.002756520996684], [97.77507076030741, 23.005929591777317], [97.78730391074697, 23.014464348650847], [97.7892953541973, 23.018162743116136], [97.79327824019867, 23.021007662074], [97.7989680781144, 23.02186113758148], [97.80415587129647, 23.020393255144654], [97.80835630959609, 23.015602315694366], [97.81660657493353, 23.010196971113373], [97.8183135259485, 23.00735205215551], [97.81897734073175, 23.004364887429688], [97.82058946093491, 22.997110344267014], [97.82229641284925, 22.987153127914553], [97.82505484580457, 22.97709121878478], [97.82457234783567, 22.974919976575734], [97.8163220833975, 22.974919976575734], [97.80750283498793, 22.974066501068194], [97.80241356883118, 22.974074231640543], [97.78872637022585, 22.974350992604286], [97.77876915387338, 22.976057945417892], [97.77393279236452, 22.982316766405688], [97.76938092239169, 22.987153127914553], [97.76581818526108, 22.989934481890884], [97.7685678561217, 23.002756520996684]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
