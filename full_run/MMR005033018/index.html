
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hein Sun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hein Sun</div><div class="name-mm">ဟိန်စွန်း</div></div>
        <span class="pcode-badge">MMR005033018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58990467985717, 25.923278789784376], [95.6505128397958, 25.923889170448888], [95.65463700029738, 25.918047539562338], [95.67189108010933, 25.893607679650756], [95.7009275998289, 25.852478040229414], [95.70227040005898, 25.85028077973425], [95.75848403990659, 25.821899370259757], [95.76106050673707, 25.820454855806986], [95.84462016029221, 25.773596999901656], [95.84869392008841, 25.771301279830254], [95.83807355984698, 25.768676790101836], [95.78710943994878, 25.771484340429993], [95.74432379970364, 25.771484340429993], [95.70312504018852, 25.77532958968885], [95.675293079612, 25.78051755014485], [95.65429680025716, 25.78051755014485], [95.63549796036261, 25.786682099699192], [95.60687256032048, 25.803710910130462], [95.60676024039282, 25.80363611981113], [95.60632319955607, 25.80389405976308], [95.60467511996086, 25.823303190389993], [95.59887695960407, 25.848083520138402], [95.57891855994365, 25.856689409788487], [95.55889895961934, 25.86669921040027], [95.54187024001965, 25.881713909968994], [95.51709000020338, 25.917724619995283], [95.53649903999877, 25.915527360399437], [95.56512444004096, 25.915527360399437], [95.5891112403915, 25.920288089823543], [95.58990467985717, 25.923278789784376]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
