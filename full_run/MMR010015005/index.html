
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hin Nyant Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hin Nyant Kan</div><div class="name-mm">ဟင်းညံ့ကန်</div></div>
        <span class="pcode-badge">MMR010015005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95318031292118, 21.428144454802805], [95.95238304144425, 21.42748832742444], [95.94446896876798, 21.43100580707238], [95.93900750019606, 21.43100580707238], [95.93733381600288, 21.437150353905736], [95.9363536071333, 21.43915813803767], [95.93604087778436, 21.439798354610446], [95.93732364017393, 21.441545205846637], [95.93791770893517, 21.442354201785008], [95.9396724697088, 21.446901320639483], [95.93938255256279, 21.451211928587668], [95.93934426572537, 21.453369428256565], [95.941738235831, 21.453943981729424], [95.94331323921466, 21.453446611671836], [95.95211502818609, 21.450667098607767], [95.95270678029374, 21.45305452164888], [95.95553425690048, 21.44863929376845], [95.95985300101523, 21.443323915566282], [95.95719531191418, 21.43667969371296], [95.95318031292118, 21.428144454802805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
