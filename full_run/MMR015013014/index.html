
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thone Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thone Se</div><div class="name-mm">သုံးဆယ်</div></div>
        <span class="pcode-badge">MMR015013014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65782089871556, 22.260293914132887], [96.64597535607788, 22.241908265054462], [96.6384877976738, 22.233707606321047], [96.63028713804107, 22.23014210197647], [96.62244302992195, 22.216593186726243], [96.61625223275439, 22.203559928348056], [96.61566857184715, 22.202331170247362], [96.59926725438032, 22.205540123977585], [96.59752170716109, 22.205626936434044], [96.56376750226849, 22.220002765715094], [96.5661080661344, 22.229072451032835], [96.56437120276883, 22.232126789719644], [96.58143973355692, 22.255813730918987], [96.588927291961, 22.269006094655595], [96.59071004413329, 22.281485359861506], [96.59220944510986, 22.282085120431987], [96.59962380409536, 22.285050864206084], [96.61566857184715, 22.292181871995865], [96.62208647930765, 22.29895632917129], [96.63634849488722, 22.315714198151795], [96.6509670619804, 22.324984507828844], [96.66946829642478, 22.332138318828413], [96.67770834186655, 22.335324470248167], [96.68203788234246, 22.334658387374702], [96.68020419526744, 22.324984507828844], [96.67414283842129, 22.312148693807217], [96.65774151915582, 22.303234933845147], [96.65310636386766, 22.294321173883134], [96.6491843098081, 22.280772258632908], [96.65025396075174, 22.26579714182469], [96.65782089871556, 22.260293914132887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
