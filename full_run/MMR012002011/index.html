
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gant Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gant Gar</div><div class="name-mm">ဂန့်ဂါ</div></div>
        <span class="pcode-badge">MMR012002011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.93319352765923, 20.43473500441695], [92.93287624594205, 20.436638695619365], [92.93273712082151, 20.436783616870457], [92.93150567644585, 20.438066372065464], [92.92688000360931, 20.441549903205498], [92.92259697427102, 20.443091793551503], [92.92176311837329, 20.44374696584987], [92.92019847787753, 20.444976325596997], [92.91649378096326, 20.449308431838688], [92.91311720169756, 20.453256851322692], [92.91163241830151, 20.455255598167355], [92.91151029936088, 20.455531394158584], [92.9099524784242, 20.45904962024383], [92.91084160035962, 20.459696585329198], [92.91246917001627, 20.460880828787253], [92.92278603424813, 20.46547823323391], [92.92112698562192, 20.471842541999763], [92.93179909465255, 20.47338627955321], [92.93293656527032, 20.4735507772466], [92.94452891727576, 20.471314127345124], [92.94846808543383, 20.470553905238603], [92.94807239812275, 20.463048357695584], [92.9468251913296, 20.4569751306978], [92.94429620870312, 20.444658861317464], [92.95186380676932, 20.435466939247874], [92.93383173604582, 20.434760023556294], [92.93319352765923, 20.43473500441695]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
