
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Ka Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Ka Wa</div><div class="name-mm">မြင်ကဝ</div></div>
        <span class="pcode-badge">MMR009022005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70739820056656, 20.837081935582887], [94.7061429052709, 20.84235394937531], [94.70614282972787, 20.845492069803242], [94.7037578609366, 20.850764062911253], [94.69986658707342, 20.85980177013562], [94.69434356260541, 20.868839447682433], [94.69224566730378, 20.873402337947596], [94.68932257927366, 20.879760005220135], [94.68931745493666, 20.87991874455446], [94.69245248709268, 20.88031188678417], [94.69230625732797, 20.880552833146794], [94.69401399524975, 20.880932329963116], [94.7025313430471, 20.88205303362065], [94.71261767596502, 20.880035767037043], [94.7162039276692, 20.874656388581514], [94.71799705442061, 20.871294277608854], [94.72651440221796, 20.869501151756822], [94.72741096514397, 20.86793216663625], [94.72741096514397, 20.86479419729443], [94.73189377977417, 20.86165622615397], [94.73704901659892, 20.858518255912827], [94.7385567201166, 20.85671874037763], [94.73563965214828, 20.854906935606664], [94.72120511332537, 20.845492339599843], [94.7148292590631, 20.842458116049272], [94.71120548494525, 20.83983640792394], [94.70739820056656, 20.837081935582887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
