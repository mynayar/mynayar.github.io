
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lon Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lon Khin</div><div class="name-mm">လုံခင်</div></div>
        <span class="pcode-badge">MMR005036022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58709703959676, 26.21331782985402], [95.55987564044852, 26.21331782985402], [95.55950916041945, 26.21331782985402], [95.55529787989332, 26.225708039694325], [95.55010992033664, 26.240112269565657], [95.54575175983592, 26.24063211008388], [95.54750856027192, 26.244899189945727], [95.53477968013817, 26.266613130091912], [95.52504600017284, 26.276346989921706], [95.51755835993043, 26.293568489993845], [95.50482947979674, 26.30180475018915], [95.4868593597717, 26.30854358971493], [95.47183439983775, 26.314844310116882], [95.47308360042786, 26.32189940973001], [95.4794019601324, 26.332971299785697], [95.48968499996283, 26.330078160079097], [95.51647943967447, 26.32189940973001], [95.53009032001233, 26.31549068974357], [95.5452880801808, 26.310119669587152], [95.55749495962476, 26.27612307042341], [95.56872551976699, 26.253478980370687], [95.578308000314, 26.23431393024373], [95.58709703959676, 26.21331782985402]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
