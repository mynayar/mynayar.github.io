
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Pale</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Pale</div><div class="name-mm">ရွာပုလဲ</div></div>
        <span class="pcode-badge">MMR005003044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.32912932016205, 21.64630373962592], [95.33027231981174, 21.65041880978032], [95.32821492008253, 21.65613416955631], [95.32592891988378, 21.659791949738747], [95.323413960386, 21.665278709944573], [95.32540188029259, 21.66773418018829], [95.32814507963178, 21.66796277975851], [95.33226023971832, 21.66979175978196], [95.33774699992415, 21.670934760330965], [95.3434623597002, 21.670934760330965], [95.34711996001818, 21.668648670200014], [95.35100651963523, 21.66384780043569], [95.35283531979422, 21.65996132985157], [95.35580748023108, 21.65538905965741], [95.35397832034329, 21.646701720208284], [95.35499381141534, 21.639421438448665], [95.34901896035677, 21.639216689798445], [95.34216024030292, 21.639216689798445], [95.3387312395551, 21.636930599667494], [95.33598767958779, 21.639216689798445], [95.33553048044735, 21.64264596034286], [95.32912932016205, 21.64630373962592]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
