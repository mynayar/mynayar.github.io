
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Se</div><div class="name-mm">တောင်ဆည်</div></div>
        <span class="pcode-badge">MMR010031068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85076853733818, 21.093337618336477], [95.85852215657235, 21.090303827359776], [95.86774685173589, 21.085148851338488], [95.87941337802505, 21.084606221100273], [95.88118943294603, 21.085074473807992], [95.8796715383109, 21.0804937050205], [95.87074855939858, 21.072958745150004], [95.85825638892129, 21.068794688923788], [95.85230773601324, 21.069389553585097], [95.84497106496275, 21.06998441914567], [95.836642951611, 21.068794688923788], [95.82831563595789, 21.064999072349337], [95.82751260612196, 21.06837179891943], [95.82387162617465, 21.07638195426381], [95.81682420587248, 21.083058252236583], [95.8231434298255, 21.08948948225384], [95.82351616463933, 21.0900113111731], [95.82814022589076, 21.088084618010782], [95.83420138128878, 21.08687238675128], [95.83864622834085, 21.092125387076976], [95.8418788432341, 21.091317232904032], [95.84672776737261, 21.086064232578337], [95.85076853733818, 21.093337618336477]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
