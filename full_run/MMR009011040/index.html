
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR009011040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.32362398016261, 20.49044732078727], [94.33851715973918, 20.48815095680129], [94.36216070235457, 20.486478940850475], [94.36383441892337, 20.479784320090346], [94.36182620311683, 20.474930664618512], [94.35914851669077, 20.471918028394327], [94.36082221527306, 20.46622760501998], [94.36433683237897, 20.462043508301292], [94.36640782536091, 20.463194155785686], [94.36885547689877, 20.46455407820821], [94.37270478479803, 20.461876282964113], [94.37672142235584, 20.460704787396082], [94.37964414256317, 20.459243426842704], [94.37973391199051, 20.459198540780108], [94.38085551317147, 20.45527288313707], [94.3817422581987, 20.45216922562929], [94.38626125435349, 20.436771603726584], [94.38860436599873, 20.43225275506063], [94.39295776279056, 20.43161105190859], [94.39429476059479, 20.422880337257823], [94.36527709785986, 20.41791718123295], [94.32545576067486, 20.4150500454233], [94.31398721563755, 20.413775761841976], [94.29692605209567, 20.415300801590774], [94.29205893377281, 20.41573585672444], [94.29203721334676, 20.415931340558984], [94.29110322243582, 20.42433726505277], [94.27987360478312, 20.44631864289113], [94.27180314719755, 20.450519794353056], [94.29049262773265, 20.461988339390416], [94.32362398016261, 20.49044732078727]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
