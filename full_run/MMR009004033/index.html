
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Net</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Net</div><div class="name-mm">ချောင်းနက်</div></div>
        <span class="pcode-badge">MMR009004033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55876693644501, 19.94664114707132], [95.55875749985881, 19.946537356313968], [95.5637752402352, 19.942475375838], [95.56520888008583, 19.937696575436632], [95.5649699401107, 19.93124519520967], [95.56712039988662, 19.9276610946838], [95.5728549601883, 19.9264663948083], [95.58385775173389, 19.924827680752912], [95.58368981323434, 19.922140657565365], [95.58257745258743, 19.91498977206038], [95.58152961110272, 19.913780724400965], [95.58051164239845, 19.912606144158303], [95.57484740908075, 19.911370311091048], [95.56303169875395, 19.908792337896102], [95.55174919107236, 19.90799779496234], [95.5368117846362, 19.909904697643753], [95.53093216818507, 19.916102131807975], [95.53093170593354, 19.916133081976227], [95.53077325887887, 19.926749005862007], [95.52950199072433, 19.934217709080087], [95.52815764096243, 19.937866657919983], [95.53045544206503, 19.939302782597395], [95.54157904223905, 19.943434405673315], [95.54761756799644, 19.944864583134063], [95.55238482469997, 19.94502349244027], [95.5576288084228, 19.946294759695434], [95.55876693644501, 19.94664114707132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
