
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chin</div><div class="name-mm">သရက်ချဉ်</div></div>
        <span class="pcode-badge">MMR009006055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52960033878469, 20.60661588541484], [95.53191217830442, 20.583112194572152], [95.53578219129514, 20.56840614412829], [95.51449711714832, 20.566858138392433], [95.50559608619051, 20.567245140051227], [95.50675709026757, 20.540929047937254], [95.5069632598466, 20.54076532456014], [95.5009520698822, 20.537833037364805], [95.47618398260477, 20.54054204717778], [95.46878905077415, 20.54054204717778], [95.46418694197388, 20.54054204717778], [95.45605991343433, 20.53860703978313], [95.45231823190096, 20.546714016138992], [95.45141589712603, 20.548669074818008], [95.46418694197388, 20.56027911558874], [95.46457394273335, 20.566084135974165], [95.47231396961405, 20.582725193812678], [95.47347497369117, 20.595883239420004], [95.47347497369117, 20.600686609299657], [95.47347497369117, 20.60168825980537], [95.47695798592235, 20.602462262223696], [95.47731719942925, 20.611801805309142], [95.49321204300145, 20.612524297258574], [95.5083050951041, 20.611750294840306], [95.52688116033733, 20.607493280190795], [95.52869368096867, 20.608047106089145], [95.52881616683271, 20.606822245650164], [95.52960033878469, 20.60661588541484]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
