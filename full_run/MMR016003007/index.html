
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ann Hkit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyang</div><div class="name-mm">မိုင်းယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ann Hkit</div><div class="name-mm">အန်းခေတ်</div></div>
        <span class="pcode-badge">MMR016003007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.98801611005547, 21.956234041367964], [99.98790943787031, 21.9551190852776], [99.98508635984768, 21.949775310082543], [99.98320015056657, 21.9442292800573], [99.980153391366, 21.937842008002292], [99.98014747292757, 21.937667151018275], [99.97961655366106, 21.933131884329043], [99.98128837355966, 21.92678216436542], [99.98035668940975, 21.92155839920082], [99.97814114659667, 21.91742208705972], [99.97518945742758, 21.91383214004128], [99.96923968936022, 21.910854155594848], [99.96296009223454, 21.909285686685166], [99.9597140999258, 21.908154256813532], [99.95977609379173, 21.907294814304294], [99.95736340969364, 21.909113340608258], [99.943215393076, 21.919482876333745], [99.93168130275001, 21.924096511744665], [99.92091615165913, 21.929479088189396], [99.90476842592216, 21.937168481440324], [99.89092751699138, 21.94639575316154], [99.87708660895987, 21.953316207177295], [99.87555317493911, 21.957609823334735], [99.87842165793325, 21.957848863134586], [99.88862069928592, 21.958698782722706], [99.9101510005683, 21.96485029840261], [99.92180886368817, 21.96362315458498], [99.92476084873425, 21.963312419032945], [99.94244645384083, 21.96254347979783], [99.94324173781598, 21.96239199709305], [99.9585941795778, 21.95946772195788], [99.98612634125772, 21.9564382108548], [99.98777252598137, 21.956260358228974], [99.98801611005547, 21.956234041367964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
