
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khaw Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khaw Taw</div><div class="name-mm">ခေါတော</div></div>
        <span class="pcode-badge">MMR005006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75603819960327, 22.31088056968258], [95.75608248042221, 22.311301589996447], [95.75608248042221, 22.31551116001208], [95.75608248042221, 22.32140453968782], [95.76197568023349, 22.326876989881214], [95.7687112804013, 22.332349440074665], [95.77039500012921, 22.338242909682606], [95.77039500012921, 22.343715359876], [95.77923515957502, 22.34666204971387], [95.78150927972956, 22.346986949588086], [95.78807531992015, 22.347924929891633], [95.79691548026528, 22.349187810069452], [95.80116167966781, 22.349187810069452], [95.80238783962716, 22.349187810069452], [95.80449239980447, 22.344978240053763], [95.80268519956235, 22.34326113029698], [95.79607343963761, 22.336980030404106], [95.79060108027568, 22.329402750236795], [95.78554955956457, 22.320983610205474], [95.78849616036956, 22.310459640200293], [95.79144276027523, 22.30372430982908], [95.79005495976861, 22.29713127019204], [95.78891699991965, 22.296988980357185], [95.77881396029608, 22.296988980357185], [95.76702720004528, 22.29446322000166], [95.7569241604217, 22.293621360137706], [95.75663580000224, 22.29246728983361], [95.75524043979453, 22.299093810331158], [95.75524043979453, 22.30330338034679], [95.75603819960327, 22.31088056968258]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
