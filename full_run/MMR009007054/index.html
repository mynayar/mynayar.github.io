
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Gaung</div><div class="name-mm">ဆင်ခေါင်း</div></div>
        <span class="pcode-badge">MMR009007054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73892674437383, 20.106151302040985], [94.75961775065872, 20.125837890606192], [94.77420952604882, 20.13866858928401], [94.7674168027433, 20.15778884687785], [94.76565572693033, 20.16558789896243], [94.76527171192004, 20.166091917707888], [94.76535637409745, 20.166072468969332], [94.77740069118903, 20.16330553112539], [94.78894865805421, 20.159776986219015], [94.79343953420721, 20.155927663930584], [94.79600574786701, 20.145662804794654], [94.80113817788464, 20.13828493670053], [94.80989252132287, 20.135884552630046], [94.80746850037104, 20.118613402786366], [94.80450979469134, 20.108422308742604], [94.79168874124247, 20.093628785739895], [94.77788145166772, 20.08705388632785], [94.76571788896945, 20.07620530243281], [94.76571788896945, 20.06239801285807], [94.76616447161314, 20.060343728380417], [94.76426483635316, 20.059722028848626], [94.74932666369466, 20.046887826412103], [94.74112118999096, 20.04162790580324], [94.73733404772815, 20.040996715725896], [94.73459057409576, 20.04044802135917], [94.7384848346075, 20.06243914335181], [94.74175540538772, 20.08382364114817], [94.74225856977722, 20.0964027580809], [94.73949116428588, 20.104704974554977], [94.73892674437383, 20.106151302040985]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
