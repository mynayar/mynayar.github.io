
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Ma</div><div class="name-mm">ကုလားမ</div></div>
        <span class="pcode-badge">MMR009004070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67507213507105, 19.760498475324425], [95.6748078198251, 19.76406671630599], [95.6735531522562, 19.772535729140657], [95.6738668186988, 19.779436406165246], [95.67919916081269, 19.782886745127257], [95.68484516936911, 19.783827747152884], [95.69331418310315, 19.781632075759717], [95.7036651990897, 19.777868071254545], [95.71432988241821, 19.772535729140657], [95.72342622993665, 19.76939905662124], [95.727880876901, 19.769534046658976], [95.72792702201451, 19.768288113305857], [95.72243140168791, 19.759208393352708], [95.7190862420365, 19.75156231235087], [95.72219246171278, 19.73483651229526], [95.72601550221373, 19.727190432192742], [95.72670894156448, 19.727039684234114], [95.72427267094707, 19.724898717701706], [95.71989580274914, 19.717239199929168], [95.71956839916237, 19.71036370572051], [95.71598002236021, 19.710225692162], [95.70546666165717, 19.710942512087286], [95.69017450235145, 19.723367391691795], [95.69399754195308, 19.731730291719657], [95.69519224182858, 19.739376371822175], [95.69543118180366, 19.744871992148774], [95.68874086160156, 19.751801252326004], [95.68085584242323, 19.75801369257789], [95.67607704202192, 19.76064203320334], [95.67507213507105, 19.760498475324425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
