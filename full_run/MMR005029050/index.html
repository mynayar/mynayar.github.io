
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Set</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Set</div><div class="name-mm">ပန်းဆက်</div></div>
        <span class="pcode-badge">MMR005029050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7507281204065, 23.039043750069084], [94.74075360019856, 23.03139654041803], [94.71943368002036, 23.008138649579053], [94.70853899957524, 22.988164859820472], [94.7039284803152, 22.979712329760275], [94.69115560264902, 22.955618082908245], [94.67971775956698, 22.934042189595402], [94.67873243985025, 22.95128600994144], [94.68519300035672, 22.975836029609127], [94.6826089198658, 22.99715576992287], [94.68238715963975, 23.000367509752834], [94.68131652034123, 23.01589124988135], [94.68002447964608, 23.033334690043944], [94.68002447964608, 23.035683960246615], [94.68002447964608, 23.048193869851275], [94.68532655957313, 23.058798119637572], [94.68583920011906, 23.058530729609515], [94.7039284803152, 23.068221570369246], [94.70891231984774, 23.07320540990179], [94.70909700012652, 23.072097869621018], [94.72847832011843, 23.087603070225555], [94.75432056034566, 23.09987807960971], [94.76207315974858, 23.106338640116178], [94.7724102002706, 23.108276789742092], [94.780808639707, 23.108276789742092], [94.78339307992678, 23.101816230134943], [94.78463220001606, 23.101727760228016], [94.78145484036867, 23.090833349579498], [94.7782245601154, 23.0779123202974], [94.76982576005082, 23.068221570369246], [94.76078111995281, 23.054654430357743], [94.75044444005891, 23.039795249651092], [94.7507281204065, 23.039043750069084]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
