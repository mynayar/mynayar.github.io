
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin</div><div class="name-mm">ချင်း</div></div>
        <span class="pcode-badge">MMR010015026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15953863809773, 21.461976766714486], [96.16281682703499, 21.461274297271075], [96.16541229923826, 21.46207290514053], [96.16632280885062, 21.461259323558977], [96.16654431007191, 21.461061327018683], [96.1685001673489, 21.45897024138361], [96.17280107520952, 21.459123844689714], [96.1747979262833, 21.45712699271661], [96.17613045625563, 21.45829295925273], [96.17676196019636, 21.45717680796338], [96.17703754484688, 21.45455874928689], [96.17717533807144, 21.451113933960926], [96.17703754484688, 21.4467045696602], [96.1744194861704, 21.446015607134598], [96.17193921891987, 21.446153400359208], [96.16945895166936, 21.446566777334965], [96.16615192866863, 21.446153400359208], [96.16270711424198, 21.445326643709677], [96.1592622980167, 21.447117948434595], [96.1603646393167, 21.449047043686164], [96.16050243164199, 21.452216274361604], [96.15953788356654, 21.45731460118793], [96.15953788356654, 21.46048383096405], [96.15953863809773, 21.461976766714486]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
