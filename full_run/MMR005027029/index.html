
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kin Pun Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kale</div><div class="name-mm">ကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kin Pun Chon</div><div class="name-mm">ကင်းပွန်းချုံ</div></div>
        <span class="pcode-badge">MMR005027029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.11102035980184, 23.104186020168754], [94.10898672016106, 23.109880319621084], [94.1106808801186, 23.11242156000702], [94.12677540016466, 23.11242156000702], [94.14151451957946, 23.11140510036512], [94.15015488024358, 23.11140510036512], [94.15574964003395, 23.110783470081117], [94.15464443978914, 23.1011129701875], [94.15953777424892, 23.083374347348297], [94.16006567988728, 23.081460660181392], [94.1595677999141, 23.072000310266162], [94.14456408016821, 23.073286320107627], [94.12474247998153, 23.072778089837016], [94.10644547977512, 23.073286320107627], [94.10257475991727, 23.074576470427814], [94.10034636039626, 23.075319330222953], [94.09780512001032, 23.082943049582127], [94.10237927968006, 23.085992610170877], [94.11152795964767, 23.09412455980066], [94.11152795964767, 23.10276482963326], [94.11102035980184, 23.104186020168754]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
