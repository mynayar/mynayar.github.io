
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Thar</div><div class="name-mm">ညောင်ပင်သာ</div></div>
        <span class="pcode-badge">MMR008002008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53571676741495, 18.995242662718738], [95.51833929702099, 18.98880656377196], [95.50160543724121, 18.98365768425475], [95.48680240840446, 18.980439633882042], [95.47779186790046, 18.981083243596856], [95.46151083205933, 18.98243852281962], [95.4610425586672, 18.981080611281243], [95.45867634973382, 18.980164702139348], [95.46000350895486, 18.98696486823411], [95.46448355996836, 18.99054890760607], [95.46717158859798, 18.993535609181095], [95.46820953304359, 18.999503784572028], [95.47965946481253, 19.002958708277788], [95.49409453333612, 19.006419748272833], [95.49637375444524, 19.015789880898353], [95.49603609229189, 19.023218453668733], [95.49591240583294, 19.03414010208411], [95.50289063409554, 19.033791191210582], [95.50777539441896, 19.034837924730482], [95.51300906471664, 19.03902486240753], [95.51580035620151, 19.043560710058784], [95.51928947123218, 19.04809655771004], [95.52312749623701, 19.044607443578684], [95.53010572360034, 19.03553574827623], [95.53673504098941, 19.02995316530638], [95.52799344723985, 19.01905623295886], [95.52799344723985, 19.01326374282752], [95.53056788699843, 19.00296598289384], [95.53571676741495, 18.995242662718738]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
