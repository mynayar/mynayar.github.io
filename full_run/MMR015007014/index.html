
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Tee Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Tee Yar</div><div class="name-mm">ယောင်တီးယား</div></div>
        <span class="pcode-badge">MMR015007014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.07669265174457, 22.943757423566296], [99.07733326581763, 22.948671158247407], [99.07523527428856, 22.958452315222246], [99.07309075903134, 22.967118513408707], [99.07452352474093, 22.969536684270622], [99.0771054864291, 22.968041864440522], [99.07823641178106, 22.964875268778655], [99.08208156121515, 22.962387229587023], [99.08411722972642, 22.959220638421755], [99.08753137727132, 22.9554048248728], [99.08796237826118, 22.954923117407986], [99.087283821791, 22.950173224814534], [99.08999804677251, 22.94519715002849], [99.08999804677251, 22.94157818458558], [99.09027376362337, 22.940429361825636], [99.09135515701496, 22.9359235506314], [99.09027376362337, 22.934085184383775], [99.08553481757781, 22.926028978354736], [99.08255531687445, 22.929434117390656], [99.07650920983224, 22.942350362279456], [99.07669265174457, 22.943757423566296]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
