
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Pon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Pon</div><div class="name-mm">ပျဉ်ပုံ</div></div>
        <span class="pcode-badge">MMR009016049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4456216928869, 19.405506781812562], [95.46206911319905, 19.40276554479408], [95.48645781337746, 19.404558831624854], [95.50008679167217, 19.404558831624854], [95.50008679167217, 19.404941805220176], [95.51397887472535, 19.405883640917352], [95.51371577086621, 19.376942216410214], [95.51412070680522, 19.376537281370474], [95.51120517038237, 19.37443161502705], [95.50367336533361, 19.371921012744565], [95.49721753256313, 19.36367189404274], [95.49488361558645, 19.365197916750503], [95.48789244158297, 19.36976906908734], [95.47318749100998, 19.355422775340855], [95.4627864277515, 19.35578143306674], [95.45117180763287, 19.35648534861997], [95.45095073538818, 19.356498746719808], [95.45038734699853, 19.357478552693124], [95.44270161578697, 19.370845041365612], [95.44126698668214, 19.37945281779338], [95.44270161578697, 19.393440453813923], [95.44557087489602, 19.40276554479408], [95.44538798966403, 19.40528021111288], [95.44557087489602, 19.405276147076563], [95.4456216928869, 19.405506781812562]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
