
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Kan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Kan Su</div><div class="name-mm">ရေကန်စု</div></div>
        <span class="pcode-badge">MMR005012051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22131184026927, 22.206102210148913], [95.22400967960311, 22.206480929951], [95.22713015982907, 22.206319470167443], [95.2283347198715, 22.20064029011735], [95.2321449603217, 22.19619510042361], [95.24061180039433, 22.195136699998784], [95.2452687597455, 22.19450174985593], [95.24794968013367, 22.194268560145986], [95.24738519996708, 22.18730481006895], [95.24832875966456, 22.186597229778386], [95.24103515984478, 22.184976420325597], [95.23807164009418, 22.18158963015736], [95.23468475999374, 22.177356120188847], [95.22918143967178, 22.175451089895944], [95.2245964800436, 22.17576726005109], [95.22071459959915, 22.17926124041395], [95.21817444019831, 22.18370634017549], [95.21775107984854, 22.19090327996247], [95.22113795994898, 22.196406780148834], [95.22177300002397, 22.204027080285584], [95.22131184026927, 22.206102210148913]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
