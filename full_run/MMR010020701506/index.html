
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Kwet Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Kwet Thit Ward</div><div class="name-mm">မြို့မကွက်သစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010020701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12844311947032, 20.836821617175872], [95.12825189286048, 20.836821617175872], [95.12797587538387, 20.83676926903371], [95.12766654545294, 20.836621742451428], [95.12722872462803, 20.83644566233704], [95.12638163650996, 20.83601260043389], [95.12575345880441, 20.835688993737108], [95.12561470695312, 20.83629354848165], [95.12548621605879, 20.836959797563168], [95.12535772516458, 20.837611769878777], [95.12525302888025, 20.838206635130234], [95.12511977906405, 20.838925232354086], [95.1250293595458, 20.83946774946338], [95.12496025568663, 20.839864345524802], [95.12570237237492, 20.839938112080517], [95.12661024485021, 20.840049454931147], [95.12698281515856, 20.840139385695352], [95.12736395030151, 20.840426307656912], [95.12768513160177, 20.840554780177], [95.12804913707532, 20.840734641705126], [95.12822043376877, 20.84082885488658], [95.128374600793, 20.840935915320017], [95.12850307331308, 20.840987304328053], [95.12873860626661, 20.841008716414592], [95.12890562054258, 20.84099586916261], [95.12893987988144, 20.840893091146654], [95.1288927732906, 20.84012653844337], [95.12878571285722, 20.839368550574818], [95.12868293484127, 20.83852063194206], [95.12859300407706, 20.837912528680306], [95.12844311947032, 20.836821617175872]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
