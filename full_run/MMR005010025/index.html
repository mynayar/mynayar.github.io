
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ein Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ein Yar</div><div class="name-mm">အိမ်ယာ</div></div>
        <span class="pcode-badge">MMR005010025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27769647990868, 22.573929509938978], [95.27832036029645, 22.574890170245226], [95.27834267967097, 22.574880179676597], [95.28851303984499, 22.57031249962222], [95.29388423986586, 22.565673809998373], [95.29168716013442, 22.5587158200791], [95.28880608033637, 22.550738220192784], [95.28869628030913, 22.550720220262008], [95.28771960037932, 22.547729520301175], [95.29168716013442, 22.540710419650225], [95.29089371976943, 22.527526860276453], [95.28692616001433, 22.51971432015978], [95.27667227980191, 22.520507849557646], [95.27130144040922, 22.526672400011307], [95.26348872042814, 22.526672400011307], [95.2570800004417, 22.526306189778893], [95.25732408004234, 22.527526860276453], [95.26129163979738, 22.53912353981957], [95.26348872042814, 22.55249024972528], [95.26831055968466, 22.561706520039934], [95.27288832023987, 22.56652836019572], [95.27770979976748, 22.573913580247563], [95.27769647990868, 22.573929509938978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
