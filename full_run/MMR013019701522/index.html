
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (47) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (47) Ward</div><div class="name-mm">အမှတ် (၄၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18686561585554, 16.895640373204685], [96.18494987463708, 16.89466285690537], [96.1839237212028, 16.894124984980124], [96.18150172012832, 16.892892671859386], [96.18050193841378, 16.894689559575568], [96.17955207806602, 16.896413802754864], [96.17900417869993, 16.897427312620437], [96.1788832351732, 16.89765103696584], [96.17885367985349, 16.897767788752503], [96.17876451656923, 16.89812001272844], [96.17877070120693, 16.899412473406983], [96.18087959341858, 16.8992900846697], [96.18229103080648, 16.89920234681091], [96.18284034840343, 16.899171829216584], [96.18344179790068, 16.899154662957358], [96.18376255010168, 16.899282455720822], [96.18458448098909, 16.899698257268824], [96.18585014366926, 16.89743995708841], [96.18686561585554, 16.895640373204685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
