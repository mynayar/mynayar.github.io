
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Tat Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Tat Kyin</div><div class="name-mm">ဆင်တပ်ကျင်း</div></div>
        <span class="pcode-badge">MMR010020048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06751006183993, 20.82589210573616], [95.06854118672646, 20.82073648220296], [95.06854118672646, 20.82008535505514], [95.06854118672646, 20.81420602458843], [95.06854118672646, 20.808019277068013], [95.06751006183993, 20.802176236044488], [95.06097960512471, 20.802176236044488], [95.05376173181855, 20.802176236044488], [95.04173194327461, 20.803894776622712], [95.03840954186694, 20.8044988503417], [95.0382099409361, 20.805886919745603], [95.0383338252459, 20.80648730174761], [95.03874160304258, 20.808473541720616], [95.03869202701549, 20.808998103679585], [95.04032320475216, 20.819525114292617], [95.04144233909273, 20.826986007798098], [95.04218843015201, 20.83295472368161], [95.04092644210169, 20.838914571350415], [95.04073323804857, 20.839366763965018], [95.04378951027775, 20.838269058670164], [95.04484797905104, 20.836363814338597], [95.04527136727984, 20.833400101233735], [95.04611814193873, 20.830648081343952], [95.04844677539842, 20.82810775466919], [95.05585605861029, 20.82831944878359], [95.06305364860708, 20.826202510337623], [95.06751006183993, 20.82589210573616]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
