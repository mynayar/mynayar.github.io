
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun</div><div class="name-mm">ကွန်း</div></div>
        <span class="pcode-badge">MMR009018009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13867457457201, 21.36221979161013], [95.13921820575564, 21.36291874560368], [95.14994086208117, 21.36445055365016], [95.1572169512014, 21.365216457673455], [95.15775684480258, 21.365070540872807], [95.17138617563154, 21.3613869375572], [95.17659735208616, 21.359563027012143], [95.17904521586411, 21.358706274375095], [95.1807629623409, 21.356859698216567], [95.18701580643437, 21.347101938004073], [95.18453635576827, 21.34504808430171], [95.17435878033348, 21.325327212680747], [95.17047418573515, 21.31780011738158], [95.1642017211326, 21.316351064050423], [95.15729042221528, 21.317506879938605], [95.15583662406101, 21.318191015802768], [95.14802610202304, 21.323091736394588], [95.13883525374405, 21.33228258377426], [95.13692049278654, 21.35257904218912], [95.13653754077495, 21.35947217839839], [95.13867457457201, 21.36221979161013]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
