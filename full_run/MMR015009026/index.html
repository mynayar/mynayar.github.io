
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Tawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Tawng</div><div class="name-mm">နမ့်တောင်း</div></div>
        <span class="pcode-badge">MMR015009026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.0358225083022, 24.03033234995803], [98.0413072333422, 24.03601295813155], [98.05688541213215, 24.0502064093983], [98.0573685935858, 24.050646642828326], [98.0620026696875, 24.052926902654463], [98.07985450098448, 24.061711136859515], [98.08407363529011, 24.062303294561445], [98.08427446109755, 24.059039880586056], [98.0852082883319, 24.04386517903481], [98.08930592243041, 24.023903760350322], [98.08988141659415, 24.02011509013937], [98.09399318263934, 23.99304596060267], [98.09446195425585, 23.989959883042218], [98.09457911793203, 23.98996646518026], [98.09266594157998, 23.988357619408646], [98.08688385210814, 23.98500257980527], [98.08331466144256, 23.983217984022815], [98.07862647942852, 23.980912320147524], [98.07708029481984, 23.982861856089812], [98.07214493144352, 23.989084705095138], [98.0432640780748, 23.98077052044323], [98.0428368623314, 23.981678354572466], [98.04168363739001, 23.98412895858462], [98.03976336898432, 23.98820952804732], [98.03538748194677, 23.994773358603652], [98.03932577956112, 24.01052655085971], [98.03970954455991, 24.02127197622076], [98.03976336898432, 24.022779034025234], [98.03931920371832, 24.023630351159852], [98.03701716860752, 24.02804258429785], [98.0358225083022, 24.03033234995803]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
