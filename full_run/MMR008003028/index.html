
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyoe Gyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyoe Gyar</div><div class="name-mm">ကြိုးကြာ</div></div>
        <span class="pcode-badge">MMR008003028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97178688785465, 18.606152879751676], [94.95885968023009, 18.61790488839995], [94.95115710201873, 18.627088730960224], [94.955004067184, 18.62852361187521], [94.96434395021316, 18.632007296799372], [94.97570422407074, 18.63631636690684], [94.98549756416134, 18.63945023534012], [94.99294050180276, 18.639841969231554], [94.99607437113536, 18.639841969231554], [94.99999170735146, 18.645717973106002], [95.00351730877685, 18.648851840639963], [95.01017678043411, 18.647676640764416], [95.01440750520226, 18.646266398575506], [95.0207535874082, 18.644151038439702], [95.02153705429168, 18.639841969231554], [95.0137023818595, 18.626131292924867], [95.01448584874299, 18.613987552183858], [95.01135198120903, 18.60497767987607], [95.00978504564341, 18.599885142885114], [95.00743464499294, 18.597534742234643], [94.9909818341444, 18.59557607367691], [94.9878479648118, 18.592833939135005], [94.98118849495313, 18.598318209118133], [94.97178688785465, 18.606152879751676]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
