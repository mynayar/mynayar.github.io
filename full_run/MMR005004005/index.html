
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Bar</div><div class="name-mm">ရင်းဘာ</div></div>
        <span class="pcode-badge">MMR005004005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69689091998004, 22.519620180027346], [95.70286944027254, 22.517502749652238], [95.708100599663, 22.515634439577752], [95.71121460027365, 22.513766130402644], [95.71348151955652, 22.51242647959839], [95.71273812016818, 22.51101420044506], [95.71397183982862, 22.507005149568045], [95.71690151988929, 22.50592577965108], [95.71998527989683, 22.50592577965108], [95.7236860800486, 22.50577151983981], [95.7252279596027, 22.50222507033078], [95.7252279596027, 22.498986959680508], [95.72414867961794, 22.496211450398164], [95.72414867961794, 22.492664999989813], [95.72414867961794, 22.49166991633365], [95.71918994286165, 22.490061676705068], [95.71536271421792, 22.48886570968483], [95.71431114324474, 22.490180174975137], [95.71083499733732, 22.493972332756982], [95.71072862642501, 22.49408837407924], [95.70836319360654, 22.492119008085808], [95.70855124904097, 22.483280298347154], [95.70652556570235, 22.483270240329375], [95.69906336008609, 22.483082067983105], [95.69643443040468, 22.483344961400917], [95.69725569759242, 22.489545534199067], [95.69045433629861, 22.489511306901363], [95.68434136106504, 22.488077030330714], [95.68401767977218, 22.492188899797952], [95.68390392002993, 22.496519880088442], [95.68374948035432, 22.499295390270106], [95.68436651959928, 22.501608299983104], [95.6842776000313, 22.504357530175923], [95.68482912006789, 22.504383810164768], [95.68652507956881, 22.508392860142408], [95.68760291973899, 22.5106201795777], [95.68770732023671, 22.51059660025294], [95.68909511984396, 22.512601080275658], [95.69140812038853, 22.515068249799924], [95.69358576037462, 22.516973999550487], [95.6936523596687, 22.516755479581775], [95.69689091998004, 22.519620180027346]]]]};

        map.fitBounds(layer.getBounds());

</body>
</html>
