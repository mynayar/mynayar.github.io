
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ahr Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ahr Laung</div><div class="name-mm">အာလောင်</div></div>
        <span class="pcode-badge">MMR010007029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07243388941254, 22.036957690944746], [96.06840669201529, 22.037905267014537], [96.06224745115901, 22.037905267014537], [96.05832862926292, 22.039533614584684], [96.05683499204133, 22.04219637316413], [96.05422942404874, 22.040633032188737], [96.05145235084535, 22.044335795560585], [96.04787371460031, 22.047914430906303], [96.04906659424796, 22.050896628676526], [96.05629732696013, 22.05388865603669], [96.05771496517355, 22.054475264921564], [96.05895496659849, 22.05462406494871], [96.06514938083933, 22.055367395089263], [96.06549884119863, 22.054288153775303], [96.06620731541534, 22.05452431214735], [96.06627464675762, 22.054487840141746], [96.06911737406762, 22.05330337095387], [96.07041590427065, 22.05330337095387], [96.07124941932528, 22.048802386421073], [96.07124941932528, 22.04739276656295], [96.07124941932528, 22.04501208394055], [96.07243388941254, 22.036957690944746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
