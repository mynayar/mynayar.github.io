
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Thun Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Launglon</div><div class="name-mm">လောင်းလုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Thun Khan</div><div class="name-mm">လေးသွန်းခံ</div></div>
        <span class="pcode-badge">MMR006002009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.13898206027392, 13.939391385004456], [98.14073543968885, 13.93895304015075], [98.14161240189088, 13.93588434019017], [98.14183155678097, 13.93237719195389], [98.13788640003742, 13.92667820973162], [98.1350369997578, 13.922951894914092], [98.13131099970292, 13.91834879955752], [98.12780423997373, 13.91593765509873], [98.1247356002678, 13.913088119920872], [98.12079035988728, 13.911115320315844], [98.11355742383608, 13.908485053342588], [98.11070801995919, 13.916156624728501], [98.10770165830496, 13.920047279858125], [98.10698184003996, 13.920978824613087], [98.1047876768099, 13.922677529744249], [98.1001870204147, 13.926239325284712], [98.09651805806197, 13.930075170332884], [98.09536500039451, 13.931280698045839], [98.10237887958169, 13.931938349775066], [98.10720071973748, 13.933911150279414], [98.11070784009479, 13.934568780424911], [98.11618740032833, 13.934568870357111], [98.12166695966249, 13.934788109783483], [98.12605032006627, 13.935007350109174], [98.12933820009789, 13.935884129748842], [98.13196836005181, 13.937199300107636], [98.13503690263099, 13.938514635941772], [98.13744774042095, 13.93895299518465], [98.13898206027392, 13.939391385004456]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
