
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Set Hleit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Set Hleit</div><div class="name-mm">စက်လှည့်</div></div>
        <span class="pcode-badge">MMR007008033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.92291147538435, 17.97576228889858], [96.92516640670436, 17.976705260439473], [96.92643961559583, 17.97755406576755], [96.93051388620694, 17.977214543816217], [96.92948833801643, 17.97124563637709], [96.92976700644226, 17.969833532591508], [96.9305601590242, 17.968723117178172], [96.93116295570587, 17.967580976380987], [96.93122640827221, 17.96659746610021], [96.93106777685648, 17.965836038002806], [96.93068706325744, 17.96504288542087], [96.9303380759415, 17.96463044463934], [96.93068364673297, 17.96354876526334], [96.92618497435711, 17.96448245130415], [96.92423271976429, 17.966264943572355], [96.92168630198131, 17.96745327265046], [96.91990380881379, 17.96830207887791], [96.91830897897626, 17.97037535883578], [96.92000504279855, 17.971082052394877], [96.92310246710525, 17.971942448185473], [96.92291147538435, 17.97576228889858]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
