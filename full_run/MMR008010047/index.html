
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar Yar</div><div class="name-mm">ကန်သာယာ</div></div>
        <span class="pcode-badge">MMR008010047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78702993178598, 18.05898210843759], [95.78696000589963, 18.058245580768983], [95.78637096884518, 18.05204132614631], [95.78638163120735, 18.04978287218188], [95.78543669374847, 18.049325949133276], [95.78073466487297, 18.051050849717], [95.77845729816585, 18.051886283924887], [95.76996100709488, 18.053644070917187], [95.7667383333075, 18.05100713187369], [95.7651433856588, 18.0463357482962], [95.76195420981901, 18.047709781081608], [95.76171132631674, 18.048924196794303], [95.76243997592422, 18.054510510152], [95.76275894476953, 18.060092475287547], [95.76292574202944, 18.06301142014098], [95.76608322306237, 18.075641344272697], [95.76977036880754, 18.077018319639762], [95.77154233720915, 18.081152913176425], [95.77538160237913, 18.085287504914447], [95.7845367709553, 18.090603410119343], [95.78424144258855, 18.094442675289258], [95.79073866036094, 18.09591931532418], [95.7945779246316, 18.09178472178752], [95.7966452213999, 18.096509971158298], [95.80550506340802, 18.087650130049497], [95.79841718890219, 18.08144824064385], [95.79900784473631, 18.07258839863573], [95.79221530039587, 18.064319214260365], [95.78957004891868, 18.061262051702386], [95.78724638781063, 18.061262014830163], [95.78702993178598, 18.05898210843759]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
