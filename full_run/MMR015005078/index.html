
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hto</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hto</div><div class="name-mm">မိုင်းထို</div></div>
        <span class="pcode-badge">MMR015005078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.83124555104143, 22.491800350405924], [98.82648511659494, 22.48435878692851], [98.82688099006572, 22.477233059058506], [98.82591561101668, 22.470450633889698], [98.82054701003653, 22.46397128834434], [98.80946254386134, 22.44417759861733], [98.80471205861465, 22.433686943997316], [98.80436743840664, 22.430585351332923], [98.79758633074465, 22.42774883743897], [98.79204409765703, 22.42339422566306], [98.78848891393227, 22.42072933209306], [98.78630392918302, 22.428936458750627], [98.78056375891043, 22.442198230364113], [98.77581327276437, 22.450511578646513], [98.77601120994944, 22.45605381173408], [98.77742657467672, 22.46373783783099], [98.79059956791576, 22.4746979736326], [98.79782304130038, 22.478088583221563], [98.80386717073338, 22.478088583221563], [98.81625026783564, 22.48265853586281], [98.82008313073197, 22.488112995118684], [98.82206434079677, 22.49326414002809], [98.82483484535192, 22.4909990112954], [98.83124555104143, 22.491800350405924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
