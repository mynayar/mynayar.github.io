
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Chan Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Chan Yoe</div><div class="name-mm">ကွမ်းခြံရိုး</div></div>
        <span class="pcode-badge">MMR010030001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97633859395103, 20.856808963962578], [95.98001101689499, 20.857134091365253], [95.99070962085239, 20.85681942577594], [95.99748000230034, 20.858389869596863], [96.00657376786518, 20.85778361861918], [96.02082066943842, 20.85657111666376], [96.01782313103274, 20.85040748441793], [96.016840813253, 20.84574147069236], [96.01410064193112, 20.840456854700108], [96.01210682786785, 20.840456854700108], [96.0064428616488, 20.84108618497953], [96.00109356011978, 20.842344843739625], [95.97990958775733, 20.84308277435059], [95.97972151883306, 20.84385421999633], [95.97635404880037, 20.843206628982784], [95.97594605966299, 20.843148344820293], [95.97707558117321, 20.84992547028429], [95.97733118828376, 20.851288713003726], [95.97672426101587, 20.853093810630924], [95.97633859395103, 20.856808963962578]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
