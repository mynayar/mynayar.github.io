
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maing Daing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabeikkyin</div><div class="name-mm">သပိတ်ကျင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maing Daing</div><div class="name-mm">မိုင်းဒိုင်း</div></div>
        <span class="pcode-badge">MMR010012019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.31928083164513, 23.56343843333707], [96.31568128166589, 23.54949018042754], [96.31192140055225, 23.54139197426025], [96.30983201463584, 23.536891757748492], [96.30698412881458, 23.533594204608903], [96.30128308624552, 23.52699299732899], [96.29791525018868, 23.527217520272416], [96.28778477584677, 23.52789288504863], [96.27473641065689, 23.52789288504863], [96.26258793228732, 23.53149243412861], [96.2594372636189, 23.537320700190207], [96.26995753291385, 23.55310110323336], [96.27563629837653, 23.567487924927832], [96.28069825571998, 23.57254988227129], [96.28373528425601, 23.575586910807317], [96.28751020832954, 23.578908843668273], [96.29498387490594, 23.58548567122682], [96.29632699709327, 23.586022919921845], [96.30623246555592, 23.589985108026383], [96.30731697959499, 23.589776547149995], [96.31793100141465, 23.58773538917694], [96.32153054959525, 23.58008634670756], [96.32103725796316, 23.57643598773069], [96.31928083164513, 23.56343843333707]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
