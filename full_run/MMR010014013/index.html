
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khan Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khan Lu</div><div class="name-mm">ခံလူး</div></div>
        <span class="pcode-badge">MMR010014013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04042704926894, 21.783148398879575], [96.03735039480495, 21.7804337053513], [96.03499766041375, 21.77681411218157], [96.03373080163527, 21.775185295165272], [96.02830141278002, 21.773194519011895], [96.02431986137259, 21.771384723326378], [96.01961439079156, 21.76975590631008], [96.01746701569027, 21.76928616792236], [96.01796150162204, 21.768232345946046], [96.01344748321486, 21.773296164886176], [96.01256192709133, 21.77285338907268], [96.01123359875163, 21.770639504609505], [96.01079082293819, 21.767982847930114], [96.00835555056824, 21.76842562374361], [96.00898193017201, 21.772321672107523], [96.0056988938889, 21.77285338907268], [96.00171390617191, 21.77285338907268], [96.00140548997143, 21.776578791977727], [96.00460344859033, 21.78041755982258], [96.00408721075621, 21.78532182734051], [96.00857463261326, 21.78586309420649], [96.01563283938407, 21.785320154601493], [96.02070026910218, 21.785139175032953], [96.02540573878389, 21.784053297621654], [96.02938729109064, 21.783148398879575], [96.03409276167167, 21.782605460173897], [96.0375313752728, 21.782605460173897], [96.04042704926894, 21.783148398879575]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
