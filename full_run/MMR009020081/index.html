
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Paung Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Paung Kan</div><div class="name-mm">သင်းပေါင်းကန်</div></div>
        <span class="pcode-badge">MMR009020081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89574985727018, 21.56320214856038], [94.89601013456013, 21.56070347938214], [94.89601013456013, 21.557276079427595], [94.89772383498706, 21.553634467256927], [94.89793804720318, 21.55020706730238], [94.89751234501875, 21.54424724031793], [94.89172588484178, 21.54356647960941], [94.87180412266218, 21.544423329373217], [94.84952602430661, 21.548493366875448], [94.84760415600704, 21.54899162906048], [94.84995444873886, 21.552349192161557], [94.85123972383423, 21.56070347938214], [94.85038287407042, 21.565201941316616], [94.84866917544213, 21.568629341271105], [94.84896272494984, 21.569656767246045], [94.85423869935653, 21.56777249060798], [94.87158991134538, 21.565844577964924], [94.88251474785739, 21.563488240889683], [94.89386800970095, 21.56177454136207], [94.89574985727018, 21.56320214856038]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
