
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Haung Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Haung Kan</div><div class="name-mm">ရွာဟောင်းကန်</div></div>
        <span class="pcode-badge">MMR009001056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00327335777928, 20.226066984603733], [95.00320678456552, 20.226024186766836], [94.99290079133851, 20.222853111581912], [94.98470884703573, 20.218360756044092], [94.97704541541367, 20.215189680859112], [94.96647701260412, 20.214698126717224], [94.96568239592591, 20.214661168178395], [94.96569390814739, 20.21484919213657], [94.96647516539662, 20.227609724808985], [94.9659466527159, 20.234744643750332], [94.95903497608333, 20.246520092328467], [94.95881173377455, 20.246900430910216], [94.9609257835981, 20.25271406859946], [94.95801896520317, 20.26434134397789], [94.95554102090148, 20.269973035327382], [94.96541814003518, 20.274911593994943], [94.98662040910466, 20.284486813415754], [94.99237227775848, 20.27385456863351], [94.99739314687628, 20.263812832196493], [95.00135699063264, 20.253771093960893], [95.00294252777547, 20.236065925002492], [95.00241401599408, 20.226552700346872], [95.00327335777928, 20.226066984603733]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
