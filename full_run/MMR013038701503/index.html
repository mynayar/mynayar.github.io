
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Du (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thar Du (East) Ward</div><div class="name-mm">သာဓု (အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12615130443919, 16.81580455503621], [96.1262680400381, 16.815258199806124], [96.12614338231128, 16.814508731792614], [96.12554359476115, 16.814500808765388], [96.12511062695393, 16.814500808765388], [96.12458324472101, 16.814489364892324], [96.12392425569988, 16.814512252638394], [96.12298107191901, 16.814500808765388], [96.1223112739462, 16.814512252638394], [96.1219071833699, 16.8145068324244], [96.12191200283672, 16.814924240161588], [96.12191963178566, 16.81562232990666], [96.12193107565867, 16.816312789803476], [96.12192993172101, 16.81690578477418], [96.12297821117556, 16.816850662628042], [96.1233615876672, 16.816845894422556], [96.1237602238553, 16.81680297877449], [96.12423038492437, 16.816699663758527], [96.12457561487281, 16.816555023095873], [96.12486934694289, 16.816377639916197], [96.1251407623364, 16.816059493950547], [96.12525685671864, 16.815718333434404], [96.12567138662524, 16.81570370955859], [96.12615130443919, 16.81580455503621]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
