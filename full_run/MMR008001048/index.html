
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mway Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mway Yoe</div><div class="name-mm">မြွေရိုး</div></div>
        <span class="pcode-badge">MMR008001048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28195491818497, 18.929528439086255], [95.28325981918539, 18.929393385196647], [95.28983236507167, 18.926632916176175], [95.29666781336897, 18.924266798973633], [95.30047989023478, 18.924529701384643], [95.30337180956144, 18.924003896562624], [95.30350326076695, 18.91953456636719], [95.30468631891853, 18.913487822604964], [95.30508067163572, 18.910990255995557], [95.3086298469899, 18.90875558999852], [95.31296772777847, 18.907572531846938], [95.31756851007873, 18.9063894736953], [95.32046043030465, 18.90560076826091], [95.32243219389068, 18.903891906186573], [95.32400960475951, 18.901920141701225], [95.32409495311964, 18.898416686081248], [95.31847821839511, 18.897984629287237], [95.31057775515933, 18.897737739305285], [95.3048992972648, 18.898725297434567], [95.29922083937032, 18.900700412793867], [95.29452993870575, 18.90242863907048], [95.28909837079323, 18.907119538835673], [95.28292613383405, 18.912797996730205], [95.2787290131335, 18.916007560200796], [95.27643336410853, 18.91788307384485], [95.27986444498822, 18.919598614284666], [95.2826139971383, 18.923493812789275], [95.28284312730852, 18.927159882022977], [95.28195491818497, 18.929528439086255]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
