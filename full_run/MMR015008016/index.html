
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hkar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hkar</div><div class="name-mm">မန်ခါး</div></div>
        <span class="pcode-badge">MMR015008016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.10775902405976, 23.09189317812769], [99.07106598940396, 23.06352763988872], [99.05599296070665, 23.05367219891292], [99.05396389861511, 23.04526608736012], [99.05396389861511, 23.035120778701014], [99.05430491793766, 23.031881101431736], [99.0545436312836, 23.029613325994262], [99.04787671503846, 23.032511985739575], [99.04120979789394, 23.033961315162628], [99.01935312005048, 23.02473675759535], [99.01095144035673, 23.031783328937536], [99.01860025619692, 23.043526891153135], [99.01975971883604, 23.048164746206112], [99.01367253525933, 23.049614075629165], [99.01017696669373, 23.049231881745982], [99.00961441197558, 23.05570126010514], [99.01309280259085, 23.066136433749477], [99.02265837858135, 23.083818256307552], [99.0296177156851, 23.101375276347994], [99.03483274843268, 23.105268333566812], [99.05019564211523, 23.117152838432787], [99.05570309482204, 23.114254177788098], [99.05935265430162, 23.11675515372741], [99.05958262533795, 23.117525646091735], [99.06319144732748, 23.11567640344333], [99.07765398294504, 23.1089461173695], [99.08622623525264, 23.10463495993548], [99.0941303587291, 23.103077951086618], [99.10153238711001, 23.094788914177116], [99.10641021096251, 23.09170698968586], [99.10775902405976, 23.09189317812769]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
