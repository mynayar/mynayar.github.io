
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwet Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Insein</div><div class="name-mm">အင်းစိန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kwet Thit Ward</div><div class="name-mm">ကွက်သစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013001701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0977668633501, 16.885257492439393], [96.0976486195882, 16.88549614013482], [96.09756946575828, 16.885749339760252], [96.0975170136993, 16.886028289673902], [96.09748649610498, 16.886379242008445], [96.09749706044107, 16.886726232829403], [96.09753608742056, 16.887109756809878], [96.09754753129357, 16.887584686084438], [96.09752082862337, 16.88785712040982], [96.09742546091633, 16.888116328405886], [96.09864997871358, 16.888276419421288], [96.09905026785566, 16.8885135652489], [96.09940481208247, 16.888689995147217], [96.10004620316982, 16.88715649097935], [96.10052995209566, 16.8862632123774], [96.09991455141545, 16.88603544288145], [96.09907531757193, 16.885746002376152], [96.09803962682736, 16.885358810061064], [96.0977668633501, 16.885257492439393]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
