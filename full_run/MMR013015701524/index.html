
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Aung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Man Aung Ward</div><div class="name-mm">မာန်အောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701524</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17501055479335, 16.82466886037963], [96.17492357955962, 16.822488785029464], [96.17350217408614, 16.82221709983935], [96.17323048979534, 16.82216517118576], [96.17324638441318, 16.821847916448235], [96.17326863633855, 16.820544561382462], [96.17299770118302, 16.82049642516995], [96.17276763931517, 16.820455550982956], [96.17227908531157, 16.820401873148], [96.17222023007963, 16.82089042625222], [96.17216110235307, 16.821460724133146], [96.1721096035754, 16.82215309059268], [96.1720294955648, 16.8229198453746], [96.17195320157907, 16.823673629234634], [96.17181205658119, 16.824145508008826], [96.17177848758718, 16.824591827151153], [96.1716728208441, 16.824928284213], [96.17156219523918, 16.825321198014933], [96.17133712820595, 16.826257944448628], [96.17179985098238, 16.82631034884355], [96.17203865066324, 16.826069258589484], [96.17235851343469, 16.82596808755727], [96.17245292696106, 16.825938224669358], [96.17250555528722, 16.825912048102566], [96.17281913809279, 16.825756073284197], [96.17327499364609, 16.825574875180394], [96.17386817927309, 16.825469971062375], [96.17433967583543, 16.825364303419917], [96.17427063038537, 16.824986776118863], [96.17472839430002, 16.824790955038566], [96.17501055479335, 16.82466886037963]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
