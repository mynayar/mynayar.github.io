
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (69) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (Seikkan)</div><div class="name-mm">ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (69) Ward</div><div class="name-mm">အမှတ် (၆၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013021701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.26242097225014, 16.858898162720095], [96.26161766092639, 16.85684585585159], [96.2612519264353, 16.855939865332573], [96.25978966835856, 16.851114650920465], [96.25865364115265, 16.85144042943233], [96.25754419970514, 16.85180409728133], [96.25700060539367, 16.85239982619106], [96.25667381244654, 16.85268974333701], [96.25559806859604, 16.853601455342925], [96.25517082227566, 16.853948592753397], [96.25380706784199, 16.85509910623881], [96.25409126260172, 16.855409622356262], [96.2548694612567, 16.856290817667173], [96.25555229220458, 16.857061385574525], [96.25598812165453, 16.85757637065302], [96.25759124773793, 16.859912872281257], [96.2585402897027, 16.861327308008924], [96.2592334754446, 16.860742568814544], [96.25960459057944, 16.86044066280641], [96.25992107369865, 16.860222339789175], [96.26029014557383, 16.860023498785495], [96.26126003292421, 16.859442711212182], [96.26242097225014, 16.858898162720095]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
