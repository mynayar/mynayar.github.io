
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tet Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tet Thit</div><div class="name-mm">တက်သစ်</div></div>
        <span class="pcode-badge">MMR013006029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95716262605441, 16.90036937544636], [95.96188113230846, 16.899259138098785], [95.96410160520497, 16.89842646121224], [95.96715475588735, 16.896761105640564], [95.97020790656967, 16.8928752780717], [95.9743712937003, 16.892042600285833], [95.97686932705784, 16.892042600285833], [95.98158783331189, 16.891487482061677], [95.98436342443256, 16.89065480427587], [95.98908192978729, 16.887046535369336], [95.98980599734898, 16.885839755800134], [95.99019216713486, 16.88593629802176], [95.99046972579725, 16.885797519140226], [95.99046972579725, 16.88316070690115], [95.98877171943934, 16.88061369466635], [95.98824925290074, 16.879829996657065], [95.98824925290074, 16.877331964198845], [95.98713901555317, 16.87455637307818], [95.98620734579242, 16.87255993659187], [95.98525558877446, 16.870520454955056], [95.98519610221842, 16.870392985048284], [95.98511329893967, 16.870274169317497], [95.98507574504964, 16.870220282839853], [95.97983518864311, 16.871108514446462], [95.974174573298, 16.87934213693012], [95.96877125578891, 16.879599436564774], [95.96623037333313, 16.880325404393943], [95.96336794007846, 16.88114324336601], [95.95807682738376, 16.885284115069908], [95.9574401847168, 16.890377244714102], [95.9574401847168, 16.8953733096306], [95.95716262605441, 16.90036937544636]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
