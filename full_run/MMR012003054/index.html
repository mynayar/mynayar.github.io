
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Htee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mrauk-U</div><div class="name-mm">မြောက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Har Htee</div><div class="name-mm">မဟာထီး</div></div>
        <span class="pcode-badge">MMR012003054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.20839796819172, 20.519856259658695], [93.2106277976348, 20.520353580253584], [93.21119576087574, 20.52168625681537], [93.2117637340092, 20.523018930679143], [93.21460244674557, 20.528748917928283], [93.21686954859086, 20.530479473448963], [93.21772182530208, 20.53261178940261], [93.21857412359697, 20.534744100859598], [93.21956647331416, 20.535809539378818], [93.2212650453456, 20.535807379207256], [93.2240888140476, 20.530870304421057], [93.22337877590985, 20.52927118301875], [93.22351354111709, 20.52460423040094], [93.22606819129408, 20.520610123558413], [93.22673471843257, 20.519568033238215], [93.22930326763174, 20.515663120256818], [93.23099771807028, 20.513060806910744], [93.23028849022171, 20.51199505632684], [93.22745640009288, 20.510932097238538], [93.2242009424196, 20.510669658877703], [93.21882243990376, 20.510276513050712], [93.21698431467445, 20.511478851767663], [93.21769344899354, 20.51254465900888], [93.21939632338166, 20.51574259694337], [93.21939860316309, 20.51734263475487], [93.21770042233669, 20.51747811042651], [93.21005684414808, 20.51682084810369], [93.20929691072394, 20.517405115153963], [93.20853697280313, 20.517989377707693], [93.20839796819172, 20.519856259658695]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
