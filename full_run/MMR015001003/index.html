
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mae Han</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mae Han</div><div class="name-mm">မယ်ဟန်</div></div>
        <span class="pcode-badge">MMR015001003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.68186085149716, 22.91824715728052], [97.6823264062387, 22.918590584088236], [97.69911142665109, 22.928547800440697], [97.7112943472564, 22.936407115196232], [97.71447398938318, 22.929970259919628], [97.71817238294915, 22.925133896612067], [97.72329323689343, 22.918590584088236], [97.72930820940638, 22.912575613373917], [97.73808681475475, 22.890994870916586], [97.74371249863299, 22.876190130670068], [97.73979376576972, 22.870511456038912], [97.73524189579689, 22.865675093630728], [97.73097451825947, 22.861976699165382], [97.72618896574824, 22.860530550644455], [97.7167499243696, 22.861692206730027], [97.70793067506065, 22.86709755310966], [97.70451677303072, 22.872787391025327], [97.70167185407286, 22.87563230998319], [97.69370608117077, 22.876485784591353], [97.68716276774757, 22.879330704448478], [97.68175742226731, 22.878477228940994], [97.68364300651962, 22.882573311708995], [97.68435604569504, 22.885638929692902], [97.68453430571367, 22.888485513295848], [97.68702994237799, 22.890839374537563], [97.68821834160326, 22.89576592725581], [97.68875312076, 22.897681760205103], [97.68881254076621, 22.898885984800415], [97.68768356244652, 22.901458609727115], [97.68809950159078, 22.904031186090435], [97.68750530242784, 22.905618495797], [97.68667342323994, 22.907479456611668], [97.68566328403341, 22.908902526730287], [97.68239518818746, 22.912733795128588], [97.68186085149716, 22.91824715728052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
