
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Nan Yeik Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung Nan Yeik Thar Ward</div><div class="name-mm">အောင်နန်းရိပ်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39921065664657, 25.38014637375619], [97.39952698688097, 25.376176777036676], [97.3996753345491, 25.37451126678161], [97.39816721374598, 25.37446064933954], [97.39821561705713, 25.373790064459968], [97.39808522165572, 25.372786609914158], [97.39793750171441, 25.372109147918877], [97.39753528172793, 25.37221401516473], [97.39718391030925, 25.372315251847454], [97.39636195064355, 25.372850593080443], [97.39616027048015, 25.37261329346876], [97.395954108995, 25.37270238210931], [97.39548621062016, 25.37273153813004], [97.3949232979719, 25.372721819156652], [97.39467948906724, 25.372655408720163], [97.39398839784633, 25.372588997384355], [97.39338335735613, 25.37257279879566], [97.39287781156179, 25.37260357539475], [97.39183544425043, 25.37269228542067], [97.39188143827784, 25.373146564462445], [97.39191646867016, 25.373643880560678], [97.39201865323832, 25.3741897429623], [97.39213428357039, 25.374630319034054], [97.39227501128278, 25.375062794912083], [97.39285764336563, 25.378184025172686], [97.3928540577686, 25.37834761545014], [97.39244110887012, 25.382362439974656], [97.39901247844318, 25.38272156894533], [97.39921065664657, 25.38014637375619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
