
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Zin</div><div class="name-mm">ထန်းဇင်</div></div>
        <span class="pcode-badge">MMR005018004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13931499798883, 22.018177044335175], [95.13885782043212, 22.013198891215893], [95.13867204028247, 22.01312259003555], [95.12591544034535, 22.00872806994454], [95.11389143983814, 22.00292972972329], [95.11389143983814, 22.00109859042766], [95.11385400016206, 22.0009126501987], [95.11071768017683, 22.000671360295087], [95.10308819976069, 22.00109859042766], [95.0952758404078, 22.001525909593113], [95.09429915957861, 22.001525909593113], [95.09332284027693, 22.01049801037493], [95.09332284027693, 22.016723669761575], [95.09289552021215, 22.019897430322203], [95.09649659993818, 22.01947020018963], [95.10491951982004, 22.02069095972007], [95.11608888019771, 22.02069095972007], [95.12152092025434, 22.021118189852643], [95.12310780008494, 22.02447510004589], [95.13128664036623, 22.02893064003706], [95.13128664036623, 22.021484400085058], [95.13787824018868, 22.018493610192024], [95.13931499798883, 22.018177044335175]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
