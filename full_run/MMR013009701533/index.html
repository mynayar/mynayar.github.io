
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mi Chaung Kan 2 Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Mi Chaung Kan 2 Ward</div><div class="name-mm">မိချောင်းကန်အမှတ် (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701533</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.179911654899, 16.828471722791846], [96.17925453197114, 16.8282718655542], [96.1787033087108, 16.828121185044722], [96.1781082156217, 16.827970505434507], [96.1772136689757, 16.827711104983564], [96.17689661658562, 16.827636917209986], [96.17649459804733, 16.828806877635373], [96.17578766526862, 16.830491153144237], [96.17650794938243, 16.830610276443167], [96.1767749787823, 16.83065223701118], [96.1776027678535, 16.830770491564977], [96.17819023199365, 16.830831527652947], [96.17849159301267, 16.83085060137421], [96.17876624956284, 16.830854416298337], [96.1793084148515, 16.83080196333998], [96.17951011659864, 16.830091476440543], [96.17959022640787, 16.82980346675663], [96.1796913147025, 16.829362869101203], [96.17982101492794, 16.828870773567417], [96.179911654899, 16.828471722791846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
