
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Bway Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Bway Taung</div><div class="name-mm">ဘန့်ဘွေးတောင်</div></div>
        <span class="pcode-badge">MMR008002040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66408770588299, 19.092757218770657], [95.65571383232754, 19.091361572578535], [95.65190126623054, 19.09049013041522], [95.64350193286799, 19.088570281992986], [95.63547697018606, 19.084383345215258], [95.62326507072652, 19.082289877276082], [95.61314664010541, 19.08194096460386], [95.60686623538851, 19.086825724927337], [95.60966358021011, 19.09305149493059], [95.61164631192781, 19.09825616658884], [95.61362904544416, 19.10420436533923], [95.61809019270828, 19.109656879361523], [95.61982508386058, 19.11114392814983], [95.62924306311692, 19.110896086685102], [95.63866104237326, 19.110896086685102], [95.64245519844872, 19.11055170120011], [95.64454866728721, 19.108458232361556], [95.64733995787282, 19.10462020735673], [95.6532714517162, 19.100433269679684], [95.65920294555957, 19.098339801740508], [95.66269205969087, 19.097641979094135], [95.66408770588299, 19.092757218770657]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
