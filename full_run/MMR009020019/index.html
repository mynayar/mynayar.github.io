
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Gyi Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Gyi Taw</div><div class="name-mm">သစ်ကြီးတော</div></div>
        <span class="pcode-badge">MMR009020019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91530954789738, 21.526002952074634], [94.9150750460766, 21.525786843188314], [94.90971973437831, 21.524715780309066], [94.90093702182617, 21.519788893043028], [94.89022639663096, 21.5187178310631], [94.8670914494109, 21.5187178310631], [94.86518145575963, 21.519701766723188], [94.85295342426116, 21.526001055404436], [94.83795855024698, 21.532641643097406], [94.83780545235982, 21.532785735173604], [94.83976147061543, 21.540609808196166], [94.83896603375553, 21.540823963754974], [94.83924382534235, 21.54099593031799], [94.8433138619452, 21.54592281668471], [94.84695547501519, 21.548064942443204], [94.84760415600704, 21.54899162906048], [94.84952602430661, 21.548493366875448], [94.87180412266218, 21.544423329373217], [94.89172588484178, 21.54356647960941], [94.89751234501875, 21.54424724031793], [94.89750962187162, 21.544209117157095], [94.90479284711228, 21.541852780081797], [94.90736339730302, 21.53692589191644], [94.90886288371519, 21.53328427974577], [94.91421819631279, 21.525786843188314], [94.91530954789738, 21.526002952074634]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
