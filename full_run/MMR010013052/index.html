
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Lay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Lay Kone</div><div class="name-mm">ဆူးလေကုန်း</div></div>
        <span class="pcode-badge">MMR010013052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17909537265336, 21.478015341734704], [96.17931960601504, 21.46747638902417], [96.1808878150207, 21.460775859718183], [96.18247811767105, 21.45620537018175], [96.18017405998495, 21.459584654608193], [96.18008649929254, 21.45957543835584], [96.17725558457761, 21.459277447995873], [96.17613045625563, 21.45829295925273], [96.1747979262833, 21.45712699271661], [96.17280107520952, 21.459123844689714], [96.1685001673489, 21.45897024138361], [96.16654431007191, 21.461061327018683], [96.16632280885062, 21.461259323558977], [96.16541229923826, 21.46207290514053], [96.16281682703499, 21.461274297271075], [96.15953863809773, 21.461976766714486], [96.1563654638951, 21.462656733321637], [96.15702589003286, 21.464700068553384], [96.15482942633702, 21.46496079100774], [96.15495490964145, 21.467233658406656], [96.15622360123825, 21.470615650691798], [96.15532666869086, 21.477118410086632], [96.1551024362285, 21.48519080031525], [96.15398127121875, 21.49124509298673], [96.16070826217663, 21.483845401943768], [96.17191991497214, 21.481154605200913], [96.17909537265336, 21.478015341734704]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
