
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bank Yeik Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Bank Yeik Thar Ward</div><div class="name-mm">ဘဏ်ရိပ်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19649770930192, 16.830065814285945], [96.19637992599286, 16.830107453796018], [96.1962133625567, 16.830184787398082], [96.1960527499345, 16.83020263264541], [96.19588023928168, 16.830256171085466], [96.19571962486089, 16.830303759610842], [96.19568988158284, 16.830387041328947], [96.19571367674484, 16.83057144911311], [96.19568988158284, 16.83070232025591], [96.19557685838538, 16.83092836844952], [96.19555306322337, 16.83113657139569], [96.19556496035472, 16.831279338770514], [96.19561254977941, 16.83139831188265], [96.19566608732015, 16.83154702827278], [96.19573152289155, 16.83169574466291], [96.1957672151849, 16.831749282203646], [96.1959397249384, 16.83183256392175], [96.19604680091919, 16.831850410068398], [96.19622526058737, 16.831868256215103], [96.19638587410884, 16.831868256215103], [96.19666546074245, 16.831880153346447], [96.19698073966947, 16.83191584474048], [96.19697479065411, 16.83164220712223], [96.19697479065411, 16.831350723357275], [96.19696289442209, 16.831124674264345], [96.1969474269822, 16.830901004777616], [96.1969045967698, 16.830729683028494], [96.19674041383911, 16.83042273272298], [96.19649770930192, 16.830065814285945]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
