
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Thein Nyunt Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pa Thein Nyunt Ward</div><div class="name-mm">ပုသိမ်ညွှန့်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18223635382475, 16.80540106001098], [96.18212127657569, 16.804805755581185], [96.1820626938383, 16.804444721846494], [96.18200411110092, 16.804083688111746], [96.18167087001467, 16.802766800047834], [96.18162873677682, 16.802764314321678], [96.1812505727558, 16.80274200483973], [96.18091201757562, 16.802770614971962], [96.18037414565038, 16.80281066897726], [96.18006944634794, 16.80283927910949], [96.17895833216136, 16.802807190399562], [96.17893218976883, 16.803192138906127], [96.17896079990106, 16.80360984791622], [96.17897987362232, 16.804101944349327], [96.17900657629252, 16.804639816274573], [96.17902946493791, 16.805192947896273], [96.1790575984295, 16.8058438304285], [96.18047141992014, 16.805742263694583], [96.18143272414096, 16.805669784632926], [96.18187800366701, 16.805608749444275], [96.18223635382475, 16.80540106001098]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
