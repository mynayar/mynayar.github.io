
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tat Kone</div><div class="name-mm">တပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009001047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06829581030348, 20.095340695616642], [95.08041641688419, 20.093375192211397], [95.08155154386873, 20.09305987911017], [95.07936642422118, 20.089175220659968], [95.07761643614964, 20.080075283947224], [95.07516645266969, 20.066775374783788], [95.07913628860888, 20.058835702905412], [95.07376646275213, 20.055575450946378], [95.0590665627717, 20.042975538090673], [95.05904359768397, 20.042970026145838], [95.05031662331356, 20.04087555186527], [95.03526672607859, 20.04087555186527], [95.03172613565272, 20.04305437715783], [95.03071675727261, 20.04367553259982], [95.03526672607859, 20.057675437171724], [95.03561672423251, 20.069575354618962], [95.03106675542648, 20.077625299567956], [95.02856720671127, 20.08174955539772], [95.03526672607859, 20.084975250007858], [95.03936169818388, 20.088125227996898], [95.03946669673076, 20.088125227996898], [95.05136661597663, 20.084975250007858], [95.05626658203721, 20.088825224304685], [95.0639665297316, 20.09442518487441], [95.06816650128309, 20.095125181182198], [95.06829581030348, 20.095340695616642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
