
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Hpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div>
        <span class="pcode-badge">MMR015016013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.15802898824728, 22.94594061416808], [97.16264523978606, 22.94052439588421], [97.16912068587101, 22.929544293334516], [97.17672229629699, 22.92729196465251], [97.18995472662937, 22.916030320343054], [97.20009020659779, 22.908428710816395], [97.20213339074343, 22.906707287911047], [97.19980866573741, 22.895759361305522], [97.19671171357476, 22.88872083260037], [97.19051781014889, 22.88956545698028], [97.18422801111387, 22.88614500878515], [97.17203123105651, 22.886513288357605], [97.16169414017247, 22.882785156909506], [97.1609811189835, 22.881633353796303], [97.155773732272, 22.88547037515775], [97.15004006769504, 22.891204038835383], [97.14641880628295, 22.896937703412334], [97.14551349115476, 22.902671367989285], [97.14038337059611, 22.906292629401378], [97.12740718319503, 22.904783770254824], [97.11171505040932, 22.897239475421486], [97.11150843026991, 22.89726013734554], [97.11223921216998, 22.8981997139457], [97.11675403996702, 22.914341074281197], [97.11872482778864, 22.926447341171922], [97.11872482778864, 22.938835149822353], [97.12294794519158, 22.94531059500798], [97.13252034164049, 22.953475287154845], [97.13955887034564, 22.951786041092987], [97.14631585639171, 22.945873676728866], [97.15138359637592, 22.937990527241084], [97.1544805476392, 22.939116690682795], [97.15802898824728, 22.94594061416808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
