
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyu</div><div class="name-mm">ချောင်းဖြူ</div></div>
        <span class="pcode-badge">MMR007009024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3590521440413, 18.985344549811202], [96.35767547534294, 18.986870564425033], [96.3584584619885, 18.99034785786739], [96.35894154991269, 18.992521755774476], [96.35966618314791, 18.998318817159713], [96.3615985357439, 19.002425068562104], [96.357975373165, 19.006772865275536], [96.35958153266165, 19.009976067841308], [96.36179177217258, 19.010637572266205], [96.36324103684444, 19.014502280156137], [96.36735131541093, 19.013495846156445], [96.36758883265856, 19.011120660190386], [96.37127763675358, 19.008499444893516], [96.37266126170795, 19.00798058643494], [96.37411052727907, 19.003874334133286], [96.37821677868146, 19.000251170655076], [96.3815983977479, 18.99759418392449], [96.38570464915028, 18.995661831328505], [96.38981090055267, 18.994454109269782], [96.3917432549473, 18.9930048436986], [96.39077707819968, 18.989140136707988], [96.38787854705737, 18.98672469438918], [96.38302005772954, 18.986283013949958], [96.37604288077438, 18.987449326725084], [96.37145353964917, 18.986966238800903], [96.36710574473437, 18.987449326725084], [96.36203331568504, 18.987207783212682], [96.3590521440413, 18.985344549811202]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
