
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Yar San (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bahan</div><div class="name-mm">ဗဟန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Sa Yar San (South) Ward</div><div class="name-mm">ဆရာစံတောင် (ဂွတ္တလစ် တောင်ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR013044701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1669351140643, 16.817378264295485], [96.16643269881007, 16.817178407957215], [96.16510963420234, 16.816202163299238], [96.16433779375421, 16.815642675269316], [96.16396013874947, 16.81549262968116], [96.16355705271587, 16.81544017942082], [96.1632099153054, 16.815429687030473], [96.16289329458994, 16.815361022892944], [96.16221427856618, 16.81526184116109], [96.16190002036973, 16.81520253177149], [96.16174697913982, 16.81555700315323], [96.16162790620297, 16.815930229896253], [96.16156578103602, 16.816301345930412], [96.16150855987217, 16.816641489313326], [96.16132354774362, 16.81707954458534], [96.16117995119384, 16.81734929803173], [96.1608659043381, 16.81776821842857], [96.16135088623446, 16.81791750588826], [96.16177134986793, 16.81807560400597], [96.1625900270082, 16.81821060213764], [96.16292476636494, 16.818274021428977], [96.1633999564429, 16.81844347168891], [96.16388130238028, 16.81876945524624], [96.164361954041, 16.819131850554527], [96.16496398270169, 16.81958233265857], [96.16544838003875, 16.81917076242081], [96.16595459043208, 16.818521499567623], [96.16621767000953, 16.818214349612617], [96.16633033707546, 16.818082809374175], [96.16651905261227, 16.817861556365756], [96.16655159008388, 16.81782340982255], [96.1669351140643, 16.817378264295485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

</body>
</html>
