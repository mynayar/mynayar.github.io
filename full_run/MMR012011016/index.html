
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thaing Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thaing Chaung</div><div class="name-mm">သိုင်းချောင်း</div></div>
        <span class="pcode-badge">MMR012011016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.58413330171055, 19.291982151155423], [93.58351389275202, 19.291947379767805], [93.57934022277311, 19.293798233102052], [93.57586624782914, 19.29652881944952], [93.57317013069701, 19.300359440335967], [93.57064146822921, 19.307864630848087], [93.56921454361634, 19.32058503397218], [93.56899041457604, 19.322937814228794], [93.56918141439081, 19.33337456888131], [93.56904998207108, 19.340137199971878], [93.57323904844338, 19.342329141876462], [93.57541285911623, 19.343939342027056], [93.57913230491198, 19.344662581313116], [93.58238352228176, 19.344358210263238], [93.58315368999087, 19.343179711674395], [93.58314951443862, 19.342003689818455], [93.58267865279765, 19.340241141815284], [93.57694192243184, 19.338348333309], [93.5739948881536, 19.337034594670854], [93.57414512529738, 19.335711080402064], [93.57552909109472, 19.33291362586317], [93.58188297402012, 19.334216497993054], [93.58234442605448, 19.33333299682039], [93.58388935610895, 19.33229902378099], [93.58809930743712, 19.325436998718544], [93.59528145157776, 19.321519996150926], [93.59460940709852, 19.320504021243607], [93.59155182815442, 19.30992962355333], [93.59068149035858, 19.3047137724227], [93.58939307303194, 19.301630832596913], [93.58810470516806, 19.29854788287855], [93.58475271156846, 19.292016919845025], [93.58413330171055, 19.291982151155423]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
