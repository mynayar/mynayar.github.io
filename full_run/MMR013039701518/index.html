
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Ni Kone (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myay Ni Kone (South) Ward</div><div class="name-mm">မြေနီကုန်း (တောင်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701518</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14263916006922, 16.80466365820132], [96.14224161385943, 16.80435207908522], [96.14193153391324, 16.804147720740787], [96.1415615087567, 16.803874969854007], [96.14120292657384, 16.803577422859803], [96.14091491688998, 16.803358078212796], [96.14059257558694, 16.80311584492034], [96.13957786602577, 16.8024005889161], [96.1388454437623, 16.80188369727483], [96.13800901940078, 16.80138663118811], [96.13769912741287, 16.80242347756149], [96.13753128064417, 16.802947998151637], [96.13733782118356, 16.803770610725167], [96.13777160557521, 16.803762435887734], [96.13876152082759, 16.80377006573599], [96.13961919167241, 16.803759257683623], [96.13971042699467, 16.804450989221834], [96.13973045309797, 16.805162430301948], [96.13978258769635, 16.80562273660007], [96.14017295821549, 16.805557631979184], [96.14040527378444, 16.805769348576632], [96.14056110381193, 16.8060035707083], [96.14078712502584, 16.80629587195699], [96.14095115687047, 16.806592941411168], [96.14123344416817, 16.806318283062353], [96.14148139984678, 16.806070327383736], [96.14171246086141, 16.805868693985076], [96.14191137021362, 16.805640902006076], [96.14207267801174, 16.805410385081245], [96.14228439370987, 16.805109024062233], [96.14263916006922, 16.80466365820132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
