
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Boe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Boe</div><div class="name-mm">ဘန့်ဘိုး</div></div>
        <span class="pcode-badge">MMR009020063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8878521972212, 21.818250879074867], [94.88362759503752, 21.824374758588306], [94.87834454656365, 21.83368298638078], [94.8691655279668, 21.847288343981916], [94.87407243409564, 21.852840894991346], [94.87629807989254, 21.854901677970133], [94.87759965789797, 21.85451289835163], [94.8810051278844, 21.85273849008928], [94.8813115871601, 21.85259667599587], [94.88911185422876, 21.848987012240855], [94.89179915980344, 21.847743450399946], [94.89815893778479, 21.843224641304175], [94.90017943383384, 21.842002950076107], [94.9001830949739, 21.841982680256535], [94.90025915963258, 21.841936920052888], [94.90036359070723, 21.841874020569662], [94.90039199669337, 21.841856946041275], [94.90359094906313, 21.839933962582336], [94.90175902106205, 21.837785927378718], [94.89347658877364, 21.826687468651812], [94.8878521972212, 21.818250879074867]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
