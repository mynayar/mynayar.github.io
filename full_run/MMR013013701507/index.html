
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Man Pyay Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Man Pyay Ward</div><div class="name-mm">အမှတ် (၃) မန်ပြေရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013013701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19232311212198, 16.779329872175936], [96.19641232586821, 16.787687787261632], [96.19734001163226, 16.787290572901668], [96.19790840115184, 16.787031173350044], [96.19845199636262, 16.78677940364662], [96.19965418669142, 16.786233453111436], [96.19952201872627, 16.785959244423623], [96.19935035703338, 16.785610198651796], [96.1987457284327, 16.784372330418762], [96.19860267597278, 16.784074783424558], [96.19841194055869, 16.783681869622626], [96.1980495452504, 16.782926559613088], [96.1977596281044, 16.782318751009598], [96.19744173664691, 16.781672795862903], [96.19718170217385, 16.781141281245198], [96.1967105869241, 16.780189514334666], [96.19656181297734, 16.779901504650752], [96.19580841042983, 16.778362273600123], [96.19552116427036, 16.777631505189845], [96.19450187715995, 16.778135300004124], [96.19357872038171, 16.778623580613782], [96.1926708224006, 16.779119491971016], [96.19232311212198, 16.779329872175936]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
