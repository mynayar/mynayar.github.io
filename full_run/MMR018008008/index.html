
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oke Ta Ra Thi Ri</div><div class="name-mm">ဥတ္တရသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yar Taung</div><div class="name-mm">ဘုရားတောင်</div></div>
        <span class="pcode-badge">MMR018008008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92538376764679, 20.006487028153856], [95.92014895431083, 20.0164807650753], [95.91753154674353, 20.028616016216233], [95.91712281386685, 20.038899222421207], [95.92305564320344, 20.041272354335717], [95.92503324878544, 20.042063396208846], [95.92938398808064, 20.044832048160572], [95.93531681381995, 20.044832048160572], [95.93675962315814, 20.046559848158495], [95.9382254011814, 20.048315153021917], [95.94907809857546, 20.04984131422532], [95.95388817110228, 20.050517730309082], [95.96344658669068, 20.054540752154026], [95.96521601720548, 20.04702067336541], [95.96698544772028, 20.031538156360853], [95.9692479980967, 20.02163949756482], [95.97052430785061, 20.016055640255615], [95.97204069791991, 20.01248766367479], [95.96726228242846, 20.009104435721156], [95.95131989259903, 20.003869620586556], [95.92538376764679, 20.006487028153856]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
