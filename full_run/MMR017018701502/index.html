
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyinegyun</div><div class="name-mm">မော်လမြိုင်ကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) Ward</div><div class="name-mm">အမှတ် (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017018701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2650506395754, 16.38321525987641], [95.26502514289609, 16.382836111996994], [95.2650130326254, 16.382620242330347], [95.2650535560768, 16.382359873309554], [95.2645553721328, 16.382335268757686], [95.26462867497344, 16.381466280844222], [95.26463058693213, 16.38133418932142], [95.26468285463011, 16.381019860977858], [95.26472109919945, 16.380554481604065], [95.2638287262148, 16.380547143136198], [95.26215810151524, 16.380524848942684], [95.26029574675135, 16.380537977245922], [95.26021079049565, 16.382733986784103], [95.26137087546562, 16.38274621756392], [95.26142755613688, 16.383202216109453], [95.26432526799675, 16.38316266842247], [95.2650506395754, 16.38321525987641]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
