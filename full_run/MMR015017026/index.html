
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Yun Au Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmit</div><div class="name-mm">မိုးမိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Yun Au Yar</div><div class="name-mm">မန်ယွန်းအူရာ</div></div>
        <span class="pcode-badge">MMR015017026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.83615405836315, 23.288632630791312], [96.8720410153806, 23.27270379014783], [96.89359323763784, 23.261677071239887], [96.91765153319176, 23.232105416232002], [96.91934062636886, 23.22872723077711], [96.91334908029586, 23.220082349221116], [96.9061235996245, 23.21757019560812], [96.87153979982196, 23.20002768882682], [96.82893656906748, 23.188499756158876], [96.82735161918191, 23.187639354972305], [96.82191956563548, 23.19250947073556], [96.81440134844354, 23.20503983362147], [96.80938920364889, 23.21807141116676], [96.79786127008163, 23.22859691541538], [96.75876654014377, 23.23711756102665], [96.74419159826368, 23.241570564030383], [96.76327747027909, 23.247141850615947], [96.78031876330033, 23.25115156699127], [96.80136977179757, 23.271701360829184], [96.81590499242151, 23.281224435759157], [96.83615405836315, 23.288632630791312]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
