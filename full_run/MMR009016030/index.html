
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyi Yat Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyi Yat Kone</div><div class="name-mm">ကျီရပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009016030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18621078909672, 19.08725873140537], [95.18484474498905, 19.080671415053814], [95.1821286907865, 19.06817756374363], [95.17829572626681, 19.056847303860025], [95.17757825882961, 19.05879471380507], [95.17804488196577, 19.066260685782083], [95.17641170143895, 19.069760359752877], [95.1696456637165, 19.072093476332896], [95.16217969263874, 19.075126527167527], [95.16031320009415, 19.076759707694407], [95.15354716327101, 19.080492693682913], [95.14397957909438, 19.087782283425668], [95.14825121222373, 19.0931527621903], [95.15280111987585, 19.102253379689785], [95.15326820076689, 19.103187624209568], [95.1540943701591, 19.10484010868413], [95.15585295664869, 19.103384554153877], [95.16311293891107, 19.09612457189155], [95.17223652059903, 19.088113620647107], [95.17267871455107, 19.087725353642213], [95.1773449468119, 19.087025419387658], [95.18145664270997, 19.087133622218914], [95.18621078909672, 19.08725873140537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
