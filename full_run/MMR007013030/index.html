
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Daing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Daing</div><div class="name-mm">အင်ဒိုင်း</div></div>
        <span class="pcode-badge">MMR007013030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.37341141770281, 18.776459544272598], [96.37436647882998, 18.77813090012097], [96.37436647882998, 18.780041020576675], [96.3777091914261, 18.780279786083327], [96.38057437300898, 18.781473611817773], [96.38248449436401, 18.7812348472105], [96.38654350168133, 18.780041020576675], [96.38940868416353, 18.781712377324425], [96.39165759362311, 18.781956950652784], [96.39165307722777, 18.780041020576675], [96.39571208364578, 18.7798022559694], [96.39833850062138, 18.78290620305887], [96.40215874423075, 18.784577558907245], [96.4033525699652, 18.78577138464175], [96.40956046414419, 18.786010150148343], [96.41194811561309, 18.780757317096572], [96.41457453168937, 18.778369664728302], [96.41600712293047, 18.77526571763883], [96.41699292828105, 18.773622968325355], [96.414479026386, 18.77323621398017], [96.41228332261733, 18.771702187306175], [96.41042001906868, 18.77287806616988], [96.40588347983879, 18.77263930066323], [96.40349582926916, 18.77049041470093], [96.39848175992535, 18.769296588966483], [96.39394522159478, 18.769535353573758], [96.38940868416353, 18.76977411908041], [96.38821485842902, 18.771684240435377], [96.38415585021238, 18.77263930066323], [96.38081313761626, 18.77192300594203], [96.37747042591946, 18.7735943617904], [96.37341141770281, 18.776459544272598]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
