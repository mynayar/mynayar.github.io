
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Du</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Du</div><div class="name-mm">မင်းဒူး</div></div>
        <span class="pcode-badge">MMR008013037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40181610902624, 18.29081738901135], [95.40094968957658, 18.296449110937772], [95.39964414825891, 18.30614742596299], [95.39740607473061, 18.314540197871906], [95.39330294217712, 18.324798030604654], [95.39181089315827, 18.329087670859394], [95.39069185684377, 18.335988394648723], [95.39069185684377, 18.34051621405206], [95.39165947520468, 18.340604179439367], [95.40529001472248, 18.334677857597114], [95.41062370581943, 18.33201101339762], [95.41347704962618, 18.324044478769736], [95.415388357187, 18.32089348814401], [95.41729080912359, 18.319547650004097], [95.42059834563719, 18.320019814762702], [95.42153739883196, 18.320927992432928], [95.4220111652831, 18.320865920326014], [95.42395793221289, 18.3174915228156], [95.42218003637964, 18.313046780984223], [95.42543951312308, 18.307713089887216], [95.42306898204794, 18.30474992716745], [95.42040213874776, 18.303268348055894], [95.42188371785937, 18.298823606224516], [95.42412821614431, 18.29689975132254], [95.41624318707346, 18.29495706281824], [95.40449330532186, 18.291599953874822], [95.40181610902624, 18.29081738901135]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
