
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dei Yauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dei Yauk</div><div class="name-mm">ဒယ်ရောက်</div></div>
        <span class="pcode-badge">MMR005011006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41091492608302, 22.88079951768367], [95.41009512029365, 22.882507289779653], [95.40808092039822, 22.887329129935438], [95.40692135973302, 22.891296419893933], [95.40252683964201, 22.89288329972453], [95.39713007998927, 22.896049409752493], [95.39711640040161, 22.89609063017849], [95.39947511978102, 22.901306129674197], [95.40551772036656, 22.900085460075957], [95.4094849203928, 22.899902310443338], [95.42028815957099, 22.904479980167025], [95.42286755998998, 22.90765923018938], [95.42309579983134, 22.90692141019497], [95.42669687955743, 22.90411376993461], [95.43090816008356, 22.901489280206192], [95.4370727995701, 22.89788819958079], [95.44023284277154, 22.896141837575783], [95.43994699325918, 22.895956875809247], [95.43621349016053, 22.888723215803793], [95.4124124106043, 22.881489553100437], [95.41091492608302, 22.88079951768367]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
