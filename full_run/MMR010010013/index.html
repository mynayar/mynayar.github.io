
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Yar Wa Di</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Yar Wa Di</div><div class="name-mm">သာယာဝတီ</div></div>
        <span class="pcode-badge">MMR010010013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02510162314144, 22.427216558397504], [96.02139004011832, 22.41947031000683], [96.02026986526215, 22.4127492581718], [96.01766072336375, 22.409966173899875], [96.01766072336375, 22.41107764871458], [96.01740638969318, 22.413366646353722], [96.0153717257246, 22.41540131032224], [96.01130239778746, 22.418707639046374], [96.00697873797844, 22.421759634999205], [96.00367240925436, 22.423794298967778], [95.99884008210415, 22.426337629378168], [95.99960308131722, 22.429389625330998], [95.99884008210415, 22.432950285927006], [95.99884008210415, 22.43498494989558], [95.99950580614808, 22.436020521030287], [96.00112907884397, 22.438545612290227], [96.00697873797844, 22.442360606556804], [96.0097764002607, 22.443123605769813], [96.0141000609691, 22.443123605769813], [96.01592835211181, 22.44418710984729], [96.0191389965675, 22.441435128628314], [96.0237256334313, 22.43226185669937], [96.02510162314144, 22.427216558397504]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
