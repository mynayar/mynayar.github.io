
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doke Yaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doke Yaik</div><div class="name-mm">ဒုတ်ရိုက်</div></div>
        <span class="pcode-badge">MMR017008089</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25455725101637, 17.576551416914413], [95.25488351066554, 17.578769990442765], [95.25463859019885, 17.585627800382724], [95.25439142502432, 17.586781236664763], [95.25638951986053, 17.586733319886832], [95.25673835968763, 17.58671216963097], [95.26120451977283, 17.58632940018174], [95.25980088040637, 17.589519360230327], [95.25852468036976, 17.593857720357562], [95.25852468036976, 17.597302829761816], [95.259290400032, 17.59857884993403], [95.25980088040637, 17.600620409904025], [95.25801455972419, 17.60419323023342], [95.26184244037637, 17.605979550016286], [95.2650568799711, 17.60662251042055], [95.27141231962293, 17.607893579824918], [95.2719227999973, 17.60687279983989], [95.27205024022646, 17.60227920042479], [95.2739643599673, 17.601896430076238], [95.27766443976213, 17.60304483015483], [95.28059952025171, 17.60432076039484], [95.2830237597388, 17.59487850034259], [95.28557580008317, 17.586967409818158], [95.28664680000986, 17.581694219712517], [95.28723467963681, 17.57880108000586], [95.28098219976874, 17.575611119957273], [95.2739643599673, 17.571910680433632], [95.26988124002725, 17.571272759830038], [95.26107671981481, 17.57369709014864], [95.25620951785504, 17.575689003045113], [95.25455725101637, 17.576551416914413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
