
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (134) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (134) Ward</div><div class="name-mm">အမှတ် (၁၃၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701548</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.22966363706723, 16.9301454751336], [96.22853615701808, 16.927030788340232], [96.22725296025595, 16.92515754728305], [96.22636795092023, 16.923761367792963], [96.22379570011151, 16.920148849589793], [96.22205162058589, 16.921302795787426], [96.21881421410478, 16.923643748160487], [96.21814091956782, 16.924710591420705], [96.21966266689861, 16.925321579127626], [96.22192226659939, 16.926466335153293], [96.22235679742829, 16.92695236206191], [96.2226955405668, 16.9274044035904], [96.2234334945602, 16.927958487594196], [96.22451452732366, 16.92889907143507], [96.22509574926949, 16.929716803387805], [96.22580039956887, 16.93134101857322], [96.2271976465542, 16.930856704873065], [96.22908687575875, 16.930339813231853], [96.22966363706723, 16.9301454751336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
