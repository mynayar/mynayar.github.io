
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hka Yo (Loi Long)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hka Yo (Loi Long)</div><div class="name-mm">မန်ခယို (လွယ်လုံ)</div></div>
        <span class="pcode-badge">MMR015008024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.05522440817998, 22.871275768262137], [99.05199891681661, 22.86535374338058], [99.04724902782044, 22.86286570418895], [99.04340387658772, 22.863091888180122], [99.04159439386626, 22.85834199918395], [99.03752305864231, 22.856758701353044], [99.03571357682017, 22.85427066396005], [99.03345172431767, 22.847258917964723], [99.03480883725808, 22.84250902896855], [99.03593976261004, 22.837759138173737], [99.03526120703913, 22.834140172730827], [99.03593976261004, 22.82871172456646], [99.03535403236276, 22.826564047293004], [99.02318483541188, 22.83199843098288], [98.99802659525125, 22.846534004141006], [98.9957008468167, 22.846418058146924], [98.9957008468167, 22.84815725435385], [98.97772915927334, 22.86178095182953], [98.95222022038695, 22.877317956058903], [98.9528006887009, 22.879462774387605], [98.97421887689973, 22.90239736524626], [98.98043523279983, 22.903491030786483], [99.01251307082163, 22.88294116500282], [99.02227729895822, 22.876424940958316], [99.04034020024011, 22.875694516988403], [99.05522440817998, 22.871275768262137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
