
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Kone Gyi</div><div class="name-mm">ဇီးကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR007005048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.66743902119396, 17.98268950221882], [96.66553827527127, 17.981501534668155], [96.66183707312251, 17.97806470532197], [96.65628527034903, 17.974627875076408], [96.65179095428914, 17.974099132169272], [96.6472966382293, 17.973041646354943], [96.64597477961246, 17.975949732793993], [96.64333106417735, 17.97832907722517], [96.64148046355263, 17.98203027937393], [96.63857237711358, 17.98388087909933], [96.63592866077914, 17.988375196058485], [96.63487117496481, 17.991283283396854], [96.6361930326824, 17.996041971359944], [96.63672177558954, 18.0002719146172], [96.63777926230318, 18.00318000195557], [96.63820726675203, 18.005962032222044], [96.6424850764252, 18.00595590424166], [96.64750813539217, 18.00807087587026], [96.6525311943592, 18.01097896320863], [96.65755425422549, 18.01150770611582], [96.66363479900684, 18.01097896320863], [96.66839348696993, 18.008599618777453], [96.66601414343802, 18.003576559810426], [96.66495665672437, 18.000932844375313], [96.66495665672437, 17.9982891289402], [96.66495665672437, 17.994059183884303], [96.66522102862763, 17.989036124917277], [96.66601414343802, 17.98586366567571], [96.66743902119396, 17.98268950221882]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
