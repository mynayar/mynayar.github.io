
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Daing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Daing</div><div class="name-mm">အင်ဒိုင်း</div></div>
        <span class="pcode-badge">MMR007010014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.36394082361016, 19.195890123830225], [96.36653457630973, 19.197372267716048], [96.36958503532117, 19.200168521659975], [96.37416072383837, 19.20296477560396], [96.38089715408046, 19.20461710809309], [96.38483733037856, 19.201185341930056], [96.38890460876075, 19.20093113686255], [96.39373450324479, 19.20093113686255], [96.40212326507668, 19.20169375116575], [96.40746156789709, 19.201439546098243], [96.4115288471786, 19.19864329215426], [96.41203725731361, 19.19483021794025], [96.4150877163251, 19.19177975892876], [96.41664235815836, 19.18964212708255], [96.4148335112576, 19.188220889782315], [96.41000361767288, 19.183899407231934], [96.4064447494257, 19.17932371781535], [96.40415994442594, 19.177861710649495], [96.4001235199845, 19.178349266405576], [96.39368366187153, 19.17733244613555], [96.3870718956515, 19.17584775536966], [96.38554910420783, 19.177035874006435], [96.38148182492631, 19.17881530768034], [96.37970239125241, 19.181611563422962], [96.37461829170087, 19.183899407231934], [96.37207624282439, 19.187204071310873], [96.36953419394797, 19.190000325254857], [96.36521270959895, 19.19483021794025], [96.36394082361016, 19.195890123830225]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
