
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nein Lum Hko Mone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nein Lum Hko Mone</div><div class="name-mm">နိမ်လွမ်ခိုမုန်း</div></div>
        <span class="pcode-badge">MMR015011036</span>

    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.8587861287769, 23.742539497999473], [97.85954408818918, 23.741326783804084], [97.86318093035572, 23.73550793274495], [97.86113044461439, 23.72290949477741], [97.85849390666851, 23.71441284757492], [97.86552532803154, 23.71236210282882], [97.87403844361933, 23.71323547134], [97.86973910597504, 23.703024545446453], [97.86710592519836, 23.69958996170743], [97.86707779800201, 23.699637426126344], [97.85280351207246, 23.703024545446453], [97.83635179300092, 23.70810522307761], [97.83194422824357, 23.70913909629229], [97.81675489202473, 23.71270202677715], [97.79691605363303, 23.71487945991919], [97.79154348574332, 23.716532560429357], [97.79491852177244, 23.718220247066824], [97.7974019483413, 23.719437734863618], [97.79943635240579, 23.720435091106594], [97.80114048764347, 23.72127053520711], [97.80985998774827, 23.725545226930706], [97.82362961911167, 23.730526290256137], [97.82575500938623, 23.731496676730274], [97.8281368008727, 23.732584127055873], [97.8353098816458, 23.735859128795823], [97.83710624685585, 23.73667929341468], [97.84589542643283, 23.737851432897344], [97.8587861287769, 23.742539497999473]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
