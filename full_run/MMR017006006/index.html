
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yin Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yin Ku</div><div class="name-mm">မရင်းကူး</div></div>
        <span class="pcode-badge">MMR017006006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09913360013559, 17.402487390280896], [95.09913360013559, 17.403106950325537], [95.09913360013559, 17.403726510370234], [95.1020247604344, 17.411298480040898], [95.10501096018771, 17.416596690185145], [95.10629255975391, 17.418870539643763], [95.11193699989269, 17.423413740152057], [95.11427772024064, 17.424515159646944], [95.11984620004216, 17.41906250982703], [95.12088588017929, 17.418044520438343], [95.12494956037398, 17.41259060976887], [95.12611740019793, 17.411023169683574], [95.1299762400115, 17.404440840072766], [95.1307984802657, 17.40303810002837], [95.13044459973855, 17.401759200226934], [95.12900855959742, 17.39656745992039], [95.12597988036725, 17.391060539612283], [95.12281331977897, 17.385828929661443], [95.12088588017929, 17.38610432995091], [95.11840764000067, 17.38651734000331], [95.11735176037553, 17.38673585997202], [95.11441524007131, 17.387343360108048], [95.10656796004338, 17.388857789655333], [95.10393312001753, 17.389911689872633], [95.10037272022493, 17.39133593990175], [95.09913360013559, 17.397531179720204], [95.09913360013559, 17.402487390280896]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
