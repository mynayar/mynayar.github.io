
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daung Ma Nar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daung Ma Nar</div><div class="name-mm">ဒေါင်းမနား</div></div>
        <span class="pcode-badge">MMR008003012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15803004984696, 18.79121646217004], [95.16077984031745, 18.787146772705455], [95.16378426932863, 18.779034815904083], [95.16318338280695, 18.76881975942439], [95.16142500226209, 18.764780119906675], [95.15871410477217, 18.762069222416756], [95.15698899014984, 18.760344107794367], [95.14922596760437, 18.750363080092143], [95.14146294595827, 18.755908094782797], [95.1406865864169, 18.756185366561454], [95.13369992521143, 18.75868060302747], [95.13334346363001, 18.758918244381505], [95.13037291567758, 18.760898609083597], [95.12926391309918, 18.76644362467357], [95.12704590614374, 18.77143413897437], [95.12260989403143, 18.7747611476089], [95.12019772614423, 18.776602013072477], [95.12923334064624, 18.781137915582406], [95.13283865527978, 18.785344114938994], [95.13824662678047, 18.786545887083093], [95.14425548390352, 18.78864898676136], [95.14901571240529, 18.79372656442945], [95.15326876913844, 18.798263157618692], [95.15803004984696, 18.79121646217004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
