
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ja Hkan Dat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ja Hkan Dat</div><div class="name-mm">ကျခန်းဒပ်</div></div>
        <span class="pcode-badge">MMR001012005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.38504518238932, 24.351250751920702], [97.3932001555628, 24.35030249866145], [97.39730634041535, 24.351475694847466], [97.40125510703763, 24.351853259920063], [97.41142922188112, 24.347084143418556], [97.41492280114642, 24.339098820154504], [97.41941454514517, 24.332111661623912], [97.41164169570777, 24.326296201008915], [97.3913345128775, 24.324180868752137], [97.38652595031243, 24.325029439357195], [97.3845478402107, 24.32551874609328], [97.38132155204806, 24.327131888825647], [97.37501562726942, 24.32933163144969], [97.37061614382003, 24.33167802202314], [97.36784836960663, 24.334766850609697], [97.3697932974228, 24.336041232217156], [97.37095312518665, 24.33680119082237], [97.37505257591573, 24.34071465725566], [97.37507317218922, 24.34073431913356], [97.38241134510753, 24.34773957292299], [97.38253942565404, 24.347912875878592], [97.382671400265, 24.348038861904], [97.38504518238932, 24.351250751920702]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
