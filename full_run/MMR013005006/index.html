
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Taik Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Taik Kwin</div><div class="name-mm">ရင်းတိုက်ကွင်း</div></div>
        <span class="pcode-badge">MMR013005006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95296575176809, 17.310020963596628], [95.95291659842235, 17.30891009492501], [95.95231697364949, 17.30862456017536], [95.95299384658881, 17.307436712234505], [95.95426072695102, 17.305213457734908], [95.95340903839644, 17.3047876125583], [95.95285417108317, 17.304510179801014], [95.94232683671419, 17.30922932907032], [95.93829293307249, 17.309805601147616], [95.93216251458841, 17.31068137534527], [95.92127216977485, 17.312859444307946], [95.91401194019892, 17.312859444307946], [95.91110784764913, 17.312496432964053], [95.90747773331083, 17.308866317726427], [95.88642306637149, 17.31104438668916], [95.87988885858402, 17.314311489683575], [95.88999267881911, 17.325806854302925], [95.90015700094489, 17.33306708387886], [95.91080533819587, 17.33645519155391], [95.91661352239618, 17.33306708387886], [95.92677784362263, 17.33258306875365], [95.93839421292267, 17.324838824052563], [95.94333779160587, 17.31989524357067], [95.94406091308076, 17.319172122995155], [95.94807451902392, 17.315158517051998], [95.95203146498017, 17.311002301115366], [95.95296575176809, 17.310020963596628]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
