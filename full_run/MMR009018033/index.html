
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lan Oh</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lan Oh</div><div class="name-mm">ဖလံအို</div></div>
        <span class="pcode-badge">MMR009018033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91116395205478, 21.360885668039202], [94.91385093837016, 21.35013772187841], [94.91703975627979, 21.341730836908653], [94.90810665819578, 21.336255711232127], [94.89470333688956, 21.33721309171085], [94.88656560641766, 21.336734400572198], [94.88560822593894, 21.328117980760226], [94.88800167623646, 21.320937629867785], [94.89326726707077, 21.310406449997743], [94.8903951256346, 21.303226099105245], [94.89661809694769, 21.295567058872734], [94.89885793764375, 21.294141706274786], [94.8951820271289, 21.292216228096493], [94.8951820271289, 21.288865398219627], [94.89355984800864, 21.28990083175802], [94.87268359487206, 21.303226099105245], [94.87268359487206, 21.30622539118889], [94.87268359487206, 21.310885140237076], [94.86646062535766, 21.331468810637148], [94.86816079998101, 21.336994380186525], [94.86837538541579, 21.33769178195024], [94.86837538541579, 21.348701652059617], [94.86837538541579, 21.356360693191505], [94.87507704516958, 21.360668902647774], [94.87537676222786, 21.36083674402056], [94.87603442474898, 21.358754142589646], [94.88704429575768, 21.358754142589646], [94.9042771371802, 21.359232832829036], [94.91116395205478, 21.360885668039202]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
