
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Kone</div><div class="name-mm">သဖန်းကုန်း</div></div>
        <span class="pcode-badge">MMR017009002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58365155157793, 17.466394535979077], [95.5851789700335, 17.465809169057934], [95.58677951955923, 17.465260409940015], [95.58979776035841, 17.466266520183808], [95.59136772034407, 17.465683950154244], [95.59321128017649, 17.464224599585634], [95.59451699955991, 17.4627652499164], [95.59710143977969, 17.459954909891223], [95.59630440032788, 17.457912269835447], [95.59461024037034, 17.45263125023206], [95.59381320001921, 17.44954226966007], [95.59381320001921, 17.44575588012981], [95.59431143972125, 17.443065599597787], [95.593912920445, 17.442019349913096], [95.59351440026944, 17.44097310022846], [95.59172087961497, 17.437286340292417], [95.58922968020562, 17.439478470155336], [95.58434735974294, 17.443165230091324], [95.58215496008341, 17.443962360374655], [95.57796996044539, 17.442866249577833], [95.57458235998797, 17.44186986010601], [95.57308763998265, 17.447051250115123], [95.5726392092322, 17.449093918049925], [95.5721908801051, 17.451136620158934], [95.57470793502324, 17.455247950032913], [95.57517996038695, 17.456019029654556], [95.57738070125839, 17.459005545069886], [95.57876916006876, 17.460889649937428], [95.57936496002492, 17.46169866026503], [95.5820556002858, 17.464289310303457], [95.58365155157793, 17.466394535979077]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
