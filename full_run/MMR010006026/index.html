
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kaing</div><div class="name-mm">တောင်ကိုင်း</div></div>
        <span class="pcode-badge">MMR010006026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13515663067403, 21.81874656740024], [96.13749846168474, 21.820400629285643], [96.14115164003624, 21.8225925361167], [96.14396980596183, 21.824575689616438], [96.14678797188748, 21.82697634977876], [96.14908425493445, 21.827498231758057], [96.1552424696643, 21.825619455373612], [96.15983503575836, 21.82113126459626], [96.16348821410986, 21.819043733981175], [96.16463635608301, 21.8128855201507], [96.16568012094086, 21.809232341799202], [96.16860266308248, 21.80881483603588], [96.17001915016368, 21.803529738906377], [96.17166627288026, 21.79956756788897], [96.16623069219276, 21.79635004272035], [96.16581535289629, 21.798490523618796], [96.16598311782667, 21.79926684808663], [96.16192256727271, 21.798794691421904], [96.15920877666377, 21.798794691421904], [96.1555555992116, 21.798794691421904], [96.14835361962389, 21.80025596204308], [96.145222324151, 21.801090973569615], [96.1417942047388, 21.800668715788674], [96.14143563514648, 21.798204505933256], [96.13336610656063, 21.80222422816564], [96.13248367378259, 21.80467376108527], [96.13273700560836, 21.805831847761624], [96.13403027387807, 21.811743920745414], [96.13399692791597, 21.816682932671256], [96.13515663067403, 21.81874656740024]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
