
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Kar</div><div class="name-mm">ကျောက်ကာ</div></div>
        <span class="pcode-badge">MMR009021024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.43080135409929, 21.362016563713496], [94.43087652483183, 21.36157806507572], [94.42615940173505, 21.354378244760255], [94.42279744544584, 21.345973353587453], [94.42218708726432, 21.344447457684055], [94.4133774840837, 21.338651667040835], [94.41329520331107, 21.338890282360694], [94.40128644901046, 21.329610790605557], [94.39364451478258, 21.32415226641399], [94.38709428557286, 21.32033129885042], [94.37986917542219, 21.320177573236492], [94.37890649883593, 21.331248348132817], [94.36962700798011, 21.343802954043156], [94.36545284157546, 21.345890036795822], [94.36471433629765, 21.352536593289187], [94.35652654866135, 21.368912165863833], [94.3554348436432, 21.384741886828692], [94.36089336873403, 21.386925296865], [94.36089336873403, 21.39074626442863], [94.39036939972806, 21.391292116937677], [94.39582792481895, 21.39456723109288], [94.39964889238252, 21.393475526074724], [94.40510741567476, 21.396750641129245], [94.414932759939, 21.391292116937677], [94.4198296278351, 21.392143746137037], [94.42044919957095, 21.38491541191678], [94.42094573865495, 21.378708670668686], [94.42665594081905, 21.375481164823952], [94.42938690668046, 21.370267502643173], [94.43080135409929, 21.362016563713496]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
