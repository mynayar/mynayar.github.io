
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mee Thway Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mee Thway Chaung</div><div class="name-mm">မီသွေးချောင်း</div></div>
        <span class="pcode-badge">MMR017014064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03263663986911, 16.58199545232833], [95.03330770498667, 16.5815996957694], [95.03725761015068, 16.57936300270046], [95.03895689714312, 16.57860835728991], [95.04037780439222, 16.576827219400684], [95.04064596244126, 16.57604127488497], [95.04161678328796, 16.57375699239134], [95.04247840395522, 16.57183573922805], [95.03805455967023, 16.572049919967867], [95.02947720011275, 16.572544830379684], [95.02419888027418, 16.572214889805366], [95.01776603957114, 16.57386441011448], [95.01067332041748, 16.575678810328895], [95.01116796013332, 16.579307609858347], [95.01050807988406, 16.583101380124617], [95.0062194001053, 16.586070480168587], [95.00920955957355, 16.589273219583447], [95.01178787990682, 16.59107789992521], [95.01578830808398, 16.593211841853076], [95.0170797813069, 16.591878967440437], [95.01922129642577, 16.59021334477012], [95.02267985968786, 16.58873182861106], [95.02503315795394, 16.587393025867527], [95.02604608775681, 16.586671576232334], [95.02887830558939, 16.584371451281527], [95.02959574604688, 16.58378879941364], [95.03263663986911, 16.58199545232833]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
