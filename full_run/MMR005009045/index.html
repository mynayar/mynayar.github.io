
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Gyi</div><div class="name-mm">မြို့ကြီး</div></div>
        <span class="pcode-badge">MMR005009045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3358926401333, 22.732208369820455], [95.3335573202142, 22.72903892960295], [95.3265718802881, 22.723016849747864], [95.32163160031814, 22.719098609713114], [95.3216096397731, 22.719081150274917], [95.32025927984193, 22.719278340123367], [95.31964115961188, 22.719034800115992], [95.318242919775, 22.718374290341274], [95.31822672028699, 22.718354939628796], [95.31818783989695, 22.718375189663334], [95.31548531959186, 22.71978521961222], [95.30790696023809, 22.720951080028385], [95.30754876026714, 22.721006249838638], [95.3048012396855, 22.727111310138923], [95.29747523999038, 22.731690149880535], [95.29516116115872, 22.734158495718077], [95.29533863966657, 22.734132210333314], [95.29411752040733, 22.740542549998736], [95.29808579962003, 22.7442056397785], [95.30510651995002, 22.747868639626063], [95.3066412004311, 22.752472229609737], [95.31060119958573, 22.754584259555998], [95.31487475996227, 22.75702632000872], [95.3191483203388, 22.760078850158834], [95.31939491983974, 22.761188549711846], [95.32342187981595, 22.76160515975039], [95.33080548018881, 22.763377170420142], [95.33105315977554, 22.759163100196986], [95.32922183971618, 22.753363230228956], [95.32800071955762, 22.74237404992249], [95.3331901198282, 22.736574269886717], [95.3358926401333, 22.732208369820455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
