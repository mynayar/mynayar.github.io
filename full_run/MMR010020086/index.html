
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Gyi Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Gyi Kan</div><div class="name-mm">ဝက်ကြီးကန်</div></div>
        <span class="pcode-badge">MMR010020086</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21773649914019, 20.797422558204573], [95.21773649914019, 20.79094386017107], [95.22097584905623, 20.785005052141514], [95.22286619342015, 20.775023284297163], [95.21771056898763, 20.777429242365713], [95.20636819703475, 20.778460367252194], [95.199494032024, 20.77914778294388], [95.19399470019533, 20.77914778294388], [95.18608941029811, 20.77880407464835], [95.17990266097905, 20.777772949761868], [95.1795663046413, 20.77665176316839], [95.17715299461508, 20.78017890783036], [95.1740596208549, 20.784647114772554], [95.1682165807307, 20.783272281590598], [95.16340466459366, 20.783272281590598], [95.15481195900475, 20.78224115670406], [95.15824904106046, 20.78739678113658], [95.15824904106046, 20.795645779329277], [95.17292550111102, 20.796882667301304], [95.18696268078315, 20.797422558204573], [95.20369931856874, 20.797422558204573], [95.215037041926, 20.797422558204573], [95.21773649914019, 20.797422558204573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
