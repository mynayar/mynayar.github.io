
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Pin Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Pin Taw</div><div class="name-mm">ဂွေးပင်တော</div></div>
        <span class="pcode-badge">MMR005002006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45520924021434, 21.935682629649705], [95.45596919971888, 21.933656639642265], [95.45596919971888, 21.92976188989934], [95.45318711998965, 21.919190309784994], [95.45185007991734, 21.912060329920337], [95.45151780020637, 21.9102879604211], [95.44817952036863, 21.903332940063194], [95.44685291962662, 21.90128265037407], [95.44108535960174, 21.903657480208608], [95.43134087967792, 21.904771230308086], [95.43085524037713, 21.909140369732313], [95.42139660007308, 21.91581711017153], [95.41752191960097, 21.91759280986031], [95.41448009677913, 21.920846169415256], [95.41882344904297, 21.920685304982896], [95.42061604879166, 21.924916797772028], [95.42066733173203, 21.933015285427132], [95.41934409355514, 21.93669931502143], [95.42063952019777, 21.936716820325046], [95.42341980038356, 21.936716820325046], [95.43093119981506, 21.93532587039266], [95.44205915990239, 21.934491209601674], [95.44901400039583, 21.934491209601674], [95.45520924021434, 21.935682629649705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
