
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mi Hpa Yar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mi Hpa Yar Kone</div><div class="name-mm">မိဖုရားကုန်း</div></div>
        <span class="pcode-badge">MMR010024052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66817460927086, 20.614904977183016], [95.6632509280879, 20.61203283035087], [95.65463448669226, 20.607109149167968], [95.64273559177423, 20.603826694746203], [95.63493976375912, 20.60464730902612], [95.63001608257622, 20.607109149167968], [95.62427178891198, 20.608750375929162], [95.61770688096783, 20.610801910279974], [95.61032135964308, 20.61203283035087], [95.6107316672327, 20.617777124015106], [95.6107316672327, 20.622290497608446], [95.61688626758723, 20.625572952030154], [95.6213996420799, 20.630086325623495], [95.6213996420799, 20.632404559322993], [95.62509240229258, 20.632958473354904], [95.63124700264711, 20.6341893934258], [95.63617068383007, 20.6341893934258], [95.63986344404276, 20.632958473354904], [95.64396651184512, 20.632958473354904], [95.64847988633773, 20.63131724569439], [95.65340356572204, 20.629265712242898], [95.65627571435277, 20.62639356541075], [95.6599684736662, 20.623521417679342], [95.6636612347782, 20.620238964156897], [95.66612307492005, 20.61695651063451], [95.66817460927086, 20.614904977183016]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
