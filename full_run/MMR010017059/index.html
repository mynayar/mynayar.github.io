
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Taung</div><div class="name-mm">ကိုင်းတောင်</div></div>
        <span class="pcode-badge">MMR010017059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31258823995535, 21.40430218000165], [95.30678620981581, 21.40064437823554], [95.30123644220811, 21.39824788822949], [95.29505601782103, 21.394968478912233], [95.28950625021332, 21.393707168051435], [95.28590422619914, 21.394271596057365], [95.28268147956669, 21.396029454096094], [95.27927696286162, 21.394213551114547], [95.27857295108089, 21.39632558465803], [95.27634902208973, 21.401885406686233], [95.27490346802068, 21.404665318149966], [95.27345791485095, 21.40777881873754], [95.27401389732358, 21.409780355279224], [95.27557064716768, 21.413005051641846], [95.27779457615884, 21.415896159780004], [95.28035209427378, 21.416229748903845], [95.28413277400836, 21.419565641940892], [95.28735747127035, 21.421900767606417], [95.29013738183477, 21.422679143427786], [95.29269489994971, 21.423123929225994], [95.29536361473907, 21.423123929225994], [95.29792113285407, 21.422456750078993], [95.29981147272133, 21.42078880266115], [95.30192420503812, 21.418453677894945], [95.30470411560253, 21.416563338027686], [95.30692804459363, 21.414895392408482], [95.31081992100263, 21.41322744499064], [95.3139334215902, 21.411559497572796], [95.31540954271628, 21.41116054572268], [95.31460633841186, 21.40909516181233], [95.31258823995535, 21.40430218000165]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
