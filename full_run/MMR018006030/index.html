
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Kyar Set</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Kyar Set</div><div class="name-mm">သကြားစက်</div></div>
        <span class="pcode-badge">MMR018006030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2574132862942, 19.7146321336661], [96.26171136848495, 19.708586249655752], [96.2633850535774, 19.706120957016594], [96.26030909159135, 19.70243432658293], [96.25999244839284, 19.702072448384854], [96.25975985403409, 19.70150271258018], [96.25958533609446, 19.70073802354102], [96.25940439699536, 19.699720242795024], [96.25926869289594, 19.69938098164704], [96.2590651367467, 19.698973869348663], [96.25868064149847, 19.698340582951573], [96.25845446829913, 19.698114409752236], [96.25797950305167, 19.697956087703346], [96.25709742640515, 19.69768467950439], [96.256713880841, 19.697448781935805], [96.25317794350735, 19.69821346198171], [96.24752160443853, 19.699401551840197], [96.24506794183213, 19.69994394016078], [96.2448478183722, 19.69996094274336], [96.24451099438693, 19.69986826400924], [96.24453380838861, 19.700119209933632], [96.2446408843694, 19.702403493326585], [96.24456949978264, 19.704152396815687], [96.24435534872043, 19.707079134294645], [96.24404347642536, 19.71079821316704], [96.24392288543288, 19.712546784806307], [96.25378242371994, 19.711386839231295], [96.25672488674417, 19.714555645426742], [96.2574132862942, 19.7146321336661]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
