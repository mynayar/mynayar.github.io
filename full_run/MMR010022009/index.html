
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Bar Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Bar Ni</div><div class="name-mm">ကမ္ဘားနီ</div></div>
        <span class="pcode-badge">MMR010022009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00652658513388, 21.167562880122887], [95.00306274375066, 21.167562880122887], [94.99613506188365, 21.167562880122887], [94.99007333991278, 21.16698557292591], [94.98487757873733, 21.16669692022674], [94.97997047116036, 21.165542305832787], [94.97419740278798, 21.16496499863581], [94.9721768293972, 21.165830960330595], [94.97131086860179, 21.167274227423718], [94.97044490870564, 21.170738067907564], [94.96871298801403, 21.17391325479292], [94.96840829770485, 21.17604608336012], [94.96813568081706, 21.177954403373064], [94.96726972092097, 21.183150163649202], [94.97506336268412, 21.183150163649202], [94.98747546022435, 21.183150163649202], [94.99786698167594, 21.184593430742268], [95.00739918112737, 21.185714867347315], [95.00796985222695, 21.182861510950033], [95.00796985222695, 21.177377096176087], [95.00710389143148, 21.170449414309076], [95.00652658513388, 21.167562880122887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
