
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnget Thaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnget Thaik</div><div class="name-mm">ငှက်သိုက်</div></div>
        <span class="pcode-badge">MMR013006030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96077089496089, 16.917855601754695], [95.95410947537204, 16.913137096399907], [95.94911341135492, 16.908418591045177], [95.94689293665976, 16.90286740700526], [95.94217443130503, 16.90508788080109], [95.93912128062266, 16.911194182165843], [95.93690080682683, 16.913137096399907], [95.93662324816444, 16.916190247082284], [95.93384765704377, 16.91730048442986], [95.93301497925796, 16.920631193774625], [95.93329253792035, 16.9222965493463], [95.9324598610338, 16.92645993557761], [95.93162718324794, 16.929235527597598], [95.93301497925796, 16.931178441831662], [95.93412521570622, 16.932011119617528], [95.93828860283679, 16.931733560055818], [95.94522758198735, 16.929235527597598], [95.94772561534495, 16.92895796893515], [95.95244411980036, 16.932011119617528], [95.95410947537204, 16.932566237841627], [95.95910554028853, 16.932011119617528], [95.95966065941195, 16.933398914728173], [95.96271380919501, 16.935064270299904], [95.96382404564326, 16.93395403385165], [95.96493428299084, 16.928402849811732], [95.96410160520497, 16.92451702224281], [95.96077089496089, 16.917855601754695]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
