
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Kan Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Kan Ywar Ma</div><div class="name-mm">ဥက္ကံရွာမ</div></div>
        <span class="pcode-badge">MMR013005029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84199532882144, 17.489354526390343], [95.83920495734299, 17.48484700288691], [95.83899031255294, 17.481841988417102], [95.84585891975343, 17.476690533241538], [95.84929322290395, 17.47175372195676], [95.84929322290395, 17.468748706587576], [95.84306854827491, 17.469392639159025], [95.84178068493071, 17.463811896202117], [95.83834638088081, 17.4580165102538], [95.83641458586453, 17.454582207103215], [95.83383885827675, 17.453508986750364], [95.83405350216748, 17.447069668230654], [95.83436588617678, 17.44200794920755], [95.83040286440075, 17.443328956166454], [95.82813827975787, 17.443706387240013], [95.82587369691362, 17.445216109735725], [95.82247682084864, 17.447480694378612], [95.81794765336156, 17.474844414837946], [95.8216041529094, 17.476690533241538], [95.8250384569593, 17.477334464913667], [95.82847276010983, 17.481841988417102], [95.82847276010983, 17.48677879880256], [95.82632632030351, 17.489139881600295], [95.82997526734476, 17.492144896969478], [95.83684387364593, 17.491500966196668], [95.84199532882144, 17.489354526390343]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
