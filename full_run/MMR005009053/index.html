
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tu Maung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tu Maung</div><div class="name-mm">တူမောင်း</div></div>
        <span class="pcode-badge">MMR005009053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3784288003489, 22.819023630336346], [95.37684155989012, 22.82021406023074], [95.37165215961954, 22.82418243027496], [95.36371560029477, 22.82998230024299], [95.35969944027698, 22.832252369851062], [95.3614533601845, 22.83703631977039], [95.36091156002055, 22.842094859690064], [95.35820148001437, 22.845888719888535], [95.35639500012923, 22.849321229790974], [95.35784003978608, 22.854921749738992], [95.35834908034582, 22.857719939923356], [95.36061006320392, 22.86282204210363], [95.36960393297517, 22.86412220907272], [95.37393586205047, 22.864600464939542], [95.37398711980978, 22.864606830341017], [95.37403897292035, 22.864655541220316], [95.37543616504706, 22.865968831996042], [95.37617913006284, 22.86643084340875], [95.38651123690414, 22.872855829433036], [95.39304117560982, 22.876187430905247], [95.39614871998748, 22.86875457016731], [95.39686295975787, 22.867206749691775], [95.39686295975787, 22.864858109913882], [95.39837856022245, 22.86115388964032], [95.3984890797073, 22.8608836199831], [95.39866943964296, 22.85727039041626], [95.39758547958627, 22.853657159950046], [95.3991104401947, 22.853561849799576], [95.39586900025421, 22.847687009647814], [95.39342711966589, 22.836697830240723], [95.39434295955999, 22.82784543012258], [95.3937323999304, 22.816856339748313], [95.38783092006099, 22.816856339748313], [95.37958871984358, 22.819603589634028], [95.3784288003489, 22.819023630336346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
