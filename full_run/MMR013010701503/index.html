
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yankin</div><div class="name-mm">ရန်ကင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013010701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16365861944979, 16.829735994220812], [96.16330146808832, 16.829599380906757], [96.16100365799247, 16.828801291046773], [96.16089668273577, 16.829146957166415], [96.1608308145905, 16.82947222396399], [96.16082501306397, 16.829516331213767], [96.16078090671351, 16.829851627250832], [96.16077704502464, 16.830158044258383], [96.16077308620902, 16.830472183744348], [96.16096229457429, 16.83163490282857], [96.16224708493507, 16.831947707720587], [96.1626119605736, 16.831961631923832], [96.1629838940915, 16.832006454134614], [96.16326665892922, 16.832044601577138], [96.16351127632441, 16.83085060137421], [96.16362849216125, 16.830314463341836], [96.16365861944979, 16.829735994220812]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
