
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Meik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Meik</div><div class="name-mm">စမိတ်</div></div>
        <span class="pcode-badge">MMR009023026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.20147007838148, 21.975704959016696], [94.19347301177015, 21.971880274555076], [94.18939197106266, 21.961613907256037], [94.18504060583933, 21.963454853658618], [94.18169334087503, 21.967806307015508], [94.17901550875877, 21.97232513769501], [94.17416210869442, 21.97215768572869], [94.16947611203301, 21.969814478755268], [94.16305351101079, 21.96282318334329], [94.15625493671604, 21.961780681133575], [94.15451475934873, 21.94916194276948], [94.15424693135088, 21.94721981274421], [94.15173658087855, 21.945713475296714], [94.1480546610938, 21.94705233739552], [94.1413602669628, 21.949227973692075], [94.13708335571238, 21.9534232660709], [94.1293277399833, 21.95421423779686], [94.12512640236162, 21.95157081284276], [94.11674753397159, 21.9753958926064], [94.13674019960058, 21.969137319831475], [94.15116968962951, 21.97852517989321], [94.16333913928992, 21.988260739441614], [94.16465104960633, 21.99133337303681], [94.1670479227235, 21.99065599557781], [94.20025313377516, 21.980051190010442], [94.20147007838148, 21.975704959016696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
