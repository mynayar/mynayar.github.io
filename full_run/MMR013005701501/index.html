
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Ku Lar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Inn Ku Lar Ward</div><div class="name-mm">အင်းကုလားရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013005701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95637825504554, 17.31548347934273], [95.9570353716465, 17.314259623129203], [95.95694019320626, 17.314021677028904], [95.95695922889433, 17.31385035583645], [95.95758740659988, 17.312898571434232], [95.95798135513968, 17.31227838220002], [95.95744908059999, 17.312102007204714], [95.95647826050958, 17.31187357894777], [95.95570255622175, 17.311764123741625], [95.95449379003077, 17.31159756147116], [95.95435578129246, 17.3116403917694], [95.95427963854007, 17.311754605897704], [95.95382591859442, 17.31187358901599], [95.95382396214376, 17.312483105825095], [95.95372283505094, 17.313000638594303], [95.95339565916277, 17.313452736185297], [95.95325884015489, 17.313934577039106], [95.95333022398512, 17.314975591229143], [95.95338131269529, 17.316048977805906], [95.95339670049367, 17.316295182580348], [95.95399521363458, 17.316077531337896], [95.95415225806096, 17.31526375567381], [95.95435213278557, 17.314706961798436], [95.95456628427604, 17.31447853354183], [95.95535150640796, 17.31486400622481], [95.95637825504554, 17.31548347934273]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
