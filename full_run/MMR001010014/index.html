
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Lu Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Lu Lar</div><div class="name-mm">မလူလာ</div></div>
        <span class="pcode-badge">MMR001010014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.31937757061843, 24.350525660031224], [97.32358465310932, 24.34676768098376], [97.32964153133167, 24.340710803660727], [97.33906333990126, 24.338018857584245], [97.34209177811312, 24.329943022052873], [97.3474756693667, 24.322876664726323], [97.35031242158107, 24.3211430937788], [97.34465084396135, 24.315223633763765], [97.34464401361038, 24.31518910429378], [97.34439078880393, 24.314924344782753], [97.34338042566617, 24.310552772692347], [97.34331403231681, 24.310265502251184], [97.33939983293601, 24.316146801333844], [97.331323995606, 24.32153069168811], [97.32762257132464, 24.32624159687225], [97.32223868097043, 24.329270035084107], [97.31719128275154, 24.333644447233496], [97.31147089936258, 24.338018857584245], [97.30888640788146, 24.343026308817173], [97.30830345294208, 24.344381524188066], [97.31050803391867, 24.345970245830244], [97.3181015000842, 24.349835183946652], [97.31937757061843, 24.350525660031224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
