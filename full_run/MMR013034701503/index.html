
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pabedan</div><div class="name-mm">ပန်းဘဲတန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013034701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15808561875633, 16.771872862842372], [96.15804311589716, 16.770626994240445], [96.15680758140479, 16.77096621222097], [96.15596199025373, 16.771191597614177], [96.15508460986689, 16.7713985442075], [96.15325742938694, 16.771802496288217], [96.15328820328801, 16.772069197435542], [96.15369134507955, 16.77205433613875], [96.15456180608254, 16.772022247428822], [96.15456539887413, 16.772116518862333], [96.15465787436148, 16.77454278901854], [96.15473364224385, 16.774503115426512], [96.15537482738642, 16.7745063017245], [96.15601601162967, 16.774509489821128], [96.15597376058065, 16.772058481114072], [96.15600792132858, 16.771988641562587], [96.15732473474878, 16.771935583360516], [96.15808561875633, 16.771872862842372]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
