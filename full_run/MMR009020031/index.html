
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Boet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Boet</div><div class="name-mm">တောင်ဘို့</div></div>
        <span class="pcode-badge">MMR009020031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89759552871072, 21.74310005662238], [94.89881976322158, 21.74288401608453], [94.90641269339113, 21.746539870818424], [94.91794269809708, 21.752164264169494], [94.93059758201287, 21.75497646129469], [94.9353783159566, 21.755257680197815], [94.94100270840835, 21.75413280188735], [94.94522100274713, 21.75357036228246], [94.9467942263725, 21.752283179724998], [94.94831441877545, 21.75103938585903], [94.95112661500133, 21.7485084094356], [94.95056417629576, 21.742602796282085], [94.9485956385779, 21.738384501943244], [94.95028295739263, 21.731354011378585], [94.95152619817554, 21.728867527114744], [94.94614095074434, 21.72630312289084], [94.9345056120444, 21.722424676957303], [94.91996143777021, 21.722747879810868], [94.91036297986767, 21.72498751995812], [94.91058852534024, 21.725979919138013], [94.90606367100168, 21.733090404398695], [94.89992279789885, 21.73987768500723], [94.89759552871072, 21.74310005662238]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
