
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Cheik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Cheik</div><div class="name-mm">လက်ချိတ်</div></div>
        <span class="pcode-badge">MMR005029041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.55396919831992, 22.94305282542763], [94.56009674886593, 22.947137646884926], [94.56438131964222, 22.94999388021347], [94.57719151557603, 22.95556363885089], [94.57924035375936, 22.956454443417897], [94.59668377413692, 22.960976805735072], [94.61154298362186, 22.95645443802192], [94.62381798221418, 22.946117597149453], [94.63221666626617, 22.935780756276927], [94.638054212432, 22.929359453875747], [94.6380311996802, 22.929320249729813], [94.63693477501994, 22.928703525247556], [94.6276941600575, 22.92350579995275], [94.61348100014811, 22.92350579995275], [94.6005602397633, 22.924151819850636], [94.5932531483142, 22.925775573683836], [94.58893116034483, 22.926735990273755], [94.57988652024676, 22.922213670224778], [94.57988652024676, 22.918784580444083], [94.57213391994452, 22.916399221347035], [94.56211475559155, 22.909834985196483], [94.55821008362852, 22.907276833958747], [94.55775029264197, 22.90842631142516], [94.55533640974755, 22.914461021359102], [94.55275219885493, 22.92350575678529], [94.55339825202776, 22.934488649931325], [94.5537992633254, 22.9405038077046], [94.55396919831992, 22.94305282542763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
