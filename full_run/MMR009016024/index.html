
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Bo Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Bo Gyi</div><div class="name-mm">သံဘိုကြီး</div></div>
        <span class="pcode-badge">MMR009016024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36746879225103, 19.206480092382435], [95.3588613791494, 19.20228135380148], [95.33165168827486, 19.195363636422712], [95.32929272877647, 19.196156099224652], [95.3207367173257, 19.19318009508538], [95.31627271111677, 19.19020409094611], [95.30585669662929, 19.187600086874568], [95.29730068517853, 19.181648078596027], [95.29271920502737, 19.179357338970078], [95.29358068000442, 19.183880081700465], [95.29005136078172, 19.187540117382582], [95.29395268097153, 19.193924096120213], [95.2960066201095, 19.201206243973047], [95.29804468621336, 19.2084321149502], [95.3006486902849, 19.214756124195844], [95.31664471208387, 19.215872126197723], [95.31679163162858, 19.21741478186675], [95.31962071622314, 19.21624412626545], [95.32445672339912, 19.21550012523062], [95.34268474740321, 19.212896122058453], [95.36723678065295, 19.206944112880535], [95.36746879225103, 19.206480092382435]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
