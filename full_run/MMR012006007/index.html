
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daing Bon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myebon</div><div class="name-mm">မြေပုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daing Bon</div><div class="name-mm">ဒိုင်းဘုံ</div></div>
        <span class="pcode-badge">MMR012006007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.44485220006902, 20.051824018064053], [93.44405817694337, 20.053619373335437], [93.44247272433682, 20.05815393855346], [93.44188978378656, 20.064007408115458], [93.43950764696041, 20.069487808315728], [93.43634810468137, 20.0828986155787], [93.43583262767368, 20.084417414032487], [93.43736987661856, 20.084930495246226], [93.43889273191411, 20.08531120974459], [93.44013005156069, 20.086072636942674], [93.44140987496581, 20.08704353782906], [93.44203029206437, 20.087514198921212], [93.443096834951, 20.08491038010999], [93.44469583224691, 20.082397669816658], [93.44646615129193, 20.079827851674054], [93.44892175643395, 20.077600676130373], [93.45172000057761, 20.07491664408792], [93.45331899967215, 20.072461039845166], [93.45406139092051, 20.069948329551835], [93.45400428397056, 20.06720719055943], [93.45400428397056, 20.06635591479369], [93.45341037079203, 20.06461985991865], [93.45258802891448, 20.063203604862508], [93.45231391465552, 20.061193435728512], [93.45231391465552, 20.059457380853473], [93.45254234335454, 20.05721878391978], [93.45354742657253, 20.055299986804982], [93.45468956916835, 20.053426875250125], [93.45513121633263, 20.052959247571266], [93.45144719303357, 20.05275117682538], [93.44485220006902, 20.051824018064053]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
