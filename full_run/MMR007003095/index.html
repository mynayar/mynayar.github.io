
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Tha Pyay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Tha Pyay</div><div class="name-mm">အောင်သပြေ</div></div>
        <span class="pcode-badge">MMR007003095</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.81797094740136, 17.068043214422858], [96.8179881478348, 17.067958936255934], [96.81774000239926, 17.06653561612586], [96.81771598600403, 17.066397859773474], [96.8177195913861, 17.06632285541548], [96.81749807037971, 17.066161749964863], [96.81550247475946, 17.064964394391325], [96.8131077618138, 17.062436641138106], [96.8121764850568, 17.059775847577328], [96.81230952356572, 17.057780253755766], [96.81510335743405, 17.056582897282908], [96.81550247475946, 17.054720341970267], [96.81350688093784, 17.05352298639673], [96.8131077618138, 17.051926509900568], [96.81255919694945, 17.04973225134239], [96.810967919434, 17.051677146782936], [96.80016027897375, 17.042542589768743], [96.79212834564669, 17.050743616324894], [96.79284511071336, 17.05646430188608], [96.79626450670168, 17.06090951766015], [96.80002584921363, 17.065696672763295], [96.8024194326108, 17.071167708323117], [96.80384650471251, 17.073879150802213], [96.81028403987659, 17.07048382786644], [96.81780671320928, 17.0680902507645], [96.81797094740136, 17.068043214422858]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
