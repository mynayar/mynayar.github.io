
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Kyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Kyaung</div><div class="name-mm">ကုလားကျောင်း</div></div>
        <span class="pcode-badge">MMR010013033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2473276242705, 21.588805158331468], [96.24312325413496, 21.584264439052674], [96.2313510179352, 21.575351174617083], [96.22193323023447, 21.571314980402065], [96.22103267072123, 21.571266950309564], [96.20932011982774, 21.57064228121635], [96.20074320633398, 21.56475616266681], [96.19317534026982, 21.563410765194703], [96.18796192180531, 21.56492433768807], [96.189475495198, 21.571146805380806], [96.19155281041395, 21.57765572603097], [96.19199811691959, 21.579051019688848], [96.19166176687708, 21.587123409917467], [96.1908208926701, 21.592336829281294], [96.19031636940497, 21.606295337160134], [96.20747019819117, 21.605454462953162], [96.22613760037001, 21.605286287931904], [96.23790983477113, 21.60360454041728], [96.24362777829941, 21.602427317067054], [96.24497317577152, 21.597213897703284], [96.2473276242705, 21.588805158331468]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
