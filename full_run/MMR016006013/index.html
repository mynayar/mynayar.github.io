
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Oht</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsat</div><div class="name-mm">မိုင်းဆတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Oht</div><div class="name-mm">မအို့</div></div>
        <span class="pcode-badge">MMR016006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.41885417987658, 20.559092773113036], [99.43956093598848, 20.555175277716955], [99.49176483427976, 20.5574783911149], [99.51249285306278, 20.5574783911149], [99.51786678342535, 20.5367503732312], [99.48715860838314, 20.529841033037314], [99.45798584137356, 20.516790058914125], [99.45093912344186, 20.51200835729992], [99.43649011902386, 20.502203675858993], [99.41269128327616, 20.47226320528273], [99.40501423861627, 20.475334022247353], [99.36893213321144, 20.479172543677976], [99.36214697410361, 20.47901475043045], [99.37277065464207, 20.496829744597107], [99.40271112611765, 20.541356599127823], [99.41885417987658, 20.559092773113036]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
