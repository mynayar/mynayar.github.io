
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit No (4) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanmyathazi</div><div class="name-mm">ချမ်းမြသာစည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thit No (4) Ward</div><div class="name-mm">မြို့သစ်အမှတ် (၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010004701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10562877592793, 21.92583835993713], [96.10573956334542, 21.92998580356499], [96.10582717236395, 21.93309906123335], [96.10706278743396, 21.933075860130828], [96.11485890222127, 21.932864163042325], [96.11472939434879, 21.93116753610525], [96.1143537291378, 21.925808933447627], [96.11410097948033, 21.925396108505595], [96.11360216552202, 21.9250004550413], [96.11289913840199, 21.924450754472332], [96.11210893449078, 21.924035647756398], [96.11136218790318, 21.923750265342505], [96.11069499880631, 21.923615974493146], [96.1103137999333, 21.92378248881846], [96.10562877592793, 21.92583835993713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
