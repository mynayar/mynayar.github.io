
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyan Taw Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyan Taw Inn</div><div class="name-mm">ညံတောအင်း</div></div>
        <span class="pcode-badge">MMR009017003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15784304841799, 19.754053056703242], [95.1570139832088, 19.754106891919548], [95.15624856032287, 19.754156594751123], [95.15806025267858, 19.762082751617754], [95.15807690992153, 19.76216603603376], [95.15833231558395, 19.763443067043966], [95.16077779256113, 19.7756704501312], [95.16344089737959, 19.781965086619493], [95.16493801767541, 19.781965110901183], [95.16928954207879, 19.781398893244386], [95.17279508772316, 19.780942754404634], [95.18639708905448, 19.77917349655968], [95.20576646425098, 19.784596984962945], [95.20686647181026, 19.780295817198237], [95.2071052211291, 19.780335255167927], [95.20833473555967, 19.774085218757875], [95.21105227634155, 19.771141216993612], [95.21444920007059, 19.76729137040047], [95.22124304932731, 19.760723982126137], [95.22380724310983, 19.756779069098798], [95.2142227390882, 19.75506244137864], [95.19816901858542, 19.754255271063982], [95.18638039224135, 19.753662546789144], [95.17368610632883, 19.753024287141216], [95.16810449282815, 19.75338672921424], [95.16033474515245, 19.753891257875296], [95.15784304841799, 19.754053056703242]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
