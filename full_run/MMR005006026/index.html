
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Gyi</div><div class="name-mm">သရက်ကြီး</div></div>
        <span class="pcode-badge">MMR005006026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73446951975257, 22.334930640037044], [95.73629723982583, 22.335296129912535], [95.73966503990971, 22.32729792026288], [95.74008588035917, 22.320562589891665], [95.74682111989881, 22.315090139698214], [95.7518726397106, 22.31088056968258], [95.75603819960327, 22.31088056968258], [95.75524043979453, 22.30330338034679], [95.75524043979453, 22.299093810331158], [95.75663580000224, 22.29246728983361], [95.75481960024439, 22.28520213017424], [95.75481960024439, 22.283939249996422], [95.75145180016051, 22.284360270310287], [95.74345368044305, 22.284360270310287], [95.73419267964852, 22.28604407997034], [95.7257733597528, 22.286886029766492], [95.71945895976324, 22.289411700189873], [95.71858595997412, 22.289349330407333], [95.71738895963284, 22.28926391999397], [95.71671323962437, 22.289215590427204], [95.71735439958593, 22.295305169797814], [95.71777524003534, 22.301619479855162], [95.71777524003534, 22.308775829640865], [95.71735439958593, 22.31677404018984], [95.71783716015688, 22.320396000375183], [95.71819607958548, 22.32308835024719], [95.72366843984668, 22.329402750236795], [95.72998283983623, 22.334033249734716], [95.73446951975257, 22.334930640037044]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
