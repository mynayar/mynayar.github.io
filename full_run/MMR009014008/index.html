
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htauk Yit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htauk Yit</div><div class="name-mm">ထောက်ရစ်</div></div>
        <span class="pcode-badge">MMR009014008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83555396274522, 19.2873330392884], [94.84383830969028, 19.28465280868022], [94.84975656911041, 19.279918201863552], [94.85814429941996, 19.271730178604912], [94.85081763782381, 19.26012963287633], [94.85003236600096, 19.258637616233045], [94.8496271962382, 19.257867792964305], [94.8482770035809, 19.258020645336558], [94.84087918132923, 19.258612471188655], [94.82845083843551, 19.265418467588233], [94.82016527560705, 19.277254984629906], [94.81128788782581, 19.276663159677128], [94.80765752617395, 19.276089945294814], [94.80714510686124, 19.277846811381266], [94.80359415084945, 19.28494872160627], [94.80625736808315, 19.292346544757265], [94.80675646483905, 19.293677471238368], [94.81278639757426, 19.287385206262286], [94.82297626224477, 19.284352508861218], [94.83280220275952, 19.283382045045414], [94.83555396274522, 19.2873330392884]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
