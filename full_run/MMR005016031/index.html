
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Te</div><div class="name-mm">ဆင်တဲ</div></div>
        <span class="pcode-badge">MMR005016031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76688455967474, 22.071134159913584], [94.76613377055713, 22.071255271613552], [94.76348099265374, 22.071122573048342], [94.76167103958687, 22.071032010419003], [94.75676171967768, 22.068354059592252], [94.75316718791544, 22.06406205591918], [94.74964580071321, 22.065221672342375], [94.74962111971894, 22.06522980041501], [94.74515819989108, 22.06746126032897], [94.73969124005873, 22.065389549688007], [94.73804208037774, 22.070886750123464], [94.73086260002901, 22.078066410336646], [94.72573403979413, 22.08678461991434], [94.71855456034473, 22.090374450020875], [94.71599028022729, 22.08973337999157], [94.71599028022729, 22.092938550273914], [94.72214448038352, 22.099092569666425], [94.72470839987284, 22.105759410368535], [94.72932395983293, 22.109862059986142], [94.72829831991157, 22.11909308997417], [94.7267938800336, 22.124734289855667], [94.73393951979307, 22.124734289855667], [94.74676020002329, 22.11550325986758], [94.75650432021826, 22.102169580261943], [94.7631711600211, 22.098066929745073], [94.76348940041555, 22.096528470312705], [94.7662480797851, 22.08319478980775], [94.7662480797851, 22.074476580230055], [94.76688455967474, 22.071134159913584]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
