
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thar</div><div class="name-mm">ရွာသာ</div></div>
        <span class="pcode-badge">MMR009025039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.16506724595672, 21.45550008136371], [94.16421437389431, 21.454581603758072], [94.15555493321364, 21.45733688099233], [94.13963835482627, 21.460248449606297], [94.15001036188875, 21.46775160405332], [94.15349717915154, 21.472865603364937], [94.15307303279428, 21.47312206303286], [94.15721645137819, 21.480536600983385], [94.16000590464881, 21.486347963387857], [94.16233044979049, 21.49355405197798], [94.16186554076216, 21.49843559632575], [94.16279535881881, 21.505641685815192], [94.16442253996831, 21.508896048114195], [94.16628217608161, 21.51215041131246], [94.1741856286639, 21.519356499902585], [94.17950873024375, 21.523860662639493], [94.18113964717702, 21.523069915744088], [94.18350131273547, 21.51992102773329], [94.18330450689751, 21.512442419382182], [94.18212367366868, 21.503389367025704], [94.17759714838974, 21.491384231597067], [94.17648741106524, 21.49024278777449], [94.17070895575375, 21.4842992340225], [94.1646079846708, 21.477804652163], [94.16618242867622, 21.472490904431766], [94.16834729019536, 21.465405905957823], [94.17110256742961, 21.461076184718195], [94.16677284618999, 21.45733688099233], [94.16506724595672, 21.45550008136371]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
