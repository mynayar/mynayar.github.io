
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Kei Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Kei Kyin</div><div class="name-mm">သက္ကယ်ကျင်း</div></div>
        <span class="pcode-badge">MMR010020033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37134815998962, 20.872980136823912], [95.37719120011383, 20.872980136823912], [95.38612761489759, 20.870917887050894], [95.39712627855499, 20.870917887050894], [95.40400044356568, 20.868855638177195], [95.41156202516737, 20.867824513290714], [95.4211858574414, 20.867480804995182], [95.42049843995107, 20.864043722040208], [95.42049843995107, 20.858200681916003], [95.42531035608812, 20.852701350087273], [95.430465978722, 20.847889433950286], [95.4342467699725, 20.844108642699723], [95.43580624026583, 20.841249616076993], [95.430465978722, 20.83757818598457], [95.42531035608812, 20.83654706199735], [95.42049843995107, 20.835859645406344], [95.41534281641788, 20.83654706199735], [95.41156202516737, 20.83654706199735], [95.40056336061065, 20.83654706199735], [95.3919706550218, 20.83551593711087], [95.38200311535155, 20.83345368733785], [95.37959715818238, 20.829672896986665], [95.3760176370044, 20.82721197595197], [95.37512895034087, 20.832766270746845], [95.37134815998962, 20.84170268642987], [95.36653624385264, 20.847545725654754], [95.37203557568131, 20.85476359896097], [95.37134815998962, 20.86301259715367], [95.37134815998962, 20.8685119289824], [95.37134815998962, 20.872980136823912]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
