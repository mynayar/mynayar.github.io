
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yon Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yon Kan</div><div class="name-mm">ဖရုံကန်</div></div>
        <span class="pcode-badge">MMR013025028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6139815597013, 16.788973590259047], [96.61574483975261, 16.779078179814178], [96.61584275973564, 16.77791033999023], [96.61621608000814, 16.773451110080714], [96.61629167971728, 16.772550930081422], [96.61642344028962, 16.771767750081665], [96.6172229996418, 16.76701520988405], [96.61640759963109, 16.76579651969365], [96.61396392039865, 16.76548709984985], [96.60997800008471, 16.767435960401315], [96.60808727980418, 16.770581189970017], [96.60483792043374, 16.772810669576813], [96.59534399972586, 16.773563879669382], [96.59315268015212, 16.773719580194495], [96.59027772024064, 16.773182550034733], [96.58533276019881, 16.769510819568723], [96.57582767980364, 16.769676060102142], [96.57665999965934, 16.775063820239154], [96.57755460026465, 16.782406739779276], [96.5764742401941, 16.793383409616695], [96.58154267985083, 16.79292630040851], [96.5830593604012, 16.79278923023884], [96.59180088040637, 16.791999209995595], [96.59681603972854, 16.790987790154418], [96.60234780021085, 16.78994729972817], [96.60463056015232, 16.78952249956376], [96.60691332009372, 16.78909770029867], [96.6139815597013, 16.788973590259047]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
