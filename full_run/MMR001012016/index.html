
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Choe Hai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Choe Hai</div><div class="name-mm">ပန်ချိုးဟိုင်</div></div>
        <span class="pcode-badge">MMR001012016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.4170201280765, 24.459078973316025], [97.4170201280765, 24.45456515815556], [97.4166439758389, 24.448922889879498], [97.41137785890112, 24.43613374707479], [97.40836864909392, 24.42861072210718], [97.39670796030418, 24.435381445297537], [97.38843263265994, 24.442152166689198], [97.38203806170725, 24.439895259558625], [97.36812046578694, 24.43199608415199], [97.36586355775705, 24.435757595736504], [97.35796438235042, 24.441399864911887], [97.35345056719001, 24.44628983141064], [97.35307441585167, 24.45456515815556], [97.35307441585167, 24.457198216624477], [97.35834053278944, 24.462840485799802], [97.36623970999466, 24.46773045229861], [97.37526733941627, 24.469987359429126], [97.38241421304554, 24.47186811612073], [97.39106569202812, 24.471491963883068], [97.39294644782035, 24.467354300960267], [97.39858871699573, 24.461712031784884], [97.40272637991853, 24.45870282197768], [97.40987325444718, 24.45870282197768], [97.4170201280765, 24.459078973316025]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
