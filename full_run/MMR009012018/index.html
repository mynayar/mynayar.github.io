
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kone</div><div class="name-mm">အုပ်ရှစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009012018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15131757394693, 19.441144796595154], [95.16749795586605, 19.422299409590153], [95.16861507482588, 19.42254765934706], [95.16902778900135, 19.419813430745307], [95.17089676907068, 19.41632803620996], [95.14185120486928, 19.408609635326457], [95.14172314860446, 19.40841198412579], [95.14076158987552, 19.40819830430837], [95.13445803570983, 19.406595706127007], [95.12847500172, 19.40542046668122], [95.12217144665499, 19.412578740116828], [95.12035516865615, 19.419309653917423], [95.12013285264908, 19.4206991289617], [95.12606606689553, 19.423509599388524], [95.12859482559077, 19.430463686250164], [95.12985920583776, 19.43520510812931], [95.13554891335173, 19.437101676701047], [95.1380639178156, 19.437820250304355], [95.14218690470193, 19.43899824617216], [95.14787661221595, 19.440894815643276], [95.15018805603404, 19.441961636420444], [95.15072146642262, 19.440894815643276], [95.15131757394693, 19.441144796595154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
