
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pone Hon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pone Hon</div><div class="name-mm">ပုန်းဟုန်</div></div>
        <span class="pcode-badge">MMR005021032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18633791975924, 24.449454179666702], [96.18594192038336, 24.43716899984952], [96.18752699977131, 24.42765789039936], [96.19109352034974, 24.41378754036276], [96.1938676797497, 24.398728290178497], [96.19307495974164, 24.384461670070095], [96.1851081238409, 24.381123365950657], [96.1758418503212, 24.382281649578488], [96.17062957039843, 24.385756503160167], [96.16387932027448, 24.393920939899488], [96.15948480018346, 24.40008549035315], [96.14788811974097, 24.399719280120735], [96.1369019998275, 24.395324670097523], [96.13031004027619, 24.407897939638246], [96.12988272021141, 24.4171142998851], [96.12894420031466, 24.423883380014047], [96.1320455996248, 24.426072720179945], [96.13600848020724, 24.430828229938925], [96.1391789996112, 24.437961629925326], [96.14789747988488, 24.44113197036421], [96.1578046804417, 24.448661549590895], [96.1649380804281, 24.455794859645096], [96.18633791975924, 24.449454179666702]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
