
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wa Hpawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wa Hpawng</div><div class="name-mm">ဝါ့ဖေါင်</div></div>
        <span class="pcode-badge">MMR001015018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.75910280275218, 26.601185731836097], [97.7490710730716, 26.602857686633], [97.7408677829219, 26.598756040658827], [97.735490397364, 26.597016504508133], [97.7342591265575, 26.600270577225388], [97.73285196004997, 26.602469274837233], [97.73074121073836, 26.60414028534592], [97.72863046052737, 26.607218462362198], [97.72687150261783, 26.609944847077088], [97.72660765861662, 26.61108817048273], [97.7263438146154, 26.612495336990264], [97.7263438146154, 26.61381455519762], [97.72687150261783, 26.615221721705154], [97.72854654029067, 26.616634175326965], [97.72952793896326, 26.615886443004968], [97.73821377744395, 26.62891519937699], [97.75775691065297, 26.645201143717884], [97.75992836959864, 26.653886981299195], [97.79141453015649, 26.651715522353527], [97.79379247794054, 26.652394934978304], [97.79901463781533, 26.638686765981504], [97.8041150429749, 26.62848595656169], [97.79467171902468, 26.623486549764493], [97.78598588234263, 26.608286335346122], [97.77512858491633, 26.59851476784229], [97.75910280275218, 26.601185731836097]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
