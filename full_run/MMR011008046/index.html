
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Ka</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paung</div><div class="name-mm">ပေါင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Ka</div><div class="name-mm">ကျုံက</div></div>
        <span class="pcode-badge">MMR011008046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.49749097283018, 16.65873599287181], [97.49411299961531, 16.657839000069828], [97.48927699963389, 16.65636000021391], [97.4858180002006, 16.65392700043077], [97.48237499970651, 16.6518010004159], [97.48070199989746, 16.650129999799674], [97.47995200038457, 16.647925999785116], [97.47771899993194, 16.644680000281824], [97.47462800038198, 16.643195000149205], [97.47450691206438, 16.640892044132556], [97.47358294769492, 16.64142502284659], [97.47000095697865, 16.64570901535882], [97.47012196075997, 16.648013017286985], [97.47071197357877, 16.650203011260032], [97.47255095496268, 16.65724567594725], [97.47277292473075, 16.664348695036324], [97.47565852631999, 16.670119898214807], [97.48076382109355, 16.674115345946518], [97.48720093087832, 16.674781254351444], [97.49319410292554, 16.673005498904672], [97.49807742883036, 16.66723429572619], [97.49749097283018, 16.65873599287181]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
