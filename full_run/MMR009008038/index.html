
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Zaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Zaung</div><div class="name-mm">ကုန်းဇောင်း</div></div>
        <span class="pcode-badge">MMR009008038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78547826690857, 20.427381826310295], [94.78394483828373, 20.425708993775118], [94.78155607705139, 20.42292210627022], [94.77638042831416, 20.42132959758294], [94.77126113829098, 20.420148223861474], [94.77120477867766, 20.42013521786606], [94.76304317929936, 20.42292210627022], [94.75189562658198, 20.42531086660324], [94.74174339224379, 20.425708993775118], [94.73338272882995, 20.425708993775118], [94.7331040397197, 20.425987681985987], [94.73238741135003, 20.426704311255037], [94.73213209112316, 20.428491553742276], [94.73895650383963, 20.430287452204198], [94.74671997784475, 20.432875276572815], [94.75567783156674, 20.432875276572815], [94.76364036870808, 20.435662164976975], [94.7658300668042, 20.440439687441653], [94.76841789117282, 20.44223125836595], [94.77001039806146, 20.44780503427495], [94.77069273078496, 20.448669323230718], [94.77098523887776, 20.448376815137976], [94.77473722394382, 20.444437230593792], [94.7829915901898, 20.436182865247076], [94.78543037980825, 20.428116097579903], [94.78547826690857, 20.427381826310295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
