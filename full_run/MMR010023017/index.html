
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Myaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Myaw</div><div class="name-mm">ကုလားမျော</div></div>
        <span class="pcode-badge">MMR010023017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99516394855743, 20.430366195043916], [95.96160341896268, 20.41944891463578], [95.96128918774588, 20.42318293304595], [95.9592492447569, 20.426412842778518], [95.96185405372165, 20.428831593703137], [95.96270135268531, 20.437022152150632], [95.96270135268531, 20.444082977747257], [95.96241891969743, 20.451143804243202], [95.9611925717798, 20.455589315894258], [95.96200776314782, 20.45543550574405], [95.97454241939721, 20.456648537400156], [95.99395091690133, 20.45826591234203], [96.01335941620414, 20.460691974754866], [96.0135874716845, 20.455978945372067], [96.01725180162941, 20.451648373373757], [96.02224861568112, 20.448483723844845], [96.02751144739545, 20.44734863193389], [96.02670275902517, 20.438857413039216], [96.01740285265959, 20.43683569481152], [96.00567688478048, 20.432792256557434], [95.99516394855743, 20.430366195043916]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
