
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Cho</div><div class="name-mm">ဂွေးချို</div></div>
        <span class="pcode-badge">MMR009003045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.94377720595332, 20.835854635283226], [94.95657976574364, 20.83408876518439], [94.97226194663159, 20.833598696722504], [94.98549378790807, 20.83751924171969], [94.99970576430962, 20.84732060466223], [95.00010672884252, 20.847409707691895], [95.00460644623058, 20.842909992102477], [95.00901705879028, 20.83604903723335], [95.00999719571405, 20.826247674290812], [95.0124475362249, 20.818406584296497], [95.0194816627486, 20.816208419083353], [95.01967584616341, 20.813425138759214], [95.02229555419655, 20.800125081207568], [95.02189252212224, 20.7930720203575], [95.00960004430664, 20.789847763763362], [94.9983633346003, 20.789453493783753], [94.99791211505215, 20.791258375573648], [94.9967030188293, 20.79669930902594], [94.99126208627632, 20.799722049133322], [94.98118628441955, 20.801535693017854], [94.97332715942093, 20.802543272753894], [94.95801194059862, 20.806170562321654], [94.94692855990519, 20.81020088216502], [94.94549863785193, 20.81125450898844], [94.94309975474994, 20.81302210668491], [94.94199725067261, 20.81761587337388], [94.94189065942646, 20.818060007163638], [94.94471188394635, 20.82551610008801], [94.9441073353853, 20.830352484979244], [94.94377720595332, 20.835854635283226]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
