
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kone</div><div class="name-mm">သရက်ကုန်း</div></div>
        <span class="pcode-badge">MMR008010003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64974219094944, 18.13733366661546], [95.65071372315987, 18.139519615437962], [95.65192813887256, 18.13976249804091], [95.65897175144522, 18.139519615437962], [95.66504383000881, 18.139519615437962], [95.66480094560723, 18.13660501700798], [95.66480094560723, 18.135870197151917], [95.66480094560723, 18.13053293844439], [95.66601536221924, 18.125432392091284], [95.67087302507014, 18.11887454742248], [95.67153923924457, 18.117908537049402], [95.6757306888203, 18.11183093484982], [95.6745162731076, 18.1103736356348], [95.67257320778737, 18.111345168744606], [95.6696586102567, 18.112316700955034], [95.66552959611403, 18.112316700955034], [95.6611576993684, 18.11255958355798], [95.65994328275633, 18.114016882772944], [95.65945751665112, 18.118388780417945], [95.65435697119733, 18.120088962235855], [95.65217102237483, 18.12106049534566], [95.6490135413419, 18.125918158196498], [95.64779912472989, 18.12883275572716], [95.64804200913147, 18.13271888726689], [95.64828489173442, 18.135147717793018], [95.64974219094944, 18.13733366661546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
