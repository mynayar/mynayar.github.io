
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar Yar</div><div class="name-mm">ကန်သာယာ</div></div>
        <span class="pcode-badge">MMR010018044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41480143443869, 21.23162470561573], [95.41399785781493, 21.22515792090138], [95.41435676825029, 21.2201331784035], [95.41471567778638, 21.21457006935327], [95.4139035872808, 21.210599844906994], [95.40735801925723, 21.216902986283856], [95.40430728235526, 21.221209908810295], [95.39982090371177, 21.225875741772143], [95.39479616031463, 21.225516831336734], [95.39263736831992, 21.223837770996397], [95.39120705775957, 21.22731138261429], [95.38707958955149, 21.2301826651979], [95.38079866142914, 21.234130677288988], [95.37433827629047, 21.23502795337737], [95.37774792362785, 21.242744523241186], [95.37936301968767, 21.246692536231592], [95.3860028591447, 21.251178913975764], [95.39102760344122, 21.253332374789295], [95.4012162711141, 21.255341408079573], [95.4047995802365, 21.248686692936587], [95.40702010529367, 21.245972717067275], [95.41009467872652, 21.24221490439436], [95.40980050688796, 21.236919805005073], [95.41480143443869, 21.23162470561573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
