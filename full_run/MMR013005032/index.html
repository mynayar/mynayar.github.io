
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Gyi</div><div class="name-mm">အိုင်ကြီး</div></div>
        <span class="pcode-badge">MMR013005032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88994850501956, 17.460686865406558], [95.89094228465876, 17.457953969600055], [95.89139279913843, 17.456715053656865], [95.88940689371321, 17.454909686233066], [95.88778206339157, 17.454368075826096], [95.88710510411732, 17.449121650443885], [95.85744969344864, 17.470036570831155], [95.85401539029806, 17.470036570831155], [95.85101037402961, 17.468104774915503], [95.84929322290395, 17.468748706587576], [95.84929322290395, 17.47175372195676], [95.84585891975343, 17.476690533241538], [95.83899031255294, 17.481841988417102], [95.83920495734299, 17.48484700288691], [95.84199532882144, 17.489354526390343], [95.84469323110778, 17.488788729616203], [95.84698073587231, 17.48830900155923], [95.85587148757912, 17.483261832667495], [95.86649431016434, 17.477231390016698], [95.87657900901411, 17.470579779333377], [95.88194321141015, 17.467790394411224], [95.88387432384104, 17.466502986123942], [95.88994850501956, 17.460686865406558]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
