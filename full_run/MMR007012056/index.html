
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hlay Done</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hlay Done</div><div class="name-mm">လှေဒုံး</div></div>
        <span class="pcode-badge">MMR007012056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58989523857446, 18.27606409987834], [96.58915597426886, 18.275712168182054], [96.58800313513666, 18.27516335060818], [96.58374933376479, 18.276971687593345], [96.58233032228662, 18.27697181080049], [96.57901933597361, 18.277425605107624], [96.57523526399632, 18.276975446759536], [96.57025834924349, 18.279571525105837], [96.57160166838236, 18.28177079558577], [96.57354745505108, 18.287697967287386], [96.57333499831157, 18.289570782965313], [96.57246833334699, 18.29238744522445], [96.57073500341772, 18.29368744222171], [96.56921833905517, 18.295420773050296], [96.57008944397273, 18.299045138022734], [96.57311833184559, 18.29823743441011], [96.5755238771253, 18.298880027891016], [96.57810165696594, 18.298020767944138], [96.58113498479179, 18.296720770047557], [96.58308498208629, 18.295854105082924], [96.58535715161133, 18.294588020620722], [96.58590164344616, 18.293037443723108], [96.58806830630738, 18.29065411439592], [96.58868100992072, 18.286160953065576], [96.58871830480598, 18.279820800089908], [96.58989523857446, 18.27606409987834]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
