
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung U</div><div class="name-mm">ချောင်းဦး</div></div>
        <span class="pcode-badge">MMR005011048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2725218402108, 22.99987790983772], [95.28009047969192, 22.99749758964208], [95.2879028399442, 22.99487300998146], [95.29272468009998, 22.99688720987689], [95.29907220032186, 22.995727560178807], [95.30450424037844, 22.995727560178807], [95.30889875957018, 22.99371336028338], [95.31030275956476, 22.98907466976027], [95.31390384019011, 22.981323240375275], [95.31732168035131, 22.981323240375275], [95.31689436028654, 22.979492190112524], [95.31689436028654, 22.976318339619752], [95.31567395958564, 22.972900410425666], [95.31347652012533, 22.9707031499305], [95.31249984019553, 22.964721660076577], [95.31127944039395, 22.961730960115744], [95.31127944039395, 22.959899909852993], [95.31011951999989, 22.958313030022396], [95.31011951999989, 22.956115679594973], [95.30847180013353, 22.95312497963414], [95.30670167983874, 22.95227052026837], [95.30487072040751, 22.951477079903384], [95.29949952038663, 22.95050048990572], [95.29548264001187, 22.948735500243174], [95.29132068010534, 22.95489500999679], [95.28710939957921, 22.961120580350553], [95.28692616001433, 22.96710207020442], [95.28430176021811, 22.974914520388836], [95.27850324013247, 22.982482890073356], [95.27551272003603, 22.988281230294604], [95.27349852014066, 22.994079569616474], [95.2725218402108, 22.99987790983772]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
