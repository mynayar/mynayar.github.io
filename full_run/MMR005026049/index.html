
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Ket</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Ket</div><div class="name-mm">ကကက်</div></div>
        <span class="pcode-badge">MMR005026049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26866839992675, 24.1982921697479], [95.2639160395936, 24.191894520415815], [95.25372300031626, 24.18328853993421], [95.24371319970447, 24.172729470288857], [95.2360840799164, 24.162109379844082], [95.23468007992182, 24.160278329581274], [95.22747791957039, 24.17572026018189], [95.21728524002185, 24.190673849918312], [95.20227035968941, 24.20312498972652], [95.19152832027584, 24.212097180440594], [95.17590324004254, 24.21807858036226], [95.16729744032466, 24.22247319038547], [95.15944367978204, 24.225051150090565], [95.15588622886645, 24.22649173090872], [95.15750172062798, 24.229273968019243], [95.16046609923114, 24.23579559519061], [95.16194828628443, 24.24113147164013], [95.16474711768541, 24.24432189214167], [95.16935922694682, 24.250321036586627], [95.17439866616559, 24.258621290740052], [95.17499153972784, 24.264846480680603], [95.18092029333695, 24.271071670621154], [95.18297292036402, 24.26942979005281], [95.1889039195803, 24.264709469866204], [95.20507799994982, 24.2523193499581], [95.21990963981807, 24.241516109880592], [95.22991944042991, 24.23028563967057], [95.2393186796134, 24.21990962972569], [95.24987784009033, 24.209472689812856], [95.25824135975103, 24.207109109597752], [95.25811752040732, 24.20550539985436], [95.26866839992675, 24.1982921697479]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
