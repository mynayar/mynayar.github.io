
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpon Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabeikkyin</div><div class="name-mm">သပိတ်ကျင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpon Kone</div><div class="name-mm">ဖုန်ကုန်း</div></div>
        <span class="pcode-badge">MMR010012022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01938386217557, 23.510705920741714], [96.01938386217557, 23.51365009517582], [96.02297031712652, 23.52297487858783], [96.0244048985673, 23.52775681942171], [96.02894774204469, 23.528474109692468], [96.03396878023506, 23.5272786247088], [96.0358815563888, 23.52464855828441], [96.03564245903232, 23.519866618349795], [96.03492516786224, 23.51436738724516], [96.03779433164317, 23.51173731902213], [96.04257627157773, 23.51006364022487], [96.0464018238851, 23.507194476444], [96.05166195943195, 23.50193434179647], [96.05686113443386, 23.498660787065717], [96.05571435043697, 23.49633179477655], [96.05283777894039, 23.493752799951835], [96.0499612074438, 23.489884306815384], [96.04867171003144, 23.487999656958664], [96.04708463594727, 23.486511774498865], [96.04480321689499, 23.486015813678932], [96.04291856703827, 23.4853214696102], [96.04410887192694, 23.48363520300228], [96.04490240941874, 23.48175055314556], [96.04420806445069, 23.481155399801935], [96.04430725697438, 23.4796675182414], [96.04143068547779, 23.47679094674487], [96.03827252635608, 23.473959990661115], [96.02757901705803, 23.475605145661007], [96.0258394809074, 23.485675744939726], [96.02416580211013, 23.493805043368127], [96.01938386217557, 23.504564409120235], [96.01938386217557, 23.510705920741714]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
