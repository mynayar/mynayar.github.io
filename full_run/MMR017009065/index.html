
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chaung</div><div class="name-mm">သရက်ချောင်း</div></div>
        <span class="pcode-badge">MMR017009065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51669314737092, 17.545344773742386], [95.51919516472515, 17.546863322184606], [95.52024143959085, 17.547255629843505], [95.52409388792267, 17.54699878256781], [95.52435732003437, 17.54698121970756], [95.52920471982202, 17.54698121970756], [95.5296093850651, 17.547385925420144], [95.52869215571849, 17.536310642222418], [95.52614076018801, 17.524641780393893], [95.5257289201536, 17.52416162965551], [95.5249059604418, 17.52320124004524], [95.52271068025374, 17.521326269591725], [95.52046813079966, 17.519423016359156], [95.5203815899385, 17.519349568727648], [95.5188138737613, 17.518378300018583], [95.51819708003126, 17.519159148975575], [95.5162954203974, 17.51941004273931], [95.51510922541047, 17.51956645822554], [95.51510922541047, 17.522641882416963], [95.51669314737092, 17.527921624983037], [95.52109293299253, 17.531969426747708], [95.52285284598213, 17.534609297581085], [95.52375233440279, 17.536805743290472], [95.52410437671568, 17.53818545439526], [95.52421379722904, 17.538614288918325], [95.52232129808948, 17.540413877298647], [95.52184401438979, 17.541765115867463], [95.5201684398217, 17.543354020072], [95.51994891441092, 17.543562366010406], [95.51983710080162, 17.544186473926686], [95.51669314737092, 17.545344773742386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
