
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pa Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pa Kan</div><div class="name-mm">လက်ပကန်</div></div>
        <span class="pcode-badge">MMR009016038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17435556165992, 19.002101277551958], [95.17407858485888, 19.00653291356315], [95.1738452728411, 19.01119914582398], [95.17361196172271, 19.01843180578328], [95.17536526379592, 19.025445014076183], [95.17804488196577, 19.02683102403256], [95.1922768898666, 19.03009738688496], [95.20114273215142, 19.03009738688496], [95.20377772955862, 19.02989469498425], [95.20417578298606, 19.02986407486719], [95.20557565239449, 19.02239810289018], [95.21187506608152, 19.013298951285606], [95.21654129834229, 19.005832979308593], [95.2212075297038, 19.00140005906553], [95.22158666139535, 18.999504402406274], [95.21934103715921, 19.000466811893887], [95.21677460856142, 19.000233500775494], [95.21070850779148, 18.99696713792315], [95.2027759126783, 18.997900385094738], [95.1908770213575, 18.998600319349293], [95.17781157084738, 19.00140005906553], [95.17435556165992, 19.002101277551958]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
