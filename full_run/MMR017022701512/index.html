
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (12) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (12) Ward</div><div class="name-mm">အမှတ် (၁၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58755300576667, 17.26140797549772], [95.587596773972, 17.260458399335732], [95.58735668286471, 17.260482747580795], [95.58738727870002, 17.26007045159014], [95.58771196993155, 17.259729564467875], [95.58849436662177, 17.259681984935696], [95.58849977064796, 17.259344061978936], [95.58940829185923, 17.259309162887632], [95.58948393113855, 17.258231340703844], [95.58953322387924, 17.257560945581247], [95.58960461386192, 17.256405197142158], [95.58903264504062, 17.256400327313315], [95.5888150756553, 17.256417371264718], [95.58859410773192, 17.25645470572016], [95.58844027959526, 17.256509085026323], [95.58807908038528, 17.256540738464366], [95.58805528432396, 17.256423053181436], [95.58747651662799, 17.256418183352537], [95.58640906812406, 17.256369485963035], [95.58580225417074, 17.25772164543764], [95.58523708512342, 17.25905025886243], [95.5851809926088, 17.259092462247395], [95.5851206516968, 17.259320524922316], [95.58499146948077, 17.25960296510482], [95.5848019463528, 17.259998218942712], [95.58457162907746, 17.26053712508832], [95.5845937263195, 17.26055903886862], [95.58425717392947, 17.261266756755447], [95.58660623998605, 17.261357656630594], [95.58755300576667, 17.26140797549772]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
