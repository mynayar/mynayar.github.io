
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Ngu</div><div class="name-mm">ပေါက်ငူ</div></div>
        <span class="pcode-badge">MMR009007010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89658822416726, 20.29180909261561], [94.89380492675605, 20.288793279086633], [94.88905053575365, 20.282418929390133], [94.88848690094977, 20.276969199668883], [94.88983131276495, 20.275125425797796], [94.88944123272677, 20.274962302268477], [94.88397973807452, 20.272036500983802], [94.88051316904756, 20.264140426439553], [94.87656770923246, 20.26423436512391], [94.86993589442602, 20.26423436512391], [94.86979734127436, 20.264847956368158], [94.86857052031331, 20.270281019853257], [94.86681503918277, 20.27223155404306], [94.86954578740824, 20.27788810265389], [94.86798536023622, 20.28373970522324], [94.86818041329548, 20.287835825762784], [94.86920033083067, 20.28812723128675], [94.8750072820605, 20.289786359952586], [94.88007866969491, 20.289786359952586], [94.8841747920331, 20.290761627047516], [94.8864253589432, 20.29357483680934], [94.89371290272834, 20.292341559615352], [94.89658822416726, 20.29180909261561]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
