
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Bon Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Bon Gyi</div><div class="name-mm">အောင်ဘုံကြီး</div></div>
        <span class="pcode-badge">MMR007002060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.79233285777525, 17.126035269012505], [96.79191902304456, 17.131712540701244], [96.79187178975138, 17.13236051842324], [96.7904643741316, 17.1341716127298], [96.78953846542788, 17.13383921970427], [96.78670298035831, 17.132821308556572], [96.78364809038715, 17.134457078231605], [96.78247651657801, 17.135084408418777], [96.78246164269069, 17.135115605900523], [96.77829345857629, 17.137370331275804], [96.77674965267437, 17.14843426413006], [96.77211824036453, 17.1535802802058], [96.77404194867705, 17.156340610730638], [96.77977207622041, 17.15944107474587], [96.7855530082648, 17.163054157723252], [96.79061132425329, 17.164499390734363], [96.7982710587624, 17.165831518709695], [96.79588377241822, 17.15298518891541], [96.79856010626395, 17.144266127679714], [96.79783748930873, 17.138846503663274], [96.79980226606176, 17.134569478198898], [96.79958747827953, 17.134068304908396], [96.79718600602939, 17.1313237637807], [96.79547066793702, 17.130294560745426], [96.79233285777525, 17.126035269012505]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
