
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Lone Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Lone Hla</div><div class="name-mm">လက်ပံလုံးလှ</div></div>
        <span class="pcode-badge">MMR008005016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42553104971824, 18.576998753889427], [95.41441728273145, 18.578762844229914], [95.40753733238205, 18.57929207097237], [95.40619159676481, 18.57912895193965], [95.40171583461813, 18.578586435016007], [95.39518870179722, 18.577527980631828], [95.38901438740413, 18.57682234467552], [95.37737139277561, 18.575058255234353], [95.36994083160414, 18.574772464177954], [95.36784530601614, 18.57735157231724], [95.36678685163196, 18.58105616131286], [95.36713967005977, 18.58370229592424], [95.36661044331737, 18.586172022221092], [95.36766889680223, 18.58952379278884], [95.36837453275854, 18.59199351908569], [95.36753818933602, 18.594321925916176], [95.37605268628249, 18.595538283265228], [95.38365491634136, 18.595538283265228], [95.39885937466045, 18.597362817939768], [95.40190026578472, 18.588240142768427], [95.4088943167194, 18.589152409656037], [95.41710472500313, 18.590672855667833], [95.42531513328686, 18.591281033892642], [95.43048464864768, 18.590976945229897], [95.42800077601504, 18.58828893009013], [95.42588386814606, 18.583878705138204], [95.42535464140366, 18.58087975209895], [95.42553104971824, 18.576998753889427]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
