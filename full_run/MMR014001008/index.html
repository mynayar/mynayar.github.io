
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hti Hpawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taunggyi</div><div class="name-mm">တောင်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hti Hpawng</div><div class="name-mm">ထီဖောင်း</div></div>
        <span class="pcode-badge">MMR014001008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.1191992606374, 20.652488409912223], [97.10802731830614, 20.650254021805722], [97.09182800026207, 20.650254021805722], [97.0861827291497, 20.648439469605876], [97.08081238168614, 20.661984561838096], [97.0657302590443, 20.688238627710575], [97.05846849612425, 20.70108636314518], [97.05735130162134, 20.722313055103484], [97.05399971901187, 20.742981150259936], [97.04506216388779, 20.75471169029231], [97.04523552170201, 20.76233943141966], [97.04562076068959, 20.779289964860027], [97.0695340540534, 20.7566323993658], [97.07568498517401, 20.751506621633325], [97.08901200440056, 20.750481467345878], [97.09996655541227, 20.753940798629003], [97.10020695678571, 20.747449927372315], [97.09964835998386, 20.72845762441989], [97.09853116638027, 20.710023918269258], [97.11640627482979, 20.66924632475815], [97.1191992606374, 20.652488409912223]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
