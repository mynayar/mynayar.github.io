
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Soe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Soe</div><div class="name-mm">မြို့စိုး</div></div>
        <span class="pcode-badge">MMR008012045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54195329420924, 18.373013023732085], [95.53770862725139, 18.37755917401671], [95.53582483894525, 18.37991390760078], [95.53912146668239, 18.387213585938298], [95.53982788774687, 18.390039268397572], [95.54359546435927, 18.391687582715804], [95.54783398624954, 18.395219685340237], [95.55160156196257, 18.398280839988843], [95.55466271661112, 18.39875178706535], [95.56113823823915, 18.4047563607175], [95.56525902358516, 18.400635575371552], [95.56565366318608, 18.398425597563346], [95.56643639082682, 18.39404231719925], [95.5651432610527, 18.390901857634674], [95.56313976308968, 18.386036218696574], [95.56690733790339, 18.38062032866526], [95.57622703474993, 18.375701160280357], [95.56715457502366, 18.370996920871278], [95.55976219906631, 18.37166895455863], [95.55236982400822, 18.375701160280357], [95.54800160189245, 18.37502912569363], [95.54195329420924, 18.373013023732085]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
