
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Kha Mun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Kha Mun</div><div class="name-mm">ကျုံခမွန်</div></div>
        <span class="pcode-badge">MMR017009061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5323341995637, 17.49637403983013], [95.52934475955306, 17.49278700031988], [95.52785004044705, 17.490694500051177], [95.52197123968102, 17.489598390153617], [95.51569391963875, 17.488801259870286], [95.5132027202294, 17.48929949957227], [95.5125395997228, 17.489822580347834], [95.51058371276821, 17.49127258696035], [95.51165235197453, 17.493944184076895], [95.51205241808469, 17.494944347103967], [95.5121992881667, 17.497734885856346], [95.51460646301791, 17.49893847373164], [95.51453687977323, 17.499263579550586], [95.5135929603469, 17.49971061005664], [95.51498436173898, 17.503784109049434], [95.51641501134378, 17.504184911704385], [95.51673219683346, 17.507753266000464], [95.51775636726262, 17.50765617968898], [95.52014423996474, 17.507429820330003], [95.52116851921187, 17.507336075899218], [95.52170483980655, 17.507286990002626], [95.52719232036935, 17.50701257986674], [95.52758760028757, 17.507161889809424], [95.52778572273297, 17.507236726893495], [95.5279828802058, 17.50731119975211], [95.52831515991676, 17.506675260355053], [95.52864743962772, 17.50603932005862], [95.52934115956691, 17.504144909859747], [95.53083947955838, 17.50005458994741], [95.5323341995637, 17.49637403983013]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
