
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nay Pu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nay Pu Kone</div><div class="name-mm">နေပူကုန်း</div></div>
        <span class="pcode-badge">MMR005003024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38582571968129, 21.734548739632658], [95.39314128004611, 21.73706352016535], [95.39999964037116, 21.7393496102963], [95.40199439962191, 21.740236199740878], [95.40395927799835, 21.73719978094516], [95.40493761537869, 21.735893790865816], [95.39760024555494, 21.732907975123], [95.39685034856478, 21.732428119362282], [95.39619984914378, 21.732011867253902], [95.39490247456962, 21.73116376069902], [95.39455954598634, 21.730939584893974], [95.39323619899147, 21.7301310970725], [95.39197317042556, 21.729512855433995], [95.39101233475151, 21.728814307933987], [95.38984857155441, 21.72796822935038], [95.38922157861305, 21.727603740420307], [95.38846395105054, 21.727163308240108], [95.38732320600121, 21.726102696382384], [95.38628291972105, 21.725241254680213], [95.38628291972105, 21.728147580246684], [95.38582571968129, 21.734548739632658]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
