
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daung Sa Par</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daung Sa Par</div><div class="name-mm">ဒေါင်းစပါး</div></div>
        <span class="pcode-badge">MMR008010033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73888031037808, 18.170122892657446], [95.72653762521128, 18.178813698093734], [95.72867921677249, 18.181052634971195], [95.73207958130769, 18.189796429361763], [95.73280823091517, 18.193439675600587], [95.72623931559201, 18.19411185677683], [95.72493837970251, 18.194241723376877], [95.72538325183564, 18.196910957974353], [95.72815726644473, 18.200873834060246], [95.72931560942789, 18.208016951221396], [95.72934612792153, 18.208205153245274], [95.73093127835585, 18.216527194374578], [95.73109996419203, 18.218382733176668], [95.73369391114517, 18.218534413732243], [95.73766589376606, 18.218456641261014], [95.74009472519145, 18.217727991653533], [95.74446662193714, 18.213598978410175], [95.74568103764983, 18.20776978244953], [95.74981005179251, 18.20024040377166], [95.74981005179251, 18.19222525988789], [95.75126735100753, 18.184938764712285], [95.7532104163277, 18.183724349898853], [95.76292574202944, 18.176680738225514], [95.76122556021147, 18.17449479030239], [95.75879672878608, 18.174009023297856], [95.75733942957106, 18.172551724082837], [95.75296753282544, 18.172065957977622], [95.74932428478797, 18.17060865876266], [95.74300932272212, 18.170851542264927], [95.73888031037808, 18.170122892657446]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
