
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hsaunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hsaunt</div><div class="name-mm">လွယ်စောင့်</div></div>
        <span class="pcode-badge">MMR015012060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.06013266459087, 22.32051348870658], [97.07026361737212, 22.317905887346853], [97.08395637468698, 22.31430252873878], [97.0926044326485, 22.311059506890786], [97.09728879793971, 22.311419842751604], [97.10521618507892, 22.30817682090361], [97.11098155705326, 22.30889749262525], [97.11962961501479, 22.305654470777256], [97.13080002310267, 22.306014806638075], [97.13759939869334, 22.301990469084956], [97.13810463781886, 22.281946353241665], [97.13804699757094, 22.279640740627713], [97.13754109924241, 22.25940480119067], [97.13983105106223, 22.25253540168751], [97.13612501685611, 22.25124931900092], [97.12882407856841, 22.248456791847502], [97.12858564401233, 22.248365294822577], [97.12834720855687, 22.248273796898275], [97.11786404618886, 22.245141709122606], [97.11777275420928, 22.245141772974478], [97.11768146222977, 22.24514183682635], [97.1118947664304, 22.243161634901583], [97.10666086770493, 22.24317756189504], [97.100889037699, 22.243867512775523], [97.1008891231346, 22.24395133768411], [97.10088920587219, 22.244035161693432], [97.09150099057831, 22.243398706085486], [97.08429101691695, 22.24526016782255], [97.08429110055391, 22.245343990932497], [97.08429118419087, 22.245427814941763], [97.07692852812914, 22.25279430930999], [97.076862618615, 22.25279435517541], [97.07674594417006, 22.252794437013733], [97.07674601881376, 22.25286982808018], [97.07674611144392, 22.252962084132946], [97.06647626736589, 22.256169956878068], [97.05889269644086, 22.255696813657096], [97.05239308737117, 22.255884337592136], [97.04965825532429, 22.254794253152284], [97.05476917895453, 22.277908617588707], [97.05801220080247, 22.300249434663726], [97.05958025512473, 22.31540729461102], [97.06013266459087, 22.32051348870658]]]]};

            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
