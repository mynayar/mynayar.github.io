
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thandwe</div><div class="name-mm">သံတွဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR012015701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.37382381211927, 18.461064435675212], [94.37112382880173, 18.456458007431138], [94.36807225732889, 18.452076800903683], [94.36719460714545, 18.450432790740763], [94.3616769696165, 18.453190907134683], [94.35770377021288, 18.455558774417966], [94.3531687031732, 18.45860890697554], [94.34927576916147, 18.46081624077692], [94.34436839268722, 18.46748843963985], [94.34811568059422, 18.470844544939837], [94.35384676501627, 18.473799352957826], [94.35767844710273, 18.47555569384025], [94.35827902425763, 18.47459561809336], [94.35888335878002, 18.474113398914255], [94.35966977004392, 18.474039487232574], [94.36102931385182, 18.474063859759383], [94.36242570558193, 18.474224495763906], [94.36364162855836, 18.474181613390783], [94.36467599909815, 18.47379868476156], [94.36606428164134, 18.47293531401357], [94.36723441473652, 18.471629759206053], [94.36822866022453, 18.470700949289437], [94.36971553724231, 18.468744536231384], [94.37027727267804, 18.467409225555343], [94.37055122595837, 18.465871188804385], [94.37082951217229, 18.464879274359077], [94.37138797407579, 18.463134371054423], [94.37181122201036, 18.462380347974715], [94.37237753679392, 18.461625287976688], [94.37291106499373, 18.461245944045118], [94.37382381211927, 18.461064435675212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
