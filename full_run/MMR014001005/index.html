
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpet Kun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taunggyi</div><div class="name-mm">တောင်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpet Kun</div><div class="name-mm">ဖက်ကွန်</div></div>
        <span class="pcode-badge">MMR014001005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.11879452524721, 20.95903340896473], [97.11497607218803, 20.954832755727125], [97.10706593584433, 20.94721494941041], [97.10618725593719, 20.936081436009488], [97.11087523290576, 20.918209335792255], [97.11380528078911, 20.90414602901609], [97.11937197633569, 20.895649520309178], [97.12347373022851, 20.890375837375018], [97.1243527986428, 20.883637158827867], [97.12464592007319, 20.876898468589502], [97.12521744462941, 20.868613632413258], [97.11207799880066, 20.8617108177001], [97.10233902272779, 20.855559885680236], [97.09260004755419, 20.854022152900086], [97.08029818441372, 20.85607246417294], [97.07209694202032, 20.856585040867003], [97.07004663074747, 20.868886904906788], [97.06133281076069, 20.884776812100256], [97.05928250128648, 20.89400320968042], [97.06748374278055, 20.911943428146742], [97.07876045073425, 20.943210664040976], [97.08286107327996, 20.96012572732053], [97.09465035882704, 20.959613148827827], [97.11515346526028, 20.96012572732053], [97.11879452524721, 20.95903340896473]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
