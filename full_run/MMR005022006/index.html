
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tigyaing</div><div class="name-mm">ထီးချိုင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Thaung</div><div class="name-mm">ဇီးသောင်</div></div>
        <span class="pcode-badge">MMR005022006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00158843995462, 23.81206464017106], [96.00005555991623, 23.82003603023867], [96.00112260012793, 23.830172459891173], [96.00218964033968, 23.842442880034923], [96.00699095976506, 23.85257939961963], [96.01046603997582, 23.85765809964164], [96.01872803966734, 23.855780340390424], [96.03099827994674, 23.85364634989918], [96.0459361198561, 23.85204588041313], [96.05500560012842, 23.851512360307254], [96.06514211971313, 23.85257939961963], [96.0765469199045, 23.849814600363572], [96.0763456804089, 23.849378369815952], [96.08007995962248, 23.837641469778077], [96.07982616014925, 23.834084759903817], [96.07954644041592, 23.830172459891173], [96.07954644041592, 23.82003603023867], [96.07954644041592, 23.81203359017809], [96.07886244034938, 23.811935850059456], [96.07207751956196, 23.810966549966338], [96.06194135970605, 23.81043311979272], [96.05180484012135, 23.807232089988986], [96.04380240006077, 23.809899599686844], [96.0347329197885, 23.81043311979272], [96.02139527956854, 23.811500070072213], [96.00912504018851, 23.812567110283965], [96.00158843995462, 23.81206464017106]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
