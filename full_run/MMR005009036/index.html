
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pone Ta Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pone Ta Kar</div><div class="name-mm">ပုန်းတကား</div></div>
        <span class="pcode-badge">MMR005009036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.437713240074, 22.87373453991711], [95.4351630001724, 22.87280717970765], [95.43100787961004, 22.872265199679248], [95.42793672000369, 22.8697359301691], [95.4263106000542, 22.86666476966343], [95.4255880802258, 22.86250956006819], [95.42125223999892, 22.859618940261953], [95.41745819993605, 22.857631649880773], [95.41258056044455, 22.855463729767393], [95.40589608043985, 22.853476440285533], [95.40047628015628, 22.853476440285533], [95.3991104401947, 22.853561849799576], [95.39758547958627, 22.853657159950046], [95.39866943964296, 22.85727039041626], [95.3984890797073, 22.8608836199831], [95.39837856022245, 22.86115388964032], [95.40553464021156, 22.86359352012488], [95.41041264033112, 22.867206749691775], [95.41167732005232, 22.871903940214736], [95.41167732005232, 22.874790420441627], [95.41167732005232, 22.87486683043994], [95.41311047966497, 22.874744070282645], [95.4122925597539, 22.877929709988166], [95.41091492608302, 22.88079951768367], [95.4124124106043, 22.881489553100437], [95.43621349016053, 22.888723215803793], [95.43625892930618, 22.884213504249885], [95.435708572093, 22.878847522994818], [95.437713240074, 22.87373453991711]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
