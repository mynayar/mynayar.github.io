
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Bar Yat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Bar Yat</div><div class="name-mm">ကမ္ဘားရပ်</div></div>
        <span class="pcode-badge">MMR005019036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.77701063992913, 22.049559180311974], [94.77632339960525, 22.050005850189905], [94.77132732029963, 22.050223110208435], [94.7682403200348, 22.050223110208435], [94.76741736032295, 22.054133160117317], [94.76394155975521, 22.05912933025445], [94.76437607979233, 22.063690980354522], [94.76437607979233, 22.067444700212775], [94.76474580007869, 22.067796690365014], [94.76751491967786, 22.067825760050823], [94.76688455967474, 22.071134159913584], [94.76874396286365, 22.070834299863122], [94.77305129188369, 22.070139622145916], [94.77586534700822, 22.069268689898195], [94.779251828709, 22.069756569410174], [94.77924055570713, 22.070657670315256], [94.78360459507604, 22.07025290165012], [94.78458213205982, 22.06936027685532], [94.78722712812953, 22.069079756725444], [94.78865253288814, 22.060170976309564], [94.79000843983766, 22.050005850189905], [94.78218851988436, 22.050657540313296], [94.77701063992913, 22.049559180311974]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
