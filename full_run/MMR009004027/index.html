
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyan Su</div><div class="name-mm">ကျန်စု</div></div>
        <span class="pcode-badge">MMR009004027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60073165484204, 19.890082061438022], [95.60101084667332, 19.888769857942634], [95.60530137815613, 19.889564400876452], [95.60689046402376, 19.88765749819504], [95.60879581537466, 19.8820880129515], [95.60862405025978, 19.882005566703583], [95.60454637661405, 19.88137823201987], [95.59827303427318, 19.877614225716002], [95.59794443009145, 19.877629162555877], [95.59137235724853, 19.877927893957178], [95.58478534576716, 19.873536552969597], [95.58353067819831, 19.863185536982996], [95.58472429708871, 19.852442963372084], [95.58478534576716, 19.85189351987009], [95.58258967617269, 19.850638851401925], [95.56816098743968, 19.857853195768428], [95.56334631937722, 19.8629999097181], [95.56596531694589, 19.86506754013493], [95.56627898428775, 19.877927893957178], [95.56439698113581, 19.884514903639968], [95.56280760029057, 19.89039561456599], [95.56907022541066, 19.890041126996437], [95.5765389268301, 19.889246584062676], [95.57851393427069, 19.88945089474305], [95.57860473881772, 19.88908767475641], [95.58718580178339, 19.886704046854334], [95.59465450410215, 19.887180772075], [95.60005739623193, 19.888610950435066], [95.60073165484204, 19.890082061438022]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
