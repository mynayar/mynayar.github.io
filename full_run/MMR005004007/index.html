
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Tin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Tin</div><div class="name-mm">တောင်တင်း</div></div>
        <span class="pcode-badge">MMR005004007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7352532402449, 22.52111481010047], [95.7332606402664, 22.52024298032933], [95.73288696026509, 22.51787642965354], [95.73014663965574, 22.514762609806667], [95.7230470802586, 22.514638050105987], [95.71769136026813, 22.514762609806667], [95.71395456025482, 22.51214693972952], [95.71348151955652, 22.51242647959839], [95.71121460027365, 22.513766130402644], [95.708100599663, 22.515634439577752], [95.70286944027254, 22.517502749652238], [95.69689091998004, 22.519620180027346], [95.70199751966987, 22.52559879025199], [95.71121460027365, 22.529958119871367], [95.71781591996881, 22.53107915987539], [95.71980887967612, 22.531328280176012], [95.72180147965463, 22.52784069039558], [95.72404355966262, 22.52609694002183], [95.72964839995376, 22.52559879025199], [95.73201503966243, 22.52323223957626], [95.73375887996838, 22.522111290403757], [95.7352532402449, 22.52111481010047]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
