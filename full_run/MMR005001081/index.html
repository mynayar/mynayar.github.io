
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htone Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htone Bo</div><div class="name-mm">ထုံးဘို</div></div>
        <span class="pcode-badge">MMR005001081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99413781580762, 22.114329030360523], [95.99413787965949, 22.111413228637616], [95.99413789314929, 22.110824019812696], [95.99726311909774, 22.103011119967277], [96.00351337314373, 22.096370225605483], [96.01132628917696, 22.083478990862773], [96.01390341341187, 22.077531885688018], [96.01430260987757, 22.076610677740632], [96.01640475987182, 22.071759648289174], [96.0169681158859, 22.069168375919844], [96.01733725610956, 22.067470444205696], [96.01538147977152, 22.06754567968943], [96.00660972006261, 22.066814610006304], [95.99820336029688, 22.0704695995924], [95.98870044007333, 22.069007640090547], [95.98809960031639, 22.07040947991362], [95.98541112022707, 22.07668302010535], [95.9839491598259, 22.082530949843488], [95.98321800021063, 22.087647899830756], [95.98321800021063, 22.092033780134898], [95.97744828001419, 22.09491863978343], [95.97773556034787, 22.094957789970067], [95.97554280006023, 22.099709160149644], [95.9748116404449, 22.110308549999615], [95.97487500038102, 22.11182676029682], [95.98175603980945, 22.114329030360523], [95.99052780041774, 22.114329030360523], [95.99413781580762, 22.114329030360523]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
