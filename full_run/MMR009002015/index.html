
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Khan Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Khan Kan</div><div class="name-mm">စခန်းကန်</div></div>
        <span class="pcode-badge">MMR009002015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12947703533695, 20.505975517955846], [95.11522135997785, 20.50656950487877], [95.09889178322925, 20.50934245199261], [95.0841027325551, 20.510574873032], [95.06869747181094, 20.507185714948832], [95.05483273714117, 20.505953293909442], [95.04990305388287, 20.512423504141452], [95.0484041628219, 20.515021579882045], [95.04928684291355, 20.51458024028591], [95.04928684291355, 20.528136869920672], [95.04867869526561, 20.53558668108053], [95.04928684291355, 20.53553139525775], [95.05544894721118, 20.53799623733653], [95.06561641966209, 20.5339908691833], [95.07547578707795, 20.531217922069516], [95.08687567966894, 20.53429897421836], [95.09642694115047, 20.53953676341098], [95.10536199256194, 20.541385393621056], [95.106286307667, 20.552785287111362], [95.10998357078523, 20.558023076303982], [95.11552946501286, 20.554633919120135], [95.11614567508292, 20.542309709625442], [95.11737809612231, 20.534607080152682], [95.12362956785034, 20.53309810409428], [95.12569693656445, 20.522899080728052], [95.13001040975269, 20.505953293909442], [95.12947703533695, 20.505975517955846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
