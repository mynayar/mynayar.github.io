
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Pin Sa Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Pin Sa Khan</div><div class="name-mm">ကြို့ပင်စခမ်း</div></div>
        <span class="pcode-badge">MMR008014027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72083265530284, 18.252986485338056], [95.71642200407229, 18.249457962914732], [95.71142326457203, 18.247105615231987], [95.70377813505297, 18.24240091986661], [95.7023079179761, 18.237696225400555], [95.69936748292304, 18.233873659741676], [95.69195218234739, 18.229880804755396], [95.69124817416395, 18.240750993963275], [95.68796248757877, 18.24633666070838], [95.68429295325723, 18.250173457239327], [95.68646597342598, 18.254278049392497], [95.69192733497857, 18.258133129140674], [95.69192733497857, 18.261666951268808], [95.68935728211295, 18.268092083882607], [95.69128482243667, 18.270340880027618], [95.69417613202296, 18.276123499200196], [95.69887741086387, 18.27729407656045], [95.705934453912, 18.27690201891312], [95.7110312069247, 18.27650996126573], [95.71612795993747, 18.271413208253023], [95.71612795993747, 18.268276744376294], [95.71612795993747, 18.263572049010918], [95.71730413377878, 18.258867353645485], [95.72083265530284, 18.252986485338056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
