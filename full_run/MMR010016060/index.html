
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Chaung</div><div class="name-mm">ဇီးချောင်း</div></div>
        <span class="pcode-badge">MMR010016060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9091802398762, 21.738956361946578], [95.90463718865539, 21.73923169838423], [95.90125907694488, 21.737840710680302], [95.90086165214359, 21.741417534791424], [95.90006680164163, 21.744000796899286], [95.90344491425145, 21.74777633431046], [95.90702173836257, 21.753737708128767], [95.9102011376724, 21.764666893762183], [95.91397667508357, 21.76208363165432], [95.91854706119796, 21.76029522004842], [95.92311744821171, 21.760096506748425], [95.9288801096294, 21.761686206853028], [95.93225822223923, 21.76426946896089], [95.93682860835366, 21.764865606162857], [95.94179642016871, 21.766256593866785], [95.94219038887542, 21.766322255168006], [95.94537324427984, 21.766852731068752], [95.94775779398708, 21.765461744264144], [95.94895006929033, 21.762679768856287], [95.95093719419623, 21.760891357250387], [95.95135584029987, 21.760951163965103], [95.9517320428995, 21.757314533139265], [95.95073848089623, 21.7513531593209], [95.95073848089623, 21.743603372097994], [95.94636680718247, 21.738238136380915], [95.94219384497, 21.741218823290126], [95.94165210865793, 21.741305500848227], [95.93722603315496, 21.742013672892767], [95.92510457311761, 21.741814959592773], [95.91477152468616, 21.740026547986872], [95.91119469967572, 21.73883427268356], [95.9091802398762, 21.738956361946578]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
