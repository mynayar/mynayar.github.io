
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Mee Htun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Mee Htun</div><div class="name-mm">ဆီမီးထွန်း</div></div>
        <span class="pcode-badge">MMR009004031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68005682626159, 19.923742957171783], [95.68013902159862, 19.92359911510715], [95.67583810204684, 19.92312123515694], [95.6669973211695, 19.92168759530631], [95.65528926059096, 19.922404415231654], [95.63808558058514, 19.924554875007516], [95.62494388105534, 19.924554875007516], [95.62398812115492, 19.924554875007516], [95.6113242997767, 19.92431593503244], [95.60009412004769, 19.927422154708722], [95.59603213957166, 19.9276610946838], [95.59272791436183, 19.92842360916228], [95.59340379984553, 19.92957261538396], [95.59292591989532, 19.93554611476145], [95.59627108044606, 19.94008597518763], [95.60224457982355, 19.940324915162762], [95.60821808010036, 19.94104173508805], [95.6158641611022, 19.94104173508805], [95.62159872140393, 19.942475375838], [95.63020056140687, 19.944386895638786], [95.63569618083415, 19.944864775588997], [95.6478821213629, 19.944386895638786], [95.65576714144049, 19.945581596413604], [95.66341322064369, 19.948209936139676], [95.6632787612059, 19.94881500810618], [95.66747520111971, 19.947732056189466], [95.6717761206715, 19.943909015688575], [95.67440446129689, 19.933634594960665], [95.68005682626159, 19.923742957171783]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
