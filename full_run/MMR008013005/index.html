
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Nyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Nyo</div><div class="name-mm">ကျွန်းညို</div></div>
        <span class="pcode-badge">MMR008013005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43199950087632, 18.075886507556334], [95.43154296183826, 18.076604796074548], [95.43009369626714, 18.081567468264097], [95.42866684539865, 18.083364471992866], [95.42770154099338, 18.086973138399685], [95.42675164287408, 18.087869804747754], [95.42578667391592, 18.091028139237267], [95.4248407975648, 18.09102414444874], [95.42435612593454, 18.093278805972147], [95.4224452671354, 18.096429801993793], [95.42100331215318, 18.100488463072168], [95.42056961139849, 18.102505966177432], [95.42407644127479, 18.10360185034517], [95.43135017686922, 18.106026428876646], [95.44123499779698, 18.11031606823201], [95.44503949697526, 18.11242967918639], [95.44850873429073, 18.10695895928859], [95.45410391586307, 18.104161368952077], [95.45932608473106, 18.100244741401752], [95.46175066416185, 18.098566187379674], [95.46249668777199, 18.097820162870278], [95.45503644627502, 18.08924088415955], [95.44720319207369, 18.084018715291506], [95.43199950087632, 18.075886507556334]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
