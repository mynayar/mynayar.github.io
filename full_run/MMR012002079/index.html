
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Pone Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Pone Tan</div><div class="name-mm">သင်ပုန်းတန်း</div></div>
        <span class="pcode-badge">MMR012002079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.89240165741063, 20.353630568396056], [92.88862165036892, 20.35344056143282], [92.88523775871568, 20.355690024874775], [92.87807013772675, 20.36225249115961], [92.87289411037494, 20.36581391528], [92.86871335373831, 20.368625384853658], [92.8663242138914, 20.370312308866005], [92.86433297818445, 20.37199950986951], [92.86432904095255, 20.376502803861342], [92.86742774769249, 20.38460155321917], [92.8684779759779, 20.387051774120152], [92.86853469801798, 20.38715785365207], [92.8689662835672, 20.38698670727075], [92.87329690233025, 20.385987333848448], [92.88766884743944, 20.38494037100139], [92.89257053660106, 20.38394099757903], [92.89849238881277, 20.381955829597928], [92.89862817834779, 20.381518794157103], [92.89864094332495, 20.380156171070496], [92.8987527956051, 20.377276721743385], [92.89947019829106, 20.370701836720457], [92.90055424108544, 20.360765642020795], [92.89647785526887, 20.357198152872513], [92.89240165741063, 20.353630568396056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
