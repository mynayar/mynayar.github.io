
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yan Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yan Taing</div><div class="name-mm">ရန်တိုင်</div></div>
        <span class="pcode-badge">MMR012005051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.31028083359365, 20.14184710456027], [93.30895216171297, 20.147549324341867], [93.30838109041503, 20.157600168213264], [93.30864408635557, 20.166016041007538], [93.308666626064, 20.166737298187797], [93.3082747159055, 20.172481585556795], [93.30836732359319, 20.173085545061895], [93.3085781759421, 20.17446066063104], [93.30837621159293, 20.17516385492803], [93.30942794264547, 20.17773947909376], [93.30996578399379, 20.181968050884905], [93.30908884157685, 20.189613596790082], [93.30896984418303, 20.190206675397803], [93.31393630971297, 20.191561165915118], [93.32042868283747, 20.191561165915118], [93.32574062383077, 20.189593780228847], [93.32790474880517, 20.18546226956812], [93.32987213359218, 20.17680577416718], [93.33262647373283, 20.172280786728948], [93.34305361822993, 20.17090361710831], [93.34108623344298, 20.16657536805883], [93.34246340216436, 20.159689518156767], [93.34443093444014, 20.151835861036204], [93.34280020096855, 20.150946295735025], [93.33835276476833, 20.147388072301737], [93.33801523031866, 20.147144276886934], [93.33301583521268, 20.14353331990685], [93.32738235511164, 20.14249543571583], [93.3204146426217, 20.140419734782995], [93.31463288679834, 20.140864412662552], [93.31360848884077, 20.14109572189011], [93.31028083359365, 20.14184710456027]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
