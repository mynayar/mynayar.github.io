
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Sar Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thandwe</div><div class="name-mm">သံတွဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Sar Chaung</div><div class="name-mm">ကြက်စားချောင်</div></div>
        <span class="pcode-badge">MMR012015010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.33975144417388, 18.558380791040747], [94.34363389838575, 18.555304793081802], [94.34680843596061, 18.555140183872425], [94.34948542181485, 18.55500133304514], [94.34993832129658, 18.55497783825666], [94.35499346267824, 18.55471552130433], [94.36021890957505, 18.555921614690817], [94.36139751338459, 18.556193628133485], [94.36711705680676, 18.56089419740931], [94.37272483158574, 18.565172445951646], [94.3692655398728, 18.554362326959847], [94.36916556134162, 18.548418954870897], [94.36912054937392, 18.545742680380442], [94.36821316040908, 18.53918886467443], [94.36231117691932, 18.53807385822205], [94.35445211936985, 18.536588806828036], [94.35163651291481, 18.537187284065965], [94.34195523644507, 18.53924476293554], [94.34083504000517, 18.548971681797752], [94.33975144417388, 18.558380791040747]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
