
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koke Ko</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koke Ko</div><div class="name-mm">ကုက္ကို</div></div>
        <span class="pcode-badge">MMR007002055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.76233895218098, 17.216798761953328], [96.7667649782212, 17.216166472904433], [96.77073936922659, 17.215443855949218], [96.77543637718713, 17.215082547921327], [96.7804946922763, 17.21472123989338], [96.78446908328164, 17.217973013943492], [96.79133394030913, 17.22230871297677], [96.79458571525862, 17.225560487926202], [96.80072795533096, 17.22592179595415], [96.80434103830834, 17.22592179595415], [96.80730747725835, 17.225526271420335], [96.80723225976107, 17.223344972092832], [96.8062790440427, 17.21585541899242], [96.80587052340599, 17.20482535100922], [96.8051896538795, 17.19883370870872], [96.80253012566482, 17.195162516936648], [96.79819879733668, 17.196294517877732], [96.78988870729808, 17.195571901821836], [96.78446908328164, 17.196655826805], [96.77941076819246, 17.20063021691101], [96.77399114417602, 17.201352833866224], [96.76893282818753, 17.20207545082144], [96.76310361603913, 17.203206076699132], [96.76233895218098, 17.216798761953328]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
