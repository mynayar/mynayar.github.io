
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pyin</div><div class="name-mm">ကံပြင်</div></div>
        <span class="pcode-badge">MMR012002080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.86433297818445, 20.37199950986951], [92.85930065170379, 20.37031112355953], [92.85816654185248, 20.369930596120184], [92.85233610123015, 20.36907976641811], [92.85040758604134, 20.368798294805515], [92.84942884576469, 20.368465703929132], [92.84924116444824, 20.36838243120428], [92.84688575457398, 20.371680003229642], [92.84685513085964, 20.37172287840815], [92.84671236258555, 20.373198144279], [92.84495156196505, 20.374578231300404], [92.84209620817353, 20.378337779664832], [92.83690898336295, 20.38419125372343], [92.83548130691685, 20.38799839241193], [92.83535896314567, 20.389688999148063], [92.83558739094542, 20.393572278937597], [92.83569943927773, 20.393734748659767], [92.83711024624091, 20.395780419430878], [92.84812220457616, 20.39512446382298], [92.85573648015452, 20.393696787376882], [92.86068575964015, 20.390270363186744], [92.86853469801798, 20.38715785365207], [92.8684779759779, 20.387051774120152], [92.86742774769249, 20.38460155321917], [92.86432904095255, 20.376502803861342], [92.86433297818445, 20.37199950986951]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
