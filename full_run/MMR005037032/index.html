
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Gyi Chan My</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Gyi Chan My</div><div class="name-mm">ကကြီးချမ်မြူ</div></div>
        <span class="pcode-badge">MMR005037032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74758683956105, 26.742424590122766], [95.74768079982908, 26.742309570430393], [95.76647963972363, 26.735900850443954], [95.77789307970193, 26.74572749962448], [95.78377763972634, 26.74856070041602], [95.78428776037191, 26.748806309763438], [95.78448504015256, 26.74890135011725], [95.78444399959096, 26.748770399834143], [95.77807632016612, 26.728515630392053], [95.78588868041834, 26.713928249988783], [95.7952706400281, 26.707896809989847], [95.79506652000396, 26.707323600104132], [95.79449448013622, 26.705871540339388], [95.77569564024168, 26.69512941009424], [95.75329571972173, 26.685302760014395], [95.74847424019407, 26.683288560119024], [95.74843860006138, 26.68335624039821], [95.74353036023797, 26.692687980066296], [95.74310304017325, 26.703674279844165], [95.74230959980827, 26.71990964991045], [95.73530940020873, 26.729284049819114], [95.73529067992098, 26.72930906985772], [95.74188227974349, 26.73828125967242], [95.74758683956105, 26.742424590122766]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
