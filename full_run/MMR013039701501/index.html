
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Way Lu Wun (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Way Lu Wun (North) Ward</div><div class="name-mm">ဝေဠုဝန် (မြောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12625863762611, 16.817215812559766], [96.12657070057742, 16.81700134313752], [96.12689018293565, 16.816732406275605], [96.12726306973497, 16.81643199943727], [96.12797927902056, 16.815952301057905], [96.12853050228091, 16.81556129471801], [96.1289610859854, 16.81527137757206], [96.12943267877517, 16.8150310517417], [96.12993049669512, 16.814762115779047], [96.13070726542804, 16.814389228979792], [96.13103771232062, 16.813769340682597], [96.12930641216127, 16.813281631142388], [96.12891109177355, 16.813099054377915], [96.12887255402518, 16.813612301966202], [96.12741851755061, 16.813535691419077], [96.12633682738272, 16.813480039572198], [96.12627029463846, 16.814002036664704], [96.12614338231128, 16.814508731792614], [96.1262680400381, 16.815258199806124], [96.12615130443919, 16.81580455503621], [96.12625980404675, 16.816650867443627], [96.12625863762611, 16.817215812559766]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
