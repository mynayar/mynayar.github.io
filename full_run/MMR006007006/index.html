
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Palaw</div><div class="name-mm">ပုလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Taung</div><div class="name-mm">နန်းတောင်</div></div>
        <span class="pcode-badge">MMR006007006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.68005174269382, 12.929881963781668], [98.67950496028573, 12.93285528074665], [98.6786661599154, 12.942922500373129], [98.6786658001866, 12.948794999589609], [98.6786658001866, 12.955925971406486], [98.68118256012713, 12.963056941424782], [98.6829754629473, 12.964710300040338], [98.68402399691001, 12.965677225923287], [98.69292684000175, 12.96851017490468], [98.69814383596929, 12.969911476933191], [98.70606128290194, 12.972038128057193], [98.70773216480762, 12.974223380804403], [98.71138223959872, 12.978997109928741], [98.71988301379014, 12.983790482045151], [98.72648262027678, 12.968930070166664], [98.72709135967858, 12.967538664277981], [98.73235512039253, 12.95550720029712], [98.7394859995793, 12.942923309762989], [98.7436803602605, 12.929500394927345], [98.74458468433579, 12.924436486055015], [98.74116396004877, 12.923627849845445], [98.73429334106487, 12.91952915994284], [98.72873601825268, 12.916213919836594], [98.71893323977724, 12.922788599814055], [98.71609036228045, 12.924935918258086], [98.70732975776218, 12.931553089403621], [98.70089688018692, 12.92908040973316], [98.68847795679233, 12.927424309983962], [98.68830217530518, 12.927475579434486], [98.6861174540573, 12.928112787774978], [98.68005174269382, 12.929881963781668]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
