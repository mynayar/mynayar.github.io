
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chaung</div><div class="name-mm">သရက်ချောင်း</div></div>
        <span class="pcode-badge">MMR007008012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.91921492542855, 17.986542745551333], [96.90862662332006, 17.986101566933826], [96.88905573973068, 17.986101566933826], [96.87676704626222, 17.987011840024422], [96.87110327879333, 17.989586279783055], [96.86675403686934, 17.99156320817559], [96.85810643666281, 17.992473482165508], [96.85099484793392, 17.99201466964132], [96.85127938533543, 18.005672448724567], [96.85221564433658, 18.006795960065574], [96.85355506941096, 18.00840326979511], [96.86265780481392, 18.014775185026792], [96.87312595210108, 18.017506006097335], [96.87767732025219, 18.026608742399617], [96.8848693398482, 18.0303485929133], [96.88905573973068, 18.03252552063634], [96.90407525516895, 18.027063879394575], [96.9113574443906, 18.01932655407728], [96.91863963271294, 18.01158922786061], [96.9190947697079, 18.001576217568413], [96.92000504279855, 17.989742661094965], [96.91921492542855, 17.986542745551333]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
