
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Tun Kaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Tun Kaw</div><div class="name-mm">မန်တွန်းကော်</div></div>
        <span class="pcode-badge">MMR015021039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.82147776428747, 23.135846967563566], [98.81915853234045, 23.13194053922456], [98.81608564513647, 23.131704162317305], [98.81399486617022, 23.12771267430054], [98.81249912903166, 23.12710078187564], [98.80886432023226, 23.13119362528562], [98.80148097077023, 23.13748314463146], [98.79373134272737, 23.144974452309157], [98.7889019302799, 23.14787452578878], [98.78042475070174, 23.14896835590497], [98.77112719876129, 23.14650723881806], [98.75882161602482, 23.142131921051373], [98.74679486988737, 23.14063216394328], [98.74733640475137, 23.14787452578878], [98.75034443734597, 23.15279675906322], [98.75444629825813, 23.15717207772923], [98.75909507287935, 23.16455542809058], [98.75916460036609, 23.166618425200227], [98.76693637241573, 23.16878703059706], [98.77522905967345, 23.168657289002738], [98.78835501477215, 23.16346159797439], [98.79765256671266, 23.160180109424573], [98.81378655440602, 23.14760106893425], [98.82007607375186, 23.138303516993744], [98.82147776428747, 23.135846967563566]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
