
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Thit Waing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Thit Waing</div><div class="name-mm">ကသစ်ဝိုင်</div></div>
        <span class="pcode-badge">MMR007002044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.69378070891264, 17.264581780125127], [96.7024521069792, 17.26060738911974], [96.70714911493974, 17.258078232024843], [96.7089556559788, 17.252658608008403], [96.7154592049784, 17.25012945001413], [96.72087882899484, 17.245432442053584], [96.7244919110729, 17.239651510009253], [96.7251405587898, 17.236408271424636], [96.72557583605607, 17.234231885992813], [96.72521452802812, 17.22772833699321], [96.72735696495204, 17.22258408358863], [96.71798836297262, 17.22050217193771], [96.71220743002891, 17.223031329931985], [96.70714911493974, 17.226644412909366], [96.70136818199609, 17.231702727998538], [96.69847771597387, 17.237483660042926], [96.69341939998537, 17.242903284059366], [96.68944500987936, 17.247238983991963], [96.68673519787114, 17.249948796000183], [96.68944500987936, 17.252658608008403], [96.69305809195743, 17.259523465035954], [96.69378070891264, 17.264581780125127]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
