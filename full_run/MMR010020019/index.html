
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Paw (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Paw (North)</div><div class="name-mm">တောင်ပေါ် (မြောက်)</div></div>
        <span class="pcode-badge">MMR010020019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26187707956365, 20.952204889943744], [95.26978237036019, 20.954267138817443], [95.27596911877987, 20.954610847112974], [95.28112474321239, 20.951173765057263], [95.28593665755079, 20.948080391297083], [95.28796597774772, 20.946340972957614], [95.27876979828761, 20.944133890067008], [95.27100403191059, 20.943866105236623], [95.26297047980387, 20.944669459727834], [95.25698331882518, 20.942479035878875], [95.24898272327414, 20.947444923144758], [95.23278597639177, 20.955543295686596], [95.23148772228063, 20.956776637631776], [95.23729377958432, 20.96534748609764], [95.2428898595794, 20.974091361427213], [95.24641020896405, 20.9776393011129], [95.24641020896405, 20.974889633849557], [95.24641020896405, 20.971452551793902], [95.24744133385053, 20.965953219965172], [95.24847245783769, 20.960797596431973], [95.24881616703254, 20.95632938859046], [95.25294066567926, 20.952548598239275], [95.25843999840725, 20.952548598239275], [95.26187707956365, 20.952204889943744]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
