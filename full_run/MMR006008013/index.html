
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Ku</div><div class="name-mm">တကူ</div></div>
        <span class="pcode-badge">MMR006008013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.04809996004519, 12.258606420150215], [99.03361967990435, 12.270914819563302], [99.01913956703743, 12.284671316328229], [98.98190063940302, 12.30012915323789], [98.98076735962599, 12.330719099806686], [98.97931871998298, 12.375609120364686], [98.97207815498291, 12.408190594920086], [99.00176196624182, 12.400950746679655], [99.01227087709935, 12.397149629851583], [99.03579011991815, 12.388642605372013], [99.05823394893764, 12.39298705570809], [99.04665042018081, 12.353165144755678], [99.04782007573596, 12.294135663729946], [99.04248289706811, 12.292267651331088], [99.03690467940748, 12.290307736313025], [99.0381107808879, 12.28638790807554], [99.04127679558769, 12.28638790807554], [99.0450458623767, 12.28744324630884], [99.04795128142655, 12.287514110188056], [99.05122713122717, 12.28759400865664], [99.05740840007763, 12.287141720713862], [99.0617805162579, 12.284880281000198], [99.0616297539101, 12.276286810088266], [99.0607251780246, 12.270859354775439], [99.05876526390585, 12.266487237695912], [99.05409162123141, 12.26347198534387], [99.04809996004519, 12.258606420150215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
