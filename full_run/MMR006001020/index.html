
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Me Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawei</div><div class="name-mm">ထားဝယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Me Taung</div><div class="name-mm">ကျောက်မဲတောင်</div></div>
        <span class="pcode-badge">MMR006001020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.4715055999036, 14.14334836293665], [98.46574055977908, 14.1439107602734], [98.4511029603334, 14.146419959613468], [98.44315668023665, 14.147256330015693], [98.4310286398599, 14.147256150151236], [98.41471776001669, 14.153529509579243], [98.40718979956966, 14.156457030367733], [98.40217139999015, 14.160221099624096], [98.40154751600511, 14.160803332407909], [98.40270275992447, 14.161007250084594], [98.40803507955536, 14.163516720120583], [98.41261826212315, 14.166790710123223], [98.41462200020521, 14.168222009937836], [98.4171312004446, 14.174181899874839], [98.41681728039322, 14.180141789811785], [98.41546909772075, 14.18876936931099], [98.42163228030557, 14.188276350173453], [98.42539644039346, 14.189217479902823], [98.43229691956725, 14.189217569835023], [98.43857027989458, 14.185767239866266], [98.4460982403416, 14.182003169710583], [98.45519472006032, 14.17698441040227], [98.45945137228307, 14.17467865029954], [98.46272267960802, 14.172906689991805], [98.4649183204242, 14.166319500444615], [98.46899603993535, 14.15659554035193], [98.4715055999036, 14.149694699650695], [98.4715055999036, 14.14334836293665]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
