
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Tin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Tin</div><div class="name-mm">မိုင်းတင်း</div></div>
        <span class="pcode-badge">MMR015012012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.00019561563522, 22.505391632717703], [96.99467826409068, 22.477575627013607], [96.99193445321248, 22.477752646867202], [96.98414337091987, 22.47825529774383], [96.96072154716171, 22.47825529774383], [96.93874106594751, 22.474291604174255], [96.9230537427361, 22.464634605802473], [96.90559017664538, 22.473210596591798], [96.89550077613995, 22.48185865455332], [96.8818080170264, 22.50347879990676], [96.87352029492575, 22.510325180362827], [96.86667391536895, 22.518252565703392], [96.85802585740743, 22.536990025968976], [96.85620402969226, 22.54518825023763], [96.88000633772236, 22.553925806031145], [96.87789421604532, 22.561904932966343], [96.8933387609751, 22.559330842144675], [96.89821676379268, 22.560154400805004], [96.9048695049238, 22.549601776600753], [96.91315722792376, 22.540593382778468], [96.93117401466912, 22.531945324816945], [96.94198408779545, 22.530143646412228], [96.95243382506106, 22.522216260172343], [96.97153162028809, 22.51392853717232], [96.98810706538882, 22.512126857868225], [96.99749943824855, 22.506893828787213], [96.99852563215228, 22.50632207670253], [97.00019561563522, 22.505391632717703]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
