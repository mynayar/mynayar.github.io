
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnget Thaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnget Thaik</div><div class="name-mm">ငှက်သိုက်</div></div>
        <span class="pcode-badge">MMR010023019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1609448756056, 20.484952597984034], [96.17167431911457, 20.481011169829685], [96.16215790726164, 20.467970161993435], [96.15204931432447, 20.465544098681278], [96.14032334644531, 20.460691974754866], [96.129810409323, 20.460691974754866], [96.115658379031, 20.465139756294775], [96.10934439632689, 20.46296252010427], [96.10895620306638, 20.4669450688599], [96.10658803271161, 20.473260191005068], [96.103430471639, 20.47760183725501], [96.10185169200207, 20.481548787246766], [96.09672065503429, 20.485890432597444], [96.09122844044026, 20.49253890374746], [96.09833937895922, 20.49527388058516], [96.10757150432153, 20.4889960353388], [96.12172353461347, 20.4889960353388], [96.13342423064381, 20.4889960353388], [96.1383016273183, 20.4889960353388], [96.14278502380984, 20.488458027615934], [96.14841022115485, 20.48778300368275], [96.1609448756056, 20.484952597984034]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
