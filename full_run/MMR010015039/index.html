
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwar Ku Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwar Ku Lay</div><div class="name-mm">နွားကူးလေး</div></div>
        <span class="pcode-badge">MMR010015039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12177531937556, 21.415306753104232], [96.1137245650367, 21.41555833934592], [96.10577673900536, 21.414380883970694], [96.09807777426994, 21.412961959726715], [96.09653282173241, 21.414045334324783], [96.09432792689239, 21.415472031409195], [96.09253036198669, 21.41754529607863], [96.0934134539678, 21.4224022997264], [96.10310359595422, 21.421831473044108], [96.10932501683612, 21.42201445630218], [96.11810819973368, 21.421648489786037], [96.1217678603985, 21.42219743866093], [96.12245967107702, 21.422074628141615], [96.12220250274339, 21.42166370361707], [96.12193872798997, 21.42134535440465], [96.12176591066833, 21.420990623118826], [96.12159309244731, 21.42056312678693], [96.12147484868535, 21.420181108271606], [96.1214111793825, 21.419771803426045], [96.12138389215295, 21.41937159342433], [96.12142027512567, 21.41886223540388], [96.12147484868535, 21.41834378164026], [96.12152032740124, 21.41776165767442], [96.12158399670415, 21.41709767381866], [96.12169314472288, 21.416224488769217], [96.12177531937556, 21.415306753104232]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
