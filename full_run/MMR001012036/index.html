
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lawt Hkum</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lawt Hkum</div><div class="name-mm">လော့ခွမ်</div></div>
        <span class="pcode-badge">MMR001012036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.67494488959505, 24.286695135672005], [97.66695956723032, 24.291186879670818], [97.66047149106652, 24.297175872568516], [97.66735391994752, 24.299990324294072], [97.66757115658368, 24.299263315049984], [97.67549801582084, 24.297714883035496], [97.68723210907461, 24.295020887404064], [97.69410023873507, 24.294515879404344], [97.69549822496316, 24.294966557560656], [97.70547019109648, 24.296104664898394], [97.71550862072633, 24.298746916237235], [97.72026373568292, 24.298222113259953], [97.72003260721908, 24.294282890243267], [97.71986233318017, 24.284698805305652], [97.71686783718098, 24.27621439877555], [97.71237609318223, 24.283201557306086], [97.7078843482841, 24.28519788767244], [97.69291186738883, 24.28819238367163], [97.68492654412478, 24.291186879670818], [97.68043480012597, 24.289190549304465], [97.67494488959505, 24.286695135672005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
