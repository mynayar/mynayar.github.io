
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Dar Sin Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Dar Sin Gaung</div><div class="name-mm">အဒါးဆင်ခေါင်း</div></div>
        <span class="pcode-badge">MMR017008054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47490411962946, 17.513179019795984], [95.4749774854227, 17.513453917364473], [95.47508303975053, 17.513849430207074], [95.47566659993367, 17.516038589609252], [95.4747136800923, 17.519660639726794], [95.47461828000968, 17.52118569026743], [95.47557155957986, 17.523187379693866], [95.4777636004099, 17.526523500259373], [95.48291088003316, 17.532623789656213], [95.48323257292498, 17.533410136168925], [95.48376876041999, 17.534720790132383], [95.48367336033738, 17.53557866961995], [95.48700948000356, 17.535006719684418], [95.48796456001651, 17.53493597991161], [95.49215675962682, 17.53462547998197], [95.49834876008725, 17.531655030055617], [95.50090317644049, 17.53039656015318], [95.50080728982465, 17.52982024490842], [95.50035180029539, 17.52882452992816], [95.49978083961412, 17.52905609995912], [95.49921023956097, 17.529287669990026], [95.49844776015607, 17.529049349647835], [95.49768492012305, 17.528811120137107], [95.49692243981877, 17.526714119660937], [95.49644580003371, 17.5254749995716], [95.4916801198417, 17.52347331014522], [95.48567495983161, 17.520899759816132], [95.48214839972894, 17.517944879852394], [95.48052803993716, 17.515276020272154], [95.4784310403603, 17.513655659581048], [95.47490411962946, 17.513179019795984]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
