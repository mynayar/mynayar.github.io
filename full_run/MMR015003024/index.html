
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyai</div><div class="name-mm">မိုင်းရယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hing</div><div class="name-mm">မိုင်းဟိန်း</div></div>
        <span class="pcode-badge">MMR015003024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.27596989699322, 22.30231097487166], [98.28342992265289, 22.29712142171627], [98.28421140922921, 22.288136519984448], [98.29671172756423, 22.284620948697864], [98.30335254278566, 22.281886550124227], [98.30487951158028, 22.274568703682803], [98.31546249869541, 22.267432808077672], [98.31936889915545, 22.264307701739085], [98.32471676356784, 22.250938418872977], [98.31897547094127, 22.25124171972965], [98.3006155874395, 22.245566847432087], [98.2772484622468, 22.241561053899545], [98.27023832513868, 22.245233030779787], [98.26189292321988, 22.245233030779787], [98.24620356843997, 22.241561053899545], [98.23388560923354, 22.23928804980369], [98.2395272461855, 22.246234478938106], [98.24486830273003, 22.25224316788791], [98.24687119994599, 22.257918041084793], [98.24720501569897, 22.26659725875652], [98.25121080923151, 22.272939764358682], [98.26489726769483, 22.281285166277428], [98.27090595664464, 22.28929675244325], [98.27524556593016, 22.295973072899073], [98.27596989699322, 22.30231097487166]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
