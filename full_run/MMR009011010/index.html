
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Ei Hnyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Ei Hnyar</div><div class="name-mm">ပန်းအိညှာ</div></div>
        <span class="pcode-badge">MMR009011010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14483679328345, 20.718048049977597], [94.13907113082809, 20.719179665109493], [94.13921693701207, 20.726032545865337], [94.13683507987508, 20.742705544025682], [94.13989746839349, 20.75971880697739], [94.13713051076451, 20.766290330334527], [94.1344532227381, 20.772648887036553], [94.12863759484918, 20.79132011403209], [94.14806383417869, 20.79714798619068], [94.16235497520199, 20.772648887036553], [94.16815843886093, 20.75888638639765], [94.17426425908832, 20.744406869781244], [94.17625188761457, 20.736762144057764], [94.17868770767166, 20.727393606829537], [94.18502187655844, 20.717892353949026], [94.18753460483822, 20.714123261079692], [94.18676484811931, 20.713683399969], [94.1827708905642, 20.71140113915129], [94.15963285327359, 20.715144057252473], [94.14483679328345, 20.718048049977597]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
