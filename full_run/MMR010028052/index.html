
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwet Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kwet Nge</div><div class="name-mm">ကွက်ငယ်</div></div>
        <span class="pcode-badge">MMR010028052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96420943122035, 20.819165236186734], [95.97030912796396, 20.81945569832186], [95.97758220255668, 20.817472132033345], [95.98345224032869, 20.81637150034453], [95.98376642568007, 20.80663177063974], [95.98766442827082, 20.80287747701402], [95.9799290931532, 20.795142141896406], [95.97493744930392, 20.79036339905167], [95.96931734481967, 20.79069399343308], [95.96237486460836, 20.79069399343308], [95.95906892169342, 20.791685775678047], [95.9511346592372, 20.79433052983012], [95.94617574441514, 20.795983501737282], [95.9402250464488, 20.798628255889355], [95.93394375500037, 20.80028122779646], [95.93724969791526, 20.804578953855696], [95.94121682869377, 20.80722370800777], [95.9415474239745, 20.81019905744057], [95.94584515003373, 20.812182622829823], [95.95344881900786, 20.81350500035552], [95.96336664775265, 20.81912510304113], [95.96420943122035, 20.819165236186734]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
