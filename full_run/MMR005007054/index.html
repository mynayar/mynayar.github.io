
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kar Boe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kar Boe</div><div class="name-mm">ကာဘိုး</div></div>
        <span class="pcode-badge">MMR005007054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5187078400948, 22.880119319950722], [95.51817540007471, 22.880897100420896], [95.50638108012282, 22.88055024000164], [95.49979019975797, 22.88055024000164], [95.4991432796387, 22.88055024000164], [95.49045143998205, 22.88055024000164], [95.48256842539257, 22.880648615041594], [95.48346116440126, 22.88730357659881], [95.48471436517588, 22.896645618000946], [95.48335062243336, 22.902100583575134], [95.48188767997249, 22.904051174422193], [95.48244095908308, 22.9045383515637], [95.48010249783209, 22.908955441040803], [95.48848252364962, 22.911240900747032], [95.49501615497161, 22.912796528237266], [95.49636263972411, 22.90921802958843], [95.49770868021147, 22.905179640128324], [95.50152467992012, 22.90309830044623], [95.50742184034573, 22.909689269843966], [95.51089079977066, 22.917320910431727], [95.51470643975046, 22.92391187982946], [95.51921616029762, 22.93050285012646], [95.52174156002502, 22.93239689969721], [95.52377015986502, 22.925550510247888], [95.52795912011737, 22.919965199634305], [95.5324929595825, 22.91370434977597], [95.5310104802495, 22.911423750006122], [95.52650112033052, 22.90448583025693], [95.52164436039897, 22.896507330149234], [95.52199139978336, 22.888875689561473], [95.5187078400948, 22.880119319950722]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
