
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chan Ban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chan Ban</div><div class="name-mm">ချမ်ဗန်</div></div>
        <span class="pcode-badge">MMR005037031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69788164012567, 26.664309540153226], [95.71868891975788, 26.674926750069517], [95.72836943360255, 26.678017673177123], [95.73608412028597, 26.68048091985861], [95.7373045200876, 26.678894040027956], [95.74847424019407, 26.683288560119024], [95.75329571972173, 26.685302760014395], [95.77569564024168, 26.69512941009424], [95.79449448013622, 26.705871540339388], [95.79150396003979, 26.697326669690085], [95.79412835983601, 26.677673370429773], [95.79388428023543, 26.663085900094245], [95.78552256011812, 26.657470710404993], [95.7703247999496, 26.6467284902277], [95.76367200036259, 26.64251711976931], [95.7487183197947, 26.63287353028926], [95.7197264397235, 26.61907959025092], [95.69787587996797, 26.61071778020147], [95.69512944037143, 26.609680170303648], [95.69647223970213, 26.610290550068896], [95.69909664039767, 26.626098600070407], [95.70129407985797, 26.64227295023653], [95.70007332032753, 26.661926250396164], [95.69788164012567, 26.664309540153226]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
