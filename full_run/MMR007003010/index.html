
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin</div><div class="name-mm">ညောင်ပင်</div></div>
        <span class="pcode-badge">MMR007003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.45612572382316, 16.992464592566932], [96.455669804418, 16.98197844265104], [96.4516647231485, 16.971793061100925], [96.45131478255121, 16.970903122581092], [96.44946254066377, 16.971256141557717], [96.4463216521226, 16.971684444581513], [96.44313317415674, 16.971969981129803], [96.43958777685447, 16.972065159079875], [96.43865978801887, 16.972993148814794], [96.43763100856427, 16.975248027074826], [96.43613194933005, 16.976747087208366], [96.431521404889, 16.976776492341287], [96.42909435412122, 16.976490956692373], [96.42716699096394, 16.977062027090938], [96.42588208189261, 16.978275551575507], [96.42552516255626, 16.98006014825728], [96.42457489301694, 16.982536018722328], [96.42506483557378, 16.982852575585923], [96.42512319258134, 16.9828902823607], [96.43287382606627, 16.98972907613603], [96.436977101612, 16.996567869011983], [96.43934788359803, 16.996567869011983], [96.44563957390727, 16.996567869011983], [96.45612572382316, 16.992464592566932]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
