
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maung Taing(1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Maung Taing(1) Ward</div><div class="name-mm">မောင်းတိုင်(၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009004701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5523450458872, 20.010634250870055], [95.55146781748584, 20.010508933940173], [95.55068259602507, 20.010466102828445], [95.55049929800424, 20.009166758738957], [95.5504115061861, 20.00823617356059], [95.54817702275147, 20.008367417922045], [95.5457117139245, 20.00842295015906], [95.54575148014675, 20.009379324296447], [95.54717915659285, 20.009522091671272], [95.54736951339237, 20.009652961914696], [95.54813094059051, 20.009641064783352], [95.54810714632782, 20.012306060876085], [95.54731478604862, 20.0124036184323], [95.54737189299851, 20.014623656056926], [95.54675799148816, 20.01466648626939], [95.54677119930554, 20.01529557515529], [95.54845748262676, 20.015349311821353], [95.54951396299907, 20.01536358945816], [95.55088453249522, 20.015249374658936], [95.55097019292015, 20.01519226770904], [95.55181423543866, 20.01510786363707], [95.55197355573506, 20.013235859147642], [95.55212117495233, 20.012054908107586], [95.55208885691525, 20.012015132892145], [95.5520674422587, 20.011722458424742], [95.55211741128954, 20.01123704845105], [95.55228159332091, 20.010737361739928], [95.5523450458872, 20.010634250870055]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
