
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Lan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Lan</div><div class="name-mm">ကုန်းလန်း</div></div>
        <span class="pcode-badge">MMR005036025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40933407980401, 26.267507549933555], [95.41711439990968, 26.24688719978451], [95.429870640118, 26.21710206011204], [95.43001175993481, 26.216849790385595], [95.44329827999167, 26.1931152597615], [95.44647203965297, 26.176330529830125], [95.45129387980876, 26.16888428987812], [95.45489496043416, 26.15570063967283], [95.44830335971233, 26.15570063967283], [95.41491696044943, 26.157897990100196], [95.38092036038637, 26.157714839568257], [95.38085268010718, 26.15761152005564], [95.36450183978815, 26.170715340140873], [95.34832776031794, 26.18151858021838], [95.34604319993377, 26.18382329980551], [95.3344728003795, 26.195495579957083], [95.31628416038575, 26.20629882003459], [95.30871587973411, 26.213684040086434], [95.3093260796349, 26.214111360151207], [95.30925696044045, 26.21416580960448], [95.33770740007651, 26.23950197973261], [95.35369859971064, 26.258728049759725], [95.3826904797819, 26.280273420082324], [95.39636363997005, 26.298363419736063], [95.39648423995578, 26.298522990044034], [95.4008787600468, 26.289917009562373], [95.40933407980401, 26.267507549933555]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
