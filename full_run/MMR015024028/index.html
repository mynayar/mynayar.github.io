
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Pat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Matman</div><div class="name-mm">မက်မန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Pat</div><div class="name-mm">နောင်ပတ်</div></div>
        <span class="pcode-badge">MMR015024028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.12083489411515, 22.14793051328263], [99.1208860637409, 22.140062296138126], [99.1243300202143, 22.136887838602945], [99.125230888195, 22.13034264110007], [99.12769902628906, 22.12849531400758], [99.13351202006373, 22.12788869610648], [99.13809336261863, 22.125249321698902], [99.14396442022189, 22.11842537123397], [99.13728481274399, 22.117928531776386], [99.13067061475715, 22.117420331183382], [99.12716497108659, 22.115041064993193], [99.12446766505076, 22.114040484680686], [99.12001228873618, 22.114407047447344], [99.11812774410015, 22.111408642095228], [99.11705575671783, 22.106788993817077], [99.11240380209387, 22.103786561300808], [99.1061262509258, 22.104897679084672], [99.09978668880473, 22.10213894575577], [99.0994719197933, 22.101796527987403], [99.08421647441082, 22.108265349666226], [99.08912059084264, 22.128062783270877], [99.09103646785877, 22.14901891778885], [99.09108174962313, 22.149514219405773], [99.09533834428919, 22.14765198605039], [99.10172314230925, 22.14898234415989], [99.10917210540839, 22.148982497044642], [99.11768510408433, 22.153505445719816], [99.12116281211416, 22.151095065684785], [99.12110929525784, 22.150656266673423], [99.12083489411515, 22.148406405731066], [99.12083783220027, 22.14795460432157], [99.12083489411515, 22.14793051328263]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
