
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnaw Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnaw Pin</div><div class="name-mm">နှောပင်</div></div>
        <span class="pcode-badge">MMR009020011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00223104712518, 21.42205220084844], [94.99090626681084, 21.42382169791307], [94.98555095511256, 21.429391222726792], [94.98212355515801, 21.438816571927305], [94.98040985473108, 21.44202975966573], [94.97398348105287, 21.445457158720956], [94.95941703057156, 21.451669321981683], [94.95376863071778, 21.456953310247115], [94.9527764437779, 21.45788148434309], [94.95449014420484, 21.470091595950464], [94.95920281925476, 21.473947421236574], [94.96533705626018, 21.479191202611958], [94.96562919383229, 21.47887430760329], [94.97998143029884, 21.479088519819356], [94.99519051742851, 21.47758903340724], [95.00183110422216, 21.47716060807568], [95.00418744219678, 21.47459005788494], [95.0044016544129, 21.46709262132748], [95.00611535394052, 21.46152309561444], [95.01018539144275, 21.458309908775334], [95.01165419208735, 21.458289508554003], [95.00787143491885, 21.43733549193945], [95.00223104712518, 21.42205220084844]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
