
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kyawng (Kywe Kone)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kyawng (Kywe Kone)</div><div class="name-mm">မန်ကျောင်း (ကျွဲကုန်း)</div></div>
        <span class="pcode-badge">MMR015012002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.02878598168775, 22.422940437651107], [97.02810433334838, 22.438618364745764], [97.02810433334838, 22.458797166655984], [97.02486131060107, 22.467805561377588], [97.02089761793076, 22.480417312009365], [97.01528355779004, 22.487378747231446], [97.02119074205916, 22.49462653558618], [97.02303430369022, 22.496345711985043], [97.02450097563957, 22.49771342793241], [97.04504011430987, 22.505640815071615], [97.06125522265046, 22.51320786635], [97.07075737755099, 22.518651524748122], [97.0731463033593, 22.51392853717232], [97.07638932430791, 22.505640815071615], [97.07819100271269, 22.496272085388455], [97.07688323287493, 22.489733234401285], [97.07422731004237, 22.480777647870184], [97.07422731004237, 22.473931268313436], [97.07386697418156, 22.469607238883043], [97.07494798086469, 22.464562538630332], [97.07228031828214, 22.45657243726822], [97.06449824359913, 22.447987094428925], [97.05765186494165, 22.44150105073294], [97.05188649296736, 22.433213327732915], [97.04864347111936, 22.421682583784275], [97.0464494535795, 22.41792141124421], [97.03675239130985, 22.421682583784275], [97.02878598168775, 22.422940437651107]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
