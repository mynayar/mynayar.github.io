
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Ma Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gon Ma Ni</div><div class="name-mm">ဂုမ္မဏီ</div></div>
        <span class="pcode-badge">MMR009012004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.10567034760851, 19.572310267704722], [95.11851438862817, 19.572278622360557], [95.11666900587, 19.571385576683042], [95.11879588632115, 19.56606837555512], [95.12037636028089, 19.55721772102106], [95.11500274827824, 19.549315349423864], [95.10267504761543, 19.541412977826724], [95.10255541619955, 19.541330033354427], [95.07896793462254, 19.52497604630753], [95.07074946841328, 19.524027760672652], [95.05462863060689, 19.544257832033395], [95.04672625990901, 19.551844108119155], [95.03787560357631, 19.553108488366092], [95.03667022874811, 19.5527249589897], [95.02965713826637, 19.55784991024524], [95.02649618944764, 19.56606837555512], [95.02712837867182, 19.570177609109408], [95.02886460621664, 19.573567385926196], [95.02914063603157, 19.573276280775815], [95.04573754705024, 19.56753119660749], [95.0561458030864, 19.566823187340276], [95.05759142820193, 19.565027087430167], [95.065206998804, 19.56753119660749], [95.06839827456076, 19.565575255693545], [95.06901678060001, 19.56602223493826], [95.07478214178246, 19.571042080627592], [95.08244225400688, 19.57423379615284], [95.09233656637952, 19.573276280775815], [95.09514430466601, 19.570745753114068], [95.10223087785278, 19.572318768096693], [95.10567034760851, 19.572310267704722]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
