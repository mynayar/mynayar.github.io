
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Si Thar Ward</div><div class="name-mm">စီသာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR008003701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13421101712481, 18.710524432756415], [95.13478231145456, 18.708802085347997], [95.13472970651083, 18.70876872589605], [95.13366052411396, 18.708184635112843], [95.13297743416132, 18.70788763940311], [95.1322052456756, 18.707501545160255], [95.13169379223478, 18.7071229368741], [95.12907165153553, 18.7062480817836], [95.12909803224846, 18.70643958611805], [95.12909696025656, 18.70654933128668], [95.12868235210891, 18.70669182616689], [95.12726736779484, 18.707609654462033], [95.12799890332678, 18.707994445587246], [95.1284280679011, 18.708240747412617], [95.12849865119188, 18.708240367898725], [95.12898741743544, 18.70823774187835], [95.12938011000415, 18.70801690255803], [95.1298092404042, 18.7081151903638], [95.13036822751172, 18.708391988199764], [95.13071235489133, 18.708605395522625], [95.13082441851219, 18.70919783561169], [95.13083831483641, 18.70952736609513], [95.13133198238512, 18.709833504312826], [95.13183998692591, 18.709301614677827], [95.13239461861684, 18.709653503206653], [95.13325656393931, 18.709970555596726], [95.13421101712481, 18.710524432756415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
