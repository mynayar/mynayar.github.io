
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sam Hpu (Me Nei Taung)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopong</div><div class="name-mm">ဟိုပုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sam Hpu (Me Nei Taung)</div><div class="name-mm">စံဖူး (မဲနယ်တောင်)</div></div>
        <span class="pcode-badge">MMR014003005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.26473397889009, 20.732392423671456], [97.30838463744112, 20.722034641185815], [97.32170178660823, 20.72869321621903], [97.34685640429967, 20.73387210791151], [97.36535244515926, 20.731652582900438], [97.38088912023676, 20.730172898660385], [97.38580784795386, 20.72927858493881], [97.38606801192924, 20.72869321621903], [97.38088912023676, 20.70131907441578], [97.37497038687394, 20.678383982634728], [97.35869387012605, 20.651749683401192], [97.34907592931074, 20.625115383268394], [97.33958770940535, 20.62471695212571], [97.31954498481326, 20.62255017055395], [97.30491921325114, 20.6241752571824], [97.29787717539136, 20.630133905155674], [97.30166904179288, 20.648009848176002], [97.30058565100705, 20.658302056594664], [97.29246022326078, 20.660468838166423], [97.28054292731429, 20.65667697176491], [97.27295919361194, 20.648009848176002], [97.26266698429396, 20.64746815323275], [97.24858290767509, 20.648009848176002], [97.25779172710656, 20.692428857805567], [97.25616664137743, 20.700554285551902], [97.25345816486248, 20.717346838685728], [97.2565897337293, 20.72152536500363], [97.26473397889009, 20.732392423671456]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
