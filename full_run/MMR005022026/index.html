
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Net</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tigyaing</div><div class="name-mm">ထီးချိုင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Net</div><div class="name-mm">ပေါက်နက်</div></div>
        <span class="pcode-badge">MMR005022026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.23080548018879, 23.713360110180986], [96.23080548018879, 23.7228444899813], [96.23187252040054, 23.730313409935945], [96.23133900029467, 23.740983359694326], [96.22920491987122, 23.752720349664457], [96.22795247992309, 23.762323260110406], [96.23313143996404, 23.762323260110406], [96.24147516015057, 23.750052839966656], [96.25267871994703, 23.7415168798002], [96.26601600043813, 23.737248899716974], [96.27455195970526, 23.737248899716974], [96.28181460036359, 23.735865600317254], [96.28267139976532, 23.731297109973696], [96.28687259979068, 23.72529528015309], [96.29227440014353, 23.719593510032496], [96.29347463984283, 23.7138917399119], [96.29463059962251, 23.707918079555782], [96.28968854888745, 23.702426746297363], [96.28654356033712, 23.69893221015343], [96.28021487911343, 23.694291195782114], [96.2763501604316, 23.69145708038002], [96.27081767959231, 23.69456909978419], [96.2606811600076, 23.69990412007911], [96.24947760021115, 23.704705620268214], [96.2372073599318, 23.710040549731616], [96.23080548018879, 23.713360110180986]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
