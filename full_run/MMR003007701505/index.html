
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (5) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyainseikgyi</div><div class="name-mm">ကြာအင်းဆိပ်ကြီး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (5) Ward</div><div class="name-mm">အမှတ် (၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR003007701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.12490580704895, 16.04225383345249], [98.1244596745779, 16.042129594030143], [98.12350503618484, 16.04191712877804], [98.12279487835599, 16.041759962701235], [98.12217494549714, 16.041626080487504], [98.12144441428791, 16.04151257165421], [98.12097582654013, 16.041524213585717], [98.12083030239484, 16.041538766000315], [98.12072261452732, 16.041626080487504], [98.12055671700193, 16.04175414173534], [98.12031805740355, 16.04195787553863], [98.11998708097434, 16.042219172719854], [98.12028496062487, 16.042583545218122], [98.12056140339809, 16.042893351774353], [98.12091410624669, 16.043284184660536], [98.12127634160487, 16.0436130562357], [98.12183875966082, 16.044065850433185], [98.12215333247161, 16.044323228187693], [98.1224011777166, 16.044590138451554], [98.12271098427283, 16.044857048715357], [98.12337349367783, 16.04434229320657], [98.12435057589352, 16.0433080159342], [98.12457935611974, 16.042983910613884], [98.124803370091, 16.042602610236997], [98.12490580704895, 16.04225383345249]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
