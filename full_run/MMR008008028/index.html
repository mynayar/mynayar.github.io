
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Hnyin Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gon Hnyin Tan</div><div class="name-mm">ဂုံညင်းတန်း</div></div>
        <span class="pcode-badge">MMR008008028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59091856923663, 17.759437684901286], [95.59699071884665, 17.76184038832332], [95.60729018569356, 17.76433722917983], [95.61353228738523, 17.767458279575976], [95.62195912381458, 17.77089143519163], [95.62227122903403, 17.773700381267645], [95.6338191167589, 17.777445642102748], [95.64692752968182, 17.78119090293785], [95.65785120696768, 17.78524826809314], [95.66721435905549, 17.78556037421197], [95.67002330513151, 17.786496688971056], [95.67104629565006, 17.78112598537598], [95.66967204882604, 17.777965219119608], [95.66716905930468, 17.771707745316235], [95.65903434515894, 17.761070041649134], [95.66071535882679, 17.756539887605754], [95.66075272385916, 17.74886063241229], [95.65160910617539, 17.745923030223707], [95.64162174364861, 17.74124145373014], [95.6391249027921, 17.741865664169097], [95.62570438464968, 17.740617244190503], [95.61446860304363, 17.739993033751546], [95.60635387093447, 17.74092934941001], [95.59605440408751, 17.739993033751546], [95.58107335984772, 17.73936882331259], [95.5731756818123, 17.74069048317932], [95.59091856923663, 17.759437684901286]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
