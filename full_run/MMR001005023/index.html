
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htaw Gawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htaw Gawt</div><div class="name-mm">ထောဂေါ့</div></div>
        <span class="pcode-badge">MMR001005023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.34385663537546, 25.953718507303336], [98.34858424816457, 25.951092055254207], [98.35909005456244, 25.958446120092447], [98.39691095777454, 25.97052779682042], [98.40899263540189, 25.9631737328815], [98.41056850573199, 25.95214263607386], [98.40830416930203, 25.94437919444431], [98.40689147376258, 25.939535668036683], [98.40111328015382, 25.926928700898884], [98.39953740982367, 25.91116999130213], [98.40129678681734, 25.89751502709686], [98.39638566826403, 25.89908831277546], [98.37747521620832, 25.908018248843177], [98.36801998973078, 25.917473475320662], [98.35436244177333, 25.917473475320662], [98.34385663537546, 25.91116999130213], [98.34333134496563, 25.92640340958974], [98.33492670020712, 25.933232184018152], [98.33912902168709, 25.943212700905462], [98.34385663537546, 25.953718507303336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
