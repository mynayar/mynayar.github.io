
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Sauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Sauk</div><div class="name-mm">ချောင်းစောက်</div></div>
        <span class="pcode-badge">MMR008011010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.610113626143, 18.388775344106875], [95.61275631185435, 18.388315452396284], [95.61369506377622, 18.389676537642174], [95.61462973907123, 18.391938946825007], [95.61747074507889, 18.391953517640786], [95.62186779406352, 18.39530060094205], [95.62662324626586, 18.39450802572486], [95.63005773827405, 18.387903231948656], [95.63122344310744, 18.38569072794479], [95.63124219307281, 18.382077796053522], [95.62840453703978, 18.381612633416353], [95.62909396991085, 18.376779434823106], [95.626749309633, 18.373369020364066], [95.62198893903837, 18.373369020364066], [95.61744171856054, 18.372232215244594], [95.61204189491758, 18.37194801418957], [95.60777887729341, 18.37535842864861], [95.60524036455126, 18.3775796263987], [95.60019123064086, 18.382928841592843], [95.60152503315379, 18.38737484877032], [95.60601629331734, 18.3894883832823], [95.610113626143, 18.388775344106875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
