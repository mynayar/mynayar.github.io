
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Shey</div><div class="name-mm">ချောင်းရှည်</div></div>
        <span class="pcode-badge">MMR005009062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25663683971845, 22.8334880698186], [95.26033584032683, 22.833340019826096], [95.26705164012117, 22.832119080431255], [95.27040935970427, 22.830592769940438], [95.27285124029254, 22.824487709640152], [95.27559875997486, 22.821129900124845], [95.27966208044074, 22.821985349644194], [95.28384059956409, 22.82082461986039], [95.29208244005264, 22.815940499854207], [95.29407539975995, 22.816878390225554], [95.29449443976665, 22.810592880057413], [95.29452431974164, 22.810140719818435], [95.29055603962956, 22.809835439553922], [95.28475644035751, 22.80922487992433], [95.27956704008687, 22.805561880076766], [95.2752934797104, 22.801288319700234], [95.27224104039175, 22.798540979882375], [95.26726439993217, 22.798248300019054], [95.26705164012117, 22.79823569961792], [95.26430412043885, 22.80037256973833], [95.26186223985053, 22.806782910303127], [95.2639988401744, 22.812277500006644], [95.2649146800685, 22.81899311993658], [95.2624728003795, 22.823571869746047], [95.25880979963262, 22.82906646034894], [95.25632147985249, 22.832685809802342], [95.2569781198444, 22.832729550128704], [95.25663683971845, 22.8334880698186]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
