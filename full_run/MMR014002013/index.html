
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tone Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tone Lel</div><div class="name-mm">တုံးလည်</div></div>
        <span class="pcode-badge">MMR014002013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.81278362276606, 20.513483613278197], [96.81290435944868, 20.513376808892644], [96.83538748614365, 20.502006030953623], [96.8495357932423, 20.497458361714052], [96.83350083169807, 20.490541319726162], [96.82156845142293, 20.486439564034697], [96.81522937403645, 20.47972759894958], [96.8141895266254, 20.479659782872716], [96.81549119995896, 20.47853973841825], [96.78842676128608, 20.463700558633946], [96.78594738796164, 20.478883357680843], [96.78403951491174, 20.482224802232906], [96.78390241506446, 20.48235158865492], [96.78335390326009, 20.482739644319167], [96.78212830897434, 20.484666483171736], [96.78199132244163, 20.484922533648046], [96.78157968295608, 20.484922732398218], [96.7782983293045, 20.48672638121758], [96.77809273529158, 20.486982464968833], [96.77487721740971, 20.48852755330398], [96.77446834873535, 20.488786278364103], [96.77433124798875, 20.488915608068908], [96.77090991216278, 20.49046079532951], [96.76749626284231, 20.49495870957685], [96.76545125487155, 20.498429501820112], [96.76879584884938, 20.500585344937747], [96.7812960979366, 20.49980427924413], [96.7814265688811, 20.499737066612397], [96.79418710335221, 20.49316348470711], [96.79926509290976, 20.5041017552918], [96.8074682652483, 20.50918034559652], [96.81278362276606, 20.513483613278197]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
