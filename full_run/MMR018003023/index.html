
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Myo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Myo</div><div class="name-mm">ရွှေမြို့</div></div>
        <span class="pcode-badge">MMR018003023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21972219032688, 20.01933928627909], [96.2203338929948, 20.025456321951765], [96.22263635708225, 20.032939328886982], [96.21890589998736, 20.03346159307813], [96.21890589998736, 20.04008578702951], [96.21890589998736, 20.047600700112298], [96.21732381264388, 20.059070829755058], [96.2165889936872, 20.07109104321711], [96.22839842135011, 20.062630526277815], [96.23146552141674, 20.061735955350116], [96.23421368501363, 20.05962715397004], [96.23812937816831, 20.05595619242439], [96.24400291700107, 20.051551037850174], [96.2499497469833, 20.048289873079227], [96.24885674424343, 20.044698576178405], [96.24102535883333, 20.040130268397206], [96.23808858941692, 20.034256729564447], [96.2335202807364, 20.029035806257525], [96.23417289716156, 20.022509651898986], [96.23433881578376, 20.01952310680599], [96.2344992053741, 20.016636113066227], [96.23516946290044, 20.015806269044106], [96.23170044322092, 20.015496482276887], [96.22917741140844, 20.016620433386322], [96.22842228486064, 20.01673320387431], [96.22641394224968, 20.01889841343109], [96.22204671208613, 20.020048627442236], [96.21972219032688, 20.01933928627909]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
