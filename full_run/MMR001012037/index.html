
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hka Rein Mu Dan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hka Rein Mu Dan</div><div class="name-mm">ခရိန်းမူးဒန်</div></div>
        <span class="pcode-badge">MMR001012037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.64534393377556, 24.306737719070554], [97.65474771543478, 24.300719298556828], [97.66047149106652, 24.297175872568516], [97.66695956723032, 24.291186879670818], [97.67494488959505, 24.286695135672005], [97.66791300777913, 24.28454479460663], [97.6600138323725, 24.276645619199996], [97.6630230421797, 24.270627198686327], [97.67092221758634, 24.26047111614912], [97.67994984790721, 24.25294809118151], [97.66759682143623, 24.246336665804506], [97.64517430634919, 24.247605864619004], [97.62994391877692, 24.257336389762656], [97.61487568256678, 24.257461906341973], [97.61337107811283, 24.263856477294667], [97.60697650716014, 24.2687464428941], [97.60396729735294, 24.27363640939285], [97.60329993114698, 24.276973235026844], [97.60246269199968, 24.28115943436046], [97.60547190180688, 24.286801702636524], [97.60682522860145, 24.291774804263866], [97.60960956472968, 24.297710088749625], [97.61073801874466, 24.303352357925007], [97.61788489327324, 24.30372850926335], [97.62653637135651, 24.304480811040662], [97.64083011861516, 24.305233113717293], [97.64534393377556, 24.306737719070554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
