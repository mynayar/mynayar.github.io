
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Twin Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Twin Ma</div><div class="name-mm">တွင်းမ</div></div>
        <span class="pcode-badge">MMR009020080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80887937298473, 21.456375216143385], [94.8198029720296, 21.4489554126622], [94.83059161341231, 21.443747103246267], [94.83505587772663, 21.44114294808861], [94.82022086630002, 21.420077231179334], [94.82106084927881, 21.42008657873265], [94.8194435067125, 21.419575785394215], [94.81449243218003, 21.418012121562185], [94.80662660993016, 21.415668856132868], [94.80127108419322, 21.417677152878355], [94.7888890473917, 21.421114303282536], [94.78749919193422, 21.42184003728795], [94.78549368128841, 21.422887243851278], [94.77934697608214, 21.421526183786398], [94.77549766278696, 21.424371338366598], [94.77064410444194, 21.431735358699882], [94.76806712859519, 21.437605069118717], [94.7676315041906, 21.438597313615162], [94.76520676827778, 21.43829856692537], [94.76981185293471, 21.441001552179955], [94.78464117165282, 21.448835908950116], [94.79163613360072, 21.453032885759114], [94.80702505006604, 21.455551072923754], [94.80887937298473, 21.456375216143385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
