
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Kat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Kat</div><div class="name-mm">နမ့်ကတ်</div></div>
        <span class="pcode-badge">MMR015009006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.90808716029426, 23.910692695411626], [97.9213139455822, 23.9001988670841], [97.92302121135987, 23.898844361278293], [97.9225759776993, 23.897453005751686], [97.91731050557541, 23.88099840255427], [97.91647827475265, 23.879472647844466], [97.91017212244554, 23.86791136831505], [97.90932785239852, 23.868354263738354], [97.89565740996159, 23.87552564389341], [97.88802322429245, 23.883612205638826], [97.88667201090465, 23.885043486567724], [97.88667201090465, 23.889277546021958], [97.8769162211068, 23.900936904714456], [97.87130166903688, 23.90580736042142], [97.86477917581834, 23.91146542528918], [97.8571666943875, 23.918069024765714], [97.84499198099519, 23.935402514714326], [97.85754585215943, 23.94304520077543], [97.86811221530655, 23.94947790927813], [97.86813238710005, 23.949544188413597], [97.87453675976371, 23.93829444303418], [97.88413094228923, 23.931386631687758], [97.88604693531789, 23.93000711573586], [97.88643406468037, 23.929728382558835], [97.90808716029426, 23.910692695411626]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
