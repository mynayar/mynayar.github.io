
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Bet Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bilin</div><div class="name-mm">ဘီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Bet Swea</div><div class="name-mm">တဘက်ဆွဲ</div></div>
        <span class="pcode-badge">MMR011010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.26923198756623, 17.182922004646855], [97.27528799974147, 17.186848000434907], [97.27914100025703, 17.189370999871812], [97.28244399969088, 17.189091000449366], [97.28877500026613, 17.18825000033729], [97.29290400001963, 17.187688999647662], [97.30116200042602, 17.187688999647662], [97.30776800019311, 17.186286999745278], [97.31272300026632, 17.187688999647662], [97.31574999956291, 17.184043999730875], [97.31822799962254, 17.180118000345487], [97.32070499963606, 17.176193000106935], [97.31685200001982, 17.172827999612537], [97.31409899986903, 17.168902000227206], [97.31052100034395, 17.16357500008621], [97.30941999993308, 17.159369000379115], [97.30831258825538, 17.158143363825218], [97.30780902186893, 17.15902460410223], [97.3031530778523, 17.1600592588278], [97.29470339864298, 17.161093913553316], [97.28970257091697, 17.163508106713778], [97.28857299544745, 17.163298927103824], [97.28801733942873, 17.164940298655893], [97.28143946595867, 17.173611131948235], [97.27635656430408, 17.17809604469676], [97.26923198756623, 17.182922004646855]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
