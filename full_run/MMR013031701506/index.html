
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Pin Chaung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikgyikanaungto</div><div class="name-mm">ဆိပ်ကြီး/ခနောင်တို</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pan Pin Chaung Ward</div><div class="name-mm">ပန်းပင်ချောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013031701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1070054449454, 16.76054542323277], [96.10659637302427, 16.760571159131757], [96.10593012377626, 16.760594953394445], [96.10547802559046, 16.760523569707004], [96.10469280412968, 16.760380802332236], [96.10402655488167, 16.76023803405809], [96.10359825185787, 16.760095266683265], [96.103074770884, 16.75995249930844], [96.10267026212296, 16.75995249930844], [96.10221816483647, 16.76016665037065], [96.10131397026356, 16.760785310193967], [96.10060013069153, 16.761403970017227], [96.099743524644, 16.762046425002552], [96.09911822062946, 16.762437200216652], [96.09932267969799, 16.76278991792043], [96.0996646882748, 16.764061356046795], [96.09966773967449, 16.764461136172542], [96.09985389664007, 16.764837265027836], [96.09964214676774, 16.76516255430846], [96.0997760774041, 16.765412520871166], [96.09957122802979, 16.765605926372473], [96.09944648756539, 16.765868758636373], [96.09980773893608, 16.76595179304087], [96.09996037637035, 16.766273449060463], [96.09987097116846, 16.766601772653758], [96.100480287935, 16.766344831848585], [96.10325949882684, 16.765259798001352], [96.10573413812006, 16.76417476415412], [96.10720252957316, 16.76533699040982], [96.10695152159548, 16.764339065795298], [96.10688686393769, 16.76360797902504], [96.10698890641294, 16.761772156060204], [96.10699272133706, 16.760707855183398], [96.1070054449454, 16.76054542323277]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
