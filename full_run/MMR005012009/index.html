
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Ywar Thit</div><div class="name-mm">ကျွန်းရွာသစ်</div></div>
        <span class="pcode-badge">MMR005012009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18653403961429, 22.04180973033482], [95.18464440031886, 22.039224120097117], [95.1797444396542, 22.03473240038005], [95.17892795955777, 22.03146575963717], [95.18178636025237, 22.02534080993047], [95.18406263967915, 22.02199316994887], [95.17787351974721, 22.017304530179956], [95.17403879975086, 22.014459450243464], [95.17114080010788, 22.01775272980467], [95.1612620397114, 22.021294230344495], [95.15992212000987, 22.02177456004796], [95.14737324008303, 22.022535060045016], [95.13971101625043, 22.022489244083374], [95.14021894974479, 22.028020075566076], [95.14159913569159, 22.03511817986015], [95.14357083182847, 22.04162477936012], [95.1491786398824, 22.04238131964223], [95.15120255965047, 22.04249373040136], [95.15839968020111, 22.04249373040136], [95.1634796401733, 22.04291708985187], [95.17321692012484, 22.043763809652148], [95.17872024044681, 22.04418717000192], [95.1832396799673, 22.045024079997347], [95.18528232002313, 22.042811250438888], [95.18653403961429, 22.04180973033482]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
