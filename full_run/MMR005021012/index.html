
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kone</div><div class="name-mm">အုပ်ရှစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR005021012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06549059981137, 24.138488789725898], [96.07312008022757, 24.138488789725898], [96.07788071971947, 24.13128663027379], [96.08990472022674, 24.127929720080544], [96.09948719987443, 24.125122079820187], [96.10968024005109, 24.123291029557436], [96.11529551967254, 24.12292482022434], [96.11529551967254, 24.11547849034008], [96.11492903964353, 24.107727060055822], [96.11328131977717, 24.099670440338627], [96.1130980802123, 24.093078569820193], [96.11248715995453, 24.0875246698277], [96.1124637595949, 24.08733737971636], [96.11244756010689, 24.08726465963639], [96.11176356004034, 24.08738913030419], [96.11054424032449, 24.087610260105464], [96.10834679996492, 24.088945770430996], [96.10759259971877, 24.08940404965722], [96.10463519985467, 24.08894918965342], [96.10421759966255, 24.08778189032205], [96.09930432003841, 24.089111369793955], [96.09411635958242, 24.090515099991933], [96.0850828800709, 24.094909710015145], [96.0748901996231, 24.10150148970206], [96.06628404017636, 24.103881809897644], [96.06768804017099, 24.107727060055822], [96.06329352007992, 24.115295429740343], [96.05908187982493, 24.122070270026995], [96.05688480009348, 24.127929720080544], [96.06549059981137, 24.138488789725898]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
