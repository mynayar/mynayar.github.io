
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Ta Naw (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Ta Naw (South)</div><div class="name-mm">ကျုံတနော် (တောင်)</div></div>
        <span class="pcode-badge">MMR017009060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5279828802058, 17.50731119975211], [95.53130819991355, 17.508567419550843], [95.53166446184548, 17.508769295766456], [95.53405211960967, 17.510122260134267], [95.53422339099677, 17.51026911222982], [95.53437216044688, 17.510396670270154], [95.53791383995178, 17.50902858020487], [95.54030531983472, 17.507633669658162], [95.54120207971226, 17.505640799883054], [95.54209883958981, 17.501555429839243], [95.54170032481022, 17.49886514930722], [95.541301800138, 17.49617477974232], [95.53856183835819, 17.49652351434878], [95.53582152044686, 17.496872280431433], [95.5323341995637, 17.49637403983013], [95.53083947955838, 17.50005458994741], [95.52934115956691, 17.504144909859747], [95.52864743962772, 17.50603932005862], [95.52831515991676, 17.506675260355053], [95.5279828802058, 17.50731119975211]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
