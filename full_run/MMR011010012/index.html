
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yun Da Lin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bilin</div><div class="name-mm">ဘီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yun Da Lin Kone</div><div class="name-mm">ယွန်းဒလင်းကုန်း</div></div>
        <span class="pcode-badge">MMR011010012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.21252797798388, 17.181240002624065], [97.20977600036218, 17.175632000316625], [97.20784899963166, 17.166938999635192], [97.21060099973641, 17.16357500008621], [97.21362899188455, 17.156284009199737], [97.21148098455984, 17.158394003080844], [97.20577297494287, 17.154905010357993], [97.20196697479611, 17.15180301030074], [97.19473599297174, 17.148508007638497], [97.19029606341263, 17.155173154917236], [97.1871067913454, 17.16474097021967], [97.17634299913016, 17.16992353564268], [97.17155909237829, 17.17829537403236], [97.17178997982376, 17.187690007787694], [97.17536897579765, 17.190494010290365], [97.17894698431593, 17.197223006736408], [97.19348533368128, 17.198228321979514], [97.20385046722532, 17.194640391241137], [97.212802955592, 17.186567027946012], [97.21252797798388, 17.181240002624065]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
