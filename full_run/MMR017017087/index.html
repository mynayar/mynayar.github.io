
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar Kone</div><div class="name-mm">ကံသာကုန်း</div></div>
        <span class="pcode-badge">MMR017017087</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11317251999589, 16.536069900205803], [95.11090596044176, 16.53463737011856], [95.10919703991152, 16.533023220145537], [95.1068156396301, 16.530422940166602], [95.10734232039181, 16.52474312969173], [95.11005707957065, 16.521463800414097], [95.10641099956803, 16.522742159722952], [95.10488172041511, 16.52327828966139], [95.10256368006986, 16.525185839854657], [95.10024527999576, 16.52709347998018], [95.09876999973574, 16.531570170227212], [95.09582628035861, 16.53539462985833], [95.09282351958984, 16.536311369973816], [95.09049219715723, 16.536962882930766], [95.09247835169464, 16.53776038823139], [95.09423795981405, 16.538168159732834], [95.09799167967236, 16.539037830231734], [95.09997671994972, 16.539330150366197], [95.10387947995412, 16.539904889998752], [95.10933168011303, 16.53838073967944], [95.11134228002226, 16.537818690380334], [95.11317251999589, 16.536069900205803]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
