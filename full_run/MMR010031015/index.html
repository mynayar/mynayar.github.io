
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Taung</div><div class="name-mm">ရွှေတောင်</div></div>
        <span class="pcode-badge">MMR010031015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00847390134953, 21.233456002292712], [96.00684745674477, 21.237431753972317], [96.00442473531336, 21.24560844217592], [96.003213372799, 21.253179449571974], [96.00260769289076, 21.261658979078675], [96.00109349087194, 21.269229987374047], [96.00079065136754, 21.277406674678332], [95.99927644934871, 21.282554959743663], [96.00472757481776, 21.293154371177366], [96.00745313755232, 21.295879933911863], [96.00745313755232, 21.300119698665185], [96.0106250581, 21.297134362261033], [96.01482378678838, 21.301033182335573], [96.0208849421864, 21.302245412695697], [96.02735017287222, 21.302245412695697], [96.02815832704522, 21.293759795678056], [96.02977463539116, 21.28891087333818], [96.03381540535673, 21.28487010337261], [96.0382602524088, 21.28446602628611], [96.04149286730205, 21.28446602628611], [96.04391732892168, 21.280021179234097], [96.04634179144057, 21.274364101821902], [96.04432140600812, 21.26951517768333], [96.03947248276893, 21.265070330631318], [96.03341132827023, 21.259817331204943], [96.02856240413172, 21.25456432997987], [96.02532978923847, 21.250523560014358], [96.02659002900668, 21.24548260004201], [96.01967271092695, 21.236380865584522], [96.01684417222083, 21.23274417360477], [96.01239932516876, 21.233148250691272], [96.01037894063563, 21.235572712310898], [96.00847390134953, 21.233456002292712]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
