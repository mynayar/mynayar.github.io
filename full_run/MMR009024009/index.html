
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Oke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Oke</div><div class="name-mm">ကျောက်အုပ်</div></div>
        <span class="pcode-badge">MMR009024009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.1776244338206, 21.819502666115227], [94.18003493796209, 21.813585974213368], [94.17950317782947, 21.812859235665258], [94.17950317782947, 21.808729041612025], [94.18144679893066, 21.799982748904768], [94.18168975078146, 21.791965315347056], [94.17853136772851, 21.784190831841443], [94.17901727322862, 21.777388160235432], [94.1802237928938, 21.77596227433952], [94.17197164887256, 21.77495863543271], [94.17053166700288, 21.774032931774457], [94.17027098142074, 21.77422977718254], [94.16589783461745, 21.775687492783618], [94.15933811486218, 21.77811701758634], [94.15180658590526, 21.780789496038437], [94.14580478216504, 21.782174528431767], [94.14840525010226, 21.787592167644448], [94.14767639185209, 21.801197511755788], [94.14840525010226, 21.811158568213386], [94.14899406682281, 21.81477558842272], [94.15399315885725, 21.815045808617242], [94.1598240203623, 21.815045808617242], [94.17342936357431, 21.818204191670134], [94.1776244338206, 21.819502666115227]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
