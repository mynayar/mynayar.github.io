
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pauk</div><div class="name-mm">ကံပေါက်</div></div>
        <span class="pcode-badge">MMR005019006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8355804801551, 21.909423690351105], [94.83410519989513, 21.9075792302973], [94.83410519989513, 21.89997638959875], [94.8365640003284, 21.895714350436947], [94.83855804012154, 21.897043829908853], [94.84406099981533, 21.898492019890853], [94.84956432013735, 21.896174969699132], [94.85246052023689, 21.89385792040673], [94.85326943973291, 21.894397199770992], [94.85390880015109, 21.888644490251068], [94.85390880015109, 21.883431150027604], [94.84782623998905, 21.881693339675962], [94.84116479971578, 21.880534859995862], [94.83884784035558, 21.87792810040156], [94.83653088009612, 21.87532142984014], [94.83272639980356, 21.873690990446903], [94.82989626300218, 21.88152567277166], [94.82446680579852, 21.88738948813443], [94.8177342777148, 21.892601767157885], [94.80696371989984, 21.894535350026445], [94.81042764042331, 21.895849169603537], [94.8169443599943, 21.898238580146426], [94.8217233600451, 21.902148630055308], [94.82628492021297, 21.90692754017391], [94.83084684010964, 21.910403159977875], [94.8355804801551, 21.909423690351105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
