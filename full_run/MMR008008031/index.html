
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Lan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Lan Kone</div><div class="name-mm">အောင်လံကုန်း</div></div>
        <span class="pcode-badge">MMR008008031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56902444632118, 17.890758573249627], [95.5690382257336, 17.890798718985764], [95.57867877100853, 17.891372786824718], [95.58837006682518, 17.89090004200341], [95.59593400824792, 17.893500144815903], [95.59918308523123, 17.89811807089228], [95.60444344380994, 17.907446162910162], [95.60798903896301, 17.906973415390837], [95.6136619957046, 17.902718697609885], [95.61342562419327, 17.898463983426154], [95.60965852422157, 17.893755104414595], [95.60538893615052, 17.888536308004234], [95.60586168277052, 17.883336097882648], [95.6094072779236, 17.87931775610963], [95.60979514742814, 17.879310521063758], [95.60908479003109, 17.875758737675653], [95.608148475272, 17.86545927082875], [95.60323281963895, 17.8631184830316], [95.59223111717239, 17.860777695234503], [95.58930417105068, 17.862392561967226], [95.58544283112184, 17.864522956069607], [95.57771823121146, 17.870843082941974], [95.57514336427488, 17.876226895954517], [95.57420704861647, 17.881376628928308], [95.57186626081932, 17.885824127181763], [95.56902444632118, 17.890758573249627]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
