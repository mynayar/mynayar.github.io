
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Taw Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Taw Ma</div><div class="name-mm">ဝါးတောမ</div></div>
        <span class="pcode-badge">MMR005014009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38909919976834, 22.330322280049245], [95.3839112402116, 22.328674290386232], [95.37249743960524, 22.33648682960353], [95.36572260021791, 22.335876449838338], [95.3588865601667, 22.333129920309602], [95.35229496034418, 22.325317380192985], [95.34808332008919, 22.33007810961709], [95.3425292402323, 22.33648682960353], [95.33770740007651, 22.342529340256874], [95.34289535963319, 22.34967038987662], [95.35229496034418, 22.3535156400348], [95.36267088035692, 22.35491946016498], [95.37591564039457, 22.358276370358283], [95.38867187970357, 22.364501939812726], [95.38867187970357, 22.357482929993296], [95.38867187970357, 22.348083510046024], [95.38952651983305, 22.338073710333504], [95.38909919976834, 22.330322280049245]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
