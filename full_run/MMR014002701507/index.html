
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Ga Lar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Min Ga Lar Ward</div><div class="name-mm">မင်္ဂလာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014002701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.92892407189368, 20.657555560107767], [96.92802463563345, 20.657598390405838], [96.9279675285693, 20.659291376911483], [96.93275976303511, 20.65935443262822], [96.9326407899847, 20.65897847778922], [96.93251705801248, 20.658469273133903], [96.93249802232441, 20.658098077217062], [96.93235049574201, 20.657917238180687], [96.93225531730172, 20.657745916988233], [96.93216965670564, 20.657522247653674], [96.93190791599494, 20.65704635545245], [96.93153196115611, 20.65671798983368], [96.93118455984927, 20.65625161547655], [96.9308799888405, 20.65604222290807], [96.93074673902419, 20.655880419559708], [96.93071342657004, 20.65568054483515], [96.9307277531496, 20.654962624017912], [96.93073097643367, 20.654908535923198], [96.92919098927081, 20.654902825216823], [96.92895304317045, 20.654889500235356], [96.92894926443722, 20.654935793369305], [96.92892407189368, 20.657555560107767]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
