
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Yu Toke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Yu Toke</div><div class="name-mm">ခရုတုတ်</div></div>
        <span class="pcode-badge">MMR010015058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19660784297764, 21.345095769054524], [96.20081650467802, 21.342233878990385], [96.205757044552, 21.340952997982527], [96.21234443284936, 21.342050895732314], [96.21838287137246, 21.345161605723604], [96.22405534337946, 21.346808453247547], [96.22881289999538, 21.348272316614157], [96.23485133941784, 21.352297941996483], [96.23741309963492, 21.35193197637966], [96.23869398064278, 21.35046811301305], [96.23887696390085, 21.347540385380512], [96.23668116840128, 21.34571055459844], [96.23558326975217, 21.343331776740172], [96.23558326975217, 21.34003808259149], [96.23485133941784, 21.338940184841704], [96.23045974662006, 21.33820825270874], [96.22661710539518, 21.33546350923359], [96.22610239191192, 21.332983596315955], [96.22148206734357, 21.332983596315955], [96.20381611692034, 21.330265757858513], [96.19729330534182, 21.328906839079423], [96.1943036827688, 21.32265580981783], [96.19131406109511, 21.31803548524948], [96.18968335820045, 21.32211224338539], [96.1885962217383, 21.32591721560709], [96.19055354670888, 21.32842661999257], [96.19055354670888, 21.33225335131118], [96.19320282175289, 21.334902626355188], [96.1952633700086, 21.3372575371057], [96.1958520967969, 21.34226172379954], [96.19660784297764, 21.345095769054524]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
