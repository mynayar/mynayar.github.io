
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Lay Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Lay Pin</div><div class="name-mm">သရက်လေးပင်</div></div>
        <span class="pcode-badge">MMR009001052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08155154386873, 20.09305987911017], [95.09301633063922, 20.089875216068435], [95.1038662563227, 20.094075187619865], [95.11366618934323, 20.101775135314313], [95.12460621270662, 20.105243922968725], [95.12486611318064, 20.102125132568858], [95.12136613703763, 20.096175172945948], [95.12766609301582, 20.087425232588487], [95.13326605538418, 20.07727530321273], [95.1490159471283, 20.059775423397127], [95.15321591778041, 20.054175461028763], [95.1533285938396, 20.054281093597638], [95.15321591778041, 20.050675484885744], [95.14166599758778, 20.041575547273737], [95.13816602234414, 20.035275590396225], [95.13361605263879, 20.02967562892718], [95.12719771440305, 20.02923298531408], [95.12346612236371, 20.028975634418032], [95.11681616823165, 20.037375575722308], [95.11086620770936, 20.041225550019192], [95.09826629485366, 20.039825559202256], [95.08846636183318, 20.047525506896704], [95.08006641873033, 20.056975441763257], [95.07913628860888, 20.058835702905412], [95.07516645266969, 20.066775374783788], [95.07761643614964, 20.080075283947224], [95.07936642422118, 20.089175220659968], [95.08155154386873, 20.09305987911017]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
