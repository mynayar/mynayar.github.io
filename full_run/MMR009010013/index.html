
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Pin Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Pin Kan</div><div class="name-mm">ရုံးပင်ကန်</div></div>
        <span class="pcode-badge">MMR009010013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.63198012838029, 20.540843133004216], [94.63176358332277, 20.540646275005656], [94.63306226371253, 20.5370749016854], [94.63533495574364, 20.530906167585613], [94.6372829772277, 20.519542710128007], [94.63689757726144, 20.51671644400875], [94.63630896738499, 20.512399965286193], [94.63533495574364, 20.50168584712418], [94.63455399167344, 20.498757233659433], [94.63403627535388, 20.496815794313534], [94.61325738012403, 20.49454310228242], [94.60871199696118, 20.496166453219303], [94.59247848579355, 20.50233518821841], [94.5846863998575, 20.502659857866206], [94.57494629333684, 20.49973782564018], [94.5724262607634, 20.512022983873635], [94.57462162278972, 20.51337397602822], [94.58793310263064, 20.528958147000935], [94.59442650727755, 20.535126881100723], [94.60254326286133, 20.54291896613745], [94.61358205067114, 20.54291896613745], [94.62040012496584, 20.54649033855833], [94.62288590506051, 20.54755567275612], [94.62801065486786, 20.542430922049448], [94.63198012838029, 20.540843133004216]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
