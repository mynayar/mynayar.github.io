
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Yone Gyi Ward</div><div class="name-mm">ရုံးကြီးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46393584573838, 17.650376047695147], [95.46367707246378, 17.650303464947342], [95.46226367262625, 17.650003652860562], [95.46026492538135, 17.64958962664565], [95.45855171345721, 17.648961448940042], [95.45750727743246, 17.648529268515972], [95.45497018879104, 17.651771265826937], [95.45552503905776, 17.652130890999786], [95.45690988536313, 17.652716238407322], [95.45808058017798, 17.653358692878783], [95.45885106554414, 17.654116751061622], [95.45945114971744, 17.65365850496562], [95.46109297781135, 17.65233076572423], [95.46252065441496, 17.65133139210178], [95.46349147450525, 17.650617553800032], [95.46393584573838, 17.650376047695147]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
