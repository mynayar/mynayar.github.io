
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Zin</div><div class="name-mm">ရေဇင်း</div></div>
        <span class="pcode-badge">MMR010021034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4955890851682, 21.84512194462212], [95.49387094119106, 21.84591493532605], [95.49093923315917, 21.84796713067857], [95.48888703690727, 21.848846643357945], [95.484196304416, 21.85148518139607], [95.48167885469547, 21.85426762355206], [95.476473718987, 21.857779112815876], [95.47681004025122, 21.857974933896116], [95.47503284229191, 21.860818449012243], [95.4735764513922, 21.86284121405083], [95.48007170864253, 21.863432896910695], [95.48421103531109, 21.871435596875358], [95.48634045274974, 21.874559125803046], [95.49212997871558, 21.8750425923418], [95.49621630833605, 21.876404701016213], [95.49944118726103, 21.876404701016213], [95.50266606618607, 21.878163726374908], [95.50647728689734, 21.87845689726805], [95.50852948224986, 21.87611153012307], [95.51204753206798, 21.872300310311118], [95.51556558188616, 21.868782259593672], [95.517617778138, 21.866143721555545], [95.51791094903115, 21.86262567173742], [95.51380655742673, 21.85881445102615], [95.51106521968421, 21.856621381371724], [95.50940899492923, 21.855296401208022], [95.50647728689734, 21.85148518139607], [95.50559777421796, 21.847087617999193], [95.50501143333105, 21.842983227294155], [95.50178655260737, 21.8432763981873], [95.49768216190233, 21.8441559099673], [95.4955890851682, 21.84512194462212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
