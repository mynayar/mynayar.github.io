
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Hpyu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Hpyu Kone</div><div class="name-mm">ဇီးဖြူကုန်း</div></div>
        <span class="pcode-badge">MMR008008039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49326828480355, 17.702287051306428], [95.4851188028905, 17.70262661282794], [95.48214112061629, 17.70581698656474], [95.48036493889089, 17.707720038349123], [95.47561107489128, 17.72062338426184], [95.47595063731211, 17.72198163124733], [95.47493195184813, 17.730810235304148], [95.47221545787716, 17.73590366082533], [95.4766297603552, 17.74065752482494], [95.48342099528276, 17.74303445727446], [95.4867065253859, 17.744286087832734], [95.49055179083251, 17.74575095124544], [95.49394740784663, 17.7474487597525], [95.49772638336594, 17.744614529237197], [95.4993803957887, 17.743374018795976], [95.5048133828314, 17.74235533423132], [95.50820899984552, 17.742015771810486], [95.50888812378793, 17.733866290796755], [95.5099068092519, 17.726735495246942], [95.52688489522177, 17.724019001275963], [95.52620577217868, 17.718246451812377], [95.5248475251932, 17.71043653232016], [95.5248475251932, 17.704663982856573], [95.51635848175857, 17.704324421335002], [95.51160461775896, 17.705003545277464], [95.50413425978832, 17.71009696989927], [95.49904083426713, 17.71077609384173], [95.49598477877458, 17.709417846856184], [95.49530565483218, 17.706701352885204], [95.49564521725301, 17.70262661282794], [95.49326828480355, 17.702287051306428]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
