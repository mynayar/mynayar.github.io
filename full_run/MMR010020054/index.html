
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pat Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pat Lel</div><div class="name-mm">ကန်ပတ်လည်</div></div>
        <span class="pcode-badge">MMR010020054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1745451747201, 20.826576702053217], [95.17378485998336, 20.830820306012356], [95.17378485998336, 20.83252453298087], [95.17378485998336, 20.833989830766143], [95.17462049743807, 20.83556825517087], [95.17637810816319, 20.838888187939574], [95.17925949463006, 20.841769575305705], [95.17925949463006, 20.846667931579816], [95.17983577210327, 20.852430705412758], [95.18271715857009, 20.85588836935284], [95.19049690221033, 20.860210449053056], [95.19136131797052, 20.864820667040192], [95.19602268669769, 20.856923426974618], [95.20371729691578, 20.852726367427977], [95.21071239825864, 20.849578572093492], [95.21503695828903, 20.851480265901614], [95.22173158444514, 20.848266845238754], [95.22583487258134, 20.848712255166504], [95.22745454708974, 20.841153774427198], [95.22363284837729, 20.83946446631211], [95.22132773938375, 20.83543052399955], [95.21700565878416, 20.83053216682606], [95.21017801840088, 20.83035594287253], [95.20369931856874, 20.83305540098604], [95.19614083693011, 20.83143572557833], [95.18480311537155, 20.826576702053217], [95.1745451747201, 20.826576702053217]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
