
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ti</div><div class="name-mm">တိ</div></div>
        <span class="pcode-badge">MMR009024071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.18165409536027, 21.72877911926099], [94.18168975078146, 21.72904059894455], [94.1889783287869, 21.72661107414183], [94.19432328479184, 21.725882215891602], [94.19748166784473, 21.728068788843586], [94.19966824169603, 21.73341374574784], [94.20011496103666, 21.735200622210982], [94.2001541471962, 21.73535736594971], [94.20933584217545, 21.734033082760618], [94.20878492018795, 21.733736433289835], [94.20851073758053, 21.72523677695574], [94.21289765660163, 21.713446931131045], [94.21810712434439, 21.709060012109944], [94.2246875033257, 21.704673092189523], [94.22474650424783, 21.70461061988425], [94.22276822597291, 21.703027998343487], [94.21892967126735, 21.69672180107034], [94.2188753351287, 21.696580528368713], [94.21667492071106, 21.69624200196688], [94.20331253024915, 21.69454133361569], [94.19237966458991, 21.69186885606291], [94.18460518198361, 21.69186885606291], [94.18364265378551, 21.691359282205156], [94.18361281428002, 21.691612919800434], [94.18363337188265, 21.691625904212174], [94.18266156178169, 21.704988294674138], [94.18120384618061, 21.71494935023236], [94.18096089432987, 21.723695642939617], [94.18165409536027, 21.72877911926099]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
