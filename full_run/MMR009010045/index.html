
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ma Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ma Kyun</div><div class="name-mm">ဆင်မကျွန်း</div></div>
        <span class="pcode-badge">MMR009010045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6894358264023, 20.733160109251685], [94.69008273393109, 20.741958057218596], [94.69390845261307, 20.742305850234857], [94.69765896009301, 20.747556559987288], [94.69990926530039, 20.750181914863504], [94.7006593664367, 20.75505757494716], [94.7006593664367, 20.761058385835895], [94.70440987301731, 20.76593404591955], [94.7092713921611, 20.76828639360224], [94.71355000672747, 20.765030908049994], [94.71590177884406, 20.76433922597454], [94.72384265491468, 20.762144015933643], [94.72698066832322, 20.760512250040335], [94.73062079481389, 20.756997622142592], [94.73200161838002, 20.75134903612917], [94.7326294297045, 20.74030287657655], [94.73250401924514, 20.734779789155994], [94.7319969041339, 20.72931207479246], [94.73201118896526, 20.7280819317358], [94.73206099342019, 20.72389427819843], [94.73288097277873, 20.715197943730175], [94.73553534787806, 20.70800913021725], [94.71678654716146, 20.70592592893854], [94.70670548517006, 20.704872684326972], [94.69497088469865, 20.703646680849715], [94.69165814920427, 20.70330057406227], [94.69163881827689, 20.70348007694406], [94.68903279432806, 20.72767887178253], [94.6894358264023, 20.733160109251685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
