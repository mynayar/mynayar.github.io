
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Kone</div><div class="name-mm">ဂွေးကုန်း</div></div>
        <span class="pcode-badge">MMR010019023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55649629936477, 21.414310214344994], [95.55983858388362, 21.41483794281686], [95.56561233214347, 21.41566276412533], [95.5689116173773, 21.416899995638346], [95.57138608130265, 21.421436513284505], [95.5742729554326, 21.4226737438982], [95.57757223976711, 21.423910976310538], [95.58210875561463, 21.425973029132024], [95.58664527326079, 21.42184892258973], [95.59118178910836, 21.418137228050682], [95.60107964391051, 21.41401312240771], [95.60767821257951, 21.407826963043988], [95.60561615975803, 21.40452767781011], [95.60437892914433, 21.398341519345706], [95.59901759108902, 21.39174294887806], [95.59819276978055, 21.392980181290397], [95.59365625303371, 21.392155359981928], [95.58788250477386, 21.391330538673458], [95.57715982866324, 21.39174294887806], [95.5689645083055, 21.39096244256274], [95.56767438496496, 21.397929108241783], [95.56561233214347, 21.39999116106327], [95.56519992193893, 21.403290446297092], [95.56272545801352, 21.407826963043988], [95.55901376257515, 21.410713837173887], [95.55649629936477, 21.414310214344994]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
