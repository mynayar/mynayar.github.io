
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Myint Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Myint Kyun</div><div class="name-mm">အမြင့်ကျွန်း</div></div>
        <span class="pcode-badge">MMR012001018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.86685590837351, 20.30074944283257], [92.87407251813227, 20.30090475934719], [92.88278537314653, 20.30014354528845], [92.89258413614903, 20.297942250434573], [92.89518450965744, 20.29612927024965], [92.89442624987157, 20.29382137065977], [92.89306449193282, 20.290635783114965], [92.89276635138606, 20.2903416652357], [92.88981561999492, 20.29030182257111], [92.88904982928625, 20.289962155828903], [92.88655071764157, 20.289909294578308], [92.88405160869485, 20.289856397354924], [92.88024832360134, 20.290161399728845], [92.87948652408386, 20.291698686445272], [92.87807362619697, 20.292107789842703], [92.87633522768868, 20.291901530331415], [92.87275028719608, 20.29087375631883], [92.87155596503584, 20.28974515661372], [92.87046989157227, 20.289129234326765], [92.86938305458438, 20.289435987680747], [92.86829577962658, 20.290255339312523], [92.86720849387694, 20.291074681951045], [92.86590264229318, 20.293329139328364], [92.86503184584308, 20.29507131858651], [92.86513953156418, 20.29619912688827], [92.86579009663569, 20.2978399552498], [92.86676596897433, 20.300301191946517], [92.86685590837351, 20.30074944283257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
