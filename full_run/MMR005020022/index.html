
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Lel</div><div class="name-mm">မင်းလယ်</div></div>
        <span class="pcode-badge">MMR005020022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.39778571973523, 24.253065809739383], [96.39770508022531, 24.253112790323087], [96.39489743996495, 24.25128174006028], [96.38092044022619, 24.252075180425265], [96.37329095980999, 24.26330564973597], [96.37329095980999, 24.272277839550725], [96.3760986000704, 24.283508309760748], [96.37453224007089, 24.29176194036131], [96.37811279996578, 24.291870119810255], [96.38030987969722, 24.308105489876482], [96.38171387969186, 24.318481409889216], [96.38287344035706, 24.327697770136012], [96.37707528000021, 24.34167476987477], [96.39428724006416, 24.339477510278925], [96.41790756038569, 24.339477510278925], [96.43951403964127, 24.338928240346092], [96.43950431976862, 24.338865869664232], [96.43829328011083, 24.331115700229418], [96.43609620037938, 24.312316860334874], [96.43609620037938, 24.29608158020079], [96.43591295991524, 24.294494610437994], [96.4346925601136, 24.284301750125735], [96.42431628037212, 24.27447510004589], [96.42010499984593, 24.2612915397728], [96.40527335997763, 24.257690460046717], [96.39778571973523, 24.253065809739383]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
