
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Pin Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pantanaw</div><div class="name-mm">ပန်းတနော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Pin Taung</div><div class="name-mm">ပေပင်တောင်</div></div>
        <span class="pcode-badge">MMR017020030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38845732034912, 16.8161121897258], [95.3919169196302, 16.817141159836694], [95.39463131997951, 16.815848580447664], [95.39825039963631, 16.81210026011894], [95.3997533996997, 16.811127539904078], [95.39918747971848, 16.809968249934855], [95.39797535997496, 16.808756399987942], [95.39782415965732, 16.807392989994526], [95.39949024008257, 16.80451487975796], [95.40039923973319, 16.801333740259963], [95.4000961196403, 16.799061509581065], [95.39918747971848, 16.796940659983534], [95.39585460030963, 16.795880280150868], [95.391461879762, 16.795880280150868], [95.3866141202455, 16.795880280150868], [95.38570548032374, 16.79497146036465], [95.38525080018434, 16.79194179008158], [95.38474751978225, 16.78964094207589], [95.38412832036573, 16.78961402986363], [95.38383131926003, 16.789601100310563], [95.37939468032027, 16.78940820022831], [95.3779910400545, 16.78934718032815], [95.37658739978872, 16.78928616042799], [95.37634979980345, 16.802224380251005], [95.37619428004206, 16.811413650219833], [95.37759611986507, 16.81172028036667], [95.37756948014743, 16.812011970076412], [95.37985151973191, 16.812966690360497], [95.38415423972646, 16.815043889563924], [95.38845732034912, 16.8161121897258]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
