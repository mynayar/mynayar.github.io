
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mut Mway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mut Mway</div><div class="name-mm">မွတ်မွေး</div></div>
        <span class="pcode-badge">MMR015006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.0641247070896, 22.64801869980323], [99.06228105732498, 22.64832620678908], [99.0587735043938, 22.65158322118873], [99.05551648999409, 22.656594010705078], [99.05100677844013, 22.661604802020065], [99.04850138323229, 22.664611276089545], [99.04649706688616, 22.669622067404532], [99.04349059281668, 22.673881238628326], [99.03998303898612, 22.682650122305347], [99.03973527126584, 22.689621665907225], [99.05315553579942, 22.700044417216134], [99.0633601709352, 22.711538575844656], [99.07550819334853, 22.730894778671143], [99.08093799319391, 22.742805307219214], [99.08265243376286, 22.739743860290957], [99.09408413267664, 22.73932407474632], [99.0996143148488, 22.743878755100525], [99.09943145030127, 22.74547851412217], [99.10261792098032, 22.743531227384267], [99.10263760084467, 22.743437199667085], [99.10487277585798, 22.732758027361115], [99.10662655277326, 22.71822673497587], [99.1086308691194, 22.71121162821413], [99.10940387239089, 22.706573407137057], [99.0938490373033, 22.68665875409829], [99.07706288914108, 22.664861816419716], [99.06729184774065, 22.654840234689118], [99.0641247070896, 22.64801869980323]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
