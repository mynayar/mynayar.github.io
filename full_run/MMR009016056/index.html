
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Lel Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Lel Thar</div><div class="name-mm">မလယ်သာ</div></div>
        <span class="pcode-badge">MMR009016056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60108470079837, 19.42069841310132], [95.60086950742186, 19.42069841310132], [95.60015219197015, 19.433968734569476], [95.60031814566594, 19.44193449488108], [95.60194547880087, 19.441500538718913], [95.61270519978518, 19.44436979782796], [95.61772640165219, 19.452618917429163], [95.61898728983164, 19.46690897656805], [95.61908273038375, 19.468267076064762], [95.6197738413897, 19.468275607933037], [95.6323956383481, 19.468431432564614], [95.63974739102935, 19.469003235910634], [95.63997023943506, 19.46575860697419], [95.64247375955642, 19.46015072067928], [95.6496469068793, 19.45010831514668], [95.65682005420217, 19.442935167823805], [95.66399320062578, 19.44436979782796], [95.66915751160991, 19.438998914368426], [95.67295963388005, 19.435044706847805], [95.67798083664633, 19.425002301315203], [95.67738218943657, 19.42170973761432], [95.65323347964141, 19.421057069927883], [95.65318864843744, 19.42069841310132], [95.60108470079837, 19.42069841310132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
