
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Poke Pay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Poke Pay Kone</div><div class="name-mm">အင်းပုတ်ပေကုန်း</div></div>
        <span class="pcode-badge">MMR005025017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65233227981093, 23.829205409901817], [95.65536491965537, 23.830071930075576], [95.66432243972889, 23.825779830175065], [95.67066744005035, 23.8164491696935], [95.6715928397378, 23.81454034516088], [95.67352421926739, 23.810556481596393], [95.67240993497057, 23.8095279116838], [95.67336493134655, 23.806280922026986], [95.67175051607353, 23.805411281205693], [95.67106472275879, 23.80504186309156], [95.67065796479329, 23.80482275406689], [95.67024809517352, 23.804601968705924], [95.6697669920531, 23.80485062765439], [95.66912282925523, 23.805183564769777], [95.66515195819636, 23.807235919302286], [95.6622869681691, 23.8095279116838], [95.65493113256576, 23.808934699976476], [95.65044500393384, 23.80857291530782], [95.64872601099665, 23.818695882109296], [95.64242303059842, 23.821178875204964], [95.64223203078365, 23.82327986867108], [95.64309723974588, 23.824786785281958], [95.64678972026945, 23.826774959696706], [95.65013988015141, 23.828579009613634], [95.65119672924573, 23.828880966883162], [95.65233227981093, 23.829205409901817]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
