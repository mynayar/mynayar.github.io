
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Myay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Myay Kone</div><div class="name-mm">အောင်မြေကုန်း</div></div>
        <span class="pcode-badge">MMR009016048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46192862470633, 19.338658864714887], [95.46172491027647, 19.340492296382422], [95.45540090193015, 19.351280310937625], [95.45117180763287, 19.35648534861997], [95.4627864277515, 19.35578143306674], [95.47318749100998, 19.355422775340855], [95.48789244158297, 19.36976906908734], [95.49488361558645, 19.365197916750503], [95.49334495290731, 19.354256315076952], [95.49222895180475, 19.349792308868018], [95.49446095490919, 19.340120296314694], [95.50152896518966, 19.330076281894947], [95.50710897160184, 19.325984275753797], [95.51901298905824, 19.323380272581574], [95.52433259587264, 19.322413070606785], [95.52198899319751, 19.319288267339743], [95.52137784900856, 19.310732254989603], [95.5059929713986, 19.310732254989603], [95.49892496111812, 19.312220257059266], [95.49297295283958, 19.309616253887043], [95.48739294462877, 19.30403624567623], [95.48044893557, 19.30577224928993], [95.48069693621471, 19.30887225285221], [95.47586092993805, 19.324124273616405], [95.47102492276201, 19.33156428396461], [95.46693291662086, 19.33565628920644], [95.46192862470633, 19.338658864714887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
