
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyan Taik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyan Taik</div><div class="name-mm">ဂျမ်းတိုက်</div></div>
        <span class="pcode-badge">MMR017009021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55296004007386, 17.42672430018638], [95.55256151989829, 17.420048280104083], [95.55206328019631, 17.411379390246736], [95.55201336872204, 17.408539618108932], [95.55196355977051, 17.405699759636263], [95.55190379982054, 17.4047232595708], [95.55166476002074, 17.400817350140642], [95.55126588011632, 17.397329850292408], [95.54957207988764, 17.397130590204597], [95.54688180025494, 17.39623383032705], [95.54439059994627, 17.398425960189968], [95.53861151960598, 17.400717719647105], [95.53382855984023, 17.40330836968559], [95.5330697172937, 17.403814314778856], [95.5323111598322, 17.40432015015483], [95.5284479996755, 17.40689550002736], [95.5243627195639, 17.41048263036913], [95.52147299997904, 17.413172910001833], [95.5237647603355, 17.41546467035829], [95.52496062843034, 17.416510979398254], [95.52615624021837, 17.417557169727672], [95.5264550399682, 17.42592716990299], [95.53183595986172, 17.42722244995616], [95.53532327984556, 17.42782032015168], [95.54080356043602, 17.42782032015168], [95.54289192202464, 17.427447372198515], [95.54359355959514, 17.4273220804497], [95.54578560042518, 17.428218930259447], [95.54847588005788, 17.42782032015168], [95.55296004007386, 17.42672430018638]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
