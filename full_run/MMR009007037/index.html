
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Kyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Kyaung</div><div class="name-mm">ရွှေကြောင်း</div></div>
        <span class="pcode-badge">MMR009007037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.69581389029884, 20.20670017966961], [94.70105580018509, 20.20725195961029], [94.71677386582132, 20.210459728933415], [94.7228686261862, 20.21430905122179], [94.72838748679317, 20.218103267551783], [94.72907953938932, 20.215473470923996], [94.7317926806877, 20.215548835910113], [94.73024649428032, 20.21174283576329], [94.73249193235688, 20.209176621204165], [94.73569969988131, 20.20628963016236], [94.73634125374593, 20.202440306974665], [94.73313348532213, 20.197628655238304], [94.73239323086295, 20.193927382942434], [94.73120882372831, 20.193137779085305], [94.72768027882188, 20.19474166329718], [94.7180569726512, 20.195062439779804], [94.71132066022034, 20.19377933205061], [94.70394279212621, 20.18896768031425], [94.70312028657202, 20.18917330580348], [94.70137657666771, 20.189609233279555], [94.70041424721978, 20.19249622522068], [94.70009346983784, 20.19602477012711], [94.69752725527866, 20.198590984686234], [94.6919337743243, 20.201319511586235], [94.69431948595559, 20.20500652243311], [94.69581389029884, 20.20670017966961]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
