
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Ga Net</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Ga Net</div><div class="name-mm">သင်္ဂနက်</div></div>
        <span class="pcode-badge">MMR012010017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.54322331200632, 20.976126696290066], [92.54049320589678, 20.975185953269204], [92.52733568279558, 20.971883058156664], [92.52345185981551, 20.96923301329298], [92.52212226972705, 20.97064342995037], [92.5207458033762, 20.97378979626211], [92.51886453137308, 20.979384904090125], [92.5179089954039, 20.97999611123157], [92.51555706860387, 20.989306981232232], [92.515351497074, 20.9901208038321], [92.5153404516006, 20.990160496309898], [92.51471725739555, 20.992400069907376], [92.52681242305493, 20.9953267947958], [92.52981347960844, 20.989945768782263], [92.53646362169883, 20.992119735937138], [92.53760074337964, 20.995572005743497], [92.5490797160561, 20.995171641957768], [92.54988255883308, 20.992478979121643], [92.55163792574973, 20.987116541195462], [92.5490310996056, 20.98640960661811], [92.54642430044117, 20.985702633369897], [92.53996273719065, 20.98615200660987], [92.54146920683849, 20.981022352799414], [92.54322331200632, 20.976126696290066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
