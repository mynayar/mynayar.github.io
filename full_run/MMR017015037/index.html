
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Loke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Loke Kone</div><div class="name-mm">တလုပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR017015037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15019959973182, 16.787531879892413], [95.1544598402495, 16.78634001018338], [95.16057803964486, 16.785444959917015], [95.15997324017297, 16.784605709885625], [95.15885039972625, 16.781082030311495], [95.1601244395913, 16.780326029622643], [95.1569377198, 16.778023290342617], [95.14475028010139, 16.77227687967428], [95.1382803603504, 16.76836251032165], [95.13103032009326, 16.7642776798711], [95.1262552797574, 16.762532850310834], [95.12658719973956, 16.76647682984185], [95.12771903970196, 16.771000589705523], [95.12941535983106, 16.77493638000999], [95.13007848033766, 16.77539051965681], [95.13242495994399, 16.776998010150123], [95.13441576037911, 16.780823549866966], [95.13544644010119, 16.78269059999127], [95.13730331979241, 16.783587000140017], [95.14111175979991, 16.784470080429912], [95.14494612006746, 16.786093139986463], [95.14971575997441, 16.787667239551524], [95.15019959973182, 16.787531879892413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
