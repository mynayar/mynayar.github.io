
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Wea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Wea</div><div class="name-mm">ပေါက်ဝဲ</div></div>
        <span class="pcode-badge">MMR010009072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02103203440095, 22.036695177940146], [96.03098684866421, 22.035951284823966], [96.03946223769219, 22.036345489153064], [96.04892313799246, 22.038710714228102], [96.0526680768703, 22.03969622370181], [96.05422942404874, 22.040633032188737], [96.05955820574667, 22.03352799232306], [96.06132847712757, 22.024882736649033], [96.05994707979397, 22.02439733027262], [96.0468752243122, 22.019804032130423], [96.04652665877836, 22.019611805640352], [96.04174215038, 22.016973237025297], [96.03892712488698, 22.01749602731985], [96.03087519423491, 22.01272451322575], [96.02548523255751, 22.007618231895947], [96.0250011230035, 22.007734505243263], [96.01875864179794, 22.019082979096254], [96.01884386155501, 22.020175212915774], [96.01890004669986, 22.020894103080423], [96.01899139803464, 22.022066119355998], [96.01907538841851, 22.024784781592473], [96.01909804413947, 22.025518114869158], [96.02012039703874, 22.031953631055273], [96.02033075386129, 22.03304776424295], [96.02103203440095, 22.036695177940146]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
