
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Hlyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Hlyan</div><div class="name-mm">ရေလျှံ</div></div>
        <span class="pcode-badge">MMR008008046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54289556158096, 17.6788878032296], [95.54021269236193, 17.676904811607812], [95.53766597960134, 17.66901000240972], [95.5394486787136, 17.66111519231231], [95.54021269236193, 17.655512424059168], [95.54046736417757, 17.64634425758146], [95.5403535154025, 17.643349060111063], [95.53795225719097, 17.644055313002355], [95.52426496055955, 17.644220591307317], [95.51901533179216, 17.644283982719685], [95.51799199143733, 17.644296340303924], [95.51657269487401, 17.645643127228595], [95.51476326161531, 17.64563558641322], [95.51468819970074, 17.64563527344916], [95.51463547065049, 17.645639209781734], [95.51047113743311, 17.645950069440175], [95.50986379467844, 17.645995406063207], [95.50981138578686, 17.645999319013413], [95.51432111083068, 17.651692354918282], [95.52043322181578, 17.65610665739638], [95.5248475251932, 17.663237452946134], [95.51907497483029, 17.66934956393129], [95.51737716722255, 17.678517731308318], [95.5183958517872, 17.68462984229342], [95.52179146880133, 17.69142107632166], [95.52518708581539, 17.693798007871806], [95.53062007375746, 17.69277932330715], [95.53639262322105, 17.689044143872195], [95.54012780175668, 17.684290279872585], [95.54289556158096, 17.6788878032296]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
