
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Kyet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Kyet</div><div class="name-mm">ဟိုကျက်</div></div>
        <span class="pcode-badge">MMR015005033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.63465820341344, 22.494676754628586], [98.63485863531781, 22.493247908164506], [98.6442136737221, 22.48708106983554], [98.65468033892654, 22.48221628165612], [98.6670634360288, 22.47646698686202], [98.67123528128326, 22.473746126682443], [98.67428690941341, 22.466589993633363], [98.67803643123636, 22.45876236019484], [98.66623270707385, 22.46390699671059], [98.65925029156779, 22.467179664709818], [98.64347658487657, 22.470717692067865], [98.63563357033308, 22.47250096584696], [98.63549889325935, 22.473872598341814], [98.63643397774592, 22.476009937009053], [98.63694794209391, 22.47926503855075], [98.63694794209391, 22.48206328629169], [98.63684158107418, 22.482415960828007], [98.63586290734736, 22.485661031331574], [98.63454944480111, 22.489487204171212], [98.63397837440249, 22.491999915363863], [98.63465820341344, 22.494676754628586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
