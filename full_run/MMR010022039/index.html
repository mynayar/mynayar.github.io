
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dan Kyin (Nat Pa Lin)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dan Kyin (Nat Pa Lin)</div><div class="name-mm">ဒါန်းကျင်း (နတ်ပလင်)</div></div>
        <span class="pcode-badge">MMR010022039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99402351487339, 21.066292360404134], [94.99851780575221, 21.05922990343737], [95.0021196588952, 21.05235363671102], [95.00670383611322, 21.045149931324318], [95.00816319837298, 21.042814951348987], [95.00778882499435, 21.042762955246246], [95.00375686478753, 21.042202959998633], [94.99753548167718, 21.041548077282016], [94.99262386400017, 21.039583430031314], [94.97264995013512, 21.034671812354304], [94.9752694801025, 21.039255988673006], [94.97461459738582, 21.04351272543198], [94.97363227421016, 21.047114577675643], [94.97887133324548, 21.05104387307631], [94.98050853913782, 21.05464572621935], [94.97985365732046, 21.060212225713713], [94.97985365732046, 21.063486639297025], [94.98640248088986, 21.065123845189362], [94.99327874581752, 21.066106168365025], [94.99402351487339, 21.066292360404134]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
