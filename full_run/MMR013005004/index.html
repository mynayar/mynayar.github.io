
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaik Sa Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaik Sa Kaing</div><div class="name-mm">ကြိုက်စကိုင်း</div></div>
        <span class="pcode-badge">MMR013005004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92870750095045, 17.352300443810464], [95.9234758316444, 17.346719996730542], [95.91475638280087, 17.33590788034445], [95.91661352239618, 17.33306708387886], [95.91080533819587, 17.33645519155391], [95.90015700094489, 17.33306708387886], [95.88999267881911, 17.325806854302925], [95.87988885858402, 17.314311489683575], [95.8773477782774, 17.310318364001375], [95.8719026063203, 17.332825077215603], [95.86994341885378, 17.33975442013042], [95.86852109966907, 17.347221595400356], [95.86585425187229, 17.350244021644357], [95.86627352030678, 17.352796363261632], [95.87186486716996, 17.350294970936204], [95.88437182699829, 17.348235000944612], [95.90041016369815, 17.34676359406467], [95.90673721355165, 17.346469311609496], [95.90865004276532, 17.34426220173924], [95.91497709441745, 17.343967920183445], [95.9174784858435, 17.345292187184725], [95.9186556111676, 17.347646437832907], [95.9202741588254, 17.351030673926516], [95.92870750095045, 17.352300443810464]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
