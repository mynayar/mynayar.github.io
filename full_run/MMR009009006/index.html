
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngape</div><div class="name-mm">ငဖဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyu</div><div class="name-mm">ချောင်းဖြူ</div></div>
        <span class="pcode-badge">MMR009009006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.47845278167057, 20.116974656355353], [94.4812336796906, 20.114379148179182], [94.48608541061327, 20.112195869443894], [94.4882686929459, 20.108071897799903], [94.49069455660856, 20.10710155269453], [94.4955462911285, 20.10419051198261], [94.50086747265578, 20.10141424367248], [94.50112578132979, 20.10127947396859], [94.50406405171469, 20.096985079897593], [94.49722123167459, 20.092423199571044], [94.47801761861825, 20.082007680610047], [94.47569141692543, 20.08074601181903], [94.47558093880934, 20.080960215041955], [94.47538423729276, 20.08122671474115], [94.47505428502728, 20.08153128544052], [94.47473067837814, 20.081778749189994], [94.47434361916277, 20.082032558555795], [94.47400732218023, 20.082159463688356], [94.47374082158171, 20.082216570638252], [94.4733918351651, 20.082222915355317], [94.47301112156606, 20.082172154021748], [94.47265519058465, 20.082093088325394], [94.47188369187893, 20.082508510359503], [94.46343784558019, 20.083977353272303], [94.4601329503754, 20.086547827919958], [94.45829689628482, 20.08838388201059], [94.45822504315129, 20.088469553227355], [94.4689460069527, 20.104908364329617], [94.47845278167057, 20.116974656355353]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
