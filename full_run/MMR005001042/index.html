
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Shey</div><div class="name-mm">ညောင်ပင်ရှည်</div></div>
        <span class="pcode-badge">MMR005001042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65676593210213, 22.139598148835546], [95.65757207988764, 22.13936756985754], [95.6591841506281, 22.13931555217107], [95.66482391968822, 22.139133569858416], [95.66509433233762, 22.13911103644523], [95.67469223985506, 22.13831123967202], [95.68056048887553, 22.139001617730514], [95.68259856037531, 22.1392413895785], [95.6848348802256, 22.133651129995712], [95.68757592029255, 22.12652402976022], [95.6881886400937, 22.12300070991489], [95.68662696016617, 22.121361000309946], [95.68445219980924, 22.119077340147157], [95.6799007201422, 22.11967097993181], [95.66948412019605, 22.1213157302368], [95.66128800034102, 22.12110558025836], [95.65596397335872, 22.120411892694733], [95.65439652697819, 22.12406926998085], [95.65346315030422, 22.13433640170365], [95.65676593210213, 22.139598148835546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
