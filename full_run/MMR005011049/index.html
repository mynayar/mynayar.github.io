
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Ma</div><div class="name-mm">ရွာမ</div></div>
        <span class="pcode-badge">MMR005011049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28112799965754, 22.905883800297204], [95.28448499978299, 22.904724149699803], [95.2891236003739, 22.904479980167025], [95.29412832036576, 22.903320329569624], [95.29431155993058, 22.903320329569624], [95.29608168022543, 22.89929201971097], [95.29571520019641, 22.896484380349932], [95.29388423986586, 22.89208986025892], [95.29327403996501, 22.888671840233314], [95.29351811956565, 22.88592530980526], [95.29187003997043, 22.883728050209413], [95.29028316013978, 22.881286620181413], [95.28552251974855, 22.87969974035076], [95.28088392005691, 22.87890621005363], [95.27508539997132, 22.877929709988166], [95.27233680020322, 22.877094149875177], [95.27032475958003, 22.881286620181413], [95.26971419995044, 22.885498079672686], [95.26727303971904, 22.891479479594352], [95.26550436013815, 22.89751695044697], [95.26647960025343, 22.896484380349932], [95.26770035978382, 22.899719249843542], [95.26812732011979, 22.90429691956723], [95.26788323961989, 22.905273419632636], [95.27172839984581, 22.90612796982998], [95.27587884033625, 22.90612796982998], [95.28112799965754, 22.905090359932217], [95.28112799965754, 22.905883800297204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
