
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Chin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Chin</div><div class="name-mm">မြင်းချင်း</div></div>
        <span class="pcode-badge">MMR005004060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63726807975814, 22.596457590145747], [95.64127451990322, 22.590924840409116], [95.6418559199148, 22.588133670332695], [95.64264503993672, 22.584345840088474], [95.64100056032765, 22.57886331029357], [95.63935572009046, 22.575573809683647], [95.64017796034466, 22.57146197978659], [95.64209676015741, 22.565979449991687], [95.64339635965433, 22.561593479755345], [95.64127451990322, 22.561593479755345], [95.63661432029471, 22.560496920196783], [95.6356717120799, 22.560455951580934], [95.63030964017781, 22.56022286978964], [95.62480163978393, 22.56022286978964], [95.62484699978927, 22.56035660976977], [95.6240762403263, 22.562823780193355], [95.62315104028835, 22.57115030983897], [95.6219173197286, 22.578860070036228], [95.62063139981933, 22.58414649006852], [95.6216347203661, 22.58438535000397], [95.62430735979689, 22.58664686975726], [95.62574664019536, 22.59014202013816], [95.62636331971152, 22.594459409873934], [95.62728627594095, 22.595587426818327], [95.62821371978742, 22.596720929627224], [95.63126328037617, 22.598335530160625], [95.63394455959383, 22.596746670022867], [95.63726807975814, 22.596457590145747]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
