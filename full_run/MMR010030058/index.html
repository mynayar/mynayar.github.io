
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyan Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyan Kan</div><div class="name-mm">ညန်ကန်</div></div>
        <span class="pcode-badge">MMR010030058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03197868756644, 20.805417586952103], [96.04074132725049, 20.808046379037194], [96.0501812706492, 20.811822357116114], [96.05678923273695, 20.812766351186212], [96.05899188556714, 20.807417048757827], [96.05899188556714, 20.79955042880931], [96.05575359864974, 20.797237366211505], [96.0501812706492, 20.793257132310885], [96.03853867262171, 20.788222494572494], [96.02815473425363, 20.786649171122406], [96.02752540397427, 20.777209225925105], [96.02154677306521, 20.776894562134373], [96.00361087763997, 20.778782550274514], [96.0010447287313, 20.774685356843804], [96.00015917710442, 20.777784792933915], [96.00990025759086, 20.78597615717399], [96.0105644222104, 20.788190040737845], [96.0105644222104, 20.795717237660426], [96.00613665778059, 20.799702226276793], [96.00420718931042, 20.801524502753637], [96.0064428616488, 20.800809087569405], [96.01619747063683, 20.800494422879353], [96.02815473425363, 20.804270400958274], [96.03197868756644, 20.805417586952103]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
