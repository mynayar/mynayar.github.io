
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Myay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Myay</div><div class="name-mm">လေးမြေ</div></div>
        <span class="pcode-badge">MMR005013047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07067811979942, 22.28904540002526], [95.05966176018217, 22.293282420047717], [95.05288259955239, 22.297519350137975], [95.0422899600137, 22.294977210429977], [95.03687015973014, 22.29414335992817], [95.03171413330068, 22.293391024875973], [95.03031925333096, 22.30350390937798], [95.02611296943803, 22.312442264898664], [95.02231021944112, 22.316549233960018], [95.02561813636794, 22.320246994403306], [95.02585208510573, 22.320471306006027], [95.03085024004662, 22.324636259755607], [95.03805311985565, 22.327602120441554], [95.04356112024954, 22.330991790238954], [95.05076400005862, 22.33734731982298], [95.05711980033857, 22.34200796999187], [95.05774727981316, 22.340689650207253], [95.0613566395973, 22.333110299800524], [95.06050920033937, 22.326331050137924], [95.06008548026074, 22.31700965986795], [95.05796687986765, 22.305993390182834], [95.0634752399904, 22.307264550418722], [95.07110183987805, 22.31150147960966], [95.08381272008103, 22.310230410205293], [95.0931342002832, 22.305569670104262], [95.09440535961971, 22.300485299856746], [95.09440535961971, 22.294553490351348], [95.08889736012515, 22.29412977027272], [95.08211783976657, 22.29074019040752], [95.07660984027194, 22.29074019040752], [95.07067811979942, 22.28904540002526]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
