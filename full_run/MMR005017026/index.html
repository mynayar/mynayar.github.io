
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ke Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ke Taung</div><div class="name-mm">ကဲတောင်</div></div>
        <span class="pcode-badge">MMR005017026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7719782001339, 22.69651842008909], [94.77204443969919, 22.694863859979193], [94.7702440797006, 22.688561969559316], [94.76814312040875, 22.68256013973871], [94.76394192038339, 22.67925911971264], [94.75974072035802, 22.67925911971264], [94.75433892000524, 22.68105965957568], [94.74143508036474, 22.67895897008043], [94.73453279984892, 22.675057829755076], [94.72823100026051, 22.675958099686625], [94.71982823958166, 22.678058700148938], [94.71976343983096, 22.678129439921747], [94.71652740031931, 22.68165977987502], [94.714426799857, 22.688261819927106], [94.71292631969396, 22.693363379816162], [94.71412656029258, 22.70386665012586], [94.71772764001861, 22.708968210014916], [94.72553028039817, 22.71346964960469], [94.73153184042218, 22.71527019036705], [94.73388911998694, 22.716841680099492], [94.73973443989257, 22.713269580127076], [94.7481371996721, 22.710868830032553], [94.75974072035802, 22.706467469697998], [94.769743679827, 22.700865689799798], [94.77177876018169, 22.70150838040746], [94.7719782001339, 22.69651842008909]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
