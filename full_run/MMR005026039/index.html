
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Tar</div><div class="name-mm">ပေတာ</div></div>
        <span class="pcode-badge">MMR005026039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46728831970023, 24.211200780291847], [95.47570800022407, 24.20989991994537], [95.48907480006204, 24.198730469635507], [95.50231920037083, 24.189270029788076], [95.52392567962647, 24.190490700285636], [95.52744971982878, 24.192641070129355], [95.52752676025182, 24.192687959881482], [95.5311278399779, 24.190124490053222], [95.54831027979566, 24.186789720269417], [95.54968260027186, 24.186523410327197], [95.5496523596687, 24.18643188002727], [95.54669172044657, 24.17749019971302], [95.54669172044657, 24.165893520169845], [95.54907240037102, 24.151123080066156], [95.543517959886, 24.151123080066156], [95.5322877603719, 24.15411378002699], [95.50848383985738, 24.15612788999016], [95.4876708000674, 24.15808106998543], [95.47149671969794, 24.155090370024595], [95.4611204399564, 24.150878909634002], [95.45633280011867, 24.150368789887807], [95.45633207976175, 24.15024873039465], [95.45532227959956, 24.15411378002699], [95.45444567982435, 24.154389270248657], [95.45424588014333, 24.154445789941292], [95.45568839989977, 24.158691449750677], [95.45849604016018, 24.16229244044382], [95.46069347962043, 24.169494599895927], [95.46209711988621, 24.18072507010595], [95.46472151968243, 24.194274929644337], [95.46752915994284, 24.20367434959161], [95.46728831970023, 24.211200780291847]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
