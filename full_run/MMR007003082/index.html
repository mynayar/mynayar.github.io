
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Ka Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Ka Laung</div><div class="name-mm">ပင်ကလောင်</div></div>
        <span class="pcode-badge">MMR007003082</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70448787981184, 17.152378380358016], [96.70824921872651, 17.15306225901611], [96.71440413923972, 17.154088077902543], [96.72597006196884, 17.155339441362173], [96.73682491144058, 17.15685912025225], [96.74160104355337, 17.15599073218658], [96.75242796637758, 17.155457894666142], [96.74996588881476, 17.151010621243245], [96.75030783084179, 17.147933163684627], [96.75064976477489, 17.13904273303575], [96.75258246630784, 17.133281792021137], [96.7479142330555, 17.12775872438567], [96.73765601541282, 17.11921023216655], [96.72705587372963, 17.124681266827054], [96.71816542959095, 17.126049025042505], [96.709274981855, 17.125023206156072], [96.69916722798524, 17.125023206156072], [96.69703352707569, 17.1294684219302], [96.69634966010881, 17.139726611693845], [96.69395608300687, 17.143829888138896], [96.70448787981184, 17.152378380358016]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
