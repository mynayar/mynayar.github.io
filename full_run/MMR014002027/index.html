
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Le U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Le U</div><div class="name-mm">သလဲဦး</div></div>
        <span class="pcode-badge">MMR014002027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.00838661025392, 20.46626047883808], [96.99048622006308, 20.45959170639219], [96.97296053600002, 20.45287974220639], [96.94984154814898, 20.449896646912748], [96.9378609606149, 20.447021305688736], [96.93342925625524, 20.44595769728994], [96.93327380933891, 20.458851684857393], [96.93529895758087, 20.464066348882966], [96.93774343900856, 20.466510830310597], [96.93865493967377, 20.467422330975864], [96.93940071417165, 20.48345646784179], [96.94387535666243, 20.50321947359987], [96.94723133875533, 20.521863819859448], [96.94760087108341, 20.53221070436058], [96.9692316671078, 20.5267113500488], [96.996079523851, 20.51738917736867], [97.00992260914114, 20.51312976602594], [97.0098078403596, 20.512713677594206], [97.01042379322354, 20.50265617784038], [97.01068706705456, 20.498357338420476], [97.01303108971308, 20.487516868208957], [97.00863658221255, 20.482536008130296], [97.00687883479043, 20.477848184945856], [97.00863688528409, 20.46817965097017], [97.00838661025392, 20.46626047883808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
