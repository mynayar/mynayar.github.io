
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabeikkyin</div><div class="name-mm">သပိတ်ကျင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Kone</div><div class="name-mm">လက်ပံကုန်း</div></div>
        <span class="pcode-badge">MMR010012015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06605105461256, 23.32924533720262], [96.05454853408764, 23.324772133627107], [96.04432407069936, 23.324772133627107], [96.03218252070684, 23.324772133627107], [96.02649670635799, 23.324772133627107], [96.02489233921017, 23.325676487380065], [96.02040833657554, 23.326704927790217], [96.01707618831551, 23.327527680657965], [96.01325038869453, 23.328062469707277], [96.01065871702622, 23.328432708902426], [96.00662136358511, 23.32988436577091], [95.99555080542541, 23.33090554235696], [95.99226714950942, 23.333689511561772], [95.99226714950942, 23.33775838983786], [95.99226714950942, 23.341970036388147], [95.99262406884577, 23.34425431888178], [95.99940553263929, 23.34496815665517], [96.00318887526646, 23.34496815665517], [96.01045553679364, 23.34458203093601], [96.01638239732983, 23.341888004727707], [96.01748485644106, 23.341386887195142], [96.02451417428978, 23.341386887195142], [96.03601669481469, 23.34586008897196], [96.04432407069936, 23.34586008897196], [96.05518756265593, 23.346499118439624], [96.06173001003202, 23.348008913780404], [96.06349493943998, 23.34841620504386], [96.07244134479231, 23.34969426307981], [96.07745164327878, 23.349137562948215], [96.07819260460508, 23.349055233612205], [96.07958874362566, 23.344866817449713], [96.08010969210864, 23.34330397290006], [96.08010969210864, 23.33755271308729], [96.07308037425992, 23.331801453274522], [96.06605105461256, 23.32924533720262]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
