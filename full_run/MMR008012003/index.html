
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Kone Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin Kone Kan</div><div class="name-mm">ချင်းကုန်းကံ</div></div>
        <span class="pcode-badge">MMR008012003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33947525767707, 18.356580953048592], [95.33891520217492, 18.36401315458346], [95.33857661012252, 18.36866878833399], [95.33889152392476, 18.373292470071476], [95.34154076659314, 18.374435197226603], [95.34015840968294, 18.381899930837164], [95.34034654335835, 18.386226987385612], [95.34459785630611, 18.3880489778781], [95.3491933407002, 18.38932735067675], [95.34920523243557, 18.387529935957843], [95.35835390700726, 18.38251221536649], [95.36626748775444, 18.37565377769971], [95.37338971186574, 18.374334848174726], [95.38721210015837, 18.372435587932102], [95.38578765587567, 18.36958669936672], [95.37840164621906, 18.356397396922375], [95.37083908075903, 18.34153328343433], [95.36961683464926, 18.33942940943973], [95.36825049916126, 18.341789446325947], [95.36208862868733, 18.346611778410875], [95.3614352289527, 18.34712313382562], [95.35254574528994, 18.354827354199074], [95.34231344520941, 18.3565994242241], [95.33947525767707, 18.356580953048592]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
