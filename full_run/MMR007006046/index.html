
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Pyin</div><div class="name-mm">ဆားပြင်</div></div>
        <span class="pcode-badge">MMR007006046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4739277452693, 18.256230863363726], [96.4701564922284, 18.253520274341213], [96.46116894918771, 18.248127747797355], [96.45320855423142, 18.24453273130058], [96.44447779821189, 18.23785627055048], [96.44345065012749, 18.22912551543027], [96.444734585233, 18.22244905468017], [96.4469158737686, 18.21985877426306], [96.44678887960316, 18.21988118536848], [96.44422101119079, 18.218340464141136], [96.44088278081574, 18.215259020787244], [96.44065823538932, 18.21521411134222], [96.43893964894568, 18.22380704356027], [96.43658681472976, 18.24066901716145], [96.4334497042405, 18.25321746271578], [96.43949196668098, 18.248241480559955], [96.44216671592125, 18.249411682902917], [96.44447779821189, 18.251209192050624], [96.44755924066646, 18.251722765193506], [96.45089747104151, 18.249668469924018], [96.45115425806262, 18.253263487320112], [96.45500606158055, 18.255574568711438], [96.4586010789767, 18.25916958700691], [96.4606553751455, 18.260967095255296], [96.46758862201733, 18.258912799985808], [96.4739277452693, 18.256230863363726]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
