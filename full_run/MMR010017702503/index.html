
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010017702503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41878189591972, 21.73583015869309], [95.41874747504738, 21.735757014339413], [95.41859717505355, 21.735250740675895], [95.41845478558571, 21.734894767006153], [95.41824120138381, 21.734625809122463], [95.41818200964912, 21.73402068028173], [95.4172010517463, 21.734150240759448], [95.41661802959646, 21.73275283846374], [95.41638667160038, 21.73231788543137], [95.4159526486701, 21.731459752444835], [95.41350682694042, 21.73264436312428], [95.41255737527115, 21.732999298327627], [95.41214919978717, 21.733265499730237], [95.41140383585991, 21.73386001619599], [95.41123524163834, 21.734081850698033], [95.41033597439917, 21.73514938327537], [95.40984227409666, 21.736202610587156], [95.40968118411087, 21.737824104253093], [95.4096912019694, 21.73782818084777], [95.41063191800015, 21.738210989000265], [95.4121375196737, 21.739788285709665], [95.415931327794, 21.737267924804087], [95.4163110330415, 21.737022698498322], [95.4165246172434, 21.73685657745233], [95.4168726803872, 21.736698366932615], [95.4172602961608, 21.73654015641273], [95.41751343299251, 21.73639776694489], [95.41782194350634, 21.73626328800293], [95.41813836454594, 21.736065524853075], [95.41847060663775, 21.73594686696316], [95.41878189591972, 21.73583015869309]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
