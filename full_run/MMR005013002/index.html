
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Son Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Son Kone</div><div class="name-mm">ဆုံကုန်း</div></div>
        <span class="pcode-badge">MMR005013002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1424001996096, 22.32427688976668], [95.14073807979861, 22.323538260382463], [95.13740123977544, 22.323061619698024], [95.13096623980016, 22.32186992985345], [95.12548488002324, 22.319009910379123], [95.11904988004801, 22.31710326040718], [95.1129781198444, 22.31580222019636], [95.11094664037523, 22.318771590036874], [95.10784811979494, 22.32186992985345], [95.10742907978823, 22.32354591001581], [95.10713315966763, 22.324729950227095], [95.10713315966763, 22.329734850083298], [95.10713315966763, 22.333786560301576], [95.10945515972787, 22.338043379798194], [95.10999300017687, 22.339029779600708], [95.11571304002484, 22.341651479632105], [95.1209564400877, 22.34308148981893], [95.12762976040517, 22.345226460133063], [95.13215820034071, 22.345226460133063], [95.1331528802013, 22.34514356962012], [95.13454140016552, 22.342366439759417], [95.13597132042014, 22.34093652040417], [95.13597132042014, 22.338076500030525], [95.13597132042014, 22.334501520428887], [95.13787787956056, 22.33140317971305], [95.14121471958373, 22.328781569613795], [95.1424001996096, 22.32427688976668]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
