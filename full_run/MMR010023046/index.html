
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Tan Thea Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Tan Thea Kyun</div><div class="name-mm">ရွာတန်းသဲကျွန်း</div></div>
        <span class="pcode-badge">MMR010023046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02751144739545, 20.44734863193389], [96.02224861568112, 20.448483723844845], [96.01725180162941, 20.451648373373757], [96.0135874716845, 20.455978945372067], [96.01335941620414, 20.460691974754866], [96.01075594363198, 20.465306331422084], [96.01025626321604, 20.46913722210519], [96.00959002116258, 20.474467156733965], [96.01168444957773, 20.477251542324893], [96.0129212296311, 20.478298048316333], [96.0182511651592, 20.479463970785673], [96.02224861568112, 20.483794542783983], [96.02340571490186, 20.487960099978693], [96.02493076634187, 20.487483522246805], [96.03509835480531, 20.485506490432215], [96.04368519591515, 20.48293087885702], [96.05319047955703, 20.47448173744226], [96.04873173078482, 20.47146906884251], [96.03857154194316, 20.464140408053424], [96.03290848583799, 20.455978945372067], [96.02751144739545, 20.44734863193389]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
