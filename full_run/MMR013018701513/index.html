
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (55) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (55) Ward</div><div class="name-mm">အမှတ် (၅၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.246456463595, 16.861258188814418], [96.24688275663397, 16.86087099739865], [96.24801826493103, 16.859903335870285], [96.25380706784199, 16.85509910623881], [96.25331306484611, 16.854551315690742], [96.25264930761949, 16.85381126357902], [96.2520427706574, 16.85312461860633], [96.25134086598825, 16.852342605926594], [96.25055885330852, 16.851469039564563], [96.2499217987521, 16.85075187699755], [96.24922243736563, 16.849972407600603], [96.24881341760522, 16.849565930223548], [96.24857834741289, 16.849418733687685], [96.24805617315394, 16.84910178202165], [96.24692175123789, 16.84918191701189], [96.24473126713434, 16.85158093771014], [96.24268913159818, 16.85396385155053], [96.2413258556038, 16.855506419985318], [96.24011993398784, 16.85652351364928], [96.23890704712261, 16.857512519687077], [96.24389440840031, 16.86324897126309], [96.2439721386034, 16.86328263558522], [96.246456463595, 16.861258188814418]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
