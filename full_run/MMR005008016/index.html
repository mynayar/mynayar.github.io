
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Leik Sin Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyunhla</div><div class="name-mm">ကျွန်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Leik Sin Taung</div><div class="name-mm">လိပ်စင်းတောင်</div></div>
        <span class="pcode-badge">MMR005008016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21780781357978, 23.399501135369178], [95.21027285370928, 23.400492577670377], [95.20095329805633, 23.401484019971576], [95.1892542810603, 23.406837807318993], [95.17075066700971, 23.409005759807997], [95.17491472413525, 23.42090306562403], [95.18423427978826, 23.4345849663232], [95.20148537205233, 23.45116187731884], [95.21100321562596, 23.441168141296714], [95.23435630420016, 23.428219247420373], [95.2428087416302, 23.42415500784739], [95.24219728897378, 23.416157362072624], [95.23783494392757, 23.405648076197792], [95.2322828677602, 23.40108744323095], [95.22474790788971, 23.398311405147297], [95.21780781357978, 23.399501135369178]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
