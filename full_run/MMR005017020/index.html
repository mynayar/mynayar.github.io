
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Pone Yae</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Pone Yae</div><div class="name-mm">လင်ပုန်းရည်</div></div>
        <span class="pcode-badge">MMR005017020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95404928035009, 22.239540988625777], [94.95312587985552, 22.23951732026819], [94.94687772033058, 22.23706248044914], [94.94514251711354, 22.23466401643128], [94.94512484273736, 22.234639587247216], [94.94264362130616, 22.23121013863704], [94.93839849479474, 22.227466657560228], [94.92961669685315, 22.225214283012804], [94.91675345081114, 22.22612732421669], [94.91578031241153, 22.226501603166525], [94.90805072216318, 22.229474476765745], [94.90127399330021, 22.227455651657067], [94.89880477781833, 22.226720059283366], [94.89756307397676, 22.226350149240034], [94.89636966282973, 22.2265969969539], [94.89591360043238, 22.226691330440588], [94.89109173509559, 22.227688925003918], [94.8861403745787, 22.228084957654744], [94.88023883985062, 22.228557029783133], [94.87995980540074, 22.22857930868821], [94.87966280969096, 22.228603064280037], [94.87538388036182, 22.234879080305348], [94.87389563997186, 22.25670848980502], [94.8953042755719, 22.262930220952967], [94.91123626923849, 22.270896216886968], [94.92177168041877, 22.263274799792214], [94.93865208022936, 22.253146740129978], [94.94844263961619, 22.247069850193498], [94.95404928035009, 22.239540988625777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
