
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Lel</div><div class="name-mm">တောင်လယ်</div></div>
        <span class="pcode-badge">MMR017006018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09185944006117, 17.323193519765198], [95.0916992402278, 17.323600679727633], [95.09541623986763, 17.325528120226636], [95.0941771197783, 17.330208929598484], [95.09954652025579, 17.331035039635424], [95.10574176007424, 17.330622029583026], [95.1092524804177, 17.329727070148238], [95.1093212398834, 17.32704245984172], [95.10952787980784, 17.324495550129598], [95.10973451973234, 17.321948549585954], [95.11138655994182, 17.31258675007848], [95.11148483965371, 17.310370049837957], [95.11166196023134, 17.306391510260028], [95.11221240018216, 17.298131130247498], [95.1092524804177, 17.297511570202857], [95.10629255975391, 17.296892010158217], [95.10230015982455, 17.29482695989634], [95.09913360013559, 17.29730502021056], [95.09807263394498, 17.30190256944809], [95.09500331974749, 17.31520260002003], [95.09185944006117, 17.323193519765198]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
