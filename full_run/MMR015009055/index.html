
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hsar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hsar</div><div class="name-mm">လွယ်ဆာ</div></div>
        <span class="pcode-badge">MMR015009055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.25162088839335, 24.036329688564308], [98.24396799772495, 24.031827989070507], [98.24196925088029, 24.02497514158955], [98.24168371523132, 24.01783675756036], [98.24020710577338, 24.016289833708925], [98.23568747379795, 24.011554981377344], [98.228834626317, 24.008414092836176], [98.22569373777583, 24.000704639307685], [98.21561975344895, 24.00289745535332], [98.21042295535517, 24.006150663822154], [98.19795458003989, 24.01581365527602], [98.19615404377419, 24.017209070342346], [98.19291940810427, 24.019715912559377], [98.18037794758425, 24.036437859919374], [98.17774880386429, 24.039943385778656], [98.1771662149489, 24.040720169800068], [98.16328202884262, 24.060450331417712], [98.16115568888398, 24.063471971654224], [98.16053784564514, 24.064349959083415], [98.16053784564514, 24.066187088763172], [98.16053784564514, 24.069127995060967], [98.16587201698007, 24.06920643842642], [98.18966662681345, 24.072537683767166], [98.20865841985028, 24.08101094589847], [98.22059961977669, 24.086338557578415], [98.22543146219226, 24.091564837247518], [98.22530097056341, 24.09104286803398], [98.22641765335209, 24.090070273724223], [98.23886621930063, 24.079227974291655], [98.24400210361426, 24.068699411448733], [98.24761799337574, 24.0612868376175], [98.2515562909901, 24.036781872185713], [98.25162088839335, 24.036329688564308]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
