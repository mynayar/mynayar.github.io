
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Day Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Day Thar</div><div class="name-mm">ပဒေသာ</div></div>
        <span class="pcode-badge">MMR012002073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.93879566728629, 20.32252821690372], [92.94049897604697, 20.323155404997976], [92.94264049116578, 20.323341002585266], [92.94458542257922, 20.32290403459359], [92.94491791722817, 20.32297403422433], [92.95111326226731, 20.32388810065538], [92.95309368902258, 20.31800608481302], [92.95508467921462, 20.311439242427127], [92.95747236395852, 20.308249973057855], [92.95886721964655, 20.29849306540268], [92.95922070267335, 20.296642925230856], [92.96041026202403, 20.29041641688417], [92.96065954959857, 20.28911150329327], [92.9477315074032, 20.293048550850017], [92.94494402634581, 20.29317293068624], [92.9393784999179, 20.293421137275743], [92.9391775706884, 20.29867497037361], [92.93997115764284, 20.303741504366997], [92.94041331202482, 20.30963196933999], [92.93912882293688, 20.32175527838342], [92.93879566728629, 20.32252821690372]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
