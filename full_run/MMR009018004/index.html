
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Thone Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Thone Pin</div><div class="name-mm">မကျီးသုံးပင်</div></div>
        <span class="pcode-badge">MMR009018004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76520676827778, 21.43829856692537], [94.7639525800476, 21.437562413374735], [94.7631230040235, 21.43755381315799], [94.7616275079032, 21.42050515738714], [94.75827667712701, 21.4109313570965], [94.75046862013079, 21.402204704683413], [94.75013894665511, 21.401836246145876], [94.74278366503415, 21.40335802765088], [94.73625693600883, 21.404708385783408], [94.72636310567287, 21.408184597341346], [94.72635793367175, 21.408612823922738], [94.72404178729869, 21.4080251448446], [94.72344932472663, 21.412320037140034], [94.72077135141677, 21.423700882989408], [94.72395100343613, 21.431901877169935], [94.72780007661231, 21.440772348265284], [94.7296409627603, 21.443784970100353], [94.72945540923979, 21.44526918062826], [94.7291387921216, 21.447801750650342], [94.73315539640447, 21.450647030236325], [94.73517046504497, 21.449399588720098], [94.73666988131004, 21.448471366060744], [94.74520535134593, 21.440940041249974], [94.7497241199722, 21.437090702773787], [94.75323866962896, 21.436421301401992], [94.75880155294936, 21.437509392944207], [94.76520676827778, 21.43829856692537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
