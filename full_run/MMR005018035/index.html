
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnaw Ku Toet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnaw Ku Toet</div><div class="name-mm">နှောကူးတို့</div></div>
        <span class="pcode-badge">MMR005018035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14597349657964, 21.895080570312132], [95.14761155412998, 21.892164318028904], [95.14820716882582, 21.890544440273743], [95.15059091993504, 21.884061779827334], [95.15210147969958, 21.87775232970631], [95.15210465880301, 21.87739856159442], [95.15212284309479, 21.875429388055863], [95.15212415970228, 21.875288309607868], [95.15212513366805, 21.875181347840964], [95.15212812031655, 21.874853249977548], [95.15215116004805, 21.872335409951233], [95.15228183963524, 21.872336490037014], [95.15237975961827, 21.872337300326194], [95.15311985130018, 21.87234305868526], [95.15348156042575, 21.868677805136656], [95.15355695958607, 21.867913619717854], [95.14489751980477, 21.86749269023551], [95.13067643956612, 21.865722659872915], [95.12220132033474, 21.86079408008277], [95.12188703965523, 21.867126480003094], [95.12127683975439, 21.8754882900526], [95.12048340028878, 21.875915520185174], [95.12170415981916, 21.89147948968673], [95.13067643956612, 21.89410398031447], [95.1405029997137, 21.895080570312132], [95.14597349657964, 21.895080570312132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
