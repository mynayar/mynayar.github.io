
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Ywar</div><div class="name-mm">နတ်ရွာ</div></div>
        <span class="pcode-badge">MMR007014007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.53021823398439, 18.792174818413173], [96.52832509722549, 18.789158756671327], [96.52425291933685, 18.785497719144473], [96.52650733174801, 18.781955070170397], [96.53101615657044, 18.77970065775918], [96.53359262879684, 18.774869773121566], [96.53262645204916, 18.76842859390456], [96.529627865034, 18.76423922176275], [96.5226426247574, 18.763919769082122], [96.51684556427142, 18.764241827998035], [96.50943820830673, 18.76069917992328], [96.50074261577913, 18.758122707696828], [96.49623379095675, 18.757156530949203], [96.49049131572173, 18.75428529423101], [96.49075878938669, 18.76069917992328], [96.49269114198268, 18.767140359140285], [96.49269114198268, 18.77390359727326], [96.4920470241509, 18.78066683540618], [96.48850437607615, 18.783565364749848], [96.48431761016963, 18.78839624938746], [96.48406797006083, 18.791153678699345], [96.491724965235, 18.79354919294093], [96.49767991159871, 18.7956334239434], [96.50428526475321, 18.794193310772698], [96.51137056090272, 18.793871251856842], [96.5226426247574, 18.79451536968861], [96.52811762722678, 18.793227134025074], [96.53021823398439, 18.792174818413173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
