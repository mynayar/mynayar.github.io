
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Myaung (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyauk Myaung (East) Ward</div><div class="name-mm">ကျောက်မြောင်း (အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17742545122366, 16.80100742575212], [96.1773955730473, 16.801204507681916], [96.17734798362261, 16.801537631856263], [96.17731229222858, 16.8017874761112], [96.17724685665718, 16.802073010860795], [96.17722306239449, 16.802191983972932], [96.1771338325604, 16.802394237903798], [96.1770208075643, 16.80259054371868], [96.17689588723545, 16.80279874666485], [96.17675141474604, 16.803034636139614], [96.17683410740818, 16.803030013624266], [96.1774330154214, 16.80299186708106], [96.17789077843673, 16.8029727933598], [96.17841100656278, 16.802940368303382], [96.17890474605724, 16.8028202287706], [96.17895833216136, 16.802807190399562], [96.18006944634794, 16.80283927910949], [96.18037414565038, 16.80281066897726], [96.18091201757562, 16.802770614971962], [96.1812505727558, 16.80274200483973], [96.18162873677682, 16.802764314321678], [96.18167087001467, 16.802766800047834], [96.18125343259987, 16.801048719023186], [96.1797027585755, 16.80103111299553], [96.178919185572, 16.801070300054334], [96.1783129381916, 16.80106456058104], [96.178003312403, 16.801061630589857], [96.17769337365036, 16.801040162873278], [96.1775627138482, 16.80103111299553], [96.17742545122366, 16.80100742575212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
