
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Sit Thi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Sit Thi</div><div class="name-mm">ရွှေစစ်သည်</div></div>
        <span class="pcode-badge">MMR010028006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.82054990735242, 20.879623862251492], [95.82021931297095, 20.87764029596292], [95.81658277567459, 20.875326136192257], [95.81228504961541, 20.87168959799658], [95.80997088984475, 20.87135900361517], [95.8050119750227, 20.868714248563776], [95.80236722087062, 20.866730684073843], [95.79939187233708, 20.866730684073843], [95.79377176875221, 20.865077712166737], [95.78682928764158, 20.864747117785328], [95.78087859057456, 20.860779986107502], [95.77691145889679, 20.8578046366747], [95.7693077899226, 20.857143448811144], [95.76401828071914, 20.85813523195543], [95.7580675827528, 20.860449391726092], [95.75938996117782, 20.86342474115895], [95.76137352566775, 20.866730684073843], [95.76368768723705, 20.87168959799658], [95.7676548180155, 20.872020192378045], [95.77261373283756, 20.87334256990374], [95.78187037371885, 20.875987324055814], [95.79013523055653, 20.87764029596292], [95.79476355099712, 20.879623862251492], [95.79906127705635, 20.882268616403564], [95.80236722087062, 20.882268616403564], [95.80567316378551, 20.882268616403564], [95.80964029456402, 20.88292980516644], [95.81426861590398, 20.88292980516644], [95.81823574668243, 20.881607426741425], [95.82054990735242, 20.879623862251492]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
