
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Soe Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Soe Chaung</div><div class="name-mm">ရေစိုးချောင်း</div></div>
        <span class="pcode-badge">MMR012008048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.78354259171726, 20.669480932698946], [92.77105246000309, 20.66351982687854], [92.75088846812838, 20.65389276963566], [92.73810731400141, 20.647274492324016], [92.73594933499385, 20.650455103919967], [92.73402173171758, 20.650288609731604], [92.73402173171758, 20.651350777416496], [92.73346219962087, 20.652436929121052], [92.73324507629928, 20.652858403592518], [92.73100647936559, 20.654228973088664], [92.72904199579153, 20.65514268608615], [92.72763468629182, 20.655223102564207], [92.7303421483715, 20.656466894631535], [92.73144849255397, 20.656873843253322], [92.73390902957811, 20.65664609893838], [92.73538470733843, 20.656879923569647], [92.73560794335197, 20.6576996358296], [92.73636257077607, 20.66047054058305], [92.73783789240485, 20.660935901071014], [92.74164630902999, 20.66383609685846], [92.74436658824749, 20.665216996866945], [92.74988131916763, 20.668016241956025], [92.77089967507999, 20.67962324841426], [92.77642652166668, 20.682623601697912], [92.77673207082847, 20.682789460964898], [92.77881037979523, 20.67525559017338], [92.7838849834053, 20.671156875089764], [92.78354259171726, 20.669480932698946]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
