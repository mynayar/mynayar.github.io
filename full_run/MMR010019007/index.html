
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sein Pan Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sein Pan Kan</div><div class="name-mm">စိန်ပန်းကန်</div></div>
        <span class="pcode-badge">MMR010019007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72975175094263, 21.459378288077573], [95.7388247844363, 21.459790698282177], [95.74583576420923, 21.457316235256087], [95.75284674488142, 21.4523673083047], [95.76274459878425, 21.449480433275426], [95.77181763227799, 21.44659355914547], [95.77470450640789, 21.441644632194084], [95.77590168841226, 21.44070398989726], [95.7804782546678, 21.437108115447245], [95.78542718161918, 21.43339642000882], [95.78542718161918, 21.426385440235947], [95.79037610857063, 21.418137228050682], [95.79078851967449, 21.41030142607002], [95.7912334106934, 21.40362805179319], [95.78913887705761, 21.403702857401015], [95.78212789728468, 21.40494008891403], [95.77192682706146, 21.406720966899172], [95.76438552337328, 21.406720966899172], [95.75164331978345, 21.40750110179448], [95.73860142431636, 21.407687415242094], [95.73671155839179, 21.41436943829899], [95.73457228168553, 21.420046747759272], [95.73343774195831, 21.422367397037817], [95.72879218601065, 21.427559489878604], [95.72552302896469, 21.431319020256637], [95.72604005640352, 21.432159187596483], [95.7264524657088, 21.44205704329795], [95.72727728701722, 21.449892844379292], [95.72975175094263, 21.459378288077573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
