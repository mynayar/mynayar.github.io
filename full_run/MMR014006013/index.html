
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kauk</div><div class="name-mm">ညောင်ကောက်</div></div>
        <span class="pcode-badge">MMR014006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70448357385789, 21.033160033109084], [96.70448357385789, 21.02676535333842], [96.70354317977399, 21.02563688043773], [96.69225845166625, 21.01999451593423], [96.68598915897257, 21.018427192760782], [96.67932090993213, 21.019415081840577], [96.67752561311659, 21.019681051839143], [96.67188324771377, 21.028771526784567], [96.65370229692354, 21.036608143551007], [96.63520788203817, 21.04131011397061], [96.61914544530612, 21.042219307874802], [96.61932571081297, 21.04397013591307], [96.6193217879702, 21.044484889865828], [96.61945902001781, 21.04461456580964], [96.61944725418749, 21.046158826768476], [96.61902736881808, 21.046926086070073], [96.618886904607, 21.047052514561926], [96.61494251858244, 21.048180961382286], [96.61181829357946, 21.050343570099756], [96.611570165231, 21.055482950977478], [96.6115530313474, 21.055529651872007], [96.61953464760597, 21.05666988340846], [96.63113284070812, 21.05761027659304], [96.64586568105642, 21.055102559335694], [96.67156978361868, 21.048833265742644], [96.68630262306766, 21.04350436713287], [96.7038566447684, 21.03347349720417], [96.70448357385789, 21.033160033109084]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
