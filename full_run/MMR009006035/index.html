
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Pauk Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Pauk Kone</div><div class="name-mm">အိုင်ပေါက်ကုန်း</div></div>
        <span class="pcode-badge">MMR009006035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24131129398108, 20.618055132338554], [95.23392114024847, 20.61716831356688], [95.21457107169766, 20.617942315985147], [95.21031405794747, 20.60904128502733], [95.20915305387041, 20.59975325331004], [95.20898144973415, 20.5997675534299], [95.19057698863719, 20.601301258146577], [95.18631997398768, 20.607493280190795], [95.18560837013024, 20.61300821525697], [95.18477196915109, 20.619490321721003], [95.18709397730527, 20.629552356755937], [95.18322396341523, 20.640388394209083], [95.18106452300941, 20.644620896936885], [95.18321671757752, 20.644104370420393], [95.19108123491111, 20.64090030900212], [95.19865447532385, 20.638861358864688], [95.21088816535661, 20.63478346308642], [95.21933524012928, 20.63653113270567], [95.22108290884921, 20.640317750663712], [95.22603464168543, 20.64264797772205], [95.22836486874377, 20.646143318759187], [95.23011254106098, 20.6522601673729], [95.23335057616822, 20.657312324804025], [95.23930732477328, 20.657808443904628], [95.23895215731625, 20.65354643981641], [95.23740415158039, 20.64425840809912], [95.23817815489798, 20.637292383636634], [95.24243516864817, 20.63497037638183], [95.24514417936047, 20.626069345424014], [95.24131129398108, 20.618055132338554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
