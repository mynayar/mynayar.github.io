
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hngar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hngar</div><div class="name-mm">သငှါး</div></div>
        <span class="pcode-badge">MMR009017031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37042606890799, 19.515031279270147], [95.36110662926757, 19.520397016808943], [95.35432955506496, 19.518613575755978], [95.34434228876569, 19.520040328598327], [95.33613846262, 19.522180456962587], [95.33007476483857, 19.522537145173146], [95.32187093869294, 19.528600842954575], [95.32080087496047, 19.53609129267909], [95.31473717807836, 19.543581742403546], [95.31485507560132, 19.54370974560834], [95.32722126095251, 19.557135889010112], [95.33578177530876, 19.564983026945185], [95.3388894491888, 19.56724315364869], [95.33934865471667, 19.566409779787534], [95.34480994612215, 19.570428465101656], [95.34969261012594, 19.56676646799815], [95.3571830598504, 19.562486211269686], [95.36788370167153, 19.56319958679154], [95.37323402303178, 19.55963270558493], [95.38500473038408, 19.557849266330606], [95.39065062202866, 19.556621897682476], [95.38892829890193, 19.551072192128004], [95.38286460201982, 19.53965817298632], [95.37644421602778, 19.53288109968304], [95.37038051914573, 19.515760071869863], [95.37042606890799, 19.515031279270147]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
