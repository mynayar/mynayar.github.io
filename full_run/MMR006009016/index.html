
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khi Ka Hpwaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawthoung</div><div class="name-mm">ကော့သောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khi Ka Hpwaing</div><div class="name-mm">ခိကဖွိုင်း</div></div>
        <span class="pcode-badge">MMR006009016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.69843555985324, 10.437020190029784], [98.70084216003772, 10.441431719897992], [98.7048525598978, 10.44544220969027], [98.7068577602775, 10.448249580154027], [98.7068577602775, 10.454265270326005], [98.7068577602775, 10.459478880346126], [98.71006607998567, 10.463890410214333], [98.72350127956048, 10.455192719568402], [98.73703656018915, 10.446845939888249], [98.74628568004016, 10.439627039556285], [98.75824200026818, 10.429475489602225], [98.76794256000119, 10.419775109733564], [98.77114970879211, 10.417037176824294], [98.77167169509272, 10.416764597708038], [98.7713821637559, 10.416036558740245], [98.76872914573357, 10.403948924903034], [98.76701014110517, 10.403040051157461], [98.76657247434025, 10.40261019680321], [98.76537720429462, 10.403443511309035], [98.76185136005228, 10.404660599806903], [98.75057183991856, 10.40894684961745], [98.7390669595726, 10.415714489931815], [98.72936639983953, 10.420226279819019], [98.71898939974108, 10.425414869800477], [98.70883775985482, 10.430828999858534], [98.69843555985324, 10.437020190029784]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
