
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thu Yaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thu Yaung</div><div class="name-mm">သူရောင်း</div></div>
        <span class="pcode-badge">MMR005021037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11381556023997, 24.487894890237044], [96.11386019988839, 24.48788930994374], [96.12332712025045, 24.486705990089433], [96.13283795990401, 24.48512081987002], [96.14274552018969, 24.48274301957474], [96.15186035956799, 24.48274301957474], [96.16057883984166, 24.48274301957474], [96.16612679981205, 24.48274301957474], [96.17048604039849, 24.48155412032645], [96.17048604039849, 24.477591149811758], [96.16886080088528, 24.472715347635244], [96.16702752030386, 24.46721540966348], [96.16652315981605, 24.465702329998578], [96.1649380804281, 24.455794859645096], [96.1578046804417, 24.448661549590895], [96.14789747988488, 24.44113197036421], [96.1391789996112, 24.437961629925326], [96.13600848020724, 24.430828229938925], [96.1320455996248, 24.426072720179945], [96.12894420031466, 24.423883380014047], [96.12872316044553, 24.42547610993455], [96.12591552018517, 24.43811031034261], [96.11907948013396, 24.452087400013568], [96.11328131977717, 24.465087899686864], [96.10914959957444, 24.476875829955645], [96.10913088018606, 24.476928749662136], [96.11381556023997, 24.487894890237044]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
