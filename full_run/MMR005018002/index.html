
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Htone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Htone</div><div class="name-mm">ဆားထုံး</div></div>
        <span class="pcode-badge">MMR005018002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13446168066207, 21.997778607296937], [95.13568404728102, 21.98937482858554], [95.13509253799032, 21.983065401846886], [95.13489536882628, 21.97872767124511], [95.13721992835707, 21.97176420985045], [95.13722546278495, 21.97174262342338], [95.13725923592506, 21.971610907817194], [95.13777897392055, 21.969583931253453], [95.13629069935632, 21.970091705567825], [95.13626723964148, 21.970099710433317], [95.12591544034535, 21.973083480218463], [95.11352532043725, 21.975891119579558], [95.11248779957236, 21.983520510063556], [95.1113286004346, 21.982730040159254], [95.11187759967157, 21.991088879748077], [95.11389143983814, 22.000915529827864], [95.11385400016206, 22.0009126501987], [95.11389143983814, 22.00109859042766], [95.11389143983814, 22.00292972972329], [95.12591544034535, 22.00872806994454], [95.13867204028247, 22.01312259003555], [95.13885782043212, 22.013198891215893], [95.13844442277195, 22.00869745162612], [95.13686706496316, 22.004359721024343], [95.13410669217018, 22.000219157787967], [95.13446168066207, 21.997778607296937]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
