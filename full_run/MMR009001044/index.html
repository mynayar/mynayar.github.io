
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Pyit San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Pyit San</div><div class="name-mm">ဆူးပြစ်စမ်း</div></div>
        <span class="pcode-badge">MMR009001044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21163760279319, 19.900099456824535], [95.21138729718609, 19.9009004362062], [95.2147095403131, 19.906880473655008], [95.21437731636013, 19.919837221310786], [95.2107228492801, 19.935119538436027], [95.2074006061531, 19.94442181811246], [95.2074006061531, 19.948740733997738], [95.2180317834401, 19.95704634091595], [95.22666961521065, 19.960036360089987], [95.23658097243401, 19.960036360089987], [95.24793196888533, 19.955052995399456], [95.25291533267654, 19.946415163628956], [95.25821939111205, 19.932823515293023], [95.25823092221935, 19.932793968067244], [95.25789869826639, 19.931797295308968], [95.24892864164354, 19.925817257860217], [95.24560639941586, 19.92149834197494], [95.24660307217408, 19.90256155776973], [95.24128748263126, 19.895252623609736], [95.22401181998958, 19.890269258919204], [95.21679944423903, 19.888604864722765], [95.21537398911835, 19.888275914302028], [95.21304841874957, 19.895584847562702], [95.21163760279319, 19.900099456824535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
