
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpein Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpein Kar</div><div class="name-mm">ဖိန်းကား</div></div>
        <span class="pcode-badge">MMR005009052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4061225198385, 22.812995609559778], [95.40624779989611, 22.81441428019491], [95.4141843601202, 22.82204565008675], [95.42059487965003, 22.828761270016628], [95.43005784029714, 22.828761270016628], [95.43677328036267, 22.82601393019877], [95.43987252040057, 22.822053750280418], [95.43769235961474, 22.81987349956239], [95.43696983978634, 22.81192442976868], [95.44058279955664, 22.804517340003315], [95.44074336001813, 22.804473060083694], [95.43738383999226, 22.80159351003249], [95.43402612040921, 22.79762522992047], [95.43404160043957, 22.797437670012528], [95.42761559998002, 22.800983040335097], [95.42334203960348, 22.800067290373192], [95.41510020001425, 22.797930510184926], [95.40838475994877, 22.802509349926595], [95.40614051976922, 22.803631290151998], [95.405331960002, 22.804035569585892], [95.4061225198385, 22.812995609559778]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
