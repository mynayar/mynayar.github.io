
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Kaing</div><div class="name-mm">သဖန်းကိုင်း</div></div>
        <span class="pcode-badge">MMR010009020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24689865484908, 22.221824230104176], [96.23306970870016, 22.21959375404856], [96.22548609280898, 22.218701563626325], [96.22548609280898, 22.22227032531532], [96.22660133038715, 22.2285156546738], [96.22727047275418, 22.233199653041595], [96.22459390328606, 22.24435202972245], [96.22377007932573, 22.24634293627753], [96.22637828323127, 22.24814383766801], [96.2346310405901, 22.24814383766801], [96.24377599016987, 22.250597360879567], [96.25002132132698, 22.253943073613982], [96.25381312927254, 22.258627071981834], [96.2573818891629, 22.264426307028486], [96.26295807705367, 22.26977944776337], [96.265857694577, 22.273348207653726], [96.26942645626599, 22.268664210185193], [96.26898036015558, 22.26353411660625], [96.26184284037487, 22.244575076878334], [96.25626665068546, 22.2298539412065], [96.24689865484908, 22.221824230104176]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
