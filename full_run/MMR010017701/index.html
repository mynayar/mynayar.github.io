
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR010017701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38255294915933, 21.446049588917447], [95.38255294915933, 21.450175849336006], [95.3846924911656, 21.455643569095514], [95.38540567243388, 21.460873561165954], [95.3861188528029, 21.46752991577307], [95.38584265931132, 21.468516323669462], [95.38445476437596, 21.47347308911185], [95.38255294915933, 21.477514447234], [95.37970022588479, 21.483695347362413], [95.37993795267442, 21.487498978694987], [95.38302840273866, 21.484646255420387], [95.38635657959253, 21.48155580535621], [95.38944702965676, 21.478465355291974], [95.39322870584016, 21.480006036949078], [95.39586565837351, 21.481080350877562], [95.4006201959653, 21.482506713414125], [95.40513700766684, 21.482744440203817], [95.40537473535579, 21.481318077667197], [95.40347292013922, 21.475850357907746], [95.40347292013922, 21.473235362322157], [95.40347292013922, 21.470382639047614], [95.41090361890696, 21.467441453959964], [95.41090361890696, 21.44916719311152], [95.40585018893512, 21.435912232963233], [95.40466155408751, 21.433297235579005], [95.40157110402328, 21.43020678641409], [95.39776747269076, 21.429493605145808], [95.392537479721, 21.429255878356173], [95.39034789044285, 21.429021279408573], [95.38920930286707, 21.43044451320378], [95.38516794474492, 21.431870874841024], [95.38445476437596, 21.43710086691152], [95.38255294915933, 21.44304404114962], [95.38255294915933, 21.446049588917447]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
