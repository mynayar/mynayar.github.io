
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htaung Hmu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaton</div><div class="name-mm">သထုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htaung Hmu</div><div class="name-mm">ထောင်မှူး</div></div>
        <span class="pcode-badge">MMR011007043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.41586600021577, 16.952641999928403], [97.41783100000072, 16.952808000388984], [97.4204520003596, 16.953029999834655], [97.4254739999252, 16.953455999694654], [97.42700300028827, 16.953585000247585], [97.42934400032539, 16.950530999705904], [97.43152800031703, 16.95071600014336], [97.43210099976142, 16.94794600010789], [97.4343269998912, 16.947267000271893], [97.4376439999707, 16.94668100022801], [97.44161699972483, 16.946150000022556], [97.44338500031756, 16.945866000415663], [97.44621300032975, 16.94632199986046], [97.45043099969092, 16.948460999575502], [97.44574011791218, 16.937983722370916], [97.44574011791218, 16.93047581590622], [97.44490590588293, 16.922133698311598], [97.44242199997535, 16.91467299995901], [97.4354319995872, 16.91514099995726], [97.43176295719479, 16.91530226728588], [97.43131400034088, 16.91532200021021], [97.42920199557568, 16.914841805405047], [97.4263659996912, 16.914196999591923], [97.42071376422888, 16.927138968688496], [97.42071376422888, 16.94006925109511], [97.41917642804975, 16.9440563558162], [97.41586600021577, 16.952641999928403]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
