
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Zin Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Zin Lay</div><div class="name-mm">ညောင်ဇင်လေး</div></div>
        <span class="pcode-badge">MMR005007045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5354874402932, 23.04105525019969], [95.54159699990169, 23.0341819503368], [95.54405399989224, 23.034311280041607], [95.54541299961028, 23.03062280959506], [95.55169644043843, 23.023641240351026], [95.55448896039724, 23.01840513019266], [95.55919452001115, 23.013363600050127], [95.55871031962562, 23.00828057968505], [95.55652620002417, 23.00746779040628], [95.53882176041594, 23.00088015029877], [95.53142124019814, 22.998567600314573], [95.52032064018545, 22.991167170028916], [95.51577780030527, 22.985975249857972], [95.51123748032552, 22.990515479905525], [95.50821419972561, 22.99232952039108], [95.51233439961294, 22.999883580063226], [95.51338272043625, 23.001805260404467], [95.5147705200435, 23.009668110395012], [95.51569536035265, 23.020768710407708], [95.52078323975479, 23.025393990240502], [95.5283086803014, 23.031731250097152], [95.52957119985103, 23.03279441962684], [95.53142124019814, 23.03834471963313], [95.5354874402932, 23.04105525019969]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
