
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Ngu Maw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Ngu Maw</div><div class="name-mm">အငူမော်</div></div>
        <span class="pcode-badge">MMR012008036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.73288057927539, 20.303000695925448], [92.73293042959568, 20.30173576079676], [92.73491458943681, 20.298379987346607], [92.73780923101128, 20.294399853270647], [92.74045305796233, 20.2881502080657], [92.74342470038965, 20.284749003563718], [92.74342418957474, 20.2845646857117], [92.74341339771019, 20.280668625656574], [92.74294918295851, 20.27877185383801], [92.74382830623142, 20.275407651042315], [92.73897961681593, 20.27773706961011], [92.73737234215992, 20.27902710841437], [92.73540253100208, 20.28112682844045], [92.73317197490678, 20.282360317874407], [92.72490244968839, 20.288655570398305], [92.72620706020774, 20.292244539853698], [92.7264649057309, 20.29471868362043], [92.72435861885526, 20.299662858554143], [92.73039673002512, 20.302474609615615], [92.73172240176751, 20.30261228323036], [92.73288057927539, 20.303000695925448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
