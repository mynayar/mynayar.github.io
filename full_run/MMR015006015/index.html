
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Keint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Keint</div><div class="name-mm">ကွန်ကိန့်</div></div>
        <span class="pcode-badge">MMR015006015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.115358331322, 22.498153031836978], [99.11138680375802, 22.501008965691256], [99.10186630178845, 22.50376490122926], [99.09810820942636, 22.506771375298797], [99.08908878631848, 22.5102789291293], [99.0828252978493, 22.513034862868665], [99.07634792361785, 22.5168801651875], [99.07606073141767, 22.52255536483824], [99.08207367955674, 22.533078025430598], [99.08457907476458, 22.540594211054042], [99.08733501030252, 22.544352304315453], [99.09510173535688, 22.55262010823145], [99.09619269213908, 22.554681055786148], [99.10437169699628, 22.559134136131547], [99.11714921336556, 22.563894387116306], [99.13368482209694, 22.56840409867027], [99.14906481818684, 22.570266234898895], [99.15136177662475, 22.56973103036279], [99.16799017830414, 22.5590413440828], [99.18640019361408, 22.551914885963242], [99.18957072470926, 22.550579926022806], [99.18654866089207, 22.549864173592766], [99.19055729358428, 22.546356619762264], [99.19982725612306, 22.54009313219234], [99.2068423628848, 22.537838276415357], [99.21425171624378, 22.533820649603342], [99.20458750710782, 22.528818854206804], [99.18905405699917, 22.523557524360285], [99.16725711842133, 22.51579079840667], [99.14621179813605, 22.50752299359135], [99.11765029222727, 22.498754110813593], [99.115358331322, 22.498153031836978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
