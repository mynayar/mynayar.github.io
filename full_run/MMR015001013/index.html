
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Peik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Peik</div><div class="name-mm">ဟိုပိတ်</div></div>
        <span class="pcode-badge">MMR015001013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.78616594280408, 23.071433848893037], [97.77990712181628, 23.06624187206478], [97.77393279236452, 23.058560590698733], [97.7685274468842, 23.052870752783065], [97.76596702036176, 23.044335996808854], [97.76625151099847, 23.038361667357094], [97.76738947894137, 23.033240813412874], [97.76748751943353, 23.02766477211162], [97.76511354395495, 23.02755097639647], [97.75288039261608, 23.028404451004633], [97.74690606316432, 23.028404451004633], [97.74206970075613, 23.03096487842646], [97.73723333924727, 23.03551674839929], [97.73581087976834, 23.04206006182244], [97.73182799376696, 23.046896424230624], [97.72670713982268, 23.053439736754513], [97.72130179434237, 23.056853639683766], [97.70878415056814, 23.063965937078365], [97.70585947973126, 23.065849328783543], [97.70707719955317, 23.072785184588668], [97.7073463729368, 23.07903154996609], [97.71646543193418, 23.083026893376484], [97.73211248530299, 23.085018335927487], [97.75088895006508, 23.08672528694251], [97.76141514859029, 23.086440795406418], [97.77820017080131, 23.079897481983267], [97.78616594280408, 23.071433848893037]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
