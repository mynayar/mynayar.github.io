
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Lwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mansi</div><div class="name-mm">မံစီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Lwin</div><div class="name-mm">ကောင်လွင်</div></div>
        <span class="pcode-badge">MMR001013032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.00450914458139, 23.762130604643744], [97.00363819434727, 23.770404649854754], [97.00842843142703, 23.769098221805564], [97.0097348585769, 23.781291549365562], [97.01583152370591, 23.786517263361077], [97.02454104403404, 23.789130121258154], [97.02933128201312, 23.79914606873615], [97.0315086611958, 23.80393630581591], [97.03814332865176, 23.79770755186206], [97.05282678632716, 23.791416238368754], [97.07339043601985, 23.78319077813194], [97.08261164990779, 23.781927385340623], [97.08932726444175, 23.770852587776744], [97.10372181940647, 23.755429851406575], [97.10989091413444, 23.73795074862818], [97.1114331866923, 23.724070285715186], [97.11246136989638, 23.714302552021195], [97.10372181940647, 23.710189821902816], [97.08572862637504, 23.705563000632026], [97.07493271037634, 23.70916163959805], [97.0631086111735, 23.72252801225801], [97.05025632966596, 23.741549387594205], [97.04203087032846, 23.758000307168516], [97.03123495432976, 23.76571167625292], [97.01463742727549, 23.763517209951317], [97.00450914458139, 23.762130604643744]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
