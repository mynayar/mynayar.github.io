
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (10) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Latha</div><div class="name-mm">လသာ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (10) Ward</div><div class="name-mm">အမှတ် (၁၀) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013036701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14797231876753, 16.781563653240028], [96.15032768457502, 16.78149613843607], [96.15157381667836, 16.781461715985472], [96.1520291434303, 16.781445715247628], [96.15293979603484, 16.78141371377194], [96.15288851759107, 16.78096022973085], [96.15338210959675, 16.78097114570187], [96.15336046561305, 16.779524527734793], [96.15096092240873, 16.77959251378354], [96.14991188032906, 16.779649734048064], [96.1486606598616, 16.779691696414716], [96.14785035540962, 16.77972348565038], [96.14784049973935, 16.78020095820773], [96.14784049973935, 16.780534744283045], [96.14784847582655, 16.781190179183454], [96.14797231876753, 16.781563653240028]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
