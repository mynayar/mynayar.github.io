
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR005037703</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84811554269822, 26.838343274022918], [95.8413343280169, 26.82348918437839], [95.83581898735645, 26.809700830928648], [95.82636411611111, 26.80142781903868], [95.82488999957388, 26.792724600260158], [95.82110604001178, 26.78112791981772], [95.82550056010285, 26.761901849790604], [95.8311158397243, 26.752929659975905], [95.81488019986142, 26.730285659855383], [95.79748535996146, 26.714111309689258], [95.7952706400281, 26.707896809989847], [95.78588868041834, 26.713928249988783], [95.77807632016612, 26.728515630392053], [95.78444399959096, 26.748770399834143], [95.78448504015256, 26.74890135011725], [95.78428776037191, 26.748806309763438], [95.78377763972634, 26.74856070041602], [95.78387447962359, 26.74890135011725], [95.77532951994147, 26.761108410324937], [95.76312263959818, 26.784301770310492], [95.75955432037563, 26.795974320258722], [95.74541855971881, 26.80086239997985], [95.74530011990464, 26.80090334970987], [95.75653068004692, 26.814697289748153], [95.77172844021538, 26.82690426002364], [95.78192148039204, 26.833496129642697], [95.79431160030015, 26.838500939566757], [95.81530751992614, 26.8421020201921], [95.83990487990633, 26.8421020201921], [95.84811554269822, 26.838343274022918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
