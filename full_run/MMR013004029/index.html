
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Khun Taing (Hlegu)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Khun Taing (Hlegu)</div><div class="name-mm">တံခွန်တိုင် (လှည်းကူး)</div></div>
        <span class="pcode-badge">MMR013004029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.28349113900492, 17.095634841075082], [96.28150064793664, 17.0916297220341], [96.27768108511407, 17.085397803365993], [96.27285637522158, 17.08077412162845], [96.2617997448624, 17.07393911489828], [96.2591863599626, 17.073336025936896], [96.25858327100121, 17.077155588759467], [96.25818121199342, 17.081377210589835], [96.25938738991618, 17.08660398128876], [96.25978944892398, 17.09062457316554], [96.25978944892398, 17.09263487000328], [96.25858327100121, 17.09343898801893], [96.2531554721474, 17.096052372918734], [96.25255238318601, 17.097258550841502], [96.2497870893028, 17.09847501610915], [96.25008878037295, 17.098564871871417], [96.25213980211026, 17.099443881829757], [96.2568278519239, 17.101787907186235], [96.26151590173754, 17.102080909906135], [96.26542388230638, 17.101429580410866], [96.26678995878962, 17.101201899947796], [96.27001299410443, 17.099150878210537], [96.27294302490071, 17.095634841075082], [96.27792407923295, 17.094755831116743], [96.28349113900492, 17.095634841075082]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
