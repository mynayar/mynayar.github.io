
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Lun Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Lun Hpyu</div><div class="name-mm">သလွန်ဖြူ</div></div>
        <span class="pcode-badge">MMR010009076</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13861314977709, 22.09803843742401], [96.13190311014046, 22.09803843742401], [96.1261871496173, 22.09803843742401], [96.11850016924745, 22.09744713138008], [96.11101028969318, 22.09744713138008], [96.10805375857416, 22.102374683245102], [96.1025349006652, 22.102374683245102], [96.09405951163723, 22.103951498762683], [96.08972326581613, 22.10690802988171], [96.09169428656213, 22.110652969658872], [96.09819865484411, 22.11203268436094], [96.10805375857416, 22.11203268436094], [96.10930492867959, 22.11203268436094], [96.11258710700946, 22.11203268436094], [96.11909147529138, 22.111047173987913], [96.12835527207818, 22.110652969658872], [96.13623935506223, 22.109864561000734], [96.14140581812404, 22.109864561000734], [96.14116690692725, 22.107893541154056], [96.13919588618126, 22.101389171972755], [96.13861314977709, 22.09803843742401]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
