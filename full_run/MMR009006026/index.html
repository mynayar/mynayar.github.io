
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na-Gway Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na-Gway Cho</div><div class="name-mm">န-ဂွေးချို</div></div>
        <span class="pcode-badge">MMR009006026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41696829784871, 20.43649107999937], [95.41702983036242, 20.438213979591524], [95.4226728001097, 20.439965245599637], [95.43136902126338, 20.442664074187746], [95.43820178688304, 20.450235516855685], [95.45213612638116, 20.4550254463673], [95.4674642279918, 20.440191800111563], [95.47865688800505, 20.435528191173148], [95.48526460277924, 20.42585260831129], [95.48922024202062, 20.419424694993722], [95.48477014832372, 20.414974601296876], [95.47537550557519, 20.414974601296876], [95.47374671284058, 20.413997325116497], [95.47043095742282, 20.412007871865853], [95.46857458225122, 20.409090711267368], [95.46696977263696, 20.406568868358647], [95.47133790212257, 20.401909530300657], [95.46997655157668, 20.401541597866526], [95.46845313690278, 20.40112986395212], [95.46795868244732, 20.393218586368732], [95.46400304320593, 20.387285128406006], [95.44373039344293, 20.39025185693771], [95.4247924374211, 20.38830950208188], [95.42472919889349, 20.393571768122627], [95.42593001775617, 20.39717422471074], [95.43631357031506, 20.402118773762425], [95.42939120164272, 20.406568868358647], [95.41702983036242, 20.40755777816895], [95.41686228037003, 20.41325448600577], [95.41653537500758, 20.42436924404541], [95.41696829784871, 20.43649107999937]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
