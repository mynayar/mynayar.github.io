
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Ta Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Ta Zin</div><div class="name-mm">အင်းတဇင်</div></div>
        <span class="pcode-badge">MMR007007013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.55866780937197, 17.77988830959788], [96.55707400206359, 17.787857343441715], [96.55569637558733, 17.790906002909765], [96.55560285778574, 17.791112956697646], [96.56400321097948, 17.787379467088783], [96.57141029714757, 17.786423714382977], [96.57626306318986, 17.786198004334494], [96.58168464233245, 17.785945837130726], [96.58860006644, 17.784365168917475], [96.59004748120634, 17.784034330819736], [96.58837491307185, 17.779255566391328], [96.58980854213058, 17.773043171105485], [96.58980854213058, 17.76683077671902], [96.59195898661801, 17.76133519686192], [96.59673775194574, 17.758706876021563], [96.60366696086163, 17.756795369710574], [96.60486165174387, 17.754644926122467], [96.60499472802434, 17.750530793061728], [96.60348775655478, 17.750821914399864], [96.59936607188678, 17.750821914399864], [96.59458730655899, 17.752733419811534], [96.58956960395415, 17.753928110693778], [96.58335720956762, 17.755361740651836], [96.57953419784502, 17.757512185139262], [96.57403861798787, 17.76014050597962], [96.5687819763072, 17.761813074114116], [96.56576283798466, 17.76153254858832], [96.5629085049236, 17.76260372388282], [96.56256958192074, 17.767786530324145], [96.55970232290395, 17.774715739240037], [96.55866780937197, 17.77988830959788]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
