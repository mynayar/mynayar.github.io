
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyan Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyan Kyun</div><div class="name-mm">ဉာဏ်ကျွန်း</div></div>
        <span class="pcode-badge">MMR007002043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6601790398309, 17.295292983184652], [96.66559866384733, 17.292402517162486], [96.66993436288061, 17.288428126157157], [96.67733825285814, 17.280020709688074], [96.68392122458488, 17.27384917509943], [96.69378070891264, 17.264581780125127], [96.69305809195743, 17.259523465035954], [96.68944500987936, 17.252658608008403], [96.68673519787114, 17.249948796000183], [96.68221884392455, 17.254465149047462], [96.6767992199081, 17.25699430704168], [96.6749926788691, 17.252658608008403], [96.67370922580017, 17.24990835078978], [96.67137959589172, 17.250490758042076], [96.66812782184155, 17.25301991603635], [96.66379212280827, 17.255910382058516], [96.66219148784694, 17.257110858279532], [96.6619855808699, 17.262052623030172], [96.659456423775, 17.268194863102508], [96.65801119076389, 17.275782337085218], [96.6601790398309, 17.281563269129606], [96.65932656976543, 17.285421026159497], [96.65837249879183, 17.28987335916827], [96.6601790398309, 17.295292983184652]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
