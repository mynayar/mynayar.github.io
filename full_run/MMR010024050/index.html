
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Tee</div><div class="name-mm">မဲတီး</div></div>
        <span class="pcode-badge">MMR010024050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88618219735059, 20.648173049047045], [95.88143309256321, 20.64764537093714], [95.86973622674554, 20.647212154017723], [95.86107188206176, 20.64504606762199], [95.85533588284477, 20.643680352666195], [95.85500684069319, 20.648945022594773], [95.8593390125854, 20.65674293343966], [95.86323796755823, 20.66324119172765], [95.86583727177276, 20.671039102572593], [95.86713692432966, 20.678837014316798], [95.86497083703455, 20.68663492426242], [95.86323796755823, 20.696598920603776], [95.86150509898118, 20.70439683234798], [95.8680033581685, 20.708729004240183], [95.87406840043639, 20.712627960112343], [95.87796735540917, 20.715227263427494], [95.88446561369716, 20.717393348923963], [95.89226352544142, 20.715660480346912], [95.8978953489912, 20.715227263427494], [95.8961624804142, 20.710895090635972], [95.89702891425304, 20.70699613476387], [95.8978953489912, 20.70266396287161], [95.90006143538699, 20.697465356241253], [95.90655969367498, 20.692266748711518], [95.91089186736582, 20.690533880134524], [95.91643405998394, 20.690533880134524], [95.9113250842853, 20.68273596928958], [95.90352717344035, 20.672338755129488], [95.89746213207178, 20.66540727902276], [95.89139708980389, 20.659342236754867], [95.88879778738806, 20.65197754372872], [95.88618219735059, 20.648173049047045]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
