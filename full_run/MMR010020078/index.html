
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pway Kyit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pway Kyit</div><div class="name-mm">ပွေးကျစ်</div></div>
        <span class="pcode-badge">MMR010020078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09260076471355, 20.66847372528224], [95.0994749297243, 20.667786307791914], [95.10703651132599, 20.662630685158035], [95.11597292610969, 20.66091214278123], [95.12490934089345, 20.656443935839036], [95.12509622181324, 20.656371259825846], [95.12422192430245, 20.65060089571483], [95.12387821600691, 20.641664480931126], [95.1173477592917, 20.63032210897819], [95.11391067633673, 20.6227605273765], [95.11300062357998, 20.61912031634955], [95.1116489821149, 20.619151985076087], [95.11035347003667, 20.61918449376941], [95.10919993932578, 20.61850657941517], [95.10497426155297, 20.621041985898955], [95.09775638824681, 20.634790315920384], [95.09397559789556, 20.64063335604459], [95.09328818130456, 20.64922606343214], [95.09319635512776, 20.64934658427751], [95.08778884857657, 20.656443935839036], [95.08400805822538, 20.664692934031734], [95.08916368175858, 20.666755183804753], [95.09260076471355, 20.66847372528224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
