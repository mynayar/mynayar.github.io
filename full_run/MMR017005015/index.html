
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chaung</div><div class="name-mm">သရက်ချောင်း</div></div>
        <span class="pcode-badge">MMR017005015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22463391971968, 17.465470110257456], [95.22752616010428, 17.470933290239202], [95.22825373142462, 17.473188795326678], [95.22889524032314, 17.475177510233948], [95.23067507959132, 17.479558529702445], [95.23085946759039, 17.480188463426884], [95.23231812028507, 17.485171739983855], [95.23875275963223, 17.48257046985134], [95.24628251962264, 17.480790719616095], [95.25463416013844, 17.478326339788794], [95.26261895999704, 17.47667987987262], [95.25586608025549, 17.473603050040765], [95.25230639992049, 17.47100177990825], [95.25258036039537, 17.469085050334854], [95.25340188029259, 17.46538856962684], [95.25331980006877, 17.46319806034228], [95.24967659969536, 17.462737979773976], [95.24792556031639, 17.46251351978316], [95.24395512003281, 17.46265041008843], [95.23888956000525, 17.46374561976461], [95.23656216041542, 17.464019490307294], [95.23341324002905, 17.46484092027231], [95.23272888023371, 17.46484092027231], [95.22793692005285, 17.465114699983474], [95.22463391971968, 17.465470110257456]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
