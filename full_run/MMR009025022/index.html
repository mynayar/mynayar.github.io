
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Boet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Boet Gyi</div><div class="name-mm">တောင်ဘို့ကြီး</div></div>
        <span class="pcode-badge">MMR009025022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.19058370857135, 21.05523871939141], [94.18875684825002, 21.050106108610066], [94.18783516995717, 21.04388478395566], [94.18829600865394, 21.031442133747532], [94.18460929818065, 21.017386547651085], [94.1843788792819, 21.007248091826], [94.18612412522828, 21.002964307956518], [94.17834449400323, 21.003853408308203], [94.16874972242181, 21.00762278266535], [94.16367891664873, 21.010353217027387], [94.16387154783371, 21.012086901289535], [94.15995441666308, 21.022686194912012], [94.1567285448865, 21.029368359162504], [94.15472544262514, 21.032345944309952], [94.15511560899819, 21.032594230939083], [94.16184654528189, 21.051609124861272], [94.16525406482327, 21.051719045397704], [94.17032329228618, 21.053331981285965], [94.17861839332426, 21.05471449827553], [94.18760475105847, 21.055175336972297], [94.19058370857135, 21.05523871939141]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
