
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Kauk Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Kauk Gyi</div><div class="name-mm">ဆူးကောက်ကြီး</div></div>
        <span class="pcode-badge">MMR009004043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53148489780983, 19.858538956707548], [95.52393391831572, 19.868204211755028], [95.51640590570804, 19.865694874818644], [95.51766057507552, 19.860362532704755], [95.51766057507552, 19.85877926095418], [95.51075989715162, 19.866008542160557], [95.509283498135, 19.864872850401753], [95.50887789399968, 19.866008542160557], [95.49633120841861, 19.876673224589695], [95.48943053139396, 19.886710574133758], [95.48803367021776, 19.891699360836867], [95.49507653905107, 19.892042916247647], [95.49978154738056, 19.89549325431028], [95.50730955908892, 19.899570927056686], [95.51295556674609, 19.901139262866764], [95.52016991201191, 19.90145293020862], [95.53052092799851, 19.89612058899405], [95.53671386555249, 19.8955659968733], [95.53665287622931, 19.895444018226897], [95.54030777408457, 19.89306039032482], [95.5439626710405, 19.891630211964753], [95.54816354910855, 19.89152775220407], [95.54743323665463, 19.890838012664176], [95.54286440366934, 19.885355413621483], [95.536772627255, 19.874542510328638], [95.53250838295554, 19.865557138251404], [95.53148489780983, 19.858538956707548]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
