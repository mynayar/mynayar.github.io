
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsawng Kye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsawng Kye</div><div class="name-mm">ဆောင်ကြဲ</div></div>
        <span class="pcode-badge">MMR015014017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.62323270462565, 22.479873941629137], [97.61824398717033, 22.461027675087166], [97.6142958833484, 22.448619348404236], [97.59511937765723, 22.433954961752136], [97.58496711004415, 22.433954961752136], [97.587223169114, 22.425494738891132], [97.58025155176779, 22.41811302619527], [97.57697438266172, 22.418733031404315], [97.57095678682629, 22.419735963443998], [97.5625990138335, 22.430768223974383], [97.54989519870452, 22.437788752748816], [97.53050516608062, 22.442469106164367], [97.51245237587648, 22.44748376906074], [97.47567817560736, 22.455507230774117], [97.4705824496204, 22.45323467903728], [97.48383379269546, 22.469441259106873], [97.52276247001203, 22.509612341736215], [97.52437909312073, 22.51385597717166], [97.52648968415167, 22.51209715056308], [97.54512575305114, 22.522864657877733], [97.55232209299027, 22.52437967738024], [97.56251941843647, 22.504228588978265], [97.56873144140297, 22.496774160699033], [97.5844685663713, 22.49180454214593], [97.58943818492435, 22.485592519179477], [97.6006198264439, 22.478552226903787], [97.61055906265068, 22.478552226903787], [97.62049829975678, 22.479794631317247], [97.62323270462565, 22.479873941629137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
