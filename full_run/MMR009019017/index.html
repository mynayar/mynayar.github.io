
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Taw</div><div class="name-mm">ညောင်တော</div></div>
        <span class="pcode-badge">MMR009019017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2208317416916, 21.643821814025557], [95.22097590121695, 21.64857910444215], [95.22098364168176, 21.648834528091072], [95.2276088500684, 21.648834528091072], [95.22711420765461, 21.6587273727701], [95.23354455723558, 21.663673796008936], [95.23468767829377, 21.6657967347316], [95.23700705323296, 21.670104144690583], [95.24305026715615, 21.67541038128411], [95.24297194519914, 21.67454884425382], [95.2472506910666, 21.67261316416625], [95.24877630728082, 21.6707427002155], [95.25254689932001, 21.669002439211226], [95.2515530989964, 21.667997364986434], [95.25096528501996, 21.667402883436353], [95.24244811708701, 21.6597166575977], [95.23641689292532, 21.65136573204296], [95.23601776840536, 21.650813096847003], [95.23024783327094, 21.63542660585324], [95.23008206123819, 21.634984545900124], [95.22411051069156, 21.63217440462512], [95.22126010586925, 21.634331708241803], [95.22123570456415, 21.63452691688377], [95.22101198381608, 21.636316685566612], [95.22068385897296, 21.638941684311305], [95.2208317416916, 21.643821814025557]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
