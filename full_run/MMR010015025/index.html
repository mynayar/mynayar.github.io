
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit</div><div class="name-mm">ရွာသစ်</div></div>
        <span class="pcode-badge">MMR010015025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1592622980167, 21.447117948434595], [96.16270711424198, 21.445326643709677], [96.16615192866863, 21.446153400359208], [96.16945895166936, 21.446566777334965], [96.17193921891987, 21.446153400359208], [96.1744194861704, 21.446015607134598], [96.17703754484688, 21.4467045696602], [96.1759352044462, 21.44298416968371], [96.17621078909667, 21.440090524558116], [96.175108448696, 21.43705908710723], [96.17455727759636, 21.43457881985671], [96.1715258410448, 21.427551396879494], [96.17163448544324, 21.426301989445335], [96.16188035759251, 21.425760093053896], [96.15333721633954, 21.425071129628975], [96.14922813297204, 21.424402210293806], [96.147412133763, 21.42410658155353], [96.14231380693673, 21.423830996903007], [96.1426650569469, 21.427033038443994], [96.14214792698527, 21.427081309554865], [96.14209019410725, 21.43164658841937], [96.14144037457368, 21.431667946418656], [96.1414148706998, 21.43393774982735], [96.14140384770946, 21.434698612251225], [96.141397219706, 21.435156064101136], [96.14198079607695, 21.437333661819082], [96.1424844236173, 21.440733154911243], [96.14162484441113, 21.445051059059153], [96.14575862316201, 21.445464436934287], [96.15526631338969, 21.445877813910045], [96.1592622980167, 21.447117948434595]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
