
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Kaing</div><div class="name-mm">လယ်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009008017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.74819037298738, 20.291406934682357], [94.74694715019086, 20.291552374842297], [94.74305608317178, 20.28992048843986], [94.739416070895, 20.287409931123477], [94.7391298031979, 20.287123969195875], [94.7383976651202, 20.288431357721038], [94.73799153668011, 20.289156587206776], [94.73378647316724, 20.299184047805625], [94.72925794240018, 20.31519563866783], [94.73540380494171, 20.321826701641044], [94.74047280127883, 20.323294042685973], [94.74154966928188, 20.32360576839153], [94.75109193034837, 20.322150168895234], [94.75820819285389, 20.31907723672515], [94.7602571110769, 20.31777958875705], [94.75934032599531, 20.316651238164184], [94.75626739382523, 20.309534975658664], [94.75481179522825, 20.305329911246474], [94.75556689659504, 20.30197390217387], [94.75548224970612, 20.30197107920202], [94.75221877187886, 20.300715775812478], [94.7539761811559, 20.293435370845714], [94.7544360638733, 20.29067627598937], [94.74819037298738, 20.291406934682357]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
