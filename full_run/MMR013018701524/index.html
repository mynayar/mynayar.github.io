
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (104) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (104) Ward</div><div class="name-mm">အမှတ် (၁၀၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701524</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25821418743487, 16.8744085308291], [96.25885266561806, 16.875128260960537], [96.26241031438457, 16.879138646431443], [96.26378059429902, 16.878250123444502], [96.26459312457308, 16.8777885437064], [96.26549148614322, 16.87714958168789], [96.26705932642682, 16.87581253082368], [96.26854133631366, 16.87458991958914], [96.26918983474314, 16.874063492436278], [96.27055931066371, 16.87291145280136], [96.27184677111165, 16.871850967748003], [96.27055168171478, 16.87042808558772], [96.27022107474289, 16.870069927884913], [96.26975059531378, 16.869560241611907], [96.26921205609159, 16.868964528889933], [96.26919364966727, 16.86894416823884], [96.2685222625924, 16.868263244752995], [96.2677593227346, 16.86741065957432], [96.26674842809751, 16.866289138433046], [96.2661927540924, 16.865652083876626], [96.26557077667007, 16.864971978773838], [96.26290321391224, 16.86747169476297], [96.26144218430943, 16.868669509890026], [96.2589740749936, 16.87066078156988], [96.25659797621569, 16.87261427902581], [96.25665092470047, 16.872646331762837], [96.25793363313073, 16.874092274339034], [96.25821418743487, 16.8744085308291]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
