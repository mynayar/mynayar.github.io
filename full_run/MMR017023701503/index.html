
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward (Myo U Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward (Myo U Ward)</div><div class="name-mm">ရပ်ကွက် (၃)မြို့ဦးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67998304048501, 16.29965763339311], [95.68034334666817, 16.29811013397557], [95.6807046448036, 16.295146115101204], [95.67928704705963, 16.295012334651574], [95.67925336834833, 16.29397287754631], [95.67747595455171, 16.293490159243504], [95.67489742107915, 16.29278535336141], [95.67419117088588, 16.292578153159297], [95.67408044095964, 16.29291498883572], [95.67417162412124, 16.29290608464811], [95.67439259294389, 16.29303007777594], [95.67454302164322, 16.293190780330292], [95.67476483942585, 16.293389006197742], [95.67502150323986, 16.293788721572298], [95.67521132044612, 16.294165318974365], [95.67529176480315, 16.29429285093437], [95.67534615669985, 16.295027017882603], [95.67548553722781, 16.295040069743493], [95.67567591021515, 16.295646978125603], [95.67585098573448, 16.295901488063294], [95.67591387622446, 16.296058109494197], [95.67594617177849, 16.296146208880486], [95.6761637411638, 16.29709408982046], [95.6761790386318, 16.297320862867593], [95.6764739470151, 16.298371520129592], [95.67694393001841, 16.298374782869985], [95.67697112641639, 16.29905999072605], [95.6769665380753, 16.29949660888144], [95.67719464391774, 16.299490691342385], [95.67824679495368, 16.2995200578045], [95.67998304048501, 16.29965763339311]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
