
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Yae Twin Kone Ward</div><div class="name-mm">ရေတွင်းကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17401058691911, 16.79265138755153], [96.17432212826367, 16.792253494203464], [96.17470741311666, 16.79171180735409], [96.17503166188175, 16.79125022941463], [96.17522773657083, 16.790934372223546], [96.1753215790277, 16.79063987842767], [96.17546738521173, 16.790216022551476], [96.17485542263972, 16.79005966192392], [96.17446041071946, 16.789771556911887], [96.17409591639347, 16.7895622253165], [96.17381095900862, 16.789287566967687], [96.17353057917296, 16.789051056061453], [96.17349052426835, 16.789854049924486], [96.17349052426835, 16.790220261056277], [96.17350959798961, 16.79129219088196], [96.17350751695841, 16.7921088823191], [96.17401058691911, 16.79265138755153]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
