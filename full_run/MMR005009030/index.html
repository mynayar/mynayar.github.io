
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lein Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lein Taw</div><div class="name-mm">လိမ်တော</div></div>
        <span class="pcode-badge">MMR005009030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3363952001784, 22.823848080324694], [95.33634156011499, 22.823486730028606], [95.33128284033086, 22.819331520433366], [95.32622448027558, 22.819331520433366], [95.32423727982666, 22.823125379732517], [95.32225008027706, 22.828003289919934], [95.32098539965654, 22.830713190061715], [95.31502344037955, 22.833784439600265], [95.30978435976044, 22.8354103796853], [95.30972819979667, 22.83559713020344], [95.3092421998677, 22.837216950401967], [95.30942292043147, 22.841372159997263], [95.30985888028317, 22.843006649936967], [95.31502344037955, 22.84317881974681], [95.32044323976379, 22.845527369592503], [95.32051847704616, 22.84559901408329], [95.32098539965654, 22.844082060138987], [95.32206935971323, 22.84263683971841], [95.3271277197685, 22.844082060138987], [95.3311024803952, 22.844443410435076], [95.33507688039379, 22.846069349620848], [95.33850948022837, 22.843540080110643], [95.33832875966459, 22.836855690038135], [95.3363952001784, 22.823848080324694]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
