
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Ni Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Ni Son</div><div class="name-mm">ပနီဆုံ</div></div>
        <span class="pcode-badge">MMR009013057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.54157288568018, 19.773105709560923], [94.5456886761915, 19.762937288325247], [94.54621355021521, 19.761362667153435], [94.55054526794981, 19.74836751394963], [94.55013795240461, 19.74307240736573], [94.5489264037306, 19.72732228269723], [94.55270375327564, 19.713831751434213], [94.55642689798299, 19.70667185831968], [94.5389586518204, 19.699583294033857], [94.52876051878297, 19.702604963048657], [94.52498343183998, 19.712047679057207], [94.52460572377521, 19.720357269072736], [94.52196176282513, 19.72866685908832], [94.51554071673075, 19.73810957419755], [94.51289675578073, 19.75435104526457], [94.509119669737, 19.75926125820058], [94.50773212283923, 19.76458018692614], [94.5200732198033, 19.77059251633159], [94.52838280981888, 19.771347934259836], [94.53367073081961, 19.772858768317576], [94.54157288568018, 19.773105709560923]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
