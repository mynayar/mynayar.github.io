
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myeik</div><div class="name-mm">မြိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Shey</div><div class="name-mm">တောင်းရှည်</div></div>
        <span class="pcode-badge">MMR006005012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.81577204524376, 12.379967815062685], [98.80996247968477, 12.369152069912161], [98.80438211983903, 12.360417030421672], [98.80107425956948, 12.3537444295618], [98.7988017599933, 12.353380470332468], [98.79637572006351, 12.352895099928958], [98.79249347989025, 12.353137739714953], [98.78958216038848, 12.355078769869408], [98.78898218577933, 12.35752281512589], [98.78909652018831, 12.362115329958556], [98.7876406796737, 12.3664828497038], [98.7876406796737, 12.369879720372865], [98.7893391599743, 12.374489879904104], [98.78885388040231, 12.378129480291307], [98.78375844039977, 12.383710109933702], [98.78108975978466, 12.38807762967889], [98.78012111439796, 12.394857473793422], [98.7813320398418, 12.395842020093198], [98.78618484005835, 12.394628910196104], [98.7912799203321, 12.3929305198277], [98.79370631999075, 12.395356920385609], [98.79443387961993, 12.399481800344859], [98.79335490540461, 12.402192773377863], [98.79710291996383, 12.403364039618793], [98.80777836008332, 12.403364220382514], [98.81724096010231, 12.4031216696294], [98.82354924020535, 12.402879119775605], [98.82815904000773, 12.402879209707805], [98.83028375219345, 12.402029348575638], [98.82379187999135, 12.390989805335323], [98.81796906022402, 12.383467919808709], [98.81675604025912, 12.381284159936058], [98.81577204524376, 12.379967815062685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
