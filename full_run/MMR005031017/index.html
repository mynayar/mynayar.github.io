
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Sauk Sauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlaik</div><div class="name-mm">မော်လိုက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Sauk Sauk</div><div class="name-mm">နန်းစောက်စောက်</div></div>
        <span class="pcode-badge">MMR005031017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.45583268013417, 23.568907139652822], [94.45619123983391, 23.57189604007027], [94.45540355962663, 23.576621939650863], [94.45540355962663, 23.58804276036517], [94.45520663957484, 23.593162410117202], [94.45520663957484, 23.598085139817385], [94.45394484038212, 23.6020286696874], [94.45579739973027, 23.602220280141864], [94.45717584009299, 23.60871837025661], [94.45738895963285, 23.609130120358827], [94.46072004039763, 23.607536849945745], [94.46485535968714, 23.603204880400938], [94.46702148025719, 23.597297550441624], [94.46918724019906, 23.59139021958299], [94.46958108030265, 23.585876729727318], [94.47056567966246, 23.582332349558328], [94.47174719997338, 23.572880640329345], [94.47135335986974, 23.566776390318182], [94.4709595197661, 23.563625850252834], [94.47056567966246, 23.559096869824714], [94.47115608008909, 23.555892509831494], [94.46859648004357, 23.55496173039961], [94.4662338000499, 23.54984207974826], [94.4662338000499, 23.549205419994166], [94.46249231996467, 23.550826680007333], [94.45993271991915, 23.554371060176322], [94.4569789200412, 23.557127760138087], [94.45560047967848, 23.56185365971868], [94.45560047967848, 23.56697331037003], [94.45583268013417, 23.568907139652822]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
