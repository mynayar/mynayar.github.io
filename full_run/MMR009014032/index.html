
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hman</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hman</div><div class="name-mm">မှန်</div></div>
        <span class="pcode-badge">MMR009014032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.72547488575742, 19.172416742838436], [94.71740897424485, 19.17983738089049], [94.70999738157394, 19.189719504751395], [94.70011525861236, 19.200836893308008], [94.68899787005574, 19.214424813054734], [94.68300911997494, 19.2186521653652], [94.68467444137241, 19.219365873636207], [94.69669144785212, 19.21714050303183], [94.70135052420738, 19.216277711447276], [94.71802660704236, 19.20948375067462], [94.73593795457299, 19.208866117877108], [94.74582007933327, 19.203307423598744], [94.75261403830729, 19.201454526105522], [94.76743722274966, 19.202072158903036], [94.77978987690136, 19.208248485978913], [94.78353200539777, 19.208248485978913], [94.78843673516724, 19.208248485978913], [94.78955546571223, 19.206756844352924], [94.7865838367747, 19.200219261409813], [94.77855461220565, 19.18601370796631], [94.76496669155961, 19.183543177675574], [94.75137877271226, 19.179219748992296], [94.73284979238406, 19.180455013688004], [94.72852636280146, 19.17613158500467], [94.72547488575742, 19.172416742838436]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
