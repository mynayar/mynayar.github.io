
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moe Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moe Kaung</div><div class="name-mm">မိုးကောင်း</div></div>
        <span class="pcode-badge">MMR007014024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.54026152714783, 18.763831934995835], [96.5400338080139, 18.759733003175597], [96.54325439807207, 18.755546236369753], [96.54518675066805, 18.74846093932092], [96.54647498723091, 18.741697702087322], [96.54937351837322, 18.73396828720672], [96.54964726840677, 18.731869535750548], [96.55291616644797, 18.73171387389624], [96.55388234319565, 18.724950635763264], [96.55871322693395, 18.72011975202497], [96.5648323472351, 18.717221220882664], [96.56738910092633, 18.716164521075825], [96.56138750942608, 18.715346121826087], [96.55452646102742, 18.714322690639733], [96.5448646917522, 18.71496680937082], [96.53874557235036, 18.715288867387358], [96.53294851096507, 18.713678572807964], [96.53005803235237, 18.712696292799706], [96.52199850692563, 18.716416074042627], [96.51974409361509, 18.72334034118387], [96.51652350535556, 18.731391814980327], [96.51265879656626, 18.740087406608552], [96.50750585391211, 18.746528585825615], [96.50750585391211, 18.754258000706216], [96.50943820830673, 18.76069917992328], [96.51684556427142, 18.764241827998035], [96.5226426247574, 18.763919769082122], [96.529627865034, 18.76423922176275], [96.5323043931333, 18.76520800474566], [96.54035586692976, 18.765530063661572], [96.54026152714783, 18.763831934995835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
