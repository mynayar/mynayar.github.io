
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kone</div><div class="name-mm">ဥသျှစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR018003017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17204927255597, 20.225889934173154], [96.17735150536771, 20.220745868726908], [96.18326936998551, 20.221368802128552], [96.18794136779997, 20.221991734630876], [96.20348055198593, 20.214115351642192], [96.19754772624663, 20.202645221100113], [96.19753617715293, 20.20262107430318], [96.19319698695142, 20.193548220673904], [96.19082385593629, 20.185242264818726], [96.18920079458104, 20.17586434136632], [96.18917993480619, 20.17574381422571], [96.18911878180637, 20.17580496722553], [96.18905644799673, 20.17586730103517], [96.1851308685948, 20.179792880437105], [96.17516393866492, 20.187891011061367], [96.16862313974616, 20.193497409877637], [96.15772180971379, 20.204398739909948], [96.1567874096113, 20.21093953792939], [96.15927914321793, 20.215611536643166], [96.16301674182921, 20.21966060285456], [96.16831167394463, 20.22184086886108], [96.17204927255597, 20.225889934173154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
