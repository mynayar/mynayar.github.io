
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hkam</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hkam</div><div class="name-mm">လွယ်ခမ်း</div></div>
        <span class="pcode-badge">MMR015001064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.32557936179819, 23.038943907335522], [98.32345964804438, 23.050955621304922], [98.31412566636646, 23.062156400397612], [98.30404496500319, 23.06887686677402], [98.29023067240769, 23.071863741018888], [98.28127004877376, 23.071863741018888], [98.27512054127999, 23.084403785106645], [98.27245852823853, 23.09542320781486], [98.26748420173459, 23.11152160933483], [98.2920090502775, 23.112720806719892], [98.2969511387841, 23.111066466044633], [98.3111387921216, 23.108079591799765], [98.32617817088595, 23.099562333934614], [98.33279363062161, 23.09239850178949], [98.33914073805465, 23.081571083438803], [98.34399440881498, 23.06999694540275], [98.3481013607892, 23.06103632176888], [98.35631526563708, 23.049088824789465], [98.3596959179323, 23.040446503603334], [98.32557936179819, 23.038943907335522]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
