
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Lin (Pa Kin)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Lin (Pa Kin)</div><div class="name-mm">နားလင်း (ပကင်း)</div></div>
        <span class="pcode-badge">MMR010008034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57989756621976, 21.932548086724864], [96.57405075793616, 21.936445959813227], [96.57307629033858, 21.939369364404683], [96.57293454998955, 21.939652844203465], [96.57112735334476, 21.943267236593726], [96.5701528848478, 21.948626811977817], [96.56630498528688, 21.95391767286236], [96.56625501265876, 21.95398638556327], [96.56590340022183, 21.95461928705049], [96.56381884186612, 21.958371493349773], [96.56040820437516, 21.960320429444323], [96.56144847716553, 21.964604728625375], [96.5684937687725, 21.965433586990514], [96.57222362961687, 21.965848016173084], [96.57794863012526, 21.963731067834544], [96.57889811185845, 21.96301895586015], [96.57989756621976, 21.962269364639496], [96.58156442635726, 21.959769074882956], [96.58476990690576, 21.954960854060232], [96.58866777999413, 21.948626811977817], [96.59110394988744, 21.943267236593726], [96.59061671608862, 21.937907662108955], [96.58915501379289, 21.933035321423006], [96.57989756621976, 21.932548086724864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
