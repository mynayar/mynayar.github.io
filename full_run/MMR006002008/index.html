
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Yat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Launglon</div><div class="name-mm">လောင်းလုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Yat</div><div class="name-mm">မင်းရပ်</div></div>
        <span class="pcode-badge">MMR006002008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11728078528006, 14.077701448163339], [98.12335644044742, 14.073713009747678], [98.12912867964491, 14.069057939872096], [98.13173544013853, 14.066637300371156], [98.13806603961609, 14.065147800031014], [98.14476923990856, 14.063658209758614], [98.15373472527739, 14.064496271785572], [98.15277563968408, 14.06105145016437], [98.15147244020102, 14.057327339585129], [98.15054148000536, 14.053044599828468], [98.15054148000536, 14.050810170353145], [98.15370695960854, 14.047086149706104], [98.15631372010216, 14.042803409949443], [98.15703947928858, 14.039695168597177], [98.15501015999092, 14.04112760965154], [98.1527760003122, 14.041872359821582], [98.14830732032664, 14.042989530042803], [98.14588667992638, 14.043361950093981], [98.1427212003232, 14.043361860161781], [98.13825252033763, 14.04317565013622], [98.13490128036983, 14.042244510076102], [98.11739879971492, 14.045409809814942], [98.11528236758727, 14.045734392228496], [98.11662354004437, 14.047672139857411], [98.11662354004437, 14.048987265250162], [98.11530845961778, 14.052713535101589], [98.11552752007907, 14.060166074804556], [98.11574657964098, 14.061481245163407], [98.11596581996668, 14.064549884869336], [98.11574657964098, 14.067180224687661], [98.11443150011371, 14.070687255112773], [98.11355471957472, 14.073317594931098], [98.11399302036165, 14.075947844817222], [98.11552734021461, 14.077043864782581], [98.11728078528006, 14.077701448163339]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
