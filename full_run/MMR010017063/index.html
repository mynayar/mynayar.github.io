
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Naung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Naung Kone</div><div class="name-mm">ထနောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010017063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34624495204298, 21.402865113734038], [95.34900623315121, 21.40065609010651], [95.35371512655189, 21.39931069083576], [95.36133905005715, 21.398862225011726], [95.37131078866202, 21.401107031764127], [95.37064361041433, 21.398994300346715], [95.37031002129049, 21.396881567130663], [95.3701988237168, 21.393545674093616], [95.3685308780976, 21.391766530001405], [95.36730771737729, 21.3894314052352], [95.3663069491065, 21.385873118849418], [95.36575096573455, 21.384093975656526], [95.3656397699595, 21.38287081493621], [95.36608455575771, 21.38042449259632], [95.36629196819985, 21.37876519935452], [95.3494797567854, 21.381967340720223], [95.32719925813933, 21.388088176028532], [95.32705460218818, 21.3894314052352], [95.3266098172893, 21.39510242393777], [95.3266098172893, 21.397659942052712], [95.3343935683086, 21.398994300346715], [95.34284449757558, 21.40132942511292], [95.34624495204298, 21.402865113734038]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
