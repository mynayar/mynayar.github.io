
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung U</div><div class="name-mm">တောင်ဦး</div></div>
        <span class="pcode-badge">MMR010020106</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4742887819018, 20.844967914337815], [95.47669473997036, 20.84221824797379], [95.47669473997036, 20.837750041031597], [95.478756988844, 20.833281833190085], [95.48116294691255, 20.82950104193958], [95.48563115385474, 20.8264076681794], [95.49319273635575, 20.823658001815375], [95.49834835988895, 20.82331429441922], [95.50247285943499, 20.821939461237207], [95.49937948477549, 20.820220919759663], [95.49525498612877, 20.815065296226464], [95.49216161056995, 20.807160006329298], [95.49216161056995, 20.801610152386672], [95.48277923997, 20.80779204986328], [95.4762650519906, 20.813963385701754], [95.46872230938715, 20.817391905312206], [95.46152241802525, 20.81704905317133], [95.45260826685808, 20.81567764460766], [95.44718706633012, 20.812974226779204], [95.44747953755069, 20.81575271191815], [95.44747953755069, 20.818502378282176], [95.45297887027868, 20.81987721056487], [95.4601967435849, 20.82125204374688], [95.46260270075408, 20.82950104193958], [95.46294640994893, 20.838437456723284], [95.46466495142641, 20.841874539678315], [95.46727140525121, 20.844356877168195], [95.46741461689112, 20.84428049684749], [95.4742887819018, 20.844967914337815]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
