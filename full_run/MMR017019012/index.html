
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hman Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hman Pin</div><div class="name-mm">မှန်ပင်</div></div>
        <span class="pcode-badge">MMR017019012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55134904042592, 16.707061080104836], [95.55764472012777, 16.71079589981099], [95.55898032038556, 16.711597079741466], [95.56205147999185, 16.710261750179654], [95.56685892020306, 16.70772447040804], [95.56939619997473, 16.705053719553575], [95.56933931965392, 16.702458660139087], [95.569262639859, 16.69957856959536], [95.56892892033346, 16.698310020091412], [95.5685948401798, 16.697041379755944], [95.56806096034512, 16.694838000273535], [95.56752671988227, 16.692634619891862], [95.56565723978986, 16.688628450442707], [95.56245216033898, 16.685957609655986], [95.55671015994596, 16.68395457034717], [95.55208128012703, 16.681996259719654], [95.54976612031027, 16.681016700160626], [95.54722883963927, 16.680883140044955], [95.54362307984132, 16.68528989990898], [95.54108580006965, 16.68809420997985], [95.53868244014257, 16.690898609982924], [95.53494312022889, 16.693969950352994], [95.5326729597893, 16.69650723012461], [95.5365454800899, 16.698777389664826], [95.54148648041678, 16.701848730034897], [95.54976612031027, 16.706122019715508], [95.55134904042592, 16.707061080104836]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
