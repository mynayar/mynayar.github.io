
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (162) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (162) Ward</div><div class="name-mm">အမှတ် (၁၆၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701576</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24152963838219, 16.96427362622694], [96.24188232460966, 16.964921951087206], [96.24298286456758, 16.966469446907524], [96.2438533786306, 16.967329788738823], [96.24525070205829, 16.968147277874607], [96.24612998990716, 16.96833737656874], [96.24692026735653, 16.968238194836886], [96.24830360362847, 16.967576980893], [96.24898338317666, 16.966882706072056], [96.24974314393103, 16.96612294531775], [96.25042152413408, 16.965742111209522], [96.25130144780366, 16.965615590986772], [96.25219917265377, 16.965913137081657], [96.25257786817411, 16.96614542926818], [96.25417895369583, 16.9647880186522], [96.24988990969166, 16.958769576554744], [96.24152963838219, 16.96427362622694]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
