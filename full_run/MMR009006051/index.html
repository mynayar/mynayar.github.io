
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa/Let Khoke Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa/Let Khoke Pin</div><div class="name-mm">ပ/လက်ခုပ်ပင်</div></div>
        <span class="pcode-badge">MMR009006051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.411688634423, 20.609260659352003], [95.41658577571303, 20.611853263617263], [95.4223907960984, 20.608757253044814], [95.42742181406555, 20.606048244131216], [95.43400083686919, 20.61146626285779], [95.43941885469644, 20.619593291397337], [95.45838192068913, 20.622302300310935], [95.47265708885362, 20.621622530655316], [95.47347497369117, 20.621038326557596], [95.47618398260477, 20.611750294840306], [95.47731719942925, 20.611801805309142], [95.47695798592235, 20.602462262223696], [95.47347497369117, 20.60168825980537], [95.47347497369117, 20.600686609299657], [95.47231396961405, 20.601301258146577], [95.4405798587735, 20.58195119139441], [95.43271967527284, 20.58092594987272], [95.43167882781569, 20.580790187317348], [95.42664781074791, 20.596657241838273], [95.41619877495356, 20.597044244396386], [95.41155475774593, 20.603236264641964], [95.411688634423, 20.609260659352003]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
