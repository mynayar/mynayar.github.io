
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Swei Lat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Swei Lat</div><div class="name-mm">စွယ်လပ်</div></div>
        <span class="pcode-badge">MMR013004035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.39646326127053, 17.088136167050493], [96.39558601128545, 17.084791183666255], [96.39043728825033, 17.087430752327407], [96.38252620312181, 17.088309762285746], [96.37725214606974, 17.088309762285746], [96.37344310621444, 17.087430752327407], [96.36729003920402, 17.08303570523367], [96.36406700478852, 17.078640658139932], [96.35937895407551, 17.079226663579732], [96.35469090426187, 17.08010567443739], [96.35293288524451, 17.08039867715729], [96.35029585716813, 17.08303570523367], [96.34736582457322, 17.086258739649168], [96.34472879739616, 17.089481774064666], [96.34033375030242, 17.090360784023005], [96.33564569869009, 17.088016758666527], [96.33588179770686, 17.090967990080742], [96.33623170592853, 17.095341836556543], [96.33681771226765, 17.097978866431617], [96.34765882819244, 17.102373912626035], [96.35556991332089, 17.106475956999873], [96.36816904916236, 17.10881998235635], [96.3757871306716, 17.11028499775449], [96.3816471940628, 17.107354966958212], [96.38662824659639, 17.106475956999873], [96.39243494331805, 17.103410789576344], [96.39352202402227, 17.101633183324793], [96.39509008463978, 17.099435628751337], [96.39489174455844, 17.09748257735913], [96.39506328124548, 17.094331655081874], [96.39595583589318, 17.092573097370575], [96.39660062371985, 17.090337553635266], [96.39646326127053, 17.088136167050493]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
