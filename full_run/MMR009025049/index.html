
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man</div><div class="name-mm">မန်း</div></div>
        <span class="pcode-badge">MMR009025049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.302938526292, 21.348453456262064], [94.25546680305058, 21.357047473961813], [94.2547273148138, 21.357181347041603], [94.25392922765178, 21.36782251399785], [94.25259908178225, 21.375005302053125], [94.25206702307469, 21.38059191398571], [94.25209571684394, 21.380799941564078], [94.2531311395905, 21.388306759849115], [94.25339716894428, 21.39655366442014], [94.25446128635934, 21.403470423121576], [94.25419525700556, 21.405864684607536], [94.25425880130268, 21.408533524402685], [94.25494184359127, 21.40842360926223], [94.26706506180324, 21.40909712143508], [94.27649423222311, 21.41330657184085], [94.28221908524267, 21.415495485728115], [94.29249014520411, 21.417516023145993], [94.29728972174331, 21.418215960997827], [94.29770768795947, 21.411864653730845], [94.29770778958289, 21.406754023279575], [94.29770792627983, 21.39993983225753], [94.29804380327897, 21.396581590168296], [94.29858673568936, 21.391153131212093], [94.30097803570783, 21.388786504993277], [94.30203563933333, 21.386545880987683], [94.30335662290986, 21.383747263625366], [94.30449306560257, 21.381161548166972], [94.30356755260055, 21.376637903416565], [94.30130891427501, 21.37587246074554], [94.30046986659113, 21.375588111302363], [94.2964534097971, 21.367805521307787], [94.30034466297587, 21.35977201866376], [94.30255696643093, 21.349927762556263], [94.30286464159002, 21.348583839072944], [94.302938526292, 21.348453456262064]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
