
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpyu Yaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpyu Yaung</div><div class="name-mm">ဖြူရောင်</div></div>
        <span class="pcode-badge">MMR010011023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56231248373422, 22.882012784962114], [96.56175006841102, 22.875826201118343], [96.55893798370107, 22.870764450618935], [96.55331381697914, 22.865140283897063], [96.54543998266911, 22.862328200086438], [96.53644131591403, 22.85895370005329], [96.52688023203712, 22.856141616242667], [96.51844398240394, 22.85220469998694], [96.5105701480939, 22.850517448621417], [96.50663323093892, 22.853891949553883], [96.50438356425013, 22.855579200020088], [96.50100906421699, 22.855579200020088], [96.49482248037322, 22.85726644958703], [96.49088556321823, 22.85726644958703], [96.48582381271882, 22.85332953333136], [96.48582381271882, 22.858391282931393], [96.48582381271882, 22.86289061720828], [96.48919831275197, 22.865140283897063], [96.4942600641507, 22.865702700119584], [96.49875939662888, 22.86907720105205], [96.50213389666209, 22.871326866841457], [96.50663323093892, 22.875263783996502], [96.50775806428328, 22.87976311827333], [96.51281981478269, 22.882012784962114], [96.51563189769399, 22.882012784962114], [96.52181848243708, 22.88370003542832], [96.52969231584774, 22.88370003542832], [96.53587889879219, 22.88370003542832], [96.54206548263596, 22.88370003542832], [96.55050173406784, 22.885949702117102], [96.55781315125597, 22.887074534562146], [96.56231248373422, 22.882012784962114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
