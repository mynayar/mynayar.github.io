
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (33) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (33) Ward</div><div class="name-mm">အမှတ် (၃၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19450939459296, 16.86028259526563], [96.19520820109767, 16.855931319075182], [96.19272503623148, 16.855286629274588], [96.19096423471171, 16.854929709938233], [96.18934948219288, 16.854644709385866], [96.18857602206583, 16.854934063556243], [96.1880579568093, 16.85570933311925], [96.18803186118151, 16.856301093320837], [96.18782484803836, 16.859256384274772], [96.18763924955181, 16.861140917219586], [96.18738940709551, 16.861854754992976], [96.18716811721492, 16.86218312085441], [96.18653280104797, 16.862654254090614], [96.18589748488108, 16.86301117342697], [96.18526930663324, 16.863175356357658], [96.18345615827513, 16.86333240136929], [96.18297788622056, 16.863389508319187], [96.18257813667174, 16.863432337632332], [96.18205703530401, 16.863482306663172], [96.18158590116849, 16.86349658340066], [96.18064363469603, 16.86378211904963], [96.18005911848788, 16.86408344044412], [96.1817516424839, 16.865703171565187], [96.19243812641844, 16.86171245616498], [96.19442367571213, 16.860776901332997], [96.19450939459296, 16.86028259526563]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
