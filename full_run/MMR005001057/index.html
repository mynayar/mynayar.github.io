
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Yin</div><div class="name-mm">တောင်ရင်း</div></div>
        <span class="pcode-badge">MMR005001057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97557087959245, 22.142439180024212], [95.97554280006023, 22.14174113974184], [95.97554280006023, 22.127852340113463], [95.97487500038102, 22.11182676029682], [95.9748116404449, 22.110308549999615], [95.97554280006023, 22.099709160149644], [95.97773556034787, 22.094957789970067], [95.97744828001419, 22.09491863978343], [95.96969459962611, 22.093861320343706], [95.95982628035858, 22.097150730122166], [95.95507500011121, 22.100074739957336], [95.94813059984739, 22.105922579763273], [95.94045503996819, 22.11286706995935], [95.93606915966404, 22.12127342972508], [95.93545860003445, 22.124733570398007], [95.93716572012193, 22.124562840402803], [95.93606915966404, 22.132238220417605], [95.93716572012193, 22.13881712990667], [95.93716572012193, 22.13964350974021], [95.94337895987115, 22.13991369036455], [95.95032336013503, 22.14832005013028], [95.95763352007094, 22.158188370297125], [95.96070972037734, 22.159726470000635], [95.96238480031832, 22.15855395010476], [95.97384935956035, 22.159628729882], [95.97590820000346, 22.150878480157758], [95.97557087959245, 22.142439180024212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
