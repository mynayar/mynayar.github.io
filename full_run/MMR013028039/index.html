
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Ma Naing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawhmu</div><div class="name-mm">ကော့မှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Ma Naing</div><div class="name-mm">ထမ္မနိုင်</div></div>
        <span class="pcode-badge">MMR013028039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09796476006568, 16.55479898958174], [96.10543080039116, 16.55423891969042], [96.10537571961385, 16.560739529705586], [96.10441128035637, 16.569060839686074], [96.12263303968308, 16.5658197603737], [96.12279972003114, 16.560987749784886], [96.13521755974267, 16.559163269968963], [96.14023415977869, 16.55472581984077], [96.14142467960534, 16.550915580289825], [96.14116655978899, 16.548578100199222], [96.14090843997258, 16.546240530176362], [96.14248776010209, 16.544595779871372], [96.14225844017494, 16.541425079703743], [96.14342771981347, 16.536940470026707], [96.14658095964364, 16.533817469900384], [96.14429280017265, 16.531451369784918], [96.14157192020804, 16.526911950026545], [96.1395821998587, 16.52571692999237], [96.13468295955101, 16.525481129550542], [96.13146924031327, 16.525435679612997], [96.12517103981168, 16.52651351978318], [96.12191736009817, 16.527634379922745], [96.12137880019151, 16.52682050965882], [96.11902224008435, 16.523258939848233], [96.11291015967618, 16.523838900045234], [96.11002044009132, 16.529132340185413], [96.10571304002485, 16.53086430044715], [96.10401419999539, 16.53154722042791], [96.09399683968246, 16.537405229767614], [96.09843348042085, 16.54613720976448], [96.09796476006568, 16.55479898958174]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
