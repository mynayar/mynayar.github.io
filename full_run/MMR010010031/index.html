
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mar Le</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mar Le</div><div class="name-mm">မာလဲ</div></div>
        <span class="pcode-badge">MMR010010031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08929370643943, 22.567031101004545], [96.08556763084152, 22.5672381051545], [96.0820069693462, 22.5672381051545], [96.07553184072191, 22.56658664975413], [96.07144865063475, 22.566581975977442], [96.06582365563725, 22.563972907823484], [96.06470348078108, 22.569200391684774], [96.05984938823872, 22.575548051301553], [96.05961679028269, 22.57594679001238], [96.06356456765076, 22.57630567886406], [96.06829501690157, 22.57893370562607], [96.0761573111111, 22.579829441175832], [96.08853083043351, 22.58156173418672], [96.09641491341756, 22.580773326427902], [96.10351058684415, 22.580773326427902], [96.11407111159258, 22.58206640404137], [96.11376022675313, 22.578024898430385], [96.1128275713354, 22.57460516159898], [96.1100296059816, 22.572739851662902], [96.10536632979233, 22.570563655987996], [96.10132482418135, 22.56963100057027], [96.09635066315263, 22.56807657457432], [96.08929370643943, 22.567031101004545]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
