
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngwar Hpa Hkar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngwar Hpa Hkar</div><div class="name-mm">ငွါးဖခါး</div></div>
        <span class="pcode-badge">MMR001005039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.58496489391479, 26.18327037862514], [98.54189108660444, 26.1869474105946], [98.51593144078345, 26.19296703889779], [98.51402581693799, 26.193408922583785], [98.50882235396853, 26.19453643770646], [98.50855575984048, 26.195976044558847], [98.50695891372294, 26.200500435746562], [98.50722505729061, 26.203694121686397], [98.503232946943, 26.21194448415065], [98.49950697566646, 26.220727123857728], [98.4979101331462, 26.223654673424505], [98.50110381998536, 26.22871134455295], [98.50536207120268, 26.237493985159347], [98.50589435204279, 26.24388135973703], [98.50695891372294, 26.24973645527325], [98.50908804068058, 26.25745453509876], [98.51100688006352, 26.26141890675717], [98.5098127593514, 26.265191709329997], [98.50482979036258, 26.271027706863208], [98.50722505729061, 26.275019818110195], [98.5081596480494, 26.276245432180986], [98.5094531744245, 26.27503230159948], [98.51162869201056, 26.27411245882297], [98.5214047651179, 26.272044444395647], [98.55397276513105, 26.266266249887565], [98.58181315235515, 26.259962765868977], [98.58181315235515, 26.24472934668205], [98.58338902268531, 26.235274121103885], [98.58338902268531, 26.22634418503617], [98.58181315235515, 26.207959024289607], [98.58496489391479, 26.18327037862514]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
