
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Zin</div><div class="name-mm">ချောင်းဇင်း</div></div>
        <span class="pcode-badge">MMR005003042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35580748023108, 21.65538905965741], [95.35283531979422, 21.65996132985157], [95.35100651963523, 21.66384780043569], [95.34711996001818, 21.668648670200014], [95.3434623597002, 21.670934760330965], [95.34689136044801, 21.67573572002749], [95.3480343600977, 21.679393500209926], [95.351463719675, 21.68373716993449], [95.352606720224, 21.687394950116925], [95.35633451982227, 21.692255130170167], [95.36044967990887, 21.691797930130406], [95.36479307983683, 21.691797930130406], [95.3675949068795, 21.691945347000228], [95.36733023280408, 21.689729454350868], [95.36683833422182, 21.687638982952762], [95.36732259036529, 21.684930765442516], [95.3673795336386, 21.684484458890722], [95.36740681906952, 21.684270603705443], [95.36739549480632, 21.683545302273956], [95.36737984390476, 21.682542895438303], [95.36754398366799, 21.680124267720828], [95.36766560438417, 21.6789276495914], [95.36771951964016, 21.678396209617404], [95.36773728484786, 21.678158189648798], [95.36613262811835, 21.67540018567007], [95.36592597290536, 21.66858060321232], [95.36585426186474, 21.666214148764027], [95.36472324028534, 21.666591089707083], [95.3599222796895, 21.66544809005734], [95.35580748023108, 21.65538905965741]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
