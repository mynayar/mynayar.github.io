
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kan</div><div class="name-mm">အုတ်ရှစ်ကန်</div></div>
        <span class="pcode-badge">MMR005004010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67193284012853, 22.58499645012614], [95.67060587965767, 22.58215281000423], [95.67060587965767, 22.578040980107176], [95.67005759987842, 22.573654919938633], [95.66649395982841, 22.568994810262325], [95.66128548044065, 22.56926894970229], [95.65580303967857, 22.56926894970229], [95.65086887959518, 22.56872066992304], [95.64566040020736, 22.564334699686697], [95.64415272007204, 22.561593479755345], [95.64339635965433, 22.561593479755345], [95.64209676015741, 22.565979449991687], [95.64017796034466, 22.57146197978659], [95.63935572009046, 22.575573809683647], [95.64100056032765, 22.57886331029357], [95.64264503993672, 22.584345840088474], [95.6418559199148, 22.588133670332695], [95.65114319979887, 22.585990590393465], [95.65552908010301, 22.58790939020622], [95.65964099993226, 22.589828279951234], [95.66430083981197, 22.59065070006983], [95.6681388000656, 22.588183529646244], [95.67193284012853, 22.58499645012614]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
