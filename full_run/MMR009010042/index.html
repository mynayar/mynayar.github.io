
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyu Myauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyu Myauk</div><div class="name-mm">ချောင်းဖြူမြောက်</div></div>
        <span class="pcode-badge">MMR009010042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64617369296161, 20.65462652199642], [94.6483662419086, 20.657815686145057], [94.65008453966982, 20.66321604938122], [94.65057548227276, 20.668125470014502], [94.65303019169005, 20.67499865926078], [94.65450202035203, 20.677028767263835], [94.65455638257106, 20.67701122958465], [94.6550595892287, 20.677207395105256], [94.66285086307693, 20.67707306427053], [94.67938682164458, 20.679051724757358], [94.68362681122841, 20.68060638817434], [94.68772546785613, 20.682161050692002], [94.68784661013302, 20.68231680607579], [94.69922404485385, 20.68556750093944], [94.6983254422654, 20.6807477211305], [94.6973572798147, 20.67661103127415], [94.69468602264192, 20.676488085856533], [94.6875436932869, 20.67566397141519], [94.68204959281451, 20.66962046071575], [94.67900455581565, 20.659621394411886], [94.67602569363089, 20.657706411321897], [94.6738979354414, 20.656110592230107], [94.66911047816609, 20.653344506044164], [94.66262081290023, 20.650046479861203], [94.65347145124656, 20.646003737682406], [94.65134369215775, 20.64855704876885], [94.64740733797834, 20.65206785095063], [94.64617369296161, 20.65462652199642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
