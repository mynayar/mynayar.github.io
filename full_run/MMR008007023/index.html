
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Ywar</div><div class="name-mm">အင်းရွာ</div></div>
        <span class="pcode-badge">MMR008007023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75875479969432, 17.722566943309857], [95.75801036068964, 17.71884474558857], [95.75733615064291, 17.707383176592373], [95.75396510130844, 17.69861844778319], [95.75329089126166, 17.693224768308482], [95.75059405107464, 17.6925505582617], [95.73845827203166, 17.68850529798118], [95.71736751619795, 17.688256678602897], [95.71782738722419, 17.693315260790712], [95.72610506659561, 17.7153890754455], [95.7282144732194, 17.720210573858935], [95.72884794127953, 17.720451895238796], [95.73321796203936, 17.72372940968455], [95.73696369232061, 17.727162996075435], [95.73930477239736, 17.73012836573156], [95.74070942170249, 17.73262552135077], [95.74804481121913, 17.73543481906171], [95.75144639433569, 17.738836403077585], [95.75325661629984, 17.738843589560076], [95.75509058666131, 17.738850871370687], [95.75557066185661, 17.73704367202788], [95.75698623702527, 17.736597323207945], [95.75652068857897, 17.735242152803153], [95.75840875496016, 17.734796395737135], [95.75982810278475, 17.7334461428253], [95.76171616107206, 17.733002919149442], [95.75935878078315, 17.72558684605616], [95.75875479969432, 17.722566943309857]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
