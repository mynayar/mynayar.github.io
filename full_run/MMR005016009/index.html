
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sone Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sone Chaung</div><div class="name-mm">စုန်းချောင်း</div></div>
        <span class="pcode-badge">MMR005016009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0269366800838, 22.180180049869477], [95.02420319971793, 22.184735759947387], [95.02420319971793, 22.19858225996336], [95.02420319971793, 22.205761920176542], [95.02420319971793, 22.213454489832884], [95.0272801203813, 22.21755714034981], [95.03907552041898, 22.21755714034981], [95.0413968001223, 22.22103905990474], [95.04215244018303, 22.222172610377697], [95.05087055982852, 22.22576243958497], [95.05497312041325, 22.227813810259192], [95.05907460001282, 22.230337770172014], [95.05952639962368, 22.230028169564434], [95.05961530839983, 22.22978857308425], [95.06002585790708, 22.228680620014643], [95.06253412105292, 22.223809500608013], [95.0674633609454, 22.219471770006237], [95.07040558385069, 22.21637469373718], [95.07120958405511, 22.215528378631802], [95.07571985318873, 22.211209954675724], [95.07751901079376, 22.205867067111512], [95.07814654602635, 22.204298227681136], [95.06933243994018, 22.20371064033384], [95.05497312041325, 22.202684909580967], [95.04984491990717, 22.193453970424457], [95.05343483994596, 22.18576148980094], [95.0509720797977, 22.185003689568646], [95.04676800014317, 22.18371012002609], [95.03548560038018, 22.183197299615756], [95.0269366800838, 22.180180049869477]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
