
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tay Za Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tay Za Ward</div><div class="name-mm">တေဇရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017005701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19643777957992, 17.302548322247333], [95.19463221160731, 17.302934152089506], [95.1926337228681, 17.303783489816226], [95.1901253023409, 17.304958630336557], [95.18626685193374, 17.306756704258532], [95.18422374243181, 17.30775472510055], [95.18300841480658, 17.308300795245543], [95.18169790113728, 17.308905282652745], [95.1807776689543, 17.309377218983514], [95.17856524678876, 17.310439618693522], [95.17922140564343, 17.31178027943639], [95.18772013657508, 17.307620370883456], [95.18886748174896, 17.30984365506066], [95.18949426784627, 17.312981265573], [95.18966424331023, 17.313109462132047], [95.19112561015885, 17.31396099690255], [95.19201543356547, 17.312483487223233], [95.19232439295644, 17.312016425217905], [95.19410401189072, 17.30921158364771], [95.1955128709223, 17.307019557206843], [95.19618239100458, 17.306009401812503], [95.19622573472992, 17.305830892681627], [95.19625080692924, 17.30568118883582], [95.19629670023261, 17.305394761958723], [95.19636724035593, 17.30431639838315], [95.19639528571395, 17.30352202362252], [95.19642928098659, 17.302918329417423], [95.19643777957992, 17.302548322247333]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
