
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Ohn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Ohn</div><div class="name-mm">ကွမ်းအုံ</div></div>
        <span class="pcode-badge">MMR007010025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.37056796104264, 19.23817215811863], [96.36683962185111, 19.23749427793865], [96.36311128265964, 19.235799578387855], [96.3587050641874, 19.234104878837115], [96.35294308625447, 19.233765938747126], [96.34989262724304, 19.231054419825682], [96.34345276913007, 19.229359720274942], [96.34040231011858, 19.228003960814192], [96.33592240929181, 19.226589255289923], [96.33430139209565, 19.229020780184896], [96.32820047407267, 19.23139335991567], [96.3248110749712, 19.237155337848606], [96.3241017158216, 19.244133503158707], [96.32786153398268, 19.24596777479303], [96.33972442993854, 19.246645654973065], [96.34582534796152, 19.24800141533308], [96.35497672589526, 19.24766247524309], [96.36143512982744, 19.250044836899747], [96.36378916283968, 19.24427307614161], [96.36582280158109, 19.24088367704013], [96.37056796104264, 19.23817215811863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
