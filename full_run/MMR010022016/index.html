
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Htaunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Htaunt</div><div class="name-mm">သစ်ထောင့်</div></div>
        <span class="pcode-badge">MMR010022016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01930072185087, 21.275900357015928], [95.03336337571926, 21.279709430146113], [95.04361734766252, 21.284690379257654], [95.05155651592054, 21.27263272072355], [95.0550203573037, 21.271766759928084], [95.05732958519224, 21.272055414425893], [95.06454591975847, 21.263973118164927], [95.0694530282347, 21.2584887042903], [95.07262821512012, 21.252426982319435], [95.07522609570782, 21.24376737976081], [95.07724666999786, 21.238282964986922], [95.07551474930631, 21.2348191236037], [95.07320552231704, 21.230777975922877], [95.0691643737369, 21.2250049075505], [95.06656649404852, 21.221252414367484], [95.06252534636769, 21.219231840077384], [95.05819554508838, 21.216345305891195], [95.0550203573037, 21.213747425303495], [95.05271113031449, 21.21721126578734], [95.04895863623216, 21.223272987758207], [95.0452061412505, 21.223561641356696], [95.04231960706426, 21.23193259031683], [95.0391444201789, 21.242035459069257], [95.03568057879573, 21.24838583373929], [95.03221673831189, 21.25617947640177], [95.02734471418728, 21.266149444241535], [95.01930072185087, 21.275900357015928]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
