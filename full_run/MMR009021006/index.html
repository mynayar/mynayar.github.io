
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boe Hpyu Lone Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Boe Hpyu Lone Kan</div><div class="name-mm">ဘိုးဖြူလုံးကန်</div></div>
        <span class="pcode-badge">MMR009021006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.53550188720237, 21.410031795830776], [94.54036344321838, 21.416693927682672], [94.54090856997459, 21.41823845484089], [94.54285203009715, 21.41813879107241], [94.55537367405589, 21.417244388317897], [94.56610651070696, 21.414561178255838], [94.57549774412564, 21.418585992449664], [94.58461883918812, 21.421843525758163], [94.58578337939952, 21.41679718604138], [94.57952255831947, 21.408747557653726], [94.58399457299123, 21.400697930165393], [94.59204420137883, 21.394437108186025], [94.599830409346, 21.390544004202468], [94.58086416155186, 21.371182626676955], [94.5729866849876, 21.363033512586583], [94.56789531711524, 21.366710612005193], [94.55485089275453, 21.37527101484551], [94.55358486674828, 21.376101843625236], [94.55000725483103, 21.397567518726078], [94.54553523925995, 21.403828340705388], [94.53882721590332, 21.405617147113674], [94.53704232064666, 21.405568906579845], [94.5374856108723, 21.40606434939025], [94.53550188720237, 21.410031795830776]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
