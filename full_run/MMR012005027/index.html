
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Zi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Zi</div><div class="name-mm">မင်းဇီ</div></div>
        <span class="pcode-badge">MMR012005027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.33680851010473, 20.495916460576268], [93.34188958163895, 20.498702856151965], [93.35290694130236, 20.503686898931278], [93.3660228455779, 20.50945789706435], [93.37441702402651, 20.51234339613086], [93.37677788738966, 20.505523125691752], [93.37861411415008, 20.49948980970703], [93.38281120337439, 20.49450576602834], [93.38228656677171, 20.490046358952327], [93.38123729536494, 20.481652179604453], [93.37887643200179, 20.475356545768022], [93.36366198311407, 20.470897137792747], [93.35080839669024, 20.466175412865084], [93.3385109869925, 20.461682128327595], [93.33700969474165, 20.464864207617154], [93.33541069744581, 20.468861702205857], [93.33341194970177, 20.471374413398507], [93.33261245060419, 20.473544481092972], [93.33261245060419, 20.475714549686757], [93.33346905665172, 20.477199333082808], [93.33598176784437, 20.47817015392951], [93.33843737118781, 20.479312294726697], [93.33986504943255, 20.480168900774174], [93.34117851107948, 20.482453183267864], [93.34232065187666, 20.48570828570888], [93.3424919727264, 20.488392317751334], [93.34077876242998, 20.491875848891368], [93.33866579988683, 20.494217238334954], [93.33680851010473, 20.495916460576268]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
