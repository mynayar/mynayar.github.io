
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Botahtaung</div><div class="name-mm">ဗိုလ်တထောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward</div><div class="name-mm">အမှတ် (၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013017701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17006450297447, 16.776542451373075], [96.1699914933128, 16.77474117316666], [96.16994843107528, 16.77398080087329], [96.16990089381125, 16.773099898741407], [96.16987373068815, 16.771474459578712], [96.1690807345883, 16.771501540863483], [96.16861152680059, 16.77153205755843], [96.16710908071957, 16.771588734632473], [96.16711997960346, 16.77208137515538], [96.16716194197011, 16.773042677577564], [96.16719245956443, 16.774082819966225], [96.16683006155813, 16.77411079427776], [96.16624260011594, 16.774141311872086], [96.16579246515022, 16.774141311872086], [96.16538047942566, 16.774160384694028], [96.16496340443763, 16.77417182856709], [96.16449133590646, 16.77418804244428], [96.1645298008097, 16.775253296602386], [96.16458771175354, 16.776691159669326], [96.16573333742366, 16.776632308933983], [96.16732215889056, 16.776601791339658], [96.16783905143114, 16.776601791339658], [96.16842460631057, 16.776590346567275], [96.1689510343628, 16.776571273745333], [96.16935157801299, 16.776559829872326], [96.17006450297447, 16.776542451373075]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
