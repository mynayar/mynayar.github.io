
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Ma</div><div class="name-mm">အိုင်းမ</div></div>
        <span class="pcode-badge">MMR009020077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76625430399298, 21.535620334410964], [94.766252499953, 21.535488628697294], [94.7498475950905, 21.533997273955094], [94.7377037041627, 21.533358122179663], [94.7270511679771, 21.532718968605593], [94.72263935841971, 21.532383894701013], [94.72263035170943, 21.532423663621216], [94.71940807632171, 21.532324856906655], [94.71909554842091, 21.533158249653525], [94.71775650825629, 21.541359161995786], [94.71892792108673, 21.54621279858185], [94.71708691532893, 21.54905798913495], [94.71466657080566, 21.553764182770863], [94.71940208144099, 21.554364657403084], [94.71934191319878, 21.554630261377497], [94.724494559976, 21.555302345426924], [94.74558658025654, 21.556580648977842], [94.76135233334355, 21.558072003720042], [94.76518724579483, 21.558072003720042], [94.76561334817751, 21.55594149720241], [94.76646555024502, 21.551041330592966], [94.76625430399298, 21.535620334410964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
