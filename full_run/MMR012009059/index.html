
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Paung Zar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Paung Zar</div><div class="name-mm">ပေါင်းဇား</div></div>
        <span class="pcode-badge">MMR012009059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.34173194327462, 20.88355024384873], [92.3461310508074, 20.876511671976118], [92.35038352118261, 20.87005421772801], [92.34770603980195, 20.86611674479201], [92.34361106859598, 20.862651770263028], [92.34139067933643, 20.861903034297654], [92.34282357364907, 20.859344293104698], [92.34549588122997, 20.856233698226617], [92.34672482818831, 20.855850717436738], [92.34735354423071, 20.854204118125608], [92.34571647503537, 20.854051833225583], [92.34495504783723, 20.854127976125255], [92.34358447834109, 20.854470617824802], [92.34198548014587, 20.854851332323165], [92.3400438402511, 20.855270116922384], [92.33859712785522, 20.855650831420803], [92.33715041456003, 20.855726973421156], [92.33570370306353, 20.85557468762181], [92.3346377042667, 20.855232045922207], [92.33402057598886, 20.856422052235985], [92.33385701359038, 20.857676026427555], [92.33384925423974, 20.857735514782235], [92.32973754575119, 20.867843464704208], [92.32762458410735, 20.871612530593836], [92.3229937509609, 20.877506318561814], [92.33148365324809, 20.880134146573653], [92.34173194327462, 20.88355024384873]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
