
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaw Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaw Ywar</div><div class="name-mm">ကျော်ရွာ</div></div>
        <span class="pcode-badge">MMR009023009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.03711728193707, 22.21932262823674], [94.03733914378654, 22.22254073976336], [94.03800395321991, 22.254327681277516], [94.03560519422439, 22.267948764423977], [94.04455887868937, 22.264740100275446], [94.06862476901796, 22.26638844876794], [94.09170164971141, 22.264410431296426], [94.1062071180641, 22.26704778762536], [94.11744234568778, 22.28285177359055], [94.13950375959087, 22.284520283983966], [94.14576748458182, 22.288146650847295], [94.14477847584607, 22.27627854062223], [94.15071253095857, 22.26968514575293], [94.13950375959087, 22.259135715041282], [94.12005324576074, 22.2462785960804], [94.11642687889741, 22.235729165368753], [94.12269060388832, 22.219905018401903], [94.12684923270598, 22.21436017907905], [94.13455871411344, 22.20408087143511], [94.13357912397743, 22.20065230595918], [94.13324003459996, 22.199465494936703], [94.1197235758824, 22.201443513307538], [94.10237467515117, 22.20703044719744], [94.08082254912142, 22.2139709632894], [94.03711728193707, 22.21932262823674]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
