
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Thar</div><div class="name-mm">ညောင်ပင်သာ</div></div>
        <span class="pcode-badge">MMR017017088</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08078997008113, 16.520607540605567], [95.08211057144575, 16.521975729596306], [95.08407362599712, 16.523879299390217], [95.08499871631778, 16.525040677585253], [95.08778110181646, 16.52684438486051], [95.09020073857329, 16.52964949173071], [95.09117627726346, 16.531069517644198], [95.0914827482303, 16.53440396007477], [95.09049219715723, 16.536962882930766], [95.09282351958984, 16.536311369973816], [95.09582628035861, 16.53539462985833], [95.09876999973574, 16.531570170227212], [95.10024527999576, 16.52709347998018], [95.10256368006986, 16.525185839854657], [95.10488172041511, 16.52327828966139], [95.10641099956803, 16.522742159722952], [95.11005707957065, 16.521463800414097], [95.11255331968005, 16.517100959841457], [95.11178291994588, 16.513846020177766], [95.10830136011975, 16.50991184955228], [95.10207012043975, 16.5138570899328], [95.09676948032734, 16.517644019955583], [95.08994387960644, 16.511624729797518], [95.08895928024663, 16.510756050351517], [95.08664987968825, 16.513705980446673], [95.08246739995059, 16.518339989998594], [95.08152984502641, 16.51991791527962], [95.08078997008113, 16.520607540605567]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
