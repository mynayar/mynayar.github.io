
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Loke Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Loke Chaung</div><div class="name-mm">တလုပ်ချောင်း</div></div>
        <span class="pcode-badge">MMR009016012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37092301808286, 19.395871975111618], [95.36989417387707, 19.395592398370525], [95.3688182015988, 19.403482860245845], [95.36200371290107, 19.421415727653766], [95.36172032932978, 19.421569226638553], [95.36343834200596, 19.42643693042004], [95.36056908289692, 19.437913965956795], [95.35913445379208, 19.442935167823805], [95.36021042607035, 19.447597713763514], [95.36594894338907, 19.458357433848562], [95.37240477615956, 19.46588923889732], [95.37563269209511, 19.469117154832873], [95.38018114914075, 19.473381332582505], [95.38649171891774, 19.473236262943203], [95.39349434578747, 19.472620647325073], [95.38710972673255, 19.465171924344872], [95.38675106990598, 19.453336231981552], [95.38818569901088, 19.438989938235125], [95.3921309303982, 19.423209013585165], [95.40289064958387, 19.404558831624854], [95.40156467117271, 19.40419851195179], [95.37092301808286, 19.395871975111618]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
