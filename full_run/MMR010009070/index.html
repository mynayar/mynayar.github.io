
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Tan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Tan Gyi</div><div class="name-mm">ကုန်းတန်းကြီး</div></div>
        <span class="pcode-badge">MMR010009070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0546390976163, 22.08483259824584], [96.0502679230263, 22.085378994844802], [96.04912023970735, 22.087789129364864], [96.04261587142537, 22.09192827257175], [96.0368999109022, 22.092716681229888], [96.0298042365763, 22.092913782944777], [96.02905463096653, 22.092913782944777], [96.03043174662787, 22.096429824576774], [96.0322742461596, 22.101873398438613], [96.0344257347599, 22.107965468931297], [96.0344660333808, 22.110589853439023], [96.03492889105553, 22.110652969658872], [96.04064625272247, 22.111555710927348], [96.04202456538144, 22.107696439439167], [96.04498109560114, 22.10316309100392], [96.04739073819206, 22.09981636563282], [96.0485289327641, 22.098235539138898], [96.05267411491855, 22.092828779924332], [96.0530622811994, 22.092322476900847], [96.0546390976163, 22.08483259824584]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
