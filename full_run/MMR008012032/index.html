
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Tin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Tin Gyi</div><div class="name-mm">ပန်းတင်ကြီး</div></div>
        <span class="pcode-badge">MMR008012032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54766558459909, 18.340083350566204], [95.55438592596977, 18.338739283191444], [95.55606601063795, 18.342099453427068], [95.56211431922054, 18.34646767464352], [95.56754028885331, 18.348538252138667], [95.56823687403255, 18.345104170221305], [95.57075089104086, 18.342808765811924], [95.57089433560515, 18.341138125823875], [95.57185538981446, 18.338430608885517], [95.57280478881, 18.337984025342564], [95.57328530916976, 18.33663280835748], [95.57518489676562, 18.33528642882567], [95.57849686244032, 18.334851282860484], [95.58114265710799, 18.333604074268635], [95.57994323129515, 18.3305108237156], [95.57799611722709, 18.326129814139676], [95.57483401188023, 18.32037715588109], [95.57416327321653, 18.31915691436018], [95.5740490916923, 18.31894919075262], [95.57252558528756, 18.31648798373351], [95.56782660871107, 18.319922327353595], [95.5614422837345, 18.32261046300249], [95.55673804522468, 18.320930378334367], [95.5406092259351, 18.313874018771003], [95.53220879899692, 18.312529951396186], [95.52877339057954, 18.319424959094647], [95.53187278170356, 18.320930378334367], [95.53859312397356, 18.328994787979127], [95.54531346534424, 18.337731231311352], [95.54766558459909, 18.340083350566204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
