
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moke Soe Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moke Soe Chon</div><div class="name-mm">မုဆိုးခြုံ</div></div>
        <span class="pcode-badge">MMR005006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78649672014757, 22.44685005008978], [95.7826025999301, 22.44685005008978], [95.7708158396793, 22.44937581044536], [95.76450143968975, 22.44685005008978], [95.75578367977306, 22.445803890337345], [95.75397755961671, 22.445587169912017], [95.7497680804326, 22.445587169912017], [95.74597943989932, 22.451901569901565], [95.74597943989932, 22.45374845992353], [95.74597943989932, 22.460741640314495], [95.74640028034872, 22.466214089608627], [95.74742376009851, 22.466470050152736], [95.75313551988842, 22.467897990100198], [95.7581870397002, 22.4750542499537], [95.76281771996184, 22.48221050980726], [95.76576431986751, 22.488945840178417], [95.76664588390048, 22.493940227859298], [95.76817884038121, 22.493947950337713], [95.77206215974093, 22.494867300285705], [95.77298376608798, 22.495300549580747], [95.77433195955234, 22.495934339598136], [95.77670940011876, 22.491892619948487], [95.77670940011876, 22.48557821995894], [95.77670940011876, 22.47800093979157], [95.77670940011876, 22.46873984996415], [95.78218176038001, 22.45863690027278], [95.78597040001404, 22.447691999885933], [95.78649672014757, 22.44685005008978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
