
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Tha Mar (Myanmar)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lemyethna</div><div class="name-mm">လေးမျက်နှာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Tha Mar (Myanmar)</div><div class="name-mm">လက်သမား (မြန်မာ)</div></div>
        <span class="pcode-badge">MMR017010024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1497233196755, 17.53306433964758], [95.15136636036931, 17.528840279755173], [95.15270051991314, 17.525411279906677], [95.15302596027988, 17.524760040343665], [95.15356883963028, 17.521937549578297], [95.15400299993854, 17.51965793996203], [95.15606544036785, 17.51574996029251], [95.15704895964183, 17.513906165737012], [95.15605500013822, 17.513317349915837], [95.1522192000561, 17.512591679762238], [95.14910916005977, 17.509585140042248], [95.14869444039618, 17.50968882018293], [95.14195559997103, 17.51870835031019], [95.13931715995903, 17.52115500000332], [95.13625967994034, 17.52671528967892], [95.13815111967847, 17.52712056016577], [95.13963684016812, 17.527931100240153], [95.14112292038652, 17.528561460243225], [95.14256363970026, 17.529687180319172], [95.14418471984902, 17.530587809979522], [95.14562579979088, 17.531758530331956], [95.14724687993964, 17.53256907040634], [95.1497233196755, 17.53306433964758]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
