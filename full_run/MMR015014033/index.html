
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Lan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Lan</div><div class="name-mm">နမ့်လန်</div></div>
        <span class="pcode-badge">MMR015014033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.41870742710614, 22.301786450684176], [97.41870742710614, 22.29120341410635], [97.41263933793516, 22.285640999332713], [97.4131450123325, 22.277044539074268], [97.41415636022788, 22.271482124300633], [97.41567338162133, 22.264908360732306], [97.41668473041602, 22.25732324926861], [97.41719040481337, 22.243164374236528], [97.4151677081233, 22.23507358837543], [97.4151677081233, 22.225971453719637], [97.41692657520133, 22.2257076241076], [97.41462313624879, 22.22340418605438], [97.41112231474307, 22.225971453719637], [97.39949181079851, 22.224960105824266], [97.37774782430273, 22.22243173563612], [97.3630832748733, 22.22546578022161], [97.34184496277487, 22.236084937170176], [97.33165656579791, 22.246273333247757], [97.33556382061391, 22.253828105182947], [97.34103246397711, 22.262422482611555], [97.34415720339229, 22.275704593292403], [97.34590639466444, 22.295388729406397], [97.3438235872888, 22.29949141859413], [97.34142208086439, 22.30422187503956], [97.33869497938986, 22.309923896070984], [97.36662299385614, 22.307384984929172], [97.38533293576643, 22.304856614741027], [97.40151450658925, 22.30131689575819], [97.41719040481337, 22.302328243653562], [97.41870742710614, 22.301786450684176]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
