
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Maung Sun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Maung Sun</div><div class="name-mm">ရွှေမောင်းစွန်း</div></div>
        <span class="pcode-badge">MMR009017018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18111157104221, 19.61031276472238], [95.18066926287622, 19.595274296971297], [95.18022695471024, 19.579793521054228], [95.17801541567894, 19.568293515933078], [95.17756111685213, 19.567637307615712], [95.176737279402, 19.560971904929545], [95.17579917319335, 19.55915854073413], [95.17635537689921, 19.549249686324004], [95.17372618281712, 19.569653459039955], [95.17308692042508, 19.573276280775815], [95.1404165469861, 19.57425094082828], [95.11851438862817, 19.572278622360557], [95.10567034760851, 19.572310267704722], [95.10450299161982, 19.57814704674888], [95.10450299161982, 19.592080174860257], [95.0944711387321, 19.60879992877375], [95.08834056286673, 19.616045155859297], [95.08087978087724, 19.6226016002837], [95.0795277302206, 19.626286725252214], [95.0842223603737, 19.62505246509926], [95.08778323770633, 19.624405033265703], [95.10728961742194, 19.62942095881027], [95.12010809521246, 19.627191658168556], [95.13069727326064, 19.622733056885124], [95.1429584258907, 19.633879560093646], [95.15800620432293, 19.633879560093646], [95.1812728887329, 19.63425482919706], [95.18111157104221, 19.62844738783673], [95.18111157104221, 19.61031276472238]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
