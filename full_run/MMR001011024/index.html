
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegu</div><div class="name-mm">ရွှေကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Kone</div><div class="name-mm">မြို့ကုန်း</div></div>
        <span class="pcode-badge">MMR001011024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.88520465477109, 24.219676573115407], [96.87306497267042, 24.242499174996965], [96.87076016315109, 24.245280841937358], [96.8563794307662, 24.262636896775405], [96.86075720008478, 24.273845586304788], [96.86325831991559, 24.29552196176917], [96.87159538781697, 24.314697218302058], [96.89243805667104, 24.32887023337463], [96.9257863282765, 24.33720730127601], [96.94021902258987, 24.338956718277984], [96.94325931926221, 24.32592688092086], [96.93520423019112, 24.31326888355221], [96.92714914112003, 24.293706526435074], [96.92657377735799, 24.27587025700683], [96.94671150003575, 24.267239805073018], [96.94901295418452, 24.25745862561513], [96.94901295418452, 24.23904699422343], [96.94613613627371, 24.191867188220215], [96.94404317105557, 24.175542056820518], [96.94210859173819, 24.17575701007803], [96.91152465174133, 24.16766126085855], [96.908737508829, 24.176332372940692], [96.89550414859764, 24.203374457165523], [96.88744906042587, 24.21545709077219], [96.88520465477109, 24.219676573115407]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
