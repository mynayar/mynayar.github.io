
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wa Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wa Bar</div><div class="name-mm">ဝဘာ</div></div>
        <span class="pcode-badge">MMR005010009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28271488038746, 22.683898890321586], [95.28570539958457, 22.685913090217014], [95.29248059960003, 22.686523469982205], [95.30010972028742, 22.682495160123608], [95.30572499990888, 22.67791749039992], [95.30788499969304, 22.676469029722], [95.30371080001345, 22.67150877041348], [95.29132068010534, 22.662475559799304], [95.28311087976334, 22.650041519700437], [95.28027336042732, 22.650878880256187], [95.27368175970548, 22.656677219578057], [95.26971419995044, 22.665527369592496], [95.26727303971904, 22.67150877041348], [95.26498632006269, 22.674382019814402], [95.267517120219, 22.677307109735352], [95.26678272034633, 22.677307109735352], [95.26679207959086, 22.677336270252738], [95.2668136804071, 22.67733636018494], [95.26788323961989, 22.68072512976096], [95.2747192796711, 22.680297809696185], [95.28088392005691, 22.682495160123608], [95.28271488038746, 22.683898890321586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
