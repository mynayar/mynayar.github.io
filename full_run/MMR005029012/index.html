
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyar Thone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyar Thone</div><div class="name-mm">ပျားသုံး</div></div>
        <span class="pcode-badge">MMR005029012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.38557112001126, 22.778439480097973], [94.38348636020743, 22.776205770080253], [94.38284052017394, 22.767161040049984], [94.37637995966747, 22.765222890424127], [94.36216679975809, 22.756824180291744], [94.34020104044572, 22.74067286985712], [94.32340344031655, 22.733566290352087], [94.3001456403091, 22.717414979917464], [94.26461291995037, 22.696095239603665], [94.23928727998407, 22.687825770143206], [94.23940987556534, 22.689327610081193], [94.23958625600096, 22.691488034345355], [94.23536765859063, 22.697552268122706], [94.23542368365611, 22.69805649641023], [94.23593809766516, 22.70268622428989], [94.23622332035, 22.707534961369447], [94.23764941938526, 22.712383698449003], [94.23536765859063, 22.71922897633624], [94.23707897941142, 22.720655073572857], [94.24420947368833, 22.720084635397654], [94.25675051962082, 22.717671929715834], [94.26848904023706, 22.71676896001952], [94.28787071995782, 22.72839785957359], [94.30854444037368, 22.741964999585093], [94.32275760028307, 22.744549170008213], [94.33826279998829, 22.76263863006875], [94.35699827994671, 22.77491364035228], [94.38025607995417, 22.779436050333516], [94.38557112001126, 22.778439480097973]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
