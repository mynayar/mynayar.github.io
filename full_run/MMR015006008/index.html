
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsawng Kye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsawng Kye</div><div class="name-mm">ဆောင်ကျဲ</div></div>
        <span class="pcode-badge">MMR015006008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.0715754616383, 22.614185613575273], [99.05351217364796, 22.621769017226427], [99.04499383030111, 22.62552710958846], [99.03973249955527, 22.62903466431834], [99.03271739279353, 22.632041138387876], [99.0245471671181, 22.63409753986963], [99.0264539052236, 22.63955732401132], [99.02620336489343, 22.645319732719543], [99.0236979696856, 22.663108038605174], [99.02044095618521, 22.676136094405308], [99.02004553687209, 22.679694864626356], [99.03973527126584, 22.689621665907225], [99.03998303898612, 22.682650122305347], [99.04349059281668, 22.673881238628326], [99.04649706688616, 22.669622067404532], [99.04850138323229, 22.664611276089545], [99.05100677844013, 22.661604802020065], [99.05551648999409, 22.656594010705078], [99.0587735043938, 22.65158322118873], [99.06228105732498, 22.64832620678908], [99.0641247070896, 22.64801869980323], [99.07305425734813, 22.635548691319116], [99.07505857279494, 22.628533584557317], [99.07455749393324, 22.623021715280004], [99.07280371701796, 22.618261464295188], [99.0715754616383, 22.614185613575273]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
