
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div>
        <span class="pcode-badge">MMR009014071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73208760705745, 19.26696301633018], [94.73284979238406, 19.270011755837913], [94.72914399559897, 19.28668783867289], [94.72544186355123, 19.29177826855232], [94.73067039242471, 19.29526395356868], [94.74181226772203, 19.31211961302978], [94.7462230295692, 19.316775416752137], [94.74881416074498, 19.316559488629537], [94.7491461715586, 19.315131840961726], [94.75476851805274, 19.309509495366967], [94.7603908636475, 19.30359123594684], [94.76867642557664, 19.295601586943746], [94.77252126744258, 19.29267218387423], [94.77193146776307, 19.291754718905224], [94.76986007728078, 19.281693679419845], [94.7748249815877, 19.26621486042751], [94.7748905970235, 19.26601029433965], [94.75337691521253, 19.258347886146055], [94.75299573306671, 19.25836376907273], [94.75384930390231, 19.2588943672813], [94.73717322106734, 19.26507069435712], [94.73208760705745, 19.26696301633018]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
