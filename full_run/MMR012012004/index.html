
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sun Pan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Munaung</div><div class="name-mm">မာန်အောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sun Pan Chaung</div><div class="name-mm">စွန်ပန်းချောင်း</div></div>
        <span class="pcode-badge">MMR012012004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.51759347795672, 18.88071813793175], [93.52000554781785, 18.882162506694385], [93.52087211385702, 18.882396548961594], [93.52114030428169, 18.88246898215783], [93.52487924558079, 18.882425302086062], [93.52659295769888, 18.881410195923877], [93.52742901963359, 18.881266047190365], [93.53100225904706, 18.88064997111934], [93.53584987287337, 18.879621167382993], [93.5395261440164, 18.879684138812024], [93.54067339476143, 18.879408746616434], [93.54107031684168, 18.878970525869136], [93.54223321668968, 18.879671256923018], [93.54576421944324, 18.879811580839828], [93.5507974578365, 18.88130254167902], [93.55614736640791, 18.884457324745767], [93.55634618582786, 18.883659411152962], [93.56023215998624, 18.878445607778644], [93.56809328687575, 18.86902908272606], [93.56967136594085, 18.867138601665204], [93.57032894032841, 18.861497616721692], [93.56507672601015, 18.85974165625248], [93.55897847357772, 18.85798812934877], [93.54875219805558, 18.857020831146485], [93.54577440066811, 18.856739054663706], [93.53443821784953, 18.85741695642747], [93.52801060670419, 18.85840229592924], [93.52040082683675, 18.860196350780996], [93.51683435212374, 18.860319655028093], [93.51669078615095, 18.864395825906684], [93.51806683881364, 18.8714809313999], [93.51827196967571, 18.87493339995649], [93.51759347795672, 18.88071813793175]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
