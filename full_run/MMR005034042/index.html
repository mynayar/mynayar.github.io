
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Taung</div><div class="name-mm">ကွန်းတောင်း</div></div>
        <span class="pcode-badge">MMR005034042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09138108167161, 24.85923296702788], [95.07472485496817, 24.865181619036548], [95.06044808870837, 24.863991888814667], [95.04974051401359, 24.87410459794887], [95.06520701139453, 24.881242981078742], [95.0711556634032, 24.893140285995457], [95.05866349292592, 24.89551974733854], [95.05687889714346, 24.906227321133997], [95.08840675566728, 24.917529761389403], [95.0937605430147, 24.935970583875417], [95.0925708118935, 24.95143708035704], [95.12112434531235, 24.967498442399233], [95.13233242240341, 24.977844360129154], [95.14432408868578, 24.98891359088958], [95.17241531841228, 24.999891773386707], [95.20466548092725, 24.954209300818604], [95.19041755682485, 24.929484961961464], [95.17533152033343, 24.908532133351343], [95.15018812528183, 24.904341566909864], [95.11121586232224, 24.880455341340962], [95.09138108167161, 24.85923296702788]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
