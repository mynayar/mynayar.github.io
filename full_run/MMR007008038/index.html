
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Taing Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Taing Wa</div><div class="name-mm">မဲတိုင်ဝ</div></div>
        <span class="pcode-badge">MMR007008038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.08277874124599, 17.702684714428074], [97.08148758278577, 17.697089693834357], [97.07966703480588, 17.681159905305435], [97.07511566665477, 17.661589022615374], [97.07163121640758, 17.655366788746335], [97.06646806824682, 17.6574927905599], [97.05326909988912, 17.653396560303065], [97.0499260320608, 17.648103368375814], [97.04689718465738, 17.649755466141926], [97.03051226003282, 17.652941423308107], [97.01640301858453, 17.654761971287996], [97.00210705539632, 17.657679514098334], [97.00047323095492, 17.65931333943911], [96.99819754687934, 17.668416074842014], [96.9986526838743, 17.678429085134212], [97.00183864104054, 17.690717777703355], [97.00001809395991, 17.70164106198547], [96.99364617872823, 17.710288661292736], [96.99319104173327, 17.71939139669564], [96.99501158881384, 17.72894926999288], [96.99877378388305, 17.731535778653324], [97.0022937780355, 17.733955775138952], [97.01230678832769, 17.729859543982798], [97.02095438673564, 17.7198465336906], [97.03187767011843, 17.71301948236328], [97.03988807817234, 17.714020783032765], [97.04462150058185, 17.710743798287695], [97.05691019494958, 17.707557840222194], [97.07602594064468, 17.70300647207108], [97.08277874124599, 17.702684714428074]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
