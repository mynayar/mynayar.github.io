
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Mon Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Munaung</div><div class="name-mm">မာန်အောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Mon Te</div><div class="name-mm">စမုံတဲ</div></div>
        <span class="pcode-badge">MMR012012020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.68131852333124, 18.813591447187605], [93.67826608131463, 18.811830503574924], [93.67673955678515, 18.810869458358866], [93.67580353970163, 18.80950345292206], [93.67233964256053, 18.81056336240931], [93.6628804275897, 18.814303233607404], [93.6583188863076, 18.81593072592233], [93.65883598209496, 18.818345542312954], [93.66360073868321, 18.82525618472522], [93.66921706241754, 18.83345247814941], [93.67211425536863, 18.838597444716356], [93.67313859756825, 18.840849241899036], [93.67416297034487, 18.84310103188716], [93.6777465258815, 18.850498919789345], [93.68095720271282, 18.85537399441438], [93.68166291691017, 18.85644549976007], [93.68248215882466, 18.857990300312167], [93.6828103367277, 18.857443336241033], [93.68497072232105, 18.855733029855514], [93.69253207459565, 18.854742852900415], [93.69705677694878, 18.855098863921455], [93.69677642769005, 18.854023175828956], [93.69533699440683, 18.84849988606095], [93.69514560158831, 18.843183989849308], [93.69392492479551, 18.834488668917004], [93.6933193267256, 18.831268754249663], [93.69154876756164, 18.83272540865073], [93.68918065116617, 18.83289540839644], [93.68646749637793, 18.8314555632237], [93.68611717087077, 18.828556887290574], [93.68507950341643, 18.82308300267846], [93.68302944485305, 18.8182573116257], [93.68131852333124, 18.813591447187605]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
