
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee Kan</div><div class="name-mm">ကျီးကန်</div></div>
        <span class="pcode-badge">MMR005006033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68410479979673, 22.36759686040682], [95.68957104017142, 22.366868039928136], [95.70009492024445, 22.363921350090266], [95.70473676019338, 22.363432740328733], [95.7059884797846, 22.35592314044061], [95.70725135996236, 22.349187810069452], [95.70346272032833, 22.34666204971387], [95.69756915988887, 22.344557219739954], [95.69335967980544, 22.344557219739954], [95.69302956026604, 22.34307194981068], [95.68704527981589, 22.345399170435428], [95.68494035990972, 22.348766789755587], [95.67820512037008, 22.351713570424977], [95.67189072038047, 22.351713570424977], [95.66683919966937, 22.34960873955174], [95.65757819977415, 22.353397380085084], [95.64663312042222, 22.353397380085084], [95.63989787998321, 22.352134499907322], [95.63366772038904, 22.352134499907322], [95.63400468017193, 22.353397380085084], [95.63105771963814, 22.359711780074633], [95.63105771963814, 22.363921350090266], [95.6310015596743, 22.36476320995422], [95.63610924034924, 22.36476320995422], [95.64073991971156, 22.365605159750373], [95.64831719987893, 22.368551849588243], [95.65463159986848, 22.371498540325433], [95.66220888003585, 22.369814729766006], [95.66768124029704, 22.36897277996985], [95.67988884009793, 22.366447110445847], [95.68410479979673, 22.36759686040682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
