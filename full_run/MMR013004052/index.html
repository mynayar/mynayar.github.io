
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Su Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Su Taung</div><div class="name-mm">ငါးဆူတောင်</div></div>
        <span class="pcode-badge">MMR013004052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17417259528912, 17.216350469698455], [96.18831305040703, 17.21604960960184], [96.19162251776504, 17.215147026614034], [96.19613542910685, 17.204917761745378], [96.19794059418314, 17.195290218868536], [96.1976397331872, 17.192883332699694], [96.19583456811091, 17.1898747254383], [96.19041907468062, 17.184760093003945], [96.18650788533068, 17.18084890275469], [96.1801898098119, 17.179344598674334], [96.17387173429319, 17.178141155589913], [96.17176570912022, 17.178742877581783], [96.16665107668592, 17.177840296392617], [96.1618373052475, 17.17753943539668], [96.15822697599418, 17.178141155589913], [96.1534132036565, 17.18145062474656], [96.15100631838692, 17.185361814096495], [96.14859943221808, 17.189573865341686], [96.14649340704517, 17.19378591478818], [96.1443873818722, 17.1973962440415], [96.14528996396075, 17.201909155383248], [96.14859943221808, 17.210032395078997], [96.14859943221808, 17.21274014224383], [96.15220976057208, 17.214545306420803], [96.16063386216308, 17.216350469698455], [96.166049354694, 17.21544788760997], [96.17417259528912, 17.216350469698455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
