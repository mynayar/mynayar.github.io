
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Se</div><div class="name-mm">ကျောက်ဆည်</div></div>
        <span class="pcode-badge">MMR009016018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28567697471266, 19.164439608800933], [95.27276939569111, 19.1721841556743], [95.25737082860093, 19.181049997059745], [95.25340453239329, 19.18058337392364], [95.24710511870632, 19.169384416857383], [95.24652368811775, 19.169109852937424], [95.22890681279921, 19.168217858567346], [95.22330733426611, 19.17078428716519], [95.2202742843308, 19.171250910301296], [95.22307402314772, 19.17731701197056], [95.22657369711851, 19.18478298304825], [95.22626901670179, 19.18526176501848], [95.22744029913054, 19.185730277630284], [95.24193893533368, 19.226226468776588], [95.26307663937547, 19.206572112812808], [95.28353666738337, 19.19429609618794], [95.29005136078172, 19.187540117382582], [95.29358068000442, 19.183880081700465], [95.29271920502737, 19.179357338970078], [95.29209267793482, 19.176068071284533], [95.28567697471266, 19.164439608800933]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
