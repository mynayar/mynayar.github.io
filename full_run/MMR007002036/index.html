
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hla Pa Kit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hla Pa Kit</div><div class="name-mm">လှပကစ်</div></div>
        <span class="pcode-badge">MMR007002036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61383055903315, 17.198316769403448], [96.6076533092529, 17.19858534473792], [96.60029335655321, 17.199906361589342], [96.59349955496054, 17.204435563250684], [96.59236725544451, 17.207832463597356], [96.59459142365534, 17.211596442022255], [96.59482057181202, 17.211984232386442], [96.59584241209768, 17.21675281469072], [96.59595287312663, 17.217268299792238], [96.59760044910149, 17.22104413397966], [96.59463049560094, 17.223717091770425], [96.59953848990943, 17.226892853322568], [96.60381495059954, 17.22230871297677], [96.60569999975525, 17.222163709887354], [96.60851195766077, 17.22194740494882], [96.61501550666037, 17.22050217193771], [96.61826728071048, 17.22014086390982], [96.61862858963775, 17.215805164876485], [96.61862858963775, 17.21146946494389], [96.61968591537277, 17.207945047026328], [96.62215430617636, 17.20809932212609], [96.61872439981124, 17.203257102433383], [96.61727711904388, 17.198247284184845], [96.61383055903315, 17.198316769403448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
