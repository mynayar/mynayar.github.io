
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaw La Pya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaw La Pya</div><div class="name-mm">ကော်လပြ</div></div>
        <span class="pcode-badge">MMR005012040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1073120797887, 22.226831460103824], [95.11208747985336, 22.224102749742144], [95.11796123991934, 22.220292600123457], [95.12462915980791, 22.22076888017972], [95.12493371971544, 22.221499859930645], [95.127803999555, 22.219181279992142], [95.13002663981763, 22.214418660193076], [95.13053208039128, 22.214643300048294], [95.1316142400052, 22.20790968018764], [95.13374183991402, 22.20228648023692], [95.13074663974567, 22.19894540980289], [95.12153855955694, 22.196564100352987], [95.10836184042665, 22.193865180034095], [95.10796584015145, 22.194363149939477], [95.1028056003982, 22.200850440095792], [95.10026544009804, 22.207676940138754], [95.09575466194815, 22.21295560082035], [95.0962682287958, 22.21383246409698], [95.09763111178643, 22.21674240224013], [95.09932550556766, 22.220094357168875], [95.10121800021062, 22.22339372963694], [95.1073120797887, 22.226831460103824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
