
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR010011701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.51862057058293, 22.935143503869654], [96.51829709343616, 22.937623470746644], [96.52036722396826, 22.939907753240277], [96.52136659739062, 22.94247757138288], [96.52415056659544, 22.94561845992405], [96.52686315211287, 22.945547076236608], [96.53086064670157, 22.946760600721177], [96.53421568720427, 22.949187650589636], [96.53864148391739, 22.947474439393886], [96.54278174678024, 22.945475691649904], [96.5454229477109, 22.942049268359085], [96.54428080691378, 22.938694227856388], [96.54064023166143, 22.936909632073935], [96.53771349508179, 22.934696734167005], [96.53523321074414, 22.931671995766067], [96.53587889879219, 22.930380620569224], [96.53700373303593, 22.926443704313556], [96.52744264915901, 22.91688262043664], [96.52258695672276, 22.913105970564118], [96.51560809713601, 22.910946388964703], [96.51113828310537, 22.909169567821323], [96.50722372579435, 22.908392209133183], [96.50494717387306, 22.907587088373475], [96.50275391176365, 22.906837491756903], [96.50089380260698, 22.9059768441561], [96.49889488039446, 22.903783582046742], [96.49370323271808, 22.902506491681322], [96.48706791864959, 22.902506491681322], [96.48162640693317, 22.902645305636383], [96.4735795619473, 22.90520799485313], [96.47422284790616, 22.911383546713353], [96.47382959595916, 22.915840402412698], [96.4776651604189, 22.917484215624086], [96.4863376511617, 22.923528678705622], [96.49632415573524, 22.925368297708815], [96.50709906896691, 22.928784734028284], [96.5157715606091, 22.931938367761518], [96.51862057058293, 22.935143503869654]]]]};
        const layer = L.geoJSON(geojsonData, {

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
