
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lat Kee Lon Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lat Kee Lon Yar</div><div class="name-mm">လပ်ကီးလုံရာ</div></div>
        <span class="pcode-badge">MMR005037022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.93040456032224, 26.69069277025517], [95.91247547995948, 26.69512941009424], [95.89410396012971, 26.697326669690085], [95.87512224039915, 26.70147702024832], [95.85870371980087, 26.711914050093412], [95.85772703987107, 26.71148681996084], [95.85772992039955, 26.711520030125314], [95.85870371980087, 26.722717290170863], [95.87768544043081, 26.750488319880105], [95.87908944042539, 26.752929659975905], [95.89288319969995, 26.776489230193874], [95.89947516015059, 26.788513139869565], [95.90059584042575, 26.790362459859693], [95.90069591968103, 26.790527339764992], [95.90289300031179, 26.788513139869565], [95.91668712021448, 26.787109409671586], [95.93469251974403, 26.777709989724315], [95.97351060023408, 26.76269529015559], [95.96667491991167, 26.7495117298825], [95.95928951999542, 26.733520530248313], [95.952087359644, 26.71911621044478], [95.93548596010902, 26.700317369650918], [95.93048088038836, 26.69067387010307], [95.93040456032224, 26.69069277025517]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
