
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Toe Cheit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chaungzon</div><div class="name-mm">ချောင်းဆုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Toe Cheit Ward</div><div class="name-mm">တိုးချဲ့ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011003701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.54810807942437, 16.352374647072338], [97.5488777318219, 16.352759474170455], [97.55173308561348, 16.354087213454193], [97.55164138354309, 16.354257656565665], [97.55149833018385, 16.354722580882424], [97.5523552429002, 16.355023056968548], [97.55271216223656, 16.355046851231236], [97.55372343279026, 16.355142030980005], [97.55461573113115, 16.355118235817997], [97.55580546135303, 16.35509444065599], [97.55679345205624, 16.35431976734344], [97.55678758397988, 16.35431536606137], [97.55654012023041, 16.354077418937777], [97.55623554863172, 16.353915616512552], [97.55607374530717, 16.353687187813534], [97.5558167640325, 16.353582492338205], [97.55549315648403, 16.353401653063884], [97.55544556795866, 16.35325888568906], [97.55507044184748, 16.353323359885223], [97.55493160450999, 16.352792510765823], [97.5539405381254, 16.352543224090596], [97.5533801948402, 16.352402278742204], [97.55350908657516, 16.352092674537346], [97.55427487368655, 16.349347051525285], [97.55350392716457, 16.349175729776164], [97.55282816039136, 16.349051998351115], [97.55274128678104, 16.348891788625167], [97.55209528666819, 16.347700464804632], [97.55116253772098, 16.34760528505592], [97.54969679027471, 16.34739589320594], [97.54960565567654, 16.348330676419607], [97.54836429177868, 16.348347678102925], [97.54696369571803, 16.34780300100772], [97.54630843708475, 16.347548179005287], [97.54624838305648, 16.347518718114372], [97.54576301804889, 16.349357637445053], [97.54551317469333, 16.34922200888866], [97.5455988351182, 16.35074962249712], [97.54582726381722, 16.35088525195289], [97.5459200621612, 16.350942358902785], [97.54600334297993, 16.35162032541774], [97.54698899994247, 16.35199762429096], [97.5470874280424, 16.351738276000674], [97.54823067590502, 16.35182296156046], [97.54810807942437, 16.352374647072338]]]]};

            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
