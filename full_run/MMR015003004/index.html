
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Ya Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyai</div><div class="name-mm">မိုင်းရယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Ya Ywar Ma</div><div class="name-mm">ဟိုယရွာမ</div></div>
        <span class="pcode-badge">MMR015003004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.94047599017489, 22.50644959157546], [97.94610291961413, 22.51595786366454], [97.9471043677724, 22.523969449830304], [97.94643673626643, 22.53431774806569], [97.9427647593862, 22.54600131021232], [97.94109567882259, 22.55267763156752], [97.94157271520868, 22.5575944572185], [97.95505137002476, 22.562649842316432], [97.9674724077255, 22.57382877597729], [97.97699520386561, 22.584593676157283], [97.99065834560622, 22.59080419455796], [98.01632849066738, 22.59494454105777], [98.02488949425481, 22.596303430159253], [98.02454969621158, 22.592735559698383], [98.02346214965854, 22.587732846094013], [98.02121153598364, 22.577380020671455], [98.02071637556037, 22.571438095591702], [98.02021008782538, 22.56536264187247], [98.02154535173668, 22.54967328709256], [98.02127545799607, 22.545759828753148], [98.02087772023066, 22.539992621262513], [98.01828580844335, 22.535207551687222], [98.01653811094513, 22.53198103509675], [98.015299932446, 22.531123834597338], [98.01269091735202, 22.529317593931864], [98.00185020432355, 22.525972346146887], [97.98782992920792, 22.522634185019683], [97.97314202168701, 22.521966552614344], [97.96079082713504, 22.51829457573416], [97.9484396316837, 22.511618255278336], [97.94047599017489, 22.50644959157546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
