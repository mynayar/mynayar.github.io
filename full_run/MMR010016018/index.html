
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Saung Yu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Saung Yu</div><div class="name-mm">လက်ဆောင်ယူ</div></div>
        <span class="pcode-badge">MMR010016018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9067335820892, 21.832600488621722], [95.90265006374949, 21.834812394576375], [95.89807967673573, 21.840575055994066], [95.89827839003573, 21.842760894199955], [95.8984771024364, 21.847529992715067], [95.89927195203899, 21.850908105324834], [95.89907323963837, 21.854484929436012], [95.90047200467933, 21.857785162555274], [95.90249010223647, 21.861821357669555], [95.9064273827176, 21.866498946569152], [95.90888138526776, 21.867932623292006], [95.9125113503186, 21.85957182587913], [95.91424739979772, 21.85871694383195], [95.91481186827315, 21.85825899465692], [95.92268140292447, 21.852918573033776], [95.92480636781966, 21.8522424483304], [95.92317560107318, 21.847021975583743], [95.92199837772301, 21.841808558018613], [95.9217264614071, 21.836402094680977], [95.92331616061239, 21.83580595657969], [95.92490585981761, 21.833818832573115], [95.92510457311761, 21.832030420067895], [95.91437409988487, 21.83262655816918], [95.90741916316392, 21.83222913336789], [95.9067335820892, 21.832600488621722]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
