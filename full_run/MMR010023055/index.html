
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Son Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Son Gyi</div><div class="name-mm">သစ်ဆုံကြီး</div></div>
        <span class="pcode-badge">MMR010023055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.82689094076437, 20.48475758089768], [95.82957177481762, 20.485776199811824], [95.83803683603122, 20.48308608025843], [95.84269728924858, 20.481629687560087], [95.84649241839048, 20.48115529877805], [95.84838717572762, 20.478483098216486], [95.85809142627835, 20.47282228591979], [95.86132617526283, 20.469183192750222], [95.87022173744327, 20.46999188022113], [95.8791172987244, 20.460691974754866], [95.88316073697848, 20.444922568621678], [95.87910117388014, 20.449731639303764], [95.87514711115034, 20.452555969182697], [95.87062818334402, 20.453120835158472], [95.8666741197149, 20.453120835158472], [95.86046059308194, 20.452838402170585], [95.85481193332413, 20.452838402170585], [95.8454916420257, 20.451708670218977], [95.84040432829715, 20.451284727108543], [95.84110898938843, 20.457861568156886], [95.83868292697554, 20.462713692982618], [95.8346394887215, 20.466352787051505], [95.83059605226606, 20.47282228591979], [95.82897867732413, 20.48010047315836], [95.82689094076437, 20.48475758089768]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
