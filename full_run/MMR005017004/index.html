
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Gyi</div><div class="name-mm">နတ်ကြီး</div></div>
        <span class="pcode-badge">MMR005017004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93855873689625, 22.464816010750326], [94.93804643359607, 22.460623483786776], [94.93772399966292, 22.45798530008159], [94.93526952227069, 22.454861040005028], [94.93526951957273, 22.451290559711595], [94.93584319800522, 22.449187537374996], [94.9366087198166, 22.446381239802406], [94.93785965969562, 22.444409846737074], [94.93848868420548, 22.443418661642], [94.94397267270074, 22.433215245087524], [94.94854991884375, 22.421497770405836], [94.94955160981903, 22.418933462409427], [94.94910550111803, 22.41067673364438], [94.95189559740396, 22.407576623062766], [94.95312227986938, 22.40621369960263], [94.95424546475647, 22.405176865819726], [94.95680400000464, 22.402815030289446], [94.9468158002091, 22.401710099841296], [94.93831440008955, 22.40067959998362], [94.92514775966146, 22.400342009775954], [94.90928040027029, 22.404055680125566], [94.90185324033484, 22.41249578964903], [94.8954387601907, 22.423636709866344], [94.88092669710943, 22.43273737143261], [94.88748585658709, 22.436672866759466], [94.88256314757126, 22.45115142020194], [94.88223883135703, 22.455571356932637], [94.8924003601885, 22.45638429010296], [94.9069173596485, 22.459085099897493], [94.92582311994107, 22.46043545982866], [94.93493831994755, 22.46414913017827], [94.93855873689625, 22.464816010750326]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
