
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hu Hsun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hu Hsun</div><div class="name-mm">ဟူးဆွန်</div></div>
        <span class="pcode-badge">MMR015012032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.92577459392243, 22.615565680811585], [96.91968585541792, 22.61892498589941], [96.91456504733912, 22.62468589363914], [96.91104449290907, 22.63108690283832], [96.90528358427008, 22.63844806332753], [96.90112292838052, 22.64420897196652], [96.89056126329172, 22.649329779146058], [96.88345746359113, 22.65116301656002], [96.88433036715276, 22.654099145659075], [96.88433036715276, 22.668512575594946], [96.88000633772236, 22.685808692417254], [96.88122558729106, 22.686775683051394], [96.89045607498792, 22.694096413618638], [96.89788353889429, 22.701011639875333], [96.9030678256197, 22.69733943636595], [96.90811252677173, 22.689412050126066], [96.92741831720161, 22.67663615973106], [96.926849986138, 22.665269553746953], [96.92432763601164, 22.658062839228705], [96.92468797187246, 22.647973437823964], [96.92757065785963, 22.64076672330566], [96.92865166544209, 22.632839336166455], [96.92793099372045, 22.62419127820499], [96.92577459392243, 22.615565680811585]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
