
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Nan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Nan</div><div class="name-mm">ရွာနန်း</div></div>
        <span class="pcode-badge">MMR005006061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83410167974876, 22.219558110318587], [95.83522236002398, 22.21995366003341], [95.84364167991964, 22.217427899677887], [95.84995607990925, 22.216165020399444], [95.85563903980989, 22.212692190292387], [95.85711215989829, 22.209008759646565], [95.85921707980447, 22.2005896196153], [95.86242459461943, 22.19453097962105], [95.86235973371481, 22.194517255966616], [95.85946442844067, 22.191346794119283], [95.84864607705487, 22.18658614833214], [95.84059848293367, 22.183044781791295], [95.81114529831694, 22.1747481087383], [95.80425415140803, 22.177572276739227], [95.80157819797552, 22.18609985792216], [95.80041147600889, 22.192400143951545], [95.80343687990813, 22.193629560355987], [95.80954391961626, 22.19722191036294], [95.81249088015005, 22.204799189630933], [95.81249088015005, 22.209479189612978], [95.81249088015005, 22.211113499688338], [95.81627951978408, 22.217427899677887], [95.82301476022309, 22.217427899677887], [95.82806628003488, 22.217427899677887], [95.83410167974876, 22.219558110318587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
