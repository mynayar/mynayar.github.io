
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zoke Thoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bilin</div><div class="name-mm">ဘီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zoke Thoke</div><div class="name-mm">ဇုတ်သုတ်</div></div>
        <span class="pcode-badge">MMR011010009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.16243094663093, 17.14086408770754], [97.15830293972897, 17.142266024657374], [97.15362300000152, 17.143668000278012], [97.14784297087647, 17.142826036992062], [97.14591596385071, 17.14703201511543], [97.14564096375955, 17.15123801482258], [97.14371396392835, 17.15488301473937], [97.14233796432563, 17.158809015024076], [97.14123696391482, 17.165538015067398], [97.14123696391482, 17.16862301524003], [97.14949400024796, 17.170865999965997], [97.15472400041233, 17.173390000348263], [97.16133000017942, 17.177314999687553], [97.16408300033027, 17.181240999972204], [97.17178997982376, 17.187690007787694], [97.17155909237829, 17.17829537403236], [97.17634299913016, 17.16992353564268], [97.16597786558611, 17.167531582716435], [97.16199127707586, 17.16274767506519], [97.16199127707586, 17.1495919299237], [97.16243094663093, 17.14086408770754]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
