
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lemyethna</div><div class="name-mm">လေးမျက်နှာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Se</div><div class="name-mm">ယင်းဆယ်</div></div>
        <span class="pcode-badge">MMR017010021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1030574834162, 17.52233503913078], [95.10027849555621, 17.510799952355967], [95.09994288025979, 17.510430869688946], [95.09885748038846, 17.508368250294552], [95.09820623992607, 17.50554585036076], [95.09864040023433, 17.503483319999248], [95.09907455964327, 17.500335299834262], [95.09690592007223, 17.499614670380765], [95.09457095988193, 17.499975029623954], [95.09222159974706, 17.499833100417277], [95.08963211972662, 17.499583620387796], [95.08827203992274, 17.49957786023009], [95.08664519961633, 17.50098663022885], [95.08610232026592, 17.50304915969099], [95.08610232026592, 17.50532877020663], [95.08512527970794, 17.508042630063358], [95.08360572042773, 17.512276229964073], [95.08318344016368, 17.515569239728677], [95.083062840178, 17.516509829864788], [95.083062840178, 17.520526349611373], [95.08251995992828, 17.525845530147137], [95.08176000042374, 17.528667930080985], [95.0806745996531, 17.529102180321388], [95.08203144009894, 17.530079130047852], [95.08811040027479, 17.530621920365377], [95.0935381199883, 17.530404840211247], [95.09503464043638, 17.53026362956291], [95.09842820879487, 17.52994350059214], [95.09919085817165, 17.528343177695547], [95.09966675062009, 17.526974987805488], [95.09948829095191, 17.52489295924272], [95.1003805892928, 17.523881688689016], [95.1030574834162, 17.52233503913078]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
