
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Hla</div><div class="name-mm">ညောင်ပင်လှ</div></div>
        <span class="pcode-badge">MMR009018025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87537676222786, 21.36083674402056], [94.87316228511145, 21.36784925443959], [94.86550324487888, 21.376465674251506], [94.86119503362397, 21.383646025144003], [94.86131850604426, 21.385251155816263], [94.8616737238633, 21.3898689946584], [94.87459835493019, 21.39082637513718], [94.88130001558329, 21.38268864466528], [94.88704429575768, 21.388432924839663], [94.88868934014101, 21.39037706844698], [94.88897106356382, 21.390118585304492], [94.89050420440554, 21.388711920618675], [94.89099545097935, 21.38737745440602], [94.89087381677331, 21.386039475441464], [94.89470333688956, 21.3779017440703], [94.90577158379159, 21.372367621068918], [94.90571320789826, 21.371200084316513], [94.91050010759398, 21.363541043184625], [94.91116395205478, 21.360885668039202], [94.9042771371802, 21.359232832829036], [94.88704429575768, 21.358754142589646], [94.87603442474898, 21.358754142589646], [94.87537676222786, 21.36083674402056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
