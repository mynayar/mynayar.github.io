
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Be Dan (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pan Be Dan (South) Ward</div><div class="name-mm">ပန်းဘဲတန်း(တောင်)ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007009701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.43908547581412, 18.945938524043697], [96.43908547581412, 18.945938524043697], [96.43910769716257, 18.94573184814635], [96.43913177021506, 18.94539731473435], [96.43914658474716, 18.94486836408379], [96.43915028905468, 18.944495295621437], [96.43913917793077, 18.943927809021204], [96.43913177021506, 18.943460157060656], [96.43913177021506, 18.943460157060656], [96.4378077379368, 18.94346303938778], [96.43591333583186, 18.94346716277937], [96.43404486657738, 18.943512702649173], [96.43404486657738, 18.943512702649173], [96.43400042298117, 18.943978602730397], [96.43400042298117, 18.944497047500818], [96.43398931185732, 18.945082046599225], [96.43396338710068, 18.945572463098756], [96.43396507376721, 18.94588917355237], [96.43420226951918, 18.945894736952596], [96.43448929894203, 18.9458964879326], [96.43460040748289, 18.945798405172297], [96.43470040489984, 18.945700321512675], [96.43485225272934, 18.945661789160283], [96.43516705951225, 18.945658286300898], [96.43602629607676, 18.945682807215803], [96.43681516428848, 18.94572484242758], [96.43763366156429, 18.94576337567929], [96.43844845543191, 18.945868464158366], [96.43908547581412, 18.945938524043697]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
