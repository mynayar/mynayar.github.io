
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Pin</div><div class="name-mm">သရက်ပင်</div></div>
        <span class="pcode-badge">MMR010013083</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32199723208663, 21.615694438747425], [96.32317445543686, 21.604594902632698], [96.32421153293598, 21.593570110971882], [96.31015959538905, 21.59297215624008], [96.30089129479745, 21.588487495301706], [96.30618192815353, 21.57818468297677], [96.30186297179876, 21.57914445115557], [96.29020285317921, 21.581835247898425], [96.28570835365764, 21.58613433283324], [96.28617600112159, 21.588132459145697], [96.2824761551505, 21.597045722682026], [96.27964413876606, 21.60176575058898], [96.28432607768639, 21.607136211367106], [96.28617600112159, 21.621094719245946], [96.28314885433622, 21.634212352018494], [96.27928083424314, 21.646489112382653], [96.28752139859375, 21.644956852876533], [96.29390595469613, 21.64065955579389], [96.29626648800809, 21.639070735226312], [96.30910847137892, 21.625020095401112], [96.30935372009816, 21.62475176468223], [96.30945846413687, 21.62463716227529], [96.31056134592944, 21.623430479832848], [96.32199723208663, 21.615694438747425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
