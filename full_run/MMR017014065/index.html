
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Daing Kan Ba Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Daing Kan Ba Lar</div><div class="name-mm">လင်းဒိုင်းကမ္ဘလာ</div></div>
        <span class="pcode-badge">MMR017014065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0199101995961, 16.5308131802841], [95.02040519994006, 16.524710100290918], [95.02073495975065, 16.51893695997279], [95.01998656372899, 16.518396072620703], [95.01908046978792, 16.5177412132864], [95.01850201775397, 16.518364161077216], [95.01847075372234, 16.51842460541127], [95.01743125974491, 16.52043429160932], [95.0159083720738, 16.522315663437155], [95.01440515887106, 16.522236547378782], [95.01314823130588, 16.522371173191118], [95.0121012675595, 16.521609745993032], [95.01164258363838, 16.52057230696647], [95.00885855957495, 16.521411149604944], [95.01067332041748, 16.524545129554156], [95.01199272028788, 16.529823450292042], [95.01232248009842, 16.536421349865464], [95.01215760019318, 16.54631820012486], [95.018095800281, 16.544008890398004], [95.01892056043556, 16.53510177013061], [95.0199101995961, 16.5308131802841]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
