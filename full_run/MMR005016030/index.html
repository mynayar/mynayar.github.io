
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Swei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Swei</div><div class="name-mm">ဆင်စွယ်</div></div>
        <span class="pcode-badge">MMR005016030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7267938800336, 22.124734289855667], [94.72624704006893, 22.126785569698313], [94.7200928399127, 22.130375399804905], [94.71855456034473, 22.138580789871583], [94.70983643979991, 22.141144980056822], [94.70368223964368, 22.143782339983034], [94.70368223964368, 22.14698336978671], [94.71291335956397, 22.150888739623667], [94.71906719999134, 22.156529940404482], [94.72419576022622, 22.148324640270005], [94.72778568026501, 22.138067970360567], [94.73188823995037, 22.135503780175384], [94.74265764033788, 22.13345241040048], [94.74829884021938, 22.13345241040048], [94.74927731969262, 22.13491995019558], [94.75855560006096, 22.134478140254032], [94.7682993596278, 22.134478140254032], [94.77496620032991, 22.128836940372537], [94.77298332022411, 22.126633919719666], [94.77035064036983, 22.123708560002115], [94.7682993596278, 22.117554629642484], [94.77394056040862, 22.110374970328678], [94.77650483962668, 22.104733770447183], [94.77898272007656, 22.099571009894248], [94.77137628029118, 22.096528470312705], [94.76348940041555, 22.096528470312705], [94.7631711600211, 22.098066929745073], [94.75650432021826, 22.102169580261943], [94.74676020002329, 22.11550325986758], [94.73393951979307, 22.124734289855667], [94.7267938800336, 22.124734289855667]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
