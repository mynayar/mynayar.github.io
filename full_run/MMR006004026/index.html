
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yebyu</div><div class="name-mm">ရေဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pauk</div><div class="name-mm">ကံပေါက်</div></div>
        <span class="pcode-badge">MMR006004026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.03752883968428, 14.605370640342812], [98.04853763960045, 14.599254690151895], [98.06484636017143, 14.594362020291044], [98.07381631067426, 14.593954414264829], [98.08523243333019, 14.594362312570695], [98.08400951992348, 14.588653950419541], [98.08197083958265, 14.580906839579029], [98.08115562033566, 14.572344284661085], [98.08115579660279, 14.564189476063518], [98.07993269973434, 14.554811430303289], [98.07911747958809, 14.5438024496234], [98.07789455988609, 14.534016660240752], [98.07544800012516, 14.529939209626889], [98.07055560006097, 14.526677249855254], [98.06607071339278, 14.525046203419606], [98.0599546795649, 14.525861580047945], [98.05546980009126, 14.527900260388776], [98.04853853982183, 14.531569830683168], [98.03875320010019, 14.538093480429836], [98.03059847963618, 14.542986240222831], [98.01510515997523, 14.546248020130065], [98.01632807967718, 14.557664700365706], [98.01714347968789, 14.566634999805444], [98.01999720031063, 14.576420790087468], [98.02488996010362, 14.584575690415818], [98.02855943956655, 14.590284120016179], [98.03385971995016, 14.598031229957371], [98.03752883968428, 14.605370640342812]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
