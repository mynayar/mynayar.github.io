
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwin Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kwin Ka Lay</div><div class="name-mm">ကွင်းကလေး</div></div>
        <span class="pcode-badge">MMR017015042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14286423989279, 16.79983136972197], [95.14512000038775, 16.79416722004123], [95.14681164044492, 16.790084100101183], [95.15019959973182, 16.787531879892413], [95.14971575997441, 16.787667239551524], [95.14494612006746, 16.786093139986463], [95.14111175979991, 16.784470080429912], [95.13730331979241, 16.783587000140017], [95.13544644010119, 16.78269059999127], [95.13441576037911, 16.780823549866966], [95.13242495994399, 16.776998010150123], [95.13077615999185, 16.7809856400753], [95.12985023959692, 16.78268691007287], [95.12434944007464, 16.79040341968215], [95.12286624038472, 16.79300621956145], [95.12117675959985, 16.797821220373066], [95.1206720402825, 16.800282539807426], [95.12051651962173, 16.80329403029532], [95.1207973203401, 16.806700260208913], [95.1208016397839, 16.80976646994668], [95.12740440019297, 16.809191459618205], [95.1329923197398, 16.8083172898111], [95.13327779963083, 16.803524610172644], [95.13407735988233, 16.799807070040288], [95.13760716024228, 16.799772959654433], [95.14286423989279, 16.79983136972197]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
