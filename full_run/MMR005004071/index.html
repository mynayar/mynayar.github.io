
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sint Ton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sint Ton</div><div class="name-mm">စဉ့်တုံ</div></div>
        <span class="pcode-badge">MMR005004071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61324270568639, 22.68180980208075], [95.61861064566483, 22.67742598482141], [95.62304417924554, 22.675559232372734], [95.63144456121756, 22.678126017102045], [95.6365460770399, 22.680676775013183], [95.6386960736649, 22.680688078592027], [95.63973408016375, 22.6780191902335], [95.64239123956412, 22.675583430431004], [95.64349824025163, 22.671597779913668], [95.64349824025163, 22.666947749838812], [95.64017688025888, 22.6605263404183], [95.63969844003105, 22.660137630047643], [95.63309136017818, 22.654769129791532], [95.62290551997381, 22.652997750445877], [95.61936276038313, 22.654326329696403], [95.61537684006919, 22.660747740016234], [95.610283919967, 22.66372205972533], [95.610283919967, 22.668741089729565], [95.60998872020332, 22.676122080269863], [95.61205548007638, 22.681141110274098], [95.61324270568639, 22.68180980208075]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
