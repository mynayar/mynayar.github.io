
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kyin</div><div class="name-mm">သရက်ကျင်း</div></div>
        <span class="pcode-badge">MMR005010017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2291596616891, 22.766330013419406], [95.22131887656496, 22.764678571259083], [95.22119195974119, 22.764651839810597], [95.2144775997615, 22.7614745700954], [95.2064819999444, 22.75909424989976], [95.18951412038041, 22.75909424989976], [95.17633056010732, 22.75909424989976], [95.17531499978747, 22.766740650160955], [95.17529304014175, 22.766906700084178], [95.17269043361665, 22.768196765868083], [95.17525721924534, 22.771463580180125], [95.1793375108175, 22.77363770111907], [95.17948063522317, 22.773622634776814], [95.18669107023675, 22.77286364384213], [95.19976775237996, 22.772686930657358], [95.20395852026957, 22.772630299448792], [95.20969507796553, 22.772161476570943], [95.21323269523276, 22.770431165665798], [95.21502955956657, 22.7695522879078], [95.21605138096652, 22.769052496875304], [95.2291596616891, 22.766330013419406]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
