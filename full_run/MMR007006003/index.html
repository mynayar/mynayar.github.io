
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Say Yoe Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Say Yoe Khin</div><div class="name-mm">ဆေးရိုးခင်</div></div>
        <span class="pcode-badge">MMR007006003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60394248525756, 18.0696608283846], [96.6085646498388, 18.06041649832281], [96.61395717638266, 18.056051119863355], [96.61703861883723, 18.05476718565717], [96.62114721027558, 18.055794332842254], [96.62268793060355, 18.056307906884456], [96.63098937366073, 18.041195025629975], [96.63250271772631, 18.0388126585774], [96.63049182913466, 18.035840040385608], [96.62799372922728, 18.036098465072143], [96.62795727161085, 18.03610223592949], [96.61977346437396, 18.030927457736027], [96.61898018768557, 18.02819506824784], [96.61685929312193, 18.027616981338667], [96.61843366787951, 18.024005179895198], [96.62032062269861, 18.020727836320646], [96.61693833543592, 18.02154685700191], [96.609078223881, 18.024466327059372], [96.59707045973397, 18.028059892050408], [96.59829317259192, 18.032426722015657], [96.60009068084031, 18.043211774204053], [96.60086104190361, 18.052199316345423], [96.60034746786141, 18.058362203053264], [96.59521172923797, 18.067092959072852], [96.59829317259192, 18.068376893279037], [96.60150847283779, 18.069107643702864], [96.60394248525756, 18.0696608283846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
