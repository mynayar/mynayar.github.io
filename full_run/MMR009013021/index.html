
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Te Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Te Gyi</div><div class="name-mm">မင်းတဲကြီး</div></div>
        <span class="pcode-badge">MMR009013021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92609987460958, 19.7640541159048], [94.90988671060325, 19.770179088993814], [94.90928480694834, 19.771898814878455], [94.90705483001648, 19.77827017882572], [94.91110037538209, 19.786765824183476], [94.9195960189412, 19.79566602326838], [94.918382355961, 19.80213889459435], [94.9094821568761, 19.817107411278073], [94.90854856976074, 19.822397739763915], [94.9085019893754, 19.822661697079695], [94.91676413835438, 19.822366619623836], [94.9337554272712, 19.823580282603984], [94.94872394395492, 19.82398483812983], [94.95284939228566, 19.825635016742694], [94.95449221714216, 19.817868938300933], [94.96013803414303, 19.806577303399877], [94.95901449941965, 19.79866525060089], [94.95721958841335, 19.78393394179801], [94.9503421615616, 19.770988198246812], [94.9435871657152, 19.76548412699094], [94.93941919024348, 19.762087999161906], [94.9280916642989, 19.763301662142055], [94.92609987460958, 19.7640541159048]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
