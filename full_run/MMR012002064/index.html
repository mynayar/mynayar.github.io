
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Me Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Me Khin</div><div class="name-mm">အမဲခင်</div></div>
        <span class="pcode-badge">MMR012002064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.9463780223279, 20.352107180701864], [92.94500788900291, 20.353910003044234], [92.94230728515316, 20.360226287113505], [92.93854758390393, 20.366692998982785], [92.93719403407749, 20.372257407553377], [92.93734437284456, 20.37481403983611], [92.93990083335683, 20.378122660932092], [92.94290847024973, 20.379927388038595], [92.94516418757723, 20.38188249438167], [92.94525926390395, 20.382421337574726], [92.94620030100316, 20.382181155635863], [92.94908200133335, 20.380103244169447], [92.95014841291896, 20.37868136205526], [92.95116404428529, 20.37548212639905], [92.95151951391449, 20.370150065772975], [92.95212889273427, 20.367255520426], [92.95299217804666, 20.36593519964981], [92.95503875533433, 20.36466744964315], [92.95480947407805, 20.363855720665015], [92.95288295538415, 20.35703484138486], [92.9521115493086, 20.35622602531089], [92.9463780223279, 20.352107180701864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
