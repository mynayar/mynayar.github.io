
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Man Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Man Taw</div><div class="name-mm">သမန်းတော</div></div>
        <span class="pcode-badge">MMR009001051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.96569390814739, 20.21484919213657], [94.96541814003518, 20.214661168178395], [94.95696193984173, 20.222588855691185], [94.9516768148332, 20.22549567498544], [94.94348487142975, 20.226288442657562], [94.93608569569835, 20.22549567498544], [94.92657247104279, 20.223117368371902], [94.91573796423575, 20.22364588105262], [94.90992051072305, 20.224027893272705], [94.91035106295124, 20.22458038097983], [94.9109401998304, 20.22533681604125], [94.91139038156092, 20.228051773970265], [94.91233860873984, 20.228962351031726], [94.91220240191939, 20.242509313853816], [94.91193886998292, 20.243231625938847], [94.92366565174848, 20.24663617501949], [94.94480615178253, 20.246107663238092], [94.95903497608333, 20.246520092328467], [94.9659466527159, 20.234744643750332], [94.96647516539662, 20.227609724808985], [94.96569390814739, 20.21484919213657]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
