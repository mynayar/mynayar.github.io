
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mae Sum Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsat</div><div class="name-mm">မိုင်းဆတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mae Sum Taung</div><div class="name-mm">မယ်ဆွမ်တောင်</div></div>
        <span class="pcode-badge">MMR016006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.21615896066754, 20.438484212376522], [99.22997764015605, 20.443858142739145], [99.2468671357098, 20.46228304812422], [99.27680760718539, 20.477637134746033], [99.2875554688099, 20.479940249043295], [99.29676792060309, 20.47149549991741], [99.3021285239123, 20.463605205316014], [99.2969465187669, 20.453241195924477], [99.28917351194809, 20.44330902119441], [99.2902938279978, 20.429491792312433], [99.28371694737928, 20.430807167716694], [99.27143367682277, 20.42466553288807], [99.26068581519826, 20.42543323735407], [99.24993795357375, 20.417756193593505], [99.24533172767713, 20.402402106072373], [99.2368869785513, 20.395492766777807], [99.231513049088, 20.40009899267443], [99.21615896066754, 20.438484212376522]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
