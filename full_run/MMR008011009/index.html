
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Sa Poe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Sa Poe</div><div class="name-mm">ဝက်စပိုး</div></div>
        <span class="pcode-badge">MMR008011009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61204189491758, 18.37194801418957], [95.60891568241288, 18.36313777518825], [95.60749467623839, 18.358306353655337], [95.60607366916457, 18.35518014115064], [95.60408426087997, 18.350917121727832], [95.60294745576056, 18.348643512388264], [95.6021723615653, 18.345930683154563], [95.59783183317262, 18.34551729898419], [95.5961266259431, 18.34097007940568], [95.59157940636459, 18.341538480616464], [95.58538420072034, 18.342202253131518], [95.58703218588676, 18.344948895974824], [95.58958999718067, 18.34551729898419], [95.59243201042898, 18.350064517663384], [95.58352976178912, 18.36430811512747], [95.58276741998048, 18.36756046834097], [95.58366914591443, 18.367683430845716], [95.58857963764024, 18.36835304355816], [95.58884382967904, 18.371259153287326], [95.59122155533055, 18.37337268690004], [95.59571281459478, 18.37442945415603], [95.59914730660296, 18.37944909659859], [95.60019123064086, 18.382928841592843], [95.60524036455126, 18.3775796263987], [95.60777887729341, 18.37535842864861], [95.61204189491758, 18.37194801418957]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
