
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Chaung</div><div class="name-mm">သဲချောင်း</div></div>
        <span class="pcode-badge">MMR008012053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58003021822003, 18.453145301614427], [95.60022683569997, 18.465286127652746], [95.60091583689643, 18.48131716095827], [95.60233068541288, 18.48267901332588], [95.60564241816314, 18.482694355759975], [95.60753390196805, 18.483606198167536], [95.61236680198635, 18.47784471306312], [95.61362266115697, 18.47030956163701], [95.61152956283911, 18.46109993191635], [95.61152956283911, 18.45398339961423], [95.61445990030421, 18.44770410825805], [95.61194818286242, 18.441424815103176], [95.60525026968423, 18.442262054250477], [95.59604064086295, 18.438494477638073], [95.5934765963679, 18.435250176954128], [95.58054496317959, 18.435145889771036], [95.57738786525783, 18.439147481671], [95.58641239201836, 18.44770410825805], [95.58688705239564, 18.44782793231326], [95.58660935074101, 18.449271981816537], [95.58444294958252, 18.45043850503305], [95.58003021822003, 18.453145301614427]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
