
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hmoke Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hmoke Shey</div><div class="name-mm">မှုတ်ရှည်</div></div>
        <span class="pcode-badge">MMR008001033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26767610506823, 18.797909448862015], [95.26431923894177, 18.79796580128078], [95.26180359326128, 18.801396226554687], [95.26043142297186, 18.80345448333776], [95.26043142297186, 18.80757099420606], [95.26034519597408, 18.80987479108876], [95.26021006923935, 18.813388096083827], [95.26048032270876, 18.8173067821823], [95.26021006923935, 18.82027957843985], [95.26021006923935, 18.823657755800866], [95.26366251891017, 18.821850023160096], [95.26785328230318, 18.823246942792252], [95.27399973390067, 18.822967559405413], [95.28266064317421, 18.821850023160096], [95.28768955762706, 18.819335564584662], [95.29107310304136, 18.817486528780307], [95.28725318498658, 18.816531550390778], [95.28582071605325, 18.812711632336004], [95.2848657367644, 18.807459245347957], [95.28032958424296, 18.80793673409306], [95.2781808799437, 18.80554928587088], [95.27436096188893, 18.802923091927198], [95.26982480936749, 18.79838693940576], [95.26767610506823, 18.797909448862015]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
