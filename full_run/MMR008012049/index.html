
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Nge Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Nge Pyin</div><div class="name-mm">သက်ငယ်ပြင်</div></div>
        <span class="pcode-badge">MMR008012049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60697707593135, 18.39631856065313], [95.5997558886234, 18.392550984940044], [95.59598831291038, 18.387841515973207], [95.59567434879222, 18.38407394026018], [95.59253470221478, 18.38062032866526], [95.59033694979047, 18.37999240042899], [95.5824878342462, 18.379364470394023], [95.57622703474993, 18.375701160280357], [95.56690733790339, 18.38062032866526], [95.56313976308968, 18.386036218696574], [95.5651432610527, 18.390901857634674], [95.57495268192082, 18.3956906324168], [95.58123197507564, 18.401028031418548], [95.5881391973661, 18.40510957124974], [95.59630227792786, 18.40699335865662], [95.60195364194709, 18.413272651811496], [95.60446535938888, 18.407935252809693], [95.6094887933732, 18.402283888790464], [95.61011672160947, 18.399144243112403], [95.60697707593135, 18.39631856065313]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
