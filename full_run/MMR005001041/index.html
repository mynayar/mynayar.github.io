
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Laing Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Laing Kyun</div><div class="name-mm">တလိုင်းကျွန်း</div></div>
        <span class="pcode-badge">MMR005001041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65596397335872, 22.120411892694733], [95.66128800034102, 22.12110558025836], [95.66948412019605, 22.1213157302368], [95.6799007201422, 22.11967097993181], [95.68445219980924, 22.119077340147157], [95.6831900399884, 22.117752180119055], [95.68154519975121, 22.109254379985714], [95.68154519975121, 22.10297454004302], [95.68154519975121, 22.10212718981802], [95.68138859990404, 22.10236217997067], [95.67935244036289, 22.101853140310254], [95.67304739961787, 22.101853140310254], [95.66838755973816, 22.103497799783668], [95.66345339965471, 22.1032237502759], [95.6587932000462, 22.10103072019166], [95.65594163959503, 22.09708251024972], [95.655127146101, 22.094827407159187], [95.65315202714442, 22.09575687537955], [95.64444051931457, 22.10384612969517], [95.64132926793144, 22.11380213825811], [95.64226264370609, 22.118469016232154], [95.64558989605689, 22.116762248678867], [95.64587058795735, 22.116763760439255], [95.6464186276176, 22.11676671021553], [95.65673651977465, 22.116823200230556], [95.65740088943954, 22.117059089705265], [95.65596397335872, 22.120411892694733]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
