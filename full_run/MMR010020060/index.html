
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Pauk Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Pauk Kan</div><div class="name-mm">စီပေါက္ကံ</div></div>
        <span class="pcode-badge">MMR010020060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07949762271716, 20.797024245772377], [95.07676727109276, 20.799481563223594], [95.08125839186135, 20.802176236044488], [95.08435176562153, 20.80251994434002], [95.09225705641808, 20.80458219411304], [95.09741267995128, 20.80595702729505], [95.10222459608832, 20.808019277068013], [95.10841134360868, 20.810425234237243], [95.11197610241527, 20.810425234237243], [95.11631663440522, 20.810425234237243], [95.12044113305188, 20.80767556787322], [95.12387821600691, 20.8035510692265], [95.12869013124464, 20.798051737397827], [95.12800271465363, 20.794958362738328], [95.12903384043943, 20.786021947954566], [95.12284709112043, 20.78739678113658], [95.1142543846322, 20.790146446601284], [95.10841134360868, 20.789459030909597], [95.10566167814397, 20.789459030909597], [95.09775638824681, 20.789459030909597], [95.0919133481226, 20.79049015579608], [95.08435176562153, 20.792208697273622], [95.07988355867934, 20.796676904215815], [95.07949762271716, 20.797024245772377]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
