
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Lin Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Lin Swea</div><div class="name-mm">ရွှေလင်းစွဲ</div></div>
        <span class="pcode-badge">MMR009020027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89494694704405, 21.70786501186086], [94.89507473980746, 21.70788050178379], [94.90218522506814, 21.713698172033048], [94.90897250567667, 21.71886943387733], [94.91036297986767, 21.72498751995812], [94.91996143777021, 21.722747879810868], [94.9345056120444, 21.722424676957303], [94.94614095074434, 21.72630312289084], [94.95152619817554, 21.728867527114744], [94.95197027440872, 21.7279793746485], [94.9567510083524, 21.72601083782996], [94.96000512063989, 21.72480561138991], [94.96153174229613, 21.71869912656348], [94.96378149891711, 21.70913765867607], [94.96518759703002, 21.69479545774425], [94.96518759703002, 21.67837026057913], [94.96197794092927, 21.67491370820113], [94.95389784441005, 21.67071205671607], [94.93967687388869, 21.664571183613305], [94.93819865644292, 21.665082875374424], [94.93127357271726, 21.667480019187565], [94.92354583237432, 21.672059421005542], [94.922547067793, 21.672651281031847], [94.9193150302645, 21.68331700757392], [94.91479017592593, 21.688165065665316], [94.89992279789885, 21.70335564834454], [94.89494694704405, 21.70786501186086]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
