
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Gar Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Gar Aing</div><div class="name-mm">နဂါးအိုင်</div></div>
        <span class="pcode-badge">MMR009013040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87458119496625, 19.83006630381692], [94.87277783033267, 19.8279520147737], [94.8608686840426, 19.823100140858855], [94.84940061744459, 19.822659061166803], [94.8304341987793, 19.8208947432978], [94.81911332781789, 19.82668096695312], [94.81058562162917, 19.831039571718918], [94.80581647365142, 19.83179830005156], [94.80686538083273, 19.82985032892958], [94.80164274881389, 19.828171625620087], [94.7917559853505, 19.82499373717127], [94.77286924032325, 19.821756008732848], [94.76166161289319, 19.81951448360661], [94.7566806008291, 19.818518281193747], [94.75024883301728, 19.8259395532678], [94.74966552464429, 19.82661260139048], [94.73955908918066, 19.841165867810616], [94.75074476685757, 19.843340861091917], [94.76369567791329, 19.86924268320331], [94.77249435433106, 19.878984073955905], [94.77448810364314, 19.876797381394113], [94.78318812083518, 19.876797381394113], [94.78635977158626, 19.876797381394113], [94.80146916796781, 19.864386091445], [94.81280121570359, 19.863306849231776], [94.82629174786592, 19.873020031849023], [94.83238157904668, 19.875977949722653], [94.83352175572452, 19.873824282065016], [94.83793255084663, 19.857063261860105], [94.85204709379838, 19.839420082271033], [94.87458119496625, 19.83006630381692]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
