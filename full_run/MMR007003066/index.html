
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Kan Ah Thin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Kan Ah Thin</div><div class="name-mm">သပြေကန်အသင်း</div></div>
        <span class="pcode-badge">MMR007003066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74699343879621, 16.963114770630227], [96.74791424384733, 16.963114770630227], [96.75099170140595, 16.96174701331404], [96.75543691718002, 16.9614050730857], [96.7612453783716, 16.963333322075187], [96.76532895067061, 16.962416685381754], [96.76726658858223, 16.957509479778707], [96.76739135692566, 16.95751907824291], [96.76989809392194, 16.95545549657396], [96.77126484040014, 16.95120339761877], [96.76734887475084, 16.94728743286879], [96.76529466671553, 16.947296063662463], [96.76473767610292, 16.945162939218335], [96.76449879638238, 16.944724991864916], [96.76519041280739, 16.94421780570724], [96.76520267866073, 16.941706888662054], [96.76333711871314, 16.94259525067031], [96.76268603833006, 16.941401602102303], [96.76016591582442, 16.938617891002934], [96.76014519634379, 16.938631199170572], [96.74269194187968, 16.94984096069186], [96.72833814059277, 16.952711720769344], [96.72876562163617, 16.95695985731163], [96.73115919963743, 16.959011495084496], [96.73321083830962, 16.962088951743794], [96.74004963118557, 16.963114770630227], [96.74699343879621, 16.963114770630227]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
