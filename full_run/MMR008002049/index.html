
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Gaung</div><div class="name-mm">ဆင်ခေါင်း</div></div>
        <span class="pcode-badge">MMR008002049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.76567524921342, 19.13146693635008], [95.77859972739554, 19.129117031226087], [95.78647730918055, 19.13292876455091], [95.79681149165708, 19.137929174991484], [95.80033634934313, 19.13910412665416], [95.80364034342716, 19.136400859911816], [95.80679858888385, 19.13381684057481], [95.80812040793052, 19.133890274716464], [95.81737316194193, 19.13440431730544], [95.82324792385265, 19.130879458720074], [95.81561073264925, 19.11795498143732], [95.81737316194193, 19.110317790233864], [95.81502325591856, 19.090343595780382], [95.8032737311978, 19.07859407105957], [95.78845279865777, 19.082834844852243], [95.77608675809745, 19.085539917433266], [95.76352749819557, 19.08727889060839], [95.75753769680733, 19.086892451925166], [95.75609496121353, 19.086748179085248], [95.75637838075772, 19.093655130679792], [95.75792413638982, 19.0994517118271], [95.75579872273295, 19.105827951898505], [95.74845638595349, 19.111817753286743], [95.7420801467814, 19.11703467640922], [95.73860491098793, 19.123792079740724], [95.74961570290242, 19.12688886462945], [95.76140208543796, 19.13036681367754], [95.76567524921342, 19.13146693635008]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
