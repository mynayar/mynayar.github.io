
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Pyin</div><div class="name-mm">ရေတွင်းပြင်</div></div>
        <span class="pcode-badge">MMR012009096</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.26256094173414, 21.05159309894242], [92.26278564993783, 21.052513314937585], [92.26483280189234, 21.05247765861708], [92.27383905712685, 21.053067934937303], [92.27746153082506, 21.0562179129264], [92.28706896396159, 21.059682888354644], [92.2879321899187, 21.059846200741617], [92.29342715284088, 21.05930208302476], [92.29394237623973, 21.05914054140294], [92.29468249040468, 21.058908488436032], [92.29516590208476, 21.058576024364072], [92.2924850428505, 21.055761915280243], [92.29032758904708, 21.053111722927724], [92.2888294372288, 21.050460924432173], [92.28770515337021, 21.048489952249554], [92.28748817483944, 21.048109569601024], [92.28548942799478, 21.045225661435154], [92.28303382375202, 21.04314125416562], [92.28132061165695, 21.042598736342654], [92.28001724939662, 21.04264485537584], [92.27538880844679, 21.04291474641849], [92.27352549770359, 21.043112701589962], [92.27195505298334, 21.043855091939008], [92.27048306514138, 21.044734005669852], [92.27025091504777, 21.044822914446], [92.26770057712002, 21.046482017031508], [92.26558761457682, 21.048823405575774], [92.26387440338107, 21.050422405569634], [92.26256094173414, 21.05159309894242]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
