
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR001015701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.51143689739496, 26.596991749769472], [97.51346773564757, 26.59851476784229], [97.51799231029696, 26.60144287588804], [97.52897526459685, 26.602767668093463], [97.53503935358339, 26.59602304502755], [97.55069707740824, 26.58686821009985], [97.56186094832418, 26.585178151050854], [97.56123984144557, 26.583314553423975], [97.56279175383645, 26.580793003694225], [97.56992567902694, 26.56920006712943], [97.57426859691827, 26.538799637393424], [97.56168847184557, 26.521381000532813], [97.5502572585657, 26.522624326751327], [97.54190757137735, 26.523188255633556], [97.53381740424987, 26.524496958967518], [97.52774977822975, 26.52497285141601], [97.51882622375126, 26.526299452158014], [97.51768156125513, 26.52617060988581], [97.51846654619419, 26.533631462921733], [97.51436713143801, 26.542665064741016], [97.51348742540443, 26.54910480864004], [97.51844358020713, 26.55608304139929], [97.51939530305083, 26.56469148782196], [97.51774040029932, 26.569451243280298], [97.5169128936152, 26.57183111111692], [97.51371338816239, 26.57538938041563], [97.51456875404483, 26.576464215051544], [97.51436992743027, 26.59186781115062], [97.51143689739496, 26.596991749769472]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
