
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Man Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Man Gyi</div><div class="name-mm">တမံကြီး</div></div>
        <span class="pcode-badge">MMR007007017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58142462134924, 17.675202174640674], [96.58072888872726, 17.66802980972801], [96.57881738331565, 17.661339538988557], [96.57690587700466, 17.656082898207217], [96.57595012429886, 17.652259885585295], [96.5741889612516, 17.64979908955638], [96.5687819763072, 17.650826255627237], [96.56280852009718, 17.652976701013984], [96.55731294024008, 17.65512714460209], [96.55396780487035, 17.65703865091308], [96.5475164723074, 17.660861662635682], [96.5441713360384, 17.663489984375303], [96.53750383073725, 17.664655755758588], [96.53891469525706, 17.667312996097962], [96.5417819542738, 17.670180255114758], [96.54775540958457, 17.669224502408895], [96.55038373132419, 17.67161388417344], [96.55095416860007, 17.674351987054592], [96.55157842220649, 17.67734840220703], [96.55229523673586, 17.680454599400264], [96.55564037210553, 17.68260504388769], [96.56161382921488, 17.683082920240622], [96.56765809894216, 17.680620439781535], [96.57308286528206, 17.677826278559962], [96.57666693882823, 17.676153711324787], [96.58142462134924, 17.675202174640674]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
