
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Li Chan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawthoung</div><div class="name-mm">ကော့သောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Li Chan</div><div class="name-mm">နာလိချမ်း</div></div>
        <span class="pcode-badge">MMR006009013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.80697388143955, 10.488333644382237], [98.80493904030453, 10.49038470029376], [98.79253163992331, 10.498731479973856], [98.7835082400133, 10.505499210220421], [98.77538700040981, 10.508206319765918], [98.78418468037876, 10.512492479644266], [98.79027588032767, 10.512718109653065], [98.79975036039087, 10.511138970287277], [98.81057880037139, 10.510011000107625], [98.81633194336456, 10.508210250702575], [98.81905078456612, 10.508334352648319], [98.81917177305894, 10.50105853602264], [98.8183775188075, 10.499889346316309], [98.81688981441346, 10.496884393899734], [98.81612603458888, 10.495341674378835], [98.81268420411277, 10.490144876285058], [98.81149503686652, 10.490008316930357], [98.81043659057627, 10.489886772656462], [98.80852304190489, 10.489028489373311], [98.80697388143955, 10.488333644382237]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
