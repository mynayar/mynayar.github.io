
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gaw Thu Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gaw Thu Thaung</div><div class="name-mm">ဂေါ်သူသောင်</div></div>
        <span class="pcode-badge">MMR017017085</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1090422719833, 16.566667506300405], [95.11041284058018, 16.568152289696457], [95.1109893743602, 16.568536646449104], [95.11216230884355, 16.569318601572263], [95.1133900830859, 16.568093506410264], [95.12424072013317, 16.55985338992207], [95.12491931977087, 16.55861102957539], [95.12922384020811, 16.548778890033816], [95.12872812040649, 16.54381889962258], [95.12746559995753, 16.542696960296553], [95.12620344013669, 16.54157493013895], [95.12364384009123, 16.54095455980513], [95.12215559970122, 16.54329311998157], [95.12058600034368, 16.546091040369276], [95.11838460026917, 16.554109320189013], [95.11653743955128, 16.559314380354408], [95.11427556006907, 16.56237708003829], [95.1111147596385, 16.564317209971307], [95.11042723243088, 16.56493441199359], [95.1090422719833, 16.566667506300405]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
