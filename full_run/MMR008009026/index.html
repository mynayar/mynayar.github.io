
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Ni Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Ni Su</div><div class="name-mm">စာနီစု</div></div>
        <span class="pcode-badge">MMR008009026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75016811326788, 17.905017439403366], [95.74374149677271, 17.90354849756517], [95.73929376739352, 17.899885662293514], [95.73316100887354, 17.89784646214457], [95.73359990860894, 17.903050556438075], [95.73313907440883, 17.902663227426046], [95.73291291379996, 17.90231733467732], [95.73255371827952, 17.902051263954718], [95.73214130807497, 17.901798496903155], [95.73187523735237, 17.901865014358975], [95.731396309692, 17.90203796028368], [95.73077104344895, 17.901904923573397], [95.7295205082649, 17.901771889561132], [95.72779104721911, 17.901692068434272], [95.72503721159808, 17.90155903262331], [95.72382658832646, 17.901598943636372], [95.72306828627245, 17.901226444444887], [95.72141864455489, 17.9008938553672], [95.71899739981023, 17.900641087416318], [95.71774083557119, 17.900594189570256], [95.718363275245, 17.903810129234103], [95.71813530520024, 17.905542701034847], [95.71705511959817, 17.91375211286976], [95.72071795576909, 17.912705587992548], [95.73850887418524, 17.91375211286976], [95.7489741202595, 17.91610679339385], [95.75016811326788, 17.905017439403366]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
