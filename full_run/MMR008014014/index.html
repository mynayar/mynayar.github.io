
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Nin Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Nin Pin</div><div class="name-mm">ဆင်နင်းပင်</div></div>
        <span class="pcode-badge">MMR008014014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61944484420428, 18.15785980288763], [95.62025957332071, 18.15750557342352], [95.62486374516578, 18.150343528231303], [95.62972370488512, 18.146506717311183], [95.63242172408337, 18.144471181899576], [95.62690578537376, 18.140043686367108], [95.62404432878282, 18.137539912636896], [95.62159116709876, 18.137193226686122], [95.6195744643901, 18.136080810281214], [95.61686448510795, 18.137623969570598], [95.61544924178912, 18.137166048274537], [95.61299348376235, 18.137918826692555], [95.60879501677664, 18.132807648554206], [95.60225488335624, 18.129876496303325], [95.60178943023806, 18.128518675596467], [95.59753897164626, 18.128499335675826], [95.59565198804887, 18.13025206218299], [95.59309640077834, 18.128426641676242], [95.59239140513927, 18.12846189240247], [95.58944556066416, 18.12860918516583], [95.58718957443938, 18.12769007893405], [95.58496091771224, 18.129368964805906], [95.58086832071649, 18.13704258484745], [95.58521670558656, 18.139856246068973], [95.58956508955731, 18.146250930336237], [95.5939134753267, 18.152389825829857], [95.60005237171964, 18.15699399857425], [95.6049123323383, 18.159807659795717], [95.61437646390277, 18.16006344677072], [95.61944484420428, 18.15785980288763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
