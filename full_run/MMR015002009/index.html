
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Pang Myin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Pang Myin</div><div class="name-mm">ဟိုပန်မျဉ်း</div></div>
        <span class="pcode-badge">MMR015002009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.95846377378422, 23.179095460087467], [97.96000752932406, 23.17972130639322], [97.97106086186932, 23.186680811670158], [97.98047666386702, 23.1989622925758], [97.98156468526207, 23.200019228005033], [97.99480505930609, 23.212881304928317], [98.01381499076928, 23.227930834340555], [98.01445542857522, 23.228437847828445], [98.0177639012831, 23.233341778999943], [98.0398371565596, 23.227619082554668], [98.06153444036221, 23.22025019419118], [98.0702333226098, 23.20778179729217], [98.0646531848966, 23.20459284358492], [98.05801263587449, 23.19717038440575], [98.0494188771795, 23.191701121409665], [98.04887214513343, 23.19171933358041], [98.03769991142184, 23.192091511713954], [98.02676228115439, 23.189747382935423], [98.01660597378674, 23.185059382584484], [98.00488718969211, 23.178418107809478], [98.00762180320373, 23.170995853675777], [98.00957517295592, 23.162792287434172], [98.00845194130409, 23.155864279113246], [97.99684977769516, 23.14631165156152], [97.99649930559855, 23.14602309059319], [97.98708240642799, 23.142422118785817], [97.98416110894806, 23.1555677258699], [97.97474530695041, 23.16825858986209], [97.95846377378422, 23.179095460087467]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
