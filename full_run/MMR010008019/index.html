
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pway Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pway Kauk</div><div class="name-mm">ပွေးကောက်</div></div>
        <span class="pcode-badge">MMR010008019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5418933092289, 22.09528426635586], [96.5465290328886, 22.09390656883312], [96.55150218128068, 22.089347851422247], [96.55771861632115, 22.085203561395303], [96.5643494787455, 22.086446848043636], [96.57719677800895, 22.086446848043636], [96.58838635964287, 22.088518993057107], [96.57968335130568, 22.07650055215879], [96.57719677800895, 22.066139827990696], [96.58124029270539, 22.064520532996255], [96.57794863012526, 22.062639582950453], [96.56625501265876, 22.059716179258317], [96.5565103312868, 22.05338213627664], [96.55504862899107, 22.045586390999176], [96.53945713933558, 22.048022560892548], [96.53011391172771, 22.049891207313408], [96.52727628717099, 22.050458731685183], [96.51899330809476, 22.054356603874226], [96.52289118118313, 22.06020341305714], [96.53117416025935, 22.066050222239994], [96.53604650004598, 22.073845966618137], [96.53750820324103, 22.080180009599815], [96.53799543703985, 22.086514052581492], [96.53960566596879, 22.090137067671606], [96.5418933092289, 22.09528426635586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
