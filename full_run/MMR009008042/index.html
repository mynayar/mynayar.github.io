
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Chon</div><div class="name-mm">ညောင်ခြုံ</div></div>
        <span class="pcode-badge">MMR009008042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.81541034141418, 20.357875951214226], [94.81559592191434, 20.35822649255863], [94.8189800006266, 20.35424522533691], [94.82355845905568, 20.35265271664963], [94.82714160090421, 20.35265271664963], [94.82933129900033, 20.35106020976093], [94.83253928236206, 20.347852226399198], [94.82813691838413, 20.343097672619535], [94.82375752309127, 20.341306101695295], [94.8183828103185, 20.339713594806597], [94.81241090813694, 20.339315467634776], [94.80803151194476, 20.338917341362276], [94.8036521166519, 20.336528580129936], [94.8030730234014, 20.33565993935474], [94.80205960976326, 20.33812108701858], [94.803453054415, 20.340907975422795], [94.80584181474802, 20.343694862927634], [94.80922589256096, 20.346680813568753], [94.81101746438452, 20.35006489318033], [94.81042607110635, 20.350557719862934], [94.8122118441014, 20.35185646320525], [94.81380435188936, 20.35484241474569], [94.81541034141418, 20.357875951214226]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
