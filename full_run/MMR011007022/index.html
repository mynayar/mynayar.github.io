
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Yit Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaton</div><div class="name-mm">သထုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Yit Chaung</div><div class="name-mm">ဇရစ်ချောင်</div></div>
        <span class="pcode-badge">MMR011007022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.36650600015184, 17.027227999572574], [97.36818400019149, 17.02300199984245], [97.36907599995749, 17.019800999716438], [97.37069335241637, 17.017199928334094], [97.37187100024653, 17.015306000171847], [97.37320100042587, 17.010686000258772], [97.37433086637645, 17.00873418273642], [97.37721899955721, 17.00374500033155], [97.37065599997447, 17.002460999575533], [97.36772299961677, 17.002212999830135], [97.36442300032127, 17.001933999554467], [97.35896000020392, 17.000743000389207], [97.35679500018915, 16.99983099970092], [97.35356599967122, 16.99810200000735], [97.34993500040002, 16.99706599989605], [97.34447200028262, 16.995874999831415], [97.34019600004541, 16.99296499963509], [97.3362339998992, 16.991172999734204], [97.33273999975125, 16.99488099985831], [97.33100899996543, 17.000195000299072], [97.3281779998149, 17.0054160000484], [97.32772399956298, 17.00719800038746], [97.33222800042194, 17.009681999824465], [97.33596199994639, 17.011899999585353], [97.33849299975219, 17.012841999858438], [97.34271600024329, 17.016839999866136], [97.34709699992669, 17.017575999632754], [97.35135500023313, 17.020849000381133], [97.35638200002933, 17.02345900023272], [97.36071100001271, 17.025280999718404], [97.36650600015184, 17.027227999572574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
