
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bogale</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bogale</div><div class="name-mm">ဘိုကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR017024902</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31243448106653, 15.92694267386537], [95.31238034997324, 15.926920231283702], [95.3115894942598, 15.927486915688633], [95.3103060600767, 15.930479007800045], [95.30984528433248, 15.932652271685015], [95.31107687259964, 15.935922827176796], [95.3134201623107, 15.939829837377147], [95.3160805250962, 15.94541947642773], [95.31809510090824, 15.948904899741365], [95.32062724824897, 15.952122751363959], [95.32159303019426, 15.952906970080676], [95.32576341674832, 15.954586589799305], [95.32861646108086, 15.956890734719707], [95.33020284358645, 15.957745400030262], [95.33086741919612, 15.957823463881823], [95.33110200105654, 15.957107331937891], [95.33293626369766, 15.951507695124064], [95.3344590983088, 15.94361103691989], [95.33445286960432, 15.939894107427165], [95.33337667969005, 15.937123922131377], [95.3321822091417, 15.936424054426595], [95.3316223757721, 15.934881386167092], [95.33069490494597, 15.933471973153075], [95.32954574224226, 15.932536948921097], [95.32668605731573, 15.931374964582972], [95.31835336101886, 15.929396635046714], [95.31243448106653, 15.92694267386537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
