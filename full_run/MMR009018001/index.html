
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Taw</div><div class="name-mm">ကန်တော်</div></div>
        <span class="pcode-badge">MMR009018001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.98581534680085, 21.348045968047018], [94.98230361292144, 21.34726558224088], [94.95741173126646, 21.354445933133377], [94.94592317001832, 21.35492462337271], [94.94065758008333, 21.353009863314583], [94.93108377889337, 21.35205248283586], [94.94113627032266, 21.33960654200837], [94.94040606488807, 21.337659328115535], [94.9397001996046, 21.335777020992793], [94.92438211913952, 21.334340951174], [94.92007390878393, 21.335907571976918], [94.91956150835699, 21.336093899813648], [94.91911652830521, 21.336255711232127], [94.91703975627979, 21.341730836908653], [94.91385093837016, 21.35013772187841], [94.91116395205478, 21.360885668039202], [94.91050010759398, 21.363541043184625], [94.90571320789826, 21.371200084316513], [94.90577158379159, 21.372367621068918], [94.90619189813765, 21.372157463895917], [94.92294604932079, 21.37311484437464], [94.93204115937209, 21.378380434309634], [94.94113627032266, 21.381252574846485], [94.95262483067148, 21.38220995532521], [94.96245010928516, 21.380187103052435], [94.96794291203582, 21.3673705642002], [94.97703802208713, 21.356360693191505], [94.98565444279836, 21.348222961820284], [94.98581534680085, 21.348045968047018]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
