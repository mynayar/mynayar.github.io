
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Da Wun Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Nan Da Wun Ward</div><div class="name-mm">နန္ဒဝန်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014002701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93416245529806, 20.66107061887857], [96.93419100883006, 20.664268614470473], [96.93459504479085, 20.664269803964828], [96.93473352593935, 20.666153147587067], [96.93646438553276, 20.665961997552927], [96.93791109782427, 20.66571453360831], [96.93783495507205, 20.664305892692937], [96.93781591938398, 20.6638109648037], [96.9377492944759, 20.656741586155363], [96.93690696527983, 20.65704853662504], [96.93595042195545, 20.657269826498577], [96.93555781088952, 20.65731979517966], [96.93412299590301, 20.657419732542053], [96.9334020192183, 20.657533946670355], [96.93265248900138, 20.65767671433059], [96.93225531730172, 20.657745916988233], [96.93235049574201, 20.657917238180687], [96.93249802232441, 20.658098077217062], [96.93251705801248, 20.658469273133903], [96.9326407899847, 20.65897847778922], [96.93275976303511, 20.65935443262822], [96.93312620003002, 20.660177726136112], [96.93341088933431, 20.661061879739577], [96.93416245529806, 20.66107061887857]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
