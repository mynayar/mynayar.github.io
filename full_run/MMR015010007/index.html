
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Hai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Hai</div><div class="name-mm">ကွန်ဟိုင်း</div></div>
        <span class="pcode-badge">MMR015010007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.68120182740245, 23.864048134413906], [97.68192164476812, 23.866073853725425], [97.68200353343639, 23.870864070120774], [97.68258821417481, 23.87587522476184], [97.68314170102872, 23.87906152456975], [97.68492717814684, 23.88131764839079], [97.68842416044669, 23.88149596326815], [97.69240828301588, 23.88098279661881], [97.69134787710288, 23.877347596614356], [97.68980021221006, 23.874403735144313], [97.69448941585392, 23.871370946911725], [97.69556804742751, 23.870675646863674], [97.69991865272368, 23.86787118840465], [97.70612404858605, 23.86545505001061], [97.70318137242248, 23.863746614214904], [97.6995630688806, 23.864198902157682], [97.69428637591557, 23.865103478043125], [97.69066807237368, 23.864801952448204], [97.68689900558468, 23.863897376562704], [97.68550178198171, 23.861468161126766], [97.68450145797595, 23.862068355170493], [97.68396934890637, 23.862387620792106], [97.683402222035, 23.86272789727468], [97.68120182740245, 23.864048134413906]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
