
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Taw Gyi</div><div class="name-mm">ထန်းတောကြီး</div></div>
        <span class="pcode-badge">MMR010024033</span>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84565328167366, 20.740054414579618], [95.84607296469562, 20.742362674797675], [95.84616661020095, 20.749059686855105], [95.85050072912543, 20.75143959156395], [95.85205044896912, 20.757638462844852], [95.86334124570197, 20.7618448402672], [95.86754762312438, 20.76959342779452], [95.87338841944006, 20.775369653686596], [95.88105230701842, 20.775570909370003], [95.88857950663896, 20.771364532846974], [95.89345004688221, 20.772028700164412], [95.89787781221133, 20.775128132657244], [95.904519460205, 20.77335702760479], [95.90629056435813, 20.771364532846974], [95.90717611688433, 20.767822320943424], [95.91226804773225, 20.764058722931793], [95.91558503701992, 20.756388183967545], [95.90959221480892, 20.755949685329767], [95.90179430396404, 20.755949685329767], [95.8947725745947, 20.755949685329767], [95.89183030672336, 20.755949685329767], [95.88229952820075, 20.755949685329767], [95.87710092067101, 20.755949685329767], [95.8719023140406, 20.75508325059161], [95.86886979290665, 20.75335038201456], [95.86280475063882, 20.747718556666086], [95.8576061440084, 20.743386384773885], [95.84894179932462, 20.739487429801102], [95.84565328167366, 20.740054414579618]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
