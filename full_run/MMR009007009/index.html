
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Dee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Dee</div><div class="name-mm">ကဒီး</div></div>
        <span class="pcode-badge">MMR009007009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78593237058249, 20.24947250635114], [94.78469755914512, 20.249215252581905], [94.78274702495531, 20.251750947748064], [94.78060143680693, 20.25545696216909], [94.77845584955787, 20.258382762554504], [94.77455478207759, 20.262478883993367], [94.77201908781069, 20.26677005939075], [94.7716045992729, 20.267599035567116], [94.77182403385211, 20.26774532558636], [94.77728553030306, 20.270866180829614], [94.77884595657571, 20.275157355327735], [94.78111261235722, 20.279690665092176], [94.78138165084255, 20.279448529825856], [94.78625798631708, 20.2812040109564], [94.7913293739515, 20.283154545146203], [94.79659581644381, 20.281594117074917], [94.7985463497343, 20.276327676381186], [94.80030182996552, 20.268330485663455], [94.80287181088545, 20.261991201432863], [94.8024929669769, 20.261331278915463], [94.80147215101903, 20.259553082708635], [94.79835129667504, 20.25643222926402], [94.79445022919481, 20.252726214842994], [94.7893788397617, 20.250190519676778], [94.78593237058249, 20.24947250635114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
