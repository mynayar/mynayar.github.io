
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gon Min Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gon Min Kwin</div><div class="name-mm">ဂုံမင်းကွင်း</div></div>
        <span class="pcode-badge">MMR007006045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5166078428777, 18.14234044515547], [96.51894600915108, 18.14207474405424], [96.52382496075342, 18.140534021927635], [96.52921748729727, 18.14207474405424], [96.53358286485741, 18.142588318096443], [96.5369210952324, 18.141047595969837], [96.54873329370662, 18.12641074116283], [96.55335545918717, 18.12332929690956], [96.55713342476781, 18.118670281708205], [96.55493434134684, 18.114008145859316], [96.55258150713092, 18.10969461781241], [96.54277803437884, 18.10773392398147], [96.53650381160168, 18.108518202053403], [96.52591606077766, 18.112439590614656], [96.51650472661191, 18.116753118661563], [96.5106226433204, 18.122635202852393], [96.50725035112288, 18.126620639331065], [96.5112424012159, 18.131032905744064], [96.51458063069163, 18.13873651367919], [96.5166078428777, 18.14234044515547]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
