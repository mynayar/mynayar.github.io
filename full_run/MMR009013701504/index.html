
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwet Thit Ward (No-4 Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kwet Thit Ward (No-4 Ward)</div><div class="name-mm">ကွက်သစ်ရပ်ကွက် (အမှတ် (၄) ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR009013701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03940235563425, 19.970102112922234], [95.03966326784558, 19.97070467847817], [95.04023098737025, 19.97033708598775], [95.04041654448798, 19.970653933332414], [95.04056385703643, 19.97086427666511], [95.040773493502, 19.971075951893738], [95.04090947459264, 19.970943488950923], [95.04102845759729, 19.970745791884838], [95.04117860301017, 19.970363045817976], [95.04176218657568, 19.97070585389207], [95.04233355285123, 19.969973809343855], [95.0414533971566, 19.9696115300481], [95.0417166539005, 19.968711400410825], [95.04107378432775, 19.968522523895388], [95.04142163669923, 19.96728087761045], [95.04042221021689, 19.966882343945088], [95.03969697983183, 19.96659211563366], [95.03935066350238, 19.96647016846356], [95.0392256496441, 19.967079969065367], [95.03982252698808, 19.96720718626267], [95.03977842693291, 19.967406883421006], [95.03939102327718, 19.96766249682679], [95.03903973999206, 19.968631690799953], [95.03866579379138, 19.968748846382198], [95.03904894725116, 19.969501697645285], [95.03920546705871, 19.969853826293104], [95.03935136227562, 19.970035547802354], [95.03940235563425, 19.970102112922234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
