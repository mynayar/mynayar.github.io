
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mi Kyaung Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mi Kyaung Ye</div><div class="name-mm">မိကျောင်းရဲ</div></div>
        <span class="pcode-badge">MMR009001019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14422344735425, 19.907961442566545], [95.1419524208676, 19.904554904185545], [95.13896240259288, 19.897578193978518], [95.13763350588164, 19.88960481101327], [95.13431126275464, 19.877644736115712], [95.13059347440935, 19.87095271619495], [95.12892651714509, 19.868508900265567], [95.12382047503496, 19.882611297873154], [95.11650101610905, 19.886417419428426], [95.11362826133524, 19.888531332554976], [95.10308193598263, 19.89629183340145], [95.09803941388788, 19.898629641744606], [95.09173687955342, 19.898928979288996], [95.0917865536066, 19.900568212253233], [95.0917865536066, 19.91286051110376], [95.09411212397538, 19.91618275423076], [95.10175328298766, 19.917511650942004], [95.1074010946848, 19.919837221310786], [95.10742177279661, 19.919890982782704], [95.1083977683424, 19.918508323700223], [95.11238446027465, 19.912528287150792], [95.1190289456294, 19.91186383834554], [95.12129080082985, 19.913156326902993], [95.12368008636696, 19.911531614392516], [95.12733455344693, 19.90854159521848], [95.1346434867076, 19.90920604402379], [95.14228464571988, 19.907877147312547], [95.14422344735425, 19.907961442566545]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
