
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Lel Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Lel Inn</div><div class="name-mm">ပင်းလယ်အင်း</div></div>
        <span class="pcode-badge">MMR010009001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10257367403591, 22.37317628675629], [96.10526347522926, 22.3670281696144], [96.10682480801853, 22.362344172145868], [96.10258690486182, 22.359890648934368], [96.09500328897064, 22.359890648934368], [96.08429700840026, 22.360336744145457], [96.07397838509445, 22.364919254919755], [96.0710826652329, 22.368756500212385], [96.06874256901443, 22.37490350579219], [96.06699144240122, 22.3796664286628], [96.06835173264642, 22.383888401228774], [96.06481830262265, 22.38930629674826], [96.06271420379755, 22.392532563327165], [96.062492056863, 22.392873186948066], [96.06420576628312, 22.395509901161063], [96.06485740784314, 22.396512516639405], [96.06757008778936, 22.40068624597353], [96.0695764024291, 22.401457983898865], [96.07264825091613, 22.40263958514879], [96.0828046940814, 22.401467842267152], [96.09335178565647, 22.399514809760717], [96.09647697113536, 22.39365515286306], [96.0972274337991, 22.38352660756692], [96.0972584738995, 22.38310767457955], [96.09882121322846, 22.373732155014977], [96.10257367403591, 22.37317628675629]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
