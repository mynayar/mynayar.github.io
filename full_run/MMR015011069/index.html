
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Htan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Htan</div><div class="name-mm">လုံထန်</div></div>
        <span class="pcode-badge">MMR015011069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.12260458743185, 23.67207940174302], [98.11903507301025, 23.67163321300245], [98.10451885056455, 23.66098798200983], [98.09847529759696, 23.654418903909345], [98.09548653387651, 23.65614924179414], [98.09129295830343, 23.665826723124837], [98.09355103725062, 23.672278377645057], [98.0929058717087, 23.67808486842199], [98.07516382155319, 23.68163327755377], [98.05645402443372, 23.690988176563167], [98.02322800217064, 23.70131082433511], [97.99387297315923, 23.713246384613], [97.98019849006835, 23.71461383256235], [97.97979227529333, 23.718037015595826], [97.97949190532722, 23.72056824922538], [97.98067454079745, 23.73003175666031], [97.9812493748588, 23.7346316099609], [97.98134823733136, 23.734673984217068], [97.98945254629803, 23.738147623713928], [97.98991334542461, 23.738307149955062], [97.99706979323645, 23.74078466797812], [98.00568588839309, 23.747192336657065], [98.00570995694903, 23.747173054293057], [98.03903455570025, 23.73002068690522], [98.06484117468051, 23.720665787895825], [98.0870993827304, 23.710988305665808], [98.10838984291695, 23.695826917678176], [98.11645441174176, 23.685826853126798], [98.12260458743185, 23.67207940174302]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
