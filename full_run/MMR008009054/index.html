
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Boke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Boke Kone</div><div class="name-mm">အင်းဘုတ်ကုန်း</div></div>
        <span class="pcode-badge">MMR008009054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65746322324924, 17.97237737471613], [95.6617784438202, 17.968882083141693], [95.65865781970268, 17.9675252903599], [95.65635127179382, 17.965218741551723], [95.65119545760433, 17.960334286997806], [95.64821051420392, 17.959113173134483], [95.64414013406002, 17.959113173134483], [95.63613505538854, 17.961148363206462], [95.62812997581779, 17.962776514724453], [95.62295132244566, 17.96434226588292], [95.61765216891251, 17.964872182405315], [95.60996839732371, 17.965932011852942], [95.6086436078163, 17.968581589069117], [95.60625898886133, 17.983684175784163], [95.6046692428913, 17.988718371955372], [95.60498279422063, 17.98973741265155], [95.61290393376959, 17.989494663148207], [95.62540227089812, 17.9846040086681], [95.64088934117024, 17.97781143465005], [95.6490404301718, 17.975637811036222], [95.65746322324924, 17.97237737471613]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
