
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loke Waun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loke Waun</div><div class="name-mm">လုပ်ဝိုင်</div></div>
        <span class="pcode-badge">MMR015001022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.8506606146957, 22.852241439990507], [97.84733169769976, 22.838648365329846], [97.84910844869603, 22.829040833267868], [97.85103009306442, 22.818449441088887], [97.85359051958687, 22.808492224736426], [97.85671993008077, 22.79967297722618], [97.85586645457329, 22.7976815337758], [97.85656944202617, 22.789436659874013], [97.85421836958216, 22.77839850878422], [97.84898821473439, 22.77878592772845], [97.83804269381534, 22.778310035279958], [97.82709717379561, 22.77688235883386], [97.8163220833975, 22.776060150055912], [97.81689106736894, 22.780043036956613], [97.81433063994712, 22.78715533435127], [97.80864080203145, 22.791707204324098], [97.80465791603007, 22.797112549804353], [97.80331984533467, 22.798656478014095], [97.8009595206654, 22.801379928241147], [97.80039053759327, 22.806500782185424], [97.80152850463685, 22.813613078680703], [97.80465791603007, 22.82186334401814], [97.80835630959609, 22.82641521399097], [97.81290817956886, 22.83494996996518], [97.81524664081985, 22.843841123668994], [97.82172742887781, 22.85059702423331], [97.82400336386422, 22.853726434727207], [97.82519823011427, 22.85682739696682], [97.82997769331593, 22.85059702423331], [97.83652100673913, 22.846329645796573], [97.84277982772693, 22.846614138231928], [97.8506606146957, 22.852241439990507]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
