
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Khat Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Khat Taing</div><div class="name-mm">ပုခက်တိုင်</div></div>
        <span class="pcode-badge">MMR009010065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.43730227797778, 20.778383530075928], [94.43536708172547, 20.777145005337786], [94.43197765114775, 20.77666080135492], [94.42423038112724, 20.780050231033385], [94.41890413192021, 20.785860684223223], [94.41381998560394, 20.789976421674567], [94.4133252046945, 20.790094226567362], [94.40727987016993, 20.810595798757163], [94.40156682524884, 20.83154362803606], [94.4013863807769, 20.839483191096463], [94.40817119544437, 20.83508223006089], [94.41296132730349, 20.82983589461088], [94.41889196679091, 20.82983589461088], [94.42208538922938, 20.832573112559146], [94.42368210044862, 20.832573112559146], [94.42433850661683, 20.833557723610113], [94.42664741974266, 20.829379691919314], [94.42755982602523, 20.824817661405973], [94.42847223230774, 20.82048373223853], [94.4305251462186, 20.8154654981343], [94.4317283186071, 20.81434253717839], [94.42938463769093, 20.811359671211903], [94.42733172378007, 20.809762959992668], [94.42482260717765, 20.804516625441977], [94.42482260717765, 20.799954594029316], [94.42573501256084, 20.792883446014287], [94.42938463769093, 20.787180907872653], [94.43730227797778, 20.778383530075928]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
