
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Kaung Nyunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Kaung Nyunt</div><div class="name-mm">အောင်ကောင်းညွှန့်</div></div>
        <span class="pcode-badge">MMR007003096</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75258246630784, 17.133281792021137], [96.75441109829359, 17.12810066281537], [96.75680467539553, 17.12399738726964], [96.76022407228317, 17.120236051052984], [96.76193376982769, 17.117158594393686], [96.76432734513094, 17.109977861289337], [96.76569510064843, 17.103481006843026], [96.76952069882122, 17.105712603453924], [96.77306528583432, 17.09408317240053], [96.77580121955071, 17.085001392999914], [96.77534203290855, 17.085001392999914], [96.74432690036622, 17.08458117667999], [96.73763614399292, 17.08449052591709], [96.73186471238665, 17.084412329865188], [96.70072649323316, 17.083990446202165], [96.69799097860084, 17.090487298849837], [96.69729170984459, 17.093144596745788], [96.69901673633336, 17.094248635965812], [96.7036148908146, 17.096370857029456], [96.71235241333329, 17.100403550183728], [96.72261062557999, 17.105190705286873], [96.72759726020547, 17.108581607155486], [96.73115914028216, 17.11100368017577], [96.73765601541282, 17.11921023216655], [96.7479142330555, 17.12775872438567], [96.75258246630784, 17.133281792021137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
