
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Ni Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar Ni Kan</div><div class="name-mm">ကြာနီကန်</div></div>
        <span class="pcode-badge">MMR010007021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14905568077512, 22.101503634085475], [96.15300520642518, 22.099726815640054], [96.15304301122603, 22.0997106143534], [96.15523736870966, 22.0987701753034], [96.15730162936677, 22.096912341431448], [96.15915946413804, 22.095880210203575], [96.1616365756675, 22.09526093164675], [96.16452654076733, 22.09567378431774], [96.16755484408083, 22.096620129215637], [96.16738708364704, 22.09477477523575], [96.16520280756356, 22.091562604630553], [96.16237609897786, 22.084624317058626], [96.16101729800994, 22.08019183118813], [96.15957231590971, 22.07998540530224], [96.15730162936677, 22.079778979416403], [96.15482451693799, 22.07998540530224], [96.15110884829477, 22.081017534731473], [96.14883816175183, 22.081636813288355], [96.14615462343716, 22.082875370402064], [96.14305823155223, 22.083701073945463], [96.14099397179444, 22.083701073945463], [96.1379982868915, 22.083701073945463], [96.13821835279481, 22.085684715777063], [96.1340208094129, 22.085798162555193], [96.13451895378677, 22.09285862212778], [96.13880168185221, 22.09094276219878], [96.14510086801073, 22.090484640353907], [96.146820514755, 22.096437256574177], [96.14905568077512, 22.101503634085475]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
