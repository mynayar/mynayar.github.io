
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zin Pyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngape</div><div class="name-mm">ငဖဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zin Pyun</div><div class="name-mm">ဇင်ပြွန်း</div></div>
        <span class="pcode-badge">MMR009009021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.50105839602821, 19.948023903280557], [94.5027293930471, 19.946273335146373], [94.5097063964331, 19.940765173773798], [94.51808847900014, 19.932941897550563], [94.52072271827888, 19.930483274283745], [94.52147896538202, 19.92266872508162], [94.52182435001379, 19.919099742159403], [94.52880135339979, 19.915427634877517], [94.53191622455415, 19.90262205336512], [94.53210625040322, 19.901840839283352], [94.52415091143547, 19.88891341312359], [94.52329319292659, 19.890457306259748], [94.51484734572847, 19.89816873110209], [94.50787034324179, 19.90147362810552], [94.48280367564917, 19.893223839408734], [94.4829000137247, 19.894129414440954], [94.47827315917903, 19.895892025396677], [94.47959511762065, 19.896332677910834], [94.47284013166683, 19.90747840410512], [94.47225090305682, 19.9084506305922], [94.46710995286207, 19.91763089924666], [94.46585925490075, 19.918067189149497], [94.46648415961636, 19.919317000379294], [94.46674274168424, 19.919834163615803], [94.44874941735179, 19.9330537489314], [94.44531491724968, 19.935343415666125], [94.45352315726797, 19.941499596129518], [94.46637553230505, 19.947007756602716], [94.48179838198979, 19.946640546324204], [94.49648681021819, 19.947007756602716], [94.50052612777864, 19.947007756602716], [94.50105839602821, 19.948023903280557]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
