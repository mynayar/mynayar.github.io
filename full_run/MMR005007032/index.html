
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Kone</div><div class="name-mm">ထန်းကုန်း</div></div>
        <span class="pcode-badge">MMR005007032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52951324034382, 23.114133809827536], [95.53491483475187, 23.116726593057876], [95.53928435998529, 23.118823980242553], [95.54807232008159, 23.12113662015895], [95.55593508013988, 23.120211599985396], [95.56023672004864, 23.11565705992541], [95.55528491976332, 23.106335850419214], [95.55362244022348, 23.106335850419214], [95.54622227973448, 23.103098190329263], [95.53743431963818, 23.09847290959715], [95.53327127964587, 23.090609969674404], [95.52864636044126, 23.077659330213976], [95.52819996035993, 23.0656096801427], [95.5258711200562, 23.05962080955277], [95.52217104026136, 23.05407051044574], [95.5218376795653, 23.053758300005597], [95.51847600026724, 23.05763756971811], [95.50109952002691, 23.070669749809156], [95.49219023958796, 23.079579120180313], [95.49528048011013, 23.084523629661817], [95.50360583973776, 23.08660506017543], [95.50880928022417, 23.08972707014823], [95.51540052031783, 23.095624229674513], [95.5140127198112, 23.09839938012732], [95.51392164007171, 23.098410359950208], [95.5192590004026, 23.104309409851453], [95.5303596004153, 23.1115941900199], [95.52951324034382, 23.114133809827536]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
