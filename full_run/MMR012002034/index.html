
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga/Pyauk Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga/Pyauk Se</div><div class="name-mm">င/ပြောက်ဆည်</div></div>
        <span class="pcode-badge">MMR012002034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.96890411323432, 20.623242721374538], [92.96887665693225, 20.621513666822295], [92.96834859481186, 20.61653800212713], [92.9675532047167, 20.60809438704638], [92.96397776376284, 20.6065691143732], [92.95699244344655, 20.60358889601082], [92.9540730282477, 20.605467085137946], [92.94781943861625, 20.60923345036349], [92.94533221690835, 20.612147054143293], [92.94341350163188, 20.614918530865566], [92.94220542164294, 20.61726362731457], [92.94440839103447, 20.618755959619875], [92.948628781693, 20.620464252423346], [92.952509630615, 20.622167008100973], [92.95329132943135, 20.62373040573368], [92.95353702511369, 20.624360174882213], [92.95323535292925, 20.62506846473792], [92.95555726485594, 20.624488000920564], [92.95820459286773, 20.623826185330245], [92.96890411323432, 20.623242721374538]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
