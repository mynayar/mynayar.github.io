
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hle Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamu</div><div class="name-mm">တမူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hle Seik</div><div class="name-mm">လှည်းဆိပ်</div></div>
        <span class="pcode-badge">MMR005030012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.48696152025803, 24.42124043979453], [94.48686504008958, 24.41834370010173], [94.48379387958391, 24.41527263042758], [94.4818196401643, 24.413956379983006], [94.48094196030331, 24.410885310308856], [94.48138079978412, 24.408033569993336], [94.4763353998589, 24.408472320441263], [94.47019307974688, 24.40605923974215], [94.46668344038852, 24.401672009555625], [94.46339303955716, 24.397504019694793], [94.45922495976413, 24.391800539963015], [94.45461840021903, 24.38631648042127], [94.44672108011383, 24.377761260373916], [94.44145643986286, 24.372277110000653], [94.43834244015153, 24.36646427990263], [94.43450915996982, 24.365478509625575], [94.42852776004815, 24.366882329755754], [94.4232789595564, 24.374511720239752], [94.42166652009388, 24.375868649718484], [94.42403531997411, 24.38317224010683], [94.43163996021605, 24.398674019690304], [94.43982959955645, 24.4083260699922], [94.45182155991711, 24.416223210233], [94.4635208404145, 24.41944053035627], [94.4755127998759, 24.422072940413898], [94.48019244012909, 24.42236534958124], [94.48487244011108, 24.42236534958124], [94.48696152025803, 24.42124043979453]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
