
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Ta Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Ta Kaing</div><div class="name-mm">လင်းတကိုင်း</div></div>
        <span class="pcode-badge">MMR009003033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.94947455410744, 20.748941105847393], [94.94954519225689, 20.748729192298413], [94.97487022338214, 20.747264107652484], [94.97505187024768, 20.74716823812372], [94.98010266700453, 20.738682898996615], [94.98135845422934, 20.733450453575642], [94.98031196532497, 20.73135747576697], [94.96691690698975, 20.72947379627874], [94.96690293692109, 20.729330285164565], [94.96607971640583, 20.72968309369986], [94.95980078297981, 20.72926449885756], [94.94766151186934, 20.728636604795497], [94.93008049791672, 20.729055201436438], [94.92944411965044, 20.729302681373724], [94.92966190307442, 20.72947379627874], [94.93112698682103, 20.733241156154463], [94.93238277404583, 20.747473405073663], [94.93635943134274, 20.747473405073663], [94.9445220451563, 20.745799023006555], [94.94766151186934, 20.747473405073663], [94.94947455410744, 20.748941105847393]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
