
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar Gyi</div><div class="name-mm">ကံသာကြီး</div></div>
        <span class="pcode-badge">MMR009001009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02883449781388, 20.22151187527288], [95.02196897888535, 20.221003317649036], [95.01536257172535, 20.222588855691185], [95.01083009563246, 20.222937507559948], [95.00849190957405, 20.223117368371902], [95.00327335777928, 20.226066984603733], [95.00241401599408, 20.226552700346872], [95.00294252777547, 20.236065925002492], [95.00135699063264, 20.253771093960893], [94.99739314687628, 20.263812832196493], [94.99237227775848, 20.27385456863351], [94.98662040910466, 20.284486813415754], [94.99768334191276, 20.28948297635833], [94.99950719669982, 20.288388663306193], [95.00505657759902, 20.28363205097844], [95.01034170260755, 20.276232876146366], [95.01985492906181, 20.26090601290224], [95.02989666639809, 20.246107663238092], [95.04839460392787, 20.224967162304722], [95.05003779840575, 20.225058450687015], [95.04178819766724, 20.223117368371902], [95.03438902283517, 20.222324599800515], [95.02910389692738, 20.221531831229072], [95.02883449781388, 20.22151187527288]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
