
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Ku</div><div class="name-mm">ပန်းကူး</div></div>
        <span class="pcode-badge">MMR017017128</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09015899743986, 16.413707047242497], [95.08945870705372, 16.417488609212], [95.08860210100619, 16.420248784154126], [95.08945870705372, 16.423865564244466], [95.08669853211165, 16.426720918035983], [95.08376554614313, 16.426246701024468], [95.08372560005648, 16.43120235040817], [95.08775580028998, 16.431612030271026], [95.09424299961478, 16.431840539909047], [95.1017331597576, 16.433288280229988], [95.10296328033121, 16.433526060079657], [95.10523455503073, 16.434251787789833], [95.10927660023498, 16.43554332036797], [95.11196903734128, 16.4376458112053], [95.11753564115696, 16.437493729552045], [95.122234680686, 16.4380158435564], [95.12241876021767, 16.435458990040388], [95.12150904021007, 16.43444711963889], [95.12135896224635, 16.434164094897085], [95.117916354756, 16.432392165166334], [95.11711685655774, 16.431211951570333], [95.11586050096139, 16.427937814078916], [95.11643674156244, 16.425376742742515], [95.11485269729422, 16.424766607592915], [95.11143802904189, 16.423669036297042], [95.10712272843125, 16.422256782324666], [95.10671827542814, 16.422081355170462], [95.1025414263458, 16.420269690693715], [95.09320204244034, 16.41533230923875], [95.09015899743986, 16.413707047242497]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
