
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Shin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Shin</div><div class="name-mm">နောင်ရှင်</div></div>
        <span class="pcode-badge">MMR015012055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.30985728538548, 22.344686205903713], [97.30448185675237, 22.337364018434755], [97.293671783626, 22.328355623713094], [97.2788980178293, 22.327274616130694], [97.27169130331106, 22.32907629543473], [97.25727787337519, 22.33448133064894], [97.24466612184409, 22.334120995687442], [97.23385604871771, 22.330517637978687], [97.20374181743097, 22.319198145677944], [97.20466885298526, 22.341250099612466], [97.20466885298526, 22.352498119192887], [97.2079118748332, 22.364028863141584], [97.20755153897238, 22.375919942951043], [97.20841433685223, 22.385842117219966], [97.21981776287953, 22.39352703364574], [97.22939792227635, 22.410996736710104], [97.23169174028163, 22.417878189826638], [97.2370990705657, 22.419880905379557], [97.25547619407115, 22.415917211809926], [97.27097063158942, 22.40871049729168], [97.28286171229826, 22.3979004241653], [97.29871648477803, 22.37303725696387], [97.30628353605641, 22.358623827028055], [97.30985728538548, 22.344686205903713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
