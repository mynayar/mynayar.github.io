
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Kar</div><div class="name-mm">ဆူးကား</div></div>
        <span class="pcode-badge">MMR010009067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05267411491855, 22.092828779924332], [96.0572014253056, 22.094293497646845], [96.0609463641834, 22.087394925035824], [96.06488840477613, 22.08424129220191], [96.06981595664115, 22.08305868011405], [96.07119567224254, 22.079510842051775], [96.07099856962833, 22.07458329108607], [96.07139277395743, 22.071035453023796], [96.0757290188792, 22.066699208102023], [96.07829134566913, 22.063939778697886], [96.07931082793243, 22.062136081315145], [96.07988237137442, 22.059163526075906], [96.080977864337, 22.055216757747246], [96.07921082871684, 22.053308361291897], [96.07901279620364, 22.0533983762341], [96.07113484839459, 22.05865034144017], [96.06517045555216, 22.05536992398288], [96.06514938083933, 22.055367395089263], [96.06427122343825, 22.058079419429703], [96.06332290542781, 22.061027010388273], [96.06212897627131, 22.064728187356025], [96.06035505813946, 22.071035453023796], [96.05680722007719, 22.078722434292956], [96.0546390976163, 22.08483259824584], [96.0530622811994, 22.092322476900847], [96.05267411491855, 22.092828779924332]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
