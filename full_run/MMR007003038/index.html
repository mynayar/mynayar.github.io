
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yit Kan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yit Kan Gyi</div><div class="name-mm">ရစ်ကန်ကြီး</div></div>
        <span class="pcode-badge">MMR007003038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65736848127045, 17.14759122525487], [96.65258131627479, 17.145539586582686], [96.64676832609746, 17.141094370808617], [96.64095534041667, 17.139726611693845], [96.63480041270896, 17.137333033692585], [96.62830354657149, 17.136307214806152], [96.62396413513676, 17.138979581742376], [96.61826882124916, 17.144420271478396], [96.62370545414348, 17.1572226307199], [96.62524750816601, 17.160314846153256], [96.628361881096, 17.17274293274022], [96.63502458311808, 17.16739828430343], [96.63537047406817, 17.167764522414814], [96.63558360799715, 17.167990192893114], [96.63939869309525, 17.172029696613265], [96.64274360273515, 17.181035224296238], [96.64706661773027, 17.18612112339116], [96.64709111526281, 17.18614994306546], [96.64718029383556, 17.186133560115763], [96.64724107631469, 17.18608725042634], [96.64926503925022, 17.184545183813213], [96.64889838475273, 17.176601020720568], [96.64885042660597, 17.17055840304789], [96.64851472587395, 17.16672181965629], [96.65153603515995, 17.16485148520792], [96.65450938719852, 17.16322093789603], [96.65561240478871, 17.16135060344766], [96.65676862357316, 17.158620643028314], [96.65736848127045, 17.14759122525487]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
