
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Hsar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Hsar</div><div class="name-mm">ကုန်းဆာ</div></div>
        <span class="pcode-badge">MMR015014034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.44512500501503, 22.23013729510012], [97.43994573920457, 22.227994151309076], [97.42528118977515, 22.22445443232624], [97.41692657520133, 22.2257076241076], [97.4151677081233, 22.225971453719637], [97.4151677081233, 22.23507358837543], [97.41719040481337, 22.243164374236528], [97.41668473041602, 22.25732324926861], [97.41567338162133, 22.264908360732306], [97.41415636022788, 22.271482124300633], [97.4131450123325, 22.277044539074268], [97.41263933793516, 22.285640999332713], [97.41870742710614, 22.29120341410635], [97.41870742710614, 22.301786450684176], [97.41870742710614, 22.303845266845656], [97.42224714608898, 22.306879311431146], [97.43488899792897, 22.304350941243], [97.45258759194388, 22.292720436399065], [97.45709332219911, 22.28844557200557], [97.44399113168544, 22.231028194995247], [97.44512500501503, 22.23013729510012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
