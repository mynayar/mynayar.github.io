
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Soe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Soe</div><div class="name-mm">ကျောင်းစိုး</div></div>
        <span class="pcode-badge">MMR007006007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.64561492938554, 18.23574017566864], [96.64389523677579, 18.234095252693805], [96.63674480632778, 18.227255709783208], [96.6299052616186, 18.222592385030566], [96.61995683613912, 18.21699639496768], [96.61218077612199, 18.212136357906616], [96.61030435596132, 18.220277792686034], [96.60755938405839, 18.224199183045926], [96.60520654984248, 18.23086554440937], [96.59618735516239, 18.23478693297062], [96.59568685816203, 18.23478693297062], [96.59649566434348, 18.23554518825989], [96.60151726640879, 18.239882025834902], [96.60214497700912, 18.240424139862228], [96.6080510757966, 18.245816666406085], [96.61472753564732, 18.249154895881816], [96.61839440437831, 18.250784615817395], [96.61849625439868, 18.25082988229326], [96.61932355064141, 18.247727518010606], [96.62598991290423, 18.24733537942427], [96.62954769836762, 18.247011943646328], [96.63030344095108, 18.246943239938616], [96.6381462189729, 18.24419826713637], [96.64285188560609, 18.23988473908946], [96.64561492938554, 18.23574017566864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
