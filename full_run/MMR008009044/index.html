
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Kaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Kaw</div><div class="name-mm">သဲကော</div></div>
        <span class="pcode-badge">MMR008009044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6617784438202, 17.968882083141693], [95.66354227515592, 17.968610725304757], [95.6673412956643, 17.966304177395898], [95.66991920320874, 17.96169107977954], [95.67303982732625, 17.954635756235234], [95.67474111441095, 17.948681252337963], [95.67602477162598, 17.944188448937837], [95.67521069631664, 17.941881901028978], [95.67168303364514, 17.942424617602057], [95.66299955768352, 17.941339183556522], [95.65607991395694, 17.940389429328775], [95.65350200731183, 17.940796466983443], [95.64658236178661, 17.9436457323647], [95.6384416032974, 17.94581660135509], [95.63369282766195, 17.94730907305535], [95.62867269329024, 17.946494997746015], [95.62378823783695, 17.942560298319165], [95.6208316608525, 17.93943624508671], [95.62189149209877, 17.947120017574775], [95.62295132244566, 17.96434226588292], [95.62812997581779, 17.962776514724453], [95.63613505538854, 17.961148363206462], [95.64414013406002, 17.959113173134483], [95.64821051420392, 17.959113173134483], [95.65119545760433, 17.960334286997806], [95.65635127179382, 17.965218741551723], [95.65865781970268, 17.9675252903599], [95.6617784438202, 17.968882083141693]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
