
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Khat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Khat</div><div class="name-mm">ကြခတ်</div></div>
        <span class="pcode-badge">MMR009025012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.20621183031176, 21.193343801875017], [94.20819452875458, 21.195822175153296], [94.21480352506268, 21.201109372199824], [94.2209719210174, 21.20287177091552], [94.22673555190426, 21.202322854416252], [94.23022451584876, 21.201990572007333], [94.25005150387386, 21.198906373130683], [94.26107779470453, 21.19614980087266], [94.26282889613668, 21.17863878475214], [94.26854308409611, 21.147430529095686], [94.24476430682734, 21.151321602410064], [94.22625911806392, 21.15528699929564], [94.2103975269244, 21.15616819910315], [94.19641512855537, 21.156990692966133], [94.19635592978238, 21.159477073807977], [94.19629833629926, 21.161895994704423], [94.19762013466152, 21.17379218805911], [94.20158553334574, 21.18656958122125], [94.20466973132312, 21.191416177914334], [94.20621183031176, 21.193343801875017]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
