
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Hsawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Hsawt</div><div class="name-mm">ကုန်းဆော့</div></div>
        <span class="pcode-badge">MMR015014047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.36288475762552, 22.466364415785222], [97.36034091010498, 22.46754242424356], [97.33760776738461, 22.46653949220388], [97.31052858342747, 22.465202247985417], [97.29023099366549, 22.515851642039706], [97.29467847123453, 22.52048939726791], [97.30942810462341, 22.52704478858618], [97.31500018890767, 22.533600181703093], [97.31671738679802, 22.5386830887536], [97.32319443007896, 22.557855134706756], [97.32667123878667, 22.571762371336433], [97.33138867125024, 22.565393836656312], [97.3382718330787, 22.553594129765315], [97.34154953008681, 22.5424499620961], [97.35007153996963, 22.53884449637644], [97.3717043369856, 22.53720564832207], [97.38120965570113, 22.53655010910029], [97.38514289193097, 22.530322485594297], [97.38710950959626, 22.51524508169524], [97.39595928998932, 22.511311847263983], [97.4041535311606, 22.51262292480817], [97.40576537167465, 22.511863652385728], [97.38106818604803, 22.48058054975263], [97.36288475762552, 22.466364415785222]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
