
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Hpyu Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Hpyu Chaung</div><div class="name-mm">သဲဖြူချောင်း</div></div>
        <span class="pcode-badge">MMR012002060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00023531790566, 20.35535245355294], [92.9942663888828, 20.360981503593564], [92.99192285725411, 20.36633155155988], [92.99145946987869, 20.367389419586118], [92.99007996471863, 20.37169288511859], [92.98936911719107, 20.373910426225223], [92.98893078582716, 20.375597655107754], [92.98666112001473, 20.384334070560953], [92.9866540036794, 20.384383519783682], [92.98663857491039, 20.38449073156204], [92.9861064046869, 20.38818852168299], [92.98272195005802, 20.401322834181485], [92.98948807321608, 20.40770303486721], [92.99625475305447, 20.414082970252935], [93.00003637258061, 20.405451707130624], [93.00222561292173, 20.397794491622562], [93.00620518042479, 20.383873302011352], [93.00640363921661, 20.370926292214676], [93.00614339610092, 20.36745144942489], [93.00609403591108, 20.366792377666172], [93.00604311989412, 20.366112461420983], [93.0052092397147, 20.3549770999133], [93.00023531790566, 20.35535245355294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
