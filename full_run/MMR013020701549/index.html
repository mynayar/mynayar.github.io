
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (135) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (135) Ward</div><div class="name-mm">အမှတ် (၁၃၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701549</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.22166728991357, 16.93252595271059], [96.22276115420397, 16.93233135740627], [96.22474288857353, 16.93172645541165], [96.22580039956887, 16.93134101857322], [96.22509574926949, 16.929716803387805], [96.22451452732366, 16.92889907143507], [96.2234334945602, 16.927958487594196], [96.2226955405668, 16.9274044035904], [96.22235679742829, 16.92695236206191], [96.22192226659939, 16.926466335153293], [96.21966266689861, 16.925321579127626], [96.21814091956782, 16.924710591420705], [96.21786308301495, 16.925130843713532], [96.21706858504723, 16.92631964223773], [96.21596717814282, 16.927192687892273], [96.21486309575533, 16.927982057925703], [96.21407127417001, 16.92877388041029], [96.21349521343342, 16.92930084985437], [96.21935964842908, 16.932550448444488], [96.22124671926076, 16.93258380969513], [96.22166728991357, 16.93252595271059]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
