
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyo</div><div class="name-mm">ဂျို</div></div>
        <span class="pcode-badge">MMR010021003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67400781980513, 21.777847444903728], [95.67153246285295, 21.779951498762728], [95.66684173036163, 21.783469548580854], [95.66361684963795, 21.7869875992983], [95.659805629826, 21.792264672676538], [95.65921928803976, 21.795489553400216], [95.65775343357416, 21.800766626778454], [95.65423538375603, 21.804577848389044], [95.65833977625971, 21.806630043741563], [95.66478953410979, 21.808389069100315], [95.66977343839352, 21.809561751773458], [95.67079664025283, 21.809468733994947], [95.6762231962436, 21.808975410886546], [95.6806207587411, 21.807216386427115], [95.6841388076599, 21.806043701955332], [95.68736368838358, 21.80428467659658], [95.68853637105673, 21.79959394410531], [95.69146807908862, 21.793144186255233], [95.69527929979989, 21.7881602819715], [95.69909052141048, 21.784055890367085], [95.70120177164449, 21.779641454789385], [95.69909052141048, 21.780244669655815], [95.69527929979989, 21.78053783964964], [95.68912271284296, 21.78053783964964], [95.68296612498676, 21.779951498762728], [95.67534368356422, 21.779071986083352], [95.67400781980513, 21.777847444903728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
