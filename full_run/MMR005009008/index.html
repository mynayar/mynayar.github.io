
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nay Pu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nay Pu Kone</div><div class="name-mm">နေပူကုန်း</div></div>
        <span class="pcode-badge">MMR005009008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23178999970878, 22.811232690136592], [95.23072619975437, 22.816551060383176], [95.2261473600127, 22.823877150010503], [95.22004211984802, 22.83120323963783], [95.22248436016514, 22.836697830240723], [95.22004211984802, 22.841276669982392], [95.21637048021353, 22.843511819814694], [95.22004211984802, 22.844939759762156], [95.22858960032983, 22.844939759762156], [95.23347335970783, 22.843413450170658], [95.23896804024292, 22.840666200284943], [95.24476800014315, 22.840971479650136], [95.24843099999072, 22.843108259838345], [95.25122495976416, 22.845343319738447], [95.25300983973239, 22.84677125968591], [95.25423095989095, 22.83883461042899], [95.25663683971845, 22.8334880698186], [95.2569781198444, 22.832729550128704], [95.25632147985249, 22.832685809802342], [95.25239928010274, 22.83242426986419], [95.2469045995677, 22.828150710387035], [95.24568384003726, 22.82326668031311], [95.24782044036107, 22.817772089710218], [95.24171555992518, 22.812277500006644], [95.23178999970878, 22.811232690136592]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
