
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Ma Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Ma Ngu</div><div class="name-mm">ပျဉ်းမငူ</div></div>
        <span class="pcode-badge">MMR007001051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.43749319555457, 17.16623509397448], [96.43514612689228, 17.162332021006023], [96.43157774471723, 17.15804996203616], [96.42836620093948, 17.154838418258464], [96.42229995178138, 17.14948584499581], [96.41873156870702, 17.147701653908257], [96.41440477386129, 17.14306580164549], [96.41256241192582, 17.143986982613228], [96.41106266021364, 17.144736858918975], [96.40875017408132, 17.147820172862737], [96.40875017408132, 17.154372216904335], [96.40566686013756, 17.160153431335857], [96.40335437400523, 17.166705473578816], [96.40065647441679, 17.167090888833513], [96.39641691560826, 17.171330445843466], [96.39490941893462, 17.174819625625275], [96.39946230604068, 17.177096069627964], [96.40731274628627, 17.178523423217484], [96.41302215794627, 17.179237099112868], [96.42194311338403, 17.178523423217484], [96.42707908403258, 17.175670106390328], [96.42836620093948, 17.17495504104238], [96.43407561259949, 17.169602466880406], [96.43749319555457, 17.16623509397448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
