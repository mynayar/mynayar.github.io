
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Taw Ka Lay (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Taw Ka Lay (South) Ward</div><div class="name-mm">ကန်တော်ကလေး (တောင်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16757371725333, 16.78354284522618], [96.16693306001275, 16.78355979924538], [96.16653823874879, 16.78358268699145], [96.16573333742366, 16.783601760712713], [96.16536140480503, 16.783620834434032], [96.16477012664006, 16.783639908155294], [96.16406249958476, 16.78366088843927], [96.16285133402192, 16.783720016165887], [96.16210568722772, 16.78371721927431], [96.16209983803714, 16.784004211824993], [96.1621723170988, 16.785383224156533], [96.16217994694705, 16.785827636736087], [96.16223686324071, 16.78665804103582], [96.16428375259318, 16.786592483156596], [96.16492826342869, 16.78659283029492], [96.16620318103202, 16.786550521689264], [96.16647021043195, 16.786540348558276], [96.16767252396784, 16.786501810809966], [96.16764259363083, 16.78553390556533], [96.16758918739117, 16.78390884411789], [96.16757371725333, 16.78354284522618]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
