
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Set Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mrauk-U</div><div class="name-mm">မြောက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Set Thar</div><div class="name-mm">စက်သား</div></div>
        <span class="pcode-badge">MMR012003044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.0811386106584, 20.4955325121158], [93.0877895036827, 20.49526260218738], [93.09103150480018, 20.495662822980933], [93.09140048944107, 20.49570837364257], [93.09146583328163, 20.49570037237436], [93.09415971110184, 20.49249470656548], [93.0992785622559, 20.491171373060467], [93.09843480302379, 20.49001223597594], [93.0980144284232, 20.486769805881863], [93.09801293285062, 20.4824821081628], [93.09907079997748, 20.473795425218725], [93.0988575806129, 20.47305264096667], [93.09890773130684, 20.468948839317534], [93.09939205310081, 20.466525561205742], [93.09966612509163, 20.465154257862764], [93.09962089458867, 20.46375955865676], [93.09952882469554, 20.460920413346457], [93.10004683869073, 20.45685469798599], [93.10096055168816, 20.45342827379585], [93.10240726408404, 20.44962113600667], [93.10270020744866, 20.449022877304003], [93.09681753959785, 20.44952286708667], [93.0928563983042, 20.449525026358913], [93.08946113202569, 20.449526805217943], [93.08620770771961, 20.450195139094433], [93.07630625293126, 20.453133208031204], [93.0737605078412, 20.45473436639793], [93.07465874080827, 20.456249530691366], [93.07715875177502, 20.460466438275546], [93.07758633534115, 20.46203496743982], [93.07857619213763, 20.4656659927914], [93.07886154432487, 20.470332698994923], [93.07900719492619, 20.47846625211588], [93.08042715878639, 20.48806592859978], [93.0811386106584, 20.4955325121158]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
