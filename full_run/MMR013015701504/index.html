
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyar Yay Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pyar Yay Kone Ward</div><div class="name-mm">ပျားရည်ကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1730689247911, 16.79900772292814], [96.1730899824168, 16.799371719029637], [96.17312481136099, 16.799603918586], [96.1731300364221, 16.799638748429572], [96.17313791538254, 16.799685160641673], [96.17317644773493, 16.799912135136992], [96.17322002258601, 16.80012414491341], [96.17324256858973, 16.800233840619285], [96.17341995266872, 16.80086898861299], [96.17352267683015, 16.801260539042687], [96.1735820338838, 16.801404133793767], [96.17366568342459, 16.80160649744198], [96.1737760976888, 16.80173259318468], [96.17384698674908, 16.80181354925594], [96.1740818024333, 16.801952362311738], [96.17444419864091, 16.802173614420838], [96.1748540286905, 16.802421731078084], [96.17505912807638, 16.802084732624337], [96.17514228838598, 16.80165290875476], [96.17522239729584, 16.80125999495283], [96.17530250530643, 16.80097007780688], [96.17537212362464, 16.800722122128263], [96.1754296667458, 16.80057892038093], [96.17551532537203, 16.800365749579726], [96.17437616942476, 16.799882253363364], [96.17399152129173, 16.799866994566173], [96.17376403778019, 16.799254989726023], [96.17371265681373, 16.79894799355509], [96.1730689247911, 16.79900772292814]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
