
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shaw Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shaw Hpyu</div><div class="name-mm">ရှော်ဖြူ</div></div>
        <span class="pcode-badge">MMR005009061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30790696023809, 22.720951080028385], [95.31548531959186, 22.71978521961222], [95.31818783989695, 22.718375189663334], [95.31822672028699, 22.718354939628796], [95.318242919775, 22.718374290341274], [95.31964115961188, 22.719034800115992], [95.32025927984193, 22.719278340123367], [95.3216096397731, 22.719081150274917], [95.32310687967879, 22.718862540374005], [95.32458288029574, 22.71661569036189], [95.32559772025866, 22.71210669017165], [95.32582441596406, 22.71169314412333], [95.3189970660618, 22.711960883088352], [95.31806369028715, 22.70962744455096], [95.31614202703298, 22.707207572171797], [95.31574863659034, 22.706712191414567], [95.3117634060564, 22.70169375136561], [95.30952694501258, 22.70045127320776], [95.3088413747297, 22.70007040132799], [95.30546312002701, 22.698193591760912], [95.30149627433366, 22.701227064377576], [95.29770677764571, 22.707384994022334], [95.29497721292807, 22.707364691827138], [95.29442252907654, 22.707394818216358], [95.29442279977246, 22.7118485703553], [95.29350695987836, 22.719174749914828], [95.29564391993102, 22.71978521961222], [95.3048012396855, 22.719479940247084], [95.30790696023809, 22.720951080028385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
