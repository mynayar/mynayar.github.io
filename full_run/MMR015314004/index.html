
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Lu</div><div class="name-mm">စ လူ</div></div>
        <span class="pcode-badge">MMR015314004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.00854999508624, 22.305560946680373], [98.93911802807457, 22.345094565561794], [98.93911802807457, 22.4096969312684], [99.01591638513315, 22.447298827079237], [99.01759424397926, 22.446862928381506], [99.02646008716334, 22.43759317718343], [99.02686406172711, 22.42993650576517], [99.0300877922179, 22.424291821910117], [99.03895359493254, 22.41985893674058], [99.04370968655286, 22.416089944595342], [99.04540358930427, 22.40978387412656], [99.04782202276817, 22.405350944890245], [99.04943261682189, 22.40252860341235], [99.05104576944677, 22.397691749075022], [99.05185108985597, 22.39325880814755], [99.0490313582107, 22.38842192323324], [99.04016311563532, 22.379555971231127], [99.03814865583587, 22.37632968396781], [99.03976179856824, 22.372704591443778], [99.04338945326072, 22.365850693554705], [99.04459871585811, 22.35779010512931], [99.04540405964968, 22.35053735611416], [99.05024091938299, 22.342878170191455], [99.050240969745, 22.336430711008575], [99.05066143157984, 22.33634932236339], [99.03464064694833, 22.329498247446224], [99.02678842604507, 22.31617326428477], [99.00854999508624, 22.305560946680373]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
