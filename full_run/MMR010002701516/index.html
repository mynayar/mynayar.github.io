
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Ri Hay Mar (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanayethazan</div><div class="name-mm">ချမ်းအေးသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thi Ri Hay Mar (West) Ward</div><div class="name-mm">သီရိဟေမာ (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010002701516</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06897606830546, 21.983913430297775], [96.06870774526413, 21.977540651484674], [96.06713525126605, 21.977726650500188], [96.06546606806603, 21.977979519879625], [96.06465225286001, 21.978349947831077], [96.06295018077321, 21.978727880334304], [96.06294654162326, 21.978743520979208], [96.063186111172, 21.979151572798003], [96.06141292730933, 21.980354610404277], [96.06103278880425, 21.98064963830518], [96.05894502784139, 21.980695837541475], [96.05819635973455, 21.98068651079018], [96.0584444185443, 21.981614500582225], [96.05867284680085, 21.982299785351927], [96.05901548918575, 21.982870855993383], [96.05925819420838, 21.983370542804607], [96.0593866851026, 21.98384167608384], [96.059529452763, 21.984412746725127], [96.06019403894607, 21.984378386970945], [96.06165519320592, 21.984283748493453], [96.06195750986825, 21.984162665784083], [96.06578357675062, 21.98404894951142], [96.06897606830546, 21.983913430297775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
