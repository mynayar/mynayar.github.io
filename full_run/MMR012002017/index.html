
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doe Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doe Tan</div><div class="name-mm">ဒိုးတန်း</div></div>
        <span class="pcode-badge">MMR012002017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.92861957393427, 20.39442873210038], [92.9277968696299, 20.393990888169014], [92.9223188931025, 20.39276822207586], [92.92230093094327, 20.393450769737285], [92.92076298322513, 20.39674637404596], [92.91930281067624, 20.399875315093766], [92.91776157773467, 20.402391344784803], [92.9137348713673, 20.408964855643603], [92.91032608018452, 20.416115004603853], [92.9122615947968, 20.41650019772601], [92.91504747596031, 20.417627398985303], [92.92320743767317, 20.418757006830447], [92.93355671976684, 20.420449992273348], [92.93853266594982, 20.420639455146784], [92.94296470036068, 20.418484914247472], [92.94470401078155, 20.41763933568683], [92.94510268384187, 20.415950730841587], [92.94984044188294, 20.413719279920883], [92.95145723856075, 20.41295771422716], [92.95057747497054, 20.411058240845193], [92.94531410815961, 20.408050358437322], [92.93599039404148, 20.40459124119286], [92.92982472483124, 20.401583342597235], [92.92817054243665, 20.399628247045996], [92.92832098372645, 20.396319670016794], [92.92861957393427, 20.39442873210038]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
