
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Yay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Yay</div><div class="name-mm">ကွန်ရေး</div></div>
        <span class="pcode-badge">MMR015005046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.61682735329975, 22.413008115432206], [98.62165874785302, 22.410718640253094], [98.62578644718684, 22.411897983305323], [98.63168315975008, 22.417942113637707], [98.63468315870085, 22.42140877979142], [98.64229724272366, 22.403642584637623], [98.64916947059464, 22.39269792526909], [98.64554377192758, 22.390884898319428], [98.62991859007093, 22.385415484237285], [98.61573586321958, 22.387830939146568], [98.61441791215697, 22.385696697744436], [98.61369394531937, 22.38846480830432], [98.61272312537199, 22.392005446394307], [98.61249469667297, 22.393832872389225], [98.61209494712415, 22.39531765578522], [98.61280465521071, 22.39642953079823], [98.61363683836947, 22.397733284263722], [98.61517872871542, 22.400303102406326], [98.61654929821162, 22.401559458002623], [98.61712037040883, 22.404414810894878], [98.61740590425916, 22.407327271636348], [98.61717747556008, 22.409268912430434], [98.61689194081049, 22.412181371373265], [98.61682735329975, 22.413008115432206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
