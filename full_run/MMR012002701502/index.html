
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thit Ward</div><div class="name-mm">မြို့သစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012002701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00932712834435, 20.33272220676446], [93.00883985677405, 20.332429546686285], [93.00887748800574, 20.33237313850958], [93.00872142595313, 20.332215824600667], [93.00815385301797, 20.33173390129855], [93.00718406189498, 20.33081614764717], [93.00700082952471, 20.331080159821568], [93.00681350523911, 20.33132242638891], [93.00671515448084, 20.331559761074175], [93.00627069243859, 20.331949719703857], [93.00672012503378, 20.332280226851026], [93.00610477831293, 20.333090616738616], [93.00591707631207, 20.3333986264455], [93.00575954116994, 20.33371920687597], [93.00567909771223, 20.33398321365445], [93.00562993807125, 20.33425560121509], [93.00567909771223, 20.33451541715283], [93.00576401080053, 20.334716564018265], [93.00555778816147, 20.33565537889268], [93.00612991706208, 20.33588782216532], [93.00635113589624, 20.336000966771223], [93.0069306940963, 20.336599277634605], [93.00743296815699, 20.337188396527324], [93.00775219420848, 20.336269159893845], [93.00708406627672, 20.336063823986365], [93.00721813810662, 20.335229906934728], [93.00775706403732, 20.335136531226], [93.00787609020944, 20.334578166449262], [93.00848669660382, 20.334627316197725], [93.0089560527797, 20.332918802161032], [93.00915939668886, 20.33301937604341], [93.00932712834435, 20.33272220676446]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
