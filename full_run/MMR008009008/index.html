
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Win</div><div class="name-mm">ညောင်ဝင်း</div></div>
        <span class="pcode-badge">MMR008009008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6743531100081, 18.021043206978447], [95.67700268722427, 18.027137234395923], [95.6783274749331, 18.02978680981346], [95.68389158582806, 18.034026132999713], [95.68733603602931, 18.03667571021589], [95.68686541091006, 18.03775136593282], [95.69759666025772, 18.03225484628416], [95.69812939705412, 18.03222821555977], [95.7034561543781, 18.031961950583593], [95.71107355240258, 18.02844622101634], [95.71664008157455, 18.02756734685562], [95.71642276939536, 18.024000942289717], [95.71452084895805, 18.017751772826102], [95.7107170071842, 18.01258941606875], [95.70283761956057, 18.006883653857585], [95.69468653055901, 18.00253640573061], [95.68979587697822, 18.001721297100232], [95.68680714473402, 18.002808108907175], [95.68218819432974, 18.011502605161127], [95.68071054795348, 18.013402434674674], [95.67838435165658, 18.01639325784265], [95.6743531100081, 18.021043206978447]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
