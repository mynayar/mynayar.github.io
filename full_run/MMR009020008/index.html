
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Bay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Bay</div><div class="name-mm">စဘေ</div></div>
        <span class="pcode-badge">MMR009020008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93585365801994, 21.55969166743654], [94.91100842779679, 21.570264104604803], [94.91207607055429, 21.57162831589409], [94.91121922079049, 21.579982603114672], [94.91132938234517, 21.587914163108167], [94.91277105404095, 21.587981218358607], [94.9222667913794, 21.587981218358607], [94.93131034959299, 21.594085620355145], [94.93402341804637, 21.597476954797685], [94.93780907103184, 21.600335509276363], [94.93944955315442, 21.599059578137087], [94.94939746781893, 21.595894332357602], [94.95437142560087, 21.591824730127257], [94.95708449315487, 21.583459437902775], [94.95776276004341, 21.572381079023614], [94.95911929382044, 21.56537231967684], [94.95978475526232, 21.566007533321056], [94.9593188506845, 21.565130536944764], [94.95856018170707, 21.563702454005124], [94.95127695736574, 21.563488240889683], [94.9364962946683, 21.55941820428677], [94.93585365801994, 21.55969166743654]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
