
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lat Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lat Lel</div><div class="name-mm">အလပ်လယ်</div></div>
        <span class="pcode-badge">MMR009015043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0311133052349, 19.117423795971433], [95.03131952607532, 19.117099733366047], [95.03726765018195, 19.117099733366047], [95.03888986527511, 19.120344163552375], [95.04024171088633, 19.125751548695064], [95.04024171088633, 19.13142930242043], [95.04240466494338, 19.137107056145794], [95.0437565105546, 19.13872927213822], [95.04889352711467, 19.138188533174343], [95.05835644999024, 19.135214471570634], [95.06213800026853, 19.13545081880028], [95.06484531126216, 19.12412933270258], [95.06517488131578, 19.124080507609392], [95.06349346475167, 19.121425640580924], [95.06133051069457, 19.116288624920173], [95.05808608140757, 19.10952939506558], [95.0551120189046, 19.104662747987504], [95.05376017329343, 19.100607210254623], [95.05394176440097, 19.099553980032226], [95.05376017329343, 19.099796101808693], [95.05051574220778, 19.106825702044546], [95.04727131112219, 19.110340501712813], [95.04240466494338, 19.11358493279846], [95.03699727980069, 19.11466640982701], [95.03267137258581, 19.115207147891624], [95.03095885206943, 19.117164314581487], [95.0311133052349, 19.117423795971433]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
