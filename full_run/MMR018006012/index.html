
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Tha Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Tha Ye</div><div class="name-mm">နတ်သရဲ</div></div>
        <span class="pcode-badge">MMR018006012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2504400807452, 19.671903093153276], [96.24799888184299, 19.67413136407123], [96.245957877654, 19.675077217939304], [96.2421362257063, 19.676465721715715], [96.2420480516763, 19.67646929022561], [96.24249936925054, 19.68063142460062], [96.24278490400019, 19.683522469786226], [96.24303474825507, 19.685985211948037], [96.24357012636028, 19.69080362119024], [96.24391163041747, 19.693911419176686], [96.24399842938408, 19.694801114879624], [96.24410550536481, 19.695586337239718], [96.24424827273964, 19.697763543752615], [96.24449811609526, 19.699726599203245], [96.24451099438693, 19.69986826400924], [96.2448478183722, 19.69996094274336], [96.24506794183213, 19.69994394016078], [96.24752160443853, 19.699401551840197], [96.25317794350735, 19.69821346198171], [96.256713880841, 19.697448781935805], [96.25736383167555, 19.69730822419524], [96.26047751662418, 19.696658488298624], [96.26127134189898, 19.693483186300057], [96.2616321723869, 19.692039867046276], [96.26105484360619, 19.684245943795304], [96.25730221462555, 19.67702934842572], [96.25499290399938, 19.673854046427152], [96.25270802075863, 19.671703567765462], [96.2504400807452, 19.671903093153276]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
