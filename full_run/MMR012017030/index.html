
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Khon (Ta Khun Taing)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gwa</div><div class="name-mm">ဂွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Khon (Ta Khun Taing)</div><div class="name-mm">ကိုင်းခုံ (တံခွန်တိုင်)</div></div>
        <span class="pcode-badge">MMR012017030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.50114339095478, 17.957089030334544], [94.5073677499218, 17.9547543983968], [94.51067438891198, 17.953002939034434], [94.51398095865437, 17.95125142841073], [94.51792922705226, 17.94686080508211], [94.51923441763432, 17.944125724822413], [94.5165481417834, 17.940695204220333], [94.51467592055735, 17.937641499555582], [94.51397962765776, 17.93792229937469], [94.50918197926501, 17.93706557641525], [94.50237664116912, 17.936834886820634], [94.50185758935635, 17.93804600741737], [94.50260732986442, 17.94058359115985], [94.50321767005948, 17.942894160836886], [94.50262073965547, 17.943967264277887], [94.50260767160682, 17.94712144839616], [94.50192932288002, 17.95142080582559], [94.50144175903, 17.954806664296143], [94.50149012187171, 17.955832316808028], [94.50114339095478, 17.957089030334544]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
