
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (18) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlaingtharya (West)</div><div class="name-mm">လှိုင်သာယာ (အနောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (18) Ward</div><div class="name-mm">အမှတ် (၁၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013047701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05144427403405, 16.888775018852073], [96.04885101326369, 16.88977241556455], [96.04790306127734, 16.890130996848086], [96.04739952097117, 16.890333175235924], [96.04594039972972, 16.89091110206573], [96.0443592072117, 16.89150238023069], [96.0434023537357, 16.891902923880878], [96.04289563522542, 16.89227263157676], [96.04273986815048, 16.892648061658747], [96.04304542540609, 16.892959213596896], [96.04326057471582, 16.893292426804123], [96.04341316178807, 16.893640518395273], [96.04380226156519, 16.894582747995457], [96.04391860955627, 16.894859314705684], [96.04443931612161, 16.896120071584107], [96.04487503855222, 16.897163179037534], [96.04649925283832, 16.896572113112597], [96.0480403895524, 16.895971299435985], [96.04894828843283, 16.89561271635381], [96.0510311128956, 16.894819259801068], [96.05160903972546, 16.894592285305748], [96.05301094070239, 16.894060134867402], [96.05355771411729, 16.893858380060237], [96.0531921388062, 16.892963409833555], [96.05260149556261, 16.891510645899643], [96.05218982729878, 16.8904577888959], [96.05144427403405, 16.888775018852073]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
