
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Ran Dam</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Machanbaw</div><div class="name-mm">မချမ်းဘော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Ran Dam</div><div class="name-mm">ထရန်ဒမ်း</div></div>
        <span class="pcode-badge">MMR001016003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.53109109867535, 27.381822203332092], [97.53186223675289, 27.386064217289857], [97.53409163542068, 27.39444964083833], [97.54430620176987, 27.408985753589718], [97.5596280512936, 27.427450546605485], [97.57809284430937, 27.454558435123715], [97.58150427230436, 27.459281950601564], [97.58241439071162, 27.456915641843466], [97.58791454182273, 27.44591533962125], [97.59380756087029, 27.431772093907057], [97.59577190055285, 27.41487877263728], [97.59695050526165, 27.396021111685002], [97.59262895796007, 27.381484998933615], [97.58516446716646, 27.367734621155876], [97.57769997637286, 27.36066299829878], [97.56797962166229, 27.35691292609073], [97.5621785466027, 27.35642809797838], [97.56200360418302, 27.357958849321506], [97.55944654112506, 27.359493086436828], [97.5573747117736, 27.360736183328243], [97.54959817601508, 27.366290851341773], [97.54404350800155, 27.371660365133778], [97.5395555420547, 27.377740835271368], [97.53830368396791, 27.3794369008923], [97.53311932619602, 27.381288459295035], [97.53109109867535, 27.381822203332092]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
