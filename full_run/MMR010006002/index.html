
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Taw</div><div class="name-mm">ယဉ်တော်</div></div>
        <span class="pcode-badge">MMR010006002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03628063684198, 21.93494680435157], [96.0531666583147, 21.92674431729648], [96.05314809720699, 21.926503885346108], [96.05199919081008, 21.924846387151092], [96.05086595509982, 21.92321149611371], [96.0481521653902, 21.918410175789006], [96.04470774126929, 21.914235116357588], [96.03865390275547, 21.91079069133741], [96.03249187759815, 21.908989484177425], [96.03186942893103, 21.908807536938355], [96.02310180160691, 21.907868148296473], [96.01537794003997, 21.907868148296473], [96.00802460185395, 21.908985110774267], [96.00844378305419, 21.910438272208523], [96.00995665587504, 21.91497688797307], [96.01268191643737, 21.920919866158954], [96.01274282662018, 21.92105273919259], [96.02045620209213, 21.927038283190257], [96.02239040639222, 21.9283324094132], [96.02329712895937, 21.92876418202144], [96.03628063684198, 21.93494680435157]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
