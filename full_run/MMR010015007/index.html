
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwar Shar Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwar Shar Yoe</div><div class="name-mm">နွားရှာရိုး</div></div>
        <span class="pcode-badge">MMR010015007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0252165699888, 21.401924543383018], [96.02985917795877, 21.400559070344855], [96.0391518996405, 21.40247227817315], [96.04735135957765, 21.40301890859581], [96.05309098216316, 21.400832386005845], [96.05883060474866, 21.395639393843], [96.06126594456777, 21.394758223713097], [96.07182361756594, 21.389396235447975], [96.06404102487346, 21.3906250645951], [96.05933050729715, 21.390829869902632], [96.05803002736394, 21.389776733209715], [96.05400668805828, 21.3865186036507], [96.05277674285247, 21.37587909684288], [96.05011427565336, 21.371168578367246], [96.04595330320245, 21.37192295128324], [96.045542848124, 21.371633811151526], [96.04110285021642, 21.36850611386609], [96.03199583404057, 21.36983278565458], [96.03059154176628, 21.370458768657272], [96.02895923627977, 21.372800849679493], [96.02863575373709, 21.372998139352717], [96.02479325190711, 21.375341063939004], [96.0242562127541, 21.380470392194866], [96.02411955537326, 21.38361351914864], [96.02507615883769, 21.387166618244862], [96.02343626667044, 21.393042898211206], [96.0242562127541, 21.399875781642038], [96.0252165699888, 21.401924543383018]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
