
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (6) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pazundaung</div><div class="name-mm">ပုဇွန်တောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (6) Ward</div><div class="name-mm">အမှတ် (၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013016701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17677688624434, 16.780401230032794], [96.17607180337109, 16.780271529807294], [96.1757373805757, 16.78021812356758], [96.17493248014989, 16.780067297367907], [96.17486572257508, 16.78055572456708], [96.1748462684406, 16.78083381742681], [96.17503395155569, 16.780890705841443], [96.17511558571579, 16.78091545068753], [96.17500559503225, 16.78152084371203], [96.1746883393954, 16.7814915977591], [96.1746896110368, 16.782134373802364], [96.17494010909883, 16.782510757165767], [96.1750920612497, 16.783002853598873], [96.1760005950515, 16.78312110905199], [96.17655563323592, 16.78316084559657], [96.17652416236024, 16.782587051151552], [96.17653465295194, 16.78202819894227], [96.17654991174908, 16.781618118881113], [96.17658615083025, 16.78123855641428], [96.17664146543132, 16.78080024843274], [96.17677688624434, 16.780401230032794]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
