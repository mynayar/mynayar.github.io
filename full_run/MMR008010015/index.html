
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Pin</div><div class="name-mm">မကျီးပင်</div></div>
        <span class="pcode-badge">MMR008010015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66545306830454, 18.084077996802137], [95.66528671261176, 18.09021433372459], [95.66455806300428, 18.092157399044765], [95.65897175144522, 18.09652929579039], [95.65848598444069, 18.10090119343539], [95.66140058197135, 18.109159219922105], [95.6611576993684, 18.11255958355798], [95.66552959611403, 18.112316700955034], [95.6696586102567, 18.112316700955034], [95.67257320778737, 18.111345168744606], [95.6745162731076, 18.1103736356348], [95.6757306888203, 18.11183093484982], [95.67628982611467, 18.112130472943022], [95.67795549644904, 18.105340196692794], [95.67952594026997, 18.098987035923017], [95.6796687076448, 18.097630743164302], [95.67991855100041, 18.097059672765738], [95.68057997988222, 18.094126377430428], [95.67961681856139, 18.093614698259785], [95.67087302507014, 18.08559955437596], [95.66545306830454, 18.084077996802137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
