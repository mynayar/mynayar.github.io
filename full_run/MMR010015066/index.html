
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Khaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thi Khaung</div><div class="name-mm">သီခေါင်</div></div>
        <span class="pcode-badge">MMR010015066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2100522812878, 21.420690447406287], [96.21189907598165, 21.416527988376004], [96.21617064705777, 21.412256417299886], [96.21865091430828, 21.409500565398844], [96.21865091430828, 21.40591795684827], [96.21865091430828, 21.398339363670743], [96.21699516799265, 21.397256760690993], [96.21506830575777, 21.395996888745458], [96.21369037980725, 21.396548059845145], [96.20941880873107, 21.397099230045455], [96.20528502998019, 21.396961437720222], [96.20115125212862, 21.396961437720222], [96.19701747427706, 21.39944170497074], [96.19439941380199, 21.40013066839566], [96.19453720702654, 21.403299898171838], [96.19412382915147, 21.407295882798792], [96.19329707340125, 21.412669795174963], [96.19378943423504, 21.413435690205006], [96.19453720702654, 21.41459889222517], [96.19715526570303, 21.41446109900056], [96.1979820223525, 21.417354744126214], [96.19839540022758, 21.42024838925181], [96.19963553295355, 21.419697218152123], [96.20115125212862, 21.419283841176366], [96.2035305129229, 21.421994800719517], [96.2100522812878, 21.420690447406287]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
