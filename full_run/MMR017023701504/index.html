
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward (Ma Gyi Tan Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward (Ma Gyi Tan Ward)</div><div class="name-mm">ရပ်ကွက် (၄)မကျီးတန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68097084682717, 16.292882450464788], [95.68123454513818, 16.29158497606585], [95.6817342741175, 16.289760942313706], [95.68117930248286, 16.289608394811637], [95.67915064148895, 16.289033281960428], [95.67878909604002, 16.288973380816913], [95.67842375455268, 16.290356155012603], [95.67747595455171, 16.293490159243504], [95.67925336834833, 16.29397287754631], [95.67928704705963, 16.295012334651574], [95.6807046448036, 16.295146115101204], [95.68080110608622, 16.294122361058157], [95.68097084682717, 16.292882450464788]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
