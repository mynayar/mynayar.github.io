
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Te</div><div class="name-mm">နန်းတည်း</div></div>
        <span class="pcode-badge">MMR010018058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38328104388512, 21.29657280938767], [95.37921859036572, 21.295711076305167], [95.37146299622037, 21.294356924832243], [95.36149151841892, 21.293125877956925], [95.35065830843422, 21.291771727383377], [95.33908646906536, 21.289802052023106], [95.33145398041694, 21.28906342443753], [95.32579116533009, 21.288940318940604], [95.33059224733438, 21.300758366605407], [95.33293123558809, 21.30703670468023], [95.33470981220813, 21.311483145330953], [95.33701402997355, 21.311771172101942], [95.34469945631491, 21.31650066537344], [95.35238488175696, 21.32211693784643], [95.36154827373389, 21.326550836551917], [95.36952929374195, 21.330689144288613], [95.37288710685453, 21.3345842069956], [95.37573675264906, 21.3303935497226], [95.38017065315319, 21.32477727724961], [95.38135302602137, 21.318569818342496], [95.3825063786665, 21.316682512787793], [95.38402284787617, 21.31420101796266], [95.38254241629954, 21.311099159098944], [95.38278862459543, 21.30703670468023], [95.38376473255641, 21.30196094634067], [95.38401967237002, 21.300635262007802], [95.38328104388512, 21.29657280938767]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
