
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Taw</div><div class="name-mm">ပေါက်တော</div></div>
        <span class="pcode-badge">MMR010030066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0010447287313, 20.774685356843804], [96.00361087763997, 20.778782550274514], [96.02154677306521, 20.776894562134373], [96.02752540397427, 20.777209225925105], [96.02941339301373, 20.769657270666585], [96.03098671736319, 20.761790649818693], [96.02666400004364, 20.76224438297197], [96.0151217546653, 20.761998804201482], [96.00726320613211, 20.761262065192227], [96.00412713076253, 20.761390739291244], [96.00252333018761, 20.764562114849753], [96.00232089909031, 20.766248466893273], [96.00129876382692, 20.76554697411359], [95.99958556432239, 20.763757607427692], [95.99955110769753, 20.766736407559222], [95.99953943359804, 20.76774564294709], [95.999521776309, 20.769272157584055], [95.99949576881471, 20.771520593100945], [95.99949544236085, 20.771548785048424], [95.9994950133842, 20.771585920753694], [96.00028449043697, 20.77316487755712], [96.0010447287313, 20.774685356843804]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
