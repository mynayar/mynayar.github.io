
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kon Tan Kyein Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kon Tan Kyein Chaung</div><div class="name-mm">ကုန်တန်းကြိမ်ချောင်း</div></div>
        <span class="pcode-badge">MMR012002083</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.94656802119727, 20.351857180864272], [92.95242117509719, 20.350117668995267], [92.95209220669005, 20.340522456746044], [92.95149785104508, 20.33264147462438], [92.95150009935014, 20.33260350344898], [92.95169782789247, 20.32926403380816], [92.94692218141358, 20.333578337969982], [92.94334042631965, 20.3363917923474], [92.93637437667621, 20.336287712907676], [92.93634409200632, 20.336320882602706], [92.93615995042143, 20.336434876168653], [92.93722583860165, 20.337216589374123], [92.94083501132678, 20.339021326373143], [92.94410583931307, 20.339698131863372], [92.9463615647345, 20.341164471063564], [92.94827890494759, 20.34398431422477], [92.94884276458197, 20.34838323020199], [92.94715090329163, 20.3510902237349], [92.94656802119727, 20.351857180864272]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
