
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Tin Hmaing Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Tin Hmaing Chaung</div><div class="name-mm">မတင်မှိုင်းချောင်း</div></div>
        <span class="pcode-badge">MMR012004012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.96409004861692, 20.919619989870682], [92.96132728902325, 20.931675668997002], [92.95630408886268, 20.94875454828383], [92.95404364919511, 20.95829862777947], [92.95303900934289, 20.97035430780511], [92.95165762909636, 20.979513275117597], [92.95112182111524, 20.99210476312436], [92.96799977297121, 20.997194937596362], [92.97262948826034, 20.985423907387485], [92.97849469937091, 20.968805810140054], [92.97865732827313, 20.9683450281006], [92.98267588768215, 20.957796307853357], [92.98543864817515, 20.946494108616264], [92.98845256773188, 20.93318262877534], [92.99121532822488, 20.922131588601985], [92.99448040774467, 20.91108055022727], [92.991717648151, 20.902289949721478], [92.9874479278796, 20.897015589597856], [92.98418284835981, 20.897769070386346], [92.97815500834702, 20.90078298994308], [92.97313180818645, 20.906559669992816], [92.96861092885132, 20.91233635004255], [92.96409004861692, 20.919619989870682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
