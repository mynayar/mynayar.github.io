
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae So</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae So</div><div class="name-mm">ရေစို</div></div>
        <span class="pcode-badge">MMR013006038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8891606305587, 16.945056400132785], [95.89443425503691, 16.94144813122631], [95.89804252394339, 16.934786710738138], [95.89887520172925, 16.930900883169272], [95.89803708214566, 16.92671028435217], [95.89720984705684, 16.922574108008746], [95.89818908735657, 16.918627391840687], [95.89492593778186, 16.915364243165357], [95.89183832867599, 16.91304853566146], [95.88900802190273, 16.914592341563377], [95.88000249242117, 16.915106942631326], [95.87984656526686, 16.9117532313266], [95.8805486992631, 16.909910130148432], [95.88180359885706, 16.906616018714317], [95.88257550225768, 16.90352840870912], [95.87877845666048, 16.908864975838014], [95.87556023181929, 16.912581978175808], [95.87306220026039, 16.91702292486815], [95.87306220026039, 16.91979851598876], [95.87250708113692, 16.921186311998724], [95.86945393135392, 16.925349700028676], [95.86612322110983, 16.928125291149343], [95.87278464069868, 16.931733560055818], [95.87778070561512, 16.934509152075748], [95.88249921096985, 16.938117420982223], [95.88360944831743, 16.941725690788076], [95.88471968476568, 16.94366860412282], [95.8891606305587, 16.945056400132785]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
