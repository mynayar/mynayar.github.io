
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Thar</div><div class="name-mm">တောင်သာ</div></div>
        <span class="pcode-badge">MMR009003011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.81352580397271, 20.75969341282081], [94.81350163469273, 20.759403378762954], [94.81789688773125, 20.758147592437467], [94.82292003483178, 20.756263912049974], [94.8258502041237, 20.748729192298413], [94.83087335122423, 20.747892000815227], [94.83882666581803, 20.747892000815227], [94.8394545598801, 20.752915147915814], [94.84677998221048, 20.756891805212717], [94.85808206183776, 20.756473210370416], [94.87733745785744, 20.74119447164759], [94.88612796393443, 20.732194667250155], [94.8891169443915, 20.73047373987123], [94.88901890120138, 20.730170697120002], [94.88298849812077, 20.730520285183047], [94.87147712017304, 20.730520285183047], [94.84761717279434, 20.72759011589119], [94.8409196436267, 20.733659751896084], [94.83861736839691, 20.738892196417794], [94.83296632813358, 20.735752729704757], [94.83108264774603, 20.729892392020304], [94.82794318193237, 20.723194862852665], [94.81911764906033, 20.72261423625804], [94.8120365500468, 20.722148373948357], [94.80596691494122, 20.722985565431543], [94.80511962587008, 20.728387033934496], [94.80361360498392, 20.73798791640928], [94.8084784875922, 20.738682898996615], [94.80743199868783, 20.758356889858646], [94.81161795520455, 20.75898478302139], [94.81352580397271, 20.75969341282081]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
