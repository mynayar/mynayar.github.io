
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kungyangon</div><div class="name-mm">ကွမ်းခြံကုန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Min Paing Ward</div><div class="name-mm">မင်းပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013029701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00645392983301, 16.434320530221385], [96.00616839451231, 16.434001682446706], [96.00587334134764, 16.433625727607705], [96.00556877033887, 16.433192665704723], [96.005283235018, 16.43269297889333], [96.00519955408646, 16.432488425504744], [96.00424562073977, 16.43325684302863], [96.00412069903689, 16.433842190436167], [96.00396722380208, 16.435119960996303], [96.00387442482292, 16.435619647807528], [96.00374593392854, 16.436119334618695], [96.00348895214, 16.43699735572983], [96.00421326007006, 16.437239346914055], [96.00583129355414, 16.43779852025051], [96.00771701640116, 16.438452872027028], [96.00956109868076, 16.439101275151074], [96.00980499343387, 16.4384647693322], [96.01008458010199, 16.43747729301475], [96.01042960194792, 16.436709916840414], [96.00984068534888, 16.43632920307948], [96.0089543361243, 16.435930643360905], [96.0080085003745, 16.435448802507267], [96.00725897015758, 16.43493721839087], [96.00645392983301, 16.434320530221385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
