
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doke Toe Yae</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ywangan</div><div class="name-mm">ရွာငံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doke Toe Yae</div><div class="name-mm">ဒုတ္တိုးရေ</div></div>
        <span class="pcode-badge">MMR014007004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4374198171709, 21.27849737875107], [96.42780915366956, 21.256873387896576], [96.42714952702909, 21.25677190659826], [96.42338748034803, 21.248307301340958], [96.41020703802445, 21.256545076893815], [96.3844134043552, 21.27208739521717], [96.37978377809895, 21.27770908430682], [96.37350071318741, 21.297550340975533], [96.36820971110933, 21.347153481747853], [96.36953246185368, 21.36104236231523], [96.38044515302147, 21.38617462016265], [96.38078701500882, 21.386721601320914], [96.38093280410567, 21.38695486297661], [96.38536184557279, 21.38705114619347], [96.40906172172112, 21.386343687311353], [96.42653500228857, 21.385822096712445], [96.44619036279505, 21.385822096712445], [96.44908688305327, 21.372425692092065], [96.46327127904635, 21.339467829676664], [96.46530711573087, 21.338449912233727], [96.46463553440248, 21.337274644009653], [96.44927241588937, 21.30409030981997], [96.43636739723763, 21.279509321098317], [96.4374198171709, 21.27849737875107]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
