
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (6) Ward (West)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (6) Ward (West)</div><div class="name-mm">အမှတ် (၆) ရပ်ကွက် (အနောက်)</div></div>
        <span class="pcode-badge">MMR013013701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.20565581326525, 16.79823827737465], [96.20602083189596, 16.798159599286123], [96.20649147140432, 16.79798126192577], [96.20715713519371, 16.797691345679084], [96.20755195555836, 16.797560692172283], [96.20820426981129, 16.797372818400902], [96.20853042603841, 16.79727172830769], [96.20885353086584, 16.797152328017546], [96.20870590265537, 16.79680156723856], [96.20858764630287, 16.79641151418008], [96.20843887325543, 16.796028137688438], [96.20825195366479, 16.795482635914993], [96.20806248989203, 16.79496129442822], [96.20783615121746, 16.79341888427416], [96.20763130184315, 16.79236640858295], [96.20736885089184, 16.791672944950506], [96.20699996967289, 16.79163780214293], [96.20672302344883, 16.79139366138844], [96.20586824392439, 16.79167365991151], [96.20444107109859, 16.79232978818925], [96.20321083091517, 16.79289245622192], [96.20296044796635, 16.793002735587834], [96.20335578903848, 16.793781279582447], [96.20389111858032, 16.794852573587434], [96.20408248891579, 16.79524326336599], [96.20423126196323, 16.795543671103587], [96.20460128801909, 16.796318054834387], [96.20506477342059, 16.797254562048465], [96.20536295533617, 16.797870001399474], [96.20565581326525, 16.79823827737465]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
