
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lon Chaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lon Chaing</div><div class="name-mm">ဖလုံချိုင်</div></div>
        <span class="pcode-badge">MMR005007061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51095200043454, 22.962684600314105], [95.51262527993276, 22.968661230231646], [95.51331899987201, 22.97386457988648], [95.51609424025702, 22.980455550183535], [95.51609424025702, 22.985658989770627], [95.51577780030527, 22.985975249857972], [95.52032064018545, 22.991167170028916], [95.53142124019814, 22.998567600314573], [95.53882176041594, 23.00088015029877], [95.55652620002417, 23.00746779040628], [95.56426080039569, 22.99903010995166], [95.56842347975982, 22.98839201957611], [95.57053775980984, 22.980991590189774], [95.56934832006897, 22.980991590189774], [95.55824772005627, 22.980991590189774], [95.54534172024427, 22.979818349936977], [95.54492915985293, 22.98081527990132], [95.54367095974703, 22.97966643016167], [95.53695047988083, 22.973530589665017], [95.53140035973888, 22.967286479787276], [95.52619692015179, 22.964511330233734], [95.52064644028104, 22.963470659943027], [95.51095200043454, 22.962684600314105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
