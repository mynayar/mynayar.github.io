
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Taunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Taunt</div><div class="name-mm">နားတောင့်</div></div>
        <span class="pcode-badge">MMR015014027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.7983096053041, 22.372875226110864], [97.7930885956622, 22.371913325639525], [97.7784242090101, 22.364581133212766], [97.76375982325732, 22.36345310277852], [97.75473558517916, 22.358940983739444], [97.7435617057082, 22.352683611559485], [97.74063521284484, 22.35104477609559], [97.72879090137906, 22.34540462662227], [97.71412651472696, 22.353864850382593], [97.6960780385707, 22.365145148429917], [97.67958647233786, 22.368953584840142], [97.68366971188777, 22.37304135607377], [97.69438599381863, 22.3882697570437], [97.71863863376598, 22.39842202465678], [97.74289127281406, 22.396729979904705], [97.74736375783124, 22.39623303702507], [97.76319580804017, 22.394473920834855], [97.77898822422725, 22.401242098943783], [97.79365261087935, 22.409138306587636], [97.79891384539769, 22.409138306587636], [97.80021651428075, 22.404273798097336], [97.80048830379224, 22.403571002200067], [97.8004299836569, 22.40343103441478], [97.80159495194556, 22.400388459759654], [97.80138987144545, 22.397517348047245], [97.80317626587203, 22.388883109967594], [97.80168760280071, 22.384119391196975], [97.79930574386503, 22.380844337296367], [97.7983096053041, 22.372875226110864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
