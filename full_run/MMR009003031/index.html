
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Ywe Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Ywe Taw</div><div class="name-mm">နရွဲတော</div></div>
        <span class="pcode-badge">MMR009003031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92327832003849, 20.704567360895055], [94.9231736713279, 20.704358062574556], [94.92338296874908, 20.700590702698833], [94.92226348187427, 20.70075453039732], [94.91480176009321, 20.70184648902432], [94.90412757272935, 20.70163719160314], [94.89680215129829, 20.702474383086383], [94.89115111103501, 20.706660337804408], [94.8884302400636, 20.70686963612485], [94.88826089592368, 20.707982465318594], [94.88696515541767, 20.716497333685027], [94.88696515541767, 20.72382275601541], [94.88901890120138, 20.730170697120002], [94.8891169443915, 20.73047373987123], [94.88926743064746, 20.73093888092467], [94.89096711963691, 20.73351269565444], [94.89094181271452, 20.73303185873334], [94.9133366763466, 20.734287645058828], [94.91567632020605, 20.73484916016065], [94.91815052512669, 20.72800871163281], [94.92275507558634, 20.726334329565702], [94.92359226706952, 20.72651058139826], [94.92359226706952, 20.72465994659933], [94.92233647984472, 20.715032249938417], [94.92296437390678, 20.704567360895055], [94.92327832003849, 20.704567360895055]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
