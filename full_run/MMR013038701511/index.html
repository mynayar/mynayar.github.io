
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oe Bo Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Oe Bo Ward</div><div class="name-mm">အိုးဘိုရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12226113044687, 16.803801577980494], [96.12226041188853, 16.8042926788641], [96.1222705841202, 16.80473232233885], [96.1222705841202, 16.80517387417501], [96.1222591402472, 16.805852890198764], [96.12224006742525, 16.806131362572387], [96.12220223744339, 16.80648167908629], [96.12313270570985, 16.806550026662478], [96.12393188644745, 16.806531906222517], [96.12461853142014, 16.80652046234951], [96.12526321402618, 16.806531906222517], [96.12583033280367, 16.806533177863912], [96.12645981506847, 16.806667502403343], [96.12645149274226, 16.80575370756759], [96.12644004796988, 16.80511283898636], [96.12641525276177, 16.804671288049576], [96.12632656072225, 16.804235935240285], [96.12629985805205, 16.803872108211294], [96.1258020401321, 16.803842544797646], [96.12539863573852, 16.803855896132745], [96.12506294310043, 16.80386161761959], [96.12466812183641, 16.803869246568524], [96.12420082061146, 16.803869246568524], [96.1235332475614, 16.803869246568524], [96.12311077124514, 16.803869246568524], [96.12226113044687, 16.803801577980494]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
