
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (70) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (70) Ward</div><div class="name-mm">အမှတ် (၇၀) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701521</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.26557077667007, 16.864971978773838], [96.2652225492813, 16.864572525102005], [96.26502761942913, 16.86433525067133], [96.26475079821086, 16.863720575744026], [96.26459576498263, 16.863319250583004], [96.26422309941654, 16.862413406653445], [96.26381111189335, 16.861421584838297], [96.26354980487963, 16.86079597505426], [96.26330184920101, 16.860342026063677], [96.26297187804977, 16.859811783087366], [96.26265335077159, 16.859272003700084], [96.26242097225014, 16.858898162720095], [96.26126003292421, 16.859442711212182], [96.26029014557383, 16.860023498785495], [96.25992107369865, 16.860222339789175], [96.25960459057944, 16.86044066280641], [96.2592334754446, 16.860742568814544], [96.2585402897027, 16.861327308008924], [96.25789451621898, 16.861890792626014], [96.25650215165302, 16.86306190508293], [96.2552280434395, 16.864133834908614], [96.25404930113439, 16.86511039702725], [96.25290107732292, 16.86608314512108], [96.25166459494517, 16.86708016861496], [96.25656736868916, 16.87255254326533], [96.25659797621569, 16.87261427902581], [96.2589740749936, 16.87066078156988], [96.26144218430943, 16.868669509890026], [96.26290321391224, 16.86747169476297], [96.26557077667007, 16.864971978773838]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
