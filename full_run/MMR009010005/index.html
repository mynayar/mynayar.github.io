
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nauk Kan Baung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nauk Kan Baung</div><div class="name-mm">အနောက်ကန်ဘောင်</div></div>
        <span class="pcode-badge">MMR009010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59276515458828, 20.572709123127595], [94.59618632493903, 20.571746917786072], [94.61241905369644, 20.572254191178047], [94.62231087404768, 20.574283282047872], [94.62941269344111, 20.58620419326894], [94.62941269344111, 20.591969388076848], [94.62941269344111, 20.59305237596641], [94.63059109040654, 20.59336661437783], [94.63321723938412, 20.594066920951718], [94.6335791445619, 20.59407670197828], [94.63619243143563, 20.5941473320338], [94.63606072482264, 20.59326131006145], [94.6358074235738, 20.59291860810731], [94.63530082017678, 20.59223320329977], [94.63485821163721, 20.584988995146034], [94.63471581298444, 20.581286638267784], [94.63445211287478, 20.57443042012784], [94.63029635379377, 20.56708857887486], [94.62821844412593, 20.56341760563805], [94.62814753438124, 20.563415389708496], [94.62308727495781, 20.563257257416524], [94.62156919776032, 20.5632098172793], [94.61040918943263, 20.56313066794604], [94.59227095733888, 20.56300202802123], [94.59176826599276, 20.56293347899691], [94.59077155186566, 20.562797563556785], [94.59164758956467, 20.5632098172793], [94.59276515458828, 20.572709123127595]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
