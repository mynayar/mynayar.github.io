
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Ward</div><div class="name-mm">မြို့မ ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007006702505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56785925688297, 18.22080905847214], [96.56553746428261, 18.224215981482416], [96.56541981047593, 18.224392905108516], [96.56589956281465, 18.224674240923548], [96.56633526546017, 18.224955277264257], [96.56685363378824, 18.22529564367909], [96.56686282036293, 18.22530125724728], [96.56738500091711, 18.225620269260048], [96.56740217796818, 18.22562215423909], [96.5676752364231, 18.22523963570069], [96.56789139117484, 18.2248296734507], [96.56802830306378, 18.224547861894337], [96.56823162089267, 18.224187660032555], [96.56831769680434, 18.223966744269887], [96.56860998456318, 18.223601856940206], [96.56879374303685, 18.223217090096682], [96.56880192416952, 18.22319995891104], [96.56861684369244, 18.223100730414444], [96.56838553446488, 18.222988531895282], [96.56826773766602, 18.2229349134156], [96.56854411911587, 18.22267477012457], [96.56874086290054, 18.22235047009815], [96.56891158390255, 18.22203365422979], [96.56900480672653, 18.221765054613627], [96.56905082143834, 18.221550848692743], [96.56906079312114, 18.22150442568875], [96.56916338439858, 18.221170549475143], [96.56891332409072, 18.221136959103433], [96.56821376305476, 18.221008468466096], [96.56785925688297, 18.22080905847214]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
