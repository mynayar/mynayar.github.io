
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Tha Mar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin Tha Mar</div><div class="name-mm">ခြင်းသမား</div></div>
        <span class="pcode-badge">MMR012010021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.53243214712597, 20.930827275558386], [92.5316804919612, 20.932925382200665], [92.54136160385497, 20.934818485684616], [92.55128996456028, 20.93717839756505], [92.55179437001425, 20.934612846705534], [92.55229876917292, 20.932047296745395], [92.55355932730117, 20.925750081001468], [92.551350405297, 20.916876891255583], [92.54838763468166, 20.911035263066992], [92.5441700247269, 20.90962394618822], [92.54276117468851, 20.909379350376753], [92.5387093754374, 20.908675878189285], [92.53709790544406, 20.91277335310781], [92.53653047370244, 20.914216158848717], [92.5359279324282, 20.915748239389814], [92.53563533080592, 20.91649223323003], [92.53512951611435, 20.91782707176202], [92.53451687815146, 20.919468422629677], [92.53399385763049, 20.920869670698778], [92.53244445614678, 20.926860326442977], [92.53243214712597, 20.930827275558386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
