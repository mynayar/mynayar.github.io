
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sut Mar Tu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sut Mar Tu</div><div class="name-mm">ဆွပ်မာတူ</div></div>
        <span class="pcode-badge">MMR001003008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.85362811034906, 26.405086240337766], [97.8450689908413, 26.405086240337766], [97.82353746018572, 26.39759701099331], [97.81909276691772, 26.40222326928847], [97.81488377696479, 26.410500949559207], [97.80857029158574, 26.419760728175106], [97.80534339907865, 26.42677571083044], [97.79748661771328, 26.433790694385095], [97.79061193469312, 26.44164747575047], [97.78401785004382, 26.453572947433656], [97.78008945936114, 26.460026732447773], [97.77114026251314, 26.474072267721056], [97.78442812255986, 26.476116552636825], [97.78722327483433, 26.474464871256828], [97.79111229229852, 26.472686950242633], [97.79927569841482, 26.45887195437723], [97.80450865015416, 26.453429681834393], [97.81051780944938, 26.453301994291678], [97.81690776418202, 26.455415243718562], [97.81715759584642, 26.452159222170394], [97.81885669218264, 26.442532381664137], [97.83289899529245, 26.43036238521597], [97.8431966841797, 26.41725623588661], [97.85362811034906, 26.405086240337766]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
