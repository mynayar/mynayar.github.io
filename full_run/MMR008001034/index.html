
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Ma Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Ma Gyi</div><div class="name-mm">ရွာမကြီး</div></div>
        <span class="pcode-badge">MMR008001034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39164585227434, 18.814160019269536], [95.39220541135069, 18.80716551327788], [95.39120981238301, 18.803183118306322], [95.3872787237342, 18.802499450988932], [95.38308432528146, 18.802033407016154], [95.37819086131924, 18.801334339708035], [95.3691029971057, 18.800402251762534], [95.36234535635316, 18.799936206890493], [95.35768491302838, 18.799703185353792], [95.35162633778532, 18.799936206890493], [95.34580078497828, 18.801800383680813], [95.33997523127198, 18.803664561370454], [95.33554781128254, 18.805062694188052], [95.33484874487374, 18.809257092640735], [95.33578083281924, 18.813451491093474], [95.340208253708, 18.814150556602954], [95.34556776164294, 18.814150556602954], [95.34906309368688, 18.814150556602954], [95.3506942489405, 18.812286379812633], [95.35442260342046, 18.812053358275932], [95.3581509570011, 18.813218468657453], [95.3583839803365, 18.815781711856573], [95.36956904197774, 18.816014734292594], [95.37632668273028, 18.816014734292594], [95.38052108208234, 18.815315667883795], [95.38359689568023, 18.814632154350477], [95.38471547963576, 18.814383579038974], [95.39164585227434, 18.814160019269536]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
