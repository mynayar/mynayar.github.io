
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Pu Yar Aint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Pu Yar Aint</div><div class="name-mm">သံပရာအိုင့်</div></div>
        <span class="pcode-badge">MMR009021003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.53661219469711, 21.471655732825866], [94.54429978930392, 21.461707081616566], [94.55139587102269, 21.45406514828801], [94.56777144359728, 21.451881738251643], [94.57759678786152, 21.445877360651707], [94.58011039028236, 21.444422118186253], [94.57987292789335, 21.442238176650562], [94.579516008557, 21.44098895897332], [94.579516008557, 21.43979922875144], [94.5802298472297, 21.43837155230534], [94.58153855056372, 21.436884389303202], [94.58260930857278, 21.435694658182], [94.58397928181847, 21.434253247289575], [94.58501329532737, 21.433352655400768], [94.58652712862414, 21.43259637502274], [94.58310017023672, 21.428424426346226], [94.58461883918812, 21.421843525758163], [94.57549774412564, 21.418585992449664], [94.56610651070696, 21.414561178255838], [94.55537367405589, 21.417244388317897], [94.54285203009715, 21.41813879107241], [94.54090856997459, 21.41823845484089], [94.54185306136975, 21.4209145116954], [94.53564632012166, 21.421411051678717], [94.53068092658356, 21.431590108296916], [94.53092919612556, 21.43878992771306], [94.53465324105429, 21.444996668961153], [94.53490151059628, 21.46212727455412], [94.53539804968028, 21.470320173936955], [94.53661219469711, 21.471655732825866]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
