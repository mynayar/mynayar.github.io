
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (85) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (Seikkan)</div><div class="name-mm">ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (85) Ward</div><div class="name-mm">အမှတ် (၈၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013021701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2794202165698, 16.874903997021875], [96.27908490074765, 16.871930043336874], [96.27952232379624, 16.869301986897256], [96.2774317004127, 16.867033004569578], [96.27547391229126, 16.864848455092158], [96.27338960844372, 16.85995356480521], [96.26969766661409, 16.861357688906253], [96.26714671444938, 16.862338469744657], [96.26459576498263, 16.863319250583004], [96.26475079821086, 16.863720575744026], [96.26502761942913, 16.86433525067133], [96.2652225492813, 16.864572525102005], [96.26557077667007, 16.864971978773838], [96.2661927540924, 16.865652083876626], [96.26674842809751, 16.866289138433046], [96.2677593227346, 16.86741065957432], [96.2685222625924, 16.868263244752995], [96.26919364966727, 16.86894416823884], [96.26921205609159, 16.868964528889933], [96.26975059531378, 16.869560241611907], [96.27022107474289, 16.870069927884913], [96.27055168171478, 16.87042808558772], [96.27184677111165, 16.871850967748003], [96.27267797311004, 16.872754189254465], [96.2728226974096, 16.87291145280136], [96.2734832764321, 16.87364387506483], [96.27369201267629, 16.87386393107562], [96.27436256428098, 16.8745708467672], [96.2751589076575, 16.875422349162136], [96.27525080038419, 16.875521225124487], [96.27608366702765, 16.87648519043921], [96.27668666875479, 16.877111911785335], [96.2794202165698, 16.874903997021875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
