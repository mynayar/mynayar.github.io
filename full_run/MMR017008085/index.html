
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Bwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Bwet</div><div class="name-mm">သဲဘွက်</div></div>
        <span class="pcode-badge">MMR017008085</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22586138189729, 17.64692983944059], [95.22807372042593, 17.647085610112867], [95.22817271959542, 17.647426349746297], [95.22768573940539, 17.647772552761126], [95.22789984010558, 17.648085780334554], [95.2307081998236, 17.648725139853354], [95.23121868019797, 17.64719397032553], [95.23415340005943, 17.64221759966256], [95.23449216028501, 17.641179899832537], [95.23619496002942, 17.635965299658892], [95.23874700037385, 17.630606160446007], [95.23951272003603, 17.629712909723082], [95.23645020021661, 17.626012560131585], [95.23491911972167, 17.624098620255154], [95.23262231956443, 17.62358822981298], [95.22305244031793, 17.62103628030013], [95.22088725594216, 17.621894736253125], [95.21934797812673, 17.62437814573491], [95.2210547447807, 17.625326350430782], [95.22132082359718, 17.625701855156535], [95.22594960988664, 17.632234249910766], [95.22574784878424, 17.63447790193368], [95.22527853757452, 17.64151755928799], [95.22785974473152, 17.64550669827554], [95.22586138189729, 17.64692983944059]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
