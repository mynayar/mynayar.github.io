
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ba Ra War</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ba Ra War</div><div class="name-mm">ဘရဝါ</div></div>
        <span class="pcode-badge">MMR012004061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00830745812277, 20.637145499165513], [93.00742665401691, 20.6370747234198], [93.00705603620719, 20.636580564841267], [93.00657004796938, 20.635932580823976], [93.00519947757391, 20.635104528251418], [93.00400023072615, 20.63439068957871], [93.00282953555467, 20.63407660135414], [93.0013161986837, 20.633933833979313], [92.99908902313996, 20.634419243953005], [92.99823824469928, 20.634698951995063], [92.99700461497105, 20.635104528251418], [92.99600524244806, 20.63547572432526], [92.99343542340614, 20.635904027349056], [92.99215051433481, 20.63558993822511], [92.9900375535903, 20.635133081726394], [92.98944707132534, 20.634887686417642], [92.98612515195424, 20.652084367899306], [92.99863291937379, 20.656303855638498], [93.00541423927581, 20.657660119618868], [93.00402692530241, 20.653378528296514], [93.00345585490385, 20.649723676306678], [93.00345585490385, 20.64709675121412], [93.00364069256398, 20.646911913553993], [93.00223092881436, 20.646658879403788], [93.00262576896415, 20.645875769551196], [93.0053688450962, 20.643118837564373], [93.00670944018856, 20.64127376597156], [93.00684211357276, 20.64109116672404], [93.00735274143591, 20.639796970353927], [93.00791192279706, 20.63837971255373], [93.00795851667226, 20.637646155345863], [93.00830745812277, 20.637145499165513]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
