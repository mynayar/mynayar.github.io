
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daing Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daing Lel</div><div class="name-mm">ဒိုင်းလည်</div></div>
        <span class="pcode-badge">MMR010019050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75621223370769, 21.357748032345853], [95.76191977837516, 21.371534829968482], [95.76315700988818, 21.39009330716044], [95.76150736727124, 21.397929108241783], [95.76851834704416, 21.401228392576286], [95.78212789728468, 21.40494008891403], [95.78913887705761, 21.403702857401015], [95.7912334106934, 21.40362805179319], [95.79161334098296, 21.397929108241783], [95.7961498577298, 21.38596920061815], [95.79697467903827, 21.374834115202304], [95.79753809710553, 21.369763348100093], [95.79496955869826, 21.36890602079626], [95.7918796536232, 21.366800307688095], [95.789960861005, 21.36198616033306], [95.78516578737123, 21.361307144309308], [95.78118324311225, 21.362478255866847], [95.77892112710839, 21.366186141777064], [95.7724971771031, 21.368604659777304], [95.76883506758435, 21.369493484037093], [95.76486015317357, 21.36634254467276], [95.76189994832401, 21.362699508875266], [95.7599201196179, 21.357629775993416], [95.75621223370769, 21.357748032345853]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
