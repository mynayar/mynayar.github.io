
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Ku Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Ku Lar</div><div class="name-mm">ကံကုလား</div></div>
        <span class="pcode-badge">MMR009007008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80287181088545, 20.261991201432863], [94.80030182996552, 20.268330485663455], [94.7985463497343, 20.276327676381186], [94.79659581644381, 20.281594117074917], [94.7913293739515, 20.283154545146203], [94.78625798631708, 20.2812040109564], [94.78138165084255, 20.279448529825856], [94.78111261235722, 20.279690665092176], [94.77943111665275, 20.2812040109564], [94.78274702495531, 20.286470451650075], [94.78801346564899, 20.28939625293475], [94.79035410685663, 20.295442908563416], [94.79347496209988, 20.301099457174246], [94.79542549628968, 20.305390631672367], [94.79815624271646, 20.309096646992714], [94.79963178557853, 20.310527475562594], [94.7995165707332, 20.309179654417562], [94.8000109028809, 20.308723776381214], [94.8004848743775, 20.308286676189198], [94.80288125106892, 20.30785909622034], [94.80477675214547, 20.309682871867096], [94.80631742840666, 20.307118473938488], [94.80782374606906, 20.302599609084723], [94.81121286638074, 20.297453152341177], [94.8143212965906, 20.295265930078642], [94.81450996895995, 20.294876209769313], [94.81626216936371, 20.293798332726908], [94.81259019518143, 20.289786359952586], [94.81180998114576, 20.282374331110532], [94.81629620870314, 20.274182088232862], [94.81955626640865, 20.273530077051475], [94.81143366433218, 20.26735351525258], [94.80322763125025, 20.26111351077992], [94.80287181088545, 20.261991201432863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
