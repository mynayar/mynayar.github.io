
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo Aing</div><div class="name-mm">အုတ်ဖိုအိုင်</div></div>
        <span class="pcode-badge">MMR005011031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35430916023961, 23.017883310266598], [95.35589604007026, 23.01330563964359], [95.35589604007026, 23.007080070189147], [95.35028076044881, 23.003295929863327], [95.35028076044881, 22.995727560178807], [95.35107419991448, 22.990905720023022], [95.3515015199792, 22.987487789929617], [95.3515015199792, 22.9851118800093], [95.3515015199792, 22.984313940336108], [95.34948732008382, 22.98168944970837], [95.34112559996652, 22.981872600240365], [95.33527992033214, 22.98075066001502], [95.33551032034507, 22.982299830372938], [95.33728043974054, 22.992492689785877], [95.33807388010553, 23.001708960100473], [95.33532707988087, 23.01007077014998], [95.3356917603665, 23.013671670011604], [95.33630375981073, 23.01971435963003], [95.33972159997194, 23.024475089953512], [95.34527603955763, 23.02709957968193], [95.34811428014996, 23.02823492969827], [95.34832776031794, 23.028320340111634], [95.3508909603496, 23.023071269823276], [95.35430916023961, 23.017883310266598]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
