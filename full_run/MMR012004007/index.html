
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyin Gyi</div><div class="name-mm">ကျင်ကြီး</div></div>
        <span class="pcode-badge">MMR012004007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.95165762909636, 20.979513275117597], [92.92352770963618, 20.97737004319299], [92.92058076708878, 20.983263930985686], [92.91709801476162, 20.991033147162057], [92.91629430323957, 20.997462842036555], [92.91575849525839, 21.005767866194105], [92.91334735889353, 21.01541240985489], [92.91040041544687, 21.022377912710567], [92.90664975867946, 21.02639647301885], [92.9015595833082, 21.030147128886938], [92.89593359905643, 21.035505208698453], [92.89941635138359, 21.04247071335277], [92.90584604715741, 21.04648927276179], [92.9106683189878, 21.052918967636288], [92.91736591920187, 21.056133816422516], [92.92352770963618, 21.05720543238482], [92.92834998236583, 21.05479429602002], [92.93317225419622, 21.047292984283843], [92.94147727835377, 21.041667000931398], [92.94790697322827, 21.03845215304449], [92.94897858919057, 21.016216122276262], [92.95165762909636, 20.998534457998915], [92.95112182111524, 20.99210476312436], [92.95165762909636, 20.979513275117597]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
