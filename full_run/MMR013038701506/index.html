
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Tan (North/West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Gyi Tan (North/West) Ward</div><div class="name-mm">မကျည်းတန်း (မြောက်/အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12020239733397, 16.813008903243315], [96.12023423920465, 16.813121779947778], [96.12027244521721, 16.813257217246814], [96.12018966711958, 16.813583374373366], [96.12010192926067, 16.81394386311888], [96.11999756923245, 16.814324788058684], [96.12075042679083, 16.81444740342505], [96.12190718336984, 16.8145068324244], [96.1219005580644, 16.814245224137892], [96.1219005580644, 16.813669204770008], [96.1219005580644, 16.813009261568254], [96.12191200283684, 16.812482834415334], [96.12195610199262, 16.811900874126138], [96.12153148708848, 16.811872483428544], [96.12114175059139, 16.811876932374616], [96.12083695056492, 16.811737234385987], [96.12075957252102, 16.811826852287368], [96.12062557401379, 16.81198204702264], [96.12020239733397, 16.813008903243315]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
