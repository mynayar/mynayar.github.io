
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Kone Gyi</div><div class="name-mm">ပေါက်ကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR007003012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50539912456998, 17.101788880252684], [96.51554882461863, 17.10529858975815], [96.52465190356259, 17.107868871051608], [96.52496957828345, 17.106558464401644], [96.52813251999987, 17.096300273738677], [96.52975145256755, 17.092871645310254], [96.53077592067228, 17.087751782418877], [96.53488281239191, 17.08022910908619], [96.53898849991941, 17.074245164982415], [96.5352277680471, 17.07219352720955], [96.53180837115946, 17.069059079612884], [96.52405773767453, 17.069514999018054], [96.51922903389288, 17.069128703327067], [96.51881466316621, 17.071338678437314], [96.51642108606433, 17.074416135096612], [96.51436944829146, 17.078861349971362], [96.51197587029026, 17.08159686820096], [96.51026617184641, 17.083990446202165], [96.50756688640274, 17.091413480048118], [96.50718871518711, 17.098009972182524], [96.50547901584395, 17.10142936907016], [96.50539912456998, 17.101788880252684]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
