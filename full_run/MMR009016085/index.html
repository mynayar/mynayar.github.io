
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ye Din</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ye Din</div><div class="name-mm">ရဲဒင်</div></div>
        <span class="pcode-badge">MMR009016085</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63221644213513, 19.219596482291877], [95.62838113757948, 19.218848130336994], [95.62168512916543, 19.214012123161012], [95.61593810156222, 19.20826509555775], [95.61312912041262, 19.20917611418639], [95.60614554927776, 19.208826937113486], [95.60420110529685, 19.214012123161012], [95.60643310840129, 19.22331213564661], [95.6108971137109, 19.23224014806442], [95.6176499475871, 19.239330624308934], [95.61833712405911, 19.24005215937973], [95.63098514165102, 19.24302816261968], [95.64288915820816, 19.24600416675895], [95.65487386283854, 19.247652063791747], [95.66111718311157, 19.245632165791847], [95.67127663630777, 19.24463287600645], [95.67041719559717, 19.242656161652576], [95.65553717490076, 19.236332154205627], [95.64326115827589, 19.232612149031524], [95.63321714475546, 19.224800137716215], [95.63221644213513, 19.219596482291877]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
