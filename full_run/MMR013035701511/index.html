
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (11) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lanmadaw</div><div class="name-mm">လမ်းမတော်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (11) Ward</div><div class="name-mm">အမှတ် (၁၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013035701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14500403440871, 16.777333975282772], [96.14396095303562, 16.777360916273324], [96.14364829023646, 16.77734528155952], [96.14276886029472, 16.777379989994586], [96.1422732502104, 16.777408901399724], [96.14229011519672, 16.777841567934047], [96.14233207666405, 16.778762818149573], [96.14240360244435, 16.779925346577556], [96.14279238386149, 16.77991167688242], [96.14349937419684, 16.779861450645456], [96.14421081617627, 16.779851913335165], [96.14505462666972, 16.7798362732255], [96.14505958643082, 16.778661728056363], [96.1450214389883, 16.77783012406104], [96.14500403440871, 16.777333975282772]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
