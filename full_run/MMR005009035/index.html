
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Pu Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Pu Gyi</div><div class="name-mm">ရွာပုကြီး</div></div>
        <span class="pcode-badge">MMR005009035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44023284277154, 22.896141837575783], [95.44391383895254, 22.8985236578406], [95.44904740391462, 22.902957194119267], [95.45068081196996, 22.906924039812623], [95.46024791321071, 22.905757321443275], [95.46622641641602, 22.90812124160209], [95.46577272013496, 22.904054640409356], [95.46676055975212, 22.902257880396917], [95.46728508034226, 22.898681639945778], [95.4663065999697, 22.897737539755724], [95.46472332012519, 22.89714093040965], [95.4645515999764, 22.894391069792107], [95.46088860012884, 22.88645441963581], [95.4610559999345, 22.883608079749138], [95.46099767979916, 22.883646870206917], [95.45720363973624, 22.881478950093538], [95.4550357196228, 22.877143109866665], [95.45088059995976, 22.87551716978163], [95.44437683961951, 22.874252490060428], [95.43913775989978, 22.874252490060428], [95.437713240074, 22.87373453991711], [95.435708572093, 22.878847522994818], [95.43625892930618, 22.884213504249885], [95.43621349016053, 22.888723215803793], [95.43994699325918, 22.895956875809247], [95.44023284277154, 22.896141837575783]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
