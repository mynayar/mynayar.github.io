
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung U</div><div class="name-mm">ချောင်းဦး</div></div>
        <span class="pcode-badge">MMR005019027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.69620396044445, 21.96123479984618], [94.69620396044445, 21.96984410961801], [94.69852091980465, 21.977084969595694], [94.69967940038407, 21.986642789832956], [94.69779011991818, 21.98805983988973], [94.70303424033796, 21.994396470220977], [94.70419307974691, 22.00018914021672], [94.7040706802178, 22.00054023014758], [94.7111439596261, 22.00076838005674], [94.7207019597277, 22.00076838005674], [94.73286635969481, 21.997003139883077], [94.73663159986847, 21.990341609677614], [94.74425603958463, 21.987569249821092], [94.74618959997014, 21.986866079805793], [94.7496650399097, 21.97933560035773], [94.7487772804472, 21.97838430019533], [94.74561036013006, 21.974991120343986], [94.74076943995777, 21.974246370173887], [94.73807987978267, 21.973832639764566], [94.73402520000303, 21.966302160316502], [94.73275187959564, 21.96445041035821], [94.73083919966939, 21.96166805993306], [94.72417739966733, 21.957902819759397], [94.71997332001274, 21.95469971971636], [94.71983291965358, 21.955296150097297], [94.70969604034002, 21.95732357991932], [94.70158632015261, 21.95935100974134], [94.69620396044445, 21.96123479984618]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
