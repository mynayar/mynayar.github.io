
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ma Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ma Taung</div><div class="name-mm">ဆင်မတောင်</div></div>
        <span class="pcode-badge">MMR009017034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.423305165601, 19.530111852380116], [95.41817672227796, 19.534307851626124], [95.40676270313628, 19.548575374653865], [95.40176906998664, 19.553212321391584], [95.40107463328775, 19.554727456007356], [95.40676270313628, 19.556065825277642], [95.40984119581458, 19.558584591605666], [95.41211302539585, 19.558205953641902], [95.42031685064222, 19.557849266330606], [95.43280093441564, 19.55392569691344], [95.43815125487657, 19.554639073334613], [95.44385826444739, 19.56212952305907], [95.45099202596128, 19.56676646799815], [95.45527228268975, 19.56890659636241], [95.4568218658365, 19.56890659636241], [95.45714587178463, 19.566638552027598], [95.46041171482881, 19.559018251890848], [95.46636875031766, 19.553273968119186], [95.46607251003837, 19.553139734411275], [95.47499914829211, 19.54617260198404], [95.48153083438058, 19.542035867161587], [95.48610301464248, 19.535721903343187], [95.48632073781187, 19.532238337129627], [95.4806599426023, 19.52875477091601], [95.46824973903426, 19.524182590654107], [95.45823448583292, 19.52396486838404], [95.4581786568196, 19.523257698184295], [95.45491559537851, 19.52681740190161], [95.45241877790431, 19.530740971318835], [95.44207482429374, 19.5325244123718], [95.42602386021304, 19.531811035950625], [95.423305165601, 19.530111852380116]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
