
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Su</div><div class="name-mm">ရှမ်းစု</div></div>
        <span class="pcode-badge">MMR005028015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.41760175981341, 23.430997620144126], [94.41253979977199, 23.433528600164834], [94.40522100004915, 23.436972720314827], [94.39962443981608, 23.43783375012754], [94.39601868001813, 23.43873519007701], [94.39727796020975, 23.44348142962434], [94.39892568007616, 23.452697789871138], [94.3994750399412, 23.459289569558052], [94.40051255990676, 23.466491729909478], [94.40069580037095, 23.468688990404644], [94.39947108022625, 23.472898379656556], [94.40213690459456, 23.476607858266107], [94.40251596074307, 23.477135309746814], [94.40365186024519, 23.478489746304774], [94.40731979916944, 23.482863359856196], [94.41138456034923, 23.481754830321222], [94.41341711990424, 23.47658118077692], [94.41480289243958, 23.47484899838264], [94.41711251962715, 23.47196201993131], [94.41877572042324, 23.465679750020513], [94.4198622003803, 23.46340319989781], [94.42084608028244, 23.461341930385856], [94.4211977997387, 23.461130159829054], [94.422778199954, 23.45777469034971], [94.42279979987092, 23.45770592998474], [94.42407239992139, 23.4536742899366], [94.42187495956182, 23.447082510249686], [94.4188844403647, 23.434509239809643], [94.41760175981341, 23.430997620144126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
