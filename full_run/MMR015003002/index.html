
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loke Hkaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyai</div><div class="name-mm">မိုင်းရယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loke Hkaik</div><div class="name-mm">လုတ်ခိုက်</div></div>
        <span class="pcode-badge">MMR015003002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.96764641125293, 22.41289934692736], [97.96507175116045, 22.413672751296474], [97.95996267743567, 22.415738942798043], [97.95101096338533, 22.42360559961878], [97.94965464274765, 22.430115936701156], [97.95128222679341, 22.434998689737768], [97.95535118780714, 22.439881442774436], [97.95833509159127, 22.448290629109295], [97.95841604136729, 22.45721034977788], [97.96972610877299, 22.462323236628094], [97.98265785257792, 22.460167945694195], [97.99312640815725, 22.454625770163204], [98.00636605105245, 22.457088959288114], [98.02206888307256, 22.46263113481905], [98.02345880328119, 22.462597234874522], [98.0258140063114, 22.462539790678875], [98.02488351286388, 22.436175823155736], [98.02476012677846, 22.427778856808857], [98.00251783582951, 22.418483571159925], [97.9818212393588, 22.41247488221012], [97.97380965409235, 22.4118072507041], [97.96764641125293, 22.41289934692736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
