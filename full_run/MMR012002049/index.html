
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Ngan Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Ngan Kan</div><div class="name-mm">ဆားငံကန်</div></div>
        <span class="pcode-badge">MMR012002049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.00163030039812, 20.57150896166928], [93.01618614787247, 20.568558286036136], [93.0167706397533, 20.556872730092493], [93.01637128590619, 20.54824160816372], [93.0165696430746, 20.54036095609331], [93.02076547774465, 20.538860013678743], [93.02274954585494, 20.53858861896964], [93.02482177990129, 20.538945899833436], [93.02682255831445, 20.540089201655405], [93.02687371984638, 20.540122722085982], [93.0276729059799, 20.5369259820485], [93.02551702509072, 20.529842374825762], [93.02293307590077, 20.527162724280345], [93.0201535430516, 20.5279767105568], [93.00979646563445, 20.532105561922208], [93.00645268464376, 20.525596256362178], [93.00338104030283, 20.529397510786566], [92.99653585864303, 20.542514523026853], [93.0016300234069, 20.545427862405973], [92.99326289656551, 20.55987555201517], [92.98919766324161, 20.561004327088085], [92.99306345571398, 20.564754020681562], [93.00163030039812, 20.57150896166928]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
