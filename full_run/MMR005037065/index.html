
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hu Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hu Laung</div><div class="name-mm">ဟူလောင်</div></div>
        <span class="pcode-badge">MMR005037065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99412678562271, 27.125757184946167], [95.9990392288774, 27.13343287972367], [96.00071933063265, 27.13631305210572], [96.00468820879388, 27.139059477313083], [96.01482097460837, 27.156509210032084], [96.0182560736589, 27.165740624929924], [96.01895858806847, 27.173087508681647], [96.0267733288261, 27.18221753221337], [96.04502543757394, 27.19023629496911], [96.04578064416148, 27.19048468142296], [96.0579223200591, 27.175292999772182], [96.07507308035844, 27.14868161976102], [96.08612075976532, 27.132507360426416], [96.08312987994009, 27.122314410181957], [96.06927492000159, 27.112304700401637], [96.04632563961661, 27.10211184008938], [96.0266725202207, 27.09429929997276], [96.01647948004404, 27.110717729739463], [96.00621491318776, 27.118261645058908], [96.00128171987552, 27.121887180049384], [96.00126228013016, 27.12187161008677], [96.00122555991175, 27.12186269960398], [95.99412678562271, 27.125757184946167]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
