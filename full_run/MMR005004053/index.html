
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Taw</div><div class="name-mm">ရုံးတော</div></div>
        <span class="pcode-badge">MMR005004053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50101131991653, 22.53361994970095], [95.4954335986817, 22.53074128638133], [95.49364201786489, 22.52688027290634], [95.47746350833432, 22.53403615144731], [95.46999650303627, 22.544303283170052], [95.47067162139825, 22.545203440686294], [95.47279663036028, 22.54803678716803], [95.47279663036028, 22.551770287568786], [95.47092987881092, 22.552703665142076], [95.47092987881092, 22.556748292299915], [95.47092987881092, 22.560792920357017], [95.47092987881092, 22.564072710087544], [95.47500909029736, 22.56304792991807], [95.48033292032807, 22.56240564040803], [95.4834883203298, 22.56207344972995], [95.48647739971227, 22.561409160104688], [95.48697564031363, 22.558751999804997], [95.489632799714, 22.557921660256454], [95.494282919721, 22.558751999804997], [95.4986007600171, 22.558585949881717], [95.50075967971549, 22.558585949881717], [95.50358280000626, 22.557755610333174], [95.50690451972787, 22.55426810958562], [95.50939536030768, 22.552607339657072], [95.50806696002223, 22.54978413033342], [95.50192212000991, 22.54911983980884], [95.49959724032044, 22.54662882026389], [95.49976320031152, 22.540484160115966], [95.50101131991653, 22.53361994970095]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
