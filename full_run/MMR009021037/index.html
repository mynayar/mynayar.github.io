
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Hpyu</div><div class="name-mm">ရေဖြူ</div></div>
        <span class="pcode-badge">MMR009021037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.34405574607587, 21.602199534980628], [94.34888461533279, 21.600899455245724], [94.35816410618861, 21.6003536018373], [94.36416848288923, 21.592165815999635], [94.37726894220799, 21.592165815999635], [94.38873184310012, 21.586707290908805], [94.39255280976442, 21.574152684998467], [94.39255280976442, 21.56651075077059], [94.39328761163404, 21.567245551740882], [94.38818599059107, 21.557231259015452], [94.37999820385409, 21.549589324787576], [94.37508553217162, 21.543039095577853], [94.36908115457169, 21.537580571386286], [94.37039120059347, 21.53321375221293], [94.36198507285286, 21.53321375221293], [94.33905927106855, 21.53321375221293], [94.32868807429526, 21.533759603822716], [94.32400151196026, 21.53408281477016], [94.3246408705798, 21.542714184911745], [94.32486710673163, 21.54576835812327], [94.33082655060491, 21.552355110599933], [94.3352383044043, 21.557231259015452], [94.34506364776917, 21.5894365525549], [94.34397194275101, 21.601445306855453], [94.34405574607587, 21.602199534980628]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
