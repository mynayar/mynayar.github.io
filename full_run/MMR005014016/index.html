
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Thar</div><div class="name-mm">အောင်သာ</div></div>
        <span class="pcode-badge">MMR005014016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50750715992757, 22.384887660437244], [95.50750715992757, 22.384277369704876], [95.51452644044292, 22.38311772000685], [95.53149432000691, 22.38470459983745], [95.53472891970392, 22.387512240097863], [95.5351867717522, 22.387512240097863], [95.5383662690881, 22.38458909990709], [95.54513324210552, 22.381555630887704], [95.54699999185618, 22.379922221933043], [95.5425664591748, 22.376422063227665], [95.53603282785281, 22.36895505792961], [95.53485467910019, 22.365084000826016], [95.53411871980313, 22.365112319577918], [95.52288815966091, 22.363891560047534], [95.51947032039902, 22.36352534981512], [95.50750715992757, 22.361328090219217], [95.49847404014491, 22.361328090219217], [95.49249264022325, 22.3609008600867], [95.49127187979349, 22.360717800386226], [95.4901123200276, 22.369689900268725], [95.49267587978807, 22.377502440385342], [95.49768059977993, 22.38311772000685], [95.5032958803007, 22.38311772000685], [95.50750715992757, 22.384887660437244]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
