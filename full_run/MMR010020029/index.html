
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Ma (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Ma (North)</div><div class="name-mm">အိုင်မ (မြောက်)</div></div>
        <span class="pcode-badge">MMR010020029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43462891709089, 20.912600906306807], [95.43649330162464, 20.902479960281994], [95.43755213192543, 20.896732024363473], [95.4430113306085, 20.891024819639767], [95.4416364983258, 20.88724402928858], [95.44232391401749, 20.882088405755383], [95.44341110533833, 20.87692425035391], [95.44043351929156, 20.876073510584092], [95.43562160315452, 20.874011261710393], [95.42806002155282, 20.8716053036419], [95.4211858574414, 20.867480804995182], [95.41156202516737, 20.867824513290714], [95.40400044356568, 20.868855638177195], [95.39712627855499, 20.870917887050894], [95.38612761489759, 20.870917887050894], [95.37719120011383, 20.872980136823912], [95.37134815998962, 20.872980136823912], [95.37130905476914, 20.88683857713869], [95.37086859560924, 20.89084466744748], [95.37570798333684, 20.89084466744748], [95.3850804595956, 20.891915806769134], [95.39070394463141, 20.89405808721102], [95.401950917401, 20.896735938213055], [95.41159117938946, 20.900217142806923], [95.42524821563268, 20.907715125252878], [95.43462891709089, 20.912600906306807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
