
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Pat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Pat</div><div class="name-mm">တောင်ပတ်</div></div>
        <span class="pcode-badge">MMR009014043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.90248825343019, 19.32880301814481], [94.90716367676231, 19.333478442376247], [94.9151533257654, 19.352712782568915], [94.92690273897028, 19.35225202211319], [94.9323162763751, 19.347978175752246], [94.949102236579, 19.34499749064173], [94.95178073509288, 19.337119556322534], [94.95398930006621, 19.328506152836724], [94.95313754855908, 19.328681514340474], [94.9474001787753, 19.328832908012373], [94.94644329472231, 19.329278272074646], [94.94546656982641, 19.331979224861414], [94.94166393584203, 19.331494896772142], [94.9416646696888, 19.331418476881254], [94.93727516601615, 19.334294356799205], [94.93727516601615, 19.331121882269088], [94.93385865505297, 19.32697325661053], [94.92824581169492, 19.32526500337724], [94.92312104390112, 19.324776928712367], [94.92177814834292, 19.32307248500723], [94.91677608764638, 19.31672372012366], [94.91388285530957, 19.316884455053582], [94.91278602325644, 19.31809097022216], [94.90598002595749, 19.321050098583214], [94.90065359328878, 19.323713315816917], [94.89806921602155, 19.325547389600388], [94.89976585361131, 19.32608061922525], [94.9024290699457, 19.328447921734266], [94.90248825343019, 19.32880301814481]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
