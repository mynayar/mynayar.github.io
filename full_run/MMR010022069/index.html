
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Pauk Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Pauk Kone</div><div class="name-mm">တပေါက်ကုန်း</div></div>
        <span class="pcode-badge">MMR010022069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11487844938097, 21.114281604812277], [95.1113627099212, 21.108848190591573], [95.10784697226, 21.104054002790065], [95.10656852122031, 21.0989402013293], [95.10465084556012, 21.09286756158872], [95.10369200817968, 21.08839298564783], [95.1017743334188, 21.082000734046687], [95.09985665685929, 21.07784576996636], [95.09634091829878, 21.071133905605336], [95.09154672959795, 21.06633971690445], [95.08838516474361, 21.062818613888], [95.08594460885666, 21.0667610510817], [95.08437499421069, 21.070528126771706], [95.08267019707199, 21.074619640084393], [95.0797232257463, 21.079203817302357], [95.07727603376202, 21.082874605278846], [95.07710369577899, 21.083133110904384], [95.07677625532, 21.08837217083908], [95.07677625532, 21.08959430363427], [95.08419563971705, 21.09286756158872], [95.08835060379738, 21.09574407462941], [95.09442324263858, 21.101497101609993], [95.09698014381866, 21.103734390030127], [95.09985665685929, 21.10661090307076], [95.10369200817968, 21.109487417010712], [95.10816658412062, 21.111405091771644], [95.11232154820095, 21.11396199295166], [95.11487844938097, 21.114281604812277]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
