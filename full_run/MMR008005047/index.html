
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Kone</div><div class="name-mm">ကြို့ကုန်း</div></div>
        <span class="pcode-badge">MMR008005047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36894642873477, 18.686176593275206], [95.36289059642394, 18.68733008621456], [95.35596964328448, 18.68559984725522], [95.35164404813435, 18.684157982205193], [95.3444347219849, 18.685311474245168], [95.33751376884544, 18.688195205244597], [95.32713233958589, 18.688771951264584], [95.31790454086195, 18.689890472267507], [95.31836582562244, 18.69926993266131], [95.31836582562244, 18.701715392551364], [95.31934401011802, 18.70831813407466], [95.32251837232508, 18.708958062864383], [95.32915095155522, 18.71039992791441], [95.33722539583539, 18.71213016597443], [95.35106730211436, 18.713572031024455], [95.35971849331389, 18.71328365801446], [95.36317896943393, 18.712706911994417], [95.36462083358464, 18.70953480888437], [95.36548595261468, 18.700595244674844], [95.3672161906747, 18.697999887584785], [95.37125341371416, 18.69828826059478], [95.37298365177418, 18.697999887584785], [95.37183015973415, 18.69107893534465], [95.36635107164471, 18.691944054374687], [95.36894642873477, 18.686176593275206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
