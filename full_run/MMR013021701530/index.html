
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (98) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (Seikkan)</div><div class="name-mm">ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (98) Ward</div><div class="name-mm">အမှတ် (၉၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013021701530</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.30038424305951, 16.849499867884674], [96.30084043112868, 16.84944749782244], [96.30108851342419, 16.846192158641315], [96.30156778282702, 16.84315219831535], [96.30212449195187, 16.84147663903576], [96.30212471997072, 16.841475952756127], [96.3022491047127, 16.84110158576982], [96.30224443273471, 16.84032797365711], [96.30224442267019, 16.84032630715018], [96.30221463819521, 16.835394399931943], [96.30181232693838, 16.833847910418967], [96.30181074097322, 16.833841813948766], [96.30170699338333, 16.833443008688107], [96.30153420240663, 16.833115809265394], [96.30120811426332, 16.833303451892846], [96.30093329244625, 16.833492542733097], [96.30037688078852, 16.833875381144196], [96.2970904973298, 16.835289290412447], [96.2975980178893, 16.837374414168778], [96.29778837476977, 16.839163768844912], [96.29790258889784, 16.84049626700846], [96.29778837476977, 16.842247550308684], [96.2975980178893, 16.844113047737267], [96.29733151825661, 16.84590240241357], [96.29710309000001, 16.84693032956818], [96.29736958963252, 16.847767899842268], [96.29785208270772, 16.849466670250877], [96.300057620563, 16.84952831158256], [96.3001210335591, 16.84953008414618], [96.30038424305951, 16.849499867884674]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
