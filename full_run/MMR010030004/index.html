
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Pyauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Pyauk</div><div class="name-mm">အပျောက်</div></div>
        <span class="pcode-badge">MMR010030004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97633859395103, 20.856808963962578], [95.97558940113004, 20.857584316263228], [95.9755453316518, 20.85762992268286], [95.97510770895366, 20.857692516396583], [95.97166926262645, 20.858184316053382], [95.97056388881248, 20.858343123736233], [95.9672084337223, 20.858271349743063], [95.96557069183405, 20.858236618824947], [95.96343150505999, 20.858300341187828], [95.96149253795033, 20.858358383432687], [95.95668602044356, 20.86015891969845], [95.95290565457236, 20.86354637086839], [95.95181508629724, 20.86639091930556], [95.95116258588467, 20.868093387200133], [95.9506251033659, 20.869393853643487], [95.95326450655182, 20.870664678432206], [95.95766981401079, 20.870979343122258], [95.96553643485862, 20.873181995952393], [95.97151506576773, 20.875384649681905], [95.97875235723558, 20.878216633690727], [95.98473098904395, 20.880104622730187], [95.99070962085239, 20.880104622730187], [95.99480026272198, 20.87947529335014], [95.99889090639027, 20.87758730431068], [95.99511492831135, 20.874440655611807], [95.99322693927189, 20.867518029733333], [95.99133895023243, 20.863112722274366], [95.99133895023243, 20.859022080404714], [95.99070962085239, 20.85681942577594], [95.98001101689499, 20.857134091365253], [95.97633859395103, 20.856808963962578]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
