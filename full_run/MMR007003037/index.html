
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mway Bway Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mway Bway Kone</div><div class="name-mm">မွေဘွေးကုန်း</div></div>
        <span class="pcode-badge">MMR007003037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67035530765139, 17.140625583004294], [96.67446548729248, 17.14212018969505], [96.68677533731204, 17.143146008581482], [96.69395608300687, 17.143829888138896], [96.69634966010881, 17.139726611693845], [96.69703352707569, 17.1294684219302], [96.69916722798524, 17.125023206156072], [96.69730707386242, 17.125023206156072], [96.69730706756718, 17.120236051052984], [96.69422960101531, 17.116474713936952], [96.69168440631034, 17.115383919032695], [96.68944243422101, 17.114423076164087], [96.68157780627081, 17.111687558833808], [96.67446060487305, 17.11033190369443], [96.67166154594366, 17.117500532823385], [96.66619050498787, 17.11955217059625], [96.65300689255412, 17.11892427293691], [96.65360710818157, 17.122971568383207], [96.65600069787399, 17.129810362158537], [96.65463294595378, 17.136307214806152], [96.66318145256207, 17.13801691414932], [96.67035530765139, 17.140625583004294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
