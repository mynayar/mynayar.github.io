
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yan Chaung</div><div class="name-mm">မရမ်းချောင်</div></div>
        <span class="pcode-badge">MMR013004053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.22974264610627, 17.36547391458953], [96.22725437039293, 17.364639380602966], [96.2270322270557, 17.367082956413356], [96.22658794128051, 17.37174796379753], [96.2285872304164, 17.380189406116244], [96.22862250902165, 17.38339609715223], [96.22877400341758, 17.383602680419415], [96.23272967593385, 17.388996778978196], [96.23347643429008, 17.394970838633355], [96.23795697903142, 17.39907800644488], [96.24206414594363, 17.4005715213587], [96.25401226705253, 17.4005715213587], [96.2562551015917, 17.40049418236066], [96.26484025197612, 17.400198141730925], [96.26745390307525, 17.398331248987972], [96.26758831934552, 17.39604617059433], [96.26782728180365, 17.391983808805776], [96.26690030020876, 17.390232844070567], [96.26446687324767, 17.38563637042222], [96.26342140777183, 17.38380680494015], [96.25998632760701, 17.377795415326204], [96.2551324032379, 17.37219473260086], [96.25027847886878, 17.365100535861075], [96.24019725230141, 17.36547391458953], [96.22974264610627, 17.36547391458953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
