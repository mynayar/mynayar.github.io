
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shin Swei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tsawlaw</div><div class="name-mm">ဆော့လော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shin Swei</div><div class="name-mm">ရှင်ဆွယ်</div></div>
        <span class="pcode-badge">MMR001006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.30180566839692, 26.078159841903243], [98.30931926667085, 26.069983277806102], [98.31749583076805, 26.06335363216442], [98.32191559482891, 26.05650299701574], [98.32677733610524, 26.049210385550907], [98.33473291069532, 26.04766346889403], [98.33832875366909, 26.034814433939005], [98.32866058032158, 26.036865090551544], [98.31635571794209, 26.03657180094791], [98.30405092840766, 26.033934631677937], [98.29408996727824, 26.029832595398034], [98.28713859097326, 26.03265062912328], [98.28324982981587, 26.034227102898512], [98.27592538684718, 26.038035727267072], [98.262155607995, 26.039500311889924], [98.26733150674369, 26.048768410134073], [98.27307720065232, 26.05871287859651], [98.28368463493803, 26.06733141990918], [98.29429206922367, 26.073961065550805], [98.30180566839692, 26.078159841903243]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
