
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dar Dauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dar Dauk</div><div class="name-mm">ဒါးဒေါက်</div></div>
        <span class="pcode-badge">MMR007014015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50943820830673, 18.76069917992328], [96.50750585391211, 18.754258000706216], [96.50750585391211, 18.746528585825615], [96.51265879656626, 18.740087406608552], [96.51652350535556, 18.731391814980327], [96.51974409361509, 18.72334034118387], [96.52199850692563, 18.716416074042627], [96.51523526879271, 18.713839601816233], [96.50847203065973, 18.711263131388478], [96.49623379095675, 18.709974894825564], [96.49362611585263, 18.708570761731323], [96.48979261173969, 18.709169747086207], [96.483351433422, 18.705305040095595], [96.47972115720569, 18.70494201166457], [96.48592790384976, 18.712068278228514], [96.48882643499206, 18.72011975202497], [96.48882643499206, 18.72784916690557], [96.48850437607615, 18.73396828720672], [96.48721614041261, 18.742663877935684], [96.4836180770127, 18.749407557612756], [96.48463966818622, 18.752003588294997], [96.49049131572173, 18.75428529423101], [96.49623379095675, 18.757156530949203], [96.50074261577913, 18.758122707696828], [96.50943820830673, 18.76069917992328]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
