
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Poet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar Poet</div><div class="name-mm">ကြာပို့</div></div>
        <span class="pcode-badge">MMR010018072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2308119186352, 21.307650629572947], [95.22855384058732, 21.307027352630257], [95.22807062765742, 21.30656610474199], [95.22460582939556, 21.303258795756847], [95.22388800762553, 21.298234052359703], [95.22370855330718, 21.291773668120356], [95.22370855330718, 21.28836402078298], [95.2220934572473, 21.277596714017193], [95.22091389206253, 21.274058017563505], [95.21647177805016, 21.283521561870657], [95.2138349550192, 21.286451375930312], [95.21289258062814, 21.29241369763406], [95.21000761935619, 21.295638066643505], [95.20762314429271, 21.296414538600118], [95.20746206492242, 21.301407990086716], [95.20814087859873, 21.307517321267426], [95.21034702619437, 21.31515398366946], [95.21323198836564, 21.32075420324395], [95.2129036647724, 21.326116812940597], [95.21760707860386, 21.32802360230744], [95.22675929020915, 21.332689435269288], [95.23078054758429, 21.333091560826915], [95.23037205392723, 21.327372645131504], [95.23054175689663, 21.316341908951983], [95.2308119186352, 21.307650629572947]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
