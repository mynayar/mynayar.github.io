
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Wauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Wauk</div><div class="name-mm">ကောင်းဝေါက်</div></div>
        <span class="pcode-badge">MMR015008007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.66985496043816, 22.902843708670275], [98.68293550786746, 22.907579769690642], [98.7081538443245, 22.9238122619264], [98.71366129613199, 22.929899446402374], [98.73192284955991, 22.950769792791732], [98.73569110695905, 22.957726575820857], [98.72786472717547, 22.96990094477286], [98.7289748521078, 22.97167714358534], [98.73829989992049, 22.96990094477286], [98.75337292861781, 22.962074564989223], [98.76728649287742, 22.965842822388367], [98.77972836966859, 22.963119037613524], [98.77772166742108, 22.95279885488327], [98.77975547703369, 22.952359552251608], [98.81395490839236, 22.94497247509969], [98.83074828800312, 22.941054020126955], [98.82902793708968, 22.936566362647568], [98.81888262932995, 22.91250748972891], [98.7878669751808, 22.89656486427714], [98.76941682132929, 22.887916354855918], [98.74037322484452, 22.895971720018906], [98.7171396867472, 22.892216875108772], [98.69337068061247, 22.884390495325135], [98.69163958280058, 22.88284654283376], [98.68500284060866, 22.88599131194951], [98.67419161095415, 22.89021042467141], [98.66917298114822, 22.89092635966381], [98.66985496043816, 22.902843708670275]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
