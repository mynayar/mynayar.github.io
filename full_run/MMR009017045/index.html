
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyin</div><div class="name-mm">ကျင်း</div></div>
        <span class="pcode-badge">MMR009017045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52531427063712, 19.471105840062535], [95.5246399643629, 19.472364545587368], [95.52202728992756, 19.47824306306694], [95.5215918435888, 19.482815244228163], [95.52202728992756, 19.49065326843362], [95.52202728992756, 19.49435455601798], [95.51919689232278, 19.49783812313092], [95.51789055510511, 19.50197485705405], [95.51832600144388, 19.506982482755404], [95.52246273626633, 19.511336940747242], [95.5281235296772, 19.514602783791474], [95.53117165135069, 19.51634456734797], [95.53164020443194, 19.517482483130152], [95.53784408583596, 19.51891414806954], [95.54074846886681, 19.521334467411805], [95.54074299109624, 19.521427590411008], [95.54292868630989, 19.52069902533981], [95.54619452935412, 19.521352193049324], [95.55054898734596, 19.52200536165816], [95.56099968508744, 19.51765090456564], [95.56339463725277, 19.51394961608196], [95.57036176878069, 19.50959515809012], [95.57819979298614, 19.506547038215274], [95.58588537580948, 19.50641220286093], [95.58821678997293, 19.492423716081703], [95.59855051919118, 19.478783193189884], [95.60144396376796, 19.474649701322733], [95.60704219943801, 19.468118427123784], [95.60334365928253, 19.468072765845534], [95.56389035165847, 19.46986610034031], [95.54786458298418, 19.47050712990017], [95.52802371212465, 19.47130076272009], [95.52531427063712, 19.471105840062535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
