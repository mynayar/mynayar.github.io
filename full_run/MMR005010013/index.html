
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Boke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Boke</div><div class="name-mm">အင်ဘုတ်</div></div>
        <span class="pcode-badge">MMR005010013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26498632006269, 22.674382019814402], [95.260070880267, 22.668701130153067], [95.24627676036425, 22.663879379929483], [95.2269285597053, 22.66467282029447], [95.2105103997352, 22.669494659550935], [95.20947252004083, 22.669494659550935], [95.19329843967131, 22.670288099915922], [95.17071527958655, 22.675720229904755], [95.15911860004343, 22.679504370230575], [95.1405029997137, 22.68170162982642], [95.14031976014888, 22.683471660189014], [95.12927243957148, 22.690490759940644], [95.12768555974083, 22.70532230987675], [95.12847900010581, 22.717102050019662], [95.12487792037979, 22.72088619034548], [95.1364745999229, 22.719299309615508], [95.14971935996056, 22.71148686033041], [95.16210947986866, 22.700683620252903], [95.17547591997777, 22.695922889929477], [95.1981202798271, 22.690490759940644], [95.20971696026953, 22.687316910347192], [95.2269285597053, 22.687316910347192], [95.23468007992182, 22.69128420030563], [95.23632816041635, 22.69830321012512], [95.24169936043717, 22.69830321012512], [95.24648088038839, 22.698814859618153], [95.24407967973349, 22.692871080136285], [95.24871828032445, 22.686706529682624], [95.25347891981636, 22.67810055010034], [95.25891095987294, 22.677307109735352], [95.26678272034633, 22.677307109735352], [95.267517120219, 22.677307109735352], [95.26498632006269, 22.674382019814402]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
