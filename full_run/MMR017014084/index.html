
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Daing Let Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Daing Let Pan</div><div class="name-mm">လင်းဒိုင်းလက်ပံ</div></div>
        <span class="pcode-badge">MMR017014084</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01661115987719, 16.487596979716898], [95.01512688010149, 16.48297845019539], [95.01149771994386, 16.478030070031764], [94.99945679959171, 16.476875370202208], [94.99846716043118, 16.480999080143476], [94.99549787962349, 16.48693719029916], [94.992364080438, 16.492215510137726], [94.98956004016378, 16.496998919564533], [94.98877061976833, 16.49835449016763], [95.00373372613063, 16.502868013048385], [95.00902380010837, 16.505411310183888], [95.01232248009842, 16.511349330407313], [95.01611652016135, 16.5087102599706], [95.02238448005977, 16.503761789874773], [95.02617816039384, 16.50145257008012], [95.02650792020444, 16.499473200028206], [95.02836552025263, 16.49726766037429], [95.02667315983854, 16.495349490086937], [95.02023996030596, 16.492215510137726], [95.01661115987719, 16.487596979716898]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
