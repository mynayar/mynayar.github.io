
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnit Kyat Khwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnit Kyat Khwe</div><div class="name-mm">နှစ်ကျပ်ခွဲ</div></div>
        <span class="pcode-badge">MMR010020043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12434335975831, 20.888030148272776], [95.11846223784204, 20.887007343913865], [95.11361190356655, 20.892722093949544], [95.11476445941236, 20.906552749709704], [95.11822212335238, 20.918846666440572], [95.11844404006047, 20.93216174177104], [95.1193944696791, 20.932290965355833], [95.12090047527676, 20.932664409734798], [95.12120967118943, 20.932741081435836], [95.12209457440514, 20.93297393929589], [95.12320743867241, 20.93338848359167], [95.12357902505204, 20.933526992676605], [95.12466239875079, 20.934282302686142], [95.12544059830503, 20.934793471941248], [95.12559797696514, 20.934992991033766], [95.12613837508599, 20.935678535236264], [95.12635163581939, 20.935936736890937], [95.12851996602365, 20.930022227643747], [95.13376629158114, 20.92162810675177], [95.13376629158114, 20.91148521097375], [95.12921947669753, 20.897844765423656], [95.12467266091465, 20.890499909643154], [95.12434335975831, 20.888030148272776]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
