
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Da Le</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Launglon</div><div class="name-mm">လောင်းလုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Da Le</div><div class="name-mm">ပန်းဒလဲ</div></div>
        <span class="pcode-badge">MMR006002006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11528236758727, 14.045734392228496], [98.11739879971492, 14.045409809814942], [98.13490128036983, 14.042244510076102], [98.13825252033763, 14.04317565013622], [98.1427212003232, 14.043361860161781], [98.14588667992638, 14.043361950093981], [98.14830732032664, 14.042989530042803], [98.1527760003122, 14.041872359821582], [98.15501015999092, 14.04112760965154], [98.15703947928858, 14.039695168597177], [98.15817563959416, 14.03889318017616], [98.160410159901, 14.03777600995494], [98.16208596019897, 14.034796740377317], [98.16245820038569, 14.030700209746954], [98.16196284660816, 14.029072401769952], [98.16046055970713, 14.028821999935417], [98.15739227973, 14.028602761408365], [98.15410439969833, 14.027506741443005], [98.14906332011617, 14.024438010006179], [98.14467959998359, 14.018519790156233], [98.14139207968077, 14.014574279979115], [98.13898116005254, 14.00953283976878], [98.13606693933787, 14.012993363552937], [98.13547403969523, 14.01369741040719], [98.13299509894472, 14.016518441572885], [98.12911787968648, 14.020930709784466], [98.1251722795771, 14.02925994009422], [98.12166551984791, 14.03473968019216], [98.12059036865065, 14.036122026310522], [98.11859688014198, 14.038685100437078], [98.1177155760131, 14.040559454854986], [98.11528236758727, 14.045734392228496]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
