
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Thee Chaung Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Thee Chaung Lay</div><div class="name-mm">ကွမ်းသီးချောင်းလေး</div></div>
        <span class="pcode-badge">MMR017017106</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.16089795997294, 16.387612379907466], [95.15658986922716, 16.387285402599275], [95.15078398459326, 16.386143261802147], [95.14502568758547, 16.385191476905163], [95.1420016083876, 16.38425769733493], [95.14012399932318, 16.383287908909892], [95.13869632287708, 16.382050588363995], [95.13693962766172, 16.380582965831252], [95.13590507995553, 16.381138770238124], [95.13518580038442, 16.38457695036601], [95.13393588033665, 16.390550789687268], [95.13557136042999, 16.39332071957557], [95.13720683962401, 16.39609065036325], [95.14016135985895, 16.39611351023035], [95.14332287974719, 16.39612466991764], [95.15067264043006, 16.395713460308002], [95.15278980010925, 16.39559492966231], [95.15773476015113, 16.395166530411075], [95.16012336040484, 16.390197449652646], [95.16055499991336, 16.389298890231657], [95.16074904033599, 16.388344890304495], [95.16089795997294, 16.387612379907466]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
