
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Dar U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Dar U</div><div class="name-mm">တံတားဦး</div></div>
        <span class="pcode-badge">MMR013006054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97770200394439, 16.94311348589872], [95.98214295063673, 16.939505216992245], [95.9832531879843, 16.935064270299904], [95.98464098309495, 16.931733560055818], [95.98491854265666, 16.927570172925186], [95.98491854265666, 16.9242394626811], [95.98686145689078, 16.920631193774625], [95.98713901555317, 16.915635128858185], [95.98797169333903, 16.910639063941687], [95.98991460667384, 16.9073083536976], [95.98996507213042, 16.90703079503521], [95.99046972579725, 16.904255203015282], [95.99056827260773, 16.902382809119388], [95.98158783331189, 16.905920557687637], [95.97548153104788, 16.908696149707566], [95.96937522878386, 16.908696149707566], [95.9660445194391, 16.911471741727553], [95.96077089496089, 16.917855601754695], [95.96410160520497, 16.92451702224281], [95.96493428299084, 16.928402849811732], [95.96382404564326, 16.93395403385165], [95.96826499323492, 16.93395403385165], [95.97048546613144, 16.937839862319834], [95.9743712937003, 16.9411705716646], [95.97770200394439, 16.94311348589872]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
