
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Chan Thar</div><div class="name-mm">အောင်ချမ်းသာ</div></div>
        <span class="pcode-badge">MMR010007023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11255675399104, 22.0233393300461], [96.11201425325527, 22.023365903213914], [96.10828272776575, 22.023600953621155], [96.1044232350443, 22.02381076185725], [96.10346508294725, 22.02396716295425], [96.09831794991351, 22.02512318658586], [96.09826378104873, 22.02644032016468], [96.09826378104873, 22.02982387727019], [96.09950233816244, 22.035190953899473], [96.09950233816244, 22.039319475213688], [96.10074089437683, 22.044892977728807], [96.10301158002045, 22.043860848299573], [96.10466298890589, 22.04138373497142], [96.10755295310634, 22.039525901099523], [96.11023649232033, 22.038080918999242], [96.11353930919182, 22.036842362784853], [96.11457143862106, 22.036842362784853], [96.11519071717794, 22.036016658342135], [96.11457143862106, 22.03333312002752], [96.11415858684938, 22.03333312002752], [96.11353930919182, 22.029411024599142], [96.11271360384978, 22.02714033895552], [96.1124740388459, 22.02458498191146], [96.11255675399104, 22.0233393300461]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
