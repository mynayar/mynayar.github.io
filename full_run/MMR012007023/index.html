
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Ye Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Ye Kan</div><div class="name-mm">ယင်ရဲကန်</div></div>
        <span class="pcode-badge">MMR012007023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.20668162555666, 20.324535274383436], [93.20624402803952, 20.324553486554237], [93.20530892466718, 20.32386196995401], [93.20428049774682, 20.32377254136975], [93.20331253224765, 20.323102014946073], [93.20202762317632, 20.323102014946073], [93.19826807481184, 20.32433933459265], [93.19293808262648, 20.32652843913621], [93.19036826358456, 20.32776575878279], [93.18684666234367, 20.328907899579974], [93.18434465038536, 20.330550440250647], [93.17847154232788, 20.33240387194121], [93.16984229098898, 20.332448716635042], [93.17091019724785, 20.33606047940765], [93.17197379575413, 20.34204128577676], [93.17224385137268, 20.347275135039524], [93.17251503384182, 20.35350595293744], [93.17385730796843, 20.36278915709397], [93.1825686260413, 20.362966971948254], [93.19631428867353, 20.36494600025776], [93.2113811012569, 20.36642386426996], [93.215346242735, 20.366917502141064], [93.21831987805996, 20.366084563551794], [93.21728426825445, 20.36386520221737], [93.21350400670462, 20.357638373712007], [93.20983493103728, 20.35152274008243], [93.20889948232531, 20.34390401735658], [93.2082785418213, 20.338846794044343], [93.2071668268876, 20.32995139374185], [93.20668162555666, 20.324535274383436]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
