
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing To</div><div class="name-mm">အိုင်တို</div></div>
        <span class="pcode-badge">MMR010023008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.93247847969815, 20.31742222425629], [95.9316819843362, 20.32200207663459], [95.92521248366927, 20.33372804541301], [95.91752995314488, 20.345454013292112], [95.91348651579011, 20.351923512160397], [95.9062083285516, 20.368905949050372], [95.90286346837445, 20.37008648820091], [95.90944307933472, 20.37739716704567], [95.92399945291248, 20.386697073411256], [95.93208632672264, 20.389931823295058], [95.9434079522153, 20.389931823295058], [95.95553826338022, 20.389931823295058], [95.96281644971941, 20.390740509866703], [95.9700946378573, 20.383462322628134], [95.97211635608505, 20.382906350947394], [95.97211635608505, 20.375375447918657], [95.97049898114312, 20.36081907434084], [95.96483816884648, 20.33938885681033], [95.95998604402075, 20.319980358406838], [95.95149482602545, 20.317149951808858], [95.94219491965987, 20.315128232681843], [95.93370370166457, 20.317149951808858], [95.93247847969815, 20.31742222425629]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
