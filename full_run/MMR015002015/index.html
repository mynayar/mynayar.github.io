
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mauk Sa Li</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mauk Sa Li</div><div class="name-mm">မောက်စလီ</div></div>
        <span class="pcode-badge">MMR015002015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.91388811844195, 23.267340577006053], [97.91376838360407, 23.267249016129256], [97.91333790062367, 23.266919822891566], [97.90842530808158, 23.26405414398363], [97.90178592098351, 23.25534629729384], [97.90310333335219, 23.252591428351764], [97.9031698409155, 23.25254856756237], [97.89608459872534, 23.24693384821859], [97.89261705843057, 23.243164781429584], [97.89050638016539, 23.240601817020263], [97.88643578868079, 23.23939571643922], [97.88562480524064, 23.23938069776102], [97.87829460571152, 23.2392449531921], [97.87090723628, 23.2392449531921], [97.86455412227497, 23.23985415574475], [97.86666827192329, 23.243585007642025], [97.86995168861961, 23.255791297130713], [97.87076209919161, 23.266919822891566], [97.87039875869584, 23.27527663810639], [97.8735758107751, 23.274737139307604], [97.88023830055721, 23.273309462861448], [97.8895657891299, 23.271025180367815], [97.90003541760052, 23.27026375227041], [97.90688826508142, 23.27007339457157], [97.91388811844195, 23.267340577006053]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
