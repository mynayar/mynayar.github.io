
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (1) Ward</div><div class="name-mm">အမှတ် (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009017701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.16135080369668, 19.72327292330681], [95.16135222012889, 19.72175821227171], [95.16137177948411, 19.720220751986176], [95.16200804353645, 19.72016614964815], [95.16193580369446, 19.719497452445523], [95.16182956857978, 19.719088765434208], [95.16221626356975, 19.718802084049003], [95.16258261049916, 19.718066728197016], [95.161901099756, 19.71820738486298], [95.16158256798121, 19.71819205322072], [95.16109715800752, 19.71801359355254], [95.16085445347034, 19.717756611378547], [95.16058095434761, 19.717412671057957], [95.16050092457806, 19.71708531693389], [95.16056324849518, 19.716914639998663], [95.16062557331162, 19.716642622059396], [95.16046197134295, 19.71658328479083], [95.16035927775852, 19.716365270241056], [95.16009864793432, 19.716183924648476], [95.16011533485488, 19.71604145944582], [95.15987972956594, 19.715690915403457], [95.15970203791875, 19.715426537204962], [95.1595093986399, 19.71529852770493], [95.15926576690168, 19.715255857571833], [95.15894281226105, 19.715117180313655], [95.15843924767319, 19.718819107315994], [95.1582468116411, 19.72182445723297], [95.15837410168348, 19.722610238971413], [95.15840771474427, 19.72331965747628], [95.15970345435102, 19.723278256286562], [95.16135080369668, 19.72327292330681]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
