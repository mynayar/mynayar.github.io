
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shin Ma Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shin Ma Kan</div><div class="name-mm">ရှင်မကန်</div></div>
        <span class="pcode-badge">MMR009018034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91956150835699, 21.336093899813648], [94.91720176824708, 21.32476715088336], [94.91337224813083, 21.318544179570267], [94.91863783806582, 21.3070556192215], [94.91624438776836, 21.297003128691472], [94.91868135625964, 21.29212919440687], [94.91193617831203, 21.29125884761777], [94.90950901692764, 21.287921502175607], [94.90714927771705, 21.288865398219627], [94.89885793764375, 21.294141706274786], [94.89661809694769, 21.295567058872734], [94.8903951256346, 21.303226099105245], [94.89326726707077, 21.310406449997743], [94.88800167623646, 21.320937629867785], [94.88560822593894, 21.328117980760226], [94.88656560641766, 21.336734400572198], [94.89470333688956, 21.33721309171085], [94.90810665819578, 21.336255711232127], [94.91703975627979, 21.341730836908653], [94.91911652830521, 21.336255711232127], [94.91956150835699, 21.336093899813648]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
