
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Hseng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Hseng</div><div class="name-mm">နောင်ဆိုင်</div></div>
        <span class="pcode-badge">MMR015009004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.84923818669301, 23.900733071574052], [97.84782250540434, 23.90049712544203], [97.84419655132984, 23.899892799912834], [97.84148396581242, 23.89660914399684], [97.83762923859854, 23.889613528241796], [97.83614578260182, 23.88750245607355], [97.8339172796588, 23.884331124581763], [97.83172649068507, 23.882564359657522], [97.82560112279361, 23.88823446374954], [97.82245041635372, 23.901890952305678], [97.81978542026098, 23.904651127247803], [97.81569274772221, 23.908172729388014], [97.81150489633399, 23.913312365673164], [97.80893507819138, 23.916929145763504], [97.80627008209865, 23.919023070558296], [97.80179669506151, 23.919023070558296], [97.79865580741966, 23.91987967840447], [97.79665705967562, 23.92130735395125], [97.79503902643, 23.924162707742823], [97.79354205901888, 23.927659753894602], [97.7988187519839, 23.927810516242403], [97.80017561581207, 23.928262804185124], [97.80288934256919, 23.93142881978423], [97.80545230877709, 23.93293644685957], [97.80876908672406, 23.93353949715015], [97.81268891586086, 23.93399178509287], [97.81662903819961, 23.93487512978345], [97.82609435866777, 23.92496485894111], [97.82673879036292, 23.924290132683552], [97.84923818669301, 23.900733071574052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
