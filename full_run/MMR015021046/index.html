
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Kun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Kun</div><div class="name-mm">ကောင်းကွန်း</div></div>
        <span class="pcode-badge">MMR015021046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.73253755056754, 23.05520060212615], [98.71288077272953, 23.072400282846843], [98.70474155387967, 23.078636020036356], [98.70987274103425, 23.08197129164182], [98.71944374982922, 23.095644163147654], [98.72874130176973, 23.103027511710366], [98.73667156584014, 23.104668257334254], [98.75330659732168, 23.095120183050085], [98.78446806125208, 23.079539450185507], [98.78415374010308, 23.07943467736851], [98.77991918512237, 23.076141133406622], [98.77816306996976, 23.075839537664592], [98.77407998420398, 23.07772404003248], [98.77046863871675, 23.076013399998487], [98.77027283292495, 23.074708025954692], [98.7680910011988, 23.074403725051923], [98.76194889602482, 23.07228623712018], [98.75813445034464, 23.071225964306848], [98.75439744978252, 23.071225948119036], [98.75410977914305, 23.071225947219716], [98.7435164606162, 23.0697421539773], [98.74324306581491, 23.06949932623297], [98.74307301121058, 23.069348285095316], [98.74160924317209, 23.068048175682804], [98.74160927374902, 23.061692738728937], [98.74054904140519, 23.058725235880956], [98.73760037305885, 23.05688614567913], [98.73253755056754, 23.05520060212615]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
