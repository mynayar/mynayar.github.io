
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (57) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (57) Ward</div><div class="name-mm">အမှတ် (၅၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2439721386034, 16.86328263558522], [96.24530219993665, 16.86485099657631], [96.24549293535074, 16.865067588398517], [96.24566777524768, 16.865411758046264], [96.24567127271115, 16.865672111778565], [96.2456302654245, 16.865961074743836], [96.24551963802094, 16.866521835314472], [96.24540138256782, 16.867151260022695], [96.24527295398372, 16.86786206528211], [96.24530601486077, 16.868389765875065], [96.2457733151864, 16.869011243274315], [96.24637031573752, 16.869540532069948], [96.24716949467648, 16.870248794946008], [96.24750729712412, 16.870538221961397], [96.2481387453069, 16.870018322987278], [96.24933242804917, 16.869010925813598], [96.25045967067734, 16.868082046649192], [96.25166459494517, 16.86708016861496], [96.25059127836488, 16.86588096583398], [96.2491321562241, 16.86425209036173], [96.24780273430878, 16.862783431809987], [96.246456463595, 16.861258188814418], [96.2439721386034, 16.86328263558522]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
