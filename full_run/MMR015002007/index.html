
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Yang</div><div class="name-mm">မိုင်းယန်း</div></div>
        <span class="pcode-badge">MMR015002007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11364560596002, 23.29060716698723], [98.11106974797053, 23.280838835244083], [98.10206332816011, 23.273879329067825], [98.10350537037658, 23.273443362920887], [98.09715073561802, 23.271013650159887], [98.06590436399529, 23.266717273983033], [98.06440011927015, 23.266510439805018], [98.05416555199866, 23.265691675430503], [98.03369641565712, 23.265282292343954], [98.01581968303202, 23.268120631861734], [98.01541872119708, 23.269369578843055], [98.01527419474837, 23.27920130379721], [98.01997073326277, 23.29437473370706], [98.02534500896508, 23.29408423290107], [98.03915853713681, 23.296563583742454], [98.04907594140161, 23.29514681157616], [98.051555292243, 23.290188108994073], [98.06602085677719, 23.292474263876215], [98.08449524286124, 23.287000372069542], [98.09901715711618, 23.28877133682778], [98.11364560596002, 23.29060716698723]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
