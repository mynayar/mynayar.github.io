
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Sa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Sa</div><div class="name-mm">အင်းစ</div></div>
        <span class="pcode-badge">MMR005001028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74294536024024, 22.110683220154556], [95.7413037602604, 22.108157910359353], [95.74102979978551, 22.098563639700274], [95.74190027967421, 22.096901519889286], [95.73856272019344, 22.096644839887517], [95.7311611198898, 22.096096560108208], [95.71964832011395, 22.095274229921813], [95.71361759957261, 22.095274229921813], [95.7084091201848, 22.10103072019166], [95.70457151965996, 22.106513160054362], [95.70018564025514, 22.107061439833615], [95.69305836015525, 22.105690829867967], [95.68702763961392, 22.1032237502759], [95.68154519975121, 22.10297454004302], [95.68154519975121, 22.109254379985714], [95.6831900399884, 22.117752180119055], [95.68445219980924, 22.119077340147157], [95.68662696016617, 22.121361000309946], [95.6881886400937, 22.12300070991489], [95.6886724798511, 22.1235086703889], [95.6966220002052, 22.125427560133858], [95.70594203969341, 22.12487928035455], [95.71581035986026, 22.122960479642472], [95.72622695980641, 22.120767449558173], [95.7391106402439, 22.123234530049558], [95.7413322004208, 22.123387799707245], [95.74102979978551, 22.122960479642472], [95.74240031981896, 22.120493310118206], [95.74294536024024, 22.110683220154556]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
