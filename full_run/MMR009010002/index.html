
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Auk Hlaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Auk Hlaing</div><div class="name-mm">အောက်လှိုင်း</div></div>
        <span class="pcode-badge">MMR009010002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59276515458828, 20.572709123127595], [94.59330990093122, 20.577339465244165], [94.59310211167315, 20.58565102297638], [94.5926659872456, 20.588213258035466], [94.60619281604568, 20.5933392138337], [94.61475472884774, 20.59640857929253], [94.61720562963615, 20.597287204341058], [94.62174667986545, 20.60079619708688], [94.62198477627646, 20.600404037816133], [94.62489382139279, 20.601650771565915], [94.63653000185815, 20.607261073439815], [94.63736584166031, 20.607942128226682], [94.63715336873304, 20.600611827074204], [94.63644494038175, 20.595846031768986], [94.63619243143563, 20.5941473320338], [94.6335791445619, 20.59407670197828], [94.63321723938412, 20.594066920951718], [94.63059109040654, 20.59336661437783], [94.62941269344111, 20.59305237596641], [94.62941269344111, 20.591969388076848], [94.62941269344111, 20.58620419326894], [94.62231087404768, 20.574283282047872], [94.61241905369644, 20.572254191178047], [94.59618632493903, 20.571746917786072], [94.59276515458828, 20.572709123127595]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
