
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Win Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Win Wa</div><div class="name-mm">ဝင်ဝ</div></div>
        <span class="pcode-badge">MMR005009047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30200908035482, 22.78968758961065], [95.30846460016124, 22.786330770248924], [95.31304343990291, 22.781446740174943], [95.32220075965739, 22.774731120245065], [95.3242635598155, 22.775803649918544], [95.32220075965739, 22.771678590094893], [95.32036943959804, 22.765573439862408], [95.31939491983974, 22.761188549711846], [95.3191483203388, 22.760078850158834], [95.31487475996227, 22.75702632000872], [95.31060119958573, 22.754584259555998], [95.3066412004311, 22.752472229609737], [95.30602235984406, 22.752142289934795], [95.29961220004304, 22.75427907012306], [95.29781184004446, 22.759679699558546], [95.29747523999038, 22.760689409788483], [95.29594883956736, 22.76526825042947], [95.29594883956736, 22.770152279604076], [95.29594883956736, 22.774481640215583], [95.29696656005876, 22.774120559716096], [95.29971372001222, 22.775952149572106], [95.30032427964187, 22.78266777040136], [95.30200908035482, 22.78968758961065]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
