
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boke Ran</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tsawlaw</div><div class="name-mm">ဆော့လော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Boke Ran</div><div class="name-mm">ဘုတ်ရန်</div></div>
        <span class="pcode-badge">MMR001006016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.18638085389335, 26.38203250909305], [98.18328525970702, 26.385816011799534], [98.17852633612159, 26.39057493538502], [98.17805044457242, 26.39961688471152], [98.1809057965653, 26.40532759229461], [98.17900222767071, 26.41008651498072], [98.17519508988153, 26.414369545218392], [98.17567098412866, 26.420556142552016], [98.1809057965653, 26.428646309679493], [98.19226556410456, 26.430314412680048], [98.20453402462562, 26.433214230752185], [98.21897192061772, 26.44293771240558], [98.2313472610673, 26.452955845236147], [98.24166004417577, 26.461206071003403], [98.25374073164949, 26.464152580976872], [98.2658214209219, 26.4644472321541], [98.28114327044563, 26.467099090051022], [98.28968814828949, 26.468572345037728], [98.28998279856734, 26.45236654288169], [98.29027744974456, 26.439107249799804], [98.2873309397711, 26.432624929297106], [98.28585768568371, 26.418776334760082], [98.284384430697, 26.411410060725757], [98.26876793089536, 26.41052610809345], [98.24932096758863, 26.406106344032594], [98.24460589674482, 26.403791673447017], [98.23311516633191, 26.39815076944251], [98.22664602359515, 26.39564035601768], [98.21337355274733, 26.390489844230956], [98.19356727610898, 26.384138107088006], [98.18638085389335, 26.38203250909305]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
