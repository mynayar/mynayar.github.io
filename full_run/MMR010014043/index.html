
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Chaint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Chaint</div><div class="name-mm">လက်ပံချိုင့်</div></div>
        <span class="pcode-badge">MMR010014043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03047316940132, 21.76432651655557], [96.03044494327958, 21.7643032717786], [96.0299051081343, 21.763858701817696], [96.02739651493727, 21.761792801696515], [96.02431986137259, 21.76016398468022], [96.02232908521916, 21.75853516856324], [96.02033830906578, 21.757630270720483], [96.01589775088058, 21.75700569155947], [96.01336097742723, 21.754507064649374], [96.01330331019966, 21.75435194058963], [96.01297950659898, 21.75348091121515], [96.0134375969676, 21.75239535216383], [96.01167637456507, 21.752485671976217], [96.01150056519896, 21.754243776429178], [96.01123359875163, 21.756913436406023], [96.00948838518087, 21.75850502508689], [96.00914324966129, 21.75931665693821], [96.01197643426508, 21.761780295724122], [96.01771097658036, 21.76382834700064], [96.01914461373298, 21.76546678676283], [96.01796150162204, 21.768232345946046], [96.01746701569027, 21.76928616792236], [96.01961439079156, 21.76975590631008], [96.02431986137259, 21.771384723326378], [96.02830141278002, 21.773194519011895], [96.03373080163527, 21.775185295165272], [96.033549822966, 21.773375498580435], [96.03336884339745, 21.77102276418924], [96.03210198641762, 21.768670027999462], [96.03101610810694, 21.76577435400327], [96.03047316940132, 21.76432651655557]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
