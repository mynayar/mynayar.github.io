
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Taw</div><div class="name-mm">မဲတော</div></div>
        <span class="pcode-badge">MMR008006002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27166278081273, 18.609692143677535], [95.27515562892921, 18.600960023386392], [95.27620348570235, 18.598340381003823], [95.27661879442189, 18.596346902387666], [95.27762245581175, 18.59152932411905], [95.27648728026384, 18.588123794777346], [95.27369912741284, 18.587844979762053], [95.27081139802766, 18.587556206553757], [95.26893032117744, 18.584062778374573], [95.26882483969467, 18.583866884449208], [95.2689848308853, 18.58194698926218], [95.2691086342561, 18.580461355107502], [95.25633790057373, 18.579042384998104], [95.24413475601426, 18.57819100311235], [95.24101302123398, 18.58415067811137], [95.23562093355929, 18.585285853659286], [95.23562093355929, 18.595502440785083], [95.23760749189228, 18.596921410894424], [95.24413475601426, 18.598340381003823], [95.24839166724172, 18.598624175565305], [95.25009443101322, 18.59890797012679], [95.25009443101322, 18.602881086792763], [95.25208099024559, 18.60571902701156], [95.25435134224074, 18.607421791682384], [95.26031101813902, 18.606854202559475], [95.26400034114289, 18.607421791682384], [95.26939242791826, 18.610543525563287], [95.27166278081273, 18.609692143677535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
