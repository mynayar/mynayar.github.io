
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Laung</div><div class="name-mm">စည်လောင်</div></div>
        <span class="pcode-badge">MMR005016007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95377639996093, 22.137808050101455], [94.95189360000967, 22.140632069714286], [94.94727839977838, 22.143196259899526], [94.9400985597008, 22.149863099702316], [94.9400985597008, 22.156017119994146], [94.9390729197795, 22.166786610313864], [94.93941492026244, 22.1743081801784], [94.94471411966094, 22.179607470408484], [94.95138096036311, 22.181658750251188], [94.95907344008725, 22.17755609973426], [94.96112471992996, 22.18678712972229], [94.96112471992996, 22.190376959828882], [94.96830456000748, 22.190376959828882], [94.979073960395, 22.18576148980094], [94.99035636015793, 22.185248580357722], [94.9973367602833, 22.185597689981478], [94.99497192011808, 22.17755609973426], [94.99035636015793, 22.16832506974623], [94.98727907976576, 22.161658229943384], [94.98779208004049, 22.152427289887555], [94.98779208004049, 22.148324640270005], [94.98009960031635, 22.147298910416453], [94.97343275961424, 22.14781172992747], [94.97189412031747, 22.14011925020327], [94.97312496034868, 22.13909361028192], [94.96984283957545, 22.13909361028192], [94.96266336012604, 22.138580789871583], [94.95377639996093, 22.137808050101455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
