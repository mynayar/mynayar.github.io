
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Myo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Myo</div><div class="name-mm">တောင်မြို့</div></div>
        <span class="pcode-badge">MMR005001029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7026429999745, 22.065669089556877], [95.70045959983071, 22.065669089556877], [95.69223611990105, 22.065669089556877], [95.68264176020915, 22.0670397004219], [95.67524051963431, 22.067862029708976], [95.66619443972166, 22.068136170048263], [95.6609863200627, 22.070329200132505], [95.65884717285883, 22.07139850393787], [95.65564102681202, 22.073044732728306], [95.66186353227624, 22.078022738358754], [95.66258582997216, 22.085727239320704], [95.66511839999424, 22.087128240076254], [95.66838755973816, 22.0892435102798], [95.67578880031294, 22.0892435102798], [95.68209348042984, 22.08979179005911], [95.68482408026716, 22.09047435031107], [95.68976904030905, 22.088969369940514], [95.695799759951, 22.084583489636373], [95.6988151202217, 22.078826910333703], [95.6988151202217, 22.073070330131657], [95.7026429999745, 22.065669089556877]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
