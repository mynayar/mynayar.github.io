
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe U</div><div class="name-mm">ကျွဲဦး</div></div>
        <span class="pcode-badge">MMR009010086</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.27900134783397, 20.825149718085072], [94.28163723377139, 20.82602843486444], [94.28603040398002, 20.82615403508072], [94.28992143322762, 20.829543266008955], [94.29205535896767, 20.824396793077597], [94.29444034034947, 20.81837165193025], [94.29556993020816, 20.822639507907013], [94.30209692633213, 20.822765144995515], [94.30579332789983, 20.82357845498177], [94.3076803105979, 20.81543655435354], [94.30894702818284, 20.80656953755414], [94.31191234837621, 20.789690025374398], [94.31442146407937, 20.775775830690066], [94.31921159683776, 20.763230246778505], [94.32149261209446, 20.75136896690435], [94.32331742376016, 20.744525921134425], [94.32286122106854, 20.740191991966924], [94.32035210356679, 20.737226671773556], [94.31601817529861, 20.739279585684358], [94.31214044882273, 20.7458945301085], [94.30894702818284, 20.764142653061015], [94.302788285551, 20.783303182296095], [94.2986824586286, 20.79197103973172], [94.29457663080694, 20.797901680118514], [94.28636497606283, 20.80155130524861], [94.28431206215203, 20.804516625441977], [94.27997813298452, 20.81090346762096], [94.27769711682856, 20.816149803071028], [94.27842490668417, 20.82037098333427], [94.27840895990562, 20.820385567639903], [94.27900134783397, 20.825149718085072]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
