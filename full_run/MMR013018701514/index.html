
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (56) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (56) Ward</div><div class="name-mm">အမှတ် (၅၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2585402897027, 16.861327308008924], [96.25759124773793, 16.859912872281257], [96.25598812165453, 16.85757637065302], [96.25555229220458, 16.857061385574525], [96.2548694612567, 16.856290817667173], [96.25409126260172, 16.855409622356262], [96.25380706784199, 16.85509910623881], [96.24801826493103, 16.859903335870285], [96.24688275663397, 16.86087099739865], [96.246456463595, 16.861258188814418], [96.24780273430878, 16.862783431809987], [96.2491321562241, 16.86425209036173], [96.25059127836488, 16.86588096583398], [96.25166459494517, 16.86708016861496], [96.25290107732292, 16.86608314512108], [96.25404930113439, 16.86511039702725], [96.2552280434395, 16.864133834908614], [96.25650215165302, 16.86306190508293], [96.25789451621898, 16.861890792626014], [96.2585402897027, 16.861327308008924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
