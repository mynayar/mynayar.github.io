
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Lun San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Lun San</div><div class="name-mm">မလွန်စမ်း</div></div>
        <span class="pcode-badge">MMR009013023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.952557914816, 19.747414752388977], [94.97386957472116, 19.755141981917006], [94.98117653037264, 19.760987546438173], [94.98863761093708, 19.7698839980481], [94.9916067208735, 19.7661335436282], [95.00010236623126, 19.751974136197475], [95.00237492606203, 19.749360691942456], [95.00382352433621, 19.74769480397208], [95.00819345606322, 19.742669383385362], [95.008330780741, 19.738625351578776], [95.00012593476413, 19.734718282922472], [94.99621886610782, 19.72866232470659], [94.99524209804446, 19.715964348875673], [94.99265609390369, 19.70674823504305], [94.9924158301265, 19.707068586146363], [94.99120216624704, 19.711518686138504], [94.98998850326689, 19.715968785231325], [94.96935622271155, 19.728105421328166], [94.96868137324685, 19.72874057381847], [94.95560136990736, 19.741051164879423], [94.952557914816, 19.747414752388977]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
