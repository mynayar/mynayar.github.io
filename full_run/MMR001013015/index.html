
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gaing Daw Man Bang (Man Bang Bum)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mansi</div><div class="name-mm">မံစီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gaing Daw Man Bang (Man Bang Bum)</div><div class="name-mm">ဂိုင်ဒေါ်မန်ဘန် (မန်ဘန်ဘွမ်း)</div></div>
        <span class="pcode-badge">MMR001013015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.6801666969356, 24.077475731619757], [97.675253027905, 24.072545338796374], [97.66485720859339, 24.067649636421606], [97.66403314001747, 24.067680007426475], [97.65564926600086, 24.064721304444674], [97.65506689741943, 24.063988710410683], [97.65420985430137, 24.06326624634022], [97.65274922939346, 24.06034413317525], [97.64852599058207, 24.064567371087378], [97.64129658257127, 24.069194192358168], [97.62250012228287, 24.081917949953493], [97.61122224610983, 24.091749944704247], [97.60890883457512, 24.099268528819607], [97.60601707173055, 24.107076289938902], [97.61931918333369, 24.11025722978735], [97.62394600370516, 24.112859815628042], [97.62886200108056, 24.112281464318187], [97.64216411178438, 24.113438168736536], [97.65517704728296, 24.11199228821357], [97.65777963312365, 24.101581940354322], [97.6609605729721, 24.095509236761927], [97.66761162787441, 24.090014887177347], [97.67541938899365, 24.083653008379656], [97.68004621026444, 24.07758030478726], [97.6801666969356, 24.077475731619757]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
