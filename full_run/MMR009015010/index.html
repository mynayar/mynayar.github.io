
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Chaung</div><div class="name-mm">သရက်ချောင်း</div></div>
        <span class="pcode-badge">MMR009015010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85864943602269, 19.02079222308265], [94.84611660179979, 19.02138902398434], [94.82232410897052, 19.027337148090965], [94.81529450873467, 19.0362593320026], [94.8115093395844, 19.044370409267003], [94.8115093395844, 19.057888870774832], [94.81232044713101, 19.065999948039234], [94.81664635524515, 19.073029548275088], [94.82070189387736, 19.078436933417777], [94.82340030967663, 19.08726811493159], [94.82394632406368, 19.08735911732947], [94.83043518623492, 19.084925793790376], [94.84449438580731, 19.084114687143142], [94.86152764788272, 19.083844316761883], [94.87072020217568, 19.078977670583072], [94.87091164985281, 19.079234293028264], [94.86963872514713, 19.07465176336825], [94.86720540160803, 19.06545920997462], [94.86206838594734, 19.05410370162457], [94.86098690891879, 19.045992625259487], [94.86071654033611, 19.03517785497405], [94.85963506330756, 19.023551978041382], [94.85864943602269, 19.02079222308265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
