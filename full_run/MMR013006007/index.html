
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Kone</div><div class="name-mm">ရေတွင်းကုန်း</div></div>
        <span class="pcode-badge">MMR013006007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.90303858885983, 17.13990293277419], [95.9019283533109, 17.146564353262363], [95.90303858885983, 17.151282858617094], [95.90636929910391, 17.156001363971825], [95.90942244978629, 17.1571116013194], [95.91386339737795, 17.156556483095244], [95.91941457961923, 17.151005299055385], [95.92302284942502, 17.146841911924753], [95.92302284942502, 17.143511201680667], [95.92302284942502, 17.138515136764227], [95.9213574938533, 17.134074190071885], [95.9210799351909, 17.12852300693129], [95.92024725830441, 17.121584027780727], [95.91941457961923, 17.114922608191875], [95.91663898759924, 17.112979693957755], [95.91386339737795, 17.10909386638889], [95.91219804180622, 17.106595833031292], [95.91219804180622, 17.103820241910682], [95.91053268713387, 17.10437536013484], [95.90609174044152, 17.10465291879723], [95.90165079374918, 17.104930478358938], [95.9019283533109, 17.108538747265413], [95.9019283533109, 17.112702135295365], [95.90470394443156, 17.11853087709835], [95.90747953555217, 17.12352694201479], [95.90775709511388, 17.127967888707133], [95.90553662221743, 17.134074190071885], [95.90303858885983, 17.13990293277419]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
