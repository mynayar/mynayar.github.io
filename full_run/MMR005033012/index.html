
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Ywet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Ywet</div><div class="name-mm">ကျောက်ရွက်</div></div>
        <span class="pcode-badge">MMR005033012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5891112403915, 25.920288089823543], [95.56512444004096, 25.915527360399437], [95.53649903999877, 25.915527360399437], [95.51709000020338, 25.917724619995283], [95.4876708000674, 25.931091329900994], [95.4577025997952, 25.945495649704526], [95.4591753601548, 25.951830389660813], [95.46148691998542, 25.951904279758764], [95.46649163997728, 25.953674310121357], [95.4680824804222, 25.95517506008099], [95.46972660030241, 25.95672602998235], [95.47167960043328, 25.960083030107796], [95.4718624802693, 25.96046940044255], [95.47201583985918, 25.960752269601585], [95.47378163981091, 25.964500050337108], [95.4742262403488, 25.96526495971017], [95.47552475975994, 25.967285189559902], [95.4777222001195, 25.969726529655645], [95.48071272021593, 25.974670409611747], [95.48182548016183, 25.976480580314558], [95.51428235994302, 25.957702619979955], [95.55169680016724, 25.933715819629413], [95.5891112403915, 25.920288089823543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
