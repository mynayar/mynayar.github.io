
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yon Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yon Kar</div><div class="name-mm">ဖရုံကား</div></div>
        <span class="pcode-badge">MMR008003038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92743970258027, 18.551731639103934], [94.92585930596226, 18.554190033942973], [94.92577995518087, 18.554313468591772], [94.88329862393243, 18.555706299905864], [94.88093686574382, 18.557674432029444], [94.87494164144368, 18.56267045197984], [94.8753835961761, 18.56554316178756], [94.87633447095914, 18.571723850575268], [94.89653051377223, 18.583562910000353], [94.90836957319732, 18.599580460669756], [94.92856561601042, 18.599580460669756], [94.94179750585027, 18.602366122398678], [94.9521013020335, 18.603030883268673], [94.9633863790782, 18.60375895281345], [94.96358537386595, 18.60381566136374], [94.96590402125366, 18.60447641575405], [94.96433556763242, 18.59650075840335], [94.96470441018045, 18.5861731778499], [94.96617977767465, 18.581747071769996], [94.9672863053188, 18.573632544706243], [94.96617977767465, 18.56809991188146], [94.96396672508433, 18.566255700939905], [94.95290146123352, 18.564780333445697], [94.94441809072237, 18.562198438307348], [94.92743970258027, 18.551731639103934]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
