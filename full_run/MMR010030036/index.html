
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bweit Char</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bweit Char</div><div class="name-mm">ဘွဲ့ခြား</div></div>
        <span class="pcode-badge">MMR010030036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08506726424292, 20.951623113116227], [96.07724244568237, 20.945869569924753], [96.0700051551139, 20.93800294907686], [96.07535445664291, 20.929192334158927], [96.06654384172498, 20.915976411782026], [96.06488566993778, 20.91238370564355], [96.05836255708641, 20.92101104862104], [96.05301325465803, 20.925416356979326], [96.04797861781901, 20.92698968132879], [96.04042666166117, 20.92698968132879], [96.03193071233255, 20.923843032629918], [96.02469342086476, 20.918179066410858], [96.02091744278579, 20.9228990376605], [96.01745613029624, 20.932968312237847], [96.01902945374633, 20.939576274325645], [96.02343476210467, 20.947128228684846], [96.02658140990422, 20.951218872353138], [96.0325600417126, 20.956253509192152], [96.04137065663053, 20.957197503262194], [96.04577596408956, 20.959085492301654], [96.04797861781901, 20.963176135070626], [96.05318475087563, 20.967861655091383], [96.05490124369749, 20.965693454389452], [96.06622917703493, 20.96286147038063], [96.07850110534179, 20.965693454389452], [96.08506726424292, 20.951623113116227]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
