
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Lat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Lat</div><div class="name-mm">ခလပ်</div></div>
        <span class="pcode-badge">MMR007002042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6470006146867, 17.257294024999283], [96.65006240875323, 17.259884773063902], [96.65403679975856, 17.259523465035954], [96.659456423775, 17.259162156108687], [96.66219148784694, 17.257110858279532], [96.66379212280827, 17.255910382058516], [96.66812782184155, 17.25301991603635], [96.67137959589172, 17.250490758042076], [96.67370922580017, 17.24990835078978], [96.67571529582432, 17.24940683305897], [96.67535398689705, 17.24398720904253], [96.6749926788691, 17.23856758502609], [96.67380322383974, 17.234319530322125], [96.67318613783004, 17.235677119003867], [96.66740520488634, 17.236399735959083], [96.66234688979716, 17.23676104398703], [96.65728857380867, 17.236399735959083], [96.65223025782018, 17.23856758502609], [96.6490507460951, 17.23538807330101], [96.647171942731, 17.23712235201498], [96.64102970175941, 17.237844968970194], [96.63705531075402, 17.238928893953357], [96.63199699476553, 17.24073543499236], [96.63777792770924, 17.245071134025636], [96.64175231871462, 17.24940683305897], [96.64319755172568, 17.252297299081135], [96.64536540079268, 17.255910382058516], [96.6470006146867, 17.257294024999283]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
