
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ban La Mut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ban La Mut</div><div class="name-mm">ဘန်းလမွတ်</div></div>
        <span class="pcode-badge">MMR006008007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.90282617738626, 12.276336030883158], [98.91077549539284, 12.284285348889796], [98.91698984940211, 12.287451152248934], [98.9178343559708, 12.293343708145642], [98.91904181362884, 12.294618248033771], [98.91870712283549, 12.296124358852126], [98.96194367955724, 12.307115610297217], [98.98076735962599, 12.300599520251694], [98.98190063940302, 12.30012915323789], [99.01913956703743, 12.284671316328229], [99.03361967990435, 12.270914819563302], [99.04809996004519, 12.258606420150215], [99.04311214101256, 12.25575377511666], [99.04074419009237, 12.25095514826154], [99.00900414012904, 12.235436504591064], [98.98076843971177, 12.2231276995837], [98.95687183326856, 12.213720416863794], [98.95615296828493, 12.214439193713872], [98.94167298042379, 12.202854569582769], [98.92284259231184, 12.201437977280875], [98.91913856539253, 12.219429412137686], [98.91744082433462, 12.227270743150314], [98.9151146163465, 12.235800283056676], [98.9134369193784, 12.241951920145027], [98.9113785178044, 12.265283492439266], [98.90282617738626, 12.276336030883158]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
