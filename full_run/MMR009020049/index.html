
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Seik Chay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Seik Chay</div><div class="name-mm">ဆိတ်ချေး</div></div>
        <span class="pcode-badge">MMR009020049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6592805131852, 21.65068635359239], [94.65583136942223, 21.656003781349455], [94.65348819662302, 21.663200477420162], [94.64528757206386, 21.66520872200499], [94.63094622009203, 21.669989086327348], [94.6375395439149, 21.67196921360835], [94.6371698308231, 21.6721468719806], [94.64814698269714, 21.671035261368274], [94.65267183703571, 21.67523691105464], [94.65299504078854, 21.683640212226067], [94.65622708011574, 21.68978108622821], [94.65534661055767, 21.69167748123084], [94.65816630263282, 21.693013123756714], [94.66656960290493, 21.693982735914574], [94.67561931158201, 21.700123609017396], [94.67885068091425, 21.701242159697983], [94.71747489814811, 21.67429503219006], [94.71052533037977, 21.666187203276877], [94.6982435832748, 21.65325904776688], [94.67594251623422, 21.649057398080515], [94.66648157006847, 21.64936259021141], [94.66596129697632, 21.649598638866166], [94.66450705275832, 21.65003400966185], [94.6633310228085, 21.651818114414482], [94.6592805131852, 21.65068635359239]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
