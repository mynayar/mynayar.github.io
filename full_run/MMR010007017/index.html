
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit</div><div class="name-mm">ရွာသစ်</div></div>
        <span class="pcode-badge">MMR010007017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16798897291284, 22.063562640803298], [96.16597152286755, 22.062645618300678], [96.1641136889956, 22.06140706118697], [96.16143014978167, 22.06058135674425], [96.1575080552526, 22.0609942094153], [96.1539988133946, 22.0609942094153], [96.15090242240893, 22.062232765629687], [96.14925101442282, 22.062232765629687], [96.14904458763766, 22.064297026286795], [96.14925101442282, 22.06698056460141], [96.14925101442282, 22.070283380573585], [96.14925101442282, 22.072554068015904], [96.14925101442282, 22.07585688398808], [96.14987029208038, 22.07833399731618], [96.15110884829477, 22.081017534731473], [96.15482451693799, 22.07998540530224], [96.15730162936677, 22.079778979416403], [96.15957231590971, 22.07998540530224], [96.16101729800994, 22.08019183118813], [96.16225585422433, 22.077301866987625], [96.16308155776773, 22.075237606330518], [96.16432011488143, 22.072966919787575], [96.16555867109588, 22.070489807358797], [96.16555867109588, 22.068631972587525], [96.16555867109588, 22.066567711930418], [96.1670036531961, 22.065122729830193], [96.16798897291284, 22.063562640803298]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
