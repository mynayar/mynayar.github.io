
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man An</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man An</div><div class="name-mm">မန်အန်</div></div>
        <span class="pcode-badge">MMR015005023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.69028356613376, 22.62873886290822], [98.6881441842068, 22.624032224107907], [98.68785819979615, 22.619742468740014], [98.67487657959055, 22.609585277338738], [98.66529442190011, 22.60545757800486], [98.65851320272219, 22.602804058160814], [98.65143714710672, 22.60545757800486], [98.63713761900596, 22.609880112876965], [98.6300615642898, 22.609437859569596], [98.62445968726479, 22.60796368097914], [98.60555821224176, 22.61684356887565], [98.61074982934122, 22.61916743592849], [98.61988973372428, 22.62786508700424], [98.62431226859638, 22.629339264695375], [98.63327861191846, 22.62754599585105], [98.63757987231332, 22.62373738767036], [98.64156015387806, 22.617840675107118], [98.64848879082507, 22.615776826339527], [98.65350099677363, 22.61503973659461], [98.6613141412347, 22.619314852798254], [98.66809536131194, 22.624179640977673], [98.6739657363297, 22.629904574036914], [98.68460615594938, 22.628159921643146], [98.69028356613376, 22.62873886290822]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
