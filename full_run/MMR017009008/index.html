
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywa Man</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywa Man</div><div class="name-mm">ကြွမန်း</div></div>
        <span class="pcode-badge">MMR017009008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57458235998797, 17.44186986010601], [95.56770707981792, 17.43997661992512], [95.56430687716073, 17.439346993768822], [95.5623261599244, 17.438980229553977], [95.55883883994056, 17.4377845799944], [95.55684588023325, 17.439478470155336], [95.55415559970123, 17.442268470213776], [95.55189913773506, 17.445156944237624], [95.55166476002074, 17.44545699044778], [95.54977151983985, 17.44854588018825], [95.54929307961197, 17.449183620028066], [95.55146532006853, 17.450339399943402], [95.55495264005236, 17.451834030016528], [95.55834060023858, 17.45372727019742], [95.56113060029702, 17.45621828974231], [95.56170732023668, 17.45590113033296], [95.56511615998284, 17.454026159879447], [95.56850412016905, 17.45283051031987], [95.5721908801051, 17.451136620158934], [95.5726392092322, 17.449093918049925], [95.57308763998265, 17.447051250115123], [95.57458235998797, 17.44186986010601]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
