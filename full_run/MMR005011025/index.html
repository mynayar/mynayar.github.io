
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Lel</div><div class="name-mm">ကျွန်းလယ်</div></div>
        <span class="pcode-badge">MMR005011025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4408848620468, 23.06995126344009], [95.44409254863228, 23.064120641154716], [95.44409254863228, 23.061958615197966], [95.44287095992689, 23.061706560409505], [95.43548591973945, 23.060485799979745], [95.42749031992241, 23.05889892014909], [95.42272931980233, 23.056884810185863], [95.41448964038466, 23.055725069656262], [95.41088855975926, 23.055908220188257], [95.40649403966825, 23.056091279888733], [95.4008787600468, 23.055908220188257], [95.39564436039899, 23.057183879732293], [95.39630136011971, 23.061889620109923], [95.3956907995908, 23.06591792996852], [95.3953246801899, 23.068725570228935], [95.39709479958537, 23.068115189564423], [95.40069588021078, 23.070129390359114], [95.40631115983223, 23.07031253999179], [95.41009512029365, 23.07232664995496], [95.41412352008444, 23.075500500447788], [95.41632096044401, 23.078308139808883], [95.41949472010532, 23.082702659899894], [95.42370599973214, 23.085693359860727], [95.42436999707775, 23.085952211725214], [95.42530322086702, 23.083819128649907], [95.42833375719721, 23.079879431690472], [95.43631329242459, 23.075885957071307], [95.43665065600305, 23.075425797362698], [95.43798793439572, 23.075022335412484], [95.43811658241441, 23.07498317263537], [95.4408848620468, 23.06995126344009]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
