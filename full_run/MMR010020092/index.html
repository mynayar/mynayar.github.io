
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zay Kone</div><div class="name-mm">ဈေးကုန်း</div></div>
        <span class="pcode-badge">MMR010020092</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30205492869209, 20.770698117224356], [95.30248507892333, 20.76725691807235], [95.30463582828094, 20.76209511979397], [95.3049008953601, 20.755998582368704], [95.29951313432377, 20.75680674643428], [95.29401380159572, 20.760587536785465], [95.28920188725738, 20.76093124598026], [95.28232772134731, 20.75886899620724], [95.2751098480411, 20.757150454729754], [95.27167276598544, 20.75577562244706], [95.2641111843837, 20.756463038138747], [95.2586118516557, 20.75886899620724], [95.25276881243082, 20.762649786558427], [95.24589464562143, 20.762306079162272], [95.24073902298755, 20.760587536785465], [95.23917671173592, 20.75918145755827], [95.23730194003258, 20.760587536785465], [95.23352114878207, 20.76746170179615], [95.23145889990838, 20.770898784751182], [95.23882290135589, 20.772418716350728], [95.2448449982981, 20.77973126398672], [95.24871634678203, 20.786183512059495], [95.25903994423811, 20.788334261417106], [95.26334144205396, 20.789194560980263], [95.26764294076918, 20.786613662290733], [95.27237458881626, 20.781882013344273], [95.27925698712033, 20.77715036529719], [95.28656953385695, 20.774999615040258], [95.29517253128734, 20.77198856701881], [95.30205492869209, 20.770698117224356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
