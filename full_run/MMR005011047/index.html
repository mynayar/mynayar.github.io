
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Ya Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Ya Nge</div><div class="name-mm">ဝါးရငယ်</div></div>
        <span class="pcode-badge">MMR005011047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31732168035131, 22.981323240375275], [95.32171620044238, 22.98028562957819], [95.32690415999906, 22.979492190112524], [95.32672128016299, 22.973510700258657], [95.3298950398243, 22.965271019941667], [95.33209211955574, 22.960327139985566], [95.33148191965495, 22.95489500999679], [95.33068848018928, 22.950317340273102], [95.33032235988907, 22.948913610075067], [95.33050523972508, 22.94989011014053], [95.32830815999364, 22.949279820307538], [95.32287611993706, 22.949096669775543], [95.31610091992155, 22.95050048990572], [95.30987544039931, 22.950683549606197], [95.30670167983874, 22.95227052026837], [95.30847180013353, 22.95312497963414], [95.31011951999989, 22.956115679594973], [95.31011951999989, 22.958313030022396], [95.31127944039395, 22.959899909852993], [95.31127944039395, 22.961730960115744], [95.31249984019553, 22.964721660076577], [95.31347652012533, 22.9707031499305], [95.31567395958564, 22.972900410425666], [95.31689436028654, 22.976318339619752], [95.31689436028654, 22.979492190112524], [95.31732168035131, 22.981323240375275]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
