
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Wea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Wea</div><div class="name-mm">လက်ဝဲ</div></div>
        <span class="pcode-badge">MMR010014024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0808331337422, 21.73167588593344], [96.0818713857559, 21.730845283782855], [96.0840431423772, 21.728492549391717], [96.08603391763126, 21.726501773238283], [96.08947253123239, 21.72813059025458], [96.09273016436566, 21.729578426803016], [96.0956258383618, 21.72813059025458], [96.09779759408377, 21.725596875395524], [96.09960738976929, 21.72252022093153], [96.09960738976929, 21.719986506072473], [96.0980161347369, 21.7175996244232], [96.09653073620456, 21.71799572991904], [96.09345408263988, 21.71763377078196], [96.08965350990161, 21.71582397419712], [96.08585293806271, 21.713471238906607], [96.08223334489298, 21.718900627761798], [96.07879473219117, 21.72233924136293], [96.07354632290452, 21.72306315963715], [96.07000590784645, 21.72306315963715], [96.06938379102917, 21.72704471194396], [96.06865987185569, 21.73428389738399], [96.07155554675114, 21.734464876952586], [96.07481317988442, 21.734645857420446], [96.07662297556993, 21.733740957779048], [96.07915669132831, 21.73301704040415], [96.0808331337422, 21.73167588593344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
