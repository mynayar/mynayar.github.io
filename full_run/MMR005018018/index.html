
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Ma Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Ma Taw</div><div class="name-mm">သမ္မတော</div></div>
        <span class="pcode-badge">MMR005018018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03315099991875, 21.951198269584552], [95.02728264028167, 21.948730469635507], [95.01751692016978, 21.943908720311242], [95.01068123984737, 21.94531254044142], [94.99871844000404, 21.9505004999981], [94.987304640297, 21.9505004999981], [94.98089592031056, 21.95111087976335], [94.97308356005829, 21.95367434959161], [94.97387700042327, 21.96252440967379], [94.97378698368243, 21.96408509674984], [94.97351088012306, 21.968872109760127], [94.97650140021949, 21.9744873003487], [94.977943199619, 21.98070233964131], [94.98449700003658, 21.97888182043971], [94.99127184032324, 21.976684559944545], [95.0012816400357, 21.975891119579558], [95.00708016012135, 21.979919430337475], [95.0087278799877, 21.983093279930983], [95.00860476010166, 21.98322279039951], [95.00927723985279, 21.984680159761638], [95.0120848801132, 21.979492200204902], [95.01470963963823, 21.97271726998605], [95.01971435963003, 21.963500999671453], [95.02728264028167, 21.956298840219347], [95.03167716037274, 21.95227053036075], [95.0332931998214, 21.951258120365992], [95.03315099991875, 21.951198269584552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
