
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htein Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htein Pan</div><div class="name-mm">ထိန်ပန်း</div></div>
        <span class="pcode-badge">MMR010017034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48211394670136, 21.546400308127772], [95.48251712716376, 21.54728730406589], [95.48346803522173, 21.549664572861786], [95.48465666917002, 21.55251729613633], [95.48441894238033, 21.556320926569583], [95.48584530401763, 21.559886832011728], [95.48869802729217, 21.56345273565529], [95.48928844840322, 21.565420803027678], [95.49273938541438, 21.56416591602425], [95.49820710517383, 21.562977282075963], [95.50248619008568, 21.561788647228354], [95.50819163573544, 21.561313192749708], [95.51294617512593, 21.561313192749708], [95.5162743519798, 21.561313192749708], [95.51772448719538, 21.561313192749708], [95.5165120787695, 21.5572718346275], [95.51508571803151, 21.552279569346695], [95.50890481700378, 21.546811849587243], [95.50224846329598, 21.544434579892027], [95.49226393093574, 21.544434579892027], [95.48465666917002, 21.54586094242859], [95.48211394670136, 21.546400308127772]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
