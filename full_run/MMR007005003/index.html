
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da La Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da La Seik</div><div class="name-mm">ဒလဆိပ်</div></div>
        <span class="pcode-badge">MMR007005003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7547808167813, 18.045742290174587], [96.75325675459561, 18.04561163576841], [96.74849806663252, 18.045082892861274], [96.74558998019347, 18.047726609195706], [96.74479686538308, 18.049841580824364], [96.74215314994797, 18.054600268787397], [96.74083129223044, 18.05697961321863], [96.73713009008168, 18.060945186371328], [96.73487412004465, 18.063201157307617], [96.7350151175537, 18.065175131427225], [96.73554386136016, 18.069405075583802], [96.73765883298881, 18.07152004811178], [96.73953819303324, 18.073991776299465], [96.73954582198218, 18.079412459717275], [96.74096374707932, 18.079862555112868], [96.74518441293037, 18.07262842296342], [96.74696774966196, 18.06957182158237], [96.75478050831384, 18.064102846369337], [96.76100749779783, 18.063725539402185], [96.76767141210604, 18.063321758192615], [96.76728083474279, 18.06019654933135], [96.76298392796599, 18.05707127571884], [96.75556720016624, 18.05273641665235], [96.7547808167813, 18.045742290174587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
