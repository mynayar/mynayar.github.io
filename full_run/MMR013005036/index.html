
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Kan Shan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Kan Shan Su</div><div class="name-mm">ဥက္ကံရှမ်းစု</div></div>
        <span class="pcode-badge">MMR013005036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83436588617678, 17.44200794920755], [95.84021606062277, 17.438611073142567], [95.84002734598528, 17.43634649029832], [95.84002734598528, 17.432194752985538], [95.83908376920067, 17.425778431929132], [95.83983863044847, 17.419362110872783], [95.83776276224177, 17.418607249624927], [95.83115772564855, 17.41747495820283], [95.82700598923509, 17.41747495820283], [95.8245526890554, 17.41634266588136], [95.82323168209649, 17.418795965161735], [95.81757022318732, 17.418984679799166], [95.81285234016343, 17.419739541047022], [95.8102103253463, 17.41841853408812], [95.8075683114285, 17.421437979079542], [95.80681344928132, 17.430873745127258], [95.80964417873594, 17.431062460664066], [95.81492820837019, 17.43389319011868], [95.81492820837019, 17.438988504216127], [95.8177589378248, 17.443517671703262], [95.82247682084864, 17.447480694378612], [95.82587369691362, 17.445216109735725], [95.82813827975787, 17.443706387240013], [95.83040286440075, 17.443328956166454], [95.83436588617678, 17.44200794920755]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
