
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Khon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Khon</div><div class="name-mm">ဇီးခုန်</div></div>
        <span class="pcode-badge">MMR007012013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.52401116538306, 18.50749934671751], [96.52465450620053, 18.503853745154288], [96.5242211741679, 18.497353755671327], [96.52053784694414, 18.49193709941767], [96.51707118618634, 18.488687105125848], [96.5169982268867, 18.486790168731375], [96.51230452843129, 18.490203768589083], [96.50515454044972, 18.493453762880904], [96.49605455607298, 18.49627042514004], [96.49107123095263, 18.499303752965886], [96.48738790372886, 18.50277041372368], [96.48630457319757, 18.507537072378057], [96.48609672188627, 18.510461600222698], [96.49150456388458, 18.511220398702505], [96.50082121382803, 18.512520396599086], [96.5064545383463, 18.51403706096164], [96.50915122744726, 18.515115735702693], [96.51338785896257, 18.51447039299427], [96.51750451911835, 18.51208706366708], [96.51923784904756, 18.508620402909344], [96.52401116538306, 18.50749934671751]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
