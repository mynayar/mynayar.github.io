
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Kan</div><div class="name-mm">ဆည်ကံ</div></div>
        <span class="pcode-badge">MMR009010072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.5397056386044, 20.59675303132741], [94.54468728828778, 20.590430168717376], [94.55614359175343, 20.584702016984522], [94.55642073223106, 20.584563446745733], [94.55341442363681, 20.581910821727092], [94.55258326840317, 20.579625142586337], [94.55175211227021, 20.56383318415419], [94.55105287139298, 20.559288113955347], [94.5502784507899, 20.55930747456034], [94.54548831893084, 20.55907937321456], [94.54138249110912, 20.557710764240426], [94.5354518516217, 20.556342155266293], [94.52632778969581, 20.556342155266293], [94.52153765783669, 20.558395069177152], [94.50680490382331, 20.562238395685483], [94.50579865238598, 20.56250089609955], [94.50853587033419, 20.568887739177853], [94.51104498693667, 20.573221668345354], [94.51515081475833, 20.579836612769498], [94.51880043988842, 20.587820167067093], [94.52085335289996, 20.593522705208727], [94.51902854123426, 20.599681446041927], [94.51882990257798, 20.599775347854063], [94.51892145895823, 20.599780670941243], [94.5257784936826, 20.599780670941243], [94.5397056386044, 20.59675303132741]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
