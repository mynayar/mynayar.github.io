
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boe U Sein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Boe U Sein</div><div class="name-mm">ဘိုးဦးစိန်</div></div>
        <span class="pcode-badge">MMR007004040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75322613267991, 17.549363833174425], [96.74356139923924, 17.550204245129862], [96.7372728664497, 17.55155178838436], [96.73188269433092, 17.555594416349265], [96.73817122801984, 17.56008622599859], [96.73323023668615, 17.565476398117312], [96.73053515107642, 17.57221411169195], [96.72873842703683, 17.580299369420402], [96.72873842703683, 17.58658790310932], [96.72873842703683, 17.59197807522804], [96.73233187511602, 17.59197807522804], [96.74086631273019, 17.594673159938452], [96.74670566563401, 17.59602070319295], [96.74895157135796, 17.586138722324222], [96.75254501763851, 17.578951827065225], [96.7543417416781, 17.573112474161405], [96.76063027626628, 17.575807559771135], [96.77514535207638, 17.583017408426713], [96.77787854915579, 17.57420424213211], [96.78079259180475, 17.56495215721634], [96.77904669474924, 17.564578035647855], [96.77006307634997, 17.56278131160832], [96.76467290513051, 17.559187864428452], [96.75838437144165, 17.555145234664906], [96.75322613267991, 17.549363833174425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
