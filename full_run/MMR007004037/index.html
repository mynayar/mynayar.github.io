
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Taing su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Taing su</div><div class="name-mm">အင်းတိုင်စု</div></div>
        <span class="pcode-badge">MMR007004037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58585733834553, 17.504117470644815], [96.63334679172112, 17.503830172324626], [96.63396124361657, 17.50393860538236], [96.64384322538461, 17.504836966952496], [96.64890752006607, 17.503736033990833], [96.65340377056759, 17.50610471156324], [96.6559243022648, 17.511505850015], [96.67977770167965, 17.492709081259136], [96.68073161617122, 17.49085875942427], [96.68178832227329, 17.48880904979785], [96.6794712307128, 17.48929177709391], [96.67169244485052, 17.490912357219543], [96.66270882555193, 17.49136153800464], [96.65058093895925, 17.490463176434503], [96.64024977730543, 17.486869729254636], [96.6303677964367, 17.486869729254636], [96.62532981861631, 17.487349535552653], [96.62093499635307, 17.487768090824773], [96.62003663388361, 17.48282710039041], [96.62048581466865, 17.472945118622363], [96.62150135430414, 17.469136844989464], [96.6141972809798, 17.469351671442553], [96.60792061294597, 17.470443265844096], [96.6083579289753, 17.472046757052226], [96.60431530011107, 17.48013201388136], [96.59847594810657, 17.487318910039733], [96.59083987116315, 17.496751710123362], [96.58814478465416, 17.498997614947996], [96.58479849095767, 17.502595438228923], [96.58585733834553, 17.504117470644815]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
