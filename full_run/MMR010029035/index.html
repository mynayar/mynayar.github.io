
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kaung Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kaung Pin</div><div class="name-mm">သရက္ကောင်းပင်</div></div>
        <span class="pcode-badge">MMR010029035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69257007684763, 21.287534334142265], [95.69093012622443, 21.293497790790468], [95.68780641023773, 21.304572784406503], [95.69604166139362, 21.30372086112891], [95.69774550615023, 21.310536241054706], [95.70044716130752, 21.316108406277976], [95.70836192286453, 21.31481629633504], [95.71624525041801, 21.315266771244524], [95.71960758981845, 21.31344550290771], [95.72601872898122, 21.314584899873296], [95.72385895942352, 21.313067667139194], [95.72273523314453, 21.31082021637991], [95.71989549158371, 21.300029197189758], [95.7201794660096, 21.29434971406812], [95.72415510437463, 21.281570875695422], [95.7243822839153, 21.279299082986313], [95.72074741396204, 21.279299082986313], [95.71610531141107, 21.27944414902828], [95.71166024132714, 21.279583057412196], [95.70172114541458, 21.28412664283036], [95.69547371344117, 21.287534334142265], [95.69257007684763, 21.287534334142265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
