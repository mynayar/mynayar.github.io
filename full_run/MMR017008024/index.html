
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Nyin Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Nyin Kauk</div><div class="name-mm">ကညင်ကောက်</div></div>
        <span class="pcode-badge">MMR017008024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27384476812159, 17.714988791699454], [95.27459328015584, 17.71436087965094], [95.27530391994003, 17.713768679680868], [95.27951483983804, 17.712237420220788], [95.28371424031997, 17.711378459748175], [95.28512904027303, 17.711089020142197], [95.29010532010449, 17.710706249793645], [95.29319232036937, 17.711188559804214], [95.29369056007135, 17.711266409617167], [95.29623035974339, 17.706112740310743], [95.29801668042552, 17.70190191034493], [95.29814411975536, 17.699477580026326], [95.29533719985193, 17.69564961034132], [95.29268543998114, 17.689241609812484], [95.2908073201018, 17.689811940069035], [95.28965892002321, 17.690322329611888], [95.28892344006476, 17.69277357034406], [95.28851051994462, 17.69415030019627], [95.28570324031233, 17.696829869802684], [95.28429960004655, 17.699126669959924], [95.2830237597388, 17.69925429005349], [95.27294340011787, 17.69861628041707], [95.27141231962293, 17.69938191014711], [95.27319864030505, 17.704103039723577], [95.27326235996998, 17.7071653796786], [95.2733260796349, 17.710227809565822], [95.27384476812159, 17.714988791699454]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
