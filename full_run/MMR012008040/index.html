
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yet Khone Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yet Khone Taing</div><div class="name-mm">ရက်ခုန်းတိုင်</div></div>
        <span class="pcode-badge">MMR012008040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.67016737442486, 20.682122834001632], [92.67395191764695, 20.681435370645886], [92.67826904298198, 20.67611772525288], [92.68209500268227, 20.67022017272285], [92.6839614763411, 20.668120279127606], [92.68007564967155, 20.665238006828588], [92.6760836229609, 20.662451897237304], [92.67119162759161, 20.659646045728493], [92.66884702756835, 20.663178898387514], [92.66785872480034, 20.663619502338236], [92.66732600958773, 20.664319545410763], [92.66682595955047, 20.664682500097342], [92.66296009962895, 20.66748848380655], [92.65983179799912, 20.672990894913937], [92.66102100121827, 20.67356995309092], [92.6639995720227, 20.67562739958487], [92.6664541762193, 20.67829504238233], [92.66684971514229, 20.67879973022343], [92.66890786130881, 20.68142575689319], [92.67016737442486, 20.682122834001632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
