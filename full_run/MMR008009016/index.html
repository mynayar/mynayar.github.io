
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Hla Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Hla Gyi</div><div class="name-mm">ဝက်လှကြီး</div></div>
        <span class="pcode-badge">MMR008009016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.77225929203274, 17.870321342156274], [95.7793233327057, 17.865088718669483], [95.77939088707984, 17.864026542890713], [95.7781215668569, 17.86385730037415], [95.77758498455944, 17.8613532505521], [95.77655181011801, 17.860601852593447], [95.77580780368726, 17.862713839372248], [95.77438936507718, 17.86316021876911], [95.77391553297554, 17.86406098692504], [95.77155817786769, 17.863599748929346], [95.75952006699754, 17.86045895032038], [95.75630057681025, 17.85688173770211], [95.75218678279384, 17.855808574905836], [95.75116400091798, 17.855331275917706], [95.75035994405624, 17.85584024543101], [95.7489741202595, 17.862472408275096], [95.74740433294369, 17.868489924070786], [95.74635780806642, 17.874769072434788], [95.7426949718955, 17.87817027693677], [95.74975901256846, 17.880524956561544], [95.75734631567997, 17.884711055171124], [95.75813120978756, 17.875292333974073], [95.75891610299584, 17.872414391011375], [95.76545688212946, 17.870059711386602], [95.77225929203274, 17.870321342156274]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
