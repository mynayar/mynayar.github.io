
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungde</div><div class="name-mm">ပေါင်းတည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byet Gyi</div><div class="name-mm">ဗျက်ကြီး</div></div>
        <span class="pcode-badge">MMR008004019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4937335949295, 18.522673906175896], [95.49885859294977, 18.517264184594467], [95.5008516479852, 18.51527112955904], [95.50654609132908, 18.515840573983326], [95.51074574182257, 18.514488143812855], [95.50946449209272, 18.508722520927677], [95.5083967836847, 18.501035024346947], [95.50433949407244, 18.50039439858267], [95.50305824434258, 18.50039439858267], [95.50092282842587, 18.498472524887177], [95.49921449605222, 18.496550650292306], [95.49579783040559, 18.496550650292306], [95.49451658067574, 18.494201693053753], [95.49265762534918, 18.493624775263243], [95.48392733427909, 18.49559353961024], [95.48483622601105, 18.497411324872814], [95.48562450067021, 18.501352699067866], [95.48036933567636, 18.503454765425147], [95.47642796238063, 18.505294073262917], [95.47301210522454, 18.505819589402563], [95.47665026669654, 18.511000297725616], [95.47921276615631, 18.510715575963104], [95.48433776417653, 18.516979462832012], [95.48917804133362, 18.518403074342473], [95.48832387424744, 18.521250294665435], [95.4937335949295, 18.522673906175896]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
