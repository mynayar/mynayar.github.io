
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Kar Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Kar Kin</div><div class="name-mm">ဆူးကားကင်း</div></div>
        <span class="pcode-badge">MMR010007028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07124941932528, 22.04739276656295], [96.07124941932528, 22.048802386421073], [96.07041590427065, 22.05330337095387], [96.06911737406762, 22.05330337095387], [96.06627464675762, 22.054487840141746], [96.06620731541534, 22.05452431214735], [96.06549884119863, 22.054288153775303], [96.06514938083933, 22.055367395089263], [96.06517045555216, 22.05536992398288], [96.07113484839459, 22.05865034144017], [96.07901279620364, 22.0533983762341], [96.07921082871684, 22.053308361291897], [96.080977864337, 22.055216757747246], [96.08664227212324, 22.06133431682531], [96.09031457275938, 22.059997737205833], [96.10190641215127, 22.05599068102515], [96.094599306313, 22.053776775877566], [96.08808930827502, 22.04915124963054], [96.08414904474267, 22.046752829679406], [96.08107236779557, 22.047005019366225], [96.07124941932528, 22.04739276656295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
