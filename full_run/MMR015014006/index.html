
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsun Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsun Long</div><div class="name-mm">ဆွန်လုံ</div></div>
        <span class="pcode-badge">MMR015014006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39412634935161, 22.69741143698826], [97.41595323805154, 22.711579096598086], [97.45299120677885, 22.731245275049446], [97.47462400379482, 22.735178511279344], [97.49592903030054, 22.733211892714735], [97.50085781783406, 22.73184861132438], [97.49798054486632, 22.718832378011882], [97.49743535335892, 22.718832378011882], [97.49153427188918, 22.721555954144037], [97.48290961518666, 22.717924519600956], [97.47519281689506, 22.725641317892553], [97.47019959383624, 22.72700310640829], [97.46702208939797, 22.716108801879727], [97.45794350259064, 22.709753791204548], [97.44841098657781, 22.697497699958944], [97.43887847056504, 22.69159661758988], [97.42798416783512, 22.68841911405093], [97.41754379341137, 22.680702314860014], [97.41482021727927, 22.670715871440393], [97.39802483307966, 22.65800584919066], [97.38531481172924, 22.643934041123146], [97.37305871958432, 22.630770090567296], [97.37228210013888, 22.628699102981273], [97.3687544095884, 22.627342299407644], [97.35827586973568, 22.627018352814787], [97.34787715100975, 22.63296438240036], [97.35826578114097, 22.638814236687722], [97.37006548803191, 22.65454717890924], [97.39268159388052, 22.694862844644604], [97.39412634935161, 22.69741143698826]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
