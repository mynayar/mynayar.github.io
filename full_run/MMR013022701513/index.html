
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Lone Pyan Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Taung Lone Pyan Ward</div><div class="name-mm">တောင်လုံးပြန်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17845853213561, 16.78580093406589], [96.17822361033143, 16.785551071824557], [96.17807006817918, 16.785322189867202], [96.17786369355468, 16.785085678061648], [96.1775760651833, 16.784868240876676], [96.17735939062345, 16.7846858979359], [96.17717742899521, 16.784425735759157], [96.17701148968854, 16.7841520306917], [96.1768760679762, 16.78386879011265], [96.17670917538817, 16.78352737418902], [96.17655563323592, 16.78316084559657], [96.1760005950515, 16.78312110905199], [96.1750920612497, 16.783002853598873], [96.17467975626579, 16.78296089213154], [96.17453340329399, 16.7829551733426], [96.17425170325356, 16.7829441656408], [96.17434501690906, 16.783276748423248], [96.17453956634796, 16.783708572292824], [96.17483139005668, 16.784372330418762], [96.17527656526136, 16.785329056191017], [96.1755208975714, 16.78563880968335], [96.17575073281012, 16.78587245984619], [96.17610359170743, 16.786287308112833], [96.176433563758, 16.786632538061212], [96.17680168055318, 16.786906051573055], [96.17724800059483, 16.78669834055603], [96.1775760651833, 16.786500453733026], [96.17782974234876, 16.786312579961645], [96.17804241222763, 16.786110878214515], [96.17845853213561, 16.78580093406589]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
