
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Te Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Te Kone</div><div class="name-mm">ဆင်တဲကုန်း</div></div>
        <span class="pcode-badge">MMR008009051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60498279422063, 17.98973741265155], [95.60678890538372, 17.995607270559162], [95.60519915761512, 18.00064146673037], [95.60549184827022, 18.003373236585674], [95.61102822677128, 18.002231212700337], [95.61871200015872, 18.00488078991657], [95.6248060257775, 18.00779532359536], [95.62666073000872, 18.012034646781558], [95.62798551771755, 18.01653892732969], [95.63116500965754, 18.021043206978447], [95.63513937458254, 18.021043206978447], [95.64441289304062, 18.021043206978447], [95.64997700483497, 18.021043206978447], [95.65607103135306, 18.020248333993493], [95.65257256876907, 18.01530644603571], [95.65284427194564, 18.00932898064798], [95.6457799938517, 18.003623218436815], [95.64442147976752, 18.000091078940216], [95.64741021201172, 17.99112488130828], [95.64768191518829, 17.98650593000474], [95.64088934117024, 17.97781143465005], [95.62540227089812, 17.9846040086681], [95.61290393376959, 17.989494663148207], [95.60498279422063, 17.98973741265155]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
