
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Zin</div><div class="name-mm">ညောင်ပင်ဇင်</div></div>
        <span class="pcode-badge">MMR005001002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89178268042645, 21.907181610343116], [95.89289291957266, 21.909145860093417], [95.8937151598268, 21.914354159616835], [95.89289291957266, 21.919836600378858], [95.8904258399806, 21.92833430968068], [95.88686219993065, 21.93491322006912], [95.8824763196265, 21.939299190305462], [95.87931767756885, 21.94051400441782], [95.87902607958995, 21.940626149876948], [95.87837663957032, 21.940875899703087], [95.88603995967645, 21.945055769608132], [95.8888166398761, 21.94797870025684], [95.89207031958966, 21.94395921004957], [95.90111640040163, 21.940943939711076], [95.90495400002715, 21.942588600083866], [95.91153300034773, 21.944233350388856], [95.91180731965216, 21.94066980027111], [95.91125903987285, 21.931349669951373], [95.91125903987285, 21.926415509867923], [95.91125903987285, 21.919014180260262], [95.9124326398545, 21.91291092040268], [95.90980355998636, 21.913161299754222], [95.90879196028078, 21.913257689990473], [95.9044060799767, 21.915998909921825], [95.90029416014744, 21.911612939685483], [95.89837536033468, 21.90503403019636], [95.89481172028474, 21.905856360382757], [95.89178268042645, 21.907181610343116]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
