
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Chan Thar</div><div class="name-mm">တချမ်းသာ</div></div>
        <span class="pcode-badge">MMR005006060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8113763197614, 22.256700840171675], [95.81206967997178, 22.255314119750892], [95.81670036023348, 22.255314119750892], [95.82259391977362, 22.255314119750892], [95.8286412004311, 22.24819935011999], [95.82764507985661, 22.24815785989739], [95.82680339985706, 22.241843459907784], [95.82764507985661, 22.23468720005428], [95.83017084021219, 22.22584703970915], [95.83410167974876, 22.219558110318587], [95.82806628003488, 22.217427899677887], [95.82301476022309, 22.217427899677887], [95.81627951978408, 22.217427899677887], [95.81249088015005, 22.211113499688338], [95.81249088015005, 22.209479189612978], [95.80659731971059, 22.213639260043863], [95.80238783962716, 22.21869077985565], [95.80238783962716, 22.225005179845198], [95.80491359998274, 22.23174051021641], [95.80533444043215, 22.235108130435947], [95.80070376017045, 22.235950080232044], [95.7980329202831, 22.238287109762382], [95.79733631981537, 22.238896770069914], [95.80575527998224, 22.246474050237282], [95.80912308006617, 22.250262599939106], [95.8113763197614, 22.256700840171675]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
