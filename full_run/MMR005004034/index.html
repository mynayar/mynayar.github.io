
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyoe Gyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyoe Gyar</div><div class="name-mm">ကြိုးကြာ</div></div>
        <span class="pcode-badge">MMR005004034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83799400042284, 22.545476550402554], [95.83535808031121, 22.542758100406047], [95.8316216400267, 22.53877244988871], [95.82501995970341, 22.53291840026401], [95.81829408030762, 22.532544720262706], [95.80745807972664, 22.534537590037814], [95.79462912033767, 22.534537590037814], [95.78516292033254, 22.534288469737135], [95.77762740018443, 22.533845219980947], [95.77779515971889, 22.537030499957666], [95.783306039742, 22.5433288803236], [95.78493756012034, 22.546146600185523], [95.78763611981111, 22.550808239608614], [95.79223403956934, 22.555406070333902], [95.79236003998392, 22.55513840960998], [95.80062671974736, 22.55513840960998], [95.80259519990858, 22.55986223985053], [95.8128300001045, 22.561043219668875], [95.81755392027725, 22.561436879908115], [95.82149016024277, 22.556319390327644], [95.8254267599371, 22.551989220326334], [95.82936335963143, 22.550414580268693], [95.83566191986176, 22.545297179721103], [95.83799400042284, 22.545476550402554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
