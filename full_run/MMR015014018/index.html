
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tun Keng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tun Keng</div><div class="name-mm">တွန်ကြိုင်း</div></div>
        <span class="pcode-badge">MMR015014018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.52437909312073, 22.51385597717166], [97.51655044704557, 22.52037984815155], [97.50246986159488, 22.541500726777144], [97.488355301556, 22.568585422679178], [97.49002917730473, 22.569654843396336], [97.49592903030054, 22.575882466003065], [97.5001900361413, 22.59030432978102], [97.5067454283589, 22.600137419006728], [97.51166414438484, 22.599690262595573], [97.51395636069753, 22.599481879784946], [97.53132815097342, 22.603742884726387], [97.55820526176348, 22.617509210181936], [97.58934337839423, 22.635536539679606], [97.59264304404132, 22.637545033376625], [97.59400738393367, 22.635292738868827], [97.59475112056782, 22.63257353524051], [97.59518202083365, 22.630994803267583], [97.59545292091565, 22.62438786101103], [97.59662872873292, 22.62265912032217], [97.59360438333567, 22.620786906290732], [97.56902165982183, 22.57621023471461], [97.55886080098526, 22.559821753271365], [97.55164986864656, 22.526061479753537], [97.55232209299027, 22.52437967738024], [97.54512575305114, 22.522864657877733], [97.52648968415167, 22.51209715056308], [97.52437909312073, 22.51385597717166]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
