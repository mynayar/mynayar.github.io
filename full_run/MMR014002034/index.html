
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Lan (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Lan (North)</div><div class="name-mm">လင်လံ (မြောက်)</div></div>
        <span class="pcode-badge">MMR014002034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.9868503671508, 20.071842004105235], [96.98563869077304, 20.07328086991629], [96.98377425587728, 20.086704799187203], [96.98713023797018, 20.11690863802329], [96.98974044736383, 20.128095244699807], [96.9964524106503, 20.135925870182803], [96.9998083927432, 20.152705780647295], [97.00913056632265, 20.161282179728857], [97.03224955417363, 20.165756823118954], [97.03371018897411, 20.165652491869082], [97.0378428579616, 20.15792619763596], [97.04865657783887, 20.13928185317502], [97.05275833442965, 20.11317976913108], [97.06245339390904, 20.094162536971567], [97.06879247129558, 20.074772418012742], [97.06906771330438, 20.073029219822672], [97.0680466967977, 20.07439953121343], [97.05536854202467, 20.06656890573049], [97.0363513098651, 20.05650095855242], [97.01733407770558, 20.05426363775672], [97.00577458422975, 20.05911116704675], [96.9868503671508, 20.071842004105235]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
