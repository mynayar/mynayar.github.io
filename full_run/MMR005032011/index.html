
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mauk Pa Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mauk Pa Lin</div><div class="name-mm">မောက်ပလင်း</div></div>
        <span class="pcode-badge">MMR005032011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59881855962891, 24.08352012005753], [94.62055751981376, 24.085192410301545], [94.64568192028446, 24.08692509002094], [94.66351163995029, 24.085498769752462], [94.66809912037814, 24.073821449800107], [94.67329716043565, 24.06342509988849], [94.67829215965548, 24.057764009701316], [94.68369360027947, 24.0458813097747], [94.68304379963172, 24.02443899006738], [94.68529523978356, 24.01137980963057], [94.64080860023677, 24.010144019730774], [94.58232948002154, 24.005595690388873], [94.54854168005454, 24.001697069963882], [94.55049071957109, 24.015342239652682], [94.5534463198918, 24.017558760028805], [94.56088716031428, 24.023139479603344], [94.56998399976186, 24.030936629621806], [94.57778123971252, 24.03353573958276], [94.59142632036844, 24.043282289745946], [94.5992235603191, 24.049130220383404], [94.60117295956451, 24.061475789676024], [94.60117295956451, 24.070572540090723], [94.59881855962891, 24.08352012005753]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
