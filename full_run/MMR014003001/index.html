
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hkoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopong</div><div class="name-mm">ဟိုပုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hkoke</div><div class="name-mm">နမ့်ခုတ်</div></div>
        <span class="pcode-badge">MMR014003001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.18709730889373, 20.634092202793], [97.18811024319325, 20.637637474190115], [97.19342815028898, 20.640676277987893], [97.20330426218203, 20.64168921318668], [97.22330971976783, 20.64092951178759], [97.23217289826073, 20.639916576588803], [97.23521170205845, 20.635358370892163], [97.23673110395737, 20.629787230896056], [97.23571816875852, 20.62117728710217], [97.23394553395929, 20.615352913306367], [97.22609528976585, 20.609022071911113], [97.21723211307165, 20.60598326811339], [97.20963510267791, 20.60319769811531], [97.20311109500108, 20.602472807673962], [97.20305102838233, 20.602691231415236], [97.20021089291845, 20.602357097302274], [97.1982052500723, 20.601965751917987], [97.19533501519885, 20.60497949880488], [97.18846010914677, 20.612198150923973], [97.18737134581102, 20.61334135202185], [97.18733422899152, 20.61354920693043], [97.18709730889373, 20.61383351140745], [97.18431173799638, 20.629787230896056], [97.18709730889373, 20.634092202793]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
