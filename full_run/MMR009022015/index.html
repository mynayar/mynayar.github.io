
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Kone</div><div class="name-mm">မကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR009022015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6162308292894, 21.026665985446925], [94.61867855277308, 21.027139738408266], [94.63020227661383, 21.027370213064955], [94.63481176704948, 21.027139738408266], [94.64449169543548, 21.027600686822268], [94.65186687905327, 21.026678789094888], [94.65722114124276, 21.02619203823201], [94.65788226255643, 21.02550336888544], [94.66341364982014, 21.02273767480392], [94.6715263521595, 21.024212712246936], [94.67779525814473, 21.024950230069123], [94.68077631017866, 21.02568028441766], [94.68260641255597, 21.021003354721074], [94.68260641255597, 21.01610577186392], [94.68275587358477, 21.016086277259944], [94.6817421325934, 21.015241492800726], [94.67857310876201, 21.01178437564846], [94.67108268781584, 21.007462979433], [94.66445654683224, 21.004005862280792], [94.65120426486499, 20.99910827942358], [94.64140909915068, 20.994210696566427], [94.63017346773142, 20.984415530852118], [94.6246996991319, 20.982686972725674], [94.62412351338946, 20.98225483319402], [94.62559278797687, 20.985193383268097], [94.62374899162273, 20.993029515299952], [94.62282709389535, 20.99625615779547], [94.62420994093611, 21.002018019715877], [94.62697563501757, 21.00916272867704], [94.62743658433095, 21.013311268899997], [94.62397946627942, 21.02022550410379], [94.61890902832903, 21.02345214569999], [94.6162308292894, 21.026665985446925]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
