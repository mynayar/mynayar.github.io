
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyunt Paung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyunt Paung</div><div class="name-mm">ညွန့်ပေါင်း</div></div>
        <span class="pcode-badge">MMR013006027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.86612322110983, 17.124914738024813], [95.86640077977222, 17.127967888707133], [95.86612322110983, 17.129910802941254], [95.86584566244744, 17.13157615761361], [95.86945393135392, 17.134629309195304], [95.87389487714694, 17.136849782091815], [95.87361731758517, 17.144898997690632], [95.87417243580933, 17.151560418178804], [95.87306220026039, 17.15516868708528], [95.87722558739102, 17.153225772851158], [95.87944606118685, 17.151005299055385], [95.88333188875572, 17.148507266597107], [95.88610747987633, 17.143788761242376], [95.88888307189632, 17.141290728784156], [95.89471181459862, 17.13990293277419], [95.90026299773922, 17.13990293277419], [95.90303858885983, 17.13990293277419], [95.90553662221743, 17.134074190071885], [95.90775709511388, 17.127967888707133], [95.90747953555217, 17.12352694201479], [95.90470394443156, 17.11853087709835], [95.9019283533109, 17.112702135295365], [95.89693228839445, 17.11408993130533], [95.89193622257869, 17.11575528597774], [95.89110354479283, 17.117698200211805], [95.89054842656867, 17.121584027780727], [95.88832795367216, 17.121584027780727], [95.88610747987633, 17.12130646911828], [95.87778070561512, 17.122416705566536], [95.87278464069868, 17.122416705566536], [95.86945393135392, 17.124082061138267], [95.86612322110983, 17.124914738024813]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
