
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hseng Law</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waingmaw</div><div class="name-mm">ဝိုင်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hseng Law</div><div class="name-mm">ဆိုင်လော်</div></div>
        <span class="pcode-badge">MMR001002026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.66632228784334, 25.417318756955126], [97.68491885582063, 25.426317096356968], [97.6990646331264, 25.433806037019053], [97.70904988674295, 25.448783918343224], [97.71487461756959, 25.4679223206586], [97.73068460381148, 25.487060724772675], [97.74899090300784, 25.499542292243063], [97.7606403655605, 25.50536702396903], [97.76729720220419, 25.492053351580978], [97.77312193393016, 25.48123599304671], [97.78310718844602, 25.462929693850356], [97.78726771033661, 25.452112336215407], [97.78477139738214, 25.433806037019053], [97.77894666475686, 25.411339215032797], [97.76396878433201, 25.394697124772563], [97.74815879809012, 25.38887239304654], [97.73817354357425, 25.38055134836611], [97.72902039487536, 25.368069780895723], [97.72652408102158, 25.33977822808282], [97.71653882740503, 25.316479301178845], [97.67576570712174, 25.291516166238125], [97.65662730300767, 25.280698807703857], [97.66078782579757, 25.289851957302062], [97.65662730300767, 25.304829837726857], [97.6591236168615, 25.316479301178845], [97.66578045260587, 25.342274541037284], [97.67077308031344, 25.368901884914123], [97.67077308031344, 25.386376080092077], [97.66328413875203, 25.397193437727026], [97.66161992981597, 25.406346588224494], [97.66632228784334, 25.417318756955126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
