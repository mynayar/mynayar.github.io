
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yar</div><div class="name-mm">ဘုရား</div></div>
        <span class="pcode-badge">MMR009007030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.56718672418805, 20.08820624162479], [94.57644086135673, 20.081946089640383], [94.58505278186044, 20.08105520233579], [94.57669279923334, 20.071270026290733], [94.56972543388173, 20.060818979612293], [94.56463389873551, 20.05679934641273], [94.5565946323365, 20.062962784405045], [94.54399978086525, 20.07770143976967], [94.53462063613352, 20.090832242214276], [94.52804421776648, 20.10197206435936], [94.52899315001395, 20.10342709278615], [94.53069644258682, 20.111517740151612], [94.53113695390738, 20.11361016397791], [94.5364964654396, 20.11361016397791], [94.53864027023235, 20.109054578905727], [94.53855770257599, 20.10657758069084], [94.55001117227783, 20.105109188338417], [94.55620895358038, 20.099711120172117], [94.55921701855061, 20.097091192704454], [94.560346923172, 20.095772970046596], [94.56634412598066, 20.08877623463559], [94.56718672418805, 20.08820624162479]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
