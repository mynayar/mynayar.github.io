
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Gyi Kone</div><div class="name-mm">ကံကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR005011016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31951911981162, 22.907287620427383], [95.32452383980342, 22.904479980167025], [95.3292848399235, 22.903930620301935], [95.33209211955574, 22.90411376993461], [95.3342895599153, 22.90551759006479], [95.33630375981073, 22.90692141019497], [95.3394775203713, 22.907287620427383], [95.34387203956305, 22.907287620427383], [95.3474731201884, 22.907470680127858], [95.35858754368024, 22.907527857224864], [95.35827636026585, 22.90667723976287], [95.35571279960607, 22.898925810377875], [95.3549193601404, 22.89672854988271], [95.35369859971064, 22.892700240024112], [95.35247819990906, 22.888916009766092], [95.35184707008625, 22.885736740857965], [95.34217178310138, 22.884248235167945], [95.33148191965495, 22.883117670444165], [95.33111580025405, 22.88330082007684], [95.32812492042882, 22.885070759607913], [95.32611071963407, 22.886108370404997], [95.32611071963407, 22.88970945013108], [95.32592783979806, 22.891723650026506], [95.32568376019742, 22.893676740089518], [95.32488996010363, 22.8972778198156], [95.32348631983785, 22.8972778198156], [95.32128924010641, 22.898071260180586], [95.31927504021098, 22.898681639945778], [95.31652823998633, 22.89929201971097], [95.31408707975498, 22.900085460075957], [95.31390384019011, 22.903503390169362], [95.314269959591, 22.905883800297204], [95.31567395958564, 22.908508290025623], [95.31951911981162, 22.907287620427383]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
