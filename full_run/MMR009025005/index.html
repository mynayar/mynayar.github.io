
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Chaung</div><div class="name-mm">ကံချောင်း</div></div>
        <span class="pcode-badge">MMR009025005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.17214428902776, 21.254053024927202], [94.16505981395932, 21.25270360119032], [94.14884574433569, 21.25481848018876], [94.1471985874449, 21.25499817012951], [94.14093905958998, 21.25568102715772], [94.134135405025, 21.270044299205097], [94.11668771376702, 21.281108688015593], [94.10009113010165, 21.29600305829456], [94.08349454643621, 21.307067448004375], [94.07455792390914, 21.31430185624572], [94.06562130228133, 21.32366403166975], [94.06349353419932, 21.329196227424006], [94.06410663891029, 21.33118881481198], [94.06918508532351, 21.32941135874728], [94.07602768682835, 21.3289106809832], [94.07812636903674, 21.32875711904586], [94.08903037185422, 21.32570399804115], [94.09840781596802, 21.32570399804115], [94.10974798008527, 21.32504975833973], [94.12273476959399, 21.324840292745364], [94.1284019158158, 21.319322281997756], [94.14285358762305, 21.304165651423716], [94.16329741614288, 21.289009019950356], [94.17351932905387, 21.281254463622645], [94.18076129429835, 21.274357356007215], [94.18092140509884, 21.27420486786042], [94.17457676900273, 21.263982954949483], [94.17246189000429, 21.254113519623274], [94.17214428902776, 21.254053024927202]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
