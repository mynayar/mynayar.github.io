
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Poke Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Poke Chaung</div><div class="name-mm">ဥပုဒ်ချောင်း</div></div>
        <span class="pcode-badge">MMR007008045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.01574923124207, 17.884418723345448], [97.01594788158951, 17.889384994621878], [97.01954346286055, 17.888486099753777], [97.02323007081117, 17.88756444844057], [97.02505061789174, 17.878916848233985], [97.03051226003282, 17.87163465901233], [97.04143554341567, 17.868448701846148], [97.05372423688408, 17.863897333695036], [97.06237183709067, 17.86298705970512], [97.0676738621591, 17.860667959958448], [97.06555779425685, 17.848877819156087], [97.06100642610573, 17.83840967276825], [97.05930724883052, 17.833028944430282], [97.0573653319446, 17.832948030627165], [97.05099341581354, 17.82703125239044], [97.03642903916887, 17.82065933715876], [97.02641602887667, 17.819293927073147], [97.02323007081117, 17.81110146386152], [97.0100311042521, 17.824300431319898], [97.00707826485012, 17.82387859711963], [97.00456946211102, 17.829762072561664], [96.99774240988438, 17.83522371560207], [96.99137049465264, 17.84205076692939], [96.99501158881384, 17.847057272075517], [97.00138350404552, 17.851153503231615], [97.00912083026219, 17.859345966443243], [97.01412733540826, 17.867083290861217], [97.01549274459455, 17.878006575143388], [97.01574923124207, 17.884418723345448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
