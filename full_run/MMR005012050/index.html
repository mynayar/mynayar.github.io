
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sit Pon (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sit Pon (South)</div><div class="name-mm">ကျောက်စစ်ပုံ (တောင်)</div></div>
        <span class="pcode-badge">MMR005012050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19297695991884, 22.196627009728786], [95.19432660039234, 22.19500737029398], [95.19580836026768, 22.190350589907837], [95.19474995984285, 22.18569371958955], [95.19178644009219, 22.18209524969609], [95.19215148030662, 22.18187628006632], [95.18882292034158, 22.181460209621036], [95.17802759969402, 22.1789201401524], [95.17040748032105, 22.176168390059217], [95.16553884034528, 22.16960649034729], [95.16596904183785, 22.169498945819726], [95.15899691997191, 22.16657510955372], [95.15306987957132, 22.163188320284803], [95.14573199983198, 22.162623840118158], [95.14121616029763, 22.164035040085082], [95.13919583961638, 22.166366129593257], [95.14403856023142, 22.16967966008832], [95.14854324007854, 22.173472889862012], [95.15574503980179, 22.17790493956136], [95.16574656035556, 22.182350040222218], [95.16923927986892, 22.185683909784643], [95.17416083955118, 22.192034129771343], [95.18035211965469, 22.19489172017677], [95.185432440255, 22.195685520270615], [95.19194124039598, 22.195685520270615], [95.19297695991884, 22.196627009728786]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
