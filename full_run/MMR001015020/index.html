
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nein Mar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nein Mar</div><div class="name-mm">နိမ္မာ</div></div>
        <span class="pcode-badge">MMR001015020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.78212381216429, 26.551979525734566], [97.77730004476132, 26.550742662943605], [97.7436424252578, 26.546399744152893], [97.71541345356809, 26.548571203997938], [97.70129896817292, 26.556171310757463], [97.70129896817292, 26.568114338106284], [97.70021323914972, 26.585486012369643], [97.70377207052468, 26.592603675119562], [97.7056760567047, 26.591827578180244], [97.70681937921103, 26.590508359073567], [97.70831449401874, 26.588485557162755], [97.70998550362816, 26.58619891215011], [97.71209625383909, 26.583032786833712], [97.71394316004887, 26.580570246120033], [97.71684544046474, 26.57881128731111], [97.71851645097348, 26.578371548508187], [97.7208910442863, 26.57828360020801], [97.72537638781012, 26.57889923561129], [97.7284545648264, 26.58039434951968], [97.73061366888578, 26.583314553423975], [97.7325001686479, 26.586814547553388], [97.73329169975221, 26.588749401163966], [97.73478681455993, 26.592003473881277], [97.735490397364, 26.5943780671941], [97.735490397364, 26.597016504508133], [97.7408677829219, 26.598756040658827], [97.7490710730716, 26.602857686633], [97.75910280275218, 26.601185731836097], [97.77132371162003, 26.574299733046303], [97.78212381216429, 26.551979525734566]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
