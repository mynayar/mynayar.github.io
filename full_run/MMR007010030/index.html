
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Kyat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Kyat</div><div class="name-mm">နကျပ်</div></div>
        <span class="pcode-badge">MMR007010030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.42985453036232, 19.28401676855907], [96.43279732613576, 19.277150245987116], [96.4365256644279, 19.269354628413396], [96.43991506263012, 19.266643108592632], [96.44160976308018, 19.261220070749744], [96.43788142388865, 19.25579703200748], [96.43211944595572, 19.253424453176024], [96.42669640811278, 19.252407632906], [96.41856185044912, 19.25274657299599], [96.41008835269537, 19.253085513086035], [96.4036484945824, 19.253424453176024], [96.39924227611021, 19.255458091917433], [96.39280241799725, 19.258508550928923], [96.38907932994715, 19.259439324065625], [96.39144665763718, 19.261897950030402], [96.39822545584019, 19.265965229311917], [96.40466531395316, 19.269354628413396], [96.40805471305464, 19.273760846885637], [96.41449457116761, 19.27613342571709], [96.41991760990982, 19.280539645088595], [96.42534064775276, 19.28155646355998], [96.42985453036232, 19.28401676855907]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
