
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Pya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Pya</div><div class="name-mm">စံပြ</div></div>
        <span class="pcode-badge">MMR017017074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15687111960654, 16.62179030987494], [95.15992247973873, 16.620728760024292], [95.16095352008892, 16.620369929628623], [95.16515255994273, 16.61916357004276], [95.16733236010037, 16.618528350103304], [95.17086215956107, 16.617499739721268], [95.1746939999282, 16.616171159571422], [95.17552092025431, 16.615884509662465], [95.17547375980621, 16.613474670119956], [95.17645944015112, 16.611232500179767], [95.17744511959665, 16.60899033023958], [95.17785480035883, 16.608006720134085], [95.17625459977, 16.607942909637643], [95.17515119996796, 16.607954429953054], [95.17095647955796, 16.607785590332753], [95.16616920034835, 16.607268089850493], [95.16395411978687, 16.60651092004298], [95.16175595996964, 16.60704974974618], [95.15942351967976, 16.60813496975311], [95.15709071966103, 16.60922018975998], [95.1548317198081, 16.611995969738246], [95.15469311989165, 16.613036819893352], [95.15393352011591, 16.617478680296927], [95.15506860033571, 16.62079059021363], [95.15687111960654, 16.62179030987494]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
