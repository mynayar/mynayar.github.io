
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Byine Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Byine Gar</div><div class="name-mm">အင်ဗျိုင်ဂါး</div></div>
        <span class="pcode-badge">MMR001003062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.77114026251314, 26.474072267721056], [97.78008945936114, 26.460026732447773], [97.78401785004382, 26.453572947433656], [97.79061193469312, 26.44164747575047], [97.79748661771328, 26.433790694385095], [97.80534339907865, 26.42677571083044], [97.80857029158574, 26.419760728175106], [97.81488377696479, 26.410500949559207], [97.81909276691772, 26.40222326928847], [97.82353746018572, 26.39759701099331], [97.81417592417961, 26.39104393722795], [97.80200592773144, 26.391980090109143], [97.78825187712249, 26.395460129181686], [97.7823793437318, 26.39818639428671], [97.78549887877028, 26.400092777160012], [97.78656963767867, 26.406874239154888], [97.78442812255986, 26.421507925650303], [97.7826435267774, 26.432929339017846], [97.77943125364948, 26.438283123667247], [97.77229287321757, 26.447563022815302], [97.76265605563253, 26.45934135461988], [97.75944378340392, 26.465052061303652], [97.76122837918643, 26.470405845953053], [97.76586832606245, 26.473261200643947], [97.77114026251314, 26.474072267721056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
