
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnget Pyaw Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnget Pyaw Taw</div><div class="name-mm">ငှက်ပျောတော</div></div>
        <span class="pcode-badge">MMR017014007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95953963964274, 16.496998919564533], [94.95525095986397, 16.503596820037274], [94.95383255992476, 16.50368546980866], [94.95277668029962, 16.506400950243687], [94.94947763968139, 16.510029749773196], [94.9465087204012, 16.51349367029667], [94.94370468012693, 16.51596785992882], [94.94749835956168, 16.51893695997279], [94.94947763968139, 16.525039950033715], [94.9511271599905, 16.53378219039581], [94.95492084032458, 16.53840071991732], [94.95627012016996, 16.540853940057332], [94.9598694003526, 16.540709939711974], [94.9626734397275, 16.539225480071877], [94.96811664037074, 16.54631820012486], [94.9722404402442, 16.539060510234435], [94.97586923977366, 16.538235750079878], [94.97520936042372, 16.531637849607137], [94.97685887983351, 16.52668947034283], [94.97982815974183, 16.521411149604944], [94.98213719967208, 16.517782350075436], [94.98147732032214, 16.51349367029667], [94.97405483955924, 16.517947229980734], [94.96828188000484, 16.517947229980734], [94.96052927970254, 16.50491639977207], [94.95953963964274, 16.496998919564533]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
