
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Kyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalaw</div><div class="name-mm">ကလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Kyar</div><div class="name-mm">လယ်ကြား</div></div>
        <span class="pcode-badge">MMR014005015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7029083132681, 20.530273484633653], [96.70004393657848, 20.53066404401045], [96.69184065901925, 20.530663892025075], [96.68168425272614, 20.529101106830637], [96.66957471859843, 20.52597568932663], [96.66812398803171, 20.524403933394865], [96.65570370935876, 20.533450802912284], [96.6550991563011, 20.533273605892248], [96.6529586798992, 20.536637209739467], [96.64617255941613, 20.53806586734595], [96.64260091629933, 20.542709003217965], [96.63724345162404, 20.55342393166916], [96.63275371221408, 20.565546228076016], [96.63010016628971, 20.57271080306117], [96.62902867263517, 20.58128274600199], [96.62902867263517, 20.59235483930445], [96.63652912282083, 20.590926181697967], [96.6454582297136, 20.589140360139538], [96.65331584385115, 20.591283345649913], [96.65342804326963, 20.591183614432282], [96.65974480218091, 20.58556871702274], [96.66653092266398, 20.572353639109224], [96.67831734387039, 20.56092438185476], [96.69046092992801, 20.553066766817892], [96.70299396380045, 20.533759121086632], [96.70260571118467, 20.533450802912284], [96.7029083132681, 20.530273484633653]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
