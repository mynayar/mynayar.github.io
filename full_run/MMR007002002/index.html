
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Kyet Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Kyet Su</div><div class="name-mm">မကြက်စု</div></div>
        <span class="pcode-badge">MMR007002002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.62730918057429, 17.300972592211394], [96.62331506833578, 17.290321624443436], [96.6211240860078, 17.283566096198456], [96.61905895660561, 17.27973085639394], [96.61500574182156, 17.279969281057504], [96.60821705287475, 17.27873497413981], [96.60019405611087, 17.279043551318864], [96.59649113535767, 17.280895010796144], [96.59247963562672, 17.284906509627774], [96.59124532870902, 17.288918007560028], [96.58815956141467, 17.289843738197987], [96.5878426709026, 17.292062561737907], [96.59027524710501, 17.29427832398551], [96.59674939007238, 17.299063559935405], [96.60434947165083, 17.301878404664706], [96.60496147109507, 17.30457120419777], [96.60698274505768, 17.30465542390874], [96.61284570426591, 17.30650688518466], [96.61643329056398, 17.310542919320312], [96.61926814610814, 17.30666364331256], [96.62349041365172, 17.30272285997205], [96.62730918057429, 17.300972592211394]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
