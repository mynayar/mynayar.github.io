
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hpyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyang</div><div class="name-mm">မိုင်းယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hpyan</div><div class="name-mm">မိုင်းဖျန်</div></div>
        <span class="pcode-badge">MMR016003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.70253737559949, 21.98330484184504], [99.69100328617276, 21.96946393381353], [99.68177601355222, 21.958698782722706], [99.66485934768082, 21.94639575316154], [99.64486692486872, 21.944857874691195], [99.62564344129186, 21.943319996220907], [99.60488207834533, 21.94716469329603], [99.58642753400358, 21.953316207177295], [99.57335556520724, 21.964081358268118], [99.56259041411636, 21.968694993679037], [99.54413586887529, 21.97792226719895], [99.53157652713509, 21.986893225841754], [99.53260177944861, 21.98791847815528], [99.54644268837944, 22.00329726465708], [99.56335935335153, 22.020982869763657], [99.57720026228236, 22.032516960989028], [99.58412071629806, 22.039437415004727], [99.59181010864967, 22.039437415004727], [99.62487450115736, 22.02175180989815], [99.6610146506057, 22.002528326321226], [99.68100707431711, 21.99330105370069], [99.70253737559949, 21.98330484184504]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
