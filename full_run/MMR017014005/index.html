
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yar Chaung</div><div class="name-mm">ဘုရားချောင်း</div></div>
        <span class="pcode-badge">MMR017014005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95032520844165, 16.601630048388074], [94.95055363624135, 16.60194984730765], [94.95187852017762, 16.60217827600667], [94.95411711711131, 16.602269647126548], [94.95580748642641, 16.60190416174771], [94.95667551386396, 16.60044222113163], [94.95790902668028, 16.598843222936466], [94.95927959617649, 16.59770108213928], [94.96078722235251, 16.596741682682534], [94.96139841510484, 16.596074927116263], [94.96118915995186, 16.59563738985372], [94.95904464019804, 16.592008590324212], [94.95261180039432, 16.5890394902803], [94.9465087204012, 16.58458592969697], [94.9390858799095, 16.5816169195852], [94.93397279970497, 16.580132370012905], [94.92869447986641, 16.586565299748827], [94.9301787596421, 16.587884880383], [94.93265304010578, 16.595307540110923], [94.93381195056111, 16.599711250373957], [94.93419817340703, 16.599711250373957], [94.93575148514299, 16.599939679072975], [94.93922359489306, 16.600213792432612], [94.94274139020308, 16.600076735752793], [94.94561958587525, 16.599848307053776], [94.94772112612912, 16.599711250373957], [94.94868052468655, 16.60030516355249], [94.95009677974264, 16.601310248569177], [94.95032520844165, 16.601630048388074]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
