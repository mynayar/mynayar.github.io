
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thay Su Le</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Demoso</div><div class="name-mm">ဒီးမော့ဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thay Su Le</div><div class="name-mm">သေးဆူလဲ</div></div>
        <span class="pcode-badge">MMR002002008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.11616598587159, 19.60647489619953], [97.12202564726584, 19.608091353832947], [97.13196655261436, 19.612141351742025], [97.14374836839255, 19.617295896088763], [97.15589836391842, 19.62208225798986], [97.1647347237286, 19.62429134906654], [97.1761483570611, 19.627973166328616], [97.18076932824198, 19.629093401439377], [97.17848341617679, 19.62079192960391], [97.17750893598867, 19.613605139565607], [97.17482911637069, 19.604347579577166], [97.17129662613843, 19.59862251072036], [97.16471888576802, 19.59204477124922], [97.16067779564383, 19.58655414215997], [97.15258472820273, 19.588209542236655], [97.14153927731587, 19.584159543428257], [97.12938928089068, 19.58231863479722], [97.12754837315896, 19.587841359790957], [97.12276201125786, 19.591523177053034], [97.11797564935677, 19.598150447585112], [97.11616598587159, 19.60647489619953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
