
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Chaung</div><div class="name-mm">စစ်ချောင်း</div></div>
        <span class="pcode-badge">MMR017019052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58916811981294, 16.83143361027294], [95.59309068019081, 16.828246619785716], [95.59676772025415, 16.82371133960669], [95.59763820014285, 16.820913869779304], [95.59680407984445, 16.815886110056], [95.59596996044536, 16.810858260400437], [95.59486799955857, 16.81096347028796], [95.59192607972489, 16.809737670057473], [95.59131335992367, 16.80728616042802], [95.59180368019577, 16.806183030422574], [95.59229399956848, 16.805079809585607], [95.59290672026896, 16.800054210033807], [95.59266155968328, 16.79453838014217], [95.5925596799853, 16.793685179827264], [95.59168092003847, 16.786325790103206], [95.59138104020292, 16.781529600410806], [95.59119059976643, 16.77848094004338], [95.57948483965367, 16.77946157968819], [95.57874935969528, 16.784609760432147], [95.5781758800129, 16.79067053991355], [95.57789111957959, 16.793680319890882], [95.57752356036406, 16.79968655998681], [95.57791703983958, 16.801181729653138], [95.57813628016527, 16.802015490222743], [95.5800975603542, 16.806183030422574], [95.58305388013252, 16.809587280029007], [95.58414252026114, 16.81084088999512], [95.58500076037683, 16.812924659645375], [95.58671652025129, 16.81917606032698], [95.58757476036698, 16.827511139827266], [95.58916811981294, 16.83143361027294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
