
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Dar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thi Dar Kone</div><div class="name-mm">သီတာကုန်း</div></div>
        <span class="pcode-badge">MMR008008034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5731756818123, 17.74069048317932], [95.57110384616561, 17.73850137413916], [95.55698693080228, 17.72375081175062], [95.55303114677008, 17.724019001275963], [95.5398465154044, 17.724019001275963], [95.53691877608071, 17.72722634611904], [95.5321279301599, 17.73414645659375], [95.53079713857716, 17.73973577818367], [95.53745109199434, 17.744792782061268], [95.542508095872, 17.74931747002529], [95.54455959514928, 17.7527081560566], [95.5460550454041, 17.758316097210184], [95.54642890796777, 17.760185410028726], [95.55203684912135, 17.769158115154937], [95.55614933822142, 17.776261505664024], [95.55652320078514, 17.781869446817552], [95.57185157219237, 17.78299103540803], [95.58531062898243, 17.7904682893801], [95.58942311898181, 17.78972056335334], [95.58755380526395, 17.77289674169134], [95.59091856923663, 17.759437684901286], [95.5731756818123, 17.74069048317932]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
