
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Khin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Khin Gyi</div><div class="name-mm">ဝါခင်းကြီး</div></div>
        <span class="pcode-badge">MMR010022036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01936482013042, 21.016210637311133], [95.0270053073491, 21.015516046828168], [95.0394502391373, 21.01506350437728], [95.0492711929113, 21.015025338948305], [95.04566933976827, 21.01240580988025], [95.04403213387593, 21.006511868128257], [95.04403213387593, 21.000617926376265], [95.0450144570516, 20.994396543265907], [95.04043028073295, 20.995706307799935], [95.03912051619892, 20.993414220090244], [95.03551866215662, 20.993414220090244], [95.03257169083093, 20.99275933737357], [95.02733263179556, 20.99046724876456], [95.02012892640886, 20.992431896015262], [95.01390754329856, 20.995706307799935], [95.00604895339654, 20.996361189617232], [95.00465450600069, 20.996361189617232], [94.99819036439385, 20.996361189617232], [94.99557642641099, 20.996361189617232], [94.99000433403285, 20.996361189617232], [94.9886945685995, 20.996361189617232], [94.98705736270716, 20.997179793912437], [94.98542015681483, 20.997998397308265], [94.9902907231384, 21.001885019877818], [94.99986597403552, 21.00598869921913], [95.00862049014358, 21.00790374975827], [95.01874289756671, 21.008998063709726], [95.02135508367024, 21.00910255144163], [95.01936482013042, 21.016210637311133]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
