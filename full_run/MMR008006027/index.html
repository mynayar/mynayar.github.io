
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Hta Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Hta Yan</div><div class="name-mm">ကျောက်ထရံ</div></div>
        <span class="pcode-badge">MMR008006027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14849615517346, 18.54981159642807], [95.13827956894698, 18.54981159642807], [95.13430645228101, 18.548676419980836], [95.1314685111629, 18.544135715091215], [95.12040054305066, 18.543284332306143], [95.11330569070515, 18.543284332306143], [95.1115717213579, 18.54228045507898], [95.10762981026761, 18.55350091943194], [95.10223772169354, 18.562582329211182], [95.09996736969839, 18.570244768881025], [95.09883084966401, 18.574208677388583], [95.10916796123246, 18.575685407355707], [95.1121214211667, 18.575685407355707], [95.11596091926106, 18.57332263922848], [95.12245853183583, 18.5656436421404], [95.12511664631626, 18.5656436421404], [95.13486306427905, 18.56652968030056], [95.14136067685382, 18.567415717561346], [95.14520017494817, 18.56889244842779], [95.14565821495472, 18.560595770878194], [95.14877994883562, 18.552081948423222], [95.14849615517346, 18.54981159642807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
