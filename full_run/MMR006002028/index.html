
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Maung Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Launglon</div><div class="name-mm">လောင်းလုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Maung Taung</div><div class="name-mm">ခမောင်းတောင်</div></div>
        <span class="pcode-badge">MMR006002028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.18984065012597, 14.140228219057121], [98.19010204976985, 14.137931625743988], [98.19206503597269, 14.126808039059824], [98.19359180421844, 14.121137192127776], [98.19378103057016, 14.11867723696497], [98.19383306084711, 14.118000849659552], [98.19402802217553, 14.115466345195728], [98.19192018756667, 14.115689897770608], [98.18740727982214, 14.116168529554045], [98.17958700014003, 14.115982229596284], [98.16990480006655, 14.118402780064287], [98.16524999998757, 14.121940589786448], [98.1592916397974, 14.127154199806512], [98.15589326006597, 14.129213748016127], [98.15782895993863, 14.130746280016865], [98.16330852017211, 14.136006959653514], [98.17097971384277, 14.135787886601747], [98.1738291599878, 14.13337679969959], [98.17755533990709, 14.13337684466569], [98.17952795964766, 14.13337688963179], [98.18040474018665, 14.134253670170779], [98.18040456032224, 14.136664769663412], [98.18193888017527, 14.138199135381853], [98.18413074024153, 14.13885676462803], [98.18719060796025, 14.139591710389197], [98.18984065012597, 14.140228219057121]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
