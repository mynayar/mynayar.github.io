
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Dun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Dun</div><div class="name-mm">တောင်ဒွန်း</div></div>
        <span class="pcode-badge">MMR010011003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50438356425013, 22.95214454413548], [96.50438356425013, 22.951752455911162], [96.50438356425013, 22.94556587206739], [96.50832048140518, 22.93994170534546], [96.51563189769399, 22.935442371068632], [96.51862057058293, 22.935143503869654], [96.5157715606091, 22.931938367761518], [96.50709906896691, 22.928784734028284], [96.49632415573524, 22.925368297708815], [96.4863376511617, 22.923528678705622], [96.4776651604189, 22.917484215624086], [96.47382959595916, 22.915840402412698], [96.47356923683088, 22.918791140099074], [96.46942969972093, 22.9244557700178], [96.46805889999831, 22.92481862937632], [96.46855821798744, 22.92881317688665], [96.46855821798744, 22.9327348442377], [96.47444071856438, 22.931863363403522], [96.47640155179022, 22.93622077027237], [96.47988747782489, 22.941231789115818], [96.4835912754171, 22.946024937301047], [96.48598784906005, 22.949510864235037], [96.49056312658706, 22.951253826802713], [96.4975349786564, 22.95277891871217], [96.50276386815807, 22.955393363912663], [96.50438356425013, 22.95681420641057], [96.50438356425013, 22.95214454413548]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
