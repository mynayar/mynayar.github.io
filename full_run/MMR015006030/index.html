
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Tawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Tawng</div><div class="name-mm">ယောင်တောင်း</div></div>
        <span class="pcode-badge">MMR015006030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.17489438786578, 22.762974888380427], [99.18191774860526, 22.761448173194708], [99.19362896580418, 22.7617737619496], [99.19981001791803, 22.756894019843173], [99.2079428479841, 22.75559290139131], [99.21965409216267, 22.75494251438556], [99.22973876763007, 22.754617414861855], [99.23819681682971, 22.75689488409165], [99.2466610209894, 22.762794721799025], [99.24821286503175, 22.759912724692526], [99.25447978711253, 22.755954668972834], [99.25548177936071, 22.754702178662683], [99.24989586620131, 22.751769574906007], [99.24213709205321, 22.750661177571317], [99.22698901133384, 22.742348207004227], [99.21959970206467, 22.736067295069688], [99.2086184951475, 22.72879772513494], [99.18560888464236, 22.721473410769363], [99.16491882174631, 22.71500776729465], [99.1506944041235, 22.708172656243164], [99.14718448237801, 22.70909632023904], [99.16288676221438, 22.72664592716785], [99.1669508821775, 22.735513096852003], [99.16916767414892, 22.74419553409666], [99.17230813011616, 22.756942090405175], [99.17489438786578, 22.762974888380427]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
