
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lar</div><div class="name-mm">ဖလာ</div></div>
        <span class="pcode-badge">MMR001005013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.21645119826422, 26.059715149634485], [98.21656466842478, 26.059513431699543], [98.21908809683828, 26.05502745505305], [98.22098610162737, 26.054268277958727], [98.22494762873015, 26.052683720177583], [98.23285791076404, 26.052390929697708], [98.24106114785377, 26.052684116778607], [98.24146360705987, 26.051396330776072], [98.24252615515798, 26.047996393418885], [98.24369828744608, 26.04008582719922], [98.24399139178934, 26.03569105889528], [98.2460300532444, 26.03628574818879], [98.25102268364998, 26.037742128296657], [98.262155607995, 26.039500311889924], [98.27592538684718, 26.038035727267072], [98.28324982981587, 26.034227102898512], [98.28713859097326, 26.03265062912328], [98.28705618069824, 26.03233472426814], [98.28449882895785, 26.022531540198486], [98.26979069928143, 26.02305682970899], [98.2535066992748, 26.02568328175812], [98.2414250216475, 26.027259152088277], [98.22671689287034, 26.025157991348294], [98.22093869926164, 26.025157991348294], [98.20202824810525, 26.029360313727523], [98.18416837686914, 26.033562636106808], [98.18469366727896, 26.041441991354873], [98.19600249721753, 26.059213009572773], [98.1956501023704, 26.0600076226537], [98.20473220462759, 26.062058740618454], [98.21293546779765, 26.061472974398328], [98.21645119826422, 26.059715149634485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
