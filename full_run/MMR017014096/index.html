
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Keik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Keik</div><div class="name-mm">ပကိတ်</div></div>
        <span class="pcode-badge">MMR017014096</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9959928799675, 16.393412070011095], [94.99203395999933, 16.389453329907326], [94.98890015991452, 16.387144110112615], [94.98543624029031, 16.386154470052816], [94.97966292010773, 16.38895851032703], [94.97652912002292, 16.39275227969398], [94.973889959654, 16.39605123038001], [94.97042604002979, 16.400504879996276], [94.96809180019648, 16.401905369936912], [94.96894139962598, 16.40396870968823], [94.97075579984033, 16.408422270271615], [94.973230080304, 16.410896549835968], [94.97652912002292, 16.41370059011018], [94.98197231976678, 16.417494360376452], [94.98609611964025, 16.42442219962487], [94.98774563994937, 16.430690160422614], [94.99104431993948, 16.434319049884266], [94.99533299971824, 16.433164350054767], [94.99813703999246, 16.430525189685795], [94.99500323990765, 16.423432469632814], [94.99219919963343, 16.41798926988895], [94.99038480031834, 16.41337074036744], [94.98972492006908, 16.40990681984391], [94.98972492006908, 16.40611304957764], [94.9913744403782, 16.401329550218634], [94.99434335965839, 16.39671101979775], [94.9959928799675, 16.393412070011095]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
