
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Kone (1)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Kone (1)</div><div class="name-mm">စစ်ကုန်း (၁)</div></div>
        <span class="pcode-badge">MMR008014012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65763137938472, 18.254745903700552], [95.6552343264031, 18.257342711397087], [95.65466667342832, 18.261505498679867], [95.6556127611201, 18.268317332578874], [95.6556127611201, 18.275507602094194], [95.66116314386403, 18.280679550121192], [95.66397801017706, 18.280299834769608], [95.67040314189154, 18.274838473217017], [95.67425822163966, 18.276123499200196], [95.68100461007475, 18.276766011742097], [95.68742974268855, 18.276766011742097], [95.69417613202296, 18.276123499200196], [95.69128482243667, 18.270340880027618], [95.68935728211295, 18.268092083882607], [95.68518094564416, 18.268413339703898], [95.68261089367786, 18.266807057000108], [95.68068335425346, 18.262630721430696], [95.67747078794656, 18.261345695447517], [95.67233068221526, 18.260060667665755], [95.66911811590836, 18.257169358978786], [95.66654806304274, 18.254599306113164], [95.66172921403205, 18.255563076274996], [95.65763137938472, 18.254745903700552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
