
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (34) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (North)</div><div class="name-mm">ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (34) Ward</div><div class="name-mm">အမှတ် (၃၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013019701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1817516424839, 16.865703171565187], [96.18005911848788, 16.86408344044412], [96.17962044390114, 16.864371026370954], [96.17910923257173, 16.86502222507078], [96.17870509929105, 16.865637060362594], [96.17832514492461, 16.86641386553252], [96.17775175924433, 16.867584025590464], [96.17717146530282, 16.86860873607433], [96.17640119417811, 16.86998051721646], [96.17626302895395, 16.87011273655935], [96.17574145523271, 16.87083994129126], [96.17541331282531, 16.871340719286], [96.17635949469496, 16.871805508817204], [96.17778205759595, 16.872543335106855], [96.1782016749674, 16.87276267975392], [96.17914009144215, 16.873250961262897], [96.18052864108398, 16.873970032191266], [96.18231201198984, 16.874893188969565], [96.1828138687651, 16.875144846257683], [96.1838207254462, 16.873323440324555], [96.1840686802255, 16.8728733062581], [96.18483543410804, 16.87150764436234], [96.18553924533995, 16.87020301855449], [96.18676312731651, 16.86803966070181], [96.18578338699376, 16.86748123207326], [96.18438911406645, 16.866731643550565], [96.18341636687188, 16.86623954801678], [96.1817516424839, 16.865703171565187]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
