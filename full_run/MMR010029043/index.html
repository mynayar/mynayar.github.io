
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Ngan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Ngan</div><div class="name-mm">ရေငံ</div></div>
        <span class="pcode-badge">MMR010029043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7746063049371, 21.194441293131206], [95.77741245592017, 21.19470233034832], [95.77754671301045, 21.19441934337806], [95.7777156830324, 21.194063186666767], [95.77832603311998, 21.189924240411415], [95.78144645668868, 21.189016342430307], [95.78546333256679, 21.18924903931179], [95.788068771057, 21.189085006567836], [95.78899574275937, 21.186864852930682], [95.79084587124004, 21.1833019260431], [95.79368019078822, 21.18101310736904], [95.7951060748855, 21.17832908881644], [95.7953015254451, 21.17796143067551], [95.79594161431413, 21.175339254003404], [95.79613685623099, 21.174539566048168], [95.79651397434048, 21.171955201371475], [95.79678535466047, 21.170095443849732], [95.7968417934141, 21.167079505314973], [95.79684638984907, 21.166833877981162], [95.79732354224774, 21.16531883689487], [95.79486467256663, 21.16428954302802], [95.78520955107996, 21.16031390466304], [95.7704428944241, 21.155202368594473], [95.76919643586689, 21.159476454175092], [95.76748805582918, 21.166025241771536], [95.76720332597279, 21.17171984069813], [95.76919643586689, 21.176844979911948], [95.77118954486167, 21.17912281876312], [95.7746063049371, 21.188803636578598], [95.7746063049371, 21.194441293131206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
