
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Pin</div><div class="name-mm">ပေပင်</div></div>
        <span class="pcode-badge">MMR005034071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07496280119238, 25.123115192112493], [95.05830657358956, 25.108243561191443], [95.03629656043796, 25.094561659592955], [95.02439925462198, 25.07790543288945], [94.99644058766307, 25.08563868068063], [94.97968510638259, 25.090307649578392], [94.97593888507157, 25.091351546636645], [94.97420362969382, 25.09183508062455], [94.9650346871012, 25.094390035671665], [94.96289630522034, 25.09498590307703], [94.96118454283243, 25.09546289089974], [94.9160977200338, 25.108026480137994], [94.90979502561999, 25.10759864476171], [94.90832519525162, 25.107482910108274], [94.90580909001756, 25.106606086401825], [94.90582483984457, 25.1066578729625], [94.90801447858536, 25.111767032122884], [94.90801447858536, 25.116172818021198], [94.90496431904813, 25.119900792087947], [94.90564213267834, 25.125662206145932], [94.90937010494645, 25.1290512698003], [94.91513151810511, 25.124984391616408], [94.91948643295257, 25.12524698825797], [94.91951343599635, 25.12528749282359], [94.92360418488528, 25.131423616606696], [94.92902669212822, 25.1395573765717], [94.94054952024425, 25.150741296973308], [94.94359967978147, 25.150741296973308], [94.95139453293143, 25.15650271103135], [94.95311316524044, 25.159571696976286], [95.0624706307151, 25.14155601459845], [95.06972397508144, 25.140702680284505], [95.07496280119238, 25.123115192112493]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
