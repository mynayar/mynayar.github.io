
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Htauk Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Htauk Gar</div><div class="name-mm">အင်ထောက်ဂါး</div></div>
        <span class="pcode-badge">MMR001003018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.03234396660082, 25.78504037291492], [98.02575484441059, 25.77971838829302], [98.0185281811307, 25.777055932785117], [98.0004704797289, 25.80220335590019], [97.98549202283863, 25.81530950612887], [97.96208818462208, 25.82560719501606], [97.94991818907323, 25.83590488390331], [97.91528050728965, 25.855564107897294], [97.91996127529268, 25.894882556784637], [97.91996127529268, 25.913605627897482], [97.92089742907314, 25.931392546129132], [97.92089742907314, 25.946371002120088], [97.93681203884455, 25.936073313232896], [97.9668821143182, 25.931197084777693], [97.96864125928676, 25.913605627897482], [97.97800279529281, 25.895818710565095], [97.99672586640565, 25.878031794132028], [98.029491239729, 25.834968730122853], [98.04540585039973, 25.81530950612887], [98.05854808502619, 25.80987470515356], [98.05717989513613, 25.80303374760939], [98.05614447059088, 25.801480612140608], [98.05312504808256, 25.796951479727056], [98.0424810806374, 25.79061578469077], [98.03589195934649, 25.78554722812214], [98.03234396660082, 25.78504037291492]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
