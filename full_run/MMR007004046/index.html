
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Naw Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Naw Kyun</div><div class="name-mm">တနော်ကျွန်း</div></div>
        <span class="pcode-badge">MMR007004046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.84621012459763, 17.506754987952377], [96.8467177280408, 17.519275861192114], [96.8481534453253, 17.528375082943796], [96.84956810678278, 17.534033729672956], [96.85091565003728, 17.54211898740141], [96.85495827800219, 17.547509158620812], [96.85989926933587, 17.555594416349265], [96.8643910789852, 17.56278131160832], [96.86684622907029, 17.565696803065066], [96.87157797424419, 17.571315750121812], [96.87650843721468, 17.5742660993011], [96.87755394585798, 17.57149280684763], [96.87796191970688, 17.56877720230608], [96.87766817594564, 17.56666753038229], [96.87748490670316, 17.564893782222327], [96.86828500944569, 17.544991282621652], [96.86851393097322, 17.53468976801844], [96.87217669160111, 17.52965347282958], [96.87490297109531, 17.52817673656716], [96.87483003517804, 17.527536222318872], [96.87475012861563, 17.525526107144174], [96.87465480407599, 17.52351943367495], [96.87448659488052, 17.521013149936948], [96.87458962930799, 17.518873095317133], [96.87418559718765, 17.516351693975537], [96.87412816558242, 17.51352996673461], [96.8655729023676, 17.51339629060635], [96.85624668723489, 17.509138670713128], [96.84621012459763, 17.506754987952377]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
