
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Twin</div><div class="name-mm">တောတွင်</div></div>
        <span class="pcode-badge">MMR010006037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17208048892348, 21.858498056939823], [96.17152520612342, 21.864447518338352], [96.17089894702883, 21.87154512081071], [96.17051757422672, 21.87831448422611], [96.17044593872913, 21.879367714448506], [96.17776427530112, 21.878391934740023], [96.18090614500267, 21.878391995893935], [96.19327717590102, 21.879592171741365], [96.209058335274, 21.881123180290615], [96.20977173777555, 21.878392555272285], [96.21249151966794, 21.87023345960654], [96.21250634229392, 21.870188996225238], [96.21546073932171, 21.86402680469331], [96.21456607936113, 21.86089550022723], [96.2011783289168, 21.85651608784724], [96.19414704604941, 21.852609470650577], [96.19293295499193, 21.849654704001466], [96.19093923805548, 21.84931292385238], [96.18425914134633, 21.84701663990603], [96.17559589023818, 21.84628600459547], [96.17246459386598, 21.84931292385238], [96.17225584143398, 21.85661927965606], [96.17208048892348, 21.858498056939823]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
