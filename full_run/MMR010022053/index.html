
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Bi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Bi</div><div class="name-mm">တောင်ဘီ</div></div>
        <span class="pcode-badge">MMR010022053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.88904464699294, 21.181995550154568], [94.88904464699294, 21.177665748875256], [94.88904464699294, 21.174755335890097], [94.88445426265417, 21.170285752085817], [94.8803813760997, 21.163497607228862], [94.87678748015816, 21.158390491328134], [94.87246187421619, 21.161008621051053], [94.8637244371331, 21.162856924807272], [94.86306584111571, 21.160057891058898], [94.86260689729056, 21.157916151109532], [94.8521335294389, 21.15563619525426], [94.8515863711142, 21.157277666631046], [94.84310543506786, 21.15891913890721], [94.84067091902773, 21.15874524509701], [94.84346220961334, 21.167058693204183], [94.8482460219364, 21.181306574139114], [94.8506918748302, 21.188591184335735], [94.85082271539608, 21.188980872269497], [94.85382622799807, 21.197926391789622], [94.85633655059138, 21.200939027114487], [94.87524801528372, 21.20579298206053], [94.87759658941116, 21.206369389036126], [94.88403943237398, 21.190122219864577], [94.88904464699294, 21.181995550154568]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
