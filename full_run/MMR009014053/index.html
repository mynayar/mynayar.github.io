
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Lel</div><div class="name-mm">ကံလယ်</div></div>
        <span class="pcode-badge">MMR009014053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.82321437934019, 19.34166803315327], [94.82312440486743, 19.34146809137934], [94.82134892731119, 19.334662094080443], [94.81661431959526, 19.33229479067211], [94.80862467059211, 19.328152009707537], [94.79944877174347, 19.32655836427716], [94.78073218114531, 19.323501915780867], [94.77695203201074, 19.342402662353038], [94.77552358574496, 19.351259024884143], [94.77209531704528, 19.35840125261575], [94.76668511072933, 19.366130118010574], [94.77638065404403, 19.374399844677157], [94.7829670449932, 19.37779927301807], [94.78311844406102, 19.37530118839919], [94.78954173576255, 19.371630734970495], [94.80376473965106, 19.368877895798278], [94.81569371239499, 19.371171928741546], [94.81707013108172, 19.37759522134246], [94.81294087232345, 19.400076742747558], [94.8069763868508, 19.409252875419895], [94.80147070760711, 19.41980542587976], [94.80240107784755, 19.421356044146194], [94.80773693271334, 19.41633406256699], [94.82756309875805, 19.395916070670182], [94.8285769647552, 19.390293725075423], [94.83081814094453, 19.37786538218171], [94.83150440730259, 19.370850216964016], [94.83348135817818, 19.35064139208663], [94.83504270715525, 19.350619087101222], [94.8337772702049, 19.35034547916058], [94.83197291721643, 19.349677200142708], [94.82578762120181, 19.347386349900205], [94.82321437934019, 19.34166803315327]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
