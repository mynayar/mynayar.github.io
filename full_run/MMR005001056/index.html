
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Gyi Kone</div><div class="name-mm">ကန်ကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR005001056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.98902299991158, 22.04148987026133], [95.97992868036437, 22.04123003993442], [95.9664052797799, 22.04049897025135], [95.9554404000545, 22.039767989601103], [95.94082079964028, 22.03720955957357], [95.93058671980134, 22.03318908011198], [95.92218036003567, 22.033920059862908], [95.91450515988527, 22.033920059862908], [95.91377400026994, 22.034082509800044], [95.9112154803102, 22.034651130445354], [95.89696127983927, 22.040864460126784], [95.88563100017058, 22.04890541994922], [95.87759004034814, 22.054753349687417], [95.87522304540727, 22.060966771999006], [95.87466612044517, 22.062428729702162], [95.8808793601944, 22.06425617997877], [95.88636719958663, 22.065210539634734], [95.88672720000034, 22.063890690103335], [95.89842324024039, 22.060601190392674], [95.91304283975529, 22.058773740116067], [95.92510427993864, 22.06315971035241], [95.93533835977752, 22.064987159729696], [95.94593747983089, 22.06535264960513], [95.953247280038, 22.06425617997877], [95.96019204003068, 22.059504719866993], [95.97115656002728, 22.057311779714894], [95.98139063986622, 22.056580799964024], [95.98722263991294, 22.056580799964024], [95.98734535870142, 22.056016301810928], [95.98833504013004, 22.051463849976756], [95.98902299991158, 22.04148987026133]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
