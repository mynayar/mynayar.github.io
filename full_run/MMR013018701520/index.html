
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (66) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (66) Ward</div><div class="name-mm">အမှတ် (၆၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24805617315394, 16.84910178202165], [96.24785089480304, 16.848850727279284], [96.2475223535738, 16.848601341678602], [96.24726772312698, 16.84833590138078], [96.24714088544357, 16.847969055327667], [96.2470664980205, 16.84771156323808], [96.24695249726, 16.847354448748888], [96.24673080358377, 16.846723556347115], [96.2463798521485, 16.84555816717574], [96.24595069926539, 16.844190597817885], [96.24553298935604, 16.842821120997996], [96.24500083891763, 16.841150284058415], [96.24457931498347, 16.839797974397072], [96.24418417625878, 16.83858299301079], [96.24418631035002, 16.838163193976243], [96.24299049441584, 16.83849906917675], [96.24130058285567, 16.838689486230862], [96.24102210958273, 16.84066391001147], [96.24092292785087, 16.84161122617718], [96.24104262042067, 16.84333712590768], [96.24178886436465, 16.844209670639827], [96.24348258994962, 16.84616279577648], [96.24498748758253, 16.84790229775291], [96.24610519379974, 16.849173863582962], [96.24692175123789, 16.84918191701189], [96.24805617315394, 16.84910178202165]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
