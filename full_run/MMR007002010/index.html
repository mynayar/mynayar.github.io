
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Thea Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Thea Kone</div><div class="name-mm">ကသဲကုန်း</div></div>
        <span class="pcode-badge">MMR007002010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.62867053741542, 17.25252819372122], [96.62294990491426, 17.268959550343027], [96.6261145058798, 17.27966070387845], [96.62704023741708, 17.282746472072063], [96.62858312061456, 17.28706654718343], [96.63166888790892, 17.291695198574587], [96.63290319572599, 17.293855236130298], [96.63636771879527, 17.292844749785445], [96.63654947987465, 17.29438971221549], [96.64196910389109, 17.29438971221549], [96.65273835499113, 17.303301749975844], [96.65872380995592, 17.305945326016058], [96.66067510677084, 17.300335348797375], [96.6601790398309, 17.295292983184652], [96.65837249879183, 17.28987335916827], [96.65932656976543, 17.285421026159497], [96.6601790398309, 17.281563269129606], [96.65801119076389, 17.275782337085218], [96.659456423775, 17.268194863102508], [96.6619855808699, 17.262052623030172], [96.66219148784694, 17.257110858279532], [96.659456423775, 17.259162156108687], [96.65403679975856, 17.259523465035954], [96.65006240875323, 17.259884773063902], [96.6470006146867, 17.257294024999283], [96.64269171994698, 17.26114935206101], [96.63618817094738, 17.2597041190499], [96.62867053741542, 17.25252819372122]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
