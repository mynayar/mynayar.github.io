
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Ngoke To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Ngoke To</div><div class="name-mm">မကျီးငုတ္တို</div></div>
        <span class="pcode-badge">MMR010020072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02506807772966, 20.679718077427367], [95.0257955348361, 20.676323276997664], [95.02664231039438, 20.672936175664006], [95.03235804338902, 20.670819238117417], [95.03765038905425, 20.668278912341975], [95.04315442883387, 20.66637366711109], [95.04527136727984, 20.663621648120625], [95.04802338716962, 20.660657934116443], [95.050668357159, 20.657475060725517], [95.05307431522755, 20.652319437192318], [95.0534180226237, 20.6471638127598], [95.05651139818252, 20.642695605817607], [95.05994848023823, 20.638227397976095], [95.05114607882854, 20.640811142120583], [95.04039805982268, 20.64287240623662], [95.03156407152471, 20.645890685706604], [95.02110944734318, 20.648882354237287], [95.0104544919813, 20.6533505620788], [95.00220549288923, 20.658506184712678], [94.99654236663696, 20.662389471696827], [95.00040741806794, 20.666203715928816], [95.01756747735726, 20.662473269625764], [95.01794051883991, 20.674410701392787], [95.01383702835625, 20.680379417276356], [95.0135914423912, 20.686519045717432], [95.02506807772966, 20.679718077427367]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
