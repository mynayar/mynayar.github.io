
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ba Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ba Lar</div><div class="name-mm">ဘလား</div></div>
        <span class="pcode-badge">MMR008010008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64660025469806, 18.04650597467105], [95.64222437755302, 18.03840671000171], [95.6319703579457, 18.033425761789545], [95.62435303726289, 18.03254667898608], [95.62199346082963, 18.032546642113914], [95.62081516818552, 18.038241723077135], [95.61922645643585, 18.0432186126489], [95.61808526622212, 18.048424812255348], [95.61808526622212, 18.055810114145515], [95.62012259038528, 18.060648760831725], [95.6211412533662, 18.06599673855868], [95.61808526622212, 18.069562056743564], [95.61528394369913, 18.072108712846898], [95.62139591798729, 18.081276675178458], [95.62521590259189, 18.086879318425872], [95.6295452182373, 18.08942597362983], [95.6341291994031, 18.090699302131156], [95.63613519478349, 18.09026944597821], [95.63769451668867, 18.089935305569952], [95.6420238332334, 18.085605989924545], [95.64590173687571, 18.079074783174747], [95.64686247902023, 18.077456690573854], [95.64482515395775, 18.07389137238897], [95.64355182635575, 18.069562056743564], [95.64457048933667, 18.06090342635207], [95.64380649187615, 18.050462137317822], [95.64298165258128, 18.045283552294165], [95.64660025469806, 18.04650597467105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
