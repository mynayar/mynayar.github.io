
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Kone</div><div class="name-mm">သံကုန်း</div></div>
        <span class="pcode-badge">MMR010021024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66596221678293, 21.87992275083434], [95.66627270682, 21.87776594903937], [95.6674492979468, 21.87279812103651], [95.66849515642639, 21.867307364243516], [95.66914881786369, 21.859986353987097], [95.6699332119482, 21.853319006067352], [95.67065295017358, 21.83946517657671], [95.66977343839352, 21.835360784972295], [95.66596221678293, 21.835360784972295], [95.66156465518475, 21.835360784972295], [95.65892611714662, 21.835360784972295], [95.65570123822164, 21.84005151836294], [95.6554080673285, 21.8432763981873], [95.65159684661722, 21.84591493532605], [95.64485391787406, 21.84591493532605], [95.63693830465911, 21.846208106219194], [95.63136805858909, 21.846208106219194], [95.62579781431776, 21.846208106219194], [95.62345244717278, 21.846208106219194], [95.62198659270717, 21.851192009603608], [95.62022756824774, 21.85734859656054], [95.62022756824774, 21.862039330850507], [95.62052073914083, 21.86643689334801], [95.62286610538649, 21.868782259593672], [95.6246500806368, 21.870241876361547], [95.62609098521085, 21.871420796732423], [95.63136805858909, 21.871420796732423], [95.63342025484093, 21.872007139417974], [95.63811098823157, 21.872007139417974], [95.64280172162222, 21.872300310311118], [95.64866513768601, 21.872593480304943], [95.65335587197598, 21.875232018343013], [95.6612714842916, 21.87611153012307], [95.66596221678293, 21.87992275083434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
