
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat U Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tat U Chaung</div><div class="name-mm">တပ်ဦးချောင်း</div></div>
        <span class="pcode-badge">MMR012009066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.40014505415098, 20.78032110683364], [92.39767469473145, 20.779133434260643], [92.39258166041537, 20.77852712122973], [92.39093828067718, 20.790478973625795], [92.38906896965727, 20.794030664383683], [92.39129282940064, 20.794201729826], [92.39342011724466, 20.798101758589326], [92.39873833910315, 20.798633580775174], [92.4028156431275, 20.795619922021842], [92.40453886557623, 20.798894045124143], [92.40813386498593, 20.799874500407896], [92.4106980569698, 20.802703953724517], [92.41327481338197, 20.80554727009047], [92.41912485742631, 20.805724543552913], [92.42568399711882, 20.807674558833867], [92.43667498865983, 20.815651890722222], [92.44695688455266, 20.823629224409217], [92.44733065538549, 20.82398804401305], [92.4489068989343, 20.82433832095677], [92.45733468594705, 20.83015058807922], [92.46148681626363, 20.816284178871797], [92.46308349690594, 20.81229947264262], [92.46347350140104, 20.811950657097213], [92.46344337321318, 20.811929136320657], [92.46025244009809, 20.80909275102971], [92.44979326984361, 20.805369995728768], [92.43348405644412, 20.795088099835993], [92.42267033836549, 20.787997137957575], [92.41327481338197, 20.779665257345812], [92.40689294625253, 20.783565286109138], [92.40014505415098, 20.78032110683364]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
