
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar</div><div class="name-mm">ကံသာ</div></div>
        <span class="pcode-badge">MMR009007003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80287181088545, 20.261991201432863], [94.80322763125025, 20.26111351077992], [94.81143366433218, 20.26735351525258], [94.81454072937123, 20.264039312064654], [94.82117254417761, 20.256237176204763], [94.82156265119545, 20.25097073371245], [94.82117254417761, 20.244143864947432], [94.82445041835217, 20.23889926608831], [94.82354366161076, 20.23746938180659], [94.81592438939913, 20.23746938180659], [94.80525740560483, 20.235640756116027], [94.79398088111282, 20.232593047231376], [94.77834504408855, 20.23199166878055], [94.77843756364268, 20.232593047231376], [94.78057095968211, 20.23685984020949], [94.78300912786904, 20.23990754909414], [94.78453298231136, 20.24265048673061], [94.78593237058249, 20.24947250635114], [94.7893788397617, 20.250190519676778], [94.79445022919481, 20.252726214842994], [94.79835129667504, 20.25643222926402], [94.80147215101903, 20.259553082708635], [94.8024929669769, 20.261331278915463], [94.80287181088545, 20.261991201432863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
