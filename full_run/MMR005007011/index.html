
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kan Thar</div><div class="name-mm">ညောင်ကန်သာ</div></div>
        <span class="pcode-badge">MMR005007011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62418567972537, 23.475832469992554], [95.62769819961227, 23.459774850029362], [95.6469362396158, 23.45232788972038], [95.65934796034014, 23.444260290180296], [95.67159515998873, 23.43733794039366], [95.67113904003475, 23.436813329871313], [95.66403768019484, 23.42845862986195], [95.66277840000322, 23.429178180128986], [95.66105978927789, 23.428850825105542], [95.65306523986897, 23.427328049849677], [95.64791137181243, 23.423462648582415], [95.64196463985633, 23.419002600289843], [95.6405826300844, 23.418423041190465], [95.62762655961808, 23.41298978974703], [95.62105498679824, 23.408882644418554], [95.6208463198019, 23.40875223013137], [95.6121836397632, 23.421919320220525], [95.5966690799142, 23.437433880069534], [95.58838259977722, 23.44353992962408], [95.59339956044141, 23.45137938015432], [95.5921107600036, 23.456534490174647], [95.59488168004555, 23.457794040162867], [95.60216664007845, 23.465425679851307], [95.60494187956414, 23.47617942034401], [95.6094512403825, 23.47860762044536], [95.62159259971878, 23.475832469992554], [95.62418567972537, 23.475832469992554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
