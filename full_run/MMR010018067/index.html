
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Lu Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Lu Lin</div><div class="name-mm">တောင်လုင်</div></div>
        <span class="pcode-badge">MMR010018067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43962994986236, 21.103894671701767], [95.43576260965676, 21.10367981916835], [95.42184018797434, 21.095171672334857], [95.42880139926524, 21.086663524602045], [95.43112180302887, 21.075448240344087], [95.43205396022216, 21.07336881172131], [95.42577501780289, 21.072300055603137], [95.41931463356354, 21.07212060128478], [95.414087037287, 21.07250310813197], [95.41411043494867, 21.073017877373218], [95.40800896114467, 21.07840153030645], [95.40154857690538, 21.082887908050566], [95.39867729522103, 21.08773319712941], [95.39867729522103, 21.093475759598675], [95.39634437918983, 21.106037619440656], [95.39327642656588, 21.11310724490346], [95.39902288399895, 21.111801233240385], [95.40122851538376, 21.113098662673167], [95.4055973607297, 21.11566857164729], [95.41758611410796, 21.11760224175009], [95.42532079272047, 21.119922646413045], [95.4338289413526, 21.12456345394031], [95.43537587689525, 21.122243050176678], [95.43962994986236, 21.112187966901217], [95.43962994986236, 21.103894671701767]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
