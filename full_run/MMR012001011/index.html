
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zaw Pu Gyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zaw Pu Gyar</div><div class="name-mm">ဇောပူဂျာ</div></div>
        <span class="pcode-badge">MMR012001011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.79960473527035, 20.212585954678104], [92.80041817475899, 20.213810866378424], [92.8005900423966, 20.21406967057891], [92.80137682238251, 20.215051128606774], [92.80297561823028, 20.217045475968007], [92.80449573868742, 20.21735473843046], [92.80732042289924, 20.216640212675713], [92.8122097158058, 20.21500516695494], [92.81785902487417, 20.213473297754547], [92.82269421636505, 20.211479078097], [92.8240001120156, 20.20912240017867], [92.82530688270651, 20.205945542352936], [92.82585478387125, 20.201537663732267], [92.82597372101048, 20.199734722679352], [92.82189269019557, 20.200047132768987], [92.81841667379052, 20.200863746864457], [92.81667697306392, 20.20270732738129], [92.81439496495574, 20.20393518795862], [92.81211538231912, 20.203112595170182], [92.81026921805005, 20.203110611265743], [92.80961333528722, 20.203311062055946], [92.80592365255455, 20.204438642829132], [92.80320482034625, 20.207511259337195], [92.80179054289931, 20.20945757300865], [92.80139978207433, 20.211872639410842], [92.80105711339513, 20.21192674172579], [92.79997857175374, 20.212434292108924], [92.79960473527035, 20.212585954678104]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
