
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Khun Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Khun Taing</div><div class="name-mm">တံခွန်တိုင်</div></div>
        <span class="pcode-badge">MMR005021009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04674443680636, 24.218379494418173], [96.05912723983033, 24.220395269925802], [96.07260131979513, 24.221584170073413], [96.08369760036402, 24.222376710217077], [96.09201971973431, 24.220395269925802], [96.08250852035201, 24.210487890403897], [96.07894199977352, 24.20137305012622], [96.07458276008634, 24.19423974007202], [96.06931159615328, 24.19224372356905], [96.0557017554317, 24.189637583607634], [96.04565315986548, 24.187502700089567], [96.03970848016229, 24.19027676955733], [96.0361419595838, 24.183936089578935], [96.03178271989668, 24.181162020111174], [96.02630604019168, 24.17997141035238], [96.02630604019168, 24.190673849918312], [96.02410895956092, 24.19909667986792], [96.02314667957569, 24.201564479816966], [96.02544203991829, 24.204939749669734], [96.0290085595974, 24.212469329795795], [96.0341605201919, 24.216036030238683], [96.04208627955819, 24.217621199558778], [96.04674443680636, 24.218379494418173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
