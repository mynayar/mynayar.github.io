
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Pin Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Pin Seik</div><div class="name-mm">သဖန်းပင်ဆိပ်</div></div>
        <span class="pcode-badge">MMR008010040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74996538089766, 18.139598153232214], [95.74835275257755, 18.138062316222943], [95.74616680375505, 18.13879096493116], [95.74300932272212, 18.139519615437962], [95.74325220622438, 18.145348811398605], [95.74179490790874, 18.146806109714248], [95.73645147805331, 18.148020525426944], [95.73572282934515, 18.15142088996214], [95.73669436065626, 18.153121071780106], [95.73888031037808, 18.155549903205497], [95.73912319298103, 18.158950267740693], [95.74155202440647, 18.158950267740693], [95.74179490790874, 18.162836398381103], [95.74398085583186, 18.16599387941403], [95.74859563607981, 18.16745117772973], [95.74873782788853, 18.168715364622415], [95.75175311711274, 18.16453658019907], [95.75126735100753, 18.16137909916614], [95.75223888321796, 18.15749296942505], [95.7544248320404, 18.15676431891825], [95.75733942957106, 18.15457837099507], [95.7570965460688, 18.14826340892921], [95.7544248320404, 18.1443772782888], [95.75345329893065, 18.142919979073838], [95.74996538089766, 18.139598153232214]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
