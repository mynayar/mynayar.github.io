
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mandalay Palace</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aungmyaythazan</div><div class="name-mm">အောင်မြေသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Mandalay Palace</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR010001701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08582592395999, 22.003843740442832], [96.08719377117818, 22.003770471904225], [96.0915224307996, 22.003538607877033], [96.10787786188436, 22.00266253157411], [96.10787641368776, 22.00263840632504], [96.1072773466921, 21.99265865599446], [96.10688286921271, 21.9860871259588], [96.10663326607337, 21.981929031738176], [96.10158005960427, 21.982185220247466], [96.10082795401883, 21.98222536629556], [96.09587803631088, 21.982489584030688], [96.09311326383613, 21.98263716262987], [96.09093142154538, 21.982770202741783], [96.08446824345437, 21.983164301774593], [96.08444974671923, 21.983165519356696], [96.08444379664148, 21.983165911031666], [96.08480412399875, 21.98855672237452], [96.08511255541954, 21.99317112527256], [96.08542171922292, 21.997796485252568], [96.08582592395999, 22.003843740442832]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
