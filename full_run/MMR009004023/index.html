
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Kone</div><div class="name-mm">အင်ကုန်း</div></div>
        <span class="pcode-badge">MMR009004023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48164588015328, 19.973725559686898], [95.48771299895577, 19.97688551655341], [95.4873842086144, 19.977597894727126], [95.49400475941218, 19.975210156023934], [95.49947259968081, 19.97657711744006], [95.49973931881459, 19.97664379587451], [95.50380129929061, 19.97664379587451], [95.50640084991937, 19.978871983155557], [95.50881903876768, 19.980944716325666], [95.5177106960918, 19.982084671770224], [95.51837839144969, 19.98014228633747], [95.51899878516588, 19.973628148720138], [95.51869620826346, 19.973309216746998], [95.51758384761655, 19.96838305073726], [95.51504131130753, 19.95471691425422], [95.51522506888188, 19.954366104012536], [95.51138641435159, 19.95312782928596], [95.49915045442998, 19.948996206209983], [95.49174393303616, 19.945755852650507], [95.49152284280501, 19.94565912606788], [95.49143847470589, 19.946086992021094], [95.48929812330982, 19.956941633749466], [95.48663849527043, 19.958341438406705], [95.48627885998144, 19.958530719617045], [95.48389523118004, 19.963774703339936], [95.4824650537193, 19.97044886272488], [95.48164588015328, 19.973725559686898]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
