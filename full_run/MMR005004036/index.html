
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Cho Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Cho Pin</div><div class="name-mm">သစ်ချိုပင်</div></div>
        <span class="pcode-badge">MMR005004036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.77762740018443, 22.533845219980947], [95.77740131961525, 22.52955104984113], [95.77936944004767, 22.51931615971307], [95.78527451990323, 22.50750663042669], [95.78271672030047, 22.50214191002118], [95.78156186758616, 22.501057102803088], [95.78126581526521, 22.50077956212715], [95.77816123685164, 22.501188811214718], [95.77658387904285, 22.49862560578714], [95.77612143685491, 22.496775833437994], [95.77433195955234, 22.495934339598136], [95.77298376608798, 22.495300549580747], [95.77206215974093, 22.494867300285705], [95.76817884038121, 22.493947950337713], [95.76664588390048, 22.493940227859298], [95.76024923641319, 22.493910096074103], [95.75700192030246, 22.493894580070844], [95.75579893767087, 22.494526962649275], [95.75443296011309, 22.49524511986641], [95.75530668025914, 22.4975741400346], [95.75530668025914, 22.501435319884138], [95.75518211965914, 22.505794740335034], [95.7555557996605, 22.51227150032952], [95.75642772026316, 22.5183746702549], [95.75829575964167, 22.52273399987422], [95.75914067989851, 22.523578830198915], [95.76240623965629, 22.526844300024493], [95.7661426799408, 22.529335410400904], [95.7700040396548, 22.531701870245172], [95.77779515971889, 22.537030499957666], [95.77762740018443, 22.533845219980947]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
