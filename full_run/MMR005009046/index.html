
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Ohn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Ohn</div><div class="name-mm">ကွမ်းအုံ</div></div>
        <span class="pcode-badge">MMR005009046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.29594883956736, 22.774481640215583], [95.28750360031097, 22.777478370130723], [95.27956704008687, 22.779920429684125], [95.27315651965773, 22.78205720987239], [95.27283395981942, 22.782330180193696], [95.26918824044498, 22.78541502028702], [95.26705164012117, 22.787373779676216], [95.26705164012117, 22.793351670443315], [95.26726439993217, 22.798248300019054], [95.27224104039175, 22.798540979882375], [95.2752934797104, 22.801288319700234], [95.27956704008687, 22.805561880076766], [95.28475644035751, 22.80922487992433], [95.29055603962956, 22.809835439553922], [95.29452431974164, 22.810140719818435], [95.29449443976665, 22.810592880057413], [95.30062955990633, 22.808919689592074], [95.30215596032934, 22.801898790297003], [95.30215596032934, 22.796098920328973], [95.30215596032934, 22.794013080439356], [95.30215596032934, 22.790299140293143], [95.30200908035482, 22.78968758961065], [95.30032427964187, 22.78266777040136], [95.29971372001222, 22.775952149572106], [95.29696656005876, 22.774120559716096], [95.29594883956736, 22.774481640215583]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
