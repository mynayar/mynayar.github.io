
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Kun (Nawng Kawn)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Kun (Nawng Kawn)</div><div class="name-mm">နောင်ကွမ် (နောင်ကောန်)</div></div>
        <span class="pcode-badge">MMR001012018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.37827654922341, 24.498574853946423], [97.38166191126822, 24.497446399931448], [97.386928028206, 24.500831761976258], [97.3899372380132, 24.495941794578187], [97.39219414514372, 24.495189492800876], [97.39858871699573, 24.49707024859316], [97.4042309852718, 24.493308737008647], [97.40881224778707, 24.490351409989614], [97.40648789330169, 24.483528804011144], [97.400093322349, 24.478262687073425], [97.39106569202812, 24.471491963883068], [97.38241421304554, 24.47186811612073], [97.37526733941627, 24.469987359429126], [97.36623970999466, 24.46773045229861], [97.35834053278944, 24.462840485799802], [97.35307441585167, 24.457198216624477], [97.34517524044503, 24.463968938915457], [97.33953297126965, 24.469987359429126], [97.34329448375348, 24.472620417898042], [97.34592754222234, 24.47638193128114], [97.35307441585167, 24.47976729242663], [97.36285434794985, 24.487290317394297], [97.3730104322857, 24.492556434332016], [97.37827654922341, 24.498574853946423]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
