
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Kan Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Kan Lel</div><div class="name-mm">နတ်ကန်လည်</div></div>
        <span class="pcode-badge">MMR010020023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30202706769506, 20.891161228807732], [95.29554836876224, 20.898044845693107], [95.29392869515323, 20.903713706922076], [95.28502048400821, 20.912216999215218], [95.27975654073185, 20.919910453804448], [95.27661781595953, 20.924095420167532], [95.28198321805115, 20.928602358212288], [95.28974898532749, 20.92887014304273], [95.29805032136528, 20.926995648330546], [95.30608387167342, 20.9280667876522], [95.3107026494078, 20.92981873714507], [95.31343331939223, 20.92333339581961], [95.31962006691259, 20.919552604569105], [95.32026808960069, 20.918950869986702], [95.31652669315241, 20.919208897172894], [95.31205848621022, 20.919208897172894], [95.3106836530282, 20.9147406902307], [95.3106836530282, 20.91164731467188], [95.31033994383341, 20.905460567151522], [95.3075902783687, 20.90099236020933], [95.3065591525829, 20.895149319185805], [95.30827769495971, 20.89239965282178], [95.308807806635, 20.891983136312717], [95.30202706769506, 20.891161228807732]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
