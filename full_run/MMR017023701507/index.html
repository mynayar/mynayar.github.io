
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (7) Ward (Shwe Gu Chaung Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (7) Ward (Shwe Gu Chaung Ward)</div><div class="name-mm">ရပ်ကွက် (၇)ရွှေဂူချောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67842375455268, 16.290356155012603], [95.67524654149474, 16.28948220913668], [95.67299093838113, 16.288944334513474], [95.67290445417729, 16.289134436804886], [95.67279396976596, 16.28926169627033], [95.67271408118995, 16.28948847831066], [95.67264269120727, 16.289664682479156], [95.67254585310872, 16.289774882704705], [95.67179111236999, 16.291121627361235], [95.67173502075468, 16.29127988375967], [95.67162283662469, 16.291555608704414], [95.67144266194936, 16.291846016880243], [95.67140504510678, 16.291940946617444], [95.67177666476135, 16.292028337337968], [95.67199423414667, 16.292224117948706], [95.67252795749931, 16.29225022167043], [95.67270133329993, 16.292436213160784], [95.67286450988928, 16.292494946984277], [95.67347302356126, 16.292543891687274], [95.67371098957057, 16.292847349925296], [95.67391835974456, 16.29292239924939], [95.67408044095964, 16.29291498883572], [95.67419117088588, 16.292578153159297], [95.67489742107915, 16.29278535336141], [95.67747595455171, 16.293490159243504], [95.67842375455268, 16.290356155012603]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
