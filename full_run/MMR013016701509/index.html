
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pazundaung</div><div class="name-mm">ပုဇွန်တောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward</div><div class="name-mm">အမှတ် (၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013016701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17283162158213, 16.779521075237483], [96.17280260765426, 16.77924442309171], [96.17076162864629, 16.77914480698729], [96.17072181655863, 16.77884864764701], [96.1704502114082, 16.778852462571137], [96.17014980367054, 16.77885150928978], [96.16934013324061, 16.77889061001372], [96.16852378894174, 16.778921127607987], [96.16787338305022, 16.778959274151248], [96.16744110862032, 16.77899117939944], [96.16746388934706, 16.779315801383177], [96.16813087424049, 16.7794885638462], [96.16857973756487, 16.77953847262245], [96.16892115258918, 16.779485066382733], [96.16925048881905, 16.779571532600187], [96.16956075042833, 16.779703140287722], [96.16987800606518, 16.779939652093333], [96.17036247265003, 16.780282974579677], [96.17077827419803, 16.780586624373257], [96.1712404888575, 16.780805587707732], [96.17134098090162, 16.780706800778262], [96.17154026077446, 16.780510902356298], [96.17181205658119, 16.780260085934287], [96.17219123863481, 16.77991142237431], [96.17248032300859, 16.77968788059127], [96.17283162158213, 16.779521075237483]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
