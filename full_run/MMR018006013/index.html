
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyu Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyu Twin</div><div class="name-mm">ပြူတွင်း</div></div>
        <span class="pcode-badge">MMR018006013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15659167396666, 19.669199151020052], [96.16307649638327, 19.673228659674976], [96.17051019439003, 19.684516867259674], [96.1756036531861, 19.690298632076235], [96.17835687367085, 19.697044024062507], [96.17838158614137, 19.697624758575785], [96.17863219571933, 19.703514094000298], [96.18026960216048, 19.703363039372846], [96.18158247115417, 19.70222919841882], [96.18209888975201, 19.701801817200135], [96.18252627007138, 19.70157031911498], [96.18309611109669, 19.701374436880826], [96.18371937454958, 19.701107323843985], [96.18412150190585, 19.70085097659137], [96.18362178191978, 19.698852098445627], [96.18490521160629, 19.68576111258534], [96.18490521160629, 19.68247363275202], [96.18672115505734, 19.68003026828228], [96.18490521160629, 19.67979595262119], [96.17366837419615, 19.678346038638836], [96.171957825893, 19.67475389187865], [96.16777356729636, 19.67455652036716], [96.16627355208283, 19.67120121906106], [96.15659167396666, 19.669199151020052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
