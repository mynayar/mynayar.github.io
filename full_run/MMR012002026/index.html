
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo</div><div class="name-mm">မြို့</div></div>
        <span class="pcode-badge">MMR012002026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.947336517966, 20.538392449851756], [92.94924319311895, 20.535288194294765], [92.95263059032953, 20.531442649158976], [92.9560178175683, 20.527597035674717], [92.96140026181268, 20.509210122149454], [92.96435048958347, 20.501591348162265], [92.9683743936634, 20.491198567659808], [92.97793498740981, 20.475438670058622], [92.95941878195129, 20.470932078252872], [92.94866063567986, 20.490255684252475], [92.94730631243641, 20.490111709987502], [92.93969387956895, 20.505263605630944], [92.93899696613715, 20.50498191008711], [92.93830005540332, 20.504700211845375], [92.93690623933156, 20.504136806368592], [92.92605493408797, 20.499347832836293], [92.91520430423532, 20.494558181215154], [92.91220279892008, 20.5071247678938], [92.9115950379807, 20.509669059679425], [92.91081266827007, 20.512944193619717], [92.91064229890304, 20.524211628663807], [92.91060555710084, 20.526641404377358], [92.91039840276414, 20.54033859175263], [92.91876044663735, 20.54822334023504], [92.93588790909979, 20.558362749341484], [92.94186866240892, 20.547294461969898], [92.94319319381088, 20.545138190774935], [92.947336517966, 20.538392449851756]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
