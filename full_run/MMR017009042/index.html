
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da Nu Bay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da Nu Bay</div><div class="name-mm">ဓနုဘေး</div></div>
        <span class="pcode-badge">MMR017009042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58021203955406, 17.420895179768763], [95.58026171990252, 17.42154291017721], [95.57916587980156, 17.424631799917677], [95.57727263962067, 17.42373504004013], [95.5723625948579, 17.422677475085436], [95.57079587962619, 17.42234003956122], [95.5683046802169, 17.421941430352774], [95.56681816382724, 17.423990495165242], [95.56461792028085, 17.42702318986835], [95.56073208012145, 17.431507080087727], [95.56053264016924, 17.433499949862835], [95.5598353202439, 17.435592450131537], [95.55933709223308, 17.436688476392135], [95.55883883994056, 17.4377845799944], [95.5623261599244, 17.438980229553977], [95.56430687716073, 17.439346993768822], [95.56770707981792, 17.43997661992512], [95.57458235998797, 17.44186986010601], [95.57796996044539, 17.442866249577833], [95.58215496008341, 17.443962360374655], [95.58434735974294, 17.443165230091324], [95.58922968020562, 17.439478470155336], [95.59172087961497, 17.437286340292417], [95.590425239833, 17.43519384002377], [95.58977760025613, 17.43414759033908], [95.58912995977988, 17.43310133975507], [95.58836748037498, 17.432102159686963], [95.58624024019497, 17.429314950224807], [95.5838491200409, 17.425827450376573], [95.58145764015802, 17.422937909756797], [95.58021203955406, 17.420895179768763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
