
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Se</div><div class="name-mm">လွယ်စဲ</div></div>
        <span class="pcode-badge">MMR015004023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.54273497983553, 22.397038861054625], [98.54271884240069, 22.365048914675697], [98.52525610098832, 22.360264602329607], [98.50694120427323, 22.35713179059968], [98.50131983264424, 22.3562702787504], [98.49561488521886, 22.332069300358], [98.49151813155657, 22.319056084270926], [98.49079517555697, 22.31230848984501], [98.48790334975985, 22.30628385321728], [98.48067378526702, 22.30001822975754], [98.47440816180728, 22.294716549129475], [98.46875105381815, 22.285508318753955], [98.46641505940755, 22.287908036426813], [98.45139307712884, 22.31795200098412], [98.43583459618975, 22.352287960221247], [98.43154260061061, 22.36140844914064], [98.43016770807333, 22.361997689441864], [98.43261559883086, 22.364090945141072], [98.45622157136847, 22.380722426099112], [98.47204830208756, 22.39440315857894], [98.49324002660597, 22.407279144417032], [98.49967801862573, 22.409425140857593], [98.50665251110456, 22.413180636876916], [98.51292000875145, 22.41774415217094], [98.5197967449239, 22.41479013465704], [98.53159973074304, 22.40647439507734], [98.54273497983553, 22.397038861054625]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
