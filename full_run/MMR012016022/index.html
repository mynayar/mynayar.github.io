
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Auk Kaing Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Toungup</div><div class="name-mm">တောင်ကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Auk Kaing Shey</div><div class="name-mm">အောက်ကိုင်းရှည်</div></div>
        <span class="pcode-badge">MMR012016022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.23326911128049, 18.92094478427441], [94.24029723572892, 18.919716122401155], [94.24472625561225, 18.920201175344005], [94.25727216597772, 18.920127198011812], [94.26343743768768, 18.91887068233615], [94.29117160058894, 18.918876840893518], [94.29117443075546, 18.918852468366765], [94.29468900469385, 18.888581935807736], [94.29199848314352, 18.86014592039794], [94.28555619236442, 18.862541130668717], [94.26850987123362, 18.864570455362298], [94.25051634994963, 18.866712540651292], [94.25106168804655, 18.86882825961652], [94.25106168804655, 18.870017990737722], [94.25078564474177, 18.872434930427744], [94.25122763274913, 18.87386916742821], [94.25111288195399, 18.87489177393627], [94.23347404609041, 18.87983387683198], [94.22831975805047, 18.88045587314008], [94.22807842767736, 18.880894931156206], [94.23003266167808, 18.884033609163794], [94.23069767705618, 18.89952452044031], [94.23106004898216, 18.911340559918983], [94.23326911128049, 18.92094478427441]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
