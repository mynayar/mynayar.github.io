
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Yat Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Yat Gyi</div><div class="name-mm">ဇရပ်ကြီး</div></div>
        <span class="pcode-badge">MMR007014013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.59800803084602, 18.715619377232542], [96.59804767386112, 18.715558745839473], [96.59703824242104, 18.71351754290032], [96.59317353543037, 18.7067543047674], [96.59202409933278, 18.70158184322753], [96.59124118103574, 18.698058714038496], [96.58855235740543, 18.69787945936963], [96.58641029729745, 18.697736655122583], [96.584595475301, 18.697671840083387], [96.58288318501104, 18.697610686184248], [96.58064421306005, 18.69753072296453], [96.57739264585399, 18.697414596206727], [96.5677308783774, 18.69838077295435], [96.55774705018626, 18.69966900771857], [96.5515055960065, 18.69944024087448], [96.54647498723091, 18.6990248898868], [96.54067792584567, 18.698702831870264], [96.53552498319146, 18.701601362113195], [96.53262645204916, 18.707720482414402], [96.53005803235237, 18.712696292799706], [96.53294851096507, 18.713678572807964], [96.53874557235036, 18.715288867387358], [96.5448646917522, 18.71496680937082], [96.55452646102742, 18.714322690639733], [96.56138750942608, 18.715346121826087], [96.56738910092633, 18.716164521075825], [96.57642647000563, 18.71464474955559], [96.58512206073459, 18.714322690639733], [96.5944617710939, 18.714322690639733], [96.59800803084602, 18.715619377232542]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
