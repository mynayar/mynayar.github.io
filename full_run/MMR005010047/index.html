
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tet Khaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tet Khaung</div><div class="name-mm">တက်ခေါင်း</div></div>
        <span class="pcode-badge">MMR005010047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35827636026585, 22.59570312010294], [95.3640748803515, 22.597717319998367], [95.37188723970439, 22.597717319998367], [95.37792984028994, 22.593505859607774], [95.3798828404208, 22.584472649892916], [95.3798828404208, 22.57348635011499], [95.3804930403216, 22.567321799661386], [95.38409412004768, 22.554687510220447], [95.37432875966459, 22.554077129555935], [95.36029056016127, 22.550903279962426], [95.34900275996944, 22.549578750359103], [95.33532707988087, 22.5587158200791], [95.32507319966851, 22.5603026999097], [95.32128924010641, 22.567321799661386], [95.33288591964953, 22.57269290975006], [95.3385008404415, 22.576477050075823], [95.33868408000637, 22.58532711015806], [95.34307860009739, 22.587524369753908], [95.3571167996007, 22.595275889970424], [95.35816764032438, 22.5956446201032], [95.35827636026585, 22.59570312010294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
