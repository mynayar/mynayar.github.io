
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Bo</div><div class="name-mm">နောင်ဘို</div></div>
        <span class="pcode-badge">MMR007003058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.69729170984459, 17.093144596745788], [96.69799097860084, 17.090487298849837], [96.70072649323316, 17.083990446202165], [96.704813505439, 17.07813531739106], [96.70920381310555, 17.074809325889703], [96.7115985260512, 17.074410206765663], [96.7130619622398, 17.07254765235234], [96.71106636841824, 17.06908862234212], [96.71000205135363, 17.066161749964863], [96.70960293222959, 17.063767037019204], [96.70867165457327, 17.062303600830546], [96.70614390221937, 17.059376729352607], [96.70627694072829, 17.056982016407005], [96.70667605985233, 17.056050737851308], [96.69867491571483, 17.044667382893465], [96.6949135803975, 17.041931865563186], [96.68841672864914, 17.045693201779898], [96.68191987780017, 17.05116423733972], [96.67862173830264, 17.053880353595503], [96.67610690560929, 17.055951392442864], [96.66995199498865, 17.060054667988595], [96.66413902279771, 17.06366368603034], [96.66413902459635, 17.07065479798058], [96.66261119515059, 17.075020014562085], [96.6682421976194, 17.07783553108493], [96.6791842777323, 17.083306565745488], [96.69046829897286, 17.08877760130531], [96.69520930626453, 17.09181185723145], [96.69729170984459, 17.093144596745788]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
