
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thar Yar</div><div class="name-mm">ရွာသာယာ</div></div>
        <span class="pcode-badge">MMR009007066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97559929297307, 20.03793828332516], [94.97073172229119, 20.036478011850818], [94.95223495208143, 20.030636925953445], [94.95208619791975, 20.029707212218113], [94.95150481589462, 20.03015016879533], [94.94201305176097, 20.02868989822025], [94.93081763802365, 20.03355746890213], [94.91019053756332, 20.03355746890213], [94.910130461052, 20.03355746890213], [94.90456447956711, 20.04468943097254], [94.90453275418332, 20.0447528826395], [94.92546331018366, 20.05351451058624], [94.92716695978743, 20.057408567851155], [94.92205601007686, 20.062519517561725], [94.92619344637052, 20.07833912385155], [94.91769564803576, 20.085380157168572], [94.91767519565383, 20.085397102194577], [94.93008750273611, 20.089777916617606], [94.93398156000103, 20.090021294747032], [94.9475316902354, 20.08478601826016], [94.93860575165417, 20.072011281695325], [94.95053130157834, 20.06884735971795], [94.96221347337314, 20.06203276130293], [94.96829793739994, 20.05351451058624], [94.97340888621119, 20.04304923303573], [94.97559929297307, 20.03793828332516]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
