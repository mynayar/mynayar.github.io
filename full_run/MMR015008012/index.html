
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Hkun (a) Nam Kun Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Hkun (a) Nam Kun Long</div><div class="name-mm">ပန်ခွန် (ခေါ်) နမ့်ကွန်လုံ</div></div>
        <span class="pcode-badge">MMR015008012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.67544024856869, 23.04149266065781], [98.67727463261826, 23.040033314585855], [98.69482001093479, 23.009032844590138], [98.7017767930646, 22.98845236408539], [98.72293700623788, 22.976567861017998], [98.72580757655845, 22.97265344579995], [98.72206740768479, 22.96990094477286], [98.69395041328102, 22.970480677441344], [98.65936303507607, 22.979378042762505], [98.62322312574673, 22.990191560292317], [98.60757036617952, 23.00207606335971], [98.60436935076501, 23.00367656971798], [98.60690962977566, 23.004660291339405], [98.60989176908993, 23.005815123369302], [98.61026306588786, 23.00594448904701], [98.61521281661823, 23.007669052384927], [98.61533615503959, 23.007807734139647], [98.62298069010683, 23.016403308565884], [98.62906295798916, 23.020965008128655], [98.63185066387712, 23.025019851584943], [98.64233223714308, 23.026563669178017], [98.65161803494442, 23.029581553845674], [98.65580303907905, 23.033274205240446], [98.65610581383231, 23.03340092061603], [98.66099486392187, 23.03388982535523], [98.67037169200006, 23.039211809977076], [98.67544024856869, 23.04149266065781]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
