
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Naung Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Naung Taw</div><div class="name-mm">ထနောင်းတော</div></div>
        <span class="pcode-badge">MMR009007014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75165676934449, 20.25960349510524], [94.7525320336265, 20.25971766044171], [94.75740836910103, 20.261851055581815], [94.7598014650656, 20.264244152445713], [94.76304663089735, 20.263649205046818], [94.76772791331263, 20.265014579159526], [94.7716045992729, 20.267599035567116], [94.77201908781069, 20.26677005939075], [94.77455478207759, 20.262478883993367], [94.77845584955787, 20.258382762554504], [94.78060143680693, 20.25545696216909], [94.78274702495531, 20.251750947748064], [94.78469755914512, 20.249215252581905], [94.78593237058249, 20.24947250635114], [94.78453298231136, 20.24265048673061], [94.78300912786904, 20.23990754909414], [94.78057095968211, 20.23685984020949], [94.77843756364268, 20.232593047231376], [94.77834504408855, 20.23199166878055], [94.77813279329382, 20.231983504735013], [94.77499404334048, 20.231735709135705], [94.7665514966543, 20.23106919188973], [94.75843143336402, 20.22776101775679], [94.75832268194625, 20.227716711756898], [94.75679882660461, 20.24021232034238], [94.75576367994995, 20.244352909659085], [94.7552749730616, 20.246307739011], [94.7534463473711, 20.250879303237298], [94.75165676934449, 20.25960349510524]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
