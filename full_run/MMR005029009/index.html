
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar Pin</div><div class="name-mm">ကြာပင်</div></div>
        <span class="pcode-badge">MMR005029009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.39171055959469, 22.830666300309588], [94.39317720006778, 22.82724395994086], [94.39872228040895, 22.81813397959951], [94.39188516027201, 22.81561496955527], [94.37379552034707, 22.81303080003147], [94.35247595989767, 22.80657024042432], [94.30919028040717, 22.787188649736436], [94.27624163964003, 22.77491364035228], [94.25014020040999, 22.760728020381862], [94.24278337465307, 22.758874535631378], [94.2365085403369, 22.76315283363641], [94.23223024233187, 22.76486415175924], [94.22766672164192, 22.772279868721], [94.2311649539995, 22.77794838640898], [94.23110740818038, 22.77828658455826], [94.2555679201235, 22.785896520008464], [94.29626916029355, 22.801401809645824], [94.31306676042271, 22.813676819929356], [94.32081935982563, 22.82078340033371], [94.33438631997274, 22.82078340033371], [94.35699827994671, 22.82595183021283], [94.37379552034707, 22.82595183021283], [94.39171055959469, 22.830666300309588]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
