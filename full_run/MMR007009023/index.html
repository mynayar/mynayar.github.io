
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Tat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Tat</div><div class="name-mm">ဆူးတပ်</div></div>
        <span class="pcode-badge">MMR007009023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3590521440413, 18.985344549811202], [96.36203331568504, 18.987207783212682], [96.36710574473437, 18.987449326725084], [96.37145353964917, 18.986966238800903], [96.37604288077438, 18.987449326725084], [96.38302005772954, 18.986283013949958], [96.38594619356206, 18.983826164146194], [96.38763700264559, 18.981169177415666], [96.38971428278796, 18.979128129159903], [96.38956935704027, 18.974405939282747], [96.3874242140563, 18.97150740903976], [96.38304766331908, 18.97150740903976], [96.37869986660564, 18.970541232292078], [96.37507670402675, 18.969333511132675], [96.37121199613676, 18.970299687880356], [96.36686420032265, 18.970782775804537], [96.36188838903797, 18.971629347216663], [96.36140530111379, 18.979116052164102], [96.36043912436617, 18.983705392389993], [96.3590521440413, 18.985344549811202]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
