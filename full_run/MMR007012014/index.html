
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wea Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wea Gyi</div><div class="name-mm">ဝဲကြီး</div></div>
        <span class="pcode-badge">MMR007012014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57017395866131, 18.55673971266765], [96.56907109575451, 18.5556369891558], [96.56603776792872, 18.55173699456668], [96.56430443710013, 18.54675367124497], [96.56365443860153, 18.543287009587857], [96.56300444010287, 18.540253681762067], [96.55910444731245, 18.536353688971644], [96.55585445212131, 18.533103693780504], [96.5521767573515, 18.53115668043648], [96.55022112940168, 18.534837024609033], [96.5495711300037, 18.54047034822804], [96.54805446564114, 18.54480367395047], [96.5450211378153, 18.54783700177626], [96.54285447495414, 18.551953661931975], [96.5415544770575, 18.554553656825874], [96.54523780428133, 18.56192031127341], [96.54805446564114, 18.569503631287603], [96.55043779496833, 18.574920289339957], [96.55167948891733, 18.581475963944627], [96.55215262224579, 18.58012134572357], [96.55461787801272, 18.573775886747853], [96.5573509437911, 18.57113715895275], [96.56115084203776, 18.567468423229172], [96.56257000819937, 18.562498101406277], [96.5639895952437, 18.56114336627337], [96.56398956736473, 18.560917664318822], [96.56398948192913, 18.560239469376086], [96.57017395866131, 18.55673971266765]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
