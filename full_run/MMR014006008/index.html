
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pu Htoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pu Htoe</div><div class="name-mm">ရွှေပုထိုး</div></div>
        <span class="pcode-badge">MMR014006008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65804286218838, 20.96822536520847], [96.66247930777388, 20.97987103801802], [96.66310623776275, 20.993976949276828], [96.66310623776275, 20.999932776976152], [96.66310623776275, 21.004366063243253], [96.66436009594173, 21.004007818306206], [96.67094285362987, 21.003380889216714], [96.6713140631935, 21.003950074636293], [96.67156978361868, 21.0036943533118], [96.6803467953684, 20.99961931288101], [96.68786994714043, 20.99303655519293], [96.6928853807558, 20.98519993842649], [96.69331400663617, 20.983271122864096], [96.68881034122433, 20.97673639167118], [96.68924436933224, 20.976519378066882], [96.68818341123551, 20.975795997587284], [96.68777388515673, 20.975522979601863], [96.67971986537952, 20.970153633983045], [96.66655434910399, 20.967959380820844], [96.65804286218838, 20.96822536520847]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
