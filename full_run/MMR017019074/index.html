
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Le Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Le Gyi</div><div class="name-mm">ရေလဲကြီး</div></div>
        <span class="pcode-badge">MMR017019074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58916811981294, 16.83143361027294], [95.58757476036698, 16.827511139827266], [95.58671652025129, 16.81917606032698], [95.58500076037683, 16.812924659645375], [95.58414252026114, 16.81084088999512], [95.58305388013252, 16.809587280029007], [95.5800975603542, 16.806183030422574], [95.57813628016527, 16.802015490222743], [95.57791703983958, 16.801181729653138], [95.57752356036406, 16.79968655998681], [95.57789111957959, 16.793680319890882], [95.5781758800129, 16.79067053991355], [95.57655300032076, 16.790726699877325], [95.57019251996888, 16.790881769977773], [95.56659144024286, 16.79250051009052], [95.56158851979438, 16.799992920337047], [95.56109531989318, 16.802785620160307], [95.56342739955488, 16.80250571966326], [95.56592076003511, 16.802677709608645], [95.57053667972406, 16.80299603993535], [95.57127215968251, 16.807041089774543], [95.57176247995454, 16.816356809818956], [95.57053667972406, 16.822240379689845], [95.57127215968251, 16.82444672963294], [95.5738461596726, 16.829472330084002], [95.57948483965367, 16.833517379923194], [95.58279431960221, 16.832781899964743], [95.58659411982285, 16.832536740278385], [95.58916811981294, 16.83143361027294]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
