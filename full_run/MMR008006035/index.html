
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Kyun</div><div class="name-mm">ဇီးကျွန်း</div></div>
        <span class="pcode-badge">MMR008006035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14849615517346, 18.523134954414672], [95.15473962473396, 18.51093180895589], [95.15672618306695, 18.501850399176647], [95.15583978787595, 18.489972952190044], [95.15345573819184, 18.492215616757335], [95.14775271531562, 18.494882623734156], [95.14538359527677, 18.49531747562105], [95.13921901334686, 18.496629546916097], [95.13587725043482, 18.500219128809817], [95.13159734893856, 18.502446867329127], [95.1301743489671, 18.50288589117099], [95.12969370360162, 18.503786107143185], [95.13175230482506, 18.506107310404104], [95.13203609938654, 18.511499397179477], [95.1314685111629, 18.517175277617014], [95.12891436460632, 18.523986336300425], [95.12752960470755, 18.525477614600277], [95.12721159993544, 18.52966221673796], [95.1294819528299, 18.532783952417503], [95.13430645228101, 18.533067746079666], [95.1428202738366, 18.53335153974183], [95.14480683216965, 18.53335153974183], [95.14622580317831, 18.5268242756199], [95.14849615517346, 18.523134954414672]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
