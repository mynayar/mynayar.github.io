
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Kyun</div><div class="name-mm">ဇီးကျွန်း</div></div>
        <span class="pcode-badge">MMR005012018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.20753932028344, 22.136659470158463], [95.20949592040046, 22.137984810050966], [95.21330580022254, 22.137984810050966], [95.21796275957377, 22.137561449701195], [95.22410111997078, 22.13629136955109], [95.22621791992111, 22.13502138023256], [95.22685295999617, 22.13290467021443], [95.2283347198715, 22.130364509914273], [95.22952452024049, 22.127552730074456], [95.22902556018153, 22.127430329646074], [95.22759672001268, 22.122518849565324], [95.22723924039866, 22.116892949849785], [95.2285788003714, 22.11135633033041], [95.22895500027312, 22.111383239844713], [95.22621791992111, 22.104540360449334], [95.22555642359015, 22.102820524847402], [95.22515952039561, 22.101788610356152], [95.22561815755199, 22.101750390068503], [95.22579455957134, 22.101735689750342], [95.22346607989573, 22.1011535702811], [95.22291060014413, 22.101375780168155], [95.2202912401487, 22.10242355959963], [95.21140067999744, 22.107292109643197], [95.20526231960042, 22.10708042991797], [95.20350479970682, 22.107861539678368], [95.19954695982437, 22.109620500285928], [95.19256187962708, 22.112160569754565], [95.18572152013212, 22.11846074966394], [95.18451839990428, 22.119569190166033], [95.19044507967675, 22.126342769603184], [95.19891191974938, 22.1305761896395], [95.20293383992481, 22.133539620357226], [95.20753932028344, 22.136659470158463]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
