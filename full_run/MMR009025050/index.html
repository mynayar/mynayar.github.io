
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan</div><div class="name-mm">လက်ပန်း</div></div>
        <span class="pcode-badge">MMR009025050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.25507248270895, 21.356835149422636], [94.2547273148138, 21.35664928923336], [94.23264689373923, 21.36037369658885], [94.215621026789, 21.36303398922729], [94.20764015157181, 21.362235902065265], [94.2044478020245, 21.361969871812164], [94.2044315180002, 21.36263753569375], [94.20418177267072, 21.37287706812225], [94.20125545157788, 21.378463680954155], [94.20484413504886, 21.386922717609366], [94.20817221027932, 21.385380438756272], [94.21056647266465, 21.38405029378606], [94.2172172020123, 21.379527798369224], [94.22386793136002, 21.375803389215093], [94.2286564570299, 21.37660147727638], [94.2496727606894, 21.38032588463193], [94.25209571684394, 21.380799941564078], [94.25206702307469, 21.38059191398571], [94.25259908178225, 21.375005302053125], [94.25392922765178, 21.36782251399785], [94.2547273148138, 21.357181347041603], [94.25546680305058, 21.357047473961813], [94.25507248270895, 21.356835149422636]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
