
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Kyaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Kyaing</div><div class="name-mm">ကွန်ကြိုင်း</div></div>
        <span class="pcode-badge">MMR015001056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.95160646116932, 23.130973990157543], [97.95812010236091, 23.131372944705674], [97.97188973102635, 23.13693998289392], [97.98653829140909, 23.14221405163721], [97.98708240642799, 23.142422118785817], [97.99649930559855, 23.14602309059319], [97.99684977769516, 23.14631165156152], [97.99789034906041, 23.140561850449103], [98.00050386436192, 23.129734431199097], [97.99975714557587, 23.121520527250595], [98.00125058314796, 23.112186543774044], [98.00433088975882, 23.106342077325053], [97.99453011587224, 23.100239046794627], [97.98444941540828, 23.09239850178949], [97.97959574374863, 23.086424753299752], [97.9717551987435, 23.07933092708066], [97.96279457600895, 23.072610459804935], [97.96167449827954, 23.06775678904461], [97.95532738994717, 23.056182651008612], [97.94898028161475, 23.05058226236156], [97.94449997069717, 23.044981871915923], [97.94326643989433, 23.044288546779057], [97.94092952817522, 23.049741342289167], [97.93950706869634, 23.06169000209195], [97.93751562524596, 23.075345612010437], [97.94092952817522, 23.09526004381604], [97.94576588968414, 23.110622605648757], [97.94946428504875, 23.125131691974047], [97.95160646116932, 23.130973990157543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
