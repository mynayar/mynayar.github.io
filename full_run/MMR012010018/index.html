
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mee Chaung Zay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mee Chaung Zay</div><div class="name-mm">မီးချောင်းဈေး</div></div>
        <span class="pcode-badge">MMR012010018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.5316804919612, 20.932925382200665], [92.53195784288022, 20.943121400931943], [92.53087211205838, 20.95322474722434], [92.52880933708133, 20.95842065678795], [92.51579243467319, 20.959652552623254], [92.51460047503195, 20.960745845844144], [92.51071449098106, 20.964310603751414], [92.50602595103686, 20.968610593404208], [92.5179089954039, 20.97999611123157], [92.51886453137308, 20.979384904090125], [92.5207458033762, 20.97378979626211], [92.52212226972705, 20.97064342995037], [92.52345185981551, 20.96923301329298], [92.52733568279558, 20.971883058156664], [92.54049320589678, 20.975185953269204], [92.54322331200632, 20.976126696290066], [92.54749191891699, 20.96120360436288], [92.54901324986167, 20.95094016255848], [92.55127884174522, 20.94091200318644], [92.55128996456028, 20.93717839756505], [92.54136160385497, 20.934818485684616], [92.5316804919612, 20.932925382200665]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
