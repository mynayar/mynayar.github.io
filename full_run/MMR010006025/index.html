
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mon Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mon Taw</div><div class="name-mm">မုံတော</div></div>
        <span class="pcode-badge">MMR010006025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18467088964991, 21.792678946276396], [96.1846597650362, 21.79327586139192], [96.18448045820662, 21.796102470152903], [96.18007902592637, 21.79956756788897], [96.17166627288026, 21.79956756788897], [96.17001915016368, 21.803529738906377], [96.16860266308248, 21.80881483603588], [96.1712120756768, 21.81361615636058], [96.17705716085936, 21.817791215792], [96.18185848118401, 21.81956561685979], [96.18749481303524, 21.82238378278538], [96.19542742793351, 21.82478444294776], [96.2008550055541, 21.823427547643234], [96.20324095910303, 21.82318283491992], [96.20332479120623, 21.812186700156133], [96.201110906743, 21.803552555606018], [96.19491203816011, 21.799788955795748], [96.19383449206822, 21.79116859875188], [96.19358370712246, 21.789162322783], [96.19004149791687, 21.78539872297273], [96.1847281782629, 21.789605098596496], [96.18467088964991, 21.792678946276396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
