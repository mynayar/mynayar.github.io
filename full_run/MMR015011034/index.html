
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ho Maw Lawt Khum</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ho Maw Lawt Khum</div><div class="name-mm">ဟိုမောလော့ခွမ်</div></div>
        <span class="pcode-badge">MMR015011034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.75796576021173, 23.605107441155553], [97.75797870775125, 23.605288704909867], [97.75147800780388, 23.60996920941153], [97.74757758693613, 23.61490974119164], [97.74601741876893, 23.622450553850058], [97.74185697062273, 23.626611001996196], [97.73301601887425, 23.63129150559854], [97.72672052533204, 23.6333900043453], [97.72929455230178, 23.636768727594756], [97.72900147943477, 23.640577538122955], [97.72441312936252, 23.6459755523299], [97.72521805856661, 23.647482674885566], [97.72989568343911, 23.645072990925826], [97.73509624159834, 23.643772850936386], [97.74419722332328, 23.641952654591364], [97.75433831506126, 23.64325279458086], [97.76343929588688, 23.64767327090476], [97.76803469934197, 23.652026810688824], [97.76837982766699, 23.652353775406482], [97.77540058396983, 23.64767327090476], [97.77748080759324, 23.637532178267463], [97.77852092030429, 23.62765111380793], [97.77826098925328, 23.62672278772652], [97.77670072395932, 23.621150413860562], [97.76655963222129, 23.606068789443157], [97.76115466355697, 23.603953801626687], [97.7613590713641, 23.604508621275897], [97.75796576021173, 23.605107441155553]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
