
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Su</div><div class="name-mm">ရုံးစု</div></div>
        <span class="pcode-badge">MMR005005017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47229016006287, 22.70532230987675], [95.47113023966887, 22.693481459901477], [95.47851563958517, 22.688903790177847], [95.49407952005384, 22.688903790177847], [95.50250243993571, 22.687316910347192], [95.50140269857576, 22.68251822233816], [95.49843853311188, 22.68185951840212], [95.49050484082579, 22.68022611214542], [95.48560461755909, 22.677659327416052], [95.48537127316581, 22.674625858396723], [95.49087649285593, 22.67169730878385], [95.49407417538293, 22.671293086007154], [95.49428382264034, 22.671266583885767], [95.49444866837143, 22.671237138283345], [95.49672120032318, 22.670831699623307], [95.49730260033482, 22.670299979960134], [95.49770096222966, 22.669934663653862], [95.49773223975114, 22.66541865594627], [95.49676668533431, 22.664510372155974], [95.48506545510674, 22.665007643288163], [95.47827308793273, 22.66529629958461], [95.47453337861259, 22.66570631219662], [95.4743854284448, 22.665722533268365], [95.47207067242363, 22.66459207106726], [95.47020827988825, 22.666939199984142], [95.47019162084666, 22.666970749100813], [95.47018199989941, 22.66698897026481], [95.4650879997115, 22.67669681990236], [95.4577025997952, 22.679504370230575], [95.45867927972506, 22.692871080136285], [95.4487303200483, 22.697326620127455], [95.46392808021676, 22.701904289851143], [95.47229016006287, 22.70532230987675]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
