
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Gwa</div><div class="name-mm">ချောင်းခွ</div></div>
        <span class="pcode-badge">MMR008012008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41558651290728, 18.440595600606514], [95.4189010974078, 18.44061464015357], [95.42033173891866, 18.438817527606886], [95.4227007303545, 18.438378927345696], [95.42318159695321, 18.4370250762463], [95.42507750812058, 18.436585932794628], [95.42556142162238, 18.435232079896593], [95.42698481459757, 18.43433584792109], [95.43266835366165, 18.433916219757805], [95.43314559329457, 18.433015859894056], [95.43506377707172, 18.432823625310107], [95.43359358877314, 18.42674350590812], [95.42880403517813, 18.418840741307235], [95.42497239086322, 18.41117745357667], [95.42211266906446, 18.405656794325637], [95.42087119994596, 18.40704431784104], [95.4192884839764, 18.40704431784104], [95.41421564573551, 18.405564739721], [95.41295761919883, 18.405197815426902], [95.40820947039083, 18.402559954578294], [95.40116396564457, 18.408788338011448], [95.40847325593609, 18.41654061455779], [95.40847325593609, 18.425773126628542], [95.41111111588538, 18.4363245691236], [95.41558651290728, 18.440595600606514]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
