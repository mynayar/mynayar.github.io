
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Bon Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Bon Thar</div><div class="name-mm">ရွှေဘုံသာ</div></div>
        <span class="pcode-badge">MMR005003035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.32652363975421, 21.72383289027573], [95.32935791973227, 21.72517550974203], [95.3348446799381, 21.73294845001101], [95.34193163983338, 21.738892410256597], [95.349247559927, 21.740264100308025], [95.35450571966328, 21.737749319775332], [95.35530167992863, 21.737016900209824], [95.36022071971053, 21.732491160039046], [95.36519844025588, 21.727845360375113], [95.36410728022685, 21.725861400183533], [95.3599921201403, 21.72334661965084], [95.35450571966328, 21.718774350356057], [95.35016196000652, 21.713973479692356], [95.34856176031707, 21.71358720018918], [95.343532200151, 21.712373190070707], [95.33598767958779, 21.711687299629205], [95.32867212012229, 21.710544299979517], [95.32867212012229, 21.71534516974384], [95.32752911957328, 21.720146040407485], [95.32652363975421, 21.72383289027573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
