
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Zauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Zauk</div><div class="name-mm">အိုင်ဇောက်</div></div>
        <span class="pcode-badge">MMR009006011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27368235955333, 20.379012730752947], [95.27660464358951, 20.387779582861526], [95.27603938640863, 20.389692762810796], [95.27858246321017, 20.38926294712735], [95.27907691766569, 20.39816313542042], [95.29341611036529, 20.402613229117264], [95.30132738794867, 20.405579957648968], [95.3042941173797, 20.410524506700654], [95.31368876012823, 20.412996780776837], [95.31813885382508, 20.419919150348562], [95.31881547585357, 20.42634706276681], [95.3230834019775, 20.42634706276681], [95.33050022600469, 20.42783042793195], [95.33396140989123, 20.431291611818494], [95.34766541232898, 20.438310734952495], [95.34780614633667, 20.43722507068054], [95.35594072738274, 20.427734726576432], [95.35324514984387, 20.41695242091754], [95.35472851500901, 20.40854668797931], [95.36066197297174, 20.40112986395212], [95.36481539381543, 20.40182210090927], [95.36343730059099, 20.400444008584202], [95.36214533813688, 20.399152045230778], [95.36282996772889, 20.395386582924516], [95.36313424794724, 20.393713040824252], [95.3661790493237, 20.386318523581053], [95.36659543183379, 20.385307307886023], [95.35423405965417, 20.38135166864464], [95.29737174870729, 20.378879394568457], [95.274132368614, 20.378879394568457], [95.27368235955333, 20.379012730752947]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
