
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hlaw Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hlaw Kar</div><div class="name-mm">လှော်ကား</div></div>
        <span class="pcode-badge">MMR005019024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76938547985606, 21.900133979599502], [94.77295631987835, 21.903228720329253], [94.77903888004033, 21.904387289941553], [94.78483128023947, 21.901780530347253], [94.78876644011916, 21.901780530347253], [94.79415095999889, 21.89888117992257], [94.79871252016676, 21.89725199958019], [94.80294828023898, 21.895134120443345], [94.8060522003488, 21.894189479760712], [94.8066955195826, 21.8939936397947], [94.80571812019514, 21.886010730311], [94.80425184035022, 21.878353530091374], [94.80213396031405, 21.866786369895124], [94.80157344076173, 21.866883845613017], [94.79838672007111, 21.867438060018515], [94.79480256019008, 21.8684155502375], [94.78616795968367, 21.870207630178015], [94.78222451974585, 21.871193399555807], [94.78222451974585, 21.87194841009108], [94.77440459979249, 21.87339660007308], [94.76948087993873, 21.873686220442778], [94.76397792024488, 21.8754240298951], [94.75763435973795, 21.87770769005789], [94.75818516031694, 21.882664799940642], [94.76079191991124, 21.887878230096305], [94.7660054399991, 21.889616040447947], [94.77034992001285, 21.89193308974035], [94.77034992001285, 21.89627756975409], [94.76938547985606, 21.900133979599502]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
