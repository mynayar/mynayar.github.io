
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hpat Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hpat Kar</div><div class="name-mm">နမ့်ဖတ်ကာ</div></div>
        <span class="pcode-badge">MMR015011020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.799185491917, 23.629746526980682], [97.7947688628928, 23.63041318811821], [97.78115990440614, 23.627872848852917], [97.77826098925328, 23.62672278772652], [97.77852092030429, 23.62765111380793], [97.77748080759324, 23.637532178267463], [97.77540058396983, 23.64767327090476], [97.76837982766699, 23.652353775406482], [97.76803469934197, 23.652026810688824], [97.76796619528375, 23.65235790779127], [97.76755094502016, 23.654364955378412], [97.76773239763213, 23.660897255703844], [97.77245017003935, 23.668155367376357], [97.77395255586583, 23.668155367376357], [97.77934537558866, 23.668155367376357], [97.79095835444457, 23.668699726111527], [97.80420440770729, 23.66706665080534], [97.82380130868353, 23.663256142357113], [97.8345155752337, 23.660445842801437], [97.83160377819189, 23.657631105990788], [97.82017225284727, 23.645836675422288], [97.8069261995845, 23.636038223585217], [97.80106774867772, 23.62946241226058], [97.799185491917, 23.629746526980682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
