
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Gyi</div><div class="name-mm">လက်ပံကြီး</div></div>
        <span class="pcode-badge">MMR005005038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61907943976439, 22.729675319560386], [95.6259154798156, 22.723083539873528], [95.6301271200706, 22.722717329641114], [95.62660559976865, 22.717467090234095], [95.61598524042654, 22.715635950039086], [95.60780675987411, 22.711058370247656], [95.60780675987411, 22.708067670286823], [95.60632175974149, 22.705657919777252], [95.60644272035535, 22.707601379899813], [95.60547071959809, 22.70714391006345], [95.60499372008417, 22.70578959041734], [95.60450483962671, 22.70623571980269], [95.60159100022452, 22.705316549719043], [95.60081411997572, 22.704223230417824], [95.60076120476583, 22.704148887061535], [95.60072880039388, 22.70410334988975], [95.6006258397108, 22.70395845022233], [95.60162159965716, 22.70034980989584], [95.60358144003152, 22.698556200208543], [95.60395944037595, 22.69751912990398], [95.60407456888629, 22.697202885105128], [95.59784303692669, 22.699826999816253], [95.59737634993866, 22.705660596159646], [95.59737634993866, 22.710327474133692], [95.5993006796827, 22.712979869825176], [95.60351556019498, 22.72930911022729], [95.61907943976439, 22.729675319560386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
