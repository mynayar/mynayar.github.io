
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ga Mone Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ga Mone Aing</div><div class="name-mm">ဂမုန်းအိုင်</div></div>
        <span class="pcode-badge">MMR007011007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.80350259496885, 18.275704782050127], [96.80437500120541, 18.270034145559407], [96.80477154826838, 18.267060041687614], [96.80524740564334, 18.263491104630816], [96.8045688689582, 18.259419879124152], [96.80437500120541, 18.258256671708068], [96.79914056828267, 18.25869287527604], [96.7921613237861, 18.25869287527604], [96.78736309443133, 18.260001483281883], [96.78256486327786, 18.259129077045316], [96.77917343530584, 18.259296255617755], [96.77549837914694, 18.265017814420673], [96.77113635066212, 18.26894363933752], [96.768044510246, 18.267655372197737], [96.76284849905903, 18.273087565139065], [96.76153989105319, 18.27919440429838], [96.7654657159701, 18.287046053232814], [96.77113635066212, 18.294461500397972], [96.77549837914694, 18.300132135989315], [96.77506217557902, 18.3084199875924], [96.77820283569235, 18.3084199875924], [96.7834372686151, 18.3084199875924], [96.79085271578026, 18.307983784923806], [96.79251993384793, 18.30776148870177], [96.79616376824339, 18.30131470580909], [96.8002537410174, 18.28904478658768], [96.80350259496885, 18.275704782050127]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
