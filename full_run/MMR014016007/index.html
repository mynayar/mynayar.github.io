
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hkay Ong Awayt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongkaing</div><div class="name-mm">မိုင်းကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hkay Ong Awayt</div><div class="name-mm">ခေးအုံအွေ့</div></div>
        <span class="pcode-badge">MMR014016007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.46107791331508, 21.740631669416075], [97.46028867098545, 21.740169009592194], [97.44106793124007, 21.749779379914514], [97.42328874717799, 21.755545601748167], [97.41175630261131, 21.765155972070488], [97.40887319214414, 21.774285822932427], [97.41271733973349, 21.786779303721914], [97.42232771005581, 21.79446759979993], [97.44299000458511, 21.805519524906174], [97.4564445233961, 21.803116933000126], [97.45666170157631, 21.803105501717596], [97.46509385569692, 21.78533774893799], [97.47710681882467, 21.763714416387245], [97.47710681882467, 21.75698715743141], [97.47849978233916, 21.756889973993168], [97.4742237083575, 21.74833782423127], [97.46107791331508, 21.740631669416075]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
