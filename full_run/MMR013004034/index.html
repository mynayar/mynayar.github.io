
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon Sun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon Sun</div><div class="name-mm">ဝါးရုံစွန်း</div></div>
        <span class="pcode-badge">MMR013004034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.33564569869009, 17.088016758666527], [96.34033375030242, 17.090360784023005], [96.34472879739616, 17.089481774064666], [96.34736582457322, 17.086258739649168], [96.35029585716813, 17.08303570523367], [96.35293288524451, 17.08039867715729], [96.35469090426187, 17.08010567443739], [96.35937895407551, 17.079226663579732], [96.36406700478852, 17.078640658139932], [96.36406700478852, 17.077175641842473], [96.36494601384754, 17.074831617385257], [96.36494601384754, 17.07190158479034], [96.366411030145, 17.066041523197782], [96.36875505460216, 17.061060468865605], [96.36318799483018, 17.058716444408446], [96.35820694229659, 17.056079415432748], [96.35176087166695, 17.052856381017193], [96.35000285444823, 17.049633345702375], [96.34677981913342, 17.0437732832105], [96.3432637810987, 17.03849922615842], [96.34209176931978, 17.03908523339686], [96.34158071697658, 17.039153373229624], [96.33769672132667, 17.03967123883666], [96.33007863891811, 17.04142925785402], [96.32964945365944, 17.041448765947848], [96.32346919025099, 17.041729687175348], [96.32568359182437, 17.0443592886503], [96.32890662713919, 17.049340342982475], [96.33037164343665, 17.053735390076213], [96.33037164343665, 17.056372419051968], [96.32626959816349, 17.064576506900323], [96.32187455106975, 17.0733666010878], [96.32158154834985, 17.075710626444277], [96.33066464615655, 17.08332870795357], [96.33564569869009, 17.088016758666527]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
