
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Hpyu</div><div class="name-mm">လင်းဖြူ</div></div>
        <span class="pcode-badge">MMR005009037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21323269523276, 22.770431165665798], [95.20969507796553, 22.772161476570943], [95.20395852026957, 22.772630299448792], [95.19976775237996, 22.772686930657358], [95.19945983979983, 22.7747879097343], [95.19945623981368, 22.774855140352486], [95.199331680113, 22.77709263022075], [95.199331680113, 22.78255256994521], [95.199331680113, 22.791224340331098], [95.19960419987399, 22.796130419982944], [95.19965280013668, 22.79700549001143], [95.20607627979655, 22.80118076977675], [95.21121528026106, 22.802786639691703], [95.21119404007294, 22.803274799792234], [95.21924436003923, 22.80085955982088], [95.22727380044557, 22.80085955982088], [95.2353032399526, 22.79668428005556], [95.23947851971798, 22.792830210246052], [95.24204783963614, 22.790903130375227], [95.24146031973805, 22.790488409812326], [95.23658807977614, 22.7870490596664], [95.2320916799871, 22.784800859771906], [95.23273392003443, 22.780625580006586], [95.23144908021095, 22.774844430326254], [95.22470447962809, 22.774523220370384], [95.21763875992087, 22.774523220370384], [95.2133061599514, 22.770500130176913], [95.21323269523276, 22.770431165665798]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
