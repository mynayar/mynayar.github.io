
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Boet Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Boet Shey</div><div class="name-mm">တောင်ဘို့ရှည်</div></div>
        <span class="pcode-badge">MMR008007045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.86421308716427, 17.57446121531291], [95.85943643884065, 17.57468322914775], [95.85497856241079, 17.570951199138563], [95.85126278944625, 17.5704326176712], [95.85068782858048, 17.569828859614233], [95.84768680170458, 17.57076668163711], [95.84622268472918, 17.568091137396095], [95.84560503124726, 17.567527695946467], [95.84494209330302, 17.566923141090115], [95.84491197320904, 17.566749376782354], [95.8446442261502, 17.56520664017438], [95.84364843202957, 17.56330733586492], [95.83809126300144, 17.563521073238974], [95.83260809918448, 17.56195445423475], [95.83236684255581, 17.559602192886928], [95.83191872656806, 17.55938530518773], [95.83109033315242, 17.56692945792821], [95.8305303082272, 17.576169855254648], [95.83068080167772, 17.58257750774584], [95.83130976593299, 17.587609225385506], [95.8379138951102, 17.59075404756129], [95.8422343982989, 17.594619760893295], [95.84609043492571, 17.59358438760944], [95.84609043492571, 17.591068529688926], [95.84546146977107, 17.585093365666353], [95.84766284736259, 17.58037613105364], [95.85929869238083, 17.5769168258509], [95.86433040912112, 17.5769168258509], [95.86421308716427, 17.57446121531291]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
