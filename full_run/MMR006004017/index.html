
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mu Du</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yebyu</div><div class="name-mm">ရေဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mu Du</div><div class="name-mm">မူးဒူး</div></div>
        <span class="pcode-badge">MMR006004017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.12375677635418, 14.210956502140903], [98.11623552574895, 14.212254464871705], [98.10810266420663, 14.21420632286356], [98.09931918093554, 14.215507516858452], [98.09346348285351, 14.219411377633037], [98.08533063839832, 14.220061923818776], [98.08328184068444, 14.21925697842687], [98.0821802979824, 14.2198885093473], [98.08065599657704, 14.219291376595777], [98.07749200625113, 14.220827897089805], [98.0761949680234, 14.228792987406507], [98.0783063999205, 14.235958530062135], [98.08034508026128, 14.244113339559021], [98.08095852041941, 14.245954470322602], [98.08768404008646, 14.245744410276359], [98.09828459995441, 14.246560080083668], [98.10766224012036, 14.247783360413791], [98.1154090802649, 14.249006730676115], [98.12682496280183, 14.251861106005265], [98.1272329168657, 14.237182493877015], [98.12713632158403, 14.236055262940056], [98.12601000255961, 14.222911545331613], [98.12437919984023, 14.213941200026397], [98.12375677635418, 14.210956502140903]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
