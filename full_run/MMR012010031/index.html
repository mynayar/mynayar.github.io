
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kin Ma Nu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kin Ma Nu</div><div class="name-mm">သရက်ကင်းမနု</div></div>
        <span class="pcode-badge">MMR012010031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.57141743766465, 20.89385762742762], [92.58049212321299, 20.893391348731825], [92.58251513466581, 20.89328768208094], [92.58540591455136, 20.89286023970834], [92.58892180869458, 20.891302512301138], [92.59287142877349, 20.889022190421827], [92.59614159755677, 20.88431908235981], [92.5961659242181, 20.87521830298232], [92.59618026480746, 20.869851172393737], [92.59494450458527, 20.86774805562834], [92.59395548235966, 20.86622890374099], [92.59097874976953, 20.865288395443145], [92.58514217127424, 20.86609108893265], [92.58216356359765, 20.865850487909768], [92.57607671636742, 20.866089497132634], [92.57393112462177, 20.865206018443075], [92.5721817220089, 20.86248472479025], [92.57124496478338, 20.863956645183066], [92.56874898277937, 20.868617465323837], [92.56799615669735, 20.871415819184733], [92.56811262789552, 20.874099687550597], [92.56834857402754, 20.87854013871646], [92.56846605966098, 20.880751175926093], [92.57006835297216, 20.88483890758954], [92.57141513629955, 20.891492878093914], [92.57141743766465, 20.89385762742762]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
