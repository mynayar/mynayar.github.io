
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pon Nar Kone Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pon Nar Kone Ward</div><div class="name-mm">ပုဏ္ဏားကုန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17490450493904, 16.797347640980888], [96.17465639097969, 16.797000884883005], [96.17384834292676, 16.795666121894044], [96.17335319509391, 16.795942306392362], [96.17306327884728, 16.796115876446606], [96.17278099065027, 16.796279907391863], [96.17228611980863, 16.796505147994253], [96.1725769048004, 16.7970485687365], [96.17274908540202, 16.797396400423565], [96.17282167957688, 16.79775428743045], [96.17284914757016, 16.797944387023904], [96.17288589476829, 16.79819870001006], [96.17291235731949, 16.798338571567854], [96.1729526523431, 16.798551559806697], [96.1730689247911, 16.79900772292814], [96.17371265681373, 16.79894799355509], [96.17411136674622, 16.798860549774588], [96.17452888510002, 16.79872245797509], [96.17472267191386, 16.797772090409694], [96.17490450493904, 16.797347640980888]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
