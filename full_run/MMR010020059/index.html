
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Lu</div><div class="name-mm">ရွာလု</div></div>
        <span class="pcode-badge">MMR010020059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15824904106046, 20.795645779329277], [95.15824904106046, 20.78739678113658], [95.15481195900475, 20.78224115670406], [95.15309341662794, 20.77880407464835], [95.15103116775424, 20.7812100327169], [95.14243846216533, 20.7812100327169], [95.13762654602834, 20.78224115670406], [95.13418946307331, 20.783272281590598], [95.1334412109432, 20.783671350352563], [95.12903384043943, 20.786021947954566], [95.12800271465363, 20.794958362738328], [95.12869013124464, 20.798051737397827], [95.13006496442665, 20.803207360931026], [95.13384575477784, 20.8087066927597], [95.13543925811535, 20.80959197279134], [95.14003250409684, 20.81214377571473], [95.14759408479921, 20.81317489970189], [95.14930597758888, 20.81329615079676], [95.15308424174441, 20.81175848456644], [95.15457359009918, 20.810115433980172], [95.15444617505102, 20.807409087059796], [95.15444617505102, 20.80577643443496], [95.15653049958297, 20.802176236044488], [95.15824904106046, 20.795645779329277]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
