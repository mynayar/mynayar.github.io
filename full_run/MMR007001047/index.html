
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Paung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Paung</div><div class="name-mm">ကွမ်ပေါင်</div></div>
        <span class="pcode-badge">MMR007001047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.48546031574102, 17.207070479718936], [96.48955579956055, 17.206576933578674], [96.49251722928676, 17.204924044409154], [96.4925172670583, 17.202153599209282], [96.49218723835043, 17.201676589802844], [96.49027109963163, 17.200034185829054], [96.48870448062735, 17.198467566824775], [96.49164189126031, 17.191613609580486], [96.4914965626163, 17.19017503784778], [96.49144836704858, 17.18969794840166], [96.49112925521104, 17.186539110291733], [96.49110898359277, 17.186338446362242], [96.48687844138703, 17.185434428056453], [96.48640643311046, 17.184079779258468], [96.48617177660628, 17.18396714097082], [96.48546745366014, 17.18362905883407], [96.4854674608547, 17.18333453086393], [96.48380879893699, 17.182018072675987], [96.48165469870543, 17.180843109322097], [96.48219630191784, 17.180039440967448], [96.48189193356592, 17.180129195106304], [96.47511200761312, 17.182627062089296], [96.47011627274787, 17.183697577281407], [96.47297097812822, 17.18922856884342], [96.47689619870067, 17.193153790315193], [96.47760987459611, 17.197792686783146], [96.48260561036068, 17.19993371626805], [96.48546031574102, 17.207070479718936]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
