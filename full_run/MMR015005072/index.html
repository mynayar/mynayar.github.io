
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Long</div><div class="name-mm">ကလုံ</div></div>
        <span class="pcode-badge">MMR015005072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.87043362790968, 22.56909168972976], [98.87430622914923, 22.56700899027271], [98.87706612170422, 22.55872930990978], [98.8805675349638, 22.553418545229704], [98.87576734868424, 22.552397790425744], [98.87346335395068, 22.552612115057116], [98.87284510871484, 22.546553309587637], [98.87024756177561, 22.540546483133767], [98.86911113617003, 22.533240882760595], [98.86737078613294, 22.52507244583677], [98.86626421981794, 22.52000549365863], [98.86277961488736, 22.52138957636788], [98.85579870844367, 22.520577841993884], [98.85283333159305, 22.520429574365437], [98.85141534803995, 22.526747015862156], [98.84833076155547, 22.532104456255695], [98.84647189256384, 22.53966169413195], [98.8496295345754, 22.54281933614351], [98.8551493223834, 22.548663816981616], [98.86180604930979, 22.554715385606585], [98.86716297529114, 22.563112670313558], [98.87043362790968, 22.56909168972976]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
