
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Kin</div><div class="name-mm">ရေကင်း</div></div>
        <span class="pcode-badge">MMR008013018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44503949697526, 18.11242967918639], [95.44123499779698, 18.11031606823201], [95.43135017686922, 18.106026428876646], [95.42407644127479, 18.10360185034517], [95.42056961139849, 18.102505966177432], [95.42051862973102, 18.102743123696257], [95.41956871632328, 18.103643122931828], [95.41860003316503, 18.10724844296135], [95.41767233930705, 18.10878247593058], [95.41669248027381, 18.11040276827316], [95.41621181782119, 18.111753427678593], [95.41383130786863, 18.114900740976452], [95.41285856696936, 18.119413392414174], [95.41229541240341, 18.120387395062266], [95.40999367406886, 18.12436836101108], [95.40970498899412, 18.125835656190645], [95.41997330782198, 18.127101612949104], [95.42575499529687, 18.128780167870502], [95.43358825039752, 18.13251028861896], [95.43992945557994, 18.139224507405117], [95.44076178802618, 18.14062632924174], [95.44384608313027, 18.133069807225866], [95.44608415485993, 18.126542095241575], [95.44869524019322, 18.119081852845284], [95.44962776970584, 18.11497872029173], [95.44503949697526, 18.11242967918639]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
