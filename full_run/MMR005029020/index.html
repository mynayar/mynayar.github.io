
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Thay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Thay</div><div class="name-mm">ပသေး</div></div>
        <span class="pcode-badge">MMR005029020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.52168532022142, 22.80129416979014], [94.52443356026066, 22.80129416979014], [94.5451072797772, 22.80129416979014], [94.56922656015769, 22.80129416979014], [94.58990027967423, 22.797848519893307], [94.6088510402434, 22.783204709729603], [94.62952475975993, 22.770283589616042], [94.63369159938787, 22.768431721846525], [94.63351044265289, 22.767548586697956], [94.63094366062148, 22.760548271085895], [94.63094366062148, 22.75658142269458], [94.62791018890414, 22.74818104431978], [94.62737169644669, 22.746418702261337], [94.6010984399411, 22.754778389910825], [94.57956324005153, 22.762530990213065], [94.55285988007944, 22.781481839815115], [94.53390912040965, 22.781481839815115], [94.51926504044934, 22.780620450273602], [94.50462132021784, 22.778897670291315], [94.48725744127796, 22.775740555282425], [94.4891161196133, 22.787511660135067], [94.49041896026688, 22.794459840249488], [94.50203723972692, 22.80129416979014], [94.52168532022142, 22.80129416979014]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
