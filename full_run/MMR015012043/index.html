
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hkun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hkun</div><div class="name-mm">နမ့်ခွန်</div></div>
        <span class="pcode-badge">MMR015012043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.76085531542054, 22.897445892314124], [96.76073520286735, 22.895163764596134], [96.77046426931065, 22.880750334660263], [96.78022082083424, 22.861529096690504], [96.7661402398802, 22.84615810281423], [96.765233863552, 22.84497043833511], [96.75691925082282, 22.834075427838798], [96.74950679300417, 22.834075427838798], [96.73745271197316, 22.82918863774546], [96.7253986309421, 22.822672919119952], [96.71888291141727, 22.813876697851356], [96.71204140618602, 22.802148403426145], [96.70889358836848, 22.79855089670656], [96.69947812541523, 22.80255747714591], [96.70080311007553, 22.8053546663848], [96.70596416911116, 22.816250235360144], [96.70596416911116, 22.833186016321633], [96.70740551165511, 22.858769854345326], [96.70272114726322, 22.879308992116364], [96.70026137016617, 22.879503185423744], [96.70452282566794, 22.88291234982512], [96.73875472165315, 22.8926414153691], [96.76085531542054, 22.897445892314124]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
