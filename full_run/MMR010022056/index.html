
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thar</div><div class="name-mm">ရွာသာ</div></div>
        <span class="pcode-badge">MMR010022056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.86219988121962, 21.066822840801535], [94.86537506810498, 21.066822840801535], [94.86999352298278, 21.066245533604558], [94.8746119769612, 21.064513612912947], [94.87980773813666, 21.062493038622904], [94.88442619301446, 21.059029199038378], [94.88760137989982, 21.055854011253643], [94.88240561872436, 21.05210151717131], [94.8809623516313, 21.050080942881266], [94.8809623516313, 21.04661710239742], [94.88240561872436, 21.04170999392113], [94.88558080740842, 21.038246153437285], [94.88904464699294, 21.03276173776402], [94.89193118207845, 21.028431937384028], [94.88991060778835, 21.02756597658862], [94.8861581128067, 21.02727732388945], [94.88313835485127, 21.02652238440055], [94.88038504533364, 21.025834056796327], [94.87518928415818, 21.02525674959935], [94.86739564239502, 21.024968096000862], [94.8627771866179, 21.024679443301693], [94.85024955497306, 21.02147453022542], [94.83742871466353, 21.017003273682178], [94.83809807106917, 21.021020074017258], [94.83726095063241, 21.037254578935745], [94.83412578537673, 21.051884561123643], [94.83418087784531, 21.051901214769316], [94.84331056233265, 21.054661015593467], [94.85205972657519, 21.061600009133144], [94.86219988121962, 21.066822840801535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
