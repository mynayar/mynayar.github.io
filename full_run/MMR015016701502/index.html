
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Lel Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Lel Ward</div><div class="name-mm">မြို့လယ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR015016701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.16245157120454, 22.965287039525435], [97.16221005591217, 22.964958198014074], [97.16176390697359, 22.96452989503291], [97.16126422016237, 22.964291948932384], [97.16089540370643, 22.964155129924507], [97.16080617391879, 22.964042105526858], [97.16055038186067, 22.963661391765925], [97.15922329470885, 22.962649535893547], [97.1590924266161, 22.9627317958375], [97.15885685997648, 22.96281745643381], [97.15821124302869, 22.96292349958884], [97.15694061085145, 22.963080544015213], [97.15685495025531, 22.96437972972427], [97.15655513816853, 22.964708095343212], [97.15610410545139, 22.96475985319597], [97.15578982457077, 22.964927761111824], [97.1559422581903, 22.965218332588563], [97.15630393626321, 22.965694224789786], [97.1564562217676, 22.96613204561487], [97.15670368571222, 22.966607937816093], [97.15704632809707, 22.967007687264925], [97.15720035173729, 22.96754253580673], [97.15881609187812, 22.96699348981457], [97.16154023763914, 22.965978272947382], [97.16168300529944, 22.96589499181215], [97.16245157120454, 22.965287039525435]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
