
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maung Shin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myebon</div><div class="name-mm">မြေပုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maung Shin</div><div class="name-mm">မောင်ရှင်</div></div>
        <span class="pcode-badge">MMR012006058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.41649564515797, 20.116583223736825], [93.41993930935172, 20.115101301084223], [93.42045855361943, 20.116036021345337], [93.42164909323111, 20.115309084946375], [93.42464400561641, 20.114263643752224], [93.42694095685971, 20.113786164899636], [93.42746617442447, 20.11296913711601], [93.42856072669622, 20.112540834092272], [93.42994081371762, 20.111779405994866], [93.43113054483882, 20.110684853723058], [93.43236786358608, 20.10954271292593], [93.43436661133012, 20.107591554606586], [93.43546116360187, 20.106259057009936], [93.43603223400044, 20.105259682688256], [93.43712678627224, 20.1042127198412], [93.43788821257101, 20.102451919220755], [93.43850687329365, 20.100643528276237], [93.43945865819057, 20.09826406783253], [93.44045803161293, 20.09517076871606], [93.44064838841246, 20.0929816641725], [93.44131463766047, 20.090935327903082], [93.44155258388469, 20.089698008256505], [93.44203029206437, 20.087514198921212], [93.44140987496581, 20.08704353782906], [93.44013005156069, 20.086072636942674], [93.43889273191411, 20.08531120974459], [93.43736987661856, 20.084930495246226], [93.43583262767368, 20.084417414032487], [93.43416791601658, 20.08932231107582], [93.42739778008354, 20.098022440683167], [93.42256521281439, 20.106357534572624], [93.42202727613795, 20.107285291383164], [93.41664631307697, 20.115801465565255], [93.41649564515797, 20.116583223736825]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
