
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Kone</div><div class="name-mm">ရေတွင်းကုန်း</div></div>
        <span class="pcode-badge">MMR008007015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80429839985135, 17.62417606717179], [95.80457876979443, 17.618428490982126], [95.80583669920435, 17.608050575373795], [95.80174842884696, 17.607107128091513], [95.79828912364422, 17.60490575229869], [95.7954587826967, 17.601446446196576], [95.79388637115915, 17.59641472855691], [95.79388637115915, 17.58918163602374], [95.7888546544188, 17.58792370661382], [95.78193604311394, 17.581005096208287], [95.77533191483604, 17.578803720415408], [95.76801691115156, 17.580717916598644], [95.76920767289585, 17.58429020363002], [95.76948768490877, 17.590730480827062], [95.77004770893467, 17.59577069706006], [95.77088774497349, 17.6064111553506], [95.77844807022234, 17.612571418736024], [95.78152820236471, 17.61425149171305], [95.78208822639061, 17.618171659894244], [95.78423979592992, 17.61968795643412], [95.78928875627116, 17.620950195395267], [95.794968834744, 17.623790234631656], [95.79749331536425, 17.625368034906955], [95.80429839985135, 17.62417606717179]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
