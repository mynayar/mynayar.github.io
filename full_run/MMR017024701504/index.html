
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bogale</div><div class="name-mm">ဘိုကလေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward</div><div class="name-mm">အမှတ် (၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017024701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40026811138426, 16.296209427623012], [95.40028521828827, 16.295675324756473], [95.40014232950494, 16.294471090268644], [95.39999954953964, 16.29425573501419], [95.39994515764295, 16.29388049289048], [95.40000722075672, 16.293711581324487], [95.39977477748403, 16.292180824585444], [95.39976620334767, 16.29167544426639], [95.39966299714968, 16.290862217017775], [95.39957800941767, 16.290516335960206], [95.399561012231, 16.2900954037799], [95.39961540412764, 16.290075826438283], [95.39954061470769, 16.289292695001905], [95.39940803395365, 16.288541376183616], [95.39922362257221, 16.287240707392755], [95.39620648793914, 16.287625702664116], [95.39627112940917, 16.28809841421048], [95.39637311522716, 16.28846061526525], [95.39636971578983, 16.28898596772825], [95.39652609350446, 16.290451074857287], [95.39676382928735, 16.292523321494116], [95.3968940915891, 16.29347751477553], [95.39696548067246, 16.29382910113219], [95.39705726817846, 16.294357702845787], [95.39712270824646, 16.295286830223063], [95.39689494144847, 16.295283567482727], [95.39699590743521, 16.296502493295463], [95.39837203114439, 16.29631628956514], [95.39917856653767, 16.296245320465232], [95.39998680164962, 16.29619963940189], [95.40026811138426, 16.296209427623012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
