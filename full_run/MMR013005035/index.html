
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Boet Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Boet Hla</div><div class="name-mm">တောင်ဘို့လှ</div></div>
        <span class="pcode-badge">MMR013005035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88213494776966, 17.52312155291736], [95.87945601398394, 17.521380246001627], [95.87329446636659, 17.52178208557484], [95.86460313842417, 17.522149631300522], [95.85946786744819, 17.527926809574637], [95.8559373692143, 17.533383035099064], [95.85006832609241, 17.538555689093812], [95.849305147015, 17.54122681406625], [95.85464739695988, 17.545805884034394], [95.86266077097787, 17.54924018808424], [95.86800302002342, 17.54924018808424], [95.8699109659184, 17.54924018808424], [95.8752912643804, 17.547341099612083], [95.88005381313303, 17.54702359576237], [95.88703888523645, 17.54861111321236], [95.88824542019006, 17.54843875094764], [95.89370645438942, 17.547658602562535], [95.89592897594156, 17.547658602562535], [95.89751649339149, 17.539721020708612], [95.89307144668999, 17.53749849825715], [95.88894390383814, 17.537180995306755], [95.88703888523645, 17.534323466055184], [95.88513386483606, 17.529878420252942], [95.8829113423846, 17.529243412553512], [95.88213494776966, 17.52312155291736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
