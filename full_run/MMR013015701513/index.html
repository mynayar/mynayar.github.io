
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byaing Yay Oe Zin Ywar Ma Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Byaing Yay Oe Zin Ywar Ma Ward</div><div class="name-mm">ဗျိုင်းရေအိုးစဉ်ရွာမရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17594114986423, 16.806805928750634], [96.17600971417704, 16.806353730740113], [96.1760034557949, 16.80608526872021], [96.1759500612464, 16.805339801790467], [96.17594623642975, 16.805286407241965], [96.17589759839552, 16.8047876360406], [96.17578506442925, 16.804277738426947], [96.17565907660514, 16.804010637081262], [96.17555999739602, 16.803800583330315], [96.17532271307283, 16.803335486343656], [96.1750143957978, 16.8028742141737], [96.17468071044647, 16.803300857948273], [96.17451286277844, 16.803499221411982], [96.17407556023898, 16.804035706582624], [96.1743351621381, 16.8049828213002], [96.17405738943705, 16.805221175816655], [96.17405509976311, 16.805889130179253], [96.17407035856024, 16.80625343384895], [96.1741146088022, 16.806868743697635], [96.17440223717358, 16.806859969911727], [96.17482185364571, 16.806859969911727], [96.17538261421635, 16.806840896190465], [96.17594114986423, 16.806805928750634]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
