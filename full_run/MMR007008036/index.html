
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mar Raw Kho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mar Raw Kho</div><div class="name-mm">မာရောခို</div></div>
        <span class="pcode-badge">MMR007008036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.94900224955421, 17.90556672282605], [96.96178660167038, 17.904404510060147], [96.98272289534538, 17.898032593929145], [96.99819754687934, 17.894846636762907], [97.01048624124712, 17.888929857626863], [97.01574923124207, 17.884418723345448], [97.01549274459455, 17.878006575143388], [97.01412733540826, 17.867083290861217], [97.00912083026219, 17.859345966443243], [97.00138350404552, 17.851153503231615], [96.99501158881384, 17.847057272075517], [96.99137049465264, 17.84205076692939], [96.97750947688093, 17.847888623361314], [96.96787265929584, 17.85003013758086], [96.96269687566036, 17.852518914216546], [96.95450441334805, 17.85980110163956], [96.93811948782417, 17.870269248926775], [96.93129243559747, 17.878916848233985], [96.93538866675362, 17.889384994621878], [96.94312599297024, 17.898487730924103], [96.94676708713143, 17.905769920145758], [96.94900224955421, 17.90556672282605]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
