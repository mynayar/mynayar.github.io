
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Yon Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Yon Gyi</div><div class="name-mm">ငါးရုံကြီး</div></div>
        <span class="pcode-badge">MMR005005002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50469988029528, 22.826477070260637], [95.51147471968261, 22.8364867800409], [95.51502936021689, 22.84793343018373], [95.51507580030801, 22.848083459584018], [95.51555041931647, 22.853371611710543], [95.51648379329248, 22.85803848968459], [95.51866166980028, 22.85834961734099], [95.51897279655736, 22.853993863426126], [95.5205284240476, 22.85150486195988], [95.52457305120538, 22.851815986019005], [95.52675092501522, 22.853371611710543], [95.53079555307238, 22.851815986019005], [95.53523923909967, 22.849914509846826], [95.53529150409969, 22.849892144606827], [95.53536047130876, 22.849862827607467], [95.54044043487824, 22.850571485285855], [95.5405612749829, 22.850627877274746], [95.54094828023898, 22.847532569972202], [95.54103756043514, 22.846817160183832], [95.54252652028276, 22.84698051034235], [95.54510483971666, 22.839904800066506], [95.54510483971666, 22.83532713034282], [95.54510483971666, 22.833679229712743], [95.54791247997701, 22.82250978030214], [95.54107679965466, 22.818908699676797], [95.53887936019436, 22.819091760276592], [95.53070051991313, 22.824096660132795], [95.52331547972568, 22.822875989635236], [95.51611332027358, 22.82690430039321], [95.50469988029528, 22.826477070260637]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
