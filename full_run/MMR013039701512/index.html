
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Chaung (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">San Chaung (South) Ward</div><div class="name-mm">စမ်းချောင်း (တောင်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13000798228262, 16.80295538878022], [96.13068962072947, 16.80272865260531], [96.13157177022106, 16.80243301397246], [96.1325855256016, 16.80221589424815], [96.13329315175758, 16.802150726674768], [96.13381195086089, 16.80209159894821], [96.13433647055172, 16.802037070354572], [96.13381099668021, 16.8014125829244], [96.13322353343938, 16.80087518674054], [96.13269424464374, 16.800517082097713], [96.13192049673358, 16.800114314424093], [96.13140106180964, 16.80004978177209], [96.13083839467623, 16.800077438622964], [96.13033463043888, 16.800123438945604], [96.130196571015, 16.80052089702184], [96.13011169479893, 16.8008594513027], [96.13002967842698, 16.801292420009247], [96.12998008711139, 16.801651001292726], [96.129926681771, 16.80216026308574], [96.12989362089394, 16.80249087005768], [96.13000798228262, 16.80295538878022]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
