
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku</div><div class="name-mm">ကူ</div></div>
        <span class="pcode-badge">MMR010020008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4384124323879, 20.97286854784528], [95.44228378087183, 20.966846450003743], [95.44607636223441, 20.95926128817797], [95.44615512935582, 20.959103752136514], [95.44271393110307, 20.953511803626895], [95.43927273195106, 20.947489705785358], [95.43884258171983, 20.941037458611902], [95.4418536306406, 20.93974700881745], [95.44873602804529, 20.93931685858621], [95.45260737742859, 20.935445510102284], [95.45303752676051, 20.93200431184954], [95.45303752676051, 20.927702813134374], [95.45088677830222, 20.925121914444844], [95.43927273195106, 20.923401315318472], [95.43196018431513, 20.921250565061598], [95.43119007686062, 20.920737160991223], [95.42851898516307, 20.926842512671897], [95.41948583930008, 20.93931685858621], [95.41948583930008, 20.94705955555412], [95.41723321204319, 20.952548598239275], [95.41826433603035, 20.957704221772474], [95.41688950284833, 20.963890970192153], [95.41173388021446, 20.962859846204992], [95.42378733711598, 20.96598615044053], [95.42980943495752, 20.969427348693216], [95.4384124323879, 20.97286854784528]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
