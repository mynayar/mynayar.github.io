
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Okpho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR008010905</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80137046987136, 18.136231594212745], [95.80471084692812, 18.13642931286256], [95.80898559530903, 18.133223252251355], [95.81361657324629, 18.132154565380915], [95.81896000759832, 18.132154565380915], [95.82180983955249, 18.13642931286256], [95.82572836017573, 18.139991603929445], [95.8292906503433, 18.138566688402022], [95.83178425274116, 18.138210457946343], [95.83534654380799, 18.13642931286256], [95.83356539782488, 18.130729648954173], [95.83463408469532, 18.125742442359865], [95.83962129218895, 18.126098671016905], [95.84745833073742, 18.126454899673945], [95.85066439224795, 18.1221801521923], [95.85743274302672, 18.1111370521333], [95.84852701760781, 18.10258755537143], [95.8378950444208, 18.09618810110004], [95.83621918027103, 18.103450179682113], [95.83385655513598, 18.108766084886952], [95.82972196159932, 18.108766084886952], [95.8264733540621, 18.103154852214686], [95.82115744885726, 18.102564196380627], [95.81259293611515, 18.105517477349736], [95.8102303109801, 18.114377317559217], [95.8093443267793, 18.11585395759414], [95.80904899931193, 18.117921255261763], [95.80402842157446, 18.119988551130803], [95.80314243827297, 18.12353248793403], [95.79871251726894, 18.124713799602205], [95.79812186143482, 18.131801673208713], [95.80137046987136, 18.136231594212745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
