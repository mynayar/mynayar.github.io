
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Kone</div><div class="name-mm">ရှမ်းကုန်း</div></div>
        <span class="pcode-badge">MMR008010049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7966452213999, 18.096509971158298], [95.7945779246316, 18.09178472178752], [95.79073866036094, 18.09591931532418], [95.78424144258855, 18.094442675289258], [95.7845367709553, 18.090603410119343], [95.77538160237913, 18.085287504914447], [95.77154233720915, 18.081152913176425], [95.76977036880754, 18.077018319639762], [95.76608322306237, 18.075641344272697], [95.76729763877506, 18.078070175698087], [95.76826917188481, 18.092157399044765], [95.76681187266985, 18.096286413187443], [95.76001114359946, 18.09968677682332], [95.75418194943745, 18.10648750499439], [95.75029581789772, 18.113774000169997], [95.7547086382931, 18.116001621777457], [95.75618527832802, 18.116296950144203], [95.76238716683434, 18.115706294310087], [95.77124700884247, 18.121317526982352], [95.77272364887733, 18.1236801521174], [95.77479094474637, 18.123384823750655], [95.77774422571548, 18.12249883865053], [95.78335545928707, 18.121022198615606], [95.7854227551561, 18.121908182816412], [95.79516858136498, 18.10359784386543], [95.7945779246316, 18.101530547996447], [95.7966452213999, 18.096509971158298]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
