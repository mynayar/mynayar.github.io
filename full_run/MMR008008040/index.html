
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Taw Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Taw Su</div><div class="name-mm">ပေါက်တောစု</div></div>
        <span class="pcode-badge">MMR008008040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5103029642105, 17.75570526368699], [95.51402917830399, 17.75357600003241], [95.52201392060601, 17.75304368321946], [95.53053098062031, 17.74931747002529], [95.53186177220306, 17.74825283729865], [95.53532182744044, 17.74931747002529], [95.542508095872, 17.74931747002529], [95.53745109199434, 17.744792782061268], [95.53079713857716, 17.73973577818367], [95.5321279301599, 17.73414645659375], [95.53691877608071, 17.72722634611904], [95.5398465154044, 17.724019001275963], [95.53605306080016, 17.724019001275963], [95.52688489522177, 17.724019001275963], [95.5099068092519, 17.726735495246942], [95.50888812378793, 17.733866290796755], [95.50820899984552, 17.742015771810486], [95.5048133828314, 17.74235533423132], [95.4993803957887, 17.743374018795976], [95.49772638336594, 17.744614529237197], [95.50444748556305, 17.75038210185255], [95.5103029642105, 17.75570526368699]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
