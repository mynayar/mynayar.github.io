
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Swei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Swei</div><div class="name-mm">ကန်ဆွယ်</div></div>
        <span class="pcode-badge">MMR010023012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15609275077986, 20.405874517994675], [96.15609275077986, 20.408531634227586], [96.16256225144679, 20.410149009169515], [96.16660568790223, 20.409744664984373], [96.17752296920975, 20.40650991510057], [96.18844024871856, 20.40650991510057], [96.19652712432736, 20.40650991510057], [96.20340096738079, 20.402466477745804], [96.21108349790518, 20.399636072047144], [96.21957471590048, 20.394783947221413], [96.21553127944503, 20.390740509866703], [96.21148784209032, 20.38588838504097], [96.20663571726459, 20.38548404175515], [96.19976187421116, 20.38305797934231], [96.19528735942419, 20.38271378631225], [96.19086631203072, 20.386292729226113], [96.18439681226312, 20.39033616568156], [96.17914034415162, 20.391144854051845], [96.1682230628441, 20.395188291406555], [96.1597318448488, 20.393975259750505], [96.15609275077986, 20.40327516611609], [96.15609275077986, 20.405874517994675]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
