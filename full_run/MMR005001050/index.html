
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Te Gyi Let Pan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Te Gyi Let Pan Thar</div><div class="name-mm">တဲကြီးလက်ပံသာ</div></div>
        <span class="pcode-badge">MMR005001050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6994958800309, 21.973716989647414], [95.70045959983071, 21.973016069735877], [95.70073392003445, 21.968081909652483], [95.7012821998137, 21.963147749569032], [95.7034749601014, 21.96095472038411], [95.70457151965996, 21.95766530970633], [95.70681180012451, 21.954106980153085], [95.70594203969341, 21.95300528996222], [95.7042975600844, 21.947796899607283], [95.6996535599639, 21.94341102020246], [95.69360663993456, 21.94341102020246], [95.68647935983466, 21.94436133021128], [95.68647935983466, 21.94916750957293], [95.68647935983466, 21.954924089774977], [95.68785023959691, 21.95876178023201], [95.68922075963042, 21.964244220094713], [95.68922075963042, 21.96890423983882], [95.68346399956397, 21.96835604999177], [95.67794555983977, 21.969108539727358], [95.67792216037947, 21.97310040006346], [95.6853831600049, 21.97438667970158], [95.69360663993456, 21.975483150227262], [95.69744423956007, 21.975209099820177], [95.6994958800309, 21.973716989647414]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
