
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gat Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawngmun</div><div class="name-mm">နောင်မွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gat Htu</div><div class="name-mm">ဂါတ်ထု</div></div>
        <span class="pcode-badge">MMR001017005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.97398207930956, 27.730351881234355], [97.98058664465799, 27.720445031413135], [98.00815782972012, 27.67953295238391], [98.0197199393238, 27.65018298205905], [98.02683508307268, 27.61638604587938], [98.0303926562961, 27.570137608364007], [98.03288175578848, 27.55800324575324], [98.0197199393238, 27.55857549876032], [97.99036996899895, 27.562133071084418], [97.97080332211567, 27.562133071084418], [97.94234274532153, 27.567469428671245], [97.90320945065571, 27.583478504129687], [97.92277609843825, 27.629726941645117], [97.93967456562876, 27.666192055718852], [97.95568364018789, 27.68931627492617], [97.96902453595362, 27.718666245251086], [97.97398207930956, 27.730351881234355]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
