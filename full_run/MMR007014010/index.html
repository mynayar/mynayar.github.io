
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Pin</div><div class="name-mm">အုန်းပင်</div></div>
        <span class="pcode-badge">MMR007014010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.47496785618165, 18.836253809665607], [96.47594407655794, 18.833162444091556], [96.47594407655794, 18.82736538270632], [96.47563834933044, 18.8203336312921], [96.47594407655794, 18.813194788608655], [96.47606439865314, 18.808381917391614], [96.47046907498788, 18.804821255896286], [96.46757054384557, 18.798380076679223], [96.46177348335965, 18.79515948662106], [96.44921318384144, 18.790972720714535], [96.44101142163987, 18.788434100953054], [96.43800439718524, 18.787913517594802], [96.43504919436486, 18.801930583030014], [96.43310895741251, 18.808480750186504], [96.43310895741251, 18.82173108512154], [96.43310895741251, 18.822816910372183], [96.4430646242331, 18.82839208292836], [96.44983447687969, 18.835161939172224], [96.46024693005182, 18.84203808628871], [96.47094049330917, 18.84909987236125], [96.47299355740682, 18.843499910892206], [96.47401172306263, 18.839281564392707], [96.47496785618165, 18.836253809665607]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
