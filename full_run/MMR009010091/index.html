
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Paw Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Paw Kyun</div><div class="name-mm">ရေပေါ်ကျွန်း</div></div>
        <span class="pcode-badge">MMR009010091</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.66531559543841, 20.829103237624395], [94.6560283290442, 20.83119287265299], [94.6425265031956, 20.834943380132927], [94.63202508279142, 20.83419327809736], [94.62339891612714, 20.84169429305723], [94.6057715322305, 20.849570357685934], [94.60127092271495, 20.85332086606519], [94.59677031409876, 20.861196930693836], [94.59752041613433, 20.868322895085612], [94.60277112588682, 20.872823502802476], [94.60877193767482, 20.873573604838043], [94.61627295173537, 20.87432370597429], [94.62039850978346, 20.87769916288613], [94.62977477758398, 20.878074214353546], [94.63127498075579, 20.87798596657916], [94.63615064083945, 20.87769916288613], [94.6425265031956, 20.879199366057946], [94.64815226441556, 20.882199772401634], [94.65377802473608, 20.887825532722218], [94.65640337961236, 20.89007583703028], [94.66090398912786, 20.889325734994713], [94.66465449570848, 20.885575228414098], [94.6687800537565, 20.879199366057946], [94.68040662676447, 20.87657401118173], [94.67610996730122, 20.86428434644546], [94.66658836995737, 20.841698232087765], [94.66531559543841, 20.829103237624395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
