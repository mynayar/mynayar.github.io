
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Bee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Bee</div><div class="name-mm">မဘီး</div></div>
        <span class="pcode-badge">MMR007008017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.77511519780819, 18.190159170009736], [96.77562116088791, 18.190503632836453], [96.77893242868868, 18.192304527931697], [96.78111104983515, 18.193193060811154], [96.78473884212394, 18.18981546081494], [96.79129543583576, 18.191864396125027], [96.79272969082263, 18.1957573751028], [96.79457136207878, 18.195558275094356], [96.79901677300575, 18.195077689983464], [96.79948481707072, 18.191823404126865], [96.79766426909083, 18.17816929877415], [96.79220262784906, 18.167246016290676], [96.79518702536097, 18.155640026965727], [96.78674098570798, 18.155640026965727], [96.77945879738564, 18.154729753875074], [96.75988791379626, 18.154729753875074], [96.75648998012855, 18.154972444922464], [96.75916129935456, 18.157134940325307], [96.76489831840274, 18.164511108700765], [96.76681065838522, 18.172980042395068], [96.76451791057315, 18.177565532623305], [96.76567650536651, 18.179223500264357], [96.7656798310594, 18.180124425801637], [96.76710269703187, 18.18328642682718], [96.76899506127313, 18.18509080229876], [96.77089076289843, 18.18779915110997], [96.7723097671821, 18.188249212331357], [96.77511519780819, 18.190159170009736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
