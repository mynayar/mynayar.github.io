
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Chan Thar</div><div class="name-mm">အောင်ချမ်းသာ</div></div>
        <span class="pcode-badge">MMR010031058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89156274222682, 21.087809376901248], [95.89683331170801, 21.08283161678571], [95.90572300491283, 21.082427539699268], [95.9146126981176, 21.08323569387221], [95.9142086210311, 21.078790846820198], [95.91097600613784, 21.06828484616875], [95.91097600613784, 21.06141553839643], [95.9146126981176, 21.051717690119347], [95.91097600613784, 21.051717690119347], [95.90491485073983, 21.052121767205847], [95.9018143372619, 21.052417054203715], [95.89642923462156, 21.05292992137879], [95.8863273101573, 21.056566614257918], [95.8798620785721, 21.056566614257918], [95.87352459658291, 21.064035767137], [95.87074855939858, 21.067604958701907], [95.87074855939858, 21.072958745150004], [95.8796715383109, 21.0804937050205], [95.88118943294603, 21.085074473807992], [95.89156274222682, 21.087809376901248]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
