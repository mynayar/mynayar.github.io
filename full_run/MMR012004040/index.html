
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Win Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Win Kaing</div><div class="name-mm">သဝင်ကိုင်း</div></div>
        <span class="pcode-badge">MMR012004040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.02945857825085, 20.795431425919617], [93.0291404862445, 20.79546323494037], [93.01407088666213, 20.795714394004108], [93.00050824685815, 20.795212074977314], [92.98619212806432, 20.795212074977314], [92.9843438989518, 20.795497314749355], [92.9847777121218, 20.796705605179568], [92.98649092421681, 20.80384398830944], [92.98730192474409, 20.811127086745728], [92.99096416826183, 20.811286314411916], [93.00050824685815, 20.814802553894822], [93.0173359670813, 20.820579233944557], [93.02512192593622, 20.82384431256503], [93.0306474460229, 20.82585359316886], [93.03541948622035, 20.829369832651707], [93.0414473262332, 20.81630951367316], [93.04295428601154, 20.804756153573692], [93.04370776590076, 20.7947097550512], [93.03667528603569, 20.7947097550512], [93.02945857825085, 20.795431425919617]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
