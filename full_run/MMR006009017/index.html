
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Ret Khwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawthoung</div><div class="name-mm">ကော့သောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Ret Khwa</div><div class="name-mm">ပရက်ခွ</div></div>
        <span class="pcode-badge">MMR006009017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.69843555985324, 10.437020190029784], [98.70883775985482, 10.430828999858534], [98.71898939974108, 10.425414869800477], [98.72936639983953, 10.420226279819019], [98.7390669595726, 10.415714489931815], [98.75057183991856, 10.40894684961745], [98.76185136005228, 10.404660599806903], [98.76537720429462, 10.403443511309035], [98.76657247434025, 10.40261019680321], [98.76370388432684, 10.399792818683693], [98.7636158227121, 10.39983298690288], [98.76347561840515, 10.399568627590156], [98.76079268263624, 10.396933588814136], [98.75695559022836, 10.394139704583722], [98.75677827899443, 10.393954268874438], [98.75661377680444, 10.39345769022026], [98.75640730775109, 10.393566296847155], [98.7456088799459, 10.399246469748846], [98.7408716399143, 10.400374439928498], [98.73072000002804, 10.403307089550594], [98.71989191977633, 10.406690910157408], [98.70816095976056, 10.410300359873759], [98.69803451977731, 10.411353090073078], [98.69883659992922, 10.41817095032917], [98.70084216003772, 10.421780400045463], [98.70003972015701, 10.425389849761814], [98.69803451977731, 10.43180658000972], [98.69843555985324, 10.437020190029784]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
