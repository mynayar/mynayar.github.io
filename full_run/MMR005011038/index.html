
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Swea</div><div class="name-mm">ဆန်ဆွဲ</div></div>
        <span class="pcode-badge">MMR005011038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26788323961989, 22.905273419632636], [95.26708980015422, 22.90808105989305], [95.26690655969003, 22.911071759853883], [95.2633058396928, 22.917114269607907], [95.260070880267, 22.921874999931333], [95.25750731960716, 22.926086460321926], [95.25109859962072, 22.930114770180523], [95.25109859962072, 22.933471680373827], [95.25109859962072, 22.937927220364998], [95.25231936005048, 22.942687949789104], [95.2518920399857, 22.943725559686868], [95.25488291981094, 22.944091769919282], [95.26068108016779, 22.941284219591125], [95.2650756002588, 22.938293429698092], [95.27111819994502, 22.934326139739596], [95.27728284033088, 22.933105470141356], [95.27728284033088, 22.92950439041533], [95.27893056019724, 22.921691940230914], [95.28088392005691, 22.916076659710143], [95.28088392005691, 22.910095259788477], [95.28112799965754, 22.905883800297204], [95.28112799965754, 22.905090359932217], [95.27587884033625, 22.90612796982998], [95.27172839984581, 22.90612796982998], [95.26788323961989, 22.905273419632636]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
