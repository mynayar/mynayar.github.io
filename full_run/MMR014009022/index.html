
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlaung</div><div class="name-mm">ပင်လောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Pyin</div><div class="name-mm">ဘန့်ပြင်</div></div>
        <span class="pcode-badge">MMR014009022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70674874126144, 20.404487927975538], [96.70142902113247, 20.401828067911083], [96.69203130989712, 20.4003442180113], [96.68461206399564, 20.397376520010425], [96.6841174467628, 20.392430355776355], [96.68609591299605, 20.383032645440267], [96.68561452119326, 20.382963875182725], [96.68359982487209, 20.382676060651704], [96.67076280485963, 20.388473425108543], [96.65345123138928, 20.391935740342205], [96.63564503978682, 20.391935740342205], [96.63565105625128, 20.392431470036342], [96.63613965701961, 20.419139642280697], [96.63811812235355, 20.44881662498733], [96.63821226158666, 20.45074648736056], [96.6426227617311, 20.445110836296124], [96.64914830814797, 20.4391072438043], [96.6525627263888, 20.439786795824034], [96.65283715001453, 20.439786663623693], [96.65667903490959, 20.442605742361195], [96.65724369763859, 20.449025449365024], [96.65862028269993, 20.45120447880373], [96.65863142440077, 20.45520210379408], [96.65863161595638, 20.4554202352557], [96.6588920110575, 20.45524663822181], [96.68362283132865, 20.442386611752795], [96.68955822822971, 20.43101043518351], [96.70674874126144, 20.404487927975538]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
