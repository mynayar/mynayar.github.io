
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Sein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Sein</div><div class="name-mm">သပြေစိန်</div></div>
        <span class="pcode-badge">MMR008011024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66869476365247, 18.309775096843282], [95.67257675921013, 18.314539363301037], [95.66945054580611, 18.3253390105869], [95.6663243324021, 18.330738834229862], [95.66598329059644, 18.330909354683], [95.66973474686114, 18.33215984040436], [95.67485036944908, 18.332728243413726], [95.67488881186921, 18.332684307934528], [95.67712397878864, 18.336138657872823], [95.68053439414706, 18.338980670221815], [95.6853658147806, 18.34097007940568], [95.68562681602481, 18.34107882902481], [95.68849202908393, 18.336422858927847], [95.69161824158863, 18.329886230165414], [95.69389185182757, 18.32249699823791], [95.69900747531477, 18.31539196736543], [95.7027020908289, 18.306581729263428], [95.70336073990626, 18.305496895965007], [95.70002547279739, 18.30382926330992], [95.69710480034632, 18.301456215931694], [95.69319640339137, 18.300928053986524], [95.69035074519081, 18.30054350567832], [95.68460645062726, 18.30325901039504], [95.68223749786227, 18.30415442938346], [95.67939949738894, 18.30414019941071], [95.67277352637723, 18.3050167506226], [95.67039985307082, 18.307264116845545], [95.66991961240024, 18.30861797244154], [95.66869476365247, 18.309775096843282]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
