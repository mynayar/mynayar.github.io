
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Maw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Maw</div><div class="name-mm">နမ့်မော်</div></div>
        <span class="pcode-badge">MMR015001078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11848779057914, 23.235835625114078], [98.12676280795728, 23.237018006076198], [98.13147121392547, 23.237018110397514], [98.13496607742258, 23.23701818683992], [98.1389057357112, 23.235442360576542], [98.14238039413993, 23.157736377132153], [98.1427537530833, 23.139815131663056], [98.14387383081271, 23.13608153863214], [98.14499390944144, 23.11554677786154], [98.14499390944144, 23.105839436340943], [98.14329993204626, 23.098381801079313], [98.13565992596489, 23.098745610121853], [98.12296571109874, 23.100985765580674], [98.10952477564791, 23.098745610121853], [98.10752811612974, 23.096748948804986], [98.10467110578696, 23.097998891335806], [98.10362851724233, 23.099154191912476], [98.10056415291336, 23.124507400596087], [98.09272360790823, 23.152509347428463], [98.07608554211413, 23.211272342244854], [98.08512518108228, 23.219107397788207], [98.08730940680374, 23.22100056332539], [98.0998094238659, 23.228813801315937], [98.11582515700547, 23.23545517231838], [98.11848779057914, 23.235835625114078]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
