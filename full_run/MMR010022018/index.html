
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Htet Nyint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Htet Nyint</div><div class="name-mm">အထက်ညဉ့်</div></div>
        <span class="pcode-badge">MMR010022018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0452061412505, 21.223561641356696], [95.04434018135436, 21.221541067066653], [95.03972172737588, 21.218654532880464], [95.03481461889959, 21.21721126578734], [95.03184481018991, 21.21540355742826], [95.03135077841574, 21.219520493675873], [95.03019616402179, 21.22211837426363], [95.02904155142653, 21.227025481840542], [95.02759828343409, 21.232221243016], [95.02615501634097, 21.2348191236037], [95.0247117492479, 21.237994312287753], [95.02326848215478, 21.241746806370088], [95.02182521506171, 21.245210646853934], [95.01947964826724, 21.246735264820643], [95.01266455612443, 21.26514643036353], [95.0126452773577, 21.26519851370051], [95.0148225486218, 21.26869953125839], [95.01930072185087, 21.275900357015928], [95.02734471418728, 21.266149444241535], [95.03221673831189, 21.25617947640177], [95.03568057879573, 21.24838583373929], [95.0391444201789, 21.242035459069257], [95.04231960706426, 21.23193259031683], [95.0452061412505, 21.223561641356696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
