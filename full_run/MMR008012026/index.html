
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Yar Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Yar Taw</div><div class="name-mm">တောင်ယာတော</div></div>
        <span class="pcode-badge">MMR008012026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47243976318458, 18.28858873498217], [95.47642996607016, 18.27926426093694], [95.48315030744078, 18.273887987840396], [95.49046726175476, 18.27068654524794], [95.48622685578482, 18.258493093581478], [95.48238465163041, 18.258102480245327], [95.47507424438095, 18.258102480245327], [95.4728636577317, 18.258449284906646], [95.47057467717968, 18.266992228308766], [95.46705144007194, 18.26980952728792], [95.46493790555996, 18.265054075984892], [95.46282437194725, 18.2573925176506], [95.45520276779354, 18.252946580620232], [95.45506475243644, 18.251096937773525], [95.45507250369315, 18.249742438262956], [95.45559619420908, 18.243201947811713], [95.45595495086036, 18.24158762337015], [95.45437023929514, 18.24154101420652], [95.45357766407801, 18.243654547819176], [95.45252089682197, 18.247353231866214], [95.45331347203916, 18.25290125928575], [95.45225670568249, 18.25818509286779], [95.45333165363297, 18.266630318634327], [95.45278508886082, 18.269545336148383], [95.45806435478619, 18.27174872732195], [95.45806435478619, 18.279768286877015], [95.47243976318458, 18.28858873498217]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
