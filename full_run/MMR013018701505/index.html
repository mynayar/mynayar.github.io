
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (21) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (21) Ward</div><div class="name-mm">အမှတ် (၂၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24130058285567, 16.838689486230862], [96.2396116263755, 16.838700295182548], [96.23876380940231, 16.838611603143022], [96.2376232154391, 16.838460922633544], [96.23607063305332, 16.838239669625125], [96.23537159002694, 16.838100432988654], [96.23447990412433, 16.837830225384664], [96.23321021428, 16.837464617698004], [96.23217201262833, 16.83930873870736], [96.23114051812047, 16.840768052403746], [96.22985776292546, 16.841877619756417], [96.23040103887689, 16.842473030306166], [96.2310609820787, 16.84331130996901], [96.23153400479055, 16.844113349651423], [96.23204994225108, 16.844808578653044], [96.23304939301511, 16.845979690210584], [96.23370170636872, 16.846731186195314], [96.23502667843854, 16.848241806214446], [96.23908042921852, 16.845022201813208], [96.24064636293934, 16.84378242521882], [96.24104262042067, 16.84333712590768], [96.24092292785087, 16.84161122617718], [96.24102210958273, 16.84066391001147], [96.24130058285567, 16.838689486230862]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
