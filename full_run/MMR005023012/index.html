
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Hmin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Hmin</div><div class="name-mm">ဥမှင်</div></div>
        <span class="pcode-badge">MMR005023012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9388116404449, 24.544263059692526], [95.94628920018647, 24.540283170232158], [95.94708263965214, 24.534118619778553], [95.94348155992611, 24.525085410063696], [95.94287100029646, 24.518920859610034], [95.94567863965756, 24.5084839196972], [95.94287100029646, 24.499694789582918], [95.94128411956655, 24.494323770325764], [95.94132840038543, 24.494236650301218], [95.94128411956655, 24.494079599893666], [95.92089839984135, 24.49829106028426], [95.90649408003782, 24.503723190273035], [95.8912963198693, 24.50787353993195], [95.87591567986482, 24.5084839196972], [95.87408435980541, 24.5134887296212], [95.8668822003533, 24.53247072004774], [95.88092039985662, 24.534729000443065], [95.89611816002514, 24.53948972986717], [95.91052247982861, 24.53948972986717], [95.92572023999713, 24.541686990362393], [95.93389908027837, 24.541686990362393], [95.9388116404449, 24.544263059692526]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
