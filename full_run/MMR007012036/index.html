
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin Khin</div><div class="name-mm">ချင်းခင်</div></div>
        <span class="pcode-badge">MMR007012036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.44718482501969, 18.436655843392487], [96.44531130966925, 18.43668719465836], [96.44271131477541, 18.436253861726414], [96.44097798394688, 18.437337194056283], [96.43642799175848, 18.438853858418895], [96.43187799957008, 18.439287189552203], [96.42819467324563, 18.437987191655623], [96.42418634722219, 18.436362195858692], [96.42261449416361, 18.434491915369676], [96.42130468466354, 18.43831219225393], [96.41913802180233, 18.44004552218314], [96.41545469457856, 18.441128853613748], [96.41242136675271, 18.444162182338914], [96.41090470328948, 18.448062175129337], [96.40982137185887, 18.451312169421158], [96.40982137185887, 18.452828832884393], [96.4106880368235, 18.456728826574135], [96.4106880368235, 18.45954548793395], [96.41502136344525, 18.458028823571397], [96.42108801909689, 18.45889549033467], [96.42672134181652, 18.461278818762537], [96.43018800257431, 18.462795483125092], [96.4360379926593, 18.462578815759798], [96.4376098358253, 18.46174050012405], [96.43928798695111, 18.460845485830532], [96.43972131988306, 18.457812158004742], [96.44025818097032, 18.456278269826328], [96.44123798424562, 18.453478832282315], [96.44275464770891, 18.44827884069599], [96.44470464500341, 18.44437884790557], [96.44812797192844, 18.438203859020916], [96.44718482501969, 18.436655843392487]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
