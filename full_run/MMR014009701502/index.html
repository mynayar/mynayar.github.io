
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlaung</div><div class="name-mm">ပင်လောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Hpa Yar (North) Ward</div><div class="name-mm">ဘုရားမြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014009701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.78113059272624, 20.130053730962118], [96.78101896724047, 20.129606028080048], [96.7810665564607, 20.129284800844346], [96.78129855390881, 20.127904713460737], [96.78139968100146, 20.127202772464045], [96.78153055135687, 20.126262885366657], [96.78139373234904, 20.126250988061656], [96.78119742681594, 20.126262885366657], [96.78092378880024, 20.126364012459476], [96.78062635617454, 20.126524626077355], [96.78035271815878, 20.126685239695234], [96.77997795305043, 20.12681611005047], [96.77978263895949, 20.12687931448363], [96.77978263895949, 20.127010184838923], [96.7797737159807, 20.127203516045597], [96.7797499213707, 20.127411718883707], [96.77974694704449, 20.127602075764173], [96.77981535654828, 20.127970892220105], [96.77994622690375, 20.1284110925061], [96.78012171215283, 20.12894944555876], [96.78011278917404, 20.129178468680607], [96.78003248236519, 20.12936882556113], [96.78004437967019, 20.129582977051598], [96.78013360945783, 20.129698975775682], [96.78019309598307, 20.12982687180471], [96.7802555568345, 20.129933947549944], [96.78042211910474, 20.130029125990177], [96.78062734761664, 20.130079689536615], [96.78085339641217, 20.130103484146616], [96.78113059272624, 20.130053730962118]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
