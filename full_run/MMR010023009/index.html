
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Hpu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Hpu</div><div class="name-mm">ကျောက်ဖူး</div></div>
        <span class="pcode-badge">MMR010023009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9592492447569, 20.426412842778518], [95.96128918774588, 20.42318293304595], [95.96160341896268, 20.41944891463578], [95.96281644971941, 20.390740509866703], [95.95553826338022, 20.389931823295058], [95.9434079522153, 20.389931823295058], [95.93208632672264, 20.389931823295058], [95.93127764015105, 20.40165779117416], [95.93208632672264, 20.41500113399519], [95.92804289026725, 20.429961850858774], [95.92723420279628, 20.4396661014095], [95.93276345057285, 20.438434317090127], [95.93587021523831, 20.433632956295924], [95.94067157603246, 20.430526191630463], [95.94490807175015, 20.43165592538071], [95.94942699955647, 20.434197822271756], [95.95225133123398, 20.433632956295924], [95.95507566111291, 20.43165592538071], [95.95789999189117, 20.42854916071525], [95.9592492447569, 20.426412842778518]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
