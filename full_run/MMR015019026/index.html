
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hu Lein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hu Lein</div><div class="name-mm">ဟူးလိန်</div></div>
        <span class="pcode-badge">MMR015019026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.15425867589721, 23.36188774442394], [97.1540858396898, 23.37191227233353], [97.14490233977125, 23.37834072164702], [97.14092282263022, 23.39425878931172], [97.14061670599625, 23.410482972711065], [97.14643292294107, 23.427013272744375], [97.15101595981872, 23.435137748108616], [97.15233020027858, 23.433659226691987], [97.16681535924147, 23.429520611387147], [97.17647213188343, 23.415725220742388], [97.18543913530789, 23.412276373755674], [97.19854475493656, 23.40744798743475], [97.20202710796474, 23.394389163129404], [97.20000334108141, 23.389667038902758], [97.20306450742112, 23.3740550887714], [97.21041130663656, 23.356300322202173], [97.21224800733972, 23.3495657553554], [97.21071742416984, 23.33793332236496], [97.21041422673522, 23.3258020498248], [97.19632993967502, 23.332423222054103], [97.18530973995257, 23.340994487805403], [97.17184060715834, 23.34313730514259], [97.16510604031157, 23.350484105257294], [97.15425867589721, 23.36188774442394]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
