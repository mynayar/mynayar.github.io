
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Yar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Yar Kone</div><div class="name-mm">သာယာကုန်း</div></div>
        <span class="pcode-badge">MMR013005040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85006832609241, 17.538555689093812], [95.8559373692143, 17.533383035099064], [95.85946786744819, 17.527926809574637], [95.86460313842417, 17.522149631300522], [95.8551740786209, 17.512155218988198], [95.85004986211152, 17.506723760792966], [95.84932200120943, 17.506663106017584], [95.84772073762201, 17.502535743030194], [95.8465429054308, 17.502464359342753], [95.84643582855068, 17.501536368708514], [95.84768504622798, 17.501286526252215], [95.84825611662654, 17.500751147247684], [95.84872011194369, 17.49918070342676], [95.84929118324158, 17.497324723057545], [95.84971948626531, 17.496396733322626], [95.84862271896338, 17.49433055710955], [95.84672136509897, 17.49161401727315], [95.84568629938326, 17.490222032221084], [95.84469323110778, 17.488788729616203], [95.84199532882144, 17.489354526390343], [95.83684387364593, 17.491500966196668], [95.82997526734476, 17.492144896969478], [95.82589703162279, 17.499872079732768], [95.82353594882505, 17.505238177899628], [95.81602341085181, 17.524985421240274], [95.82946250718902, 17.528252778742797], [95.8323330082618, 17.53093191307738], [95.83460687840477, 17.53305419259698], [95.83518634487399, 17.53359502868767], [95.84510766568627, 17.537792510016402], [95.85006832609241, 17.538555689093812]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
