
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pi Pin Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mrauk-U</div><div class="name-mm">မြောက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pi Pin Yin</div><div class="name-mm">ပီပင်ရင်း</div></div>
        <span class="pcode-badge">MMR012003016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.25436043298765, 20.556260561575698], [93.25436043298765, 20.545483260644005], [93.25581682478668, 20.53965769344785], [93.25583426174182, 20.539492042823554], [93.2554763837282, 20.539414534753007], [93.25184323687591, 20.53816571277747], [93.2501431243058, 20.53723482093028], [93.24433623782716, 20.53510972203611], [93.2447555764088, 20.531775722971304], [93.24560111539921, 20.529441142294957], [93.24644662830929, 20.527106556222634], [93.24771683526382, 20.524838028052613], [93.24601710940215, 20.524040428323133], [93.24498246996507, 20.523837585336366], [93.23723916505548, 20.52231928061036], [93.23200156022386, 20.521793018033406], [93.22789725135715, 20.521931794216982], [93.22606819129408, 20.520610123558413], [93.22351354111709, 20.52460423040094], [93.22337877590985, 20.52927118301875], [93.2240888140476, 20.530870304421057], [93.22479886657447, 20.532469423125406], [93.2270669252984, 20.534733186687276], [93.23316393666641, 20.54165858427632], [93.23713482121508, 20.546453299979873], [93.23883806522457, 20.54938435600326], [93.24111013492484, 20.553914635052422], [93.24323697310786, 20.556045038148056], [93.24449337367031, 20.5598705239056], [93.2487656039495, 20.56070394363212], [93.25088458655449, 20.557900835055534], [93.25291974964676, 20.55623439490148], [93.25436043298765, 20.556260561575698]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
