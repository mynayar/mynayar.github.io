
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Kaing</div><div class="name-mm">ပေါက်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009014009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75419512740325, 19.380141234430482], [94.7515256985522, 19.37868518167585], [94.73952675495582, 19.37011450767841], [94.73904925991548, 19.370100463865356], [94.72981332502496, 19.369828819144743], [94.72361014419283, 19.36689953928237], [94.71952851622808, 19.364972103279968], [94.7085072651982, 19.362676009090592], [94.70581543693294, 19.362115211647733], [94.69773898626528, 19.361156989403582], [94.6972447629355, 19.36782899491226], [94.6929594259368, 19.374399844677157], [94.69187548836317, 19.376025752386624], [94.69781614090226, 19.381542073308083], [94.72495660916024, 19.394398084304214], [94.7249473929079, 19.39496946317024], [94.72838487875919, 19.39496946317024], [94.74110264237311, 19.39945808472288], [94.74238364658805, 19.39639790763738], [94.7515256985522, 19.38382758607429], [94.75419512740325, 19.380141234430482]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
