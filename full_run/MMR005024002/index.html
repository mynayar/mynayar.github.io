
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aing Gyi</div><div class="name-mm">အိုင်ကြီး</div></div>
        <span class="pcode-badge">MMR005024002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36937172622424, 23.7542707278119], [95.37238296040533, 23.74868006982939], [95.38488756041266, 23.741699220043017], [95.40228276004143, 23.729919389967904], [95.42211911990154, 23.719726529655645], [95.43951432042962, 23.710327109708373], [95.45007312027832, 23.701904279758764], [95.4456786001873, 23.6934814498091], [95.4578858402594, 23.686706519590246], [95.45507819999898, 23.682678209731648], [95.44671647988167, 23.681701619734042], [95.43609611964024, 23.677673309875388], [95.42932128025296, 23.66931149982588], [95.42590920024946, 23.660293049784457], [95.4208983603711, 23.66369631013663], [95.41412352008444, 23.671508760321103], [95.40411372037198, 23.678283689640637], [95.39227296032891, 23.68328859039616], [95.37567155989461, 23.6959228798371], [95.36871348004314, 23.705078130251536], [95.36090076006207, 23.716918980226808], [95.35681079987859, 23.724268919874817], [95.35612910117715, 23.733642797277298], [95.35918509371714, 23.73899077770227], [95.361222419679, 23.7443387608252], [95.36555173892168, 23.74943207932705], [95.36937172622424, 23.7542707278119]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
