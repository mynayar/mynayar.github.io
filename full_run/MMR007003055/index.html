
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chan Thar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chan Thar Gyi</div><div class="name-mm">ချမ်းသာကြီး</div></div>
        <span class="pcode-badge">MMR007003055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.69115223608691, 16.99901843705129], [96.68868097284866, 16.990450101291174], [96.68965288906963, 16.986015734038972], [96.69190044504955, 16.98303924066846], [96.6906855499982, 16.980487961150516], [96.68983512319244, 16.979880514074523], [96.68983512319244, 16.975500668221287], [96.68706127855523, 16.976257170731913], [96.68294446641403, 16.981403184109695], [96.68017210565819, 16.982837163904037], [96.67299550493868, 16.986549201084813], [96.671500016013, 16.98721386213009], [96.6637326749231, 16.990666011427322], [96.6589297277248, 16.996498161660895], [96.65674931063222, 16.996407312147767], [96.65935185510409, 17.001753954381513], [96.66653258730912, 17.005857229927244], [96.67412987199606, 17.00906285796458], [96.6761068948174, 17.00483141104081], [96.68021016856449, 16.998676496822895], [96.68412996262771, 16.996324620384996], [96.68499732276831, 16.99936037727963], [96.69115223608691, 16.99901843705129]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
