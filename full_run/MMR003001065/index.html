
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Zi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hpa-An</div><div class="name-mm">ဘားအံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Zi</div><div class="name-mm">မင်းဇီ</div></div>
        <span class="pcode-badge">MMR003001065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.57877800000477, 17.10272399981278], [97.58009200034559, 17.10272499985888], [97.58178099999321, 17.103096999926663], [97.58684999992761, 17.105328000287045], [97.59060400037436, 17.10514299984959], [97.58966600028572, 17.102354999883403], [97.58741299981017, 17.097894000108056], [97.58572300011645, 17.09398999993857], [97.58328300001051, 17.09157400004011], [97.58234499992187, 17.088228000421907], [97.58309500033408, 17.086183999691855], [97.57990399976984, 17.086741000197037], [97.57859000032829, 17.088412999960042], [97.57708800031105, 17.09064300027427], [97.57727599998748, 17.093060000218884], [97.57727599998748, 17.094546000397656], [97.57765200023965, 17.096591000274486], [97.57765200023965, 17.09863500010522], [97.57783899986998, 17.10030799991432], [97.57877800000477, 17.10272399981278]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
