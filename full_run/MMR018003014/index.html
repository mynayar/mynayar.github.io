
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Lunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Lunt</div><div class="name-mm">ညောင်လွန့်</div></div>
        <span class="pcode-badge">MMR018003014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17204927255597, 20.225889934173154], [96.16893460734633, 20.22900460028211], [96.1664428737397, 20.23056193288693], [96.16581994123737, 20.236168330803878], [96.16581994123737, 20.23979811509099], [96.16581994123737, 20.241463262919297], [96.1664428737397, 20.24738112843636], [96.1676887414423, 20.250807261246166], [96.16675434133987, 20.255790725761415], [96.16889174026164, 20.26039435621459], [96.17059516863219, 20.260354995586624], [96.1718266849536, 20.260469840810572], [96.17799033428656, 20.250448614312177], [96.18361406034069, 20.25169832931448], [96.18467127006312, 20.259687311919947], [96.18611335814501, 20.259759903396855], [96.18800544719369, 20.25959587065296], [96.1909618380185, 20.25948905907285], [96.1939337556384, 20.26010403797102], [96.19323629991538, 20.251269593716813], [96.19136750060972, 20.24130266288762], [96.1898101680049, 20.235696264970727], [96.19012163470575, 20.229778400352927], [96.18794136779997, 20.221991734630876], [96.18326936998551, 20.221368802128552], [96.17735150536771, 20.220745868726908], [96.17204927255597, 20.225889934173154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
