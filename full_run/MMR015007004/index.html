
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ping Ka Lan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ping Ka Lan</div><div class="name-mm">ပိန်းကလန်း</div></div>
        <span class="pcode-badge">MMR015007004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.32792248763275, 23.08016179992717], [99.32758931759298, 23.08637943016663], [99.33513270411106, 23.083911113107433], [99.34378496370516, 23.074105219380442], [99.35416767539795, 23.06891386308439], [99.36975954456739, 23.054397294399678], [99.37003015057104, 23.05074411784682], [99.363973569125, 23.02997869625989], [99.34090087657427, 23.013250994138104], [99.32128908912023, 23.007593747653402], [99.32128908912023, 23.01152054203942], [99.31753977683928, 23.01584667228616], [99.31436728162481, 23.01901916660131], [99.3173976830567, 23.03632368578951], [99.32936453074853, 23.039207772920406], [99.33397906997817, 23.043533902267825], [99.33455588704459, 23.05045570976324], [99.33340225201238, 23.05593547414287], [99.33138339183012, 23.06256887265539], [99.32965293973143, 23.070355906200177], [99.32792248763275, 23.08016179992717]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
