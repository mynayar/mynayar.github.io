
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaik Pa Daing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaik Pa Daing Gyi</div><div class="name-mm">ကျိုက်ပဒိုင်ကြီး</div></div>
        <span class="pcode-badge">MMR007002011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50050915897054, 17.23739455611394], [96.50139315027371, 17.238414534802985], [96.5028594193268, 17.240106364617077], [96.5032611842563, 17.24023540114291], [96.51331759762911, 17.25061638613738], [96.51783034979087, 17.248360008707493], [96.52069750088901, 17.248512575994653], [96.52402228460079, 17.248689495124154], [96.52423616226912, 17.248843529205544], [96.52678402885988, 17.246335713022802], [96.52895833415982, 17.243695486057902], [96.5263782673432, 17.242766661752114], [96.52440787612267, 17.241359238937775], [96.52103006208773, 17.23938884771718], [96.51596334103544, 17.234040641562387], [96.51145958928868, 17.229255405612548], [96.50629478457671, 17.22448789530017], [96.50221506677195, 17.227547682979264], [96.50185375784469, 17.23188338201254], [96.50050915897054, 17.23739455611394]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
