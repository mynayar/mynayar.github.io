
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Pway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Pway</div><div class="name-mm">ဖါပွေ</div></div>
        <span class="pcode-badge">MMR012002002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.87971248414391, 20.656107092968], [92.8802658154151, 20.652963145832587], [92.88383205630441, 20.651993705445193], [92.88393231812205, 20.65038990936688], [92.88407920978779, 20.648040208388977], [92.88827969305345, 20.644086774285256], [92.8913556802205, 20.643510053446278], [92.89223303542633, 20.64334555575283], [92.89297897270148, 20.642226641746163], [92.89420975337748, 20.640380461289283], [92.89420981992731, 20.636674053864567], [92.8932215324478, 20.63420310089242], [92.8938546596649, 20.633397294849317], [92.89379982620108, 20.63339348262315], [92.88937740014694, 20.633086098844444], [92.88089730496671, 20.63430847355727], [92.87529777607159, 20.634405843155207], [92.8605654015721, 20.618410693698593], [92.81517477519577, 20.610810402578068], [92.80789331262633, 20.60925008961999], [92.80517518908374, 20.60862552934475], [92.80222759093061, 20.61786133383356], [92.80090209005948, 20.62448884538395], [92.79723823135936, 20.634515232192257], [92.79955457738191, 20.635338709014263], [92.79953779783114, 20.635368580895317], [92.81707484842559, 20.641844925403063], [92.84599817767383, 20.648178500737288], [92.84678910803098, 20.648178500737288], [92.84726489256082, 20.648178500737288], [92.8736547920351, 20.652612003741012], [92.87971248414391, 20.656107092968]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
