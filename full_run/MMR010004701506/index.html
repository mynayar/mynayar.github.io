
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit No (2) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanmyathazi</div><div class="name-mm">ချမ်းမြသာစည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thit No (2) Ward</div><div class="name-mm">မြို့သစ်အမှတ် (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010004701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09089127438193, 21.93979382621953], [96.1043845815902, 21.939381773506263], [96.10607826217802, 21.939343941321496], [96.10607699210098, 21.9392400813983], [96.10586983889316, 21.93461525102711], [96.10582717236382, 21.93309906123332], [96.0989300738183, 21.933228567820162], [96.09278338614945, 21.933396926141132], [96.09253003332792, 21.933268256240673], [96.09240130554532, 21.932549521628065], [96.09129073945759, 21.932281489198783], [96.09023498155042, 21.93233921343948], [96.08917518625601, 21.93248195059853], [96.09066125956801, 21.93879180441362], [96.09089127438193, 21.93979382621953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
