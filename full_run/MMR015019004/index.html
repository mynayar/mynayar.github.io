
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hoke</div><div class="name-mm">မိုင်းဟုတ်</div></div>
        <span class="pcode-badge">MMR015019004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.44267368244454, 23.222143614236472], [97.43721054563025, 23.217499537673575], [97.42842132828173, 23.217792334448745], [97.41494453776028, 23.217792043967734], [97.40615523857343, 23.221307686300747], [97.4049831971169, 23.22716738007057], [97.40703381325994, 23.235078044316367], [97.41289319136774, 23.23888698704485], [97.40996340338842, 23.24093782532043], [97.39941617331783, 23.24796926107257], [97.39326365219586, 23.25089898699872], [97.38711128036135, 23.247968995772567], [97.3853431889371, 23.24390194491889], [97.37995412658171, 23.25156008582934], [97.37098712405657, 23.263975937139833], [97.35719173431113, 23.285358790076145], [97.33304980270628, 23.299843949039087], [97.3171851053084, 23.315018878118792], [97.31620710967042, 23.32003941358812], [97.33123262898272, 23.322854875252347], [97.35098105043517, 23.326707822707874], [97.37581551037755, 23.325365419978198], [97.37754727188917, 23.3279630622456], [97.39030066934049, 23.319847264439773], [97.41168352317612, 23.3026030268083], [97.41513237016284, 23.289497407179624], [97.4185812171495, 23.281220172972667], [97.43927430176768, 23.26604524479228], [97.44065384110195, 23.25224985594616], [97.44267368244454, 23.222143614236472]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
