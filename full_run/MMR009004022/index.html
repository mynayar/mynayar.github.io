
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bo Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bo Kone</div><div class="name-mm">ဘိုကုန်း</div></div>
        <span class="pcode-badge">MMR009004022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57039548796143, 19.957982102591984], [95.5649699401107, 19.956094956217328], [95.55948375816894, 19.954425247926906], [95.55764648189967, 19.958099798666808], [95.5540485264184, 19.965210044707874], [95.54942258288594, 19.96915066437174], [95.54831072136278, 19.97137438831743], [95.54827568737312, 19.971378908310044], [95.5480942932171, 19.971402314065585], [95.54957298910222, 19.973996818598323], [95.5507235664395, 19.975483690220187], [95.55384610431435, 19.978002245207506], [95.55632470961774, 19.97810139006714], [95.55923537980897, 19.97720909172625], [95.55923537980897, 19.97592697594922], [95.5590291229957, 19.975566025851435], [95.55779157222332, 19.973400312674357], [95.55780173995839, 19.97329863622315], [95.5594743197841, 19.97258181629786], [95.56281948033478, 19.9706702955977], [95.56592570001112, 19.969714535697335], [95.5685540397372, 19.967086195971206], [95.57070450041243, 19.963263156369635], [95.57202183633876, 19.962185335085223], [95.57142132033772, 19.959440115868688], [95.5704655604373, 19.958006476018113], [95.57039548796143, 19.957982102591984]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
