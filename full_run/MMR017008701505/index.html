
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Tha Mar (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Let Tha Mar (North) Ward</div><div class="name-mm">လက်သမားမြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46393584573838, 17.650376047695147], [95.46349147450525, 17.650617553800032], [95.46252065441496, 17.65133139210178], [95.46109297781135, 17.65233076572423], [95.45945114971744, 17.65365850496562], [95.45885106554414, 17.654116751061622], [95.45896573967212, 17.65422957560685], [95.45989372946451, 17.655543038082158], [95.46082171925673, 17.656785116727292], [95.46090737985287, 17.657113482346062], [95.461184428921, 17.657319290225246], [95.4613306879449, 17.657024988530964], [95.46141023927896, 17.656582862541768], [95.46187260905162, 17.655641149713915], [95.46211218027565, 17.65440565572146], [95.46249289403664, 17.65298987642302], [95.46310517484471, 17.652121905010745], [95.46368033272779, 17.651550487156555], [95.46456686017484, 17.650594879648793], [95.46458791878979, 17.650558946233957], [95.46393584573838, 17.650376047695147]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
