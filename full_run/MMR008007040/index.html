
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Pin</div><div class="name-mm">စည်ပင်</div></div>
        <span class="pcode-badge">MMR008007040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85709731568863, 17.633209159974797], [95.8514366337937, 17.63792639368819], [95.86024213966306, 17.64820199342728], [95.86714558839827, 17.656323697081007], [95.88054639879732, 17.664039314562785], [95.89523270192774, 17.66851139758296], [95.89631462142268, 17.654375075749215], [95.89514350896582, 17.651380539280524], [95.89385414105584, 17.649568558242436], [95.89306068360372, 17.648157119955158], [95.8933010103334, 17.647108077875544], [95.88665865277466, 17.647989828068148], [95.8784821129592, 17.64673189865823], [95.87250694893658, 17.643272594354812], [95.86349082094466, 17.638455947783825], [95.85709731568863, 17.633209159974797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
