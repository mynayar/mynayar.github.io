
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Zin Yaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Zin Yaing</div><div class="name-mm">ငဇင်ရိုင်း</div></div>
        <span class="pcode-badge">MMR010016030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.91701144901924, 21.704719222913866], [95.91497023708683, 21.704258304177472], [95.91397667508357, 21.70624542908331], [95.91318182458161, 21.70982225319449], [95.91298311218094, 21.71657847661544], [95.91059856337307, 21.72234113893245], [95.91059856337307, 21.729296074754075], [95.9102011376724, 21.73346903696654], [95.9091802398762, 21.738956361946578], [95.91119469967572, 21.73883427268356], [95.91477152468616, 21.740026547986872], [95.92510457311761, 21.741814959592773], [95.93722603315496, 21.742013672892767], [95.94165210865793, 21.741305500848227], [95.94229771666636, 21.737985229035132], [95.94418548627124, 21.73661230691249], [95.94590163914938, 21.734038076695924], [95.94658809976107, 21.73043415511222], [95.94744617709944, 21.728031540723066], [95.94847586936595, 21.722025004750208], [95.95070686792769, 21.711556470754545], [95.95118955115692, 21.709336130058432], [95.9475590815864, 21.70922611599252], [95.94259126977136, 21.70922611599252], [95.936431182653, 21.70843126638988], [95.93066852213462, 21.70743770258798], [95.92113032330582, 21.705649290982024], [95.91701144901924, 21.704719222913866]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
