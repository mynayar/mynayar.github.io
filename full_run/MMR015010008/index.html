
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Hkam</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Hkam</div><div class="name-mm">နောင်ခမ်း</div></div>
        <span class="pcode-badge">MMR015010008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.681365012985, 23.858047301941497], [97.67981316174809, 23.856057719188414], [97.6764963829018, 23.85213789005161], [97.67106892758898, 23.849122636800303], [97.66217393108212, 23.84761501062428], [97.65508808724547, 23.84610738444826], [97.65037024109381, 23.845494803142685], [97.65039567661921, 23.846986383614762], [97.65046406826218, 23.850996957943323], [97.64877116016095, 23.854215448084517], [97.65586079913663, 23.8600506011544], [97.65952146434415, 23.86981178418654], [97.66225524058694, 23.869088934306944], [97.66344109473079, 23.86542138568842], [97.66262644925126, 23.86155360841235], [97.66479856560136, 23.85718761481661], [97.6660525047194, 23.855857024681995], [97.66675982780384, 23.855106463092852], [97.66955920958992, 23.858261932342373], [97.6703817727007, 23.862585852055474], [97.67085919219801, 23.86257914041505], [97.67387510195448, 23.86253673288394], [97.6781089473701, 23.862020726175615], [97.68087292914242, 23.863122542271583], [97.68120182740245, 23.864048134413906], [97.683402222035, 23.86272789727468], [97.68396934890637, 23.862387620792106], [97.68450145797595, 23.862068355170493], [97.681365012985, 23.858047301941497]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
