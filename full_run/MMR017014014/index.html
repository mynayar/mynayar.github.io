
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Su</div><div class="name-mm">ရှမ်းစု</div></div>
        <span class="pcode-badge">MMR017014014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92869447986641, 16.586565299748827], [94.93397279970497, 16.580132370012905], [94.93248816020048, 16.571555100387627], [94.93067375998612, 16.564297409597827], [94.9300138797368, 16.557864479861905], [94.93108756683779, 16.55528160895915], [94.93065926471337, 16.553211478427045], [94.92973127407907, 16.55142688174527], [94.92890163330378, 16.549076229284594], [94.92720984036191, 16.549946999654367], [94.91945724005961, 16.553245950340397], [94.91137487994683, 16.554070709595635], [94.90230287977414, 16.555390290229752], [94.8938904001219, 16.557864479861905], [94.8938904001219, 16.560998459811117], [94.89537503962646, 16.564627350172145], [94.89718943984082, 16.56743139044636], [94.9016430004242, 16.566606720224], [94.90411727998855, 16.57023551975351], [94.90708620016807, 16.57518398984928], [94.91005548007638, 16.57815299996105], [94.91566355972554, 16.580462219755702], [94.91978735959901, 16.580462219755702], [94.92325128012254, 16.57831796979849], [94.9258904395922, 16.579307609858347], [94.92869447986641, 16.586565299748827]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
