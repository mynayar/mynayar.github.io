
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Bi Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Bi Lay</div><div class="name-mm">တောင်ဘီလေး</div></div>
        <span class="pcode-badge">MMR010022007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01718195508323, 20.94888221514219], [95.01652707236656, 20.940041302064515], [95.01390754329856, 20.933165037136803], [95.01128801333118, 20.926288772209148], [95.00834104200555, 20.922032036349435], [95.00604895339654, 20.916792976414797], [95.00441174660489, 20.911881357838467], [95.00113733482021, 20.908606946053794], [94.99491595170986, 20.90565997472811], [94.99250593500096, 20.90353348907928], [94.9886945685995, 20.90435021019408], [94.98443783363916, 20.90565997472811], [94.97854389188717, 20.91024415194613], [94.97641455898474, 20.905772552761164], [94.97264995013512, 20.90795206423644], [94.96610112566646, 20.91319112327176], [94.96053462527277, 20.917120417773106], [94.95529556623745, 20.91777529959046], [94.94841930130974, 20.920722270916144], [94.9539858008041, 20.926943654026445], [94.96151694934781, 20.935129684387448], [94.97068530288448, 20.94560780335746], [94.97829157359729, 20.95300849894312], [94.98607504043082, 20.9518291855685], [94.99181572961231, 20.950002602238328], [94.99327874581752, 20.94953709695949], [95.00048245300286, 20.94888221514219], [95.0076861601882, 20.94888221514219], [95.01718195508323, 20.94888221514219]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
