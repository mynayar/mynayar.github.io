
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saing Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saing Gaung</div><div class="name-mm">စိုင်ဂေါင်း</div></div>
        <span class="pcode-badge">MMR008014019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64308321661719, 18.23827180230188], [95.64104300473093, 18.237853297391837], [95.63782630603924, 18.237853297391837], [95.63233899544832, 18.235582686391922], [95.63233899544832, 18.232555204159382], [95.63233899544832, 18.227635547442617], [95.63343773496354, 18.224614013326118], [95.62846784031865, 18.222717762214984], [95.62455109765511, 18.22257787806666], [95.62301237831866, 18.23083101404012], [95.62273261092133, 18.240063333655996], [95.62694314590954, 18.24629181061863], [95.6311445797586, 18.250899835159316], [95.6355267206817, 18.251487132025545], [95.63823732409327, 18.252029253247485], [95.64329711496993, 18.252390667395446], [95.64504295356949, 18.24453273489786], [95.64514942520589, 18.243441410292917], [95.64442619041643, 18.243441410292917], [95.6440429991851, 18.242751665357105], [95.64350653020227, 18.241295536160123], [95.64308321661719, 18.23827180230188]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
