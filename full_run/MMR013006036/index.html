
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Yut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Yut</div><div class="name-mm">ပရွတ်</div></div>
        <span class="pcode-badge">MMR013006036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95716262605441, 16.90036937544636], [95.9574401847168, 16.8953733096306], [95.9574401847168, 16.890377244714102], [95.95807682738376, 16.885284115069908], [95.95153210742086, 16.89040606978432], [95.94612878991177, 16.889119567114392], [95.94098277383603, 16.88963416728302], [95.93583675955887, 16.892464475854922], [95.92683123367453, 16.892464475854922], [95.92443692272587, 16.895227141919122], [95.92496576275983, 16.89787134298814], [95.9266311183315, 16.90064693410875], [95.93134962368623, 16.90258984834287], [95.93301497925796, 16.903977644352835], [95.93440277526793, 16.908973709269333], [95.93690080682683, 16.913137096399907], [95.93912128062266, 16.911194182165843], [95.94217443130503, 16.90508788080109], [95.94689293665976, 16.90286740700526], [95.95355435714794, 16.901202052332906], [95.95716262605441, 16.90036937544636]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
