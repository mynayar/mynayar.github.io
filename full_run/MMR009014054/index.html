
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taing Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taing Tar</div><div class="name-mm">တိုင်တား</div></div>
        <span class="pcode-badge">MMR009014054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70600409131583, 19.54021299533349], [94.69949762581484, 19.539917246084087], [94.68776260536004, 19.533740919008267], [94.67726284870156, 19.525711694439224], [94.65811623467653, 19.531888020615725], [94.64514594772737, 19.533123287110072], [94.64885174541178, 19.548564104349964], [94.64761647891743, 19.557210961716578], [94.64267541833595, 19.570181248665733], [94.64300314118208, 19.570685439181716], [94.64514594772737, 19.56832835117251], [94.67046888882822, 19.56956361586822], [94.70629158568818, 19.56524018718494], [94.71016617982542, 19.56457215368198], [94.71032589582347, 19.560495713906107], [94.71099529719527, 19.54341051778124], [94.71194783662344, 19.543419949870838], [94.71243405238965, 19.542521673736303], [94.71370734671672, 19.542400282347216], [94.71308554556151, 19.5405348788816], [94.70600409131583, 19.54021299533349]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
