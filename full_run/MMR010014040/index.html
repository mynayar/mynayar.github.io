
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung Son Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung Son Gyi</div><div class="name-mm">မြောင်းဆုံကြီး</div></div>
        <span class="pcode-badge">MMR010014040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04802819384611, 21.72704471194396], [96.04893309168887, 21.729035488097338], [96.05038092913662, 21.73301704040415], [96.05038092913662, 21.736274672638103], [96.05038092913662, 21.740618184981315], [96.05237170529, 21.742066022429015], [96.05508639971765, 21.742789939803913], [96.05816305328233, 21.74441875682021], [96.0603348090043, 21.74441875682021], [96.06214460468982, 21.74441875682021], [96.06540223872241, 21.742247001098292], [96.06793595358147, 21.741342103255533], [96.06902183189209, 21.73844642925934], [96.06865987185569, 21.73428389738399], [96.06938379102917, 21.72704471194396], [96.07000590784645, 21.72306315963715], [96.06793595358147, 21.72306315963715], [96.0619636260206, 21.72288218006861], [96.05671521583463, 21.721434342620853], [96.05001896999954, 21.721072384383092], [96.04802819384611, 21.724872956221986], [96.04802819384611, 21.72704471194396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
