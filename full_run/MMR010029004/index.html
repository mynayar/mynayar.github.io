
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Ni</div><div class="name-mm">ရေနီ</div></div>
        <span class="pcode-badge">MMR010029004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62817183386312, 21.120841495438697], [95.62817183386312, 21.11828572740444], [95.62504811787642, 21.115729960269505], [95.61823273795056, 21.116581881748516], [95.60942953884222, 21.117149829700907], [95.60653045911346, 21.118217913126216], [95.60403403014641, 21.119137649782772], [95.60055908303531, 21.11924974487988], [95.600342365308, 21.125101107330295], [95.600342365308, 21.131064564877818], [95.60062633973388, 21.139583789560277], [95.6020462100646, 21.14441135120296], [95.60573787490307, 21.14838698866862], [95.60744171965968, 21.151226731128816], [95.60744171965968, 21.143275454398747], [95.61113338359883, 21.138731868081322], [95.61539299728906, 21.13475622881697], [95.61908466122821, 21.13049661692537], [95.62306029869387, 21.129360720121213], [95.62533209320162, 21.127088925613464], [95.62817183386312, 21.120841495438697]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
