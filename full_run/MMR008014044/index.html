
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Twin</div><div class="name-mm">မြို့တွင်း</div></div>
        <span class="pcode-badge">MMR008014044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.76631137656881, 18.288663757326617], [95.76631137656881, 18.283567004313852], [95.76435108743277, 18.28003848278979], [95.76687680641953, 18.27610060515883], [95.76322871823083, 18.275177756848052], [95.76005841736213, 18.27101673673309], [95.75783961270804, 18.266764029836168], [95.75641191377883, 18.267100571434298], [95.75288339225483, 18.270923136193858], [95.75082508780764, 18.270923136193858], [95.75023700133659, 18.28003848278979], [95.74710053835923, 18.287095525837913], [95.74317995828852, 18.28827169967923], [95.73847526292309, 18.293760511238645], [95.73808320527576, 18.296112858022013], [95.73494674139903, 18.302777843422803], [95.74004349531111, 18.302777843422803], [95.7494528851426, 18.303169901070135], [95.7541575814073, 18.302777843422803], [95.75454963905463, 18.29572080037468], [95.75847021822602, 18.293368452691993], [95.76631137656881, 18.288663757326617]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
