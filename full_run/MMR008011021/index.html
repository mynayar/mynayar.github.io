
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maw Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maw Ya</div><div class="name-mm">မော်ရ</div></div>
        <span class="pcode-badge">MMR008011021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66598329059644, 18.330909354683], [95.66518752728263, 18.33130723723923], [95.66092450875914, 18.331875639349335], [95.65808249641015, 18.332444042358702], [95.6560930881256, 18.334149248688902], [95.65268267276718, 18.336422858927847], [95.65040906342762, 18.336991261037895], [95.6484196542437, 18.33670705998287], [95.64358823271084, 18.33585445591848], [95.64126725607906, 18.33386504763388], [95.63676740289338, 18.33386504763388], [95.63193598225985, 18.33386504763388], [95.62995147258243, 18.33406349923115], [95.6310833781954, 18.336138657872823], [95.63278858632424, 18.336422858927847], [95.63506219566386, 18.338128066157367], [95.63449379265444, 18.340685878350655], [95.63449379265444, 18.34295948679096], [95.63449379265444, 18.345233097029848], [95.63619900078334, 18.35063292067281], [95.63847261102222, 18.355464342205664], [95.64216722743566, 18.360011561784177], [95.64362979577851, 18.36230988539296], [95.64614604400481, 18.36057996389428], [95.6501248605739, 18.35603274431577], [95.65381947788666, 18.35233812790233], [95.6572298923457, 18.346938305158687], [95.66035610574971, 18.341538480616464], [95.66376652110813, 18.33670705998287], [95.66598329059644, 18.330909354683]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
