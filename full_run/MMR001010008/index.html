
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si In</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si In</div><div class="name-mm">စီအင်</div></div>
        <span class="pcode-badge">MMR001010008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.30718845908018, 24.262624248710154], [97.30368119662995, 24.255960453112493], [97.30464643808273, 24.252118157227244], [97.30495789668964, 24.247406564061748], [97.3065700681542, 24.236605027300243], [97.30531946012502, 24.23661096282575], [97.30239246274203, 24.23652487522287], [97.2958020886955, 24.239688254009764], [97.29184786498706, 24.24206078787512], [97.28604833676138, 24.245487783134706], [97.27972157828827, 24.247333086752576], [97.2739220500626, 24.248123931674172], [97.28051242320981, 24.254187074573906], [97.28266026595855, 24.259161026959873], [97.28552110741322, 24.26578613192447], [97.28851737867416, 24.27227805538797], [97.28947533112171, 24.272112891296956], [97.29278934455266, 24.27183672298645], [97.2958020886955, 24.27158566104947], [97.30212884806792, 24.26684059241944], [97.30718845908018, 24.262624248710154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
