
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sei Au</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sei Au</div><div class="name-mm">စယ်အူ</div></div>
        <span class="pcode-badge">MMR015002018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.06602085677719, 23.292474263876215], [98.07918234768727, 23.30931453233984], [98.08307847069494, 23.32135709485408], [98.07847396160412, 23.338358359950405], [98.06259053312664, 23.370430668940287], [98.06386758482125, 23.37139955444593], [98.07555417408594, 23.381670509186677], [98.07675813697853, 23.382728631721022], [98.08769566382387, 23.38897924279786], [98.09668004125098, 23.394839163196878], [98.10058622767235, 23.399917674361234], [98.10800818862708, 23.401480431676646], [98.1138677070291, 23.399917969338844], [98.11933673530217, 23.392886426567372], [98.12118345355361, 23.38826977932689], [98.12246199272687, 23.38507353481583], [98.12675903440197, 23.38155779805396], [98.13222795025973, 23.37882338329257], [98.1361344217662, 23.372963748877964], [98.14422022358451, 23.367154552040972], [98.14474012705529, 23.367147299908027], [98.14531486578846, 23.36713928425064], [98.14558536027624, 23.366883863299677], [98.148305592729, 23.366090877092347], [98.15557624005152, 23.359464363789414], [98.14382036521772, 23.334877352308013], [98.1348139454073, 23.316455129600627], [98.13299316899963, 23.301160614970456], [98.13276703087382, 23.299261057052206], [98.11364560596002, 23.29060716698723], [98.09901715711618, 23.28877133682778], [98.08449524286124, 23.287000372069542], [98.06602085677719, 23.292474263876215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
