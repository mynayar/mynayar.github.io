
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Gyi Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Gyi Win</div><div class="name-mm">ငါးကြီးဝင်း</div></div>
        <span class="pcode-badge">MMR007002007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.59383233559385, 17.35773944821699], [96.59093675242923, 17.359582091640277], [96.58692525359766, 17.358347784722525], [96.58260517938555, 17.35711347780483], [96.57951941119194, 17.35433628679027], [96.57427360634193, 17.35032478885796], [96.57149641532737, 17.35526201742823], [96.56748491739506, 17.35711347780483], [96.56223911074642, 17.35896493908075], [96.5554504217996, 17.362359282654836], [96.55265029627424, 17.364226034204137], [96.5550081963712, 17.365423665869514], [96.55556252319195, 17.36570522111913], [96.55904068537939, 17.36745311466956], [96.56544609226341, 17.370672049075836], [96.57062274194607, 17.37293002729899], [96.5706228579586, 17.3738339610685], [96.57956345458979, 17.376540210862117], [96.5888912624219, 17.37952942694153], [96.60076659780032, 17.38333503138665], [96.60493762736968, 17.377674347693016], [96.60672521069995, 17.37350331902303], [96.60685140896538, 17.368394838850804], [96.60402815917229, 17.36704070536433], [96.60173694020767, 17.364210743930755], [96.59895974919311, 17.359273516259805], [96.59383233559385, 17.35773944821699]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
