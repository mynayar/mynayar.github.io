
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Yin</div><div class="name-mm">ညောင်ရင်း</div></div>
        <span class="pcode-badge">MMR005002017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60144161383948, 21.948491228387525], [95.60396679503162, 21.950733862377888], [95.60503755214137, 21.952042565711906], [95.60682214792382, 21.95115026827034], [95.6080118781457, 21.94990105059304], [95.60949904204722, 21.94912772626361], [95.61259234116369, 21.94978207838028], [95.61407950416583, 21.950852834590705], [95.61639947805355, 21.95263743127248], [95.61812458817928, 21.954243567386754], [95.6212178872957, 21.95573073038895], [95.62847524263839, 21.95971632694699], [95.6326014715807, 21.956814971933454], [95.62919538465934, 21.954194904171516], [95.62203950431973, 21.94486114642484], [95.62079500268726, 21.940194267551476], [95.6227924581055, 21.93838916722632], [95.62439298424886, 21.938612495870018], [95.63572901328342, 21.940194267551476], [95.64319601768216, 21.939260895374048], [95.64506277192942, 21.935838517233833], [95.64156531658614, 21.93067745280223], [95.62828639400192, 21.92167507004848], [95.62552825332631, 21.92210411411361], [95.61923937699572, 21.923082382246207], [95.6154069053045, 21.92290817906928], [95.60962167000412, 21.9226452128064], [95.60895406367916, 21.929444811428937], [95.60814408028511, 21.933656639642265], [95.60313647976477, 21.942558989905535], [95.60144161383948, 21.948491228387525]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
