
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Thar</div><div class="name-mm">လက်ပံသာ</div></div>
        <span class="pcode-badge">MMR010021033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53755339437373, 21.877577383689356], [95.53261343995837, 21.87521666871436], [95.52796517974929, 21.871498061086697], [95.52494381110807, 21.868011866154745], [95.52122520258109, 21.863828432236403], [95.51791094903115, 21.86262567173742], [95.517617778138, 21.866143721555545], [95.51556558188616, 21.868782259593672], [95.51204753206798, 21.872300310311118], [95.50852948224986, 21.87611153012307], [95.50647728689734, 21.87845689726805], [95.50794314136294, 21.882854458866234], [95.51116802028798, 21.884906655118073], [95.51468607010611, 21.88578616779745], [95.51791094903115, 21.888424704936256], [95.52113582795613, 21.891063242974326], [95.52465387777431, 21.889890559401863], [95.5284650993849, 21.886079337791273], [95.53227632009617, 21.883440800652465], [95.53491485723492, 21.87992275083434], [95.53755339437373, 21.877577383689356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
