
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Pin</div><div class="name-mm">သပြေပင်</div></div>
        <span class="pcode-badge">MMR009016068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31553198811082, 19.27467770391297], [95.31590071104904, 19.274648206149834], [95.31776071318643, 19.269440198906125], [95.31478470904716, 19.260512187387576], [95.31478470904716, 19.251048493793007], [95.31478470904716, 19.250840173035613], [95.29990468925007, 19.25121217400266], [95.29209267793482, 19.243772163654455], [95.28353666738337, 19.24005215937973], [95.27758465820546, 19.242656161652576], [95.27135056497667, 19.24241638890527], [95.27059266132233, 19.242387239179777], [95.27200465089396, 19.25121217400266], [95.27223612469743, 19.252562442202986], [95.27664326407546, 19.252846772760392], [95.28740298416045, 19.251412143655557], [95.29278284375329, 19.254281402764548], [95.29601075968884, 19.26432380919647], [95.29708673196717, 19.27544218610808], [95.29705105136497, 19.27556905167046], [95.30660069766412, 19.275392207184666], [95.31553198811082, 19.27467770391297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
