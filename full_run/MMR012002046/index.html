
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Chon</div><div class="name-mm">ညောင်ခြုံ</div></div>
        <span class="pcode-badge">MMR012002046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.04147073828398, 20.546736337312154], [93.06159010130222, 20.545979829405667], [93.07819284172632, 20.54764259223191], [93.07768533361133, 20.544239702400375], [93.07705662206553, 20.542586236765487], [93.07618434623066, 20.538334072159728], [93.07594412112434, 20.5371630217561], [93.07365236706318, 20.53034742869096], [93.0729371569243, 20.529055452747002], [93.07261814940813, 20.52814391161229], [93.0707760455781, 20.523985641624108], [93.06966928231157, 20.52083061663967], [93.06837211727947, 20.518559139592696], [93.06736979857737, 20.51629655774002], [93.06592894436534, 20.5120710931065], [93.06507571257413, 20.51076060281963], [93.06478031855693, 20.510032598026044], [93.06464054862249, 20.510092226675], [93.04281817721716, 20.519402076844415], [93.04367648388268, 20.520407521589902], [93.04594655798729, 20.523066751229635], [93.04841042070439, 20.53066366269792], [93.04738381221324, 20.534359458122537], [93.04284905903688, 20.5402364152784], [93.04147073828398, 20.546736337312154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
