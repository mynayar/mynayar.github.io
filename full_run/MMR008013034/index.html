
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Zar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Zar</div><div class="name-mm">မြေဇာ</div></div>
        <span class="pcode-badge">MMR008013034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4061718602432, 18.2245241710537], [95.39875943929673, 18.226500779287562], [95.38997016708959, 18.22884453934404], [95.38250929966449, 18.23134916922885], [95.38143333188282, 18.231710374734064], [95.3685828876902, 18.23763382324239], [95.35781621584573, 18.244150543712692], [95.3606643822555, 18.24609247588711], [95.36308896078697, 18.247957536711], [95.36607305792535, 18.251687658358776], [95.37054920318326, 18.253552718283345], [95.3811800477211, 18.256536815421725], [95.38528318207324, 18.25877488805071], [95.39292993037202, 18.261385973383994], [95.39964414825891, 18.26381055101615], [95.40113619637845, 18.264183563720565], [95.40281475129979, 18.26175898518909], [95.40374728081241, 18.2589613939532], [95.40337426900737, 18.255231273204743], [95.40188221998852, 18.251874164261324], [95.40094968957658, 18.24944958483053], [95.40244173859543, 18.24758452490596], [95.40449330532186, 18.24142982472665], [95.40467981122436, 18.23825922168578], [95.4048663171269, 18.232477534210886], [95.4061718602432, 18.228374400758014], [95.4061718602432, 18.2245241710537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
