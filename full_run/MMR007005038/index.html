
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Ta Dar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Ta Dar</div><div class="name-mm">သံတံတား</div></div>
        <span class="pcode-badge">MMR007005038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74123687568135, 17.790123431751], [96.74559305767355, 17.79064900274932], [96.74891270895444, 17.792972759185545], [96.75289629013173, 17.795628478771334], [96.75754380120554, 17.79728830441178], [96.75953559089487, 17.795628478771334], [96.76351917207217, 17.791976863441562], [96.76783471819772, 17.791644897593983], [96.773146159168, 17.792972759185545], [96.77215026342395, 17.786333456623765], [96.77148633262823, 17.780690050705346], [96.77049043778351, 17.77571057468333], [96.77355693710302, 17.771246204248996], [96.77185138183586, 17.76948799817262], [96.76773077725363, 17.7651384693649], [96.76567047361351, 17.762162476017522], [96.76693511286521, 17.75860708095206], [96.76612831756785, 17.754608032334886], [96.76338125024455, 17.75277665112162], [96.76032384486962, 17.751386310030227], [96.7576581841779, 17.760788942355873], [96.7551400365835, 17.76719877390434], [96.75233203029904, 17.76856428201603], [96.7480434368552, 17.77086153183427], [96.74644098076669, 17.777042442754578], [96.74762901037059, 17.778509404285614], [96.7462168679142, 17.779416461400615], [96.74850128260817, 17.7816208939891], [96.74873020503497, 17.783452275202364], [96.74758559290086, 17.786657189178015], [96.74197928671475, 17.78529497258495], [96.74140468287987, 17.789404260098593], [96.74123687568135, 17.790123431751]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
