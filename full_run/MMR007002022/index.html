
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Ywar Tar Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Ywar Tar Wa</div><div class="name-mm">မင်းရွာတာဝ</div></div>
        <span class="pcode-badge">MMR007002022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6347764898432, 17.337205052571164], [96.63568038674049, 17.337364564423183], [96.63966099475914, 17.340588386644754], [96.64370338260511, 17.339524601079518], [96.64678915079872, 17.33705598724407], [96.65080064873104, 17.330575873677674], [96.65203495744737, 17.326872952924475], [96.65326926436512, 17.3228614540929], [96.65604645537968, 17.31699849578399], [96.65758933857717, 17.31113553657582], [96.65820649203602, 17.3074326149233], [96.65872380995592, 17.305945326016058], [96.65273835499113, 17.303301749975844], [96.65234353282784, 17.30465542390874], [96.64956634181328, 17.308666921840995], [96.64833203489553, 17.313604151310585], [96.64802345771648, 17.317307072063784], [96.64586342106008, 17.31977568679855], [96.64308623004553, 17.32193572435426], [96.63845757775505, 17.32563864600678], [96.63643594586227, 17.329314339785014], [96.6345962378262, 17.333179431685494], [96.6347764898432, 17.337205052571164]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
