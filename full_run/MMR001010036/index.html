
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Pin</div><div class="name-mm">သဖန်းပင်</div></div>
        <span class="pcode-badge">MMR001010036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.149573964367, 24.33442586995801], [97.14369627156572, 24.33748939521945], [97.13657866907039, 24.340916388680455], [97.13236082978852, 24.34697953158019], [97.1278793758326, 24.351988215783592], [97.12594442689385, 24.361043964307555], [97.12547781005293, 24.368820912854915], [97.12485565366552, 24.374731394038633], [97.1214337962328, 24.382508343485313], [97.11878963383458, 24.39075190977286], [97.1238249361719, 24.390544784214455], [97.13117870153593, 24.390757937029207], [97.1367206693235, 24.391397394574142], [97.14769802984029, 24.390757937029207], [97.1556912527492, 24.39097108984396], [97.16261871248366, 24.390757937029207], [97.17061193539257, 24.390225055441988], [97.18457343171855, 24.389798750711805], [97.19224692675431, 24.389479021040017], [97.19669646107286, 24.389281109036006], [97.19336179201315, 24.383445437956652], [97.1859589416519, 24.376715573664853], [97.17484317906951, 24.368564014317883], [97.17081674879398, 24.365611299022305], [97.16274091236329, 24.353161051341488], [97.15702052807495, 24.346094694014994], [97.15197312985612, 24.33768236544887], [97.149573964367, 24.33442586995801]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
