
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel</div><div class="name-mm">အလယ်</div></div>
        <span class="pcode-badge">MMR007005001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67885869527265, 17.91194928603079], [96.6797614644201, 17.913954605120978], [96.67870397770645, 17.91844892118081], [96.68081895023442, 17.921621378623797], [96.68478452338712, 17.922678866236765], [96.68980758325341, 17.921885751426316], [96.69165818387813, 17.925851323679694], [96.69271566969246, 17.930610011642784], [96.69562375703083, 17.93087438444536], [96.7006468159978, 17.930610011642784], [96.7027617894251, 17.928495040014127], [96.70752047738819, 17.926908810393343], [96.71175042244408, 17.92452946686143], [96.71571599469746, 17.920299521805532], [96.71492287988707, 17.91580520484638], [96.71439413697988, 17.911310888786545], [96.71451067562725, 17.908341295014793], [96.71227916535128, 17.90813843044424], [96.70329053233223, 17.908667174250752], [96.70018207874, 17.910320191123958], [96.6987962162724, 17.910782145879352], [96.69615249993797, 17.908402802347496], [96.69430189931325, 17.90813843044424], [96.69139381197488, 17.90813843044424], [96.68795698172937, 17.907609686637784], [96.68187643604875, 17.90893154525463], [96.67885869527265, 17.91194928603079]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
