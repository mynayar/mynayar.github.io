
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayetchaung</div><div class="name-mm">သရက်ချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Se</div><div class="name-mm">ကျောက်ဆည်</div></div>
        <span class="pcode-badge">MMR006003036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.48457702011342, 13.393130759976657], [98.48182067988051, 13.399684289698257], [98.48199590468732, 13.404222424325496], [98.48225296690094, 13.410880059567148], [98.48244332370047, 13.412117380113045], [98.48177707355319, 13.414306483757287], [98.48215778895087, 13.416400408552079], [98.483299929748, 13.418113622445787], [98.48577456904121, 13.419065406443394], [98.48786849473532, 13.419160584393524], [98.48939135003081, 13.419350941193045], [98.49119974007601, 13.420873795589216], [98.49215152497294, 13.422491829734213], [98.49234188177246, 13.42382432823024], [98.4958081198489, 13.423299390354657], [98.50442256025303, 13.42289879993973], [98.52274907980626, 13.420760849733483], [98.54534793306073, 13.419299099773696], [98.54504603964307, 13.403961360128733], [98.54657316042307, 13.392965159714379], [98.54015904000772, 13.392354240355985], [98.52885791995709, 13.39082684977933], [98.5193895597804, 13.389910290427622], [98.50411763971738, 13.385633850421925], [98.49434364044669, 13.396324499875846], [98.48457702011342, 13.393130759976657]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
