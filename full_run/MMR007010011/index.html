
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Gway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Gway</div><div class="name-mm">ဆင်ဂွေ</div></div>
        <span class="pcode-badge">MMR007010011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.41950531661712, 19.180905859118127], [96.42118863434808, 19.179069512747844], [96.42195124865128, 19.173985414994945], [96.420171814078, 19.17068075091595], [96.42042601914551, 19.167121881769503], [96.42500170766272, 19.162037784016547], [96.42525591273022, 19.1592415291733], [96.42322227398881, 19.154665840656094], [96.423476478157, 19.151361176577097], [96.42906898694423, 19.1505985622739], [96.43301697025703, 19.15055619521229], [96.42455161226712, 19.147844675391525], [96.41607811541274, 19.146827856020764], [96.40862143702975, 19.14547209566075], [96.40285131933297, 19.14276057673925], [96.40351291908598, 19.148183614582194], [96.402835038906, 19.153945594313768], [96.40215715872597, 19.16174121098817], [96.403173978996, 19.167842129011092], [96.402835038906, 19.17428198712406], [96.40415994442594, 19.177861710649495], [96.4064447494257, 19.17932371781535], [96.41000361767288, 19.183899407231934], [96.4148335112576, 19.188220889782315], [96.41664235815836, 19.18964212708255], [96.4183923804041, 19.19101714462556], [96.4191549947073, 19.18618725104085], [96.4183923804041, 19.182119971759334], [96.41950531661712, 19.180905859118127]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
