
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Tun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Tun</div><div class="name-mm">မန်တွန်း</div></div>
        <span class="pcode-badge">MMR015008037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.9957008468167, 22.846418058146924], [98.99802659525125, 22.846534004141006], [99.02318483541188, 22.83199843098288], [99.01425226702855, 22.825547710858245], [99.00004883598507, 22.808445620968655], [98.99946910421585, 22.798010448223636], [98.99512111504748, 22.78583607927169], [98.98613527082614, 22.77482117295881], [98.98423979493066, 22.77382702819483], [98.98097673618747, 22.774879627093185], [98.97826251390393, 22.776010554243726], [98.97486973515021, 22.778272405846906], [98.97260788174839, 22.780308071660215], [98.96967006192386, 22.78093760608573], [98.96838543344109, 22.78278487382289], [98.95860892326328, 22.787004489265826], [98.95556034383486, 22.78720785206076], [98.95438266093112, 22.787966801626624], [98.9554094825616, 22.792792861401495], [98.97367103598958, 22.820619989920658], [98.98642513671075, 22.841200471324726], [98.99309205385526, 22.846418058146924], [98.9957008468167, 22.846418058146924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
