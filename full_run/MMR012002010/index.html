
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Hat Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ya Hat Taung</div><div class="name-mm">ရဟတ်တောင်</div></div>
        <span class="pcode-badge">MMR012002010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.92112698562192, 20.471842541999763], [92.92278603424813, 20.46547823323391], [92.91246917001627, 20.460880828787253], [92.91084160035962, 20.459696585329198], [92.9099524784242, 20.45904962024383], [92.90654988896625, 20.46673411758553], [92.90540774816913, 20.468390222730648], [92.90203843092888, 20.47198796777053], [92.90065116282096, 20.472665471134633], [92.8995828275855, 20.47318721641693], [92.89969704058603, 20.474329358113437], [92.89977437328878, 20.474397578885203], [92.90241153086754, 20.476724047676726], [92.90343945776482, 20.47832304497257], [92.90340138676464, 20.479693613569452], [92.90260188766706, 20.482092111761574], [92.89864246407853, 20.487003318448444], [92.89842138913588, 20.487225742374164], [92.89824265967104, 20.487455538942015], [92.89742431527998, 20.488316962657734], [92.9067880771081, 20.492497599684555], [92.91520430423532, 20.494558181215154], [92.9171990697813, 20.48690830957088], [92.9205855478848, 20.473919444426883], [92.92112698562192, 20.471842541999763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
