
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Wa</div><div class="name-mm">ကြို့ဝ</div></div>
        <span class="pcode-badge">MMR009014027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64946937730997, 19.24636524725838], [94.64699884611991, 19.257659101686272], [94.63967293725631, 19.270140280649457], [94.64329305023415, 19.27557045011622], [94.65564570438579, 19.285452573077862], [94.68838023725823, 19.296569961634475], [94.71055482184761, 19.311552789229893], [94.71185027996648, 19.31077551417866], [94.71617370864982, 19.303981554305324], [94.72420293411818, 19.293481797646905], [94.72544186355123, 19.29177826855232], [94.72914399559897, 19.28668783867289], [94.73284979238406, 19.270011755837913], [94.73208760705745, 19.26696301633018], [94.72852636280146, 19.252718040205423], [94.70629158568818, 19.2588943672813], [94.68838023725823, 19.26012963287633], [94.67479231841082, 19.254570937698645], [94.65996913306907, 19.25086514181288], [94.64946937730997, 19.24636524725838]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
