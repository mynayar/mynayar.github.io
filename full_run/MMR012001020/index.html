
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myit Nar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myit Nar</div><div class="name-mm">မြစ်နား</div></div>
        <span class="pcode-badge">MMR012001020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.9133594637683, 20.228678768710267], [92.91333339601948, 20.228339789050096], [92.9144612996493, 20.226760710838164], [92.91570199535084, 20.22495605028155], [92.91592761007121, 20.222700202552346], [92.91581486836157, 20.220105973212128], [92.91525095926443, 20.218414075948886], [92.913784742372, 20.217173336180565], [92.9115290115547, 20.21593258292239], [92.9100628018569, 20.214240672169353], [92.90904773886211, 20.212323186266076], [92.90543853556005, 20.21232312960882], [92.9022804825583, 20.212323081045383], [92.90025028642162, 20.21345097388337], [92.89867123608872, 20.214804459857987], [92.89688859813037, 20.21526948669748], [92.89779009473716, 20.21728002455353], [92.8985490227193, 20.219330895204678], [92.89963354035564, 20.221792033875317], [92.90017594216607, 20.22281755778414], [92.90430231859716, 20.2242551546517], [92.90658224207687, 20.22584546629531], [92.90799368216278, 20.226768903662048], [92.9100563006578, 20.228615358412128], [92.91168507810391, 20.229436355803216], [92.9133594637683, 20.228678768710267]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
