
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Ma Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Ma Nge</div><div class="name-mm">အင်းမငယ်</div></div>
        <span class="pcode-badge">MMR009012041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.10965565998077, 19.364162294354458], [95.12496130372125, 19.356865417405118], [95.13868845380915, 19.35126618438693], [95.15115126142166, 19.34729253622163], [95.15201483811433, 19.347214029004306], [95.15946633010708, 19.3425568457219], [95.17049574518256, 19.34003583738405], [95.16487841061024, 19.334287867291266], [95.15895697838192, 19.329130490080104], [95.15367994727183, 19.32453436626804], [95.15079002084286, 19.32272816157547], [95.14410706608828, 19.319838236045825], [95.1350760462226, 19.32092195778216], [95.1326842956438, 19.32239380443059], [95.13037991600038, 19.323811884211125], [95.12712874899262, 19.327424291797684], [95.12622564709602, 19.334829728609122], [95.12261323861014, 19.337900274877825], [95.11936207160238, 19.33844213619568], [95.10762174604679, 19.340248339988932], [95.0980488648633, 19.34060958056773], [95.09356061203266, 19.340954831200577], [95.09335273464103, 19.340970822045847], [95.09263025438281, 19.343499506996693], [95.0949783185946, 19.353253008919296], [95.10184189408818, 19.360297204252618], [95.1056349224138, 19.362464648624666], [95.10965565998077, 19.364162294354458]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
