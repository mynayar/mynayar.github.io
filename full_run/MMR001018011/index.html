
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zan Yawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khaunglanhpu</div><div class="name-mm">ခေါင်လန်ဖူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zan Yawt</div><div class="name-mm">ဇံယော့</div></div>
        <span class="pcode-badge">MMR001018011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.47794522059553, 27.21748403705874], [98.48466185496068, 27.209447068427494], [98.49505209577768, 27.201124450832765], [98.50708143555988, 27.199375741597237], [98.5151124210015, 27.195522107059617], [98.51622574392303, 27.194816775973493], [98.51644678738938, 27.195825303594916], [98.52714465210408, 27.192875910395003], [98.53532305261683, 27.189038910617285], [98.53098797861236, 27.184947421586287], [98.51382389575622, 27.18212641470234], [98.50884681822612, 27.174684170438184], [98.50484539629804, 27.173826722625222], [98.49773873855202, 27.170907917166687], [98.49151554870366, 27.16507807819079], [98.4781404876934, 27.169806378061935], [98.4668714365676, 27.18075202668473], [98.45992010792668, 27.182158648203085], [98.45138237069989, 27.180214553159146], [98.44723083933184, 27.17916554435442], [98.44439066070049, 27.18974179644681], [98.43791525508499, 27.202614894561805], [98.44422466113929, 27.197791200003905], [98.4489835838254, 27.199575795786416], [98.45255277539036, 27.202946699430697], [98.45592367813532, 27.20750733239754], [98.45988944644085, 27.210481658401875], [98.47794522059553, 27.21748403705874]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
