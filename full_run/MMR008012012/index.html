
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Thone Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Thone Gwa</div><div class="name-mm">ချောင်းသုံးခွ</div></div>
        <span class="pcode-badge">MMR008012012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.415388357187, 18.32089348814401], [95.41347704962618, 18.324044478769736], [95.41062370581943, 18.33201101339762], [95.40529001472248, 18.334677857597114], [95.39165947520468, 18.340604179439367], [95.39069185684377, 18.34051621405206], [95.39069185684377, 18.34065104580918], [95.39202686085099, 18.343167442423578], [95.39431441417895, 18.35106758010477], [95.40207909327557, 18.36614019241597], [95.40821473502206, 18.37565377769971], [95.41005597190565, 18.37565377769971], [95.41770576710752, 18.374334848174726], [95.41533169270349, 18.368267768942417], [95.41533169270349, 18.367212624962747], [95.41691440867311, 18.364047192124247], [95.42034362795613, 18.360617972841226], [95.42324527435, 18.35771632734668], [95.42482799121888, 18.350066532144808], [95.42482799121888, 18.33819615922539], [95.42422420708152, 18.336535752622922], [95.42271770236016, 18.332392866437658], [95.415388357187, 18.32089348814401]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
