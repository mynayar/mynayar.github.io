
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing</div><div class="name-mm">ကိုင်း</div></div>
        <span class="pcode-badge">MMR010017025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38386044740179, 21.616465843024287], [95.37958136159062, 21.616465843024287], [95.37625318473675, 21.62003174666785], [95.37316273467252, 21.625024012847973], [95.36959683102901, 21.628114462912208], [95.36626865417509, 21.629303097759816], [95.36888364976068, 21.63096718618675], [95.37007228460828, 21.63572172467792], [95.37126091855663, 21.64023853727872], [95.36983455781865, 21.644042167711916], [95.36721956133374, 21.648083525834124], [95.36555438023055, 21.650224474380025], [95.36556506597509, 21.65042751341906], [95.36634258114526, 21.656038416939452], [95.36724285107675, 21.65747829089048], [95.36776161240857, 21.658308028792533], [95.36777344658736, 21.658663082934993], [95.36778831507871, 21.659109116092907], [95.37054773908693, 21.657592603715727], [95.3738759159408, 21.652600338434922], [95.37649091242571, 21.64974761516038], [95.38124545091688, 21.647608072254798], [95.38386044740179, 21.645230802559524], [95.38766407783498, 21.64356671413259], [95.3928130409891, 21.63486674190665], [95.39194316274683, 21.633344455881968], [95.3890904403716, 21.628352189701843], [95.38599999030737, 21.620269474356803], [95.38386044740179, 21.616465843024287]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
