
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mon Htaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mon Htaung</div><div class="name-mm">မုန်ထောင်</div></div>
        <span class="pcode-badge">MMR009007045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83363044598838, 20.000259670847186], [94.83146458712105, 20.000067760019135], [94.82552935479595, 19.99769366672939], [94.81929736238345, 19.993242242935196], [94.81039451389574, 19.985229680105704], [94.80208518918022, 19.983449110588026], [94.79110501018812, 19.98701024962338], [94.77626693027469, 19.991461674316838], [94.74777781709264, 19.98997786578593], [94.72569959036389, 19.99733727529508], [94.72786619297051, 20.00501886602791], [94.72886443234773, 20.014801610306108], [94.7289181758332, 20.01532830815495], [94.72953528072867, 20.015413160089338], [94.74574991872385, 20.01764267297102], [94.76531682011523, 20.024375370127302], [94.78067578465982, 20.03005608262214], [94.80760657328477, 20.022271401703904], [94.8147600632264, 20.022481798995898], [94.82527990174611, 20.026268941258706], [94.82969823498564, 20.029004098860128], [94.83332753094084, 20.029056698407942], [94.83332753094084, 20.019040344436405], [94.83363044598838, 20.000259670847186]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
