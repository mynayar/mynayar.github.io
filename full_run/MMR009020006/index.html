
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sauk</div><div class="name-mm">ကျောက်ဆောက်</div></div>
        <span class="pcode-badge">MMR009020006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.98633403978414, 21.512076935801986], [94.98469410534875, 21.511863031154007], [94.98040985473108, 21.52128838125384], [94.97077029331444, 21.525786843188314], [94.94677849543126, 21.529428455358982], [94.93633149660133, 21.529838140617755], [94.93585365801994, 21.529856879791225], [94.93588664155533, 21.530081170709536], [94.93692471999987, 21.53714010503188], [94.93671050778374, 21.54485175380546], [94.9364962946683, 21.5527776165938], [94.93585365801994, 21.557061866312154], [94.93585365801994, 21.55969166743654], [94.9364962946683, 21.55941820428677], [94.95127695736574, 21.563488240889683], [94.95856018170707, 21.563702454005124], [94.9593188506845, 21.565130536944764], [94.96477234406848, 21.56177454136207], [94.9866220179918, 21.550849703950746], [95.01039960365887, 21.54228120541336], [95.01304116611698, 21.541903839090935], [95.01247629204732, 21.541180800353686], [95.01270238071038, 21.53417204190623], [95.01880678270692, 21.516084923680353], [95.01917286433627, 21.516054416877864], [95.0172544035679, 21.514219369128625], [94.99454787988083, 21.513148306249377], [94.98633403978414, 21.512076935801986]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
