
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Kwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Kwe</div><div class="name-mm">သဲကွဲ</div></div>
        <span class="pcode-badge">MMR010023056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1718266849536, 20.260469840810572], [96.16819763361394, 20.266276320795612], [96.15388680283377, 20.272748848580534], [96.14664002441765, 20.274399477753718], [96.1382522509407, 20.278147208127223], [96.1388648043673, 20.279002019127915], [96.1447711270859, 20.288845891224923], [96.15285800179538, 20.2945067026223], [96.15433374160892, 20.295287977857924], [96.1597318448488, 20.298145796691188], [96.17226650019887, 20.29855014087633], [96.1856098430199, 20.295315390992528], [96.19780158957178, 20.2904605870865], [96.19675183432975, 20.28907564282673], [96.19350439411255, 20.285022070112518], [96.19162982026006, 20.279398346756352], [96.18881795588402, 20.269088186070974], [96.18538123625513, 20.262527172191312], [96.18467127006312, 20.259687311919947], [96.18361406034069, 20.25169832931448], [96.17799033428656, 20.250448614312177], [96.1718266849536, 20.260469840810572]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
