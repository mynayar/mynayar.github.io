
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Lit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nansang</div><div class="name-mm">နမ့်စန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Lit</div><div class="name-mm">နမ့်လစ်</div></div>
        <span class="pcode-badge">MMR014013016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.65230043801483, 20.65724775258178], [97.65043774870321, 20.669665678628235], [97.6423109063233, 20.70555923577018], [97.63350682587935, 20.722490157694665], [97.63238649633979, 20.722448664774106], [97.63350682587935, 20.731971475303396], [97.63215235334849, 20.746193450367514], [97.63215235334849, 20.75702924140643], [97.63424512880971, 20.758250027017198], [97.63516896457611, 20.758788931364165], [97.63282958871463, 20.754997529912146], [97.68768578017466, 20.763801610356097], [97.72357933641729, 20.769896742140986], [97.74592815386126, 20.779378058850398], [97.77030868279951, 20.7807325331799], [97.7722832630622, 20.78054447774548], [97.77166315712907, 20.763801610356097], [97.76218184041966, 20.747547923797697], [97.72899723103745, 20.70285028801044], [97.72290209925256, 20.67914699623691], [97.72643334212512, 20.65045564531181], [97.71138907194819, 20.65002580894395], [97.65230043801483, 20.65724775258178]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
