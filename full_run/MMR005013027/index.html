
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung</div><div class="name-mm">ကျောင်း</div></div>
        <span class="pcode-badge">MMR005013027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.10792947966183, 22.501668600425603], [95.10923484021578, 22.500472139677527], [95.11092971963092, 22.494116610093556], [95.11516655978897, 22.4907270302283], [95.11823880038037, 22.48670979012479], [95.11813260033927, 22.486622400303588], [95.11622604029958, 22.479313590250058], [95.11400159959419, 22.47073361996064], [95.11491131960179, 22.470457949874515], [95.11472015970764, 22.467397949955455], [95.11472015970764, 22.46072471957018], [95.1156734401772, 22.454369189986153], [95.1081991197936, 22.459014000395825], [95.10287939966463, 22.469118299969637], [95.09864219977777, 22.472507879834836], [95.09016815973285, 22.474202670217096], [95.08466016023829, 22.479287130396813], [95.08381272008103, 22.489879590071098], [95.08381272008103, 22.493692890014927], [95.0931342002832, 22.493692890014927], [95.0999133600136, 22.494116610093556], [95.10330311974326, 22.499201070273216], [95.10792947966183, 22.501668600425603]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
