
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thit Ward</div><div class="name-mm">မြို့သစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012010701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.53041372633766, 20.875598694105392], [92.53142449918083, 20.875527482499194], [92.53245246678048, 20.875537903711965], [92.5336886303497, 20.875595220369284], [92.53434110164714, 20.87554658805539], [92.53463294778304, 20.875485797640888], [92.53459762882392, 20.875204424544762], [92.53430020601027, 20.874502726379678], [92.53386746511148, 20.873740914711505], [92.5333439832383, 20.87259877391432], [92.53304793203876, 20.871939647562034], [92.53282982197543, 20.87140004645039], [92.53266052165101, 20.871008966834644], [92.53211414832995, 20.871087980116286], [92.53174051092032, 20.87114182463207], [92.53126835220365, 20.87118003685737], [92.53091330371987, 20.87125819819704], [92.53110928126836, 20.87176343773251], [92.5281652905692, 20.87205600951768], [92.52825741954433, 20.872720687809533], [92.52829941068933, 20.873175227654656], [92.52838009784938, 20.873952134188198], [92.52838753341972, 20.874556569671796], [92.52849534918967, 20.875470165816036], [92.52858457603374, 20.875958225357824], [92.52864775856727, 20.876130181139082], [92.52947684447469, 20.8758626978143], [92.52994528540617, 20.875689011215904], [92.53025757936051, 20.875612589049005], [92.53041372633766, 20.875598694105392]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
