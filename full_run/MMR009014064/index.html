
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Kaung Net</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Kaung Net</div><div class="name-mm">တကောင်းနက်</div></div>
        <span class="pcode-badge">MMR009014064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64914497476082, 19.413748669965173], [94.65010605594978, 19.413824945964507], [94.65724828368138, 19.418110282963255], [94.6655332691451, 19.424681132728153], [94.67667514534173, 19.430680605425664], [94.68238892770688, 19.435537320391063], [94.68203123585289, 19.435818363926387], [94.68296030567365, 19.43610869835777], [94.6929594259368, 19.449250397887624], [94.69897294784334, 19.457769555120933], [94.70095872196748, 19.4555355591188], [94.70638681489964, 19.44210817015596], [94.71278573497375, 19.435946246622052], [94.71267197613088, 19.435823008924785], [94.70295854620002, 19.424681132728153], [94.68038910437372, 19.40839685213308], [94.67575296972382, 19.40614501538022], [94.66086104290287, 19.39891179334461], [94.66039086474666, 19.398683421302906], [94.64914497476082, 19.413748669965173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
