
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ein Soe Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabaung</div><div class="name-mm">သာပေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ein Soe Chaung</div><div class="name-mm">အိမ်ဆိုးချောင်း</div></div>
        <span class="pcode-badge">MMR017003009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78678061023703, 16.930886600136546], [94.78059444008142, 16.931301120150636], [94.78131839972446, 16.936963560220192], [94.78088064032937, 16.945938719596256], [94.78131839972446, 16.94714265011328], [94.78372643972347, 16.950316770402708], [94.78766664030326, 16.953600420023406], [94.7911417196147, 16.95541400994864], [94.7920527364447, 16.955964800635115], [94.79409821925748, 16.95419705634913], [94.79507496393848, 16.95330387037734], [94.80929838781043, 16.95342022016706], [94.80959284743204, 16.953422628551493], [94.80997864130131, 16.953261419678824], [94.8110468092629, 16.951027978558386], [94.81246320011667, 16.94657646303341], [94.81332229728628, 16.94387644464223], [94.81299722564148, 16.939000399648762], [94.81234708684866, 16.93249900632412], [94.81119387989372, 16.92956005065588], [94.80869544633782, 16.928370320434], [94.80615153856269, 16.92872553555509], [94.80060527831102, 16.930035943104315], [94.79358586919255, 16.93027388932859], [94.78678061023703, 16.930886600136546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
