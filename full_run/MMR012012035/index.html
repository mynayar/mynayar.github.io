
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taik Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Munaung</div><div class="name-mm">မာန်အောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taik Kyun</div><div class="name-mm">တိုက်ကျွန်း</div></div>
        <span class="pcode-badge">MMR012012035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.81288681427515, 18.71410861691919], [93.81090676883235, 18.71383814041792], [93.80961346638844, 18.714015625220952], [93.80944720062786, 18.714038442819913], [93.8077605527074, 18.71488752873654], [93.806871986553, 18.71681852695349], [93.80680833613587, 18.718508155227255], [93.80739203571392, 18.720856221237682], [93.80980682422563, 18.723322380823276], [93.81080931559751, 18.723940099955712], [93.81094735433697, 18.725470971807965], [93.81190573576117, 18.726592324775993], [93.81306255978939, 18.727322280199132], [93.8131912293918, 18.72894816902283], [93.81378158844961, 18.729377028726958], [93.81498234615839, 18.728347790618102], [93.81506410892155, 18.72830639842158], [93.81677424983184, 18.727440616591252], [93.81767491456571, 18.726517728710235], [93.81839320758053, 18.724819080236387], [93.81778782714656, 18.723099078259906], [93.817807445857, 18.72149015604589], [93.8181359987774, 18.7209519315864], [93.81936804479949, 18.720605342762383], [93.81985342419625, 18.718802022195632], [93.81926082312856, 18.717878410360413], [93.81653075838784, 18.7155692778], [93.81413870114022, 18.71486089981073], [93.81288681427515, 18.71410861691919]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
