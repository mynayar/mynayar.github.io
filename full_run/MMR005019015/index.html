
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwe Shauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwe Shauk</div><div class="name-mm">နွယ်ရှောက်</div></div>
        <span class="pcode-badge">MMR005019015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80696371989984, 21.894535350026445], [94.80630023966438, 21.89997638959875], [94.80630023966438, 21.90497255973588], [94.80803796008382, 21.909968729873015], [94.81129631986931, 21.915833760219925], [94.82085431997098, 21.92321934000057], [94.82194044019923, 21.923275050303403], [94.82932619984433, 21.92365386003769], [94.83649451960645, 21.92452272024741], [94.8386152801711, 21.92401367968762], [94.83779771998883, 21.9234366000191], [94.84322832023088, 21.917571569672248], [94.84505028014638, 21.914724870056773], [94.8375806398347, 21.911923710311044], [94.8355804801551, 21.909423690351105], [94.83084684010964, 21.910403159977875], [94.82628492021297, 21.90692754017391], [94.8217233600451, 21.902148630055308], [94.8169443599943, 21.898238580146426], [94.81042764042331, 21.895849169603537], [94.80696371989984, 21.894535350026445]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
