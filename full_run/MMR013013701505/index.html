
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) Ward (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) Ward (North)</div><div class="name-mm">အမှတ် (၂) ရပ်ကွက် (မြောက်)</div></div>
        <span class="pcode-badge">MMR013013701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1995862330183, 16.794560432418052], [96.20060920734909, 16.79407310508975], [96.20120938610432, 16.79379336017547], [96.20174217236342, 16.793550491062376], [96.20296044796635, 16.793002735587834], [96.20260429395307, 16.79226493807647], [96.20215034496249, 16.791311263703903], [96.20189666779703, 16.790773391778657], [96.20113181957788, 16.789230346703164], [96.20092691714359, 16.788830076446914], [96.19974327083531, 16.789340973207402], [96.1991729738537, 16.789600372759026], [96.19845390382466, 16.78992080659998], [96.19706153835938, 16.790559768618493], [96.19604873715957, 16.79103279133028], [96.19335087804063, 16.792377645611907], [96.19441032437703, 16.79446983381581], [96.19542855478403, 16.796413862309976], [96.19573020898201, 16.7962818148539], [96.19672203079716, 16.79583167988818], [96.1977195740991, 16.795372009410755], [96.19809913656599, 16.79520225517996], [96.19862174969404, 16.794969558298533], [96.1995862330183, 16.794560432418052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
