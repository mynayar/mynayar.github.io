
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Zin Neint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Zin Neint</div><div class="name-mm">ပဇင်းနိမ့်</div></div>
        <span class="pcode-badge">MMR009015029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06648617289864, 19.07665622540452], [95.07079343357015, 19.074111025303637], [95.07210259106176, 19.074167945194574], [95.07620081871289, 19.070325856153374], [95.08782669564556, 19.06545920997462], [95.09136645329926, 19.06645957624852], [95.0909586161473, 19.06557592938566], [95.09053038866654, 19.06464810242801], [95.08728595758095, 19.058429608839447], [95.08385688308874, 19.054571898574295], [95.08296005036607, 19.053562962660635], [95.08115757156475, 19.051350830976105], [95.07701192715876, 19.046262993842163], [95.07444368642706, 19.042720592181638], [95.06917121937636, 19.035448225355367], [95.06625593296502, 19.03581263514502], [95.06484531126216, 19.03598896341998], [95.05271939418475, 19.044325531298284], [95.051867587819, 19.044911148230938], [95.04673057305757, 19.054374071106565], [95.04402688003654, 19.059511085867996], [95.04450847598542, 19.0613061227794], [95.04510835706509, 19.060051824831874], [95.04943426517923, 19.062214778888972], [95.05348980381143, 19.06870364016089], [95.06106014211196, 19.075192502332186], [95.06484531126216, 19.0757332403968], [95.06648617289864, 19.07665622540452]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
