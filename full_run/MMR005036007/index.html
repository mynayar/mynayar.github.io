
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maw Hpun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maw Hpun</div><div class="name-mm">မော်ဖွန်</div></div>
        <span class="pcode-badge">MMR005036007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22228996001371, 26.462707560205786], [95.2221070801777, 26.462707560205786], [95.22912600006492, 26.48529054042615], [95.23889172017681, 26.498291040099446], [95.25329603998034, 26.503906229788697], [95.26478363985314, 26.512612560221555], [95.26489272042278, 26.512695269970777], [95.29150391967022, 26.50128174006028], [95.31390384019011, 26.49792482986703], [95.32470708026761, 26.49609377960428], [95.35168439981527, 26.48852540991976], [95.38171379985204, 26.469116190260024], [95.38798751990817, 26.466947279993008], [95.38952075967535, 26.459792729750745], [95.3887719598581, 26.443320030395114], [95.37828948007552, 26.429842440376376], [95.36780663966476, 26.424601109653565], [95.35657536006488, 26.41112342970257], [95.35208291999083, 26.41112342970257], [95.34864275955579, 26.407418669835806], [95.34856212004587, 26.40733181960786], [95.33770740007651, 26.419677750427866], [95.30871587973411, 26.43591311959483], [95.26568615988845, 26.452087379828754], [95.2302855598308, 26.462707560205786], [95.22228996001371, 26.462707560205786]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
