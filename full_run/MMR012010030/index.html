
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da Pyu Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da Pyu Chaung</div><div class="name-mm">ဒပြုချောင်း</div></div>
        <span class="pcode-badge">MMR012010030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.59183190781636, 20.8481387539004], [92.58767736012214, 20.846845409188347], [92.58333445482128, 20.846368188441204], [92.5809981510439, 20.83842840324826], [92.57976835602489, 20.83434166803363], [92.57841354624821, 20.830604648585734], [92.57704935474396, 20.83025125369244], [92.57604409705749, 20.83468252727687], [92.57553490271363, 20.839231698384197], [92.5738902270524, 20.85031198900714], [92.57436932018805, 20.856497088969547], [92.57398806519711, 20.859646431137946], [92.5721817220089, 20.86248472479025], [92.57393112462177, 20.865206018443075], [92.57607671636742, 20.866089497132634], [92.58216356359765, 20.865850487909768], [92.58514217127424, 20.86609108893265], [92.59097874976953, 20.865288395443145], [92.59395548235966, 20.86622890374099], [92.59494450458527, 20.86774805562834], [92.59618026480746, 20.869851172393737], [92.60733578461884, 20.87641108010729], [92.60773384883811, 20.876718705803682], [92.60882793256309, 20.875481077689642], [92.60945588777906, 20.872682249885997], [92.61145294479763, 20.868486400826782], [92.60934802938812, 20.866381409874236], [92.6050111918131, 20.863337835173013], [92.59770066315514, 20.85830366867941], [92.59398492796214, 20.855261276586702], [92.59423818874149, 20.85339503405362], [92.59598653375161, 20.84943212379352], [92.59183190781636, 20.8481387539004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
