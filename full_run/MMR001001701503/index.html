
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yan Gyi Aung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Yan Gyi Aung Ward</div><div class="name-mm">ရန်ကြီးအောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.3905544544246, 25.394313277935453], [97.38932823870732, 25.391088814497266], [97.39161036282803, 25.390321148702128], [97.39189719709805, 25.390107368160557], [97.39225215411369, 25.390013433972854], [97.39311624252065, 25.38961502261526], [97.39457523965564, 25.38932646434489], [97.3939374539504, 25.387307851476237], [97.39215281410117, 25.387889312641732], [97.38506672205165, 25.39024493565529], [97.38357766058061, 25.39073615884672], [97.382695645088, 25.3910616864477], [97.38211480625336, 25.391369399378334], [97.38175178141961, 25.391633383673764], [97.38132959738306, 25.392036646873805], [97.38105710460178, 25.39241237732938], [97.37991342776252, 25.394225801779385], [97.38110372006071, 25.394947281092186], [97.38188757994794, 25.39475458965262], [97.38248993146522, 25.394702766219723], [97.38275886383059, 25.39465147788343], [97.3834848874177, 25.394824227755976], [97.38381833264998, 25.39483718428869], [97.3843597317163, 25.394778882139747], [97.38446012393564, 25.395076868902436], [97.38479894711378, 25.395050956736327], [97.38577624577721, 25.39486627465891], [97.3858933986615, 25.39518780297476], [97.38592017237812, 25.395378824373324], [97.38705955855187, 25.395329508250256], [97.38726572093634, 25.395319791075565], [97.38776095780202, 25.395201164202433], [97.38827950059851, 25.395048527667484], [97.3905544544246, 25.394313277935453]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
