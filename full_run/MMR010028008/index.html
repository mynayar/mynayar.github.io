
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Aung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Aung Kone</div><div class="name-mm">ဆည်အောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR010028008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73558717111109, 20.835654819414458], [95.72864469000052, 20.835654819414458], [95.72401636955988, 20.833340658744476], [95.71971864439996, 20.82937352706665], [95.71806567159354, 20.830695903693027], [95.70913962599303, 20.839291355811497], [95.70413233214146, 20.846895024785624], [95.70021358039247, 20.852845722751965], [95.6978573791148, 20.860437926269356], [95.70153595701885, 20.86144117487038], [95.70616427656017, 20.860779986107502], [95.71277616328939, 20.8578046366747], [95.71905745473782, 20.859127015099716], [95.72037983226352, 20.862763552396075], [95.72236339765271, 20.866400088793114], [95.72401636955988, 20.87102841013308], [95.72566934056766, 20.874664947429437], [95.73525657583036, 20.870036626988792], [95.7425296513224, 20.86706127755599], [95.74980272591512, 20.86441652340386], [95.75410045197435, 20.862763552396075], [95.75744702715866, 20.860811383238797], [95.75509223511864, 20.855159883421948], [95.75674520612642, 20.851192750844803], [95.75443104635576, 20.849209184556287], [95.75112510344081, 20.84788680792991], [95.74682737738163, 20.847225619167034], [95.74186846166026, 20.846564431303534], [95.7412072737967, 20.843589081870675], [95.74021549065242, 20.839952544574317], [95.73823192526322, 20.837968979185064], [95.73558717111109, 20.835654819414458]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
