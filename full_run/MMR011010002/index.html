
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Hlay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bilin</div><div class="name-mm">ဘီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Hlay</div><div class="name-mm">ရွှေလှေ</div></div>
        <span class="pcode-badge">MMR011010002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.27509975005347, 17.15222535081932], [97.27490862613223, 17.15311146722047], [97.2745517076952, 17.154122738673493], [97.27348094968613, 17.15495554955902], [97.27127994891055, 17.155847847899906], [97.26895997412356, 17.15614528068022], [97.26616410688808, 17.15566938823173], [97.26467694388589, 17.154360684897767], [97.26307080777161, 17.151981223554685], [97.26086980699603, 17.15049406055249], [97.25969942388934, 17.14975839173644], [97.25244000010599, 17.15123700038731], [97.25208819971073, 17.157864102746203], [97.24968798381349, 17.163855006703272], [97.25519297507577, 17.168341011228733], [97.25567316088774, 17.169373886195956], [97.25766997508936, 17.173669011415768], [97.26372697472016, 17.18011801113738], [97.26923198756623, 17.182922004646855], [97.27635656430408, 17.17809604469676], [97.28143946595867, 17.173611131948235], [97.28801733942873, 17.164940298655893], [97.28857299544745, 17.163298927103824], [97.2850466269004, 17.162645896091306], [97.28263243284056, 17.160404143436494], [97.27945681428059, 17.155934755684484], [97.27797648612597, 17.153851333172554], [97.27577801514332, 17.152608717418445], [97.2754193313371, 17.152405983249594], [97.27509975005347, 17.15222535081932]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
