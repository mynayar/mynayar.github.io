
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Kei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Kei</div><div class="name-mm">လင်းကယ်</div></div>
        <span class="pcode-badge">MMR009013026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89664736898095, 19.668335792862592], [94.88925443094729, 19.658926599982635], [94.87226314203042, 19.653667391636873], [94.85850828922622, 19.653262837010345], [94.85163086327378, 19.645171747178438], [94.84513612313361, 19.64757720612323], [94.84758531790817, 19.65002640089773], [94.84677620865517, 19.65528561014287], [94.83908967344973, 19.6662085805616], [94.83140313734498, 19.67268145278689], [94.82960135012229, 19.674639918097796], [94.82209838363354, 19.682795315751264], [94.81558800338371, 19.68800361977128], [94.82452571139254, 19.692100070362017], [94.82776214660583, 19.7018093778006], [94.83170939697118, 19.70606026267103], [94.83302135495165, 19.70747314077289], [94.84151700030935, 19.709495913006037], [94.84960809014132, 19.710305022259035], [94.85689007072023, 19.717991558363792], [94.86214927996537, 19.7260826481957], [94.86862215219065, 19.73053274818784], [94.87093504301788, 19.73185439996064], [94.87873601425571, 19.729319084308372], [94.88239646362598, 19.727145691820283], [94.87942733570304, 19.721999203600433], [94.87298067062153, 19.707787238890035], [94.87048991457795, 19.696212545972287], [94.87107597487642, 19.68683557939852], [94.87825521510615, 19.67936330856986], [94.89246717981655, 19.67042588834414], [94.89664736898095, 19.668335792862592]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
