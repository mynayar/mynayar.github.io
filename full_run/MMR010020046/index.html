
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Taing (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Taing (East)</div><div class="name-mm">အင်တိုင်း (အရှေ့)</div></div>
        <span class="pcode-badge">MMR010020046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03063653774609, 20.851427740997508], [95.02316314726147, 20.857202634094335], [95.0225584790906, 20.86324929691756], [95.02793019712095, 20.863735286054634], [95.03411305957007, 20.864441898674727], [95.05402495169022, 20.86104782669588], [95.07348430135949, 20.8574274825923], [95.08469547481639, 20.85373247407449], [95.07846227371505, 20.842493563727032], [95.07300939366866, 20.83654706199735], [95.0706034356001, 20.83517222881534], [95.06716635444377, 20.831735145860364], [95.06476039637528, 20.83654706199735], [95.06407297888495, 20.83860931087105], [95.05926106364723, 20.841015268939543], [95.05410544011403, 20.841358977235075], [95.04654385761302, 20.841358977235075], [95.04073323804857, 20.839366763965018], [95.03990711721974, 20.841287295872064], [95.03973966975002, 20.84167675088139], [95.03859100886802, 20.844475063373523], [95.03833202660178, 20.845106022325126], [95.03832881062618, 20.845356314442427], [95.03831128463816, 20.846610045816988], [95.03137013182618, 20.85086087313084], [95.03063653774609, 20.851427740997508]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
