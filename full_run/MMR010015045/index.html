
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone</div><div class="name-mm">ကုန်း</div></div>
        <span class="pcode-badge">MMR010015045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12903148761313, 21.395247229176334], [96.12667657686256, 21.393481045214116], [96.12954600684282, 21.37597752404355], [96.12667657686256, 21.37640793777615], [96.12226111785634, 21.37640793777615], [96.1125471087621, 21.37699666636314], [96.10665983008715, 21.37787975834425], [96.10152625972916, 21.386632919173906], [96.10041618336021, 21.38836097727733], [96.09894389064812, 21.39053890144919], [96.09900222697127, 21.391083161258962], [96.09904818592508, 21.391511955312524], [96.0991152043033, 21.39213722335421], [96.09922671124377, 21.392473414216738], [96.0995693178698, 21.393506997849727], [96.09875243038044, 21.394364925900675], [96.09817683009669, 21.396891053179615], [96.10342182735553, 21.397307775633408], [96.10754292206826, 21.397307775633408], [96.1125471087621, 21.397307775633408], [96.11784565885011, 21.397307775633408], [96.12108366158179, 21.395247229176334], [96.12903148761313, 21.395247229176334]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
