
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Saunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Saunt</div><div class="name-mm">နတ်စောင့်</div></div>
        <span class="pcode-badge">MMR010018046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34020480300933, 21.255483028818787], [95.3444998769678, 21.255483028818787], [95.35821725412302, 21.258184936685552], [95.3694405621323, 21.25880845374718], [95.38461281303097, 21.25984764914972], [95.39084798364757, 21.262757395737253], [95.39597441428782, 21.26663119577313], [95.40068116910072, 21.256335168833004], [95.4012162711141, 21.255341408079573], [95.39102760344122, 21.253332374789295], [95.3860028591447, 21.251178913975764], [95.37936301968767, 21.246692536231592], [95.37774792362785, 21.242744523241186], [95.37433827629047, 21.23502795337737], [95.37003135376403, 21.233412857317546], [95.36177641824719, 21.235925227667167], [95.35603385397923, 21.237360869408633], [95.34616382330188, 21.23825814459775], [95.33513992466783, 21.237134038804925], [95.34020480300933, 21.24810794142843], [95.34020480300933, 21.255483028818787]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
