
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward</div><div class="name-mm">အမှတ် (၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1978317879068, 16.89259928872619], [96.1980582704431, 16.892715352237975], [96.2021954603523, 16.894835488966724], [96.20261955275025, 16.89412403079949], [96.20387077321766, 16.89188385015968], [96.2049617767647, 16.889892577580458], [96.20543098455242, 16.889074325819514], [96.20644277671283, 16.887266158806327], [96.2027225494062, 16.885377883782365], [96.20203031694568, 16.88502188894904], [96.20139145556011, 16.88471977407059], [96.2012992369748, 16.884676164247185], [96.20127588005107, 16.88471977407059], [96.20106780306915, 16.88510827514864], [96.20072347457551, 16.88576724236881], [96.20046317599471, 16.886210043640027], [96.20041865918756, 16.88628577233456], [96.20007433069392, 16.886950136771212], [96.19958323923565, 16.887706321089215], [96.19925020020071, 16.888419292099638], [96.19852203010748, 16.88976420735461], [96.19808644812677, 16.89051798109437], [96.19786449156571, 16.890902075317772], [96.1978587744025, 16.890911968816937], [96.19739308422658, 16.891867981270185], [96.19716165032094, 16.8922973751176], [96.1978317879068, 16.89259928872619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
