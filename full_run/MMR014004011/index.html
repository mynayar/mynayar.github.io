
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Mun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsihseng</div><div class="name-mm">ဆီဆိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Mun</div><div class="name-mm">နောင်မွန်</div></div>
        <span class="pcode-badge">MMR014004011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.32175217832042, 20.58948515121881], [97.32353037182924, 20.573481409639385], [97.32929578337377, 20.548497962610952], [97.34178750598869, 20.524475418705663], [97.34418975974967, 20.515827303187564], [97.34178750598869, 20.505737834333615], [97.33848200374155, 20.4962345157104], [97.3350611931196, 20.497089717916197], [97.28509430086137, 20.505257383221704], [97.25963040362029, 20.51438594985177], [97.24521687655766, 20.511022793866914], [97.24490230359851, 20.512240053235928], [97.2341786076567, 20.55373609444524], [97.24067068760223, 20.553736216753066], [97.25092473328988, 20.556373294292143], [97.2617647385519, 20.558424408659562], [97.27319066921405, 20.561647482645242], [97.27612034927478, 20.564577408220885], [97.27963580814611, 20.575417990847654], [97.283151355151, 20.582156756629047], [97.28403010790322, 20.590067419975526], [97.28959650667349, 20.595341289968587], [97.29545599269994, 20.595341402383838], [97.3013156495976, 20.587430867640478], [97.30776106102422, 20.58860293787535], [97.3147924194347, 20.58977501980138], [97.32175217832042, 20.58948515121881]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
