
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mindon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009014902</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.88480831225388, 19.50569021992777], [94.8836910583957, 19.504973490834004], [94.875164494346, 19.503005821861223], [94.86303053912815, 19.503989655897954], [94.85483192095643, 19.5062852698494], [94.8520918593519, 19.508038909168363], [94.84663330188545, 19.511532385011606], [94.8377787937564, 19.516779501073188], [94.82990812056335, 19.52399428520812], [94.8284315111054, 19.524289607279627], [94.82859634244733, 19.525306064223514], [94.83351551263087, 19.532192904279157], [94.83745084967705, 19.537767964420084], [94.84204207578125, 19.53973563339281], [94.8522083629257, 19.544326858597685], [94.86335848410681, 19.545310692634416], [94.87713216331872, 19.545310692634416], [94.88569710683606, 19.542455712061496], [94.88903725996164, 19.53891908135057], [94.8887932226292, 19.533550272627053], [94.88976936656309, 19.525497065836987], [94.8848886352024, 19.525008992071378], [94.8848886352024, 19.519396146914687], [94.88464459786996, 19.512075051222666], [94.88480831225388, 19.50569021992777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
