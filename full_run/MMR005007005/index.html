
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Taw</div><div class="name-mm">သင်တော</div></div>
        <span class="pcode-badge">MMR005007005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69187323985818, 23.609386529664675], [95.69131811983544, 23.60522376036829], [95.68923696001775, 23.60036727023339], [95.68819619979485, 23.59100115038285], [95.69027772024066, 23.582328840403704], [95.68021751982275, 23.579206739599385], [95.66842319987086, 23.572268909782395], [95.65628183963526, 23.575044060235257], [95.64899724023053, 23.57712539991735], [95.63720292027858, 23.580594360241605], [95.63194980034308, 23.580594360241605], [95.63269319973142, 23.58406331966654], [95.62922424030648, 23.59065428996354], [95.62402079982013, 23.596898309909136], [95.61638916013169, 23.60036727023339], [95.61222864003975, 23.602447529829703], [95.6122419598986, 23.602476600414832], [95.6059999130656, 23.605679054744655], [95.61148796919446, 23.612264721739564], [95.6150939664135, 23.615954583437315], [95.61093916421112, 23.61473434911096], [95.61121356715245, 23.619673600256476], [95.61513928235206, 23.62383023977378], [95.61787812627455, 23.622273997147317], [95.62644899992148, 23.619099509934472], [95.63546844011648, 23.618752650414535], [95.64865019994681, 23.61597749996173], [95.66495424044592, 23.613202350408187], [95.67123620098994, 23.611557271850643], [95.6795237998835, 23.609386529664675], [95.69187323985818, 23.609386529664675]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
