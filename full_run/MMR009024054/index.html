
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shea</div><div class="name-mm">ရှဲ</div></div>
        <span class="pcode-badge">MMR009024054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.3219820762119, 21.875611987303444], [94.32428527414612, 21.857682087658247], [94.3232812863024, 21.849648505873915], [94.32236969570494, 21.841898283379123], [94.31763535508765, 21.84505450985779], [94.31215170563678, 21.848070516741018], [94.30474877973245, 21.848070516741018], [94.29789421904303, 21.844506144642935], [94.28966874531642, 21.84642542199566], [94.2869269201413, 21.847522152425427], [94.278701447314, 21.851909071446528], [94.27376616217867, 21.854297112321944], [94.27376616217867, 21.86068291038805], [94.27184688482595, 21.866166558939597], [94.27321779696382, 21.86808583629238], [94.28281418282836, 21.86287637034826], [94.2932331174145, 21.860134545173196], [94.2992651311809, 21.86452146419424], [94.30310368498715, 21.875762944804137], [94.30383864873471, 21.876089595658357], [94.30557132665547, 21.876859675233902], [94.31736117337948, 21.875488763095973], [94.3219820762119, 21.875611987303444]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
