
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khwet Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khwet Ma</div><div class="name-mm">ခွက်မ</div></div>
        <span class="pcode-badge">MMR008009013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8451671720274, 17.943284865004557], [95.8521440018443, 17.941191816149455], [95.8465655251789, 17.9328487893402], [95.84372534564824, 17.91864789708285], [95.83791126639187, 17.90946681634057], [95.83461511439606, 17.907647636229456], [95.83366924793751, 17.908094692815894], [95.83319236443612, 17.90944873007487], [95.83129695329183, 17.91124927983043], [95.82712936902522, 17.91179193884693], [95.82176355234611, 17.909645613254497], [95.82015380725244, 17.904458654643236], [95.81675545540003, 17.898198534135076], [95.81294811976, 17.896729957421655], [95.80818996959147, 17.902850815213014], [95.80749228634, 17.914711426890904], [95.81481795868189, 17.9213078488782], [95.81795753241425, 17.931773094053085], [95.8193528989172, 17.939098767294297], [95.8238878382532, 17.943284865004557], [95.83435308432746, 17.943284865004557], [95.8451671720274, 17.943284865004557]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
