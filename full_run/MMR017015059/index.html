
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Za Li Sar Hpyu Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Za Li Sar Hpyu Su</div><div class="name-mm">မဲဇလီစာဖြူစု</div></div>
        <span class="pcode-badge">MMR017015059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08183595986173, 16.731270000410234], [95.08185936022136, 16.727301449602294], [95.08189355964015, 16.725690539886557], [95.08213547996849, 16.723709909884462], [95.08283063972232, 16.72276617032253], [95.07827483971215, 16.721055809977713], [95.06710511960563, 16.714175669871338], [95.06306304022718, 16.71086906955196], [95.06253851963703, 16.7112624599946], [95.06163923985912, 16.711655850437182], [95.06045879963398, 16.711749540009293], [95.05727388028538, 16.716726540197726], [95.05637927968007, 16.718089229834163], [95.05548467997409, 16.719451920369863], [95.05631087994323, 16.722506160131218], [95.05455192023499, 16.728936749831178], [95.0550584399951, 16.728964559566805], [95.07274019960062, 16.729937009985065], [95.08151015976614, 16.73041931999569], [95.08183595986173, 16.731270000410234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
