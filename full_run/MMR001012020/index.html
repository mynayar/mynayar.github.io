
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hkat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hkat</div><div class="name-mm">မိုင်းခတ်</div></div>
        <span class="pcode-badge">MMR001012020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.43206617711246, 24.485409559803372], [97.43432308514235, 24.482024198657882], [97.44598377393208, 24.47863883841171], [97.45802061316084, 24.47788653573508], [97.46892900017326, 24.474125023251247], [97.47419511711104, 24.471491963883068], [97.46479133635114, 24.47036351076747], [97.45877291583747, 24.466601998283636], [97.45463525201535, 24.462840485799802], [97.45350679800038, 24.457574367962764], [97.45463525201535, 24.447418285425556], [97.45802061316084, 24.439895259558625], [97.44824068106266, 24.434252991282563], [97.43206617711246, 24.429739176122155], [97.4181485811921, 24.42710611675392], [97.40836864909392, 24.42861072210718], [97.41137785890112, 24.43613374707479], [97.4166439758389, 24.448922889879498], [97.4170201280765, 24.45456515815556], [97.4170201280765, 24.459078973316025], [97.42228624501428, 24.463216637138146], [97.4234146990292, 24.4711158134441], [97.4241670008065, 24.476005779043533], [97.42680006017468, 24.47976729242663], [97.43206617711246, 24.485409559803372]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
