
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Nant Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bahan</div><div class="name-mm">ဗဟန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Shwe Nant Thar Ward</div><div class="name-mm">ရွှေနံ့သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013044701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15429023690496, 16.801308435136207], [96.15427284221795, 16.80114555442384], [96.15427207959289, 16.800672530812676], [96.15430259718715, 16.800100326369034], [96.15433965375206, 16.799303054892107], [96.15429464987824, 16.79889555858324], [96.15356254597475, 16.798461913586493], [96.15223480669101, 16.797600801935516], [96.15179061894196, 16.798692703905203], [96.15166282617855, 16.79907035801068], [96.15150165507737, 16.79953002938737], [96.15143203765848, 16.79992866557552], [96.15133953069483, 16.800350190409006], [96.15120156569975, 16.80072593705239], [96.15155124639296, 16.80112934144603], [96.15166797209929, 16.801375208898833], [96.15169652467495, 16.801565564799034], [96.15170604309947, 16.801689297123403], [96.15170604309947, 16.801870136397724], [96.1518012210496, 16.801927244246997], [96.15194398932368, 16.80202242219707], [96.15209627422371, 16.802136636096918], [96.15220097059836, 16.802288921896263], [96.15267686304685, 16.802098565096742], [96.15325745097067, 16.801860618872524], [96.15429023690496, 16.801308435136207]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
