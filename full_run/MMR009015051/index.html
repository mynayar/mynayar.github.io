
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kin</div><div class="name-mm">ကင်း</div></div>
        <span class="pcode-badge">MMR009015051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09136645329926, 19.06645957624852], [95.1002636810241, 19.068974009642886], [95.10705830369784, 19.069611005743354], [95.10386362940301, 19.07593498711003], [95.10235897278841, 19.079445852244362], [95.10315562643109, 19.08425914344474], [95.1127006664027, 19.078166563935838], [95.12071646229498, 19.077215537167376], [95.12073979160817, 19.07706855107284], [95.1207723794418, 19.076863236749034], [95.12741626315011, 19.075826462321402], [95.13161587227472, 19.075826462321402], [95.13383473268681, 19.073477079703537], [95.1305613758069, 19.06814227524586], [95.13008728200253, 19.0673696128174], [95.12831718688875, 19.064124161001303], [95.1231022899388, 19.062917529820197], [95.12191950608042, 19.062643855329725], [95.10749988161433, 19.062643855329725], [95.09897349563039, 19.06314540813412], [95.09136645329926, 19.06645957624852]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
