
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpaung Kwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpaung Kwe</div><div class="name-mm">ဖောင်းကွဲ</div></div>
        <span class="pcode-badge">MMR009020015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.98633403978414, 21.512076935801986], [94.98233776827345, 21.506721930772528], [94.97719666789197, 21.503937169264987], [94.96627183137997, 21.499438707330512], [94.96048809435013, 21.494511819165155], [94.959631243687, 21.48744280703994], [94.95872138698246, 21.486367521843704], [94.9572749066117, 21.48465804463308], [94.94099475660278, 21.480588008030225], [94.93456838292457, 21.481230644678533], [94.93285468339695, 21.485300682180764], [94.93306889471376, 21.485300682180764], [94.93692471999987, 21.495797094260524], [94.93842420821068, 21.50950669407871], [94.93778156976367, 21.523002080781453], [94.93633149660133, 21.529838140617755], [94.94677849543126, 21.529428455358982], [94.97077029331444, 21.525786843188314], [94.98040985473108, 21.52128838125384], [94.98469410534875, 21.511863031154007], [94.98633403978414, 21.512076935801986]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
