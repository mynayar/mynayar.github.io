
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kwin Gyi</div><div class="name-mm">ကွင်းကြီး</div></div>
        <span class="pcode-badge">MMR009006061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51615547419584, 20.441847237959735], [95.49614261069297, 20.43524725105982], [95.48470430356082, 20.45261653222724], [95.48415548598695, 20.45344992227615], [95.48279232870306, 20.45551990082282], [95.50108715974471, 20.45551990082282], [95.5020760686557, 20.474309187219262], [95.50744194469007, 20.485888181594362], [95.54657700922166, 20.49013174328536], [95.55115071563307, 20.492745290063112], [95.56091620012262, 20.487165013854337], [95.5722886615925, 20.478264825561325], [95.58724470288081, 20.47648434507653], [95.58662785429209, 20.475298096130302], [95.58415557931659, 20.446125258074233], [95.57129975268151, 20.43722507068054], [95.5722886615925, 20.423380334235105], [95.57929685256778, 20.415135403676004], [95.57723321064424, 20.414974601296876], [95.55597165107088, 20.41596351110718], [95.54608255386682, 20.422391424424745], [95.54657700922166, 20.434258341249517], [95.55053264756367, 20.44464189380841], [95.55152155737403, 20.45403653655694], [95.54262136998028, 20.450575351771136], [95.51615547419584, 20.441847237959735]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
