
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tei Pin San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tei Pin San</div><div class="name-mm">တယ်ပင်စမ်း</div></div>
        <span class="pcode-badge">MMR009005017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.29445903885363, 20.25950535838564], [95.29406768087881, 20.259608346947687], [95.29690366866942, 20.275206278447058], [95.29866490276311, 20.278995599767143], [95.2994975211937, 20.279004684718473], [95.31023446235059, 20.28164047532772], [95.31591007119289, 20.28447827884952], [95.32215323858117, 20.28164047532772], [95.32434063980872, 20.281883519808616], [95.32726128617946, 20.28220803657166], [95.33324291542829, 20.277549159865885], [95.3386124993674, 20.27851889073429], [95.34372054606638, 20.28192425729867], [95.35053127559797, 20.28220803657166], [95.35592310336858, 20.28192425729867], [95.36103115006756, 20.285045840992836], [95.36472029320703, 20.286464741854388], [95.36812565707345, 20.285329621165147], [95.37181480291088, 20.28447827884952], [95.37589902362112, 20.28466392589951], [95.37550162400083, 20.283246266102367], [95.37312083256046, 20.279105761321887], [95.36993034730773, 20.267407311798024], [95.36419084882868, 20.254577845191477], [95.35858639704463, 20.248973393407425], [95.35883897793656, 20.248800575186465], [95.35575041015335, 20.248618895046036], [95.34298846644464, 20.2521638786601], [95.32171856026338, 20.2532273746437], [95.30080315244356, 20.257835854241307], [95.29445903885363, 20.25950535838564]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
