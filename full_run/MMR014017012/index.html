
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsu</div><div class="name-mm">မိုင်းရှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Ya</div><div class="name-mm">ဖာယ</div></div>
        <span class="pcode-badge">MMR014017012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.31740244156947, 21.794489232092417], [98.29819271492192, 21.79961182622486], [98.26258443802146, 21.812730664988237], [98.2400950007837, 21.827723623446502], [98.23914120770064, 21.828995346657962], [98.23962647108482, 21.832877451932916], [98.24899706955915, 21.85583541976888], [98.26445855771635, 21.867080138837366], [98.278982987375, 21.894723404561546], [98.28442000068253, 21.89702368059841], [98.28984702522007, 21.893405664839634], [98.30091604463979, 21.876802134810703], [98.3140934499528, 21.85492764319622], [98.31962795966268, 21.836742824421833], [98.32255627185452, 21.837317002877455], [98.32255627185452, 21.826786563149426], [98.32234213967809, 21.82464524588147], [98.32005812967901, 21.801805148588812], [98.31927656216368, 21.79398946714025], [98.31740244156947, 21.794489232092417]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
