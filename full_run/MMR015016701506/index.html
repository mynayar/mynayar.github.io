
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Mai Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Man Mai Ward</div><div class="name-mm">မန်မိုင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR015016701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.16062057596014, 22.960615681678632], [97.16043319340645, 22.959949432596943], [97.1604236755623, 22.959673415120335], [97.16049981831452, 22.959454504707708], [97.16063949639056, 22.95916944995048], [97.1604829489263, 22.958954613536946], [97.16029565086978, 22.95869757684244], [97.15949615197195, 22.957526882027594], [97.15903488221744, 22.956656561736168], [97.15860344737939, 22.95667011892533], [97.15834170666886, 22.95653924857004], [97.15813945248317, 22.955789718353174], [97.15796099290787, 22.95494500969619], [97.15785391716264, 22.95387425224351], [97.15781038193973, 22.95323210770738], [97.15780037929, 22.953130670679172], [97.15747915205407, 22.953012887359364], [97.15716506320138, 22.952923657571546], [97.15684740515718, 22.9529486419122], [97.15651547034685, 22.95302359493394], [97.15625532608198, 22.953115361322716], [97.15628387961397, 22.955242599461997], [97.15662968447515, 22.958348828664896], [97.15746885119489, 22.95999676255167], [97.15959211342744, 22.962146448430246], [97.15986390736037, 22.962143295644125], [97.16029221034137, 22.96182920679138], [97.1606491294923, 22.961372350278225], [97.16066340625838, 22.961015431127294], [97.16062057596014, 22.960615681678632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
