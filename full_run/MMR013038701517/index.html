
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Say Yoe Tan Nyein Chan Yay Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Say Yoe Tan Nyein Chan Yay Ward</div><div class="name-mm">ဆေးရိုးတန်းငြိမ်းချမ်းရေးရက်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1246245254016, 16.793985912220137], [96.12425422685112, 16.793947219788436], [96.12397956940168, 16.793920517118238], [96.12365913376209, 16.793890000423232], [96.12337684556502, 16.79387092580265], [96.12287881630436, 16.793841892089688], [96.12292957314133, 16.79429101981475], [96.12293052642269, 16.795103073448104], [96.12294197119508, 16.79568290774006], [96.12294960014401, 16.796003341581013], [96.12294006373304, 16.79628467559735], [96.12286376974725, 16.79661528256929], [96.12244987476197, 16.797494887878827], [96.12231809440459, 16.7977851521631], [96.12223176398476, 16.798188938768533], [96.12278671223703, 16.798034286852896], [96.12307167142058, 16.79802131683033], [96.12346034581839, 16.797991222816734], [96.12350540185287, 16.797716522199778], [96.12379264801234, 16.797151565392483], [96.12400054968566, 16.79671287519909], [96.1241493227331, 16.79636192376381], [96.12432003024526, 16.795930863418675], [96.12446117434376, 16.79548168173426], [96.12455940279426, 16.795118968065992], [96.1246245254016, 16.793985912220137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
