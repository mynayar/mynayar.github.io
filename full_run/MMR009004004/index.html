
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Chan Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Chan Kan</div><div class="name-mm">ဝါးခြမ်းကန်</div></div>
        <span class="pcode-badge">MMR009004004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44197922096436, 19.9715751907425], [95.44159309704384, 19.970773240992344], [95.43798129829833, 19.971051072149294], [95.42492325280591, 19.969106256748375], [95.42370238355824, 19.96956820700717], [95.41464351618538, 19.972995886650892], [95.40519727123711, 19.973530580372028], [95.40519727123711, 19.97855250079732], [95.40214113300692, 19.984386947000075], [95.40019631760606, 19.98938789973181], [95.39908499477673, 19.995222345035245], [95.40109295427646, 20.000242241985916], [95.4065864252234, 20.001890282910267], [95.41436568502843, 20.006613405384428], [95.4204779605895, 20.009391713356933], [95.43047986785166, 20.009391713356933], [95.43685789487603, 20.009125961893687], [95.43825912765669, 20.007724728213702], [95.43937045138529, 20.00466858998351], [95.43825912765669, 20.000223298666356], [95.43853695881364, 19.992166206805052], [95.44270441987311, 19.98911006857486], [95.44576055810336, 19.988832239216492], [95.44631622041732, 19.986331762400937], [95.44520489668867, 19.97827467143901], [95.44197922096436, 19.9715751907425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
