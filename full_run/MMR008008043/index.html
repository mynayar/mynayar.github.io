
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Ka Doe Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Ka Doe Kone</div><div class="name-mm">ပျဉ်းကတိုးကုန်း</div></div>
        <span class="pcode-badge">MMR008008043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48645554258928, 17.806092576411345], [95.48165026344896, 17.811218301083784], [95.4764689148086, 17.820714908066577], [95.47500927555768, 17.826062892088828], [95.47461857139001, 17.83036003628672], [95.47678158390306, 17.833604815409956], [95.47774355272281, 17.835047884652226], [95.47657146989746, 17.84286088881902], [95.49024365072398, 17.843642378992627], [95.49202643527184, 17.844408781240304], [95.50131327089082, 17.84840110472726], [95.50225167837232, 17.84930913131143], [95.5041360998012, 17.84977063910378], [95.50460192703736, 17.850675314813998], [95.5079015791946, 17.851144301368436], [95.5116637041167, 17.85297114999861], [95.51346166562342, 17.846282417999248], [95.51283133799592, 17.83966397161504], [95.51094035061675, 17.835882002252674], [95.50495223096073, 17.825166417296373], [95.50274608066712, 17.819493462353478], [95.50589772599932, 17.81476599975116], [95.51188584565529, 17.813820504712567], [95.51437820339146, 17.813916365248133], [95.51287473118396, 17.811124203219435], [95.50810798079874, 17.80691824757912], [95.50558440759437, 17.805796659888017], [95.49296654157268, 17.805235866042437], [95.48645554258928, 17.806092576411345]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
