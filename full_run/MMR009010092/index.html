
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Zwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Zwe</div><div class="name-mm">စိဇွဲ</div></div>
        <span class="pcode-badge">MMR009010092</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.62816976472294, 20.812787615655964], [94.62783768376215, 20.813576305801917], [94.62761625178865, 20.81999784832209], [94.63202508279142, 20.83419327809736], [94.6425265031956, 20.834943380132927], [94.6560283290442, 20.83119287265299], [94.66531559543841, 20.829103237624395], [94.67103035896395, 20.827817415741208], [94.67553096668081, 20.82481701029684], [94.67815632155703, 20.81844114794069], [94.67815632155703, 20.811690235016385], [94.67890642359265, 20.808689828672698], [94.67328066327207, 20.808689828672698], [94.66652975034776, 20.808689828672698], [94.66165409026411, 20.81019003184457], [94.65715348164792, 20.806064473796482], [94.65415307620356, 20.8026890168847], [94.65040256872362, 20.801188813712827], [94.64815226441556, 20.801938915748394], [94.64440175693557, 20.804564270624667], [94.6425265031956, 20.809439929808946], [94.64290155376375, 20.8131904381882], [94.63915104718313, 20.81619084273325], [94.63277518392766, 20.81619084273325], [94.6282745762108, 20.813940539324506], [94.62816976472294, 20.812787615655964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
