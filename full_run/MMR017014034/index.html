
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ku Kone Hteik Pyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ku Kone Hteik Pyaung</div><div class="name-mm">ဆင်ကူးကုန်းထိပ်ပြောင်</div></div>
        <span class="pcode-badge">MMR017014034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8670041603138, 16.46433945040536], [94.86238571982517, 16.46565903014016], [94.86238571982517, 16.473411539610936], [94.86139607976531, 16.47967950040868], [94.8594164399168, 16.4861124301446], [94.85479800032749, 16.488751589614196], [94.84869492033437, 16.490895930402928], [94.84539587971614, 16.493700059710022], [94.84539587971614, 16.499143260353208], [94.85331335992367, 16.502277240302476], [94.8571073999866, 16.50458655002933], [94.86139607976531, 16.50904010971334], [94.86420012003958, 16.514153459714464], [94.87079783974855, 16.51233906039937], [94.87888019986138, 16.511514300244812], [94.88382875988941, 16.510689540090254], [94.88762244022348, 16.5083803202956], [94.88877731991744, 16.504751519866772], [94.88844720037804, 16.499803049771003], [94.8907566000371, 16.495019640344196], [94.89521015972116, 16.488421739871455], [94.89305448028011, 16.486149600024078], [94.88910707972798, 16.481988810135533], [94.88283911982955, 16.47588573014241], [94.87657115993113, 16.471267199721524], [94.87211760024712, 16.46780328009737], [94.8670041603138, 16.46433945040536]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
