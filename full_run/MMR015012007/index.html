
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaukme Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaukme Gyi</div><div class="name-mm">ကျောက်မဲကြီး</div></div>
        <span class="pcode-badge">MMR015012007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.99477479641979, 22.630339032020743], [96.99855680085574, 22.631397992723237], [97.01188922410847, 22.63608235801445], [97.0299060117531, 22.638604708140804], [97.04504011430987, 22.63500135133137], [97.05440884309371, 22.627794635913745], [97.06233623023292, 22.61986724877454], [97.06990328061198, 22.615903556104286], [97.0752065251611, 22.614499755759198], [97.07350663832074, 22.60977784826912], [97.0731463033593, 22.60401247629477], [97.06918260889034, 22.599688446864377], [97.06377757277681, 22.595004081573165], [97.04395910582815, 22.56077218468863], [97.04266351281092, 22.558109021414282], [97.0250729858297, 22.571301916650157], [97.01080821742534, 22.578428637371758], [97.00035848015978, 22.596085089155565], [96.98918807207195, 22.60797616896508], [96.98000954540424, 22.61962583656316], [96.98954840793272, 22.62887564259688], [96.99477479641979, 22.630339032020743]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
