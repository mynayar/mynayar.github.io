
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hu Kut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hu Kut</div><div class="name-mm">ဟူးကွတ်</div></div>
        <span class="pcode-badge">MMR015012029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.87621712342155, 22.600048782725196], [96.86234988593856, 22.60977784826912], [96.84914463131975, 22.614393858789583], [96.85370182797703, 22.616263891965104], [96.87027727307776, 22.626353293369846], [96.8738806298872, 22.632479000305693], [96.88036667358318, 22.64076672330566], [96.88345746359113, 22.65116301656002], [96.89056126329172, 22.649329779146058], [96.90112292838052, 22.64420897196652], [96.90528358427008, 22.63844806332753], [96.91104449290907, 22.63108690283832], [96.91456504733912, 22.62468589363914], [96.91968585541792, 22.61892498589941], [96.92577459392243, 22.615565680811585], [96.9257689785556, 22.615543220243467], [96.92564303479827, 22.60835723060177], [96.92072427830288, 22.60797616896508], [96.90631084836701, 22.60293146871237], [96.88252868784872, 22.600048782725196], [96.87621712342155, 22.600048782725196]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
