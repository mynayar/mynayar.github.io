
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kant Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kant Kan</div><div class="name-mm">ကန့်ကန်</div></div>
        <span class="pcode-badge">MMR015012047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.51964536604089, 22.7269583894182], [96.54121291544374, 22.71691491818899], [96.5669110941717, 22.708824751061456], [96.60498247026487, 22.708348858612965], [96.66345013671452, 22.714194790956867], [96.66632723611309, 22.70778917273219], [96.6710622898928, 22.693468342390133], [96.68883326134602, 22.657345345711178], [96.70624385197226, 22.63838023825741], [96.72501939313054, 22.629075544800628], [96.69381145403543, 22.617705235408323], [96.64975179101242, 22.631758328584056], [96.63880413690146, 22.634148310196395], [96.59858411406566, 22.642928736671934], [96.55678516590274, 22.6512164596719], [96.51967058393035, 22.66238686775978], [96.50690385942562, 22.66351334416555], [96.50602205437434, 22.686881169930075], [96.50757657120187, 22.696208271794376], [96.50771832414142, 22.696395588885366], [96.5162818674143, 22.707711698835908], [96.51964536604089, 22.7269583894182]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
