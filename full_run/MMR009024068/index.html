
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Poke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Poke</div><div class="name-mm">ရေပုတ်</div></div>
        <span class="pcode-badge">MMR009024068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.24500750868964, 21.916221503819372], [94.2576241579286, 21.916478986915763], [94.28401911339142, 21.915679139780536], [94.3133468407841, 21.916745602627486], [94.31782902858686, 21.917642041447095], [94.31892867731665, 21.911908551338627], [94.32057010102938, 21.899833707659525], [94.31388007220761, 21.899415582263373], [94.30241559660254, 21.898615735128146], [94.2925508161673, 21.898082502805323], [94.28215280340919, 21.89754927228114], [94.27575402632732, 21.895416345687863], [94.27388771634509, 21.890350648063986], [94.2725359282905, 21.888601275128792], [94.26402293501047, 21.88981741574122], [94.25069214942323, 21.894083268028453], [94.25054969321383, 21.894457216027774], [94.24855922372927, 21.899682197075776], [94.24589306661181, 21.911146672680843], [94.24455998805308, 21.915412524068756], [94.24500750868964, 21.916221503819372]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
