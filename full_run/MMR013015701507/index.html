
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Myaung Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tamwe</div><div class="name-mm">တာမွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyauk Myaung Gyi Ward</div><div class="name-mm">ကျောက်မြောင်းကြီးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013015701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18079862835407, 16.799020359302176], [96.18037096744627, 16.799118041864176], [96.17994117694383, 16.79910405470838], [96.17954254165505, 16.79896068568712], [96.17912419682426, 16.798756280577948], [96.17867088365443, 16.798431396891488], [96.17818260214545, 16.79805946337359], [96.17775154090094, 16.79776954622764], [96.17740058856634, 16.79753685024548], [96.17705865373392, 16.797316984890983], [96.1767749787823, 16.797369956758132], [96.17658996575437, 16.797833443059005], [96.17638079333898, 16.798353195443667], [96.17624092088187, 16.798681259132877], [96.17606926008835, 16.79909324665607], [96.17584673543854, 16.79959424367945], [96.17551532537203, 16.800365749579726], [96.17600250341286, 16.80053329507558], [96.17624006023067, 16.80062780033279], [96.17670249972065, 16.800811767449147], [96.17692139560597, 16.800885706110478], [96.17713165260375, 16.800956725572462], [96.17742545122366, 16.80100742575212], [96.1775627138482, 16.80103111299553], [96.17769337365036, 16.801040162873278], [96.178003312403, 16.801061630589857], [96.1783129381916, 16.80106456058104], [96.178919185572, 16.801070300054334], [96.1797027585755, 16.80103111299553], [96.18125343259987, 16.801048719023186], [96.18079862835407, 16.799020359302176]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
