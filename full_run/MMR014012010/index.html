
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Hti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Laihka</div><div class="name-mm">လဲချား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Hti</div><div class="name-mm">ဝမ်ထီ</div></div>
        <span class="pcode-badge">MMR014012010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.87900098990383, 21.387858972113918], [97.8790613434063, 21.387637677736677], [97.88757270441681, 21.372742796642797], [97.89608406362868, 21.34862727542844], [97.90409570465312, 21.32993344577193], [97.90459542463918, 21.328767433370388], [97.8942505510222, 21.31648289476982], [97.89324694359163, 21.31529111139571], [97.8818984634434, 21.31529111139571], [97.86203862138535, 21.31954679235065], [97.81664469629578, 21.335150952554443], [97.79465701420992, 21.33656951257302], [97.76983221208695, 21.33373239343524], [97.74759418302517, 21.329562763211015], [97.74713524909254, 21.329476713379677], [97.75068165003819, 21.36068503558596], [97.74642596908325, 21.39331191871014], [97.74745979643251, 21.396561088323608], [97.77621573217039, 21.40412843997558], [97.79536629421915, 21.40492637964877], [97.81930449700496, 21.400537709647608], [97.83048209337397, 21.400165123221882], [97.83087462766201, 21.39934080013785], [97.85720665126598, 21.394952129237424], [97.86837781208641, 21.394154188664913], [97.87900098990383, 21.387858972113918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
