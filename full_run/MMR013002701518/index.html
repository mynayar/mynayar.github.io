
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) (Kha) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingaladon</div><div class="name-mm">မင်္ဂလာဒုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) (Kha) Ward</div><div class="name-mm">အမှတ် (၂) (ခ) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013002701518</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14524421185098, 16.930679487168675], [96.14392145031474, 16.930370415362404], [96.14272220166833, 16.930008736813818], [96.14275075514331, 16.929818380014297], [96.1428173796184, 16.929428148889997], [96.14223679169464, 16.929161649190803], [96.14170379229625, 16.929056952816154], [96.14115651616038, 16.928947497229274], [96.14062827597422, 16.9288404221478], [96.13997868306984, 16.928611993448783], [96.13851531522965, 16.928297905224213], [96.13719541623556, 16.92793496582607], [96.13692799563057, 16.92853797204981], [96.13631107689474, 16.929902671671016], [96.13892747722133, 16.93084210437968], [96.14104519987615, 16.931623108020062], [96.14228251682476, 16.932079423126936], [96.1427053969366, 16.932247740241053], [96.14450657891553, 16.93107209789906], [96.14524421185098, 16.930679487168675]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
