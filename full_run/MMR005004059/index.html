
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tint Tei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tint Tei</div><div class="name-mm">တင့်တယ်</div></div>
        <span class="pcode-badge">MMR005004059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62480163978393, 22.56022286978964], [95.62160880010612, 22.550796540328122], [95.62006691965269, 22.547404259798782], [95.61528684041542, 22.546016460191538], [95.60667491991171, 22.54578056981751], [95.60688983989428, 22.546678229916438], [95.60723652044913, 22.54980069044956], [95.60561759957261, 22.550957189822498], [95.60307347955751, 22.553848350121314], [95.60214828041887, 22.55731767017437], [95.59960416040371, 22.558474170446686], [95.59740672004415, 22.558821119898823], [95.59405296017604, 22.558474170446686], [95.59116179987723, 22.559052420133128], [95.58954287990002, 22.569460560156756], [95.58889632040894, 22.577110379640374], [95.59202904040797, 22.57739514007369], [95.59449647972883, 22.57780634968333], [95.60189772030361, 22.58089028955527], [95.60827115988616, 22.58253503986026], [95.61731723979887, 22.583357370046656], [95.62063139981933, 22.58414649006852], [95.6219173197286, 22.578860070036228], [95.62315104028835, 22.57115030983897], [95.6240762403263, 22.562823780193355], [95.62484699978927, 22.56035660976977], [95.62480163978393, 22.56022286978964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
