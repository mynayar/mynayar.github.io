
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Sho Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Nar Sho Ward</div><div class="name-mm">နားရှိုးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR015013701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.795863949509, 22.318256399674624], [96.79587310051892, 22.317801198869404], [96.79555187328299, 22.316861311772186], [96.7953734137077, 22.316159370775495], [96.79526633796223, 22.315623992049098], [96.795099775692, 22.31533845672834], [96.79492131611647, 22.315112407932872], [96.79477854845624, 22.31492205105235], [96.79465957540577, 22.31467220764665], [96.79450491044054, 22.314148726225426], [96.79440973200025, 22.313708525939433], [96.79414799128955, 22.31293520111251], [96.79391004518908, 22.312364130471053], [96.79381557245046, 22.31212961325633], [96.79309782608959, 22.31206980105958], [96.79175937927386, 22.312188774109813], [96.7907481083464, 22.312813382623858], [96.79030195940777, 22.3142410592273], [96.79045067572065, 22.31560924930568], [96.7910455409721, 22.316917952858887], [96.79190928531733, 22.31785665022562], [96.79217340548894, 22.318085078482227], [96.79259457008686, 22.318263538057693], [96.79297290438694, 22.318363475419915], [96.7936938810717, 22.318370613802927], [96.79445054967147, 22.318370613802927], [96.79518580312231, 22.318334921887924], [96.795863949509, 22.318256399674624]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
