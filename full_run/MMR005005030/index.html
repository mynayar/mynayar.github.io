
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Daung Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Daung Hla</div><div class="name-mm">မဒေါင်းလှ</div></div>
        <span class="pcode-badge">MMR005005030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6168039121709, 22.872455134696736], [95.61616053538046, 22.87195162316891], [95.61581051924014, 22.864601288718575], [95.61476047081914, 22.859701066351192], [95.61428563597337, 22.85574411589829], [95.61132828017605, 22.85491940970303], [95.59832759973898, 22.848876989881205], [95.58832572035578, 22.842241110139184], [95.58227556006909, 22.847717250250923], [95.57928468024386, 22.85607906030043], [95.57092296012655, 22.860107460091285], [95.56549056034112, 22.864685039882716], [95.56439707736331, 22.86861674906379], [95.56439707736331, 22.872661376221572], [95.57030845786909, 22.877328254195618], [95.5706195810289, 22.883550758760578], [95.57093070778598, 22.888528762592387], [95.57715320965298, 22.890395513242368], [95.5821312143841, 22.88977326332548], [95.58691415976074, 22.886474579738092], [95.5869296397911, 22.886445150323482], [95.5891112403915, 22.882324230079178], [95.59167480015196, 22.87249757999939], [95.60467511996086, 22.87127681956963], [95.61468491967338, 22.87390140012957], [95.6168039121709, 22.872455134696736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
