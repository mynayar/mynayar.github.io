
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Par He</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Par He</div><div class="name-mm">ပါဟဲ</div></div>
        <span class="pcode-badge">MMR005032009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85653211986153, 23.939319240290786], [94.8545827197168, 23.961411359746478], [94.84743528041395, 23.98090446007285], [94.83249060026105, 24.00754499970202], [94.81689612035973, 24.022489679854914], [94.81623047995276, 24.02244215967795], [94.81884551960508, 24.030286919805576], [94.82404355966258, 24.03678456025932], [94.82794235995203, 24.047830619987167], [94.8269764799806, 24.048533069645487], [94.83638903992232, 24.061475789676024], [94.84678547976614, 24.069922830274436], [94.86692819997648, 24.070572540090723], [94.89161952022476, 24.0686232298782], [94.89145716021983, 24.070085280211572], [94.90526459998136, 24.06732372031348], [94.9176104399699, 24.05887676964727], [94.93580376003558, 24.05562785993783], [94.95334764008157, 24.051729240412158], [94.95854568013908, 24.041332980432742], [94.9552970402263, 24.027687809844622], [94.9552970402263, 24.00299658042792], [94.93710336043182, 23.983503570033804], [94.92410808042365, 23.971157909909664], [94.89941676017543, 23.95556343000834], [94.87927403996503, 23.944517370280437], [94.86627840022805, 23.939319240290786], [94.85653211986153, 23.939319240290786]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
