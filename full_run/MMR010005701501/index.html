
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chan Mya Thar Yar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyigyitagon</div><div class="name-mm">ပြည်ကြီးတံခွန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Chan Mya Thar Yar Ward</div><div class="name-mm">ချမ်းမြသာယာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010005701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0930677126866, 21.929245006381677], [96.09289858691062, 21.922350362044767], [96.08739510862205, 21.92246199210041], [96.08541850442333, 21.922502084643156], [96.08254817017075, 21.92253651360312], [96.07747788988218, 21.922597330379972], [96.07748740386, 21.922866272949193], [96.07751623114581, 21.924462080525757], [96.0777004867715, 21.925749165005982], [96.07770886015567, 21.92580765577236], [96.07770984691138, 21.925816410056257], [96.07801624866676, 21.928534740483315], [96.07818094543143, 21.929514257502092], [96.07876443925994, 21.933850675438634], [96.07904541135781, 21.933845304207182], [96.07921502472647, 21.933399087738223], [96.07973165213616, 21.93266794134115], [96.08004927689785, 21.932406112850686], [96.08027342175018, 21.932209490857133], [96.08088902535383, 21.93189564045622], [96.08699501030299, 21.93070486177396], [96.08869594159142, 21.930447082095498], [96.0920660085506, 21.92991009340426], [96.09311361826053, 21.929680384963035], [96.0930677126866, 21.929245006381677]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
