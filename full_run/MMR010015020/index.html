
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Shet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Shet</div><div class="name-mm">မရှက်</div></div>
        <span class="pcode-badge">MMR010015020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08308160523194, 21.482323928006906], [96.07857134868885, 21.486219148994564], [96.07508615200436, 21.48990935783064], [96.07303603498508, 21.49400959096988], [96.07262601158124, 21.499339893421393], [96.07098591886512, 21.51041052082894], [96.07939139639586, 21.508975440264408], [96.08718183837118, 21.50918045061735], [96.09395488091309, 21.51074346064223], [96.09481976072345, 21.509814130917448], [96.0943095150721, 21.507662655806996], [96.09937816876754, 21.505925889568175], [96.10032463057729, 21.503114699683692], [96.10058120266041, 21.49898120781654], [96.0987110777541, 21.49782351324461], [96.09884166291249, 21.497651459447354], [96.09886768929249, 21.497617170096362], [96.10063354320351, 21.49495108312601], [96.10198756067746, 21.49194941773152], [96.10045335413906, 21.490287358175067], [96.09840774092459, 21.48952025355692], [96.09694439916473, 21.48896278990088], [96.09678459233515, 21.48908424424252], [96.09388923579968, 21.48932838409769], [96.09046202380341, 21.486219148994564], [96.08533673260416, 21.482118916754644], [96.08308160523194, 21.482323928006906]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
