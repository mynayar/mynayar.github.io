
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Tee</div><div class="name-mm">ဝါးတီး</div></div>
        <span class="pcode-badge">MMR007013031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.47076069005385, 18.864918691744265], [96.46802570961887, 18.868495203790644], [96.46438330694411, 18.878097902895945], [96.46326660437035, 18.880650367720364], [96.4661314702912, 18.880156424979077], [96.46724612780662, 18.879964242555786], [96.47094531907129, 18.881785178143502], [96.47086538013326, 18.88219930065725], [96.4708242667266, 18.882412286198075], [96.47347484578756, 18.881828422044066], [96.47725853375437, 18.880994958250767], [96.48342991635764, 18.880997718270123], [96.48481510613232, 18.881876287560658], [96.48627624095582, 18.88280302813729], [96.48959868103435, 18.88461087589127], [96.49481791811252, 18.884610948736338], [96.49534930412716, 18.884526602220944], [96.49766602786497, 18.884158864040387], [96.49766690920057, 18.881901831904088], [96.49861655011375, 18.881448620357617], [96.4976669307843, 18.8769317196232], [96.49766694157614, 18.87467327105469], [96.49446535689077, 18.87387573068048], [96.4916001753079, 18.87148807921153], [96.4863473413568, 18.86910042774258], [96.48348215887461, 18.86814536661541], [96.48111497327744, 18.86539615620768], [96.47846809132943, 18.865041420425257], [96.47321525737829, 18.865041420425257], [96.47076069005385, 18.864918691744265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
