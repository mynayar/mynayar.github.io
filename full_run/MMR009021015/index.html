
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Bet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Bet</div><div class="name-mm">တောင်ဘက်</div></div>
        <span class="pcode-badge">MMR009021015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.4133774840837, 21.338651667040835], [94.41875372660326, 21.323060561395835], [94.42748736674861, 21.309960102976447], [94.43294589094018, 21.289217710329126], [94.43895026764079, 21.271750431837006], [94.43737692800289, 21.26725517598561], [94.43676685760448, 21.268475316782485], [94.43581161571353, 21.27065872681885], [94.43294589094018, 21.277208956028574], [94.4105659407656, 21.294130382011588], [94.3854567280456, 21.296859643657683], [94.37751500031709, 21.29808144820032], [94.37672308879957, 21.309960102976447], [94.37999820385409, 21.31869374222248], [94.37986917542219, 21.320177573236492], [94.38709428557286, 21.32033129885042], [94.39364451478258, 21.32415226641399], [94.40128644901046, 21.329610790605557], [94.41329520331107, 21.338890282360694], [94.4133774840837, 21.338651667040835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
