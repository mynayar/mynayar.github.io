
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit (North)</div><div class="name-mm">ရွာသစ် (မြောက်)</div></div>
        <span class="pcode-badge">MMR017008048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36455943956656, 17.66097468043722], [95.37451200012879, 17.658422640092795], [95.37948827996019, 17.656508700216364], [95.38152983993024, 17.653318740167776], [95.379233039773, 17.650766789755608], [95.37814871998751, 17.64974591983838], [95.37706403957384, 17.648725139853354], [95.37310835986295, 17.6474492096134], [95.37042888018874, 17.646555959789737], [95.36864256040587, 17.64515241035548], [95.36660100043588, 17.64336599974115], [95.3627731197837, 17.642472839849745], [95.35868964011485, 17.64068643013468], [95.35639319968647, 17.639793270243274], [95.35498956032, 17.643621239928336], [95.3561379603986, 17.64719397032553], [95.35652063991569, 17.64974591983838], [95.35562748002422, 17.652935969819225], [95.35588272021141, 17.65574306958706], [95.35601016044063, 17.65829510993143], [95.35709483995498, 17.660400480397925], [95.35792428018146, 17.65982628035863], [95.36022108033865, 17.65829510993143], [95.3612416795599, 17.65816748983781], [95.36455943956656, 17.66097468043722]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
