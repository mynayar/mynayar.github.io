
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Pin Kone</div><div class="name-mm">ကျွန်းပင်ကုန်း</div></div>
        <span class="pcode-badge">MMR005007049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61725639976311, 23.048112150255577], [95.6167362004154, 23.044296870004587], [95.61597948026883, 23.04076617032257], [95.61326724009109, 23.036665140383946], [95.61267252022071, 23.03339444999392], [95.6125735201519, 23.03319626999189], [95.6117282401662, 23.030027460199165], [95.6045948401798, 23.01758604026361], [95.59904472003785, 23.015851560101453], [95.58829079968069, 23.012382599777197], [95.57996544005306, 23.01203574025726], [95.57302752030387, 23.013423270067904], [95.5667833195946, 23.0196673799457], [95.56690499966606, 23.019950789597317], [95.56990560026333, 23.02695216011415], [95.57014788032046, 23.027194530103543], [95.57198676008096, 23.029033499796242], [95.57719019966805, 23.029033499796242], [95.5844751597009, 23.030421120438405], [95.58898451961994, 23.038399619646782], [95.59210680028866, 23.048459550268092], [95.59655819980117, 23.055253740367846], [95.5966161602077, 23.055050519665826], [95.5986976797542, 23.05643814030799], [95.60216664007845, 23.056784999827926], [95.60702304028115, 23.05331604040299], [95.61292019980743, 23.05088784030164], [95.617167119567, 23.047933589863305], [95.61725639976311, 23.048112150255577]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
