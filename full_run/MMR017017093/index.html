
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Dar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Dar Gyi</div><div class="name-mm">တံတားကြီး</div></div>
        <span class="pcode-badge">MMR017017093</span>

    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13899279967802, 16.497645569887197], [95.13998963971017, 16.498025459707264], [95.14088676021589, 16.499399399862455], [95.14180584036728, 16.50272364038375], [95.1411128398857, 16.506533879934636], [95.14123847967215, 16.50797820013389], [95.1415088401609, 16.50914577016124], [95.1419926799183, 16.50967271982023], [95.14306475993078, 16.51022918972535], [95.14527408033462, 16.51056110970751], [95.14923696001773, 16.509882060408813], [95.15077812011424, 16.50961790973878], [95.1533002795843, 16.509316410224187], [95.1534835200485, 16.507896930199195], [95.1537571198952, 16.507227779738287], [95.15789855997065, 16.497105029673435], [95.15953799977893, 16.494801030443227], [95.15651940015027, 16.492101569631757], [95.15602655997782, 16.491347909878186], [95.15473271973929, 16.489368270029672], [95.15443356026066, 16.489436040241117], [95.1541340401539, 16.48950390038476], [95.15008800016113, 16.489517490040157], [95.14686924022334, 16.489163700344534], [95.14385100032348, 16.488780480334924], [95.1404857201399, 16.48748681996085], [95.13720864006672, 16.48637900988342], [95.13867924025482, 16.496183429621624], [95.13882575960116, 16.49692269032994], [95.13899279967802, 16.497645569887197]]]]};
        const layer = L.geoJSON(geojsonData, {

        map.fitBounds(layer.getBounds());

</body>
</html>
