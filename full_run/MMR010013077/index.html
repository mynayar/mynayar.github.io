
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pe Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pe Khin</div><div class="name-mm">ပဲခင်း</div></div>
        <span class="pcode-badge">MMR010013077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.22483891728228, 21.462543261362498], [96.2293235782206, 21.47039141822944], [96.23448093834469, 21.47666994426254], [96.24345026022138, 21.47666994426254], [96.24972878625454, 21.47353068079633], [96.25073063910776, 21.47262901331834], [96.24800032255689, 21.47091462940665], [96.24631857504227, 21.461665014928542], [96.24631857504227, 21.452247227227815], [96.24530952581404, 21.441484040256285], [96.2423709748407, 21.433990735184352], [96.24201054005442, 21.432879540958083], [96.23858977979455, 21.43376231727717], [96.23792910184665, 21.43393281434794], [96.2353178366489, 21.43301119091376], [96.23470342432364, 21.431167944944775], [96.23439621411404, 21.428710283053192], [96.23332098827302, 21.429017493262734], [96.2316313456102, 21.429478303181213], [96.22855926779602, 21.428095869828553], [96.22625521190855, 21.42671343377799], [96.22226151066025, 21.428095869828553], [96.22052020014718, 21.43030802669415], [96.21872862292764, 21.43377921014246], [96.21502505286395, 21.434381047247598], [96.2114951922494, 21.434067893418614], [96.21237754768572, 21.43558692929338], [96.21474842859715, 21.438998789862296], [96.22282081882577, 21.443259218338312], [96.22528738310632, 21.44774387927663], [96.22551161556868, 21.45626473622866], [96.22483891728228, 21.462543261362498]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
