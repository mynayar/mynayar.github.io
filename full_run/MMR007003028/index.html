
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Kaw Ka Noke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Kaw Ka Noke</div><div class="name-mm">တကောကနုတ်</div></div>
        <span class="pcode-badge">MMR007003028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6430389293032, 17.04842871911012], [96.64875173770258, 17.048770659338516], [96.6552485903502, 17.0480867797811], [96.6582829721815, 17.04846607784725], [96.66128232541905, 17.03234455295882], [96.66516483359027, 17.029109127684137], [96.66926810823668, 17.023980033251974], [96.66956521186512, 17.02289065028333], [96.6713197442109, 17.016457359919286], [96.67412987199606, 17.00906285796458], [96.66653258730912, 17.005857229927244], [96.65935185510409, 17.001753954381513], [96.65148724514029, 17.001753954381513], [96.64635815160744, 17.00312171259702], [96.64635815340614, 17.00790886770011], [96.64601621407706, 17.014063782817345], [96.64567427474805, 17.019192878148885], [96.64533233811699, 17.027399430139667], [96.6453323390163, 17.033212404129188], [96.64279599723756, 17.036919368234294], [96.64031722555956, 17.03714470956072], [96.63804505513525, 17.03696992811973], [96.63640113040788, 17.042004448046896], [96.64070688201707, 17.048463075010943], [96.6430389293032, 17.04842871911012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
