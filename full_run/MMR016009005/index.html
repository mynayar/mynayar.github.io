
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpan Min</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tachileik</div><div class="name-mm">တာချီလိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpan Min</div><div class="name-mm">ဖန်မင်</div></div>
        <span class="pcode-badge">MMR016009005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.96911147211682, 20.51870297806005], [99.9656530419544, 20.51870297806005], [99.96143451738914, 20.516593716227078], [99.95194283599312, 20.506047404364267], [99.93752954365357, 20.50745357891958], [99.93120175725534, 20.51413291030559], [99.91889772674875, 20.519054522148508], [99.9006174539324, 20.524679221269082], [99.89077422934724, 20.532764727210463], [99.88690724797118, 20.553505805948248], [99.88620416069352, 20.564755205088716], [99.87847019884066, 20.569676817830953], [99.8661661692334, 20.573895342396213], [99.85808066419133, 20.58549628472582], [99.85632294464824, 20.5942848779448], [99.85526831418139, 20.60553427708527], [99.85632294464824, 20.615377500771103], [99.86722079970019, 20.623111462623967], [99.87987637429529, 20.626275355823054], [99.89569584119016, 20.61854139397019], [99.90026590984394, 20.608346627095216], [99.90589060896451, 20.595691053399435], [99.91256994035052, 20.58795709064725], [99.92381933859167, 20.578113866961417], [99.93788108774208, 20.565106749177176], [99.9480758564157, 20.558427418690485], [99.95827062329067, 20.54893573819379], [99.96494995377742, 20.545068756817727], [99.96811384787583, 20.531007007667313], [99.96911147211682, 20.51870297806005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
