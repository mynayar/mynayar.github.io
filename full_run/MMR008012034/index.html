
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Hpyu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Hpyu Kone</div><div class="name-mm">ရှားဖြူကုန်း</div></div>
        <span class="pcode-badge">MMR008012034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55976219906631, 18.37166895455863], [95.55304185769563, 18.364276580399917], [95.55035372114736, 18.360580391971553], [95.54430541436346, 18.355540136168372], [95.53657702111269, 18.341763436133704], [95.54766558459909, 18.340083350566204], [95.54531346534424, 18.337731231311352], [95.53859312397356, 18.328994787979127], [95.53456091915115, 18.329666821666535], [95.52448040664552, 18.33336300919558], [95.51708803068811, 18.332354958214808], [95.5140638777458, 18.333699027388263], [95.51458083413826, 18.34042236170268], [95.51675201429407, 18.34075538515293], [95.52322428936952, 18.345285977166156], [95.52683252590043, 18.347811742917656], [95.53523295283856, 18.35688420444251], [95.53590406112357, 18.36381898555777], [95.53624100381933, 18.367300733342233], [95.54195329420924, 18.373013023732085], [95.54800160189245, 18.37502912569363], [95.55236982400822, 18.375701160280357], [95.55976219906631, 18.37166895455863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
