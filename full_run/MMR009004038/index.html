
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Gyin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Gyin Kone</div><div class="name-mm">အင်ကြင်းကုန်း</div></div>
        <span class="pcode-badge">MMR009004038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48164588015328, 19.973725559686898], [95.4824650537193, 19.97044886272488], [95.48389523118004, 19.963774703339936], [95.48627885998144, 19.958530719617045], [95.48663849527043, 19.958341438406705], [95.48468977411386, 19.95741835986945], [95.48119378556481, 19.956464909428064], [95.47261272259914, 19.95805399439638], [95.46371384281963, 19.959007445737086], [95.46085348879751, 19.956941633749466], [95.45846985999611, 19.951379835011437], [95.45668006523289, 19.950271865754075], [95.45513277985395, 19.949314023023817], [95.45100115767735, 19.94994965665137], [95.44766407843451, 19.957259452361882], [95.4452804487338, 19.958530719617045], [95.43685829507433, 19.95805399439638], [95.43489547974264, 19.958996144856258], [95.43288558130462, 19.959960897077792], [95.42684705464791, 19.96361579403373], [95.42370238355824, 19.96956820700717], [95.42492325280591, 19.969106256748375], [95.43798129829833, 19.971051072149294], [95.44159309704384, 19.970773240992344], [95.44197922096436, 19.9715751907425], [95.44631622041732, 19.968828425591425], [95.45020585031978, 19.9679949339191], [95.4543733113793, 19.969106256748375], [95.45798511012481, 19.97160673266461], [95.4657643708291, 19.96966191816307], [95.47437712320573, 19.96993974932002], [95.48164588015328, 19.973725559686898]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
