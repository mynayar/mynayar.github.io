
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Bar</div><div class="name-mm">ကုလားပါး</div></div>
        <span class="pcode-badge">MMR009007006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85023550036811, 20.253506427979346], [94.84411570017949, 20.231831119110893], [94.84216516598968, 20.229149134824752], [94.84289661608602, 20.21793356458238], [94.84752913456197, 20.214032497102096], [94.85240779208601, 20.214697767887742], [94.85313692013284, 20.213057230007223], [94.85313692013284, 20.209156161627618], [94.85240546913712, 20.2050112771488], [94.84972348485098, 20.2023292928626], [94.84892835825718, 20.201717655845187], [94.84509096727436, 20.203060742958996], [94.83582593122179, 20.207205628337135], [94.83189438571736, 20.20982665837363], [94.83143722884512, 20.21013142872249], [94.83094959574731, 20.217689747583847], [94.8280237953619, 20.225491884343057], [94.82534181017644, 20.232806386205823], [94.82582944417356, 20.23597600358977], [94.82573899306016, 20.238644311885537], [94.83014500019169, 20.243558704870395], [94.83541144178469, 20.249410307439803], [94.84106799129484, 20.253506427979346], [94.85023550036811, 20.253506427979346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
