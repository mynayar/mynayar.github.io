
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Sat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Sat</div><div class="name-mm">လွယ်စပ်</div></div>
        <span class="pcode-badge">MMR015001054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.20471290157923, 23.057235705863206], [98.20632617831052, 23.044385535064464], [98.18530805622186, 23.040068618372118], [98.17250592091159, 23.034663272891805], [98.14633266811819, 23.029257927411493], [98.144426573028, 23.02857514682563], [98.14576368414674, 23.033809797384265], [98.14690165208964, 23.047749898838788], [98.14547919171139, 23.056000164176282], [98.13865138675214, 23.063396953106974], [98.12528026926907, 23.07335416856006], [98.11390059343768, 23.084449351956096], [98.10490929033153, 23.09222586523157], [98.10504446473033, 23.094265298304947], [98.10752811612974, 23.096748948804986], [98.10952477564791, 23.098745610121853], [98.12296571109874, 23.100985765580674], [98.13565992596489, 23.098745610121853], [98.14329993204626, 23.098381801079313], [98.14760742384357, 23.096132094820348], [98.15432789111935, 23.09239850178949], [98.16405739103584, 23.089293747108798], [98.16888890340022, 23.086424753299752], [98.17187577674576, 23.083811237998304], [98.17523601083332, 23.076717411779157], [98.17672944840535, 23.06887686677402], [98.17822288507813, 23.06402319601375], [98.18195647810904, 23.06103632176888], [98.1883035864414, 23.05767608768133], [98.19875764584873, 23.057302728737966], [98.20471290157923, 23.057235705863206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
