
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Tee Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Tee Kone</div><div class="name-mm">ပုတီးကုန်း</div></div>
        <span class="pcode-badge">MMR009005044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49565343255995, 20.156658583426918], [95.49116881388971, 20.153967810965753], [95.48372434740077, 20.1436873566862], [95.47911586690378, 20.14014237217276], [95.46883541172491, 20.142269363240587], [95.46174544359741, 20.142269363240587], [95.46098004859044, 20.141657047235014], [95.46139094523602, 20.142623860702656], [95.45430097620914, 20.139787873811372], [95.44189353086182, 20.14014237217276], [95.4346034509885, 20.14246194316422], [95.434803561835, 20.144396354308356], [95.43728505126415, 20.14687784283825], [95.44012103905476, 20.15467680768859], [95.44101749855878, 20.15781441999951], [95.44201404631127, 20.16130233533454], [95.44212874404639, 20.161703777407467], [95.44224802922321, 20.162121275976176], [95.4435371147461, 20.16217498798534], [95.4507559916957, 20.162475774337565], [95.45559653055551, 20.163948981660212], [95.4589094558068, 20.16495726286746], [95.46777191664069, 20.16708425393523], [95.47415288894473, 20.171692732633574], [95.48195185469439, 20.172756228617118], [95.48351453736609, 20.166505495232457], [95.48478784158567, 20.16141227925334], [95.4930109114245, 20.157814686198833], [95.49565343255995, 20.156658583426918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
