
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Twantay</div><div class="name-mm">တွံတေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Min Paing Ward</div><div class="name-mm">မင်းပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013027701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92966433874125, 16.70807487578844], [95.92948061344265, 16.70824506472212], [95.92934498416525, 16.70829503340343], [95.92918080135587, 16.7082236495732], [95.9287739135238, 16.707781069825955], [95.92832097549876, 16.707148238558887], [95.92772886416424, 16.70716982595104], [95.92753374836161, 16.70720789732735], [95.92715303460062, 16.707350664987587], [95.92665810671139, 16.707650477074594], [95.92622980373022, 16.707921735629213], [95.92585860781338, 16.708269136936224], [95.92553500111637, 16.708640332853065], [95.92545885836415, 16.708947283322914], [95.92513763112845, 16.709389863069987], [95.92455228372091, 16.709953795328545], [95.92382416865291, 16.71053914273608], [95.92304899567324, 16.71116614958555], [95.92504858357972, 16.713698960121974], [95.92632541840499, 16.712895691515143], [95.92695359611054, 16.712528064789808], [95.92764601926314, 16.712160438064302], [95.92827062777724, 16.71196413253142], [95.92854902471487, 16.711981978489007], [95.92882742165256, 16.711981978489007], [95.92959479782706, 16.711696443168307], [95.93049423408729, 16.711332385634307], [95.93083163466002, 16.711248035491053], [95.93098872574257, 16.710712843389615], [95.93085309646534, 16.710363062621695], [95.93029306632275, 16.709285085526346], [95.92987642686666, 16.70825833021769], [95.92966433874125, 16.70807487578844]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
