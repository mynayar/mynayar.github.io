
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Kan Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Kan Long</div><div class="name-mm">နမ့်ကန်လုံ</div></div>
        <span class="pcode-badge">MMR015011058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.22876138463027, 23.712285430228462], [98.23355194276803, 23.719375456811918], [98.24193909391408, 23.724214197926926], [98.25000366273889, 23.723891614706304], [98.25806823066438, 23.718730291269992], [98.2619392239161, 23.713568967833623], [98.26290697177939, 23.703891485603606], [98.25903597942698, 23.697117248762083], [98.2609714751535, 23.69131075888447], [98.26645538181049, 23.68647201866878], [98.27290703633071, 23.680665528791167], [98.2761328640405, 23.671955795323754], [98.27645544636181, 23.66453639204093], [98.28097160515551, 23.657439571978728], [98.2819016498413, 23.656701950734487], [98.28055877137024, 23.65032327889628], [98.28080828467466, 23.649949008939643], [98.28067966543426, 23.64999531143451], [98.26890451543107, 23.65195783718451], [98.259484394889, 23.649210302213703], [98.25205287773815, 23.64727164537021], [98.25045677985656, 23.646855271853383], [98.25241930470719, 23.659022925567626], [98.25084928356762, 23.671975592099955], [98.24849425500594, 23.68061070342128], [98.24399395125988, 23.68511100626796], [98.24103665931443, 23.688068297314146], [98.23593409488262, 23.693170862645218], [98.23200904428205, 23.698273427077027], [98.22926150931124, 23.711618597320467], [98.22876138463027, 23.712285430228462]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
