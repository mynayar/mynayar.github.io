
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngwe Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngwe Twin</div><div class="name-mm">ငွေတွင်း</div></div>
        <span class="pcode-badge">MMR005014019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54608151964646, 22.215515129819437], [95.5401001197248, 22.216308570184424], [95.53448484010335, 22.21472169035377], [95.52630599982211, 22.214111309689258], [95.51831040000502, 22.21588134005185], [95.51128392041664, 22.219133400086378], [95.50891115992215, 22.224487319634136], [95.50531008019612, 22.2291260101573], [95.50451663983114, 22.236084000076573], [95.50250243993571, 22.243713389661252], [95.50250243993571, 22.252319370142857], [95.50189548029226, 22.252081950022045], [95.5032958803007, 22.254882839971117], [95.50970460028714, 22.26092525979294], [95.52032459990045, 22.266296369881616], [95.52929687964735, 22.26849363037678], [95.53869611973022, 22.267700190011794], [95.54608151964646, 22.26672360001419], [95.54791680032014, 22.26612716963325], [95.54852303960666, 22.2659301596492], [95.55072012023743, 22.25909421042951], [95.5515135597031, 22.250488319880105], [95.55214391970617, 22.240479600253423], [95.5521770399385, 22.239952739627256], [95.54949935980767, 22.233520530248313], [95.54650883971124, 22.225280759999123], [95.54650883971124, 22.218872040012684], [95.54608151964646, 22.215515129819437]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
