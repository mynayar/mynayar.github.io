
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Say Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Say Kone</div><div class="name-mm">သစ္စေးကုန်း</div></div>
        <span class="pcode-badge">MMR005011045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31154260001102, 23.054294789672838], [95.31469727965577, 23.04992673033439], [95.318481599846, 23.043884309613247], [95.32345932039141, 23.038724429588797], [95.32348631983785, 23.038696260124368], [95.32031256017655, 23.03692622976172], [95.31872568034595, 23.033081070435117], [95.3132932796612, 23.030273430174702], [95.30291735964846, 23.028686550344048], [95.29547111969646, 23.02728273021387], [95.28387444015334, 23.02331544025543], [95.2799072401271, 23.02087401022743], [95.27656428021743, 23.018447880365443], [95.2764893999659, 23.018493690031846], [95.27612291993688, 23.018127479799432], [95.27032475958003, 23.01831054039917], [95.2684938001488, 23.024475089953512], [95.26892075958546, 23.035095180398287], [95.27069087988025, 23.047302239706653], [95.26971419995044, 23.052673349795327], [95.28308099978835, 23.051086469964673], [95.29809588012085, 23.052123989930237], [95.31152351999452, 23.054321250425403], [95.31154260001102, 23.054294789672838]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
