
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kan</div><div class="name-mm">ညောင်ကန်</div></div>
        <span class="pcode-badge">MMR009024032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.07236163737974, 21.84671621777926], [94.06920271203558, 21.847844404695593], [94.0672590918337, 21.851488694147974], [94.06708717833067, 21.851644979232447], [94.06944566478563, 21.856833651052227], [94.07430471618977, 21.863150417158067], [94.07989262494476, 21.868252421312263], [94.08037853044488, 21.87408328281731], [94.080671489098, 21.87857531010252], [94.08110738779578, 21.87845642872128], [94.09082549060395, 21.869467184163284], [94.10340302832714, 21.86324193756542], [94.1024872136141, 21.86120679695614], [94.103459023715, 21.856590698302114], [94.10175835626319, 21.847844404695593], [94.09884292506098, 21.844443069791907], [94.09360554775787, 21.844233575419196], [94.09276911080588, 21.844200117041794], [94.0883959649019, 21.84881621569582], [94.08305100889703, 21.850030979446217], [94.07770605199278, 21.849545073046727], [94.07260404783858, 21.846629642743892], [94.07236163737974, 21.84671621777926]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
