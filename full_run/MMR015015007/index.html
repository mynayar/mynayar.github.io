
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namtu</div><div class="name-mm">နမ္မတူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man San</div><div class="name-mm">မန်စံ</div></div>
        <span class="pcode-badge">MMR015015007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.45716762238794, 22.924805226779824], [97.4541894418893, 22.92636200180499], [97.44246527715086, 22.92362636396558], [97.42644225140884, 22.92284475328279], [97.42515580089957, 22.923513706792164], [97.42515580089957, 22.926157924948313], [97.42265589605285, 22.937268615354355], [97.4171005508498, 22.945323865404134], [97.4090453016994, 22.9594899943678], [97.40801094824673, 22.9612766037323], [97.41120083724888, 22.961143692027804], [97.42175258641277, 22.955281608759265], [97.43230433377806, 22.956454026132462], [97.43777561125552, 22.961143692027804], [97.44715494304626, 22.960752886236776], [97.4518446089416, 22.957626441706964], [97.46044233004955, 22.964270135658296], [97.46199704023127, 22.96357771434009], [97.45770669131082, 22.95918966397187], [97.45809749710185, 22.934568918021228], [97.45716762238794, 22.924805226779824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
