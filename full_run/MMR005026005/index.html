
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kat Pan Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kat Pan Tar</div><div class="name-mm">ကပ္ပန္တာ</div></div>
        <span class="pcode-badge">MMR005026005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45424588014333, 24.154445789941292], [95.44268808009087, 24.157714859753014], [95.43188484001342, 24.160888710245843], [95.42028815957099, 24.162719759609274], [95.40911880009259, 24.164489789971867], [95.39892575991593, 24.15991212024818], [95.39367659969537, 24.165893520169845], [95.3953246801899, 24.169494599895927], [95.39611811965557, 24.17132565015868], [95.40667728013244, 24.17932124997577], [95.4110379596342, 24.181683390376236], [95.41107180022345, 24.181518600403137], [95.4281005198232, 24.18707277019223], [95.43609611964024, 24.20410157972418], [95.44610592025208, 24.212097180440594], [95.46148691998542, 24.212097180440594], [95.46728831970023, 24.211200780291847], [95.46752915994284, 24.20367434959161], [95.46472151968243, 24.194274929644337], [95.46209711988621, 24.18072507010595], [95.46069347962043, 24.169494599895927], [95.45849604016018, 24.16229244044382], [95.45568839989977, 24.158691449750677], [95.45424588014333, 24.154445789941292]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
