
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Gyi</div><div class="name-mm">ညောင်ပင်ကြီး</div></div>
        <span class="pcode-badge">MMR007013014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.47076069005385, 18.864918691744265], [96.46843995444038, 18.864802654918662], [96.46533600735091, 18.864325124804736], [96.46079946812102, 18.86384759379149], [96.45820411372893, 18.862050811295944], [96.45578329886024, 18.86525772176651], [96.4525202778886, 18.867976905609737], [96.44980109404531, 18.870152253223978], [96.44218737784524, 18.870152253223978], [96.43402982541619, 18.87069609035234], [96.42913529395872, 18.874502947553026], [96.42967913108708, 18.881028990395635], [96.43131064067359, 18.88701119521056], [96.43783668261688, 18.889186542824746], [96.44545039881689, 18.890274216182206], [96.44980109404531, 18.89136189043893], [96.4591281122726, 18.8919025007998], [96.45967422468578, 18.890373386222848], [96.4603219380071, 18.888559789103056], [96.45883713482596, 18.885932828936973], [96.45721799091763, 18.883068189645257], [96.45542725186624, 18.882351894024737], [96.45363651281485, 18.881635599303536], [96.4603219380071, 18.88115806918961], [96.46109879667216, 18.88102412776135], [96.46326660437035, 18.880650367720364], [96.46438330694411, 18.878097902895945], [96.46802570961887, 18.868495203790644], [96.47076069005385, 18.864918691744265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
