
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kyun</div><div class="name-mm">တောင်ကျွန်း</div></div>
        <span class="pcode-badge">MMR010008031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.29096820771667, 21.94713577289764], [96.28976713884242, 21.95204923688283], [96.29155645606568, 21.954062220894855], [96.28954347385229, 21.956522532189183], [96.2911351857403, 21.962005097956933], [96.2928984451072, 21.965469121902515], [96.28999080383261, 21.969047758147553], [96.2855784178098, 21.970631691799213], [96.28521848844252, 21.973406055345208], [96.28509330731032, 21.974370955954896], [96.28633657597226, 21.977619496942282], [96.28733995497498, 21.980241446985247], [96.30105363411798, 21.98890632496699], [96.30520234880942, 21.991527596921117], [96.30922597230085, 21.99007224383905], [96.32264585732054, 21.994992870024987], [96.33034317090068, 22.000490949098094], [96.3304337236375, 22.000273623429052], [96.334818831424, 21.995888515642548], [96.34553798039354, 21.99296511195041], [96.35187202337522, 21.98760553656632], [96.34943585258259, 21.984682132874184], [96.34456351189664, 21.977860856093685], [96.34066563970754, 21.972988515407735], [96.33335712912827, 21.966654472426], [96.32556138385087, 21.958858727148595], [96.31143159559173, 21.958858727148595], [96.30314861561618, 21.956909791054045], [96.29778904203073, 21.95447362026141], [96.29220771811174, 21.94980812094809], [96.29096820771667, 21.94713577289764]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
