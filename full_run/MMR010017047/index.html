
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyawbwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div>
        <span class="pcode-badge">MMR010017047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46028965794142, 21.471809000684857], [95.45791238914552, 21.469194004200006], [95.45624829981926, 21.466341280925405], [95.45624829981926, 21.462062196013562], [95.45553511855093, 21.458971745949384], [95.4500673996908, 21.458734019159692], [95.44507513440999, 21.458734019159692], [95.44103377628778, 21.4599226540073], [95.43865650659257, 21.45944720042803], [95.43865650659257, 21.463013104071536], [95.43960741375122, 21.466341280925405], [95.4417469566568, 21.469907184568967], [95.4417469566568, 21.47275990784351], [95.43770559943391, 21.475850357907746], [95.43750722607768, 21.476114855716048], [95.43556605562901, 21.47870308208161], [95.43604151010766, 21.48226898572517], [95.43841877980293, 21.485121708999714], [95.43960741375122, 21.487498978694987], [95.44008286822987, 21.49154033591782], [95.44222241113545, 21.493917605613035], [95.4462637692576, 21.49486851367101], [95.4486410380535, 21.494630786881373], [95.45244466938607, 21.493917605613035], [95.45769799256834, 21.493862227160093], [95.4595071452386, 21.492153585419658], [95.46171833083633, 21.489037823037165], [95.45851600510963, 21.48628802627144], [95.45910102309381, 21.48488398221008], [95.46052738473105, 21.481793532145844], [95.46052738473105, 21.47870308208161], [95.46124056599939, 21.474899450749092], [95.46028965794142, 21.471809000684857]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
