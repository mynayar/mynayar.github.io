
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koke Ke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koke Ke</div><div class="name-mm">ကုက္ကဲ</div></div>
        <span class="pcode-badge">MMR010017021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52070987396155, 21.59718040065502], [95.51817616809575, 21.596259053312735], [95.51223299385765, 21.59768541494998], [95.51033117864102, 21.59982495695624], [95.50438800530225, 21.596021325623724], [95.5003466471801, 21.595308145254762], [95.50058437396973, 21.60125131859354], [95.50082210075942, 21.606243584773665], [95.50082210075942, 21.608145399990292], [95.50343709814365, 21.61194903132281], [95.50343709814365, 21.616465843024287], [95.50343709814365, 21.619080838609875], [95.51175754027832, 21.617892204661587], [95.51841389488538, 21.61812993235054], [95.52148367313305, 21.618781097269846], [95.52625888434011, 21.619794019878157], [95.53576796132239, 21.62003174666785], [95.54218658913982, 21.62074492793613], [95.54385067666743, 21.61741675108226], [95.54599021957301, 21.612186758112443], [95.54385067666743, 21.6064813115633], [95.5398093194446, 21.60386631507845], [95.53339069162718, 21.603628588288757], [95.52839842634637, 21.601964499861822], [95.52340616106557, 21.598160869428625], [95.52070987396155, 21.59718040065502]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
