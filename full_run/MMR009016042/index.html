
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zay Yar</div><div class="name-mm">ဇေယျာ</div></div>
        <span class="pcode-badge">MMR009016042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13383473268681, 19.073477079703537], [95.135582170281, 19.07162685319679], [95.14468132188557, 19.06579406264592], [95.16357956294655, 19.05296192415352], [95.17152086619507, 19.048673620291368], [95.16777917207122, 19.042229590223485], [95.1589133297864, 19.03872991625269], [95.15259836322394, 19.037205613947947], [95.15191398184487, 19.037563357962654], [95.14818099585631, 19.036163487654903], [95.14750363998104, 19.035674287038773], [95.13418229997325, 19.041996279105035], [95.12811619830399, 19.044796017921954], [95.12361652588203, 19.046265298804542], [95.12007479331714, 19.047257812198325], [95.12129834794047, 19.05125518717722], [95.12426413128469, 19.05669292084167], [95.12604670089456, 19.059961246914042], [95.12831718688875, 19.064124161001303], [95.13008728200253, 19.0673696128174], [95.1305613758069, 19.06814227524586], [95.13383473268681, 19.073477079703537]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
