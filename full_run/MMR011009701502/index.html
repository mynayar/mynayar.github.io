
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myauk Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaikto</div><div class="name-mm">ကျိုက်ထို</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myauk Paing Ward</div><div class="name-mm">မြောက်ပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011009701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.00911679770212, 17.308723949650584], [97.00702383068528, 17.308681058284265], [97.00643120713454, 17.308692987791176], [97.00642136945072, 17.309398245132968], [97.0063630726977, 17.31050057654045], [97.00667285766633, 17.310964608729762], [97.00717254527683, 17.311321528066117], [97.00742516573888, 17.311399056821074], [97.00821742619331, 17.311642197529466], [97.00823814927122, 17.311648557534966], [97.01016349794713, 17.312239439998223], [97.01030582915075, 17.312482400842157], [97.01017066554385, 17.3129919090494], [97.0094760552758, 17.313609458209953], [97.009138344559, 17.31390970227102], [97.00901893617504, 17.314020582384046], [97.01044275093227, 17.31502832399798], [97.01116427521117, 17.31506330762562], [97.01130956968098, 17.31505812033606], [97.01130957417757, 17.315057950364178], [97.0113267341415, 17.314283467707924], [97.01133885250607, 17.313736511730667], [97.01063636327763, 17.311058274919503], [97.01057742530799, 17.310833569413774], [97.01096118670944, 17.309471765609544], [97.01104629764859, 17.309175489357415], [97.01076076199962, 17.309089828932485], [97.01037971834938, 17.30880109259641], [97.00911679770212, 17.308723949650584]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
