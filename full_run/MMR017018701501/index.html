
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyinegyun</div><div class="name-mm">မော်လမြိုင်ကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (1) Ward</div><div class="name-mm">အမှတ် (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017018701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26926790239185, 16.383223566914126], [95.26954257512978, 16.382222432619244], [95.26979871643766, 16.381236503162143], [95.26978359703543, 16.38091308896793], [95.2698493302824, 16.380768941133795], [95.26993716346936, 16.380488634143205], [95.26943537863986, 16.38040282083358], [95.26836962985459, 16.38023158991598], [95.26810874732087, 16.380182578663153], [95.26752825022862, 16.380089713769337], [95.26748570869853, 16.38059744851347], [95.26699515999871, 16.380539497100187], [95.26472109919945, 16.380554481604065], [95.26468285463011, 16.381019860977858], [95.26463058693213, 16.38133418932142], [95.26462867497344, 16.381466280844222], [95.2645553721328, 16.382335268757686], [95.2650535560768, 16.382359873309554], [95.2650130326254, 16.382620242330347], [95.26502514289609, 16.382836111996994], [95.2650506395754, 16.38321525987641], [95.26526927106005, 16.38323421758514], [95.26579067190204, 16.383344292804907], [95.26585696272872, 16.383066964368936], [95.26617757913203, 16.383097847088038], [95.26726262467048, 16.38319698835039], [95.26732491621198, 16.382943741060842], [95.26852993850594, 16.38310763081256], [95.26926790239185, 16.383223566914126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
