
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Me</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Me</div><div class="name-mm">လက်မဲ</div></div>
        <span class="pcode-badge">MMR009010007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.633859492022, 20.43300749669868], [94.63817514516688, 20.43260080078636], [94.63853909090636, 20.432951721644713], [94.6392309987117, 20.441946524912225], [94.64215303093766, 20.44811525991139], [94.64702308374837, 20.45330998326915], [94.65384115894238, 20.45395932436338], [94.6570878608162, 20.455258004753148], [94.65862897684588, 20.45685839419957], [94.65936055284732, 20.45590734494806], [94.66813015238466, 20.45561981730077], [94.6679404853652, 20.45530370560158], [94.67017875404633, 20.447842811196836], [94.67055180002563, 20.441874095313324], [94.67033874433764, 20.426621457614203], [94.6679706450293, 20.42434032724435], [94.66664172223773, 20.423905351250994], [94.666539346114, 20.423871981007153], [94.66521082531938, 20.421293897195653], [94.66513473278172, 20.42114821242012], [94.66351665816728, 20.419899746576107], [94.66276166022249, 20.41931720982143], [94.66277237834265, 20.418414332755276], [94.66134106144091, 20.41794773300154], [94.66062793593056, 20.416914471325867], [94.6603993750312, 20.416583304076255], [94.65849791324814, 20.416203862118607], [94.65801031342528, 20.41610655996982], [94.65561588826267, 20.416081220671856], [94.65464767005398, 20.41697365930696], [94.6522726045971, 20.41501487203874], [94.6500343377146, 20.419118364321093], [94.64145430717059, 20.42844448322637], [94.633859492022, 20.43300749669868]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
