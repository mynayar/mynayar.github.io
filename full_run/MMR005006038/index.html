
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Taing</div><div class="name-mm">ကျောက်တိုင်</div></div>
        <span class="pcode-badge">MMR005006038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58164376025138, 22.4140962600344], [95.58601523971163, 22.411910519854644], [95.58854100006715, 22.405175190382806], [95.58727811988939, 22.39717697983383], [95.58847044015874, 22.389229619651303], [95.58854100006715, 22.38875783980251], [95.58391068043363, 22.387494959624746], [95.57717508026582, 22.389599789598662], [95.57180567978833, 22.38921620986025], [95.56366576576255, 22.387313131995484], [95.55440476586733, 22.38310356197985], [95.5473719730382, 22.38008203775587], [95.54699999185618, 22.379922221933043], [95.54513324210552, 22.381555630887704], [95.5383662690881, 22.38458909990709], [95.5351867717522, 22.387512240097863], [95.53229932655273, 22.392056105205143], [95.53270878428305, 22.398980542318213], [95.52938252568305, 22.402410742761617], [95.53585782158126, 22.40731096602832], [95.54075804215, 22.411336147145505], [95.54190135026715, 22.414766067000414], [95.55486443994204, 22.41401534982856], [95.55907392002547, 22.423697370037644], [95.56325830542653, 22.427283912222833], [95.56496747956561, 22.42874888984943], [95.57212355955471, 22.42874888984943], [95.57424071024064, 22.420329659885965], [95.57845019032408, 22.415699160387987], [95.58164376025138, 22.4140962600344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
