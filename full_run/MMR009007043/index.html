
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khan Kone</div><div class="name-mm">ခံကုန်း</div></div>
        <span class="pcode-badge">MMR009007043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.71894416733949, 20.267042169960234], [94.72196341987598, 20.26502299771323], [94.72418833722202, 20.26337491092346], [94.73485532011699, 20.259412889193527], [94.74552230301191, 20.258803346697164], [94.75165676934449, 20.25960349510524], [94.7534463473711, 20.250879303237298], [94.7552749730616, 20.246307739011], [94.75576367994995, 20.244352909659085], [94.75316108601538, 20.24368841768637], [94.74705084292214, 20.23973473087318], [94.74183916374648, 20.23685932220002], [94.73303322620251, 20.234882479243083], [94.72961867755998, 20.23146793060056], [94.72907953938932, 20.22769395711049], [94.7288998260662, 20.224638836013526], [94.72907953938932, 20.22122428827032], [94.72381137829251, 20.223212165908762], [94.71015772170153, 20.230099023051537], [94.71331673967586, 20.250457140784476], [94.70980671990424, 20.25502016684726], [94.70766397541217, 20.257622071901153], [94.70875371271376, 20.258530186618884], [94.71226373428397, 20.263093213580987], [94.71267380085527, 20.264197241109855], [94.71202179596918, 20.264139284300597], [94.7117393027267, 20.26473565802422], [94.71594440580975, 20.2648150753555], [94.71820372672067, 20.26619588543184], [94.71894416733949, 20.267042169960234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
