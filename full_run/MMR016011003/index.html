
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Kawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyawng</div><div class="name-mm">မိုင်းယောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Kawng</div><div class="name-mm">ဝမ်ကောင်း</div></div>
        <span class="pcode-badge">MMR016011003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.3764184323648, 21.131806325701405], [100.37606088260372, 21.15290144684434], [100.3869822342428, 21.154730257795222], [100.38881690157882, 21.1602124854179], [100.3928897728448, 21.160487859627096], [100.39963190658727, 21.160773543664163], [100.40448852892251, 21.162201962050972], [100.40643752796962, 21.1646593946154], [100.4078358739265, 21.16429853085259], [100.43063093856705, 21.153193241774716], [100.45517947075604, 21.142087953596217], [100.44290520511117, 21.10818759987791], [100.43472236104816, 21.068442357928518], [100.43179991693268, 21.049738714869818], [100.42848702315763, 21.02977152793369], [100.41825364478996, 21.03410094879979], [100.41077544742899, 21.035675202148923], [100.39975505075506, 21.03370694322092], [100.38912814524775, 21.035674730904134], [100.37377821978907, 21.03646160621821], [100.36866143977369, 21.042365553827324], [100.35921524788546, 21.04630138819857], [100.35055630812718, 21.047088408303466], [100.35890928503551, 21.06410739903731], [100.3738137511038, 21.102245297082845], [100.3764439506279, 21.130300761670867], [100.3764184323648, 21.131806325701405]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
