
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyinegyun</div><div class="name-mm">မော်လမြိုင်ကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017018701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26810874732087, 16.380182578663153], [95.26836962985459, 16.38023158991598], [95.26943537863986, 16.38040282083358], [95.26993716346936, 16.380488634143205], [95.27006844020639, 16.38006020971096], [95.27007850182144, 16.379566401867976], [95.26979615247052, 16.379525874819308], [95.2689197145732, 16.379386443029944], [95.26790942068328, 16.379222550580323], [95.26766656775794, 16.3791889159358], [95.26744666103463, 16.379183412084842], [95.26686980619667, 16.379161396681184], [95.26417547691676, 16.37914488422905], [95.26215042670088, 16.379146107307065], [95.26215810151524, 16.380524848942684], [95.2638287262148, 16.380547143136198], [95.26472109919945, 16.380554481604065], [95.26699515999871, 16.380539497100187], [95.26748570869853, 16.38059744851347], [95.26752825022862, 16.380089713769337], [95.26810874732087, 16.380182578663153]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
