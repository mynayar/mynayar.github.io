
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Khwei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Khwei</div><div class="name-mm">မခွယ်</div></div>
        <span class="pcode-badge">MMR001012017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.32772710132474, 24.49840657640243], [97.3312576436254, 24.50158406375357], [97.33915681993136, 24.504593273560772], [97.34404678643011, 24.512868601205014], [97.34573946700289, 24.514561281777787], [97.34667984489897, 24.511740148089416], [97.3504413573828, 24.510235542736154], [97.3549551716439, 24.510235542736154], [97.35871668502705, 24.507978634706262], [97.36360665062648, 24.504217123121805], [97.37150582693243, 24.50384097088414], [97.37865270056176, 24.50308866910683], [97.37827654922341, 24.498574853946423], [97.3730104322857, 24.492556434332016], [97.36285434794985, 24.487290317394297], [97.35307441585167, 24.47976729242663], [97.34592754222234, 24.47638193128114], [97.34329448375348, 24.472620417898042], [97.33953297126965, 24.469987359429126], [97.33351455075598, 24.474877325927878], [97.32749613114157, 24.480143442865653], [97.32636767802597, 24.487666467833265], [97.32335846821877, 24.49293258477104], [97.32772710132474, 24.49840657640243]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
