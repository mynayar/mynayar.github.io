
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tat Ka Lay</div><div class="name-mm">တတ်ခလေး</div></div>
        <span class="pcode-badge">MMR007001015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56018763305286, 17.40493285916415], [96.55096465919172, 17.399131310161863], [96.51196961820335, 17.364904221952315], [96.51178925287178, 17.36497359295697], [96.51093851220264, 17.3653008013909], [96.50808385898296, 17.36639874410679], [96.50761563775154, 17.366459816167605], [96.50844996579332, 17.373412545052986], [96.50897483801845, 17.38740915181097], [96.51058172596595, 17.398871022080073], [96.51058172596595, 17.407791976618455], [96.51165224115806, 17.41385822667587], [96.51197721927332, 17.417432981447007], [96.5123659170535, 17.421708667820837], [96.51522062333316, 17.426704402686084], [96.51985951980106, 17.429559108965748], [96.52378474037351, 17.430272784861188], [96.52591296800915, 17.429816735953636], [96.52878047523882, 17.429202269669076], [96.52735312344794, 17.425633888393293], [96.52663944575386, 17.419210799938526], [96.52699628415127, 17.414928741867982], [96.52521209306371, 17.409576167706007], [96.52592576985847, 17.40707830072307], [96.53520356279427, 17.408862491810623], [96.53877194586869, 17.408505654312535], [96.54789359671219, 17.407764100332997], [96.55447282725925, 17.407435139120423], [96.56018763305286, 17.40493285916415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
