
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pin Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Pin Aing</div><div class="name-mm">ကျွန်းပင်အိုင်</div></div>
        <span class="pcode-badge">MMR005017011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.84129367975959, 22.585217489995216], [94.8485681995628, 22.59193220970377], [94.8578709603766, 22.597333830192156], [94.86237239996632, 22.606036559739493], [94.86457020005474, 22.607501850330152], [94.86837395999032, 22.603935870244243], [94.87102967957611, 22.594419989890696], [94.87197540034452, 22.59103193977228], [94.8736029601086, 22.58403326991953], [94.87497600004241, 22.578127920267377], [94.87467612020686, 22.57122581961596], [94.87578384035203, 22.57086977981652], [94.87349459989593, 22.562729460196465], [94.87324332032301, 22.559714009993627], [94.86857412029946, 22.559247180013415], [94.86452303960664, 22.555646010355133], [94.85912124015317, 22.543942410413933], [94.86317267967547, 22.53268899040461], [94.857770880222, 22.530888449642305], [94.85198135965209, 22.53167793029229], [94.84710480024637, 22.547933459561534], [94.84363188020717, 22.574228039892205], [94.84129367975959, 22.585217489995216]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
