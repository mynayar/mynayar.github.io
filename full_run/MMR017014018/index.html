
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Det Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Det Kwin</div><div class="name-mm">ကဒက်ကွင်း</div></div>
        <span class="pcode-badge">MMR017014018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93793135994434, 16.466978609875014], [94.93512731967013, 16.466648670200016], [94.93083863989136, 16.466978609875014], [94.9257251999581, 16.46846307041443], [94.92061211975357, 16.46895788999467], [94.9168180796907, 16.46846307041443], [94.9123724268461, 16.467907363134373], [94.91259796512406, 16.468634004555724], [94.91182464079458, 16.469288356672394], [94.91033747779244, 16.470418600338178], [94.90885031479024, 16.471786791127556], [94.90772007022514, 16.473273954129752], [94.90712520556383, 16.47470163057585], [94.90742263744482, 16.47606981956659], [94.90855288200993, 16.4779733893605], [94.90944098411421, 16.480909204596173], [94.91318928016119, 16.481658869561215], [94.91830272009452, 16.481988810135533], [94.92836436032701, 16.485947460307102], [94.93100351979666, 16.48314342003283], [94.93347780026033, 16.481164049980976], [94.93694171988454, 16.47901971009162], [94.9387561200989, 16.474071329927995], [94.93925112044292, 16.469452800406486], [94.93793135994434, 16.466978609875014]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
