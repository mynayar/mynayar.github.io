
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Dut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Palaw</div><div class="name-mm">ပုလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Dut</div><div class="name-mm">ရှမ်းဒွတ်</div></div>
        <span class="pcode-badge">MMR006007015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.77899309295691, 13.027783027764542], [98.77772411987229, 13.029333930216751], [98.76933540030853, 13.031011709922552], [98.75703168006805, 13.031011530058095], [98.74137203978785, 13.030452089692233], [98.7346609200655, 13.0354856095733], [98.72067924025481, 13.036603949812502], [98.70928451786625, 13.034116746091001], [98.70928415993609, 13.051564830352675], [98.71641468029333, 13.054081725191509], [98.7229159198339, 13.062890609813849], [98.72347499957164, 13.076872830117054], [98.7257120397789, 13.08749940017725], [98.7257120397789, 13.092533009990461], [98.72436970269968, 13.093875306600182], [98.7268305598825, 13.094770140129924], [98.74025280022659, 13.095329624562567], [98.75311583672652, 13.098126231940114], [98.76434522325349, 13.09735287433574], [98.76821615984795, 13.078551330179778], [98.77157207988762, 13.066246980413837], [98.77604616030214, 13.049468370369027], [98.77996116007955, 13.03940123977543], [98.77899309295691, 13.027783027764542]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
