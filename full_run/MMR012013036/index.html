
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Kyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Kyar</div><div class="name-mm">တောကြား</div></div>
        <span class="pcode-badge">MMR012013036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.91919603037258, 18.984337115765356], [93.914489887998, 18.973814792418807], [93.91338291788742, 18.96752688735603], [93.91227604220563, 18.96123896700476], [93.90490655039702, 18.959782262241674], [93.90374722175693, 18.94857542891299], [93.90497495283188, 18.9333797174001], [93.88374785707799, 18.907627895011387], [93.87131552119439, 18.922654856836232], [93.86661781895725, 18.93227725199364], [93.86565576829912, 18.934247695374893], [93.86462359210515, 18.942076803701582], [93.86505004522348, 18.94280611880737], [93.86859127596665, 18.948861989789066], [93.86970964768216, 18.95770158086333], [93.86872628309158, 18.966517830033865], [93.86834291469381, 18.969954670171944], [93.8655456840861, 18.982214434248817], [93.85776643956962, 18.997248363121514], [93.87126403230928, 18.997185296364364], [93.88727902530684, 18.99194759890264], [93.89475770740233, 18.98950111918134], [93.90013967860335, 18.9887919084199], [93.90522998077904, 18.98812098179792], [93.91032023529067, 18.98744991757968], [93.91919603037258, 18.984337115765356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
