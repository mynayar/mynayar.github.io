
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pun Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pun Gyi</div><div class="name-mm">ပွန်းကြီး</div></div>
        <span class="pcode-badge">MMR009012008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8878170759973, 19.471320931815626], [94.89081683213118, 19.470870435322354], [94.89247197320304, 19.470923826273633], [94.90954109484574, 19.47250430113263], [94.91807565566705, 19.47218820562125], [94.92692631110043, 19.466182404394488], [94.927342225963, 19.46701423232099], [94.92850678595948, 19.46491802414755], [94.93077893030346, 19.46465835030267], [94.93040335543054, 19.462705360064376], [94.93419649257413, 19.45733174806179], [94.94888231636588, 19.437652745278], [94.95000123576847, 19.436153392864867], [94.94083448482365, 19.43109587457502], [94.93293211412583, 19.424773977836878], [94.92075119271345, 19.419901610171223], [94.917060798617, 19.419829198558716], [94.91493723936219, 19.42589651161478], [94.91478312344248, 19.426336843070885], [94.91218006725637, 19.433169868594632], [94.91295514526382, 19.43651068362118], [94.91075651779914, 19.436667728632813], [94.90514367623973, 19.44520900918849], [94.90223390177323, 19.44890520930801], [94.8961143219185, 19.456678733237027], [94.89116706590744, 19.46540918528575], [94.8878170759973, 19.471320931815626]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
