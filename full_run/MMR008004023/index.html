
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ko Wun Saung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungde</div><div class="name-mm">ပေါင်းတည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ko Wun Saung</div><div class="name-mm">ကိုယ်ဝန်ဆောင်</div></div>
        <span class="pcode-badge">MMR008004023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45728916166553, 18.48993086122033], [95.44874749799868, 18.47968086428051], [95.44646972120074, 18.47597947597211], [95.44333777821595, 18.473132254749828], [95.43992111167, 18.47056975618932], [95.4288169494427, 18.470854477951832], [95.42625444998293, 18.474840588022744], [95.42369195142248, 18.473701699174114], [95.4162464426193, 18.47198597077596], [95.4162464426193, 18.47305692123996], [95.41584483686978, 18.474127870804637], [95.4147738873051, 18.475734294701965], [95.41383680722294, 18.477608456664996], [95.41356906915729, 18.48122291200781], [95.41436537386295, 18.484403647710224], [95.41230810813272, 18.486227342417976], [95.41532608992719, 18.488585140891587], [95.42091430355231, 18.494843941194972], [95.42516134741828, 18.498643925776605], [95.4276040436917, 18.49825823712797], [95.42846426681251, 18.501198831361023], [95.42988724879757, 18.50075340164824], [95.43227140280305, 18.4980564886161], [95.43464765176776, 18.496716607585427], [95.43985847209086, 18.496293505341043], [95.4417467363229, 18.497205971878145], [95.45310778899335, 18.497270268008492], [95.45357312519963, 18.498628186741485], [95.45782635190466, 18.50000578623809], [95.45615027371622, 18.497333636038547], [95.45728916166553, 18.48993086122033]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
