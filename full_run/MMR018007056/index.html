
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Kyun</div><div class="name-mm">အလည်ကျွန်း</div></div>
        <span class="pcode-badge">MMR018007056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.29940810679875, 19.541232244672415], [96.29256622834885, 19.53403026688335], [96.2882450416754, 19.527188389332764], [96.28176326166528, 19.524667695757614], [96.27196501577293, 19.52568130814592], [96.26951990032319, 19.52934898177017], [96.26483861431063, 19.53331007000378], [96.26447851497153, 19.5383514535568], [96.26051742763724, 19.54735392624275], [96.25619624096379, 19.548794321800585], [96.25439574696622, 19.552755409134875], [96.2551159438458, 19.55887708980589], [96.2587169327403, 19.56211798026061], [96.2706001956426, 19.56319827737866], [96.28104306388633, 19.566079067594956], [96.28932533789407, 19.56643916693406], [96.2947268207862, 19.56463867203712], [96.2950869201253, 19.56067758470283], [96.28392385500194, 19.55887708980589], [96.28392385500194, 19.5516751129162], [96.29004553567302, 19.54807412402164], [96.29544701856514, 19.54555343224513], [96.29940810679875, 19.541232244672415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
