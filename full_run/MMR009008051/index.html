
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lan Taw</div><div class="name-mm">ဖလံတော</div></div>
        <span class="pcode-badge">MMR009008051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73362667263291, 20.35513343805775], [94.72979958698141, 20.35543960505379], [94.7232692201984, 20.358605843684813], [94.72323049359244, 20.35862461973045], [94.72327040460556, 20.359502667414233], [94.72342955672872, 20.359221810038548], [94.72880427040081, 20.367980600624264], [94.73218834821375, 20.3721609327809], [94.73298460165807, 20.37673939120998], [94.73318366479435, 20.384502865215097], [94.73457710944609, 20.388484133336135], [94.73895650383963, 20.390275704260375], [94.74253964568817, 20.390673831432252], [94.74791435756163, 20.393261655800814], [94.7514857902371, 20.394690227971694], [94.75269188092562, 20.391071957704753], [94.7510993731376, 20.385896308967517], [94.75066979757315, 20.380025451013807], [94.7505021828295, 20.3777347086899], [94.74811342159717, 20.368378727796085], [94.74353496316809, 20.360615253790968], [94.73870427638133, 20.35614239555514], [94.73816025129463, 20.35563866908933], [94.73477617168305, 20.35504147788197], [94.73362667263291, 20.35513343805775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
