
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aunglan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009016901</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2359510180251, 19.119707394980367], [95.2359061607408, 19.121322225740187], [95.24407206787168, 19.121088913722417], [95.24990485842255, 19.11758923975168], [95.25018700182875, 19.117133467835345], [95.25597096009182, 19.107790152093912], [95.26623666998637, 19.10429047812312], [95.27113621426491, 19.10009086899845], [95.27020296799265, 19.09285820903915], [95.27066959112881, 19.087025419387658], [95.27486920025342, 19.081892563990664], [95.27836887422421, 19.077692954866052], [95.27976874363264, 19.075826462321402], [95.28042227556762, 19.074519397552194], [95.27970779927557, 19.073773856878063], [95.27796012965632, 19.07231746507898], [95.27271711630192, 19.068239565703436], [95.2744911351578, 19.060636641367978], [95.27243390719912, 19.060770672728438], [95.27009561322205, 19.05717098785084], [95.27009830489294, 19.057117145439975], [95.269269720821, 19.05716153327819], [95.26567181120521, 19.05716153327819], [95.26390355430567, 19.059261337840496], [95.25923732204484, 19.06836049034439], [95.25457108978401, 19.07722633172989], [95.2543377777663, 19.082359187126826], [95.25293790925718, 19.087025419387658], [95.24453869100785, 19.091225027613007], [95.23800596620242, 19.093324833074632], [95.2359061607408, 19.097757753317694], [95.23613947275851, 19.11292300839017], [95.2359510180251, 19.119707394980367]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
