
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Hpyu Chi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Hpyu Chi</div><div class="name-mm">ဆင်ဖြူချီ</div></div>
        <span class="pcode-badge">MMR009005028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43302357957458, 20.17657832123257], [95.434803561835, 20.176655712391266], [95.43543378244317, 20.173504613846887], [95.43582163306195, 20.171565355356904], [95.43586705691922, 20.171338235171447], [95.43704872292028, 20.169408984337224], [95.44201404631127, 20.16130233533454], [95.44101749855878, 20.15781441999951], [95.43799404798699, 20.159285288185572], [95.43161307568295, 20.158930789824126], [95.41069766786313, 20.156449300394968], [95.40218970628996, 20.154322310226462], [95.40077171194503, 20.1490048330067], [95.40024050039881, 20.14830761740268], [95.39509973726314, 20.148650334645254], [95.3887187649591, 20.151486322435858], [95.3862372764292, 20.15999428490835], [95.38555200292268, 20.169930746706655], [95.39793572415442, 20.170274740087223], [95.40927967441752, 20.16708425393523], [95.4128246589309, 20.16885674574229], [95.41743313942789, 20.172047231894283], [95.42168711976484, 20.174883218785567], [95.4266500977239, 20.176301213130557], [95.43302357957458, 20.17657832123257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
