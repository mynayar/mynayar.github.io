
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Myaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Myaing</div><div class="name-mm">ပေါက်မြိုင်</div></div>
        <span class="pcode-badge">MMR010016036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.90396545803952, 21.87639016977056], [95.90211289419477, 21.874948445014752], [95.8991266063079, 21.872416369619827], [95.89357683780088, 21.86922104871246], [95.8889389036076, 21.868593514379256], [95.88476594229445, 21.86839480197858], [95.874432893863, 21.867202526675328], [95.86529211983554, 21.86839480197858], [95.86290757102762, 21.869927726083745], [95.85972817081847, 21.871971626089703], [95.85615134670735, 21.875349737800207], [95.84760671078112, 21.874157463396273], [95.84701057267984, 21.87952270001267], [95.84124791216146, 21.88449051182772], [95.83647881184777, 21.88846476074019], [95.83522018636256, 21.896633539406366], [95.83397106491276, 21.9062324217889], [95.83565820476241, 21.906304069876967], [95.83568754694278, 21.906305310042057], [95.83571776596222, 21.906306086156974], [95.83747275426424, 21.906350857106418], [95.86420685756048, 21.901568587120664], [95.87230820595897, 21.900119395293927], [95.8845345098598, 21.892446566655792], [95.88498871695577, 21.891362921361804], [95.88515472011431, 21.891270448572413], [95.88554181530259, 21.891054068090796], [95.88563155325363, 21.890956424199658], [95.896447552013, 21.884116909168085], [95.90396545803952, 21.87639016977056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
