
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Tat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Tat</div><div class="name-mm">နန်းတပ်</div></div>
        <span class="pcode-badge">MMR005026009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.25030516015505, 23.86529540955553], [95.25488291981094, 23.857116660105817], [95.26269528006316, 23.843078639567636], [95.26348872042814, 23.829284700428616], [95.25927743990201, 23.82208254007719], [95.24731428032982, 23.82208254007719], [95.2395019200776, 23.82208254007719], [95.22747791957039, 23.819091840116357], [95.22412092034426, 23.811523470431894], [95.22747791957039, 23.805725130210647], [95.22668448010472, 23.797485359961456], [95.2141114803606, 23.803283700182646], [95.19592284036685, 23.812927289662753], [95.1809083197632, 23.822875980442177], [95.1660766798949, 23.833129859755275], [95.15393063958743, 23.840698230339115], [95.16412367976409, 23.850280799919005], [95.16992184012088, 23.864685029790337], [95.1809083197632, 23.87969973025838], [95.18170176012819, 23.87951657972644], [95.19927983959298, 23.874877890102596], [95.21691911972164, 23.872497569906955], [95.24249279990283, 23.870483370011584], [95.24969496025426, 23.866088849920516], [95.25030516015505, 23.86529540955553]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
