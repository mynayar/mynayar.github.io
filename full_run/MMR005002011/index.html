
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Tin Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Tin Kin</div><div class="name-mm">စံတင်ကင်း</div></div>
        <span class="pcode-badge">MMR005002011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48151695964003, 21.97044431984955], [95.47683408002882, 21.965371379985243], [95.46876611986062, 21.955356179843875], [95.466697199816, 21.950830169876497], [95.46431508007691, 21.945619169688996], [95.45624711990871, 21.935882250365637], [95.45579064022593, 21.935794409984112], [95.45373936038322, 21.938380739679417], [95.4515401195809, 21.940396650085404], [95.44970735970696, 21.94479486009476], [95.450990399987, 21.949376399601192], [95.45117363955188, 21.956523659939023], [95.450990399987, 21.962387969928898], [95.44750848043208, 21.9647703603639], [95.44324247975669, 21.967887870129175], [95.44410179995816, 21.96823158022329], [95.44754448029357, 21.970109430306024], [95.45098715972972, 21.974021640386468], [95.45599476025006, 21.977151299992556], [95.46006348024548, 21.97981160971807], [95.46157079975268, 21.982689540090234], [95.46288012002157, 21.982315410427873], [95.46460128032487, 21.981220019987973], [95.46867000032034, 21.978872730092462], [95.47367759994137, 21.97902915007529], [95.47743347997118, 21.980281050430165], [95.4780940796781, 21.98070864029154], [95.47929684017708, 21.976499340072564], [95.48151695964003, 21.97044431984955]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
