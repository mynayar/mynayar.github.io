
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Kar Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Kar Te</div><div class="name-mm">စကားတဲ</div></div>
        <span class="pcode-badge">MMR010016039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85381647465067, 21.754534365368727], [95.85097488678167, 21.754792691129865], [95.84761664559176, 21.754534365368727], [95.8468416683084, 21.75272608144354], [95.8432251013574, 21.75272608144354], [95.83960853440641, 21.753759386286674], [95.83754192382077, 21.753501059626274], [95.83366703110863, 21.75556766931254], [95.82927548597496, 21.757892604759945], [95.8243672884197, 21.757892604759945], [95.81894243664419, 21.757634278998808], [95.81462044058094, 21.759301657145784], [95.81978696479666, 21.76287848215628], [95.82395992700907, 21.76605788056679], [95.82972258932608, 21.769634705577232], [95.83568396314445, 21.772217967685094], [95.83985692355822, 21.77321152968841], [95.84400007864076, 21.773908829828656], [95.84761664559176, 21.772875524985523], [95.85149153920321, 21.772875524985523], [95.85407480131107, 21.770808916198575], [95.8556247585758, 21.768225654090713], [95.8563676273642, 21.76711135090818], [95.85717471584053, 21.76590071774399], [95.85769136826207, 21.762542476554074], [95.85743304160167, 21.75892590960308], [95.85459145373267, 21.756600974155674], [95.85381647465067, 21.754534365368727]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
