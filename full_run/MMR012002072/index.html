
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Kyun</div><div class="name-mm">အလယ်ကျွန်း</div></div>
        <span class="pcode-badge">MMR012002072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.9751483463192, 20.274884736641354], [92.97264142316322, 20.28131856569928], [92.97179743820129, 20.283484461438775], [92.97030569675059, 20.284797691959966], [92.96881393011881, 20.286110910789944], [92.96642752421093, 20.286016650148326], [92.964041121001, 20.285922356231822], [92.96065954959857, 20.28911150329327], [92.96041026202403, 20.29041641688417], [92.95922070267335, 20.296642925230856], [92.95886721964655, 20.29849306540268], [92.95747236395852, 20.308249973057855], [92.96105246519915, 20.30843844577771], [92.97076867223649, 20.308861778248513], [92.97835643130429, 20.30919199761263], [92.977959961583, 20.299809984942897], [92.97813582940506, 20.29156842594216], [92.97816016326101, 20.290428037024355], [92.97855878865721, 20.284048338160346], [92.98098605885957, 20.28007965155473], [92.97597837919892, 20.27562340739439], [92.9751483463192, 20.274884736641354]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
