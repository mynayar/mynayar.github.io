
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Kaung</div><div class="name-mm">ကူကောင်း</div></div>
        <span class="pcode-badge">MMR005006059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87013912032421, 22.2871817700227], [95.86932012032736, 22.286465010352003], [95.87016216005571, 22.283097390132525], [95.8705829996058, 22.278045870320682], [95.8722436796022, 22.27377509964117], [95.87184587978356, 22.27383630030505], [95.87016216005571, 22.264154280096022], [95.87016216005571, 22.2557350501325], [95.86847807969968, 22.247315910101236], [95.86132199971058, 22.243106340085603], [95.85164663988058, 22.24098989986402], [95.84616744027522, 22.2439482898817], [95.8377481203795, 22.248578790278998], [95.8286412004311, 22.24819935011999], [95.82259391977362, 22.255314119750892], [95.81670036023348, 22.255314119750892], [95.81206967997178, 22.255314119750892], [95.8113763197614, 22.256700840171675], [95.81038596024393, 22.25868182990257], [95.81038596024393, 22.267100969933892], [95.80996511979453, 22.272994349609576], [95.81501663960631, 22.278045870320682], [95.81712119978363, 22.284360270310287], [95.81712119978363, 22.292358479959944], [95.81792363966429, 22.292855010050744], [95.8259613601287, 22.29783093015334], [95.82841692030468, 22.30168968003477], [95.83311779984666, 22.296988980357185], [95.83901099965794, 22.28856984032592], [95.8449045600974, 22.281413489640897], [95.8516397996371, 22.283097390132525], [95.85837504007611, 22.28604407997034], [95.8634265598879, 22.287727889630446], [95.8680572401496, 22.28856984032592], [95.87013912032421, 22.2871817700227]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
