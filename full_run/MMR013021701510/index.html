
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (75) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (Seikkan)</div><div class="name-mm">ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (75) Ward</div><div class="name-mm">အမှတ် (၇၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013021701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.26621055617255, 16.810770035109215], [96.26601917615295, 16.811148868218652], [96.26310577361261, 16.81691589315392], [96.26019687688449, 16.818579102043998], [96.25733311982776, 16.81910451206369], [96.25512882393616, 16.817818497725455], [96.25674593357809, 16.823805614637592], [96.25819833058858, 16.823392872582986], [96.261904337815, 16.822285660554826], [96.26481247011958, 16.821390786555526], [96.26550674404109, 16.821176527574664], [96.26620037764536, 16.82010607893244], [96.26641082799745, 16.819781303164746], [96.26702507664601, 16.818536842001777], [96.26732826238953, 16.81792259155452], [96.26767476397924, 16.817233403299042], [96.27038048014896, 16.815562347026685], [96.27089894110742, 16.815242144395484], [96.26959303768876, 16.813031962255423], [96.26817546602513, 16.811324533700486], [96.2673145135542, 16.810768818326494], [96.26629419973358, 16.810582176991204], [96.26621055617255, 16.810770035109215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
