
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sat Thay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sat Thay</div><div class="name-mm">ဆပ်သေ</div></div>
        <span class="pcode-badge">MMR007010047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24658630501403, 19.439326591349186], [96.24685489923428, 19.441027685079632], [96.2485495978857, 19.448484362563306], [96.24956641815572, 19.456279981036346], [96.249872856747, 19.458363765075774], [96.25607406356721, 19.45526316076632], [96.26285286177023, 19.453568461215582], [96.27030954015322, 19.451534821574796], [96.27708833655754, 19.449501182833387], [96.28285031628911, 19.448145423372637], [96.28395785117397, 19.448227463126955], [96.2859628779845, 19.448375982565608], [96.28617249196697, 19.448391510260024], [96.28699006743773, 19.448452070606606], [96.29200169332353, 19.448823302653352], [96.28846211283627, 19.43741232591816], [96.28846211283627, 19.429729689273813], [96.28830355696363, 19.4277670034445], [96.28819325421534, 19.426401623935874], [96.28813174868134, 19.425640285770612], [96.28638342705358, 19.42330919176584], [96.28632489557754, 19.423231150397328], [96.28497817340406, 19.42143551903405], [96.28441087206414, 19.420742150729723], [96.28327258486195, 19.420136272071375], [96.27859524057794, 19.423703584952534], [96.27836950984505, 19.423875745769124], [96.27527957329374, 19.426232376023393], [96.27058690366272, 19.427602128035858], [96.26244079510667, 19.43241745440207], [96.26225076116373, 19.432441208195257], [96.25321236415931, 19.435604647236744], [96.24658630501403, 19.439326591349186]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
