
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyu (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyu (East)</div><div class="name-mm">ချောင်းဖြူ (အရှေ့)</div></div>
        <span class="pcode-badge">MMR009010053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73954377012893, 20.61032196368774], [94.73965565568403, 20.610274012735545], [94.74896460113547, 20.611271399555505], [94.75060613366617, 20.611330026359667], [94.75060613366617, 20.608300017931526], [94.75072846574614, 20.603773752556663], [94.75081392292424, 20.600611827074204], [94.75088559889133, 20.597529745201655], [94.7501905560494, 20.597494992699808], [94.74084005292616, 20.597494992699808], [94.7339830182018, 20.596663836566847], [94.71735990183805, 20.595417102817066], [94.71668461080623, 20.595417102817066], [94.71452011980773, 20.595417102817066], [94.7067626658644, 20.595417102817066], [94.70673847590001, 20.595598531147346], [94.70593150973144, 20.601650771565915], [94.70617979456193, 20.601921627581078], [94.70624319406824, 20.60162999273001], [94.71305867112085, 20.60229491817597], [94.72137022885306, 20.605287077736477], [94.72421441936001, 20.60642475429904], [94.72885063135163, 20.60827923909568], [94.73965565568403, 20.610107782048544], [94.73954377012893, 20.61032196368774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
