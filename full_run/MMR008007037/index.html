
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myauk Pan Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myauk Pan Swea</div><div class="name-mm">မြောက်ပန်းဆွဲ</div></div>
        <span class="pcode-badge">MMR008007037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85709731568863, 17.633209159974797], [95.856782833561, 17.62817744323445], [95.85521042202339, 17.62534710228698], [95.84042975303072, 17.626290548669942], [95.83256769624222, 17.625661584414615], [95.8215422210967, 17.625514610910614], [95.81382660181629, 17.625920697082563], [95.80429839985135, 17.62417606717179], [95.80394980463984, 17.63132226630961], [95.80143394671933, 17.63509605364004], [95.806465664359, 17.63509605364004], [95.81527116842972, 17.638240876715145], [95.81715806209496, 17.64610293530228], [95.81810150937724, 17.650191204760347], [95.82156081457998, 17.65931119185808], [95.82502011978278, 17.66308497918851], [95.82816494285788, 17.66308497918851], [95.83414010688051, 17.663399462215466], [95.8394863057485, 17.657424298192836], [95.83980078877545, 17.653021544808496], [95.84326009397819, 17.647675345940513], [95.84923525800082, 17.642014664045576], [95.8514366337937, 17.63792639368819], [95.85709731568863, 17.633209159974797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
