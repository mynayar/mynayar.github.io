
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Hkaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Hkaw</div><div class="name-mm">နားခေါ်</div></div>
        <span class="pcode-badge">MMR015012006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.13757565029607, 22.55907440406054], [97.13872741024187, 22.55068278418321], [97.13764640265941, 22.53554868162638], [97.14088942360809, 22.521135251690566], [97.1470187206375, 22.5019943960246], [97.1455737888993, 22.50347879990676], [97.1163180657262, 22.51681811106704], [97.09633059278269, 22.51991141018351], [97.07967436607919, 22.521101140405335], [97.06990328061198, 22.520774916729067], [97.0820846040213, 22.543187800976284], [97.09945081310462, 22.569059907688654], [97.10881954188841, 22.57626662310622], [97.11209509491277, 22.579056808425037], [97.11212639042066, 22.57903784262237], [97.11230608126073, 22.579035085300973], [97.11573131025182, 22.578023392965235], [97.11679629910998, 22.57468198708409], [97.11893667658643, 22.56966923794505], [97.12090045868928, 22.564989184903027], [97.12287308922174, 22.562360167088116], [97.12341062390124, 22.561643525228533], [97.12359031743927, 22.561643311189925], [97.1280985154342, 22.560460279118615], [97.13260079499076, 22.558774701391428], [97.13269191340112, 22.558774594372096], [97.13278303001289, 22.558774487352764], [97.13757565029607, 22.55907440406054]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
