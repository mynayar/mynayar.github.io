
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Lel Thet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Lel Thet</div><div class="name-mm">ပင်လယ်သက်</div></div>
        <span class="pcode-badge">MMR009007002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76435290066587, 20.17712686990916], [94.76521117135854, 20.168758737625694], [94.76535637409745, 20.166072468969332], [94.76527171192004, 20.166091917707888], [94.75366320359404, 20.168758737625694], [94.7419882551539, 20.169897756876026], [94.74051135341631, 20.170041845354945], [94.7251140642627, 20.16907951500764], [94.7132453209149, 20.170041845354945], [94.69913113859121, 20.168758737625694], [94.69526431999242, 20.169948528102168], [94.69881036210859, 20.17260805991407], [94.70432678825074, 20.175801780028166], [94.70490512157414, 20.1761366048205], [94.7180569726512, 20.17966515062625], [94.72447251039807, 20.18191058870275], [94.72992571689838, 20.18672224223775], [94.73448356826214, 20.18950759459989], [94.73569969988131, 20.19025078714418], [94.74339834535743, 20.192817001703304], [94.74949310482299, 20.19602477012711], [94.75590864167054, 20.202440306974665], [94.76155238483477, 20.203091508766192], [94.76168262465347, 20.202440306974665], [94.7613618481708, 20.19570399274511], [94.76392806272997, 20.181269034838124], [94.76435290066587, 20.17712686990916]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
