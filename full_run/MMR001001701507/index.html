
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Su (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Shan Su (North) Ward</div><div class="name-mm">ရှမ်းစုမြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39921065664657, 25.38014637375619], [97.40335680107557, 25.380363756981865], [97.40337502403821, 25.37996846357379], [97.40344137781739, 25.37980858749637], [97.40344227803877, 25.379662774117776], [97.40348798877972, 25.379596407748068], [97.40348050911825, 25.379344045391406], [97.4035453556337, 25.379261129697454], [97.40361527072821, 25.379105638714293], [97.4037031138077, 25.37899063970633], [97.40374255357602, 25.37881733135481], [97.40378916453835, 25.37864564268233], [97.40387680257243, 25.378372902587444], [97.40397560658903, 25.37829902418065], [97.4041082673827, 25.37812733460885], [97.40423375698236, 25.377942686705694], [97.40475722986235, 25.376562679723918], [97.40408048013012, 25.376368311048793], [97.40387099744862, 25.376383212815085], [97.40275925013935, 25.376359807958806], [97.39952698688097, 25.376176777036676], [97.39921065664657, 25.38014637375619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
