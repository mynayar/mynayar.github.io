
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Pin</div><div class="name-mm">အုန်းပင်</div></div>
        <span class="pcode-badge">MMR007013017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.46024693005182, 18.84203808628871], [96.44983447687969, 18.835161939172224], [96.4430646242331, 18.82839208292836], [96.43310895741251, 18.822816910372183], [96.43310895741251, 18.82173108512154], [96.43167011768185, 18.82134739476652], [96.4256463875708, 18.82263289828967], [96.42715028875489, 18.826305407568555], [96.42592665589052, 18.83038418378311], [96.42918967686217, 18.835278716139896], [96.43122906586876, 18.83772598186863], [96.43326845397604, 18.83854173711154], [96.43549036129122, 18.84068737292398], [96.43787801276017, 18.839493547189477], [96.44360837682518, 18.84044860831665], [96.44718985402858, 18.84140366944382], [96.4490999753836, 18.841642434051153], [96.452681452587, 18.841881198658427], [96.45626292979046, 18.841881198658427], [96.45769552103155, 18.843313789899526], [96.46024693005182, 18.84203808628871]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
