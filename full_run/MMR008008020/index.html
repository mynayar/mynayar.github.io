
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Htaung Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Htaung Twin</div><div class="name-mm">ပျဉ်ထောင်တွင်း</div></div>
        <span class="pcode-badge">MMR008008020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66474874805635, 17.838251430758987], [95.66984974496984, 17.838889056384915], [95.6780040706314, 17.84092763780029], [95.68276076120026, 17.842286692377], [95.68955603228511, 17.846363854308493], [95.69703083020869, 17.85112054397797], [95.70178751987822, 17.846363854308493], [95.70606363612796, 17.839415166077117], [95.70154591701055, 17.836745605025726], [95.69436749966042, 17.826446137279447], [95.69436749966042, 17.824618987376425], [95.68411981487759, 17.824618987376425], [95.6780040706314, 17.824618987376425], [95.66320693235411, 17.821277696608433], [95.66346909822039, 17.823637192102808], [95.66690225383599, 17.82738245293791], [95.66627804429635, 17.830503503334057], [95.66378120343984, 17.832688238971116], [95.66502962431775, 17.837057710245176], [95.66474874805635, 17.838251430758987]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
