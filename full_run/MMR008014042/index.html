
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Net Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Net Kone</div><div class="name-mm">ကျွန်းနက်ကုန်း</div></div>
        <span class="pcode-badge">MMR008014042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72083265530284, 18.252986485338056], [95.7234790471204, 18.25739713566935], [95.73200630724534, 18.26327800577542], [95.74259187091815, 18.265924396693606], [95.74906082659595, 18.268570787611793], [95.75082508780764, 18.270923136193858], [95.75288339225483, 18.270923136193858], [95.75641191377883, 18.267100571434298], [95.75783961270804, 18.266764029836168], [95.7576806908113, 18.266459430358452], [95.75847326602849, 18.26130769189649], [95.75946398617407, 18.257344815810654], [95.75748254858081, 18.25615595163589], [95.75569925411736, 18.25239121957918], [95.75569925411736, 18.250409783784562], [95.7535196733943, 18.24981534989854], [95.75015122759714, 18.24446546830677], [95.74935865327927, 18.24010630596132], [95.74717907075757, 18.237728580309806], [95.74499948823586, 18.235152709729846], [95.74213927001136, 18.23347626911459], [95.73885702962826, 18.23396384915236], [95.73608301771714, 18.23218055378959], [95.73231828655975, 18.230991688715505], [95.72984451960895, 18.229342511947436], [95.72759565511546, 18.23534387681849], [95.7243611768269, 18.24122474602524], [95.7234790471204, 18.2450473107848], [95.72083265530284, 18.252986485338056]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
