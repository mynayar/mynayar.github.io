
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Ma (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Ma (East)</div><div class="name-mm">မင်းမ (အရှေ့)</div></div>
        <span class="pcode-badge">MMR005019038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80477960029839, 22.036537980043818], [94.8153654652441, 22.036281362095224], [94.82571424641537, 22.037113715225814], [94.82857966811724, 22.035054620274536], [94.83153660033389, 22.03056912656399], [94.82928486520444, 22.023055039958194], [94.82930758117999, 22.022945255219383], [94.83041317442854, 22.01760194317518], [94.83062399979781, 22.01658354009834], [94.83850908013, 22.01393708982488], [94.83366204007115, 22.014337500375404], [94.83173927964413, 22.013418240359556], [94.82829479976527, 22.01338196980214], [94.82389559960228, 22.012208910313007], [94.8145546796548, 22.012208910313007], [94.80999312038625, 22.012426080399337], [94.8071692797385, 22.01763950965568], [94.80586571962732, 22.02307010989773], [94.80673475970144, 22.028066190102663], [94.80477960029839, 22.036537980043818]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
