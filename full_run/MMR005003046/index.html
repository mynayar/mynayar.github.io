
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bone Khaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bone Khaung</div><div class="name-mm">ဘုန်းခေါင်း</div></div>
        <span class="pcode-badge">MMR005003046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38599019758959, 21.724998644571826], [95.3857586329546, 21.724806820978074], [95.38514493918763, 21.724298271448106], [95.38425370744272, 21.723560448755734], [95.38374888020672, 21.723142589558904], [95.38316416889131, 21.722715240715843], [95.38314157342495, 21.722698729163085], [95.3824593234391, 21.72220049575634], [95.37988176033502, 21.724261109662507], [95.37279480043975, 21.724261109662507], [95.36707943976438, 21.726089999753754], [95.36662223972462, 21.730433670377636], [95.36662223972462, 21.73386285009053], [95.36822244031345, 21.740035499838484], [95.3743950001292, 21.746665259694055], [95.38148196002447, 21.749180040226747], [95.38742592027006, 21.750780329848396], [95.38920036000866, 21.75352370995131], [95.38902611995951, 21.749865839836673], [95.38468272003155, 21.74575076968233], [95.38331076018352, 21.740264100308025], [95.38536851964153, 21.736606230193445], [95.38582571968129, 21.734548739632658], [95.38628291972105, 21.728147580246684], [95.38628291972105, 21.725241254680213], [95.38623589237261, 21.72520222590208], [95.38599019758959, 21.724998644571826]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
