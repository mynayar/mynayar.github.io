
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR007013038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4446141237429, 18.613854761887808], [96.44633029910409, 18.612666639653753], [96.44704659472461, 18.60932392795695], [96.44633029910409, 18.60717504199465], [96.44704659472461, 18.603116033778008], [96.44442017774907, 18.602160972650836], [96.44203252628012, 18.60025085219513], [96.44251005729336, 18.5985794963467], [96.44179376077352, 18.594042957116812], [96.44155499616619, 18.59237160126844], [96.44184810410678, 18.591980790980756], [96.43902701358587, 18.590288137387688], [96.43621358079218, 18.588600078430943], [96.4330223580954, 18.585484834957242], [96.42897251127243, 18.585084367749403], [96.42890044230165, 18.58998394979949], [96.4293779733149, 18.593565427002886], [96.428661676795, 18.597385669712935], [96.42770661656715, 18.601922208043504], [96.42496081728797, 18.601922208043504], [96.42603525981946, 18.60407109400586], [96.4267515563393, 18.607413806601926], [96.43033303264338, 18.609562692564282], [96.43224315489772, 18.61099528380538], [96.4365409277217, 18.61386046628752], [96.44107746605226, 18.614576761908097], [96.44322635201462, 18.61481552741469], [96.4446141237429, 18.613854761887808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
