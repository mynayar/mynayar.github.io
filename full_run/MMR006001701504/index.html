
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Baw Seik Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawei</div><div class="name-mm">ထားဝယ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thin Baw Seik Ward</div><div class="name-mm">သင်္ဘေဆိပ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006001701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.18910163043597, 14.072745731330485], [98.18959745186095, 14.070677331993352], [98.18558025672354, 14.069889067226711], [98.18542948987914, 14.070061066165295], [98.18526280953108, 14.070434524034113], [98.18519472905353, 14.070546105618348], [98.18519350507626, 14.070602675673001], [98.18527454748244, 14.070639469635864], [98.18529802428446, 14.070678181852657], [98.18518746433006, 14.070881986214715], [98.18470811398834, 14.072093705759983], [98.18516380856295, 14.072201645989196], [98.18671500059685, 14.07243318544323], [98.18814703335897, 14.072601306505135], [98.18910163043597, 14.072745731330485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
