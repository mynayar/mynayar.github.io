
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tan Pa Wa Di Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanmyathazi</div><div class="name-mm">ချမ်းမြသာစည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tan Pa Wa Di Ward</div><div class="name-mm">တမ္ပဝတီရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010004701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07770886015544, 21.92580765577219], [96.07770048677133, 21.925749165005982], [96.07743609656632, 21.92575687276309], [96.07673737571963, 21.925626785212216], [96.07667367241214, 21.92562712076017], [96.07259690239795, 21.925648594540633], [96.07109841980053, 21.92570547519972], [96.06940853326245, 21.92573504669963], [96.06728442441579, 21.92572102853171], [96.06569782489697, 21.925749829506287], [96.06633733974286, 21.927313429859794], [96.06656395555945, 21.92768558134827], [96.06657431222806, 21.927990216932585], [96.06658072747615, 21.92817891785006], [96.06811636967547, 21.93011544084908], [96.06962081935376, 21.93226773911033], [96.06985582404678, 21.932665976334818], [96.0705383534389, 21.934021485952258], [96.07201280672797, 21.936704598069127], [96.0726146552471, 21.93793925602847], [96.07369805099034, 21.94110691888011], [96.07579350075264, 21.9405312869348], [96.07809630917217, 21.939840196411524], [96.07801485596724, 21.937276882564277], [96.07782324313428, 21.933877504361703], [96.07876443925994, 21.933850675438634], [96.07818094543143, 21.929514257502092], [96.07801624866676, 21.928534740483315], [96.0777098469112, 21.925816410056257], [96.07770886015544, 21.92580765577219]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
