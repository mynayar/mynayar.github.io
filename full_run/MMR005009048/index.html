
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Yoke Ton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Yoke Ton</div><div class="name-mm">ငြုပ်တုံ</div></div>
        <span class="pcode-badge">MMR005009048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37477156065904, 22.753170276187348], [95.37623100026053, 22.7530580398967], [95.3783679603132, 22.757942069970625], [95.37806268004869, 22.76282618997675], [95.38264151979035, 22.767099750353225], [95.38595136036707, 22.770409769895025], [95.38935695985589, 22.767405029718418], [95.38987391984557, 22.76743545018593], [95.38966224012034, 22.76404722020311], [95.3899675203848, 22.758857819932473], [95.38935695985589, 22.75580528978236], [95.39301995970345, 22.755500010417222], [95.39515691975612, 22.752142289934795], [95.39515691975612, 22.748784480419488], [95.39576748028503, 22.744510830110755], [95.39721503984225, 22.739878530170074], [95.3940186001783, 22.739878530170074], [95.38486524013877, 22.739878530170074], [95.37908399962691, 22.737469769814084], [95.37603912000947, 22.736532779664117], [95.37562043973156, 22.741763580225097], [95.37531516036643, 22.745731860337116], [95.37378911967221, 22.75061598034324], [95.37477156065904, 22.753170276187348]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
