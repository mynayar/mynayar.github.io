
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myoma (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mudon</div><div class="name-mm">မုဒုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myoma (3) Ward</div><div class="name-mm">မြို့မ (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011005701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.7300989634964, 16.247798578341758], [97.72605594612509, 16.249467713764034], [97.72183002373669, 16.25130941649644], [97.72095914095166, 16.252051808644126], [97.71916026843172, 16.253850681164067], [97.71826083217172, 16.255178420447805], [97.71791937937593, 16.255757819467817], [97.71750535308962, 16.25636458215979], [97.71766953602031, 16.256635840171953], [97.71918287379066, 16.256807161921017], [97.72271146186455, 16.256129991306125], [97.72275920327468, 16.256145670985973], [97.72684235828825, 16.257980235799266], [97.72935506858158, 16.258958194565082], [97.72958483367319, 16.259030751867726], [97.72940460413923, 16.258294815953036], [97.7284409221109, 16.25468993209472], [97.7282149270113, 16.253931217538543], [97.72802169105535, 16.253075675949177], [97.72784436864873, 16.25205207665411], [97.72777389435893, 16.25147589048423], [97.72781026818592, 16.251163788936964], [97.72794316929966, 16.25071356178101], [97.728320638446, 16.250098711394163], [97.72851728444827, 16.24983898874109], [97.72883896548078, 16.249496328917477], [97.7292549911271, 16.24915148594421], [97.72965282985992, 16.24875426101008], [97.7298051452605, 16.248501084259633], [97.73008275051859, 16.24783708461382], [97.7300989634964, 16.247798578341758]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
