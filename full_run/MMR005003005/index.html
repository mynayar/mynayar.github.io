
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Nat Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Nat Kone</div><div class="name-mm">သနပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR005003005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28592139965292, 21.722660820040858], [95.2875374400009, 21.722172839804784], [95.28805188009028, 21.7196009999862], [95.28993792029883, 21.715143030026866], [95.29148123966752, 21.711542310029643], [95.29456751957542, 21.70828457976961], [95.29270992042655, 21.707741609587686], [95.28859476034, 21.705226919886513], [95.2840227599425, 21.701797650241417], [95.28173640001489, 21.697225380047314], [95.28173640001489, 21.695396489956124], [95.2805934003652, 21.69219590981345], [95.27876460020622, 21.68808083965905], [95.27739264035813, 21.68396577040403], [95.27716403988859, 21.68030799022165], [95.2725920403904, 21.679850700249688], [95.26870547987403, 21.679622099780147], [95.26534595984822, 21.680138610108827], [95.26534595984822, 21.68288199021174], [95.26717511973607, 21.689054550027492], [95.26831596011351, 21.69184373979681], [95.2692325203646, 21.691797930130406], [95.2692325203646, 21.694084020261357], [95.26786092024531, 21.699799380037405], [95.27037552001428, 21.703685849722262], [95.27197608033191, 21.709629809967794], [95.27746283963842, 21.714430679732118], [95.28066323991663, 21.718088549846755], [95.28592139965292, 21.722660820040858]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
