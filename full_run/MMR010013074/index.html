
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay So Moe Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay So Moe Kaung</div><div class="name-mm">မြေစိုမိုးကောင်း</div></div>
        <span class="pcode-badge">MMR010013074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21546084184445, 21.464534781255225], [96.2172149928777, 21.46456135891964], [96.22483891728228, 21.462543261362498], [96.22551161556868, 21.45626473622866], [96.22528738310632, 21.44774387927663], [96.22282081882577, 21.443259218338312], [96.21474842859715, 21.438998789862296], [96.21237754768572, 21.43558692929338], [96.2114951922494, 21.434067893418614], [96.20997320479961, 21.43393281434794], [96.20644031706706, 21.43500804288692], [96.20604591578643, 21.435205241728568], [96.20521148522192, 21.435622456111503], [96.20213941010576, 21.436851287956642], [96.20088054540093, 21.43896261373368], [96.19737768962875, 21.44161300573569], [96.19476642533033, 21.44192021504591], [96.19512768389558, 21.444492785113994], [96.19614885958225, 21.44898599141044], [96.19570356476777, 21.451608795809307], [96.19532924085183, 21.45206921722064], [96.1942311767275, 21.453419844250448], [96.19218268658176, 21.454858640813654], [96.19703401730612, 21.460973629629336], [96.20241561079189, 21.46433712555796], [96.21546084184445, 21.464534781255225]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
