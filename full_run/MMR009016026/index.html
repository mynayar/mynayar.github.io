
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Tee</div><div class="name-mm">တောင်တီး</div></div>
        <span class="pcode-badge">MMR009016026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3690182458954, 19.206643753706317], [95.39339149662032, 19.194115447569914], [95.4120564256636, 19.187349410746776], [95.41928908562284, 19.18478298304825], [95.41962844839423, 19.18354893783328], [95.41275636081747, 19.181049997059745], [95.39992422232507, 19.17078428716519], [95.38965851243046, 19.167051301176684], [95.37705968505645, 19.16448487257884], [95.36376092342795, 19.158418770909577], [95.36120290708857, 19.15680816876204], [95.36096118371171, 19.157018902400466], [95.34836235723708, 19.160985198608103], [95.32713099959602, 19.16915110483967], [95.32701286015543, 19.167969705937253], [95.3266195101823, 19.16845296473258], [95.32923080505765, 19.180116750787477], [95.33133060872069, 19.19528200585995], [95.33165168827486, 19.195363636422712], [95.3588613791494, 19.20228135380148], [95.36746879225103, 19.206480092382435], [95.36762809725894, 19.206557801901113], [95.3684271547894, 19.206947586062313], [95.3690182458954, 19.206643753706317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
