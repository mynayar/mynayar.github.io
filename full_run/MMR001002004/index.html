
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Myay (1)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waingmaw</div><div class="name-mm">ဝိုင်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Myay (1)</div><div class="name-mm">အောင်မြေ(၁)</div></div>
        <span class="pcode-badge">MMR001002004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.38536123473324, 25.239093583402223], [97.39118596555994, 25.24325410529275], [97.39587538324241, 25.245811968747432], [97.40033911605741, 25.24824673210105], [97.4028116554336, 25.250101136858007], [97.40366753392959, 25.250743045954835], [97.4094922647563, 25.254071463827017], [97.4169812063177, 25.254071463827017], [97.42530225099813, 25.254071463827017], [97.43445539969701, 25.254071463827017], [97.4411122363407, 25.256567776781537], [97.45026538593885, 25.25906409063532], [97.45692222168327, 25.264056718342943], [97.46940379005292, 25.265720927279006], [97.49603113392976, 25.267385136215125], [97.51100901525393, 25.266553031297406], [97.50185586475641, 25.254071463827017], [97.49103850712146, 25.239925687420566], [97.46940379005292, 25.229108328886298], [97.41864541525376, 25.215794655598927], [97.40678875429762, 25.21211500300501], [97.40649201579396, 25.21202291242753], [97.40338746436004, 25.211906199311727], [97.39386914324643, 25.212603556109286], [97.39310035060078, 25.212565096601963], [97.38952175662382, 25.21829097035203], [97.38702544366936, 25.229108328886298], [97.38536123473324, 25.239093583402223]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
