
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Ma Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Ma Yan</div><div class="name-mm">မမရမ်း</div></div>
        <span class="pcode-badge">MMR007011010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74785843371978, 18.24247743238766], [96.75281583588219, 18.243643880061086], [96.76197609372178, 18.243207677392434], [96.76918272999905, 18.24235983793625], [96.77200875689869, 18.23753704090177], [96.77113635066212, 18.232738810647618], [96.7677411698192, 18.22695756024325], [96.76590191773937, 18.224014756375936], [96.76197609372178, 18.214418295867688], [96.76023128304735, 18.21267348519325], [96.75805026880494, 18.206566646033934], [96.75368824121944, 18.200023605105343], [96.75019861987045, 18.194789172182595], [96.74893847812831, 18.191008747855506], [96.74670899762219, 18.191299549934342], [96.73711253711394, 18.19304436060878], [96.7325062356743, 18.19246857326607], [96.7318781041912, 18.19435296861468], [96.7270798739371, 18.201332213111186], [96.7227178463516, 18.2074390522705], [96.72184544101435, 18.210928673619435], [96.71879202233401, 18.21485449763702], [96.71610002769415, 18.219565488256706], [96.72097303477778, 18.22357855280802], [96.72577126593126, 18.22445095904459], [96.7331867121971, 18.229249189298685], [96.739729754025, 18.236664635564523], [96.74540038871703, 18.24189906938659], [96.74785843371978, 18.24247743238766]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
