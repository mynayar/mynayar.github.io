
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kone</div><div class="name-mm">တောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR008010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63419766928706, 18.123975092876265], [95.63128307085708, 18.122274911058355], [95.63006865514438, 18.12057472924039], [95.62788270632188, 18.119846078733588], [95.62739694021667, 18.117660130810464], [95.62496810879122, 18.113288234064783], [95.62375369307853, 18.113045350562516], [95.6205962120456, 18.113045350562516], [95.6159814317977, 18.11110228524234], [95.61160953505208, 18.109887870428906], [95.60480880598169, 18.110616519137125], [95.59946537702558, 18.10964498692664], [95.59727942910246, 18.107459038104196], [95.59557924638517, 18.114016882772944], [95.59703654470081, 18.11644571509771], [95.59800807781062, 18.1147455332798], [95.60359439116826, 18.11644571509771], [95.61185241765503, 18.120817611843336], [95.61816737972083, 18.123003559766516], [95.62229639386356, 18.12664680780398], [95.62642540800624, 18.129804288836908], [95.62909712203464, 18.132961769869837], [95.62982577164212, 18.131504470654875], [95.63662649981319, 18.129318521832374], [95.63419766928706, 18.123975092876265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
