
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Gyi</div><div class="name-mm">စမ်းကြီး</div></div>
        <span class="pcode-badge">MMR009014061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.73268726420594, 19.42886803173434], [94.73324159372464, 19.429537847693553], [94.72810059766454, 19.442229682953553], [94.73552710739017, 19.44867901992086], [94.74152657918836, 19.461820720350033], [94.74126760861333, 19.46228316703457], [94.75038294171947, 19.46410623311624], [94.76552446638107, 19.465820367915683], [94.77666422017768, 19.467777352043186], [94.77853037817448, 19.461556825087484], [94.78495367077534, 19.45421592002873], [94.78592676690681, 19.454378102867224], [94.78592176577695, 19.454198079278], [94.7858712841325, 19.45238069421373], [94.7858712841325, 19.445498595383924], [94.78506959068909, 19.433874050347185], [94.77838047827652, 19.433251806725536], [94.77066687077951, 19.43296611819187], [94.75238276595195, 19.428395090860818], [94.73924106642215, 19.428680781193123], [94.73268726420594, 19.42886803173434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
