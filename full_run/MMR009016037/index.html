
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Lon Hmaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Lon Hmaw</div><div class="name-mm">ကလုံမှော်</div></div>
        <span class="pcode-badge">MMR009016037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14086710733119, 19.010346771986008], [95.14188158306865, 19.01399888643948], [95.1432814533764, 19.020298299227193], [95.14724774958404, 19.02706433605033], [95.14794768473791, 19.035463554299668], [95.14750363998104, 19.035674287038773], [95.14818099585631, 19.036163487654903], [95.15191398184487, 19.037563357962654], [95.15259836322394, 19.037205613947947], [95.16217969263874, 19.032197191447267], [95.17197878029651, 19.02683102403256], [95.17547845516663, 19.025897777760292], [95.17536526379592, 19.025445014076183], [95.17361196172271, 19.01843180578328], [95.1738452728411, 19.01119914582398], [95.17407858485888, 19.00653291356315], [95.17435556165992, 19.002101277551958], [95.16171307040196, 19.004666421018555], [95.15261391699875, 19.006066291326306], [95.1432814533764, 19.01096583470553], [95.14086710733119, 19.010346771986008]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
