
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Khin</div><div class="name-mm">ကွမ်းခင်း</div></div>
        <span class="pcode-badge">MMR009025051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.24499521765523, 21.309238790038194], [94.24307708603874, 21.31047187477725], [94.23158714343197, 21.325366245955536], [94.22562939478081, 21.330472887014196], [94.21116057829812, 21.327068459342], [94.19967063479203, 21.325366245955536], [94.18179739063714, 21.321536265386385], [94.16562635986867, 21.317280730121638], [94.15796639783105, 21.31813183681487], [94.15073198869038, 21.32323847787353], [94.14534683568797, 21.33093155384819], [94.1524256917923, 21.33461845767573], [94.18763564277077, 21.342462259126023], [94.18972732375704, 21.345599779706106], [94.19025024355398, 21.35135190017013], [94.19530513762209, 21.356058181040282], [94.20192879198021, 21.36128738170737], [94.2044315180002, 21.36263753569375], [94.2044478020245, 21.361969871812164], [94.20764015157181, 21.362235902065265], [94.215621026789, 21.36303398922729], [94.23264689373923, 21.36037369658885], [94.2547273148138, 21.35664928923336], [94.25507248270895, 21.356835149422636], [94.25482707570904, 21.355485410923052], [94.25615722157858, 21.34850214555763], [94.25915005023467, 21.339191125370178], [94.25948258715175, 21.33187532308773], [94.25615722157858, 21.32322937493575], [94.25050410208269, 21.31591357175398], [94.24485098168753, 21.309927916240383], [94.24499521765523, 21.309238790038194]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
