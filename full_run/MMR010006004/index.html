
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tat Gyi</div><div class="name-mm">တပ်ကြီး</div></div>
        <span class="pcode-badge">MMR010006004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99429388415547, 21.864760647885646], [95.99450263658747, 21.867578813811235], [95.99523327279735, 21.870083850189587], [95.99533764901332, 21.87321514566247], [95.99543772107404, 21.875216583278757], [95.99693403287938, 21.877354171957506], [95.9977383091757, 21.876659570682705], [95.99972146267544, 21.876450818250703], [96.00337464102694, 21.876450818250703], [96.0065059356005, 21.875198299162207], [96.00942847864144, 21.87384140475706], [96.01109850259388, 21.872902016115177], [96.01329041032426, 21.870501355952854], [96.01088975016188, 21.868622578669147], [96.01088975016188, 21.86587463001024], [96.01088975016188, 21.8658044127435], [96.00848908999956, 21.86434314212238], [96.00619280695253, 21.86371688302779], [96.00462715921606, 21.86142059908144], [96.00723657181038, 21.85839367982453], [96.01339478564091, 21.856932409203353], [96.01151600925647, 21.853592361298467], [96.00848908999956, 21.854114243277763], [96.00585370408521, 21.854353823570136], [96.00504466497938, 21.854427372825057], [96.00347901724291, 21.854636126156322], [96.00139148662788, 21.855053631919645], [95.99565077856062, 21.856932409203353], [95.9943982603715, 21.858811187386436], [95.99481576613476, 21.86194248196], [95.99429388415547, 21.864760647885646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
