
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Eik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee Eik</div><div class="name-mm">ကျီးအိပ်</div></div>
        <span class="pcode-badge">MMR010013005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02584142164437, 21.626980835996847], [96.01850318937073, 21.627920150894283], [96.01595784807631, 21.626935263751477], [96.0100179860413, 21.627760946610465], [96.00674110202033, 21.623255234341627], [96.00182578183444, 21.622026404295184], [95.99977773055787, 21.62571289623321], [96.0025540438341, 21.627606390022947], [96.00040183487681, 21.628693967152913], [96.00074619158352, 21.629086884552123], [96.00115801363148, 21.629556782119835], [96.00291239489115, 21.631158233665587], [96.00370598993953, 21.632535373608675], [96.00384354214583, 21.633137100996464], [96.00419003474235, 21.63465284175527], [96.00386204030099, 21.636799993824695], [96.00477469029977, 21.637902692155592], [96.00483485584397, 21.637975387054496], [96.00380437397274, 21.641103979165337], [96.00319033576545, 21.643567987572624], [96.01726450725124, 21.643461965597282], [96.02987761675865, 21.641107518896945], [96.0271868200158, 21.63370782785404], [96.02584142164437, 21.626980835996847]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
