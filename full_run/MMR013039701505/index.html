
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Taw (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyun Taw (North) Ward</div><div class="name-mm">ကျွန်းတော (မြောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13591303156124, 16.80863380440661], [96.13606767808096, 16.808056633007254], [96.1342761988875, 16.807782364064906], [96.1339359278009, 16.808052443965153], [96.13264732341531, 16.807943725822327], [96.13265037571432, 16.80727195743492], [96.13264541595322, 16.80687065115967], [96.12984199531189, 16.806741459950445], [96.12988090537954, 16.807113647976507], [96.12991142297386, 16.807579040840096], [96.1299304957958, 16.808048248627813], [96.1299304957958, 16.808640480074132], [96.12994607295298, 16.80904102372432], [96.13024330158714, 16.808980941817083], [96.13051541665322, 16.808908462755426], [96.1308472952665, 16.80879402132706], [96.13119125357355, 16.808701515262783], [96.13178062427647, 16.808622361432867], [96.13260819840968, 16.80856243960494], [96.13298034686557, 16.808561325344954], [96.13342285198308, 16.80857276921796], [96.13383293204424, 16.80857276921796], [96.13425827090254, 16.808580398166896], [96.13469123870976, 16.808580398166896], [96.13504314432572, 16.808591842939222], [96.13541221620085, 16.808591842939222], [96.13591303156124, 16.80863380440661]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
