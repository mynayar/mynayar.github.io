
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Thay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Thay</div><div class="name-mm">ဆင်သေ</div></div>
        <span class="pcode-badge">MMR005033008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72781491972285, 26.066420549668692], [95.71832280035699, 26.055114750445455], [95.69709323956141, 26.043875549616985], [95.70629879984978, 26.036315909651535], [95.70067208265056, 26.02701906727617], [95.6983545747039, 26.017086893445423], [95.69620260496629, 26.01013437230347], [95.69152747661184, 26.006852613057674], [95.6893859623923, 26.008518235728047], [95.68748239259838, 26.009826939961386], [95.68480549937436, 26.01101667018321], [95.68284244392373, 26.012325374416548], [95.68117682125336, 26.013277158414155], [95.6800465766882, 26.01482380797239], [95.67879735991028, 26.016013538194272], [95.67784557591267, 26.01666789031094], [95.67594200701808, 26.017619675207868], [95.67362203313036, 26.018214539869177], [95.6716589767804, 26.018452486093395], [95.67005284066613, 26.018274026425217], [95.66844670455185, 26.017917107088863], [95.66587758518244, 26.0175127170383], [95.65473007473321, 26.007122457335583], [95.65167239956168, 26.004272489583798], [95.62469472028516, 25.978515659769926], [95.62231440008958, 25.97631840017408], [95.59429919994818, 25.991088840277826], [95.58508283970133, 26.003112749953516], [95.59307844041774, 26.015075639729048], [95.61309803984273, 26.03912354991195], [95.62908924037617, 26.057678220273715], [95.65832520004801, 26.07769772976644], [95.67386424034248, 26.099086680106268], [95.6810912399688, 26.097717330090745], [95.71173083990641, 26.07769772976644], [95.72781491972285, 26.066420549668692]]]]};
        const layer = L.geoJSON(geojsonData, {

</body>
</html>
