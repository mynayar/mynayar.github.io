
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lan Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lan Kyin</div><div class="name-mm">ဖလန်ကျင်း</div></div>
        <span class="pcode-badge">MMR010031048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8962393751471, 21.106072755952994], [95.89400477300194, 21.100206927008117], [95.88955992594987, 21.089700926356727], [95.89156274222682, 21.087809376901248], [95.88118943294603, 21.085074473807992], [95.87941337802505, 21.084606221100273], [95.86774685173589, 21.085148851338488], [95.85852215657235, 21.090303827359776], [95.85076853733818, 21.093337618336477], [95.84874815190574, 21.097378388302047], [95.84511145902667, 21.102631388627742], [95.84551553611317, 21.107076234780436], [95.85117261442468, 21.107480311866937], [95.85238484478481, 21.111521081832507], [95.86006230673013, 21.114349621437952], [95.8576378451105, 21.122027083383216], [95.85716174941524, 21.125597805594282], [95.86611896461858, 21.123404201742574], [95.87697154689943, 21.12069105684685], [95.87912402475399, 21.118060751202734], [95.88404542975286, 21.113648456011504], [95.89337912994296, 21.108217940305735], [95.8962393751471, 21.106072755952994]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
