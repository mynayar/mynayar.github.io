
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Hpyu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Hpyu Kone</div><div class="name-mm">ဇီးဖြူကုန်း</div></div>
        <span class="pcode-badge">MMR010009016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1386894806351, 22.255494031824185], [96.13938974673948, 22.25773488066028], [96.13938974673948, 22.263980211817398], [96.13938974673948, 22.264677235865804], [96.14072803237286, 22.265095450294837], [96.1503190762644, 22.267548972607074], [96.16191754725708, 22.268887258240397], [96.17410318741224, 22.27229206902382], [96.17217773441496, 22.26844116302931], [96.16905506793711, 22.266433735028897], [96.16414802331269, 22.26085754713813], [96.1605792616237, 22.25706573919257], [96.15522612178813, 22.255950500715073], [96.15076517057622, 22.254389168825128], [96.14873893235591, 22.252518793907257], [96.1478655530529, 22.251712597558367], [96.14652726831883, 22.24569031535583], [96.14251241231801, 22.24234460172204], [96.14028193716172, 22.242790696933184], [96.1391666995836, 22.249259075246187], [96.1382745091613, 22.254166120769924], [96.1386894806351, 22.255494031824185]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
