
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Pyin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Pyin Thar</div><div class="name-mm">ကျောက်ပြင်သာ</div></div>
        <span class="pcode-badge">MMR005024034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85351576024419, 23.710327109708373], [95.84289540000276, 23.699523959563123], [95.8292845196649, 23.69390867994167], [95.82647688030386, 23.696716320202086], [95.81311044019469, 23.70349125042094], [95.81091299983512, 23.711914080370548], [95.81094684042438, 23.711964300312275], [95.81091299983512, 23.712097140071023], [95.81927507968123, 23.724304200278652], [95.82269291984244, 23.735473649689254], [95.82830820036321, 23.746704119899277], [95.83892819997652, 23.751281699690765], [95.84692379979356, 23.752075229987952], [95.85913068013684, 23.74609374013403], [95.87030040024331, 23.73712155031933], [95.88049307979185, 23.731872569963173], [95.87969964032618, 23.729675310367327], [95.87091060014416, 23.7224731500159], [95.86431900032164, 23.7175292700598], [95.85351576024419, 23.710327109708373]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
