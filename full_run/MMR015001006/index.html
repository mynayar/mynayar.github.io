
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wein Htang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wein Htang</div><div class="name-mm">ဝိန်းထန်</div></div>
        <span class="pcode-badge">MMR015001006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.83847936862804, 22.961827528417757], [97.83111566125882, 22.96923013866001], [97.82656379128599, 22.975488961446445], [97.82505484580457, 22.97709121878478], [97.82229641284925, 22.987153127914553], [97.82058946093491, 22.997110344267014], [97.81897734073175, 23.004364887429688], [97.83083116882347, 23.013610873143307], [97.84107287671196, 23.020154186566515], [97.84306432016228, 23.022999104625], [97.8464782230916, 23.026128516018275], [97.85131458460046, 23.027835467033242], [97.85956484903863, 23.026697499989666], [97.87322045985638, 23.025275039611415], [97.87662382632857, 23.0262760300148], [97.87862580623602, 23.01986969503048], [97.88374665928097, 23.014179857114755], [97.88972098873268, 23.00792103612696], [97.89445777910328, 22.998447456285135], [97.89028997270412, 22.997679328238462], [97.88630708580342, 22.994549916845244], [97.87834131380066, 22.985446176899586], [97.87521190330676, 22.98174778243424], [97.87179800037745, 22.981463289998885], [97.86781511437607, 22.976342436953928], [97.85216806010794, 22.968945648023293], [97.83847936862804, 22.961827528417757]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
