
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pein Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pein Chaung</div><div class="name-mm">ပိန်းချောင်း</div></div>
        <span class="pcode-badge">MMR009025023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13488720677924, 20.992743794390663], [94.13944708701354, 20.993883764224393], [94.15073764003012, 20.99434460292116], [94.15419393070539, 20.996187958607436], [94.15538050070961, 20.997176766794382], [94.15972399776433, 20.99111873114458], [94.16778867900439, 20.986971181075205], [94.1712590782439, 20.98612474186342], [94.1705537120842, 20.98558866408564], [94.1643323874298, 20.97959775922925], [94.1576502231793, 20.97406769217031], [94.15188973722167, 20.96600301093025], [94.14721871337298, 20.9615350755833], [94.14689731455945, 20.961833517402965], [94.14290337768881, 20.965542172233484], [94.1366820530344, 20.973837272372293], [94.13506911714609, 20.978215242239685], [94.13552995584286, 20.987432019771973], [94.13576037564087, 20.99157956984135], [94.13488720677924, 20.992743794390663]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
