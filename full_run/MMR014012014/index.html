
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Pang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Laihka</div><div class="name-mm">လဲချား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Pang</div><div class="name-mm">ဝမ်ပန်း</div></div>
        <span class="pcode-badge">MMR014012014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.62452666177609, 21.30100410905243], [97.61962842421246, 21.29900853141862], [97.61536631760151, 21.29727211681478], [97.59454983610613, 21.285027127699834], [97.58049374818796, 21.28205372439993], [97.56271286440722, 21.27829238368662], [97.5601790928909, 21.27829238368662], [97.55965161712851, 21.295435369346876], [97.55291687311524, 21.332170336691718], [97.552362933003, 21.333001247309767], [97.57985584916815, 21.341966327983698], [97.61291731977855, 21.354823566554387], [97.6349583010848, 21.357884813833152], [97.63502274830125, 21.358368168855975], [97.6380195483635, 21.35237456873142], [97.6482594558093, 21.326262806183593], [97.65026453837783, 21.321149847387574], [97.64965228802271, 21.31625185084232], [97.63189705380603, 21.304006861727316], [97.62452666177609, 21.30100410905243]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
