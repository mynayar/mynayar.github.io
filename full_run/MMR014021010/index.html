
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongpan</div><div class="name-mm">မိုင်းပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Yin</div><div class="name-mm">နောင်ရင်း</div></div>
        <span class="pcode-badge">MMR014021010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.33418706268287, 20.17845410467322], [98.33243356275875, 20.175131685279098], [98.32240611385112, 20.177638547281163], [98.30820056040761, 20.175131685279098], [98.29566624859854, 20.174296064012196], [98.27394010824946, 20.180145410182604], [98.27383701176876, 20.18220733080375], [98.27074005960611, 20.24414636506276], [98.27394010824946, 20.250546460550765], [98.27520026707873, 20.26213992321891], [98.28103434276079, 20.261466760882342], [98.28334084210621, 20.261200626307925], [98.30715603382396, 20.26057391035772], [98.32783764938807, 20.263080773259105], [98.34428901682475, 20.268564562104928], [98.35603985005912, 20.272481506216593], [98.36084466964587, 20.27488391556028], [98.36084466964587, 20.265378729944473], [98.3483103578368, 20.205214032901324], [98.33418706268287, 20.17845410467322]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
