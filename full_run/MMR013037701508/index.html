
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ga Lon Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ahlone</div><div class="name-mm">အလုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ga Lon Ward</div><div class="name-mm">ဂဠုန်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013037701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12681465157499, 16.793321100988067], [96.12652015687979, 16.79324150109443], [96.12583923339395, 16.793060302990625], [96.1254692082374, 16.79297065766974], [96.12513669380343, 16.792877833245484], [96.12492980926334, 16.79271163943065], [96.12475929240748, 16.79247703598645], [96.12453422537425, 16.792300033219988], [96.12353706338484, 16.791892052176536], [96.12316821184356, 16.791790155391425], [96.12309074424252, 16.792343140423668], [96.1230106353326, 16.793049812398976], [96.12297058132731, 16.793323516567114], [96.12287881630436, 16.793841892089688], [96.12337684556502, 16.79387092580265], [96.12365913376209, 16.793890000423232], [96.12397956940168, 16.793920517118238], [96.12425422685112, 16.793947219788436], [96.1246245254016, 16.793985912220137], [96.1250276564013, 16.793989181255768], [96.12560462994975, 16.794000626028094], [96.12589263963366, 16.79400825497703], [96.12628459925492, 16.794008969938034], [96.12666754317263, 16.79364898031622], [96.12681465157499, 16.793321100988067]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
