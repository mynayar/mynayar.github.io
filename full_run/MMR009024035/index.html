
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sar Yay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sar Yay</div><div class="name-mm">ကျောက်စာရေး</div></div>
        <span class="pcode-badge">MMR009024035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.25054969321383, 21.894457216027774], [94.24971647133816, 21.892304725582676], [94.24898761308793, 21.887445674178593], [94.24607218188572, 21.880157097072413], [94.24510037178482, 21.873840330067253], [94.24528879324328, 21.873237382299408], [94.23222388592364, 21.87165375711527], [94.22299168771627, 21.87092489976436], [94.22241823321497, 21.872358538715616], [94.22153397301452, 21.874569188317423], [94.21983330466333, 21.881857765423604], [94.21740377896128, 21.886959768678423], [94.21424539590834, 21.892547678332733], [94.21375949130754, 21.8969208242367], [94.20987224910505, 21.90129397103999], [94.20501319770096, 21.90445235409294], [94.20542417438622, 21.908151137065374], [94.20768567615312, 21.908339595396058], [94.22201987761531, 21.911497979348326], [94.2297943602216, 21.91441340875184], [94.2348963643758, 21.91441340875184], [94.24437151443391, 21.91562817160286], [94.24493216168997, 21.91621996687803], [94.24500750868964, 21.916221503819372], [94.24455998805308, 21.915412524068756], [94.24589306661181, 21.911146672680843], [94.24855922372927, 21.899682197075776], [94.25054969321383, 21.894457216027774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
