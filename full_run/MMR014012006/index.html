
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pong Nay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Laihka</div><div class="name-mm">လဲချား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pong Nay</div><div class="name-mm">ပုံနေ</div></div>
        <span class="pcode-badge">MMR014012006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.6834324869198, 21.335564328630937], [97.65761153094746, 21.32910909031233], [97.6482594558093, 21.326262806183593], [97.6380195483635, 21.35237456873142], [97.63502274830125, 21.358368168855975], [97.63618279999628, 21.367068555669334], [97.6263868087043, 21.415436263572758], [97.61781531632386, 21.440538492157714], [97.5988355831957, 21.45829372727377], [97.59795226458539, 21.458865285104878], [97.59806388663912, 21.458928672020647], [97.59840599594003, 21.45912294626703], [97.59851652981405, 21.45922300483784], [97.60215501773996, 21.46176673364789], [97.60544754456856, 21.459968951106248], [97.61363890970796, 21.458640620068593], [97.62227304976147, 21.457312290829634], [97.62692220299732, 21.454877019359003], [97.63312107517754, 21.452663139392428], [97.64153382732434, 21.45908339588209], [97.6479382539473, 21.463566498295336], [97.64817547172072, 21.463732550916518], [97.65027523761216, 21.463417585852937], [97.65703100417755, 21.46240421987892], [97.66259766105327, 21.464308602659912], [97.67248352159731, 21.44681823407427], [97.6780691020075, 21.43125840325274], [97.68205880307136, 21.412107841203976], [97.68349979218175, 21.412770696410576], [97.68393825844396, 21.395232032432375], [97.6827137586331, 21.353599067642904], [97.6845505078997, 21.335843834325544], [97.6834324869198, 21.335564328630937]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
