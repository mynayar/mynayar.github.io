
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Bo</div><div class="name-mm">သံဘို</div></div>
        <span class="pcode-badge">MMR005005041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70728133166818, 22.683259582064125], [95.70541457832019, 22.686059709388132], [95.70168107702017, 22.686059709388132], [95.68651372203072, 22.690259900374144], [95.68138015796796, 22.690026555081488], [95.67869766826283, 22.689400641326586], [95.67828864040848, 22.691317770198964], [95.66975736031401, 22.707213299953878], [95.66133480016094, 22.70782367971907], [95.65474283971037, 22.715025840070496], [95.64587388037535, 22.713928200426153], [95.64615863990934, 22.71948579033699], [95.64677784022518, 22.723573590348963], [95.64653015973914, 22.728776219646875], [95.64604596025293, 22.731762420299503], [95.659118640413, 22.733886690018778], [95.67370619978135, 22.734924299916543], [95.68143936033829, 22.739988689926122], [95.68652328002543, 22.735473659781633], [95.69769300013189, 22.737304710044384], [95.70452867955498, 22.737304710044384], [95.71228019977144, 22.723083539873528], [95.71569839966145, 22.711914089563606], [95.71173083990641, 22.71032711980081], [95.71112064000562, 22.70288087984875], [95.71114475982284, 22.696135739672684], [95.70728133166818, 22.683259582064125]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
