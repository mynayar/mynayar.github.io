
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Yar Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Yar Bo</div><div class="name-mm">ငါးရာဘို</div></div>
        <span class="pcode-badge">MMR017014104</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99813703999246, 16.430525189685795], [95.00209595996063, 16.430855130260113], [95.00539499967954, 16.430525189685795], [95.00786892041441, 16.429700520362758], [95.01265259963782, 16.4278861201484], [95.01529176000679, 16.42508198994193], [95.01578639972263, 16.42046346042042], [95.01578639972263, 16.413205769630622], [95.01628140006665, 16.409082059689354], [95.01479675966277, 16.404958439680286], [95.01314724025298, 16.39951515000422], [95.01034319997876, 16.394566769840594], [95.00770403960979, 16.393906980422855], [95.00358023973632, 16.39159766979668], [95.00011667984097, 16.391267820053883], [94.9959928799675, 16.393412070011095], [94.99434335965839, 16.39671101979775], [94.9913744403782, 16.401329550218634], [94.98972492006908, 16.40611304957764], [94.98972492006908, 16.40990681984391], [94.99038480031834, 16.41337074036744], [94.99219919963343, 16.41798926988895], [94.99500323990765, 16.423432469632814], [94.99813703999246, 16.430525189685795]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
