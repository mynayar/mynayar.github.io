
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Tun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaiklat</div><div class="name-mm">ကျိုက်လတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Tun</div><div class="name-mm">လင်းတွန်</div></div>
        <span class="pcode-badge">MMR017025080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78941416043523, 16.485413579573105], [95.79304512013624, 16.484203170340095], [95.79478643964251, 16.483622759582715], [95.79849587958125, 16.480808729639193], [95.80028651970719, 16.478890019758637], [95.80166928041302, 16.47612494980666], [95.80220532041926, 16.475052599997525], [95.79971087985331, 16.473933360436263], [95.79881555979028, 16.47316593026352], [95.79804803968534, 16.47214263037813], [95.79716441980219, 16.471340820022874], [95.79432211157626, 16.469452959586476], [95.79365643429708, 16.46901081509708], [95.79289915926887, 16.469988961821173], [95.79222591959058, 16.4717446578897], [95.79195180623094, 16.473663455903818], [95.79067260785462, 16.474896967820882], [95.78889086741964, 16.474896967820882], [95.78678932806508, 16.47434874020223], [95.78519032986986, 16.47430305464229], [95.78332366285679, 16.474080832164702], [95.77882883508272, 16.47477234426833], [95.77891979970906, 16.47685755013589], [95.7790899001788, 16.47778832956783], [95.77940471955225, 16.478199719941188], [95.77973556034789, 16.479126359793725], [95.77993248039974, 16.479401670150992], [95.78033892000519, 16.479775619948953], [95.78132423972193, 16.48068173997035], [95.78941416043523, 16.485413579573105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
