
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Byu Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaiklat</div><div class="name-mm">ကျိုက်လတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Byu Seik</div><div class="name-mm">သဗြုဆိပ်</div></div>
        <span class="pcode-badge">MMR017025069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71199487906046, 16.487691440907327], [95.711322959587, 16.489890539616738], [95.71132655957314, 16.492585949881743], [95.71198464027901, 16.494560010336272], [95.71527467958288, 16.496534159823682], [95.7181258803052, 16.497082439602934], [95.72064840040343, 16.49972826035099], [95.7225128397958, 16.501044330031846], [95.72371920028093, 16.502689350133437], [95.72470632044042, 16.504224750072183], [95.72569307997173, 16.505705249997334], [95.73264737187878, 16.503872228420676], [95.73856848035115, 16.500795119798966], [95.74245936031127, 16.49800944008365], [95.7441967201026, 16.495550639650332], [95.74453115998512, 16.493347889693382], [95.74427196008293, 16.49179404016286], [95.74366788006864, 16.4908444496117], [95.74142328016029, 16.489981169695284], [95.73788411965643, 16.489031580043445], [95.73538067957475, 16.488341010429338], [95.73101207974372, 16.488308880350587], [95.72223851959205, 16.48874753996705], [95.71609727956587, 16.488637829872005], [95.71199487906046, 16.487691440907327]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
