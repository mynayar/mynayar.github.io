
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Kone (2)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Kone (2)</div><div class="name-mm">ကြို့ကုန်း (၂)</div></div>
        <span class="pcode-badge">MMR008009037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73049379505267, 17.86750918999718], [95.73048930743568, 17.86886375605752], [95.72199432577759, 17.86928285272154], [95.71774843304382, 17.86926447507551], [95.71586438573286, 17.86835297081302], [95.71493329963215, 17.86564003096271], [95.71021482935095, 17.865620967133964], [95.70834177085612, 17.862450982826658], [95.70173798791785, 17.86242420911003], [95.70057235682884, 17.870321342156274], [95.70083398759851, 17.877647013598846], [95.70815966083973, 17.878431907706442], [95.71574696395129, 17.881833113107746], [95.7223618463222, 17.886488030098576], [95.72281100462425, 17.886804104026226], [95.72725873400344, 17.886804104026226], [95.72987504619647, 17.886804104026226], [95.73222972582124, 17.886804104026226], [95.73667745609976, 17.88497268594074], [95.73955539816313, 17.88235637464703], [95.7426949718955, 17.87817027693677], [95.74007866060174, 17.87686212128989], [95.73615419276183, 17.875292333974073], [95.73275298915917, 17.870059711386602], [95.73049379505267, 17.86750918999718]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
