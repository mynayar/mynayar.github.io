
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktan</div><div class="name-mm">ကျောက်တန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ah Lel Paing Ward</div><div class="name-mm">အလယ်ပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013024701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.33520368598717, 16.63362491787226], [96.3348566150122, 16.633594126419226], [96.33449765185559, 16.633561195769854], [96.33388665073797, 16.63363071602301], [96.33314199312585, 16.63371121312676], [96.33250426070933, 16.633817322893716], [96.33216057258063, 16.63389781991914], [96.33171759677035, 16.633857571410655], [96.33114096446559, 16.633740484792476], [96.33068653238435, 16.633663646660448], [96.33010990007958, 16.63356119576986], [96.32952563026086, 16.633455085861193], [96.32912084202042, 16.63337458864994], [96.32785683345834, 16.63286599185229], [96.3272763823966, 16.63274890462875], [96.32679903777345, 16.6326830430341], [96.32653936229845, 16.632500094041394], [96.32630641812236, 16.632247624144885], [96.32610402400215, 16.631958564000236], [96.32584369724867, 16.631701413773268], [96.32552357294043, 16.632598886519126], [96.32520279735367, 16.63381366393721], [96.32507462037385, 16.634209395118134], [96.32506532210219, 16.634238102426036], [96.33234454797379, 16.636155309954], [96.33303234876708, 16.636082086503865], [96.33330619967653, 16.6360529322653], [96.33422270135299, 16.635965118313667], [96.33471150224706, 16.635643133480308], [96.33504755286177, 16.635086976585608], [96.33526140325294, 16.634150287643376], [96.33520368598717, 16.63362491787226]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
