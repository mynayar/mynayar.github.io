
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (5) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (5) Ward</div><div class="name-mm">အမှတ် (၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013013701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.20411987283393, 16.784114074804734], [96.20364952110856, 16.78441143024338], [96.20318031332084, 16.784631729071066], [96.20255470263749, 16.784925461141142], [96.20112037660414, 16.7855701446465], [96.1999893190519, 16.78608322136364], [96.19965418669142, 16.786233453111436], [96.20033200571754, 16.78759193392068], [96.20092691714359, 16.788830076446914], [96.20113181957788, 16.789230346703164], [96.20189666779703, 16.790773391778657], [96.20215034496249, 16.791311263703903], [96.20260429395307, 16.79226493807647], [96.20296044796635, 16.793002735587834], [96.20321083091517, 16.79289245622192], [96.20444107109859, 16.79232978818925], [96.20586824392439, 16.79167365991151], [96.20672302344883, 16.79139366138844], [96.20650291437806, 16.790842055916187], [96.20627021659726, 16.790250777751226], [96.20582008343018, 16.789098739914948], [96.2055339812083, 16.788377762423863], [96.2051105498121, 16.787290572901668], [96.20497067735494, 16.786943434591876], [96.20487276726448, 16.786684035939572], [96.20443916363655, 16.785493850660714], [96.20432199726241, 16.78515052817437], [96.20424537682277, 16.784825515884904], [96.20419120795793, 16.78444099455629], [96.20411987283393, 16.784114074804734]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
