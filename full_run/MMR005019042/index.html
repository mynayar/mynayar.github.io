
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Naung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Naung</div><div class="name-mm">ရွာနောင်</div></div>
        <span class="pcode-badge">MMR005019042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7682403200348, 22.050223110208435], [94.76828603976895, 22.050005850189905], [94.76850347965194, 22.046964750422944], [94.76502767998352, 22.043054699614743], [94.7593799995874, 22.040665200038973], [94.75568711976484, 22.03762410027207], [94.74804018890364, 22.04366542471962], [94.74195919625998, 22.05191820096428], [94.73913587811836, 22.058867906328885], [94.73814180170285, 22.064802301385157], [94.73969124005873, 22.065389549688007], [94.74515819989108, 22.06746126032897], [94.74962111971894, 22.06522980041501], [94.74964580071321, 22.065221672342375], [94.75316718791544, 22.06406205591918], [94.75676171967768, 22.068354059592252], [94.76167103958687, 22.071032010419003], [94.76348099265374, 22.071122573048342], [94.76613377055713, 22.071255271613552], [94.76688455967474, 22.071134159913584], [94.76751491967786, 22.067825760050823], [94.76474580007869, 22.067796690365014], [94.76437607979233, 22.067444700212775], [94.76437607979233, 22.063690980354522], [94.76394155975521, 22.05912933025445], [94.76741736032295, 22.054133160117317], [94.7682403200348, 22.050223110208435]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
