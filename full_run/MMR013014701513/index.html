
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Yar Thiri Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawbon</div><div class="name-mm">ဒေါပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Yar Thiri Ward</div><div class="name-mm">ဇေယျာသီရိရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013014701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19232311212198, 16.779329872175936], [96.1926708224006, 16.779119491971016], [96.19357872038171, 16.778623580613782], [96.19450187715995, 16.778135300004124], [96.19552116427036, 16.777631505189845], [96.19594001811743, 16.77736282373536], [96.19669914215177, 16.776952743674258], [96.19729995762702, 16.776632308933983], [96.19759178133569, 16.7764584672845], [96.19720545686641, 16.775799318184056], [96.19231605514187, 16.777608489740032], [96.19011592940666, 16.778652191645392], [96.18925647700485, 16.77895011905281], [96.18920145288479, 16.779003908403695], [96.18897883110822, 16.77922153444632], [96.18912524073733, 16.77968259707427], [96.18923250827368, 16.780020395924566], [96.18964253977146, 16.780771255189336], [96.19071388233988, 16.780157089278305], [96.19169902758813, 16.779621124815094], [96.19232311212198, 16.779329872175936]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
