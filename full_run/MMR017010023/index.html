
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Tha Mar (Kayin)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lemyethna</div><div class="name-mm">လေးမျက်နှာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Tha Mar (Kayin)</div><div class="name-mm">လက်သမား (ကရင်)</div></div>
        <span class="pcode-badge">MMR017010023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15302596027988, 17.524760040343665], [95.15595708015519, 17.525954070224202], [95.15796516016405, 17.526496859642407], [95.15997359990178, 17.52703964995993], [95.16247019973997, 17.52747390020039], [95.16442427995662, 17.527365270191126], [95.16648672038588, 17.526279780387597], [95.16833207976174, 17.525085659675483], [95.17093740044072, 17.524760040343665], [95.1749539201873, 17.52443433018027], [95.17419432041163, 17.520960599851833], [95.17180607988672, 17.517161160259377], [95.17050324013246, 17.513904600017327], [95.16920076010706, 17.51097357007427], [95.16702959973628, 17.508802499635692], [95.16540131961528, 17.507228490002888], [95.16377304039355, 17.505654480370026], [95.1613847998687, 17.503917570239707], [95.15953943959352, 17.509236749876152], [95.15704895964183, 17.513906165737012], [95.15606544036785, 17.51574996029251], [95.15400299993854, 17.51965793996203], [95.15356883963028, 17.521937549578297], [95.15302596027988, 17.524760040343665]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
