
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Yan Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Yan Kar</div><div class="name-mm">ထရံကာ</div></div>
        <span class="pcode-badge">MMR010024032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96177291958463, 20.636218480698403], [95.9628779381664, 20.635515288200054], [95.9689429786356, 20.635082071280635], [95.97500802090349, 20.634215635643102], [95.984105583406, 20.632915983985527], [95.99147027643215, 20.632915983985527], [95.99493601538484, 20.6298834637509], [96.00230070841104, 20.628150595173906], [96.00966540143719, 20.628150595173906], [96.01206475758255, 20.625351344688852], [96.0122647047524, 20.62511807403996], [96.01139827001418, 20.61905303177207], [96.01139827001418, 20.611255120927126], [96.00945464711435, 20.60979740442673], [96.00793253196082, 20.60865581761192], [95.99970140419651, 20.6082226006925], [95.99276992808979, 20.607356165954343], [95.98583845198306, 20.60562329737735], [95.98453880032542, 20.60778938287376], [95.97804054113811, 20.606489732115506], [95.96807654479676, 20.606922949034924], [95.96504402366281, 20.606922949034924], [95.95637967897903, 20.606489732115506], [95.95508002732146, 20.60778938287376], [95.95334715784514, 20.612554772584758], [95.9559464611603, 20.61905303177207], [95.95767932973735, 20.62555129095938], [95.95941219921366, 20.63031668067032], [95.96177291958463, 20.636218480698403]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
