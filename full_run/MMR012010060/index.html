
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Yan</div><div class="name-mm">ကျောက်ရန်</div></div>
        <span class="pcode-badge">MMR012010060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.6466500390681, 20.783330923683252], [92.64722732827863, 20.77703044699757], [92.64780456622782, 20.770729964016653], [92.63924870136651, 20.768962019181913], [92.62734469560127, 20.76671970355153], [92.62596096182898, 20.76611992409528], [92.62339114368638, 20.762179535557152], [92.6213923959424, 20.759038647915304], [92.62039908035331, 20.756961714011936], [92.61446431567566, 20.758290383194662], [92.6130941499751, 20.76050420920194], [92.6077440669352, 20.76667607204314], [92.60488141064866, 20.77028656137577], [92.60872388459967, 20.771578825102722], [92.61169741200604, 20.77310239985593], [92.61168637822385, 20.777419497311996], [92.61291808969816, 20.78092264536383], [92.62234161057694, 20.7831605309338], [92.62742353916508, 20.785155176869978], [92.63002587769216, 20.786444274084033], [92.63536989570417, 20.782721975638708], [92.63847659471912, 20.780628320640517], [92.64430361342107, 20.78239067798745], [92.6453241173142, 20.782772486061447], [92.64602664341493, 20.783035326419224], [92.64634462120733, 20.783154293236066], [92.6466500390681, 20.783330923683252]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
