
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kyat San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kyat San</div><div class="name-mm">ညောင်ကြပ်စမ်း</div></div>
        <span class="pcode-badge">MMR009001031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2074006061531, 19.948740733997738], [95.20474281183135, 19.960368584042953], [95.20474281183135, 19.97000308767241], [95.20468277129294, 19.9700050895633], [95.20540725973729, 19.97398977960472], [95.2040783630261, 19.98196316256997], [95.20208501661028, 19.985949853602904], [95.20175279265732, 19.994919910225747], [95.20175279265732, 19.999571050063935], [95.20182597139154, 20.000522366414145], [95.20466556636285, 19.999575835356552], [95.2102655278319, 19.996425855568816], [95.21621548655554, 19.99187588766216], [95.22111545261612, 19.991175892253693], [95.2281154049021, 19.993625875733642], [95.2323353719799, 19.994188538370395], [95.23264965176008, 19.98428873293875], [95.23431077332361, 19.961033031948944], [95.23658097243401, 19.960036360089987], [95.22666961521065, 19.960036360089987], [95.2180317834401, 19.95704634091595], [95.2074006061531, 19.948740733997738]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
