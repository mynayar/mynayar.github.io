
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dala</div><div class="name-mm">ဒလ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma (3) Ward</div><div class="name-mm">မြို့မအပိုင်း (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013030701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16318538359866, 16.753851341166524], [96.16280651091182, 16.75367641403534], [96.16245956415764, 16.754300689225488], [96.16211271273158, 16.754261017432043], [96.16179847701818, 16.754181544342828], [96.16152509121002, 16.75401496921552], [96.16133223609387, 16.753742429669444], [96.16111455699127, 16.753502981577412], [96.16129493671201, 16.756473541221], [96.16214052786313, 16.75673993390086], [96.16244888380902, 16.756780624626174], [96.16280047106494, 16.756809870579104], [96.16312294007167, 16.756821822569123], [96.16315078757884, 16.757568359692073], [96.16316185013932, 16.757902908392566], [96.16274417530349, 16.75800930358656], [96.16293716441868, 16.758533795398364], [96.1634248119056, 16.758549306905024], [96.16349182129056, 16.758258438276357], [96.1637812725877, 16.758011076150297], [96.16383838673221, 16.756779670445496], [96.1635865297946, 16.75669774130779], [96.1633917492299, 16.756342358013455], [96.16330604563757, 16.75551033043746], [96.16355917241793, 16.75547684597973], [96.16354838325134, 16.754822644949172], [96.16322274683233, 16.754783803229998], [96.16318538359866, 16.753851341166524]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
