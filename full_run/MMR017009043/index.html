
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Byin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Byin</div><div class="name-mm">အဗျင်း</div></div>
        <span class="pcode-badge">MMR017009043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56073208012145, 17.431507080087727], [95.56461792028085, 17.42702318986835], [95.56681816382724, 17.423990495165242], [95.5683046802169, 17.421941430352774], [95.57079587962619, 17.42234003956122], [95.5723625948579, 17.422677475085436], [95.57727263962067, 17.42373504004013], [95.57916587980156, 17.424631799917677], [95.58026171990252, 17.42154291017721], [95.58021203955406, 17.420895179768763], [95.58016236010491, 17.420247540191895], [95.57886672032294, 17.415962910060273], [95.5780696799718, 17.413073280407616], [95.57767115979624, 17.410283370281377], [95.57777088022198, 17.40769263031069], [95.57468208041377, 17.405201609866424], [95.57358587968469, 17.40285999019642], [95.57268911980708, 17.403408000179127], [95.56601291986044, 17.406297629831784], [95.5635220801799, 17.407094760115115], [95.56221096036757, 17.40698703032723], [95.55624827983428, 17.406496889919595], [95.5536386397115, 17.406011429583884], [95.55269004111256, 17.405834934035], [95.55196355977051, 17.405699759636263], [95.55201336872204, 17.408539618108932], [95.55206328019631, 17.411379390246736], [95.55256151989829, 17.420048280104083], [95.55296004007386, 17.42672430018638], [95.55754355988745, 17.429613929839036], [95.56073208012145, 17.431507080087727]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
