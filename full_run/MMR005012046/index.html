
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Yit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Yit Kone</div><div class="name-mm">ပုရစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR005012046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24678831992509, 22.064036040331075], [95.24699208022037, 22.06378133973709], [95.25032603971499, 22.063146299662037], [95.2523596802551, 22.062755250154737], [95.25397752014652, 22.055843610394334], [95.2585812000624, 22.054573530244284], [95.26147091964731, 22.05546795008587], [95.26079843989612, 22.0518824403224], [95.25875687992612, 22.0455532797601], [95.24977343959262, 22.042694879964813], [95.2397506797501, 22.037683499593868], [95.23790639956076, 22.039396199974703], [95.2281880701234, 22.034723976430428], [95.22091943998021, 22.032728549882734], [95.22021671962597, 22.0322174399829], [95.21961947985517, 22.033411649727896], [95.21830979985742, 22.03722171031376], [95.217476399916, 22.040793720353975], [95.22623346470272, 22.047917557849075], [95.2391764797108, 22.056859349679314], [95.24536775981431, 22.061304450340174], [95.24678831992509, 22.064036040331075]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
