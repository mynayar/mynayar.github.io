
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min</div><div class="name-mm">မင်း</div></div>
        <span class="pcode-badge">MMR005006010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80268519956235, 22.34326113029698], [95.80449239980447, 22.344978240053763], [95.80238783962716, 22.349187810069452], [95.80116167966781, 22.349187810069452], [95.80116167966781, 22.352129190309938], [95.80400100034592, 22.35935691029323], [95.80663799964401, 22.36252130981063], [95.80776516043386, 22.362360299688135], [95.80825637013544, 22.362360299688135], [95.81313239984041, 22.362360299688135], [95.81786820005743, 22.358255939560024], [95.82260400027445, 22.36141314000446], [95.82642936012695, 22.363426439678506], [95.83395947984616, 22.362237449598695], [95.84069508001397, 22.36181652011635], [95.85037692035866, 22.36181652011635], [95.86132199971058, 22.363921350090266], [95.86431576006436, 22.364193510122448], [95.86839132030326, 22.359878009862314], [95.86468944006566, 22.35718601971911], [95.86468944006566, 22.352134499907322], [95.86090080043164, 22.345399170435428], [95.85248184026477, 22.345399170435428], [95.85121896008701, 22.339926720241976], [95.84995607990925, 22.33445427004858], [95.84995607990925, 22.330294199617697], [95.84869319973143, 22.330665630414558], [95.84322084036955, 22.331086559896846], [95.83606439975233, 22.332770460388474], [95.83379963974164, 22.33147635035334], [95.83101287994049, 22.33319138987082], [95.82343559977318, 22.33487520043019], [95.81754239996184, 22.33487520043019], [95.80743936033826, 22.338242909682606], [95.80268519956235, 22.34326113029698]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
