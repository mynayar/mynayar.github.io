
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bwet</div><div class="name-mm">ဘွက်</div></div>
        <span class="pcode-badge">MMR010023039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21957471590048, 20.394783947221413], [96.22442684072615, 20.402466477745804], [96.22361815415456, 20.41338375905326], [96.2215964350275, 20.41944891463578], [96.21843773721184, 20.425315068235875], [96.24262230927224, 20.42632275768915], [96.25879605779187, 20.43238791417093], [96.26971333820006, 20.43238791417093], [96.27658718215281, 20.43198356998579], [96.27982193113729, 20.438048725568308], [96.2786089003805, 20.427131445160114], [96.27941758785147, 20.416618508037743], [96.27335243226901, 20.411362039926246], [96.26971333820006, 20.400849102803875], [96.26251257899241, 20.392848259039965], [96.2624351509615, 20.392762228993718], [96.26000908944798, 20.388314448353185], [96.25111352726753, 20.39033616568156], [96.2410049343303, 20.395592634692377], [96.23332240290665, 20.395188291406555], [96.21957471590048, 20.394783947221413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
