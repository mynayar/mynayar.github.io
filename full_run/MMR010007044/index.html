
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngwe Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngwe Taung</div><div class="name-mm">ငွေတောင်</div></div>
        <span class="pcode-badge">MMR010007044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1566876460181, 21.89967490627197], [96.15730162936677, 21.899981897046985], [96.15998516768138, 21.900807600590326], [96.16287513188189, 21.9018397318182], [96.16493939343832, 21.902665436260918], [96.16617794875339, 21.90452327013287], [96.1664832272192, 21.904319751755168], [96.16741650496778, 21.903697565690152], [96.17071932183927, 21.902871862146753], [96.17422856459666, 21.90328471391848], [96.18083419833965, 21.903491139804316], [96.18723340529749, 21.902871862146753], [96.19193759974047, 21.90174285504878], [96.19182841844679, 21.899559224678512], [96.19159152442938, 21.895768922198044], [96.18424781258653, 21.892452406853124], [96.17595652557327, 21.890320361595457], [96.16956039069953, 21.88581937796198], [96.1666961282238, 21.88416112073918], [96.16292736090907, 21.88416112073918], [96.15842637727553, 21.88416112073918], [96.15653122603533, 21.88842521125457], [96.15653122603533, 21.895295134163177], [96.1566876460181, 21.89967490627197]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
