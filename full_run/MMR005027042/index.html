
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kale</div><div class="name-mm">ကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Chaung</div><div class="name-mm">လက်ပံချောင်း</div></div>
        <span class="pcode-badge">MMR005027042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.04816256015408, 23.33689001975864], [94.04894771956168, 23.331983219749816], [94.05152100009411, 23.32404854990068], [94.05495216011417, 23.320831770270047], [94.05774000000105, 23.316757200184668], [94.05470001809141, 23.315903356854506], [94.0500045488709, 23.315205382222643], [94.04194610712722, 23.31641097558611], [94.03591813941068, 23.317680022415175], [94.02963636232829, 23.319075971678785], [94.02627339070449, 23.320471922741092], [94.01692210876837, 23.322510326990027], [94.01438401690893, 23.323065535146384], [94.01204421386944, 23.32461218470462], [94.00340627058296, 23.326029364263775], [94.00425644827652, 23.33598859509766], [94.0062531599554, 23.336170109762804], [94.02401087989824, 23.336170109762804], [94.04176895956988, 23.33689001975864], [94.04816256015408, 23.33689001975864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
