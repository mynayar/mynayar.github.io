
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Daung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Daung</div><div class="name-mm">ပုဒေါင်း</div></div>
        <span class="pcode-badge">MMR009007031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.61011265327636, 20.066489595418545], [94.61177943337424, 20.064128322863837], [94.61742172593199, 20.059079955175832], [94.62425187092714, 20.052546774414168], [94.63019112681911, 20.04482574121505], [94.63761519578469, 20.03858952288823], [94.6387248998343, 20.03710991778854], [94.63939697309189, 20.036213819811962], [94.63375467963482, 20.029383675716133], [94.62989416438421, 20.024038345593226], [94.62603364823434, 20.019286941239386], [94.61771868926616, 20.015129461755294], [94.60910676786312, 20.016317313293428], [94.60168269799817, 20.013050722013247], [94.5978221818483, 20.008893243428474], [94.59277381505956, 20.009190205863376], [94.58534974519466, 20.010675019836356], [94.57673782379158, 20.011268944706103], [94.57180419700614, 20.01095064675502], [94.57179400409007, 20.011025128606832], [94.56996648996159, 20.00975011927261], [94.5680796772354, 20.01564641095314], [94.56516863832206, 20.021711074606458], [94.56367655692765, 20.02860971286799], [94.56106757960515, 20.03157615901256], [94.56220256269819, 20.031756920945213], [94.57320561414781, 20.036633695288856], [94.58526451374638, 20.042512407921322], [94.59461016232916, 20.048391122352484], [94.60395580911336, 20.056832352431172], [94.60923157757531, 20.063464747300316], [94.61011265327636, 20.066489595418545]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
