
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mae Pu Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsat</div><div class="name-mm">မိုင်းဆတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mae Pu Long</div><div class="name-mm">မယ်ပုလုံ</div></div>
        <span class="pcode-badge">MMR016006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.36214697410361, 20.47901475043045], [99.36893213321144, 20.479172543677976], [99.40501423861627, 20.475334022247353], [99.41269128327616, 20.47226320528273], [99.41652980470678, 20.457676821328278], [99.42958077882992, 20.441555029341202], [99.42958077882992, 20.430039464150013], [99.44109634492042, 20.41161455876494], [99.43111618776192, 20.403937515004372], [99.39119556002714, 20.383977200687298], [99.38448800611667, 20.38032923300773], [99.34743640996243, 20.360178364939657], [99.34158168584617, 20.34846891580787], [99.33899166173586, 20.343288869385844], [99.3428301840658, 20.364784590836223], [99.35357804479099, 20.396260471243806], [99.34897181889437, 20.41391767216288], [99.33515314030524, 20.42620094182007], [99.30674807776165, 20.42620094182007], [99.2902938279978, 20.429491792312433], [99.28917351194809, 20.44330902119441], [99.2969465187669, 20.453241195924477], [99.3021285239123, 20.463605205316014], [99.29676792060309, 20.47149549991741], [99.33592084477124, 20.478404840111352], [99.36214697410361, 20.47901475043045]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
