
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tsawlaw</div><div class="name-mm">ဆော့လော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Kyin</div><div class="name-mm">ယင်းကျင်း</div></div>
        <span class="pcode-badge">MMR001006002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.26600557779523, 26.083684547204143], [98.25517715580116, 26.075949960322475], [98.24567466275556, 26.066005490061343], [98.24416174406929, 26.064492571375126], [98.24059193377076, 26.065342526036773], [98.2235758415519, 26.06423758479673], [98.21645119826422, 26.059715149634485], [98.21293546779765, 26.061472974398328], [98.20473220462759, 26.062058740618454], [98.1956501023704, 26.0600076226537], [98.19165762420005, 26.060958146701182], [98.18949762441588, 26.061472397033526], [98.18949750030947, 26.065574186899255], [98.19506371381942, 26.074656858427318], [98.19799325808248, 26.08080961427231], [98.2032665956769, 26.08666944383981], [98.20795394312006, 26.093994183584755], [98.21000448821661, 26.102783784943767], [98.21145439770237, 26.111243472708168], [98.21176201530483, 26.11303830277552], [98.21439862159917, 26.118019111592787], [98.22221308086904, 26.12442003985302], [98.23458842131868, 26.128839804813197], [98.24814236377915, 26.131786313887346], [98.26434816593519, 26.13355422005128], [98.26788397826306, 26.13414352240568], [98.2667053735542, 26.10703563478677], [98.2664107232763, 26.090240531175652], [98.26600557779523, 26.083684547204143]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
