
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ye Yeik Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Botahtaung</div><div class="name-mm">ဗိုလ်တထောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ye Yeik Thar Ward</div><div class="name-mm">ရဲရိပ်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013017701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17249107440364, 16.769445737430885], [96.17318344176249, 16.76937675493332], [96.17387199419721, 16.76934623733905], [96.17516895508328, 16.769305577190664], [96.17562929825357, 16.769277572302144], [96.17629103200557, 16.769221305319036], [96.17626686092694, 16.76655426057073], [96.17570877044346, 16.766526222407265], [96.17541980657887, 16.766482352578578], [96.17481651257208, 16.766486740370794], [96.17451095621573, 16.76656913715601], [96.17416191134322, 16.766611100421983], [96.17357826212714, 16.76666068993893], [96.17288017238212, 16.766720771846167], [96.17214393609385, 16.766724586770295], [96.17168617217914, 16.766650772215428], [96.1712917322277, 16.766704941080206], [96.17084121774803, 16.76668357858432], [96.17043113678761, 16.766640344576274], [96.17004013134704, 16.766807556423657], [96.16968059588288, 16.766994476014304], [96.16934013413993, 16.767125447881142], [96.169102987413, 16.76754856091742], [96.16900721411167, 16.769444725693575], [96.16927242328376, 16.769484519794787], [96.1696605688802, 16.769495010386493], [96.17030143656211, 16.769475936665174], [96.17200279289466, 16.769426346248906], [96.17249107440364, 16.769445737430885]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
