
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Mon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Mon</div><div class="name-mm">ကုန်းမုံ</div></div>
        <span class="pcode-badge">MMR015004003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.08862238371609, 22.656317497054886], [98.0896791428782, 22.65539797983297], [98.10929814829097, 22.638326897668264], [98.13668682133977, 22.612012291234294], [98.13877588709755, 22.609771722986693], [98.13641830356192, 22.59536427264311], [98.13561275472489, 22.577910707013586], [98.13292759133532, 22.55293868137511], [98.12997391106722, 22.54810538565505], [98.12057583740506, 22.542198025118807], [98.11822239524741, 22.541072466021546], [98.1087611154332, 22.552670165395853], [98.09990007283017, 22.56582746906247], [98.09423015040119, 22.56897653783699], [98.09372419631467, 22.57066076388321], [98.09130754800498, 22.577373674155808], [98.08244650720059, 22.587845814432853], [98.0770761786228, 22.59509575666391], [98.07519656407021, 22.605567896940954], [98.0770761786228, 22.618188167749793], [98.08862238371609, 22.656317497054886]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
