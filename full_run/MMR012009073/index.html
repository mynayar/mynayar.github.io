
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Hpu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Hpu</div><div class="name-mm">ကံဖူး</div></div>
        <span class="pcode-badge">MMR012009073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.51568485507204, 20.7201649092832], [92.51957519543896, 20.715213566752766], [92.52117283206059, 20.713180211297754], [92.5235511737477, 20.710888357411818], [92.50811643682414, 20.699360106383836], [92.49021175596783, 20.686241825200113], [92.47995578393233, 20.683029111404437], [92.47549800912589, 20.681632698989915], [92.46379792103727, 20.67489628493564], [92.458593037139, 20.67179550256043], [92.45847969917884, 20.676669024955572], [92.45422512079273, 20.685178179929096], [92.45294661759237, 20.685866604660134], [92.45298420295865, 20.685887277376025], [92.47212980164909, 20.691737321420305], [92.47118385874813, 20.69334542435189], [92.47319344602079, 20.69421915798779], [92.48081623098432, 20.699005556761108], [92.48577990501866, 20.7057419717147], [92.48585085883013, 20.706073090400878], [92.48808446812376, 20.70379195733301], [92.49836636311721, 20.7103510979249], [92.51568485507204, 20.7201649092832]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
