
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Tauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Tauk</div><div class="name-mm">လုံတောက်</div></div>
        <span class="pcode-badge">MMR015016015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.2956002736338, 22.941135934875547], [97.29947421666185, 22.937708984582002], [97.3079204496691, 22.930107375954663], [97.31270664879287, 22.917719567304232], [97.31692976529649, 22.913496450800608], [97.32110341908759, 22.90822446758517], [97.31960249196152, 22.907770699358366], [97.31545150738123, 22.905389433975245], [97.3107778656061, 22.90177113043336], [97.3059534605838, 22.89679596306331], [97.29977219173333, 22.89679596306331], [97.29027414493589, 22.89679596306331], [97.28303753785212, 22.89438376100179], [97.28051646656172, 22.89195606272216], [97.26512620201265, 22.89829323084797], [97.25470918118384, 22.899982477809147], [97.24710757165718, 22.911244122118603], [97.24513678383556, 22.911901050792892], [97.24513678383556, 22.916030320343054], [97.23978750299091, 22.921098060327267], [97.23612746820817, 22.924758095110064], [97.2316228108441, 22.929825835094277], [97.23125560596151, 22.936435521182432], [97.23105972912327, 22.939961314163384], [97.23443822214631, 22.945029054147597], [97.23725363344846, 22.952630663674256], [97.24203983167297, 22.95572761583685], [97.24682602989742, 22.960795355821062], [97.25184740443422, 22.967802875902066], [97.26597082459392, 22.964736930564925], [97.2749801411207, 22.96051381496062], [97.28483407932936, 22.950659875852637], [97.2956002736338, 22.941135934875547]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
