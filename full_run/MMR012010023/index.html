
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Hnyin Wai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Hnyin Wai</div><div class="name-mm">စံညှင်းဝေ</div></div>
        <span class="pcode-badge">MMR012010023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.58823141264963, 20.96224026457662], [92.59048315677234, 20.9564118762072], [92.59404608006258, 20.94643019379845], [92.5957369511994, 20.942656590829074], [92.60372741229031, 20.926807299717154], [92.60847677338444, 20.91515056074985], [92.61122549186302, 20.908622920711252], [92.61250614804038, 20.893457784349323], [92.61551328041361, 20.8827302447051], [92.60773384883811, 20.876718705803682], [92.60733578461884, 20.87641108010729], [92.59618026480746, 20.869851172393737], [92.5961659242181, 20.87521830298232], [92.59614159755677, 20.88431908235981], [92.59287142877349, 20.889022190421827], [92.58892180869458, 20.891302512301138], [92.58540591455136, 20.89286023970834], [92.58251513466581, 20.89328768208094], [92.58049212321299, 20.893391348731825], [92.57141743766465, 20.89385762742762], [92.56507578102253, 20.894043760111515], [92.56677179358348, 20.90874933931059], [92.56824513940171, 20.914586900764903], [92.57371082399538, 20.913900568756276], [92.58016725661366, 20.914149912988137], [92.5861250942977, 20.91509786587386], [92.58286359587828, 20.926990954768826], [92.57911000192513, 20.937015920648264], [92.5758579643736, 20.945175214164863], [92.5721027660299, 20.955433340076638], [92.58823141264963, 20.96224026457662]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
