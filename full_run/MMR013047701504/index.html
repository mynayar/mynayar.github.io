
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (12) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlaingtharya (West)</div><div class="name-mm">လှိုင်သာယာ (အနောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (12) Ward</div><div class="name-mm">အမှတ် (၁၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013047701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04623031597635, 16.88631312025433], [96.04621251389648, 16.884469985801275], [96.04724502643688, 16.8775424945905], [96.04695701585365, 16.877469063146805], [96.04664135021818, 16.877332687253784], [96.04633235935097, 16.877232551341194], [96.04593276988146, 16.877137185432787], [96.04547081062947, 16.877073287702103], [96.04504661570883, 16.877087021249054], [96.04473113983028, 16.877175331076728], [96.044336954387, 16.877220789108208], [96.04391288806937, 16.877179336657093], [96.04364872031226, 16.87745475763103], [96.04347496140042, 16.877795028717628], [96.043130873591, 16.877904891697426], [96.04255294855977, 16.878080368314386], [96.04200172440011, 16.87828127506083], [96.04128074690902, 16.87853050238084], [96.04061889714444, 16.87876129180023], [96.03967454694282, 16.879082785941875], [96.0404109945718, 16.880800247333582], [96.0410327912304, 16.882233301725535], [96.04141044623515, 16.883139928065305], [96.04178047139169, 16.884061813202152], [96.04236412060771, 16.885503769083698], [96.04292696131029, 16.88687289876532], [96.04334259018844, 16.886753082089115], [96.04468091359337, 16.88672892270165], [96.04623031597635, 16.88631312025433]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
