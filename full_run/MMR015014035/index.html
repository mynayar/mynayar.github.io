
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hkaing Hsi Htauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hkaing Hsi Htauk</div><div class="name-mm">မန်ခိုင်းဆီထောက်</div></div>
        <span class="pcode-badge">MMR015014035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.5592765638624, 22.307546949232346], [97.55089813164352, 22.29771247864801], [97.54024079217885, 22.288730942179313], [97.52682774560401, 22.28968901693463], [97.51679841801263, 22.296040924948784], [97.50108580496601, 22.298381101206928], [97.4870447474172, 22.29336643741118], [97.4780183518655, 22.290357638594173], [97.47806116139355, 22.292412458168485], [97.47930691038567, 22.35220840439439], [97.4816957723421, 22.351536537081586], [97.5141239313744, 22.364908972970795], [97.54220604827054, 22.381958830235874], [97.56360194587319, 22.4030204183577], [97.57597144972266, 22.415055610927766], [97.57766936255109, 22.415308025445086], [97.57901302882829, 22.413964359167892], [97.57664007228158, 22.412715433770302], [97.57129109720643, 22.392656778587536], [97.56560781175119, 22.379284342698327], [97.55825297169736, 22.34919635992412], [97.5609274592349, 22.328469083081757], [97.5605931479555, 22.31643388961237], [97.5592765638624, 22.307546949232346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
