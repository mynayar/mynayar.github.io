
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Deik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zay Deik</div><div class="name-mm">ဇေဒိတ်</div></div>
        <span class="pcode-badge">MMR010019040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.82625583144153, 21.392155359981928], [95.81843535390851, 21.393171028220422], [95.81193046042245, 21.396423475862775], [95.79892066985309, 21.401534464244207], [95.7912334106934, 21.40362805179319], [95.79078851967449, 21.41030142607002], [95.79037610857063, 21.418137228050682], [95.78542718161918, 21.426385440235947], [95.79243816229143, 21.42803508195351], [95.80192360598966, 21.430097134774996], [95.80810976535344, 21.430509545878863], [95.81264628210027, 21.43669570524264], [95.81264628210027, 21.44205704329795], [95.81883244056473, 21.44659355914547], [95.8237813684155, 21.451130075892365], [95.82720206662214, 21.454322729410478], [95.83190977921299, 21.450321174382736], [95.84259639071092, 21.432200396331268], [95.85188909800354, 21.42569550194588], [95.8597878992922, 21.421513783934017], [95.86338170799951, 21.419716879130704], [95.86254796361766, 21.41854963825523], [95.86131073210464, 21.41401312240771], [95.8571866255624, 21.41112624827781], [95.84893841427646, 21.410713837173887], [95.84481430773417, 21.406589730631595], [95.84275225491268, 21.402053213884756], [95.83986538078278, 21.392155359981928], [95.82625583144153, 21.392155359981928]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
