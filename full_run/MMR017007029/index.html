
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Ngu</div><div class="name-mm">ပေါက်ငူ</div></div>
        <span class="pcode-badge">MMR017007029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12903123960007, 16.991886330289958], [95.13257219964737, 16.992832589752254], [95.13639684004221, 16.994222820227037], [95.14161720037356, 16.996034880405432], [95.14264607965293, 16.996391910358454], [95.14873404024382, 16.997239259684136], [95.15482232369135, 16.998745670876076], [95.15518775960749, 16.998344280064543], [95.15821751982276, 16.993277550018945], [95.16077243979635, 16.989227910040086], [95.16326220029038, 16.985951999984877], [95.16277404018984, 16.9855416896973], [95.15913516015956, 16.984150020307254], [95.15427443961374, 16.98151967958961], [95.15033675983364, 16.978343220163538], [95.147429040318, 16.975870920007026], [95.14628711985478, 16.973469359623323], [95.14475820043066, 16.96973102986317], [95.14436436032702, 16.96776857965625], [95.14434204005317, 16.96580216973439], [95.14146995977086, 16.966458090268702], [95.13887652003541, 16.967111040342274], [95.13730187997783, 16.967485170004636], [95.13675647982774, 16.968563549768078], [95.1359662797201, 16.97259447035856], [95.13498707988987, 16.9763591700397], [95.13373932001366, 16.98385589973003], [95.12987436031352, 16.990448760402046], [95.12903123960007, 16.991886330289958]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
