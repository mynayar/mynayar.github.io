
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Ki</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangwaun</div><div class="name-mm">ပန်ဝိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Ki</div><div class="name-mm">ကောင်းကီ</div></div>
        <span class="pcode-badge">MMR015007008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.21056588800536, 23.09939225774656], [99.21708248077192, 23.092711070159794], [99.22140397501352, 23.090998412047156], [99.22321562240313, 23.090280435593684], [99.22972843082249, 23.092404491274294], [99.2342448639094, 23.094120540730444], [99.23887121843205, 23.091041209883997], [99.23765928215022, 23.085937338737267], [99.24299028157628, 23.081470555421845], [99.25268662169032, 23.082145633314383], [99.25468798826012, 23.08222327808187], [99.25351305728185, 23.061992055588917], [99.25510801482307, 23.058204031091236], [99.25322464919827, 23.057665926241555], [99.24399557163838, 23.062280463672494], [99.22005765393766, 23.075258852614013], [99.20483121618776, 23.084798308695042], [99.20859358122885, 23.08935663759877], [99.20929021856881, 23.089631920077125], [99.21112026788609, 23.09312232923213], [99.21452333488406, 23.0952879156049], [99.2108127905779, 23.099024126562256], [99.21056588800536, 23.09939225774656]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
