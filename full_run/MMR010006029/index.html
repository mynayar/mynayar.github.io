
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sauk Taw Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sauk Taw Wa</div><div class="name-mm">ဆောက်တောဝ</div></div>
        <span class="pcode-badge">MMR010006029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10044479888842, 21.855053631919645], [96.10639426118627, 21.853696736615177], [96.115892523821, 21.852548596440613], [96.12257261963077, 21.852131089778027], [96.12643455221286, 21.852026712662735], [96.13321902513798, 21.854114243277763], [96.13614156727954, 21.854949255703616], [96.13749846168474, 21.850982947804823], [96.13958599229977, 21.84785165323126], [96.13969036941506, 21.84649475792679], [96.13958599229977, 21.842528450028], [96.13614156727954, 21.842841579575293], [96.1346802957591, 21.845242239737615], [96.13227963559677, 21.846181628379497], [96.13050523632768, 21.843154709122587], [96.12768707040203, 21.84117155562285], [96.1281045761653, 21.835430846656323], [96.12706081130744, 21.831568915872822], [96.12946146967113, 21.82697634977876], [96.12946146967113, 21.823531924758584], [96.11714504201012, 21.825201948711026], [96.11098682728033, 21.824471313400466], [96.10284545905074, 21.834073953150494], [96.09825289295668, 21.840858426075556], [96.09825289295668, 21.846181628379497], [96.0989835282673, 21.850356688710292], [96.09915488958654, 21.850907495584522], [96.10044479888842, 21.855053631919645]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
