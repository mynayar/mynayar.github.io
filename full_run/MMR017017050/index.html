
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Peik Htoke Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Peik Htoke Ywar Ma</div><div class="name-mm">ဦးပိတ္ထုတ်ရွာမ</div></div>
        <span class="pcode-badge">MMR017017050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22826919976382, 16.555992659733533], [95.22913753117217, 16.5569472801929], [95.23019123983391, 16.558105679833318], [95.23133076000664, 16.559139480202873], [95.23285019967705, 16.56035334013461], [95.23408896003752, 16.560749430342014], [95.23499220042976, 16.560459899904515], [95.23813787965946, 16.55945126976036], [95.23972907983324, 16.55899658962096], [95.24132028000696, 16.55854191038088], [95.24555747989382, 16.558232309773302], [95.24628144043618, 16.55407547959976], [95.24724156024985, 16.5512636098278], [95.2488151202217, 16.547452200258874], [95.24941560024979, 16.545317939971028], [95.24312856033487, 16.545099599866717], [95.23840175963358, 16.5446271895932], [95.2377217201813, 16.546936590151574], [95.2370416798297, 16.54924598981063], [95.23541736032297, 16.550803079598495], [95.2340907209101, 16.55153056908057], [95.23084950040419, 16.55330777963036], [95.23020707959313, 16.55377820959677], [95.22961704968714, 16.554219943095973], [95.2284369601976, 16.555103459557074], [95.22826919976382, 16.555992659733533]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
