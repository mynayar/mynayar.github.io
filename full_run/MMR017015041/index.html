
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaik Pi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaik Pi</div><div class="name-mm">ကျိုက်ပိ</div></div>
        <span class="pcode-badge">MMR017015041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1208016397839, 16.80976646994668], [95.12065475980938, 16.81036469987106], [95.12050787983486, 16.810962929795437], [95.12008415975623, 16.820225550268958], [95.12411760024713, 16.823149919832986], [95.134735800317, 16.829777069855936], [95.14025963957079, 16.83272825990133], [95.1432948002149, 16.835233139797595], [95.14376315994195, 16.836453630430753], [95.1443182799647, 16.837323030233733], [95.14651283979578, 16.83852543010454], [95.1493327198292, 16.838442630423117], [95.1492131999293, 16.83777491977679], [95.14909403975821, 16.837107120097585], [95.14860408011424, 16.832918249777435], [95.147855280297, 16.829116919810076], [95.14777032044401, 16.825121189691174], [95.14793123973499, 16.81962902995582], [95.1483203997667, 16.81571114964987], [95.14898496008789, 16.813794779805278], [95.14887335961794, 16.81128855002663], [95.14707912040512, 16.808230620346876], [95.1458957996515, 16.806213899651823], [95.14379880007465, 16.803033029950427], [95.14286423989279, 16.79983136972197], [95.13760716024228, 16.799772959654433], [95.13407735988233, 16.799807070040288], [95.13327779963083, 16.803524610172644], [95.1329923197398, 16.8083172898111], [95.12740440019297, 16.809191459618205], [95.1208016397839, 16.80976646994668]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
