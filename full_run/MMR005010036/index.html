
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Ya Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Ya Kan</div><div class="name-mm">မရကန်</div></div>
        <span class="pcode-badge">MMR005010036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40869148002781, 22.59307863037452], [95.39447004006036, 22.59930419982902], [95.38549812004226, 22.59930419982902], [95.38610831994305, 22.60711673994564], [95.38452144011245, 22.61791989009089], [95.38207992015225, 22.628112750403147], [95.38452144011245, 22.639099140113274], [95.38592544010703, 22.639526370245846], [95.39770500038554, 22.642089840074107], [95.40551772036656, 22.64129639970912], [95.41491696044943, 22.63751217035042], [95.41960324939049, 22.633546711411668], [95.41949472010532, 22.633512850137947], [95.41650384028009, 22.62570039995353], [95.41650384028009, 22.625671410307405], [95.41888415957635, 22.613310280045425], [95.41888415957635, 22.6132812903993], [95.42709899971914, 22.60357470970513], [95.42709899971914, 22.603545720059003], [95.41949472010532, 22.597717319998367], [95.40869148002781, 22.59307863037452]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
