
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ti Taung (Tei Taung)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ti Taung (Tei Taung)</div><div class="name-mm">တည်တောင် (တယ်တောင်)</div></div>
        <span class="pcode-badge">MMR018007018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18165577309549, 19.521786904642], [96.18705725598761, 19.52430759821715], [96.19281883821884, 19.52826868465212], [96.20110111222658, 19.53078937732795], [96.20614249667892, 19.531149475767734], [96.21118388113126, 19.534390366222453], [96.220546452257, 19.532229772885785], [96.23026912182257, 19.533670169342884], [96.23479384216216, 19.536686649269484], [96.23635957983078, 19.530254340065767], [96.23691022392774, 19.51905790559789], [96.23711100027248, 19.509543543299912], [96.22954892404368, 19.509543543299912], [96.22682690463802, 19.508012407946296], [96.22378734181245, 19.506302653744513], [96.21939116517018, 19.50420013502827], [96.2155050669054, 19.502341566410223], [96.20883778193814, 19.502341566410223], [96.20866318935475, 19.50522235662652], [96.20866318935475, 19.51278443285537], [96.20578239823914, 19.5185460150866], [96.20038091444769, 19.51998641064438], [96.19425923287736, 19.51674552108898], [96.19101834422128, 19.51098393885775], [96.1866971566485, 19.509183444860128], [96.18381636643221, 19.512424335314847], [96.18201587063601, 19.51674552108898], [96.18165577309549, 19.521786904642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
