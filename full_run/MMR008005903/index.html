
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thegon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR008005903</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53943760356259, 18.644941031703297], [95.54137799609771, 18.64196576410876], [95.54543810508454, 18.6395296976375], [95.5468622669801, 18.638342898306178], [95.54738696024009, 18.637905655121926], [95.54982302671135, 18.631734286008566], [95.54982302671135, 18.629135813666892], [95.55095985791115, 18.628161388337446], [95.5525891335817, 18.627183821676056], [95.55181322370134, 18.625241325626746], [95.54835625403797, 18.622525134727255], [95.54638084190242, 18.62277206068211], [95.53823226740525, 18.62203128191817], [95.53205910504374, 18.622278207873023], [95.52761442796356, 18.625735179335095], [95.52712057515447, 18.628451371133906], [95.52736750200864, 18.630920635179223], [95.5308244725714, 18.63536531225941], [95.53600992931484, 18.63857535686725], [95.53872612021433, 18.640797694957712], [95.53996075268662, 18.642279254284233], [95.5394668998776, 18.644501592374638], [95.53943760356259, 18.644941031703297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
