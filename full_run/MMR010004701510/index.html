
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Yar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanmyathazi</div><div class="name-mm">ချမ်းမြသာစည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Thar Yar Ward</div><div class="name-mm">ကန်သာယာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010004701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12162313382069, 21.950646452645163], [96.12152015108305, 21.94883050241992], [96.12122108011691, 21.942835582281944], [96.1209769421311, 21.93893036711971], [96.12088806972454, 21.93750876995024], [96.12074063994146, 21.932118339002518], [96.12059879673686, 21.925686735278695], [96.12059871459701, 21.92568455810516], [96.12046193050759, 21.922059000951663], [96.12040584048185, 21.919361523031245], [96.11900635901993, 21.919984102553414], [96.1188417455635, 21.920057333224797], [96.11069499880627, 21.923615974493043], [96.11136218790311, 21.923750265342495], [96.11210893449073, 21.924035647756337], [96.11289913840199, 21.92445075447222], [96.11360216552198, 21.925000455041168], [96.1141009794804, 21.925396108505584], [96.1143537291378, 21.92580893344757], [96.11472939434871, 21.931167536105143], [96.11485890222126, 21.93286416304235], [96.11513026045576, 21.936419110562078], [96.11528139138932, 21.93913836862541], [96.11542322168415, 21.941690282808533], [96.11555560690275, 21.94502417520918], [96.1159114412909, 21.95060453046182], [96.1159305303796, 21.951022002113596], [96.1169275345884, 21.950958615009675], [96.12162313382069, 21.950646452645163]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
