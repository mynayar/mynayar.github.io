
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Ta Soke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Ta Soke</div><div class="name-mm">ရွှေတဆုတ်</div></div>
        <span class="pcode-badge">MMR007003089</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.81938085324384, 17.11894940718946], [96.81939306783585, 17.118902392431494], [96.8193994907939, 17.11887471129893], [96.8199264116746, 17.116603927629228], [96.8207776964336, 17.112935286334448], [96.82135961715267, 17.108466107225127], [96.82155589868586, 17.106958658215547], [96.82141344967101, 17.101198138083646], [96.82140673713127, 17.100926687616607], [96.82137440380575, 17.0996191758843], [96.82123288199199, 17.099355859785135], [96.82108208816788, 17.099075292890518], [96.82090649913567, 17.09768215760556], [96.81627637105771, 17.096408017016415], [96.81404537699262, 17.100232580069587], [96.81199373832044, 17.103310036728885], [96.8125636378017, 17.10570361473009], [96.81370343676423, 17.110490769833234], [96.81575507543641, 17.115619865164717], [96.8183509910055, 17.118864761199802], [96.81938085324384, 17.11894940718946]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
