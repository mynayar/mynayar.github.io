
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Taw</div><div class="name-mm">လက်ပံတော</div></div>
        <span class="pcode-badge">MMR009007022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89617906231393, 20.2080022747852], [94.8861253262229, 20.21839681616018], [94.8831896899523, 20.222433315245326], [94.87520233511975, 20.233415927802866], [94.87405830484693, 20.2344310537502], [94.87617760221463, 20.23614667602834], [94.8816390977662, 20.242583437775465], [94.88397973807452, 20.246094399137235], [94.88451974678895, 20.247010066361497], [94.88456489815161, 20.246874613172906], [94.89451262215982, 20.253896534997125], [94.9038219264408, 20.257265616614973], [94.9063397008166, 20.25419426365437], [94.90596337231182, 20.2493450562294], [94.91121663973621, 20.245207450863234], [94.91193886998292, 20.243231625938847], [94.91220240191939, 20.242509313853816], [94.91233860873984, 20.228962351031726], [94.91139038156092, 20.228051773970265], [94.9109401998304, 20.22533681604125], [94.91035106295124, 20.22458038097983], [94.90992051072305, 20.224027893272705], [94.90952456080987, 20.22351980599433], [94.90410651060705, 20.217053755126756], [94.90059316873982, 20.20963670087309], [94.90059316873982, 20.205856698328034], [94.8976334756045, 20.206498558861426], [94.89617906231393, 20.2080022747852]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
