
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Chaung</div><div class="name-mm">ကျွန်းချောင်း</div></div>
        <span class="pcode-badge">MMR007006042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57958197702669, 18.161369203026368], [96.56696516590972, 18.161590551362906], [96.55797762376841, 18.163388058711973], [96.55361224620827, 18.160563403278502], [96.55139431929246, 18.159904020354304], [96.55155795003941, 18.164158419775276], [96.55155795003941, 18.17545704510661], [96.5507875889761, 18.182390292877756], [96.55027401583322, 18.18675567133721], [96.54863297972827, 18.19352494392109], [96.54990627405539, 18.193987959876495], [96.55504335266863, 18.195855989362485], [96.56499177904743, 18.200830201652536], [96.57063739460011, 18.20171787657881], [96.57487802809857, 18.202384643836297], [96.57581069340881, 18.19243621655818], [96.57699459332588, 18.184938183750205], [96.57767602313004, 18.18062246135753], [96.57829780000355, 18.171917587826442], [96.57855072623511, 18.169978489415826], [96.5792304653138, 18.164767155579796], [96.57958197702669, 18.161369203026368]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
