
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Ka Lay</div><div class="name-mm">ကျွန်းကလေး</div></div>
        <span class="pcode-badge">MMR017014070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.98009628721394, 16.473167185717102], [94.97952618358659, 16.476416778911243], [94.97752743674187, 16.481746771995972], [94.97341641713399, 16.486998134656233], [94.97438460026916, 16.48677221956234], [94.97144814381681, 16.489312538143167], [94.96992528942064, 16.49169199858693], [94.97021082417024, 16.493881104029754], [94.9712577870173, 16.49530877957659], [94.97363724656174, 16.495879850874474], [94.97676074581182, 16.495768278283492], [94.98172104109324, 16.496076744845936], [94.98877061976833, 16.49835449016763], [94.98956004016378, 16.496998919564533], [94.992364080438, 16.492215510137726], [94.99549787962349, 16.48693719029916], [94.99846716043118, 16.480999080143476], [94.99945679959171, 16.476875370202208], [94.99846716043118, 16.473246569773437], [94.99483836000235, 16.469452800406486], [94.992364080438, 16.472586780355698], [94.99021955978492, 16.47506096998785], [94.98774563994937, 16.47555578956809], [94.98444660023046, 16.474896000150352], [94.98133691996293, 16.473273570119204], [94.98009628721394, 16.473167185717102]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
