
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zay Cho</div><div class="name-mm">ဈေးချို</div></div>
        <span class="pcode-badge">MMR010016058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95343668355616, 21.80349782286629], [95.95487786332279, 21.8011559073193], [95.95938154582171, 21.791608098335132], [95.96100287238471, 21.78620367825721], [95.96152606017961, 21.783064549689243], [95.95928311682246, 21.78175616561458], [95.95570629271128, 21.778576767204072], [95.9549114431087, 21.773608955389022], [95.95570629271128, 21.768045006372006], [95.95650114321325, 21.761686206853028], [95.95135584029987, 21.760951163965103], [95.95093719419623, 21.760891357250387], [95.94895006929033, 21.762679768856287], [95.94775779398708, 21.765461744264144], [95.94537324427984, 21.766852731068752], [95.94219038887542, 21.766322255168006], [95.94159770776804, 21.76784629307201], [95.93861702085889, 21.777583204301493], [95.93821959605759, 21.78632655262834], [95.94477710707787, 21.79785187636304], [95.9441809698759, 21.803018399679445], [95.95343668355616, 21.80349782286629]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
