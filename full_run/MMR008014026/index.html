
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Khat Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Khat Tan</div><div class="name-mm">ကျခတ္တန်း</div></div>
        <span class="pcode-badge">MMR008014026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72083265530284, 18.296112858022013], [95.71965648236085, 18.29258433739733], [95.71848030762015, 18.28905581497395], [95.7188723661668, 18.28591935199654], [95.72004854000818, 18.28003848278979], [95.7192644238142, 18.275333787424415], [95.71612795993747, 18.271413208253023], [95.7110312069247, 18.27650996126573], [95.705934453912, 18.27690201891312], [95.69887741086387, 18.27729407656045], [95.69417613202296, 18.276123499200196], [95.69385487530229, 18.280299834769608], [95.69224859169918, 18.28640371066274], [95.69289110514046, 18.28929502024903], [95.69321236186107, 18.29315009999715], [95.69321350310076, 18.298327996140188], [95.69319640339137, 18.300928053986524], [95.69710480034632, 18.301456215931694], [95.70002547279739, 18.30382926330992], [95.70336073990626, 18.305496895965007], [95.70404139719278, 18.305837223708977], [95.70897003094223, 18.310583316666794], [95.71017741665452, 18.3112144509862], [95.71106846493774, 18.308793101920173], [95.71142326457203, 18.30513019110549], [95.71142326457203, 18.300817554286766], [95.71338355460745, 18.29885726425141], [95.71691207613145, 18.297681090410038], [95.72083265530284, 18.296112858022013]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
