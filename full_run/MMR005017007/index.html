
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Paung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Paung</div><div class="name-mm">တပေါင်း</div></div>
        <span class="pcode-badge">MMR005017007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.84282944032645, 22.53250404032923], [94.83931511999685, 22.53268899040461], [94.8285118799194, 22.53268899040461], [94.81500756025076, 22.531338539641922], [94.80469931961795, 22.52849490041939], [94.80082824003131, 22.533914340074773], [94.79465063591817, 22.540339082382786], [94.79575188004526, 22.543917480307528], [94.79485152018157, 22.550519430427414], [94.79470716010741, 22.55074416021489], [94.79815236034324, 22.552920179622618], [94.80385440026043, 22.55742162011171], [94.80595499982343, 22.562823239700776], [94.8092558399851, 22.56972534035225], [94.80998484032818, 22.57264052963677], [94.81255703987557, 22.572126090446773], [94.82065956009069, 22.570325549684412], [94.82636124027908, 22.573326510010475], [94.83116255970441, 22.5769275897365], [94.84076556008262, 22.584729960319464], [94.84129367975959, 22.585217489995216], [94.84363188020717, 22.574228039892205], [94.84710480024637, 22.547933459561534], [94.85198135965209, 22.53167793029229], [94.84786764027945, 22.53223880957347], [94.84282944032645, 22.53250404032923]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
