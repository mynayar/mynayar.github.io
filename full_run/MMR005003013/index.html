
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pan</div><div class="name-mm">ရွှေပန်း</div></div>
        <span class="pcode-badge">MMR005003013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19254919918626, 21.805579753402924], [95.19620435964356, 21.803963130294278], [95.21413668026366, 21.79764611957279], [95.22350964035769, 21.79558862991138], [95.23951272003603, 21.797188920432404], [95.25208644013713, 21.79764611957279], [95.25292595996513, 21.798085770242153], [95.25391560002498, 21.793302539780427], [95.24934323989868, 21.78438659986176], [95.24262600028976, 21.780164340412057], [95.24108268002175, 21.78227600973014], [95.23414368018678, 21.783064590158745], [95.22704663979067, 21.78038348990617], [95.21837280006474, 21.781329750267787], [95.2039796399485, 21.780360989767928], [95.20179155973278, 21.78187182022839], [95.19470459983745, 21.78575819998099], [95.19258527998676, 21.786747119683866], [95.19116400041833, 21.785058989680692], [95.18922611968975, 21.785493870345874], [95.18873795958922, 21.785940179595684], [95.18834741460154, 21.786476463318195], [95.18824783177206, 21.786613430065813], [95.1877578253634, 21.787287391899667], [95.18726206329364, 21.788637994647786], [95.18695647905832, 21.788777665656767], [95.18629247991407, 21.789083519688745], [95.1840827332316, 21.792720664926776], [95.18383681811474, 21.79312587785705], [95.18315225237461, 21.79445477007164], [95.19047257644831, 21.79770952537433], [95.19217525928087, 21.804520254905867], [95.19254919918626, 21.805579753402924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
