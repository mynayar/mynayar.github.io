
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Aik Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Aik Kwin</div><div class="name-mm">ငါးအိုက်ကွင်း</div></div>
        <span class="pcode-badge">MMR017005056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30008740001358, 17.26057449012069], [95.2973492395758, 17.256467250363357], [95.29666452005159, 17.255371949855657], [95.29598016025625, 17.254550519890643], [95.2954325999346, 17.253592199620357], [95.2947478804104, 17.253044550265827], [95.2943371195625, 17.251812360352176], [95.29378956014017, 17.25099093038716], [95.2917361201259, 17.25044328013331], [95.28981947958539, 17.250854040081947], [95.2888607995863, 17.25099093038716], [95.28694415994511, 17.25153857974169], [95.2843431596092, 17.25208622999554], [95.28185375974329, 17.25220835972806], [95.28215256039243, 17.252633880249448], [95.28297408028965, 17.255645820398342], [95.28324768013641, 17.258110110293387], [95.28270011981476, 17.26043759981542], [95.28092027964726, 17.263586430269584], [95.28187859991749, 17.263175760253205], [95.28762888036857, 17.26221735005072], [95.2929680402429, 17.26166978972907], [95.30008740001358, 17.26057449012069]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
