
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar Kone</div><div class="name-mm">ကျားကုန်း</div></div>
        <span class="pcode-badge">MMR014006023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61381157704272, 20.81326796064792], [96.616086537164, 20.814361691838656], [96.63740213520043, 20.823765631778542], [96.6433579628997, 20.8259598849408], [96.6437411082656, 20.82607847674035], [96.65027110542724, 20.821313345134797], [96.6423810833204, 20.808601642951487], [96.6354964070336, 20.799051931001884], [96.62661295422453, 20.78483840596772], [96.62239331360058, 20.7735120041757], [96.62212993275028, 20.77315566490205], [96.61265359468769, 20.778554463317903], [96.60370860306966, 20.77507483703414], [96.5981317640697, 20.776058984034933], [96.58910525520344, 20.775678322596548], [96.58461052995204, 20.775684014405783], [96.58474007009823, 20.77643246708476], [96.5869343232605, 20.789597983360295], [96.59132282778631, 20.800882710568715], [96.5997863736423, 20.806525075072216], [96.61381157704272, 20.81326796064792]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
