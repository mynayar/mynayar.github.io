
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nauk Kan Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nauk Kan Twin</div><div class="name-mm">အနောက်ကံတွင်း</div></div>
        <span class="pcode-badge">MMR009022019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6131509156823, 21.04530903668274], [94.61778546482742, 21.046355548070153], [94.62614016483678, 21.045203174786764], [94.64025672676661, 21.041457965213], [94.6408638635765, 21.041525425158284], [94.64110371996077, 21.041175633848468], [94.64552882959185, 21.038041180855885], [94.6481101446675, 21.03380045112999], [94.65345715292534, 21.030112859321036], [94.65722114124276, 21.02619203823201], [94.65186687905327, 21.026678789094888], [94.64449169543548, 21.027600686822268], [94.63481176704948, 21.027139738408266], [94.63020227661383, 21.027370213064955], [94.61867855277308, 21.027139738408266], [94.6162308292894, 21.026665985446925], [94.61545191117682, 21.027600686822268], [94.61360811482268, 21.031288278631223], [94.6131509156823, 21.04530903668274]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
