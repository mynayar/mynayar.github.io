
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htauk Kyant</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htauk Kyant</div><div class="name-mm">ထောက်ကြန့်</div></div>
        <span class="pcode-badge">MMR008009024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80749228634, 17.914711426890904], [95.80470155423342, 17.919944050377694], [95.8001666139981, 17.925176672965108], [95.7945851497849, 17.928665088323214], [95.78830600232021, 17.929362770675368], [95.78411990371063, 17.929362770675368], [95.77801517705882, 17.925787146259836], [95.77382907934862, 17.93232792359487], [95.77304418524102, 17.9383454411892], [95.77330581601063, 17.94671763660972], [95.80958533609447, 17.95235474457587], [95.81621332518489, 17.96002925764418], [95.82423667987894, 17.963517673901606], [95.83435308432746, 17.964913040404554], [95.83819034131125, 17.967006089259655], [95.84132991504362, 17.959331575292026], [95.84446948877593, 17.954098951805236], [95.84481833040167, 17.948517487592028], [95.8451671720274, 17.943284865004557], [95.83435308432746, 17.943284865004557], [95.8238878382532, 17.943284865004557], [95.8193528989172, 17.939098767294297], [95.81795753241425, 17.931773094053085], [95.81481795868189, 17.9213078488782], [95.80749228634, 17.914711426890904]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
