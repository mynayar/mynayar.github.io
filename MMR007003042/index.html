
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Ta Khar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Ta Khar</div><div class="name-mm">သံတံခါး</div></div>
        <span class="pcode-badge">MMR007003042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60375220220243, 17.10874687826589], [96.5961611228376, 17.10416488640044], [96.58795455196105, 17.10006160995539], [96.58350932719378, 17.09869385084062], [96.57564470463944, 17.102113247728255], [96.57023354504213, 17.10255576633557], [96.57044721676573, 17.105190705286873], [96.5687375237178, 17.111687558833808], [96.56360841759448, 17.109977861289337], [96.55505990918749, 17.10724234305974], [96.54958886193651, 17.105190705286873], [96.54445976030973, 17.10690040373072], [96.54138230275112, 17.110661739947375], [96.53796290406484, 17.113739196606673], [96.54035649195862, 17.11818441328012], [96.54158376977523, 17.1239891332919], [96.54697618030656, 17.126422961350613], [96.55090124799426, 17.124824133127277], [96.55703211613928, 17.12408679696813], [96.56589190238947, 17.124360597363705], [96.57645003673986, 17.122899476030057], [96.5880292829251, 17.121085949057374], [96.5958805658355, 17.125843440022777], [96.6040568088747, 17.125434113593542], [96.60947328796192, 17.124374689740193], [96.60853909470353, 17.12094933664264], [96.6053501266071, 17.115482554876053], [96.60375220220243, 17.10874687826589]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
