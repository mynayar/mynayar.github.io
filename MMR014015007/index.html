
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Har Wan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyethi</div><div class="name-mm">ကျေးသီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Har Wan</div><div class="name-mm">ဟာဝမ်</div></div>
        <span class="pcode-badge">MMR014015007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.03365495870946, 21.926531025986094], [98.03161715700622, 21.92565768175666], [98.03054775607416, 21.910151374986015], [98.02627015414436, 21.90106147111004], [97.99525753970374, 21.892506267250496], [97.9906303272279, 21.887364918656147], [97.96852252899157, 21.905873773056214], [97.95515502318585, 21.912824875967317], [97.94232221739645, 21.912824875967317], [97.9369752154339, 21.904269672107716], [97.93911401460014, 21.892506267250496], [97.93055881163991, 21.886624565271518], [97.91344840392077, 21.894645068215368], [97.9113096029559, 21.892506267250496], [97.92253830779674, 21.911755475934513], [97.94285691741288, 21.938490488445325], [97.95943262421628, 21.978058304946842], [97.96905722900794, 21.99623811269879], [97.96989956461329, 21.996911981902485], [97.96959192902438, 21.995168712665986], [97.97333483093774, 21.982870606893016], [97.9915146386897, 21.979127705878966], [98.02145785219818, 21.97966240589534], [98.02513282831745, 21.981683642985786], [98.02733955507648, 21.978058304946842], [98.04231116093138, 21.966294900089622], [98.05193576572304, 21.952927394283847], [98.05033166477455, 21.94383749040793], [98.03215185702265, 21.926727081789466], [98.03365495870946, 21.926531025986094]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
