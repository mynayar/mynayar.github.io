
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Hto Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Hto Len</div><div class="name-mm">ပန်ထိုလင်</div></div>
        <span class="pcode-badge">MMR015001052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.10490929033153, 23.09222586523157], [98.11390059343768, 23.084449351956096], [98.12528026926907, 23.07335416856006], [98.13865138675214, 23.063396953106974], [98.14547919171139, 23.056000164176282], [98.14690165208964, 23.047749898838788], [98.14576368414674, 23.033809797384265], [98.144426573028, 23.02857514682563], [98.13950486315895, 23.024137072567896], [98.13153909025687, 23.02186113758148], [98.1187369549466, 23.021576646045446], [98.11267946698388, 23.023108526037674], [98.11162465755194, 23.02442156500325], [98.0991855551693, 23.03338275161275], [98.10223642607025, 23.038646158893187], [98.1019519336349, 23.04206006182244], [98.10024498261993, 23.04604294782382], [98.09853803070564, 23.050879310232006], [98.09313268612465, 23.055715671740927], [98.08687386423753, 23.057138131219858], [98.07464071289866, 23.055431180204835], [98.06411451437339, 23.050879310232006], [98.06243260588013, 23.050747278064478], [98.05643323300734, 23.060836525685147], [98.04397660823395, 23.074550393685797], [98.05017441112022, 23.077337054561497], [98.06582146538835, 23.08331138491252], [98.0757786808415, 23.083595877347932], [98.0854514047586, 23.0853028283629], [98.10223642607025, 23.08928571436428], [98.10490929033153, 23.09222586523157]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
