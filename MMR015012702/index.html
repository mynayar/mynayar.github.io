
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR015012702</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.99251712306682, 22.766308590668984], [96.98737260526156, 22.765765967625384], [96.98248571534356, 22.765226438249556], [96.97391883198856, 22.769657239689934], [96.96847783558371, 22.77173826460927], [96.96426517999413, 22.776501735167017], [96.96436185081882, 22.776545681438108], [96.96758434294316, 22.78562831429531], [96.96846305072927, 22.794417912057042], [96.96914288693472, 22.796910983854843], [96.97686760915292, 22.79110725759392], [96.982174704599, 22.780662359580276], [96.99709995130178, 22.775426190066696], [96.99658453005208, 22.77488964913806], [96.99614272011053, 22.774355796283032], [96.99564568460073, 22.77389557811847], [96.99505660617751, 22.77336172616276], [96.99461479713523, 22.77284628063137], [96.9940809442802, 22.772201975740643], [96.99367595168388, 22.7718338022882], [96.99339982114486, 22.771373584123637], [96.99330777823144, 22.77106063623944], [96.99351027407994, 22.7707845048011], [96.99334459467735, 22.77030587841358], [96.9931236906059, 22.769790433781566], [96.99301323767082, 22.769311808293367], [96.99251712306682, 22.766308590668984]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
