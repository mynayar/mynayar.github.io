
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (6) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Botahtaung</div><div class="name-mm">ဗိုလ်တထောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (6) Ward</div><div class="name-mm">အမှတ် (၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013017701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16710908071957, 16.771588734632473], [96.16861152680059, 16.77153205755843], [96.1690807345883, 16.771501540863483], [96.16987373068815, 16.771474459578712], [96.17257565384341, 16.771335933406647], [96.17249107440364, 16.769445737430885], [96.17200279289466, 16.769426346248906], [96.17030143656211, 16.769475936665174], [96.1696605688802, 16.769495010386493], [96.16927242328376, 16.769484519794787], [96.16900721411167, 16.769444725693575], [96.16873025889441, 16.769420623862743], [96.16814804139904, 16.7692852021504], [96.16765594496593, 16.7691555019249], [96.16735861021175, 16.769098705241106], [96.16701698294747, 16.76908683778737], [96.16666984643632, 16.769094466736306], [96.16551562684475, 16.769136701597574], [96.16563987717865, 16.770957946552016], [96.1656684882102, 16.771624565421405], [96.16615231807509, 16.771612167367664], [96.16649055489523, 16.771600722595338], [96.16710908071957, 16.771588734632473]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
