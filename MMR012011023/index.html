
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zin Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zin Chaung</div><div class="name-mm">ဇင်ချောင်း</div></div>
        <span class="pcode-badge">MMR012011023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.64378984042884, 19.165908642370027], [93.64563937175967, 19.164138078709414], [93.64795640036766, 19.163247883882775], [93.64836663781017, 19.163529191818782], [93.65552079594801, 19.160602491212046], [93.6595957869161, 19.15506050363939], [93.66383377820637, 19.150496514402676], [93.668071767698, 19.14495452683002], [93.67654774937921, 19.139249539834452], [93.67703032199182, 19.13903410543969], [93.6735382445944, 19.139046959449672], [93.67121813400973, 19.13905544275451], [93.66734301107118, 19.137011468104845], [93.65973078684641, 19.128659590168013], [93.64905579009269, 19.11743255267021], [93.64840142628486, 19.116824483263315], [93.64695057610828, 19.12180057603581], [93.64609451055327, 19.124094510952943], [93.64482151659979, 19.125971516572292], [93.64152592757955, 19.13244272595108], [93.64065324255319, 19.13515970735466], [93.63883411280415, 19.138480844315552], [93.63638487935873, 19.14463487989582], [93.63634557179074, 19.144674713567213], [93.6324735775936, 19.148598583357966], [93.63529030190597, 19.153837564152298], [93.63795231494743, 19.157699297084946], [93.64061432798889, 19.161830354487336], [93.64378984042884, 19.165908642370027]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
