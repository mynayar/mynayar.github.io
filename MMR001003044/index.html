
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Law Au Mar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Law Au Mar</div><div class="name-mm">အင်လောအူမား</div></div>
        <span class="pcode-badge">MMR001003044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.03206369468381, 26.495609928155716], [98.04446969661927, 26.494956979880783], [98.05757584594858, 26.4902762118777], [98.05757584594858, 26.479978522990507], [98.07442661039983, 26.466872373661147], [98.09221352683284, 26.45844699233487], [98.10045167920168, 26.450208840865344], [98.09595814195472, 26.449085456328817], [98.0912773739517, 26.438787767441568], [98.0912773739517, 26.429426232334833], [98.08566045306753, 26.415383929225015], [98.08004353128399, 26.39666085811217], [98.07927758769057, 26.38729932210606], [98.07255430283885, 26.38729932210606], [98.06132046017115, 26.384490861664005], [98.0622566139516, 26.39946931765496], [98.05102277128395, 26.41819238876775], [98.04166123617716, 26.429426232334833], [98.02761893306734, 26.436915459880595], [98.01076816861615, 26.439723921222026], [97.9892366370612, 26.442532381664137], [97.98642817661914, 26.450957762990413], [97.99766201928679, 26.469680834103258], [98.01451278283872, 26.491212365658214], [98.02668277928689, 26.49589313366124], [98.03206369468381, 26.495609928155716]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
