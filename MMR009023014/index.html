
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Ze</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Ze</div><div class="name-mm">ကွမ်းဇဲ</div></div>
        <span class="pcode-badge">MMR009023014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.25401178991223, 22.270522877728695], [94.25537157743639, 22.261588014275503], [94.25557402022491, 22.26025780185614], [94.25561092660303, 22.25966747157662], [94.25602045358113, 22.253116865550965], [94.25914457875933, 22.248876990180975], [94.26135875370358, 22.24679305325685], [94.26293819973819, 22.245306570142134], [94.26369658183182, 22.2446903321931], [94.26650849567062, 22.242405644105247], [94.26583922110325, 22.234818380563866], [94.26515932374383, 22.231928428054573], [94.26405420443803, 22.22723105856653], [94.26242631102548, 22.223070454837682], [94.26204602280575, 22.222098508939098], [94.26405446344279, 22.215627065736555], [94.26497074130674, 22.213387308677397], [94.26565033379592, 22.21172610797356], [94.26807127726767, 22.205808342281216], [94.26985662758136, 22.196659040882082], [94.26172881123568, 22.197446267831026], [94.23378930073568, 22.19596275427773], [94.2187069109952, 22.203627575352357], [94.21376186641709, 22.22192424460826], [94.21388152031597, 22.224257496086636], [94.2142563703353, 22.231567084053722], [94.21771790225944, 22.24170442831678], [94.21475087515284, 22.250852762944703], [94.21302010919072, 22.25827033161056], [94.21649573978664, 22.266539072620162], [94.23708599861999, 22.26671811864628], [94.25401178991223, 22.270522877728695]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
