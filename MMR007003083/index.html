
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Nyi Naung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Nyi Naung</div><div class="name-mm">ကန်ညီနောင်</div></div>
        <span class="pcode-badge">MMR007003083</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.73765601541282, 17.11921023216655], [96.73115914028216, 17.11100368017577], [96.72759726020547, 17.108581607155486], [96.72261062557999, 17.105190705286873], [96.71235241333329, 17.100403550183728], [96.7036148908146, 17.096370857029456], [96.7030663322455, 17.098894228785696], [96.70230649325015, 17.101173746671122], [96.70100391070196, 17.10280197463146], [96.69970132905314, 17.105624235170353], [96.69872439281653, 17.107578107643576], [96.6964448749311, 17.10974907825738], [96.69168440631034, 17.115383919032695], [96.69422960101531, 17.116474713936952], [96.69730706756718, 17.120236051052984], [96.69730707386242, 17.125023206156072], [96.69916722798524, 17.125023206156072], [96.709274981855, 17.125023206156072], [96.71816542959095, 17.126049025042505], [96.72705587372963, 17.124681266827054], [96.73765601541282, 17.11921023216655]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
