
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Lauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghpyak</div><div class="name-mm">မိုင်းဖြတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Lauk</div><div class="name-mm">နမ့်လောက်</div></div>
        <span class="pcode-badge">MMR016010004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.98363470207988, 20.930100545104096], [99.97878438669017, 20.941564927179684], [99.93892968285866, 20.987569182571747], [99.94686656324137, 20.991868325962514], [99.960094696613, 21.000135910443987], [99.9697641775748, 21.006703859895254], [99.97762197427477, 21.01204123101803], [99.98764968398581, 21.017389342744025], [100.00895154307932, 20.983220184364086], [100.0294177143561, 20.954088393164852], [100.03417662984765, 20.956327123198207], [100.03181887723946, 20.953776712425395], [100.03102437837242, 20.94923973792362], [100.0279480710467, 20.945911727444297], [100.0210487582936, 20.941650407740156], [100.01592604275271, 20.93666110032956], [100.00776174091169, 20.93336290867137], [99.99810290702362, 20.93485392616782], [99.99402409393684, 20.933682513337374], [99.99155346292201, 20.93425036955898], [99.98363470207988, 20.930100545104096]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
