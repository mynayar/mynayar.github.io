
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nge Toe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nge Toe</div><div class="name-mm">ငယ်တိုး</div></div>
        <span class="pcode-badge">MMR010006010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00423765474403, 21.895857025181613], [96.00584720828209, 21.901436812159204], [96.00802460185395, 21.908985110774267], [96.01537794003997, 21.907868148296473], [96.02310180160691, 21.907868148296473], [96.03186942893103, 21.908807536938355], [96.03249187759815, 21.908989484177425], [96.03155630028311, 21.904736852823532], [96.0310344174045, 21.899100520972297], [96.0310344174045, 21.8954473426208], [96.02988627543135, 21.894507954878293], [96.02884250967412, 21.891585411837355], [96.02821625057953, 21.889915387884912], [96.02654622662709, 21.887201599074615], [96.02122302522247, 21.885531574222796], [96.01224664366771, 21.887932234385175], [96.01173570823642, 21.888048763139977], [96.00629718316856, 21.889289128790324], [96.00250293895954, 21.890066262647963], [96.00390516639038, 21.894704397390058], [96.00423765474403, 21.895857025181613]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
