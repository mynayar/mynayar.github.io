
<!DOCTYPE html>
<html>
<head>
    <title>Map View - (Sa) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">North Okkalapa</div><div class="name-mm">မြောက်ဥက္ကလာပ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">(Sa) Ward</div><div class="name-mm">စ-ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013012701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16556072244941, 16.904081344278666], [96.16542243999368, 16.90371513404625], [96.16529814289504, 16.90338152243936], [96.16525563374057, 16.90326742725], [96.16523027106024, 16.903210248354355], [96.16513061538564, 16.902985573425497], [96.16485500375546, 16.90240859987705], [96.16468378273044, 16.902093104213463], [96.16456413242884, 16.901872635413838], [96.16443441241825, 16.90164504488297], [96.16442171758825, 16.901622772273186], [96.16435156867004, 16.90152237106065], [96.16405169243171, 16.901093165117516], [96.16368775118883, 16.900615602628022], [96.16353035004568, 16.90040906342756], [96.16339654891163, 16.900247511013845], [96.16310119626326, 16.899890900144953], [96.16247367901713, 16.899232864405235], [96.16227722121687, 16.89904975883934], [96.16166114784374, 16.899652480877364], [96.16098976166825, 16.90030097930679], [96.16030082702162, 16.900951767410163], [96.15977788024503, 16.901549339030794], [96.1604592003319, 16.90232404112163], [96.16112581920123, 16.903246349839208], [96.16158294639592, 16.904028574758968], [96.16182231894493, 16.90455150624706], [96.16208874130245, 16.905209454752594], [96.16351890617267, 16.90479278535878], [96.16474342396992, 16.904352187703353], [96.16556072244941, 16.904081344278666]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
