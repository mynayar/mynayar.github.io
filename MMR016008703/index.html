
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongton</div><div class="name-mm">မိုင်းတုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR016008703</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.57454043479328, 19.79081934383771], [98.57344583755543, 19.790124840588987], [98.56620476174044, 19.782336778219815], [98.56021576164812, 19.778735701191692], [98.55264179008662, 19.77752143566579], [98.5469537885865, 19.779300342336967], [98.5409610670996, 19.777192970878957], [98.5318035216153, 19.77776697576536], [98.52600316331541, 19.78000979681474], [98.52736078437277, 19.785785475919056], [98.5275511411723, 19.792352787750985], [98.52916917441792, 19.801965810174067], [98.5301209593149, 19.812340260694498], [98.53183417140997, 19.819859357423468], [98.53973398173792, 19.8253797064084], [98.54715789961745, 19.826617026054976], [98.55391556914827, 19.827854345701553], [98.56162502267671, 19.829567557796622], [98.56562251726541, 19.829567557796622], [98.5719994731972, 19.832803625187182], [98.57711557512374, 19.833684946403196], [98.57806855611904, 19.827252326933376], [98.57912519027536, 19.820912518398075], [98.57912519027536, 19.812107225668], [98.57595528600768, 19.80682405038965], [98.57137653529895, 19.801540874212037], [98.57035258430437, 19.793210606983962], [98.57321362630785, 19.79161609370783], [98.57449509457302, 19.790856955284312], [98.57454043479328, 19.79081934383771]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
