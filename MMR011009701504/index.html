
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaikto</div><div class="name-mm">ကျိုက်ထို</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Taung Paing Ward</div><div class="name-mm">တောင်ပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011009701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.01037971834938, 17.30880109259641], [97.01034423739668, 17.307178718323257], [97.0109724147452, 17.30715016394896], [97.01147017061197, 17.305132811929752], [97.01153795701117, 17.304687409196617], [97.01102538211575, 17.3015174042049], [97.01079214384242, 17.30103097889662], [97.01020893259624, 17.300447822509057], [97.01003408550469, 17.300268932065592], [97.00968914154072, 17.300592315682877], [97.00881580090856, 17.301411072862777], [97.00828280151012, 17.301468179812673], [97.00720915667728, 17.30039453587915], [97.00691223201397, 17.300097610316527], [97.0063982685653, 17.300402181015897], [97.00584623321714, 17.30108746621363], [97.00544648456764, 17.301639500662475], [97.00510384196878, 17.302134429060686], [97.00506577006928, 17.30228671396071], [97.0052561268688, 17.302553213659905], [97.00531323471807, 17.302933928158325], [97.00547124020562, 17.303321022447278], [97.00529204758999, 17.303898169564945], [97.00511004639156, 17.304484364761663], [97.00511054191804, 17.304522258595398], [97.00529084249843, 17.305130136446678], [97.00616623898082, 17.30638954704], [97.00644890849037, 17.307423985928267], [97.00643120713454, 17.308692987791176], [97.00702383068528, 17.308681058284265], [97.00911679770212, 17.308723949650584], [97.01037971834938, 17.30880109259641]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
