
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maung Khar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maung Khar</div><div class="name-mm">မောင်းခါး</div></div>
        <span class="pcode-badge">MMR005028022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.3966940402978, 23.365598130449428], [94.4043598803043, 23.36292396037254], [94.41426204016108, 23.361201899847856], [94.417318440094, 23.36018319010219], [94.41412344024462, 23.352478020044657], [94.41271979997885, 23.345703089825804], [94.4091806403743, 23.335685459716217], [94.40649431955728, 23.335510230412865], [94.40167248030076, 23.33068848018928], [94.39860528040941, 23.329055969657304], [94.39788816011054, 23.328674280293853], [94.3914794401241, 23.330078100424032], [94.3853147997383, 23.33148191965489], [94.38549804020244, 23.33209230031946], [94.38507072013766, 23.33648682041047], [94.38372791990764, 23.336730989943305], [94.3869016795689, 23.34429935962777], [94.38751224009786, 23.35028076044881], [94.38891588036364, 23.35668948043525], [94.39410383992032, 23.363098109590112], [94.3966940402978, 23.365598130449428]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
