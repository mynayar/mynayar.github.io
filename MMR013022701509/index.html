
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoet Myay Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Hpoet Myay Ward</div><div class="name-mm">ဖို့မြေရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16974353763419, 16.78855180732012], [96.1697006228855, 16.788054784400856], [96.16977729818382, 16.787755203140136], [96.17005920416898, 16.7876310364432], [96.1704357143368, 16.787427902076047], [96.17059803027496, 16.786940574747803], [96.17066701277247, 16.78644116682642], [96.17051124569747, 16.78594303144581], [96.17032241864479, 16.785482406787708], [96.17015266441399, 16.784989675433224], [96.1701159477928, 16.784671783975682], [96.17012443559429, 16.78431587188004], [96.16990699840932, 16.784109878568074], [96.16903686565888, 16.78359723082758], [96.16874027284535, 16.783542156345504], [96.16839154543351, 16.783521651802857], [96.16792106600445, 16.783529281651056], [96.16757371725333, 16.78354284522618], [96.16758918739117, 16.78390884411789], [96.16764259363083, 16.78553390556533], [96.16767252396784, 16.786501810809966], [96.16769981389535, 16.78707885810286], [96.1678085329375, 16.78869891212514], [96.16856084640602, 16.788712365083654], [96.16931343057041, 16.78861045840597], [96.16974353763419, 16.78855180732012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
