
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Waing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Waing</div><div class="name-mm">ညောင်ဝိုင်း</div></div>
        <span class="pcode-badge">MMR009013020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.96446912774809, 19.785433847294257], [94.95721958841335, 19.78393394179801], [94.95901449941965, 19.79866525060089], [94.96013803414303, 19.806577303399877], [94.97792235872993, 19.810811665925712], [94.9853480950386, 19.81328691226122], [94.98808483095024, 19.81419915666578], [94.99119002989602, 19.81561061114087], [94.99542439332117, 19.814763739355158], [94.99909417495627, 19.813634574875778], [95.0101035189623, 19.80883562966062], [95.0213951538633, 19.800366903709687], [95.02788924918957, 19.79456860485726], [95.02680296258671, 19.793643250135915], [95.02235286259457, 19.7904068140233], [95.01987650469698, 19.78947818037375], [95.01264355515599, 19.786765824183476], [95.00293424681809, 19.788788596416623], [94.99403404773318, 19.79566602326838], [94.97825642179652, 19.7904068140233], [94.9689516689844, 19.786361268657686], [94.96446912774809, 19.785433847294257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
