
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Shey Kan Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Shey Kan Twin</div><div class="name-mm">အရှေ့ကံတွင်း</div></div>
        <span class="pcode-badge">MMR009022016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.74229547975267, 21.081578800021646], [94.74373348041587, 21.08204451843983], [94.74757991408183, 21.08208390514818], [94.74822513178447, 21.077588269782893], [94.75152362741352, 21.073998990960717], [94.75347039883991, 21.072211782647685], [94.75692799263282, 21.068048548401862], [94.75759749922526, 21.064533871041363], [94.76078244825146, 21.06371049674209], [94.76087159264995, 21.063703818376553], [94.76607994433402, 21.06331358275571], [94.76713705872834, 21.060182515710608], [94.76412464823397, 21.05767196918606], [94.75994073137969, 21.054826670714306], [94.75989056180003, 21.053672200211906], [94.75636183163328, 21.052333715828354], [94.75255838376245, 21.052333715828354], [94.74894510833013, 21.05347474956011], [94.74247924721953, 21.054615785090448], [94.73721492892588, 21.053345087106152], [94.73696424830149, 21.053284578020907], [94.7358232127711, 21.06013078400855], [94.73601338610894, 21.067737679750167], [94.73639373008666, 21.072682162252022], [94.73962666064193, 21.077436472315412], [94.73947896498231, 21.078913431609635], [94.73991091925359, 21.07974713102533], [94.74134860965069, 21.080213515841137], [94.74229547975267, 21.081578800021646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
