
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Ywar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Ywar Gyi</div><div class="name-mm">ရှမ်းရွာကြီး</div></div>
        <span class="pcode-badge">MMR007001027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.55265029627424, 17.364226034204137], [96.54756287642567, 17.36164201666577], [96.54756279818463, 17.360738081996942], [96.5452094126843, 17.359834328991155], [96.54426754371224, 17.359383703894878], [96.54309721276621, 17.357733569348795], [96.53912878426604, 17.35819146456447], [96.53306253420863, 17.35961881815399], [96.52449841716827, 17.361046170844133], [96.51736165281807, 17.362830361931685], [96.51196961820335, 17.364904221952315], [96.55096465919172, 17.399131310161863], [96.56018763305286, 17.40493285916415], [96.56410745859239, 17.401725728359736], [96.56702683691907, 17.400202469268606], [96.566396178341, 17.396878405014434], [96.56780741607946, 17.394166445425185], [96.56921892271515, 17.39371304502106], [96.56585347885505, 17.388892534962565], [96.56203481085788, 17.384528341809585], [96.55865256226599, 17.380164149555924], [96.55904068537939, 17.36745311466956], [96.55556252319195, 17.36570522111913], [96.5550081963712, 17.365423665869514], [96.55265029627424, 17.364226034204137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
