
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hton Pa Ri</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawthoung</div><div class="name-mm">ကော့သောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hton Pa Ri</div><div class="name-mm">ထုံပရီ</div></div>
        <span class="pcode-badge">MMR006009011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.75578571973523, 10.484744940226847], [98.76591215971848, 10.48294025988514], [98.77538700040981, 10.477977299912482], [98.7832825200723, 10.473691050101934], [98.79005016038667, 10.47030723039444], [98.80121184505066, 10.47024503867766], [98.80883284216202, 10.467167324812237], [98.80660172578905, 10.46497009399468], [98.79917275371969, 10.457677086828141], [98.797846257299, 10.452218675951201], [98.79956177885305, 10.448837598276612], [98.79970039225935, 10.448413548146789], [98.80022070042503, 10.446821820070966], [98.79873788924226, 10.44641229039496], [98.79083368482674, 10.444229278758257], [98.78514949555284, 10.443583776869843], [98.78426806372022, 10.44215146621724], [98.7817031999428, 10.443687660257353], [98.77358196033924, 10.450455299672399], [98.76343068018178, 10.457448569995563], [98.74936871969072, 10.466296739702841], [98.75378052025485, 10.468703070090669], [98.7553846796593, 10.473515640034805], [98.7553846796593, 10.48033341035864], [98.75578571973523, 10.484744940226847]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
