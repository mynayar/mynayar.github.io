
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Mai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Mai</div><div class="name-mm">မန်မိုင်</div></div>
        <span class="pcode-badge">MMR015005076</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.84647189256384, 22.53966169413195], [98.84833076155547, 22.532104456255695], [98.85141534803995, 22.526747015862156], [98.85283333159305, 22.520429574365437], [98.85076596197962, 22.514571016439334], [98.84686964202041, 22.505804294732457], [98.84410974766678, 22.4983363478442], [98.84367473390193, 22.49626505988465], [98.83821318708897, 22.492671304237376], [98.83124555104143, 22.491800350405924], [98.82483484535192, 22.4909990112954], [98.82206434079677, 22.49326414002809], [98.82244181683643, 22.501085763297397], [98.82450566560402, 22.504623790655444], [98.82480050204157, 22.509341161065777], [98.81978829609307, 22.527620969831958], [98.81964082166667, 22.53139195937149], [98.82527753393111, 22.52966925583155], [98.8295707876618, 22.529605561347637], [98.83144670779939, 22.530480989306284], [98.83794057469783, 22.533727923205163], [98.84427209508118, 22.539734749659033], [98.84647189256384, 22.53966169413195]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
