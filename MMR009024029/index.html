
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Yaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Yaung</div><div class="name-mm">ရင်ရောင်း</div></div>
        <span class="pcode-badge">MMR009024029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.23782361536763, 21.79311079802494], [94.23729989607341, 21.79323402582969], [94.22797769191703, 21.77513798363111], [94.22413913811079, 21.766089962981482], [94.22002640079779, 21.76115467784615], [94.21976627909055, 21.758033215560488], [94.21892967126735, 21.75731612403996], [94.21892967126735, 21.75457429886484], [94.22249404336549, 21.749639014628883], [94.22359077289593, 21.744429547785444], [94.22139731293572, 21.74168772440902], [94.21591366438417, 21.737574987096025], [94.20933584217545, 21.734033082760618], [94.2001541471962, 21.73535736594971], [94.20011496103666, 21.735200622210982], [94.19942528894597, 21.73778689165175], [94.19966824169603, 21.74580432700816], [94.19991119444614, 21.752121093114], [94.19723871599399, 21.759166718369386], [94.194804965277, 21.76914509666892], [94.19578100039291, 21.768884821177608], [94.20549910320113, 21.770342535879365], [94.20987224910505, 21.775687492783618], [94.2091433917542, 21.780060638687587], [94.20525615135034, 21.788078074043938], [94.20525615135034, 21.790750551596716], [94.21108701195612, 21.79488074475063], [94.23270979142382, 21.799253891553917], [94.24124619225802, 21.801561026720037], [94.23867080821128, 21.797346763142627], [94.23782361536763, 21.79311079802494]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
