
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thu Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thu Gyi Ward</div><div class="name-mm">မြို့သူကြီးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012001701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.90346874778453, 20.150297828781845], [92.90342948428332, 20.149107784696582], [92.90228081260949, 20.148450828143268], [92.90125154212501, 20.14773372043493], [92.90068490718278, 20.14779974056563], [92.90033346201972, 20.147926848045643], [92.89981493720967, 20.147878168642592], [92.89935775605568, 20.148004544973844], [92.89957800002475, 20.148522495117106], [92.89967306286161, 20.148684758894547], [92.89997553544265, 20.149934187912493], [92.89965289736335, 20.150293869966163], [92.8993292880163, 20.150550764905915], [92.89999110540526, 20.152243633436967], [92.90137785100706, 20.151855709073743], [92.90109262112765, 20.151098239791963], [92.90240434258641, 20.150597333600103], [92.90346874778453, 20.150297828781845]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
