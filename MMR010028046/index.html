
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khin Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khin Lu</div><div class="name-mm">ခင်လူး</div></div>
        <span class="pcode-badge">MMR010028046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89111342564416, 20.843442150634814], [95.8946030317046, 20.84491145939637], [95.90055372967095, 20.848878591074197], [95.90782680426366, 20.853176317133375], [95.91741403862704, 20.855490476904038], [95.92036459285174, 20.85514335298342], [95.92303414221197, 20.85482928904048], [95.92832365141544, 20.853506910615465], [95.93460494286387, 20.85482928904048], [95.94584515003373, 20.856482260048324], [95.94716752666011, 20.85218453398909], [95.94650633789723, 20.845242053777838], [95.94658837765155, 20.844093501713758], [95.9415474239745, 20.843919676252085], [95.93658850915244, 20.843919676252085], [95.92898484017832, 20.843919676252085], [95.92171176468622, 20.843919676252085], [95.9134469078486, 20.843919676252085], [95.90716561640016, 20.84193611086289], [95.90485145573018, 20.837968979185064], [95.90103690572869, 20.833518671449553], [95.89625600361171, 20.83829957266721], [95.89111342564416, 20.843442150634814]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
