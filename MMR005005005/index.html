
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Wut Hti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Wut Hti</div><div class="name-mm">သာဝတ္တိ</div></div>
        <span class="pcode-badge">MMR005005005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48950212012682, 22.791076650067396], [95.48010252031514, 22.791076650067396], [95.47387703989352, 22.789306619704803], [95.46551496004741, 22.78771973987415], [95.46213708036203, 22.7924246699626], [95.46209711988621, 22.792480470197575], [95.461730999586, 22.79211425996516], [95.46033451882306, 22.791689317707892], [95.46321639542037, 22.7975252271076], [95.46421475890406, 22.79954695073127], [95.46545925873784, 22.807325081887086], [95.46639263631118, 22.813236460594226], [95.46608150865478, 22.822259091583874], [95.46439938702213, 22.827745260935103], [95.46636307289754, 22.825952246598945], [95.46855639076489, 22.832175032651662], [95.47052003976808, 22.831481970116897], [95.47790543968438, 22.831481970116897], [95.48468027997103, 22.833129869847653], [95.49407952005384, 22.833129869847653], [95.50469988029528, 22.826477070260637], [95.4996947996753, 22.819091760276592], [95.49627696041347, 22.809509279729525], [95.49371339975363, 22.80029301031425], [95.49353016018881, 22.796691929688848], [95.4907225199284, 22.791076650067396], [95.48950212012682, 22.791076650067396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
