
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Hpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div>
        <span class="pcode-badge">MMR012004066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.01042564212975, 20.709545880937696], [93.00940851339226, 20.710255505387295], [93.00593026576922, 20.711296887941103], [93.00477923607292, 20.711641504551835], [92.99737795862598, 20.713529643778088], [92.99479677035475, 20.714115292187046], [92.99501621572585, 20.715527381583456], [93.00000592693203, 20.72388263737389], [93.00628492690788, 20.731166277201964], [93.01256392688379, 20.736691797288643], [93.01834060693352, 20.74548239599585], [93.02023882755992, 20.748883375667276], [93.02336380619477, 20.74071035669766], [93.02512192593622, 20.73618947736253], [93.0306474460229, 20.729659317423625], [93.03684620039189, 20.725698125767963], [93.03713934340601, 20.724557001204687], [93.0365400918518, 20.724332282209105], [93.03583196477342, 20.723989639610238], [93.03468982307692, 20.722367800433688], [93.03457109188247, 20.721457526443714], [93.0340075299236, 20.721700314617863], [93.03328967487863, 20.721543924312698], [93.03250920183825, 20.721373891292103], [93.02788468642922, 20.720366396991665], [93.0226103263056, 20.71810595822342], [93.01507552741373, 20.71383623795208], [93.01042564212975, 20.709545880937696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
