
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Sun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bilin</div><div class="name-mm">ဘီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Sun</div><div class="name-mm">တောင်စွန်း</div></div>
        <span class="pcode-badge">MMR011010013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.15361940810925, 17.232114348598373], [97.16238991236463, 17.224539823054442], [97.17426698433394, 17.214888006576302], [97.17894697622205, 17.20984101035441], [97.17894697622205, 17.204514010213472], [97.17894698341661, 17.199045749961442], [97.17894698431593, 17.197223006736408], [97.17536897579765, 17.190494010290365], [97.17178997982376, 17.187690007787694], [97.16318722970692, 17.19105247219386], [97.15720734514292, 17.19543771937532], [97.15059497997441, 17.199747002622132], [97.14508995183985, 17.194700020789355], [97.1384839403816, 17.198625026423883], [97.13325394021723, 17.20339202502197], [97.12940597770375, 17.205939859237162], [97.12774894086101, 17.207037025838133], [97.12224394060541, 17.210963025223464], [97.11894094207088, 17.213206027036563], [97.12234525732782, 17.21657001579365], [97.12520061022002, 17.217402827578496], [97.130078505119, 17.216807962017867], [97.13745483357377, 17.218354611576103], [97.14138094537441, 17.220258181370014], [97.1461398671612, 17.223470452699303], [97.14970905872616, 17.228110402273273], [97.15361940810925, 17.232114348598373]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
