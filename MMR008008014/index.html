
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Tauk Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Tauk Kwin</div><div class="name-mm">ဂွေးတောက်ကွင်း</div></div>
        <span class="pcode-badge">MMR008008014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.77352591968548, 17.825786776838356], [95.7725011503079, 17.821834090071263], [95.77074440023392, 17.817149424406466], [95.7679016810178, 17.81479204681557], [95.76474217111439, 17.812171965563834], [95.7607894843473, 17.81056161162911], [95.7533232974323, 17.808072882657484], [95.74849223472893, 17.807633695138975], [95.7517690378109, 17.817308314826903], [95.74801478465463, 17.81759710422301], [95.7451268978881, 17.821928934372863], [95.74772599705716, 17.82510560963624], [95.75119146081732, 17.825394398133028], [95.75003630593085, 17.82943743978609], [95.75003630593085, 17.83232532655262], [95.75263540420059, 17.835213214218527], [95.75783360074013, 17.83232532655262], [95.76274300878288, 17.836368369105003], [95.76366713233233, 17.83821661620391], [95.76505331765657, 17.840988987751643], [95.76707483893273, 17.841277776248432], [95.76909636020889, 17.84156656474522], [95.7736723158248, 17.836912859141194], [95.77469708700102, 17.83252098395627], [95.7736723158248, 17.82930027608694], [95.77352591968548, 17.825786776838356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
