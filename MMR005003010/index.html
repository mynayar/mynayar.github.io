
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Tan</div><div class="name-mm">ကျောက်တန်း</div></div>
        <span class="pcode-badge">MMR005003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24382328661545, 21.700156642015486], [95.24382328661545, 21.705197124447807], [95.24362537281274, 21.714301100915122], [95.2441254291453, 21.71315964540139], [95.24441526175497, 21.71249819043919], [95.25117204005767, 21.711458700058984], [95.25620160022373, 21.711687299629205], [95.26031676031027, 21.714202080161897], [95.26366188039151, 21.714716700115673], [95.26648932012608, 21.711687299629205], [95.27197608033191, 21.709629809967794], [95.27037552001428, 21.703685849722262], [95.26786092024531, 21.699799380037405], [95.2692325203646, 21.694084020261357], [95.2692325203646, 21.691797930130406], [95.26831596011351, 21.69184373979681], [95.26466016023824, 21.692026529700627], [95.2541441995952, 21.69271242014213], [95.246569486093, 21.69563451532065], [95.24382328661545, 21.695483242157934], [95.24382328661545, 21.700156642015486]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
