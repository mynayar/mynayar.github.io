
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyay Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyay Yoe</div><div class="name-mm">ကျေးရိုး</div></div>
        <span class="pcode-badge">MMR007006018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58977528879859, 18.128526459228738], [96.58949572734599, 18.12656952906059], [96.58917889079322, 18.1243516731912], [96.5880605793323, 18.122521708410147], [96.58575911978761, 18.118755683128313], [96.58233934788268, 18.112848804628698], [96.58339320493252, 18.111663214885482], [96.58731356107205, 18.10725281456581], [96.5888824148916, 18.099612687075876], [96.5828356180694, 18.09745862821319], [96.58196628211829, 18.097148943968648], [96.57950191668016, 18.09646439801361], [96.57705424625652, 18.099169717908183], [96.57698688703528, 18.099978027663894], [96.5767433578198, 18.1029003782499], [96.57208003306715, 18.10569837328137], [96.56524049015655, 18.1060092617181], [96.56484827782583, 18.10568836202833], [96.55797762376841, 18.107151720875265], [96.55258150713092, 18.10969461781241], [96.55493434134684, 18.114008145859316], [96.55713342476781, 18.118670281708205], [96.5630642719986, 18.11782301781807], [96.56909465709282, 18.119079348233356], [96.57052559088339, 18.11937746000183], [96.5767433578198, 18.12248634257071], [96.58793533794557, 18.128082332633596], [96.58977528879859, 18.128526459228738]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
