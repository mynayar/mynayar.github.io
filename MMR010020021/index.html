
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Ta Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Ta Gar</div><div class="name-mm">ကျောက်တံခါး</div></div>
        <span class="pcode-badge">MMR010020021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26565787081415, 21.01269754275745], [95.26772012058717, 21.005479668551914], [95.26978237036019, 20.998605504440548], [95.27287574412037, 20.993793589202824], [95.26875124457433, 20.99138763113433], [95.26290820534945, 20.989669088757466], [95.26084595557643, 20.988637964770305], [95.25981483068995, 20.980388966577607], [95.25988820727503, 20.98005877509246], [95.25328437397474, 20.980388966577607], [95.24778504214606, 20.980388966577607], [95.24641020896405, 20.9776393011129], [95.2428898595794, 20.974091361427213], [95.23729377958432, 20.96534748609764], [95.23148772228063, 20.956776637631776], [95.22468760295055, 20.963236751175202], [95.214969555001, 20.972549880272823], [95.20550892629598, 20.978670425100063], [95.2141016327842, 20.978670425100063], [95.22613142222741, 20.980045258282075], [95.23094333656582, 20.98176379975962], [95.23128704576061, 20.987263131588293], [95.23472412781632, 20.994824713189985], [95.24056716794053, 20.994824713189985], [95.24812875044154, 20.997230671258535], [95.25040427713571, 20.99963261565273], [95.25431549886122, 21.003761127973746], [95.26153337216743, 21.00822933491594], [95.26565787081415, 21.01269754275745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
