
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Shey</div><div class="name-mm">ရင်းရှည်</div></div>
        <span class="pcode-badge">MMR017006054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.04685223963918, 17.323944840382126], [95.04182699981624, 17.323600679727633], [95.04131222068247, 17.32415510007786], [95.04003743977609, 17.325528120226636], [95.03590716028725, 17.328006179641534], [95.03301599998849, 17.33131034999269], [95.02984944029947, 17.334476819749455], [95.02864272008554, 17.336756196441343], [95.02747463204867, 17.338090358683132], [95.02975891544168, 17.3403032583887], [95.0316148940122, 17.343301378655724], [95.03389917740515, 17.345300126399763], [95.03604213683519, 17.3474598887629], [95.03804088008263, 17.3460413701132], [95.04017495960676, 17.347693500254877], [95.04072567205219, 17.34831304770904], [95.04127620013656, 17.348932530412014], [95.04471816011505, 17.34521535000846], [95.04605703570371, 17.34395295906188], [95.0495367600135, 17.340672150399485], [95.0502740736896, 17.339618814057076], [95.05279657400274, 17.336015289973716], [95.05337237123803, 17.335152775380323], [95.05507860009737, 17.332484850195726], [95.05352915994285, 17.32986476984331], [95.05147786571098, 17.327861113599567], [95.05056924017833, 17.326973610443815], [95.04809099999972, 17.325390419632186], [95.04685223963918, 17.323944840382126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
