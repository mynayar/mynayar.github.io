
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Yo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Yo</div><div class="name-mm">ရေယို</div></div>
        <span class="pcode-badge">MMR005014014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38867187970357, 22.364501939812726], [95.37591564039457, 22.358276370358283], [95.36267088035692, 22.35491946016498], [95.35229496034418, 22.3535156400348], [95.34289535963319, 22.34967038987662], [95.33770740007651, 22.342529340256874], [95.33691395971152, 22.34149173035911], [95.32507319966851, 22.336914059736102], [95.31890856018197, 22.334899859840732], [95.31811511981698, 22.338500939566757], [95.31311039982518, 22.34411622008753], [95.31311039982518, 22.347900360413348], [95.31768816038033, 22.352722199669813], [95.32708739956388, 22.36047362995413], [95.33270268008465, 22.368896459903738], [95.33392343961509, 22.377502440385342], [95.33392343961509, 22.383728009839842], [95.34130847980254, 22.384277369704876], [95.35107419991448, 22.38470459983745], [95.36047379972615, 22.38470459983745], [95.37109380023873, 22.381713899876615], [95.38128647978726, 22.379699699981245], [95.3912962803991, 22.379699699981245], [95.39727768032077, 22.379699699981245], [95.39587404005499, 22.373290979994806], [95.38989264013327, 22.365112319577918], [95.38867187970357, 22.364501939812726]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
