
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Taung</div><div class="name-mm">အုပ်တောင်</div></div>
        <span class="pcode-badge">MMR012010024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.57268875708053, 21.0075202572541], [92.57770692013833, 20.994417057701128], [92.58522323076755, 20.97203376474647], [92.58823141264963, 20.96224026457662], [92.5721027660299, 20.955433340076638], [92.5758579643736, 20.945175214164863], [92.57911000192513, 20.937015920648264], [92.57315135035458, 20.936067710556472], [92.5696752826882, 20.935592276762236], [92.56592597310521, 20.94375011967236], [92.56244094009736, 20.946308092844276], [92.55698158493226, 20.944427186865255], [92.55549670171149, 20.94255650797652], [92.55127884174522, 20.94091200318644], [92.54901324986167, 20.95094016255848], [92.54749191891699, 20.96120360436288], [92.54322331200632, 20.976126696290066], [92.54146920683849, 20.981022352799414], [92.53996273719065, 20.98615200660987], [92.54642430044117, 20.985702633369897], [92.5490310996056, 20.98640960661811], [92.55163792574973, 20.987116541195462], [92.54988255883308, 20.992478979121643], [92.5490797160561, 20.995171641957768], [92.55526999161685, 20.997774809659802], [92.56443853131321, 21.002541141860263], [92.57268875708053, 21.0075202572541]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
