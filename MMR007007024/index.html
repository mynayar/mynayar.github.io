
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Par Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Par Chon</div><div class="name-mm">ဆာပါခြုံ</div></div>
        <span class="pcode-badge">MMR007007024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60295014633226, 17.864954457082604], [96.60295014633226, 17.868021126373947], [96.59976430337997, 17.874074229242353], [96.59530412198768, 17.879490162441073], [96.59339261567675, 17.879808747275888], [96.58542800829599, 17.88076449998175], [96.58383508592055, 17.883950342934043], [96.57778198395147, 17.88681760195084], [96.57304505328665, 17.89037029994944], [96.57523330887017, 17.891914951214062], [96.57791778697634, 17.896935764573925], [96.58128641083925, 17.900835313099265], [96.58479083862636, 17.897330885312158], [96.59116252632958, 17.894463626295362], [96.59848996493997, 17.894782210230858], [96.60389259536703, 17.895541020401822], [96.60702802592272, 17.89318928875474], [96.61116962158081, 17.889047692197266], [96.61936734132979, 17.886157121853728], [96.61817847715508, 17.88076449998175], [96.6159483869086, 17.873755644407538], [96.61499263420279, 17.869614047850064], [96.60862094739889, 17.867383956704316], [96.60295014633226, 17.864954457082604]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
