
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Gyi</div><div class="name-mm">စကြီး</div></div>
        <span class="pcode-badge">MMR009016036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17536526379592, 19.025445014076183], [95.17547845516663, 19.025897777760292], [95.17197878029651, 19.02683102403256], [95.16217969263874, 19.032197191447267], [95.15259836322394, 19.037205613947947], [95.1589133297864, 19.03872991625269], [95.16777917207122, 19.042229590223485], [95.17152086619507, 19.048673620291368], [95.17197878029651, 19.049462250182728], [95.17477852001275, 19.05552835185199], [95.17829572626681, 19.056847303860025], [95.17851150600126, 19.056928222159797], [95.18667741223283, 19.056461598124315], [95.1922768898666, 19.056228287005865], [95.19367676017441, 19.05156205474509], [95.19344344905596, 19.044562705904184], [95.195543252719, 19.040129785661122], [95.20044279699755, 19.03872991625269], [95.20370915895057, 19.03709673482649], [95.20388039256613, 19.036126408606947], [95.20440909410445, 19.033130436820272], [95.20377772955862, 19.02989469498425], [95.20114273215142, 19.03009738688496], [95.1922768898666, 19.03009738688496], [95.17804488196577, 19.02683102403256], [95.17536526379592, 19.025445014076183]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
