
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yankin</div><div class="name-mm">ရန်ကင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) Ward</div><div class="name-mm">အမှတ် (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013010701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16490019109102, 16.823683206115106], [96.16397285426387, 16.823461532223973], [96.16270001769175, 16.823180516567618], [96.1622802744152, 16.823072242689875], [96.16207313536694, 16.82331275917653], [96.1616606712031, 16.82374763534517], [96.16136888256796, 16.824156688380526], [96.16147994973994, 16.824791431679273], [96.16148758768207, 16.825326969863795], [96.16142082201338, 16.826130866646224], [96.16108512757665, 16.82808303940078], [96.16100365799247, 16.828801291046773], [96.16330146808832, 16.829599380906757], [96.16365861855047, 16.829735994220812], [96.1637536103409, 16.82940258496137], [96.1638751033534, 16.828976154326085], [96.16399955783339, 16.82829475419959], [96.16426086394779, 16.826953888411254], [96.16439247163532, 16.826198578401716], [96.16490019109102, 16.823683206115106]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
