
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Kaung</div><div class="name-mm">လက်ကောင်း</div></div>
        <span class="pcode-badge">MMR010007041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16086755369469, 21.93191759811873], [96.16203550503457, 21.93069886566019], [96.16374535276589, 21.928761037991535], [96.16716504912779, 21.92522735166102], [96.17115469533297, 21.92169366622977], [96.17457439079556, 21.9189579087805], [96.17556083736281, 21.91785541009915], [96.17422856459666, 21.91711525906203], [96.17360928603978, 21.91360601630464], [96.17340286015394, 21.90968392087632], [96.17175145216783, 21.90968392087632], [96.16535224520999, 21.909477494990426], [96.16349441043877, 21.90927106910459], [96.15730162936677, 21.90968392087632], [96.15152170006644, 21.910303199433145], [96.15067997240288, 21.91048040544638], [96.15110884829477, 21.912367460090252], [96.15110884829477, 21.91794096260537], [96.15110884829477, 21.92227590980542], [96.15110884829477, 21.92661085700547], [96.1554437945955, 21.92661085700547], [96.16019159356728, 21.92661085700547], [96.15957231590971, 21.931152230091413], [96.16086755369469, 21.93191759811873]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
