
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Pwe Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Pwe Long</div><div class="name-mm">မန်းပွဲလုံ</div></div>
        <span class="pcode-badge">MMR015001044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.57890956182689, 22.827600059095516], [97.57983976659199, 22.82947120203437], [97.58184945998465, 22.83326728895429], [97.58511131363628, 22.837347150650544], [97.58831566193828, 22.8396565053435], [97.59122802915027, 22.84063616562662], [97.59368432317302, 22.845772049040875], [97.60038330024918, 22.85001473659088], [97.60633636702977, 22.85575460109402], [97.60638721739622, 22.855778068003474], [97.60648891633048, 22.855825003621078], [97.60893441579071, 22.858625425922696], [97.61154826294205, 22.860733103150267], [97.6113249657746, 22.86341269434041], [97.6061977419323, 22.86423966502855], [97.60607358422857, 22.864259691131906], [97.60471893992718, 22.86679253184991], [97.60481616833158, 22.867287594247102], [97.62126082412777, 22.87503069770861], [97.62172963531447, 22.873356374996774], [97.6222986183866, 22.857709320728645], [97.62172963531447, 22.853157450755816], [97.6222986183866, 22.84945905629047], [97.62685048925874, 22.84547617028909], [97.63673878966347, 22.842161220663854], [97.6262815052873, 22.821009867611338], [97.62479103008201, 22.81937956221708], [97.6160397973988, 22.822147835554233], [97.60380664605992, 22.822147835554233], [97.60238939725292, 22.822454908167515], [97.58133178683255, 22.827268690397773], [97.57890956182689, 22.827600059095516]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
