
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Yin</div><div class="name-mm">ကျွန်းရင်း</div></div>
        <span class="pcode-badge">MMR009010073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.51882990257798, 20.599775347854063], [94.5064829573227, 20.60561208642872], [94.49553408283174, 20.60948981200528], [94.48709432584252, 20.618613873931167], [94.48535239839453, 20.63080736966441], [94.48533655773599, 20.630918249777437], [94.48539920900635, 20.63089318926933], [94.49253226185448, 20.62803996777035], [94.49835035298645, 20.62845554628649], [94.5016749757196, 20.630117856753714], [94.50416844321916, 20.633026902769416], [94.50458402083598, 20.642585194251353], [94.5074930659523, 20.64632539460132], [94.51040211196795, 20.64840328538338], [94.5122722116933, 20.652143485733347], [94.51559683532577, 20.652559064249488], [94.51975261419187, 20.651727908116527], [94.52203829333263, 20.644663084134095], [94.52536291606577, 20.639676149135028], [94.5309589888663, 20.636974595601146], [94.53138879465723, 20.636767104018702], [94.53596015203942, 20.627208811637388], [94.54011593090553, 20.62222187663832], [94.54219382078827, 20.612040219180813], [94.54011593090553, 20.596663836566847], [94.5397056386044, 20.59675303132741], [94.5257784936826, 20.599780670941243], [94.51892145895823, 20.599780670941243], [94.51882990257798, 20.599775347854063]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
