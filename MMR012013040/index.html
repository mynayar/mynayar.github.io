
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Yant Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Yant Chaung</div><div class="name-mm">ငရန့်ချောင်း</div></div>
        <span class="pcode-badge">MMR012013040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.95316270369585, 18.93527936614987], [93.95185931805315, 18.935243161242965], [93.94857455597105, 18.93852792332507], [93.94702878594978, 18.939494029026264], [93.94277791816643, 18.94103979904753], [93.93935269996717, 18.940540287704152], [93.93929993494407, 18.94065335676703], [93.93079819937748, 18.95089408439452], [93.92384223383209, 18.957270385619836], [93.91227604220563, 18.96123896700476], [93.91338291788742, 18.96752688735603], [93.914489887998, 18.973814792418807], [93.91919603037258, 18.984337115765356], [93.92849131602145, 18.98395054937839], [93.94024570067859, 18.975726911168067], [93.9480620746051, 18.966842398957624], [93.95741679734738, 18.95998485791489], [93.96301638559777, 18.955879557995274], [93.95881528269922, 18.943744896809562], [93.95398475059585, 18.942005905648102], [93.9526322026141, 18.937755037864747], [93.95316270369585, 18.93527936614987]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
