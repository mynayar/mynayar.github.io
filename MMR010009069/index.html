
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Taw Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Taw Kyun</div><div class="name-mm">နန်းတော်ကျွန်း</div></div>
        <span class="pcode-badge">MMR010009069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05629732696013, 22.05388865603669], [96.04906659424796, 22.050896628676526], [96.04787371460031, 22.047914430906303], [96.05145235084535, 22.044335795560585], [96.05422942404874, 22.040633032188737], [96.0526680768703, 22.03969622370181], [96.04892313799246, 22.038710714228102], [96.03946223769219, 22.036345489153064], [96.03098684866421, 22.035951284823966], [96.02103203440095, 22.036695177940146], [96.02136594907932, 22.03864755933745], [96.0215515259822, 22.03973261926501], [96.0216923256404, 22.040555807404644], [96.02220762728024, 22.043880863611037], [96.02253537890465, 22.045995727320985], [96.02842452187423, 22.04698900064193], [96.03335207373925, 22.05211365422184], [96.03611150314339, 22.060194838920722], [96.03965934030634, 22.059406431161904], [96.04793762672017, 22.058618023403085], [96.05227387344058, 22.057041206086865], [96.053492533054, 22.056539405069543], [96.05629732696013, 22.05388865603669]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
