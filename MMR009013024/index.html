
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bweit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bweit</div><div class="name-mm">ဘွဲ့</div></div>
        <span class="pcode-badge">MMR009013024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9435871657152, 19.76548412699094], [94.95115127081453, 19.75035591769148], [94.952557914816, 19.747414752388977], [94.95560136990736, 19.741051164879423], [94.96868137324685, 19.72874057381847], [94.96935622271155, 19.728105421328166], [94.98998850326689, 19.715968785231325], [94.99120216624704, 19.711518686138504], [94.98311107641513, 19.706664032419212], [94.97582909493684, 19.700595713921132], [94.9685469713657, 19.701944256322406], [94.96490612361879, 19.7026184870536], [94.9592423606465, 19.705045813913216], [94.94670117082245, 19.704641259286745], [94.9427915067227, 19.704858462647962], [94.93213720876525, 19.705450367640424], [94.9195960189412, 19.70747314077289], [94.9106559906815, 19.714736913677655], [94.90665027538995, 19.717991558363792], [94.89168175780696, 19.72163254820356], [94.88934216610812, 19.72302168060611], [94.88883619583385, 19.72332210093424], [94.89046809482676, 19.724464429689704], [94.89571688812396, 19.740614561113148], [94.8957273040719, 19.740646610252895], [94.9046275031568, 19.747524037104654], [94.91352770224171, 19.75440146305715], [94.92323700968029, 19.762492552889057], [94.92609987460958, 19.7640541159048], [94.9280916642989, 19.763301662142055], [94.93941919024348, 19.762087999161906], [94.9435871657152, 19.76548412699094]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
