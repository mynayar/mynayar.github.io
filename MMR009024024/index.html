
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dant Dee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dant Dee</div><div class="name-mm">ဒန့်ဒီး</div></div>
        <span class="pcode-badge">MMR009024024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.24149327379558, 21.617652419323747], [94.24442864026958, 21.617757254193975], [94.251283200959, 21.617757254193975], [94.25484757305713, 21.615837976841192], [94.26115376943096, 21.618305619408886], [94.2636214119986, 21.61748307068723], [94.26691160058994, 21.615289611626338], [94.27047597268808, 21.615289611626338], [94.27431452739359, 21.613918698589146], [94.27760471688424, 21.612547787350536], [94.27897562902211, 21.61062850999781], [94.28508304284821, 21.607687903174224], [94.28445927757366, 21.60706413789967], [94.28555600800343, 21.599112846780486], [94.28418509586555, 21.59856448156563], [94.28116908898232, 21.59938702938797], [94.2781530820991, 21.60158048934818], [94.27376616217867, 21.60706413789967], [94.26992760837248, 21.60761250311458], [94.26608905366697, 21.606789955292243], [94.26225049896141, 21.604322312724605], [94.25813776164841, 21.602951400586733], [94.24059008466475, 21.611176875212664], [94.24050651066699, 21.61081471912405], [94.24031590295664, 21.611176875212664], [94.24149327379558, 21.617652419323747]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
