
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) Ward (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) Ward (South)</div><div class="name-mm">အမှတ် (၂) ရပ်ကွက် (တောင်)</div></div>
        <span class="pcode-badge">MMR013013701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19335087804063, 16.792377645611907], [96.19604873715957, 16.79103279133028], [96.19706153835938, 16.790559768618493], [96.19845390382466, 16.78992080659998], [96.1991729738537, 16.789600372759026], [96.19974327083531, 16.789340973207402], [96.20092691714359, 16.788830076446914], [96.20033200571754, 16.78759193392068], [96.19965418669142, 16.786233453111436], [96.19845199636262, 16.78677940364662], [96.19790840115184, 16.787031173350044], [96.19734001163226, 16.787290572901668], [96.19641232586821, 16.787687787261632], [96.19613838158108, 16.78782272334007], [96.19586372413164, 16.78795051610348], [96.19486808739236, 16.7884057367354], [96.19389152527373, 16.788835525439197], [96.19309425379686, 16.789194106722675], [96.19198001536546, 16.789707010769973], [96.19218635581575, 16.7901287082733], [96.19262377436775, 16.790985743297483], [96.19277381905658, 16.7912731171607], [96.19317654176405, 16.792075294439314], [96.19335087804063, 16.792377645611907]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
