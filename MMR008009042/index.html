
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR008009042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70573957262326, 17.93317822539484], [95.7154865751454, 17.933135662281018], [95.71784001280639, 17.922909203297138], [95.72071795576909, 17.912705587992548], [95.71705511959817, 17.91375211286976], [95.7060666110853, 17.91401374363943], [95.70057235682884, 17.912705587992548], [95.69455484103315, 17.914537006078035], [95.690434150116, 17.915910570316612], [95.68395877867476, 17.91669546262557], [95.67846452531762, 17.917872802887587], [95.67787585518664, 17.922582163935772], [95.6780720791632, 17.925917960745323], [95.67855914299014, 17.927657478010246], [95.68180032212723, 17.927487748061196], [95.68454744970512, 17.92689907793016], [95.69023792703877, 17.924348174328827], [95.69514351116419, 17.921993493804734], [95.70161888170611, 17.920816154442036], [95.70475845633774, 17.92375950419779], [95.70573957262326, 17.93317822539484]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
