
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Gyi Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Gyi Taw</div><div class="name-mm">ညောင်ပင်ကြီးတော</div></div>
        <span class="pcode-badge">MMR005006063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8286412004311, 22.24819935011999], [95.8377481203795, 22.248578790278998], [95.84616744027522, 22.2439482898817], [95.85164663988058, 22.24098989986402], [95.85458640044209, 22.235950080232044], [95.85584927972053, 22.22710991988697], [95.85837504007611, 22.22121654021123], [95.85943919975932, 22.218024330058824], [95.85837504007611, 22.21826985037336], [95.85542844017044, 22.213218329662254], [95.85563903980989, 22.212692190292387], [95.84995607990925, 22.216165020399444], [95.84364167991964, 22.217427899677887], [95.83522236002398, 22.21995366003341], [95.83410167974876, 22.219558110318587], [95.83017084021219, 22.22584703970915], [95.82764507985661, 22.23468720005428], [95.82680339985706, 22.241843459907784], [95.82764507985661, 22.24815785989739], [95.8286412004311, 22.24819935011999]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
