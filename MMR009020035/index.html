
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Paung Tei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Paung Tei</div><div class="name-mm">ပေါင်းတည်</div></div>
        <span class="pcode-badge">MMR009020035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.96687491494544, 21.790710102789035], [94.9688434526633, 21.789004036706956], [94.97137442908667, 21.784504522565726], [94.97559272432483, 21.778880130113976], [94.97699882243779, 21.771287199944368], [94.98121711677658, 21.76369426887544], [94.98627906962344, 21.753851582084906], [94.98627906962344, 21.748176057778892], [94.98599785072031, 21.74794596983071], [94.98093589697413, 21.73979060005621], [94.97503028471994, 21.737822063237672], [94.96743735544965, 21.73163523118103], [94.95984442438072, 21.72544839822507], [94.96000512063989, 21.72480561138991], [94.9567510083524, 21.72601083782996], [94.95197027440872, 21.7279793746485], [94.95152619817554, 21.728867527114744], [94.95028295739263, 21.731354011378585], [94.9485956385779, 21.738384501943244], [94.95056417629576, 21.742602796282085], [94.95112661500133, 21.7485084094356], [94.94831441877545, 21.75103938585903], [94.9467942263725, 21.752283179724998], [94.94718953956567, 21.75300792267751], [94.94803319897301, 21.759475975435976], [94.94803319897301, 21.76425670937971], [94.94437734423911, 21.766506466000635], [94.94270150796825, 21.76806538321091], [94.94381490463422, 21.7679125641136], [94.94212758671881, 21.780848666932457], [94.94159878175844, 21.789045144717704], [94.95731344795729, 21.790128915916796], [94.96687491494544, 21.790710102789035]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
