
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moe Tein Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moe Tein Pyin</div><div class="name-mm">မိုးတိမ်ပြင်</div></div>
        <span class="pcode-badge">MMR012002063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.94525926390395, 20.382421337574726], [92.9456152929115, 20.384439131161002], [92.94411140971386, 20.38714612829125], [92.94095330185348, 20.390304267627926], [92.93584022614556, 20.392409647986938], [92.93117830163737, 20.394515034641188], [92.93057673612753, 20.396319705090377], [92.93057668756416, 20.399026724703617], [92.93328355788992, 20.40083144821284], [92.93411638766122, 20.40116815438688], [92.93873957387228, 20.400750014601556], [92.94532485505806, 20.400853987921266], [92.95087946101836, 20.40094149465432], [92.9522720513142, 20.402630615710393], [92.9536646721869, 20.40431972597463], [92.95406471401537, 20.397564893804883], [92.956853798564, 20.38705791379175], [92.9571739805948, 20.385129029880886], [92.9578504209602, 20.381053757425036], [92.95894581140016, 20.377488903290327], [92.9600411496794, 20.373924040162365], [92.96244958538011, 20.369242558097653], [92.95503875533433, 20.36466744964315], [92.95299217804666, 20.36593519964981], [92.95212889273427, 20.367255520426], [92.95151951391449, 20.370150065772975], [92.95116404428529, 20.37548212639905], [92.95014841291896, 20.37868136205526], [92.94908200133335, 20.380103244169447], [92.94620030100316, 20.382181155635863], [92.94525926390395, 20.382421337574726]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
