
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Saung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Saung</div><div class="name-mm">ငါးဆောင်</div></div>
        <span class="pcode-badge">MMR009001028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33006344057537, 19.950370967446247], [95.33231693837604, 19.94940518190367], [95.34095476924728, 19.949072957950705], [95.34678468736348, 19.943826031646097], [95.34427701237428, 19.9367806599995], [95.33929364768375, 19.929803948893152], [95.32899469524904, 19.924156137196007], [95.32714595442229, 19.919996468762065], [95.31936019072026, 19.917511650942004], [95.3040778726957, 19.90920604402379], [95.2977656121933, 19.901897108964477], [95.29245002265048, 19.895252623609736], [95.2838121917793, 19.891598155630447], [95.26985877226457, 19.887611464597455], [95.26653652913757, 19.899239314642728], [95.26387873481582, 19.91452163176797], [95.26188538929932, 19.920169445263753], [95.25868898920555, 19.932635405899305], [95.25856314617232, 19.93312619202021], [95.29012445318102, 19.94176402379071], [95.30906123828555, 19.942760697448307], [95.32002463862625, 19.94541849087068], [95.33006344057537, 19.950370967446247]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
