
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Bo</div><div class="name-mm">ရွှေဘို</div></div>
        <span class="pcode-badge">MMR009023036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.11565278744627, 22.704109281817978], [94.11654548508614, 22.69853044092713], [94.11852429755834, 22.69673151534721], [94.11900012615496, 22.696298943241686], [94.11999748959255, 22.69601968935723], [94.12143660001914, 22.69561680027516], [94.12681031994038, 22.69205919017952], [94.12954510342382, 22.687570686438107], [94.12502962901425, 22.681106465690902], [94.12465228967147, 22.672804992056797], [94.13484046271725, 22.666390216935042], [94.1386138597419, 22.65997544091391], [94.13521780205997, 22.648655248940656], [94.1329537642049, 22.629410921776696], [94.13182174527736, 22.622618807312165], [94.10255433091771, 22.620932570381854], [94.10404010626593, 22.62984722067273], [94.10595038859964, 22.632606517876525], [94.1080729253253, 22.655317654186433], [94.10722390955584, 22.668689631421387], [94.10340334578785, 22.677604281712263], [94.09823850780094, 22.696954735172937], [94.11565278744627, 22.704109281817978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
