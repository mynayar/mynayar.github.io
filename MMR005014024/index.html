
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Khe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Khe</div><div class="name-mm">ဝက်ခဲ</div></div>
        <span class="pcode-badge">MMR005014024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56518085631154, 22.326600601236805], [95.55716526816263, 22.325454698575527], [95.55450444042765, 22.325317380192985], [95.54809572044121, 22.325927759958233], [95.53833000032932, 22.328674290386232], [95.5277099998167, 22.328674290386232], [95.52148452029445, 22.328491229786493], [95.51989763956448, 22.328308080153818], [95.52008052029981, 22.329101519619485], [95.52001211966365, 22.329101519619485], [95.52087395976548, 22.33508301037267], [95.52630599982211, 22.3421020201921], [95.52587904038546, 22.354492230032463], [95.52288815966091, 22.363891560047534], [95.53411871980313, 22.365112319577918], [95.53485467910019, 22.365084000826016], [95.53439941979747, 22.36358814857425], [95.53999967444548, 22.35775455223086], [95.54466655241953, 22.35682117555683], [95.54991056312207, 22.356914820162842], [95.55287364310419, 22.356015737336463], [95.55369206393766, 22.355261805088276], [95.55385028166523, 22.355116053762913], [95.55628028580662, 22.35468068386649], [95.55774828695394, 22.353334206308602], [95.55824086722231, 22.351983545104588], [95.55829058983892, 22.344618485155024], [95.55540037382826, 22.340020415210063], [95.56374137536426, 22.32808447811624], [95.56518085631154, 22.326600601236805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
