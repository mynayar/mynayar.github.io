
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wun Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wun Su</div><div class="name-mm">ဝန်စု</div></div>
        <span class="pcode-badge">MMR010009030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03812616978695, 22.228738702729004], [96.04414845288886, 22.235876224308356], [96.04950159362369, 22.24635945772286], [96.0512859735689, 22.255281359247363], [96.05195511593593, 22.259965356715895], [96.0577543518819, 22.26041145192704], [96.07046806135202, 22.261080594294015], [96.07849777155496, 22.260634499082926], [96.08585834029026, 22.261080594294015], [96.09165757623623, 22.261972784716306], [96.10347909528406, 22.263980211817398], [96.10303300007297, 22.26018840387178], [96.10191776159547, 22.255281359247363], [96.10102557207256, 22.248589932879156], [96.09834900170512, 22.249259075246187], [96.09455719375956, 22.242567649777243], [96.08898100586879, 22.237214509042417], [96.0822895803999, 22.233422701096856], [96.07180634608608, 22.233199653041595], [96.06623015819531, 22.23297660588571], [96.06511491971781, 22.224946894783443], [96.05596997193669, 22.224277752416413], [96.05083987925707, 22.223831657205267], [96.0452636913663, 22.224277752416413], [96.03812616978695, 22.228738702729004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
