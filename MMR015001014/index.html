
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Kye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Kye</div><div class="name-mm">ကောင်းကြဲ</div></div>
        <span class="pcode-badge">MMR015001014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.76748751943353, 23.02766477211162], [97.76738947894137, 23.033240813412874], [97.76625151099847, 23.038361667357094], [97.76596702036176, 23.044335996808854], [97.7685274468842, 23.052870752783065], [97.77393279236452, 23.058560590698733], [97.77990712181628, 23.06624187206478], [97.78616594280408, 23.071433848893037], [97.78787289471836, 23.071362726009056], [97.80636486704503, 23.07335416856006], [97.82343437989277, 23.07335416856006], [97.82656379128599, 23.069940265630805], [97.82656379128599, 23.06606406440511], [97.82656379128599, 23.06368144464301], [97.82400336386422, 23.060836525685147], [97.82262190717535, 23.057728302319333], [97.82058946093491, 23.05315524521842], [97.81859801838391, 23.045473963852373], [97.81888250991994, 23.036654716342127], [97.81888250991994, 23.030680385991047], [97.81717555890498, 23.0249905489747], [97.81091673701786, 23.021576646045446], [97.80415587129647, 23.020393255144654], [97.7989680781144, 23.02186113758148], [97.79327824019867, 23.021007662074], [97.7892953541973, 23.018162743116136], [97.78730391074697, 23.014464348650847], [97.77507076030741, 23.005929591777317], [97.7685678561217, 23.002756520996684], [97.76909642995633, 23.009627987141926], [97.76748751943353, 23.02766477211162]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
