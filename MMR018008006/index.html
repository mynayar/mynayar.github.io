
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tet Shein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oke Ta Ra Thi Ri</div><div class="name-mm">ဥတ္တရသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tet Shein</div><div class="name-mm">တက်ရှိန်း</div></div>
        <span class="pcode-badge">MMR018008006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97204069791991, 20.01248766367479], [95.97052430785061, 20.016055640255615], [95.9692479980967, 20.02163949756482], [95.96698544772028, 20.031538156360853], [95.96521601720548, 20.04702067336541], [95.96344658669068, 20.054540752154026], [95.96376253201532, 20.05706831475095], [95.96388894431936, 20.05807961318368], [95.97566003118555, 20.05076487389988], [95.97961524774553, 20.04364548265295], [95.99068985735107, 20.042063396208846], [96.01419422088662, 20.04801783535487], [96.01391706781851, 20.043306233196176], [96.01387535366467, 20.042597097078442], [96.01254828077862, 20.034634659761764], [96.0121059240492, 20.027114580073885], [96.00945177827703, 20.01782506987115], [96.0087399792667, 20.013981352157714], [96.00492863984493, 20.013981352157714], [96.00018237871387, 20.0183320905536], [95.99266746563109, 20.01912313512463], [95.98475703071244, 20.017936569617063], [95.9768465957938, 20.015563438601873], [95.97204069791991, 20.01248766367479]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
