
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ping Hsar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ping Hsar</div><div class="name-mm">ပိန်းဆာ</div></div>
        <span class="pcode-badge">MMR015002005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.91376838360407, 23.267249016129256], [97.91936150842696, 23.262140507178742], [97.92638091844469, 23.256905692943405], [97.93149675866852, 23.25405033915189], [97.93696951912807, 23.25083806692328], [97.94030076356944, 23.2467929838092], [97.94339406358523, 23.241320223349703], [97.94688720757864, 23.23866990689072], [97.94741768168075, 23.238736215703852], [97.94199468970322, 23.234578588730926], [97.9338070360659, 23.22884723091505], [97.92561938242864, 23.219431428917346], [97.92681471902415, 23.21584541733222], [97.91508466732358, 23.213012816388414], [97.91258004373407, 23.214908205948973], [97.9061554992769, 23.21764458572909], [97.90151555060226, 23.220024047072172], [97.89758943970094, 23.224188104197708], [97.89354435568754, 23.228352160423924], [97.89033208255961, 23.23120751421544], [97.88676289189402, 23.235966436002286], [97.88562480524064, 23.23938069776102], [97.88643578868079, 23.23939571643922], [97.89050638016539, 23.240601817020263], [97.89261705843057, 23.243164781429584], [97.89608459872534, 23.24693384821859], [97.9031698409155, 23.25254856756237], [97.90310333335219, 23.252591428351764], [97.90178592098351, 23.25534629729384], [97.90842530808158, 23.26405414398363], [97.91333790062367, 23.266919822891566], [97.91376838360407, 23.267249016129256]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
