
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Pay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Pay</div><div class="name-mm">သက်ပေး</div></div>
        <span class="pcode-badge">MMR005005016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4340356127534, 22.695320006013503], [95.43944052026387, 22.694776470158047], [95.4487303200483, 22.697326620127455], [95.45867927972506, 22.692871080136285], [95.4577025997952, 22.679504370230575], [95.4650879997115, 22.67669681990236], [95.47018199989941, 22.66698897026481], [95.47019162084666, 22.666970749100813], [95.47020827988825, 22.666939199984142], [95.47207067242363, 22.66459207106726], [95.4674037908523, 22.66552544504333], [95.46213560907114, 22.668350460205602], [95.46203584457862, 22.668403957276837], [95.4601701308469, 22.669492289837365], [95.45713665912956, 22.67089235439869], [95.44290268081414, 22.66809222707468], [95.43623101884651, 22.668782400987084], [95.43642012109177, 22.66683001869046], [95.43496108618524, 22.66682152459373], [95.43168570403208, 22.670192322117998], [95.42936873477936, 22.670192322117998], [95.4263453507574, 22.6715780406941], [95.43434673861117, 22.681008246233603], [95.43590236610135, 22.686297374124592], [95.43652461601829, 22.690653128039457], [95.4340356127534, 22.695320006013503]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
