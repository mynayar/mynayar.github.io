
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khin Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khin Lel</div><div class="name-mm">ခင်လယ်</div></div>
        <span class="pcode-badge">MMR010015080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3363673560687, 21.240681169100696], [96.33205965023274, 21.239923391351454], [96.31961798118493, 21.234820061596622], [96.32027015784155, 21.240037475748977], [96.31570492124519, 21.249494040417687], [96.31440056703258, 21.26221148657089], [96.31798753909374, 21.273298493330856], [96.32124842327619, 21.27492893542211], [96.32935905087953, 21.271222742035945], [96.32981384793078, 21.271056102157445], [96.33111354995043, 21.270582304230004], [96.3328609956385, 21.269193543247468], [96.33344428782368, 21.267932453619892], [96.33505050127968, 21.264459548869127], [96.33588981336425, 21.26090429769522], [96.33577067297824, 21.25952052615139], [96.33557304875723, 21.257227029204103], [96.33469679791892, 21.255718476726372], [96.33431428207854, 21.25505993826556], [96.33408523284726, 21.254842463309103], [96.33259020437447, 21.2529926837654], [96.33256537589142, 21.252944844329136], [96.33491096426962, 21.24614264037058], [96.3363673560687, 21.240681169100696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
