
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Taing</div><div class="name-mm">အင်းတိုင်</div></div>
        <span class="pcode-badge">MMR013004021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32432997634737, 17.130451229840446], [96.32781539516441, 17.12918380538838], [96.32781539516441, 17.12474781665844], [96.32781539516441, 17.12221296685499], [96.32781539516441, 17.11397470386953], [96.32813225060295, 17.108905004262567], [96.32908281961647, 17.104469017331326], [96.33256823933283, 17.10098359761497], [96.33681771226765, 17.097978866431617], [96.33623170592853, 17.095341836556543], [96.33588179770686, 17.090967990080742], [96.32099554201073, 17.0965138501341], [96.31513547861948, 17.0965138501341], [96.31161944058476, 17.098271869151517], [96.3098614215674, 17.100908897227896], [96.30781039983015, 17.103545926203594], [96.3066383871519, 17.105596947940853], [96.30658602502507, 17.10953871693829], [96.30658602502507, 17.112390423079603], [96.30531859967368, 17.115242130120237], [96.30658602502507, 17.119678117051535], [96.31197258186921, 17.12474781665844], [96.3170422823755, 17.12918380538838], [96.3175287940187, 17.129832487279486], [96.31799285138902, 17.130451229840446], [96.32432997634737, 17.130451229840446]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
