
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pein Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayetchaung</div><div class="name-mm">သရက်ချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pein Taw</div><div class="name-mm">ပိန်းတော</div></div>
        <span class="pcode-badge">MMR006003002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.27533397018664, 13.929153572079713], [98.27223335958195, 13.927245389663028], [98.26742268001271, 13.924038060108444], [98.26513199974204, 13.919227199775491], [98.26100855959743, 13.913958105182473], [98.2594419073182, 13.911781919400084], [98.25688548008088, 13.908230865362214], [98.25322032006176, 13.904107200387045], [98.25092928006228, 13.908918059820678], [98.25161652038616, 13.913041589897489], [98.2516667250394, 13.91319221105175], [98.25367823955918, 13.91922701991109], [98.25276168020741, 13.925641500055235], [98.25184652559676, 13.92877975718011], [98.25303212703108, 13.92965614921195], [98.25596873996545, 13.931826885102737], [98.26192476011965, 13.937554169889097], [98.2646733598877, 13.943968650033241], [98.26948404035625, 13.94923774462626], [98.27345899163919, 13.952550345222278], [98.27383643979994, 13.951757789790236], [98.27452368012382, 13.947634169781168], [98.27223299985314, 13.938470640207925], [98.27314956010417, 13.932514350257122], [98.27533397018664, 13.929153572079713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
