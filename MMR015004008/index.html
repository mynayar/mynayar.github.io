
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Mon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Mon</div><div class="name-mm">လုံမုန်</div></div>
        <span class="pcode-badge">MMR015004008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.46333392542039, 22.55066233359986], [98.46319606294799, 22.550524472026837], [98.4850162867723, 22.531550365057342], [98.50021451908486, 22.51833451102891], [98.51698075715626, 22.502488371141453], [98.54270948225684, 22.478171587948452], [98.53964722144218, 22.473536814872148], [98.53052673162341, 22.45878308237343], [98.5189919955842, 22.441615102754838], [98.51228575378457, 22.427129620036], [98.51228575378457, 22.420691628016243], [98.51292000875145, 22.41774415217094], [98.51121275466494, 22.418277380896484], [98.49726377240523, 22.42927561737588], [98.4859972861459, 22.435981859175513], [98.47526729764775, 22.44563884765472], [98.47017055362818, 22.45261334013361], [98.45863581758897, 22.45985608059368], [98.44441858465001, 22.47246381575252], [98.44360810483022, 22.47302492076352], [98.44061693272533, 22.48234780840471], [98.44232618330676, 22.48299010420999], [98.44938803143259, 22.489601320044926], [98.44846274775767, 22.49402671835844], [98.44768791706377, 22.4977323074001], [98.44140833522653, 22.50391012015598], [98.4341112406413, 22.506529445077888], [98.43836726333859, 22.518642608869357], [98.44498476723328, 22.534083450390995], [98.45527866188081, 22.54548026280395], [98.46263144428576, 22.550627209678055], [98.46333392542039, 22.55066233359986]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
