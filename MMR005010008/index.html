
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyi</div><div class="name-mm">ကြည်</div></div>
        <span class="pcode-badge">MMR005010008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.260070880267, 22.668701130153067], [95.26498632006269, 22.674382019814402], [95.26727303971904, 22.67150877041348], [95.26971419995044, 22.665527369592496], [95.27368175970548, 22.656677219578057], [95.28027336042732, 22.650878880256187], [95.28311087976334, 22.650041519700437], [95.28771960037932, 22.64868161976102], [95.2922973600352, 22.64691159029769], [95.30108640021723, 22.64251707020668], [95.30328383967753, 22.637878379683514], [95.3070303595635, 22.62836339955129], [95.30712899990345, 22.628112750403147], [95.301513720282, 22.626098640439977], [95.29827875995687, 22.623718230312136], [95.29327403996501, 22.623718230312136], [95.29248059960003, 22.623718230312136], [95.28771960037932, 22.62268062041437], [95.28332508028831, 22.621276890216336], [95.2799072401271, 22.62030030021873], [95.2747192796711, 22.62347414981224], [95.27069087988025, 22.625671410307405], [95.26251203959902, 22.624877969942418], [95.26243932041837, 22.624885349779106], [95.25048839971993, 22.626098640439977], [95.24731428032982, 22.62548825977541], [95.2509153600559, 22.638488760348082], [95.25830075997214, 22.65447995998221], [95.260070880267, 22.668701130153067]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
