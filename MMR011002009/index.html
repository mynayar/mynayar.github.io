
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Naung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaikmaraw</div><div class="name-mm">ကျိုက်မရော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Naung</div><div class="name-mm">ခနောင်</div></div>
        <span class="pcode-badge">MMR011002009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.73090599981208, 16.392436999867698], [97.72807949896975, 16.394760964047293], [97.72604504094596, 16.39643370665027], [97.72138368570859, 16.398764385168306], [97.71755471507811, 16.400928585685733], [97.7135592673464, 16.403758694608143], [97.71272688184018, 16.406755280631728], [97.71189449723335, 16.409085959149763], [97.7113950659296, 16.411583113869654], [97.71106211172713, 16.4137473152864], [97.71106211172713, 16.41524560829822], [97.71272688184018, 16.417243331714417], [97.71572346786382, 16.419574010232452], [97.72003067097876, 16.422126427392755], [97.72406267255434, 16.424930892147017], [97.7280233785761, 16.424452876399187], [97.73587560037873, 16.423976983950695], [97.74253809195943, 16.423501092401523], [97.74824879774388, 16.422787253728814], [97.75086620531118, 16.421478550394852], [97.75193696242093, 16.419456008388124], [97.75205593643238, 16.416719627708687], [97.75126399973385, 16.414901999827464], [97.74999379997394, 16.41270595341706], [97.74849473894113, 16.411064125009432], [97.74599630538523, 16.409565064875892], [97.74199881079653, 16.408637075140973], [97.73942899265393, 16.407637701718613], [97.73614533673793, 16.4057817213494], [97.73393243793174, 16.403069135832027], [97.73286167992268, 16.400356550314598], [97.73214784214923, 16.396644591374866], [97.73090599981208, 16.392436999867698]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
