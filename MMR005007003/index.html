
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Meik Tha Lin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Meik Tha Lin Kone</div><div class="name-mm">မိတ်သလင်ကုံး</div></div>
        <span class="pcode-badge">MMR005007003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6767072401471, 23.65541161785194], [95.6875024798556, 23.656910939688146], [95.7027657601318, 23.657604749559596], [95.71456008008369, 23.657951609978852], [95.71619570586716, 23.657951609978852], [95.716584246266, 23.655620367585925], [95.72015148270481, 23.65068111733973], [95.72042588564614, 23.6408026150487], [95.72440766278345, 23.641730363765305], [95.72184504011659, 23.635750409953516], [95.71351931986078, 23.62985325042723], [95.6996438400912, 23.61840578999528], [95.69339964028126, 23.609386529664675], [95.69187323985818, 23.609386529664675], [95.6795237998835, 23.609386529664675], [95.67123620098994, 23.611557271850643], [95.67216727180221, 23.62277629818766], [95.67362945073864, 23.639936700118653], [95.67611172887325, 23.652462400019772], [95.6767072401471, 23.65541161785194]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
