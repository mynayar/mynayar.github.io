
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Law Nauk Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Law Nauk Kone</div><div class="name-mm">လောနောက်ကုန်း</div></div>
        <span class="pcode-badge">MMR005036010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09901282568143, 26.39822141208856], [95.09654483867342, 26.40104020124437], [95.10071749871366, 26.410462149208854], [95.1032997077154, 26.41991256431345], [95.09972066587608, 26.426385405062433], [95.09344389801754, 26.436543484993877], [95.09419367989449, 26.436760289955487], [95.0957146798886, 26.437167719714523], [95.09847912031523, 26.437996980076605], [95.0985107998336, 26.437927229558056], [95.11767576002836, 26.44348149017867], [95.13690191998768, 26.44671626974008], [95.16912839975589, 26.45727543021701], [95.20129404038772, 26.462707560205786], [95.2221070801777, 26.462707560205786], [95.22228996001371, 26.462707560205786], [95.22070308018306, 26.455078169721787], [95.21527104012648, 26.441284139751303], [95.22070308018306, 26.424072269619614], [95.2067260804443, 26.413330050341585], [95.21850599955229, 26.398315439805742], [95.25769056007135, 26.373291029557436], [95.25766068009636, 26.373261059650247], [95.2484741998245, 26.364074670209902], [95.2229005196433, 26.347900409975978], [95.2067260804443, 26.34570315038013], [95.18951412038041, 26.353271520064652], [95.15728763971288, 26.371521000094106], [95.12628155974625, 26.388671850325693], [95.10316740035529, 26.399255850077452], [95.09901282568143, 26.39822141208856]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
