
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Laung</div><div class="name-mm">ပင်လောင်</div></div>
        <span class="pcode-badge">MMR001003017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.862855909073, 26.080240958553418], [97.86191975529255, 26.056837121236185], [97.8516220664053, 26.04466712478802], [97.82915438106988, 26.04092250966613], [97.82468217394324, 26.039955546911017], [97.82634591972845, 26.05215635323316], [97.83102668773154, 26.06526250256252], [97.83383514907291, 26.076496345230225], [97.83009053485034, 26.0849217265565], [97.82072899884429, 26.0849217265565], [97.80855900329544, 26.098027876785125], [97.80492935480595, 26.104170357875773], [97.79638900684722, 26.118623254559623], [97.78702747174049, 26.139218633233384], [97.7832828566186, 26.148580168340175], [97.78421901129838, 26.1532609363432], [97.79077208596306, 26.15700554966645], [97.79919746818865, 26.1532609363432], [97.81043130995704, 26.15138862878223], [97.83289899529245, 26.146707860779202], [97.85349437306695, 26.15138862878223], [97.86940898373769, 26.1532609363432], [97.86847282995717, 26.139218633233384], [97.8647282157346, 26.109261718553512], [97.862855909073, 26.080240958553418]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
