
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Koke Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Koke Kar</div><div class="name-mm">အင်ကုက္ကား</div></div>
        <span class="pcode-badge">MMR005011011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36889635987916, 23.01190182041273], [95.36712660021249, 23.006713859956733], [95.36932367994393, 23.00311278023065], [95.37329087997017, 22.999694850137303], [95.37829595969083, 22.99731444000946], [95.3798828404208, 22.99487300998146], [95.37731927976102, 22.986877410164425], [95.36907960034335, 22.986083969799438], [95.35870368033062, 22.98529053033377], [95.3515015199792, 22.9851118800093], [95.3515015199792, 22.987487789929617], [95.35107419991448, 22.990905720023022], [95.35028076044881, 22.995727560178807], [95.35028076044881, 23.003295929863327], [95.35589604007026, 23.007080070189147], [95.35589604007026, 23.01330563964359], [95.35430916023961, 23.017883310266598], [95.35949711979629, 23.015686049771432], [95.36529528015313, 23.01593022020353], [95.36968980024415, 23.017517100034183], [95.37268068006938, 23.018676749732265], [95.3746948799648, 23.016113279904005], [95.37170400013957, 23.014099080008577], [95.36889635987916, 23.01190182041273]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
