
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Chaung</div><div class="name-mm">အလယ်ချောင်း</div></div>
        <span class="pcode-badge">MMR009014044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.94140124117439, 19.403510532385212], [94.94090360491748, 19.395299551233336], [94.93837404042966, 19.382398770187137], [94.93609743185107, 19.376580769886687], [94.94368612711315, 19.361909292979533], [94.94748047384485, 19.349767380560195], [94.949102236579, 19.34499749064173], [94.9323162763751, 19.347978175752246], [94.92690273897028, 19.35225202211319], [94.92669393078035, 19.352416869642866], [94.91604106544287, 19.366028865140038], [94.91026609140704, 19.370071347414807], [94.91041871984811, 19.37017164610461], [94.9045004613273, 19.37845720803375], [94.88704159779155, 19.393548767261848], [94.8825866900238, 19.400973615040357], [94.8808274263447, 19.403905719673276], [94.87964377464056, 19.408936240315313], [94.88001353000044, 19.410500587632043], [94.88525317629313, 19.413006506245324], [94.90422491264968, 19.42185998285197], [94.91493723936219, 19.42589651161478], [94.917060798617, 19.419829198558716], [94.93326035857876, 19.41137085258282], [94.93328912159575, 19.41135414138057], [94.93853602361867, 19.405186999980117], [94.94140124117439, 19.403510532385212]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
