
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ku Lan Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Sin Ku Lan Ward</div><div class="name-mm">ဆင်ကူးလမ်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012001701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.9034488799619, 20.15714071896906], [92.90192121958864, 20.157541333665677], [92.90055309714779, 20.153759269874456], [92.89857464710235, 20.153697462168168], [92.89850710082209, 20.15487366208987], [92.8975766361529, 20.15476008221208], [92.89742467950543, 20.155894531107776], [92.89731012206454, 20.156372305837294], [92.89684148354769, 20.157324320061377], [92.8966584139547, 20.15722502951155], [92.89582589265086, 20.158490615749372], [92.89957565279423, 20.159916230050044], [92.90338123835352, 20.160305146365488], [92.90323144277693, 20.158606898089943], [92.9034488799619, 20.15714071896906]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
