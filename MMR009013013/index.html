
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Hla</div><div class="name-mm">လယ်လှ</div></div>
        <span class="pcode-badge">MMR009013013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.88883619583385, 19.72332210093424], [94.88239646362598, 19.727145691820283], [94.87873601425571, 19.729319084308372], [94.87093504301788, 19.73185439996064], [94.87145403277742, 19.73215096579446], [94.86743116381723, 19.74287861605535], [94.86739965517, 19.742962639714108], [94.86659937905813, 19.745096710245036], [94.85565316566112, 19.75700876584193], [94.85407832235677, 19.75872256609358], [94.85284452625393, 19.760065226029383], [94.85446274386061, 19.76734720660835], [94.86214927996537, 19.77301096958064], [94.87145403277742, 19.777056514946253], [94.8706449244238, 19.797284240875058], [94.87509502441588, 19.805779885333493], [94.88925443094729, 19.808611766819638], [94.9038183939038, 19.815893748297924], [94.90854856976074, 19.822397739763915], [94.9094821568761, 19.817107411278073], [94.918382355961, 19.80213889459435], [94.9195960189412, 19.79566602326838], [94.91110037538209, 19.786765824183476], [94.90705483001648, 19.77827017882572], [94.90928480694834, 19.771898814878455], [94.90988671060325, 19.770179088993814], [94.92609987460958, 19.7640541159048], [94.92323700968029, 19.762492552889057], [94.91352770224171, 19.75440146305715], [94.9046275031568, 19.747524037104654], [94.8957273040719, 19.740646610252895], [94.89571688812396, 19.740614561113148], [94.89046809482676, 19.724464429689704], [94.88883619583385, 19.72332210093424]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
