
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Hpyu</div><div class="name-mm">ချောင်းဖြူ</div></div>
        <span class="pcode-badge">MMR009007046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83332753094084, 20.029056698407942], [94.82969823498564, 20.029004098860128], [94.82527990174611, 20.026268941258706], [94.8147600632264, 20.022481798995898], [94.80760657328477, 20.022271401703904], [94.78067578465982, 20.03005608262214], [94.76531682011523, 20.024375370127302], [94.74574991872385, 20.01764267297102], [94.72953528072867, 20.015413160089338], [94.72849738304785, 20.016380291917017], [94.7289181758332, 20.029424893444116], [94.72975976410191, 20.03510560593901], [94.73417809644206, 20.040365524749234], [94.73459057409576, 20.04044802135917], [94.73733404772815, 20.040996715725896], [94.74112118999096, 20.04162790580324], [94.74932666369466, 20.046887826412103], [94.76426483635316, 20.059722028848626], [94.76616447161314, 20.060343728380417], [94.78740848181604, 20.067296313374186], [94.79855951131248, 20.06708591698151], [94.80928974712418, 20.066875519689518], [94.80974380043608, 20.06662500813769], [94.81539125420306, 20.063509171111434], [94.8235967279067, 20.049622984013524], [94.82864625122357, 20.042259095880638], [94.8339061700338, 20.038892748201818], [94.83582436730075, 20.03769387457271], [94.83554253775799, 20.037393257293047], [94.83332753094084, 20.02979894756345], [94.83332753094084, 20.029056698407942]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
