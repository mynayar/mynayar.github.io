
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Pin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Pin Gyi</div><div class="name-mm">ဇီးပင်ကြီး</div></div>
        <span class="pcode-badge">MMR010008041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.34091948414692, 21.85846123779595], [96.34021678897369, 21.856915311292653], [96.33781256659671, 21.852347288596548], [96.3342062330313, 21.848981377988252], [96.330840322423, 21.845855889437814], [96.32759462239397, 21.84393251117649], [96.32518272160536, 21.842355498707377], [96.32215074456127, 21.843871486779733], [96.31922734086913, 21.843871486779733], [96.31289329788746, 21.846307657572368], [96.30461031881123, 21.851179998258374], [96.30091959376432, 21.854378626872176], [96.30509755261005, 21.862386381926058], [96.30704648870454, 21.868233191108914], [96.30850819100027, 21.8731055308956], [96.31289329788746, 21.878952340078456], [96.32263797925941, 21.8799268076761], [96.32751031994536, 21.877490637782785], [96.33286989532945, 21.87115659480105], [96.33725500131732, 21.868233191108914], [96.33981297988515, 21.861411914328414], [96.34091948414692, 21.85846123779595]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
