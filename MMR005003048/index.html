
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myit Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myit Son</div><div class="name-mm">မြစ်ဆုံ</div></div>
        <span class="pcode-badge">MMR005003048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30628196444115, 21.646398610007907], [95.30652339014239, 21.646768663942737], [95.30687692622922, 21.64731539778745], [95.30564919335563, 21.648193887038303], [95.30453951988301, 21.648987900271436], [95.30512235970917, 21.64929065973621], [95.30541288030025, 21.64945670965949], [95.30535348007908, 21.653619389922937], [95.30535348007908, 21.65636277002585], [95.30581068011884, 21.663907019893088], [95.30946864016568, 21.668250689617707], [95.31381239982244, 21.67053686968086], [95.31648899986749, 21.670677719701075], [95.3181557997504, 21.6707654701504], [95.32158516022702, 21.669622379669136], [95.323413960386, 21.665278709944573], [95.32592891988378, 21.659791949738747], [95.32821492008253, 21.65613416955631], [95.33027231981174, 21.65041880978032], [95.32912932016205, 21.64630373962592], [95.32798631961305, 21.644703450004272], [95.32158516022702, 21.645617940015995], [95.31701280010071, 21.647446830107185], [95.3084026800397, 21.646876230054033], [95.30837028016435, 21.646889999573887], [95.30833031968854, 21.646880550397157], [95.3075746796278, 21.646702800294065], [95.30628196444115, 21.646398610007907]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
