
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Se</div><div class="name-mm">ကျောက်ဆည်</div></div>
        <span class="pcode-badge">MMR010024002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17818691439464, 20.630749897589737], [96.18208587026675, 20.62511807403996], [96.18672071618818, 20.614680191637603], [96.18952186424269, 20.601608169781287], [96.18952186424269, 20.590403579361748], [96.18889938679735, 20.585423760698063], [96.18111842097841, 20.58137765775274], [96.17558761107944, 20.578763826789213], [96.16952256881154, 20.578763826789213], [96.16302430962423, 20.578763826789213], [96.15349353110162, 20.58136313100374], [96.15070888560666, 20.583948871643145], [96.14995552802526, 20.589222374712847], [96.14806803810956, 20.598423891649304], [96.14693849411628, 20.60552388362038], [96.15435996494051, 20.6082226006925], [96.16259109270482, 20.611688338745864], [96.15955857157087, 20.616020510638123], [96.1583001790101, 20.616649707817828], [96.16345752744297, 20.619486248691487], [96.17212187302607, 20.62511807403996], [96.17818691439464, 20.630749897589737]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
