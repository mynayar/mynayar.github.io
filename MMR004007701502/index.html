
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khoboi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Chin</div><div class="name-mm">ချင်းပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Matupi</div><div class="name-mm">မတူပီ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Khoboi Ward</div><div class="name-mm">ခွါဘွေးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR004007701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.43522517160443, 21.609239543969807], [93.43701160020527, 21.60924986009303], [93.43774377065853, 21.609392965612926], [93.4383021929919, 21.609537644047066], [93.43836118492078, 21.60955172383302], [93.43885020567251, 21.609690435265406], [93.43891044586047, 21.60970408517545], [93.43947885066848, 21.609758960008037], [93.44001668931884, 21.60996453333661], [93.44067757231215, 21.6105229592672], [93.44074339908866, 21.610565544864073], [93.44240558455016, 21.610990090520318], [93.44413923104077, 21.61117406123401], [93.44435311050768, 21.610362801701967], [93.44588378001248, 21.604170356976454], [93.44601936090481, 21.603039356980787], [93.43678974914764, 21.602567386475755], [93.43522517160443, 21.609239543969807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
