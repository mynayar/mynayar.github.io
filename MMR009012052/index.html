
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Paw Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Paw Kyun</div><div class="name-mm">ရေပေါ်ကျွန်း</div></div>
        <span class="pcode-badge">MMR009012052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18629221191611, 19.276832111712622], [95.18607699605656, 19.282786430349518], [95.18727618894502, 19.299308642779692], [95.1878091631624, 19.30823596901479], [95.18889732305308, 19.316127966032866], [95.18814575332391, 19.31625925805838], [95.18754267605374, 19.318229242785378], [95.18740943160003, 19.324624938789952], [95.19047403694731, 19.332219826783614], [95.1943381027213, 19.342746075670902], [95.19499358798373, 19.347062620943234], [95.19866831139353, 19.34657265770204], [95.20056319463578, 19.34635733122593], [95.20763352786508, 19.34527069838407], [95.2073354718546, 19.338486929628175], [95.20684177013163, 19.32725028287433], [95.20734632487307, 19.31531382507302], [95.20744889974696, 19.312887169107626], [95.20749912688325, 19.311698929062402], [95.20772107416832, 19.30644822740385], [95.20707705975855, 19.30457453758487], [95.20449853078264, 19.29707259272601], [95.19424463078514, 19.28652489500797], [95.19088168524166, 19.28242597667753], [95.18629221191611, 19.276832111712622]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
