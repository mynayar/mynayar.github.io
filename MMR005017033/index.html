
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Lar Poet Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Lar Poet Taung</div><div class="name-mm">နတ်လာပို့တောင်</div></div>
        <span class="pcode-badge">MMR005017033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03213425339317, 22.290345155104887], [95.03242239527737, 22.288256122621988], [95.03557710909638, 22.267487591179417], [95.03846738626095, 22.258046022705855], [95.03952050316872, 22.254605844284356], [95.03268528869518, 22.25565741525753], [95.0245356098306, 22.256183199395196], [95.02089439875755, 22.25758366595346], [95.01507147017224, 22.257497663786182], [95.01244254139021, 22.253554273311124], [95.00928782757126, 22.246456165419772], [95.00455575594344, 22.24277566836247], [94.99944168198812, 22.24168039123714], [94.9978141204254, 22.24352502036345], [94.99221215976343, 22.246325910312578], [94.98461004032117, 22.2543283503731], [94.98621024001062, 22.261530509825207], [94.98861108003734, 22.269533039817986], [94.9882111200472, 22.27553486963859], [94.99141188005427, 22.28513778008454], [94.99141188005427, 22.28958090043824], [95.00937120012082, 22.288832550281995], [95.03156160018779, 22.290219449667916], [95.03213425339317, 22.290345155104887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
