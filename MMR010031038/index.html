
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha But Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha But Kone</div><div class="name-mm">သဘွတ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010031038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07301087105492, 21.053738074652472], [96.07422310231436, 21.0496973046869], [96.07826387227993, 21.048485074326777], [96.0831127964185, 21.052525844292347], [96.08796171875838, 21.051313613032846], [96.08917395001782, 21.047272843966653], [96.09200248872395, 21.04242391982808], [96.09200248872395, 21.03797907277601], [96.10048810484221, 21.032726073349636], [96.10250849027466, 21.029089379571246], [96.10089218192871, 21.025048609605676], [96.09725548994896, 21.021815993813107], [96.09159841163745, 21.017775224746856], [96.08909274843165, 21.015213492408805], [96.08383758883372, 21.015213492408805], [96.08274529296096, 21.011936611085787], [96.05437538671481, 21.009835137381742], [96.04658054795397, 21.009257742051204], [96.0434227098902, 21.009023828387], [96.04414954376648, 21.01466941336281], [96.04997647433487, 21.041792644315137], [96.04173431098974, 21.042505375023097], [96.04696234613544, 21.04530826236646], [96.0483621759737, 21.04606061270715], [96.05401925428521, 21.048889151413277], [96.05967633079808, 21.0492932276004], [96.06694971655622, 21.050101381773402], [96.07301087105492, 21.053738074652472]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
