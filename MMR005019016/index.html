
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Gyin Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Gyin Su</div><div class="name-mm">အင်ကြင်းစု</div></div>
        <span class="pcode-badge">MMR005019016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78876644011916, 21.901780530347253], [94.78483128023947, 21.901780530347253], [94.77903888004033, 21.904387289941553], [94.77295631987835, 21.903228720329253], [94.76938547985606, 21.900133979599502], [94.76919107970463, 21.900911670137532], [94.76224019982544, 21.903228720329253], [94.7618478004357, 21.90329793035528], [94.76281943966546, 21.907573200342995], [94.76484659969088, 21.913076249969038], [94.77150839969295, 21.91510367979106], [94.77350063994265, 21.92221925971114], [94.77759060012613, 21.924371879658565], [94.78106604006575, 21.925240739868286], [94.7865689997596, 21.924951120397964], [94.78859652041314, 21.91713110961308], [94.78888631974792, 21.910759199777317], [94.78946555958794, 21.904387289941553], [94.78946555958794, 21.901780530347253], [94.78876644011916, 21.901780530347253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
