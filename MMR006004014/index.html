
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Le Shaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yebyu</div><div class="name-mm">ရေဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Le Shaung</div><div class="name-mm">လဲရှောင်</div></div>
        <span class="pcode-badge">MMR006004014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.11948554971838, 14.27265566742517], [98.10276948032731, 14.261646509578782], [98.0889069597884, 14.255530246423803], [98.08646040002748, 14.26817011525867], [98.07952895989365, 14.276324835722619], [98.0765380144179, 14.278736953247858], [98.06688958568589, 14.286518105226435], [98.05751171979011, 14.296303800180283], [98.05424976001848, 14.310166950244593], [98.04609503955447, 14.343193800553479], [98.04160961958831, 14.370920055716056], [98.03753207994157, 14.394976650651984], [98.03508552018064, 14.406801120375462], [98.04609396036801, 14.40843223515958], [98.05751027997547, 14.40924786000079], [98.06362596036985, 14.407209269592158], [98.06851872016284, 14.407617059979373], [98.07789636212749, 14.407617173293943], [98.08034292008978, 14.378259914863236], [98.08197443866948, 14.340747839741084], [98.09787564044854, 14.335447410069946], [98.11214579399325, 14.33259350238825], [98.11173816008807, 14.32566193455068], [98.11173833995247, 14.313837464827202], [98.11296162028259, 14.300789804705744], [98.11540818004352, 14.28855763542657], [98.11948554971838, 14.27265566742517]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
