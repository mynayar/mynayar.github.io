
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lan</div><div class="name-mm">အလန်း</div></div>
        <span class="pcode-badge">MMR017017062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22641735987332, 16.650309060215022], [95.2279401603102, 16.65056349011303], [95.23034747995229, 16.65019151972291], [95.23284911959126, 16.6487331602072], [95.23326311979719, 16.648554599814986], [95.23202688023639, 16.647423750006112], [95.22951443973966, 16.646457780102537], [95.22662399979782, 16.644644819702705], [95.2266779995901, 16.642942019958298], [95.22754524012078, 16.641585180411823], [95.22795635979821, 16.638956550204682], [95.22741996006317, 16.637118210037386], [95.22594215990284, 16.63656669000079], [95.22497952018875, 16.63600967960309], [95.22384552005474, 16.63578189032205], [95.22367956006372, 16.637346449878805], [95.22313667981399, 16.638709680007764], [95.22201563980997, 16.64055692975853], [95.22056808025275, 16.643380229913703], [95.21822088028944, 16.64795853006217], [95.22194291973, 16.649042939779918], [95.22641735987332, 16.650309060215022]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
