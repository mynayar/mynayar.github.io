
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Byawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tsawlaw</div><div class="name-mm">ဆော့လော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Byawt</div><div class="name-mm">မန်ဗျော့</div></div>
        <span class="pcode-badge">MMR001006011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.262155607995, 26.039500311889924], [98.25102268364998, 26.037742128296657], [98.2460300532444, 26.03628574818879], [98.24399139178934, 26.03569105889528], [98.24369828744608, 26.04008582719922], [98.24252615515798, 26.047996393418885], [98.24146360705987, 26.051396330776072], [98.24106114785377, 26.052684116778607], [98.23285791076404, 26.052390929697708], [98.22494762873015, 26.052683720177583], [98.22098610162737, 26.054268277958727], [98.21908809683828, 26.05502745505305], [98.21656466842478, 26.059513431699543], [98.21645119826422, 26.059715149634485], [98.2235758415519, 26.06423758479673], [98.24059193377076, 26.065342526036773], [98.24416174406929, 26.064492571375126], [98.25915494444519, 26.060922761975917], [98.27307720065232, 26.05871287859651], [98.26733150674369, 26.048768410134073], [98.262155607995, 26.039500311889924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
