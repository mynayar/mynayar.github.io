
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee</div><div class="name-mm">ကြီး</div></div>
        <span class="pcode-badge">MMR009018010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15775684480258, 21.365070540872807], [95.1572169512014, 21.365216457673455], [95.14994086208117, 21.36445055365016], [95.13921820575564, 21.36291874560368], [95.13867457457201, 21.36221979161013], [95.12964440456568, 21.365982362596014], [95.12619783736034, 21.372109594782046], [95.1150922281239, 21.374790258863413], [95.10015709877115, 21.381300443960356], [95.09808915808821, 21.382908841869607], [95.10130595480604, 21.381300443960356], [95.10283776285252, 21.392023100285883], [95.10283776285252, 21.398150333371234], [95.0940298656858, 21.406192324716073], [95.09556167463165, 21.41002184573165], [95.10551842693394, 21.405809372704425], [95.12619783736034, 21.398533285382882], [95.14994086208117, 21.389342436204515], [95.16187990723199, 21.387443042862174], [95.16219532735255, 21.38512996407661], [95.15874875924789, 21.37861977897967], [95.157599903213, 21.366365314607606], [95.15775684480258, 21.365070540872807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
