
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Chan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Chan Thar</div><div class="name-mm">အောင်ချမ်းသာ</div></div>
        <span class="pcode-badge">MMR005007057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51555041931647, 22.853371611710543], [95.50973701095432, 22.849433544322665], [95.50961388027639, 22.849445429762795], [95.50945943970146, 22.853001959772655], [95.50719864030509, 22.86028665000896], [95.50405872033372, 22.868450549853037], [95.50066751989021, 22.876739999551376], [95.4991432796387, 22.88055024000164], [95.49979019975797, 22.88055024000164], [95.50638108012282, 22.88055024000164], [95.51817540007471, 22.880897100420896], [95.5187078400948, 22.880119319950722], [95.52268511972255, 22.87430613012384], [95.53066379969465, 22.86424620040185], [95.53517315961369, 22.85869590039556], [95.53644000040578, 22.85709119959921], [95.54037660010005, 22.852104930098506], [95.5405612749829, 22.850627877274746], [95.54044043487824, 22.850571485285855], [95.53536047130876, 22.849862827607467], [95.53529150409969, 22.849892144606827], [95.53523923909967, 22.849914509846826], [95.53079555307238, 22.851815986019005], [95.52675092501522, 22.853371611710543], [95.52457305120538, 22.851815986019005], [95.5205284240476, 22.85150486195988], [95.51897279655736, 22.853993863426126], [95.51866166980028, 22.85834961734099], [95.51648379329248, 22.85803848968459], [95.51555041931647, 22.853371611710543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
