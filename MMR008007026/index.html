
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Thone Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Thone Gwa</div><div class="name-mm">ချောင်းသုံးခွ</div></div>
        <span class="pcode-badge">MMR008007026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78054319561204, 17.752814253574968], [95.78526593767293, 17.754531615141957], [95.78472294231, 17.756578598023907], [95.78378045100709, 17.756574908105563], [95.78391715515266, 17.757655317638864], [95.78378532173525, 17.757753128803927], [95.78316103125667, 17.761030643249626], [95.78550211403137, 17.76664923687281], [95.79018427598362, 17.767585669443122], [95.79471036868864, 17.767429596598674], [95.79416537683073, 17.767003830562373], [95.79343140143811, 17.76205427498485], [95.79416742098977, 17.758864856328103], [95.79858354009838, 17.756902136324584], [95.80471703876037, 17.758619515878024], [95.80937849831912, 17.757147475875342], [95.8115865578734, 17.751504657214184], [95.8110958778725, 17.74610717720452], [95.80986917831996, 17.74438979675176], [95.80569839876216, 17.74169105809591], [95.80079159965265, 17.738501637640525], [95.79465810009128, 17.735557559433857], [95.7875432414275, 17.73604823943475], [95.78116440231537, 17.739237658091497], [95.77768045658786, 17.749326046859608], [95.77738636478898, 17.75166631574791], [95.78054319561204, 17.752814253574968]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
