
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yan Aung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Yan Aung Ward</div><div class="name-mm">ရန်အောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19945293010869, 16.83275646623798], [96.19858572195358, 16.831462224002507], [96.19816017175458, 16.83085060137421], [96.19734191909436, 16.82969284025245], [96.19702746034909, 16.8292718253345], [96.1967118585655, 16.828977902608187], [96.19631433483875, 16.828292846737554], [96.19600368202435, 16.82838445437909], [96.19591331544723, 16.82841110219067], [96.19588122763662, 16.828419881372497], [96.1955848596536, 16.828500962449482], [96.19545522238064, 16.828522152275582], [96.19586953105409, 16.82910927107605], [96.19616220462211, 16.829573264594558], [96.19649770930192, 16.830065814285945], [96.19674041383911, 16.83042273272298], [96.1969045967698, 16.830729683028494], [96.1969474269822, 16.830901004777616], [96.19696289442209, 16.831124674264345], [96.19697479065411, 16.831350723357275], [96.19697479065411, 16.83164220712223], [96.19698073966947, 16.83191584474048], [96.19701643196282, 16.832243020798842], [96.19704022622551, 16.832504761285747], [96.19707579081518, 16.832877228101665], [96.1972866053926, 16.83288001959727], [96.19803810137734, 16.832872390648333], [96.19842815443582, 16.832835197386487], [96.19882774390533, 16.83276271832483], [96.19945293010869, 16.83275646623798]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
