
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Kaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Kaw</div><div class="name-mm">စီကော်</div></div>
        <span class="pcode-badge">MMR001012012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.34540389037733, 24.36831032725985], [97.34230609465061, 24.36544801541362], [97.34054088015756, 24.365608456265306], [97.33591611383764, 24.366028802087612], [97.33600645523376, 24.366422204221408], [97.33747877312692, 24.36943069816823], [97.33922922794659, 24.37643559312818], [97.34860481406099, 24.386371618755277], [97.36129680400438, 24.395679077627392], [97.36383520163332, 24.402025072599088], [97.36002760518988, 24.410909465199722], [97.35261558534103, 24.416125330719467], [97.36360665062648, 24.421463849377176], [97.37677194387015, 24.424096906946772], [97.38467112107543, 24.415069278424482], [97.38880878399823, 24.40453704275035], [97.38354266706051, 24.400399378928228], [97.38316651572217, 24.396261715106107], [97.38730417864497, 24.387986388361185], [97.38831873712007, 24.382977765311693], [97.38827714797208, 24.383015865989478], [97.38136842741108, 24.39461722200724], [97.37425767415237, 24.389579977134304], [97.36886846880486, 24.38576226961311], [97.3611803346048, 24.384526510290243], [97.35947707890415, 24.38260152404115], [97.35879548992, 24.381831207943947], [97.35851746720738, 24.381516992015634], [97.35720769008287, 24.380036707028466], [97.3548568937307, 24.377379885773166], [97.35340838808668, 24.37574281567845], [97.35323154989618, 24.375542956642164], [97.34540389037733, 24.36831032725985]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
