
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wea Gyi Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wea Gyi Wa</div><div class="name-mm">ဝဲကြီးဝ</div></div>
        <span class="pcode-badge">MMR017015084</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14579831224239, 16.753132745979485], [95.146435800272, 16.749809549571125], [95.14746539990836, 16.74096318030655], [95.14857420013931, 16.72907426966185], [95.1464282396716, 16.72901072986133], [95.14375955995581, 16.72826769020179], [95.14230227962656, 16.727558400299984], [95.14082448036555, 16.727072670167672], [95.13914472035265, 16.726732919788446], [95.13683820032276, 16.727010029689154], [95.12529515994373, 16.727972670302563], [95.12604468011796, 16.729396469771302], [95.12683163996826, 16.73100747031856], [95.12694395989587, 16.732693530082372], [95.12642267956306, 16.734622949989216], [95.1252616799826, 16.73692136982538], [95.12406288009788, 16.73841158962324], [95.12297819968421, 16.739317439848037], [95.12791992036807, 16.741133369809233], [95.12900927995435, 16.741836809621134], [95.1287515198668, 16.74314577016122], [95.1324303603729, 16.755647219843354], [95.1335359203465, 16.755589979793797], [95.13464148032011, 16.755532829676383], [95.137787520178, 16.75474668011526], [95.14273283994868, 16.75301904019659], [95.14579831224239, 16.753132745979485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
