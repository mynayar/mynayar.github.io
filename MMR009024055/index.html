
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Thet Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Thet Ywar Ma</div><div class="name-mm">ဝက်သက်ရွာမ</div></div>
        <span class="pcode-badge">MMR009024055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.08175873437813, 21.79240771524394], [94.08280805614692, 21.7890498841449], [94.0849946290989, 21.779574734086736], [94.08475167634884, 21.774472729932597], [94.08490109241154, 21.77392487193532], [94.08450872359879, 21.773986825331747], [94.08135034144516, 21.769613677629195], [94.07883220644123, 21.76147816668407], [94.07527652629074, 21.761110337671994], [94.04466450316437, 21.76013852757103], [94.03154506365382, 21.7569801454174], [94.01939743514356, 21.75503652431621], [94.00773571213347, 21.75333585596502], [94.00664800100452, 21.753297008849927], [94.00165991127596, 21.752911348979637], [94.00021332838247, 21.76375954796481], [93.9989297143349, 21.773963058948084], [94.0036776536009, 21.77471763241283], [94.01259476443687, 21.77495863543271], [94.02279877094657, 21.783219021740535], [94.02935849070184, 21.787592167644448], [94.04417859676488, 21.79342303004887], [94.05754098902548, 21.79852503420301], [94.0643436606315, 21.791236457096886], [94.07284700058864, 21.791479408947623], [94.08175873437813, 21.79240771524394]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
