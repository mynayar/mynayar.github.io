
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Pat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Pat</div><div class="name-mm">သစ်ပါတ်</div></div>
        <span class="pcode-badge">MMR007012033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.51740386699493, 18.422681098254145], [96.5141245242275, 18.41686222920856], [96.51217452783226, 18.411662237622238], [96.51217452783226, 18.408845576262365], [96.50684453744549, 18.409820575359333], [96.50164454585916, 18.41025390739196], [96.49817788510137, 18.410470572958616], [96.4947112252429, 18.41198723732117], [96.48972790012255, 18.412853903185123], [96.48431124296957, 18.412420570253175], [96.48222887356371, 18.412564182091387], [96.48214458010835, 18.41458723311439], [96.48041124927977, 18.419137225302734], [96.47694458942135, 18.423687216591816], [96.47434459272881, 18.424987215387716], [96.4760779235574, 18.42845387614551], [96.47802791995258, 18.429753873142772], [96.48062893827495, 18.430794279932115], [96.48517790793414, 18.430187206074777], [96.4901612330545, 18.42780387674759], [96.49362789291297, 18.426937211782956], [96.49709455367076, 18.429537206676798], [96.49882788360003, 18.431053871039353], [96.50214345375747, 18.433784339575652], [96.50662787097951, 18.429320541110144], [96.51117786316792, 18.42542054831972], [96.51507785595834, 18.424337215989794], [96.51740386699493, 18.422681098254145]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
