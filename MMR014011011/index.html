
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hta Mo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Loilen</div><div class="name-mm">လွိုင်လင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hta Mo</div><div class="name-mm">နမ့်ထမို</div></div>
        <span class="pcode-badge">MMR014011011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.47858415403556, 20.829236277032635], [97.4800152191271, 20.834150963196464], [97.48139552468376, 20.839475001869914], [97.48356457884228, 20.844601855191513], [97.48691675230634, 20.848545588308298], [97.48908580466622, 20.85406681503156], [97.49184641757819, 20.859193668353157], [97.4951985910422, 20.862545840917846], [97.49835357825509, 20.866292386884197], [97.50111419116706, 20.871222053055362], [97.50765308801965, 20.876166097587372], [97.51531773732376, 20.870304895654442], [97.52295318204375, 20.864466025686568], [97.52518353399296, 20.86428395613973], [97.52015062924818, 20.85981026333303], [97.52342568314884, 20.844625912056244], [97.52208589025167, 20.841946322664683], [97.52074609375728, 20.83926672787726], [97.52072195685287, 20.839017061688082], [97.52034607441186, 20.835129090135467], [97.5196972828034, 20.834188636696297], [97.51994865320785, 20.831018307948625], [97.52221270815, 20.827566700043235], [97.51925084405127, 20.827566700043235], [97.50529739485893, 20.827566700043235], [97.47858415403556, 20.829236277032635]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
