
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Le U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Le U</div><div class="name-mm">သလဲဦး</div></div>
        <span class="pcode-badge">MMR005007079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6994123599925, 22.974415109769552], [95.69613203966196, 22.965886079778784], [95.68988783985196, 22.96519226990739], [95.68294992010277, 22.961029499711685], [95.67393083963663, 22.956519869996043], [95.67355247956334, 22.95462825039351], [95.66842319987086, 22.95445139961248], [95.65732259985816, 22.95445139961248], [95.64865019994681, 22.953410730221094], [95.63616216005568, 22.952370059930388], [95.62610232026594, 22.951676250058938], [95.62115124033755, 22.952818800047623], [95.61708288007094, 22.95375758974103], [95.62159259971878, 22.96381752036234], [95.62553028039821, 22.96775520014245], [95.62575527998223, 22.966939530335083], [95.63893740044074, 22.969020959949376], [95.65315991959466, 22.971449160050724], [95.67050472031667, 22.97318364021288], [95.68299276020775, 22.975264979894973], [95.6937466796656, 22.975264979894973], [95.6994123599925, 22.974415109769552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
