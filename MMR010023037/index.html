
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Aing</div><div class="name-mm">ပေါက်အိုင်</div></div>
        <span class="pcode-badge">MMR010023037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05319047955703, 20.47448173744226], [96.05460247632328, 20.473226630104932], [96.06419603381994, 20.466249497216552], [96.06794581914431, 20.463522381352846], [96.07173047568097, 20.46078901699957], [96.06996753827133, 20.453413788415673], [96.06632844420238, 20.447752975219657], [96.0602632877206, 20.443709537864947], [96.0598589453341, 20.438453069753393], [96.06996753827133, 20.43198356998579], [96.07967178702341, 20.431579225800704], [96.08614128679102, 20.430366195043916], [96.08330026009901, 20.422335634082287], [96.08109276891622, 20.41944891463578], [96.07158491321326, 20.41944891463578], [96.06390238178955, 20.417427196408028], [96.05662419455098, 20.41500113399519], [96.05015469478337, 20.41500113399519], [96.04125913260293, 20.41338375905326], [96.0411243521072, 20.413114196263223], [96.03883307108941, 20.415405477281013], [96.03398094626374, 20.427131445160114], [96.02670275902517, 20.438857413039216], [96.02751144739545, 20.44734863193389], [96.03290848583799, 20.455978945372067], [96.03857154194316, 20.464140408053424], [96.04873173078482, 20.47146906884251], [96.05319047955703, 20.47448173744226]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
