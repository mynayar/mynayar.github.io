
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hkan Dauk Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hkan Dauk Yang</div><div class="name-mm">ခန်ဒေါက်ယန်</div></div>
        <span class="pcode-badge">MMR001003022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.0213227092757, 25.934768130744715], [98.01938182031483, 25.93228354764767], [98.01769560946485, 25.92834858382014], [98.01674524459742, 25.926130798997235], [98.01678890938075, 25.925990459791933], [97.97144971972887, 25.930456392348674], [97.9668821143182, 25.931197084777693], [97.93681203884455, 25.936073313232896], [97.92089742907314, 25.946371002120088], [97.91134866231096, 25.963221765672017], [97.9049828184024, 25.974455609239044], [97.8656643686158, 26.030624820778883], [97.8516220664053, 26.04466712478802], [97.86191975529255, 26.056837121236185], [97.88438743972864, 26.050284045672242], [97.90784465900384, 26.036203375685318], [97.93774819172575, 26.01471021100747], [97.97425818107024, 26.002540214559303], [98.00327894107033, 25.963221765672017], [98.0213227092757, 25.934768130744715]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
