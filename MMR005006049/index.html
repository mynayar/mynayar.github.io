
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shein Ma Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shein Ma Kar</div><div class="name-mm">ရှိန်းမကား</div></div>
        <span class="pcode-badge">MMR005006049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.97239351994506, 22.308484950220304], [95.97245471970962, 22.30793387984471], [95.9821369197831, 22.310459640200293], [95.98887216022206, 22.310038709818627], [95.99434451958399, 22.30919676002253], [96.00184944029951, 22.308779790255187], [96.00899416634775, 22.30668867224449], [96.0085869812043, 22.30302310123517], [96.00975900827166, 22.296382112444576], [95.99516850182493, 22.295056947919875], [95.98578723918979, 22.298147371004404], [95.9828941336574, 22.29332552815066], [95.97903665901464, 22.2856105833618], [95.98434068507464, 22.277413449970766], [95.98581854908684, 22.26257598609294], [95.98424147996042, 22.262891399918203], [95.97708539997132, 22.267100969933892], [95.97161303971006, 22.275520109965157], [95.96108879990823, 22.281834509954706], [95.96114495987206, 22.28225544033637], [95.96193083963658, 22.28814882001211], [95.96908728025386, 22.29783093015334], [95.97239351994506, 22.308484950220304]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
