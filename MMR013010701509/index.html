
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yankin</div><div class="name-mm">ရန်ကင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward</div><div class="name-mm">အမှတ် (၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013010701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16911833614233, 16.843491418094516], [96.16879081744236, 16.843310356687653], [96.16844368003188, 16.843032836696125], [96.16817951227472, 16.842841148899936], [96.16762351990957, 16.842544767427114], [96.16742591817166, 16.842963027721623], [96.16730117770726, 16.843471526889516], [96.16726112370196, 16.843738556289395], [96.1671766144093, 16.844141007401618], [96.16695976268295, 16.84460258444176], [96.1667982741211, 16.84494336544401], [96.16663694024265, 16.845227749061394], [96.16661071781044, 16.845273972415953], [96.16642951970664, 16.845638275186275], [96.16610527004224, 16.8462276458892], [96.16586113018707, 16.846672535109462], [96.16560466512328, 16.847233551986903], [96.1661033625802, 16.84747314486981], [96.16651802019055, 16.847668075621243], [96.16684084442949, 16.84773683418757], [96.16765022257977, 16.84627342228066], [96.16790072244044, 16.845810572699804], [96.16862106321156, 16.844423294699368], [96.16877174372104, 16.844144821426426], [96.16911833614233, 16.843491418094516]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
