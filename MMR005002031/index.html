
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Be Kyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Be Kyu</div><div class="name-mm">နဘဲကြူး</div></div>
        <span class="pcode-badge">MMR005002031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66048916044645, 22.016779559928807], [95.6601543599358, 22.015440900177452], [95.65962083982993, 22.013520030125335], [95.65887383955612, 22.010958900333037], [95.65965791977726, 22.00957515037294], [95.65655076030941, 22.005431999786992], [95.65126487987038, 22.003206389962997], [95.63763311997258, 22.004597429827584], [95.63664636044126, 22.004751599706594], [95.6287306797771, 22.00598837975997], [95.62539239993936, 22.003206389962997], [95.61954995966295, 21.997920690287685], [95.61823092042067, 21.996271709571772], [95.616127800058, 21.996271709571772], [95.61205908006258, 21.998149559654507], [95.60892923969271, 22.00206176973495], [95.6059560000694, 22.008164759795875], [95.60219760013922, 22.010784299655768], [95.60365164021107, 22.014056160063774], [95.60557331965305, 22.017447540371734], [95.60768580015963, 22.017255480256267], [95.61582288042166, 22.017255480256267], [95.62375152031649, 22.018924710107342], [95.62569552003231, 22.020161670025118], [95.62706135999383, 22.019341949671286], [95.63679863994531, 22.0179509997389], [95.6451445203034, 22.016003579901337], [95.65376867968087, 22.016281769887826], [95.66048916044645, 22.016779559928807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
