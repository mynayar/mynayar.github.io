
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Htat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalaw</div><div class="name-mm">ကလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Htat</div><div class="name-mm">ကျောက်ထပ်</div></div>
        <span class="pcode-badge">MMR014005022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.82855504517926, 20.85646772790335], [96.83871145686828, 20.857639868285332], [96.84418033315592, 20.856468024679657], [96.84457109128289, 20.850608297634892], [96.8469150689753, 20.84201406499716], [96.8512122671325, 20.830685326766456], [96.85081747194886, 20.829834915249194], [96.84613428297087, 20.819747058879727], [96.84483748935872, 20.817261304865383], [96.83109765613199, 20.815839941660045], [96.8304289922043, 20.81566481577869], [96.81057803005211, 20.810465754990673], [96.77393584036679, 20.809000066899614], [96.75292765129012, 20.80851150480214], [96.75225863302956, 20.808316374401215], [96.75355425842235, 20.828730232114594], [96.74878297185671, 20.843873408830802], [96.74456910757829, 20.857247433822067], [96.74349770205737, 20.860675824829514], [96.76269890223261, 20.866161882664812], [96.79689827873261, 20.87495600761372], [96.81253228024059, 20.878375945893254], [96.81263315809383, 20.878398363293854], [96.81214805568828, 20.876781161921144], [96.81722655965808, 20.863499194232475], [96.82855504517926, 20.85646772790335]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
