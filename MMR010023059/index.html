
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Gyin Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Gyin Kan</div><div class="name-mm">အင်ကြင်းကန်</div></div>
        <span class="pcode-badge">MMR010023059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09122844044026, 20.49253890374746], [96.09672065503429, 20.485890432597444], [96.10185169200207, 20.481548787246766], [96.103430471639, 20.47760183725501], [96.10658803271161, 20.473260191005068], [96.10895620306638, 20.4669450688599], [96.10934439632689, 20.46296252010427], [96.1039324111519, 20.46109631804069], [96.09965266523835, 20.46309353333993], [96.09786725467012, 20.46392672373935], [96.08978037996064, 20.468374505279257], [96.08007613120856, 20.467565817808293], [96.0719892555997, 20.463118037167703], [96.07173047568097, 20.46078901699957], [96.06794581914431, 20.463522381352846], [96.06419603381994, 20.466249497216552], [96.06658963880085, 20.469078302122], [96.0696022579379, 20.473220653210603], [96.0696022579379, 20.479245890585446], [96.06623075264719, 20.484203987024443], [96.06681954328735, 20.484346108685997], [96.07603269385379, 20.486569972925963], [96.08937603667482, 20.49182644103746], [96.09122844044026, 20.49253890374746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
