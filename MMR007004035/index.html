
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Byar Hta Min Saing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Byar Hta Min Saing</div><div class="name-mm">အဗျားထမင်းဆိုင်</div></div>
        <span class="pcode-badge">MMR007004035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71935091591212, 17.524225183845203], [96.71798607689601, 17.52081308765395], [96.71690238483723, 17.516839548306564], [96.716541154151, 17.51304662430232], [96.71578175222612, 17.510293789626758], [96.71413941929882, 17.508521799641414], [96.70877308101296, 17.503097759054413], [96.70609131256407, 17.501792474043498], [96.70225269220805, 17.499924119002912], [96.6970017594237, 17.498770066685267], [96.69055804501784, 17.49695265194339], [96.69055804501784, 17.502141882242142], [96.6917415222535, 17.51279316657144], [96.69190558827233, 17.514269767935502], [96.69010886423274, 17.52190584397954], [96.69226882714474, 17.53013379174115], [96.69639739792166, 17.532237005633363], [96.70133838835602, 17.532686187317722], [96.70672855957542, 17.531787824848266], [96.71481381730388, 17.525050111273686], [96.71935091591212, 17.524225183845203]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
