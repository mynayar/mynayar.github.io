
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Kan</div><div class="name-mm">မကျီးကန်</div></div>
        <span class="pcode-badge">MMR009003003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75308253203326, 20.84458262498822], [94.75468227037055, 20.843249511355907], [94.75629439776833, 20.841234350984564], [94.75609288218084, 20.83518886987048], [94.75830955903899, 20.8283373246079], [94.77886419302814, 20.82471003593946], [94.7846990439258, 20.83003750912377], [94.78505591020217, 20.82771787877715], [94.78995659212308, 20.826247674290812], [94.7903506066952, 20.82637901218169], [94.7903506066952, 20.822694875568118], [94.78878912102118, 20.814887446298656], [94.78528121915298, 20.814629511742623], [94.77970804219245, 20.81574414677499], [94.77320600135596, 20.819273826625874], [94.76949054944936, 20.818716508659975], [94.76261696360206, 20.81388642172101], [94.76243119064696, 20.813915002175634], [94.7441832970216, 20.816722369941488], [94.74458213375851, 20.818431670884934], [94.74732066201898, 20.83016821928794], [94.7487908674047, 20.83751924171969], [94.74928385236797, 20.838381965855092], [94.75271141240182, 20.844380195689553], [94.75308253203326, 20.84458262498822]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
