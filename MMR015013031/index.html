
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsi Hson</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsi Hson</div><div class="name-mm">ဆီဆုံ</div></div>
        <span class="pcode-badge">MMR015013031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.48022938208038, 22.344029296115195], [96.48802352836321, 22.348516834884094], [96.5016927189439, 22.359431786048162], [96.50171769041913, 22.35940489362099], [96.5171141108276, 22.343416302920104], [96.53665572238373, 22.328019881612306], [96.55382865366948, 22.31084694942723], [96.55560516364744, 22.31084694942723], [96.56863290468488, 22.29722703899671], [96.59172753709623, 22.283014957374462], [96.59202084288762, 22.282721651583017], [96.59220944510986, 22.282085120431987], [96.59071004413329, 22.281485359861506], [96.588927291961, 22.269006094655595], [96.58143973355692, 22.255813730918987], [96.56437120276883, 22.232126789719644], [96.55362880182781, 22.238699311324183], [96.5354447321887, 22.24404756694173], [96.52675991533789, 22.242711442379232], [96.52332201759708, 22.24975237407284], [96.49943314082685, 22.2932515229395], [96.49693728832523, 22.31286179503587], [96.48196217241639, 22.34031617615068], [96.48022938208038, 22.344029296115195]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
