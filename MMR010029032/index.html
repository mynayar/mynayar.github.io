
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Chan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Chan</div><div class="name-mm">ကျွဲခြံ</div></div>
        <span class="pcode-badge">MMR010029032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.66951556139412, 21.245844739942868], [95.67076795997343, 21.240678595241036], [95.67048398644687, 21.23301129293685], [95.66926418829172, 21.22782715100226], [95.66111283758744, 21.22307219702435], [95.64521028502668, 21.2148369458684], [95.62959170509316, 21.21114528102993], [95.61336537231415, 21.21114528102993], [95.61304573257456, 21.211954726629358], [95.61269968244443, 21.21283131291483], [95.61261312899279, 21.214190020353215], [95.6124053972913, 21.217450993568548], [95.61601025416996, 21.22275964304316], [95.61578296401262, 21.224123385785674], [95.61315456043468, 21.227014629721452], [95.61296219544903, 21.22794127227195], [95.61154700788813, 21.23287360942959], [95.61354432840807, 21.239996954096227], [95.62448016992397, 21.240394620815152], [95.63527118911412, 21.24380231122774], [95.64890194896583, 21.245790130410228], [95.66082886406087, 21.245790130410228], [95.66934808874333, 21.245790130410228], [95.66951556139412, 21.245844739942868]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
