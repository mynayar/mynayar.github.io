
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Thea Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Thea Kone</div><div class="name-mm">ကသဲကုန်း</div></div>
        <span class="pcode-badge">MMR010014032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04787056607381, 21.684035777229383], [96.04676133596695, 21.6841525380093], [96.042960764128, 21.6841525380093], [96.039884109664, 21.6841525380093], [96.03897921182124, 21.687772131178974], [96.0386172526841, 21.688858007690953], [96.03771235394203, 21.69066780517511], [96.03662647743005, 21.692296622191407], [96.03481667994589, 21.6946493565826], [96.03282590379246, 21.698630908889356], [96.03047316940132, 21.70098364417987], [96.03529617957508, 21.70164996987029], [96.04031531480001, 21.702615187940637], [96.04165365978861, 21.704777130260425], [96.04368468240222, 21.704060297744604], [96.04621839726127, 21.702431480728308], [96.04784721427757, 21.700078746337113], [96.04839015298325, 21.697545030578738], [96.049295050826, 21.695011315719682], [96.04947603129386, 21.692839559997765], [96.04965700996308, 21.689943886001572], [96.04893309168887, 21.686324293731218], [96.04787056607381, 21.684035777229383]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
