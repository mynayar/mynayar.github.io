
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Gaung (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Gaung (South)</div><div class="name-mm">မင်းဂေါင်း (တောင်)</div></div>
        <span class="pcode-badge">MMR010020084</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17339864433205, 20.742476755597863], [95.17371591255937, 20.74305841641285], [95.1823086190476, 20.74512066618587], [95.19158874212678, 20.745464373582024], [95.20018144771569, 20.74271470811732], [95.20843044680771, 20.742027292425632], [95.21977281876065, 20.74099616663983], [95.22974035843083, 20.738933916866813], [95.23455227366856, 20.738246501175126], [95.23530800006421, 20.732313994695176], [95.23381233667004, 20.72752787381239], [95.23022274578312, 20.724237415424454], [95.22782968489213, 20.720348691139236], [95.22763047966299, 20.720029963312186], [95.22217877682914, 20.720029963312186], [95.21186752886342, 20.720717379903192], [95.20293111497904, 20.722092213085205], [95.198806615433, 20.723467046267217], [95.18918278405829, 20.723467046267217], [95.18059007757006, 20.72484187944923], [95.17337220516322, 20.72484187944923], [95.1713099553902, 20.730341211277903], [95.1713099553902, 20.736184251402108], [95.17165366278635, 20.739277625162345], [95.17339864433205, 20.742476755597863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
