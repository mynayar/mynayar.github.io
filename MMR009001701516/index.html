
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Say Ta Nar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung Say Ta Nar Ward</div><div class="name-mm">အောင်စေတနာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009001701516</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95270335857322, 20.134291482765775], [94.9500239508447, 20.133912369060624], [94.94992805883288, 20.134090848513893], [94.94806264637407, 20.133920864056677], [94.94471599924401, 20.13338165753754], [94.94396059030908, 20.1333072062626], [94.94379364915767, 20.133350309868945], [94.94366635641728, 20.133418883174954], [94.94365383515645, 20.133538397678933], [94.94347019988987, 20.134118334493564], [94.94306745379998, 20.134751168531636], [94.94262088644479, 20.135577963851972], [94.94248803769284, 20.13624789942105], [94.94220561909412, 20.13621862918643], [94.94194477343262, 20.136655533326234], [94.9409903391329, 20.13809726167932], [94.94042691207238, 20.138959304128605], [94.93976540674817, 20.14007799330477], [94.93956147827964, 20.140415564626664], [94.9399344073471, 20.14045129469156], [94.94142346701943, 20.14069288137142], [94.94174802694994, 20.14074553757655], [94.94338818531656, 20.141086690898135], [94.94678860021378, 20.14155410004173], [94.95249106101369, 20.14239941959761], [94.95270335857322, 20.134291482765775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
