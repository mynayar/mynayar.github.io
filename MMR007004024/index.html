
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Kaing</div><div class="name-mm">ရှမ်းကိုင်း</div></div>
        <span class="pcode-badge">MMR007004024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.81603148116795, 17.42907930896297], [96.82699519537204, 17.434932396313116], [96.83025332493105, 17.436561460642963], [96.83654185861997, 17.444197536687], [96.83923694512896, 17.45003688959082], [96.84265680516751, 17.45019973972626], [96.84866974521265, 17.450486071275236], [96.85810254529628, 17.451384432845373], [96.86708616459487, 17.451384432845373], [96.87532750775836, 17.450961839617264], [96.87562375703084, 17.44940730120601], [96.87555249205394, 17.4488262213531], [96.87399988358783, 17.436166652868792], [96.87962273190362, 17.42820087906739], [96.88025016731143, 17.427312006244165], [96.8854239256737, 17.417999196405844], [96.88806307704942, 17.413248707561877], [96.89012976587605, 17.406589482318793], [96.88534042272238, 17.40553658664419], [96.87925810897462, 17.405942073867664], [96.8745950009586, 17.408577743967783], [96.87406028565374, 17.40913473817767], [96.86972914978048, 17.41364633920722], [96.85959196020087, 17.414254569592742], [96.84884653843704, 17.415876521184543], [96.8404514345861, 17.419443301667116], [96.83430548660897, 17.420826085755323], [96.82025966175405, 17.423986272848254], [96.81603148116795, 17.42907930896297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
