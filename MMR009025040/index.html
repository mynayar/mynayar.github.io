
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mi Ae</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mi Ae</div><div class="name-mm">မိအယ်</div></div>
        <span class="pcode-badge">MMR009025040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13606309193818, 21.48262869116121], [94.14350163639148, 21.478909418934563], [94.15307303279428, 21.47312206303286], [94.15349717915154, 21.472865603364937], [94.15001036188875, 21.46775160405332], [94.13963835482627, 21.460248449606297], [94.13908500107198, 21.45984815057176], [94.13234382061091, 21.452642061981635], [94.13178372733722, 21.452703062096703], [94.11336975411092, 21.45470854396416], [94.10886591692861, 21.455199061187784], [94.09794055611184, 21.45636133420828], [94.09050201255792, 21.45729115226493], [94.08918983963946, 21.457762188374318], [94.0864220807145, 21.458449538415493], [94.08811311462858, 21.4612804270501], [94.08899167582524, 21.46492065336554], [94.08673224699567, 21.46918844638975], [94.08468076570483, 21.473367146276814], [94.08614710040843, 21.474739518014417], [94.08910728637221, 21.477514691849592], [94.09282655680022, 21.47844450990624], [94.09654582902687, 21.47844450990624], [94.10003264718898, 21.475190146707973], [94.10561155373028, 21.47193578530829], [94.1090983718924, 21.471703330344496], [94.12304564094364, 21.475422601671767], [94.13513327388154, 21.480769055047915], [94.13606309193818, 21.48262869116121]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
