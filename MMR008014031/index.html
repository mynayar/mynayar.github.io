
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpone Soe Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpone Soe Su</div><div class="name-mm">ဖုန်းဆိုးစု</div></div>
        <span class="pcode-badge">MMR008014031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65763137938472, 18.254745903700552], [95.6597755493022, 18.252423052881625], [95.65826180773632, 18.248638701215157], [95.65618041409488, 18.246178871957397], [95.6544774560698, 18.240502344008007], [95.64887121283624, 18.240452515271386], [95.64756836229014, 18.241065620881727], [95.64611223399248, 18.243441410292917], [95.64514942520589, 18.243441410292917], [95.64504295356949, 18.24453273489786], [95.64329711496993, 18.252390667395446], [95.64130933985422, 18.26214883590012], [95.64022509920903, 18.269196402791806], [95.63981850941673, 18.276786090905432], [95.64483312374972, 18.275566319729933], [95.6497122075524, 18.274888668876997], [95.6556127611201, 18.275507602094194], [95.6556127611201, 18.268317332578874], [95.65466667342832, 18.261505498679867], [95.6552343264031, 18.257342711397087], [95.65763137938472, 18.254745903700552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
