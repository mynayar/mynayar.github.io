
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kway Zay Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Taung Kway Zay Ward</div><div class="name-mm">တောင်ကွေ.ဈေးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007009701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.43797624480788, 18.93652578963355], [96.43794468813942, 18.93667684420162], [96.43800772557614, 18.936751743398304], [96.43815216658925, 18.936895373222967], [96.4386040066696, 18.937385814004188], [96.43936695012474, 18.93818102603359], [96.43988545514969, 18.938769550474433], [96.43992619443839, 18.93932304182499], [96.44005952432764, 18.94049307509539], [96.44017803968484, 18.941330308846716], [96.44030025845024, 18.94226912731841], [96.44028544391819, 18.94235319954055], [96.4405095127039, 18.94275429717311], [96.44091013371165, 18.94347875972977], [96.4411391253704, 18.943481175116176], [96.44145393215331, 18.94345665420127], [96.44174105780365, 18.943364956627477], [96.44182058934877, 18.9418855430834], [96.44185021841292, 18.940827618399908], [96.44192429017392, 18.939552495751116], [96.44182535575561, 18.9390550501505], [96.44178355346827, 18.938844867796433], [96.44147985780927, 18.938340418275743], [96.4407835792988, 18.9376748237342], [96.43988730685379, 18.937009225595318], [96.43890955403276, 18.936518783914778], [96.43797624480788, 18.93652578963355]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
