
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hpein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hpein</div><div class="name-mm">မန်ဖိန်း</div></div>
        <span class="pcode-badge">MMR015008026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.85880933378377, 22.819464564338205], [98.84613002697921, 22.811634145699315], [98.83192659593573, 22.808735486853266], [98.80844745568561, 22.803228034146514], [98.80004134413281, 22.798010448223636], [98.79656295261822, 22.793082727286105], [98.78177978980551, 22.791053665194568], [98.74840838403975, 22.792193311272342], [98.74829304598734, 22.79263527589734], [98.74697610486339, 22.798966590335908], [98.74688833912563, 22.799419875626825], [98.7453932324118, 22.80714156892833], [98.74513819277342, 22.80841574638964], [98.74407374800512, 22.813733719135882], [98.7429484919794, 22.817313371614887], [98.74873507356483, 22.820619989920658], [98.7730838123681, 22.852795109406827], [98.77629438218003, 22.857381636553328], [98.78989603637302, 22.85047618143068], [98.79888187969505, 22.843519399300874], [98.81366504160843, 22.845548459593772], [98.82583941235907, 22.849606582877527], [98.84716523029118, 22.862871950879878], [98.85743479827738, 22.846997789916145], [98.86149292066182, 22.833663957425756], [98.86062332300799, 22.824388247319803], [98.85880933378377, 22.819464564338205]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
