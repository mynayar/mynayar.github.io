
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Hkoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopong</div><div class="name-mm">ဟိုပုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Hkoke</div><div class="name-mm">လုံခုတ်</div></div>
        <span class="pcode-badge">MMR014003012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.24587443205945, 20.853312344988808], [97.27404258439782, 20.85114556431637], [97.28704327023081, 20.850603869373117], [97.30491921325114, 20.8424784398282], [97.31304464189674, 20.828394364108647], [97.31141955616766, 20.808893335359187], [97.31141955616766, 20.80686968538771], [97.30838463744112, 20.805636749036807], [97.2869292290008, 20.809335957388555], [97.283230020649, 20.804896907366413], [97.2713925539233, 20.7930594397414], [97.24670506118969, 20.78526338959381], [97.24327857134904, 20.784181339697113], [97.20170193469659, 20.791066037567646], [97.19825637742991, 20.79303492781969], [97.1948108201633, 20.810508828919353], [97.18718137032403, 20.814446609423555], [97.1802902539921, 20.815431054099918], [97.18275136658235, 20.829705508202665], [97.19431859692577, 20.829705508202665], [97.20662416077647, 20.833151066368657], [97.21597638879939, 20.842749405560653], [97.2236058386386, 20.849886633061715], [97.24587443205945, 20.853312344988808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
