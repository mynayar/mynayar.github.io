
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Ma Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Ma Kauk</div><div class="name-mm">ထမ္မကောက်</div></div>
        <span class="pcode-badge">MMR009022025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.56818443836119, 21.07199471328545], [94.56757975130455, 21.0705585823128], [94.5517560360123, 21.07745609911973], [94.53836673783474, 21.079484780798055], [94.52984627568514, 21.08151346157706], [94.52741185857047, 21.09327981441197], [94.52173155077048, 21.098960122211906], [94.52150069480126, 21.09921406377805], [94.51786739506429, 21.103210693218955], [94.52213728710615, 21.107480585260873], [94.52294875887816, 21.111943684053813], [94.52521670069024, 21.112835988689994], [94.55179690030678, 21.1132327084228], [94.58831316601987, 21.108769608730483], [94.6069770347624, 21.105929455280204], [94.62482943083364, 21.10146635558789], [94.63010400319723, 21.10471224627321], [94.63821872901121, 21.10552371804522], [94.6434933013748, 21.101060619252223], [94.67062585290086, 21.10677273607297], [94.6726654487515, 21.104640430911218], [94.67225971331516, 21.093685550747637], [94.6677966136229, 21.090439660062316], [94.645886854195, 21.08516508859799], [94.63493197493074, 21.08597656126932], [94.6292516671308, 21.081919197912725], [94.61870252330289, 21.081919197912725], [94.58908377439673, 21.083947879590994], [94.57082564109055, 21.07826757179106], [94.56818443836119, 21.07199471328545]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
