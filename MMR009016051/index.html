
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sat Su Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sat Su Wa</div><div class="name-mm">ဆပ်ဆူဝ</div></div>
        <span class="pcode-badge">MMR009016051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51412070680522, 19.376537281370474], [95.51371577086621, 19.376942216410214], [95.51397887472535, 19.405883640917352], [95.52088891818909, 19.406352119354892], [95.54003315980253, 19.41071834857297], [95.54061507242773, 19.40276554479408], [95.53989775787528, 19.396668369749534], [95.54420164608916, 19.393440453813923], [95.55172937990704, 19.396709075763283], [95.55245076479105, 19.389495223325923], [95.5556786807266, 19.37443161502705], [95.55747196755732, 19.356498746719808], [95.56129764666912, 19.34502171208237], [95.55998256894048, 19.342869768425146], [95.55673355670831, 19.342356766351713], [95.55316808024276, 19.341793796146817], [95.55122080339743, 19.34422789220349], [95.54886419112955, 19.347173655739653], [95.54169104380668, 19.351477543953536], [95.53487655510901, 19.35398814623602], [95.52411683412464, 19.36654115315173], [95.51412070680522, 19.376537281370474]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
