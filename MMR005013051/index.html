
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dan Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dan Taing</div><div class="name-mm">ဒန်းတိုင်</div></div>
        <span class="pcode-badge">MMR005013051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1267117603395, 22.409295029641953], [95.1267117603395, 22.405853610156043], [95.1267117603395, 22.401077940294783], [95.1267117603395, 22.396832910010858], [95.12847215986233, 22.39221194962181], [95.1288343204476, 22.39126136981639], [95.12432388044277, 22.39126136981639], [95.11716023985326, 22.391792010293102], [95.10867036004913, 22.389934769973706], [95.1053839198321, 22.388032169648966], [95.10522120009836, 22.388342850342326], [95.10177204014758, 22.388608170131022], [95.09726195987162, 22.386751019743826], [95.09407811970954, 22.381444710305175], [95.09142492002411, 22.375077209845415], [95.08240439974333, 22.370301539984155], [95.07709800037247, 22.369318920032185], [95.07709800037247, 22.370566859772794], [95.07762863994981, 22.37719968002125], [95.08028183963523, 22.384363139847096], [95.08373099958601, 22.396037039677708], [95.08797576007333, 22.40611892994474], [95.09115960023541, 22.413547709559225], [95.0985885597143, 22.417527420054455], [95.10303707959758, 22.42010294979133], [95.10455124024759, 22.417507170019917], [95.11154244033139, 22.414011659910216], [95.11980444002296, 22.40988057013226], [95.12615987967479, 22.408927199730556], [95.1267117603395, 22.409295029641953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
