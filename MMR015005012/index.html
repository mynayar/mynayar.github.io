
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hsin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hsin</div><div class="name-mm">လွယ်ဆင်(မ်)</div></div>
        <span class="pcode-badge">MMR015005012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.62805304271382, 22.74543483135244], [98.62443842729164, 22.7323666019372], [98.62583200414372, 22.724562569407112], [98.62917659002767, 22.71759468334801], [98.62889787393777, 22.70700349531512], [98.62337556443083, 22.693749950699726], [98.61858540199478, 22.6930677222976], [98.61036036174136, 22.690949065247196], [98.61217494631677, 22.696133592091655], [98.61189623112625, 22.70282276296018], [98.60938779171329, 22.711462942860578], [98.6035347673157, 22.71843082891968], [98.59935403496081, 22.72484128459763], [98.6013050430933, 22.734875042249428], [98.60141652934942, 22.736533399297002], [98.60687935230033, 22.743515221250505], [98.60914045476824, 22.745668652386428], [98.61273237669786, 22.749089529558205], [98.61914283327519, 22.749925676928513], [98.62471714158289, 22.746859806235136], [98.62805304271382, 22.74543483135244]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
