
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mu Mandalay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mu Mandalay</div><div class="name-mm">မူးမန္တလေး</div></div>
        <span class="pcode-badge">MMR005002022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63869835974157, 22.157577090310497], [95.64049727992557, 22.157377199797963], [95.64197719978802, 22.158769351224635], [95.64242760005374, 22.15919303982696], [95.64290423983886, 22.160547270440247], [95.64397809331439, 22.161224444652476], [95.6443499998527, 22.16145896985563], [95.64452824278425, 22.161739025935333], [95.65140793772622, 22.156826674411548], [95.65501877689508, 22.154248414332926], [95.65571822011981, 22.153466684040268], [95.66140978113657, 22.147105529196892], [95.66044056018376, 22.146192540153663], [95.65948304031014, 22.143926843948748], [95.65676593210213, 22.139598148835546], [95.65346315030422, 22.13433640170365], [95.65439652697819, 22.12406926998085], [95.65596397335872, 22.120411892694733], [95.65740088943954, 22.117059089705265], [95.65673651977465, 22.116823200230556], [95.6464186276176, 22.11676671021553], [95.64587058795735, 22.116763760439255], [95.64296507987461, 22.11955740005402], [95.63467139976535, 22.12080930040895], [95.62641911994649, 22.12080930040895], [95.62653395977446, 22.126912289570555], [95.6280988799594, 22.1333283003608], [95.629037759585, 22.13896175977743], [95.63435855979975, 22.14459531002558], [95.63623631995029, 22.149759419561633], [95.63811408010076, 22.156018920436907], [95.63868143989657, 22.157531730305152], [95.63869835974157, 22.157577090310497]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
