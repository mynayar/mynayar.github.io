
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yankin</div><div class="name-mm">ရန်ကင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward</div><div class="name-mm">အမှတ် (၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013010701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16326665892922, 16.832044601577138], [96.1629838940915, 16.832006454134614], [96.1626119605736, 16.831961631923832], [96.16224708493507, 16.831947707720587], [96.16096229457429, 16.83163490282857], [96.16096741801198, 16.832178660816567], [96.16108055092673, 16.83266487118692], [96.16111946099437, 16.833231926112546], [96.1610965732483, 16.83400154163786], [96.16104698193271, 16.834697723920897], [96.16101368992992, 16.8351225420717], [96.16171836810827, 16.83557192520425], [96.1622037888738, 16.8358745578646], [96.16249138936621, 16.83605303102263], [96.16258621208408, 16.835443496620144], [96.16264152488651, 16.835149765449387], [96.162740708417, 16.83471298271803], [96.16287040684387, 16.834070205775447], [96.16302299481544, 16.8333377844113], [96.16326665892922, 16.832044601577138]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
