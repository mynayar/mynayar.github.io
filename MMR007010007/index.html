
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon Taw</div><div class="name-mm">ဝါးရုံတော</div></div>
        <span class="pcode-badge">MMR007010007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.40213576835112, 19.11407185992846], [96.40071219011554, 19.11271451406361], [96.40071254984434, 19.110906754443192], [96.39881258723119, 19.110002529293354], [96.39605624070299, 19.11191704563521], [96.38995532268007, 19.11191704563521], [96.38249864519639, 19.11361174608527], [96.37623662711871, 19.116524832754862], [96.37673666726346, 19.120390544288227], [96.3750419668134, 19.127508281681912], [96.37334726816198, 19.134964959165586], [96.37199150780191, 19.14038799790785], [96.37097468933052, 19.148183614582194], [96.37073567021508, 19.152963995092364], [96.37063574924048, 19.154962412785153], [96.37029680915049, 19.15869075197668], [96.37272612081387, 19.164350375369565], [96.37605878708342, 19.169197889371162], [96.38080394564565, 19.172248348382595], [96.38178003382154, 19.171006052787163], [96.3845322839378, 19.167503188921103], [96.38622698438786, 19.162758031258193], [96.38690486366858, 19.15699605332526], [96.38724380375862, 19.15225089386371], [96.38859956321932, 19.14547209566075], [96.38961638259002, 19.139710117727816], [96.3919889623208, 19.133609199704836], [96.39300578169156, 19.128186160962628], [96.39436154115225, 19.123779943389707], [96.39842882043376, 19.120729484378273], [96.40189566375392, 19.12045696371797], [96.40213576835112, 19.11407185992846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
