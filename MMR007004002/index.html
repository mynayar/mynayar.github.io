
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Gyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Gyan</div><div class="name-mm">နောင်ဂျမ်း</div></div>
        <span class="pcode-badge">MMR007004002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57674578059334, 17.389192458864954], [96.57580662757385, 17.390549750770447], [96.57109980980846, 17.391001024277898], [96.56968842458122, 17.39235836204881], [96.56921892271515, 17.39371304502106], [96.56780741607946, 17.394166445425185], [96.566396178341, 17.396878405014434], [96.56702683691907, 17.400202469268606], [96.5673386804358, 17.401846119702725], [96.56813377735199, 17.40286417923852], [96.56875048834445, 17.40365382716243], [96.56922299574472, 17.40591233418695], [96.56969457774261, 17.40636479300082], [96.57016502119882, 17.406816158239167], [96.57016531887444, 17.40915546575218], [96.57016563363715, 17.411630571793523], [96.57016409579643, 17.412240324731272], [96.58278942619114, 17.419440708022307], [96.58320379511912, 17.419267994122663], [96.58695107223423, 17.417662018087697], [96.58949232790866, 17.41657290761367], [96.59443331924234, 17.415225365258436], [96.60476448089611, 17.414776183574077], [96.59892512889166, 17.406690926744943], [96.59353495677288, 17.401300754626163], [96.58500051915871, 17.397258125761937], [96.58230543264966, 17.392317136226893], [96.57674578059334, 17.389192458864954]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
