
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Kone</div><div class="name-mm">ကျောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010031047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87074855939858, 21.072958745150004], [95.87074855939858, 21.067604958701907], [95.87352459658291, 21.064035767137], [95.8798620785721, 21.056566614257918], [95.87380092407346, 21.05333399756597], [95.86895200083421, 21.052121767205847], [95.86289084633557, 21.050505458859902], [95.8584459992835, 21.045252459433527], [95.8584459992835, 21.03878722694901], [95.85544551290013, 21.033161314642996], [95.85521338259161, 21.032726073349636], [95.85198076769831, 21.02747307212462], [95.8475359206463, 21.028281226297622], [95.8418788432341, 21.031917919176692], [95.83783807416785, 21.03434237989694], [95.83218099585633, 21.032321996263192], [95.83016061132321, 21.036362765329386], [95.8244304657934, 21.03935051011797], [95.82674748181091, 21.040358596172325], [95.82777995568046, 21.040808003586562], [95.83087747081868, 21.042429216834933], [95.82996206169986, 21.048322842025584], [95.82933309474657, 21.060725738602002], [95.82831563595789, 21.064999072349337], [95.836642951611, 21.068794688923788], [95.84497106496275, 21.06998441914567], [95.85230773601324, 21.069389553585097], [95.85825638892129, 21.068794688923788], [95.87074855939858, 21.072958745150004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
