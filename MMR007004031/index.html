
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Byar Ah Lel Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Byar Ah Lel Su</div><div class="name-mm">အဗျားအလယ်စု</div></div>
        <span class="pcode-badge">MMR007004031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.72821998766238, 17.496314634213036], [96.73278105590106, 17.498997614947996], [96.74221385598474, 17.503040242912903], [96.74792305630405, 17.50653158466497], [96.75119747618265, 17.50663369099209], [96.75973191379683, 17.510227139071276], [96.76871553309542, 17.510227139071276], [96.78443686686796, 17.511125500641413], [96.7947680294211, 17.510676319856316], [96.80465001028978, 17.514269767935502], [96.80285328714956, 17.505735329421952], [96.81004018240856, 17.498997614947996], [96.81587953531238, 17.493607442829273], [96.8104893631936, 17.489115634079326], [96.80509919107487, 17.48552218600014], [96.79881065828533, 17.490463176434503], [96.79207294291206, 17.495853347653906], [96.78643989628426, 17.490827560143828], [96.77029983007316, 17.481715823426555], [96.76705360394072, 17.479883193954265], [96.76127052341599, 17.470140456916624], [96.75683698803664, 17.466276157318873], [96.7498499329281, 17.471372984975346], [96.74535812327883, 17.47631397630903], [96.73592532319515, 17.47676315709407], [96.72244989424729, 17.474517252269436], [96.72559416064206, 17.481928737920953], [96.72379743660247, 17.487318910039733], [96.72514497985702, 17.49450580529873], [96.72821998766238, 17.496314634213036]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
