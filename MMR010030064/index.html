
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Yoe</div><div class="name-mm">မကျီးရိုး</div></div>
        <span class="pcode-badge">MMR010030064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09549300579766, 20.77893160211181], [96.10115697201672, 20.781614534283392], [96.1096529222446, 20.78601984084304], [96.11563155405304, 20.791054477682053], [96.11742394875631, 20.792607887444092], [96.1184635371626, 20.79168380796142], [96.1238128386916, 20.78979581892196], [96.12416452397366, 20.790147503304695], [96.12444216897097, 20.785705177052307], [96.12418303292071, 20.78129986869402], [96.12412750428098, 20.78035587462398], [96.11972219682201, 20.774377242815547], [96.11814887337187, 20.77028660004663], [96.11783420778255, 20.762734644788054], [96.11689021281313, 20.759902660779233], [96.11783420778255, 20.755182688630214], [96.11689021281313, 20.74668673930165], [96.11655524772658, 20.746798393730955], [96.11217024066411, 20.74826006275174], [96.10745026941447, 20.75235070642003], [96.10084230822599, 20.75235070642003], [96.0939196814482, 20.75046271738057], [96.09297568737816, 20.758329337329087], [96.0964369998677, 20.764937297618246], [96.09549300579766, 20.770601264736626], [96.09549300579766, 20.77893160211181]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
