
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Son (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Son (South)</div><div class="name-mm">ချောင်းဆုံ (တောင်)</div></div>
        <span class="pcode-badge">MMR005011004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42180592020713, 22.994686170430498], [95.41851804017546, 22.994506799749047], [95.41467287994953, 22.994689950281042], [95.41027835985847, 22.994689950281042], [95.40368640030721, 22.994689950281042], [95.39727768032077, 22.994079569616474], [95.39349371985935, 22.993286130150864], [95.39050284003412, 22.99353029968364], [95.38531487957806, 22.993286130150864], [95.38525943997126, 22.99330232963888], [95.3798828404208, 22.99487300998146], [95.37829595969083, 22.99731444000946], [95.37329087997017, 22.999694850137303], [95.36932367994393, 23.00311278023065], [95.36712660021249, 23.006713859956733], [95.36889635987916, 23.01190182041273], [95.36933843961737, 23.01157934960736], [95.37408432033516, 23.00811768008691], [95.38171379985204, 23.005920419591746], [95.39392103992412, 23.007324239721925], [95.40667728013244, 23.008728059852103], [95.41333007971946, 23.011108380047745], [95.41912607990474, 23.0125116596854], [95.41967759994134, 23.00891111955258], [95.42010492000611, 23.004089370228314], [95.42071547963576, 22.99871826013964], [95.42180592020713, 22.994686170430498]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
