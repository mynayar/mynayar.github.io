
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pong Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pong Long</div><div class="name-mm">ပုံးလုံ</div></div>
        <span class="pcode-badge">MMR015012066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.98000954540424, 22.61962583656316], [96.97765732812326, 22.617344898648184], [96.97333329869286, 22.615903556104286], [96.96180255384485, 22.610858854952255], [96.94126341607387, 22.60977784826912], [96.92564303479827, 22.60835723060177], [96.9257689785556, 22.615543220243467], [96.92577459392243, 22.615565680811585], [96.92793099372045, 22.62419127820499], [96.92865166544209, 22.632839336166455], [96.92757065785963, 22.64076672330566], [96.92468797187246, 22.647973437823964], [96.92432763601164, 22.658062839228705], [96.926849986138, 22.665269553746953], [96.92741831720161, 22.67663615973106], [96.92757065785963, 22.679682983682824], [96.93982207263059, 22.68761037082203], [96.95495617518742, 22.691574064391602], [96.96648691913606, 22.69229473611324], [96.9837830350591, 22.686169028278073], [96.98541304367706, 22.684695236396067], [96.98722239060089, 22.683059232897335], [96.98846740035032, 22.67247626916452], [96.98882773621114, 22.641847729988797], [96.99315176474221, 22.63428067871041], [96.99477479641979, 22.630339032020743], [96.98954840793272, 22.62887564259688], [96.98000954540424, 22.61962583656316]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
