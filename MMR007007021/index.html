
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Kaung</div><div class="name-mm">တကောင်း</div></div>
        <span class="pcode-badge">MMR007007021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60358637800897, 17.852708464324223], [96.60734660985821, 17.85018040260354], [96.61499263420279, 17.845083054239637], [96.62200148887769, 17.83966712014154], [96.62869175961708, 17.834251186942765], [96.6376121224016, 17.827242331368552], [96.6446209770765, 17.822463566040767], [96.64887253643849, 17.81994058369105], [96.64129619066671, 17.815628598880778], [96.63068254926031, 17.813002488574057], [96.63028468199252, 17.81577329530137], [96.62805459174609, 17.82087064456465], [96.622638657648, 17.823100734811135], [96.61371829666211, 17.822463566040767], [96.61085103764532, 17.823737903581446], [96.60830236256402, 17.82405648841626], [96.60479793477691, 17.82405648841626], [96.59747049616652, 17.823737903581446], [96.59245461468879, 17.822830493032882], [96.5884267499946, 17.82733250728944], [96.59116252632958, 17.832339680631833], [96.59371119961224, 17.836162693253755], [96.59817138100448, 17.837437029895057], [96.60135722395677, 17.839985704976357], [96.60326873026776, 17.84572022300995], [96.60358637800897, 17.852708464324223]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
