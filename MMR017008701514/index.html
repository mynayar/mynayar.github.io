
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tar Ka Lay Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tar Ka Lay Ward</div><div class="name-mm">တာကလေးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017008701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4652818010868, 17.631261090885868], [95.46536859888437, 17.63191207436745], [95.46541618810443, 17.632471247703904], [95.46538049618937, 17.633078010260363], [95.46523772852896, 17.633851335087286], [95.4649283985982, 17.63461276260921], [95.46441384015577, 17.635387078878125], [95.45774659041751, 17.641026401461943], [95.45769257003377, 17.641072612447374], [95.46056327738313, 17.64417819585259], [95.46081438444537, 17.644847814685306], [95.46100794836849, 17.644691474593515], [95.46270407466034, 17.643740615914624], [95.46799804460227, 17.641376318659013], [95.47564165505884, 17.6381247003971], [95.47659240814716, 17.633101126645784], [95.47109635884075, 17.631705987986983], [95.4710425350749, 17.631628242547407], [95.46543442177047, 17.630416613129782], [95.46501900597013, 17.6304858490965], [95.46474206210326, 17.630607012038265], [95.46503631496182, 17.63095319187187], [95.46515747790357, 17.631178208763718], [95.4652818010868, 17.631261090885868]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
