
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mae Hsat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsat</div><div class="name-mm">မိုင်းဆတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mae Hsat</div><div class="name-mm">မယ်ဆတ်</div></div>
        <span class="pcode-badge">MMR016006003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.24073349765285, 20.53439927830408], [99.23209682420912, 20.533967443642666], [99.21870997938208, 20.529649106920772], [99.20186846355881, 20.529217274058], [99.19755012683692, 20.543899620171373], [99.19711829307482, 20.55685463123632], [99.20273213108305, 20.5672186406278], [99.20661863494212, 20.57283247863603], [99.21439164176093, 20.57283247863603], [99.22230059639548, 20.568226252739407], [99.231513049088, 20.566690843807464], [99.23995779731456, 20.568226252739407], [99.25224106697175, 20.56285232237684], [99.25224767698876, 20.561163638391236], [99.25234726521415, 20.53572137164406], [99.25235749590178, 20.533107723242892], [99.2458596539999, 20.53382970527673], [99.24073349765285, 20.53439927830408]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
