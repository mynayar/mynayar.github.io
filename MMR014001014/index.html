
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Thaw (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taunggyi</div><div class="name-mm">တောင်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Thaw (East)</div><div class="name-mm">မိုင်းသော် (အရှေ့)</div></div>
        <span class="pcode-badge">MMR014001014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.97140120330295, 20.82760815789021], [96.97127805104128, 20.826770723590073], [96.97021014478241, 20.8195089597707], [96.95792100704887, 20.79325489389828], [96.95010064732708, 20.796606477407067], [96.93948730089829, 20.794930686102305], [96.92999114987174, 20.79213770029469], [96.92440517825645, 20.789344713587695], [96.91826060893999, 20.799399463214684], [96.91658481763528, 20.807778419738327], [96.91379183182761, 20.81615737806061], [96.91937780434228, 20.827329321291188], [96.90094409729232, 20.82844651489478], [96.90317848629815, 20.8524661926607], [96.90150269499344, 20.879278856234293], [96.88865495955878, 20.89491957657725], [96.89591672337815, 20.90162274269545], [96.9042956799018, 20.90944310331662], [96.92887395536883, 20.918380656642057], [96.95456942443946, 20.92340803235487], [96.96183118825877, 20.925642419562053], [96.97635471409882, 20.92229083695264], [96.97691331090061, 20.90162274269545], [96.9757961163977, 20.857493566574874], [96.97406187275726, 20.845700715215912], [96.97140120330295, 20.82760815789021]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
