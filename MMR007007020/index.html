
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Sa Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Sa Khan</div><div class="name-mm">ဆင်စခန်း</div></div>
        <span class="pcode-badge">MMR007007020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71393397727127, 17.83038139608459], [96.71105852183337, 17.82379250412083], [96.70767851615068, 17.816902493055636], [96.7069341221121, 17.815385075960535], [96.7027343313244, 17.809308791267767], [96.70005465110131, 17.81035736210265], [96.69010286485536, 17.813284358586316], [96.68803927958913, 17.81621748664776], [96.68486666476485, 17.816344390881], [96.68353416626883, 17.816154034081478], [96.6838068497064, 17.815136127430378], [96.67934985281352, 17.81048576100909], [96.67933237359023, 17.810467522758017], [96.67667988526853, 17.81119113975933], [96.67500347343162, 17.811674719612654], [96.67338036531169, 17.812142923756994], [96.66640061359749, 17.814046492651585], [96.6606139483751, 17.813005614617452], [96.65288249293275, 17.814226370550614], [96.65157199635058, 17.814433291063608], [96.64129619066671, 17.815628598880778], [96.64887253643849, 17.81994058369105], [96.65991302486628, 17.825330825057563], [96.66365810583699, 17.827313515406445], [96.67552523670037, 17.826330595980266], [96.68298088176232, 17.824585659400725], [96.6902778954086, 17.82522018056693], [96.69595202396681, 17.827404433268043], [96.703444246255, 17.827916903842095], [96.70947221397154, 17.827916903842095], [96.71393397727127, 17.83038139608459]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
