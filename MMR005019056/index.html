
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yin</div><div class="name-mm">မယင်း</div></div>
        <span class="pcode-badge">MMR005019056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.5153403198999, 22.068054810181422], [94.51066212036062, 22.068665010082213], [94.50667980003283, 22.068665010082213], [94.50016307956253, 22.068665010082213], [94.49256023976329, 22.066492769625654], [94.49196227963557, 22.06733976012191], [94.48821575974955, 22.072647510274408], [94.48604352019237, 22.08169845012344], [94.4856813596071, 22.084594830087383], [94.48531955965001, 22.089663359676365], [94.48423344032108, 22.09364576993636], [94.48712964042062, 22.101248609735592], [94.490750159892, 22.105593089749334], [94.49437031963458, 22.104869040174094], [94.4976286803194, 22.0994384399321], [94.4976286803194, 22.092921720361176], [94.50342144024734, 22.087491120119125], [94.51138643973246, 22.082060519877132], [94.5160927197033, 22.07988828031995], [94.51937016040466, 22.078140480299], [94.51971324007405, 22.072647510274408], [94.51500660037436, 22.069389149589654], [94.5153403198999, 22.068054810181422]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
