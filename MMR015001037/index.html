
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Mun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Mun</div><div class="name-mm">နောင်မွန်</div></div>
        <span class="pcode-badge">MMR015001037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.62479103008201, 22.81937956221708], [97.63510075279754, 22.815604522131025], [97.65046331463031, 22.81076815972284], [97.6649724009556, 22.807354257692907], [97.67037774733524, 22.8047938311704], [97.67350715692982, 22.799957468762216], [97.67549860127946, 22.793414155339065], [97.67635207588768, 22.782318971943027], [97.67862801087404, 22.76809437805315], [97.6787499877218, 22.765491222941648], [97.65899807060453, 22.758137161700688], [97.64960983912283, 22.757283686193205], [97.6354459836453, 22.755678115752517], [97.61148792742597, 22.75699919375785], [97.59697884110068, 22.760128605151067], [97.59498520959983, 22.761264385043376], [97.59669434866532, 22.76297352410893], [97.60209969504496, 22.77406870660559], [97.60295316965312, 22.784594906929442], [97.6022693800279, 22.78596316157069], [97.60608258104634, 22.79113822035265], [97.6089275000042, 22.7976815337758], [97.60949648397559, 22.80621628975001], [97.60494461400282, 22.81532002969567], [97.60238939725292, 22.822454908167515], [97.60380664605992, 22.822147835554233], [97.6160397973988, 22.822147835554233], [97.62479103008201, 22.81937956221708]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
