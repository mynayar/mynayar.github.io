
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Kone</div><div class="name-mm">ကျွန်းကုန်း</div></div>
        <span class="pcode-badge">MMR017017067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15889149964306, 16.702000909714286], [95.16818266100108, 16.705097960802277], [95.16950705480679, 16.703111371892362], [95.1711933322066, 16.70058195669202], [95.17149439734862, 16.693657416156896], [95.17330079989205, 16.69034567711134], [95.17620915792634, 16.689291718438085], [95.17659102715425, 16.689153332560295], [95.17962320924374, 16.6906467458507], [95.1811106402439, 16.688565773991343], [95.18133888008532, 16.68758714972722], [95.18189939963764, 16.685183699867878], [95.18207760030106, 16.684419599884677], [95.18220935997402, 16.683853877754302], [95.17762548043163, 16.685183879732335], [95.17054787978088, 16.685747369745343], [95.15719583961635, 16.683321960240335], [95.15659391977363, 16.683092550380934], [95.15426111975495, 16.682203170340074], [95.15419617881065, 16.682343872871513], [95.15282824342876, 16.687033940763797], [95.15280055779954, 16.687809109602767], [95.1525271746894, 16.69546381870032], [95.15734424663975, 16.70148516021203], [95.15889149964306, 16.702000909714286]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
