
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Huong Kut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Huong Kut</div><div class="name-mm">ဟုန်းကွတ်</div></div>
        <span class="pcode-badge">MMR015005081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.85596507762631, 22.572408216765837], [98.85742217539314, 22.57074296371684], [98.86375369487718, 22.568794803737262], [98.87043362790968, 22.56909168972976], [98.86716297529114, 22.563112670313558], [98.86180604930979, 22.554715385606585], [98.8551493223834, 22.548663816981616], [98.8496295345754, 22.54281933614351], [98.84647189256384, 22.53966169413195], [98.84427209508118, 22.539734749659033], [98.83794057469783, 22.533727923205163], [98.83144670779939, 22.530480989306284], [98.8295707876618, 22.529605561347637], [98.82527753393111, 22.52966925583155], [98.81964082166667, 22.53139195937149], [98.82386803907877, 22.544286106118932], [98.8273432838655, 22.54562724170387], [98.83319630916242, 22.55120155091089], [98.83433474115543, 22.55275410182037], [98.84044291131136, 22.556218430636136], [98.85596507762631, 22.572408216765837]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
