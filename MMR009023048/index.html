
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Shin Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Shin Ma</div><div class="name-mm">ရေရှင်မ</div></div>
        <span class="pcode-badge">MMR009023048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.04782217215558, 22.4512741767619], [94.079206435029, 22.45325222391108], [94.11528954677522, 22.457709549955837], [94.12505321283555, 22.463864903942238], [94.12717574866195, 22.449431659243714], [94.13269434306955, 22.444337572720883], [94.13269434306955, 22.43499841364593], [94.12675124167652, 22.434149399675107], [94.11677532302281, 22.44179052900978], [94.10446461415069, 22.437969965241734], [94.09767249788752, 22.432451370834144], [94.0724143196652, 22.43457390666049], [94.05786399492746, 22.43676932624345], [94.05094652756026, 22.435653428562944], [94.01925994588987, 22.436322318220448], [94.01898879219908, 22.43690335490595], [94.01769786216664, 22.439669604768483], [94.02439208992308, 22.44524858505423], [94.0293012065855, 22.448595989413434], [94.03599561330697, 22.445695103845992], [94.04068162525687, 22.44703411523227], [94.04335930718634, 22.449712015697003], [94.04782217215558, 22.4512741767619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
