
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Soet Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Soet Pin</div><div class="name-mm">သံစို့ပင်</div></div>
        <span class="pcode-badge">MMR007001061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.34804483160377, 17.529485362559512], [96.3470036909676, 17.539115914567844], [96.34780940707856, 17.546367357767394], [96.35143512912799, 17.55281308485604], [96.35344941895556, 17.555633090794572], [96.35425513506647, 17.562481676388302], [96.35385227656138, 17.56731597215446], [96.35471210577913, 17.57014112491305], [96.35761334478008, 17.568068811726334], [96.35905235987855, 17.56704094418427], [96.3666649087586, 17.573384734018305], [96.36717467776924, 17.573435711189177], [96.37300869859263, 17.57401911309165], [96.38189000561931, 17.567675323257617], [96.38759941727932, 17.55498774179091], [96.38633065913268, 17.546106434764226], [96.38823379635267, 17.537225127737486], [96.39118365899873, 17.523942817407146], [96.38618792413342, 17.522872302215035], [96.38297638035573, 17.51894708164258], [96.37755827709287, 17.517990945825545], [96.37238374261568, 17.52179302223027], [96.36996659518229, 17.522598738341173], [96.36070086215511, 17.527433034107275], [96.34804483160377, 17.529485362559512]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
