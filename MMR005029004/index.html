
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin U</div><div class="name-mm">မြင်ဦး</div></div>
        <span class="pcode-badge">MMR005029004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.35092075958545, 22.92373628989793], [94.3550600403886, 22.91833737007363], [94.35727079970769, 22.90949532025286], [94.34666160005287, 22.908646530213275], [94.33632456043017, 22.907354399585927], [94.32081935982563, 22.898955780285064], [94.32120816012855, 22.893125220052923], [94.31112851996528, 22.892495219778596], [94.30466796035813, 22.88538864027356], [94.286578680162, 22.882158360020355], [94.26202847973059, 22.882158360020355], [94.24070892018057, 22.88409650964627], [94.21422048019105, 22.88538864027356], [94.2073024759286, 22.885611839414935], [94.20602262644309, 22.89403751841678], [94.20574936114417, 22.895836515942506], [94.20569054188508, 22.89682173763316], [94.20510761392529, 22.90658573914061], [94.20131638514312, 22.92822734681465], [94.21874315996894, 22.92867413989967], [94.25233763987023, 22.922859690122664], [94.28205600038416, 22.922859690122664], [94.31371259955688, 22.92350579995275], [94.33309428017697, 22.92092153959743], [94.35092075958545, 22.92373628989793]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
