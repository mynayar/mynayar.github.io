
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myet Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myet Ye</div><div class="name-mm">မျက်ရဲ</div></div>
        <span class="pcode-badge">MMR018003040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02005358010871, 20.1013033006069], [96.02316824621767, 20.094762502587457], [96.0241026463201, 20.08791023786722], [96.02379117871999, 20.08074650734551], [96.02067651440967, 20.07545157523009], [96.01693891489907, 20.072025442420284], [96.0113325160828, 20.068599309610477], [96.00385731796092, 20.06735344370651], [95.99544771973655, 20.068287842909683], [95.98392345720185, 20.072336909121134], [95.98347547341444, 20.072541701838134], [95.97302212716949, 20.077320373636383], [95.96570228063581, 20.080875727333023], [95.9621207962378, 20.0826153057518], [95.96300333513585, 20.09545882966131], [95.97566003118555, 20.098623004348212], [95.98792120539935, 20.096249874232342], [95.99820477043386, 20.09387674321715], [96.01323459570011, 20.093481222280616], [96.02005358010871, 20.1013033006069]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
