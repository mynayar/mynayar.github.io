
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myit Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myit Kaing</div><div class="name-mm">မြစ်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009024066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.32236969570494, 21.841898283379123], [94.32227730925047, 21.841112825396635], [94.3207711732511, 21.836593918274787], [94.31608520896526, 21.832577052289196], [94.31371709616712, 21.826593842032253], [94.31324843606654, 21.826684285051783], [94.30447459712502, 21.826135919836872], [94.29350729912261, 21.828055198088975], [94.28445927757366, 21.8291519267201], [94.27760471688424, 21.83079702236472], [94.27687509331099, 21.828972963431568], [94.27541125692403, 21.83134538668031], [94.26526650584464, 21.834635577070287], [94.26033122160862, 21.83765158395346], [94.26060540511543, 21.848070516741018], [94.25799981823707, 21.855413534307218], [94.25758939733288, 21.856570173075056], [94.2619763172533, 21.85629599136695], [94.27020179008059, 21.856021807860202], [94.27376616217867, 21.854297112321944], [94.278701447314, 21.851909071446528], [94.2869269201413, 21.847522152425427], [94.28966874531642, 21.84642542199566], [94.29789421904303, 21.844506144642935], [94.30474877973245, 21.848070516741018], [94.31215170563678, 21.848070516741018], [94.31763535508765, 21.84505450985779], [94.32236969570494, 21.841898283379123]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
