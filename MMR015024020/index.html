
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Nauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Matman</div><div class="name-mm">မက်မန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Nauk</div><div class="name-mm">လုံနောက်</div></div>
        <span class="pcode-badge">MMR015024020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.76387091810847, 22.031660265009293], [98.76393120955771, 22.03176837521039], [98.76526421617069, 22.035006814113217], [98.76661524160016, 22.038050152292726], [98.76787159719652, 22.0409055060843], [98.76844266759508, 22.043246896427206], [98.76804291804626, 22.046010877300205], [98.76801235728453, 22.04611923391559], [98.76678656155065, 22.050465228387623], [98.76545445605836, 22.053129442969464], [98.76781093072992, 22.05341563872082], [98.76758033736274, 22.053781876832204], [98.76920226737082, 22.054770240754067], [98.77233004469588, 22.057689900568505], [98.77575646888602, 22.07310880942407], [98.78180981726933, 22.075659590717578], [98.79551551313051, 22.075469233918056], [98.81245727458361, 22.064238177350035], [98.83701331341376, 22.0551010473755], [98.87161599628126, 22.06445772884115], [98.8860228872465, 22.0666480330803], [98.8847318169199, 22.059776291742537], [98.88501833193055, 22.054578484609408], [98.88849175019419, 22.033520834618855], [98.86793380220325, 22.037922257905905], [98.85175346704892, 22.03625663523559], [98.83176599410541, 22.035066904114387], [98.80511803237135, 22.022403694275113], [98.78674859357278, 22.030850780739], [98.77563306211619, 22.030970741306703], [98.76454688812845, 22.031503202910528], [98.76450465236786, 22.031513018111355], [98.76387091810847, 22.031660265009293]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
