
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kant Daunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kant Daunt</div><div class="name-mm">ကန့်ဒေါင့်</div></div>
        <span class="pcode-badge">MMR005019017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.68317052040328, 21.910880610052175], [94.68317052040328, 21.910469490374737], [94.68809424025704, 21.907283579973296], [94.69128023969137, 21.902649479589854], [94.69099044035659, 21.902649479589854], [94.69041119961724, 21.89888424031551], [94.68403919984928, 21.89367090009199], [94.68403919984928, 21.886719659584685], [94.69099044035659, 21.884402610292284], [94.69678320028453, 21.880637370118563], [94.69762703955627, 21.875575140280546], [94.69765224035865, 21.8754240298951], [94.69214892003669, 21.873975839913157], [94.68577727999752, 21.8757136502648], [94.67940528022956, 21.8757136502648], [94.67492688037129, 21.875937569763096], [94.67388576041958, 21.877903799820558], [94.67246052023688, 21.878921969972964], [94.6685908795655, 21.879532980162935], [94.66472160042156, 21.879329309799857], [94.65840864024659, 21.879329309799857], [94.65535403985712, 21.880143900420705], [94.65250284003412, 21.882994920379303], [94.65060383969552, 21.883232339600852], [94.65131088039288, 21.890774520128048], [94.65131088039288, 21.89975309962591], [94.65536591990133, 21.908152440183017], [94.65594155975526, 21.90838275026374], [94.66405487992881, 21.911628059987038], [94.67187479988218, 21.91597254000078], [94.67506080021582, 21.923213310046265], [94.68085356014376, 21.924661500028265], [94.6834599600092, 21.922344449836544], [94.68317052040328, 21.91510367979106], [94.68317052040328, 21.910880610052175]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
