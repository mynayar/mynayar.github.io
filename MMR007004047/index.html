
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo</div><div class="name-mm">အုတ်ဖို</div></div>
        <span class="pcode-badge">MMR007004047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.8109385439787, 17.54526325379618], [96.82082052484742, 17.549305882660406], [96.82490773040752, 17.551145125746984], [96.82980414414601, 17.553348512423952], [96.8401353066991, 17.5569419587045], [96.84392838988333, 17.558339410735243], [96.84866974521265, 17.56008622599859], [96.85585663957232, 17.562332130823222], [96.8643910789852, 17.56278131160832], [96.85989926933587, 17.555594416349265], [96.85495827800219, 17.547509158620812], [96.85091565003728, 17.54211898740141], [96.84956810678278, 17.534033729672956], [96.8481534453253, 17.528375082943796], [96.8467177280408, 17.519275861192114], [96.84621012459763, 17.506754987952377], [96.84084749871317, 17.50548136357412], [96.83912297314674, 17.520451034088012], [96.83744022108937, 17.525499292058726], [96.83249922975568, 17.532237005633363], [96.82800742100574, 17.53672881618195], [96.82261724888701, 17.540771445046175], [96.8109385439787, 17.54526325379618]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
