
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Te Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Te Gyi</div><div class="name-mm">မြင်းတဲကြီး</div></div>
        <span class="pcode-badge">MMR009006069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59494998355495, 20.490573646756445], [95.59503358723032, 20.49013174328536], [95.60838386922023, 20.49161510755124], [95.6123395075623, 20.46442008911589], [95.62865651898323, 20.460958905229347], [95.64428838819862, 20.46587177835994], [95.64645689377068, 20.461947815039707], [95.6500439881396, 20.455491046974316], [95.64398461969449, 20.450080898214935], [95.64447907504933, 20.44315852864321], [95.63953452599765, 20.43574170641466], [95.63013988324906, 20.42931379309715], [95.62618424400773, 20.41695242091754], [95.6375567072763, 20.391735222102852], [95.6360733421111, 20.378879394568457], [95.63450084783591, 20.37738966400184], [95.61629514680362, 20.38926294712735], [95.61135059775194, 20.394207496179035], [95.60442822997891, 20.391240766748012], [95.60428650941492, 20.39137362988913], [95.60349917274868, 20.392111758351007], [95.58069439543004, 20.413491236131676], [95.57929685256778, 20.415135403676004], [95.5722886615925, 20.423380334235105], [95.57129975268151, 20.43722507068054], [95.58415557931659, 20.446125258074233], [95.58662785429209, 20.475298096130302], [95.58724470288081, 20.47648434507653], [95.59305576671034, 20.487659468309857], [95.59494998355495, 20.490573646756445]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
