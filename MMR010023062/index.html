
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Kone</div><div class="name-mm">အလယ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010023062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13991900226023, 20.368097260680088], [96.1415363772021, 20.36081907434084], [96.14719718859942, 20.35232785634554], [96.14598415784269, 20.344240981636062], [96.14436678290076, 20.335749762741386], [96.14760153278456, 20.329684607158924], [96.14760153278456, 20.321193389163625], [96.14638850202783, 20.312702171168326], [96.13991900226023, 20.31351085773997], [96.13223647173584, 20.318362982565645], [96.1233409095554, 20.322810764105554], [96.11484969066078, 20.324023794862285], [96.10635847266542, 20.32200207663459], [96.09827159885526, 20.32038470169266], [96.09182818572225, 20.317520962622382], [96.08775866173289, 20.32038470169266], [96.08209785033557, 20.32806723311637], [96.07481966219768, 20.336962795296813], [96.06794581914431, 20.345858355678615], [96.07118056902812, 20.347475730620545], [96.07845875626663, 20.350710481403667], [96.08573694260588, 20.351923512160397], [96.09544119225728, 20.35273219963136], [96.10433675443772, 20.354349574573234], [96.10999756673436, 20.357584325356356], [96.11848878472966, 20.359201699398966], [96.12536262778309, 20.362032105996946], [96.13223647173584, 20.36647988573816], [96.13991900226023, 20.368097260680088]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
