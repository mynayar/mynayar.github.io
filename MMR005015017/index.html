
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chaung-U</div><div class="name-mm">ချောင်းဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Gyi</div><div class="name-mm">ကုလားကြီး</div></div>
        <span class="pcode-badge">MMR005015017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.2221362397957, 21.93300683989378], [95.22337931959999, 21.92955416988906], [95.22471743975808, 21.925157489626486], [95.22471743975808, 21.920760900195432], [95.22586440002209, 21.916937790446696], [95.22586440002209, 21.914261550130504], [95.22391535960622, 21.911500529825616], [95.22335808031124, 21.911723460069652], [95.22187739962237, 21.910385970336336], [95.21788355987843, 21.911273549934435], [95.21027100020655, 21.910403609638934], [95.20265880026346, 21.91410098966901], [95.19896124036899, 21.921930810258743], [95.1946365598294, 21.925563750266917], [95.198108760411, 21.92682644968096], [95.20311095960318, 21.927913919791592], [95.21072352017438, 21.930088860012916], [95.21920547964925, 21.931611299821668], [95.2221362397957, 21.93300683989378]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
