
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyan Chi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyan Chi</div><div class="name-mm">ပျံချီ</div></div>
        <span class="pcode-badge">MMR018007009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2587169327403, 19.56211798026061], [96.2551159438458, 19.55887708980589], [96.25439574696622, 19.552755409134875], [96.25619624096379, 19.548794321800585], [96.2515940710096, 19.546223023373898], [96.24351795488974, 19.541634320767344], [96.24213669155512, 19.540890734319987], [96.24076473440505, 19.54714076263616], [96.23764441605704, 19.55815364817238], [96.23544183876993, 19.57008427297086], [96.23360635934608, 19.575407167706658], [96.23295942483765, 19.580970793867095], [96.23514331241398, 19.58349066366327], [96.24177544018448, 19.589754340090792], [96.24840756705561, 19.588648985162592], [96.25763663742094, 19.587324901622935], [96.25799673586073, 19.580122923833926], [96.25763663742094, 19.573641143823806], [96.25835683430051, 19.56895985871057], [96.2587169327403, 19.56211798026061]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
