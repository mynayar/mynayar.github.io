
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnan Gyi</div><div class="name-mm">နှမ်းကြီး</div></div>
        <span class="pcode-badge">MMR010007004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19342618636949, 22.019296148998137], [96.19342618636949, 22.01681903656936], [96.19342618636949, 22.014341924140524], [96.19549044702654, 22.012690516154464], [96.19590329879827, 22.0104198287122], [96.19714185501266, 22.00897484661192], [96.19796755855606, 22.00587845562626], [96.19776113267022, 22.003607769982636], [96.1973482808985, 22.00030495311114], [96.19466474258388, 22.00030495311114], [96.19032979628315, 22.00030495311114], [96.18351773575495, 22.00030495311114], [96.18145347599716, 22.000924230768703], [96.18073079519013, 22.003272945190304], [96.1806277715545, 22.003607769982636], [96.17924282099943, 22.003565802220066], [96.17934720171206, 22.00428342074332], [96.17972338542597, 22.007550273726224], [96.18019856381272, 22.011569494136893], [96.18045319425954, 22.013929072368853], [96.18104062422549, 22.013929072368853], [96.18289845809744, 22.013103367926135], [96.18308122821617, 22.013892431290742], [96.18402612610487, 22.017971783970722], [96.18702697941166, 22.021773262326235], [96.19053622216899, 22.020534705212526], [96.19342618636949, 22.019296148998137]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
