
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Wa Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Wa Kan</div><div class="name-mm">အဝကံ</div></div>
        <span class="pcode-badge">MMR012007044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.99145019517044, 20.16493999768278], [92.99227201544124, 20.167229353252083], [92.99303135081624, 20.170494498422443], [92.99341415623837, 20.172140560838272], [92.9931286205894, 20.176138055426975], [92.99340905528373, 20.179943953051065], [92.99352837013822, 20.181563225562456], [92.99354731705512, 20.181662697775323], [92.99395885042065, 20.18382324164935], [92.99528136284465, 20.18930839656531], [93.0009986957333, 20.188839180683715], [93.00891860231172, 20.18834045984437], [93.01340652958771, 20.18809092585559], [93.01657475212318, 20.190583145096127], [93.02053528637441, 20.194570706672835], [93.0247595630035, 20.195567157298512], [93.0297755937687, 20.194818632673787], [93.03333964840613, 20.194568745251445], [93.03135899322302, 20.191578125330295], [93.02964236460349, 20.188338188156933], [93.0280576251593, 20.184101215798535], [93.02752879231997, 20.179240943115076], [93.02673618832449, 20.175377702918695], [93.02488784769605, 20.172137733369766], [93.02409548022229, 20.169146850846516], [93.02442512491962, 20.167152810154107], [93.01802381984345, 20.165034960694925], [93.01221669144724, 20.164287711308873], [93.00640960711775, 20.163291019664882], [92.99651129006406, 20.163789601109272], [92.99344385544964, 20.164674488137166], [92.99145019517044, 20.16493999768278]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
