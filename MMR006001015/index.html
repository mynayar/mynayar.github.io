
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Naing Dar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawei</div><div class="name-mm">ထားဝယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Naing Dar</div><div class="name-mm">ကနိုင်းဒါ</div></div>
        <span class="pcode-badge">MMR006001015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.20420037974378, 14.035565204770421], [98.21019347984526, 14.037180120066523], [98.21560427971377, 14.038827029643755], [98.21795652037719, 14.039062289593062], [98.21991701635727, 14.040630686556995], [98.22030911987002, 14.040944370086663], [98.2217206840624, 14.041362678944552], [98.2266605998069, 14.042826539613145], [98.2285426803005, 14.048472780194686], [98.23249768462051, 14.055219856611131], [98.23254191957398, 14.055295319623326], [98.2330229534466, 14.055736337262204], [98.23536468013594, 14.057883269897047], [98.23700339958731, 14.058993509942582], [98.2403049601059, 14.060767544986277], [98.2403049601059, 14.057412749998491], [98.2403049601059, 14.053648679842752], [98.24171651980163, 14.04800244016053], [98.24406912019379, 14.03929791017049], [98.2445396400924, 14.034827970234687], [98.24558485195939, 14.028815327865118], [98.2423238400732, 14.030438939605403], [98.23536503986475, 14.031063720214547], [98.23418891998273, 14.030357940366684], [98.22948407982648, 14.026123260380189], [98.22195612027878, 14.025887819667219], [98.21748636020743, 14.026123079616468], [98.2139576399332, 14.02682877043145], [98.20784124008122, 14.03082809963712], [98.20420037974378, 14.035565204770421]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
