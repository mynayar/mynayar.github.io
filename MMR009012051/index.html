
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Zit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Zit</div><div class="name-mm">ညောင်ဇစ်</div></div>
        <span class="pcode-badge">MMR009012051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17089676907068, 19.41632803620996], [95.17610326815134, 19.406618618154766], [95.18023451710934, 19.400046178388493], [95.17986990407286, 19.399672449823754], [95.17517377385064, 19.398408107348303], [95.17313070661686, 19.397702320305882], [95.16523965208836, 19.39497631960154], [95.15386056711156, 19.39353135728635], [95.14464892740614, 19.392267013911635], [95.13700145155582, 19.38880175070028], [95.13308922169028, 19.387029022371507], [95.12189075655323, 19.385764679896113], [95.11269187642904, 19.384321717673174], [95.11268124194584, 19.384470587847375], [95.11285973758686, 19.38450033742066], [95.11322097906498, 19.401659274356064], [95.11289350443172, 19.404770281123604], [95.12177305238453, 19.406160803878038], [95.12847500172, 19.40542046668122], [95.13445803570983, 19.406595706127007], [95.14076158987552, 19.40819830430837], [95.14172314860446, 19.40841198412579], [95.14185120486928, 19.408609635326457], [95.17089676907068, 19.41632803620996]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
