
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Laung Ngauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lahe</div><div class="name-mm">လဟယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Laung Ngauk</div><div class="name-mm">လောင်ငေါက်</div></div>
        <span class="pcode-badge">MMR005036030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55254973338356, 26.12483165955348], [95.5436958044179, 26.114414313170073], [95.54312772156715, 26.113810678320192], [95.54151851966401, 26.11461528017111], [95.53328207960436, 26.1236004301158], [95.52878964042964, 26.136329310249494], [95.52354839963897, 26.145314370262042], [95.51906495997997, 26.153907479646534], [95.53967279966002, 26.153686529709603], [95.55590807979411, 26.152099649879005], [95.56549056034112, 26.151306119581818], [95.57744004032565, 26.14910444971065], [95.57884619959248, 26.148472649892938], [95.57888004018179, 26.14845438016556], [95.6004663602344, 26.14358384981489], [95.59265402696184, 26.139937607034994], [95.57447185489224, 26.134077387161767], [95.57442674669704, 26.134052478639035], [95.57242856642529, 26.129770658888845], [95.56762537371208, 26.126682893300938], [95.56255156869997, 26.12749470501666], [95.56244568072367, 26.127436261674177], [95.55696658813758, 26.125994204169217], [95.55254973338356, 26.12483165955348]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
