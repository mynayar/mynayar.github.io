
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bawt Lone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bawt Lone Gyi</div><div class="name-mm">ဘော့လုံးကြီး</div></div>
        <span class="pcode-badge">MMR010011013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.39864922358288, 22.9073215356604], [96.39819710021607, 22.913643975589025], [96.3963330898003, 22.916905992917293], [96.39167306555959, 22.919702007641604], [96.38468303009785, 22.920168010245504], [96.37862499894459, 22.920168010245504], [96.37349897209992, 22.922032019761957], [96.36744094094672, 22.922032019761957], [96.36324691930992, 22.923512263380303], [96.36324691930992, 22.929954061330932], [96.36152972231889, 22.938254454879257], [96.3682787232845, 22.936567205312315], [96.3761525557959, 22.936567205312315], [96.37896463960647, 22.930380620569224], [96.3868384739165, 22.926443704313556], [96.39077539107149, 22.924756453847294], [96.39977405782656, 22.925318870969193], [96.40933514170348, 22.925318870969193], [96.41664655889161, 22.924194036725453], [96.41833380935788, 22.920819536692306], [96.41954898679637, 22.91595882513974], [96.42002105892476, 22.914070536626014], [96.41833380935788, 22.909571203248504], [96.41327205885847, 22.905071868971618], [96.40877272458164, 22.902259786060313], [96.40314855785971, 22.90563428609346], [96.39864922358288, 22.9073215356604]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
