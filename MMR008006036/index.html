
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Pin Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Pin Zin</div><div class="name-mm">ရှားပင်ဇင်း</div></div>
        <span class="pcode-badge">MMR008006036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14849615517346, 18.54981159642807], [95.14934753795859, 18.546973655310012], [95.14877994883562, 18.542149155858908], [95.14934753795859, 18.535054304412654], [95.14480683216965, 18.53335153974183], [95.1428202738366, 18.53335153974183], [95.13430645228101, 18.533067746079666], [95.1294819528299, 18.532783952417503], [95.12721159993544, 18.52966221673796], [95.12752960470755, 18.525477614600277], [95.12522504160245, 18.527959452966456], [95.12380607059373, 18.52881083485221], [95.12210330682223, 18.531648775970268], [95.12096813127431, 18.533635334303312], [95.12011674938856, 18.53477050985117], [95.11954916026559, 18.538176039192876], [95.11642742638469, 18.540446392087347], [95.11330569070515, 18.543284332306143], [95.12040054305066, 18.543284332306143], [95.1314685111629, 18.544135715091215], [95.13430645228101, 18.548676419980836], [95.13827956894698, 18.54981159642807], [95.14849615517346, 18.54981159642807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
