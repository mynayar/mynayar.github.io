
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khar Tet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khar Tet Kone</div><div class="name-mm">ခါးတက်ကုန်း</div></div>
        <span class="pcode-badge">MMR010018028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44948933706331, 21.105911693669782], [95.44272382184698, 21.10406655282918], [95.44001668442252, 21.103916155606157], [95.43962994986236, 21.103894671701767], [95.43962994986236, 21.112187966901217], [95.43537587689525, 21.122243050176678], [95.4338289413526, 21.12456345394031], [95.42532079272047, 21.119922646413045], [95.41758611410796, 21.11760224175009], [95.4055973607297, 21.11566857164729], [95.40122851538376, 21.113098662673167], [95.40405042518705, 21.12069611373471], [95.4079177653926, 21.127270591364777], [95.40985143459608, 21.13577873909759], [95.40952061088757, 21.137432861237585], [95.41752008318537, 21.138160085419656], [95.43187649160689, 21.138698451072685], [95.44013142802305, 21.141569732757034], [95.45016542129724, 21.14430627621374], [95.45161870324063, 21.135005270876604], [95.45316563878328, 21.127657325025552], [95.45200543690146, 21.114508369765474], [95.44948933706331, 21.105911693669782]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
