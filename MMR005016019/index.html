
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Gyi (Htan Taw Gyi)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Gyi (Htan Taw Gyi)</div><div class="name-mm">ဆည်ကြီး (ထန်းတောကြီး)</div></div>
        <span class="pcode-badge">MMR005016019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0509720797977, 22.185003689568646], [95.05343483994596, 22.175504819891557], [95.05780056014777, 22.173594659865728], [95.05394747959258, 22.166273789903528], [95.05035792018191, 22.157042759915498], [95.04956612467697, 22.15071038877346], [95.04843649434878, 22.15062671315235], [95.0413383855581, 22.151152497289957], [95.03502895971877, 22.145105963969115], [95.03100963678537, 22.143096302052754], [95.03138303979551, 22.148324640270005], [95.02471619999267, 22.152427289887555], [95.01651071999379, 22.15447856973026], [95.01189516003365, 22.162683959796937], [95.0134402798451, 22.164670349956737], [95.02112627995393, 22.16370959971829], [95.03189568034145, 22.16832506974623], [95.0272801203813, 22.179607470408484], [95.0269366800838, 22.180180049869477], [95.03548560038018, 22.183197299615756], [95.04676800014317, 22.18371012002609], [95.0509720797977, 22.185003689568646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
