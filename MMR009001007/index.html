
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pyar</div><div class="name-mm">ကန်ပြား</div></div>
        <span class="pcode-badge">MMR009001007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03858628293068, 20.20042567630395], [95.03421673341558, 20.197674478394504], [95.02861677194653, 20.197324481139958], [95.021266822406, 20.19137452061767], [95.01496686462917, 20.18962453344551], [95.00435552728584, 20.18299244704383], [95.00376694169108, 20.18262458115953], [94.99956697103892, 20.1836745738226], [94.99942590787941, 20.183905917224365], [94.99124385701845, 20.197324481139958], [94.99081703068146, 20.198024475649106], [94.99431700682447, 20.201524451792068], [94.99991696829352, 20.204674429781164], [95.00376694169108, 20.204674429781164], [95.00446693709955, 20.208174405924126], [95.00376694169108, 20.21447436280164], [95.00551692976256, 20.217624341690055], [95.01083009563246, 20.222937507559948], [95.01536257172535, 20.222588855691185], [95.02196897888535, 20.221003317649036], [95.02883449781388, 20.22151187527288], [95.02966676460954, 20.220074325170003], [95.03456673067012, 20.212724374730158], [95.03526672607859, 20.208524404078048], [95.03736671230399, 20.200474459129055], [95.03858628293068, 20.20042567630395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
