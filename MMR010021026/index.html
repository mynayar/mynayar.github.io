
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sat Pyar Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sat Pyar Kyin</div><div class="name-mm">ဆပ်ပျာကျင်း</div></div>
        <span class="pcode-badge">MMR010021026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61964122556219, 21.87611153012307], [95.62198659270717, 21.87405933387123], [95.62286610538649, 21.872300310311118], [95.6246500806368, 21.870241876361547], [95.62286610538649, 21.868782259593672], [95.62052073914083, 21.86643689334801], [95.62022756824774, 21.862039330850507], [95.62022756824774, 21.85734859656054], [95.62198659270717, 21.851192009603608], [95.62345244717278, 21.846208106219194], [95.6199343973546, 21.8441559099673], [95.61612317574401, 21.83946517657671], [95.61524366396395, 21.837412981224134], [95.61201878503897, 21.84005151836294], [95.60879390611393, 21.84269005640101], [95.60615536807586, 21.847380788892337], [95.60498268540266, 21.85295103496236], [95.60410317182397, 21.85734859656054], [95.60674170986209, 21.86145298906422], [95.60762122164215, 21.86438469709617], [95.60879390611393, 21.868489088700528], [95.60908707610776, 21.871713967625567], [95.61055293057336, 21.873179822091174], [95.61495049307086, 21.87611153012307], [95.61670951842962, 21.876404701016213], [95.61964122556219, 21.87611153012307]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
