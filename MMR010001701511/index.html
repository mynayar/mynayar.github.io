
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyi Gyi Yan Lon Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aungmyaythazan</div><div class="name-mm">အောင်မြေသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pyi Gyi Yan Lon Ward</div><div class="name-mm">ပြည်ကြီးရန်လုံရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010001701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07417396272976, 22.004656828487512], [96.07417414539688, 22.004668846076036], [96.07410951591663, 22.005945348524836], [96.07789539209305, 22.00584574710829], [96.08082859301472, 22.005802511268296], [96.08147186409569, 22.00571725157436], [96.08165677871915, 22.006441768252937], [96.08235368271615, 22.0063013390219], [96.08321640571964, 22.006230341153607], [96.08312692179234, 22.00584690777882], [96.08263639952494, 22.004014586858354], [96.0824251167213, 22.00322535071761], [96.08115719327968, 21.998862296722653], [96.08090463405061, 21.998130406875454], [96.08048775469216, 21.996922334728993], [96.07992665339468, 21.99701534905811], [96.07847138510033, 21.99717568860731], [96.07833249091821, 21.997205452540857], [96.07789003059558, 21.997240550578837], [96.07729803752943, 21.997262234005024], [96.076921735329, 21.997255522552674], [96.07647078737698, 21.99732986976053], [96.07619994329784, 21.997425340109796], [96.07381426442606, 21.997393191368676], [96.07378966133706, 21.997393079755437], [96.07389693278974, 21.998526366139114], [96.07400433019485, 22.000779109725197], [96.0741632525192, 22.00395220850048], [96.07417396272976, 22.004656828487512]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
