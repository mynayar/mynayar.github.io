
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doke Kan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doke Kan Chaung</div><div class="name-mm">ဒုက္ကံချောင်း</div></div>
        <span class="pcode-badge">MMR012004063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.01516616558615, 20.685240016413672], [93.01174347088454, 20.685990967409282], [92.99878361517176, 20.688100711278878], [92.99034463969343, 20.688552798672788], [92.98326192819547, 20.688251407076848], [92.97934383205228, 20.692772287311243], [92.97482295181783, 20.69578620596866], [92.97723408818268, 20.703923789851046], [92.97949452785025, 20.710554413955094], [92.98398122755168, 20.71676676697274], [92.98831697065174, 20.715585497572704], [92.99479677035475, 20.714115292187046], [92.99737795862598, 20.713529643778088], [93.00477923607292, 20.711641504551835], [93.00593026576922, 20.711296887941103], [93.00940851339226, 20.710255505387295], [93.01042564212975, 20.709545880937696], [93.012682651783, 20.70797122289366], [93.01481464757796, 20.704620941603196], [93.01572836057545, 20.700889946713744], [93.0160213003428, 20.69595452937807], [93.01613362296837, 20.691183404690435], [93.01521990997094, 20.685586911906512], [93.01516616558615, 20.685240016413672]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
