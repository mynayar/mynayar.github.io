
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Myaing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Gyi Myaing Ward</div><div class="name-mm">မကျည်းမြိုင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012001701524</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.87911713564733, 20.139366460493818], [92.87942889912443, 20.138949500618992], [92.87783850114596, 20.138053933242475], [92.87748182462656, 20.139560728444906], [92.87584458725797, 20.139422437895234], [92.87507584497433, 20.13775897899376], [92.87184777795267, 20.137699864756996], [92.87229060592676, 20.1397457756471], [92.87317623669401, 20.142745232306652], [92.87361152565143, 20.143463265417438], [92.87321620616302, 20.143719071278156], [92.87319331751763, 20.1448064181817], [92.87335904458428, 20.14509126405062], [92.87388426934359, 20.145063736702127], [92.87390976602296, 20.14556281367294], [92.87390466686696, 20.14650112312836], [92.87387711163944, 20.14690134212327], [92.87381797941629, 20.147171340185253], [92.87363777596266, 20.147576719490075], [92.87643558573376, 20.14395481236477], [92.8779626588497, 20.14418801016859], [92.87839348267312, 20.14250436598377], [92.87911713564733, 20.139366460493818]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
