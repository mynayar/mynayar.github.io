
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se</div><div class="name-mm">ဆည်</div></div>
        <span class="pcode-badge">MMR010020037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.308807806635, 20.891983136312717], [95.31308961019744, 20.888618861571274], [95.31308961019744, 20.884494362924556], [95.31283704998992, 20.882642257734062], [95.31205848621022, 20.876932782222184], [95.31205848621022, 20.869371199721115], [95.31549556826593, 20.864215576187917], [95.31652669315241, 20.8590599517554], [95.31583927566209, 20.856653994586225], [95.31480815167492, 20.8508109535627], [95.31274075688049, 20.852741483232933], [95.30804821315456, 20.853679992337845], [95.30491985037088, 20.850864465922427], [95.30491985037088, 20.84742326677042], [95.30429417763423, 20.842417886676174], [95.29678610839227, 20.843043559412763], [95.29495683429053, 20.841945995311505], [95.29290482869493, 20.84468200097359], [95.28625948358837, 20.849228816756522], [95.28206242314235, 20.85307612186557], [95.27983388602507, 20.858546168171188], [95.28576283478708, 20.863289326641166], [95.29116175011472, 20.874087158195834], [95.29170164191731, 20.88596477335568], [95.29548088273663, 20.891363687784008], [95.30202706769506, 20.891161228807732], [95.308807806635, 20.891983136312717]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
