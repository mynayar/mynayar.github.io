
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Tan</div><div class="name-mm">အင်းတန်</div></div>
        <span class="pcode-badge">MMR014002032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.90502222689429, 20.150051071899497], [96.90503523199044, 20.155270710974605], [96.90458121105411, 20.16422786772199], [96.90435159704862, 20.168783290916167], [96.9036648252715, 20.181623056558863], [96.90081582519025, 20.195139221198133], [96.9008161219665, 20.195478172080016], [96.90116238343728, 20.20655985305484], [96.90160510619074, 20.220815168685135], [96.90163191857823, 20.231169027428734], [96.90164360167091, 20.23568065903521], [96.9015533097375, 20.236817531603833], [96.90248491025045, 20.235486675269897], [96.90658666594192, 20.214232121415307], [96.91628172632068, 20.197452210051495], [96.92485812540224, 20.173587447702573], [96.93641761887807, 20.161282179728857], [96.94080452440932, 20.15250837136432], [96.94126514906742, 20.151587121148793], [96.91814616031712, 20.15196000704873], [96.90502222689429, 20.150051071899497]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
