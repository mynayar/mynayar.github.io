
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Ke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Ke</div><div class="name-mm">ရင်းကဲ</div></div>
        <span class="pcode-badge">MMR009025018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.10963847593496, 21.035027356627268], [94.11387052810244, 21.03351590923188], [94.11824849796989, 21.027294583678156], [94.12354814523076, 21.02038200142829], [94.12356364504626, 21.020238621615135], [94.12331772543274, 21.020612420326984], [94.11755723857578, 21.013008577783694], [94.10949255913437, 21.007248091826], [94.09797158631972, 21.002639703059913], [94.09274571584217, 21.001511390238534], [94.09290235885686, 21.004252638948174], [94.09036774467575, 21.014851934369347], [94.08806355029265, 21.02314703360878], [94.08668103330308, 21.024299130800273], [94.08654992294066, 21.024361044626573], [94.08921564658488, 21.02982919785927], [94.09290235885686, 21.03351590923188], [94.09635865043145, 21.03466800642343], [94.10741878365002, 21.035820103614924], [94.10963847593496, 21.035027356627268]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
