
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Hson</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Hson</div><div class="name-mm">ကောင်းဆုံ</div></div>
        <span class="pcode-badge">MMR015019008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.20202710796474, 23.394389163129404], [97.20406291137431, 23.386754902816563], [97.21371968311695, 23.38330605582985], [97.22889461219665, 23.37020043620123], [97.2482081565812, 23.368820896866964], [97.25053542756797, 23.367889988831962], [97.26200354722596, 23.363302741328482], [97.28062732239306, 23.350197120800544], [97.30752833176717, 23.33985057894114], [97.3282214163853, 23.32812449774741], [97.33123262898272, 23.322854875252347], [97.31620710967042, 23.32003941358812], [97.30407948478046, 23.32812449774741], [97.29304317280423, 23.32812449774741], [97.28407617027909, 23.318467725105506], [97.26959101131615, 23.315018878118792], [97.25924446855743, 23.304672336259387], [97.25000998966937, 23.292195082836827], [97.2425535577006, 23.290485237803523], [97.23122724134419, 23.286505720662547], [97.21990092408845, 23.27732222074394], [97.21756449980188, 23.27640181139452], [97.21837034091857, 23.282526204420833], [97.21151910502272, 23.303353961616097], [97.21071742416984, 23.305791071300973], [97.21041422673522, 23.3258020498248], [97.21071742416984, 23.33793332236496], [97.21224800733972, 23.3495657553554], [97.21041130663656, 23.356300322202173], [97.20306450742112, 23.3740550887714], [97.20000334108141, 23.389667038902758], [97.20202710796474, 23.394389163129404]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
