
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Yet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Yet Kone</div><div class="name-mm">လက်ယက်ကုန်း</div></div>
        <span class="pcode-badge">MMR005010038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37731280014566, 22.65027992997483], [95.37347412043437, 22.65692139001021], [95.37670907986023, 22.666320809957483], [95.37731927976102, 22.667724630087662], [95.37725339992454, 22.667786999870202], [95.3804930403216, 22.676513670269742], [95.38909919976834, 22.68432621038636], [95.39491463969892, 22.685964570108865], [95.39514612879088, 22.6832365549231], [95.40066743375513, 22.681626175807423], [95.40626768840315, 22.679992766852763], [95.40677865261279, 22.679335814796048], [95.40817864792632, 22.679581633685473], [95.40907417033674, 22.67973893410459], [95.41151250309957, 22.678853467913257], [95.41991486268086, 22.67467534179366], [95.41888415957635, 22.671325709813686], [95.40869148002781, 22.669494659550935], [95.40551772036656, 22.663879379929483], [95.40167220041178, 22.6577148303752], [95.38610831994305, 22.6577148303752], [95.38067627988647, 22.65130611038876], [95.37731280014566, 22.65027992997483]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
