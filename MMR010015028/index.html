
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Shey</div><div class="name-mm">ရွာရှည်</div></div>
        <span class="pcode-badge">MMR010015028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19512768389558, 21.444492785113994], [96.19476642533033, 21.44192021504591], [96.19737768962875, 21.44161300573569], [96.20088054540093, 21.43896261373368], [96.20213941010576, 21.436851287956642], [96.20521148522192, 21.435622456111503], [96.20604591578643, 21.435205241728568], [96.20548981010671, 21.433375274249556], [96.20376931170443, 21.433476478556713], [96.19756864357811, 21.432787516031112], [96.19260810997633, 21.43388985733111], [96.189038607246, 21.434259116265252], [96.18861212355074, 21.434303235206187], [96.17938001977217, 21.43581895438132], [96.175108448696, 21.43705908710723], [96.17621078909667, 21.440090524558116], [96.1759352044462, 21.44298416968371], [96.17703754484688, 21.4467045696602], [96.18077457238866, 21.44476640474585], [96.18721497369216, 21.44476640474585], [96.19150857635975, 21.44476640474585], [96.1928386691693, 21.445844649610933], [96.19415855377429, 21.44443702714716], [96.19512768389558, 21.444492785113994]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
