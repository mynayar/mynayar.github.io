
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nee Kaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nee Kaik</div><div class="name-mm">အနီးကိုက်</div></div>
        <span class="pcode-badge">MMR007002038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65424819080141, 17.181392754272224], [96.65252103291937, 17.18206442733151], [96.64926503925022, 17.184545183813213], [96.64724107631469, 17.18608725042634], [96.64718029383556, 17.186133560115763], [96.64709111526281, 17.18614994306546], [96.64706661773027, 17.18612112339116], [96.64274360273515, 17.181035224296238], [96.63939869309525, 17.172029696613265], [96.63558360799715, 17.167990192893114], [96.63537047406817, 17.167764522414814], [96.63502458311808, 17.16739828430343], [96.63423988776066, 17.180443824722772], [96.63344222867596, 17.187623119811178], [96.63344222867596, 17.193404051855566], [96.63199699476553, 17.199546292827222], [96.63176825310245, 17.204557819787624], [96.63777792770924, 17.202436758849387], [96.64500409276474, 17.20063021691101], [96.64933979179801, 17.201352833866224], [96.65096505919018, 17.201161626308078], [96.65548203276967, 17.20063021691101], [96.65403679975856, 17.197017134832947], [96.65367549083129, 17.189429660850237], [96.65394877411671, 17.184784898104624], [96.65424819080141, 17.181392754272224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
