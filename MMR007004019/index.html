
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar Pyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yar Pyo</div><div class="name-mm">ဘုရားပျို</div></div>
        <span class="pcode-badge">MMR007004019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.73286017555671, 17.445206752289835], [96.73022643270377, 17.434671779978714], [96.72873842703683, 17.434090965425753], [96.72110235099274, 17.426904070166756], [96.71772707664331, 17.42322195343047], [96.71661054134347, 17.42555652691226], [96.71077118933897, 17.422412259618113], [96.69999084600079, 17.41702208929803], [96.6896596834477, 17.412530278749387], [96.68157442571925, 17.412081097964347], [96.67843015932448, 17.412081097964347], [96.67843015932448, 17.41702208929803], [96.67124326406542, 17.421513898048033], [96.66462913442706, 17.42391903683415], [96.66854817755643, 17.426454889381716], [96.67125487611168, 17.42787946766333], [96.67708261606992, 17.430946699030983], [96.68471869301334, 17.43498932699589], [96.69280394984247, 17.439930318329573], [96.6968465787067, 17.443074584724343], [96.70672855957542, 17.443074584724343], [96.71526299808897, 17.443074584724343], [96.72514497985702, 17.444871308763936], [96.73286017555671, 17.445206752289835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
