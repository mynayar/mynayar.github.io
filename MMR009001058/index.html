
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Kyun</div><div class="name-mm">ဇီးကျွန်း</div></div>
        <span class="pcode-badge">MMR009001058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00927590435958, 20.111337069050535], [95.00866690775166, 20.110525074772454], [95.01566686003764, 20.110175076618532], [95.02441680129442, 20.1126250609978], [95.03001676186415, 20.111925064690013], [95.03131381178304, 20.111204482001312], [95.03176674993563, 20.10667510137489], [95.03386673616103, 20.103525123385793], [95.038416704967, 20.097575163762826], [95.03981669488462, 20.08847522615082], [95.03936169818388, 20.088125227996898], [95.03526672607859, 20.084975250007858], [95.02856720671127, 20.08174955539772], [95.02581679121198, 20.080425281201826], [95.01706685085452, 20.080075283947224], [95.01470436691307, 20.07771280000577], [95.01356687471156, 20.081125275710974], [95.01041689582314, 20.08672523807934], [95.00341694443648, 20.08847522615082], [94.99897775501944, 20.091899743778185], [94.99890095921194, 20.092437317128542], [94.9985169783759, 20.095125181182198], [95.00009197186705, 20.098275168164548], [95.001666956365, 20.10142513716039], [95.00463165512684, 20.105872183954205], [95.00586692791643, 20.107725094037903], [95.00606021021059, 20.109561274932958], [95.00621692517103, 20.109475082109384], [95.00927590435958, 20.111337069050535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
