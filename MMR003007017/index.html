
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Win Yaw Seik Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyainseikgyi</div><div class="name-mm">ကြာအင်းဆိပ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Win Yaw Seik Gyi</div><div class="name-mm">ဝင်းရော်ဆိပ်ကြီး</div></div>
        <span class="pcode-badge">MMR003007017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.98017000044524, 15.907760999770346], [97.97706999958086, 15.912647000258914], [97.9700939998383, 15.936050000307318], [97.96802699984624, 15.945051999949897], [97.9667349996206, 15.949938000438408], [97.96492599983509, 15.95713899976505], [97.96105100010362, 15.962538999675132], [97.95975899987798, 15.967939999631312], [97.95588300010041, 15.974626000389662], [97.95381600010836, 15.980283999606968], [97.95355799990182, 15.98671400025097], [97.95459099987482, 15.992629999674818], [97.95691700011952, 15.997517000209427], [97.96027500029106, 15.999831999946878], [97.9700939998383, 16.001891999616134], [97.9788780002196, 16.003693999978168], [97.98330912091927, 15.99036350217392], [97.98650278977198, 15.979185660290057], [97.98969645862473, 15.966410983080436], [97.99182557209252, 15.955233141196572], [97.99289012927608, 15.944587576555477], [97.99182557209252, 15.933942012813702], [97.98969645862473, 15.923296449071927], [97.98809962509768, 15.91477999789862], [97.98017000044524, 15.907760999770346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
