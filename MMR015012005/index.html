
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Pying</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Pying</div><div class="name-mm">နားပြိန်း</div></div>
        <span class="pcode-badge">MMR015012005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.06990328061198, 22.520774916729067], [97.07967436607919, 22.521101140405335], [97.09633059278269, 22.51991141018351], [97.1163180657262, 22.51681811106704], [97.1455737888993, 22.50347879990676], [97.1470187206375, 22.5019943960246], [97.13392607732669, 22.48112619541763], [97.12060109506456, 22.47517754340896], [97.1156670312086, 22.473742179557973], [97.10751405992596, 22.47137040561978], [97.09656853900691, 22.47065656694707], [97.07494798086469, 22.464562538630332], [97.07386697418156, 22.469607238883043], [97.07422731004237, 22.473931268313436], [97.07422731004237, 22.480777647870184], [97.07688323287493, 22.489733234401285], [97.07819100271269, 22.496272085388455], [97.07638932430791, 22.505640815071615], [97.0731463033593, 22.51392853717232], [97.07075737755099, 22.518651524748122], [97.06990328061198, 22.520774916729067]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
