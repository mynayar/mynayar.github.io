
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Baw Di Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maubin</div><div class="name-mm">မအူပင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Har Baw Di Ward</div><div class="name-mm">မဟာဗောဓဓိရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017019701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65038718202288, 16.73059627060144], [95.65033442689236, 16.73050092987404], [95.65022904163703, 16.73032675457614], [95.65013045525637, 16.730126534012356], [95.6492890756304, 16.729066012986152], [95.6490562087771, 16.728885324797943], [95.6487383532924, 16.72867370802527], [95.64830491513976, 16.72846860234415], [95.6482403240318, 16.7286134786292], [95.64797856196111, 16.728491392064143], [95.64795986415646, 16.728439301532603], [95.64797176218713, 16.72832372605916], [95.6479632635938, 16.728157687827093], [95.64798389404154, 16.7280983721422], [95.64718662526258, 16.728165424694623], [95.64137818745343, 16.728757337780962], [95.64080366995347, 16.728881052118936], [95.64193961082447, 16.73210831964326], [95.6433227105747, 16.731817651563404], [95.64440545654662, 16.73163045498154], [95.64497487578996, 16.731539297900326], [95.64605932148055, 16.73135372909138], [95.6474437747105, 16.731112814205062], [95.64940465919773, 16.73076789002613], [95.65038718202288, 16.73059627060144]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
