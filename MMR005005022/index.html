
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Paung Hle Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Paung Hle Kone</div><div class="name-mm">ပေါင်းလှဲကုန်း</div></div>
        <span class="pcode-badge">MMR005005022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.543517959886, 22.72930911022729], [95.55468767999247, 22.73052977982553], [95.56372079977513, 22.732116659656185], [95.57147231999164, 22.732727040320697], [95.57049564006178, 22.73950196964023], [95.57989488014465, 22.7401123503048], [95.58831780002652, 22.742492669601063], [95.59387223961221, 22.731689430422932], [95.59912104010397, 22.728271500329527], [95.60351556019498, 22.72930911022729], [95.5993006796827, 22.712979869825176], [95.59737634993866, 22.710327474133692], [95.59375200295261, 22.71294908423289], [95.59229484133391, 22.712488107040542], [95.58937656018014, 22.712472900404066], [95.58741563972006, 22.71471975041618], [95.58351360007265, 22.71560013004199], [95.57707543088651, 22.71406097813167], [95.57520867663919, 22.709860787145658], [95.57194186322647, 22.70636062844028], [95.56377482564773, 22.705893940552983], [95.56352981884612, 22.704423896145954], [95.56207272017997, 22.705688520109163], [95.55908220008354, 22.712524380295974], [95.56207272017997, 22.716491670254413], [95.55590807979411, 22.723083539873528], [95.543517959886, 22.72930911022729]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
