
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar</div><div class="name-mm">ကန်သာ</div></div>
        <span class="pcode-badge">MMR009023049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.12293067700921, 22.40231135868231], [94.12186940864638, 22.409103474945482], [94.11804884397901, 22.42311221175919], [94.11719983000819, 22.4303288350078], [94.11677532302281, 22.44179052900978], [94.12675124167652, 22.434149399675107], [94.13269434306955, 22.43499841364593], [94.13269434306955, 22.444337572720883], [94.16049956500297, 22.443488557850742], [94.20082774930125, 22.45134194157737], [94.21323278086822, 22.45424071193935], [94.22574704139288, 22.45716500685961], [94.22093218177486, 22.44803646810857], [94.21948348907182, 22.436999326058128], [94.21908155866709, 22.433937146182416], [94.21860262740938, 22.432500348812084], [94.2144119800289, 22.419928407570012], [94.21483648701434, 22.397854034436193], [94.21115607539264, 22.396601127739928], [94.20486056836057, 22.394457975854948], [94.18960977337241, 22.395860348076667], [94.18639450370347, 22.39615600469591], [94.1837026592504, 22.39454893328667], [94.17217351339701, 22.387665861390417], [94.16550941113047, 22.38487623724859], [94.16304660781475, 22.38384529582379], [94.15519322498739, 22.393184453999424], [94.14818885613084, 22.398490794914323], [94.14182124775243, 22.405282910278117], [94.13647976402996, 22.40858954297306], [94.12293067700921, 22.40231135868231]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
