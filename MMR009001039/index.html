
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoe Lay Lone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpoe Lay Lone</div><div class="name-mm">ဖိုးလေးလုံး</div></div>
        <span class="pcode-badge">MMR009001039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.20077447236406, 20.17950522688477], [95.19241564986243, 20.180524595833504], [95.1745657718929, 20.17912460501657], [95.14481597557688, 20.186474554557094], [95.14493353225674, 20.18770889834701], [95.14541764360945, 20.19279206979826], [95.14551597098534, 20.19382450499694], [95.14446597832227, 20.202224447200535], [95.15216592601672, 20.217624341690055], [95.1602158700664, 20.222874305904554], [95.16651582694391, 20.224624293976035], [95.17421577463836, 20.226374282047516], [95.18121419537886, 20.229873491968135], [95.18121834305214, 20.2293817336801], [95.18411553600322, 20.226242343409467], [95.20749873657746, 20.226086089801242], [95.21211563382951, 20.226055238558445], [95.2106210649103, 20.219827862366003], [95.20974672513131, 20.215164714779803], [95.20741514998923, 20.212250245852204], [95.20479212795442, 20.207587099165323], [95.20362634398066, 20.20379829315675], [95.20391778997407, 20.1982608048923], [95.20391778997407, 20.18980884859951], [95.20158621573131, 20.185728593000192], [95.20077447236406, 20.17950522688477]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
