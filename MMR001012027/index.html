
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sein Long Kaji</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sein Long Kaji</div><div class="name-mm">စိန်လုံကဂျီ</div></div>
        <span class="pcode-badge">MMR001012027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.60329993114698, 24.276973235026844], [97.58026976843513, 24.28228788837538], [97.5539391810484, 24.283416342390353], [97.54039773556713, 24.283416342390353], [97.529113199015, 24.288682459328072], [97.5230947794006, 24.296957786972314], [97.52187228777592, 24.30372850926335], [97.5238470811779, 24.30372850926335], [97.53889313111318, 24.303352357925007], [97.54528770206588, 24.30410465970232], [97.55770069263292, 24.30824232442376], [97.57048983633695, 24.309370778438733], [97.57312289390649, 24.30222390391009], [97.57989361709679, 24.2988385427646], [97.58628818804948, 24.296581634734707], [97.59155430498726, 24.29470087894248], [97.59832502817756, 24.289810913343047], [97.60396729735294, 24.290187063782014], [97.60682522860145, 24.291774804263866], [97.60547190180688, 24.286801702636524], [97.60246269199968, 24.28115943436046], [97.60329993114698, 24.276973235026844]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
