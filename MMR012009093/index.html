
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Leik Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Leik Ya</div><div class="name-mm">လိပ်ရ</div></div>
        <span class="pcode-badge">MMR012009093</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.24293645225555, 21.08956945536613], [92.23899862408729, 21.091924334640396], [92.23651873275338, 21.094044207574143], [92.2344057711095, 21.09667113356602], [92.23212148861586, 21.101582341152152], [92.22789683696953, 21.111488779983233], [92.22703420096764, 21.114978706202407], [92.2261716459048, 21.116733558706812], [92.22501165896097, 21.118309952442416], [92.22430419917953, 21.118713379319047], [92.21956159199391, 21.120810109998615], [92.21846499556318, 21.12132360130323], [92.22036285016549, 21.122097451736067], [92.22350373870665, 21.124762447828743], [92.22573091425033, 21.12627578469977], [92.22835783934289, 21.127646354195917], [92.2304165134114, 21.128028265691967], [92.23224111913242, 21.12787478289499], [92.23749496931742, 21.12627578469977], [92.24263460470331, 21.127760568995086], [92.24502838415265, 21.13034745267288], [92.26236383462333, 21.13145006107152], [92.26254878919531, 21.13125189455934], [92.26544684639492, 21.119804572622968], [92.26599836463288, 21.114357337621072], [92.26739838063082, 21.11264620565794], [92.2655294347357, 21.11106928312097], [92.26494243014906, 21.110573997691915], [92.2645466223288, 21.11024003355078], [92.25257670525082, 21.10079009958349], [92.24863923321408, 21.09779762076363], [92.24422926366964, 21.09071017073785], [92.24293645225555, 21.08956945536613]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
