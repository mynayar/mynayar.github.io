
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Laung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Laung</div><div class="name-mm">ကွမ်းလောင်း</div></div>
        <span class="pcode-badge">MMR009016032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1743568863613, 19.143048780676736], [95.18068346766796, 19.142297060760768], [95.18067279901055, 19.1421382386888], [95.19740974616292, 19.141153712174116], [95.21817447886917, 19.139287219629523], [95.22447389165683, 19.13485429938646], [95.23287310990617, 19.122722095148617], [95.23318519084393, 19.1224446902703], [95.23263979878772, 19.120388978568542], [95.23100661826089, 19.11432287689928], [95.22587376196458, 19.106156970667712], [95.21584136318842, 19.100557492134612], [95.20697552180297, 19.10009086899845], [95.20511902342423, 19.099767999793414], [95.20464240612222, 19.101257427288488], [95.19017708620362, 19.101257427288488], [95.18284321114533, 19.10174635271204], [95.1796780642913, 19.101957362442363], [95.17946471362569, 19.102092109663204], [95.17524514314891, 19.10475710125928], [95.16729030600288, 19.111651294171963], [95.1606166142654, 19.116650659600282], [95.16875871634176, 19.13094841513731], [95.1743568863613, 19.143048780676736]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
