
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Chaung</div><div class="name-mm">မကျီးချောင်</div></div>
        <span class="pcode-badge">MMR017007028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13584496027676, 16.95364469994297], [95.13670932027895, 16.956755280431878], [95.13686303959764, 16.959541319876053], [95.13730187997783, 16.967485170004636], [95.13887652003541, 16.967111040342274], [95.14146995977086, 16.966458090268702], [95.14434204005317, 16.96580216973439], [95.14447794020481, 16.965499094607594], [95.14470456036724, 16.964993879763767], [95.14785312012543, 16.964156160378536], [95.15062007955311, 16.962428610392124], [95.15116763987476, 16.9615736096344], [95.1517152001964, 16.960718609776052], [95.15261735960354, 16.958384910435313], [95.15240819977868, 16.956331109792927], [95.15173176031254, 16.954014150432727], [95.15153268008919, 16.952854140106524], [95.15122344010973, 16.950175649686514], [95.14970928035905, 16.94768858985657], [95.14877580026302, 16.947296189567567], [95.1478426798958, 16.946903790177828], [95.14625796023671, 16.946384039591806], [95.1450505196658, 16.946396729925198], [95.14246968033154, 16.948122299604506], [95.1406315200287, 16.949840039786068], [95.13815760019315, 16.952815890141267], [95.13584496027676, 16.95364469994297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
