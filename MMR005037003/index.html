
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Man Chaung Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Man Chaung Son</div><div class="name-mm">သမန်းချောင်းစုံ</div></div>
        <span class="pcode-badge">MMR005037003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12811295964542, 27.036428759979344], [96.12811295964542, 27.02532959978123], [96.12512207982019, 27.007873560116764], [96.11950680019874, 27.006713910418682], [96.09832764010855, 27.002075219895517], [96.08331312040423, 26.99230958971583], [96.07507308035844, 26.986877459727054], [96.04827863974748, 26.967712409600097], [96.04187028038916, 26.975280780183937], [96.0316772402125, 26.9904785403524], [96.01507583977826, 27.002929680160662], [95.99670396021963, 27.02270511005281], [96.00653088009608, 27.033081030065546], [96.0123902546066, 27.03507571557185], [96.02948015958174, 27.040893570182163], [96.03668666635662, 27.045217525868168], [96.04687500038102, 27.0513306000272], [96.04930932036888, 27.057294000018146], [96.05712887969412, 27.053527859623102], [96.08392332030508, 27.041320800314736], [96.10552979956066, 27.039916980184557], [96.12591552018517, 27.034729019728502], [96.12811295964542, 27.036428759979344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
