
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kan (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kan (North)</div><div class="name-mm">သရက်ကန် (မြောက်)</div></div>
        <span class="pcode-badge">MMR010009075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1340208094129, 22.085798162555193], [96.13338252368459, 22.07675141174832], [96.12894657902149, 22.07675141264764], [96.12323061939765, 22.07714561697668], [96.11968278133537, 22.07675141264764], [96.11574073984332, 22.073991984142822], [96.11239000529457, 22.0706412486947], [96.10746245342955, 22.0706412486947], [96.10411171798148, 22.073991984142822], [96.10214069723543, 22.078131128249026], [96.0956363289535, 22.077539822205097], [96.09169428656213, 22.074189085857654], [96.0901174710445, 22.081087659368052], [96.0891319597722, 22.088380436308114], [96.09327110387841, 22.08936594578182], [96.1015493911915, 22.08936594578182], [96.11022188193436, 22.089168844066933], [96.11850016924745, 22.087394925035824], [96.12677845566128, 22.086212312947907], [96.1332828239432, 22.085818108618867], [96.1340208094129, 22.085798162555193]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
