
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thing Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thing Len</div><div class="name-mm">သိန်လင်</div></div>
        <span class="pcode-badge">MMR001010023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.26610438021305, 24.160941227056014], [97.25388731504762, 24.16561245684943], [97.24993309133913, 24.1732572895923], [97.24624248230475, 24.177211514200053], [97.23807041931445, 24.17984766363884], [97.23174365994203, 24.186438036786], [97.23174365994203, 24.19118310631535], [97.23358896535854, 24.193292024607274], [97.23780680374108, 24.193292024607274], [97.23938849268484, 24.19592817494538], [97.23881287801197, 24.19823063363691], [97.24914224641759, 24.19671901986692], [97.25968684327324, 24.19513733002384], [97.26385114771233, 24.194892370886237], [97.26337745230762, 24.19039226139381], [97.26311383673425, 24.185383577190407], [97.26469552657733, 24.17984766363884], [97.26759529069017, 24.171675600648484], [97.26825147922244, 24.168504030836402], [97.26807173802035, 24.16838419077783], [97.2678472969153, 24.16823454808599], [97.26638259268259, 24.162081821918605], [97.26610438021305, 24.160941227056014]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
