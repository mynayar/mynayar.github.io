
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Kone</div><div class="name-mm">ကျောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR008006025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.16616974263957, 18.58838528615206], [95.16114886003191, 18.58838528615206], [95.15051640300965, 18.58808993979892], [95.14992571120268, 18.586908556184994], [95.15199313387609, 18.582773710838126], [95.1555372856173, 18.575980752809528], [95.1555372856173, 18.572141254715177], [95.15199313387609, 18.572141254715177], [95.14579086675514, 18.571255216555073], [95.14520017494817, 18.56889244842779], [95.14136067685382, 18.567415717561346], [95.13486306427905, 18.56652968030056], [95.12511664631626, 18.5656436421404], [95.12245853183583, 18.5656436421404], [95.11596091926106, 18.57332263922848], [95.11832368738834, 18.575980752809528], [95.11596091926106, 18.580115597257077], [95.11684695742122, 18.58425044080525], [95.11802834103514, 18.587499247991957], [95.12866079805747, 18.58868063160594], [95.13013752802453, 18.590452707926204], [95.13309098795878, 18.59901774227501], [95.13374130661606, 18.599915801672978], [95.13929325507974, 18.60758277662387], [95.14460948314121, 18.612308312878383], [95.15140244206913, 18.601380511301613], [95.16262558999904, 18.601675856755435], [95.16616974263957, 18.58838528615206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
