
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Khun Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Khun Taing</div><div class="name-mm">တခွန်တိုင်</div></div>
        <span class="pcode-badge">MMR009006002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38026835010436, 20.340690869188336], [95.3799457138237, 20.33536736471217], [95.37895680401334, 20.31905035419055], [95.37895680401334, 20.295810974996527], [95.37810832873646, 20.28885347610708], [95.37760687485746, 20.284741556277822], [95.37589902362112, 20.28466392589951], [95.37181480291088, 20.28447827884952], [95.36812565707345, 20.285329621165147], [95.36472029320703, 20.286464741854388], [95.36103115006756, 20.285045840992836], [95.35592310336858, 20.28192425729867], [95.35053127559797, 20.28220803657166], [95.34372054606638, 20.28192425729867], [95.3386124993674, 20.27851889073429], [95.33324291542829, 20.277549159865885], [95.32726128617946, 20.28220803657166], [95.32434063980872, 20.281883519808616], [95.3211055832561, 20.29877770442755], [95.31616103420441, 20.310644621252322], [95.31220539496309, 20.323005993431877], [95.3201166734458, 20.32646717731842], [95.3240723117878, 20.332400636180466], [95.3239234506068, 20.334856843868295], [95.33742259377772, 20.333389545990826], [95.36956216126481, 20.337345185232152], [95.38026835010436, 20.340690869188336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
