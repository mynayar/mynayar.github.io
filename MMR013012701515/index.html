
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Dar Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">North Okkalapa</div><div class="name-mm">မြောက်ဥက္ကလာပ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ta Dar Gyi Ward</div><div class="name-mm">တံတားကြီးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013012701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15111530542708, 16.898120319397265], [96.1518982480058, 16.89547920210356], [96.15228080791303, 16.893552781435744], [96.15261333493754, 16.89192453998561], [96.15210929910495, 16.89181089535657], [96.15191656269928, 16.891739511669186], [96.15165244260618, 16.891689542638346], [96.15104670334273, 16.8915256672758], [96.15084266695555, 16.892206192361925], [96.15060997007413, 16.892961502371463], [96.15038299557887, 16.893709183432122], [96.15023231506933, 16.894292831748828], [96.1500225068333, 16.895011901777877], [96.14977073712987, 16.89584286995256], [96.14953041040019, 16.896612167117894], [96.14932250962619, 16.897298812989902], [96.14921786001628, 16.897743097865714], [96.1490917202068, 16.898073196720702], [96.14875030518249, 16.899112700590706], [96.14855194081946, 16.899780273640772], [96.14836120630468, 16.900381088216704], [96.14811134316403, 16.901258468603487], [96.1477527618805, 16.902452468806416], [96.14743995698848, 16.90346145598147], [96.14727070637804, 16.90412834284882], [96.148921251015, 16.904238223815014], [96.15111530542708, 16.898120319397265]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
