
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Myanmar (2)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Myanmar (2)</div><div class="name-mm">အောင်မြန်မာ (၂)</div></div>
        <span class="pcode-badge">MMR008012075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75684999962783, 18.601009692943023], [95.76591806436721, 18.61578960560587], [95.76806361564343, 18.619946612046533], [95.7709107442355, 18.625462923974794], [95.77147221257263, 18.62520997705883], [95.77204328387052, 18.624962513309413], [95.7729760319184, 18.62488637040974], [95.77366131711614, 18.62490540635946], [95.77449888721395, 18.624924441409917], [95.77505092256206, 18.6240868713121], [95.77649763495793, 18.623763264663012], [95.77868673860218, 18.625171906058654], [95.78114234284493, 18.62501962025931], [95.78373119603793, 18.62507672720926], [95.78618680028069, 18.625229013008607], [95.79562850095459, 18.625343226908456], [95.79875035354604, 18.6257239405075], [95.80358541913182, 18.62578104745745], [95.81299437728876, 18.626950699415318], [95.81566229707738, 18.619280429348407], [95.81348053190106, 18.61273513561804], [95.80431712103837, 18.60531713617695], [95.79471735732022, 18.60400807671141], [95.77377241666375, 18.59397196013788], [95.76897253525436, 18.59397196013788], [95.75893641778151, 18.597462783880417], [95.75684999962783, 18.601009692943023]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
