
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Gyi</div><div class="name-mm">စမ်းကြီး</div></div>
        <span class="pcode-badge">MMR007005029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.64148046355263, 17.96669672877107], [96.644388550891, 17.962466783715172], [96.6472966382293, 17.960351811187195], [96.64808975214044, 17.957443723848826], [96.64857244436286, 17.954064884586785], [96.64984606604315, 17.953923371766223], [96.64373894269812, 17.94330228667127], [96.63796969734369, 17.940555026893037], [96.62842800105147, 17.93616584697628], [96.62842979070234, 17.938496622621074], [96.62843070711148, 17.939689593100297], [96.62843088157996, 17.939916212363357], [96.62742892980134, 17.940684627293763], [96.62607294281213, 17.941724560140415], [96.62465497274883, 17.942178095442785], [96.62371244637234, 17.943532899823538], [96.62088147500015, 17.943986724707656], [96.61993893423448, 17.945344065176528], [96.61994279682267, 17.951215708238408], [96.61616647880004, 17.952122931727956], [96.61556396630408, 17.953469744732956], [96.61763414989616, 17.953742522599384], [96.61959572955931, 17.953350206846608], [96.61927325335802, 17.95532875222017], [96.61980199716447, 17.958236838659218], [96.621388225886, 17.961673668904723], [96.62271008360352, 17.963259899424884], [96.62535379903863, 17.965374871053484], [96.62680784270782, 17.966167985863933], [96.63275620333616, 17.965374871053484], [96.63857237711358, 17.965903613960677], [96.64148046355263, 17.96669672877107]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
