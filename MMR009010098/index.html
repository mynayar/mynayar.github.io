
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Taw</div><div class="name-mm">ကန်တော်</div></div>
        <span class="pcode-badge">MMR009010098</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.67502321035295, 20.733943890897876], [94.66946259602207, 20.7314906788518], [94.66681260331904, 20.73436150637849], [94.66261678034022, 20.734140673353465], [94.64362515997323, 20.73347817427839], [94.62927102863512, 20.730165683399605], [94.61593048360498, 20.728217063866452], [94.60961691099169, 20.72729485587297], [94.601004432009, 20.725969860420776], [94.60056276595895, 20.72994485037458], [94.60365442471198, 20.735244836679897], [94.6131502348955, 20.74054482388459], [94.62198354690321, 20.74518231201415], [94.62551687080702, 20.748053137742147], [94.62682378808739, 20.754369902948724], [94.6268418680578, 20.754457289172592], [94.63170018921244, 20.75511978824767], [94.64296266179747, 20.754678122197618], [94.65555013073401, 20.75136563041957], [94.66592927211826, 20.746507309264985], [94.67343758597588, 20.744961478989126], [94.67481694184846, 20.744866351401072], [94.67520424927676, 20.742090653261073], [94.67502321035295, 20.733943890897876]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
