
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Su</div><div class="name-mm">မကျီးစု</div></div>
        <span class="pcode-badge">MMR008012011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42614692074386, 18.40124102505331], [95.4350301676082, 18.40323522312707], [95.43654582562942, 18.391310648067986], [95.44125504818197, 18.38581655479021], [95.45459784421519, 18.383069509050642], [95.46015325506875, 18.381646930861223], [95.46015325506875, 18.376349056164088], [95.45950107121752, 18.37519814337969], [95.45666593508491, 18.376123372195934], [95.45100550320149, 18.376595073803685], [95.44581677472445, 18.377852948354928], [95.44377272992762, 18.376595073803685], [95.44047017835612, 18.372866194119638], [95.41770576710752, 18.374334848174726], [95.41005597190565, 18.37565377769971], [95.40821473502206, 18.37565377769971], [95.41099277589598, 18.381336402153295], [95.4187777122217, 18.381351256255527], [95.42392605304497, 18.385611951830185], [95.42525752091791, 18.393068170659603], [95.42614516616652, 18.396174928130506], [95.42614692074386, 18.40124102505331]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
