
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Ga Nan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Ga Nan</div><div class="name-mm">တဂဏန်း</div></div>
        <span class="pcode-badge">MMR005004001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67583416031829, 22.550975189753274], [95.67583416031829, 22.551149880362743], [95.67984348009259, 22.55192090962231], [95.68246463963146, 22.552537679969987], [95.68331388023142, 22.554023760188443], [95.68693620014557, 22.553154450317663], [95.69294999994258, 22.552846019728065], [95.69819267964851, 22.552075080400698], [95.70251844027388, 22.55135409031908], [95.70262031997186, 22.547893859713895], [95.70274487967254, 22.545900989938787], [95.70012911966319, 22.545651959570307], [95.69539619997471, 22.545527399869684], [95.69427515997074, 22.54166622002009], [95.6936523596687, 22.537057680167834], [95.69278043996542, 22.529833560170744], [95.69190852026207, 22.522484879573597], [95.68439388327113, 22.527748990123825], [95.67382968029557, 22.535113589620494], [95.67475488033352, 22.539739409945867], [95.67583416031829, 22.54451949008245], [95.67583416031829, 22.548682799871358], [95.67583416031829, 22.550975189753274]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
