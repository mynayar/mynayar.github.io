
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bogale</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bogale</div><div class="name-mm">ဘိုကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR017024901</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34234631363154, 15.957750522568631], [95.34171519909722, 15.957588996235245], [95.33883812757756, 15.961338438018572], [95.33805737574733, 15.964483065041463], [95.33805904488906, 15.965516595614417], [95.33884399835188, 15.968655671122349], [95.3401565292005, 15.9705934673147], [95.34279151041994, 15.978158489722546], [95.34365659077912, 15.979771979593238], [95.34559524942131, 15.990404749579568], [95.34690397793628, 15.993774595621119], [95.3479014034271, 15.997600664139384], [95.34887538808874, 15.99989777186471], [95.34931817289544, 16.00014608457417], [95.34985947843222, 15.999893223093807], [95.35040831758982, 15.998574888920018], [95.35094686400663, 15.997281284303881], [95.35146092458206, 15.99435190911339], [95.3514390530699, 15.987990470983505], [95.3504105793848, 15.98358942091511], [95.34930224859994, 15.981281085154023], [95.3475524979495, 15.973999386062872], [95.34731641601985, 15.973016917197015], [95.34642851536375, 15.967904817253554], [95.34470208323461, 15.961947894180014], [95.34339680182103, 15.958845543387156], [95.34234631363154, 15.957750522568631]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
