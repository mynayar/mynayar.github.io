
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Wea Myan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Wea Myan</div><div class="name-mm">လက်ဝဲမြန်</div></div>
        <span class="pcode-badge">MMR012002036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.98440233599905, 20.627374977573197], [92.98454919079256, 20.625288761766967], [92.98494305877523, 20.625206096084526], [92.99046981812768, 20.62404593737017], [92.9922263586596, 20.624210470137143], [92.99206479725262, 20.613538596728915], [92.99186579527031, 20.608097239695894], [92.99346016825223, 20.605658082254763], [92.98431769000945, 20.603681816662572], [92.981304385589, 20.60303033518187], [92.97373207057865, 20.601809736630116], [92.9661598769768, 20.600588808027112], [92.96397776376284, 20.6065691143732], [92.9675532047167, 20.60809438704638], [92.96834859481186, 20.61653800212713], [92.96887665693225, 20.621513666822295], [92.96890411323432, 20.623242721374538], [92.97179417725954, 20.62308511968257], [92.98093620674058, 20.625556203955682], [92.98140465909779, 20.62624778440778], [92.9827278487113, 20.62631004087575], [92.98409841820751, 20.626881111274315], [92.98440233599905, 20.627374977573197]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
