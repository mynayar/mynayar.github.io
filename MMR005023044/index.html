
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ga Nan Leik Saw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ga Nan Leik Saw</div><div class="name-mm">ကနန်းလိပ်စော</div></div>
        <span class="pcode-badge">MMR005023044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47068312012993, 24.40770578959058], [95.46270768041518, 24.404113800211746], [95.44689935971775, 24.392883330001723], [95.43389903990885, 24.373107900109574], [95.42309579983134, 24.352722180384376], [95.42305763979829, 24.3527255096746], [95.42211911990154, 24.35308838971747], [95.40972899999343, 24.353881830082457], [95.39710560044318, 24.357849120040896], [95.40490715983759, 24.36132815996666], [95.40832535972766, 24.372314459744587], [95.40509040030179, 24.395507819730142], [95.41949472010532, 24.410278349766088], [95.43188484001342, 24.41772458971809], [95.43182903977845, 24.418351710363197], [95.43181103984767, 24.418553940012373], [95.44549572035129, 24.42669678043211], [95.45820588019728, 24.435230760291404], [95.46209711988621, 24.422485320041517], [95.46990983986728, 24.409118610135806], [95.47028892029749, 24.408425790417937], [95.47068312012993, 24.40770578959058]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
