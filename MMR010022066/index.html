
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se</div><div class="name-mm">ဆည်</div></div>
        <span class="pcode-badge">MMR010022066</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11647651228128, 21.136974099075474], [95.11040387164144, 21.133777973274903], [95.1017743334188, 21.13154068485477], [95.08962905393776, 21.12738572167376], [95.07396803679552, 21.126426884293323], [95.06483111456436, 21.12322896074801], [95.06367860638261, 21.1260279099601], [95.06367860638261, 21.136506028030794], [95.06204139959095, 21.148293912434156], [95.06826278270131, 21.147311588359173], [95.07382928399431, 21.149931118326492], [95.08561716839768, 21.155170177361867], [95.0951129632927, 21.160081795938197], [95.10035202232802, 21.16466597225684], [95.10591852272171, 21.174161768051192], [95.11770640622575, 21.178418503011528], [95.11815028640666, 21.178722211261118], [95.11967263808185, 21.176286447861344], [95.12159031284273, 21.169574584399584], [95.12159031284273, 21.163821557419], [95.11967263808185, 21.15583124201828], [95.11967263808185, 21.150397827797576], [95.11903341166266, 21.14272712605606], [95.11647651228128, 21.136974099075474]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
