
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauktaga</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR007006902</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4874089523613, 18.260832116908716], [96.4840229859721, 18.253263487320112], [96.48196869070256, 18.248898108860658], [96.47837367420578, 18.24453273130058], [96.47477865591031, 18.236058762302093], [96.47246757361967, 18.22938230155205], [96.4698997052073, 18.224246562928613], [96.47092685239238, 18.218083677120035], [96.469129344144, 18.212947937597278], [96.46502075270564, 18.212434363555076], [96.46091216216661, 18.21346151163948], [96.45826510664943, 18.212226219964123], [96.45577642264385, 18.21448865972394], [96.45551963562275, 18.217570103077833], [96.45115425806262, 18.219110825204496], [96.4469158737686, 18.21985877426306], [96.444734585233, 18.22244905468017], [96.44345065012749, 18.22912551543027], [96.44447779821189, 18.23785627055048], [96.45320855423142, 18.24453273130058], [96.46116894918771, 18.248127747797355], [96.4701564922284, 18.253520274341213], [96.4739277452693, 18.256230863363726], [96.47426508276743, 18.25608814275364], [96.47888724734867, 18.255060995568556], [96.48248226384544, 18.258912799985808], [96.487104429326, 18.260710308234195], [96.4874089523613, 18.260832116908716]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
