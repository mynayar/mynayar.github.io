
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dat Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dat Taw</div><div class="name-mm">ဓာတ်တော်</div></div>
        <span class="pcode-badge">MMR009021029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.45455351773074, 21.58428289314105], [94.45532584111476, 21.591619962591267], [94.45559671961297, 21.60435125470667], [94.46133021781537, 21.606357979437234], [94.4700638570614, 21.61072479861059], [94.48261846297174, 21.620004290365785], [94.48409818408396, 21.622470491320144], [94.48534772461784, 21.62109599538394], [94.51045693823716, 21.628737928712496], [94.50499841314632, 21.618366732838524], [94.49681062730866, 21.607449683556126], [94.49135210221777, 21.6003536018373], [94.49681062730866, 21.593803372627576], [94.50554426565537, 21.58725314431723], [94.51270809420322, 21.582728620029854], [94.50789579135773, 21.57898039233129], [94.47440173695065, 21.56048980765854], [94.47115556207956, 21.570877569943946], [94.46733459541531, 21.57360683159004], [94.4569633977427, 21.58452388087244], [94.45455351773074, 21.58428289314105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
