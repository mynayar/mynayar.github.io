
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Au Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Au Pin</div><div class="name-mm">မအူပင်</div></div>
        <span class="pcode-badge">MMR005001014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9500169997848, 21.889716029771023], [95.94771696026959, 21.88639376955689], [95.94196055993194, 21.885571440269814], [95.93730036032343, 21.883652549625538], [95.9375746796278, 21.879814860067768], [95.93123472000639, 21.882275280180068], [95.92671491985772, 21.88401363012497], [95.92254251972156, 21.888881100082756], [95.92254251972156, 21.894443909658776], [95.91837048021353, 21.902440409697192], [95.91211259991661, 21.908350889981648], [95.90980355998636, 21.913161299754222], [95.9124326398545, 21.91291092040268], [95.91262955990635, 21.91188708002477], [95.91783804019349, 21.91188708002477], [95.92103591967202, 21.913486109696237], [95.92633547969871, 21.912161220364055], [95.93017343995234, 21.911612939685483], [95.93033436014264, 21.91138118979012], [95.93095531143854, 21.91048862435059], [95.93455932025648, 21.905308169636385], [95.93647812006924, 21.900099870112967], [95.93867124008574, 21.894069149571635], [95.9447015999989, 21.891327929640283], [95.94990606841037, 21.89002681298706], [95.9501426395712, 21.889967669972066], [95.9501840398616, 21.889957319674636], [95.95006105757182, 21.88977967209422], [95.9500169997848, 21.889716029771023]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
