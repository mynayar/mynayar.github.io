
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung Tat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung Tat</div><div class="name-mm">မြောင်းတပ်</div></div>
        <span class="pcode-badge">MMR008006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19685185892621, 18.673681992829756], [95.20029959794817, 18.668492844369325], [95.19806840333422, 18.66941157108721], [95.19714967571701, 18.6686240896301], [95.1954434684414, 18.6675741158528], [95.19491848110306, 18.66678663619433], [95.19557471370211, 18.66521167417949], [95.19896088064019, 18.658124349159436], [95.1921622982515, 18.656549388043857], [95.18651868728767, 18.65615564686567], [95.17969385458775, 18.65615564686567], [95.17510021830049, 18.657074375382194], [95.17549395857941, 18.65917432293668], [95.17609901975402, 18.66118760912093], [95.17773980494809, 18.661597805194617], [95.17880631455984, 18.663238591288007], [95.17946262899721, 18.66479733672776], [95.17962670760653, 18.666602199631882], [95.17831407963115, 18.669801731165023], [95.17724756912008, 18.67152455611341], [95.17724756912008, 18.67218086965147], [95.18192380723798, 18.67209883079647], [95.18553353394549, 18.672262909405788], [95.18606369688217, 18.6725261175863], [95.19197149988486, 18.670728091328385], [95.19402638780758, 18.67162710490703], [95.19685185892621, 18.673681992829756]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
