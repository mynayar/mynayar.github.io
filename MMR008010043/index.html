
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tein Myoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tein Myoke</div><div class="name-mm">တိမ်မြုပ်</div></div>
        <span class="pcode-badge">MMR008010043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78525658472364, 18.152388820387785], [95.78512742678936, 18.1484877079414], [95.78660406682428, 18.141695162701637], [95.79014800362751, 18.14789705210734], [95.79516858136498, 18.147011067007213], [95.79782653306813, 18.14612508280635], [95.799303173103, 18.14051385013414], [95.80137046987136, 18.136231594212745], [95.79812186143482, 18.131801673208713], [95.79871251726894, 18.124713799602205], [95.80314243827297, 18.12353248793403], [95.80402842157446, 18.119988551130803], [95.80904899931193, 18.117921255261763], [95.8093443267793, 18.11585395759414], [95.8102303109801, 18.114377317559217], [95.81259293611515, 18.105517477349736], [95.79516858136498, 18.10359784386543], [95.7854227551561, 18.121908182816412], [95.78601341099017, 18.123384823750655], [95.776858242414, 18.1263381038205], [95.78128816341808, 18.13194933739203], [95.77951619411715, 18.13637925839612], [95.78010684995121, 18.136969914230235], [95.77361260084092, 18.146806109714248], [95.77847026369176, 18.15069224035466], [95.78525658472364, 18.152388820387785]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
