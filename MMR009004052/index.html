
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taik Pwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taik Pwe</div><div class="name-mm">တိုက်ပွဲ</div></div>
        <span class="pcode-badge">MMR009004052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69564266098007, 19.8405711488395], [95.69540253659784, 19.84189183024381], [95.69858070923243, 19.845705635606635], [95.69969306898003, 19.852538704297842], [95.70016979420069, 19.855081240606808], [95.69778616629861, 19.855875784439945], [95.69286000028882, 19.854445606979255], [95.68841056039912, 19.85412779016542], [95.68523238866385, 19.86096085885663], [95.68348439528864, 19.868111744361556], [95.68237203464173, 19.874150270118946], [95.68570911478389, 19.879870978163183], [95.685550206377, 19.886227320734292], [95.68523238866385, 19.89178912127096], [95.68512601235562, 19.89333158538443], [95.68491457185007, 19.896397469567603], [95.68587047204471, 19.8971296481148], [95.68587358190035, 19.897076775173105], [95.69184708217716, 19.893253734672157], [95.69877634235439, 19.887280235294668], [95.71096228198377, 19.874616413916442], [95.71980306196178, 19.865297753988216], [95.72290928163812, 19.860518953586904], [95.72434292238802, 19.85597909405999], [95.72243140168791, 19.853111814358783], [95.72147564178749, 19.846421494156687], [95.72357967766004, 19.842404698318205], [95.71923882281351, 19.840143835969286], [95.70620831995808, 19.837442390354056], [95.69572035431094, 19.840143835969286], [95.69564266098007, 19.8405711488395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
