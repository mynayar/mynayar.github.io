
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Tan Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Gyi Tan Ward</div><div class="name-mm">မကျီးတန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007008701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.8732404912808, 17.9182711048918], [96.87310103760893, 17.918584601656562], [96.87303339345556, 17.918828872210554], [96.87296950731064, 17.919152060943418], [96.87298078133625, 17.91940008950587], [96.8730033293873, 17.91977213234952], [96.87306721553222, 17.92031328557681], [96.87309017892215, 17.920817846897705], [96.87349437915049, 17.92080736763245], [96.87502562342445, 17.920780852580094], [96.8768684195636, 17.920767595053974], [96.87745837947881, 17.920800738869502], [96.877263676714, 17.920208949817038], [96.87712797288748, 17.919839156889964], [96.87701262463492, 17.91952364549337], [96.87693798753043, 17.919238667457705], [96.87688754023395, 17.919024800120724], [96.87633908597917, 17.918989792402385], [96.87571090827356, 17.918894613962152], [96.87477181432996, 17.918774054604455], [96.87392789882648, 17.91854562634734], [96.87331875680911, 17.91829816240289], [96.8732404912808, 17.9182711048918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
