
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Kauk</div><div class="name-mm">ချောင်းကောက်</div></div>
        <span class="pcode-badge">MMR007012030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5857544001455, 18.490203768589083], [96.58185440735508, 18.488903770692502], [96.57903774509595, 18.486520442264634], [96.57318775501096, 18.48435377940342], [96.56647109996135, 18.48327044707355], [96.56018777784374, 18.482837115040866], [96.5541211221921, 18.482403782108918], [96.55000446203633, 18.482403782108918], [96.54705911038968, 18.480990954369076], [96.54068781209293, 18.4837037800055], [96.53613781990452, 18.484137112038127], [96.53462115644129, 18.4882537721939], [96.53418782260997, 18.491720432951695], [96.53613781990452, 18.494320427845537], [96.539604479763, 18.495403760175464], [96.54653780217791, 18.49497042724346], [96.55303778986217, 18.49453709431151], [96.5582377814485, 18.494320427845537], [96.56013958407459, 18.493756930637915], [96.56408777063416, 18.49258709791627], [96.56777109785793, 18.49323709731425], [96.57123775861572, 18.49453709431151], [96.57513775230547, 18.496487090706694], [96.57903774509595, 18.49757042303662], [96.58228774028703, 18.497353755671327], [96.58445440314824, 18.494753760777485], [96.5857544001455, 18.490203768589083]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
