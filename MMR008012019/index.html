
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Tet Twin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Tet Twin</div><div class="name-mm">ကုလားတက်တွင်း</div></div>
        <span class="pcode-badge">MMR008012019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4923517686193, 18.38227653183651], [95.49226224380755, 18.38062032866526], [95.48755277484076, 18.378030121093275], [95.48307877896252, 18.373085178138524], [95.4790757301609, 18.37190780999748], [95.47601457371366, 18.372849704150553], [95.4804885695919, 18.382739590060055], [95.47884025617293, 18.38509432544282], [95.47365983923027, 18.384623378366257], [95.4668176613061, 18.385925206383206], [95.46765857778121, 18.38760704113207], [95.47119049514532, 18.401513962999047], [95.4738394320442, 18.40570811413818], [95.47781283829192, 18.407474072370576], [95.48481535364573, 18.406615620014918], [95.48952457619828, 18.40347613891271], [95.49541110393938, 18.403083704449443], [95.49886065869248, 18.406002557572037], [95.50121023736261, 18.397574419823684], [95.49438150610166, 18.39404231719925], [95.49273319088411, 18.389332848232414], [95.4923517686193, 18.38227653183651]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
