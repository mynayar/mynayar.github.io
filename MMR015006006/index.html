
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Htu</div><div class="name-mm">လွယ်ထူး</div></div>
        <span class="pcode-badge">MMR015006006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.0245471671181, 22.63409753986963], [99.03271739279353, 22.632041138387876], [99.03973249955527, 22.62903466431834], [99.04499383030111, 22.62552710958846], [99.05351217364796, 22.621769017226427], [99.0715754616383, 22.614185613575273], [99.07255317758711, 22.611496896964297], [99.07155101896439, 22.6044817902025], [99.07255317758711, 22.59821830173331], [99.0742725320518, 22.589764228436422], [99.06904562375661, 22.587695642040273], [99.06403483424026, 22.582935391055514], [99.05676918714835, 22.576170823724567], [99.049002462094, 22.574417046809288], [99.04248843509328, 22.574417046809288], [99.0342206302779, 22.57466758713946], [99.01611329709107, 22.57986302365964], [99.01192261193904, 22.589449418955553], [99.00941721673121, 22.602226934425516], [99.01092045421564, 22.618010923965016], [99.01793556097743, 22.627781966264763], [99.02344743115407, 22.632291676919408], [99.0245471671181, 22.63409753986963]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
