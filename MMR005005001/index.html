
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mon Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mon Hla</div><div class="name-mm">မုံလှ</div></div>
        <span class="pcode-badge">MMR005005001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50469988029528, 22.826477070260637], [95.49407952005384, 22.833129869847653], [95.48468027997103, 22.833129869847653], [95.47790543968438, 22.831481970116897], [95.47052003976808, 22.831481970116897], [95.46855639076489, 22.832175032651662], [95.46857051281899, 22.832215098348172], [95.47354851395284, 22.838748728770838], [95.47821539462484, 22.842793356827997], [95.47862971498944, 22.84693656317188], [95.4796595628386, 22.846977204434495], [95.48244064432032, 22.847086953200403], [95.48812276965015, 22.84731118476344], [95.49501615497161, 22.844660106578715], [95.50186091035278, 22.845593484152005], [95.50973701095432, 22.849433544322665], [95.51555041931647, 22.853371611710543], [95.51507580030801, 22.848083459584018], [95.51502936021689, 22.84793343018373], [95.51147471968261, 22.8364867800409], [95.50469988029528, 22.826477070260637]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
