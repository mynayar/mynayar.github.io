
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kyaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kyaw</div><div class="name-mm">တောင်ကျော်</div></div>
        <span class="pcode-badge">MMR015016005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.16328625225879, 23.03582267077968], [97.16968376759183, 23.038500700746795], [97.17953770669988, 23.034559125103613], [97.18659358602525, 23.034938778401965], [97.18573161102506, 23.0275205981971], [97.18798393970712, 23.02188977469342], [97.19671171357476, 23.01400662520564], [97.20234253617917, 23.00753117912069], [97.20543948834177, 22.997395699152264], [97.21107031004681, 22.99120179482702], [97.21416726220946, 22.97768782183556], [97.21166882685492, 22.96733716018184], [97.20234253617917, 22.96839696624704], [97.19108089186972, 22.980221692277325], [97.18207157714164, 22.983881726160803], [97.17503304933581, 22.981347856618356], [97.17425060678016, 22.979574319799042], [97.16968376759183, 22.98162939837806], [97.16405775456178, 22.984047329120983], [97.16346862307853, 22.987699952590788], [97.16346862307853, 22.99531422816915], [97.16346862307853, 22.99983520373172], [97.16703781464349, 23.00578385663971], [97.17013111375996, 23.01101867087499], [97.16751370709198, 23.017205269107933], [97.16394451642634, 23.024105706013586], [97.16275478530514, 23.027674897578493], [97.16328625225879, 23.03582267077968]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
