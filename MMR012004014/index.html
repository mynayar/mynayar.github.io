
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mar Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mar Lar</div><div class="name-mm">မာလာ</div></div>
        <span class="pcode-badge">MMR012004014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.97849469937091, 20.968805810140054], [92.97262948826034, 20.985423907387485], [92.98995952840954, 20.98919130683339], [93.00728956676016, 20.991702907363333], [93.02286148626865, 20.99471682692007], [93.03617296610958, 20.99647494666152], [93.04647052459507, 20.99747958561443], [93.04697284542056, 20.9939633470309], [93.05099140482952, 20.970605467768166], [93.05099140482952, 20.959052107668697], [93.04345660593765, 20.957796307853357], [93.03416368640507, 20.957796307853357], [93.02461960601005, 20.960810228309413], [93.01808944697046, 20.960810228309413], [93.0098011672901, 20.957042827964187], [93.00201520663654, 20.95076382798834], [92.99708950107964, 20.949870124007077], [92.9967640697061, 20.950781330593998], [92.99543157121008, 20.956872750876812], [92.9940990727141, 20.963725598357712], [92.99143109896607, 20.97109833581959], [92.97849469937091, 20.968805810140054]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
