
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Swar Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Swar Ywar Ma</div><div class="name-mm">ဆွာရွာမ</div></div>
        <span class="pcode-badge">MMR007010028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.322302919744, 19.297825578887398], [96.32874277785697, 19.298503459067433], [96.33037486570754, 19.29842573965624], [96.33586051525066, 19.298164518977444], [96.34162249408291, 19.29443617978592], [96.35009599093729, 19.295453000055943], [96.35854713244424, 19.293160387142223], [96.36331464725322, 19.29138572077443], [96.36704298644474, 19.28630162302153], [96.36735662231035, 19.284602496108334], [96.36773302276083, 19.282019429153365], [96.36534828599468, 19.27782812616715], [96.36433146662392, 19.27477766805498], [96.36026418824173, 19.270710388773466], [96.35820205088402, 19.265852555051424], [96.35333914588495, 19.262923414583952], [96.3448844115864, 19.260175570246417], [96.33577111004877, 19.261383798623456], [96.33283710694701, 19.264173280672424], [96.33802791016001, 19.272015010984035], [96.3438721409866, 19.278511598331647], [96.33996120794347, 19.281686964182086], [96.33248468961682, 19.277900502706075], [96.32345531461112, 19.27986176490856], [96.322302919744, 19.28291222392005], [96.32162503956397, 19.28596268293154], [96.3189350378218, 19.290541039737263], [96.31959139992324, 19.29579194014599], [96.322302919744, 19.297825578887398]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
