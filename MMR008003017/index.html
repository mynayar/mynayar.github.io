
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Loke Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Loke Pin</div><div class="name-mm">တလုပ်ပင်</div></div>
        <span class="pcode-badge">MMR008003017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9639522172211, 18.733074563440425], [94.9576844785559, 18.749919107281016], [94.95455061102194, 18.751486041047997], [94.95266583885746, 18.766484238956537], [94.9644905118277, 18.7587048487498], [94.96689405521653, 18.7587048487498], [94.97450527399923, 18.76311134511252], [94.98211649188266, 18.767918430091527], [94.98579602126944, 18.770310124013065], [94.9878660196012, 18.7669981259628], [94.9956290412473, 18.759235105215964], [95.00339206289345, 18.75701709915984], [95.01614559794103, 18.76145311127209], [95.02501762306491, 18.7669981259628], [95.02766204716579, 18.76964255006368], [95.03499443384612, 18.75710248798947], [95.03499443384612, 18.751894811696275], [95.03165921979723, 18.73721986790264], [95.00508424344315, 18.742084434848834], [94.98941490037743, 18.74482657029006], [94.9639522172211, 18.733074563440425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
