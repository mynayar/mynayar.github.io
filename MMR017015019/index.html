
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Taw</div><div class="name-mm">ရုံးတော</div></div>
        <span class="pcode-badge">MMR017015019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.10028933688346, 16.91529924916108], [95.10215400020701, 16.914115440075534], [95.10339204021057, 16.91177795998493], [95.10465780001749, 16.905844889629975], [95.10597900033065, 16.902911519650957], [95.1083298002801, 16.897741380160596], [95.11062696016614, 16.894360799811125], [95.11261956014465, 16.891597079741473], [95.11281990031819, 16.888447484863605], [95.11290323959287, 16.887135599728197], [95.11174835989897, 16.88521706971204], [95.10889391981863, 16.883274150082002], [95.10649272006304, 16.88292116977624], [95.10537168005902, 16.884023760188427], [95.10363611981114, 16.884755009735954], [95.09740271995963, 16.89065343011174], [95.09269571963182, 16.895107169660207], [95.08489487969501, 16.895588850145373], [95.08300847975761, 16.895705309652385], [95.08101781332147, 16.89743783468839], [95.08125283135314, 16.903783337730886], [95.08330767700772, 16.90720808108813], [95.0854831658155, 16.910833895767723], [95.09770413493794, 16.913654120241517], [95.10028933688346, 16.91529924916108]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
