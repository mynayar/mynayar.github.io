
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Paung Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Paung Taw</div><div class="name-mm">ခပေါင်းတော</div></div>
        <span class="pcode-badge">MMR009024060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.26890152328673, 21.778341224867688], [94.2680083310197, 21.777057260983838], [94.26142795203839, 21.766638327297017], [94.25868151873715, 21.761145461593856], [94.25484757305713, 21.762251408275915], [94.24717046364606, 21.76170304306106], [94.23839662560385, 21.761428861352897], [94.23044533358535, 21.760332130923132], [94.22276822597291, 21.760606312631296], [94.21976627909055, 21.758033215560488], [94.22002640079779, 21.76115467784615], [94.22413913811079, 21.766089962981482], [94.22797769191703, 21.77513798363111], [94.23729989607341, 21.79323402582969], [94.23782361536763, 21.79311079802494], [94.24196099680262, 21.792137296299245], [94.24634791672304, 21.792137296299245], [94.251283200959, 21.795975850105435], [94.25457339044965, 21.798991856988664], [94.25868612686332, 21.798717675280557], [94.26389559370676, 21.795153303182474], [94.26579147159919, 21.7943062083649], [94.26526650584464, 21.79268566061478], [94.26828251272786, 21.787202012063233], [94.26965342576506, 21.781718362612423], [94.26883087794272, 21.778428173121767], [94.26890152328673, 21.778341224867688]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
