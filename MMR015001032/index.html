
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sei Pawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sei Pawng</div><div class="name-mm">စယ်ပေါင်</div></div>
        <span class="pcode-badge">MMR015001032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.99506391836519, 22.80100651264047], [97.98929314776063, 22.80963019267932], [97.97876694923536, 22.81788045711744], [97.96852524134687, 22.828122165005936], [97.96425786201075, 22.835518953936628], [97.9602576433756, 22.84508455870548], [97.96714432874785, 22.849717350575304], [97.9833188192082, 22.854864401770783], [97.99668993669127, 22.861692206730027], [98.00721613701518, 22.871364930647076], [98.01098791615948, 22.875212145823923], [98.01113179779429, 22.875358905289318], [98.01631307898549, 22.859205497635685], [98.02125245603605, 22.84376994502702], [98.01816534515461, 22.8369783009079], [98.02272808523298, 22.82015319771193], [98.02131781156783, 22.81951244694193], [98.01399407366762, 22.815266752958337], [98.01369997737214, 22.815095333183137], [98.01340587927797, 22.8149239116093], [98.00872951075837, 22.812330011420954], [98.00153530940707, 22.808339682630276], [97.99788818259361, 22.805284170328264], [97.9977928769398, 22.804826712183058], [97.99769757218525, 22.804369255836548], [97.99645037798263, 22.80284653903658], [97.99520317838403, 22.801443295371826], [97.99506391836519, 22.80100651264047]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
