
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Yaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Yaw</div><div class="name-mm">မိုင်းယော်</div></div>
        <span class="pcode-badge">MMR015001049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.04764772895959, 23.018539720032095], [98.04249312975418, 23.0249905489747], [98.04249312975418, 23.03352530494891], [98.05074339509167, 23.0409220938796], [98.06243260588013, 23.050747278064478], [98.06411451437339, 23.050879310232006], [98.07464071289866, 23.055431180204835], [98.08687386423753, 23.057138131219858], [98.09313268612465, 23.055715671740927], [98.09853803070564, 23.050879310232006], [98.10024498261993, 23.04604294782382], [98.1019519336349, 23.04206006182244], [98.10223642607025, 23.038646158893187], [98.0991855551693, 23.03338275161275], [98.09398616073281, 23.030395893555692], [98.08943429075998, 23.027835467033242], [98.08374445374358, 23.027266483961114], [98.07862359979936, 23.020723169638643], [98.07236477791224, 23.017593760044065], [98.06126959541558, 23.01531782505765], [98.05301933007809, 23.015033332622238], [98.04764772895959, 23.018539720032095]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
