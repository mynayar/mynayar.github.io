
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yaw</div><div class="name-mm">ယော</div></div>
        <span class="pcode-badge">MMR009014047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87569492707928, 19.319954944665028], [94.87313369026765, 19.32193783826068], [94.85952169477048, 19.32726427092939], [94.8450219622938, 19.344131307713724], [94.83851187702157, 19.347682262826197], [94.83197291721643, 19.349677200142708], [94.8337772702049, 19.35034547916058], [94.83504270715525, 19.350619087101222], [94.85419526300103, 19.35034547916058], [94.8799396875666, 19.352712782568915], [94.88545212971206, 19.354884351231874], [94.8867456848655, 19.353008696394284], [94.89000072705198, 19.342355830157487], [94.90213315701965, 19.328447921734266], [94.90248825343019, 19.32880301814481], [94.9024290699457, 19.328447921734266], [94.89976585361131, 19.32608061922525], [94.89806921602155, 19.325547389600388], [94.88940890119989, 19.322825577038827], [94.87727647123222, 19.32164192533463], [94.87569492707928, 19.319954944665028]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
