
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsa Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsa Lar</div><div class="name-mm">ဆလား</div></div>
        <span class="pcode-badge">MMR015005082</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.92720583757938, 22.60542710717533], [98.92694671501891, 22.60121636264506], [98.92377883422586, 22.59997675692182], [98.91263021581187, 22.593287586053293], [98.90984306120839, 22.585483552623884], [98.90853486239405, 22.575802873303985], [98.90482740276246, 22.573340510656067], [98.90076873628823, 22.56976888372708], [98.89541129589463, 22.55872930990978], [98.88921288866396, 22.549488837939577], [98.8805675349638, 22.553418545229704], [98.87706612170422, 22.55872930990978], [98.87430622914923, 22.56700899027271], [98.87043362790968, 22.56909168972976], [98.86375369487718, 22.568794803737262], [98.85742217539314, 22.57074296371684], [98.85596507762631, 22.572408216765837], [98.86636344921385, 22.583253830200135], [98.8786269292894, 22.588828139407156], [98.8933988487779, 22.596632171937244], [98.90148159739783, 22.598025749688645], [98.91012177639891, 22.599419327440046], [98.92266397166503, 22.603042627615196], [98.92720583757938, 22.60542710717533]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
