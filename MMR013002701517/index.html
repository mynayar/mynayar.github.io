
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (2) (Ka) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingaladon</div><div class="name-mm">မင်္ဂလာဒုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (2) (Ka) Ward</div><div class="name-mm">အမှတ် (၂) (က) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013002701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1427053969366, 16.932247740241053], [96.14228251682476, 16.932079423126936], [96.14104519987615, 16.931623108020062], [96.13892747722133, 16.93084210437968], [96.13631107689474, 16.929902671671016], [96.13614277416974, 16.930274979306887], [96.13540514123434, 16.931666964358953], [96.13503632476665, 16.932416494425752], [96.13477458427968, 16.93315412736115], [96.13455685931166, 16.93386187222768], [96.13533984505784, 16.93396990508711], [96.13549688917016, 16.933955628349622], [96.13601085261882, 16.933948490430566], [96.13651767814838, 16.934048426693607], [96.13718868570936, 16.934126949199424], [96.13785255535123, 16.934162640593456], [96.13897328239113, 16.934191194967696], [96.13982988843867, 16.93421499012976], [96.14057941760609, 16.934250680624473], [96.14084194410049, 16.93440440713772], [96.1427053969366, 16.932247740241053]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
