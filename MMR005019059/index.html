
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Bway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Bway</div><div class="name-mm">ဘန့်ဘွေး</div></div>
        <span class="pcode-badge">MMR005019059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.47771671985078, 22.0348237499162], [94.47771671985078, 22.03789158023227], [94.47626843993663, 22.04259812999976], [94.47192395992289, 22.048390799995445], [94.47192395992289, 22.054907519566427], [94.47301008015114, 22.06178621985822], [94.47880284007908, 22.066492769625654], [94.48712964042062, 22.065406650296723], [94.49196227963557, 22.06733976012191], [94.49256023976329, 22.066492769625654], [94.50016307956253, 22.068665010082213], [94.50667980003283, 22.068665010082213], [94.51066212036062, 22.068665010082213], [94.5153403198999, 22.068054810181422], [94.5160927197033, 22.06504457964371], [94.51681703997446, 22.05997605005473], [94.51714968031354, 22.059995579732288], [94.51464480041727, 22.05780380959817], [94.51211040027482, 22.050563039552685], [94.51138643973246, 22.04368425022801], [94.50848987990412, 22.038977699561258], [94.50508320032947, 22.034208149586505], [94.50486972016154, 22.033909169972276], [94.50016307956253, 22.034633220446835], [94.49545643986289, 22.036443480182527], [94.49002583962084, 22.036443480182527], [94.48387127973581, 22.036443480182527], [94.47771671985078, 22.0348237499162]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
