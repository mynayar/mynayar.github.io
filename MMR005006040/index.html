
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hla Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hla Taw</div><div class="name-mm">လှတော</div></div>
        <span class="pcode-badge">MMR005006040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70473676019338, 22.363432740328733], [95.70009492024445, 22.363921350090266], [95.68957104017142, 22.366868039928136], [95.68410479979673, 22.36759686040682], [95.68451952035963, 22.36770989979209], [95.68409867991022, 22.376970989619508], [95.68409867991022, 22.385149650036396], [95.68409867991022, 22.386653009828592], [95.68409867991022, 22.392546480335852], [95.68121508021181, 22.39863399036642], [95.68704527981589, 22.399281809807746], [95.6946225599832, 22.399281809807746], [95.69939327997594, 22.399281809807746], [95.70219984015057, 22.395072239792057], [95.70388355987842, 22.392125549954244], [95.706409320234, 22.3870740301424], [95.70794724007311, 22.387522590395292], [95.70767220041176, 22.382022510330614], [95.70725135996236, 22.36897277996985], [95.70472559960677, 22.363500329776457], [95.70473676019338, 22.363432740328733]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
