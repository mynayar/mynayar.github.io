
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Daung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Daung</div><div class="name-mm">အင်းဒေါင်း</div></div>
        <span class="pcode-badge">MMR009008015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.72327040460556, 20.359502667414233], [94.72323049359244, 20.35862461973045], [94.7232692201984, 20.358605843684813], [94.72979958698141, 20.35543960505379], [94.73362667263291, 20.35513343805775], [94.73410993862285, 20.352556018845235], [94.73265434002582, 20.352070819312928], [94.72764060882707, 20.344469357275045], [94.72318546183965, 20.338324325707106], [94.71796493963029, 20.34450634818944], [94.71764066298624, 20.344803601105355], [94.71645137792882, 20.345893779974006], [94.71464168386666, 20.347974927201165], [94.71392877419362, 20.34879477256078], [94.71064614710207, 20.350375296882476], [94.7105232601404, 20.350434465078536], [94.70774839567196, 20.355353541732597], [94.70484740218592, 20.361155528704728], [94.70308157975114, 20.365696214708578], [94.70308157975114, 20.36776280910641], [94.70308157975114, 20.3678541109785], [94.70308157975114, 20.36884946892792], [94.70333384138371, 20.375282108182773], [94.70295544983418, 20.381210225071868], [94.70257706008334, 20.383858958724034], [94.70282727575824, 20.38404831188012], [94.70412040463304, 20.3829103583264], [94.7140735758349, 20.3775356446543], [94.71705952827466, 20.37554501059384], [94.71805484485526, 20.369374045276004], [94.72004547891578, 20.365193713119425], [94.72327040460556, 20.359502667414233]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
