
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yaw</div><div class="name-mm">ယော</div></div>
        <span class="pcode-badge">MMR009025058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13372412616752, 21.328128596357658], [94.1300294270165, 21.326794399042342], [94.12326894530565, 21.324831678139503], [94.12298798900457, 21.324836209823275], [94.12247811387391, 21.325593736661688], [94.11852521306821, 21.331523090118537], [94.11496760117393, 21.340417118055598], [94.11279350631531, 21.35583343416573], [94.1125958596113, 21.362355722338748], [94.11264247866751, 21.3625810465781], [94.11378173084228, 21.368087429091645], [94.11437466555844, 21.37460971726472], [94.11413823109456, 21.37488555822199], [94.1147699562685, 21.375400296886255], [94.11872285797358, 21.37658616811723], [94.13077920799412, 21.380736713828355], [94.13170966007283, 21.38032318037051], [94.13255801304194, 21.37994613420676], [94.13453446389445, 21.37441207235929], [94.14244026730455, 21.36729684857073], [94.1408591071621, 21.35998398077612], [94.13394152917829, 21.330139573982194], [94.13372412616752, 21.328128596357658]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
