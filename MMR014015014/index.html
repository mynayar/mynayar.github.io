
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hkauk Sant</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyethi</div><div class="name-mm">ကျေးသီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hkauk Sant</div><div class="name-mm">ခေါက်စန့်</div></div>
        <span class="pcode-badge">MMR014015014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.09698807973615, 21.79390754339846], [98.09685058508649, 21.793586722849057], [98.08455248021284, 21.7978643247788], [98.05086636479098, 21.808558329603272], [98.03161715700622, 21.831550440200715], [98.02359665316305, 21.837432143079013], [97.97881946964287, 21.843093625370557], [97.97707773195185, 21.843313845057935], [97.97280013002205, 21.858285451812208], [97.9813553338816, 21.870583556685858], [97.99258403872244, 21.8748611586156], [97.99044523775757, 21.88715926528789], [97.9906303272279, 21.887364918656147], [97.99525753970374, 21.892506267250496], [98.02627015414436, 21.90106147111004], [98.03054775607416, 21.910151374986015], [98.03161715700622, 21.92565768175666], [98.03365495870946, 21.926531025986094], [98.0444499618963, 21.925122981740287], [98.05728276768565, 21.924053580808163], [98.07385847538836, 21.915498376948563], [98.09908695889612, 21.919440327609095], [98.10166288793198, 21.91763717791349], [98.117703894719, 21.903734972091343], [98.12625909767928, 21.87539586043067], [98.12412029761373, 21.82673813825454], [98.11984269568393, 21.817648234378566], [98.10005878698348, 21.801072526675796], [98.09698807973615, 21.79390754339846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
