
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Kone (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Insein</div><div class="name-mm">အင်းစိန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Kone (West) Ward</div><div class="name-mm">ဈေးကုန်း (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013001701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.103800964443, 16.884494399696848], [96.10398740829231, 16.88391628760661], [96.10328546675095, 16.883630752857016], [96.10283337036378, 16.883496797938903], [96.10264301266494, 16.883440396057495], [96.10203624997303, 16.883166758439188], [96.10193604661134, 16.8831333567191], [96.10173564078724, 16.883066555077505], [96.10151428885342, 16.88350715363231], [96.1013693442199, 16.883730610879013], [96.10125459612277, 16.883954067226455], [96.10115096724343, 16.8843679244402], [96.10108126888554, 16.884919797011094], [96.10073624668053, 16.885705019371187], [96.10052995209566, 16.8862632123774], [96.10090700815198, 16.886402765575212], [96.10140381523394, 16.886612964117035], [96.10198546435777, 16.886859058199036], [96.10241773339175, 16.886974735295837], [96.10283017327396, 16.88708510729191], [96.10317519368033, 16.886597316812754], [96.10363918899742, 16.885514661672346], [96.10374259934156, 16.88492927586543], [96.103800964443, 16.884494399696848]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
