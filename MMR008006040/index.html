
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Mu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Mu Kone</div><div class="name-mm">ယင်းမူကုန်း</div></div>
        <span class="pcode-badge">MMR008006040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27588563471431, 18.360449058577217], [95.27279795725997, 18.36250751141256], [95.2705276043655, 18.3670482172015], [95.2705276043655, 18.369886157420297], [95.26825725237035, 18.374426862309917], [95.26740586958528, 18.381521713756115], [95.26854104603251, 18.38492724309782], [95.2691086342561, 18.38861656610169], [95.27989280870622, 18.39088691809684], [95.28554777630887, 18.391616591132845], [95.2886904248233, 18.386913801430865], [95.29067698315629, 18.386062418645736], [95.29692045271679, 18.3803865382082], [95.30401530416299, 18.376413420642905], [95.30656945071962, 18.37584583331858], [95.31054256828497, 18.37385927408627], [95.31591875234858, 18.36751688179868], [95.31761988924654, 18.36391524539232], [95.30820660804858, 18.363164689199095], [95.30781141266664, 18.363135847941066], [95.28787431884479, 18.361680877070853], [95.27893066271997, 18.360101088394572], [95.27588563471431, 18.360449058577217]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
