
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Son Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Son Gyi</div><div class="name-mm">ဆီဆုံကြီး</div></div>
        <span class="pcode-badge">MMR005007067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5405612749829, 22.850627877274746], [95.54037660010005, 22.852104930098506], [95.53644000040578, 22.85709119959921], [95.53764456044814, 22.86287144995748], [95.53625675994158, 22.87535966971302], [95.54215392036718, 22.887500940016423], [95.54315147985699, 22.88959550962511], [95.54909184011638, 22.902070500353375], [95.55103115976027, 22.90961150996327], [95.56496135967905, 22.906351169870618], [95.57258739389317, 22.905588567258633], [95.57543375986018, 22.905303930032403], [95.58561312044918, 22.90086692956521], [95.58842990861348, 22.896876139422375], [95.58524246666656, 22.892884513809292], [95.5821312143841, 22.88977326332548], [95.57715320965298, 22.890395513242368], [95.57093070778598, 22.888528762592387], [95.5706195810289, 22.883550758760578], [95.57030845786909, 22.877328254195618], [95.56439707736331, 22.872661376221572], [95.56439707736331, 22.86861674906379], [95.55941907173286, 22.867683372389763], [95.55444107059901, 22.86457212100663], [95.55039644344117, 22.862705367658634], [95.55008531668409, 22.85834961734099], [95.54852969009318, 22.856171739933927], [95.54510731285228, 22.855549489117664], [95.54510731285228, 22.852749361793656], [95.5405612749829, 22.850627877274746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
