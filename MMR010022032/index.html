
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Shey</div><div class="name-mm">ချောင်းရှည်</div></div>
        <span class="pcode-badge">MMR010022032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97264995013512, 21.034671812354304], [94.97625180327816, 21.03041507559533], [94.97919877370452, 21.02419369338429], [94.98345550956418, 21.016662545739962], [94.98345550956418, 21.01437045713095], [94.98083597959686, 21.01437045713095], [94.97428715602751, 21.010441162629604], [94.97395971466915, 21.00716674994561], [94.97330483195248, 20.999308160942917], [94.97310836785692, 20.99537886734089], [94.97101274424278, 20.99537886734089], [94.9696741636318, 20.994613964263067], [94.9674108910998, 20.996688631874918], [94.96151694934781, 21.001600249551927], [94.95562300669644, 21.00716674994561], [94.9510388303778, 21.012733251238615], [94.94579977134242, 21.019936958423955], [94.9490741831271, 21.023866252025982], [94.95431324216247, 21.028450429243946], [94.96053462527277, 21.032379723745294], [94.96839321427547, 21.033034605562648], [94.97264995013512, 21.034671812354304]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
