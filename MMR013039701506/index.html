
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Taw (Middle) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyun Taw (Middle) Ward</div><div class="name-mm">ကျွန်းတော (အလယ်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12988064187817, 16.80592931458625], [96.12983608316875, 16.806366920197263], [96.12984199531189, 16.806741459950445], [96.13264541595322, 16.80687065115967], [96.13265037571432, 16.80727195743492], [96.13264732341531, 16.807943725822327], [96.1339359278009, 16.808052443965153], [96.1342761988875, 16.807782364064906], [96.13606767808096, 16.808056633007254], [96.13567761063331, 16.807760783933077], [96.13538475000627, 16.80748863199483], [96.1350612638663, 16.807372093347453], [96.13470077512073, 16.807304381591962], [96.13436317502055, 16.807201385835356], [96.13402938894518, 16.80710983305238], [96.13366031707005, 16.806999207447518], [96.1334102632731, 16.806886672581925], [96.13326225285073, 16.806622694581733], [96.13267771420522, 16.805957794316782], [96.13164711002617, 16.805959701778875], [96.13119316103564, 16.805959701778875], [96.1306400303132, 16.80597114565188], [96.12988064187817, 16.80592931458625]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
