
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Gyi Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Gyi Taw</div><div class="name-mm">ဦးကြီးတော်</div></div>
        <span class="pcode-badge">MMR017017060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19838956023005, 16.626788999912492], [95.19763211972662, 16.624881990211748], [95.19739559982713, 16.622953199830363], [95.19715872019884, 16.621024410348298], [95.19349716016586, 16.621076970325987], [95.1919258179222, 16.619567880053694], [95.19035472029418, 16.61805891029053], [95.18707512032063, 16.61445441044276], [95.18568587999943, 16.612773389580298], [95.18511203968893, 16.613482229821102], [95.19072876002434, 16.62215597961483], [95.19033780044919, 16.62271190992675], [95.18959943456633, 16.623493195054948], [95.18805684005116, 16.625125440286865], [95.18582664008744, 16.625736720273494], [95.18362343957011, 16.624815030289483], [95.1828256806607, 16.624901891309264], [95.18032475958006, 16.62517422041401], [95.17978943993074, 16.625403900069955], [95.18092019980742, 16.627939109602266], [95.1806786356106, 16.629851519731915], [95.18039224020976, 16.63183905023203], [95.19307308035843, 16.637189490302774], [95.19470567992323, 16.634110229603436], [95.19632099991429, 16.631405190297357], [95.19702264018275, 16.630641360110758], [95.19901524016126, 16.628472809572543], [95.19951672012058, 16.62791255981682], [95.19838956023005, 16.626788999912492]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
