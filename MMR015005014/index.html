
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Nwet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Nwet</div><div class="name-mm">မန်နွဲ့</div></div>
        <span class="pcode-badge">MMR015005014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.54777980599329, 22.807913196237052], [98.5483647960985, 22.809521900815128], [98.54826627356971, 22.81150350298435], [98.55329805326261, 22.818156413187978], [98.55376295329773, 22.818448183836665], [98.55391560332248, 22.8190587812378], [98.55540038671853, 22.82037224378405], [98.5585412752597, 22.82077199243355], [98.56185348465067, 22.81985827943612], [98.56476594539214, 22.819001674287904], [98.56687890613665, 22.819287209037498], [98.56875269488103, 22.81977076730709], [98.57041954422664, 22.820200922034985], [98.5729149263828, 22.821123871969178], [98.57458836056446, 22.821742813280252], [98.57761503430646, 22.822313883678817], [98.5825262418926, 22.822428097578666], [98.58635241563155, 22.822485205427938], [98.5901443243012, 22.822599419327787], [98.59636899443359, 22.82117174198237], [98.60019516817255, 22.820886207232718], [98.60493505400962, 22.820029601185183], [98.60583852462827, 22.819998449568857], [98.60583083272678, 22.81950247435975], [98.60554535823178, 22.811951415725332], [98.60465431714306, 22.791036080750587], [98.58653312360485, 22.792290427261435], [98.5834672538108, 22.79674987390763], [98.57733551332336, 22.805668768998544], [98.57036762726426, 22.8087346387926], [98.54777980599329, 22.807913196237052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
