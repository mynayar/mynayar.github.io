
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Ta Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Ta Pin</div><div class="name-mm">သရက်တပင်</div></div>
        <span class="pcode-badge">MMR008006033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.19120327920803, 18.451628120141663], [95.19162263487675, 18.45590654764908], [95.1916224729988, 18.465282139159456], [95.19132936056161, 18.473192789016025], [95.18752058420768, 18.47963844685688], [95.18311724356602, 18.48470234134004], [95.1845380024269, 18.48567413705183], [95.18822732543077, 18.490498635603615], [95.19645735332426, 18.491350018388687], [95.19929529264368, 18.49305278216019], [95.20270082198539, 18.497877281611295], [95.20894429244521, 18.498161076172778], [95.21291740911118, 18.502134192838753], [95.22313399533766, 18.502417987400236], [95.22625573011788, 18.507526279614183], [95.22852608211304, 18.50043142816793], [95.23249919877907, 18.493336576721674], [95.22653952378005, 18.491350018388687], [95.22540434823213, 18.49021484194145], [95.2256881418943, 18.47290340426872], [95.22398537722341, 18.455308171135243], [95.21689052577722, 18.45445678924949], [95.19872770531941, 18.453889201025845], [95.19120327920803, 18.451628120141663]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
