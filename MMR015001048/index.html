
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hkar Shi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hkar Shi</div><div class="name-mm">ခါးသျှိ</div></div>
        <span class="pcode-badge">MMR015001048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.72618896574824, 22.860530550644455], [97.72329323689343, 22.857993813164], [97.72044831793556, 22.854579910234747], [97.71817238294915, 22.850312531797954], [97.7124825459328, 22.84348472683871], [97.7076461826253, 22.83893285686588], [97.70537024763888, 22.83694141431488], [97.70452465109184, 22.83549006681318], [97.69313709719933, 22.839217349301293], [97.67720555229448, 22.84348472683871], [97.66733162035803, 22.844085402919063], [97.66554138492705, 22.84689862976802], [97.66440341698416, 22.851734992176205], [97.66440341698416, 22.856855845221105], [97.66639486043454, 22.865390602094635], [97.67436063333662, 22.872787391025327], [97.68175742226731, 22.878477228940994], [97.68716276774757, 22.879330704448478], [97.69370608117077, 22.876485784591353], [97.70167185407286, 22.87563230998319], [97.70451677303072, 22.872787391025327], [97.70793067506065, 22.86709755310966], [97.7167499243696, 22.861692206730027], [97.72618896574824, 22.860530550644455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
