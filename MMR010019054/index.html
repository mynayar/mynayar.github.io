
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mya Wa Di</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mya Wa Di</div><div class="name-mm">မြဝတီ</div></div>
        <span class="pcode-badge">MMR010019054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74482765027591, 21.559823180695275], [95.74253647987473, 21.563718169657875], [95.73758755202397, 21.56949191791773], [95.73635032141027, 21.574440844869173], [95.73263862507252, 21.574440844869173], [95.72397800268271, 21.574440844869173], [95.71449255898449, 21.57485325597304], [95.70920176464978, 21.57548815125722], [95.70954363203305, 21.57856495141141], [95.70954363203305, 21.583644112785635], [95.71408014788057, 21.58722557380122], [95.71796746292813, 21.590529791816493], [95.7186166646274, 21.590112447931176], [95.72480282399118, 21.58722557380122], [95.73428826768946, 21.586813162697354], [95.74336130118314, 21.588462806213613], [95.75408397639444, 21.591762091447436], [95.76356942009272, 21.595473785986485], [95.77264245268708, 21.597123427704048], [95.77965343425865, 21.59588619709035], [95.77387968509947, 21.589287626622706], [95.7693431692519, 21.58433869967132], [95.76398183119659, 21.580214594028348], [95.76068254596277, 21.575265667076906], [95.75573361901138, 21.57114156143399], [95.75078469205994, 21.566192632683908], [95.74748540682612, 21.5624809381448], [95.74482765027591, 21.559823180695275]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
