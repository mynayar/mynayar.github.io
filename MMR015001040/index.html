
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Ma Hkaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Ma Hkaw</div><div class="name-mm">နားမခေါ်</div></div>
        <span class="pcode-badge">MMR015001040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.54959295724922, 22.773107048051884], [97.54769974494735, 22.775529600410778], [97.55914142004059, 22.777482610434163], [97.57137457137941, 22.783172448349887], [97.58759060871967, 22.784310415393406], [97.6022693800279, 22.78596316157069], [97.60295316965312, 22.784594906929442], [97.60209969504496, 22.77406870660559], [97.59669434866532, 22.76297352410893], [97.59498520959983, 22.761264385043376], [97.58417670579041, 22.760128605151067], [97.57308152329375, 22.757568177729297], [97.56084837195488, 22.74789545381219], [97.54180616742076, 22.756875417366643], [97.54244403766228, 22.757108679921714], [97.54611353331296, 22.761030321192436], [97.54591557994013, 22.76364336794711], [97.54587160129341, 22.764234661400565], [97.54582762084806, 22.764825952156002], [97.54858196818333, 22.76847230015659], [97.5496691972757, 22.77310699409253], [97.54959295724922, 22.773107048051884]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
