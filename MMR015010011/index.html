
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Long</div><div class="name-mm">ကွန်လုံ</div></div>
        <span class="pcode-badge">MMR015010011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.62548082088324, 23.813174246194535], [97.62907447940376, 23.818659301285777], [97.63022771693562, 23.820490916322797], [97.63716464563197, 23.83150839109942], [97.63958727892987, 23.83791106404442], [97.63982831162735, 23.838548080829298], [97.64007741394158, 23.839206421439258], [97.64528213776049, 23.838534844607466], [97.65061213084522, 23.83691681136179], [97.65289641333885, 23.834918063617806], [97.65897774502696, 23.83015161540476], [97.65801723400818, 23.829294015606365], [97.6566487977039, 23.82807219757393], [97.65665927660439, 23.828200017316988], [97.6530528728918, 23.82711454100331], [97.65117087873313, 23.8265480868248], [97.64981976966669, 23.826141420590147], [97.64497793128658, 23.823256921569737], [97.64497793128658, 23.821508165569412], [97.64460022681908, 23.81861243581534], [97.64426409261387, 23.816035406009235], [97.64212257659568, 23.80984880777629], [97.6392672246028, 23.805803723762892], [97.6319288205587, 23.8029958910476], [97.63183521102621, 23.80319559180316], [97.63064405807688, 23.805736717975208], [97.62883490630594, 23.809656547112013], [97.62548082088324, 23.813174246194535]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
