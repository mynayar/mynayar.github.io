
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Pawm Bum</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Pawm Bum</div><div class="name-mm">အင်ပေါမ်ဘွမ်း</div></div>
        <span class="pcode-badge">MMR001003035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.04504197570668, 26.2024205854417], [98.0273599238215, 26.2024205854417], [98.01027623226236, 26.20120032143774], [97.99563306691255, 26.2024205854417], [97.98495877792533, 26.2024205854417], [97.98530552952661, 26.203509491769694], [97.98530552952661, 26.20431857943896], [97.98530552952661, 26.204838707740237], [97.9857678655946, 26.205878964342787], [97.98582565782789, 26.206630259778706], [97.98657695416318, 26.207670516381256], [97.988426298435, 26.210328948322342], [97.98871525870231, 26.211947124560197], [97.98871525870231, 26.21310296473007], [97.98871525870231, 26.213854261065364], [97.98900421807025, 26.21420101266665], [97.98935097057091, 26.214836725434566], [97.98946655413823, 26.21558802087054], [97.99102693814274, 26.216917236841084], [97.99270290661389, 26.219171125846856], [97.99420549928442, 26.221425013953308], [97.99517393512906, 26.223671786623697], [98.00327894107033, 26.224408604773316], [98.02855508594854, 26.22628091323361], [98.04540585039973, 26.233770140779427], [98.04727815706138, 26.220663990550747], [98.04540585039973, 26.204749380779333], [98.04504197570668, 26.2024205854417]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
