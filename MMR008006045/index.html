
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Ta Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Ta Lin</div><div class="name-mm">ကျွဲတလင်း</div></div>
        <span class="pcode-badge">MMR008006045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.29408251159867, 18.436010175129525], [95.29805562916403, 18.435442586905936], [95.3017449521679, 18.43033429379267], [95.30458289238663, 18.42522599978014], [95.30515048061022, 18.42153667677627], [95.30656945071962, 18.41756356100956], [95.31224533205648, 18.415293208115088], [95.31139395017073, 18.413590444343583], [95.31451568495095, 18.40223868077055], [95.31650224328394, 18.39713038765734], [95.31025877372349, 18.395995211210106], [95.3054342751717, 18.39542762298646], [95.29777183460254, 18.403090062656304], [95.29635286359382, 18.40195488710839], [95.2886904248233, 18.392022093644755], [95.28554777630887, 18.391616591132845], [95.27989280870622, 18.39088691809684], [95.2691086342561, 18.38861656610169], [95.26882483969467, 18.38946794798744], [95.27024380980401, 18.394576241100708], [95.27223036903638, 18.403090062656304], [95.27279795725997, 18.409901121339715], [95.27762245581175, 18.41103629688763], [95.2801766032677, 18.413874238005747], [95.28102798515346, 18.418414942895367], [95.28301454258713, 18.423239442346414], [95.28273074892496, 18.427780147236035], [95.2886904248233, 18.43203705756423], [95.29408251159867, 18.436010175129525]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
