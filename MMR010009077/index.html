
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kan (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kan (South)</div><div class="name-mm">သရက်ကန် (တောင်)</div></div>
        <span class="pcode-badge">MMR010009077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13338252368459, 22.07675141174832], [96.13327205186374, 22.075185639905385], [96.13157728306521, 22.07387277540829], [96.1264670231347, 22.075860099963677], [96.12613634511627, 22.06445168179971], [96.12484633598967, 22.064617068023324], [96.11475523036967, 22.065910799443884], [96.11469126968643, 22.065647856563373], [96.11140449402222, 22.065910799443884], [96.10135228857729, 22.068473126233812], [96.09189138917634, 22.069655739221048], [96.09169428656213, 22.074189085857654], [96.0956363289535, 22.077539822205097], [96.10214069723543, 22.078131128249026], [96.10411171798148, 22.073991984142822], [96.10746245342955, 22.0706412486947], [96.11239000529457, 22.0706412486947], [96.11574073984332, 22.073991984142822], [96.11968278133537, 22.07675141264764], [96.12323061939765, 22.07714561697668], [96.12894657902149, 22.07675141264764], [96.13338252368459, 22.07675141174832]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
