
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Hsaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongyawng</div><div class="name-mm">မိုင်းယောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Hsaw</div><div class="name-mm">မိုင်းဆော်</div></div>
        <span class="pcode-badge">MMR016011017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.80811693015227, 21.483072422054704], [100.82208231694545, 21.493047698592477], [100.84868305437953, 21.50235795705413], [100.86597353425128, 21.514993306795702], [100.87062866258276, 21.52895869358889], [100.85799331194187, 21.539598989102103], [100.83338762963547, 21.549574264740556], [100.82607242810013, 21.564204671408504], [100.83139257540711, 21.573514928970837], [100.85133882972326, 21.586812433347177], [100.85333818271101, 21.588145334739465], [100.87395375476206, 21.594795519098], [100.88991419668287, 21.594795519098], [100.92183508232324, 21.60809588781501], [100.93513545104031, 21.611420979994307], [100.94777080078188, 21.605435813711892], [100.94777080078188, 21.586815297687906], [100.94311567155108, 21.573514928970837], [100.94710578180644, 21.56952481781616], [100.94741650386862, 21.54304730998541], [100.9425944712579, 21.52025224534492], [100.9386491706228, 21.49614207869405], [100.92330633811707, 21.48605964703512], [100.90138800635145, 21.472908646716746], [100.87377090820092, 21.46501804814443], [100.84133177564098, 21.46238784772106], [100.81985181121217, 21.470716813630077], [100.80811693015227, 21.483072422054704]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
