
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Sar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Sar</div><div class="name-mm">မင်းစား</div></div>
        <span class="pcode-badge">MMR005029030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.48206875956566, 22.9084220702224], [94.4893632227346, 22.901397633893737], [94.49525339992454, 22.89572550003186], [94.49760623414045, 22.8941080045808], [94.50068040018039, 22.89199455010845], [94.49313376261313, 22.883819102069936], [94.49201756905563, 22.882609904223727], [94.49170020010422, 22.88226608980824], [94.47751403964128, 22.87392119960373], [94.47705647987272, 22.873652010032288], [94.45638276035618, 22.87973249995497], [94.45638276035618, 22.877959050369952], [94.44863016005388, 22.87709765992912], [94.43570903994032, 22.871067839609168], [94.4220844800148, 22.870475459774696], [94.42192644035299, 22.871067839609168], [94.42192644035299, 22.886573130145905], [94.42237715987807, 22.894685729962532], [94.43140199960266, 22.895187119989657], [94.44190787974492, 22.897988730295708], [94.4477686796809, 22.894325730448145], [94.45866300039722, 22.894325730448145], [94.46241239991241, 22.894325730448145], [94.47274944043437, 22.89863276988649], [94.4787790799906, 22.902939720291897], [94.48206875956566, 22.9084220702224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
