
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Ton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Ton</div><div class="name-mm">ရွာတုံ</div></div>
        <span class="pcode-badge">MMR005012019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22799559991705, 22.157368470078893], [95.2283347198715, 22.15513034978585], [95.22960480002155, 22.148356860280956], [95.23320335984727, 22.14666341978102], [95.23764827974435, 22.146875100405623], [95.24037959993865, 22.147247519557425], [95.24045592000476, 22.146897689576747], [95.2400984403908, 22.14332568043585], [95.2400984403908, 22.1384142003551], [95.24152727966026, 22.133145509557664], [95.23849103982968, 22.12975214984192], [95.22952452024049, 22.127552730074456], [95.2283347198715, 22.130364509914273], [95.22685295999617, 22.13290467021443], [95.22621791992111, 22.13502138023256], [95.22410111997078, 22.13629136955109], [95.21796275957377, 22.137561449701195], [95.21330580022254, 22.137984810050966], [95.20949592040046, 22.137984810050966], [95.20753932028344, 22.136659470158463], [95.20533359986581, 22.142088900382475], [95.20368660035638, 22.146430679732134], [95.21307215995228, 22.150526220208974], [95.22611964020928, 22.156832430072654], [95.22799559991705, 22.157368470078893]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
