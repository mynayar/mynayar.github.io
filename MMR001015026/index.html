
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Shee Hku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Shee Hku</div><div class="name-mm">အင်ရှီခူး</div></div>
        <span class="pcode-badge">MMR001015026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.90727128634086, 26.73500263816129], [97.90707877926229, 26.734296777374425], [97.89641230898093, 26.713933517318026], [97.84695867780079, 26.711994159003268], [97.79223119281534, 26.707087734911113], [97.78971807602846, 26.728700540897307], [97.80865048683057, 26.74885439921121], [97.82883502012015, 26.76863579970245], [97.82951061692148, 26.76851611342795], [97.83042346477112, 26.76835412034643], [97.83257108988397, 26.767579679058997], [97.83609874895814, 26.76526009367842], [97.84366047714934, 26.76081219972326], [97.8447858177114, 26.76061771323691], [97.84621992341079, 26.761002638361106], [97.85093116134408, 26.762635951987647], [97.85328780598752, 26.76311624391957], [97.85777499941673, 26.75225299927655], [97.8625339221029, 26.74701818683991], [97.87062408923038, 26.741307480156138], [97.87823836390942, 26.738452126364564], [97.89108745192442, 26.734644987676063], [97.8987017284021, 26.733217313028604], [97.90727128634086, 26.73500263816129]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
