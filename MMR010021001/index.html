
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thaung Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thaung Pyin</div><div class="name-mm">သောင်ပြင်</div></div>
        <span class="pcode-badge">MMR010021001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67333020762305, 21.77722630115295], [95.67739587891674, 21.774967595378257], [95.67974124606172, 21.772329057340187], [95.68120709962801, 21.769104178415148], [95.68091392873487, 21.764120274131415], [95.67974124606172, 21.76177490698643], [95.67739587891674, 21.758550028061393], [95.67563685355799, 21.754738807350122], [95.67387782909861, 21.750634415745765], [95.66625538767607, 21.74711636592758], [95.65892611714662, 21.746823195034494], [95.6524763592966, 21.74711636592758], [95.64719928411972, 21.745650512361294], [95.63693830465911, 21.744184657895687], [95.6299022050228, 21.742425633436312], [95.62315927627964, 21.74008026629133], [95.62022756824774, 21.73626904468074], [95.62198659270717, 21.743598316109455], [95.6243319598521, 21.749168562179477], [95.62667732609776, 21.75415246556389], [95.63019537591595, 21.75825685716825], [95.63104704558475, 21.759449195424054], [95.63166123038155, 21.760309053420144], [95.63459293931277, 21.76177490698643], [95.6407495262697, 21.76177490698643], [95.64426757608783, 21.762361248772663], [95.6480787967991, 21.762947590558895], [95.65159684661722, 21.764706615917646], [95.65658075090101, 21.76705198216331], [95.6612714842916, 21.769983691094524], [95.66713490035545, 21.77350174001333], [95.67182563374604, 21.775847107158313], [95.67333020762305, 21.77722630115295]]]]};
        const layer = L.geoJSON(geojsonData, {

</body>
</html>
