
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Thaw (West)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taunggyi</div><div class="name-mm">တောင်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Thaw (West)</div><div class="name-mm">မိုင်းသော် (အနောက်)</div></div>
        <span class="pcode-badge">MMR014001015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.82855504517926, 20.85646772790335], [96.86519387859465, 20.874810079121914], [96.8758072250235, 20.8876578136572], [96.88865495955878, 20.89491957657725], [96.90150269499344, 20.879278856234293], [96.90317848629815, 20.8524661926607], [96.90094409729232, 20.82844651489478], [96.86463528179286, 20.830680903900657], [96.85081747194886, 20.829834915249194], [96.8512122671325, 20.830685326766456], [96.8469150689753, 20.84201406499716], [96.84457109128289, 20.850608297634892], [96.84418033315592, 20.856468024679657], [96.83871145686828, 20.857639868285332], [96.82855504517926, 20.85646772790335]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
