
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Leik Poke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Leik Poke</div><div class="name-mm">လိပ္ပုတ်</div></div>
        <span class="pcode-badge">MMR005026028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37292331985537, 23.88751550973302], [95.3640748803515, 23.880126960390953], [95.35430916023961, 23.882690430219213], [95.34387203956305, 23.88348386968488], [95.33007828028849, 23.883117660351786], [95.31750527964499, 23.877062099636248], [95.31512459972055, 23.876098649633036], [95.30889875957018, 23.892089850166485], [95.31011951999989, 23.90509034983984], [95.30847180013353, 23.91589358991729], [95.31188964029474, 23.92669674006254], [95.3178710402164, 23.938110359905238], [95.32849103982966, 23.942871090228664], [95.34130847980254, 23.942871090228664], [95.35168439981527, 23.944702139592096], [95.35464000013593, 23.94669320982382], [95.35327164027404, 23.93872073967043], [95.36090076006207, 23.92132571990612], [95.36431895995207, 23.909912100063423], [95.36853023957894, 23.898315419620985], [95.37292331985537, 23.88751550973302]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
