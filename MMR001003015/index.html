
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shin Kun (Kying Htaung Ga)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shin Kun (Kying Htaung Ga)</div><div class="name-mm">ရှင်ကွန် (ကျိန်ထောင်ဂါး)</div></div>
        <span class="pcode-badge">MMR001003015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.86762939538033, 25.804476445431646], [97.86660052329557, 25.80782027768373], [97.862855909073, 25.820926427013035], [97.85630283440832, 25.837777190564964], [97.85688459774605, 25.84708541386084], [97.85874473927834, 25.847446184993487], [97.86581346182186, 25.848521288526683], [97.87557015903565, 25.850069970552738], [97.88563659355401, 25.853631939662364], [97.8939220430679, 25.85549035809362], [97.89941986493488, 25.857193908771933], [97.90321413612355, 25.856497001635375], [97.90979603585845, 25.856342132983116], [97.91528050728965, 25.855564107897294], [97.94991818907323, 25.83590488390331], [97.96208818462208, 25.82560719501606], [97.95647126283859, 25.821862580793493], [97.94055665306712, 25.809692585244647], [97.92557819617684, 25.80220335590019], [97.9049828184024, 25.78067182524461], [97.8918766690731, 25.759140292790335], [97.88629005534182, 25.747346329869288], [97.87877051884442, 25.752587218125655], [97.86753667617671, 25.75726798612868], [97.87221744417974, 25.766629522134792], [97.87221744417974, 25.77786336390318], [97.87034513661882, 25.795650282134886], [97.86762939538033, 25.804476445431646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
