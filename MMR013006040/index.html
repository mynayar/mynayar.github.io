
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Taing (Lat Kyat)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Taing (Lat Kyat)</div><div class="name-mm">ပန်းတိုင် (လက်ကြပ်)</div></div>
        <span class="pcode-badge">MMR013006040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85053452025198, 16.93654440510028], [95.85280038103281, 16.93617450764748], [95.86362518775229, 16.93645206630987], [95.863902747314, 16.932566238740947], [95.86612322110983, 16.928125291149343], [95.86945393135392, 16.925349700028676], [95.87250708113692, 16.921186311998724], [95.87306220026039, 16.91979851598876], [95.87306220026039, 16.91702292486815], [95.86834369400634, 16.916190247082284], [95.86279251086575, 16.915357570195738], [95.86001691884582, 16.916190247082284], [95.85585353171518, 16.91674536620576], [95.85224526280871, 16.915635128858185], [95.84304226289015, 16.91124920808454], [95.84629609279051, 16.91304853566146], [95.84475228958655, 16.91484964299667], [95.84012087727672, 16.9181945517372], [95.8380624703068, 16.922311364777727], [95.8380624703068, 16.925141671550932], [95.83883476131524, 16.92804526767503], [95.83885629827961, 16.928052386708316], [95.83956840395871, 16.928287669140673], [95.83980370437752, 16.928365412833557], [95.8410949401794, 16.929558447164652], [95.84255383029512, 16.930906383422894], [95.84368644007719, 16.931435834096533], [95.84549862436211, 16.932282958591713], [95.84637260980816, 16.932691513402688], [95.84716933000061, 16.932718324890857], [95.84920664517063, 16.932786933270393], [95.85053452025198, 16.93654440510028]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
