
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Doke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Doke</div><div class="name-mm">အုန်းဒုတ်</div></div>
        <span class="pcode-badge">MMR005032021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91696064022142, 24.227166869955113], [94.91111280041548, 24.216120810227267], [94.9033155595655, 24.208323570276605], [94.89811715977913, 24.19857702011342], [94.89616812026259, 24.187530960385573], [94.89161952022476, 24.174535590445203], [94.89161952022476, 24.15894110964456], [94.89004236026676, 24.14790134966762], [94.88967012008004, 24.145296029887902], [94.88057364036126, 24.1543927803026], [94.87017719961813, 24.15894110964456], [94.86108036017055, 24.156991890263555], [94.84919892019406, 24.15959091029231], [94.8493846796593, 24.15959091029231], [94.85653211986153, 24.17648489975835], [94.85783172025776, 24.188180760134003], [94.86432935981219, 24.208323570276605], [94.86432935981219, 24.22391805017793], [94.87602504032338, 24.22456784992636], [94.8922693199732, 24.226517160138883], [94.91349923959831, 24.227075790215622], [94.91696064022142, 24.227166869955113]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
