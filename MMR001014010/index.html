
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mu Lar Hawng (Mu Lar Dee)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Puta-O</div><div class="name-mm">ပူတာအို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mu Lar Hawng (Mu Lar Dee)</div><div class="name-mm">မူလာဟောင်း(မူလာဒီ)</div></div>
        <span class="pcode-badge">MMR001014010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.44195669974198, 27.280426336106586], [97.44466322203016, 27.272577422909762], [97.45279487578296, 27.252248286729127], [97.46363708078673, 27.24614954686416], [97.48396621696742, 27.238695529575068], [97.5022624383609, 27.231919152347075], [97.50774629195786, 27.227958591116135], [97.49629211269092, 27.21748619902894], [97.48522924463401, 27.211382547966252], [97.47149603041754, 27.20985663497578], [97.45089620729419, 27.21519732999286], [97.42724455908922, 27.21367141700233], [97.4158002130095, 27.210619591920704], [97.40244847591651, 27.211764025989055], [97.38642639086532, 27.20871220090737], [97.34665603534779, 27.214014914856477], [97.35589266361558, 27.23056387582227], [97.37215597202055, 27.248860098115074], [97.38503109091215, 27.267156320407935], [97.38570872917455, 27.280031439299535], [97.3859098067922, 27.286667000681575], [97.39587329681524, 27.28274198965113], [97.4094260539693, 27.266478682145532], [97.42365644758706, 27.273932697635928], [97.44195669974198, 27.280426336106586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
