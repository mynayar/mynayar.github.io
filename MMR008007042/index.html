
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Kone</div><div class="name-mm">ကြို့ကုန်း</div></div>
        <span class="pcode-badge">MMR008007042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87219246680894, 17.602389892579538], [95.87156350165435, 17.598930588276062], [95.87156350165435, 17.592640942125854], [95.87093453829834, 17.585093365666353], [95.86433040912112, 17.5769168258509], [95.85929869238083, 17.5769168258509], [95.84766284736259, 17.58037613105364], [95.84546146977107, 17.585093365666353], [95.84609043492571, 17.591068529688926], [95.84609043492571, 17.59358438760944], [95.8422343982989, 17.594619760893295], [95.84388905913283, 17.596100247328593], [95.8445180233881, 17.603018857734128], [95.84263112972292, 17.60773609234684], [95.83864127397567, 17.610977849747997], [95.83759941298257, 17.611824362704226], [95.84105871818537, 17.615283667907022], [95.8445180233881, 17.61717056157221], [95.85238008107592, 17.61874297310976], [95.86055662089137, 17.618428490982126], [95.86433040912112, 17.61779952582748], [95.86684626794096, 17.61874297310976], [95.86747523219628, 17.611824362704226], [95.86747523219628, 17.607421610219205], [95.86558833763172, 17.605849198681597], [95.86778971432392, 17.602704374707173], [95.87219246680894, 17.602389892579538]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
