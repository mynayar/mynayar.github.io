
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Hloke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Hloke</div><div class="name-mm">လက်လှုပ်</div></div>
        <span class="pcode-badge">MMR005016005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85137835972358, 22.088229750402718], [94.85490275965469, 22.09111352996547], [94.8565065602296, 22.092425729863578], [94.85958383972246, 22.098066929745073], [94.86112212018975, 22.104733770447183], [94.8601191602711, 22.108746239647303], [94.86830196026733, 22.109862059986142], [94.87506563996737, 22.113018450141396], [94.87907135975553, 22.10781078014344], [94.88060999995162, 22.10114394034065], [94.8872768397544, 22.10114394034065], [94.88984076014304, 22.09601555997017], [94.88998404013142, 22.096051379967264], [94.88996999991565, 22.095896219934673], [94.88937010894341, 22.089297750191065], [94.88932811959711, 22.088835899757044], [94.88937930630999, 22.082295292393894], [94.88938862868235, 22.081103935298415], [94.88925929717885, 22.070886750123464], [94.88266127979426, 22.070886750123464], [94.86881459991389, 22.070886750123464], [94.85855819980117, 22.071912390044815], [94.85035271980223, 22.070373929713128], [94.84625016011688, 22.06661309981473], [94.84625016011688, 22.071912390044815], [94.85137835972358, 22.078579229847605], [94.85137835972358, 22.088229750402718]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
