
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Oke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Oke</div><div class="name-mm">ဇီးအုပ်</div></div>
        <span class="pcode-badge">MMR008001044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.28846672925619, 18.864046743262634], [95.28909837079323, 18.862432544726232], [95.29520888638103, 18.86304976923151], [95.29261654561714, 18.859161259884274], [95.2902093743632, 18.856383753207695], [95.2883577026459, 18.854532082389767], [95.28780220131063, 18.853421079719112], [95.28632086501597, 18.85175457571313], [95.28354335833939, 18.846384730071293], [95.28132135299808, 18.846569896883295], [95.28095101937413, 18.84249622072406], [95.27984001580415, 18.83749670870617], [95.2768307025749, 18.837440721412236], [95.27439841505486, 18.839062245826028], [95.27291201737575, 18.840818897873874], [95.27088511095917, 18.841629660980118], [95.26831769580508, 18.842440424086362], [95.27020947458766, 18.845980753708886], [95.27007434785293, 18.851656091855205], [95.26966896674946, 18.853953252640565], [95.27060091440075, 18.857158398641218], [95.27188841801615, 18.859840700388077], [95.27510717795394, 18.862630292154336], [95.27725301881185, 18.863274043962008], [95.28122282417405, 18.863274043962008], [95.28411970775835, 18.863488627598144], [95.28594367316202, 18.862952167608512], [95.28846672925619, 18.864046743262634]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
