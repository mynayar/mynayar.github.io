
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwin Hlar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kwin Hlar</div><div class="name-mm">ကွင်းလျား</div></div>
        <span class="pcode-badge">MMR017005039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40625673466064, 17.275977543928548], [95.40564336015302, 17.276182020084207], [95.40427427993416, 17.276866559744008], [95.40167291986944, 17.278509419674037], [95.39907155980472, 17.279604630249537], [95.39660735984182, 17.281247580111767], [95.3949643200474, 17.281932119771568], [95.39332163998176, 17.282479770025418], [95.38989876001983, 17.283574979701598], [95.3846963996192, 17.286723900087964], [95.38332732029966, 17.28754533005298], [95.38113672018358, 17.291241809861674], [95.37990480006653, 17.295759809567585], [95.37976763996465, 17.302194449814067], [95.38702380010835, 17.302742100067917], [95.39113103986568, 17.30178377979763], [95.39482751967438, 17.300003939630187], [95.39934552027961, 17.298634860310585], [95.4030420000883, 17.296581240431976], [95.4078339602691, 17.293158540334446], [95.41399464004064, 17.2871345701044], [95.41673279957911, 17.284670280209298], [95.41782792022241, 17.283027330347068], [95.41978092844715, 17.282171107410704], [95.41537913463941, 17.278747491803358], [95.40845192041985, 17.277015688023653], [95.4064052433074, 17.276385939559532], [95.40625673466064, 17.275977543928548]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
