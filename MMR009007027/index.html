
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung U</div><div class="name-mm">မြောင်းဦး</div></div>
        <span class="pcode-badge">MMR009007027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.67859178228497, 20.180912717148203], [94.68020530543055, 20.17709893606707], [94.68373385033698, 20.172287283431444], [94.68565851103153, 20.16811718376107], [94.68238015931695, 20.160831956629522], [94.6798845280486, 20.15528611006596], [94.67346899120105, 20.150153680947653], [94.66881901868283, 20.143953716990495], [94.66850309584123, 20.144289385346895], [94.66472286306976, 20.14830588261043], [94.6531615907349, 20.149406955866368], [94.64104978312105, 20.15353598170026], [94.6314153901082, 20.156288665289708], [94.62343260742892, 20.159591885956843], [94.62172297913224, 20.159754708213256], [94.62182391813934, 20.162984754642764], [94.62380334844585, 20.168383199624998], [94.62535246304577, 20.17260805991407], [94.63208877727533, 20.183193696432], [94.63338050770432, 20.18503902523088], [94.64107052868201, 20.180306705390194], [94.65133538781794, 20.17709893606707], [94.65743014818287, 20.17741971344907], [94.66833656118342, 20.179023596761624], [94.67859178228497, 20.180912717148203]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
