
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tigyaing</div><div class="name-mm">ထီးချိုင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Ni</div><div class="name-mm">ကမ်းနီ</div></div>
        <span class="pcode-badge">MMR005022013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.26941872029778, 23.846531039775698], [96.2716053597996, 23.839241940163447], [96.27427296032891, 23.829639029717498], [96.27514452030346, 23.82223068000195], [96.27533999964135, 23.820569550344544], [96.27267240001129, 23.813634059664196], [96.26680404037421, 23.808299130200737], [96.25613399978431, 23.799229649928463], [96.24759803961791, 23.80136364041971], [96.24638088007362, 23.801537519840736], [96.23639484044958, 23.802964109905815], [96.22757844019293, 23.807162340369757], [96.2251912797538, 23.808299130200737], [96.2299926000785, 23.81576805015544], [96.23415420025617, 23.822170019830594], [96.23692835965613, 23.822170019830594], [96.24012911966321, 23.829105509611622], [96.24439727961084, 23.8429764001408], [96.24706452041136, 23.85364634989918], [96.24720635968583, 23.853777030385686], [96.26040215973194, 23.849378369815952], [96.26941872029778, 23.846531039775698]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
