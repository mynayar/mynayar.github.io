
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hkat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hkat</div><div class="name-mm">လွယ်ခတ်</div></div>
        <span class="pcode-badge">MMR015021037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.70474155387967, 23.078636020036356], [98.6948825093204, 23.08873085424557], [98.70112210370218, 23.096464534610618], [98.71534188891712, 23.108496659593243], [98.7249128977121, 23.112598521404664], [98.7306555042482, 23.11916149940373], [98.73505771893866, 23.125542469909135], [98.73776539595633, 23.123810274924324], [98.74296108698462, 23.119708414012166], [98.75389938275038, 23.118341127041447], [98.7708537419067, 23.11150469218785], [98.77463271113078, 23.10899767190506], [98.7708537419067, 23.105488628797218], [98.76347039244473, 23.10111331103053], [98.75909507287935, 23.099472566305963], [98.75330659732168, 23.095120183050085], [98.73667156584014, 23.104668257334254], [98.72874130176973, 23.103027511710366], [98.71944374982922, 23.095644163147654], [98.70987274103425, 23.08197129164182], [98.70474155387967, 23.078636020036356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
