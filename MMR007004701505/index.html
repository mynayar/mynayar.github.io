
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boe Bon Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Boe Bon Ward</div><div class="name-mm">ဘိုးဘုံရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007004701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67650989361675, 17.4738911010935], [96.67645987961981, 17.473760754255466], [96.67611664886431, 17.474004669280134], [96.67592995500348, 17.474120547825066], [96.67582695295158, 17.474268614005382], [96.67570463705943, 17.474506808442527], [96.67558875941376, 17.4746999387512], [96.675382752612, 17.47494456963625], [96.67516529833989, 17.475199977097304], [96.67524424802366, 17.4752526611814], [96.67594052113822, 17.475717301312443], [96.67609409116943, 17.47585639046008], [96.67620176430006, 17.47595391024481], [96.67696768361179, 17.47664761129829], [96.67787796299763, 17.477252386488487], [96.67838200242755, 17.477147602879597], [96.67819368978701, 17.47665171490479], [96.6778187732179, 17.476093164867734], [96.6774438557494, 17.475733550263158], [96.67716075456525, 17.47529742223827], [96.67693886483681, 17.474838339917483], [96.67670932367639, 17.474394560460667], [96.67650989361675, 17.4738911010935]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
