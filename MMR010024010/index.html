
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Gyi (North)</div><div class="name-mm">ကန်ကြီး (မြောက်)</div></div>
        <span class="pcode-badge">MMR010024010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.86997155504326, 20.563289948672264], [95.8719023140406, 20.571399133763066], [95.87406840043639, 20.584395652137687], [95.87753413759043, 20.596092517056093], [95.87798132997443, 20.597881285692836], [95.8809998756438, 20.599558256008777], [95.88793135175052, 20.60345721098156], [95.89572926259547, 20.6082226006925], [95.90179430396404, 20.611255120927126], [95.91219151812413, 20.611688338745864], [95.91998942896902, 20.612987991302816], [95.9238883839418, 20.61515407679923], [95.92822055673338, 20.619486248691487], [95.93298594734364, 20.619486248691487], [95.93515203284011, 20.615587293718704], [95.93125307786732, 20.61038868708829], [95.92995342620969, 20.602157559323928], [95.93341916426306, 20.593493213740885], [95.93688490231642, 20.584828869057105], [95.93038664312911, 20.578330609869795], [95.9243216017606, 20.57269878631996], [95.91739012565381, 20.57529808873585], [95.91219151812413, 20.5765977412928], [95.90352717344035, 20.579197043708632], [95.89659569733362, 20.576164524373326], [95.8896642212269, 20.571832350682485], [95.88316596203958, 20.56879983044786], [95.87493483427522, 20.5640344398376], [95.86997155504326, 20.563289948672264]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
