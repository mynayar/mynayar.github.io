
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sint Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sint Bar</div><div class="name-mm">စင့်ဘာ</div></div>
        <span class="pcode-badge">MMR005006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69939327997594, 22.399281809807746], [95.69883204006663, 22.400123669671643], [95.69883204006663, 22.405596209797295], [95.69756915988887, 22.411489590372355], [95.69588544016102, 22.417382970048095], [95.6946225599832, 22.420329659885965], [95.69488895985768, 22.424594039982992], [95.69546423998275, 22.424539319833798], [95.69883204006663, 22.429169820231095], [95.70304152015007, 22.43127465020501], [95.70660264029965, 22.43149721982087], [95.70809303996191, 22.430432700408858], [95.71230287977414, 22.427064990257122], [95.71861692003489, 22.424539319833798], [95.72493132002444, 22.424539319833798], [95.72745708038002, 22.419066869640346], [95.73082487956458, 22.419372960193982], [95.73082487956458, 22.412752469650798], [95.72956200028614, 22.41233154016851], [95.72451047957503, 22.41064763967688], [95.71903812021316, 22.406017140178903], [95.71777524003534, 22.398439860011592], [95.71663331957211, 22.39082792986511], [95.71651235985757, 22.39002071998027], [95.70794724007311, 22.387522590395292], [95.706409320234, 22.3870740301424], [95.70388355987842, 22.392125549954244], [95.70219984015057, 22.395072239792057], [95.69939327997594, 22.399281809807746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
