
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saung Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saung Lin</div><div class="name-mm">စောင်လင်</div></div>
        <span class="pcode-badge">MMR005033016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49047844032782, 25.793701200350142], [95.4903733203725, 25.793623439570126], [95.47967520025037, 25.785705599633786], [95.4700927197033, 25.774475130323083], [95.45831316032417, 25.787109419763965], [95.4357300002394, 25.812316889712747], [95.41467287994953, 25.827697709581685], [95.42767319975843, 25.856323199556073], [95.44110120026022, 25.891113239984065], [95.445760319783, 25.90376328015128], [95.45288075963941, 25.9230957300839], [95.45568839989977, 25.936279290356993], [95.4577025997952, 25.945495649704526], [95.4876708000674, 25.931091329900994], [95.51709000020338, 25.917724619995283], [95.52508560002047, 25.89770510960318], [95.52508560002047, 25.880310089838815], [95.5156860002088, 25.85772701968625], [95.50769040039171, 25.832275380204692], [95.49688716031426, 25.8190918199316], [95.49047844032782, 25.793701200350142]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
