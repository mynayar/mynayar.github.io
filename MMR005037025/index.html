
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kar Lun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kar Lun</div><div class="name-mm">ကာလွန်း</div></div>
        <span class="pcode-badge">MMR005037025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69787587996797, 26.61071778020147], [95.7197264397235, 26.61907959025092], [95.7487183197947, 26.63287353028926], [95.76367200036259, 26.64251711976931], [95.7703247999496, 26.6467284902277], [95.78552256011812, 26.657470710404993], [95.79388428023543, 26.663085900094245], [95.79431160030015, 26.66333006962708], [95.79931632029201, 26.659728989900998], [95.81372064009554, 26.6646728698571], [95.81488019986142, 26.664306659624685], [95.82910163982888, 26.658081090170242], [95.85150156034877, 26.641479509871544], [95.86889640024873, 26.611877429899494], [95.87016863967102, 26.60974757988697], [95.87011715977917, 26.609680170303648], [95.87140452040234, 26.60734773001377], [95.86151136006129, 26.595886230265364], [95.83911144044066, 26.57849120960168], [95.81750496028576, 26.560485810072123], [95.80432140001267, 26.54687501966646], [95.77392587967569, 26.55609128998111], [95.77191167978026, 26.55627443961373], [95.75952155987216, 26.5568847303461], [95.75396845577967, 26.558746928627897], [95.7291260404345, 26.567077679691238], [95.70172104019389, 26.568481409889216], [95.70129407985797, 26.573913539877992], [95.69811995956854, 26.588073690148747], [95.69970720002732, 26.60168456958729], [95.69787587996797, 26.61071778020147]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
