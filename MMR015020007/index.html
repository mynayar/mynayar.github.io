
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mant Hkar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kunlong</div><div class="name-mm">ကွမ်းလုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mant Hkar</div><div class="name-mm">မန့်ခါး</div></div>
        <span class="pcode-badge">MMR015020007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.60749741227579, 23.460577180192786], [98.61621847270442, 23.468292663675527], [98.62520289329893, 23.472589997630337], [98.63340597570527, 23.47962185066791], [98.64629677877338, 23.481575384996063], [98.65254676482141, 23.486263305307318], [98.66153129962981, 23.486263508554146], [98.66816861019328, 23.486632414954045], [98.66769088312782, 23.485104421831636], [98.65592084487116, 23.469486486712015], [98.65524180366634, 23.461564346217642], [98.65529936927055, 23.45937688473549], [98.65551603663585, 23.455170956074824], [98.65560302266141, 23.45348240339024], [98.64829117200003, 23.45012799511096], [98.64460350105077, 23.448436227350044], [98.64283865078318, 23.448142085189147], [98.64050084783594, 23.447752451214683], [98.62966460623664, 23.44594641109802], [98.61789456797999, 23.444135636050817], [98.61472571142252, 23.445656687306325], [98.61235542496297, 23.446794425022745], [98.60884069184453, 23.457263754918415], [98.60749741227579, 23.460577180192786]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
