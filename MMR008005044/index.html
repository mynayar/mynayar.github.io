
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR008005044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39461162932332, 18.670316076825543], [95.39345813728329, 18.688195205244597], [95.41047214487367, 18.694251037555375], [95.412202383833, 18.693385919424713], [95.41768147102312, 18.69021381631461], [95.41998845510318, 18.691944054374687], [95.42863964630271, 18.695981275615452], [95.43036988436273, 18.693097546414663], [95.4332536153621, 18.69021381631461], [95.43700246359288, 18.696846394645434], [95.44305829680303, 18.701748736714876], [95.45199786101256, 18.707227823904987], [95.45543721205775, 18.703139468112], [95.45952023397166, 18.699056445298766], [95.46302219042178, 18.694671353700073], [95.45085862322696, 18.689501838339197], [95.44356048273016, 18.679162805818862], [95.42713966796134, 18.677338271144322], [95.42111885974765, 18.676755612081877], [95.42045510971559, 18.67669137800476], [95.41771290322794, 18.676426003357392], [95.40828613939385, 18.674905557345653], [95.40950249584358, 18.669431952422713], [95.40902178033093, 18.669460494206476], [95.40779084317296, 18.669533579411222], [95.40032676157085, 18.669976749127727], [95.39461162932332, 18.670316076825543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
