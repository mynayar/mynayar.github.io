
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpya Thee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpya Thee</div><div class="name-mm">ဖျသီး</div></div>
        <span class="pcode-badge">MMR009020021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.96687491494544, 21.79117567821504], [94.96687491494544, 21.790710102789035], [94.95731344795729, 21.790128915916796], [94.94159878175844, 21.789045144717704], [94.94156514801324, 21.789566476311904], [94.93397221694431, 21.792659892340225], [94.92609806787158, 21.7954720885661], [94.92159855283103, 21.7974406262839], [94.90769422370954, 21.802425196965316], [94.90669391229426, 21.802783798933206], [94.91400562266142, 21.80672087436892], [94.92328587074638, 21.810376730002133], [94.92666050657715, 21.81375136493358], [94.92684772024614, 21.8157171030619], [94.93425343674676, 21.814595024340974], [94.94437734423911, 21.81318892622801], [94.9545012508321, 21.814595024340974], [94.95589490592522, 21.815490945151055], [94.95731344795729, 21.814595024340974], [94.96125052159437, 21.812064047018225], [94.96546881683247, 21.80418989704617], [94.96687491494544, 21.795753308368546], [94.96687491494544, 21.79117567821504]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
