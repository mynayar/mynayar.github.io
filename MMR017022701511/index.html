
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (11) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (11) Ward</div><div class="name-mm">အမှတ် (၁၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58729207556888, 17.263451880000332], [95.58734682629506, 17.262896205995162], [95.5873583834827, 17.2627227654433], [95.58750966114201, 17.261931457370906], [95.58755300576667, 17.26140797549772], [95.58660623998605, 17.261357656630594], [95.58425717392947, 17.261266756755447], [95.58336565080418, 17.263320098743634], [95.58339794635822, 17.263744560762916], [95.58342939205284, 17.264673019044665], [95.58404385474017, 17.264663685880464], [95.58410419565217, 17.26563718131092], [95.58356197280688, 17.265655036450823], [95.58358067061152, 17.266846435814386], [95.5836180653215, 17.26783168808197], [95.58589342204385, 17.268189930321057], [95.58634957617204, 17.266641106202144], [95.58643116536604, 17.266098971490408], [95.58696488871868, 17.26612818866505], [95.58703996052583, 17.26570219330165], [95.58702131038524, 17.264284386914994], [95.58706007566201, 17.26419986323316], [95.58704817673203, 17.26347186653345], [95.58729207556888, 17.263451880000332]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
