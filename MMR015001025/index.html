
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Hto Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Hto Len</div><div class="name-mm">ပန်ထိုလင်</div></div>
        <span class="pcode-badge">MMR015001025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.89910922111375, 22.90237454674798], [97.89654879369192, 22.897538185239114], [97.88772954618167, 22.887011984915205], [97.8865971099687, 22.88387309107037], [97.87464291933532, 22.87762375343351], [97.86212527556108, 22.865959586066083], [97.8506606146957, 22.852241439990507], [97.84277982772693, 22.846614138231928], [97.83652100673913, 22.846329645796573], [97.82997769331593, 22.85059702423331], [97.82519823011427, 22.85682739696682], [97.82741726589416, 22.861407716093254], [97.83310710380988, 22.870511456038912], [97.83538303879624, 22.874209849604938], [97.84107287671196, 22.877054768562743], [97.84262124937123, 22.87913111520885], [97.84574802125422, 22.879083831553658], [97.87132093161574, 22.89965334572537], [97.87626194003656, 22.90516447126339], [97.88004826481563, 22.90237454674798], [97.88772954618167, 22.90180556277653], [97.89597980972053, 22.90123657880514], [97.89910922111375, 22.90237454674798]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
