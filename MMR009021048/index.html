
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaw Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaw Thar</div><div class="name-mm">ကျောသာ</div></div>
        <span class="pcode-badge">MMR009021048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.39192077072704, 21.74850944725324], [94.39281156899875, 21.75016378702918], [94.39855718736436, 21.760834219723506], [94.39910303987347, 21.776663940688366], [94.39918443301525, 21.77735578104449], [94.39977268226352, 21.782355897406774], [94.40292400743704, 21.782122465779196], [94.41547861334737, 21.787035138360977], [94.43731271011353, 21.794131219180485], [94.44386294022257, 21.795768776707746], [94.45205072606024, 21.79358536667138], [94.4569633977427, 21.79358536667138], [94.47060970867119, 21.787035138360977], [94.483243740906, 21.779960080093645], [94.48152675795359, 21.77557223567021], [94.47388482372571, 21.77284297402406], [94.46678874200688, 21.775026384060425], [94.45641754613291, 21.771751269005904], [94.4416795301862, 21.767930302341654], [94.43076248090381, 21.767930302341654], [94.42366639918504, 21.767930302341654], [94.4111117932747, 21.764109334778027], [94.40237815402867, 21.746096203776858], [94.39192077072704, 21.74850944725324]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
