
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Htan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Htan</div><div class="name-mm">မန်ထန်</div></div>
        <span class="pcode-badge">MMR015021030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.70414113860272, 23.19225455790155], [98.71041965564268, 23.189440051317376], [98.73300373213658, 23.185196367318554], [98.73612465213102, 23.181783244101496], [98.74460183080993, 23.1749468092479], [98.75007097869275, 23.17084494833574], [98.75916460036609, 23.166618425200227], [98.75909507287935, 23.16455542809058], [98.75444629825813, 23.15717207772923], [98.75034443734597, 23.15279675906322], [98.74733640475137, 23.14787452578878], [98.74679486988737, 23.14063216394328], [98.74214071372302, 23.138030060139215], [98.7399161210322, 23.140996185225845], [98.72682710019058, 23.157445534583815], [98.72436598310372, 23.159086280207703], [98.70358322078908, 23.142678835659808], [98.69155109490714, 23.13365474057389], [98.6852551705897, 23.13176999898633], [98.68252700072054, 23.134475113835492], [98.6830739162283, 23.142678835659808], [98.68608194702432, 23.15580479075851], [98.68772269174889, 23.162641225612106], [98.69100418029876, 23.169477661365022], [98.69975481673146, 23.180689413985306], [98.70330976303518, 23.18916659356347], [98.70414113860272, 23.19225455790155]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
