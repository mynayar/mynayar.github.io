
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thabeikkyin</div><div class="name-mm">သပိတ်ကျင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Gyi</div><div class="name-mm">ကျောက်ကြီး</div></div>
        <span class="pcode-badge">MMR010012005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09352930013716, 23.032096879367543], [96.0973634733457, 23.02059435794331], [96.10503182066208, 23.014204068662877], [96.10950502333822, 23.010369894555026], [96.1171733706546, 23.003340576706307], [96.12867589117951, 23.006535721346495], [96.14017841170437, 23.00845280795079], [96.14465161527988, 23.000784460634407], [96.1389003545678, 22.991199026713787], [96.12484171797098, 22.97777941868526], [96.11972948582718, 22.96819398476464], [96.11972948582718, 22.95605243477212], [96.1171733706546, 22.94646700085144], [96.10311473405778, 22.939437682103403], [96.09608541530974, 22.936881566930822], [96.08586095192146, 22.941993798175304], [96.07755357603679, 22.94518894281549], [96.07755357603679, 22.950940202628317], [96.07755357603679, 22.95860855084402], [96.0756364894325, 22.968833014232246], [96.07180231622397, 22.97650136064931], [96.06860717068446, 22.98161359279311], [96.07691454656913, 22.986725824037592], [96.07947066264103, 22.992477084749737], [96.08649998138907, 22.996950287425875], [96.09225124210121, 23.009091837418396], [96.09225124210121, 23.01676018383546], [96.09161221263355, 23.02315047401521], [96.09352930013716, 23.032096879367543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
