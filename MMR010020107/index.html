
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byi Sin Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byi Sin Inn</div><div class="name-mm">ဗြိစင်အင်း</div></div>
        <span class="pcode-badge">MMR010020107</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51901906487802, 20.855149227355014], [95.52179825508546, 20.852308132314477], [95.52500785992487, 20.849027034969765], [95.52345437641839, 20.835045669921783], [95.52167029504812, 20.832072203669327], [95.51642805421142, 20.826463820948618], [95.51908642859587, 20.82301110507848], [95.51828350308125, 20.821055749623213], [95.51519006367056, 20.81575271191815], [95.51072185672837, 20.816096421113002], [95.50762848296819, 20.819533503168714], [95.50247285943499, 20.821939461237207], [95.49834835988895, 20.82331429441922], [95.49319273635575, 20.823658001815375], [95.48563115385474, 20.8264076681794], [95.48116294691255, 20.82950104193958], [95.478756988844, 20.833281833190085], [95.47669473997036, 20.837750041031597], [95.47669473997036, 20.84221824797379], [95.4742887819018, 20.844967914337815], [95.47531990678834, 20.84771757980252], [95.48047553122086, 20.848404997292846], [95.48563115385474, 20.846342746620508], [95.48975565430004, 20.846342746620508], [95.49662981931078, 20.846342746620508], [95.50797219126366, 20.850467246166545], [95.5148463562744, 20.85287320423504], [95.51901906487802, 20.855149227355014]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
