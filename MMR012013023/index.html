
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Kaik Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Kaik Chaung</div><div class="name-mm">ဝက်ကိုက်ချောင်း</div></div>
        <span class="pcode-badge">MMR012013023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.953294583878, 19.07167732135133], [93.9532145001491, 19.070716625072237], [93.95373402140802, 19.06854813658731], [93.95371843795562, 19.066573603089353], [93.95488392605239, 19.06282378628873], [93.95435359764048, 19.060408052589594], [93.9546060975934, 19.056583814191697], [93.9537439939902, 19.054310862256557], [93.95383191980733, 19.052857116262942], [93.95409268003323, 19.050704800286326], [93.95367961422289, 19.050745363307897], [93.95365983093649, 19.05082982223854], [93.94300478384378, 19.05017154727915], [93.93801028284832, 19.0498626472434], [93.90787155942496, 19.046391956623552], [93.90775217442336, 19.04678729140045], [93.9051966060386, 19.05524978504957], [93.91590328500865, 19.06611626455401], [93.94290968413469, 19.072028908607308], [93.95282531493638, 19.071708015212778], [93.953294583878, 19.07167732135133]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
