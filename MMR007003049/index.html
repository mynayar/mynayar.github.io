
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Myint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Myint</div><div class="name-mm">ကံမြင့်</div></div>
        <span class="pcode-badge">MMR007003049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71542994373698, 16.992863522833375], [96.72295261527103, 16.991495763718547], [96.73047528590575, 16.991837703946942], [96.73970765408501, 16.99081188506051], [96.74496108968259, 16.99081188506051], [96.74697174804777, 16.990982858771986], [96.7497606976981, 16.988760247287644], [96.75694142990312, 16.98670860861546], [96.76309634322172, 16.982263392841332], [96.7686894698432, 16.98309931538114], [96.77036694737677, 16.980489893793617], [96.76884092826629, 16.980724665411003], [96.76952480692438, 16.974911689622843], [96.76945996040888, 16.97171042689473], [96.7674731682522, 16.96670513763206], [96.76532895067061, 16.962416685381754], [96.7612453783716, 16.963333322075187], [96.75543691718002, 16.9614050730857], [96.75099170140595, 16.96174701331404], [96.74791424384733, 16.963114770630227], [96.74699343879621, 16.963114770630227], [96.74433356704054, 16.966439610099997], [96.74378635925314, 16.96862844304826], [96.74050310983074, 16.973188512140155], [96.73685505491693, 16.975559747384466], [96.73414432919748, 16.98073477019352], [96.72739782834714, 16.98397309128518], [96.71987515681309, 16.986366669286383], [96.71542994373698, 16.992863522833375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
