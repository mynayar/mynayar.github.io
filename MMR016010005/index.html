
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Nang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghpyak</div><div class="name-mm">မိုင်းဖြတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Nang</div><div class="name-mm">နမ့်နန်း</div></div>
        <span class="pcode-badge">MMR016010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.03417662984765, 20.956327123198207], [100.0294177143561, 20.954088393164852], [100.00895154307932, 20.983220184364086], [99.98764968398581, 21.017389342744025], [99.99746417523158, 21.02262373789523], [100.01036160630315, 21.029568507780482], [100.02894198018828, 21.03775642671775], [100.03534129686341, 21.03810561817977], [100.0407482728146, 21.0355990862289], [100.05441406935387, 21.03282570294391], [100.06201589381851, 21.027698849622254], [100.07057824818764, 21.02346201665881], [100.0762912103711, 21.021334390669665], [100.08325526711695, 21.016210661592822], [100.08512126863172, 21.010222864793434], [100.08571441558786, 21.004243171784992], [100.08917752492289, 20.999141524661695], [100.0905444566614, 20.996624056954715], [100.08995674790566, 20.99459963986152], [100.08913390690435, 20.99073522604988], [100.08755210824324, 20.989525024560294], [100.08345912903565, 20.986682669569575], [100.0790911938036, 20.98097350342448], [100.07040058262083, 20.97576949186862], [100.06299314122055, 20.971991245699485], [100.05686856383323, 20.969638946580176], [100.05099531188421, 20.96680679259947], [100.04603417034076, 20.965508272288957], [100.0420718464386, 20.96447118040072], [100.03797213130889, 20.960432505855522], [100.03417662984765, 20.956327123198207]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
