
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Ba Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Ba Lu</div><div class="name-mm">တောင်ဘလူ</div></div>
        <span class="pcode-badge">MMR009003019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83052393223375, 20.61970102388318], [94.81368146942435, 20.610141788113083], [94.80229328510705, 20.6051777075852], [94.80237893743805, 20.604893732259995], [94.79992624430082, 20.604030214023226], [94.79840411565749, 20.608879667862425], [94.79694310314176, 20.61258834607537], [94.79187679128097, 20.625448815010827], [94.78899942118642, 20.63257379914154], [94.78726779637174, 20.636861674926422], [94.78714222223584, 20.637205858963284], [94.78677516484203, 20.6382119206437], [94.78483713302734, 20.639997497586478], [94.77995206063912, 20.645281512831616], [94.77788000465853, 20.64687541097146], [94.77882587561373, 20.647818112715754], [94.77864269630345, 20.647958728012952], [94.7800729636964, 20.65143223710811], [94.79783746003079, 20.662475032296925], [94.81084496182558, 20.6638206348145], [94.81224110534282, 20.661994910336887], [94.81176098338273, 20.647111143964196], [94.83475880287654, 20.647111143964196], [94.83480681498258, 20.6466310220041], [94.83624717906412, 20.63846895677699], [94.84392912323051, 20.635588227714607], [94.84440924519055, 20.628386404608932], [94.83048572183867, 20.619744218321046], [94.83052393223375, 20.61970102388318]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
