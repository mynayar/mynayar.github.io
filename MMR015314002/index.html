
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Hkit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Hkit</div><div class="name-mm">နောင် ခေတ်</div></div>
        <span class="pcode-badge">MMR015314002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.97328229234398, 22.472537665381026], [98.98461078865705, 22.462381073827544], [98.99398607799515, 22.458084144567692], [98.99919842626645, 22.45377831741547], [99.00297081515106, 22.45066201543972], [99.01591638513315, 22.447298827079237], [98.93911802807457, 22.4096969312684], [98.93911802807457, 22.345094565561794], [98.91409952907009, 22.338811423308584], [98.89293351437027, 22.345111088805766], [98.86901547708266, 22.347103620435803], [98.87257793542346, 22.359572220581583], [98.87733685631093, 22.38068993719088], [98.8713281889448, 22.434642488959753], [98.87339131915411, 22.436388370726775], [98.87640630081017, 22.43893973657964], [98.8838282680602, 22.44089314410337], [98.89092765568682, 22.439414207199945], [98.89320349624444, 22.438940106201017], [98.90609454482745, 22.431908710019], [98.91429794559377, 22.427221105369767], [98.9232823733829, 22.431909088633574], [98.93109475431953, 22.442456778257736], [98.93890719371205, 22.450660575625136], [98.94671965378905, 22.45808307437443], [98.95804791627836, 22.461208514361488], [98.96586050495841, 22.463552579288148], [98.97328229234398, 22.472537665381026]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
