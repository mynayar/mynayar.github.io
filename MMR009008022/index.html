
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit Kone</div><div class="name-mm">ရွာသစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009008022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7391298031979, 20.287123969195875], [94.73708864432552, 20.28508498488418], [94.73075540803569, 20.279250670881822], [94.72862162079122, 20.277116713665464], [94.72397745519544, 20.274606141060588], [94.72083957488655, 20.269208524353985], [94.71894416733949, 20.267042169960234], [94.71820372672067, 20.26619588543184], [94.71594440580975, 20.2648150753555], [94.7117393027267, 20.26473565802422], [94.71082035207763, 20.266675664750153], [94.70952648575877, 20.274277127687355], [94.7145402160582, 20.27573272718365], [94.7171279477966, 20.279452592063535], [94.71939221407945, 20.28478978871783], [94.72011206741803, 20.28536567138866], [94.72181821174115, 20.28673058774649], [94.72958140785573, 20.28802445406535], [94.7383976651202, 20.288431357721038], [94.7391298031979, 20.287123969195875]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
