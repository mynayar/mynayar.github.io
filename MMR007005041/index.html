
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Win Ga Baw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Win Ga Baw</div><div class="name-mm">ဝင်္ဂဘော်</div></div>
        <span class="pcode-badge">MMR007005041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67885869527265, 17.91194928603079], [96.68187643604875, 17.90893154525463], [96.68795698172937, 17.907609686637784], [96.69139381197488, 17.90813843044424], [96.69430189931325, 17.90813843044424], [96.69615249993797, 17.908402802347496], [96.6987962162724, 17.910782145879352], [96.70018207874, 17.910320191123958], [96.69958933018353, 17.907609686637784], [96.6985318443692, 17.904437229194798], [96.69694561474836, 17.897827939707724], [96.69615249993797, 17.89333362364789], [96.69551800934869, 17.891077652711544], [96.6906006980638, 17.89042553720884], [96.68438796643159, 17.89055772316044], [96.67870397770645, 17.887517449870472], [96.67536506294738, 17.886945623142026], [96.67248571794158, 17.886881148945918], [96.6723590610219, 17.889368049595873], [96.6742096607473, 17.89518422517193], [96.67526714836026, 17.898621055417436], [96.67632463417459, 17.902850998674694], [96.67658900517853, 17.90628782981952], [96.67843960580325, 17.90998903106896], [96.67885869527265, 17.91194928603079]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
