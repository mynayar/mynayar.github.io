
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yin</div><div class="name-mm">မယင်း</div></div>
        <span class="pcode-badge">MMR008011025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65084713129016, 18.303231410201477], [95.64866527258431, 18.30414638224977], [95.639876066927, 18.302681303899078], [95.63315328209836, 18.296891787825814], [95.63165178120482, 18.304023917969516], [95.63079917714037, 18.309707941768124], [95.62994657307593, 18.315960370374853], [95.63307278737932, 18.316812972640605], [95.63506219566386, 18.318802381824526], [95.63762000695783, 18.317665576705053], [95.63762000695783, 18.31567616842051], [95.63762000695783, 18.31482356525538], [95.63904101313233, 18.314255162246013], [95.64330403165582, 18.314255162246013], [95.64529343994036, 18.316812972640605], [95.64813545318867, 18.316812972640605], [95.65040906342762, 18.316244571429877], [95.65325107487729, 18.315960370374853], [95.6543878799967, 18.317097174595006], [95.65551350834181, 18.3184479293285], [95.6558088861712, 18.318802381824526], [95.66035610574971, 18.317665576705053], [95.6649033262276, 18.316812972640605], [95.66547172833765, 18.316244571429877], [95.66327761277165, 18.313104818732427], [95.66737850961061, 18.305627503606445], [95.66770859497575, 18.305025647615594], [95.66975954926386, 18.297408008572802], [95.65774754661203, 18.300337691331436], [95.65084713129016, 18.303231410201477]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
