
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Zin</div><div class="name-mm">လယ်ဇင်</div></div>
        <span class="pcode-badge">MMR005012004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17180751970136, 22.075694550063474], [95.1695362800753, 22.077607319921924], [95.16565692043059, 22.08189482968271], [95.16096107979007, 22.083936479584906], [95.1577019996476, 22.086487349911295], [95.16435911957774, 22.088114729810968], [95.17085064014498, 22.09037255964597], [95.1722618401119, 22.092348149847282], [95.1700039203447, 22.096017179649152], [95.16514103962731, 22.099611509963268], [95.17068414685593, 22.108015527894338], [95.17084128000113, 22.10825376010297], [95.17909644034853, 22.1160856500328], [95.18572152013212, 22.11846074966394], [95.19256187962708, 22.112160569754565], [95.19954695982437, 22.109620500285928], [95.20350479970682, 22.107861539678368], [95.20194671976537, 22.099877640041086], [95.19961824008976, 22.09162238976154], [95.1976043999232, 22.085580239736316], [95.19665508006796, 22.082732010374002], [95.19636203957651, 22.07921552987284], [95.19417252044553, 22.079324970171285], [95.18909219984522, 22.07953664989651], [95.18041368004737, 22.078901609821514], [95.17258188004979, 22.076149859728275], [95.17180751970136, 22.075694550063474]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
