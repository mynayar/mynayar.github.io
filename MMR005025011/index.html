
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ahr Ma Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ahr Ma Khan</div><div class="name-mm">အာမခံ</div></div>
        <span class="pcode-badge">MMR005025011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73720984036191, 23.894325630423566], [95.7376310396408, 23.894290529884074], [95.73875063983024, 23.88962519964332], [95.7389371196524, 23.883093810331104], [95.73875063983024, 23.876748989874045], [95.73688439999512, 23.873016690068255], [95.73669792017296, 23.869284480194665], [95.73564311973422, 23.866421760056255], [95.73352523969811, 23.86741833029174], [95.72904683983984, 23.867978220318662], [95.72214204032298, 23.866112070415795], [95.71281155970576, 23.86667186961114], [95.70572028036668, 23.86667186961114], [95.70519719959117, 23.86572119987352], [95.70105468032932, 23.868538020413382], [95.69900195977266, 23.87077739975723], [95.69956211959618, 23.877122220214346], [95.69993579959754, 23.878290419767097], [95.70105468032932, 23.88178754955584], [95.70907908003556, 23.884959960234028], [95.71561056017924, 23.88999842998362], [95.71654367964715, 23.894103960129712], [95.71859640020375, 23.895783450346016], [95.72587416026437, 23.895783450346016], [95.7309127199461, 23.894850329978794], [95.73720984036191, 23.894325630423566]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
