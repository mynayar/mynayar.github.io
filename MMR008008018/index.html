
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ku Wet Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ku Wet Hla</div><div class="name-mm">ဆင်ကူးဝက်လှ</div></div>
        <span class="pcode-badge">MMR008008018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7451268978881, 17.821928934372863], [95.74801478465463, 17.81759710422301], [95.7517690378109, 17.817308314826903], [95.74849223472893, 17.807633695138975], [95.74102604871325, 17.807340903759723], [95.73853731974157, 17.80968323659215], [95.73575579939069, 17.812171965563834], [95.73458463297447, 17.81466069543478], [95.73088379325253, 17.818331406069603], [95.73088379325253, 17.82145245556643], [95.73150800279217, 17.8233250868833], [95.73150800279217, 17.826758241599634], [95.72651432197841, 17.82738245293791], [95.72432958634141, 17.830815607654245], [95.72245695592386, 17.835185078928305], [95.72308116636282, 17.838930339763408], [95.72495379678037, 17.841115076299786], [95.72755763357799, 17.84393985763836], [95.72823153605663, 17.84536281624105], [95.7291809008779, 17.8440112053529], [95.73059613160626, 17.844018151716398], [95.73248076887245, 17.844476388674423], [95.7364632375884, 17.838967467374744], [95.73732960397808, 17.833191692942307], [95.74021749074467, 17.826838342415613], [95.74397174390094, 17.823661666252917], [95.7451268978881, 17.821928934372863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
