
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bon Maw Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawei</div><div class="name-mm">ထားဝယ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Bon Maw Ward</div><div class="name-mm">ဘုမ္မော်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006001701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.19024227835854, 14.06797197252854], [98.19074638883484, 14.068076007002162], [98.1912116656859, 14.068247939390915], [98.19170230971389, 14.068292828151527], [98.19206618980286, 14.068245006701773], [98.1923803976373, 14.068215702292889], [98.19276695233305, 14.068219387714635], [98.19302988442166, 14.068261516455891], [98.19342428390365, 14.06841636622238], [98.19361559758181, 14.06853001534796], [98.19386915603678, 14.068622452164504], [98.19419547414185, 14.06868165903137], [98.19446075436036, 14.068795519497655], [98.19449596821443, 14.068591709739678], [98.19491619082959, 14.067438306732527], [98.19574556000964, 14.065200952661883], [98.19463918974685, 14.064853999612467], [98.1918364894625, 14.064222390450993], [98.19203097594885, 14.062849686863615], [98.19205210372166, 14.062754042165352], [98.1923490769484, 14.06282577568902], [98.1923948551385, 14.062321363939816], [98.19242654814673, 14.062005962705086], [98.19201688986766, 14.061990022221778], [98.19201688986766, 14.061840861566566], [98.19161635610999, 14.061822728536129], [98.19147459147928, 14.062599758072452], [98.19024227835854, 14.06797197252854]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
