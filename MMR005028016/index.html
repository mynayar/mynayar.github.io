
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tun Hlaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tun Hlaw</div><div class="name-mm">တွန်လှော်</div></div>
        <span class="pcode-badge">MMR005028016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.39947108022625, 23.472898379656556], [94.40069580037095, 23.468688990404644], [94.40051255990676, 23.466491729909478], [94.3994750399412, 23.459289569558052], [94.39892568007616, 23.452697789871138], [94.39727796020975, 23.44348142962434], [94.39601868001813, 23.43873519007701], [94.39489764001411, 23.434509239809643], [94.39227287958977, 23.42791746012273], [94.38812243999865, 23.416503930212286], [94.38803388015953, 23.41649574008636], [94.38730452008758, 23.416428600299696], [94.38732899963367, 23.416503930212286], [94.38348384030706, 23.416076700079714], [94.38067620004665, 23.413513140319196], [94.36950683966899, 23.413330079719458], [94.35510251986545, 23.414123520084445], [94.34472659985278, 23.414672879949478], [94.34649672014757, 23.420898450303298], [94.35089124023858, 23.42767337962283], [94.35650651986009, 23.43231198021374], [94.36468500041252, 23.434875450042057], [94.37091047993476, 23.437072709637903], [94.37829587985101, 23.441894549793687], [94.37700275996946, 23.446989540135235], [94.37700275996946, 23.447875949715353], [94.37344883979216, 23.447875949715353], [94.37905116018294, 23.455516499886585], [94.3823768396195, 23.459027220230098], [94.3879642231704, 23.46450312561882], [94.39161505429138, 23.468081240257106], [94.39826652108314, 23.471222492124355], [94.39947108022625, 23.472898379656556]]]]};
        const layer = L.geoJSON(geojsonData, {

        map.fitBounds(layer.getBounds());

</body>
</html>
