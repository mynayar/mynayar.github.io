
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kauk Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kauk Gyi Kone</div><div class="name-mm">ကောက်ကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR017007015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22429807329752, 17.01484904204972], [95.22410507968573, 17.014915439895674], [95.22095400002712, 17.01557558994159], [95.21611811965556, 17.015181390109092], [95.21268227956364, 17.015308199913534], [95.21060040028829, 17.016045929975746], [95.20851852011367, 17.016783660037902], [95.20745867987421, 17.01751023041288], [95.2063988396348, 17.018236889820685], [95.20589483977511, 17.019828990215785], [95.2062393601584, 17.02048446018972], [95.2068592799319, 17.021852099694684], [95.20718039995558, 17.022485520090754], [95.20740539684164, 17.02286298174124], [95.20763687963836, 17.023251329685195], [95.20836300035222, 17.024305139970295], [95.20945416038126, 17.026237440405623], [95.21000496006093, 17.02763928022864], [95.21193815981826, 17.027104320308183], [95.21264627970208, 17.02668716977712], [95.21474112000675, 17.025453629981087], [95.21626680007284, 17.024855939649967], [95.21779283986774, 17.02425834015031], [95.22186191959196, 17.025433649743206], [95.22817500836999, 17.024869635425375], [95.22725306028059, 17.02049038492339], [95.22429807329752, 17.01484904204972]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
