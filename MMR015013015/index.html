
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hsam Ma Hse</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hsam Ma Hse</div><div class="name-mm">ဆမ္မဆယ်</div></div>
        <span class="pcode-badge">MMR015013015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.64559268195677, 22.18484583067061], [96.64454915362063, 22.183433999379645], [96.63420919299989, 22.165606478556185], [96.63449441388616, 22.163800077811402], [96.63419723291605, 22.16378521921257], [96.63286485043255, 22.16644998417945], [96.6212065025781, 22.180440001604836], [96.61625223275439, 22.203559928348056], [96.62244302992195, 22.216593186726243], [96.63028713804107, 22.23014210197647], [96.6384877976738, 22.233707606321047], [96.64597535607788, 22.241908265054462], [96.65782089871556, 22.260293914132887], [96.67663869092291, 22.2604488862072], [96.68650717656499, 22.261728134046223], [96.6909007074018, 22.246899970956918], [96.69813260743393, 22.207875921436653], [96.68662210182862, 22.209105628322163], [96.67556903907996, 22.20625322520624], [96.66736838034655, 22.201974619633063], [96.65667186821219, 22.199835317745794], [96.64559268195677, 22.18484583067061]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
