
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pauk Sin Oe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Pauk Sin Oe</div><div class="name-mm">ကျွန်းပေါက်ဆင်အိုး</div></div>
        <span class="pcode-badge">MMR012009094</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.27492245780525, 21.09140340504314], [92.27242156640222, 21.0996876080967], [92.26801159685778, 21.104412575080346], [92.2655294347357, 21.11106928312097], [92.26739838063082, 21.11264620565794], [92.26599836463288, 21.114357337621072], [92.26544684639492, 21.119804572622968], [92.26254878919531, 21.13125189455934], [92.26236383462333, 21.13145006107152], [92.27747377869201, 21.132411117978734], [92.28435025406105, 21.137637239367166], [92.2890522352725, 21.118105934941013], [92.29579970918928, 21.10198696862375], [92.300110595028, 21.08792973137207], [92.2995798466327, 21.087558207045674], [92.30024890806072, 21.08738048841883], [92.29998387335712, 21.087087696140316], [92.28769895883994, 21.081890233447552], [92.28755824012075, 21.08200692677832], [92.28124150459183, 21.08724519530955], [92.27494154861364, 21.091340165616202], [92.27492245780525, 21.09140340504314]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
