
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mauk Kyoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mauk Kyoe</div><div class="name-mm">မောက်ကြိုး</div></div>
        <span class="pcode-badge">MMR005006045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69939327997594, 22.399281809807746], [95.6946225599832, 22.399281809807746], [95.68704527981589, 22.399281809807746], [95.68121508021181, 22.39863399036642], [95.67946799964852, 22.398439860011592], [95.6702069997533, 22.398018929629927], [95.66178767985758, 22.39717697983383], [95.6558944800463, 22.396756050351485], [95.65042176005625, 22.39465122037757], [95.64537024024446, 22.39591409965601], [95.64284447988888, 22.401386549849462], [95.64024960033885, 22.406205420443825], [95.64073991971156, 22.406859000042857], [95.64284447988888, 22.414857209692514], [95.64316595964141, 22.4187123595878], [95.64705431970117, 22.416120089870276], [95.65421039969027, 22.416120089870276], [95.66515547994152, 22.411489590372355], [95.67315359965897, 22.41233154016851], [95.67652139974285, 22.421592540063727], [95.68132020016714, 22.42879091966529], [95.68662444026575, 22.42538117969775], [95.69488895985768, 22.424594039982992], [95.6946225599832, 22.420329659885965], [95.69588544016102, 22.417382970048095], [95.69756915988887, 22.411489590372355], [95.69883204006663, 22.405596209797295], [95.69883204006663, 22.400123669671643], [95.69939327997594, 22.399281809807746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
