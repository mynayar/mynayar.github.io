
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyi Pin La Har</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyi Pin La Har</div><div class="name-mm">ကြီးပင်လဟာ</div></div>
        <span class="pcode-badge">MMR013005027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85627207529609, 17.437343801575253], [95.8551059459827, 17.435049606753978], [95.85295950617632, 17.427537068780737], [95.85338879395772, 17.422600258395278], [95.85081306726931, 17.42238561360523], [95.85069008857681, 17.422168037025358], [95.84802269489154, 17.41744880411909], [95.84741466235687, 17.41542202810416], [95.84736929515691, 17.4153285903422], [95.84568880489451, 17.417097527129215], [95.83983863044847, 17.419362110872783], [95.83908376920067, 17.425778431929132], [95.84002734598528, 17.432194752985538], [95.84002734598528, 17.43634649029832], [95.84021606062277, 17.438611073142567], [95.83436588617678, 17.44200794920755], [95.83405350216748, 17.447069668230654], [95.83383885827675, 17.453508986750364], [95.83641458586453, 17.454582207103215], [95.83834638088081, 17.4580165102538], [95.84178068493071, 17.463811896202117], [95.84451656738571, 17.454469897068122], [95.850607262815, 17.442991278724605], [95.85627207529609, 17.437343801575253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
