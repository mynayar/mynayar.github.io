
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kant Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kant Hpyu</div><div class="name-mm">ကန့်ဖြူ</div></div>
        <span class="pcode-badge">MMR010030051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11742394875631, 20.792607887444092], [96.11563155405304, 20.791054477682053], [96.1096529222446, 20.78601984084304], [96.10115697201672, 20.781614534283392], [96.09549300579766, 20.77893160211181], [96.09517834110761, 20.778782550274514], [96.08888504370987, 20.7775238906151], [96.08479440184021, 20.776265231855007], [96.0810184237613, 20.782873193043486], [96.08133308935066, 20.789166490441232], [96.0822770834207, 20.796718444800433], [96.0835357421808, 20.80206774722882], [96.08510906742958, 20.804585065648325], [96.09297568737816, 20.807102384067832], [96.100174014819, 20.808747716234166], [96.10021297794663, 20.808046379037194], [96.10241563167614, 20.804270400958274], [96.105876945065, 20.804270400958274], [96.11154091128407, 20.804585065648325], [96.11500222377367, 20.804585065648325], [96.11563155405304, 20.794201127280246], [96.11742394875631, 20.792607887444092]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
