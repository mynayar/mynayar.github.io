
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bawm Myan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bawm Myan</div><div class="name-mm">ဘောမ်မြန်</div></div>
        <span class="pcode-badge">MMR001005024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.39691095777454, 25.97052779682042], [98.41004321622154, 25.97893244337763], [98.41687198975058, 25.989438248876127], [98.41687198975058, 25.994165861665238], [98.42107431302918, 26.005722248882705], [98.42947895778775, 26.013076313720944], [98.43840889295609, 26.022531540198486], [98.44366179705435, 26.027784443397422], [98.44786411943363, 26.015177475360247], [98.44943998976379, 26.007298120112182], [98.46782515230899, 25.99153940961611], [98.48778618428503, 25.972628959359042], [98.50984837790037, 25.953718507303336], [98.50443763918577, 25.9504814479605], [98.49278788255481, 25.9504814479605], [98.47392637340346, 25.95214569826544], [98.4617218672704, 25.954919450272484], [98.45395536344932, 25.953255199068224], [98.44008660611206, 25.947152945552034], [98.41956084485719, 25.94437919444431], [98.40830416930203, 25.94437919444431], [98.41056850573199, 25.95214263607386], [98.40899263540189, 25.9631737328815], [98.39691095777454, 25.97052779682042]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
