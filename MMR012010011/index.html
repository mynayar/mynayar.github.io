
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga/ Kyin Tauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga/ Kyin Tauk</div><div class="name-mm">င/ကျဉ်တောက်</div></div>
        <span class="pcode-badge">MMR012010011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.50227256842436, 20.91915929686411], [92.49725933185272, 20.923355871676165], [92.49560018520043, 20.92474465694039], [92.49008332288707, 20.927746309744464], [92.48686811167408, 20.928598973164128], [92.47768565766705, 20.929864570193786], [92.47103233827187, 20.929628509847873], [92.46713092005598, 20.929831949984532], [92.4671065196502, 20.936730224919984], [92.4666330940421, 20.940824639445623], [92.48016721814264, 20.94215984669961], [92.48750805755088, 20.942828775027976], [92.49278371899351, 20.943491260613257], [92.50264605417215, 20.945029311753387], [92.5038026641617, 20.94223021595178], [92.50547406137889, 20.936951872730788], [92.50612140687747, 20.934907416943815], [92.50890092174018, 20.92693917720129], [92.50867674593513, 20.925321722219735], [92.50845257192873, 20.92370426633886], [92.50719416497878, 20.92262276143134], [92.50593576792141, 20.921541255624504], [92.50227256842436, 20.91915929686411]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
