
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Hpyu</div><div class="name-mm">မြေဖြူ</div></div>
        <span class="pcode-badge">MMR009019033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15242322924871, 21.646370650085487], [95.15242322924871, 21.660705942425352], [95.15424960033886, 21.663952825062893], [95.16825178109485, 21.66862021834845], [95.1825964056996, 21.671588071932035], [95.19663582558292, 21.672556308127184], [95.20980172856696, 21.67109342861886], [95.21227493973674, 21.662684511181283], [95.21227493973674, 21.654770235258184], [95.22018921565984, 21.648834528091072], [95.22098364168176, 21.648834528091072], [95.22097590121695, 21.64857910444215], [95.2208317416916, 21.643821814025557], [95.2053499486413, 21.644877389679834], [95.20337137988531, 21.635479188313923], [95.19100532403655, 21.642898820923904], [95.1736928449489, 21.643393464237022], [95.17240141489344, 21.642360320372518], [95.16874642260939, 21.63943632582584], [95.16713077436583, 21.638251516694197], [95.16726249626726, 21.63993096823964], [95.15242322924871, 21.646370650085487]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
