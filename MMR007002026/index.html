
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Auk Ta Ke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Auk Ta Ke</div><div class="name-mm">အောက်တကဲ</div></div>
        <span class="pcode-badge">MMR007002026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70498126497347, 17.303241765195366], [96.68402538586292, 17.306132231217532], [96.67590050400514, 17.30633231688296], [96.67318613783004, 17.309022697239755], [96.6666825888305, 17.314803629284086], [96.66632128080255, 17.322391103266852], [96.6677665138136, 17.327449418356025], [96.66999078904377, 17.337613054299084], [96.67768259787363, 17.35247064860158], [96.67780184078237, 17.352399126418618], [96.67786257559743, 17.352818296826968], [96.68448511119897, 17.36039437100345], [96.68415143843822, 17.35424377173274], [96.68686556629291, 17.346962596946355], [96.68410537336433, 17.33988959992513], [96.68474800191882, 17.33214642631657], [96.6856989549429, 17.324864398073544], [96.68797211012486, 17.317520357978196], [96.68872239292415, 17.31733278727836], [96.69522594192375, 17.31733278727836], [96.69992294898498, 17.31733278727836], [96.7038973399903, 17.3155262462393], [96.70461995694552, 17.308661389211807], [96.70498126497347, 17.303241765195366]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
