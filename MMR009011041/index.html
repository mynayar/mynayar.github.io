
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Dat Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Dat Kaing</div><div class="name-mm">မဏ္ဍပ်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009011041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.3275052868396, 20.317892069663344], [94.3216329126289, 20.315974560377697], [94.25122879017658, 20.29813460103105], [94.21331887836362, 20.287621768230053], [94.1245458863836, 20.266132083928596], [94.12543126624001, 20.271444363066962], [94.12806853173743, 20.278795306358347], [94.12565415241727, 20.280118725298962], [94.12512772256639, 20.283269864312842], [94.12414353689479, 20.28506268079815], [94.12115939029371, 20.286617269571366], [94.12076756017484, 20.2868213940921], [94.12056499327986, 20.286856860655632], [94.11837157288983, 20.287240904444218], [94.11739911167973, 20.288129821334223], [94.11403819590606, 20.288987958927237], [94.1125962481184, 20.289419101110695], [94.11210414359141, 20.2903155039574], [94.10831391575465, 20.29121785581947], [94.10491562325745, 20.29348338475046], [94.11071315408884, 20.295549630211326], [94.16234756658696, 20.309284574723392], [94.24708737078561, 20.334770230162064], [94.29073155601657, 20.34209735580839], [94.30092581837187, 20.350698765036043], [94.3082529440182, 20.36280445096469], [94.3213143421832, 20.350380193691024], [94.32290719621022, 20.34146021491705], [94.32290719621022, 20.335088800607707], [94.32577433201988, 20.32298311467906], [94.3275052868396, 20.317892069663344]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
