
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wea Het</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wea Het</div><div class="name-mm">ဝဲဟက်</div></div>
        <span class="pcode-badge">MMR005034025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6402187439, 24.438357290256818], [94.67247697243437, 24.43747350309974], [94.6791485939325, 24.43718960511626], [94.68355780085187, 24.43700197865843], [94.70103050405459, 24.401305695901215], [94.67996481142694, 24.398797875221817], [94.66105555906688, 24.39654677411437], [94.62679132076289, 24.390836068329918], [94.57729853220155, 24.38798071363908], [94.53800200608777, 24.39328040406747], [94.5429633580726, 24.399320838186156], [94.54366796160718, 24.400178686197478], [94.54566436302002, 24.417997348698748], [94.54686986375327, 24.428756898811855], [94.54916895178576, 24.436969058075647], [94.5518402206497, 24.442555005409247], [94.55458844719914, 24.44830187922838], [94.5546418804185, 24.44849909965376], [94.55491236231575, 24.449500092755102], [94.6029967100302, 24.43937707199433], [94.6402187439, 24.438357290256818]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
