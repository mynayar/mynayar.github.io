
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Za Li</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Za Li</div><div class="name-mm">မဲဇလီ</div></div>
        <span class="pcode-badge">MMR009014031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83681868743253, 19.23259576967905], [94.83668464438091, 19.232176886154434], [94.83475918778635, 19.22615983440886], [94.83167102379878, 19.214424813054734], [94.83319860413235, 19.21247290470086], [94.83167102379878, 19.203307423598744], [94.82439206044529, 19.198859168116144], [94.82425943202725, 19.198983994915466], [94.81623020655883, 19.207013220383885], [94.81067151228052, 19.2076308531814], [94.80202465491396, 19.21071901626965], [94.78967199986295, 19.207013220383885], [94.78955546571223, 19.206756844352924], [94.78843673516724, 19.208248485978913], [94.78353200539777, 19.208248485978913], [94.78287804088893, 19.215660077750442], [94.78048574622028, 19.224431827566832], [94.78406389773073, 19.226949787202955], [94.79737998030191, 19.22813343890715], [94.81187971367791, 19.22961300263802], [94.81513475586434, 19.22976800528926], [94.82430805657162, 19.230204829389436], [94.83170587972262, 19.23227621987172], [94.83681868743253, 19.23259576967905]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
