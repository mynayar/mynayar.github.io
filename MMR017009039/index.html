
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Sha</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Sha</div><div class="name-mm">ကျုံရှ</div></div>
        <span class="pcode-badge">MMR017009039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5983967198328, 17.374611419581413], [95.60041415998558, 17.373405089673213], [95.60872692011134, 17.369785709642827], [95.60949047960202, 17.36945837980045], [95.61135780042218, 17.36859032987985], [95.61163464862022, 17.368270387968096], [95.61357791988513, 17.36602469988003], [95.6179954797077, 17.362173960260122], [95.61906300015738, 17.361920778621084], [95.61916048037193, 17.360410126226384], [95.61800608990916, 17.348479246020418], [95.61798874288621, 17.348299964371904], [95.61769248821781, 17.34821915758812], [95.61760127357996, 17.348196171815914], [95.61446219807203, 17.34733807289382], [95.61156588016132, 17.348281110085225], [95.61099780000853, 17.348646150299658], [95.60900484030122, 17.349927480069198], [95.60388312030983, 17.352305460228877], [95.60188403981664, 17.351693819614127], [95.59470995989682, 17.356376969921257], [95.59381390418838, 17.35693683476717], [95.58995003986252, 17.359350929901552], [95.59142172013634, 17.361558359930427], [95.59311552036502, 17.365245119866415], [95.59371347959348, 17.3678357699049], [95.5950586981005, 17.36977885141289], [95.5964037601255, 17.3717218798609], [95.5983967198328, 17.374611419581413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
