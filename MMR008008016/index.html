
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thaik War Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thaik War Chaung</div><div class="name-mm">သိုက်ဝါးချောင်း</div></div>
        <span class="pcode-badge">MMR008008016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7451268978881, 17.821928934372863], [95.74397174390094, 17.823661666252917], [95.74021749074467, 17.826838342415613], [95.73732960397808, 17.833191692942307], [95.7364632375884, 17.838967467374744], [95.73248076887245, 17.844476388674423], [95.73340424580937, 17.848997089943794], [95.73670350766082, 17.84991292624062], [95.74283010312683, 17.851293259676254], [95.74518737459772, 17.851754610087255], [95.74658738519975, 17.855374552193894], [95.75035994405624, 17.85584024543101], [95.75116400091798, 17.855331275917706], [95.75218678279384, 17.855808574905836], [95.75630057681025, 17.85688173770211], [95.75791646157552, 17.854062418845615], [95.76072148840603, 17.848497494064134], [95.76274300878288, 17.841277776248432], [95.76366713233233, 17.83821661620391], [95.76274300878288, 17.836368369105003], [95.75783360074013, 17.83232532655262], [95.75263540420059, 17.835213214218527], [95.75003630593085, 17.83232532655262], [95.75003630593085, 17.82943743978609], [95.75119146081732, 17.825394398133028], [95.74772599705716, 17.82510560963624], [95.7451268978881, 17.821928934372863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
