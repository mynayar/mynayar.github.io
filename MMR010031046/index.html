
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Win</div><div class="name-mm">ဇဝင်း</div></div>
        <span class="pcode-badge">MMR010031046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96795085914488, 21.15031247134351], [95.96673862788543, 21.143443162671872], [95.96633455079893, 21.137382008173176], [95.97199162821113, 21.129704546227856], [95.97279978238413, 21.12041077503727], [95.97239570529763, 21.11273331309195], [95.97204386713082, 21.108159407031053], [95.96148562666042, 21.105055850247368], [95.9469388560434, 21.101419158267618], [95.94064794724505, 21.100872122250678], [95.94047362535758, 21.105055850247368], [95.94128177773189, 21.111521081832507], [95.93885731701164, 21.119198543777827], [95.93764508575214, 21.122431159570397], [95.93400839287307, 21.126471930435287], [95.93279616161362, 21.133341239106926], [95.93360431578662, 21.1394023927063], [95.931179854167, 21.145059471017817], [95.92875539164805, 21.145463548104317], [95.92592307668872, 21.147304552962794], [95.92794723837443, 21.148696162997567], [95.93279616161362, 21.152736932963137], [95.93845323992514, 21.151928778790136], [95.94653477895696, 21.151928778790136], [95.94653477895696, 21.162434780340902], [95.94451439442383, 21.170112243185542], [95.94292078676494, 21.172768254151663], [95.94976739474953, 21.175365244410557], [95.95784893378135, 21.166071473219972], [95.96269785791986, 21.158394011274652], [95.96795085914488, 21.15031247134351]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
