
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Thar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Thar Yar</div><div class="name-mm">ကန်သာယာ</div></div>
        <span class="pcode-badge">MMR010022061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07911593964894, 21.19702256773735], [95.08103299117965, 21.19020638741489], [95.08234275481436, 21.18529476883856], [95.08561716839768, 21.18300268022955], [95.08921902064134, 21.182347798412195], [95.09314831514268, 21.18267523887124], [95.09675016918504, 21.179728268444876], [95.10133434640301, 21.174489209409558], [95.10591852272171, 21.174161768051192], [95.10035202232802, 21.16466597225684], [95.0951129632927, 21.160081795938197], [95.08561716839768, 21.155170177361867], [95.07382928399431, 21.149931118326492], [95.06826278270131, 21.147311588359173], [95.06204139959095, 21.148293912434156], [95.06171395913196, 21.155170177361867], [95.06269628320695, 21.164338530898533], [95.06498837091664, 21.171214796725565], [95.06728046042497, 21.18038315116155], [95.06760790088396, 21.191188709691232], [95.06779392385056, 21.198257582421547], [95.07205090792314, 21.197005528282546], [95.07868993709099, 21.197005528282546], [95.07911593964894, 21.19702256773735]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
