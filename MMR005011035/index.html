
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lan Chaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lan Chaing</div><div class="name-mm">ဖလံချိုင်</div></div>
        <span class="pcode-badge">MMR005011035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38531487957806, 22.993286130150864], [95.39050284003412, 22.99353029968364], [95.39349371985935, 22.993286130150864], [95.39727768032077, 22.994079569616474], [95.40368640030721, 22.994689950281042], [95.41027835985847, 22.994689950281042], [95.41467287994953, 22.994689950281042], [95.41851804017546, 22.994506799749047], [95.42180592020713, 22.994686170430498], [95.42272931980233, 22.991271930255436], [95.42288052011997, 22.98990978021226], [95.42150892000069, 22.98907466976027], [95.41748052020989, 22.988708460427176], [95.411926440353, 22.987487789929617], [95.40710460019721, 22.982482890073356], [95.40271008010615, 22.978088369982345], [95.39892575991593, 22.974487290256263], [95.39489736012513, 22.973876909591752], [95.39050284003412, 22.9758911103865], [95.38592544010703, 22.97912597988011], [95.38488756041266, 22.98272705960619], [95.38488756041266, 22.98669434956463], [95.38568099987828, 22.99108886965564], [95.38531487957806, 22.993286130150864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
