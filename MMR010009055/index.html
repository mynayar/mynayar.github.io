
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nge Toe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nge Toe</div><div class="name-mm">ငယ်တိုး</div></div>
        <span class="pcode-badge">MMR010009055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0526680768703, 22.159534283080745], [96.0550333019454, 22.152241507039946], [96.0530622811994, 22.143174811068718], [96.05798983306443, 22.14258350502479], [96.05858113910836, 22.138641464432112], [96.05798983306443, 22.135093626369837], [96.05582170970422, 22.128392156372968], [96.05523040366023, 22.122084889805876], [96.05187966911149, 22.123464603608625], [96.04576950425928, 22.126618237341802], [96.04025064635033, 22.1270124416709], [96.03217591698507, 22.1270124416709], [96.0307979577596, 22.12999153138412], [96.02808189366453, 22.1347141268555], [96.02662086496099, 22.138216018554488], [96.02478599527751, 22.142183304016328], [96.02382850598082, 22.14528083804032], [96.02921292963305, 22.146131342187743], [96.03571729881435, 22.152635711369044], [96.0392651359773, 22.15657775196172], [96.0526680768703, 22.159534283080745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
