
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Yan Nyaung Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Yan Nyaung Pin</div><div class="name-mm">ခရမ်းညောင်ပင်</div></div>
        <span class="pcode-badge">MMR007002021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.63654947987465, 17.29438971221549], [96.63503127767137, 17.29709316961413], [96.63024604172153, 17.29962653103962], [96.62730918057429, 17.300972592211394], [96.62349041365172, 17.30272285997205], [96.61926814610814, 17.30666364331256], [96.61643329056398, 17.310542919320312], [96.61778293283612, 17.312061267213778], [96.6211772782089, 17.316381342325144], [96.62549735332027, 17.321009993716302], [96.63537180956143, 17.32749010638338], [96.63643594586227, 17.329314339785014], [96.63845757775505, 17.32563864600678], [96.64308623004553, 17.32193572435426], [96.64586342106008, 17.31977568679855], [96.64802345771648, 17.317307072063784], [96.64833203489553, 17.313604151310585], [96.64956634181328, 17.308666921840995], [96.65234353282784, 17.30465542390874], [96.65273835499113, 17.303301749975844], [96.64196910389109, 17.29438971221549], [96.63654947987465, 17.29438971221549]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
