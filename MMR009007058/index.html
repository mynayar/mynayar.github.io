
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Man San Pya Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Man San Pya Ywar Thit</div><div class="name-mm">တောင်မန်းစံပြရွာသစ်</div></div>
        <span class="pcode-badge">MMR009007058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.81214724040291, 20.198963086377375], [94.8121806780959, 20.198561824168905], [94.80851604597882, 20.196666323991735], [94.8056290540377, 20.19474166329718], [94.80274206209657, 20.18896768031425], [94.79472264103714, 20.178382042897], [94.78959021101946, 20.173570391160695], [94.77964612926553, 20.173249613778694], [94.7690604927476, 20.176778158685124], [94.76435290066587, 20.17712686990916], [94.76392806272997, 20.181269034838124], [94.7613618481708, 20.19570399274511], [94.76168262465347, 20.202440306974665], [94.76155238483477, 20.203091508766192], [94.76192016618279, 20.203133945075535], [94.76424884011192, 20.203402638221235], [94.77226826117135, 20.204364967669164], [94.7767591373244, 20.206610405745664], [94.77836302063696, 20.210138951551414], [94.78060845871346, 20.215912935433664], [94.78574088873108, 20.21398827383979], [94.79857196332551, 20.21174283576329], [94.80819526859682, 20.20757273699229], [94.81172381440257, 20.20404419208586], [94.81214724040291, 20.198963086377375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
