
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Chaung</div><div class="name-mm">ညောင်ချောင်း</div></div>
        <span class="pcode-badge">MMR009003018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8258845573265, 20.682266706643247], [94.823283898733, 20.678799161851884], [94.8151218344052, 20.67303770372712], [94.81176098338273, 20.663915396378513], [94.81084496182558, 20.6638206348145], [94.79783746003079, 20.662475032296925], [94.7800729636964, 20.65143223710811], [94.77864269630345, 20.647958728012952], [94.77882587561373, 20.647818112715754], [94.77788000465853, 20.64687541097146], [94.77668851086617, 20.647791949638815], [94.77376221585365, 20.650393118147917], [94.77104214168156, 20.65281097694509], [94.77554905994123, 20.656098606065882], [94.7755391907811, 20.656159036910083], [94.78679466484198, 20.666796125440897], [94.79207600190603, 20.674958189768688], [94.79591697398922, 20.684080498915932], [94.80071818909323, 20.68936183508066], [94.80551940419718, 20.68936183508066], [94.80936037628038, 20.684560619976708], [94.81368146942435, 20.68071964789351], [94.82040316967061, 20.68264013393508], [94.82280377767228, 20.684560619976708], [94.82130078930004, 20.6853538651888], [94.82280377767228, 20.685520862997464], [94.82616462779538, 20.68264013393508], [94.8258845573265, 20.682266706643247]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
