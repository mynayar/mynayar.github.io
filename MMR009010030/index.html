
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hma Yoe Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hma Yoe Kone</div><div class="name-mm">မှရိုးကုန်း</div></div>
        <span class="pcode-badge">MMR009010030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78184899973161, 20.52059671826396], [94.77906677341292, 20.512917999066474], [94.77908086758805, 20.511712726761004], [94.77849357971502, 20.51086467416542], [94.77813537524742, 20.51034741919807], [94.77832815661918, 20.508003249050773], [94.77869193598411, 20.50357892272916], [94.77895087778086, 20.492392414078722], [94.77782137695505, 20.483480139796654], [94.7799552532324, 20.48034206163686], [94.77493460085122, 20.4748188860828], [94.77105215473324, 20.474521115157415], [94.77045804730108, 20.47569185889222], [94.76904087493648, 20.475329325987673], [94.7692936491826, 20.477520035821044], [94.76704334487454, 20.486146203384635], [94.76479304056642, 20.492147014273314], [94.76554314170266, 20.498897928096937], [94.76591819317014, 20.50452368841752], [94.7636678879627, 20.510524500205577], [94.76104253308648, 20.519150666869848], [94.76306321529523, 20.521423933567746], [94.76404293943017, 20.52252612288231], [94.78020045428758, 20.520862850140475], [94.78184899973161, 20.52059671826396]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
