
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Ma Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Ma Yoe</div><div class="name-mm">ရင်းမရိုး</div></div>
        <span class="pcode-badge">MMR010030026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06488566993778, 20.91238370564355], [96.06654384172498, 20.915976411782026], [96.07535445664291, 20.929192334158927], [96.08196241783139, 20.926360351049425], [96.0964369998677, 20.927933675398833], [96.11405822970357, 20.92761900980952], [96.1294258592161, 20.929634437279503], [96.12972775982831, 20.92914564495561], [96.1279034823599, 20.92698968132879], [96.11909286744196, 20.91723507144144], [96.10210096698609, 20.9087391212135], [96.08416507156085, 20.895208534146605], [96.08858496692272, 20.884306126726415], [96.08888504370987, 20.883565936119112], [96.07913043472183, 20.878216633690727], [96.07692778099238, 20.882936605839745], [96.06969049042385, 20.89017389730759], [96.06119454019591, 20.898355181946158], [96.0608798746066, 20.903704484374487], [96.06488566993778, 20.91238370564355]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
