
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yint Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngape</div><div class="name-mm">ငဖဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yint Shey</div><div class="name-mm">ရင့်ရှည်</div></div>
        <span class="pcode-badge">MMR009009015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6291333424299, 19.92780569757491], [94.61986961129361, 19.92497511381049], [94.60885328944784, 19.924240692354147], [94.60261070661886, 19.919099742159403], [94.59416486121944, 19.913591580786886], [94.57286663898424, 19.91946695333729], [94.5706633746151, 19.91877118474241], [94.5706633746151, 19.919099742159403], [94.56676529198472, 19.921048784373966], [94.56478800296401, 19.931217695740145], [94.56221752831635, 19.948476598616196], [94.56221752831635, 19.95802407844849], [94.56478800296401, 19.967204346203687], [94.55487331375247, 19.982259984710595], [94.55546973873749, 19.982388626433988], [94.57360106133996, 19.98629930317037], [94.5856396821257, 19.990022705983165], [94.58707782937836, 19.98958673444031], [94.59094186907208, 19.986016391743135], [94.59237996686204, 19.98558037343554], [94.59286838956456, 19.98468262610237], [94.59430647206608, 19.984246589808322], [94.59527785319045, 19.982902524232145], [94.59767642332832, 19.982025273347745], [94.59816527590681, 19.981127025991498], [94.598645361894, 19.980938876128278], [94.60152919002019, 19.979804036027474], [94.60810646364246, 19.96906978474283], [94.61174526183441, 19.96421805382016], [94.61999320692104, 19.952573899066238], [94.6231468307617, 19.94505371505693], [94.62824115110828, 19.93583542396567], [94.6291333424299, 19.92780569757491]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
