
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htone Htaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htone Htaung</div><div class="name-mm">ထုံးတောင်</div></div>
        <span class="pcode-badge">MMR009012045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18484001275647, 19.274999385113574], [95.18311193217, 19.26923848366914], [95.18297362902979, 19.267993493704807], [95.17514712244179, 19.27103713585518], [95.16788041414986, 19.275244177876573], [95.15698035126223, 19.28040736470814], [95.14856626811883, 19.2809810530332], [95.14805421123293, 19.282015015280763], [95.1386223509408, 19.301060115631856], [95.1388346853725, 19.301052533447717], [95.14397676781363, 19.3008688873893], [95.16539443530502, 19.305267156753928], [95.17438220587417, 19.308326823923835], [95.17648572733452, 19.31004788710038], [95.17659713714824, 19.314392889620194], [95.17667695557708, 19.317505823634917], [95.17727656686014, 19.31877999929759], [95.1867219799355, 19.315977513951168], [95.1866564391434, 19.316519428329002], [95.18814575332391, 19.31625925805838], [95.18889732305308, 19.316127966032866], [95.1878091631624, 19.30823596901479], [95.18727618894502, 19.299308642779692], [95.18607699605656, 19.282786430349518], [95.18629221191611, 19.276832111712622], [95.18486966969954, 19.275098251183408], [95.18484001275647, 19.274999385113574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
