
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Aung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Aung</div><div class="name-mm">စစ်အောင်</div></div>
        <span class="pcode-badge">MMR009016009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24728083004635, 19.44007645866168], [95.24723336113078, 19.440065909614077], [95.24651604567902, 19.445087113279726], [95.24350332401923, 19.44985725500834], [95.24695360812257, 19.451449694447888], [95.25246258518024, 19.45397464181633], [95.2526302502859, 19.455050489088876], [95.25728293965602, 19.453056478973394], [95.29194358562802, 19.448924746180126], [95.31240522612035, 19.449144764419373], [95.31250899799193, 19.449032342868406], [95.31215034116536, 19.441141881892406], [95.31286765571781, 19.43038216090804], [95.3114330257136, 19.418187810818893], [95.31370503605865, 19.417556698083217], [95.31366773757611, 19.41749808566817], [95.30820510977804, 19.415677210335048], [95.29929385262926, 19.413332141764954], [95.294576130584, 19.41209063577429], [95.2881202987129, 19.41101466439528], [95.28058849366408, 19.41101466439528], [95.27628460634958, 19.413525265778446], [95.27341534724053, 19.41603586716161], [95.27289225837109, 19.417278205025184], [95.27270324336007, 19.417727116013623], [95.27054608903086, 19.4228503567586], [95.27162206130913, 19.428230217250757], [95.27090474585742, 19.431458133186368], [95.26552488626453, 19.435044706847805], [95.25046127706634, 19.440783224166523], [95.24728083004635, 19.44007645866168]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
