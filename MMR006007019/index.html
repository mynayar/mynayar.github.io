
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Du Yin Pin Shaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Palaw</div><div class="name-mm">ပုလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Du Yin Pin Shaung</div><div class="name-mm">ဒူးရင်ပင်ရှောင်</div></div>
        <span class="pcode-badge">MMR006007019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.74458468433579, 12.924436486055015], [98.7436803602605, 12.929500394927345], [98.7394859995793, 12.942923309762989], [98.73235512039253, 12.95550720029712], [98.72709135967858, 12.967538664277981], [98.72648262027678, 12.968930070166664], [98.71988301379014, 12.983790482045151], [98.72899920035286, 12.984450390173436], [98.74242143979768, 12.982772700399835], [98.75219529967342, 12.978812194027569], [98.76507192043283, 12.970188989730161], [98.77429980009578, 12.956766119860617], [98.78059152008262, 12.949635239774523], [98.79011602403534, 12.93517190376042], [98.7642334797913, 12.92908122002234], [98.74458468433579, 12.924436486055015]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
