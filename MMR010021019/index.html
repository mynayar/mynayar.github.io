
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Sein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Sein</div><div class="name-mm">ပေါက်စိမ်း</div></div>
        <span class="pcode-badge">MMR010021019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59465727221539, 21.687118006590765], [95.59327323357292, 21.68882143765927], [95.58839256066818, 21.693702112362644], [95.58723049629043, 21.696723481003914], [95.58304706237209, 21.69974484964513], [95.57746914958165, 21.70276621918572], [95.57351812925833, 21.708111718381133], [95.57419974792009, 21.712815378626885], [95.57947682309697, 21.71193586684683], [95.5844607273807, 21.71193586684683], [95.58885828897894, 21.711056354167454], [95.59208316790392, 21.70871098702247], [95.59589438861519, 21.707831475242415], [95.60205097737077, 21.706365620776808], [95.60439634271711, 21.704606596317433], [95.60586219718272, 21.702554400065537], [95.60732805164832, 21.698743179354267], [95.60850073522079, 21.694345616856765], [95.60879390611393, 21.692879763290478], [95.60703488075518, 21.69258659239739], [95.60205097737077, 21.690534396145495], [95.59706707308703, 21.68818902989989], [95.59465727221539, 21.687118006590765]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
