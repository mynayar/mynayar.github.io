
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Tee</div><div class="name-mm">ပင်တီး</div></div>
        <span class="pcode-badge">MMR015013017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.72346049930263, 22.349740802296253], [96.715146133887, 22.34744718394046], [96.68662210182862, 22.337820322749735], [96.68203788234246, 22.334658387374702], [96.67770834186655, 22.335324470248167], [96.66946829642478, 22.332138318828413], [96.66879458190448, 22.33496791963381], [96.66451597723062, 22.337820322749735], [96.65738496944084, 22.346377532097506], [96.65310636386766, 22.356360943902473], [96.64169675140403, 22.3766843172275], [96.631713339599, 22.382745673174327], [96.6245421572948, 22.392797382193464], [96.63349609177129, 22.39308563469433], [96.65132361169537, 22.398077340596842], [96.66701182973219, 22.40057319309841], [96.68555245088498, 22.40413869744299], [96.69699876737928, 22.40910735641944], [96.71229373077114, 22.399503542154775], [96.72512954479271, 22.39308563469433], [96.73179208133956, 22.38938422570152], [96.72013783978952, 22.38024982067276], [96.71906818794656, 22.372405711654324], [96.72085094011885, 22.365274703864543], [96.72548609630638, 22.350299587056327], [96.72346049930263, 22.349740802296253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
