
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Yat Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Yat Kwin</div><div class="name-mm">ဇရပ်ကွင်း</div></div>
        <span class="pcode-badge">MMR017005051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.29652771967858, 17.308218420044113], [95.29926588011631, 17.308629090060492], [95.30214084002779, 17.308218420044113], [95.3047422000925, 17.308081529738843], [95.30871264037609, 17.307670769790263], [95.30912340032472, 17.306438579876612], [95.3102185200687, 17.305617149911598], [95.31104003996592, 17.305343370200433], [95.30980776012007, 17.29849797000537], [95.30939700017149, 17.291378790099145], [95.30884943984984, 17.28590247012295], [95.30597447993836, 17.28480716961525], [95.30282555955199, 17.28316430968522], [95.30104572028381, 17.282342789787947], [95.29967664006494, 17.281658250128203], [95.29639092020489, 17.281247580111767], [95.29502183998596, 17.281795230365617], [95.29200971997267, 17.281384470417038], [95.29091460022869, 17.282616660330632], [95.28954552000982, 17.283027330347068], [95.28831324016397, 17.283027330347068], [95.28612264004784, 17.283301199990433], [95.28612264004784, 17.283848850244283], [95.28625980014971, 17.290146600185494], [95.28680735957204, 17.292473999775325], [95.28968232038284, 17.29795031975152], [95.29159896002403, 17.301646799560217], [95.29447427966431, 17.306027909860177], [95.29652771967858, 17.308218420044113]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
