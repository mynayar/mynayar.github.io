
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Nat Chaung Bu Tar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Nat Chaung Bu Tar</div><div class="name-mm">သနတ်ချောင်းဘူတာ</div></div>
        <span class="pcode-badge">MMR013005008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92579552224561, 17.383076516767858], [95.93145285956189, 17.376816852215995], [95.93844157032225, 17.37720511292565], [95.94055489259426, 17.376571116064213], [95.94232418731144, 17.376040328098725], [95.9432223339436, 17.374992490211298], [95.94465375696535, 17.373322496835783], [95.94647596419446, 17.373184104662755], [95.94769591793232, 17.373091452908284], [95.95054762497296, 17.372521111859896], [95.95451707060636, 17.36067111488012], [95.94893662442576, 17.35718333624203], [95.93917083956268, 17.354044333579168], [95.92870750095045, 17.352300443810464], [95.9202741588254, 17.351030673926516], [95.92203413027096, 17.357122915290347], [95.92241026991809, 17.36032009779433], [95.9205295743804, 17.366150255130208], [95.91996536490973, 17.36765481192009], [95.91846080811985, 17.36840709031503], [95.9173323909771, 17.371228134071202], [95.91394713775026, 17.373673038180243], [95.91338293007823, 17.376117943188603], [95.91169030256549, 17.380631612658874], [95.91789660044782, 17.38138389105376], [95.92579552224561, 17.383076516767858]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
