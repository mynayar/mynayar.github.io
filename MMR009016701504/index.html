
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Gyi Ward</div><div class="name-mm">ကန်ကြီး ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009016701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21330213818317, 19.377882030431408], [95.2140496834462, 19.372103877292147], [95.21335844833379, 19.37202904650337], [95.21080897555385, 19.37172717017279], [95.21056730343838, 19.37201902445844], [95.2104114922966, 19.37218739463259], [95.21034407102212, 19.37249483147133], [95.21024718256149, 19.373029242805387], [95.21013386528574, 19.373400723964266], [95.2101097859379, 19.3735370216163], [95.21013669815017, 19.37369202786482], [95.21018769150879, 19.374103595404677], [95.2101933572377, 19.37421584068852], [95.21012819955683, 19.37445636616843], [95.21030950737793, 19.37479844579167], [95.21037749702396, 19.37499353842111], [95.21043415611149, 19.375108455590805], [95.21045115329815, 19.375201992278164], [95.21038316365212, 19.375586831067437], [95.2103066745135, 19.37584338876144], [95.21020468869551, 19.376014428123426], [95.21017919201614, 19.37613736184983], [95.21020468869551, 19.37633779735154], [95.21025001542591, 19.376623752084527], [95.21040016083879, 19.377021948504193], [95.21043698897591, 19.377243762689545], [95.21033783602235, 19.377823685115004], [95.2109192953892, 19.377855086742898], [95.21330213818317, 19.377882030431408]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
