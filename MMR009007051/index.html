
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Pin Htwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Pin Htwin</div><div class="name-mm">ပေါက်ပင်ထွင်း</div></div>
        <span class="pcode-badge">MMR009007051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87575038017599, 20.157312571318187], [94.87714200370056, 20.156138387676492], [94.87493468608693, 20.155489176084643], [94.87411043404933, 20.155246749437993], [94.87143327012939, 20.151596071201766], [94.86948624059761, 20.14867552825308], [94.86881302699965, 20.145141152142514], [94.86753921286441, 20.13845362883194], [94.86486204804515, 20.126528078907768], [94.85829082686024, 20.116792936644742], [94.85841435503852, 20.116267944809863], [94.85171960567533, 20.107787929669257], [94.84771169873596, 20.10292986122414], [94.84198672161, 20.10579235023681], [94.83672680190045, 20.114668463678697], [94.8361154373776, 20.123227574193265], [94.83606931204918, 20.12387332339523], [94.83968550668084, 20.127818263402162], [94.84856162102204, 20.13537939714149], [94.8508628359512, 20.144913001333975], [94.85546526580941, 20.15017292104352], [94.86171141984619, 20.153131624924583], [94.87075982720432, 20.16102491696637], [94.87486121867039, 20.158062800158177], [94.87575038017599, 20.157312571318187]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
