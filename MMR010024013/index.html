
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Zee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Zee</div><div class="name-mm">ဂွေးဇီး</div></div>
        <span class="pcode-badge">MMR010024013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12798516328473, 20.613759754409216], [96.12793371217111, 20.612987991302816], [96.12836692998991, 20.6082226006925], [96.12966658074816, 20.604323644820397], [96.13096623330506, 20.60129112458577], [96.13659805775421, 20.60129112458577], [96.14482918461925, 20.604756862639135], [96.14693849411628, 20.60552388362038], [96.14806803810956, 20.598423891649304], [96.14995552802526, 20.589222374712847], [96.15070888560666, 20.583948871643145], [96.14742848883373, 20.586994954553575], [96.14482918461925, 20.58829460711047], [96.13876414415, 20.58829460711047], [96.13573162301606, 20.58829460711047], [96.12880014690933, 20.58829460711047], [96.12403475719833, 20.587428172372313], [96.12056901914497, 20.586128520714738], [96.11580362943403, 20.591327128244416], [96.11017180498487, 20.593059996821466], [96.1026777094088, 20.593615115045566], [96.10540641527393, 20.59652573487483], [96.11147145664245, 20.604323644820397], [96.1131071417812, 20.60625672766588], [96.11623684635344, 20.60995547016887], [96.11840293274923, 20.613421208222235], [96.12423846713159, 20.613759754409216], [96.12798516328473, 20.613759754409216]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
