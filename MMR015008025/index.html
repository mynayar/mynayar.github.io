
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Hkwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Hkwa</div><div class="name-mm">လုံခွ</div></div>
        <span class="pcode-badge">MMR015008025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.10775902405976, 23.09189317812769], [99.11064501865275, 23.092291557109718], [99.11440274409142, 23.093571902121653], [99.11552796324497, 23.09833756702517], [99.11363923136548, 23.10180546165276], [99.11618890019764, 23.10425536779104], [99.12137113377088, 23.103219567329234], [99.12428951924596, 23.101096430755717], [99.12876546395506, 23.101446510747905], [99.13631232455418, 23.10514639628923], [99.14104876598782, 23.105946366631542], [99.14608431743738, 23.108564704097887], [99.15126525958414, 23.107528222849282], [99.15839718917897, 23.105304019564926], [99.16094474460436, 23.106087787721265], [99.15860550004385, 23.102369674720762], [99.14440206989968, 23.076861473278427], [99.14122880036888, 23.068806252006993], [99.14063381160116, 23.067295897287863], [99.13164796917852, 23.06410737165794], [99.11889386755803, 23.05599112598975], [99.11106748777439, 23.054831661551987], [99.09860325293783, 23.049034343859944], [99.08932754283188, 23.041497829960917], [99.08410995600974, 23.034830912816403], [99.07386985880697, 23.027358409962687], [99.05744229012964, 23.02874372923975], [99.05430491793766, 23.031881101431736], [99.05396389861511, 23.035120778701014], [99.05396389861511, 23.04526608736012], [99.05599296070665, 23.05367219891292], [99.07106598940396, 23.06352763988872], [99.10775902405976, 23.09189317812769]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
