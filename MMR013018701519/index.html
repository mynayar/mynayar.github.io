
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (65) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (65) Ward</div><div class="name-mm">အမှတ် (၆၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701519</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.23321021428, 16.837464617698004], [96.23447990412433, 16.837830225384664], [96.23537159002694, 16.838100432988654], [96.23607063305332, 16.838239669625125], [96.2376232154391, 16.838460922633544], [96.23876380940231, 16.838611603143022], [96.2396116263755, 16.838700295182548], [96.24130058285567, 16.838689486230862], [96.24299049441584, 16.83849906917675], [96.24418631035002, 16.838163193976243], [96.24384164787381, 16.837459564407425], [96.24348258994962, 16.83627128569134], [96.24307060242643, 16.83490943871965], [96.24271965009183, 16.83378028862944], [96.24226188617718, 16.832330703799016], [96.24181175211072, 16.83093071028412], [96.24118105576116, 16.82894833919454], [96.24101707697656, 16.828501794322392], [96.2383899693217, 16.829271316318227], [96.2368998439527, 16.82969842684099], [96.23593298641822, 16.8299954729128], [96.23475074844833, 16.831251144125076], [96.23418680787495, 16.831944147304625], [96.23410224911959, 16.83378028862944], [96.23391723609166, 16.836050669402937], [96.23321021428, 16.837464617698004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
