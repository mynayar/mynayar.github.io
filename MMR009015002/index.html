
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Bai Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Bai Chon</div><div class="name-mm">စပယ်ခြုံ</div></div>
        <span class="pcode-badge">MMR009015002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03348740032334, 19.028129746690524], [95.04591946461164, 19.03950376308825], [95.05271939418475, 19.044325531298284], [95.06484531126216, 19.03598896341998], [95.06625593296502, 19.03581263514502], [95.06592678829071, 19.03301490181633], [95.06616158329052, 19.03137134131441], [95.06406520514514, 19.03011351442717], [95.06349346475167, 19.029770470730682], [95.06214161914045, 19.023551978041382], [95.06233760030005, 19.019044393384092], [95.06241198772312, 19.01733348625146], [95.06064230090152, 19.016743590344447], [95.0551120189046, 19.014900162712365], [95.05240832678294, 19.01408905516581], [95.05149091757187, 19.014264728734304], [95.03970097282172, 19.01652237780553], [95.03729594375284, 19.0181257314174], [95.03645654173607, 19.018685331862628], [95.03321211065042, 19.02787788615558], [95.03348740032334, 19.028129746690524]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
