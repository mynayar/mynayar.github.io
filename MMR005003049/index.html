
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thiri Zay Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thiri Zay Yar</div><div class="name-mm">သီရိဇေယျာ</div></div>
        <span class="pcode-badge">MMR005003049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22666344226411, 21.726684618900094], [95.23026332589183, 21.727204874005793], [95.23242621160045, 21.727955572291876], [95.23401866542912, 21.729081612526443], [95.23608647930763, 21.72996477555398], [95.23841574049408, 21.731664848553976], [95.24530845312268, 21.729920617042865], [95.24882611263507, 21.730008933165777], [95.25460139963496, 21.73134816038936], [95.25825899995294, 21.73134816038936], [95.26328856011901, 21.72929057989637], [95.26443155976875, 21.725861400183533], [95.26328856011901, 21.72128912998943], [95.26328856011901, 21.71511657017362], [95.26366188039151, 21.714716700115673], [95.26031676031027, 21.714202080161897], [95.25620160022373, 21.711687299629205], [95.25117204005767, 21.711458700058984], [95.24441526175497, 21.71249819043919], [95.2441254291453, 21.71315964540139], [95.24362537281274, 21.714301100915122], [95.2435054913854, 21.7145747169497], [95.24204825062634, 21.71546727519467], [95.24180775392477, 21.716122343171662], [95.24178347762546, 21.7161885917302], [95.24155247956332, 21.716817840171245], [95.23961064001907, 21.7181568596514], [95.23621124675168, 21.719938344678894], [95.22666344226411, 21.726684618900094]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
