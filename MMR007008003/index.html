
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Seik</div><div class="name-mm">ကွမ်းဆိပ်</div></div>
        <span class="pcode-badge">MMR007008003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.94266594477762, 17.720424459621142], [96.94154558825835, 17.696096708296523], [96.93976777336411, 17.669824550762485], [96.9362989407436, 17.6706917589176], [96.91900374212906, 17.67251230599817], [96.915785107197, 17.67267323787968], [96.90990100582684, 17.672967442993126], [96.90320859290227, 17.67352215832102], [96.90041560619534, 17.67399645627148], [96.90240640573109, 17.67659981103253], [96.90257009673263, 17.682473616064556], [96.90115559175723, 17.68292780877141], [96.89974784878427, 17.684740066800714], [96.89971823770657, 17.69165060129427], [96.89971823770657, 17.702930767141254], [96.8979828267461, 17.711173963807425], [96.90449061514983, 17.714210932088918], [96.91403537093566, 17.715078636669773], [96.92661709410368, 17.715946342150005], [96.93356811967305, 17.71438489244889], [96.93720921473351, 17.718936260600003], [96.94266594477762, 17.720424459621142]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
