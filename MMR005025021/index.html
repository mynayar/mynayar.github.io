
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyein Bu Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyein Bu Kone</div><div class="name-mm">ကြိမ်ဘူးကုန်း</div></div>
        <span class="pcode-badge">MMR005025021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.74702020012222, 23.92987301962421], [95.74665659972237, 23.92964342990041], [95.74657285395409, 23.929740059356277], [95.73913246589063, 23.92752861205588], [95.72692248738292, 23.923310618989944], [95.71917888030117, 23.919087239884277], [95.71878288002597, 23.91948324015948], [95.71691699991965, 23.927507549933523], [95.71225175961109, 23.936091749734487], [95.70767472031213, 23.94579474033503], [95.71050432021826, 23.953576500255338], [95.71349016024277, 23.96079216032996], [95.71523184037721, 23.96651489994275], [95.71908564039006, 23.970850109744845], [95.71946184029173, 23.970495960320363], [95.7270567597617, 23.972059709587995], [95.72792148039207, 23.972237730387008], [95.73418212610432, 23.976212729334065], [95.73757846887128, 23.970818538145068], [95.74379445784803, 23.96216055166815], [95.74845644980536, 23.95172656962552], [95.75289644321634, 23.94551058064883], [95.75636039971272, 23.93486856023594], [95.75138411988127, 23.932629269924917], [95.74702020012222, 23.92987301962421]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
