
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Lawt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Lawt</div><div class="name-mm">ပန်လော့</div></div>
        <span class="pcode-badge">MMR015002002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.06602085677719, 23.292474263876215], [98.051555292243, 23.290188108994073], [98.04907594140161, 23.29514681157616], [98.03915853713681, 23.296563583742454], [98.02534500896508, 23.29408423290107], [98.01997073326277, 23.29437473370706], [98.02059617037702, 23.29639537814421], [98.02182431783808, 23.304173648694984], [98.01860417204495, 23.315297787562884], [98.01732110838253, 23.319730191595113], [98.02305246619841, 23.330783525039692], [98.02641968981692, 23.341727002699088], [98.0340438480452, 23.34573007488308], [98.03457086065674, 23.346006782786844], [98.04261953126644, 23.352758514094205], [98.05253948600853, 23.362805046615676], [98.05706075924672, 23.366235289327165], [98.06259053312664, 23.370430668940287], [98.07847396160412, 23.338358359950405], [98.08307847069494, 23.32135709485408], [98.07918234768727, 23.30931453233984], [98.06602085677719, 23.292474263876215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
