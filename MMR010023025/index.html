
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Gyi (Taung Kan Gyi)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Gyi (Taung Kan Gyi)</div><div class="name-mm">ကန်ကြီး (တောင်ကန်ကြီး)</div></div>
        <span class="pcode-badge">MMR010023025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84649241839048, 20.48115529877805], [95.84735774516389, 20.481047133718278], [95.8490649587809, 20.48125617932925], [95.8496045097404, 20.48104324594908], [95.86454621403658, 20.479578584883825], [95.87011255255231, 20.48778231030542], [95.87187021903543, 20.496571941342097], [95.87872417178318, 20.499089719315123], [95.88930183221385, 20.500271506724687], [95.8939622854312, 20.502893013401888], [95.89957096762612, 20.500513571843896], [95.90105244961092, 20.501013055308306], [95.90236389227988, 20.501871365571105], [95.90353536806282, 20.502660635779762], [95.9060798352163, 20.504354557416946], [95.9156911237464, 20.502458390842094], [95.915912578203, 20.500317659932136], [95.91550823491718, 20.491017753566496], [95.91510389073204, 20.47727006656038], [95.9110604542766, 20.471204910977917], [95.89609973561437, 20.473226630104932], [95.8803303303805, 20.47160925516306], [95.87022173744327, 20.46999188022113], [95.86132617526283, 20.469183192750222], [95.85809142627835, 20.47282228591979], [95.84838717572762, 20.478483098216486], [95.84649241839048, 20.48115529877805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
