
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Gon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Gon</div><div class="name-mm">ဂွေးဂုဏ်</div></div>
        <span class="pcode-badge">MMR009019009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07925460611523, 21.851374499133897], [95.07991231899837, 21.849858803341135], [95.0920768754475, 21.82789502073865], [95.08698382134634, 21.7957696085806], [95.08615912324501, 21.794576988837036], [95.07784724175684, 21.796680822362134], [95.07206598056064, 21.802578445938593], [95.05769883423386, 21.81257252190443], [95.05145566504694, 21.819667031608276], [95.04612591567854, 21.83395359867967], [95.0483606859969, 21.836826876858936], [95.05330910842866, 21.837465382021833], [95.05624586705318, 21.836759389034626], [95.0610977760416, 21.835447152264294], [95.06116694020221, 21.8354621601506], [95.06123424006819, 21.83547681010674], [95.06279040715162, 21.835814445280448], [95.06416370698952, 21.837146128990696], [95.06783511369957, 21.841934923557915], [95.07326241432901, 21.84768147631911], [95.07709345070225, 21.850554750001777], [95.07925460611523, 21.851374499133897]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
