
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dhamma Kya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dhamma Kya</div><div class="name-mm">ဓမ္မကျ</div></div>
        <span class="pcode-badge">MMR008012031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53220879899692, 18.312529951396186], [95.5406092259351, 18.313874018771003], [95.55673804522468, 18.320930378334367], [95.5614422837345, 18.32261046300249], [95.56782660871107, 18.319922327353595], [95.57252558528756, 18.31648798373351], [95.57020765825689, 18.312743400087868], [95.56582664688233, 18.311283062963014], [95.56351207522215, 18.306771277572466], [95.56162089718674, 18.3063098929872], [95.56020942922186, 18.304947954284728], [95.55879379919452, 18.304487334123223], [95.55785197968515, 18.303579371390924], [95.55360175401779, 18.302655776642837], [95.55219031842853, 18.301293819953855], [95.55107541719678, 18.300932581173754], [95.5485460001978, 18.303251212373596], [95.54221787835246, 18.30057392974311], [95.53053518674955, 18.29448919412107], [95.52801380879032, 18.2916382047394], [95.52683252590043, 18.30480155904479], [95.53220879899692, 18.312529951396186]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
