
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Ni Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaton</div><div class="name-mm">သထုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Ni Kone</div><div class="name-mm">မြေနီကုန်း</div></div>
        <span class="pcode-badge">MMR011007023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.37998700039981, 16.9846860000589], [97.38107300011893, 16.977497000386336], [97.38456600022079, 16.97378900026223], [97.3869779999348, 16.96962499979395], [97.38367799973997, 16.969345000371504], [97.38015299996101, 16.96613399978429], [97.37444600028277, 16.962373999960164], [97.36552800001726, 16.956522999936567], [97.36062499964407, 16.95137499995633], [97.35319100036446, 16.945284999703006], [97.34788600033869, 16.940831000250512], [97.34371599959377, 16.935745000431496], [97.3369620001962, 16.930805000150713], [97.32657699972879, 16.924827999712477], [97.32477940694412, 16.935063980718212], [97.32394519581419, 16.94799426312477], [97.32352809024923, 16.95758769921298], [97.32006199966162, 16.965617000224427], [97.32788399974686, 16.966074999761474], [97.33306899963469, 16.965422000225203], [97.33891700041931, 16.966282000314095], [97.34474700037384, 16.967504000009626], [97.34979200010076, 16.969751000208532], [97.35452199969058, 16.970880000111947], [97.35801199965414, 16.97481599995848], [97.36452300043618, 16.977186999580397], [97.3710690001343, 16.97883399998915], [97.37492499988889, 16.982801000365896], [97.37998700039981, 16.9846860000589]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
