
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Yar Ne</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Yar Ne</div><div class="name-mm">ငါးရာနဲ</div></div>
        <span class="pcode-badge">MMR005007055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51095200043454, 22.962684600314105], [95.52064644028104, 22.963470659943027], [95.52619692015179, 22.964511330233734], [95.53140035973888, 22.967286479787276], [95.53695047988083, 22.973530589665017], [95.54367095974703, 22.97966643016167], [95.54492915985293, 22.98081527990132], [95.54534172024427, 22.979818349936977], [95.54909184011638, 22.97075544011153], [95.55210107960119, 22.963985010100203], [95.55325452037988, 22.96138923032879], [95.55811128031138, 22.952370059930388], [95.55824772005627, 22.9518437397968], [95.54960195986263, 22.947891390275515], [95.53459175960211, 22.94754236968464], [95.5270900800432, 22.947300360323425], [95.52546036010762, 22.949582040179052], [95.5202569196212, 22.95582615005685], [95.5108483202938, 22.962314880027748], [95.51095200043454, 22.962684600314105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
