
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Chaung</div><div class="name-mm">ပေါက်ချောင်း</div></div>
        <span class="pcode-badge">MMR005003043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3434623597002, 21.670934760330965], [95.33774699992415, 21.670934760330965], [95.33226023971832, 21.66979175978196], [95.32814507963178, 21.66796277975851], [95.32540188029259, 21.66773418018829], [95.323413960386, 21.665278709944573], [95.32158516022702, 21.669622379669136], [95.3181557997504, 21.6707654701504], [95.31648899986749, 21.670677719701075], [95.32088279960158, 21.672984510426886], [95.33050307955352, 21.6781888502353], [95.33838851961457, 21.68481258013651], [95.34422375991863, 21.691436310037716], [95.34958559979566, 21.69727155034184], [95.35202280031206, 21.698195940090613], [95.35176215969597, 21.69682740036427], [95.35267655977549, 21.695684399815264], [95.35633451982227, 21.692255130170167], [95.352606720224, 21.687394950116925], [95.351463719675, 21.68373716993449], [95.3480343600977, 21.679393500209926], [95.34689136044801, 21.67573572002749], [95.3434623597002, 21.670934760330965]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
