
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taunggyi</div><div class="name-mm">တောင်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Lay</div><div class="name-mm">နောင်လေ</div></div>
        <span class="pcode-badge">MMR014001006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.14017545723163, 20.790174675420985], [97.13821945876106, 20.78123612564673], [97.12540501802721, 20.769446840099647], [97.10848995474765, 20.7566323993658], [97.09996655541227, 20.753940798629003], [97.08901200440056, 20.750481467345878], [97.07568498517401, 20.751506621633325], [97.0695340540534, 20.7566323993658], [97.07055920924017, 20.760733020112866], [97.07158436442694, 20.7858493248865], [97.0726095196137, 20.808402741693214], [97.06338312203354, 20.817116561680052], [97.07355061876609, 20.83682547231774], [97.08029818441372, 20.85607246417294], [97.09260004755419, 20.854022152900086], [97.10233902272779, 20.855559885680236], [97.11207799880066, 20.8617108177001], [97.12521744462941, 20.868613632413258], [97.12476502628499, 20.867784106751174], [97.12640418010886, 20.85873331798831], [97.13167786933826, 20.851701735646657], [97.13548675091289, 20.841740259205665], [97.13372914738233, 20.830606727818292], [97.13431533718312, 20.81947324229634], [97.13783140309681, 20.802187089062954], [97.14017545723163, 20.790174675420985]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
