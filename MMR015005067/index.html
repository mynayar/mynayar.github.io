
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Hkar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Hkar</div><div class="name-mm">ကုန်းခါး</div></div>
        <span class="pcode-badge">MMR015005067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.79755529963745, 22.41322731708709], [98.79441934117972, 22.413299443614505], [98.78768948678044, 22.410330391234595], [98.78056375891043, 22.40795514771196], [98.77957407388448, 22.410726264705374], [98.78293900063443, 22.418643740416314], [98.78848891393227, 22.42072933209306], [98.79204409765703, 22.42339422566306], [98.79758633074465, 22.42774883743897], [98.80436743840664, 22.430585351332923], [98.81124397582886, 22.429728205692186], [98.8195573259099, 22.42913439503633], [98.82925623268903, 22.431113764188922], [98.83647679227022, 22.43303804177225], [98.83539008478465, 22.431516511178074], [98.83382768360076, 22.42643804228186], [98.82288996609913, 22.4268284505726], [98.81273367222127, 22.420968497797958], [98.80687429501279, 22.416671233090995], [98.80023354364317, 22.41667108830012], [98.79755529963745, 22.41322731708709]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
