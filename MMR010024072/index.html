
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Sar Nwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Sar Nwe</div><div class="name-mm">ဥစ္စာနွယ်</div></div>
        <span class="pcode-badge">MMR010024072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13659805775421, 20.65154432590998], [96.1300997985669, 20.64764537093714], [96.12737671886055, 20.647150266271808], [96.12533440885596, 20.646778937098304], [96.11796971493044, 20.648511805675355], [96.11363754303824, 20.65197754372872], [96.11277110830008, 20.657176151258398], [96.11190467356187, 20.661941540969394], [96.11190467356187, 20.666706929781014], [96.11190467356187, 20.66973945091496], [96.11407075995766, 20.67190553731075], [96.12230188772202, 20.673638405887743], [96.12576762577538, 20.673638405887743], [96.13226588496269, 20.673638405887743], [96.13486518917722, 20.67190553731075], [96.13746449159305, 20.66973945091496], [96.13844894616199, 20.666457938083454], [96.13876414415, 20.66540727902276], [96.13833092723058, 20.65804258509729], [96.13659805775421, 20.65154432590998]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
