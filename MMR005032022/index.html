
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Chaung</div><div class="name-mm">ဆည်ချောင်း</div></div>
        <span class="pcode-badge">MMR005032022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.66585287830776, 24.326664564218333], [94.6660770001535, 24.326523990289957], [94.66754615962765, 24.325504290390768], [94.67687088008711, 24.32084192971132], [94.6839592114485, 24.318479136403084], [94.68986616009528, 24.31651014003097], [94.71128876126738, 24.308476664366594], [94.71758975955981, 24.306113790119355], [94.72885235984859, 24.306980220360913], [94.75484327959373, 24.306980220360913], [94.7559227169599, 24.30709382182249], [94.75707528000021, 24.3072151196821], [94.76264052044371, 24.29051940015023], [94.7678385596019, 24.28185581989021], [94.7697850801174, 24.272771669876704], [94.76004131965124, 24.2697267902592], [94.74011496013736, 24.26539499967953], [94.71563208025634, 24.26156945996263], [94.71239172040163, 24.26106320999918], [94.69506455988159, 24.26886036001764], [94.68033624042522, 24.2783903696199], [94.66560827979833, 24.288786629599315], [94.65586344014571, 24.299140589966328], [94.6556168919061, 24.29940321538612], [94.6568770408428, 24.30220187231862], [94.65630486967405, 24.30492045721337], [94.65704381022374, 24.309909331150777], [94.65778279034356, 24.313235249807008], [94.66055411597972, 24.319332799868846], [94.66406451436592, 24.32487604739174], [94.66585287830776, 24.326664564218333]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
