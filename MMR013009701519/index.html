
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaik Ka San (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyaik Ka San (West) Ward</div><div class="name-mm">ကျိုက္ကဆံ(အနောက်)ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701519</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18581628779151, 16.83691668505702], [96.18631935055765, 16.83708381686472], [96.1877613064392, 16.837582270605367], [96.18835830699032, 16.837814330766776], [96.18890680620422, 16.83801678344787], [96.18937301655154, 16.83813095058298], [96.18986320462324, 16.838233629778244], [96.18994140607111, 16.83788108834159], [96.19001197857, 16.837602615068704], [96.19007911655802, 16.837307357748386], [96.19008064270753, 16.83687934880294], [96.18984031687717, 16.836516380626506], [96.1896362310273, 16.836297989260856], [96.18952959661362, 16.83413976383906], [96.18935012790615, 16.833589554114667], [96.1892623900473, 16.83326339788755], [96.18913078325909, 16.832821846051388], [96.18891062022902, 16.832262583751287], [96.1885910038718, 16.831644058826328], [96.18841400110534, 16.831319809161926], [96.18817424814307, 16.832041263293718], [96.18782234162785, 16.832799911586676], [96.18766805843421, 16.83311398812009], [96.18753814686806, 16.83338356080276], [96.1873004911248, 16.833906173930814], [96.18700218240485, 16.834499359557867], [96.18654823341433, 16.835443496620144], [96.18626213119245, 16.836042404633304], [96.18605995190529, 16.83642387456223], [96.18581628779151, 16.83691668505702]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
