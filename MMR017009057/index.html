
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Tu (West)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Tu (West)</div><div class="name-mm">လေးတူး (အနောက်)</div></div>
        <span class="pcode-badge">MMR017009057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51058371276821, 17.49127258696035], [95.5125395997228, 17.489822580347834], [95.5132027202294, 17.48929949957227], [95.51569391963875, 17.488801259870286], [95.51559420191097, 17.48735649001003], [95.51549447968654, 17.48591163021763], [95.51554444332146, 17.48237435918935], [95.51556396040849, 17.48098880968587], [95.51559420011233, 17.478837089959768], [95.51519567993677, 17.476246349989083], [95.50881864036802, 17.476146720394865], [95.50582920035737, 17.476744589691123], [95.50483272005403, 17.476943849778877], [95.50084716036821, 17.478837089959768], [95.49904435691161, 17.479700897778287], [95.50162461528384, 17.479522948025703], [95.50282026124614, 17.481565510739756], [95.50382522215631, 17.48328232012301], [95.50514950534546, 17.483929062176514], [95.50720569278855, 17.487894565182103], [95.51058371276821, 17.49127258696035]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
