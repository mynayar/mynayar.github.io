
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da Gon Hmaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da Gon Hmaw</div><div class="name-mm">ဒဂုံမှော်</div></div>
        <span class="pcode-badge">MMR009017015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23723756026527, 19.481918055374024], [95.22396151461226, 19.481824932374764], [95.22024296364191, 19.481798414065622], [95.211187237601, 19.48263758675529], [95.19499347376984, 19.4829732712995], [95.1764260797998, 19.48218849680171], [95.16377174087319, 19.481653643900586], [95.16318545214693, 19.500111805315612], [95.17146065388613, 19.50719179636434], [95.17299175956214, 19.51534652762018], [95.17461914755569, 19.514349275698578], [95.18383265065637, 19.511836503352015], [95.19060972395965, 19.51361994260634], [95.20024030294769, 19.515403383659304], [95.20559062430794, 19.508269622145406], [95.21593457791852, 19.502562612574536], [95.22306834033168, 19.502562612574536], [95.23198554199922, 19.501135859732187], [95.23550461884315, 19.499536279675624], [95.23519573499522, 19.498995732267304], [95.23590911141639, 19.49007852970044], [95.23723756026527, 19.481918055374024]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
