
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Toet Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Toet Seik</div><div class="name-mm">ကူးတို့ဆိပ်</div></div>
        <span class="pcode-badge">MMR005004049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51167415963482, 22.60703619036792], [95.51256011955394, 22.603493339945715], [95.51285532021689, 22.599950490422827], [95.50842659980782, 22.597293330123136], [95.50399824002682, 22.596112350304793], [95.49514080010789, 22.593455279937245], [95.49071244032694, 22.591979010423017], [95.48923607998114, 22.590502829941727], [95.48516566296502, 22.588132735037732], [95.48449674003257, 22.5864847849449], [95.482130385409, 22.58972756577458], [95.48150813459279, 22.596572321155747], [95.482130385409, 22.598439070906466], [95.48119701143298, 22.604661576370688], [95.48135481007648, 22.605419009679622], [95.48213882284847, 22.6091822749421], [95.48061905312687, 22.611131257801333], [95.47975400514326, 22.613101157992105], [95.47217438044333, 22.613684207360336], [95.476208875839, 22.61743163466224], [95.48126459998139, 22.619436210013134], [95.48628371991782, 22.623274350131226], [95.49159803961788, 22.623569549894853], [95.49484560034426, 22.620912389595162], [95.49720755998095, 22.61855051989062], [95.50104587996344, 22.615302870131416], [95.50429343979044, 22.614712379772584], [95.50724579985382, 22.615302870131416], [95.50606464017108, 22.609988640363497], [95.51167415963482, 22.60703619036792]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
