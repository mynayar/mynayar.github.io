
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Pin</div><div class="name-mm">ကွမ်းပင်</div></div>
        <span class="pcode-badge">MMR007009011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.52418837229561, 19.05553966532335], [96.52266022089253, 19.059429503868557], [96.52121095622073, 19.064501932917892], [96.51927860182604, 19.06812509639616], [96.51734624833074, 19.072231347798493], [96.51589698275961, 19.07537142155394], [96.51372308485253, 19.079477673855592], [96.5115491869455, 19.084791647316706], [96.51130764343304, 19.08913944313082], [96.51145720428661, 19.08938871181965], [96.51888014370371, 19.084585633320387], [96.52795224639914, 19.076017535880624], [96.52980026507026, 19.072657501442563], [96.53372374365591, 19.069406073631455], [96.53159735693254, 19.06727969140468], [96.52749110463083, 19.063173439102968], [96.52676647319424, 19.059791820036537], [96.52604183995902, 19.05665174628109], [96.52418837229561, 19.05553966532335]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
