
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Din</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kale</div><div class="name-mm">ကလေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Din</div><div class="name-mm">အင်းဒင်</div></div>
        <span class="pcode-badge">MMR005027031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14787932027446, 23.031131850154793], [94.14891576015424, 23.03078624968572], [94.14159659980328, 23.018923979657984], [94.14153412839738, 23.018710848426963], [94.13673552042798, 23.002339679832403], [94.12958735986882, 22.984611749932355], [94.12841879609061, 22.980487587632126], [94.12752636015347, 22.97733794958674], [94.11940584000757, 22.98590972975029], [94.11914695486814, 22.990827003263632], [94.11872795982754, 22.998785399926305], [94.1133067197294, 23.000140709725997], [94.11115104028835, 22.988284469652626], [94.10816087992072, 22.988599199993132], [94.10091803963587, 22.987455659850866], [94.08872015970769, 22.987455659850866], [94.07655540001178, 22.990877099998215], [94.07783303986298, 22.995477269860146], [94.08469535990298, 23.006914649791327], [94.0844095202832, 23.02006769966465], [94.08247955988384, 23.027787990023796], [94.0844095202832, 23.027787990023796], [94.08155004040208, 23.035794120002663], [94.07954879973738, 23.044086270365142], [94.08753396022416, 23.048078940091045], [94.08935303961113, 23.047428150189035], [94.1100523196589, 23.040023580324032], [94.12720848038714, 23.0361634796609], [94.14372132008293, 23.032517760286453], [94.14787932027446, 23.031131850154793]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
