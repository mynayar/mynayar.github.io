
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moe Dar (Ah Lel)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moe Dar (Ah Lel)</div><div class="name-mm">မိုးဒါး (အလယ်)</div></div>
        <span class="pcode-badge">MMR005020019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56384848172212, 24.337493393605257], [96.56740080470342, 24.32932326235874], [96.57091671413508, 24.319947848914126], [96.57538416025085, 24.314985765780534], [96.57708731972406, 24.30932616037404], [96.56591796024571, 24.302917440387603], [96.54650891955106, 24.294494610437994], [96.53008896003752, 24.28967421009679], [96.52392576036561, 24.295715369968377], [96.51550283958443, 24.301513710189624], [96.49987776025051, 24.30108639012485], [96.48992916030255, 24.302673359887706], [96.49127195963331, 24.309509310006717], [96.49789488014466, 24.321053700268124], [96.49792476011964, 24.321105990449155], [96.50250251977553, 24.318481409889216], [96.51147443979363, 24.32147219978225], [96.51788315978007, 24.323486309745476], [96.53247072004774, 24.323486309745476], [96.54229728019538, 24.327697770136012], [96.55212420007183, 24.334472700354866], [96.55328375983771, 24.33489992958812], [96.56384848172212, 24.337493393605257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
