
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Kat Mon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Puta-O</div><div class="name-mm">ပူတာအို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Kat Mon</div><div class="name-mm">မကပ်မုံ</div></div>
        <span class="pcode-badge">MMR001014014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.58371912623676, 27.301117306418632], [97.58320878525728, 27.301151438388217], [97.5817009270562, 27.301252283865836], [97.57476968837051, 27.301715850206392], [97.56596039635525, 27.308492228333705], [97.53953252030965, 27.312558055210104], [97.51581519461558, 27.308492228333705], [97.53478905517079, 27.326110812364163], [97.54224307066124, 27.343051758132162], [97.54224307066124, 27.348472860634047], [97.55715110434005, 27.35660451528622], [97.55944654112506, 27.359493086436828], [97.56200360418302, 27.357958849321506], [97.5621785466027, 27.35642809797838], [97.56274422556561, 27.351478402106636], [97.56181844816291, 27.344257332609857], [97.56367000476695, 27.341109685663525], [97.56922467278048, 27.33981359711987], [97.57439219164638, 27.340620126217914], [97.57792063313076, 27.33969226778396], [97.57718636815645, 27.33536985623391], [97.57477934439129, 27.32796363341498], [97.57440903414965, 27.3231495849854], [97.57663090189465, 27.315002738985243], [97.57903792296185, 27.30796682640795], [97.58292619219009, 27.302782467736733], [97.58371912623676, 27.301117306418632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
