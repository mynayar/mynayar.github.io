
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tant Ae</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Loilen</div><div class="name-mm">လွိုင်လင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tant Ae</div><div class="name-mm">တန့်အယ်</div></div>
        <span class="pcode-badge">MMR014011016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.44016117270002, 21.120541254974967], [97.44800673142555, 21.161908744393088], [97.46227138291806, 21.187585117259403], [97.46342333262078, 21.188209090277326], [97.48937421994435, 21.154063185667553], [97.52646231418453, 21.131952976348828], [97.53074170936247, 21.124107417623293], [97.53930049971837, 21.096291348067325], [97.53930049971837, 21.08273992910449], [97.52717554671415, 21.061342952315442], [97.52785311842672, 21.060426238280343], [97.51861675635826, 21.0620561839458], [97.50007270878854, 21.07061497520101], [97.4850948247664, 21.08273992910449], [97.47225663923257, 21.10128397577489], [97.4579919868408, 21.111982463719755], [97.44016117270002, 21.120541254974967]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
