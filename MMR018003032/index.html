
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Kyun</div><div class="name-mm">အလည်ကျွန်း</div></div>
        <span class="pcode-badge">MMR018003032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08285780534351, 20.165430894420297], [96.07533150864225, 20.167839307637962], [96.07137629208228, 20.167839307637962], [96.06428183543841, 20.166711284398332], [96.05528206521518, 20.17282107783052], [96.04877482539791, 20.177553616206467], [96.0428591533273, 20.18524399061772], [96.0428591533273, 20.194117498723642], [96.04167601783399, 20.207131979257497], [96.03990131639267, 20.22014645889203], [96.03940288963173, 20.224466158986104], [96.05054952683923, 20.22487899726798], [96.06001460269181, 20.22487899726798], [96.07421221692033, 20.224287430420645], [96.08308572592557, 20.224287430420645], [96.1005713793657, 20.221986685836953], [96.10072342504611, 20.21997206865609], [96.10199849193691, 20.211556631133647], [96.10228075765093, 20.209693672025367], [96.10414955785586, 20.203775807407624], [96.09947755914209, 20.193185943176786], [96.09169089431936, 20.181973146443625], [96.08515009629997, 20.173875014920043], [96.08265836359266, 20.1679571503023], [96.08285780534351, 20.165430894420297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
