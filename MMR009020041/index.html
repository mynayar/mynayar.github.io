
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Su Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Su Win</div><div class="name-mm">ဆူးဝင်း</div></div>
        <span class="pcode-badge">MMR009020041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75803629913594, 21.725979919138013], [94.7518954251338, 21.71983904603519], [94.73864406587103, 21.706587686772366], [94.72894794968818, 21.69592195933103], [94.72491523405085, 21.68632025307727], [94.7221606690797, 21.67976176629253], [94.71815224772809, 21.675085273666525], [94.71747489814811, 21.67429503219006], [94.67885068091425, 21.701242159697983], [94.68402261185412, 21.703032443692393], [94.69533474770049, 21.707234095177398], [94.70567727228837, 21.712082153268796], [94.71149494073899, 21.71983904603519], [94.71569659222399, 21.724687104126588], [94.71740106200946, 21.73202943820803], [94.72313028123756, 21.733090404398695], [94.7318567852625, 21.73632244282652], [94.73993688178172, 21.736645646579404], [94.74446173612029, 21.736968851231552], [94.74449679439158, 21.737389544192183], [94.74834018295314, 21.734706424062267], [94.75803629913594, 21.725979919138013]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
