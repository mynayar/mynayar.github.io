
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (115) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (115) Ward</div><div class="name-mm">အမှတ် (၁၁၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701525</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24706957370194, 16.91176037644027], [96.24561215397779, 16.907442843712317], [96.24552292504302, 16.907365781705494], [96.24495780186112, 16.906877722329057], [96.2440952476976, 16.906236335738356], [96.24379781491729, 16.90601516816554], [96.24347063885898, 16.905658248829184], [96.24329218009012, 16.90536081604887], [96.24324634794067, 16.90525769528648], [96.24306620204362, 16.9054440429083], [96.2425379609582, 16.905765269951303], [96.24185981457885, 16.90605794441865], [96.24140295897945, 16.906264956662483], [96.24088185671235, 16.906500524179876], [96.2403179242329, 16.90675750455523], [96.24010377317063, 16.906850303798535], [96.23996100489654, 16.906935965122727], [96.23986820565324, 16.907021626446976], [96.2397968219658, 16.907114424790905], [96.23958124278016, 16.907555577328083], [96.23936709171795, 16.907926773401925], [96.23914972018349, 16.9081666189943], [96.24446506511072, 16.910910988351475], [96.24578101158448, 16.9151285560381], [96.24811210558926, 16.914492416092173], [96.24706957370194, 16.91176037644027]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
