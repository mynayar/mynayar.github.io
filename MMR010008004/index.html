
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Kone</div><div class="name-mm">လက်ပံကုန်း</div></div>
        <span class="pcode-badge">MMR010008004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.34456351189664, 21.841435316886418], [96.35138478867714, 21.838999146993103], [96.35723159786, 21.83802467759682], [96.36648904543318, 21.842409785383325], [96.37858325241524, 21.845312394051803], [96.37866989669845, 21.84533318907546], [96.37871263697866, 21.84519886363671], [96.38208053508868, 21.83461404010592], [96.3835422373844, 21.827305528627278], [96.38409809575057, 21.819612720650582], [96.38402947208255, 21.819509784249192], [96.38208053508868, 21.817560848154642], [96.37964436519536, 21.815124677362007], [96.375746492107, 21.8141502088651], [96.37038691762223, 21.8141502088651], [96.36259117324408, 21.8141502088651], [96.35576989556426, 21.8141502088651], [96.34553798039354, 21.81366297506628], [96.34261457580209, 21.821945954142507], [96.3382294689149, 21.82779276332542], [96.33919457097272, 21.83004466842675], [96.34115287440568, 21.83461404010592], [96.34456351189664, 21.838999146993103], [96.34456351189664, 21.841435316886418]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
