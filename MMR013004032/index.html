
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Nat Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Nat Pyin</div><div class="name-mm">သနပ်ပြင်</div></div>
        <span class="pcode-badge">MMR013004032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3098614215674, 17.100908897227896], [96.31161944058476, 17.098271869151517], [96.31513547861948, 17.0965138501341], [96.32099554201073, 17.0965138501341], [96.33588179770686, 17.090967990080742], [96.33564569869009, 17.088016758666527], [96.33066464615655, 17.08332870795357], [96.32158154834985, 17.075710626444277], [96.31989730611582, 17.077155588759467], [96.31627877324684, 17.077155588759467], [96.31547465433187, 17.076351469844496], [96.31326332933924, 17.075346321875315], [96.310247883633, 17.070722641037094], [96.30964479467161, 17.06891337415294], [96.30783552868678, 17.06891337415294], [96.30421699581774, 17.06891337415294], [96.30240772893359, 17.071526759052745], [96.30260875888717, 17.074542203859664], [96.30200566992579, 17.077557647767264], [96.30220669898006, 17.079165884697886], [96.304418024872, 17.082382358559073], [96.3046190548256, 17.086402951335174], [96.3046190548256, 17.090222514157745], [96.30401596586421, 17.093237958065345], [96.30602626180257, 17.096052372918734], [96.30843861764816, 17.09926884677992], [96.3098614215674, 17.100908897227896]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
