
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Kaung Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Kaung Kan</div><div class="name-mm">ငကောင်းကန်</div></div>
        <span class="pcode-badge">MMR018006005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21561538044551, 19.673099043985758], [96.21536389133058, 19.673038391009015], [96.21286660081302, 19.67445730715906], [96.21151091779467, 19.67522758188744], [96.20729089226091, 19.67136346305341], [96.20310301928896, 19.670685938105635], [96.19928232332063, 19.670072292902034], [96.19249261544189, 19.673134319892995], [96.18995803723368, 19.676885495569195], [96.18672115505734, 19.68003026828228], [96.18490521160629, 19.68247363275202], [96.18490521160629, 19.68576111258534], [96.18362178191978, 19.698852098445627], [96.18412150190585, 19.70085097659137], [96.18437825295405, 19.700608712721987], [96.18453852023657, 19.700466252915305], [96.18564258733562, 19.699415609143102], [96.18740553193982, 19.70126759202583], [96.19047164275219, 19.704552962049604], [96.19870283796564, 19.71316405877434], [96.20640974011746, 19.705108165709305], [96.20882919521125, 19.700726989758834], [96.2118953905599, 19.695189976336394], [96.21559142700283, 19.688459826060182], [96.21864972180725, 19.683192762136287], [96.22031479409253, 19.68006650376617], [96.22143617044298, 19.67823152616404], [96.22218375257819, 19.676702379211463], [96.2228841499836, 19.675301584400643], [96.21785545316669, 19.673639297315788], [96.21561538044551, 19.673099043985758]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
