
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oktwin</div><div class="name-mm">အုတ်တွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Bo</div><div class="name-mm">သံဘို</div></div>
        <span class="pcode-badge">MMR007013023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.36643947480201, 18.84868600615431], [96.36763330143577, 18.846059589178765], [96.3645293543463, 18.84247811197531], [96.3619029373707, 18.83794157364474], [96.3604703461296, 18.836508983302963], [96.35844084157162, 18.834001948631055], [96.35602428229487, 18.83305063767682], [96.35211356508904, 18.834360096441344], [96.34877085339224, 18.837464042631495], [96.34853208788559, 18.841523050848195], [96.34781579226507, 18.84391070321641], [96.34709949664449, 18.845820823672113], [96.34551437139118, 18.84898351807493], [96.34566690630277, 18.851551187737186], [96.34853208788559, 18.853938840105457], [96.35139727036778, 18.85561019595383], [96.35665010341961, 18.856087726067756], [96.3604703461296, 18.857042787194928], [96.3616641718641, 18.855371431346555], [96.36261923209196, 18.85083489301593], [96.36643947480201, 18.84868600615431]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
