
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khon Taing Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mindon</div><div class="name-mm">မင်းတုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khon Taing Kyin</div><div class="name-mm">ခုန်တိုင်ကျင်း</div></div>
        <span class="pcode-badge">MMR009014062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6052727295529, 19.447976154775745], [94.60067639440012, 19.44912523923847], [94.58523557626091, 19.447272340845927], [94.58152978037515, 19.454066300719262], [94.57844161728684, 19.471977649149267], [94.58152978037515, 19.483712671402714], [94.57922475411914, 19.49379716071047], [94.59820586321007, 19.49544769185752], [94.60039058355864, 19.50112796458393], [94.60129402719764, 19.50347691732594], [94.61117615015928, 19.510270877199275], [94.6179701091333, 19.505947447616677], [94.6278522329942, 19.504094550123455], [94.62812110330634, 19.504436747557918], [94.63162556706635, 19.50889697481557], [94.63482993965005, 19.50014056023872], [94.64129969572446, 19.48784802486648], [94.64776945089949, 19.4772807579007], [94.65316091264606, 19.46520388175378], [94.65380788942264, 19.456361883194404], [94.65281593720579, 19.45156299823384], [94.6414401518416, 19.449742872035984], [94.61673484443759, 19.451595770428526], [94.6052727295529, 19.447976154775745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
