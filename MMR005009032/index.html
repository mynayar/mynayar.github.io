
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay</div><div class="name-mm">လေး</div></div>
        <span class="pcode-badge">MMR005009032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43987252040057, 22.822053750280418], [95.44094423978487, 22.823125379732517], [95.4454607996762, 22.828364550283823], [95.44554035999965, 22.828407390388804], [95.45286780040874, 22.832339130146806], [95.46045551990636, 22.833061739907407], [95.4638823595833, 22.833061739907407], [95.46387300033876, 22.83315848987246], [95.46855639076489, 22.832175032651662], [95.46636307289754, 22.825952246598945], [95.46439938702213, 22.827745260935103], [95.46608150865478, 22.822259091583874], [95.46639263631118, 22.813236460594226], [95.46545925873784, 22.807325081887086], [95.46421475890406, 22.79954695073127], [95.46321639542037, 22.7975252271076], [95.45973300007796, 22.798374840026895], [95.45106131962427, 22.80162672019702], [95.44074336001813, 22.804473060083694], [95.44058279955664, 22.804517340003315], [95.43696983978634, 22.81192442976868], [95.43769235961474, 22.81987349956239], [95.43987252040057, 22.822053750280418]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
