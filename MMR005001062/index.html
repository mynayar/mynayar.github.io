
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Gaung</div><div class="name-mm">ရေတွင်းဂေါင်း</div></div>
        <span class="pcode-badge">MMR005001062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.85331776010662, 22.106371140016165], [95.855660279998, 22.09934367027421], [95.855660279998, 22.092764759885824], [95.85931536041562, 22.08910986023193], [95.87028024014103, 22.089475350107364], [95.88364452007858, 22.08673386037941], [95.8841690397694, 22.08070349956688], [95.8845344397127, 22.071931559993573], [95.88636719958663, 22.065210539634734], [95.8808793601944, 22.06425617997877], [95.87466612044517, 22.062428729702162], [95.87522304540727, 22.060966771999006], [95.87101104002755, 22.06096677020031], [95.85931536041562, 22.059870209742428], [95.84652275971763, 22.0613322600758], [95.84067491991169, 22.064621669854205], [95.83263396008925, 22.070104109716965], [95.82715152022655, 22.07668302010535], [95.82379595991569, 22.078570590060735], [95.82130368042056, 22.07997242988381], [95.8154558397153, 22.08508937987102], [95.81188139970686, 22.086280799919052], [95.81801435967503, 22.09349582956895], [95.82459335999562, 22.09532327984556], [95.8348270801057, 22.098978180398774], [95.83775100000872, 22.10372963961123], [95.84506080021583, 22.106288159570965], [95.85273636009498, 22.106288159570965], [95.85331776010662, 22.106371140016165]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
