
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (6) Ward (Thin Baw Seik Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (6) Ward (Thin Baw Seik Ward)</div><div class="name-mm">ရပ်ကွက် (၆)သင်္ဘောဆိပ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68305796105614, 16.285831585759126], [95.68151372977485, 16.285401058711955], [95.68028521089383, 16.28506439120872], [95.67999967074826, 16.286005142323518], [95.67996057631962, 16.28615606115335], [95.6797081618023, 16.28701017697813], [95.6810747670869, 16.287365037766335], [95.68265039549942, 16.28782760046346], [95.68268656353416, 16.2876391367368], [95.68263217073815, 16.287609768476102], [95.68270696015816, 16.287342195885685], [95.68279874766415, 16.2872443028823], [95.68283274203748, 16.28697673029194], [95.68279874766415, 16.286787470665274], [95.68294211938337, 16.28609776799766], [95.68302651536146, 16.285945591016286], [95.68305796105614, 16.285831585759126]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
