
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kar Yar</div><div class="name-mm">ညောင်ကားယား</div></div>
        <span class="pcode-badge">MMR005003009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3314156800896, 21.61566954011721], [95.33553048044735, 21.621384809961057], [95.33987424010417, 21.62572847968562], [95.34238883987314, 21.630758039851685], [95.34033144014393, 21.634644419604342], [95.3387312395551, 21.636930599667494], [95.34216024030292, 21.639216689798445], [95.34901896035677, 21.639216689798445], [95.35499381141534, 21.639421438448665], [95.35894547205595, 21.63949184817028], [95.356200313094, 21.637089833628977], [95.3525756441507, 21.628114462912208], [95.35024092497878, 21.622333254775924], [95.34577752041628, 21.607988358575938], [95.345777516819, 21.608518679793292], [95.34421799976093, 21.608811089859955], [95.34056003971415, 21.609039690329496], [95.33553048044735, 21.610411380380924], [95.33164427965983, 21.613154759584518], [95.3314156800896, 21.61566954011721]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
