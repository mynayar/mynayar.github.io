
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Nauk Ngar Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Nauk Ngar Thar</div><div class="name-mm">ရေနောက်ငါးသား</div></div>
        <span class="pcode-badge">MMR012009014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.34588315898066, 21.22005833772215], [92.34554244632687, 21.218610306920198], [92.34554244632687, 21.212034401166704], [92.34508893260823, 21.209766846063133], [92.35347888424315, 21.20545849091667], [92.35402972529164, 21.204418014879536], [92.35170988989955, 21.20393536402588], [92.33015478171785, 21.19945074355701], [92.30969046214517, 21.195001979058134], [92.30900629300606, 21.194853247379513], [92.30459269469713, 21.19706004608429], [92.30089492166337, 21.20210246205903], [92.30054689662205, 21.201841442828368], [92.29558159931139, 21.206438940804503], [92.29394626131096, 21.209491572578088], [92.29891830893285, 21.21073458493322], [92.30706202799024, 21.20887724568837], [92.315777235631, 21.2110203301242], [92.33363626959823, 21.214735008613786], [92.34335158360875, 21.220021282955884], [92.34588315898066, 21.22005833772215]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
