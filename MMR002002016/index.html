
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mya Le</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Demoso</div><div class="name-mm">ဒီးမော့ဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mya Le</div><div class="name-mm">မြလဲ</div></div>
        <span class="pcode-badge">MMR002002016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.08189384162756, 19.570536819918345], [97.07268930027107, 19.565014094924607], [97.06790293836997, 19.55580955266879], [97.06134470069742, 19.547482317954632], [97.05133476069074, 19.550655009221373], [97.04176203688854, 19.548077736598316], [97.02894471202887, 19.547421913190817], [97.0277020980734, 19.55425628589893], [97.02273164494949, 19.57041025832683], [97.01713988619684, 19.586150026402663], [97.01092682001678, 19.603960815339406], [97.00471375293739, 19.621771605175468], [96.9997433007128, 19.631505409247268], [96.9972248275638, 19.63590052738749], [96.99673539222465, 19.638959624387212], [97.00587038630937, 19.640177622998976], [97.01043788470065, 19.646267618755644], [97.01104688490585, 19.651139615900604], [97.01572958375334, 19.649660125014805], [97.01751484143682, 19.65035068383702], [97.02335295237691, 19.648591341017607], [97.02887567737065, 19.64564588684823], [97.03476658481009, 19.634600435961374], [97.03955294671118, 19.62024135025814], [97.04986203360602, 19.612509534187723], [97.05943475830753, 19.613614078826743], [97.06790293836997, 19.60514589966357], [97.07143506617541, 19.597799072569217], [97.07710747972646, 19.58600045205924], [97.07968475234952, 19.57495500117244], [97.08189384162756, 19.570536819918345]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
