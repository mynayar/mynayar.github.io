
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yu Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pinlebu</div><div class="name-mm">ပင်လည်ဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yu Thar</div><div class="name-mm">ဝါးယူးသာ</div></div>
        <span class="pcode-badge">MMR005026031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24487312009848, 23.95812987029734], [95.25250259961535, 23.942077649863677], [95.260070880267, 23.924316419866955], [95.2650756002588, 23.90948486993085], [95.2722777597109, 23.896484370257554], [95.27232132017286, 23.89569651018587], [95.2722777597109, 23.895690929892567], [95.27307120007589, 23.882080049554702], [95.27447520007047, 23.864318819557923], [95.26208508016236, 23.86767581968337], [95.25030516015505, 23.86529540955553], [95.24969496025426, 23.866088849920516], [95.24249279990283, 23.870483370011584], [95.21691911972164, 23.872497569906955], [95.19927983959298, 23.874877890102596], [95.18170176012819, 23.87951657972644], [95.17987044006884, 23.88488768981506], [95.19110100021106, 23.901306119581818], [95.20550532001454, 23.921874989838955], [95.2188721198525, 23.940124469868465], [95.22607428020393, 23.952087359643997], [95.23089612035972, 23.96087648975822], [95.23291032025514, 23.960510280425126], [95.24487312009848, 23.95812987029734]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
