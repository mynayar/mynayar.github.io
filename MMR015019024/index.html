
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Nar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Nar</div><div class="name-mm">မန်နား</div></div>
        <span class="pcode-badge">MMR015019024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.23993092327356, 23.563231377925774], [97.2530365438015, 23.56402565825755], [97.29097386515184, 23.552299577063877], [97.31511579585737, 23.53712464888349], [97.31649759428859, 23.535483762965328], [97.3261521078336, 23.524019029254873], [97.33442934204055, 23.523329259138052], [97.33856795824471, 23.49780778819894], [97.34191498758668, 23.484419668133228], [97.31449097567804, 23.46772679135836], [97.29183834206589, 23.44966590725585], [97.28090072888557, 23.44221587306413], [97.26183890833903, 23.453033190229576], [97.25092028434369, 23.455881526611222], [97.24613884892881, 23.463319314734633], [97.2378616147218, 23.47021700960738], [97.22753164556906, 23.481924309359442], [97.22958438141416, 23.490220324108748], [97.2378616147218, 23.505395253188453], [97.24131046170851, 23.516431564265304], [97.2357923070694, 23.535745110448545], [97.23993092327356, 23.557127963384858], [97.23993092327356, 23.563231377925774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
