
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Gan Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Gan Swea</div><div class="name-mm">သင်္ဃန်းဆွဲ</div></div>
        <span class="pcode-badge">MMR010031023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04593771435407, 21.209307708883728], [96.0491703301467, 21.211328094316173], [96.05644371500551, 21.211328094316173], [96.06210079331703, 21.214964787195242], [96.0661415632826, 21.219005557160813], [96.07583940976099, 21.220217786621618], [96.07381902522786, 21.215772941368186], [96.07381902522786, 21.211732171402616], [96.07907202555361, 21.210924017229672], [96.08109241098606, 21.205671016004658], [96.08062606574038, 21.19820950286629], [96.07705164102049, 21.198397631145838], [96.07341494814142, 21.193952784093767], [96.06816194781572, 21.189912015027517], [96.0645252549366, 21.184659013802502], [96.06331302367715, 21.181426398009933], [96.05758553114742, 21.17906801857424], [96.05563556083251, 21.181830475096376], [96.05159479176626, 21.188699783768072], [96.04755402180075, 21.19516501535321], [96.04553363726762, 21.200822092765407], [96.04578725957441, 21.20614817110129], [96.04593771435407, 21.209307708883728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
