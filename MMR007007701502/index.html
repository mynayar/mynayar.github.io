
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kon Thei Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kon Thei Ward</div><div class="name-mm">ကုန်သည်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007007701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67231268638568, 17.791088384393106], [96.67167063433612, 17.79151126204829], [96.6706117741885, 17.79223699765504], [96.66950135905228, 17.792962733261902], [96.66827593663436, 17.793759852698884], [96.66745742173566, 17.794296967190405], [96.66786780645685, 17.795261371285505], [96.66835928064461, 17.79632155131901], [96.6684496628111, 17.79652257372345], [96.66921610787404, 17.79621927373779], [96.67010923067983, 17.795882438850867], [96.67112483889917, 17.7955711217586], [96.67156374496375, 17.795412911433004], [96.67226293253185, 17.79519856195958], [96.6732530229566, 17.794917866220544], [96.67304377704215, 17.794004329179188], [96.67276818486198, 17.79297341028314], [96.67262528521309, 17.792376293893028], [96.67252321403527, 17.79193228426948], [96.67231268638568, 17.791088384393106]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
