
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hin Naung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hin Naung</div><div class="name-mm">ဟင်နောင်</div></div>
        <span class="pcode-badge">MMR005034073</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17335351365381, 25.139176554154687], [95.18715438656574, 25.132038171024817], [95.16121826161356, 25.124899787894947], [95.1362339215583, 25.11478707876074], [95.1142239084067, 25.11835627032565], [95.07496280119238, 25.123115192112493], [95.06972397508144, 25.140702680284505], [95.0624706307151, 25.14155601459845], [94.95311316524044, 25.159571696976286], [94.95613922564479, 25.164975377811516], [94.96596751788672, 25.169720071424194], [94.96495080013938, 25.18225961998553], [94.96122282607263, 25.184970872707652], [94.96020610742596, 25.189715566320388], [94.9641632952999, 25.189948342342177], [94.9827586869639, 25.178437659570363], [95.02142492771827, 25.168324951335478], [95.07436793563176, 25.16475575977057], [95.08745497077035, 25.165945489992396], [95.13444932577585, 25.160591702645036], [95.160028532291, 25.14869439772832], [95.17335351365381, 25.139176554154687]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
