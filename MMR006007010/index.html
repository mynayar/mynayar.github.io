
<!DOCTYPE html>
<html>
<head>
    <title>Map View - To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Palaw</div><div class="name-mm">ပုလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">To</div><div class="name-mm">တို</div></div>
        <span class="pcode-badge">MMR006007010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.71181014782013, 12.88943949633574], [98.71217958841731, 12.888280889851217], [98.71577478028195, 12.879609704924007], [98.72012469399948, 12.870702629622713], [98.72072964006088, 12.869463915127653], [98.72521271999108, 12.862149524780818], [98.72850121875632, 12.855116181566586], [98.72076923990858, 12.851059769692654], [98.71196075998114, 12.846969900340696], [98.70000659992473, 12.839733900299336], [98.69434415985518, 12.835958669556987], [98.69088384021711, 12.840677549929012], [98.67987323985818, 12.852003059593585], [98.67705831418994, 12.858571132251996], [98.68510296033344, 12.865216319977208], [98.69430456000748, 12.87512640016331], [98.70138252038709, 12.88220499006826], [98.70893243958051, 12.88739596505178], [98.71181014782013, 12.88943949633574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
