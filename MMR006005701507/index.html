
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dawei Su Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myeik</div><div class="name-mm">မြိတ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Dawei Su Ward</div><div class="name-mm">ထားဝယ်စုရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006005701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.59667673794115, 12.446280101345621], [98.59781415819691, 12.445925454596079], [98.59770355237708, 12.445636900822365], [98.59879715676345, 12.445682884057874], [98.59877617737874, 12.44548980231258], [98.598767923401, 12.444788565839701], [98.59821100563346, 12.44349474628558], [98.5981158465691, 12.443213598428883], [98.59811419541387, 12.442855723113155], [98.59813730709112, 12.44263970775637], [98.59821489610061, 12.442357598524382], [98.59845591710695, 12.441801438885363], [98.59857341173364, 12.441238361661135], [98.59841629747422, 12.44120417123554], [98.5981542287347, 12.441177974883658], [98.59791816029491, 12.441176362399233], [98.59747416590011, 12.441258053216643], [98.597089444922, 12.441303715394213], [98.59651825851086, 12.441551973244998], [98.59542706160966, 12.44198078078847], [98.59518509001992, 12.442064881788895], [98.59667673794115, 12.446280101345621]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
