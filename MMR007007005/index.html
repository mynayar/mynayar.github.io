
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Daik-U</div><div class="name-mm">ဒိုက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Su</div><div class="name-mm">ရှမ်းစု</div></div>
        <span class="pcode-badge">MMR007007005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61477098639199, 17.741810099556517], [96.61155192338259, 17.73744137202175], [96.6063742781505, 17.73203861299163], [96.60605634262618, 17.731706853988157], [96.60366696086163, 17.728361718618487], [96.5976935046516, 17.73337942212271], [96.59506518381124, 17.735768803887254], [96.59100323391215, 17.739352879232058], [96.58550765405505, 17.738397124727555], [96.58025101237439, 17.736963495668817], [96.57593448868579, 17.734200921335514], [96.57535277840805, 17.73612721160157], [96.5745164943408, 17.740069692862107], [96.57308286528206, 17.745087396366273], [96.57045454444176, 17.750105098971176], [96.56782622270208, 17.75488386429896], [96.56576283798466, 17.76153254858832], [96.5687819763072, 17.761813074114116], [96.57403861798787, 17.76014050597962], [96.57953419784502, 17.757512185139262], [96.58335720956762, 17.755361740651836], [96.58956960395415, 17.753928110693778], [96.59458730655899, 17.752733419811534], [96.59936607188678, 17.750821914399864], [96.60348775655478, 17.750821914399864], [96.60499472802434, 17.750530793061728], [96.60677315805486, 17.7496272226183], [96.61226873791196, 17.746998901777943], [96.61680856506331, 17.744848458189836], [96.61477098639199, 17.741810099556517]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
