
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pyaung</div><div class="name-mm">ကမ်းပြောင်</div></div>
        <span class="pcode-badge">MMR007003004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.48365234567927, 16.96866517675653], [96.48102509862946, 16.968001237866872], [96.47757488107595, 16.965681263979207], [96.47599316155521, 16.964956308786668], [96.47471952818375, 16.96437255974587], [96.46888984838785, 16.96621664208442], [96.4630006820359, 16.96817969843437], [96.45693305691509, 16.969547888324428], [96.45131478255121, 16.970903122581092], [96.4516647231485, 16.971793061100925], [96.455669804418, 16.98197844265104], [96.45612572382316, 16.992464592566932], [96.46683813687059, 16.99283431734989], [96.47618618394529, 16.98927315583154], [96.48256905831545, 16.98243436295553], [96.48792486643947, 16.9760257176128], [96.48779457176215, 16.97520265357963], [96.48645208089886, 16.97461878313038], [96.48535763294848, 16.974074976578947], [96.48517773166702, 16.97398558756487], [96.4842202477663, 16.972738229685604], [96.48377786405723, 16.97134219768435], [96.4837018443647, 16.970253270671947], [96.48363696187636, 16.969323872598693], [96.48365234567927, 16.96866517675653]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
