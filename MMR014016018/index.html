
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Sam Hpu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongkaing</div><div class="name-mm">မိုင်းကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Sam Hpu</div><div class="name-mm">နောင်စံဖူး</div></div>
        <span class="pcode-badge">MMR014016018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.45666170157631, 21.803105501717596], [97.45163933778525, 21.813688340444628], [97.43193808037819, 21.840597375368645], [97.43190078909021, 21.84126860955871], [97.43241859893925, 21.840597375368645], [97.43914585699576, 21.859337596552905], [97.45019778300133, 21.8665453740698], [97.46461333803518, 21.872311595903454], [97.47173742374315, 21.88255247012046], [97.4862366696866, 21.876155744392122], [97.50689896511523, 21.857415523207862], [97.51554829831537, 21.840597375368645], [97.51843140878253, 21.81945456227828], [97.51602881687649, 21.796389674044292], [97.51362622407106, 21.78005204476608], [97.51442566291405, 21.77998312791908], [97.5097820755824, 21.764194934948364], [97.51026259504278, 21.752662491281], [97.5093962583307, 21.752862415068478], [97.49776911425329, 21.755545601748167], [97.47849978233916, 21.756889973993168], [97.47710681882467, 21.75698715743141], [97.47710681882467, 21.763714416387245], [97.46509385569692, 21.78533774893799], [97.45666170157631, 21.803105501717596]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
