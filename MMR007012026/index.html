
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Yar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Yar Kone</div><div class="name-mm">သာယာကုန်း</div></div>
        <span class="pcode-badge">MMR007012026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.49882788360003, 18.454778830178896], [96.49384456027832, 18.454345497246948], [96.49189456298376, 18.45261216731774], [96.49004987720014, 18.451766589656415], [96.48604457289878, 18.452395500851708], [96.4806279157458, 18.452395500851708], [96.47800973835882, 18.452783379349512], [96.47976125078117, 18.457162158606764], [96.47954458431519, 18.461278818762537], [96.47976125078117, 18.466045477416912], [96.47997791724714, 18.469945470207335], [96.47867791935056, 18.472328800433843], [96.48041124927977, 18.47666212525695], [96.48346045193836, 18.47829677617534], [96.48582790733212, 18.478178788720186], [96.49146123005181, 18.478612121652134], [96.49427789231095, 18.479478786616767], [96.49952591398977, 18.47952090456613], [96.49839455156734, 18.475795460292318], [96.49709455367076, 18.47211213306855], [96.49731122013674, 18.47016213667331], [96.49774455306874, 18.465395478018934], [96.49709455367076, 18.460628820263878], [96.49817788510137, 18.456295493642187], [96.49882788360003, 18.454778830178896]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
