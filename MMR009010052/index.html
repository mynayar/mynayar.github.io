
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Hin Khar Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Hin Khar Kyun</div><div class="name-mm">ကြက်ဟင်းခါးကျွန်း</div></div>
        <span class="pcode-badge">MMR009010052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.708849064233, 20.6330666707903], [94.69645217872511, 20.632705244951126], [94.69625114607356, 20.632831608691845], [94.69836716091578, 20.634301064042916], [94.69876261080589, 20.640549166910603], [94.70240990309463, 20.64047156531052], [94.70666542127225, 20.642812100398146], [94.71336786073823, 20.651323134954737], [94.71687866292001, 20.659408618413067], [94.71812949937697, 20.66217088158095], [94.7232000470446, 20.66265709914586], [94.72668190724426, 20.663794032868395], [94.72715737071616, 20.661526434597306], [94.73634401466461, 20.650502462218924], [94.73937044109306, 20.64882711877658], [94.73865817173731, 20.64880520319764], [94.74257503490998, 20.639581623193408], [94.74582996827849, 20.634919151897407], [94.74539063057318, 20.633981900944036], [94.73408655355166, 20.633788669011892], [94.73294324183718, 20.633769124945218], [94.708849064233, 20.6330666707903]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
