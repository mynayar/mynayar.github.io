
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gan Chaung</div><div class="name-mm">ဂန်ချောင်း</div></div>
        <span class="pcode-badge">MMR017017116</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02854977605136, 16.384668536423874], [95.03080797640706, 16.3880754174466], [95.03222313968621, 16.39010744730092], [95.03359194561187, 16.392072911135983], [95.03588058622012, 16.396077582314604], [95.03634912940885, 16.396453402702434], [95.03658758734736, 16.396803881993606], [95.03810993722391, 16.39904109756867], [95.04138556399266, 16.397109318740092], [95.04269426732662, 16.395205749845502], [95.04317015977512, 16.394491911172793], [95.04519270178184, 16.392350396953304], [95.04804805467404, 16.390327854946577], [95.04983264955717, 16.388543259164123], [95.05126032690265, 16.38675866338167], [95.05173621935108, 16.384498175150725], [95.05257001319563, 16.38176086367298], [95.05176192017655, 16.380909089682802], [95.04184932009014, 16.365819779659148], [95.04042767989358, 16.36395002977008], [95.04028943970593, 16.362362204752003], [95.04005112026306, 16.361555309629864], [95.03871408019069, 16.362703260047454], [95.03476920133761, 16.36727040140795], [95.03211383968204, 16.370344619608545], [95.03034624018687, 16.379891190226317], [95.0293619996566, 16.38300375012301], [95.02865064041481, 16.38446174990986], [95.02854977605136, 16.384668536423874]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
