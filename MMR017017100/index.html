
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Taw</div><div class="name-mm">သရက်တော</div></div>
        <span class="pcode-badge">MMR017017100</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18830523999486, 16.483174110297], [95.18992055998592, 16.482623850210587], [95.19107976002294, 16.482228840088965], [95.19152327957573, 16.481504789614405], [95.19320411967442, 16.47875925023925], [95.1932363225983, 16.47663549043557], [95.19352185734789, 16.474565359004146], [95.19437846339542, 16.472281077409832], [95.19450286661407, 16.472001169718283], [95.19523506944296, 16.470353713353234], [95.19527279240549, 16.469919907377857], [95.1953778377171, 16.468711884945606], [95.1954747288757, 16.466362501428364], [95.19513785362909, 16.46443749809214], [95.19473016036869, 16.464512249740608], [95.18950907968036, 16.465787730319562], [95.18873075961693, 16.466108129986253], [95.1876219602853, 16.466564519736835], [95.18651316005435, 16.467020910386736], [95.18598504037737, 16.468013879736816], [95.18498063974477, 16.469903519931563], [95.18289552021213, 16.47251748039747], [95.18247107977658, 16.473515399616076], [95.18407884006649, 16.476956370340247], [95.18830523999486, 16.483174110297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
