
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gaung Ye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gaung Ye</div><div class="name-mm">ခေါင်းရဲ</div></div>
        <span class="pcode-badge">MMR010020034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37086859560924, 20.89084466744748], [95.37130905476914, 20.88683857713869], [95.37134815998962, 20.872980136823912], [95.37134815998962, 20.8685119289824], [95.37134815998962, 20.86301259715367], [95.37203557568131, 20.85476359896097], [95.36653624385264, 20.847545725654754], [95.35880280810318, 20.84737387240631], [95.35330347627445, 20.84737387240631], [95.34333593660426, 20.8456553300295], [95.34574189467276, 20.855622869699744], [95.34608560296829, 20.861809618119423], [95.34746043615024, 20.866277825960935], [95.34917897672847, 20.87212086608514], [95.34677301865992, 20.87521423984532], [95.34299222920805, 20.876932782222184], [95.33783660477553, 20.876932782222184], [95.33268098124233, 20.873839406663365], [95.33096243976485, 20.876589073027333], [95.33096243976485, 20.88380694723287], [95.33096243976485, 20.883888000430943], [95.33096243976485, 20.890681112243612], [95.33027502317384, 20.89858640214078], [95.33336839693402, 20.902710900787497], [95.34505447808175, 20.90511685885599], [95.3512412274008, 20.906491692038003], [95.35983393298966, 20.906491692038003], [95.36877034777336, 20.909928774093714], [95.37086859560924, 20.89084466744748]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
