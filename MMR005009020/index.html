
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chon</div><div class="name-mm">ခြုံ</div></div>
        <span class="pcode-badge">MMR005009020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35751405892671, 22.705393722342478], [95.35631364026233, 22.70510676036872], [95.35617096371908, 22.704834919595896], [95.35587734856085, 22.704277074627328], [95.35583619468468, 22.70419888577004], [95.35341024738506, 22.703279214763995], [95.35301900272486, 22.702787676809862], [95.35196481112717, 22.701463249729215], [95.35002280880565, 22.70099784067787], [95.34994805715718, 22.700856565278343], [95.34954268594623, 22.700090438223185], [95.34808841205063, 22.69962873257998], [95.34797046416566, 22.699406438156643], [95.3478136835547, 22.69911095780452], [95.34760829818447, 22.698723870710126], [95.33982641865435, 22.698213851687967], [95.33689248839767, 22.699998915117874], [95.33542805665957, 22.70044086265574], [95.33443989418583, 22.702238257589556], [95.33410403157586, 22.702270408352717], [95.33005674872004, 22.702657831793545], [95.32858847777607, 22.703550336079218], [95.32712657043493, 22.703992256637378], [95.32663119687231, 22.704892216302767], [95.32658528828051, 22.710309279050023], [95.32582441596406, 22.71169314412333], [95.32559772025866, 22.71210669017165], [95.32458288029574, 22.71661569036189], [95.32310687967879, 22.718862540374005], [95.3216096397731, 22.719081150274917], [95.32163160031814, 22.719098609713114], [95.3265718802881, 22.723016849747864], [95.3335573202142, 22.72903892960295], [95.3358926401333, 22.732208369820455], [95.33692980037006, 22.733615610072377], [95.34632399975283, 22.733615610072377], [95.35138272043628, 22.727834460392103], [95.35161527972144, 22.727070089712925], [95.35306896006449, 22.722294239987264], [95.3530974002249, 22.721850090009696], [95.35355063965034, 22.714826849779342], [95.35644107959223, 22.709286630273823], [95.35751405892671, 22.705393722342478]]]]};

        map.fitBounds(layer.getBounds());

</body>
</html>
