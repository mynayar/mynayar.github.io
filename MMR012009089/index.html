
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mee Taik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mee Taik</div><div class="name-mm">မီးတိုက်</div></div>
        <span class="pcode-badge">MMR012009089</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.21479276867137, 21.239782031415643], [92.21757941965456, 21.240124775637923], [92.21907923701724, 21.239724824640973], [92.23581412921874, 21.238621424838925], [92.24758372321031, 21.234207827429316], [92.25696261793053, 21.223909431674997], [92.26078968829353, 21.210970290946193], [92.25878131600501, 21.198776603657393], [92.24762379969866, 21.185445544676213], [92.23182939421122, 21.173418612379123], [92.22887036387624, 21.172073598018187], [92.22632308724076, 21.17370841800914], [92.21589008455982, 21.179939238605016], [92.2250189623553, 21.199646019648128], [92.22574347598066, 21.20587684114338], [92.22125148916496, 21.20761567492349], [92.20718631269824, 21.209147526137485], [92.20524763337164, 21.209994069670643], [92.20357003442962, 21.2107266106446], [92.20629151514134, 21.212834140383336], [92.2075122351016, 21.213916818906114], [92.2076194459807, 21.217223726793634], [92.20945776456426, 21.21995023921221], [92.20987475411664, 21.220101574428156], [92.21799240722385, 21.231639738683043], [92.22017043122048, 21.231556025290388], [92.22044746377946, 21.233779358030972], [92.21831994121237, 21.236628693559396], [92.21479276867137, 21.239782031415643]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
