
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Gon Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Gon Taing</div><div class="name-mm">ရွှေဂုံတိုင်</div></div>
        <span class="pcode-badge">MMR010010024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10257367403591, 22.37317628675629], [96.09882121322846, 22.373732155014977], [96.0972584738995, 22.38310767457955], [96.0972274337991, 22.38352660756692], [96.09647697113536, 22.39365515286306], [96.09335178565647, 22.399514809760717], [96.0828046940814, 22.401467842267152], [96.07264825091613, 22.40263958514879], [96.0695764024291, 22.401457983898865], [96.06959199127743, 22.401531397356166], [96.0718853092597, 22.406118033320638], [96.076216434341, 22.4100554190224], [96.07693060756156, 22.41070466928511], [96.08059991705261, 22.41070466928511], [96.08977318898155, 22.412539323131284], [96.09527715231877, 22.412539323131284], [96.10032245062064, 22.41483264111355], [96.10353309597565, 22.41620863172301], [96.10700682000879, 22.41620863172301], [96.10963267760604, 22.413702130349066], [96.11335481956934, 22.407912133138495], [96.11542267571599, 22.398399993964574], [96.11604303255996, 22.388267498846062], [96.11542267571599, 22.37524000512218], [96.11454976226179, 22.371827704784778], [96.10936829670959, 22.37216977091822], [96.10360363699829, 22.373023714073213], [96.10257367403591, 22.37317628675629]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
