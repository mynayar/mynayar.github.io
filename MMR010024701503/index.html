
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Ward</div><div class="name-mm">မြို့မရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010024701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05673678425069, 20.586579096348316], [96.05653597735369, 20.586579096348316], [96.05611560635026, 20.586555302085742], [96.05568730332664, 20.58647598637782], [96.05534624713181, 20.586388739548852], [96.0550845066449, 20.586293561598893], [96.0548862178249, 20.586126999061946], [96.05471172416696, 20.58595250540401], [96.05456895679214, 20.58577801174613], [96.05435480483055, 20.585651106613454], [96.05423583171847, 20.58548454497594], [96.05420336072211, 20.585416510131495], [96.05414034076097, 20.586143420930455], [96.05414034076097, 20.58686710400815], [96.05411559945912, 20.58732481809153], [96.05406611685555, 20.588184578329106], [96.05405374620472, 20.589087635844976], [96.05400426360109, 20.589706168389966], [96.05399350343748, 20.590249556654328], [96.0548966677394, 20.59027884129], [96.05531228026177, 20.590262978216685], [96.05571202971078, 20.59027884129], [96.055953148426, 20.590272496060606], [96.05660670704884, 20.59027884129], [96.05660670704884, 20.589539622070845], [96.05660987966354, 20.58887971821855], [96.0566320879663, 20.588178570375476], [96.05665112365438, 20.58762653542226], [96.05669395395245, 20.587274375193317], [96.05673678425069, 20.586579096348316]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
