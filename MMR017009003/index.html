
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yoe Kha</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yoe Kha</div><div class="name-mm">မရိုးခ</div></div>
        <span class="pcode-badge">MMR017009003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.590425239833, 17.43519384002377], [95.59172087961497, 17.437286340292417], [95.59351440026944, 17.44097310022846], [95.593912920445, 17.442019349913096], [95.59431143972125, 17.443065599597787], [95.59381320001921, 17.44575588012981], [95.59381320001921, 17.44954226966007], [95.59461024037034, 17.45263125023206], [95.59630440032788, 17.457912269835447], [95.59710143977969, 17.459954909891223], [95.59927907976578, 17.45754227975243], [95.60404115997159, 17.455545270397977], [95.60834244015155, 17.452933829832432], [95.61354264038062, 17.45232371986384], [95.61316967983691, 17.45039906996118], [95.61273983987178, 17.448182820280977], [95.61234672012512, 17.446154490237575], [95.61185496003844, 17.443613970208617], [95.61174875999734, 17.443065599597787], [95.60915819989106, 17.44266699038934], [95.6062684803062, 17.44276661998356], [95.6062684803062, 17.440873469734868], [95.6066173201333, 17.438731110152673], [95.60696580023154, 17.436588839603303], [95.60731464725325, 17.43494472062241], [95.60775689966124, 17.43320726999957], [95.60437524012531, 17.433499949862835], [95.59919376018394, 17.434297080146166], [95.59510848007238, 17.434595969828194], [95.590425239833, 17.43519384002377]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
