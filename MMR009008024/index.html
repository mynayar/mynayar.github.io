
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyit Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyit Kaing</div><div class="name-mm">ကျစ်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009008024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.64379062533715, 20.31956762714435], [94.63289447719842, 20.315346597967164], [94.63146547605095, 20.31479302118106], [94.59788472160267, 20.3143361404006], [94.57328501259332, 20.319292797025014], [94.57299529419754, 20.319706681218406], [94.57359855313081, 20.321918630340576], [94.57384820133348, 20.324564897152356], [94.5742018111647, 20.324532750885794], [94.57681593170992, 20.32714687233033], [94.57922896744293, 20.33076642413124], [94.58144091566578, 20.332978373253354], [94.58445720943274, 20.33136968306445], [94.58747350319965, 20.328755561619914], [94.59028871035576, 20.330163165197973], [94.5931039166125, 20.33076642413124], [94.59973976307964, 20.334788149153837], [94.60154953898012, 20.333581631287302], [94.6043647470355, 20.328956648230758], [94.60557126400266, 20.324532750885794], [94.60818538544726, 20.322521888374524], [94.611000591704, 20.32513600981906], [94.61059842028095, 20.330163165197973], [94.61071749681508, 20.33081808928347], [94.61452015418183, 20.331418509057016], [94.61803443584063, 20.33057023432889], [94.62263935592159, 20.332509148378563], [94.62566890929281, 20.337235250306605], [94.62575981276518, 20.337444329192465], [94.64379062533715, 20.31956762714435]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
