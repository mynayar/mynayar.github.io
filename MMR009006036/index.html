
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Cho</div><div class="name-mm">မကျီးချို</div></div>
        <span class="pcode-badge">MMR009006036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24131129398108, 20.618055132338554], [95.24514417936047, 20.626069345424014], [95.24243516864817, 20.63497037638183], [95.23817815489798, 20.637292383636634], [95.23740415158039, 20.64425840809912], [95.23895215731625, 20.65354643981641], [95.23930732477328, 20.657808443904628], [95.2426375107126, 20.658085734569056], [95.24700668700905, 20.66012468110921], [95.25021074842738, 20.66449385740566], [95.25046046677716, 20.665659214201412], [95.25107662378724, 20.66595003786398], [95.25327120700064, 20.664382478168875], [95.26255923961725, 20.648128421089837], [95.26913826242094, 20.63264836822765], [95.2812060320328, 20.633435396426478], [95.2811353039512, 20.633138337764137], [95.28190930726879, 20.623850306046847], [95.28488444266299, 20.616040575412285], [95.27533028356578, 20.614846306312018], [95.26679348972783, 20.614846306312018], [95.26642925260796, 20.614846306312018], [95.24785318827406, 20.615620307830966], [95.24516397883463, 20.61621791002858], [95.24088716381164, 20.61716831356688], [95.24131129398108, 20.618055132338554]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
