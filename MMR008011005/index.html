
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Na Hpar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Na Hpar</div><div class="name-mm">သစ်နဖါး</div></div>
        <span class="pcode-badge">MMR008011005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57882445128746, 18.28369032295012], [95.5782699302132, 18.28356709694401], [95.57553180035234, 18.280463880104037], [95.57388892243586, 18.28137659035741], [95.57120928538029, 18.279066559374257], [95.56994120262448, 18.280401381718434], [95.56600129522366, 18.285550836801747], [95.56458028814984, 18.29009805727958], [95.56372768498471, 18.29464527685809], [95.56240752428789, 18.29778065795108], [95.56429608709482, 18.3006135026111], [95.56475320169898, 18.304727533149162], [95.56351207522215, 18.306771277572466], [95.56582664688233, 18.311283062963014], [95.56842997286503, 18.309877777837244], [95.58536200725086, 18.30427695841496], [95.58574697104592, 18.304149618909832], [95.58347926035964, 18.30036386070367], [95.57850614883978, 18.288677051105083], [95.57882445128746, 18.28369032295012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
