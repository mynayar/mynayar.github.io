
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Ga Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Ga Yar</div><div class="name-mm">နဂရာ</div></div>
        <span class="pcode-badge">MMR012005017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.30348328902261, 20.59657674981719], [93.30411577682167, 20.59025186822919], [93.30464041342441, 20.5773982818053], [93.30306650541496, 20.570840329217845], [93.29677087067921, 20.569004103356747], [93.28890132793401, 20.56585628643853], [93.2857535110158, 20.560872241860523], [93.27604774240945, 20.56008528830546], [93.25706600469243, 20.556256852771583], [93.25436043298765, 20.556260561575698], [93.25319532080749, 20.567329140327615], [93.25406915606675, 20.578106441259308], [93.25348659772834, 20.583058174994846], [93.25348659772834, 20.587208453607275], [93.25348659772834, 20.58888374309032], [93.25785577402479, 20.593544196307676], [93.25909423311242, 20.59629632501543], [93.26047728070199, 20.59936976440315], [93.26384948926255, 20.597886855194247], [93.27814628702157, 20.595760547611235], [93.30306650541496, 20.59654750206562], [93.30348328902261, 20.59657674981719]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
