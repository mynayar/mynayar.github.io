
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Gyi Kone</div><div class="name-mm">ဆည်ကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR008006048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23326897168573, 18.72442013288287], [95.22985948262908, 18.727955899345318], [95.22720765800705, 18.733385826894448], [95.22720765800705, 18.738184367414647], [95.22960692781754, 18.738310643921125], [95.23238502984532, 18.73881575444358], [95.23541568668463, 18.739320863167336], [95.24021422810421, 18.739194585761595], [95.24275511685522, 18.739315579650338], [95.2445440239876, 18.730728823976108], [95.2464858788203, 18.727233484737553], [95.24902410108143, 18.729727175268977], [95.24924998829636, 18.729097136323844], [95.2506810416968, 18.727750926763918], [95.25133347376084, 18.72673326562773], [95.24854853508691, 18.724293854577752], [95.24488649121867, 18.720505534203085], [95.24261349791465, 18.719495314956873], [95.24071933682796, 18.719242760145335], [95.23832006701753, 18.715959549393745], [95.23844634442332, 18.723536191042456], [95.23326897168573, 18.72442013288287]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
