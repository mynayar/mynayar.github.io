
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Shey Ma Kway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Shey Ma Kway</div><div class="name-mm">အရှေ့မကွေ</div></div>
        <span class="pcode-badge">MMR008002023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68987394712502, 18.988000976264118], [95.68193617101753, 18.974926991187715], [95.67586610693536, 18.97072463913082], [95.67353146690374, 18.95905143897278], [95.67213068288476, 18.955782942928522], [95.65345356173253, 18.94177510183954], [95.65765591378943, 18.92449876560562], [95.65816784836755, 18.906899240007988], [95.65341051838078, 18.912713753636865], [95.64918178111435, 18.912978050896356], [95.64601022659076, 18.91218516181584], [95.63993141660166, 18.91429953089869], [95.64084650556185, 18.919362556636713], [95.63617722639793, 18.925899549624546], [95.6296402334101, 18.926833405637183], [95.62683866537219, 18.93243654171306], [95.61750010524571, 18.937572749782646], [95.60956232913821, 18.9371058217763], [95.60514447074081, 18.95258269013908], [95.63344030882325, 18.964191238934575], [95.64722546068651, 18.9656423067471], [95.6520527777136, 18.96372071903602], [95.66139133784003, 18.97165849514346], [95.66559368989692, 18.98099705526994], [95.66419290587794, 18.98566633533318], [95.67119682687212, 18.993137184333648], [95.67866767497327, 18.997806464396888], [95.68847316310604, 18.99453796835263], [95.68987394712502, 18.988000976264118]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
