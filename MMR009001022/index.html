
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay San</div><div class="name-mm">သပြေစမ်း</div></div>
        <span class="pcode-badge">MMR009001022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01802425561499, 20.158104970268198], [95.02231681506902, 20.157074756394934], [95.03386673616103, 20.1560247628326], [95.05066662056817, 20.157074756394934], [95.05801657010869, 20.156374760986466], [95.07411646000668, 20.147624820629005], [95.0745317120689, 20.147862107650212], [95.07481645541515, 20.14727482337446], [95.0723664719352, 20.142374857313882], [95.07096648201758, 20.13957487568001], [95.07096648201758, 20.138235230271732], [95.06606651505768, 20.139924873833934], [95.05836656826256, 20.139924873833934], [95.04891663339595, 20.13607490043637], [95.04506665909912, 20.124174982089812], [95.03771670865922, 20.1126250609978], [95.03316674075256, 20.110175076618532], [95.03131381178304, 20.111204482001312], [95.03001676186415, 20.111925064690013], [95.02441680129442, 20.1126250609978], [95.01566686003764, 20.110175076618532], [95.00866690775166, 20.110525074772454], [95.00927590435958, 20.111337069050535], [95.0139168719661, 20.117525027058377], [95.01706685085452, 20.13082493622187], [95.01636685634543, 20.137124893099383], [95.01146688938547, 20.141324863751493], [95.01181688664008, 20.14552483530298], [95.01566686003764, 20.15147479492589], [95.01802425561499, 20.158104970268198]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
