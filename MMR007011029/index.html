
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung Yoe Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung Yoe Gyi</div><div class="name-mm">မြောင်းရိုးကြီး</div></div>
        <span class="pcode-badge">MMR007011029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6546452918468, 18.459084417212125], [96.65728743436767, 18.452148793432116], [96.65728743436767, 18.44822296761589], [96.65859604327284, 18.440807521350052], [96.65728743436767, 18.43513688575871], [96.65859604327284, 18.429030046599394], [96.65815983970492, 18.42183270211757], [96.64899958186527, 18.422705106555497], [96.64487971742506, 18.424665061143685], [96.6448838992726, 18.43053914766358], [96.64109971488, 18.433702480585055], [96.63778826002022, 18.435513637844167], [96.63447388775978, 18.435967651585884], [96.6292699589415, 18.438229881803636], [96.62548242277563, 18.438683952202666], [96.62359019343273, 18.440038946340337], [96.62359338242874, 18.442750648723518], [96.6264326743285, 18.444555284998444], [96.62785475879014, 18.44500564569404], [96.63259255640139, 18.449972203854202], [96.6325964513652, 18.456144269042852], [96.63722210801393, 18.456510820118297], [96.64158413470011, 18.45781942902346], [96.65030818987111, 18.45912803702936], [96.65379781211936, 18.46130905127177], [96.6546452918468, 18.459084417212125]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
