
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Lun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Lun</div><div class="name-mm">မလွန်</div></div>
        <span class="pcode-badge">MMR009013004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97262819013895, 19.89082751128069], [94.97940580213611, 19.896098987278492], [94.98308746831208, 19.909445026267008], [94.98439858272849, 19.912619303937788], [94.99183142458065, 19.930614604080745], [94.99786969223254, 19.9325015633965], [94.9991947560332, 19.932915645440744], [95.01668266857035, 19.928313562720803], [95.03509099765148, 19.93153502062478], [95.0413129140598, 19.93134357744418], [95.03854061715583, 19.927837437347932], [95.04057517410507, 19.91713157586156], [95.04097031732636, 19.91634102681701], [95.03371037373483, 19.914967523732287], [95.02496641656694, 19.910365441911665], [95.01484183638172, 19.90208169391508], [95.01139565498556, 19.894562753668197], [95.0106552008769, 19.89294721783989], [95.00471725529718, 19.87999169865799], [95.00440356637154, 19.87497267584837], [94.99137121630866, 19.87677024075407], [94.97572413596015, 19.882292740017988], [94.97112205413953, 19.889656072369917], [94.97262819013895, 19.89082751128069]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
