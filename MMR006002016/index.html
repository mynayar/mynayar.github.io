
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Htaung Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Launglon</div><div class="name-mm">လောင်းလုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Htaung Ni</div><div class="name-mm">ကထောင်းနီ</div></div>
        <span class="pcode-badge">MMR006002016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.17164072004323, 13.908266549561688], [98.16813359968592, 13.9117735799868], [98.16550343973199, 13.915719000231718], [98.161996320274, 13.919664419577373], [98.15673600036621, 13.92339060039592], [98.14994135970602, 13.92799355995487], [98.14183155678097, 13.93237719195389], [98.14161240189088, 13.93588434019017], [98.14073543968885, 13.93895304015075], [98.13898206027392, 13.939391385004456], [98.1396395995879, 13.94202167985668], [98.14117392034024, 13.942898460395668], [98.14555763957344, 13.94311769982204], [98.1536673597609, 13.94202185972108], [98.158269959591, 13.940706780193807], [98.16462648022792, 13.938953309947351], [98.16703739985616, 13.942241279911173], [98.1712018796631, 13.94552915994285], [98.17799652032323, 13.945529249875051], [98.1904896000151, 13.944871890425475], [98.20772274810639, 13.944020922227821], [98.20774011041783, 13.943865849429471], [98.20774134878428, 13.943729423174375], [98.20342152008715, 13.9409265601127], [98.19750383893108, 13.93040523141633], [98.1970654796882, 13.920760860425446], [98.19070920006959, 13.919007239992197], [98.18522963983605, 13.917472830206975], [98.179092720153, 13.913965619917462], [98.17492824034605, 13.911773669919], [98.17164072004323, 13.908266549561688]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
