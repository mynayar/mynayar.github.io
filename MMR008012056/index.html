
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Tan</div><div class="name-mm">အုတ်တန်း</div></div>
        <span class="pcode-badge">MMR008012056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5610946400057, 18.463801412605164], [95.56142993334481, 18.467824929976587], [95.56310829491196, 18.468938278079122], [95.56784230727669, 18.468961256656712], [95.57115751680601, 18.46852626807288], [95.57249459734783, 18.472686673950875], [95.57316518042882, 18.474530784168394], [95.57418546578668, 18.474666821916344], [95.5744415279542, 18.47441281469969], [95.57478856643922, 18.47474723659576], [95.57632588732992, 18.47622866731922], [95.58057977593597, 18.477152021948314], [95.58104131520457, 18.47941388164537], [95.58246367216083, 18.479421363105473], [95.58341388864011, 18.478521380957034], [95.58720223419579, 18.47808984666915], [95.58862058287366, 18.47899821679431], [95.59524306721386, 18.479932937055423], [95.5957121706802, 18.480840391670768], [95.60091583689643, 18.48131716095827], [95.60022683569997, 18.465286127652746], [95.58003021822003, 18.453145301614427], [95.56811162365256, 18.46010398401171], [95.56314262563171, 18.462613680676895], [95.5610946400057, 18.463801412605164]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
