
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Son</div><div class="name-mm">ချောင်းဆုံ</div></div>
        <span class="pcode-badge">MMR010016004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89799025714473, 21.684011310273775], [95.8987652353274, 21.67858646029697], [95.8987652353274, 21.676003198189107], [95.89721527806267, 21.676003198189107], [95.89230707960809, 21.67703650213292], [95.88817386113482, 21.677811481214917], [95.88274901025869, 21.67858646029697], [95.87732416028183, 21.67987809090124], [95.87396591909197, 21.67987809090124], [95.86983269971938, 21.68168637392705], [95.86704277700261, 21.681841370283053], [95.86518282792525, 21.681944699688188], [95.8615662609742, 21.681944699688188], [95.85743304160167, 21.681428048165913], [95.85381647465067, 21.681428048165913], [95.85097488678167, 21.683494657852236], [95.84787497225221, 21.68452796179605], [95.84787497225221, 21.687627877224827], [95.84709999406954, 21.69021113933269], [95.84709999406954, 21.693827706283685], [95.84709999406954, 21.69615264173109], [95.84580836256595, 21.700802514424538], [95.84761664559176, 21.700802514424538], [95.8520081916248, 21.700802514424538], [95.85975797794839, 21.700802514424538], [95.86544115458565, 21.69899422960009], [95.8703493530403, 21.6979609247569], [95.87654918119983, 21.695377662649037], [95.88042407481129, 21.693052727201632], [95.88094072723283, 21.68995281267223], [95.88249068359823, 21.687111224803232], [95.88584892478809, 21.685302940878046], [95.88920716597801, 21.685302940878046], [95.89437369019373, 21.685044615116965], [95.89799025714473, 21.684011310273775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
