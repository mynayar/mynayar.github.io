
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (5) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (5) Ward</div><div class="name-mm">အမှတ် (၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19408246033731, 16.89937971290346], [96.19436925150826, 16.899528705686812], [96.1979880091394, 16.901408700351283], [96.19991527966643, 16.902367290418166], [96.20088195823583, 16.90056228632053], [96.20107078618786, 16.900213241448064], [96.20153236412739, 16.899393081325712], [96.2023830409447, 16.897851943712347], [96.2036452304431, 16.89558839778643], [96.2021954603523, 16.894835488966724], [96.1978317879068, 16.89259928872619], [96.19716165032094, 16.8922973751176], [96.19713567354407, 16.892339817816552], [96.19681903079768, 16.892857170405716], [96.19656330900386, 16.89327498513773], [96.19610257787815, 16.894035068981083], [96.19607221754559, 16.89408515534889], [96.19581387562624, 16.89459243730167], [96.19542307366414, 16.895359816104442], [96.19488117964123, 16.896315806018865], [96.1943005824499, 16.89739086437576], [96.19427154886549, 16.897444624029866], [96.19423063916243, 16.89752160621105], [96.1934248394547, 16.899037920251093], [96.19408246033731, 16.89937971290346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
