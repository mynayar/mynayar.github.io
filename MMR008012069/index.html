
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Thar</div><div class="name-mm">လယ်သား</div></div>
        <span class="pcode-badge">MMR008012069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69117192694296, 18.5120668585987], [95.68710181929356, 18.505828670756614], [95.67573533291932, 18.498043104905435], [95.67102586305322, 18.496159316599233], [95.66474656989834, 18.50149671560098], [95.6604439443326, 18.507337538896365], [95.65939306313942, 18.508107215575592], [95.66203349335109, 18.512822271130972], [95.66250499710799, 18.515745604675942], [95.6639195137746, 18.51791453023145], [95.66571123488563, 18.51819743356475], [95.66627704335093, 18.521215069120217], [95.66816306467376, 18.52083786377642], [95.67174650689583, 18.522440985363232], [95.67316171064448, 18.523489283703555], [95.67361204076315, 18.526368870626925], [95.67522939412129, 18.526221719057162], [95.67627295932965, 18.52772184488731], [95.67792103712623, 18.528700390910387], [95.67833856717118, 18.52819616622014], [95.69117192694296, 18.5120668585987]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
