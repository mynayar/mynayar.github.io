
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pu Law Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Palaw</div><div class="name-mm">ပုလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pu Law Kone</div><div class="name-mm">ပုလောကုန်း</div></div>
        <span class="pcode-badge">MMR006007002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.78882202012016, 12.999028973408429], [98.77555763957349, 12.990323519814638], [98.76171600039316, 12.981095099659171], [98.75219529967342, 12.978812194027569], [98.74242143979768, 12.982772700399835], [98.72899920035286, 12.984450390173436], [98.71988301379014, 12.983790482045151], [98.71473779990959, 12.99703418987599], [98.71138205973432, 13.00584293960003], [98.71096230027001, 13.027655250289627], [98.70928451786625, 13.034116746091001], [98.72067924025481, 13.036603949812502], [98.7346609200655, 13.0354856095733], [98.74137203978785, 13.030452089692233], [98.75703168006805, 13.031011530058095], [98.76933540030853, 13.031011709922552], [98.77772411987229, 13.029333930216751], [98.77899309295691, 13.027783027764542], [98.78275763975336, 13.023181890232081], [98.78499503968936, 13.009199669928876], [98.78882202012016, 12.999028973408429]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
