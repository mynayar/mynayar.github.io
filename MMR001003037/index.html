
<!DOCTYPE html>
<html>
<head>
    <title>Map View - La Wa Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">La Wa Yang</div><div class="name-mm">လဝါ့ယန်</div></div>
        <span class="pcode-badge">MMR001003037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.89816732965858, 26.49591602140731], [97.88157898018585, 26.474361602106285], [97.86379206195414, 26.453766224331844], [97.85536667972855, 26.443468535444595], [97.83076872889376, 26.45968631477166], [97.82478918067619, 26.463316123340462], [97.82583074399372, 26.465052061303652], [97.82547382285873, 26.472190441735563], [97.82547382285873, 26.476116552636825], [97.82745004798142, 26.478092777759514], [97.82904301532295, 26.479685745101108], [97.83368296489698, 26.482898018229037], [97.83618139935214, 26.487181046668013], [97.83867983200872, 26.49182099534272], [97.84224902357363, 26.495747106243982], [97.8476028091224, 26.498245538900562], [97.85413132510064, 26.49926569115877], [97.86259341405486, 26.504670083357723], [97.87094422809372, 26.50620762098498], [97.87500925277487, 26.506956065570023], [97.87661881440681, 26.50743663898976], [97.87829782888178, 26.507711068910737], [97.87891873611085, 26.507537803726734], [97.87954098602773, 26.5073641644247], [97.88165680122046, 26.50625883018091], [97.88318810744528, 26.50494927608827], [97.8847938298714, 26.503637292926783], [97.887857481038, 26.50205011631988], [97.89136273080544, 26.50025365038573], [97.89537600759672, 26.498113511229633], [97.89816732965858, 26.49591602140731]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
