
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Hlay Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Hlay Su</div><div class="name-mm">ရွှေလှေစု</div></div>
        <span class="pcode-badge">MMR007002034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7533965721941, 17.31877802028947], [96.75050610617194, 17.314081013228247], [96.74869956513288, 17.30793877225659], [96.74580909911072, 17.301435223256988], [96.7432541332717, 17.296325291578967], [96.74002816706633, 17.29890606616209], [96.73511701793609, 17.30273769518851], [96.7309954600725, 17.299989990245876], [96.72985448659534, 17.296795264689763], [96.72774368602234, 17.29890606616209], [96.72521452802812, 17.302157840212203], [96.72196275307863, 17.303603073223314], [96.71690443798946, 17.3028804562681], [96.71220743002891, 17.3028804562681], [96.70787173099563, 17.303241765195366], [96.70498126497347, 17.303241765195366], [96.70461995694552, 17.308661389211807], [96.7038973399903, 17.3155262462393], [96.69992294898498, 17.31733278727836], [96.71886919495745, 17.31770976509364], [96.73228198342684, 17.317976641608766], [96.7533965721941, 17.31877802028947]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
