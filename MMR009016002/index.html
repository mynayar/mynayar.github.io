
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Kone</div><div class="name-mm">အင်းကုန်း</div></div>
        <span class="pcode-badge">MMR009016002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23136560244063, 19.300661613442742], [95.2368322978723, 19.29803759855639], [95.23811125882759, 19.296266730025593], [95.24149484291274, 19.291581766685226], [95.24866799023562, 19.292299082136992], [95.25655845211094, 19.290864452132837], [95.258660138055, 19.289025477044163], [95.25942771121993, 19.288353850749672], [95.25993450887057, 19.28649559059909], [95.26157965487721, 19.280463388874352], [95.2617588411976, 19.276969261921977], [95.25978636804649, 19.27544218610808], [95.25440650755434, 19.267193067406197], [95.25424943196577, 19.266014995995306], [95.24687470430422, 19.266834409680314], [95.24185350063863, 19.26826903878515], [95.2368322978723, 19.270444893617025], [95.23109377965426, 19.272931584724915], [95.2239206332307, 19.275800843833906], [95.21531285680294, 19.27615950066047], [95.2038358221655, 19.271855613345906], [95.1899569951193, 19.274221322256267], [95.18994772580697, 19.27408346877712], [95.18484001275647, 19.274999385113574], [95.18486966969954, 19.275098251183408], [95.18629221191611, 19.276832111712622], [95.19088168524166, 19.28242597667753], [95.19424463078514, 19.28652489500797], [95.20449853078264, 19.29707259272601], [95.20707705975855, 19.30457453758487], [95.21925808819026, 19.30198282994371], [95.2278658637187, 19.302341487669594], [95.23136560244063, 19.300661613442742]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
