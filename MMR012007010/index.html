
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Zauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Zauk</div><div class="name-mm">ချောင်းဇောက်</div></div>
        <span class="pcode-badge">MMR012007010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.20164710383085, 20.164770708401534], [93.20257893277159, 20.164525727680257], [93.20592921406205, 20.164678012580282], [93.20821375735909, 20.16543952701261], [93.20889878175342, 20.165667867578065], [93.20913610744549, 20.16578653222274], [93.21179220564585, 20.16711458087326], [93.21468563043754, 20.16802829387069], [93.2168937700315, 20.168256722569765], [93.2191019114241, 20.167647580271648], [93.22108162141973, 20.166277010775502], [93.22275676341394, 20.16437344188091], [93.2242034749105, 20.16026173339236], [93.22278721895503, 20.155175397226856], [93.22091410740018, 20.151977401735735], [93.21904099584532, 20.14562709631349], [93.21924046277718, 20.140274723599646], [93.21940777714724, 20.13910362373332], [93.21928421569407, 20.13910069823868], [93.21183221468505, 20.13892424585731], [93.1872910443463, 20.141195284035177], [93.1799994032499, 20.14251485207882], [93.17620879230196, 20.143200711044017], [93.17595464299245, 20.15192468527607], [93.17596358135427, 20.15990064120166], [93.17754726769232, 20.159899051200284], [93.18401486629313, 20.16064015641814], [93.19048252334983, 20.16138102241632], [93.19972331188137, 20.16336476766992], [93.20137928662484, 20.164399772231775], [93.20164710383085, 20.164770708401534]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
