
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yon Ka Loet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yon Ka Loet</div><div class="name-mm">ယုံကလို့</div></div>
        <span class="pcode-badge">MMR015008035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.79023435862882, 23.07961444015433], [98.79030569105487, 23.079603542169764], [98.79458487309347, 23.08231552064484], [98.79469147243356, 23.082200763554454], [98.84757935640226, 23.025265337725216], [98.8620286926701, 23.002194486086694], [98.85917399358499, 22.99106115794615], [98.84844895405604, 22.97772732455644], [98.83664281971045, 22.97081641594491], [98.81569190755556, 22.975408396580292], [98.7981146042057, 22.979872474734975], [98.79250263408937, 22.99627874386897], [98.78351679076735, 23.008453113720293], [98.74336068185005, 23.069348285095316], [98.74324306581491, 23.06949932623297], [98.7435164606162, 23.0697421539773], [98.75410977914305, 23.071225947219716], [98.75439744978252, 23.071225948119036], [98.75813445034464, 23.071225964306848], [98.76194889602482, 23.07228623712018], [98.7680910011988, 23.074403725051923], [98.77027283292495, 23.074708025954692], [98.77046863871675, 23.076013399998487], [98.77407998420398, 23.07772404003248], [98.77816306996976, 23.075839537664592], [98.77991918512237, 23.076141133406622], [98.78415374010308, 23.07943467736851], [98.78446806125208, 23.079539450185507], [98.78643459078381, 23.08019495883036], [98.79023435862882, 23.07961444015433]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
