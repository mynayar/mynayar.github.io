
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Done Paik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Done Paik</div><div class="name-mm">ဒုံးပိုက်</div></div>
        <span class="pcode-badge">MMR012008032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.69687909089737, 20.361846319552058], [92.68878818182918, 20.358238162161513], [92.68392817624442, 20.35607057119995], [92.68309775395824, 20.35571330742323], [92.67794884926002, 20.353498144124103], [92.67772602603532, 20.353379262742806], [92.677622553638, 20.353324058758346], [92.67761047574294, 20.353516850922006], [92.67711393036365, 20.35440568327573], [92.67698376069205, 20.354638692221897], [92.67698511866837, 20.35481862138232], [92.67645625255409, 20.357533343688885], [92.67278700961288, 20.363947032429678], [92.67188832428678, 20.36663366441212], [92.67110354799041, 20.367853190072708], [92.67031582011907, 20.370000320558404], [92.66961384080616, 20.37280836281576], [92.66986293142918, 20.37335759497705], [92.66960052364533, 20.375343909593823], [92.66677815069119, 20.379694812565617], [92.66537739634981, 20.38337767933649], [92.66413672942656, 20.38576751885597], [92.6640771862132, 20.387503410953684], [92.66379894856266, 20.387758032407305], [92.66614997244335, 20.389061748101255], [92.66889372216758, 20.390577888159044], [92.67407464273066, 20.394328948722034], [92.67953041229873, 20.396761290201425], [92.6800236643607, 20.39577893015354], [92.68538364174174, 20.386723212206505], [92.6904377920705, 20.377666770305268], [92.6938117192355, 20.36918281433549], [92.69687909089737, 20.361846319552058]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
