
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hte Nan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hte Nan</div><div class="name-mm">ထဲနံ</div></div>
        <span class="pcode-badge">MMR007003032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57697306175743, 17.043482920000827], [96.57512072903847, 17.04215982571543], [96.57329705141785, 17.038968388980038], [96.55825170565174, 17.03942430838515], [96.55688394743629, 17.04489534304571], [96.55278067099124, 17.05036637770621], [96.55597210772663, 17.056293331771883], [96.55597210772663, 17.062676206142044], [96.556090821834, 17.06374463580636], [96.55360493831733, 17.06532656217115], [96.54890041921902, 17.06911606965093], [96.55197005087723, 17.074245164982415], [96.55687219419644, 17.080457069238378], [96.56463612235922, 17.0848438992266], [96.57135556081056, 17.081484178651976], [96.57181070500008, 17.079208458603546], [96.57374506668157, 17.07590866255481], [96.57557646408259, 17.071794596943164], [96.57636214599631, 17.069536644800394], [96.57647593181883, 17.065895492183245], [96.57750000691982, 17.0632784128685], [96.57715864855282, 17.057589110948754], [96.57681729018583, 17.055654748368], [96.57909301113364, 17.051786023206432], [96.57431399759298, 17.047120794589034], [96.57697306175743, 17.043482920000827]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
