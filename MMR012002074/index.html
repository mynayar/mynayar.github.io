
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Htoke Thei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Htoke Thei</div><div class="name-mm">အထုတ်သည်</div></div>
        <span class="pcode-badge">MMR012002074</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.93038417059307, 20.3170093266192], [92.93004085080469, 20.317843097980642], [92.9285745907448, 20.319083791883543], [92.9260932434085, 20.32021167842629], [92.92248401582475, 20.321565132025285], [92.92180727508571, 20.32246746230362], [92.92214560633471, 20.324272147141926], [92.92395016616729, 20.326640818419094], [92.92609308962443, 20.328896702121142], [92.92662549367168, 20.329648389661486], [92.92801043163615, 20.331603752311366], [92.93105567278116, 20.332957310231734], [92.93384225541581, 20.334735100844284], [92.93615995042143, 20.336434876168653], [92.93634409200632, 20.336320882602706], [92.93637437667621, 20.336287712907676], [92.94334042631965, 20.3363917923474], [92.94692218141358, 20.333578337969982], [92.95169782789247, 20.32926403380816], [92.95111326226731, 20.32388810065538], [92.94491791722817, 20.32297403422433], [92.94458542257922, 20.32290403459359], [92.94264049116578, 20.323341002585266], [92.94049897604697, 20.323155404997976], [92.93879566728629, 20.32252821690372], [92.93681557058216, 20.321799112239262], [92.93505944643636, 20.320774706187763], [92.93304650469247, 20.319600490170558], [92.93110455812894, 20.317987967071076], [92.93038417059307, 20.3170093266192]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
