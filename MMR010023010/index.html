
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Hla</div><div class="name-mm">မြို့လှ</div></div>
        <span class="pcode-badge">MMR010023010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05419813213814, 20.36647988573816], [96.05541116379425, 20.35798866774286], [96.05541116379425, 20.350306137218524], [96.05541116379425, 20.34685958889895], [96.04732428908471, 20.342623606694133], [96.04206782097322, 20.34100623175226], [96.03398094626374, 20.33615410692653], [96.02670275902517, 20.33211066957182], [96.02023326015689, 20.32766288893123], [96.00931597884943, 20.326449858174442], [96.00608122896563, 20.326449858174442], [96.00972032303451, 20.337771481868458], [96.00864330934132, 20.34574138086009], [96.0076986039075, 20.35273219963136], [96.00486819820884, 20.37133201056389], [96.0066548867137, 20.376334738557375], [96.00688991733585, 20.37699282286053], [96.01052900960616, 20.37678487532179], [96.02104194672853, 20.376184136288884], [96.03276791460763, 20.3757797921038], [96.03822438115031, 20.37632543866812], [96.04085479021643, 20.376588479574707], [96.04772863326986, 20.371736354749032], [96.05419813213814, 20.36647988573816]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
