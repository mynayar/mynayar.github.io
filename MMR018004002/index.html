
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Ta Peit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Det Khi Na Thi Ri</div><div class="name-mm">ဒက္ခိဏသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Ta Peit</div><div class="name-mm">ကျွန်းတပဲ့</div></div>
        <span class="pcode-badge">MMR018004002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13040461657982, 19.704684776581246], [96.1352594762439, 19.704684776581246], [96.1445235877934, 19.700884114810094], [96.14941310283251, 19.7019953692909], [96.15372087881559, 19.676010560439067], [96.15001118976465, 19.677414072101783], [96.14623261894025, 19.67872203889101], [96.1456318439345, 19.68095782364469], [96.14437969806465, 19.68575405740387], [96.14294594759747, 19.693785937670953], [96.1411930879907, 19.69343675430281], [96.14017106694126, 19.69323316038208], [96.13250504617099, 19.69232864385191], [96.13254757780851, 19.693521641310724], [96.13268067657202, 19.697254998719245], [96.12844839058084, 19.701972173976685], [96.12968005439103, 19.70302716956826], [96.13040461657982, 19.704684776581246]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
