
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Kone</div><div class="name-mm">ပေကုန်း</div></div>
        <span class="pcode-badge">MMR005007041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55339377500275, 23.37661867641083], [95.55719220015999, 23.37513200983443], [95.5666423193876, 23.36504245014902], [95.57951395790292, 23.355339353428462], [95.58217051925413, 23.35208146129048], [95.57628623981816, 23.35101147040308], [95.56056035997267, 23.346848700207374], [95.55362244022348, 23.335748100194735], [95.54437187965857, 23.332972949741873], [95.5442995256027, 23.332979164956555], [95.54412671997221, 23.33299401006559], [95.54346599525951, 23.333502232242267], [95.53972248000849, 23.33638169955583], [95.53931263826769, 23.336484231262318], [95.53565219878999, 23.337399304034705], [95.53191011975628, 23.33833478602162], [95.52950832824683, 23.340136041744984], [95.52722231635687, 23.34185054706512], [95.52331587722603, 23.34731953037209], [95.52448768575817, 23.35083538224717], [95.5369875598281, 23.362164359697488], [95.54905979996983, 23.372800289901534], [95.55339377500275, 23.37661867641083]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
