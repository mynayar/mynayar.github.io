
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Su Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Su Kone</div><div class="name-mm">ရှမ်းစုကုန်း</div></div>
        <span class="pcode-badge">MMR010024058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59214070293115, 20.679263408079862], [95.5955503178929, 20.678912827165277], [95.59842246472505, 20.674809759362972], [95.59883277231467, 20.671527304941208], [95.60129461155714, 20.66783454472852], [95.6053976793595, 20.664962397896375], [95.60252553162803, 20.657576876571625], [95.59924307810564, 20.651422276217147], [95.59883277231467, 20.64567798165359], [95.59863841622996, 20.645192092341233], [95.5963709312735, 20.639523381299057], [95.5914472500906, 20.636651233567648], [95.58525310924364, 20.638123315838413], [95.58465035842738, 20.640634779671416], [95.58642146258052, 20.644472177848797], [95.58642146258052, 20.650966232705514], [95.58701183243016, 20.655984366085704], [95.58878293928126, 20.66247842094242], [95.5902588607579, 20.66838210684881], [95.59232515118487, 20.67074358085165], [95.58997504191473, 20.676389536348097], [95.59214070293115, 20.679263408079862]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
