
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Han Thar Wa Di Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanbyuzayat</div><div class="name-mm">သံဖြူဇရပ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Han Thar Wa Di Ward</div><div class="name-mm">ဟံသာဝတီရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011004701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.7393074645679, 15.961253811814004], [97.73952725348005, 15.961301928241426], [97.73961012690592, 15.961304920285897], [97.74216369519843, 15.961397106191555], [97.7425063377973, 15.960274001344146], [97.74246826679712, 15.9599599122202], [97.74315355199491, 15.959855215845607], [97.74309644504496, 15.959312698921963], [97.74263007012172, 15.95923655602229], [97.74065698902888, 15.95864179927969], [97.74048864133778, 15.958176490952326], [97.74039177356156, 15.957801613953393], [97.7399563326187, 15.95795865806565], [97.73984211781953, 15.957715953528464], [97.73731513078872, 15.959322089642797], [97.73574468606847, 15.960214387084363], [97.73555908848118, 15.960235801740907], [97.73458112971542, 15.960542752945742], [97.734582625288, 15.960545537246787], [97.73455275790349, 15.960555642029306], [97.73473036681304, 15.960849883115657], [97.73510778529612, 15.961626971107876], [97.73529838221464, 15.962095593436914], [97.73610351736352, 15.961590554860265], [97.73667154265763, 15.961590481115877], [97.73674871528107, 15.961616519187032], [97.73788602581948, 15.961799407116985], [97.73923808546931, 15.961279544115712], [97.7393074645679, 15.961253811814004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
