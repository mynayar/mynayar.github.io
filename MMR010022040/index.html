
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyun</div><div class="name-mm">ပြွန်</div></div>
        <span class="pcode-badge">MMR010022040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00932336608054, 21.06905313879139], [95.01685451282555, 21.069380580149698], [95.02602286726159, 21.069708022407383], [95.03388145626428, 21.073309874651045], [95.04304980980095, 21.075601963260056], [95.05156328241958, 21.075601963260056], [95.05811210598898, 21.07527452190169], [95.06498837091664, 21.074619640084393], [95.07055487220964, 21.072327550576063], [95.0797232257463, 21.071017786042034], [95.08437499421069, 21.070528126771706], [95.08594460885666, 21.0667610510817], [95.08838516474361, 21.062818613888], [95.08889271063015, 21.061998731656217], [95.08692693203233, 21.061194549788695], [95.07906834302969, 21.057592696645656], [95.06531581317432, 21.05562805029433], [95.05418281058832, 21.053008520327012], [95.04697910520161, 21.049406667183973], [95.03617354487324, 21.04482248996601], [95.0155447491909, 21.04384016589097], [95.00816319837298, 21.042814951348987], [95.00670383611322, 21.045149931324318], [95.0021196588952, 21.05235363671102], [94.99851780575221, 21.05922990343737], [94.99402351487339, 21.066292360404134], [94.99851780575221, 21.067415932899053], [95.0056768606986, 21.06879267534174], [95.00932336608054, 21.06905313879139]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
