
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Kaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Kaw</div><div class="name-mm">ကူးကော်</div></div>
        <span class="pcode-badge">MMR014006019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61381157704272, 20.81326796064792], [96.6120588478376, 20.81477893499988], [96.6104320578932, 20.819659304833124], [96.6080658183829, 20.82335655356212], [96.6059953577996, 20.82942004360018], [96.60288966872326, 20.83400463360698], [96.6017518842421, 20.8358664640661], [96.60413361187676, 20.83753367314057], [96.61516298468405, 20.83857458444959], [96.60995917997224, 20.84627202483415], [96.5968516519822, 20.859379551924803], [96.5939388683841, 20.86775380679279], [96.60631820002499, 20.869938394941016], [96.61542064764484, 20.873579374888266], [96.61590718536837, 20.877471663186782], [96.62760150880263, 20.878347321371848], [96.64022331655286, 20.87924887913249], [96.64931379239766, 20.877368090964694], [96.65370229692354, 20.872979586438817], [96.65401576191795, 20.858873675180007], [96.65401576191795, 20.853370629151243], [96.65370229692354, 20.852604381587014], [96.65338883282845, 20.84163311757436], [96.65025418558224, 20.834109965802327], [96.64304449880461, 20.826586814030293], [96.6437411082656, 20.82607847674035], [96.6433579628997, 20.8259598849408], [96.63740213520043, 20.823765631778542], [96.616086537164, 20.814361691838656], [96.61381157704272, 20.81326796064792]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
