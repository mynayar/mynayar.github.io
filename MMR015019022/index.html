
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Kone</div><div class="name-mm">ပန်ကုံး</div></div>
        <span class="pcode-badge">MMR015019022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.15425867589721, 23.36188774442394], [97.16510604031157, 23.350484105257294], [97.17184060715834, 23.34313730514259], [97.18530973995257, 23.340994487805403], [97.19632993967502, 23.332423222054103], [97.21041422673522, 23.3258020498248], [97.21071742416984, 23.305791071300973], [97.21151910502272, 23.303353961616097], [97.18071799044299, 23.304566604765057], [97.17020664062403, 23.306809025616076], [97.15775924019681, 23.309464470908665], [97.13908612282637, 23.31038282081056], [97.1308977614226, 23.308498197933545], [97.10722019025962, 23.303048598613998], [97.1035765887886, 23.315280687853488], [97.09378085470274, 23.330280404716973], [97.0934747389681, 23.34283118940789], [97.0898013393604, 23.35385138913034], [97.09102580499695, 23.36670828865664], [97.08490347231748, 23.37772848927841], [97.07898271727862, 23.38079586813484], [97.08398512241553, 23.385381406027136], [97.09378085470274, 23.381401888886103], [97.10939280573348, 23.36915722172847], [97.12469863923087, 23.365483822120723], [97.1439839898693, 23.36976945589572], [97.1531674897879, 23.363034889048947], [97.15425867589721, 23.36188774442394]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
