
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (15) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (East)</div><div class="name-mm">ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (15) Ward</div><div class="name-mm">အမှတ် (၁၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013020701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2257611720405, 16.879129750337768], [96.22270139065671, 16.875031153065322], [96.22159508784307, 16.8737110912939], [96.22085380455951, 16.8742122645844], [96.22012138409468, 16.874734878611832], [96.21988010408359, 16.874880790915824], [96.21948051461413, 16.875059890901298], [96.21811866764244, 16.875543593961766], [96.21744619058927, 16.875777925810667], [96.218582153044, 16.877294540710523], [96.21946907074107, 16.87851142865958], [96.22068595869013, 16.880174636650224], [96.22185271123368, 16.881732123039114], [96.22302055375559, 16.880952835305152], [96.22397041320409, 16.880311965824603], [96.2257611720405, 16.879129750337768]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
