
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kon Swar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kon Swar</div><div class="name-mm">ကုန်စွာ</div></div>
        <span class="pcode-badge">MMR005011017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27728284033088, 22.933105470141356], [95.28088392005691, 22.933898909607024], [95.28692616001433, 22.933898909607024], [95.2922973600352, 22.933288529841832], [95.296325759826, 22.93072506001357], [95.30072027991702, 22.926086460321926], [95.30487072040751, 22.92071535023325], [95.30761751973279, 22.916595060413783], [95.30792244026844, 22.912902810116634], [95.30688492030288, 22.908508290025623], [95.30688492030288, 22.903320329569624], [95.30627435977397, 22.903320329569624], [95.30108640021723, 22.90289310033637], [95.29431155993058, 22.903320329569624], [95.29412832036576, 22.903320329569624], [95.2891236003739, 22.904479980167025], [95.28448499978299, 22.904724149699803], [95.28112799965754, 22.905883800297204], [95.28088392005691, 22.910095259788477], [95.28088392005691, 22.916076659710143], [95.27893056019724, 22.921691940230914], [95.27728284033088, 22.92950439041533], [95.27728284033088, 22.933105470141356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
