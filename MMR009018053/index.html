
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Yar</div><div class="name-mm">လယ်ယာ</div></div>
        <span class="pcode-badge">MMR009018053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00394784032062, 21.36558415358587], [95.01360994144568, 21.36291874560368], [95.02050307675563, 21.36445055365016], [95.02854506989911, 21.360621034433223], [95.03543820610838, 21.357174466328615], [95.04194839120532, 21.356025610293727], [95.04769267137976, 21.35257904218912], [95.04616086333323, 21.343005240999105], [95.04486965271235, 21.33622638883685], [95.04348019925186, 21.334963247855626], [95.04348019925186, 21.33075077572778], [95.04340771029763, 21.329373487396595], [95.03810951634114, 21.329258309423494], [95.03809897628679, 21.32881561544832], [95.03783915675172, 21.32791624393957], [95.03751938121451, 21.327296676700314], [95.03721959041184, 21.32667711036038], [95.03693978614228, 21.325937626620203], [95.03665998187273, 21.32539800371495], [95.036440135404, 21.325138185978574], [95.03584055379855, 21.324338745336888], [95.03562070822915, 21.32349933072959], [95.03530093179262, 21.322440072351526], [95.03450149115093, 21.320561384999962], [95.03392189607871, 21.319402195754776], [95.03330392963272, 21.318099871312086], [95.03077296220249, 21.317925320996835], [95.02975120465442, 21.328483476031636], [95.0287365463546, 21.329075361239006], [95.01772667534584, 21.33003274081841], [95.01743604233957, 21.33003274081841], [95.01772667534584, 21.338170472189574], [95.01150370493207, 21.35253117307525], [95.00384466380024, 21.361147592887164], [95.00394784032062, 21.36558415358587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
