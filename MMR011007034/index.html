
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Saing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaton</div><div class="name-mm">သထုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Saing</div><div class="name-mm">အောင်းစိုင်</div></div>
        <span class="pcode-badge">MMR011007034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.40852316431267, 16.80946081376561], [97.40849436442346, 16.80953277661638], [97.40795349955442, 16.81082399982779], [97.4054710001866, 16.816475999667716], [97.39923899968016, 16.815947999600553], [97.39703899985, 16.815760999970223], [97.39354599974814, 16.819470000140427], [97.3903309998758, 16.82502199986544], [97.38966000040875, 16.82769399987825], [97.3884729996293, 16.830066999592418], [97.38751500041701, 16.831398999864007], [97.38667400030494, 16.8339780000847], [97.38605499963859, 16.835693000031995], [97.38563900023973, 16.8368939996584], [97.38516399991875, 16.83932700034086], [97.38357799962506, 16.842549999682774], [97.38877199992794, 16.842282999960503], [97.39217000014543, 16.84221799966099], [97.39555000043225, 16.842504000259453], [97.39890499956613, 16.843318000025704], [97.40207400001515, 16.84429300002199], [97.40541100011762, 16.845459999879154], [97.41028611611142, 16.837878306738503], [97.41695981144619, 16.827033553056083], [97.42238218738811, 16.816605905837946], [97.42075371121484, 16.8086843867751], [97.41961048043936, 16.80891975824028], [97.41229355670237, 16.809422829999676], [97.41015059907096, 16.81006055275236], [97.40879646918177, 16.80946947783417], [97.40852316431267, 16.80946081376561]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
