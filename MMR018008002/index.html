
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Nyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oke Ta Ra Thi Ri</div><div class="name-mm">ဥတ္တရသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Nyo</div><div class="name-mm">တောင်ညို</div></div>
        <span class="pcode-badge">MMR018008002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02388954206879, 19.944829941248827], [96.02781340196697, 19.939880218397434], [96.03038026134004, 19.930382837098307], [96.03033541664621, 19.92858907632484], [96.03255552082067, 19.92355683887706], [96.03622648326564, 19.90226526083319], [96.03745013681441, 19.888070876070117], [96.03720540610465, 19.871918644729703], [96.03448723669669, 19.86082094143336], [96.03294712071312, 19.859537510847474], [96.02652997228046, 19.857740708566894], [96.0183160206679, 19.857740708566894], [96.01549247589708, 19.86672471817127], [96.01497910420238, 19.874681982587504], [96.01446573160831, 19.87904564424116], [96.01600584669251, 19.896756976253528], [96.01472241790532, 19.91831859732548], [96.01318230192174, 19.92499243205515], [96.00881864026809, 19.931152895090065], [96.0110988290478, 19.94188484141233], [96.01296043377704, 19.94068336514522], [96.01371574378663, 19.940202712585176], [96.01724052413095, 19.93809700037633], [96.01921653701362, 19.93794441240476], [96.02122688331406, 19.93829917876411], [96.0227756498764, 19.939630508141477], [96.02315711980532, 19.941854476702815], [96.02388954206879, 19.944829941248827]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
