
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (18) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (18) Ward</div><div class="name-mm">အမှတ် (၁၈) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701518</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58349610735951, 17.269938114352556], [95.58366846962423, 17.27005306569646], [95.5836180653215, 17.26783168808197], [95.58358067061152, 17.266846435814386], [95.58356197280688, 17.265655036450823], [95.58410419565217, 17.26563718131092], [95.58404385474017, 17.264663685880464], [95.58342939205284, 17.264673019044665], [95.58339794635822, 17.263744560762916], [95.58037195160432, 17.263941371996793], [95.57717683124582, 17.264143052160193], [95.57764332577892, 17.27002947647918], [95.57844911923155, 17.270012186113547], [95.57844867496641, 17.270097180140795], [95.57870024412102, 17.270087551998984], [95.57871383737375, 17.269986808144722], [95.5819620752896, 17.269900781695753], [95.58239381372357, 17.26987968090259], [95.58294283634291, 17.269947853110978], [95.58349610735951, 17.269938114352556]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
