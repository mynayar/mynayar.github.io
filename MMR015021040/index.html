
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Nar Hsan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Nar Hsan</div><div class="name-mm">မန်နားဆန်</div></div>
        <span class="pcode-badge">MMR015021040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.76693637241573, 23.16878703059706], [98.77112719876129, 23.178775213305528], [98.77714326215187, 23.187525848838902], [98.78507352622233, 23.19190116840423], [98.79519144962575, 23.192721539867193], [98.80585628943629, 23.194635742345667], [98.81460692586899, 23.194088826837913], [98.83156128502532, 23.18369744568065], [98.84230087468569, 23.17403181381718], [98.84660144170323, 23.16564925730745], [98.8517971318322, 23.1582659069461], [98.8550786212814, 23.147327611180344], [98.8553520790353, 23.13720968777693], [98.85179371710643, 23.13086834499819], [98.85163985029891, 23.130845119106993], [98.85161704978708, 23.13084167830084], [98.85157946532013, 23.130887806327223], [98.84918006960459, 23.134923559874437], [98.84405647182876, 23.138193221440076], [98.83864442190259, 23.13796617140173], [98.83585301620377, 23.14044742340991], [98.83148138475815, 23.137406288569423], [98.82615940103557, 23.14120770577108], [98.82672961168231, 23.136265863678716], [98.82542514415513, 23.135147745572056], [98.82147776428747, 23.135846967563566], [98.82007607375186, 23.138303516993744], [98.81378655440602, 23.14760106893425], [98.79765256671266, 23.160180109424573], [98.78835501477215, 23.16346159797439], [98.77522905967345, 23.168657289002738], [98.76693637241573, 23.16878703059706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
