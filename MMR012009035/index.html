
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chan Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chan Pyin</div><div class="name-mm">ခြံပြင်</div></div>
        <span class="pcode-badge">MMR012009035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.27768439541859, 20.97077345123381], [92.27859077084747, 20.974902913238907], [92.27773416569926, 20.981470225970213], [92.27383184906063, 20.9932723529368], [92.27240893182682, 20.995398004014703], [92.27206628922795, 20.99671146656101], [92.27214163442892, 20.997728624976105], [92.28045400964487, 20.998100820196726], [92.29368391737893, 21.00660576004782], [92.299944099041, 21.010402919858905], [92.30108636484391, 21.00629076170935], [92.30376384712389, 21.002038292233465], [92.30649978084028, 21.002442463748764], [92.30266135383846, 20.993690850652285], [92.29872388180178, 20.986445902356536], [92.30289009010562, 20.98392425010411], [92.30470884034077, 20.98282342685974], [92.30462848321798, 20.98275110607875], [92.29683389536802, 20.975735976833903], [92.29163643177594, 20.971326008188782], [92.27768439541859, 20.97077345123381]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
