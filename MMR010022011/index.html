
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Taing</div><div class="name-mm">အင်တိုင်း</div></div>
        <span class="pcode-badge">MMR010022011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00652658513388, 21.167562880122887], [95.00739254502997, 21.163521732442064], [95.00652658513388, 21.15774866406963], [95.00623793063608, 21.149666368707983], [95.00508331804076, 21.14042945985176], [94.99469179479058, 21.139274846357125], [94.98503380356726, 21.138766530650912], [94.98372296524269, 21.138697539160148], [94.97881585676646, 21.14129541974785], [94.97564066988105, 21.14475926113107], [94.97131086860179, 21.14735714081945], [94.97188817579871, 21.149089062410326], [94.97564066988105, 21.151398289399594], [94.976795284275, 21.153418862790318], [94.976795284275, 21.155439437080418], [94.97564066988105, 21.158325971266606], [94.973620095591, 21.161501158151964], [94.9721768293972, 21.165830960330595], [94.97419740278798, 21.16496499863581], [94.97997047116036, 21.165542305832787], [94.98487757873733, 21.16669692022674], [94.99007333991278, 21.16698557292591], [94.99613506188365, 21.167562880122887], [95.00306274375066, 21.167562880122887], [95.00652658513388, 21.167562880122887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
