
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing</div><div class="name-mm">ကိုင်း</div></div>
        <span class="pcode-badge">MMR005014038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49402515963345, 22.44679155009004], [95.49407952005384, 22.44671631010965], [95.48748792023139, 22.44207761958654], [95.48632799983739, 22.44152834965365], [95.48187263971062, 22.43951414975828], [95.47210691959873, 22.435302690267008], [95.46691896004205, 22.431274380408354], [95.46429456024583, 22.425903360251937], [95.45831316032417, 22.41992187039807], [95.45489496043416, 22.41351315041163], [95.44812012014751, 22.40667729022482], [95.4447022799863, 22.398925770008304], [95.44012452033041, 22.3939208701521], [95.43951432042962, 22.393310580319053], [95.4332884802792, 22.401123029604207], [95.42767319975843, 22.407470729690488], [95.42594484038216, 22.410808829663836], [95.42633040042767, 22.410888659783893], [95.4281005198232, 22.422912570358903], [95.43408191974487, 22.424072309989185], [95.44427495992153, 22.42749024008259], [95.45489496043416, 22.43090817017594], [95.45532227959956, 22.4432983800163], [95.45611571996454, 22.45550535029173], [95.46191424005019, 22.45367430002898], [95.47668468015394, 22.452697710031316], [95.4857177999366, 22.4522704798988], [95.4909057603926, 22.45111083020072], [95.49402515963345, 22.44679155009004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
