
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pa Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pa Taung</div><div class="name-mm">လက်ပတောင်း</div></div>
        <span class="pcode-badge">MMR005018006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14417133523898, 22.077697770136012], [95.14573969892803, 22.073369086714024], [95.14455668124589, 22.063313435067016], [95.14376800099251, 22.05739834575712], [95.14359190744062, 22.043310801352447], [95.14357083182847, 22.04162477936012], [95.14159913569159, 22.03511817986015], [95.14021894974479, 22.028020075566076], [95.13971101625043, 22.022489244083374], [95.13931499798883, 22.018177044335175], [95.13787824018868, 22.018493610192024], [95.13128664036623, 22.021484400085058], [95.13128664036623, 22.02893064003706], [95.13128664036623, 22.029724080402048], [95.1320800798319, 22.033325160128072], [95.1320800798319, 22.042114290242353], [95.131713960431, 22.050109890059446], [95.131713960431, 22.055297849616124], [95.12451180007957, 22.055481000148063], [95.11608888019771, 22.05310059002028], [95.10709103991962, 22.050345060076495], [95.10711659955149, 22.05047610029186], [95.10632316008582, 22.050109890059446], [95.10632316008582, 22.0607299796049], [95.10852060044539, 22.071289050149574], [95.10968016021127, 22.075317360008228], [95.11907976002294, 22.07849120960168], [95.13110339990203, 22.079284649966667], [95.13928224018332, 22.077697770136012], [95.14417133523898, 22.077697770136012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
