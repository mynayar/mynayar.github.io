
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htu Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htu Pauk</div><div class="name-mm">ထူးပေါက်</div></div>
        <span class="pcode-badge">MMR005017009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7911510797586, 22.597724250174053], [94.79515175974598, 22.594633020397623], [94.80055320036996, 22.59193220970377], [94.8035541597967, 22.584129840020125], [94.80835548012135, 22.5769275897365], [94.81075632014813, 22.575727260104998], [94.80998484032818, 22.57264052963677], [94.8092558399851, 22.56972534035225], [94.80595499982343, 22.562823239700776], [94.80385440026043, 22.55742162011171], [94.79815236034324, 22.552920179622618], [94.79470716010741, 22.55074416021489], [94.78944971982878, 22.558922010342542], [94.78074708021364, 22.56762473988988], [94.77354491986222, 22.57872812959954], [94.76694287981013, 22.589531459609248], [94.76515728038424, 22.594564170100398], [94.77084419999989, 22.595233229729843], [94.778946720215, 22.595533290329115], [94.7858486401027, 22.596133499661335], [94.7911510797586, 22.597724250174053]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
