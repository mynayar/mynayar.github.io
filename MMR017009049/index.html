
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Mat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Mat</div><div class="name-mm">ကျုံမတ်</div></div>
        <span class="pcode-badge">MMR017009049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44037003974557, 17.496925919595583], [95.43441096009781, 17.498117790203878], [95.43172031983693, 17.499313529695712], [95.4330159596189, 17.50135616975149], [95.43366360009514, 17.502377490229037], [95.43431123967201, 17.503398809807265], [95.43557957963395, 17.506281663068364], [95.43616092029032, 17.50760289036117], [95.43650327960273, 17.508380939728625], [95.4369010740254, 17.509716361920596], [95.43789828008164, 17.513064090035755], [95.43825467960983, 17.514062279950338], [95.43947549759622, 17.517361898832633], [95.44003848039159, 17.518304880266044], [95.44003367531394, 17.51917095257744], [95.44002660034738, 17.52056333962645], [95.43914065661608, 17.52146389644173], [95.43976116904275, 17.52208440886841], [95.44023275823525, 17.52255599716159], [95.44581383574001, 17.523584091332793], [95.44566851429056, 17.521950801987998], [95.44653804989116, 17.52030108382803], [95.44661913006888, 17.52014725479205], [95.44675091402354, 17.518728103019612], [95.44712219283497, 17.514729898865767], [95.44948798987889, 17.512483261992998], [95.45090318463434, 17.5120401714168], [95.45143103991063, 17.511537960308658], [95.45085180007055, 17.50818167964087], [95.45035356036857, 17.504694179792637], [95.44965587981505, 17.502003900159934], [95.44955652001744, 17.498914919587946], [95.44935708006523, 17.49502889956409], [95.44616855983122, 17.495726400253204], [95.44075811969151, 17.49684833957923], [95.44037003974557, 17.496925919595583]]]]};
        const layer = L.geoJSON(geojsonData, {

</body>
</html>
