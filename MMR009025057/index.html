
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Kyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Kyi</div><div class="name-mm">မင်းကြည့်</div></div>
        <span class="pcode-badge">MMR009025057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.16357574462495, 21.38415977005741], [94.16021553661778, 21.386136363002777], [94.14608714770378, 21.392237257643387], [94.14187660372232, 21.395237985045014], [94.14303320292004, 21.398129480790942], [94.14495225364362, 21.40179312455308], [94.14639316900963, 21.402675318111505], [94.15746129270457, 21.406232929106466], [94.16240241983587, 21.40939525118995], [94.16931999781968, 21.41512695794279], [94.16945357592186, 21.415025623233987], [94.17505170457258, 21.410778766426972], [94.17526082932386, 21.410475897244908], [94.17408324444625, 21.409810305401322], [94.16997222663701, 21.407122331630376], [94.16696802155701, 21.395421744418], [94.16601932493194, 21.39241753843868], [94.16642832670595, 21.391520881083864], [94.16601264027116, 21.39156418164174], [94.16357574462495, 21.38415977005741]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
