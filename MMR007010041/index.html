
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Taung</div><div class="name-mm">နတ်တောင်</div></div>
        <span class="pcode-badge">MMR007010041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25076024029289, 19.35154755257753], [96.2485495978857, 19.355614831859043], [96.24414338031283, 19.365444089073492], [96.24109292130134, 19.371545007096472], [96.23810920367686, 19.38197495388107], [96.2459058671621, 19.38374684314232], [96.25505724419651, 19.385780481883785], [96.26149710230948, 19.387136242243855], [96.26533231783225, 19.387749875756185], [96.26997060006317, 19.38849200080523], [96.27539363790612, 19.38849200080523], [96.28352819467051, 19.389169880985264], [96.285144116308, 19.388954425006773], [96.28861229422205, 19.38849200080523], [96.29437427215498, 19.387136242243855], [96.29905688826483, 19.38613282367095], [96.29759247541244, 19.382541419750794], [96.29338770777656, 19.380439036832115], [96.29181092013789, 19.37255509773962], [96.29338770777656, 19.36572235100573], [96.29338770777656, 19.359940795731177], [96.29722136657284, 19.35629271113976], [96.29010362917921, 19.356970591319794], [96.28535847061698, 19.35595377104977], [96.2782407332233, 19.357309531409783], [96.27213981520038, 19.35459801158902], [96.263666318346, 19.352564371948233], [96.25519281969292, 19.35154755257753], [96.25076024029289, 19.35154755257753]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
