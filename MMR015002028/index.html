
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Hseng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Hseng</div><div class="name-mm">လွယ်ဆိုင်</div></div>
        <span class="pcode-badge">MMR015002028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.33525460381696, 23.21585326031976], [98.32598551901657, 23.218661962679505], [98.3162195686782, 23.224521467591728], [98.31035984613004, 23.233896893626763], [98.30410958309085, 23.23975647767935], [98.30116895828087, 23.23868703987506], [98.29551576234263, 23.236631102443482], [98.28614068794246, 23.23311505991211], [98.2775466243773, 23.239365240213715], [98.27128024908427, 23.240931750400023], [98.27067839039546, 23.24108220697832], [98.27388136273476, 23.244285179317615], [98.28066282742759, 23.252851238893584], [98.29172732055946, 23.256777349794902], [98.29993646079907, 23.262488055579354], [98.30564716658353, 23.266414165581352], [98.31171479260365, 23.26784184382609], [98.31752767396307, 23.27120039708069], [98.31840529626749, 23.269542665961296], [98.32240279085619, 23.266306598570736], [98.32639331390038, 23.263225651642585], [98.3448272736598, 23.26405414398363], [98.36365887765515, 23.258732169254245], [98.36526266743823, 23.2582752417091], [98.34318974311219, 23.23171290982299], [98.33704900220977, 23.219840811104575], [98.33525460381696, 23.21585326031976]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
