
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Lawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Lawng</div><div class="name-mm">ပန်လောင်း</div></div>
        <span class="pcode-badge">MMR015005063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.63549889325935, 22.473872598341814], [98.63563357033308, 22.47250096584696], [98.64347658487657, 22.470717692067865], [98.65925029156779, 22.467179664709818], [98.66623270707385, 22.46390699671059], [98.65527001090231, 22.455533657352476], [98.6462775242884, 22.44993178032746], [98.6450679451296, 22.43962056203935], [98.64205901231361, 22.44295674465809], [98.64208757658048, 22.443036317572023], [98.64105965058246, 22.445834564413644], [98.6409033052434, 22.447710704885196], [98.6407170079836, 22.449946272902196], [98.6403277184495, 22.450704365414197], [98.63963197413636, 22.452059235445404], [98.6379187620413, 22.454057981390804], [98.63774744029217, 22.455942515234938], [98.63888958198868, 22.45834101162842], [98.63888958198868, 22.461596114069437], [98.63814718984099, 22.463880396563127], [98.63820429679095, 22.467021285104295], [98.63740479859263, 22.468620283299458], [98.63604822434615, 22.46978306083963], [98.63540605084864, 22.470333495394527], [98.63517762304895, 22.471384265071833], [98.63523472999884, 22.473268798016647], [98.63549889325935, 22.473872598341814]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
