
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (147) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (147) Ward</div><div class="name-mm">အမှတ် (၁၄၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701535</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.27694129920167, 16.88375837115194], [96.27686093668297, 16.883511225762504], [96.27692222637972, 16.882457733837384], [96.27704048183284, 16.8811397548958], [96.27718925488028, 16.87948036182928], [96.27729988138447, 16.87830925027174], [96.27730924422627, 16.878017944572548], [96.27724774678614, 16.87776374759892], [96.27668666875479, 16.877111911785335], [96.27608366702765, 16.87648519043921], [96.2712421416116, 16.880460738872046], [96.26675904009767, 16.884047144360295], [96.26230459458145, 16.88773479102781], [96.26664800709989, 16.892836678270157], [96.26671648058118, 16.892907301131117], [96.27123260520062, 16.889187494707187], [96.27223014940193, 16.88924217258824], [96.27375984224301, 16.889341354320095], [96.27528190613509, 16.88944053605195], [96.27639274602848, 16.889508437564416], [96.27660179163945, 16.88631248443363], [96.27694129920167, 16.88375837115194]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
