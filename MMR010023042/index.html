
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Dar Shwe Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Dar Shwe Kone</div><div class="name-mm">ရွှေဒါးရွှေကုန်း</div></div>
        <span class="pcode-badge">MMR010023042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01604715884935, 20.525963705860363], [96.02932860672985, 20.527917190725816], [96.04143805632128, 20.53494908962881], [96.0444011578872, 20.532097078617312], [96.0478839866567, 20.529043197685496], [96.05076408439504, 20.527704239359196], [96.05728646070168, 20.524333510183396], [96.0674466504426, 20.523001026975862], [96.06886003486278, 20.521587641656367], [96.07094441964932, 20.519503256869882], [96.07211034301798, 20.516505168079107], [96.06861257291195, 20.51500612413338], [96.06561448502055, 20.51384020076472], [96.06494824296709, 20.51117523255101], [96.06494824296709, 20.50917650818934], [96.06328263828317, 20.507344342767283], [96.06344919902136, 20.504845936191032], [96.06461512239002, 20.50134816608505], [96.06544792428235, 20.499182880085925], [96.06261639622977, 20.49501886792649], [96.0624498363909, 20.48985549313653], [96.06644728691282, 20.48552492113828], [96.06681954328735, 20.484346108685997], [96.06623075264719, 20.484203987024443], [96.06430672597469, 20.483739567227303], [96.0550068196091, 20.48333522304216], [96.04368519591515, 20.48293087885702], [96.04732428908471, 20.503956753101704], [96.03195922803599, 20.503552408916562], [96.023138046084, 20.506990432562475], [96.01858428573627, 20.515274471040073], [96.01604715884935, 20.525963705860363]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
