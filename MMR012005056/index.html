
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Tet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Tet</div><div class="name-mm">ကျွဲတက်</div></div>
        <span class="pcode-badge">MMR012005056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.1799770110303, 20.199351667245708], [93.18664645886702, 20.20041440060413], [93.1949094792891, 20.201594832735395], [93.20218880596866, 20.2002176631147], [93.20651705411882, 20.19825027742843], [93.2126159495665, 20.19392202927827], [93.21576376738403, 20.191364426627047], [93.21773115217098, 20.18585574814432], [93.22402678600741, 20.180740544640457], [93.2204854923117, 20.17916663573169], [93.21969853785731, 20.174444910804027], [93.21943955109447, 20.169669083561416], [93.21937913823672, 20.16927079181363], [93.21886607141215, 20.16949714577669], [93.2162010744201, 20.170020626750556], [93.21325054177913, 20.170020626750556], [93.21034759856286, 20.16949714577669], [93.21018930079566, 20.169441836571536], [93.20639769429823, 20.168117057855966], [93.19906895436878, 20.16806946933059], [93.19635636885141, 20.1689736639035], [93.19016977061847, 20.176778296281384], [93.18893245097189, 20.17963364917364], [93.18459295500094, 20.186232550591797], [93.18317415486342, 20.18839006644845], [93.18172767539198, 20.190109139425317], [93.17936606559152, 20.192915801223307], [93.17662492659912, 20.19502876196782], [93.17779289232817, 20.19678071056137], [93.17856656559456, 20.19794122270929], [93.1799770110303, 20.199351667245708]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
