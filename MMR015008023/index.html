
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kan</div><div class="name-mm">မန်ကန်</div></div>
        <span class="pcode-badge">MMR015008023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.74513819277342, 22.80841574638964], [98.74508362011306, 22.808520342939516], [98.73900135223067, 22.82619693504057], [98.7359602182895, 22.837411114931058], [98.729687879592, 22.846914659284153], [98.71885384133179, 22.85356713871255], [98.71741510142584, 22.85725391033975], [98.71506624491133, 22.859356959655997], [98.7117348026191, 22.86523161544676], [98.71058113431195, 22.86726599433024], [98.70689125462775, 22.873331365750005], [98.70187940930737, 22.87860658472613], [98.69502394120201, 22.881242892445584], [98.69163958280058, 22.88284654283376], [98.69337068061247, 22.884390495325135], [98.7171396867472, 22.892216875108772], [98.74037322484452, 22.895971720018906], [98.76941682132929, 22.887916354855918], [98.77105475117588, 22.881491835579823], [98.77656220298331, 22.867288405435602], [98.77714193475254, 22.85859242709887], [98.77629438218003, 22.857381636553328], [98.7730838123681, 22.852795109406827], [98.74873507356483, 22.820619989920658], [98.7429484919794, 22.817313371614887], [98.74407374800512, 22.813733719135882], [98.74513819277342, 22.80841574638964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
