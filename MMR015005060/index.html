
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Mon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Mon</div><div class="name-mm">ထမုံ</div></div>
        <span class="pcode-badge">MMR015005060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.72556244295242, 22.47621500671721], [98.72794699535763, 22.478088583221563], [98.72971600858699, 22.481626610579667], [98.72971600858699, 22.48752332404223], [98.72883150197231, 22.502117687681164], [98.73014232320969, 22.510565200423684], [98.73679206420246, 22.51111017519446], [98.74946999684295, 22.50919374329669], [98.75684088709733, 22.50418153734813], [98.76198047122182, 22.5011971479301], [98.76804464204668, 22.495631304041524], [98.76716013543194, 22.489734590578962], [98.76566126415605, 22.480832504716375], [98.76170567527674, 22.482363700324584], [98.74888032486717, 22.475877315785567], [98.73811882412451, 22.46762191801713], [98.73354887238264, 22.465852903888447], [98.73090386731968, 22.464456581406182], [98.72779957668916, 22.464231308428168], [98.72607004999287, 22.46379892697894], [98.72735732428117, 22.47012802099141], [98.72556244295242, 22.47621500671721]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
