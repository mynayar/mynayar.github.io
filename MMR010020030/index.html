
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohnt Hmone Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohnt Hmone Yoe</div><div class="name-mm">အုံ့မှုံးရိုး</div></div>
        <span class="pcode-badge">MMR010020030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43580624026583, 20.841249616076993], [95.43596531234937, 20.841358977235075], [95.43940239440502, 20.843764935303568], [95.44730768430225, 20.84479606019005], [95.45280701613098, 20.848576851440612], [95.45685677931698, 20.85158524556266], [95.45813449381188, 20.850467246166545], [95.46225899335792, 20.847030164110834], [95.46727140525121, 20.844356877168195], [95.46466495142641, 20.841874539678315], [95.46294640994893, 20.838437456723284], [95.46260270075408, 20.82950104193958], [95.4601967435849, 20.82125204374688], [95.45297887027868, 20.81987721056487], [95.44747953755069, 20.818502378282176], [95.44043351929156, 20.824173565157935], [95.43493418656351, 20.829329187791814], [95.43012227132584, 20.830704020973826], [95.42427923120164, 20.830704020973826], [95.42049843995107, 20.835859645406344], [95.42531035608812, 20.83654706199735], [95.430465978722, 20.83757818598457], [95.43580624026583, 20.841249616076993]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
