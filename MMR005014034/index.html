
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ayadaw</div><div class="name-mm">အရာတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Kone</div><div class="name-mm">ရှားကုန်း</div></div>
        <span class="pcode-badge">MMR005014034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4613036804206, 22.387329089565867], [95.4622803603504, 22.38769529979828], [95.46472151968243, 22.394287080384515], [95.46948251980251, 22.401916469969137], [95.47967520025037, 22.407104520357393], [95.49310319985284, 22.41687014963776], [95.49310319985284, 22.41809082013532], [95.49688716031426, 22.41687014963776], [95.50189224003492, 22.416076620239892], [95.50830096002136, 22.416076620239892], [95.50830096002136, 22.40789795982306], [95.50830096002136, 22.40051273977116], [95.50750715992757, 22.392517050021866], [95.50750715992757, 22.384887660437244], [95.5032958803007, 22.38311772000685], [95.49768059977993, 22.38311772000685], [95.49267587978807, 22.377502440385342], [95.4901123200276, 22.369689900268725], [95.49127187979349, 22.360717800386226], [95.49124236044662, 22.360707180292195], [95.48907480006204, 22.35992436002124], [95.47888175988538, 22.357482929993296], [95.47290035996372, 22.358276370358283], [95.46972660030241, 22.364074709680153], [95.46832260030783, 22.366516139708153], [95.4622803603504, 22.382324189709664], [95.4613036804206, 22.387329089565867]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
