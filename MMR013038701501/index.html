
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Taw (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tha Yet Taw (North) Ward</div><div class="name-mm">သရက်တော (မြောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11795089865672, 16.821246000250312], [96.11796873424288, 16.821473422152565], [96.11802715448573, 16.82159778665988], [96.1181448156309, 16.821848262687183], [96.11908149731335, 16.821510315448847], [96.11986160343031, 16.821111679260753], [96.12064933759689, 16.82074356066687], [96.1212013792404, 16.82046045588544], [96.12201711829556, 16.819954342618928], [96.12193816141718, 16.819544383066955], [96.12190151224513, 16.819087983423742], [96.12191581686164, 16.818262100016], [96.12191963178566, 16.81761360158646], [96.12192993172096, 16.816905784774235], [96.11992263861896, 16.816770553718186], [96.1190645432942, 16.816659503633332], [96.11877098029663, 16.81699409460191], [96.11860561385805, 16.81728839864087], [96.1184511184245, 16.817646026642876], [96.11837005623323, 16.817892074859344], [96.11828295419514, 16.818235397345745], [96.11823081959682, 16.81858062819356], [96.11820030200249, 16.818892478904843], [96.11809349042227, 16.819435755755535], [96.11804008508204, 16.819913864133696], [96.11798858630436, 16.82028198272741], [96.11801465315386, 16.82069079114723], [96.11799144794702, 16.821039200199095], [96.11797923491571, 16.821101486313296], [96.11795089865672, 16.821246000250312]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
