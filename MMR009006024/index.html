
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Ngan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Ngan</div><div class="name-mm">ရေငံ</div></div>
        <span class="pcode-badge">MMR009006024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44078505618546, 20.482736852823564], [95.43038011235234, 20.485681648689194], [95.43059625091632, 20.487194622234085], [95.43384129623888, 20.50990993769352], [95.42296328832515, 20.50644875380698], [95.42395219813551, 20.515348942100047], [95.42790783737684, 20.523754675038276], [95.4288967471872, 20.53611604721783], [95.43038011235234, 20.542049505180557], [95.43334684088404, 20.546994054232243], [95.43685815028346, 20.553797215069494], [95.44328886858648, 20.550991082972132], [95.45231823190096, 20.546714016138992], [95.45605991343433, 20.53860703978313], [95.46418694197388, 20.54054204717778], [95.46878905077415, 20.54054204717778], [95.46795868244732, 20.529193677646163], [95.47043095742282, 20.509415483238], [95.47933114481651, 20.50644875380698], [95.48130896443723, 20.493098471817063], [95.4822537616019, 20.493071477766534], [95.46845313690278, 20.487659468309857], [95.45905849505357, 20.486176104044034], [95.45658622007807, 20.478264825561325], [95.44078505618546, 20.482736852823564]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
