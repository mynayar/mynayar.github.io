
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Khar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Khar</div><div class="name-mm">ရေခါး</div></div>
        <span class="pcode-badge">MMR010018024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59095327497374, 21.191062453869222], [95.59248882509928, 21.18948424979834], [95.60139131475745, 21.18499758966709], [95.61655150574745, 21.183413689290376], [95.62349128709326, 21.185930252279377], [95.62609670399974, 21.18308062716926], [95.62665786386935, 21.181852006664826], [95.62706224132944, 21.180966651989422], [95.62024353481132, 21.16937485036908], [95.61395094697866, 21.16002100176786], [95.61393623227139, 21.15999912755774], [95.60285583013251, 21.15778304784942], [95.60289183718862, 21.159368307101715], [95.59910745314653, 21.161466409247453], [95.5946178702186, 21.16405646573338], [95.59013179824393, 21.16483840736663], [95.5871256704134, 21.164422850434278], [95.5869943945757, 21.164133237259136], [95.58571434004483, 21.16131019610873], [95.58477592536872, 21.158899308856064], [95.58220863342177, 21.158742905061047], [95.57961833411889, 21.159039434922022], [95.57421726311628, 21.160680998029704], [95.5725163051834, 21.160758313645317], [95.57278899221825, 21.16186916433054], [95.57333364862905, 21.163049253820077], [95.57763280820757, 21.16870604165058], [95.57921670768496, 21.174362828581707], [95.5797583837425, 21.18248797124295], [95.57968494420487, 21.187351791751837], [95.58457357521041, 21.184614159216153], [95.59095327497374, 21.191062453869222]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
