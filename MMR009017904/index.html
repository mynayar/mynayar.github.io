
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sinbaungwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009017904</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41335300973367, 19.576313550330156], [95.41032958434289, 19.575683669665693], [95.40497926298264, 19.571760101147788], [95.39927225431114, 19.56926328367365], [95.39534868489397, 19.574256917722607], [95.39392193205157, 19.577110421608722], [95.3896416753231, 19.57960723908286], [95.3825079138092, 19.582460742968976], [95.3807244727563, 19.588524440750405], [95.37910565799979, 19.59037451527172], [95.38143784917747, 19.596371578685478], [95.38857161069132, 19.60207858825629], [95.3932085556304, 19.613135919187357], [95.39891556610053, 19.61634611128403], [95.40283913371911, 19.61848623964829], [95.40306220965329, 19.61872325777216], [95.40434807380461, 19.61769456735044], [95.40689173786348, 19.618784709346926], [95.40783276776807, 19.617059487705262], [95.40854614418924, 19.608855661559573], [95.40854614418924, 19.602435275567586], [95.41889009779982, 19.587454377017934], [95.42174360258525, 19.58103399102589], [95.41889009779982, 19.577467109819338], [95.41335300973367, 19.576313550330156]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
