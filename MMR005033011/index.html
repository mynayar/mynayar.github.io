
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Par Saung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Par Saung</div><div class="name-mm">ပါဆောင်</div></div>
        <span class="pcode-badge">MMR005033011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5322877603719, 26.029113750199485], [95.547729600141, 26.019104040419165], [95.58508283970133, 26.003112749953516], [95.59429919994818, 25.991088840277826], [95.62231440008958, 25.97631840017408], [95.60510244002563, 25.95910644011019], [95.59429919994818, 25.940307600215647], [95.58990467985717, 25.923278789784376], [95.5891112403915, 25.920288089823543], [95.55169680016724, 25.933715819629413], [95.51428235994302, 25.957702619979955], [95.48182548016183, 25.976480580314558], [95.48180244043033, 25.97649390017341], [95.4676090799951, 25.99562196028529], [95.47448522980955, 25.996293037094063], [95.4830028941683, 25.9966481442965], [95.48698536468288, 25.996814181629247], [95.4885347149052, 25.998344298950315], [95.4916149198927, 26.001386286348065], [95.49421872341543, 26.01597045527234], [95.49853853592475, 26.02128764021245], [95.50098936027081, 26.024304419613316], [95.50828079991902, 26.036805239770047], [95.50945016769117, 26.037881155391062], [95.50967239466536, 26.038754189354393], [95.51041006896958, 26.041652189896695], [95.5140765995555, 26.044922340693518], [95.51536377671698, 26.04332216168848], [95.51557547982458, 26.043058979588295], [95.5322877603719, 26.029113750199485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
