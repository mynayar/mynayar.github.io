
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Htet Pyu Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Htet Pyu Ma</div><div class="name-mm">အထက်ပြူးမ</div></div>
        <span class="pcode-badge">MMR012009029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.3082754283684, 21.05639573407592], [92.30817381576907, 21.056375412095633], [92.30250385466923, 21.05007545611744], [92.29856638263249, 21.04456299418689], [92.29700123761705, 21.04501514723131], [92.29147893260671, 21.046610480689196], [92.29120919534813, 21.046706012072832], [92.29123097962605, 21.046734500796617], [92.28947242461277, 21.047614085421742], [92.28770515337021, 21.048489952249554], [92.2888294372288, 21.050460924432173], [92.29032758904708, 21.053111722927724], [92.2924850428505, 21.055761915280243], [92.29516590208476, 21.058576024364072], [92.29611768698175, 21.059622987211128], [92.29902062929864, 21.0620262428169], [92.3025898208636, 21.06483400718372], [92.30485030819523, 21.066975521403265], [92.30639043856792, 21.06853482981859], [92.30822044921445, 21.06853617880165], [92.30940039840971, 21.06840259980021], [92.30959130559432, 21.0677153315973], [92.31804730164174, 21.064127939552804], [92.30943380732441, 21.0584228967993], [92.3082754283684, 21.05639573407592]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
