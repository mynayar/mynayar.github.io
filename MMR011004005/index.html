
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Dar Ngan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanbyuzayat</div><div class="name-mm">သံဖြူဇရပ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Dar Ngan</div><div class="name-mm">ပဒါငံ</div></div>
        <span class="pcode-badge">MMR011004005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.6508931725819, 16.049058612564977], [97.65190199967759, 16.0477720001777], [97.6515759999325, 16.046226999976113], [97.64995299973123, 16.044414000006157], [97.64924899964166, 16.043038000403442], [97.64853900017476, 16.04185099962399], [97.64745699974083, 16.04064299967473], [97.64594200002335, 16.03944133275138], [97.64444000000606, 16.04017699976879], [97.64394899984654, 16.041006000226787], [97.64119999988014, 16.04246299996754], [97.63976600030071, 16.043617000124527], [97.63779900042357, 16.043880999708392], [97.63665299973621, 16.044766000050913], [97.63561999976326, 16.04499099963499], [97.63411899979207, 16.045282999610777], [97.63215299996102, 16.045547000094018], [97.63085000012745, 16.04546900009433], [97.62999999960039, 16.045800000070017], [97.6286039999747, 16.045716999839726], [97.62730100014113, 16.045638999840037], [97.62332600029475, 16.045476000417125], [97.62487099959702, 16.048007000222924], [97.62596299959284, 16.049729999639794], [97.6275410004169, 16.051190000418217], [97.6288240002275, 16.052924000342387], [97.63018598119811, 16.054445618170803], [97.63022398834647, 16.054488078761892], [97.63829518427542, 16.051988307914144], [97.64532664520857, 16.048765539697968], [97.6508931725819, 16.049058612564977]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
