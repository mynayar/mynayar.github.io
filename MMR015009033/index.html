
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mone Paw Nam Chet (Zay)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mone Paw Nam Chet (Zay)</div><div class="name-mm">မုန်းပေါ်နမ့်ချက်</div></div>
        <span class="pcode-badge">MMR015009033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.16428145442563, 23.96362668582293], [98.16128005972706, 23.96242612866297], [98.16040220359889, 23.96207498657145], [98.15134848304609, 23.958453497630842], [98.13121940375254, 23.94576342594138], [98.1239021256826, 23.93635549840758], [98.12346210359328, 23.935789754693474], [98.12074030632016, 23.932290301056582], [98.11327826797776, 23.941825127427762], [98.10758961356987, 23.947076192412396], [98.10233855038388, 23.95101449002675], [98.07862647942852, 23.980912320147524], [98.08331466144256, 23.983217984022815], [98.08688385210814, 23.98500257980527], [98.09266594157998, 23.988357619408646], [98.09457911793203, 23.98996646518026], [98.09808071555261, 23.990163183783977], [98.13340734727132, 23.992147826560995], [98.13346742468195, 23.992270712623338], [98.13495765527165, 23.99088542841986], [98.16428145442563, 23.96362668582293]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
