
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Chaung</div><div class="name-mm">သပြေချောင်</div></div>
        <span class="pcode-badge">MMR017014053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01341271022847, 16.68078305359512], [95.01199272028788, 16.681574879676987], [95.00885855957495, 16.685698589618255], [95.00506488014014, 16.689657329722024], [95.00127119980607, 16.69526550020271], [95.00094143999553, 16.699389210143977], [95.00127119980607, 16.704337590307603], [95.00110631990083, 16.708131449606753], [95.00506488014014, 16.709945849821167], [95.00836391985905, 16.714234439667734], [95.01067332041748, 16.719182909763504], [95.01364223969767, 16.721327159720715], [95.02155971990521, 16.721657100294976], [95.02832268014765, 16.721162279815417], [95.0355951000339, 16.720126351649867], [95.03473591383141, 16.718980770046528], [95.03182482275741, 16.717861118595806], [95.03025731162569, 16.716741471641626], [95.03160089426592, 16.71315859059655], [95.0282419426116, 16.710471431611325], [95.02801801412011, 16.707560341436647], [95.02667443417783, 16.705544972422615], [95.02533085243692, 16.701066369317516], [95.02264369255244, 16.69725955978089], [95.01973260237776, 16.69031772977945], [95.01637365342145, 16.68516734119987], [95.01346256234746, 16.68091267018366], [95.01341271022847, 16.68078305359512]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
