
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Yae Win</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Yae Win</div><div class="name-mm">ငရေဝင်</div></div>
        <span class="pcode-badge">MMR005013028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06208491958341, 22.51614906043085], [95.0694069595636, 22.51614906043085], [95.0725494003346, 22.51614906043085], [95.07237300011394, 22.51403054996996], [95.07788099960851, 22.51021725002613], [95.0825415598452, 22.50809873956524], [95.09101559989006, 22.50809873956524], [95.09737140017006, 22.505980230003672], [95.10415055990046, 22.505132879778614], [95.10792947966183, 22.501668600425603], [95.10330311974326, 22.499201070273216], [95.0999133600136, 22.494116610093556], [95.0931342002832, 22.493692890014927], [95.08381272008103, 22.493692890014927], [95.0825415598452, 22.493692890014927], [95.07618612019337, 22.495387770329387], [95.07449123987885, 22.489879590071098], [95.07067811979942, 22.48649001020584], [95.06855952030566, 22.491998099632667], [95.06855952030566, 22.499624700419645], [95.06310012017445, 22.508203769588363], [95.06216447990687, 22.51592397001525], [95.06208491958341, 22.51614906043085]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
