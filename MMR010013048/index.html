
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Taw Gyi</div><div class="name-mm">ပေတောကြီး</div></div>
        <span class="pcode-badge">MMR010013048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08823426999561, 21.556515598316253], [96.08991601840955, 21.543566138766323], [96.07751779830778, 21.54842452197414], [96.07079080555127, 21.550891086254694], [96.06283987595958, 21.551974879037516], [96.06048542925919, 21.56055179343059], [96.05784441718617, 21.56152016362472], [96.05880368084524, 21.565597036873783], [96.06031725423793, 21.568119658595435], [96.05981273007347, 21.573669427102402], [96.05779463161701, 21.57770562221674], [96.05527200989542, 21.580396418959594], [96.05443113568845, 21.586450710731754], [96.05258121405183, 21.59183230511684], [96.0564492341449, 21.590150556702895], [96.07074409116694, 21.590318731724153], [96.08335720067436, 21.591495955074322], [96.09412038674651, 21.592168654260036], [96.09243863923189, 21.58846880918827], [96.08873879416007, 21.585105313259646], [96.07898465641682, 21.579387369731364], [96.08285267561052, 21.569465056966862], [96.08823426999561, 21.556515598316253]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
