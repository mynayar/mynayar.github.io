
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyar Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyar Taw</div><div class="name-mm">ကြာတော</div></div>
        <span class="pcode-badge">MMR007003001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.45969107708163, 17.072349705274746], [96.46387635640878, 17.070426838727656], [96.47025922987962, 17.069514999018054], [96.4784657818704, 17.068147240802546], [96.48985465326967, 17.06883112035996], [96.4894575890965, 17.056989645355884], [96.48988333175043, 17.051242104239748], [96.48667233386118, 17.05036637770621], [96.4784657818704, 17.04626310216048], [96.47345066661501, 17.0426157451206], [96.46801251836308, 17.042227306345183], [96.46706779314422, 17.04215982571543], [96.46159675758435, 17.04307166542509], [96.4588240775692, 17.04427717784955], [96.45737217158853, 17.04471299111168], [96.4574360936009, 17.047717983098494], [96.4579310210998, 17.05137283508833], [96.45827366369866, 17.05460890157957], [96.45861630629753, 17.057540398270817], [96.4591740631326, 17.061013255357523], [96.45964423319487, 17.064583602551238], [96.45998687579373, 17.067324742442963], [96.45987266189388, 17.069532881137604], [96.45969107708163, 17.072349705274746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
