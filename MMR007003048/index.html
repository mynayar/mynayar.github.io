
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Dat Sein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Dat Sein</div><div class="name-mm">ကဒတ်စိန်</div></div>
        <span class="pcode-badge">MMR007003048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71542994373698, 16.992863522833375], [96.70653951668538, 16.998334558393196], [96.70920364403298, 17.0009938473882], [96.71611382599235, 17.00072813459576], [96.72192679818323, 17.00209589371059], [96.72979140904636, 17.00209589371059], [96.72910753128758, 17.009618567043276], [96.72739783464243, 17.017825119034057], [96.73180728707672, 17.02102823166763], [96.74018639198846, 17.020902575693356], [96.74668324373675, 17.019876756806923], [96.75245896870649, 17.020216506286772], [96.75288297926613, 17.0119483282528], [96.7529723790721, 17.004617535171178], [96.75565437594872, 17.003991735630166], [96.75593657871019, 17.003286229176183], [96.75454785370056, 17.00209589371059], [96.75147039704126, 16.995599040163597], [96.74697174804777, 16.990982858771986], [96.74496108968259, 16.99081188506051], [96.73970765408501, 16.99081188506051], [96.73047528590575, 16.991837703946942], [96.72295261527103, 16.991495763718547], [96.71542994373698, 16.992863522833375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
