
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sein Tone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sein Tone</div><div class="name-mm">စိန်တုံး</div></div>
        <span class="pcode-badge">MMR008008037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50981138578686, 17.645999319013413], [95.50797168044875, 17.64613664908711], [95.50352840900894, 17.649098860324216], [95.49571563776652, 17.65613044266587], [95.4771259199253, 17.672823460634277], [95.4857979268329, 17.678857291930512], [95.49394740784663, 17.68462984229342], [95.49564521725301, 17.687346335365135], [95.48987266778943, 17.690741952379256], [95.49224960023889, 17.69447713091489], [95.49326828480355, 17.699910118856963], [95.49326828480355, 17.702287051306428], [95.49564521725301, 17.70262661282794], [95.49530565483218, 17.706701352885204], [95.49598477877458, 17.709417846856184], [95.49904083426713, 17.71077609384173], [95.50413425978832, 17.71009696989927], [95.51160461775896, 17.705003545277464], [95.51635848175857, 17.704324421335002], [95.5248475251932, 17.704663982856573], [95.5289222652504, 17.698212310349902], [95.53062007375746, 17.69277932330715], [95.52518708581539, 17.693798007871806], [95.52179146880133, 17.69142107632166], [95.5183958517872, 17.68462984229342], [95.51737716722255, 17.678517731308318], [95.51907497483029, 17.66934956393129], [95.5248475251932, 17.663237452946134], [95.52043322181578, 17.65610665739638], [95.51432111083068, 17.651692354918282], [95.50981138578686, 17.645999319013413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
