
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga/Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Munaung</div><div class="name-mm">မာန်အောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga/Inn</div><div class="name-mm">င/အင်း</div></div>
        <span class="pcode-badge">MMR012012010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.71300389811148, 18.877078372069263], [93.71145811819764, 18.874206826883608], [93.71116469459503, 18.86970573083488], [93.71076741638319, 18.866974445714163], [93.70959557997207, 18.858917497744358], [93.70874054683884, 18.85682637883434], [93.69740466259515, 18.857353076683182], [93.69723071842299, 18.856225969852687], [93.69705677694878, 18.855098863921455], [93.69253207459565, 18.854742852900415], [93.68497072232105, 18.855733029855514], [93.6828103367277, 18.857443336241033], [93.68248215882466, 18.857990300312167], [93.68285672555749, 18.858696602666157], [93.6838905304237, 18.865364751881827], [93.68410613389102, 18.868191554896384], [93.68307811616216, 18.8736263405832], [93.68495314776959, 18.87336340040065], [93.6863438000264, 18.871716972860042], [93.6891584037374, 18.871090194856663], [93.69129234476594, 18.87170062498393], [93.69257765943149, 18.871392962415314], [93.6934242362396, 18.871617472768207], [93.6980290232209, 18.870690325698035], [93.70104836838755, 18.871734831597223], [93.70354955296955, 18.87186830897531], [93.71300389811148, 18.877078372069263]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
