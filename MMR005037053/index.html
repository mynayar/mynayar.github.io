
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ke San Laung Kyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ke San Laung Kyan</div><div class="name-mm">ကဲဆန်လောင်ကျန်</div></div>
        <span class="pcode-badge">MMR005037053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5733032803222, 26.680114709626196], [95.58447263980054, 26.68048091985861], [95.59649664030775, 26.677124009665363], [95.59667952014382, 26.6760863997676], [95.5980835201384, 26.664123509992066], [95.59967039996906, 26.643493619834715], [95.60008036042035, 26.63940953582147], [95.60131847956421, 26.627075190068012], [95.60247804022941, 26.615478509625575], [95.59448244041238, 26.616088890290087], [95.57489016015285, 26.616088890290087], [95.5524902396329, 26.616088890290087], [95.53387464020255, 26.616088890290087], [95.53430159963915, 26.619873029716587], [95.5321045199077, 26.640930150006454], [95.5155027597446, 26.6646728698571], [95.51391587991401, 26.665710479754864], [95.52648924028625, 26.67169187967653], [95.54492195988058, 26.674926750069517], [95.55950916041945, 26.678710980327537], [95.57049564006178, 26.67987063002562], [95.5733032803222, 26.680114709626196]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
