
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Hla Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Hla Pyin</div><div class="name-mm">အောင်လှပြင်</div></div>
        <span class="pcode-badge">MMR012013032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.79455229525229, 18.97998128900531], [93.78847252029061, 18.979837181640676], [93.778623069699, 18.976476949351763], [93.77337498866484, 18.97265729929495], [93.77141845779568, 18.973827539409456], [93.77048485359319, 18.973346299592095], [93.76940326504871, 18.973286718607255], [93.76652980880368, 18.97444620912529], [93.76162540279017, 18.975271715717156], [93.75648992856742, 18.974426854815533], [93.75310420769307, 18.973395791982284], [93.7491404943384, 18.97085950596147], [93.74626439858321, 18.969812524228644], [93.73572662308527, 18.96924122720094], [93.73423185541583, 18.96930809089571], [93.7326019511192, 18.96975891294352], [93.73829107677182, 18.974929759301006], [93.74283405874485, 18.98140771359516], [93.74521639162322, 18.98273786575993], [93.75243728395355, 18.986337228680213], [93.75435576990293, 18.98729345173149], [93.76885984520572, 18.99182636039825], [93.770009947701, 18.992434288611605], [93.7790771526885, 18.997226678668312], [93.78154956166298, 18.990582538653314], [93.78814293584787, 18.985791916663686], [93.79455229525229, 18.97998128900531]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
