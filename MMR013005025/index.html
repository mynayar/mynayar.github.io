
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Lon Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Lon Ywar Ma</div><div class="name-mm">ဖလုံရွာမ</div></div>
        <span class="pcode-badge">MMR013005025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89544167199563, 17.41659022765691], [95.88835842090447, 17.414229143959858], [95.88234839106548, 17.412726636724926], [95.87852527142422, 17.412568358742817], [95.8768268333917, 17.418984679799166], [95.87588325570772, 17.422570271400957], [95.87456224874882, 17.429552738168354], [95.8708052787407, 17.429552738168354], [95.86862851379493, 17.432903167846973], [95.8658381432158, 17.439771774148085], [95.86775260200102, 17.44449394064287], [95.87311870106726, 17.448786820255577], [95.87719693588991, 17.450503972280558], [95.88170445939335, 17.45071861527191], [95.885782694216, 17.44921610803698], [95.88710510411732, 17.449121650443885], [95.88878770868587, 17.449001464146306], [95.89222201183645, 17.4442792967522], [95.89308058829857, 17.43741069135035], [95.89243665572712, 17.43032744025919], [95.8941538077521, 17.419165955244694], [95.89544167199563, 17.41659022765691]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
