
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (East)</div><div class="name-mm">ရှမ်းပြည်နယ် (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tachileik</div><div class="name-mm">တာချီလိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR016009703</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[100.08860545717619, 20.71170048029296], [100.08800416595955, 20.71262974886389], [100.08904589295366, 20.713554349953313], [100.09021182891286, 20.71495823213678], [100.09078289931142, 20.71657626628172], [100.09149673798413, 20.719122289262316], [100.09342410114141, 20.72050237628366], [100.09811163924081, 20.721834874779688], [100.10051489484658, 20.722691480827223], [100.10327506978871, 20.723143578113707], [100.10568863432309, 20.723505253964333], [100.10706150158711, 20.722246792155772], [100.11321027883139, 20.71790647870108], [100.11201448897754, 20.714660763383563], [100.11149521503222, 20.714784398581173], [100.11036007725585, 20.714914660882926], [100.10941102809653, 20.71487744333939], [100.10836893417905, 20.71450526700454], [100.10769901659637, 20.714114481897866], [100.10740127534865, 20.71379813187832], [100.10706631655734, 20.713407346771703], [100.10686162006778, 20.71286769059151], [100.1066569226789, 20.712309427438186], [100.10628474724336, 20.71184420634512], [100.1057264822914, 20.71141620369491], [100.10513099979585, 20.710950982601844], [100.10416334186482, 20.71035550100561], [100.10332594533617, 20.709815844825414], [100.10258159176709, 20.70949949480587], [100.10187445664093, 20.709369234302756], [100.10101845223983, 20.709369234302756], [100.09999496709412, 20.709592539564085], [100.09919478810906, 20.7099274983554], [100.09833878190932, 20.710206629932088], [100.0973339064347, 20.71056019839449], [100.09660816163739, 20.710690459796922], [100.09604989758475, 20.710746286112283], [100.09545441598857, 20.710653242253386], [100.0949891948955, 20.710578807166257], [100.09402153696442, 20.71011358607319], [100.09307248690578, 20.709573930792317], [100.0924770053096, 20.709015665840354], [100.09212822933438, 20.70859215170651], [100.08860545717619, 20.71170048029296]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
