
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Yat Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Min Yat Ward</div><div class="name-mm">မင်းရပ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39901247844318, 25.38272156894533], [97.39893359890652, 25.38411122385395], [97.40285554954403, 25.384332990375242], [97.40287482651212, 25.38408842514076], [97.40281572036923, 25.383847223370708], [97.4028530764084, 25.38347968933624], [97.40282647716026, 25.383400201857853], [97.40288742961127, 25.38312648150196], [97.40292484410634, 25.38276042145634], [97.40300395566805, 25.382347428491073], [97.40305056663038, 25.382120676128352], [97.40310434788739, 25.381889064728625], [97.40314737235343, 25.381785406171616], [97.4032316307352, 25.381385348155334], [97.40319219096688, 25.38131408227912], [97.40321191040141, 25.38105007550064], [97.40326569165842, 25.38100148513047], [97.40331768056654, 25.38093831764928], [97.40332664410937, 25.380836277871992], [97.40331050937255, 25.38072937905764], [97.40325314251857, 25.38068078868747], [97.40320115450976, 25.380612762169278], [97.40322490740363, 25.38054716471993], [97.40330642285318, 25.380452511074566], [97.4033607059319, 25.38043216751055], [97.40335680107557, 25.380363756981865], [97.39921065664657, 25.38014637375619], [97.39901247844318, 25.38272156894533]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
