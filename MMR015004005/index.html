
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kat</div><div class="name-mm">မန်ကပ်</div></div>
        <span class="pcode-badge">MMR015004005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.24966718319399, 22.591538331828588], [98.24758409612917, 22.588651363269832], [98.23630640701515, 22.572808895314324], [98.2252440470752, 22.560607763437588], [98.21727720757713, 22.564772247741075], [98.19773053463655, 22.568185158718165], [98.18563021406317, 22.574390451158422], [98.18252756739338, 22.585249713603446], [98.17756333308142, 22.595798711741224], [98.17415042210433, 22.605106650851326], [98.17446068731095, 22.612863266626505], [98.17368471178008, 22.61490020228257], [98.17723279805523, 22.614697454623865], [98.18582532288042, 22.615771520339422], [98.19629746315746, 22.621141848017942], [98.2196583902226, 22.620873332038684], [98.23899157130404, 22.618456683728994], [98.25268590782844, 22.611475258376515], [98.25638683118734, 22.609045414314494], [98.25214887497066, 22.597512404973543], [98.24966718319399, 22.591538331828588]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
