
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyon Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kangyidaunt</div><div class="name-mm">ကန်ကြီးထောင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyon Gyi</div><div class="name-mm">ကျုံကြီး</div></div>
        <span class="pcode-badge">MMR017002027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.8655598401146, 16.777048230091793], [94.86007091973721, 16.777962989900118], [94.85757612034172, 16.7782956302392], [94.85333460011174, 16.78045788012713], [94.85042400006762, 16.78578030002086], [94.84609968015616, 16.789106789746597], [94.84244028029474, 16.792599690023735], [94.83986231969038, 16.79559354030971], [94.83811596038333, 16.797256830138622], [94.83911387960194, 16.797922109917465], [94.84268976032422, 16.79900319034499], [94.84510176003823, 16.79892003003539], [94.84734708030356, 16.798337909666827], [94.85025768034774, 16.80066648017396], [94.85217036027399, 16.803909809590095], [94.85366760017968, 16.805406779699183], [94.85749296003212, 16.805822580347865], [94.865476679805, 16.806321540406827], [94.86772200007033, 16.807735350206315], [94.87054943980485, 16.804076130209296], [94.8737098796073, 16.797339990448222], [94.87188000026185, 16.79376392986154], [94.86921888024716, 16.78952268032748], [94.86780516037993, 16.78569713971126], [94.86573587970713, 16.77772620020403], [94.8655598401146, 16.777048230091793]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
