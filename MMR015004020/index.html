
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Pong</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Pong</div><div class="name-mm">လုန်ပုန်း</div></div>
        <span class="pcode-badge">MMR015004020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.42328107755975, 22.471021787925224], [98.42561047184586, 22.470504145350105], [98.42373085819258, 22.465670849630044], [98.42238827559851, 22.45466167739454], [98.41648091506227, 22.441772889707124], [98.41299020103702, 22.438819209439032], [98.4025180616593, 22.43613404515014], [98.39365701995558, 22.43613404515014], [98.39112938631217, 22.435296273604195], [98.38372191343564, 22.43667107800792], [98.3731833267492, 22.437800212809634], [98.36734241262229, 22.44526360283305], [98.35069439493043, 22.46405975105671], [98.33861115697937, 22.473189308739677], [98.33601388343402, 22.474197206835697], [98.3429074198416, 22.480707768748573], [98.3539165920771, 22.48742067902117], [98.36224060092303, 22.49010584331006], [98.37432383887415, 22.488763260715984], [98.37463326681188, 22.48869452463265], [98.37562225216527, 22.48158317962009], [98.38773355705808, 22.47698005278727], [98.40149836265937, 22.4754818676941], [98.41385573465448, 22.474149746014007], [98.41836052871548, 22.47211524392344], [98.42328107755975, 22.471021787925224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
