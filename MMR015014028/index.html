
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Hkaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Hkaw</div><div class="name-mm">မခေါ်</div></div>
        <span class="pcode-badge">MMR015014028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.78587896014596, 22.539867199111995], [97.78590778701482, 22.539535691918672], [97.78786706621219, 22.53154786404275], [97.78977830902181, 22.523755877931478], [97.79632841862167, 22.51899215916086], [97.794839757349, 22.5145261717455], [97.79543522185804, 22.50708286358332], [97.7912669711938, 22.501425948049132], [97.78888511135887, 22.49428037214153], [97.79152160164068, 22.486107255145782], [97.77619709282163, 22.475109666178184], [97.77787792032984, 22.47287625473541], [97.74683937663599, 22.47230797313449], [97.72315075190573, 22.478512136026325], [97.70062939413128, 22.47906143833478], [97.68423372710487, 22.48697235888733], [97.6735174442747, 22.49938068557026], [97.66223714712669, 22.520813251230607], [97.65964267766748, 22.52600218835039], [97.66505722141369, 22.539989756921784], [97.67690153287953, 22.55352611313964], [97.69212993474872, 22.56367838075272], [97.7022822023618, 22.574958677900725], [97.70453826233103, 22.58905905023505], [97.7079223509358, 22.597519273096054], [97.71035889584641, 22.597798204123876], [97.72033067761873, 22.589623064552825], [97.72597082709206, 22.580598827374047], [97.75135149567507, 22.56424239596987], [97.76545186800934, 22.560294292147887], [97.78587896014596, 22.539867199111995]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
