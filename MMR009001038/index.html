
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpoke Kone</div><div class="name-mm">ဖုတ်ကုန်း</div></div>
        <span class="pcode-badge">MMR009001038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06829581030348, 20.095340695616642], [95.06816650128309, 20.095125181182198], [95.0639665297316, 20.09442518487441], [95.05626658203721, 20.088825224304685], [95.05136661597663, 20.084975250007858], [95.03946669673076, 20.088125227996898], [95.03936169818388, 20.088125227996898], [95.03981669488462, 20.08847522615082], [95.038416704967, 20.097575163762826], [95.03386673616103, 20.103525123385793], [95.03176674993563, 20.10667510137489], [95.03131381178304, 20.111204482001312], [95.03316674075256, 20.110175076618532], [95.03771670865922, 20.1126250609978], [95.04506665909912, 20.124174982089812], [95.04891663339595, 20.13607490043637], [95.05836656826256, 20.139924873833934], [95.06606651505768, 20.139924873833934], [95.07096648201758, 20.138235230271732], [95.07096648201758, 20.135374905027902], [95.07306646734366, 20.12732496007891], [95.07232647278857, 20.125844970069352], [95.0720164746806, 20.125574972007428], [95.0720164746806, 20.125224973853506], [95.07166647742605, 20.117175028904512], [95.0723664719352, 20.110175076618532], [95.07271647008906, 20.10422511789494], [95.07026648660911, 20.098625157325216], [95.06829581030348, 20.095340695616642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
