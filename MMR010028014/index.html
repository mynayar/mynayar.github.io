
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Wai</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Wai</div><div class="name-mm">ရေဝေ</div></div>
        <span class="pcode-badge">MMR010028014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60767855881852, 20.786274910159023], [95.60078490100244, 20.786274910159023], [95.59438364718761, 20.785782505258453], [95.5884747955754, 20.785782505258453], [95.58158113775937, 20.785782505258453], [95.57764190485011, 20.785782505258453], [95.57616469194704, 20.792183759972602], [95.57419507504272, 20.796615396883112], [95.57419507504272, 20.799756572308013], [95.57419507504272, 20.801539438694192], [95.57665709594829, 20.80744828940709], [95.58270317421216, 20.809607603008544], [95.58896720137528, 20.80843309830891], [95.59635326319261, 20.81187992721692], [95.60817096371903, 20.81187992721692], [95.6130950046308, 20.814341948122433], [95.61604943043693, 20.82369762684408], [95.6165418353375, 20.83157609356192], [95.62540511005784, 20.83206849756317], [95.63328357677568, 20.829114072656353], [95.64165444839415, 20.83157609356192], [95.64402747958457, 20.82967766789011], [95.64657848930591, 20.82763686065266], [95.65938099783483, 20.8177887770305], [95.66922908235631, 20.810402714313852], [95.66479744364716, 20.799569821789873], [95.65101012711574, 20.78873693106459], [95.64916361121175, 20.78824452706334], [95.6362380016825, 20.784797697255954], [95.62392789715477, 20.784305293254704], [95.60767855881852, 20.786274910159023]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
