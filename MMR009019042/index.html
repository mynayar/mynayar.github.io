
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thar Si</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thar Si</div><div class="name-mm">သာစည်</div></div>
        <span class="pcode-badge">MMR009019042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22098364168176, 21.648834528091072], [95.22018921565984, 21.648834528091072], [95.21227493973674, 21.654770235258184], [95.21227493973674, 21.662684511181283], [95.20980172856696, 21.67109342861886], [95.19663582558292, 21.672556308127184], [95.19199460796483, 21.673071998274168], [95.19298389279248, 21.67851306302748], [95.20485530712676, 21.679996990268933], [95.20930708705248, 21.68642733895058], [95.21143166973582, 21.693104599197966], [95.21573743573413, 21.6938469733592], [95.2295874188244, 21.697309467557943], [95.24382328661545, 21.700156642015486], [95.24382328661545, 21.695483242157934], [95.24382328661545, 21.692994567145604], [95.24353950734246, 21.680792013440737], [95.24305026715615, 21.67541038128411], [95.23700705323296, 21.670104144690583], [95.23468767829377, 21.6657967347316], [95.23354455723558, 21.663673796008936], [95.22711420765461, 21.6587273727701], [95.2276088500684, 21.648834528091072], [95.22098364168176, 21.648834528091072]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
