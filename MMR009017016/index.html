
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zaung Chan Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sinbaungwe</div><div class="name-mm">ဆင်ပေါင်ဝဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zaung Chan Taung</div><div class="name-mm">ဇောင်ချမ်းတောင်</div></div>
        <span class="pcode-badge">MMR009017016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.10327922025988, 19.734381669378593], [95.11368331423364, 19.729761224301114], [95.11722934196064, 19.728186437654017], [95.12323930255184, 19.72498632875613], [95.1369451620896, 19.717688404096634], [95.15128394020172, 19.710519015040575], [95.15545771360269, 19.708375725559335], [95.15545771360269, 19.70572489288952], [95.15545771360269, 19.704966651090103], [95.14838078834276, 19.70408203475813], [95.134669243291, 19.70010126396221], [95.13201539609372, 19.694351262300984], [95.12891924073045, 19.683735872612488], [95.1174192356093, 19.67444740742195], [95.09441922626633, 19.66029355510352], [95.0829192220445, 19.654985860708962], [95.08284258541704, 19.654969895044644], [95.08175904174647, 19.66544414962783], [95.073369820361, 19.688788072311752], [95.07191082502459, 19.692070810919233], [95.07044432844305, 19.69184764775082], [95.06680434224666, 19.701554278806952], [95.0649805980762, 19.711767245262195], [95.07154607619054, 19.719062221044737], [95.08504178125327, 19.727816191264253], [95.10327922025988, 19.734381669378593]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
