
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Kone</div><div class="name-mm">ကျွန်းကုန်း</div></div>
        <span class="pcode-badge">MMR008014032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68935728211295, 18.268092083882607], [95.69192733497857, 18.261666951268808], [95.69192733497857, 18.258133129140674], [95.68646597342598, 18.254278049392497], [95.68429295325723, 18.250173457239327], [95.68357466294043, 18.248816686940586], [95.67875581392974, 18.244319093751244], [95.67554324762284, 18.247210404236796], [95.66943937172971, 18.248816686940586], [95.66526303616024, 18.246889146616866], [95.66269298329462, 18.242391555226163], [95.66140795731144, 18.235645165891754], [95.66145274444864, 18.234704639607457], [95.65983049428195, 18.234704639607457], [95.65753134509555, 18.23853655731631], [95.65653504555598, 18.24029923841914], [95.6544774560698, 18.240502344008007], [95.65618041409488, 18.246178871957397], [95.65826180773632, 18.248638701215157], [95.6597755493022, 18.252423052881625], [95.65763137938472, 18.254745903700552], [95.66172921403205, 18.255563076274996], [95.66654806304274, 18.254599306113164], [95.66911811590836, 18.257169358978786], [95.67233068221526, 18.260060667665755], [95.67747078794656, 18.261345695447517], [95.68068335425346, 18.262630721430696], [95.68261089367786, 18.266807057000108], [95.68518094564416, 18.268413339703898], [95.68935728211295, 18.268092083882607]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
