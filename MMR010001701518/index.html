
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Ri Mar Lar (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aungmyaythazan</div><div class="name-mm">အောင်မြေသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thi Ri Mar Lar (West) Ward</div><div class="name-mm">သီရိမာလာ (အနောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010001701518</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06019403894618, 21.984378386971002], [96.05954048992578, 21.984412176093088], [96.05970820977109, 21.984759136760943], [96.05993663802747, 21.98570140331924], [96.06032211071039, 21.98701486579455], [96.06062192279717, 21.987957132352847], [96.06083607428769, 21.98908499686962], [96.06079324398962, 21.99012720079031], [96.06166965858085, 21.990131662044973], [96.0686682175139, 21.989501608902344], [96.0717327315275, 21.989285865946556], [96.07129500195208, 21.987309765664577], [96.07119870634807, 21.9867489818825], [96.07116659657169, 21.986422623044405], [96.0710280859268, 21.983861407134157], [96.06898963542665, 21.983912854382197], [96.06897606830535, 21.98391343029766], [96.0657835767505, 21.984048949511305], [96.0619575098682, 21.98416266578397], [96.06165519320581, 21.98428374849334], [96.06073176026894, 21.98434355893903], [96.06019403894618, 21.984378386971002]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
