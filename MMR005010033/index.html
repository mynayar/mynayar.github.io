
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Kan</div><div class="name-mm">သရက်ကန်</div></div>
        <span class="pcode-badge">MMR005010033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41840139990472, 22.55144651994101], [95.41888415957635, 22.550109839597496], [95.4281005198232, 22.550109839597496], [95.43748788975438, 22.550109839597496], [95.44450680964161, 22.546081529738842], [95.45146489039246, 22.538330100353903], [95.45146489039246, 22.531310999702896], [95.45006089039782, 22.520507849557646], [95.4453002500066, 22.512695310340348], [95.43234889018919, 22.510356840096165], [95.4323121600782, 22.510498049845182], [95.42889396018819, 22.51190186997536], [95.42791368027218, 22.512682979735757], [95.42108159993597, 22.51812744032918], [95.41412352008444, 22.51971432015978], [95.40469367966966, 22.51528181990011], [95.4008787600468, 22.513488749806015], [95.3985895195907, 22.516279290357033], [95.39447004006036, 22.521301289922633], [95.39275715981512, 22.5297241198723], [95.3928831602297, 22.5297241198723], [95.39787852007771, 22.540110300250205], [95.40472428000157, 22.547729520301175], [95.41333007971946, 22.548522959766842], [95.41840139990472, 22.55144651994101]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
