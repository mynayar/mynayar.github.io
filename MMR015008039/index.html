
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mut Layt (Hpan Mut)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mut Layt (Hpan Mut)</div><div class="name-mm">မွတ်လေ့ (ဖန်မွတ်)</div></div>
        <span class="pcode-badge">MMR015008039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.95222022038695, 22.877317956058903], [98.97772915927334, 22.86178095182953], [98.9957008468167, 22.84815725435385], [98.9957008468167, 22.846418058146924], [98.99309205385526, 22.846418058146924], [98.98642513671075, 22.841200471324726], [98.97367103598958, 22.820619989920658], [98.9554094825616, 22.792792861401495], [98.95438266093112, 22.787966801626624], [98.95292976119958, 22.78890311458713], [98.9490846117655, 22.791164967089628], [98.94410853518082, 22.79795052459707], [98.93981101596569, 22.794105376062305], [98.93871201025115, 22.79418780162581], [98.93569859881137, 22.803228034146514], [98.92874181668157, 22.81308347602163], [98.92700160424073, 22.81440363671851], [98.92816208491234, 22.820040258151437], [98.92758235314312, 22.838301811579413], [98.931350609643, 22.85830256121426], [98.93801752678752, 22.863810013921068], [98.94352497859495, 22.873375589911575], [98.95222022038695, 22.877317956058903]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
