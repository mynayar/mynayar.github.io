
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpet Tha Let</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpet Tha Let</div><div class="name-mm">ဖက်သလက်</div></div>
        <span class="pcode-badge">MMR017006029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99859748028956, 17.29673711992217], [95.00224608019249, 17.295928290358347], [95.00651388041132, 17.294758109599115], [95.00908644058683, 17.294275715951585], [95.00981795993096, 17.294138549554475], [95.01088065012198, 17.29352109842], [95.01491196011892, 17.29117862979001], [95.01752772012821, 17.289251190190328], [95.01979932038239, 17.286841890241078], [95.02147007998025, 17.28356715020385], [95.02028099996824, 17.28154142999307], [95.01829056016129, 17.280066870090025], [95.01706084338326, 17.279291336126334], [95.01394313486782, 17.282159627564795], [95.01019382438557, 17.283945012952017], [95.0087936770866, 17.287444884773663], [95.00828163458982, 17.28767239256689], [95.00019566010167, 17.291265097806047], [94.99952393937838, 17.290969541011577], [94.99947417539295, 17.291018347218994], [94.99856796004337, 17.291907270404238], [94.99681404013592, 17.292951269985167], [94.99852871992454, 17.294964569659214], [94.99859748028956, 17.29673711992217]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
