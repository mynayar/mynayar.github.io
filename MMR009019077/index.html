
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Kan</div><div class="name-mm">မင်းကန်</div></div>
        <span class="pcode-badge">MMR009019077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1142057636851, 21.52876348584624], [95.11433577597535, 21.526163251732726], [95.12027148314252, 21.526657894146524], [95.13115361174982, 21.530120390143964], [95.14055181491437, 21.525173966905072], [95.15143394442106, 21.52913110531631], [95.15835893641582, 21.52913110531631], [95.16847221931755, 21.532502199616886], [95.17517677219035, 21.527647178074858], [95.17979615876578, 21.508245756436565], [95.18012319542919, 21.506872203889145], [95.16924106502319, 21.50192578244895], [95.16429464268367, 21.49599007528178], [95.12719647423796, 21.499452570379844], [95.12223459435108, 21.499452570379844], [95.1212607670708, 21.502915066377284], [95.11483041838915, 21.508356131130597], [95.10691614156673, 21.50934541505893], [95.10609173934233, 21.50934541505893], [95.10592685763845, 21.512807911056314], [95.10691614156673, 21.52171147090769], [95.11186256480556, 21.52715253566106], [95.1142057636851, 21.52876348584624]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
