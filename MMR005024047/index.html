
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Boet Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Boet Hla</div><div class="name-mm">တောင်ဘို့လှ</div></div>
        <span class="pcode-badge">MMR005024047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.81732171982156, 23.61151124994427], [95.80871592010368, 23.61151124994427], [95.79009996004515, 23.615478539902767], [95.77111824031459, 23.615478539902767], [95.75870723994723, 23.611857120210004], [95.75785964330794, 23.611711549648362], [95.75769567531523, 23.613176047936292], [95.75362862356218, 23.62324083489665], [95.74682373512735, 23.629376979364167], [95.74436546889132, 23.63026680726739], [95.74289483003241, 23.630712152443948], [95.73881087372291, 23.635588960961854], [95.73629541330274, 23.63919339875639], [95.73766811958808, 23.63995205963988], [95.73772967998082, 23.6399926496411], [95.74969499972451, 23.64788817020292], [95.76208511963262, 23.658691410280426], [95.77148435971549, 23.670898469588735], [95.7783203997667, 23.68829349025242], [95.78210436022812, 23.696105940436837], [95.79168683987581, 23.686706519590246], [95.80627440014354, 23.677124039942555], [95.81787107968665, 23.674499550214136], [95.8187257198162, 23.67431639968214], [95.81927507968123, 23.663085930371437], [95.8187257198162, 23.65008542979882], [95.81768784012178, 23.637329099658245], [95.81372064009554, 23.623901369852376], [95.81732171982156, 23.61151124994427]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
