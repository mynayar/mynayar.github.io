
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Taung</div><div class="name-mm">ဆားတောင်</div></div>
        <span class="pcode-badge">MMR010024022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.98597179806006, 20.69840338510818], [95.98829373246986, 20.700530861809852], [95.99074933581323, 20.70584181894486], [95.99157409326983, 20.71334283930065], [95.9906403766521, 20.722679998283354], [95.99219656981592, 20.726414862056288], [95.99686515020659, 20.727348577774706], [96.00215620714329, 20.727037338602372], [96.00620230918929, 20.72205752083795], [96.00744726318072, 20.716455225628238], [96.00838097889914, 20.712720361855247], [96.01266807317307, 20.712720361855247], [96.00967886968414, 20.700520300171775], [96.01156039079945, 20.692784832853818], [96.01080051223391, 20.69043936138746], [96.0048546787005, 20.688079703115875], [96.00171885783908, 20.68636925643608], [95.9954267745261, 20.691567063569153], [95.99497599564575, 20.689565735670215], [95.99453549241912, 20.687992509346884], [95.9944096340974, 20.68726882489642], [95.99422084661484, 20.686670998767624], [95.99387473712949, 20.686230494641677], [95.9918924712606, 20.684783125740694], [95.98852576565162, 20.688967909541418], [95.98559956326926, 20.692932441279197], [95.98380608488299, 20.69522935205299], [95.98342851081719, 20.695827178181787], [95.98597179806006, 20.69840338510818]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
