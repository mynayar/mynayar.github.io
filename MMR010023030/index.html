
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htee Hlaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htee Hlaing</div><div class="name-mm">ထီးလှိုင်</div></div>
        <span class="pcode-badge">MMR010023030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14598415784269, 20.344240981636062], [96.14719718859942, 20.35232785634554], [96.1415363772021, 20.36081907434084], [96.13991900226023, 20.368097260680088], [96.14921890772649, 20.372140698934174], [96.15407103255217, 20.37699282286053], [96.16054053231977, 20.36647988573816], [96.17145781272791, 20.364458168409783], [96.18641853139019, 20.364862511695605], [96.19329237444356, 20.370927667278067], [96.19450540520035, 20.38265363605649], [96.19854884255511, 20.375375447918657], [96.20259227990982, 20.366075543351712], [96.21027481133353, 20.35677563698613], [96.21868651397148, 20.35218743530197], [96.20987046714839, 20.349901793932702], [96.20178359243891, 20.34504966910697], [96.18924893708885, 20.3381758260536], [96.1803533749084, 20.33211066957182], [96.17186215691305, 20.32806723311637], [96.16337093801843, 20.328471576402194], [96.15609275077986, 20.332919357042726], [96.14598415784269, 20.344240981636062]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
