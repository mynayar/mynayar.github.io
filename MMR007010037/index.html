
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo</div><div class="name-mm">အုတ်ဖို</div></div>
        <span class="pcode-badge">MMR007010037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.98795873230972, 19.43200720167107], [95.96650456043716, 19.436395555110835], [95.95078759287316, 19.438316166158188], [95.95033567275317, 19.44554688358187], [95.94717223371168, 19.45368144124558], [95.95033567275317, 19.4631717592693], [95.95485487215467, 19.46678711663219], [95.95575139820852, 19.4761751736454], [95.95826148967609, 19.475767135944636], [95.96094322215203, 19.47681617712493], [95.96344566308693, 19.477136611865205], [95.9652690888974, 19.47686576844052], [95.96624964940185, 19.477010917220127], [95.96758819673795, 19.477209182657703], [95.97305461877568, 19.476217737658544], [95.97788628492418, 19.47290632416758], [95.98029108286727, 19.471258179821177], [95.99496646373137, 19.46745862601483], [95.99372673390172, 19.464609141198935], [95.9918611838466, 19.46331585044618], [95.99236421963309, 19.455489120826314], [95.9914603811917, 19.448710322623356], [95.9914603811917, 19.442835364660425], [95.99055654095167, 19.438316166158188], [95.98795873230972, 19.43200720167107]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
