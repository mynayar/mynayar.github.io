
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mant Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mant Yang</div><div class="name-mm">မန့်ယန်</div></div>
        <span class="pcode-badge">MMR015009053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.44932469218088, 24.053719836701134], [98.44146977960668, 24.055598185008307], [98.42396623235578, 24.055598185008307], [98.42208402775572, 24.05599865401473], [98.40339956543767, 24.05997407204586], [98.3979161947766, 24.058727851808953], [98.39814849955366, 24.06259960408852], [98.3986456924448, 24.06437529298546], [98.40360251994042, 24.082078246014305], [98.40427474158611, 24.08447903837697], [98.41215133771414, 24.10023223063297], [98.41783999032333, 24.11160953675079], [98.4218316042452, 24.12336262008887], [98.42451273687334, 24.12377061911883], [98.44142940184548, 24.127529877002246], [98.4469558293481, 24.127529877002246], [98.46360902623564, 24.127529877002246], [98.46456298929058, 24.12740435592633], [98.46159885890029, 24.11554783436509], [98.45634779481492, 24.101982585627866], [98.45624593490203, 24.098315628763316], [98.45591020629104, 24.086229393371866], [98.45591020629104, 24.071351378163627], [98.45197190777736, 24.058661305574844], [98.44932469218088, 24.053719836701134]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
