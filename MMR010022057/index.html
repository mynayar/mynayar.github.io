
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Ni Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Ni Pauk</div><div class="name-mm">ကန်နီပေါက်</div></div>
        <span class="pcode-badge">MMR010022057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89914751664463, 21.07317321637089], [94.90492058501707, 21.07057533488387], [94.91011634619247, 21.06595688000607], [94.91444614657246, 21.061915733224566], [94.91906460234958, 21.0584518918414], [94.92252844283342, 21.053256129766623], [94.92512632432044, 21.048060368591166], [94.9271468968119, 21.042864608315085], [94.9271468968119, 21.03478231205412], [94.92166248293728, 21.036514232745674], [94.91531210826724, 21.039978074128896], [94.91011634619247, 21.043153261014254], [94.90636385211013, 21.045751141601954], [94.90059078373775, 21.04950363568429], [94.89395175456985, 21.052678824368286], [94.88760137989982, 21.055854011253643], [94.89019926138684, 21.059895158934467], [94.89395175456985, 21.06307034581988], [94.89539502166298, 21.066534187203047], [94.89712694325391, 21.069420721389235], [94.89770424955151, 21.071729948378447], [94.89914751664463, 21.07317321637089]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
