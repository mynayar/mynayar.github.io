
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Pin Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Pin Hla</div><div class="name-mm">ရှားပင်လှ</div></div>
        <span class="pcode-badge">MMR009001042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0720164746806, 20.125224974752825], [95.07481645451583, 20.12382498393589], [95.09651630678218, 20.123474986681344], [95.1000162829252, 20.125224974752825], [95.10596624164879, 20.125574972007428], [95.12311612510916, 20.12382498393589], [95.132916056331, 20.12207499676373], [95.13510671580235, 20.121801163093266], [95.13676603062788, 20.118925018774632], [95.13396604989333, 20.113325056406268], [95.12801609116974, 20.106325104120288], [95.12460621270662, 20.105243922968725], [95.11366618844391, 20.101775135314313], [95.10386625542338, 20.094075188519184], [95.09301633063922, 20.089875216068435], [95.08155154386873, 20.09305987911017], [95.08041641688419, 20.093375192211397], [95.06829580940416, 20.09534069651596], [95.07026648660911, 20.098625157325216], [95.07271647008906, 20.10422511879426], [95.0723664719352, 20.11017507751785], [95.07166647652673, 20.117175028904512], [95.0720164746806, 20.125224974752825]]], [[[95.0720164746806, 20.125224974752825], [95.0720164746806, 20.125574972007428], [95.07232647278857, 20.125844970069352], [95.0720164746806, 20.125224974752825]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
