
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Hpan Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Hpan Kwin</div><div class="name-mm">နတ်ဖန်ကွင်း</div></div>
        <span class="pcode-badge">MMR008008032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56902444632118, 17.890758573249627], [95.57186626081932, 17.885824127181763], [95.57420704861647, 17.881376628928308], [95.57514336427488, 17.876226895954517], [95.57771823121146, 17.870843082941974], [95.58544283112184, 17.864522956069607], [95.58930417105068, 17.862392561967226], [95.58895401281751, 17.859607301335927], [95.5882517771978, 17.853989410083273], [95.58637914678025, 17.849307833589705], [95.5847405946028, 17.847669282311585], [95.57654783731289, 17.846967045792553], [95.57092994606023, 17.85469164570293], [95.56624836956667, 17.86218216827251], [95.55758745399788, 17.872247555979982], [95.55354098502852, 17.873506215639395], [95.55260824507451, 17.873798772295572], [95.55070626708061, 17.874395333078212], [95.54996407278378, 17.87509940601285], [95.54928348744306, 17.87574503560495], [95.54926436335973, 17.87935800436844], [95.55020625031824, 17.879815290743124], [95.55113810983596, 17.8816271206951], [95.55255262110666, 17.882085170594223], [95.5544263909652, 17.884351734644895], [95.55631019366058, 17.8852637497223], [95.56241449673172, 17.890714769071394], [95.56430635375528, 17.889821465288435], [95.56808305578846, 17.88938700100931], [95.56807815628196, 17.89074154818394], [95.56902444632118, 17.890758573249627]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
