
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Tan Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Tan Shey</div><div class="name-mm">ရွာတန်းရှည်</div></div>
        <span class="pcode-badge">MMR009020071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.82046362209854, 21.5274634942449], [94.81905638364526, 21.51878552663078], [94.81737759310153, 21.507873386747463], [94.81791660536709, 21.497093139636718], [94.81793718994942, 21.496681447990454], [94.81346041426679, 21.49500265744672], [94.80142907978825, 21.491924874333506], [94.80117309406307, 21.49221062492046], [94.78944911098773, 21.50529786240645], [94.78478791223245, 21.516527114934433], [94.78201825304001, 21.524409991927655], [94.77903554265623, 21.532718968605593], [94.77717015987503, 21.533602572300936], [94.7801413409502, 21.53671523741832], [94.78744893781828, 21.542112893695162], [94.78967754418335, 21.54033000932253], [94.79443411784035, 21.536972428235003], [94.79779169982714, 21.533894645121848], [94.80450686290146, 21.533894645121848], [94.8084240417362, 21.533335048273898], [94.81346041426679, 21.529977466287107], [94.82046362209854, 21.5274634942449]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
