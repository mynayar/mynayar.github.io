
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khin Tan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khin Tan Gyi</div><div class="name-mm">ခင်တန်းကြီး</div></div>
        <span class="pcode-badge">MMR007012035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4106880368235, 18.45954548793395], [96.4106880368235, 18.456728826574135], [96.40982137185887, 18.452828832884393], [96.40982137185887, 18.451312169421158], [96.41090470328948, 18.448062175129337], [96.41242136675271, 18.444162182338914], [96.41545469457856, 18.441128853613748], [96.41913802180233, 18.44004552218314], [96.42130468466354, 18.43831219225393], [96.42261449416361, 18.434491915369676], [96.42104468616338, 18.43213720336928], [96.41779469097224, 18.43083720457338], [96.41567136194385, 18.429645539909814], [96.41155470178813, 18.430295539307735], [96.4054880461365, 18.430295539307735], [96.40007138898346, 18.43007887284176], [96.3963880617597, 18.43181220277097], [96.39443806536451, 18.43701219435735], [96.39443806536451, 18.441778853011726], [96.39378806596653, 18.44892884009397], [96.39378806596653, 18.45391216521432], [96.39443806536451, 18.459328822367297], [96.39422139889848, 18.464745478621012], [96.39481356109701, 18.466209966117106], [96.39812139168896, 18.46712880884752], [96.40137138598072, 18.46582881095094], [96.40678804403308, 18.46214548372717], [96.4106880368235, 18.45954548793395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
