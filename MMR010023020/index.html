
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Kan</div><div class="name-mm">ဆည်ကန်</div></div>
        <span class="pcode-badge">MMR010023020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84629839955159, 20.37399827829796], [95.84070464520329, 20.374971104632834], [95.8330221146789, 20.376588479574707], [95.82372220921263, 20.379418886172687], [95.8168483661592, 20.379418886172687], [95.80916583473555, 20.376184136288884], [95.80027027255511, 20.370523323992245], [95.79501380444356, 20.367692918293585], [95.78652258644826, 20.370523323992245], [95.78045742996648, 20.374971104632834], [95.77479661766984, 20.378205855415956], [95.76873146208737, 20.379418886172687], [95.77924439920969, 20.39033616568156], [95.79339642860236, 20.40610557181475], [95.80552674066661, 20.418235882979673], [95.81320927209032, 20.428748820102044], [95.82897867732413, 20.43238791417093], [95.83231016008585, 20.435005507897927], [95.834235146335, 20.43077053922906], [95.83666120784852, 20.423896696175632], [95.83585252127688, 20.416214164751977], [95.83868292697554, 20.40731860257148], [95.8394916144465, 20.400849102803875], [95.84232202014516, 20.396401322163342], [95.84515242584382, 20.389931823295058], [95.84515242584382, 20.382249291871346], [95.84629839955159, 20.37399827829796]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
