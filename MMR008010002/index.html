
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Shint Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Shint Yoe</div><div class="name-mm">ငါးရှဉ့်ရိုး</div></div>
        <span class="pcode-badge">MMR008010002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64578510559818, 18.15636336967384], [95.64590635579373, 18.15565517694489], [95.64707047602172, 18.14510592789628], [95.64707047602172, 18.140734031150657], [95.64974219094944, 18.13733366661546], [95.64828489173442, 18.135147717793018], [95.64804200913147, 18.13271888726689], [95.64779912472989, 18.12883275572716], [95.6490135413419, 18.125918158196498], [95.63419766928706, 18.123975092876265], [95.63662649981319, 18.129318521832374], [95.62982577164212, 18.131504470654875], [95.62909712203464, 18.132961769869837], [95.62982577164212, 18.136362134405033], [95.62820191438692, 18.138127471205905], [95.62690578537376, 18.140043686367108], [95.63242172408337, 18.144471181899576], [95.63336669121986, 18.1449258116769], [95.63524021196628, 18.14809602890864], [95.63758259336203, 18.15217336980521], [95.64394615119397, 18.156093334739637], [95.64578510559818, 18.15636336967384]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
