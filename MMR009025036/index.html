
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tay</div><div class="name-mm">တေး</div></div>
        <span class="pcode-badge">MMR009025036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.1120302400036, 21.449108254242617], [94.11239821470588, 21.448924266441793], [94.11279350631531, 21.447343106299343], [94.1122005698005, 21.443587848600373], [94.1112123452736, 21.439042012179186], [94.11002647404263, 21.432124435094636], [94.1098288291372, 21.427380952868702], [94.10923589442103, 21.422835116447516], [94.1072594426692, 21.418091634221582], [94.10607357323687, 21.415917537564383], [94.10548063762138, 21.411766991853256], [94.10646886304767, 21.408802314675142], [94.11002647404263, 21.404849413869385], [94.1122005698005, 21.40208238339534], [94.11022411984732, 21.39694361135861], [94.10844531390018, 21.390816612996332], [94.1098288291372, 21.384887261338065], [94.11109462761505, 21.377654123838795], [94.10745708757457, 21.38053906892293], [94.1029112520527, 21.38231787487007], [94.09243606217461, 21.386666067285205], [94.08256187573005, 21.38782773596131], [94.08233871615886, 21.38849721557409], [94.08815581084207, 21.391802384172763], [94.09190150155314, 21.40423126576036], [94.09547693441306, 21.417681700749938], [94.09614316387598, 21.420124542713552], [94.09752003761969, 21.4251730830714], [94.10075495207946, 21.431472653240405], [94.1056924540436, 21.436239895554763], [94.10875710975284, 21.442539466623145], [94.11199202511193, 21.448668778941055], [94.1120302400036, 21.449108254242617]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
