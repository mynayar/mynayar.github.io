
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shi Kyang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shi Kyang</div><div class="name-mm">ရှီးကျန်</div></div>
        <span class="pcode-badge">MMR001005030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.45515568138967, 26.03422101808559], [98.45559032283518, 26.034464416899368], [98.45589060107045, 26.034190993319726], [98.45621762694196, 26.03393209738846], [98.45654465371285, 26.03350968942067], [98.45715782677235, 26.032869263305884], [98.45783913157072, 26.032569489590344], [98.47033797951423, 26.025245255264394], [98.48418644275017, 26.01425214581991], [98.51602363028638, 25.99040994656184], [98.52972932614756, 25.978560231069878], [98.54127933267512, 25.96759546915564], [98.51877831306876, 25.956344959352464], [98.50984837790037, 25.953718507303336], [98.48778618428503, 25.972628959359042], [98.46782515230899, 25.99153940961611], [98.44943998976379, 26.007298120112182], [98.44786411943363, 26.015177475360247], [98.44366179705435, 26.027784443397422], [98.45515568138967, 26.03422101808559]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
