
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sin</div><div class="name-mm">ကျောက်ဆင်</div></div>
        <span class="pcode-badge">MMR010011006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.36152972231889, 22.938254454879257], [96.3575928051639, 22.93994170534546], [96.35421830513076, 22.94500345494555], [96.3575928051639, 22.9500652054449], [96.3682787232845, 22.95568937216683], [96.37559013957332, 22.960188706443716], [96.38290155676151, 22.969187373198793], [96.38852572438276, 22.976498790386927], [96.39358747398279, 22.982685374230698], [96.39864922358288, 22.986059874263844], [96.40933514170348, 22.98324779135254], [96.41945864180292, 22.98324779135254], [96.42564522564669, 22.97818604085313], [96.43183181038978, 22.97818604085313], [96.43801839333423, 22.970312207442475], [96.44645464386679, 22.96300079025434], [96.45432847817676, 22.95681420641057], [96.44982136566358, 22.952996790269708], [96.44502821657898, 22.946678549275703], [96.44546395789541, 22.942103270849316], [96.43979932797669, 22.93992456696526], [96.43522405044962, 22.933170584654818], [96.41082256730772, 22.93164549184604], [96.3942644179686, 22.93295271489592], [96.3761525557959, 22.936567205312315], [96.3682787232845, 22.936567205312315], [96.36152972231889, 22.938254454879257]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
