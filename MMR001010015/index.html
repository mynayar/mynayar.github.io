
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Hlaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Hlaing</div><div class="name-mm">နန့်လှိုင်</div></div>
        <span class="pcode-badge">MMR001010015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.30830345294208, 24.344381524188066], [97.30888640788146, 24.343026308817173], [97.31147089936258, 24.338018857584245], [97.31719128275154, 24.333644447233496], [97.32223868097043, 24.329270035084107], [97.32762257132464, 24.32624159687225], [97.331323995606, 24.32153069168811], [97.33939983293601, 24.316146801333844], [97.34331403231681, 24.310265502251184], [97.34140980871575, 24.30202643527184], [97.33328315339486, 24.29307195940345], [97.33137038893238, 24.290964351423725], [97.32963763636786, 24.28914023583326], [97.32479973162236, 24.297419925189445], [97.32007093442616, 24.301448160404334], [97.31768212912704, 24.30348306808918], [97.31613271235483, 24.30619454744044], [97.31346428984517, 24.310864286157937], [97.31082814130576, 24.321672498586963], [97.30881861698566, 24.324083927231527], [97.30687391669795, 24.326417567216993], [97.30028354265141, 24.331689866094507], [97.29709328402788, 24.343387483745403], [97.30507752810547, 24.34205677579962], [97.30830345294208, 24.344381524188066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
