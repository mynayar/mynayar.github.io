
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daung Ngu Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawei</div><div class="name-mm">ထားဝယ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Daung Ngu Ward</div><div class="name-mm">ဒေါင်းငူရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006001701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.18994505781825, 14.069196804189232], [98.19024227835854, 14.06797197252854], [98.19001320304693, 14.067932460814461], [98.18945799309199, 14.06773662084845], [98.18893212801538, 14.067692215923103], [98.18858702846865, 14.06773719011926], [98.18817854380484, 14.067577216915083], [98.18772854373736, 14.067297043923475], [98.18735453188617, 14.067090463354248], [98.18671363452665, 14.066745465430927], [98.18641548768466, 14.067517439877975], [98.18628402119066, 14.067572093477395], [98.18611490997517, 14.067845001745468], [98.18607977885875, 14.067993375493927], [98.18597805834077, 14.068158933488064], [98.18586269690599, 14.068564551113184], [98.18572763672114, 14.069168408994926], [98.18561260353886, 14.069448503745491], [98.18563138498047, 14.069528205262486], [98.18561729889927, 14.06963295559649], [98.18571120340937, 14.069680777046301], [98.18558025672354, 14.069889067226711], [98.18959745186095, 14.070677331993352], [98.18994505781825, 14.069196804189232]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
