
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Ku</div><div class="name-mm">ဆင်ကူး</div></div>
        <span class="pcode-badge">MMR017017091</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11112879985427, 16.501439160289067], [95.11248383985736, 16.49717036991666], [95.11640784004982, 16.48869434956464], [95.11640424006367, 16.487041949626303], [95.11638228041795, 16.47679571994655], [95.11496387957942, 16.468377570068867], [95.11310375963086, 16.45939459828213], [95.11016651986904, 16.462770479673964], [95.1055545598951, 16.469152470010556], [95.10326963978213, 16.47231866997072], [95.09827608037688, 16.47869678962519], [95.0922604801371, 16.483923000046445], [95.09103216000625, 16.485506100026555], [95.08980383987534, 16.487089200006608], [95.08846103964532, 16.491704939831152], [95.08812134412477, 16.492868622089304], [95.0917262396743, 16.495501950354765], [95.0924732399481, 16.49604762030151], [95.09753376017494, 16.499717369560983], [95.10150708008774, 16.50116340027074], [95.10978888015273, 16.501532849861178], [95.11112879985427, 16.501439160289067]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
