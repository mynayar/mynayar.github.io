
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Pya Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kungyangon</div><div class="name-mm">ကွမ်းခြံကုန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">San Pya Ward</div><div class="name-mm">စံပြရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013029701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00309175143173, 16.437193729386024], [96.00348895214, 16.43699735572983], [96.00374593392854, 16.436119334618695], [96.00387442482292, 16.435619647807528], [96.00396722380208, 16.435119960996303], [96.00412069903689, 16.433842190436167], [96.00424562073977, 16.43325684302863], [96.00519955408646, 16.432488425504744], [96.00506908352764, 16.432169497472103], [96.00482161958286, 16.431531801922574], [96.00450277180818, 16.430546705066092], [96.00406970990508, 16.42931890318704], [96.00365092476801, 16.428257663578506], [96.00329876453918, 16.427624726950967], [96.00208999834825, 16.428290976032486], [96.0011144193358, 16.42900481433435], [95.99934410034734, 16.430333743305994], [96.00070753150379, 16.432846454128367], [96.00010433813884, 16.433146266214976], [96.00094309814341, 16.43474169481948], [96.00151416878481, 16.43449185141378], [96.00231009849131, 16.43579817550608], [96.00218160759698, 16.43602303457112], [96.00108943499515, 16.436151525465505], [96.00095737490949, 16.436458475935183], [96.00160696776402, 16.436711888532386], [96.0025670802799, 16.437397173301918], [96.00298467568632, 16.437229421301197], [96.00309175143173, 16.437193729386024]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
