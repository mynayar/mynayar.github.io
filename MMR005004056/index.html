
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon Kan</div><div class="name-mm">ဝါးရုံကန်</div></div>
        <span class="pcode-badge">MMR005004056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56873092019589, 22.500833669838016], [95.56843283990372, 22.495666859637936], [95.56219259980867, 22.496102279896377], [95.55679548042713, 22.496102279896377], [95.55201540029054, 22.496102279896377], [95.5463104798448, 22.494714480289076], [95.53998852015417, 22.494251879820467], [95.53784765434585, 22.49363896936302], [95.52870881296138, 22.4878141387116], [95.53238931271665, 22.49543803074056], [95.53531181888542, 22.501283042178727], [95.53437919224598, 22.50355276105114], [95.53381091963831, 22.50407519971077], [95.53291128013154, 22.504899959865327], [95.53280256019008, 22.505195969918134], [95.53241528064075, 22.506249859343598], [95.53110311131957, 22.50664734889608], [95.53474584044824, 22.509517230335973], [95.54012208026984, 22.512877379887243], [95.54091335956394, 22.513372110434602], [95.54176404807242, 22.513588149173813], [95.5506279604121, 22.515839190026668], [95.55440145366424, 22.516159011429295], [95.55972515958848, 22.516610220185555], [95.5678975202544, 22.515376589558002], [95.56792272015747, 22.515306929870974], [95.56866864034555, 22.513217939656215], [95.56943976043664, 22.50874620017703], [95.56882272029236, 22.502424239587015], [95.56873092019589, 22.500833669838016]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
