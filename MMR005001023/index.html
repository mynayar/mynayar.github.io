
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Ein Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Ein Te</div><div class="name-mm">တအိမ်တည်း</div></div>
        <span class="pcode-badge">MMR005001023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.89260924012439, 21.953430629719833], [95.89111344003328, 21.953145690321378], [95.8863618000571, 21.95643519003204], [95.88892032001684, 21.961917539962542], [95.89220963986304, 21.967765469700737], [95.89476815982277, 21.97288241968795], [95.89476815982277, 21.9790958402009], [95.89374108008684, 21.982382820011196], [95.9039056801031, 21.982019760103924], [95.91194663992553, 21.980923289578186], [95.91730703998797, 21.980923289578186], [95.91742907978823, 21.98055779970275], [95.92546967988187, 21.97946133007639], [95.93314523976107, 21.97946133007639], [95.93935848040962, 21.978730350325463], [95.94045503996819, 21.979704960015965], [95.94045503996819, 21.974709869964556], [95.94045503996819, 21.97215143993708], [95.94062135968807, 21.968496450350926], [95.93497260010548, 21.968496450350926], [95.93241408014575, 21.9575316596584], [95.9272538403925, 21.952371240040748], [95.92656624033975, 21.951683729920262], [95.92108379957773, 21.952049219795697], [95.90719499994935, 21.95241470967119], [95.89878864018368, 21.95460764982323], [95.89260924012439, 21.953430629719833]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
