
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Poke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Poke</div><div class="name-mm">သစ်ပုတ်</div></div>
        <span class="pcode-badge">MMR012007011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.17620879230196, 20.143200711044017], [93.1799994032499, 20.14251485207882], [93.1872910443463, 20.141195284035177], [93.21183221468505, 20.13892424585731], [93.21928421569407, 20.13910069823868], [93.21931511010433, 20.138271706773878], [93.22050293556208, 20.135165082402693], [93.2216347989069, 20.13314577615671], [93.22414750920024, 20.130290423264455], [93.2250783147125, 20.129659188221012], [93.22911582373632, 20.12692110692359], [93.23191407057794, 20.123666003583253], [93.23317042527498, 20.121610149788637], [93.23442678087127, 20.11766976214983], [93.23425546002153, 20.115842336154913], [93.2332275331242, 20.114186231009796], [93.2317770984344, 20.11339508481535], [93.23008664458303, 20.112473018914727], [93.22276055405638, 20.10973318124138], [93.2223784770851, 20.1101280249884], [93.22106323388118, 20.111246239322554], [93.21609219709728, 20.114046660724853], [93.20787933726166, 20.118365885077594], [93.20076195510023, 20.124106871934657], [93.19680722957003, 20.126977701259932], [93.1928523610477, 20.129848440653063], [93.18335641956315, 20.133597316762803], [93.17438535480034, 20.135101919418105], [93.17620879230196, 20.143200711044017]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
