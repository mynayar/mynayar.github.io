
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lun Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lun Aing</div><div class="name-mm">လွန်အိုင်</div></div>
        <span class="pcode-badge">MMR010020036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34333593660426, 20.8456553300295], [95.33852402136654, 20.848061288097995], [95.33508693931088, 20.85115466275755], [95.32958760658283, 20.850123537871013], [95.32408827385484, 20.848404997292846], [95.31893265122096, 20.84771757980252], [95.31480815167492, 20.8508109535627], [95.31583927566209, 20.856653994586225], [95.31652669315241, 20.8590599517554], [95.31549556826593, 20.864215576187917], [95.31205848621022, 20.869371199721115], [95.31205848621022, 20.876932782222184], [95.31283704998992, 20.882642257734062], [95.31962708791986, 20.883026600097594], [95.32691386008662, 20.883026600097594], [95.33096243976485, 20.883888000430943], [95.33096243976485, 20.88380694723287], [95.33096243976485, 20.876589073027333], [95.33268098124233, 20.873839406663365], [95.33783660477553, 20.876932782222184], [95.34299222920805, 20.876932782222184], [95.34677301865992, 20.87521423984532], [95.34917897672847, 20.87212086608514], [95.34746043615024, 20.866277825960935], [95.34608560296829, 20.861809618119423], [95.34574189467276, 20.855622869699744], [95.34333593660426, 20.8456553300295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
