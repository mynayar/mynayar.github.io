
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Shey</div><div class="name-mm">ရွာရှည်</div></div>
        <span class="pcode-badge">MMR009020059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92684772024614, 21.8157171030619], [94.92666050657715, 21.81375136493358], [94.92328587074638, 21.810376730002133], [94.91400562266142, 21.80672087436892], [94.90669391229426, 21.802783798933206], [94.90769422370954, 21.802425196965316], [94.9072563518992, 21.801658920622742], [94.90781879060478, 21.79687818667901], [94.90669391229426, 21.78562940087619], [94.90737463343265, 21.781658531616017], [94.9072563518992, 21.78169232633985], [94.89713244530617, 21.780286228226885], [94.88532121989846, 21.78000500842444], [94.87238511618023, 21.777192812198564], [94.87126472188947, 21.777226763404485], [94.86451096620817, 21.79125379422726], [94.86563584541801, 21.796034528170992], [94.87112842873404, 21.801675559879243], [94.87604097181344, 21.80672087436892], [94.8878521972212, 21.818250879074867], [94.89347658877364, 21.826687468651812], [94.90175902106205, 21.837785927378718], [94.90359094906313, 21.839933962582336], [94.9053554791721, 21.838873252698477], [94.9179074653573, 21.835526163101974], [94.92118920122073, 21.8345486441047], [94.92286641075628, 21.83404906801013], [94.9226135888461, 21.833077087037964], [94.9263792867747, 21.82612502904692], [94.9272229461821, 21.819656978087096], [94.92684772024614, 21.8157171030619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
