
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Tha Min</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salingyi</div><div class="name-mm">ဆားလင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Tha Min</div><div class="name-mm">ရွှေသမင်</div></div>
        <span class="pcode-badge">MMR005018017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97867541773638, 22.026619348204406], [94.99127316322597, 22.023321375980743], [94.99136868022049, 22.023296370331252], [94.99932863990489, 22.021728479685635], [95.0054932802907, 22.017700169827037], [95.01727283966989, 22.01550291023119], [95.0250855596509, 22.0112915397728], [95.02447500002131, 22.006896929749587], [95.01531984043834, 22.00250240965852], [95.00671403982113, 21.99591062997166], [95.00408928029611, 21.990112289750414], [95.00512680026168, 21.986877420256803], [95.00860476010166, 21.98322279039951], [95.0087278799877, 21.983093279930983], [95.00708016012135, 21.979919430337475], [95.0012816400357, 21.975891119579558], [94.99127184032324, 21.976684559944545], [94.98449700003658, 21.97888182043971], [94.977943199619, 21.98070233964131], [94.97821883822888, 21.981889745115723], [94.97827151961502, 21.98211668993332], [94.97739262476989, 21.982476229894132], [94.97290031959415, 21.984313950428543], [94.96630871977163, 21.985717769659402], [94.96429451987626, 21.985473600126568], [94.96667484007185, 21.991516109880592], [94.97210688012848, 21.99847409979992], [94.97210688012848, 22.005676260151347], [94.97528063978973, 22.014892620398143], [94.97686967979195, 22.01895350999655], [94.97867541773638, 22.026619348204406]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
