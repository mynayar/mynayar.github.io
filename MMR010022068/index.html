
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Tein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Tein</div><div class="name-mm">ကန်တိန်</div></div>
        <span class="pcode-badge">MMR010022068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12606488878367, 21.115240443092034], [95.12606488878367, 21.111724705430845], [95.12734333982331, 21.10597167755094], [95.12670411520281, 21.10181671436993], [95.12670411520281, 21.095104850008852], [95.12574527692306, 21.089671435788205], [95.12350798940224, 21.087114534608133], [95.1220123026257, 21.084908780915555], [95.11733611756785, 21.077634715269937], [95.11395887280378, 21.07010086066623], [95.11317950862747, 21.06568446366714], [95.11343929668624, 21.062567006961842], [95.11447844892132, 21.058670186080292], [95.1170763304084, 21.051655907594125], [95.10304777433538, 21.049577603123907], [95.09437794018987, 21.048655280916535], [95.09413063921767, 21.049079224926345], [95.09282087378438, 21.05464572621935], [95.090201343817, 21.059884785254667], [95.08889271063015, 21.061998731656217], [95.08838516474361, 21.062818613888], [95.09154672959795, 21.06633971690445], [95.09634091829878, 21.071133905605336], [95.09985665685929, 21.07784576996636], [95.1017743334188, 21.082000734046687], [95.10369200817968, 21.08839298564783], [95.10465084556012, 21.09286756158872], [95.10656852122031, 21.0989402013293], [95.10784697226, 21.104054002790065], [95.1113627099212, 21.108848190591573], [95.11487844938097, 21.114281604812277], [95.11935302532191, 21.11651889413173], [95.12606488878367, 21.115240443092034]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
