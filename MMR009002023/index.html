
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Son</div><div class="name-mm">ချောင်းဆုံ</div></div>
        <span class="pcode-badge">MMR009002023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18578986141301, 20.480948684933935], [95.18868814074517, 20.478261108663276], [95.200668188686, 20.478351101122485], [95.20115499440755, 20.477451579426884], [95.20451747140424, 20.476572165672962], [95.20106178777132, 20.4669057046346], [95.20361581291951, 20.46179765793562], [95.20255163435053, 20.44583501177641], [95.20382864737422, 20.441365469341008], [95.20628038723015, 20.437687860906124], [95.20628486585395, 20.437299483284562], [95.20542096090867, 20.436747589129993], [95.20342441020841, 20.435472120242196], [95.19336849865732, 20.434945574378787], [95.19081498342479, 20.434121189241523], [95.1890690180208, 20.4335575166661], [95.18380167710575, 20.433065681935716], [95.18167224797594, 20.432826823798905], [95.17646422904102, 20.432242641284915], [95.17518751099487, 20.432099432342966], [95.17372944465819, 20.434345233745603], [95.17084608238088, 20.43913497889622], [95.16958267430101, 20.441087517674873], [95.16717560197253, 20.450715806089647], [95.16139862874377, 20.45456712127566], [95.16188004392893, 20.46275116593364], [95.16010343502558, 20.47163421224917], [95.16205335317977, 20.47144551020216], [95.16944787761753, 20.47699140442984], [95.17838292992832, 20.478840034639916], [95.18578986141301, 20.480948684933935]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
