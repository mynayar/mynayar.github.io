
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Taung Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauktaw</div><div class="name-mm">ပေါက်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Taung Pyin</div><div class="name-mm">နတ်တောင်ပြင်</div></div>
        <span class="pcode-badge">MMR012007001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.0449873833611, 20.189020366196985], [93.04234854674809, 20.1932582495686], [93.0405016063641, 20.197495911706994], [93.0386543503181, 20.200861182897313], [93.03825911356728, 20.204101499584567], [93.03760016321701, 20.20871273560431], [93.04565315237113, 20.208835452594087], [93.05700627571912, 20.208209015433738], [93.05991075317877, 20.20858192111882], [93.06360622484743, 20.20621276420775], [93.06809316466786, 20.202721605917418], [93.06914836890218, 20.200727207294847], [93.0684876163105, 20.199107351123416], [93.06802523887376, 20.19829747295006], [93.06756286503423, 20.197487593877383], [93.06479032531331, 20.196491644174102], [93.06267794103422, 20.195744663685332], [93.06234780620633, 20.19543322126617], [93.0620176713785, 20.195121777048428], [93.06201722711342, 20.19400015788102], [93.06333630232854, 20.1916318256483], [93.0634526449237, 20.190196710010184], [93.06346764741403, 20.190011661908727], [93.06201446619474, 20.187021194872273], [93.06082566767049, 20.184902994677486], [93.0556785508245, 20.186898691021838], [93.05290660915273, 20.18689954627706], [93.05079479504383, 20.187336355088746], [93.0486829683444, 20.187773136920782], [93.0449873833611, 20.189020366196985]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
