
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Myin Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Myin Kin</div><div class="name-mm">သမြင်ကင်း</div></div>
        <span class="pcode-badge">MMR009010022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6824575621668, 20.630576499306073], [94.67514385980132, 20.619647978271644], [94.66834249041364, 20.617920645921117], [94.66669628590495, 20.617726976019185], [94.66269063086798, 20.617255722273796], [94.66246470138492, 20.616229883602273], [94.66008893175888, 20.614723298841227], [94.6526718972903, 20.612521367267334], [94.65179244306688, 20.6123454760629], [94.65139527097506, 20.612266040745226], [94.65056532802754, 20.614039101823153], [94.64905967586338, 20.617255722273796], [94.64909623420391, 20.61735625658605], [94.64972460041002, 20.619084264327398], [94.65271676086985, 20.622242656373544], [94.65388037927613, 20.623904967740145], [94.65397070538381, 20.624143099224682], [94.65414097492612, 20.624270801156626], [94.66238893530118, 20.63045677166275], [94.6720952282123, 20.6300746353362], [94.67283405634669, 20.63004554676462], [94.6824575621668, 20.630576499306073]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
