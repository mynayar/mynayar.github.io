
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hmyin Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hmyin Taung</div><div class="name-mm">မျှင်တောင်</div></div>
        <span class="pcode-badge">MMR010008037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57746139632644, 21.984194898176042], [96.57746139632644, 21.984044134928922], [96.57746139632644, 21.977373622294863], [96.57746139632644, 21.977222859047743], [96.5784291630755, 21.971900136981787], [96.57832152321976, 21.970070263931575], [96.57794863012526, 21.963731067834544], [96.57222362961687, 21.965848016173084], [96.5684937687725, 21.965433586990514], [96.56144847716553, 21.964604728625375], [96.56144847716553, 21.969577876118137], [96.56144847716553, 21.97123559194904], [96.5643494787455, 21.97372216614508], [96.5660071945764, 21.97620874034112], [96.55979076133463, 21.97828088535465], [96.55309969289658, 21.979809792188234], [96.55309969289658, 21.984194898176042], [96.55309969289658, 21.989554472660814], [96.55309969289658, 21.99247787815159], [96.5555358627899, 21.995888515642548], [96.55578606407568, 21.995638315256087], [96.56138267197281, 21.990041707358955], [96.57746139632644, 21.984194898176042]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
