
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Oh</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Oh</div><div class="name-mm">ကြအို</div></div>
        <span class="pcode-badge">MMR010022006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.83742871466353, 21.017003273682178], [94.85024955497306, 21.02147453022542], [94.8627771866179, 21.024679443301693], [94.86739564239502, 21.024968096000862], [94.87518928415818, 21.02525674959935], [94.88038504533364, 21.025834056796327], [94.88313835485127, 21.02652238440055], [94.88442619301446, 21.02265886901165], [94.88471484571363, 21.02034964202244], [94.88356023311832, 21.016597147040727], [94.88182831242676, 21.01342196015537], [94.88067369893213, 21.01082407866835], [94.88067369893213, 21.00822619897997], [94.8841375403153, 21.007360238184503], [94.88702407360216, 21.006494278288358], [94.88933330059143, 21.00360774410217], [94.88991060778835, 20.999566596421346], [94.89048791498533, 20.99639140863667], [94.8907765676845, 20.99437083524589], [94.88731272720065, 20.994659487945057], [94.88298292592134, 20.99437083524589], [94.87836447104354, 20.992061608256677], [94.872302749972, 20.99119564836053], [94.86855025499034, 20.99119564836053], [94.86797294869268, 20.983113352099565], [94.85930041478235, 20.988288043958107], [94.84421564813374, 20.992210082729173], [94.83100981794883, 20.993509016727785], [94.83157145625773, 21.001772849237625], [94.83291012410302, 21.011982209411485], [94.83742871466353, 21.017003273682178]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
