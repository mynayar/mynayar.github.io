
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon</div><div class="name-mm">ဝါးရုံ</div></div>
        <span class="pcode-badge">MMR010024063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00600221273197, 20.74629015266845], [95.99032913837908, 20.742288031967178], [95.97458552120492, 20.74076445631465], [95.97473667475782, 20.75270256796921], [95.97648208078346, 20.752898010434876], [95.97654151877612, 20.752904892047184], [95.9792079933543, 20.752683639938084], [95.98035719293017, 20.752711214051317], [95.98063813664078, 20.752717955369405], [95.98289089340005, 20.755867355993757], [95.98621171739688, 20.75852401627037], [95.99006825764405, 20.759295324319794], [95.99237423718137, 20.76049755871543], [95.99241058867779, 20.760516511028186], [95.99351752911076, 20.762730391894138], [95.99424569038638, 20.763406541778522], [95.99532834912407, 20.7644118669142], [95.99539875165112, 20.764249382802802], [95.99577538412672, 20.763380150273747], [95.99761346169197, 20.76339545133908], [95.99827679084126, 20.763517116122046], [95.99958556432239, 20.763757607427692], [96.00129876382692, 20.76554697411359], [96.00232089909031, 20.766248466893273], [96.00252333018761, 20.764562114849753], [96.00412713076253, 20.761390739291244], [96.00613665778059, 20.757417074938132], [96.0067235355628, 20.752126727566463], [96.006658554149, 20.749956131070633], [96.00637288360173, 20.74876477937113], [96.00614337661563, 20.7478081831012], [96.00600221273197, 20.74629015266845]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
