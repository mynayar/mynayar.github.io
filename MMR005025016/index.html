
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mei Za Li</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mei Za Li</div><div class="name-mm">မယ်ဇလီ</div></div>
        <span class="pcode-badge">MMR005025016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73564311973422, 23.866421760056255], [95.73669792017296, 23.865925499762056], [95.73912360037394, 23.862379859642886], [95.74043004011435, 23.85995381971304], [95.7415165200714, 23.8586119197044], [95.74001784035113, 23.856176880258886], [95.73665903978292, 23.85001872038771], [95.73255359956903, 23.844793590052177], [95.7306873597339, 23.841621180273307], [95.72396939976807, 23.836582619692194], [95.71911731990843, 23.833410209913325], [95.71770179959844, 23.831640630111053], [95.71725108007337, 23.832477180377623], [95.71557167978926, 23.836769190345933], [95.71389228040448, 23.84143451968737], [95.7123993599426, 23.847779340144484], [95.70680100016608, 23.85412415970228], [95.70456144005846, 23.85785646040739], [95.70279816000715, 23.857549740328295], [95.70366755981007, 23.86293965973755], [95.70519719959117, 23.86572119987352], [95.70572028036668, 23.86667186961114], [95.71281155970576, 23.86667186961114], [95.72214204032298, 23.866112070415795], [95.72904683983984, 23.867978220318662], [95.73352523969811, 23.86741833029174], [95.73564311973422, 23.866421760056255]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
