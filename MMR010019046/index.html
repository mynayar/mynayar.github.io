
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pyayt Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pyayt Yin</div><div class="name-mm">ရွှေပြည့်ရင်</div></div>
        <span class="pcode-badge">MMR010019046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83891112275018, 21.359737460415488], [95.83894235170823, 21.3597349953738], [95.84328196099375, 21.359889980937908], [95.84715661178825, 21.359580008910314], [95.85459594224898, 21.360044967401393], [95.86048541077315, 21.35927003688272], [95.86482502005867, 21.358960064855182], [95.86854468438975, 21.357720176744806], [95.87124484937038, 21.351412642179753], [95.87124484937038, 21.34457378635119], [95.86766259155542, 21.340340209832846], [95.862452035633, 21.340340209832846], [95.85718261458607, 21.33861198985153], [95.85203571627534, 21.340670750254958], [95.85203571627534, 21.343501545360084], [95.84688881706529, 21.34556030396493], [95.84174191695598, 21.348133753569925], [95.83916846825025, 21.3499351693726], [95.83891112275018, 21.355596757784213], [95.83891112275018, 21.359737460415488]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
