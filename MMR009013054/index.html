
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Ngan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Ngan</div><div class="name-mm">ရေငံ</div></div>
        <span class="pcode-badge">MMR009013054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76080172611881, 19.756948710015024], [94.76515443492929, 19.747675547688402], [94.7676913954416, 19.744433876622168], [94.76366430236573, 19.741678497764497], [94.75507071004529, 19.7389162723681], [94.74402180486248, 19.73799553026953], [94.73082450204919, 19.73523330397387], [94.71732028400396, 19.731243421246916], [94.70473680895662, 19.72909502271716], [94.7009380357618, 19.727773710888073], [94.69722819292684, 19.73488424291355], [94.696346034442, 19.745911229819455], [94.69041735817461, 19.749559646260707], [94.69246566755658, 19.749986377269522], [94.69246566755658, 19.757001454353713], [94.69408453177579, 19.765635394757737], [94.70002036574732, 19.773190092948482], [94.70271847217981, 19.781824034251827], [94.69964537543376, 19.783433750567212], [94.7032587821671, 19.795076952939098], [94.71266597495486, 19.79531213284872], [94.73339671058977, 19.793988894671827], [94.7391307447881, 19.793988894671827], [94.73889139382283, 19.794999486237373], [94.7391307447881, 19.794871054055932], [94.73957182358083, 19.78428514594276], [94.74265938142537, 19.775463555698593], [94.74927557320922, 19.767083046045798], [94.76030256011512, 19.755173898856413], [94.76080172611881, 19.756948710015024]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
