
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Ta Dar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mansi</div><div class="name-mm">မံစီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Ta Dar</div><div class="name-mm">သံတံတား</div></div>
        <span class="pcode-badge">MMR001013035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.08631671374542, 23.93309911982857], [97.09601045032207, 23.929192688791602], [97.1114331866923, 23.917368591387458], [97.10320772825412, 23.879325838916373], [97.09755272377924, 23.861332645884943], [97.0764749829342, 23.868015831765263], [97.06362270232592, 23.875213108797993], [97.05498003939738, 23.8786356820911], [97.01975080965218, 23.888418660193054], [97.01975080965218, 23.89364437418857], [97.0223636648513, 23.89843461126833], [97.03194413721224, 23.90191841760094], [97.03325056706007, 23.90888603476276], [97.03194413721224, 23.917595555990147], [97.0336860430765, 23.920208413887224], [97.03542794714213, 23.93240174414524], [97.03716985030843, 23.9419822156068], [97.04670818313622, 23.941860249550928], [97.06156633681707, 23.943073152603972], [97.08631671374542, 23.93309911982857]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
