
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Taw</div><div class="name-mm">ဇီးတော</div></div>
        <span class="pcode-badge">MMR009004024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6597167363384, 19.954912471833154], [95.64883788126326, 19.956094956217328], [95.63306784110802, 19.95490025634183], [95.62327130122964, 19.952510855691514], [95.6158641611022, 19.9532276756168], [95.60582868034936, 19.954183436416486], [95.59531531964632, 19.95394449644141], [95.59507014736948, 19.95498648244029], [95.59435955974595, 19.958006476018113], [95.59476257563244, 19.972112029346704], [95.59483743969616, 19.97210393634765], [95.60582868034936, 19.97329863622315], [95.61777568090304, 19.97377651617336], [95.62327130122964, 19.97258181629786], [95.63020056140687, 19.97258181629786], [95.63856346143467, 19.97019241564749], [95.64286438098645, 19.97258181629786], [95.64549272071253, 19.976882735849642], [95.65361668076525, 19.97759955577493], [95.66221852076819, 19.97855531567535], [95.67077891821259, 19.977457828915703], [95.67201506064657, 19.97544909599901], [95.6736876413716, 19.971864996372517], [95.6736876413716, 19.966608316020995], [95.67034248082092, 19.961590575644607], [95.66413004056898, 19.9587232959434], [95.6598291210172, 19.95490025634183], [95.6597167363384, 19.954912471833154]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
