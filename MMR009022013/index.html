
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Taw</div><div class="name-mm">ပေတော</div></div>
        <span class="pcode-badge">MMR009022013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.67742073727726, 21.038865127123984], [94.6880801811555, 21.038865127123984], [94.69557060210167, 21.038865127123984], [94.70363720879021, 21.039729407086497], [94.70968716403144, 21.040881778571247], [94.70968716403144, 21.034543730908524], [94.70824669922587, 21.02676521664148], [94.7068062326216, 21.02474856519416], [94.69355394975503, 21.021003354721074], [94.6854873439658, 21.017834330889684], [94.68289450587679, 21.016393865184796], [94.68293848991942, 21.016238456039957], [94.68299020993032, 21.01605571200156], [94.68275587358477, 21.016086277259944], [94.68260641255597, 21.01610577186392], [94.68260641255597, 21.021003354721074], [94.68077631017866, 21.02568028441766], [94.68001357536627, 21.02762949570473], [94.67684455063556, 21.031374707077134], [94.67742073727726, 21.034831824229343], [94.67742073727726, 21.038865127123984]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
