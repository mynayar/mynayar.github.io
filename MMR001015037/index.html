
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mai Htaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mai Htaung</div><div class="name-mm">မိုင်ထောင်း</div></div>
        <span class="pcode-badge">MMR001015037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.39729466181927, 26.281481706015995], [97.37449433884274, 26.283653164961663], [97.34517963812988, 26.314053595596988], [97.37123714997455, 26.350968403968693], [97.3852251727036, 26.369438146853042], [97.4038090395556, 26.36834007913137], [97.42226644374142, 26.37159726799956], [97.43529520011344, 26.38571175429405], [97.44723822566363, 26.382454565425917], [97.46352417090384, 26.378111645735885], [97.47956729919156, 26.383459355464936], [97.48306730501218, 26.384626024371585], [97.49718179130667, 26.387883213239775], [97.51672492541502, 26.394397590976098], [97.53735378944589, 26.40308342765809], [97.51129627670184, 26.38028310468161], [97.51129627670184, 26.37485445686775], [97.4928388716167, 26.36182570139505], [97.48523876485717, 26.346625486077357], [97.4765529272758, 26.33576818865106], [97.44832395558615, 26.32708235196901], [97.41032341819124, 26.308624946883867], [97.4005518506874, 26.302110569147487], [97.39729466181927, 26.281481706015995]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
