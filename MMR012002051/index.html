
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyan Khin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyan Khin</div><div class="name-mm">ကြံခင်း</div></div>
        <span class="pcode-badge">MMR012002051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.947336517966, 20.538392449851756], [92.9519866784425, 20.540640027415407], [92.97549375793062, 20.548378383355782], [92.97899791861909, 20.5486703959221], [92.98440016683429, 20.537135865827622], [92.98447296605462, 20.53675367374308], [92.98615224762818, 20.527937444357633], [92.98928303768213, 20.51640295293396], [92.98885000332507, 20.51623054210586], [92.98239404734744, 20.51365993885514], [92.97593830720717, 20.51108909458611], [92.97716775059126, 20.50665144660701], [92.98191557204609, 20.489511788438335], [92.98852919536614, 20.475960114967393], [92.9789308273958, 20.47337480060662], [92.97793498740981, 20.475438670058622], [92.9683743936634, 20.491198567659808], [92.96435048958347, 20.501591348162265], [92.96140026181268, 20.509210122149454], [92.9560178175683, 20.527597035674717], [92.95263059032953, 20.531442649158976], [92.94924319311895, 20.535288194294765], [92.947336517966, 20.538392449851756]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
