
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Hlwar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Hlwar</div><div class="name-mm">ပန်းလွှား</div></div>
        <span class="pcode-badge">MMR009007041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.60904048513032, 20.227634845571743], [94.61328116179624, 20.228695014963023], [94.62977825796031, 20.232907039228508], [94.6473283586169, 20.233258041025806], [94.65434839905942, 20.235715056304855], [94.65891142602158, 20.23992707967102], [94.66558046376747, 20.239225076076423], [94.67611052488087, 20.239225076076423], [94.68207755903217, 20.240980085962235], [94.68593858239973, 20.245543112025075], [94.69120361205711, 20.24764912460745], [94.70032966508205, 20.249053132695963], [94.70454168934754, 20.25502016684726], [94.70766397541217, 20.257622071901153], [94.70980671990424, 20.25502016684726], [94.71331673967586, 20.250457140784476], [94.71015772170153, 20.230099023051537], [94.69462664760175, 20.21490558232682], [94.69401162823414, 20.2143039322807], [94.67821653656398, 20.210442909812514], [94.66066643590733, 20.211144914306374], [94.65967939758622, 20.21195249021531], [94.65680541433846, 20.2143039322807], [94.66347445208436, 20.223429985305643], [94.66171944219855, 20.22694000507721], [94.65820942242698, 20.22694000507721], [94.65231687912075, 20.226761442886357], [94.6466263550223, 20.226589003279912], [94.63723471241212, 20.22398021301649], [94.62767224537788, 20.221323972723212], [94.61784418875834, 20.218164953849566], [94.61503617258137, 20.220972970925914], [94.60904048513032, 20.227634845571743]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
