
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sum Kwei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sum Kwei</div><div class="name-mm">ဆွမ်ကွယ်</div></div>
        <span class="pcode-badge">MMR015001015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.70585947973126, 23.065849328783543], [97.70878415056814, 23.063965937078365], [97.72130179434237, 23.056853639683766], [97.72670713982268, 23.053439736754513], [97.73182799376696, 23.046896424230624], [97.73581087976834, 23.04206006182244], [97.73723333924727, 23.03551674839929], [97.74206970075613, 23.03096487842646], [97.74690606316432, 23.028404451004633], [97.75288039261608, 23.028404451004633], [97.76511354395495, 23.02755097639647], [97.76748751943353, 23.02766477211162], [97.76909642995633, 23.009627987141926], [97.7685678561217, 23.002756520996684], [97.76581818526108, 22.989934481890884], [97.76498002520805, 22.985767758275472], [97.75999269001068, 22.987153127914553], [97.75003547365822, 22.987153127914553], [97.74292317716294, 22.989144571364932], [97.7383713071901, 22.99341194980167], [97.7355263882323, 22.997394835803107], [97.73495740426085, 23.004222640762293], [97.73239697683908, 23.00336916525481], [97.7287981553107, 23.0007091657954], [97.72500018790839, 23.004507133197706], [97.71305152900493, 23.009627987141926], [97.69968041062253, 23.019585202595067], [97.69569752372178, 23.027835467033242], [97.69569752372178, 23.03238733790539], [97.69569752372178, 23.041206586314956], [97.69380819199455, 23.04713948579871], [97.69711998410003, 23.054008720725903], [97.70585947973126, 23.065849328783543]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
