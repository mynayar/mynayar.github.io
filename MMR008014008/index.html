
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Nar Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Nar Su</div><div class="name-mm">ချောင်းနားစု</div></div>
        <span class="pcode-badge">MMR008014008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58810937944435, 18.23066883839624], [95.58810937944435, 18.226142553236286], [95.58634915708797, 18.222370649985578], [95.58433747529432, 18.220861887965782], [95.57880534968717, 18.2175929053883], [95.5780509686773, 18.216084143368562], [95.57729658766743, 18.211557859107984], [95.57729658766743, 18.20854033596777], [95.57553636621037, 18.204265512043776], [95.57000424060328, 18.200242147557105], [95.5647257292091, 18.195402937895324], [95.55768053562826, 18.197751334856264], [95.55195631663076, 18.199659407555657], [95.55151599326854, 18.2027416800845], [95.5484337207397, 18.205823951714024], [95.55189910266154, 18.2110549384347], [95.55441370602779, 18.21683852437843], [95.5559224671482, 18.218095825162266], [95.55818561017782, 18.219101665609458], [95.56019729197152, 18.218850206172135], [95.56371773488564, 18.219856046619327], [95.5667352580258, 18.223879411105997], [95.56715306865925, 18.227221897972242], [95.5710100819498, 18.22714839368348], [95.57754804800408, 18.227651315256026], [95.58308017361117, 18.229160076376502], [95.58810937944435, 18.23066883839624]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
