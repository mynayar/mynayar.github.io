
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Hnauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Hnauk</div><div class="name-mm">အုံးနှောက်</div></div>
        <span class="pcode-badge">MMR009024027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.22241823321497, 21.872358538715616], [94.22299168771627, 21.87092489976436], [94.23222388592364, 21.87165375711527], [94.24528879324328, 21.873237382299408], [94.24752989838618, 21.86606584836028], [94.25190304429015, 21.858777271254098], [94.25799981823707, 21.855413534307218], [94.26060540511543, 21.848070516741018], [94.26033122160862, 21.83765158395346], [94.2556701199801, 21.823119912953644], [94.24881555929068, 21.809684973282913], [94.24168681509451, 21.80228204737864], [94.2414341047002, 21.80186852201473], [94.23756884192858, 21.804841801208227], [94.23223863660388, 21.812352544134626], [94.23270979142382, 21.812373330165087], [94.22882255012064, 21.81941895542053], [94.22396349781724, 21.82573572242569], [94.22299168771627, 21.829622962829546], [94.22299168771627, 21.83691153993567], [94.22299168771627, 21.843471258791624], [94.22217270300791, 21.8441413382522], [94.22250578311548, 21.844200117041794], [94.22323464136565, 21.84808735834497], [94.22129102026446, 21.856590698302114], [94.22007625741338, 21.86412222815835], [94.22104806841367, 21.868738325913057], [94.22201987761531, 21.87165375711527], [94.22241823321497, 21.872358538715616]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
