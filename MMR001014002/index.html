
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zi Aun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Puta-O</div><div class="name-mm">ပူတာအို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zi Aun</div><div class="name-mm">ဇီးအွန်</div></div>
        <span class="pcode-badge">MMR001014002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.5395555420547, 27.377740835271368], [97.54404350800155, 27.371660365133778], [97.54959817601508, 27.366290851341773], [97.5573747117736, 27.360736183328243], [97.55944654112506, 27.359493086436828], [97.55715110434005, 27.35660451528622], [97.54224307066124, 27.348472860634047], [97.54224307066124, 27.343051758132162], [97.53478905517079, 27.326110812364163], [97.51581519461558, 27.308492228333705], [97.50090716273542, 27.30510403882039], [97.48938731856998, 27.302393487569475], [97.48605467388415, 27.300449444686194], [97.48667676821833, 27.31662388208656], [97.48328857870501, 27.330854276603645], [97.48637984175633, 27.350432278327048], [97.49616369759661, 27.354571602297653], [97.52936795176964, 27.372190186328112], [97.53746435839349, 27.376601466184752], [97.53898408404831, 27.377429480086505], [97.5395555420547, 27.377740835271368]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
