
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo</div><div class="name-mm">အုပ်ဖို</div></div>
        <span class="pcode-badge">MMR005009049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26705164012117, 22.787373779676216], [95.26705164012117, 22.787246610142972], [95.26128840043941, 22.787374679897596], [95.25570407997935, 22.787498700005074], [95.2560622799503, 22.78785707984042], [95.24751516009661, 22.792741199846546], [95.23835747971395, 22.80220406966214], [95.23225260017739, 22.808919689592074], [95.23178999970878, 22.811232690136592], [95.24171555992518, 22.812277500006644], [95.24782044036107, 22.817772089710218], [95.24568384003726, 22.82326668031311], [95.2469045995677, 22.828150710387035], [95.25239928010274, 22.83242426986419], [95.25632147985249, 22.832685809802342], [95.25880979963262, 22.82906646034894], [95.2624728003795, 22.823571869746047], [95.2649146800685, 22.81899311993658], [95.2639988401744, 22.812277500006644], [95.26186223985053, 22.806782910303127], [95.26430412043885, 22.80037256973833], [95.26705164012117, 22.79823569961792], [95.26726439993217, 22.798248300019054], [95.26705164012117, 22.793351670443315], [95.26705164012117, 22.787373779676216]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
