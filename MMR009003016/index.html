
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Pa Don</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Pa Don</div><div class="name-mm">မြေပဒုံ</div></div>
        <span class="pcode-badge">MMR009003016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.87166402537451, 20.69517586127705], [94.8712960488736, 20.69272268610314], [94.84825021727374, 20.685520862997464], [94.84269285219341, 20.687710127620335], [94.85017070331537, 20.69560341516552], [94.85305143237775, 20.708566694597323], [94.84200863718894, 20.70568596643426], [94.82760499277623, 20.70760645157651], [94.82136341269143, 20.713367909701333], [94.8194429266498, 20.721529975827764], [94.81911764906033, 20.72261423625804], [94.82794318193237, 20.723194862852665], [94.83108264774603, 20.729892392020304], [94.83296632813358, 20.735752729704757], [94.83861736839691, 20.738892196417794], [94.8409196436267, 20.733659751896084], [94.84761717279434, 20.72759011589119], [94.87147712017304, 20.730520285183047], [94.88298849812077, 20.730520285183047], [94.88901890120138, 20.730170697120002], [94.88696515541767, 20.72382275601541], [94.88696515541767, 20.716497333685027], [94.88826089592368, 20.707982465318594], [94.87849787107996, 20.706166088394298], [94.87273641295513, 20.7023251163111], [94.87166402537451, 20.69517586127705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
