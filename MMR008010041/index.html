
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Okpho</div><div class="name-mm">အုတ်ဖို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div>
        <span class="pcode-badge">MMR008010041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.775034172689, 18.16497951429318], [95.7782991110152, 18.16747030541029], [95.78417642789987, 18.17154844310619], [95.78945401928763, 18.174427128908917], [95.79281248530799, 18.17466702036677], [95.79581111638998, 18.175146800584457], [95.79976930880662, 18.173347622294955], [95.80288788516782, 18.173227677015745], [95.80672613320456, 18.172028224223197], [95.80929990836415, 18.171823903650306], [95.80816301511112, 18.165912062691575], [95.80432374994115, 18.162958781722466], [95.80018915820312, 18.156756893216084], [95.80137046987136, 18.15085033217713], [95.79782653306813, 18.14612508280635], [95.79516858136498, 18.147011067007213], [95.79014800362751, 18.14789705210734], [95.78660406682428, 18.141695162701637], [95.78512742678936, 18.1484877079414], [95.78525658472364, 18.152388820387785], [95.78527099276215, 18.153363955282373], [95.77822738108881, 18.16065044955866], [95.77531278265883, 18.164050814093855], [95.775034172689, 18.16497951429318]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
