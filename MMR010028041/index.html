
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koke Ko Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koke Ko Kone</div><div class="name-mm">ကုက္ကိုကုန်း</div></div>
        <span class="pcode-badge">MMR010028041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.95477119563424, 20.76457704269643], [95.9613830823634, 20.76457704269643], [95.9666725906676, 20.76160169416289], [95.96898675133758, 20.759948723155105], [95.96980052087741, 20.758321182276802], [95.97030912796396, 20.757303968103713], [95.97125925810832, 20.75631064981667], [95.97473667475782, 20.75270256796921], [95.97447522924847, 20.752390225328668], [95.97430229231702, 20.752183913656722], [95.9739619870561, 20.750970340608774], [95.97367893983125, 20.749961160079522], [95.96960760011069, 20.75077542694447], [95.96473705896818, 20.750111263224255], [95.95461988919658, 20.749471412675632], [95.95029258713328, 20.74967002884881], [95.94651343264889, 20.75048680392291], [95.94570350591215, 20.75066192260971], [95.94468188056442, 20.74977921823637], [95.93994157834123, 20.745683498794506], [95.9405536650197, 20.75137519830679], [95.94125361186474, 20.755672205807684], [95.94060360437288, 20.760005592684024], [95.93923326420384, 20.76457704269643], [95.94121682869377, 20.76457704269643], [95.94981228081218, 20.76457704269643], [95.95477119563424, 20.76457704269643]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
