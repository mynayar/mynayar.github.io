
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Khoke Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Khoke Pin</div><div class="name-mm">လက်ခုပ်ပင်</div></div>
        <span class="pcode-badge">MMR009013029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93933466296437, 19.672488263122887], [94.94008131699923, 19.67144294783384], [94.94332134770207, 19.66901292390736], [94.95466145786003, 19.66037284023446], [94.96168152708088, 19.64795271984218], [94.97318384525829, 19.642079196297914], [94.97437165003169, 19.64147265663786], [94.97491165514884, 19.6322925678478], [94.9715149517537, 19.626021730118794], [94.96611978659894, 19.63141689437424], [94.94427384396278, 19.63303511198086], [94.92849621802611, 19.628585012888095], [94.919191465214, 19.61968481290387], [94.91150492910924, 19.611998277698433], [94.90924418277285, 19.6088332342664], [94.90665027538995, 19.61402104993158], [94.9030092846508, 19.616852932317045], [94.9003485612372, 19.616852932317045], [94.90058195779119, 19.622921249016485], [94.9030092846508, 19.63263055825371], [94.90584116613695, 19.64274442031882], [94.9102912661291, 19.650430956423577], [94.91595502910138, 19.653262837010345], [94.92485522818629, 19.65447650088987], [94.93537364487787, 19.652453727757404], [94.93982374397069, 19.652858283283194], [94.94103740785016, 19.660949373115102], [94.93861008099049, 19.669445016674217], [94.93933466296437, 19.672488263122887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
