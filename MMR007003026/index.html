
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zwe Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zwe Bar</div><div class="name-mm">ဇွဲဘာ</div></div>
        <span class="pcode-badge">MMR007003026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57023354504213, 17.10255576633557], [96.57005089183525, 17.10006160995539], [96.5717670537066, 17.091855057964608], [96.57347920460165, 17.087751782418877], [96.56903937936391, 17.086384023304106], [96.56494117959181, 17.085016265088598], [96.56463612235922, 17.0848438992266], [96.55687219419644, 17.080457069238378], [96.55197005087723, 17.074245164982415], [96.54890041921902, 17.06911606965093], [96.54411830031938, 17.068432190093574], [96.53898849991941, 17.074245164982415], [96.53488281239191, 17.08022910908619], [96.53077592067228, 17.087751782418877], [96.52975145256755, 17.092871645310254], [96.52813251999987, 17.096300273738677], [96.52496957828345, 17.106558464401644], [96.52465190356259, 17.107868871051608], [96.5222340600539, 17.117842473051724], [96.52291793961126, 17.122629629054188], [96.52633700914572, 17.123315266786165], [96.53078241018017, 17.123633003560315], [96.53581983761546, 17.12397100116084], [96.54158376977523, 17.1239891332919], [96.54035649195862, 17.11818441328012], [96.53796290406484, 17.113739196606673], [96.54138230275112, 17.110661739947375], [96.54445976030973, 17.10690040373072], [96.54958886193651, 17.105190705286873], [96.55505990918749, 17.10724234305974], [96.56360841759448, 17.109977861289337], [96.5687375237178, 17.111687558833808], [96.57044721676573, 17.105190705286873], [96.57023354504213, 17.10255576633557]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());

</body>
</html>
