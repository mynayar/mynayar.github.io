
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Yae Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Yae Kan</div><div class="name-mm">နတ်ရေကံ</div></div>
        <span class="pcode-badge">MMR007002050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.87592607942508, 17.265235059350573], [96.87340432734788, 17.262595621990386], [96.87324915832204, 17.26233408295161], [96.8731972071854, 17.262251385792865], [96.87299701629934, 17.262034034043495], [96.8718730876729, 17.2608137619456], [96.87153890859383, 17.26045093856004], [96.87076985424545, 17.259615960308395], [96.87214688267255, 17.25670840357003], [96.87514259995106, 17.25336709121831], [96.8767130446713, 17.249084060980692], [96.87708806466253, 17.247583981915284], [96.87771241809367, 17.24508656729131], [96.87842625676637, 17.23694880983976], [96.87828348759291, 17.230952568406337], [96.87871179241534, 17.221815438431804], [96.87867163408868, 17.219737811151106], [96.85676223978561, 17.22713312519363], [96.85311765355692, 17.232064036925806], [96.85275634462965, 17.23676104398703], [96.85131111161854, 17.241096743020307], [96.84740613928199, 17.243006047790914], [96.84464632676662, 17.243343442845685], [96.84625279742869, 17.246877675064695], [96.8458914876021, 17.254103841019514], [96.85468692106463, 17.25883638659002], [96.86759496503566, 17.267040133595344], [96.87592607942508, 17.265235059350573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
