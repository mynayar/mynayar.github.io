
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Poet Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Poet Gyi</div><div class="name-mm">တောင်ပို့ကြီး</div></div>
        <span class="pcode-badge">MMR014002006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.91834576484524, 20.59299397129479], [96.91814616031712, 20.593085219207524], [96.90248491025045, 20.5986785229955], [96.88938625766974, 20.60384904289907], [96.88906098187886, 20.602780278686964], [96.88367911499921, 20.602147118194978], [96.87638282710583, 20.60128873059051], [96.86992500863232, 20.603226077121803], [96.86892508932146, 20.60352605318485], [96.86817931482358, 20.61657709385787], [96.86258601103566, 20.6389503090096], [96.86333178463423, 20.652374237381196], [96.86344054414587, 20.652498532681193], [96.86333178463423, 20.65162846378263], [96.87116241011717, 20.649764028886864], [96.88160324319517, 20.653120010979762], [96.88645077338452, 20.658340427968426], [96.89577294606465, 20.658340427968426], [96.90434934514622, 20.654984445875527], [96.9077597928802, 20.64913796404585], [96.90956976213488, 20.64603515999471], [96.91030474656685, 20.64601984813754], [96.92746833299725, 20.6456622731954], [96.92976400900187, 20.646646134211778], [96.91834576484524, 20.59299397129479]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
