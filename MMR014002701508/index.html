
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Li Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Mong Li Ward</div><div class="name-mm">မိုင်းလီရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014002701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93071342657004, 20.65568054483515], [96.93074673902419, 20.655880419559708], [96.9308799888405, 20.65604222290807], [96.93118455984927, 20.65625161547655], [96.93153196115611, 20.65671798983368], [96.93190791599494, 20.65704635545245], [96.93216965670564, 20.657522247653674], [96.93225531730172, 20.657745916988233], [96.93265248900138, 20.65767671433059], [96.9334020192183, 20.657533946670355], [96.93412299590301, 20.657419732542053], [96.93555781088952, 20.65731979517966], [96.93595042195545, 20.657269826498577], [96.93690696527983, 20.65704853662504], [96.9377492944759, 20.656741586155363], [96.93778182369078, 20.65506904318562], [96.93778179528613, 20.65493708945519], [96.93700513921391, 20.654931378748813], [96.93612759399502, 20.65494280016162], [96.93523862736316, 20.654938993024075], [96.93421260377738, 20.654927571611267], [96.93340929774183, 20.65492376447355], [96.9327392415226, 20.65491424662963], [96.93183504634044, 20.654902825216823], [96.93107361881852, 20.654899018079107], [96.93073097643384, 20.654908535923425], [96.9307277531496, 20.654962624017912], [96.93071342657004, 20.65568054483515]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
