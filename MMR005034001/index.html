
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khaung Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khaung Khan</div><div class="name-mm">ခေါင်ခန်း</div></div>
        <span class="pcode-badge">MMR005034001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99179559019439, 24.92312658062724], [94.96312813425607, 24.92680965873882], [94.93076746394735, 24.9240732789587], [94.94325963442463, 24.94370383166654], [94.9559897511262, 24.9565529223795], [94.96848192070416, 24.973209149083004], [94.9762151693946, 24.98510645399972], [94.9809740911814, 24.995814027795177], [94.99125009741414, 25.001195809239277], [95.00552686277456, 24.998340456347023], [95.01726087239143, 25.003547277384996], [95.0690141482844, 24.990460241347137], [95.11779309907234, 24.986891048882853], [95.13233242240341, 24.977844360129154], [95.12112434531235, 24.967498442399233], [95.0925708118935, 24.95143708035704], [95.04878873001593, 24.9553631912583], [95.02618385040444, 24.95000940391094], [95.00952762280161, 24.945250482124095], [94.99287139609811, 24.925025062956365], [94.99179559019439, 24.92312658062724]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
