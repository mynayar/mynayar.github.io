
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htar Nar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ahlone</div><div class="name-mm">အလုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Htar Nar Ward</div><div class="name-mm">ဌာနာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013037701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12712974524163, 16.786722183382096], [96.12697219840828, 16.78703975558028], [96.12683677669594, 16.787346522424116], [96.1264190676859, 16.78823280340123], [96.1263027187955, 16.788526534571986], [96.12611579920485, 16.78898429758732], [96.12598037659319, 16.789320946204725], [96.12588344856238, 16.78962031342678], [96.1258522924494, 16.789988737790054], [96.12667083738927, 16.79041099557105], [96.12713050876602, 16.790620803807087], [96.12739372234245, 16.790742874184332], [96.12791681301059, 16.79098653829817], [96.12804094913054, 16.790753046416], [96.12824058513496, 16.79033088666114], [96.12863349893689, 16.7895107274382], [96.12876319916239, 16.789243698038263], [96.12911415059762, 16.788499831901788], [96.12934970912181, 16.788012504573487], [96.12946371617761, 16.787721287007855], [96.12885856597012, 16.7874622345945], [96.12737846444463, 16.786840438835213], [96.12712974524163, 16.786722183382096]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
