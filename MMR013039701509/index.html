
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Lun( North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sanchaung</div><div class="name-mm">စမ်းချောင်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Lin Lun( North) Ward</div><div class="name-mm">လင်းလွန်း (မြောက်) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013039701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12994607295298, 16.80904102372432], [96.1299304957958, 16.808640480074132], [96.1299304957958, 16.808048248627813], [96.12991142297386, 16.807579040840096], [96.12988090537954, 16.807113647976507], [96.12984199531189, 16.806741459950445], [96.12915897370772, 16.806779861001814], [96.12866274488982, 16.806772232052936], [96.12786674505429, 16.806737900433802], [96.12696266199731, 16.806721686556614], [96.12645981506847, 16.806667502403343], [96.1264705655642, 16.807411194071392], [96.12648916264482, 16.808571815936602], [96.12642335925068, 16.809192180874504], [96.12641438761398, 16.80948140464318], [96.12944316756818, 16.809560060248657], [96.12964015506918, 16.809275946427817], [96.12994607295298, 16.80904102372432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
