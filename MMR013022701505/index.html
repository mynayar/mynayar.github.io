
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Taw Ka Lay (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Taw Ka Lay (East) Ward</div><div class="name-mm">ကန်တော်ကလေး (အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16767252396784, 16.786501810809966], [96.16647021043195, 16.786540348558276], [96.16620318103202, 16.786550521689264], [96.16492826342869, 16.78659283029492], [96.16487121583401, 16.787511825910087], [96.16489410358008, 16.788490294591497], [96.16508674555695, 16.789048802360412], [96.1658630376491, 16.7890300748781], [96.16655349844524, 16.789022445929163], [96.16769842714075, 16.788982911732035], [96.1678085329375, 16.78869891212514], [96.16769981389535, 16.78707885810286], [96.16767252396784, 16.786501810809966]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
