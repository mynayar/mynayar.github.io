
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kone</div><div class="name-mm">အုပ်ရှစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010015042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15457734996477, 21.406331334723347], [96.15651572442118, 21.402259751286522], [96.16209740627033, 21.400112949952756], [96.16596164741213, 21.400542309679906], [96.1704234997448, 21.401508594346183], [96.17193921891987, 21.400268459821632], [96.17827767937149, 21.3955835117697], [96.18581190089856, 21.39090735009421], [96.18105434428264, 21.387064707969955], [96.17556485373507, 21.380843286188735], [96.17377480356441, 21.377585394050755], [96.1714927918589, 21.375474533223155], [96.16879448397833, 21.382490132813416], [96.16806255184537, 21.387430673586778], [96.16385394410429, 21.389626469086352], [96.1616581477054, 21.389626469086352], [96.14939828919972, 21.388528571336565], [96.14463277628164, 21.389654314794825], [96.14685512066734, 21.39367254774993], [96.14728448129381, 21.40032762981633], [96.14792852088459, 21.404406551721024], [96.14853765059217, 21.40708672117529], [96.15140812018865, 21.406331334723347], [96.15457734996477, 21.406331334723347]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
