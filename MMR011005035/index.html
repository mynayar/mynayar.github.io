
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Set Thwei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mudon</div><div class="name-mm">မုဒုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Set Thwei</div><div class="name-mm">ဆက်သွယ်</div></div>
        <span class="pcode-badge">MMR011005035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.76704099974239, 16.075726999701317], [97.77035759602632, 16.067591791827795], [97.77035759602632, 16.06426225160169], [97.76924774898447, 16.062264528185494], [97.76327999987217, 16.059551000178544], [97.75615155874749, 16.058491050221846], [97.74882657078967, 16.057381203180057], [97.74216749123678, 16.057159234311257], [97.73949354958768, 16.056475575987065], [97.7399169594002, 16.057517812896776], [97.73454799959057, 16.062960000004068], [97.73378000014696, 16.0637270003009], [97.73340399989473, 16.066291999875943], [97.7330575001036, 16.06788949980063], [97.7325720001977, 16.069155999749626], [97.73224000017592, 16.070268999814516], [97.7322099996918, 16.071237000387327], [97.7349310001656, 16.074269999960563], [97.73897999982717, 16.07535200039456], [97.74099600016535, 16.07619999993011], [97.74276900008937, 16.0775269999711], [97.74567600014734, 16.078916000173308], [97.74834800016015, 16.080538000328488], [97.75180100021606, 16.082571999698075], [97.75493800008871, 16.083850000177392], [97.76211600015336, 16.08679500018917], [97.76389200021572, 16.083269000364112], [97.76602000032284, 16.080078999846023], [97.76634900020628, 16.07761799967102], [97.76704099974239, 16.075726999701317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
