
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Paw Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Paw Thaung</div><div class="name-mm">ရေပေါ်သောင်</div></div>
        <span class="pcode-badge">MMR007005047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.83547122201935, 17.866884267295177], [96.8362195209142, 17.868162846038558], [96.84219489178088, 17.86849481098676], [96.84850222759576, 17.869158740883222], [96.85119400729764, 17.869476519925513], [96.8548349944395, 17.866240055034552], [96.85922968540171, 17.862431284975855], [96.863161613118, 17.86122987975517], [96.87182770788246, 17.857743676729342], [96.87505049858169, 17.853934887784874], [96.87475761367301, 17.848954088860182], [96.86977713041028, 17.843973214392406], [96.86404239294217, 17.840532088085467], [96.85805826177943, 17.836941313690716], [96.85249184502271, 17.831081466136823], [96.8495622063308, 17.824928674318926], [96.85112126923127, 17.82083616905402], [96.84617847295823, 17.821189788777758], [96.84020310119223, 17.82185371867422], [96.8361285149191, 17.82340419484774], [96.835887555966, 17.827995072914348], [96.83489166022201, 17.835630269421472], [96.83489166022201, 17.844261360773203], [96.835887555966, 17.85056869658814], [96.83422773032555, 17.857539964098123], [96.83389576537735, 17.860859613580374], [96.83455969527375, 17.865175159705927], [96.83547122201935, 17.866884267295177]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
