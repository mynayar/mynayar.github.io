
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Hei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Hei</div><div class="name-mm">ကွမ်ဟယ်</div></div>
        <span class="pcode-badge">MMR015016020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.17262561727847, 22.821078627976362], [97.1682704973856, 22.820497827812574], [97.16691591873473, 22.818309458015108], [97.16101629776398, 22.82787995419659], [97.14203672201717, 22.82991347962343], [97.13864751177329, 22.835675137397743], [97.13942423913738, 22.83745873223478], [97.14322294488306, 22.84618168843423], [97.14794363109377, 22.851793252057007], [97.14818591025164, 22.85322529111437], [97.14792766542945, 22.85408610778768], [97.14611703517312, 22.857707370099092], [97.14309931688001, 22.860725086593504], [97.14973829658516, 22.868872926344523], [97.1572825914185, 22.874606590022154], [97.15810676611443, 22.87501867737012], [97.15773585692432, 22.87538958656023], [97.15719147480678, 22.87593396867777], [97.16067994862078, 22.88114684844834], [97.1609811189835, 22.881633353796303], [97.16169414017247, 22.882785156909506], [97.17203123105651, 22.886513288357605], [97.18422801111387, 22.88614500878515], [97.18931620168144, 22.87058400075108], [97.19812814759598, 22.851265502900674], [97.19592516201669, 22.851265502900674], [97.1876215965595, 22.85329902922689], [97.18619201714796, 22.8525150659176], [97.18863836017226, 22.85041820123905], [97.18880782122403, 22.842792478190347], [97.18982458393748, 22.83703082131541], [97.19157733742423, 22.833365971562387], [97.18406292706248, 22.827202111788097], [97.16956346168445, 22.828769621121182], [97.17262561727847, 22.821078627976362]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
