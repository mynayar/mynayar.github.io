
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Toke Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Toke Kan</div><div class="name-mm">ရွှေတုတ်ကန်</div></div>
        <span class="pcode-badge">MMR009002011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97027542607009, 20.504639420372996], [94.96825517103935, 20.503180346795602], [94.96230538678424, 20.50272267191383], [94.95623906657971, 20.502256031690536], [94.96178496080734, 20.52752065985061], [94.95870390865849, 20.544158340734896], [94.9589365461847, 20.547298936996413], [94.96363359191679, 20.545390761774286], [94.97811453755594, 20.552785287111362], [94.97780643162156, 20.558331181338986], [94.98427664185363, 20.561720339422152], [94.98328411766795, 20.56524931240591], [94.98920632601119, 20.564493285636672], [95.00091432363718, 20.564493285636672], [95.01200611209248, 20.560796023417822], [95.01657805313471, 20.544222734891378], [95.01385474320188, 20.542925919695506], [95.0061521128298, 20.53676381629714], [94.98889822007686, 20.52259097569305], [94.97934695859533, 20.511191083102062], [94.97027542607009, 20.504639420372996]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
