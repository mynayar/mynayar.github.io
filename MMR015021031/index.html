
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Ping</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Ping</div><div class="name-mm">နမ့်ပိန်</div></div>
        <span class="pcode-badge">MMR015021031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.74324379336645, 23.204996349601913], [98.73667156584014, 23.188619678955092], [98.73300373213658, 23.185196367318554], [98.71041965564268, 23.189440051317376], [98.70414113860272, 23.19225455790155], [98.7024893906729, 23.19299499672178], [98.69729370144324, 23.195729570663218], [98.69319183963177, 23.201745634053793], [98.68717577714045, 23.21131664284883], [98.67842513980844, 23.221708024905467], [98.67112731137638, 23.228348795160798], [98.67375311501428, 23.23032217123125], [98.68172371907445, 23.237733914988212], [98.6855135242298, 23.24125799566002], [98.69069874894814, 23.244367202884177], [98.69079211296571, 23.244422591229636], [98.69086244174832, 23.24446431527599], [98.69093090443772, 23.2445049295589], [98.69111404237918, 23.24461528806512], [98.6912020149611, 23.244586269640706], [98.70686529659622, 23.239419782297148], [98.71294756537787, 23.235618365095547], [98.71905558894434, 23.237886662139772], [98.72163140916228, 23.23045866133822], [98.74324379336645, 23.204996349601913]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
