
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ya Thit</div><div class="name-mm">ရသစ်</div></div>
        <span class="pcode-badge">MMR010019036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.91946062670661, 21.417724816946816], [95.91492410995977, 21.417724816946816], [95.90585107736541, 21.4193744595637], [95.9000773291055, 21.42019928087217], [95.8897670640988, 21.4226737438982], [95.8863105611835, 21.4226737438982], [95.88673674810252, 21.430806490327313], [95.88673674810252, 21.434988208339178], [95.88534284209857, 21.44102846709012], [95.88439187918192, 21.444119096119437], [95.88646777886498, 21.444119096119437], [95.89100429561182, 21.445356326733133], [95.89306634933263, 21.449480433275426], [95.8971904549756, 21.45277971760993], [95.90172697082312, 21.45277971760993], [95.90626348756996, 21.45277971760993], [95.91121241542072, 21.45277971760993], [95.91338042276834, 21.452095084420648], [95.91327446824215, 21.450717664788442], [95.91327446824215, 21.44659355914547], [95.91533652106364, 21.442469452603177], [95.91657375257665, 21.43587088393417], [95.91904821560274, 21.42514820782361], [95.91946062670661, 21.417724816946816]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
