
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mone Dar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mone Dar</div><div class="name-mm">မုန်းဒါး</div></div>
        <span class="pcode-badge">MMR009015008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.90270912422676, 19.156043820565912], [94.90296922614891, 19.154134717243437], [94.9061385710383, 19.14819219501385], [94.9161422328778, 19.138458902656282], [94.93560881759294, 19.128455240816777], [94.93661723369843, 19.126903831146933], [94.93912361816052, 19.12304785567403], [94.93993472570708, 19.119533056005764], [94.94723469542492, 19.110881240676747], [94.9471976784302, 19.11083043257844], [94.93344586443516, 19.091955394026286], [94.93320526611018, 19.091785881713122], [94.93263475598928, 19.093307241436094], [94.90289414085197, 19.105473856433377], [94.8958645397168, 19.10844791803703], [94.89099649779018, 19.10970689425784], [94.88369792471951, 19.12899597888139], [94.87535551484518, 19.14215131932798], [94.87365830798461, 19.143878795570004], [94.874637994348, 19.14779754192307], [94.87924290813379, 19.148057408222883], [94.8801929258629, 19.14806528718333], [94.88067722967048, 19.147165467812158], [94.88589909276897, 19.151476146806772], [94.89005331310995, 19.151080508059067], [94.88985549103813, 19.15563036714775], [94.89378140768588, 19.155742535989305], [94.89677919340511, 19.15582818742098], [94.90270912422676, 19.156043820565912]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
