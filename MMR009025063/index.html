
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Shin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Shin</div><div class="name-mm">ရေရှင်</div></div>
        <span class="pcode-badge">MMR009025063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.07445416103076, 21.37995375775978], [94.07445035959648, 21.37974848930139], [94.0748456503066, 21.37243562060746], [94.0718809740278, 21.36709920366536], [94.06792807322205, 21.353856983313165], [94.06101049523824, 21.338440667203088], [94.05965400462867, 21.337380909701267], [94.05767595388221, 21.330969200368372], [94.05774005485972, 21.331738618942154], [94.05711242879562, 21.33324490243035], [94.0554806242315, 21.336131938438257], [94.0519660071256, 21.340274186104864], [94.04832585725256, 21.34516957821353], [94.04792730829871, 21.34576740344295], [94.04581539976095, 21.34893526984689], [94.046138456025, 21.354429295675516], [94.04619183168774, 21.3553370263827], [94.04794896757085, 21.36198985474806], [94.05185277168812, 21.36887952407085], [94.05435021868772, 21.373287170666458], [94.05836669886412, 21.379940038601944], [94.06275970359752, 21.38822473178601], [94.06406846898471, 21.39152813321681], [94.06701754382465, 21.389955729773135], [94.06976787478766, 21.38720539881018], [94.07283253139627, 21.383119190598222], [94.07402434085071, 21.37937350078647], [94.07445416103076, 21.37995375775978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
