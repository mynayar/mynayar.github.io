
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wa Li Chet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wa Li Chet</div><div class="name-mm">ဝါလီချက်</div></div>
        <span class="pcode-badge">MMR001003045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.02073611118266, 26.54812416809591], [98.02293816506432, 26.538956196771096], [98.03417200773202, 26.52678620122225], [98.04166123617716, 26.519296971877793], [98.03510816061316, 26.510871589652197], [98.03042739261014, 26.50338236210638], [98.03206369468381, 26.495609928155716], [98.02668277928689, 26.49589313366124], [98.01451278283872, 26.491212365658214], [97.98642817661914, 26.507126976328948], [97.9572135056988, 26.529348126914556], [97.95180755587404, 26.534043323640503], [97.95479034000226, 26.53608417494479], [97.95408379483132, 26.53852175677372], [97.95683119130649, 26.54142178888452], [97.96044192975131, 26.542520709163455], [97.96387698113784, 26.542520709163455], [97.96530857593007, 26.542520709163455], [97.96907630182994, 26.54346263928943], [97.97535193834136, 26.545001947681783], [97.98073364783966, 26.545001947681783], [97.98737539296008, 26.54398013887237], [97.99026976203993, 26.54550348969434], [97.99623532759836, 26.542520709163455], [98.00021634121123, 26.53989546940045], [98.00036005916945, 26.539800696145278], [98.00044545699228, 26.539905644330076], [98.00282884927202, 26.542834684972775], [98.00518367818427, 26.54330565003579], [98.0065288229469, 26.542119965863776], [98.00816645961447, 26.541107810377184], [98.01774276541636, 26.544561559568365], [98.02009759432855, 26.546288434163955], [98.02073611118266, 26.54812416809591]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
