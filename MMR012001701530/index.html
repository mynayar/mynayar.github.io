
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Min Ga Lar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung Min Ga Lar Ward</div><div class="name-mm">အောင်မင်္ဂလာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012001701530</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.89623234304827, 20.143296505929072], [92.89546220501683, 20.14150440440477], [92.89641283518426, 20.141585539441166], [92.89608155462008, 20.140801225396274], [92.89497537141631, 20.13842431363122], [92.8941507686431, 20.13844420123894], [92.89436970140065, 20.13900134383698], [92.8923556507927, 20.138928896251628], [92.891768285578, 20.141156350585163], [92.89065447522393, 20.14102546055659], [92.88920168970628, 20.14089848797488], [92.88933105808195, 20.14133164913636], [92.88963392096872, 20.141689902167286], [92.89018393104362, 20.14236566264526], [92.89197863880321, 20.14265237280881], [92.89407082880575, 20.142553756750544], [92.89478246054216, 20.143791338099845], [92.89623234304827, 20.143296505929072]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
