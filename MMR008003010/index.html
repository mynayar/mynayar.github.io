
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dant Da Lun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Padaung</div><div class="name-mm">ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dant Da Lun</div><div class="name-mm">ဒန့်ဒလွန်</div></div>
        <span class="pcode-badge">MMR008003010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06323794487531, 18.836677386752058], [95.06328115100439, 18.836726228932378], [95.06630527067176, 18.83572930796123], [95.07991327587706, 18.833538311244126], [95.08712179623399, 18.832983809954897], [95.09765732522544, 18.826884293075693], [95.10708385073917, 18.826884293075693], [95.11706487934077, 18.83076580299945], [95.12112138384487, 18.82410124297803], [95.12442625566723, 18.820195486432624], [95.1274306837791, 18.8033706863082], [95.12202271317773, 18.799164486951554], [95.11150721298753, 18.799765371674596], [95.10579879867566, 18.799765371674596], [95.10129215560858, 18.797361829185093], [95.10153883604852, 18.790841693089703], [95.0610602230509, 18.785851178788903], [95.0610602230509, 18.790841693089703], [95.06549623516321, 18.79472320301346], [95.07381375899786, 18.80359522813734], [95.07325925680931, 18.814130757128794], [95.06394013193159, 18.834806388604022], [95.06323794487531, 18.836677386752058]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
