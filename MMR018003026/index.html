
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwe Yit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwe Yit</div><div class="name-mm">ဇရပ်ကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR018003026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21571938074487, 20.096515846928867], [96.22189122559962, 20.09273310325017], [96.22718615771504, 20.088995504638888], [96.2299893571232, 20.084634971726587], [96.23497282163845, 20.076848307803232], [96.2422898011335, 20.070395307897172], [96.24865280138573, 20.064277039254023], [96.25329084439699, 20.06279286469902], [96.2504882817089, 20.059056115047724], [96.251140898134, 20.052203654275274], [96.2499497469833, 20.048289873079227], [96.24400291700107, 20.051551037850174], [96.23812937816831, 20.05595619242439], [96.23421368501363, 20.05962715397004], [96.23146552141674, 20.061735955350116], [96.22839842135011, 20.062630526277815], [96.2165889936872, 20.07109104321711], [96.21721192708884, 20.081992373249477], [96.21627752698635, 20.095073970187627], [96.21571938074487, 20.096515846928867]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
