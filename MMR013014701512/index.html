
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Mon Nar (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawbon</div><div class="name-mm">ဒေါပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ya Mon Nar (1) Ward</div><div class="name-mm">ယမုံနာ(၁)ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013014701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19231605514187, 16.777608489740032], [96.19183286019842, 16.776703516354246], [96.19142595924069, 16.775991438554115], [96.19116115566288, 16.775593757446018], [96.19086057525539, 16.775273584408467], [96.19042358388134, 16.77499580361348], [96.19008159688826, 16.775197029619278], [96.18983840941513, 16.775431633063477], [96.18948173559369, 16.775562286570334], [96.18904781360578, 16.77575302108511], [96.1885824207422, 16.77589988667046], [96.18830998731613, 16.775964736783237], [96.18804817218546, 16.776130676089906], [96.18878658303441, 16.777853674607456], [96.18925647700485, 16.77895011905281], [96.19011592940666, 16.778652191645392], [96.19231605514187, 16.777608489740032]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
