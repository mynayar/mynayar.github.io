
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Paung Tu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Paung Tu</div><div class="name-mm">ပေါင်းတူး</div></div>
        <span class="pcode-badge">MMR009010032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.59077155186566, 20.562797563556785], [94.59176826599276, 20.56293347899691], [94.59227095733888, 20.56300202802123], [94.61040918943263, 20.56313066794604], [94.62156919776032, 20.5632098172793], [94.62308727495781, 20.563257257416524], [94.62814753438124, 20.563415389708496], [94.62281593240942, 20.547625646306585], [94.62288590506051, 20.54755567275612], [94.62040012496584, 20.54649033855833], [94.61358205067114, 20.54291896613745], [94.60254326286133, 20.54291896613745], [94.59442650727755, 20.535126881100723], [94.58793310263064, 20.528958147000935], [94.57462162278972, 20.51337397602822], [94.5724262607634, 20.512022983873635], [94.57040091017393, 20.51077661434931], [94.54929734529628, 20.49389376208751], [94.54020657897053, 20.491621070056397], [94.53925083166064, 20.490831539943656], [94.54001388213499, 20.49292992807375], [94.53636425790421, 20.504106903011234], [94.53636425790421, 20.509809442052187], [94.53773286687834, 20.517792994551087], [94.54069818707171, 20.52349553359204], [94.54548831893084, 20.528513767696268], [94.55324377098333, 20.5339882035928], [94.562595934255, 20.542199860135497], [94.56921087867914, 20.550183412634453], [94.5744070103753, 20.557777759236274], [94.58811517757346, 20.56154750501338], [94.59077155186566, 20.562797563556785]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
