
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Aik Hkant</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Aik Hkant</div><div class="name-mm">နားအိုက်ခန့်</div></div>
        <span class="pcode-badge">MMR015012015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.05128022670118, 22.380214512389898], [97.02810433334838, 22.381324979963892], [97.00107915188141, 22.379162964799036], [96.98414337091987, 22.384568000912566], [96.98044368592741, 22.38478562965315], [96.97189195614891, 22.385288672634204], [96.95891986785767, 22.395017738178126], [96.95427935980467, 22.404709447682933], [96.95531651104818, 22.412674189961933], [96.9569550533331, 22.419064502624735], [96.96216288970567, 22.41843956193628], [96.97621598467998, 22.42456526977145], [96.99567411486856, 22.428168628379524], [96.99959931205865, 22.427548859692195], [97.02878598168775, 22.422940437651107], [97.03675239130985, 22.421682583784275], [97.0464494535795, 22.41792141124421], [97.0504451504234, 22.400783110152474], [97.05224682882817, 22.389973037925415], [97.05128022670118, 22.380214512389898]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
