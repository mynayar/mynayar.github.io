
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thea Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thea Kone</div><div class="name-mm">သဲကုန်း</div></div>
        <span class="pcode-badge">MMR017017064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.22301788027102, 16.682464620346025], [95.2226330396831, 16.681647419892556], [95.22217001833172, 16.67997595702485], [95.22135323966035, 16.677027810285267], [95.22342504023345, 16.67382480017443], [95.22810864020164, 16.6693257896535], [95.22827171966418, 16.668197549677245], [95.22718523970713, 16.663562729836144], [95.22641735987332, 16.650309060215022], [95.22194291973, 16.649042939779918], [95.21885339956481, 16.65721124989932], [95.21523252036457, 16.662513149961967], [95.21502620509534, 16.66313188802627], [95.2129936797146, 16.66922678958474], [95.21246881468409, 16.669090832775737], [95.21194427970482, 16.66895490024848], [95.20891452038887, 16.669415790206585], [95.20671564021467, 16.672839930118755], [95.20621416025534, 16.675047989673033], [95.20571268029602, 16.677256050126687], [95.20611587964419, 16.68083462971441], [95.2066944000266, 16.683313049757487], [95.20899480016993, 16.68350205037939], [95.2121898000193, 16.683415559880245], [95.21408988044368, 16.68335679008385], [95.21647271964036, 16.68323519994459], [95.21960004010981, 16.68238623004055], [95.22301788027102, 16.682464620346025]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
