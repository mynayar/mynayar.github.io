
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Ta Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Ta Lin</div><div class="name-mm">ကျွဲတလင်း</div></div>
        <span class="pcode-badge">MMR008009010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6743531100081, 18.021043206978447], [95.66931891383689, 18.021043206978447], [95.65607103135306, 18.020248333993493], [95.64997700483497, 18.021043206978447], [95.64441289304062, 18.021043206978447], [95.63513937458254, 18.021043206978447], [95.63116500965754, 18.021043206978447], [95.63362567618407, 18.02383932872209], [95.63764820609987, 18.030055966110012], [95.64093936685833, 18.032250072682757], [95.64752168837526, 18.032250072682757], [95.65593243233593, 18.03444418015482], [95.66251475295354, 18.03444418015482], [95.6700300446509, 18.040593055425234], [95.67738129910771, 18.039286227177683], [95.68558460004931, 18.038407394385786], [95.68686541091006, 18.03775136593282], [95.68733603602931, 18.03667571021589], [95.68389158582806, 18.034026132999713], [95.6783274749331, 18.02978680981346], [95.67700268722427, 18.027137234395923], [95.6743531100081, 18.021043206978447]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
