
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Myay Yeik Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Myay Yeik Thar</div><div class="name-mm">အောင်မြေရိပ်သာ</div></div>
        <span class="pcode-badge">MMR018003012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2564959499282, 20.143801011207756], [96.24698794313912, 20.148063221240704], [96.24141379491078, 20.14962398296052], [96.24151362055721, 20.149731487917904], [96.24338241986283, 20.1537805541293], [96.24556268586934, 20.15814108614228], [96.2489888186791, 20.16312455065753], [96.24587415257014, 20.168419482772947], [96.25148055138641, 20.170288282977936], [96.257709882705, 20.171534148881904], [96.26425068072439, 20.173714414888366], [96.26892268033748, 20.175271748392504], [96.2729717447503, 20.17651761429653], [96.27608641085925, 20.174025881589216], [96.27702081096169, 20.169665348676972], [96.279512543669, 20.162190150555034], [96.27764374436339, 20.15627228593729], [96.27172587884627, 20.146305356007417], [96.26549654662836, 20.140387491389674], [96.26505142718167, 20.139965798382946], [96.25664489024956, 20.143734244639745], [96.2564959499282, 20.143801011207756]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
