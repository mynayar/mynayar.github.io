
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Chaung</div><div class="name-mm">ပေါက်ချောင်း</div></div>
        <span class="pcode-badge">MMR007010004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32345531461112, 19.148149720932906], [96.32013370370754, 19.143438456919284], [96.31640536541533, 19.140049057817805], [96.31369384559457, 19.136659658716326], [96.31132126676312, 19.13259238033413], [96.31232928986492, 19.126930273013727], [96.30725398838092, 19.123441003299718], [96.3031867090994, 19.120729484378273], [96.29437427215498, 19.119373724018203], [96.28929017440208, 19.11835690374818], [96.28318925637916, 19.114628566355293], [96.27573257799611, 19.114289626265304], [96.27144143677293, 19.113509522846243], [96.27143286173725, 19.118924455099545], [96.26278954320293, 19.11871784934931], [96.2665812009617, 19.125474642041127], [96.27064847934389, 19.130219800603356], [96.27369893835538, 19.136320718626337], [96.28047773565902, 19.14411633709932], [96.2838671347605, 19.14716679611081], [96.29301851269429, 19.153267714133733], [96.30420352936943, 19.15225089386371], [96.31132126676312, 19.15360665422378], [96.31640536541533, 19.151573013683674], [96.32115052397756, 19.149878315032254], [96.32345531461112, 19.148149720932906]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
