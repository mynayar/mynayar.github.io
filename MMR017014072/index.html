
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daunt Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daunt Gyi</div><div class="name-mm">ဒေါင့်ကြီး</div></div>
        <span class="pcode-badge">MMR017014072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0241770321444, 16.5308131802841], [95.02456964287478, 16.53003065768877], [95.0252120978601, 16.529459588189468], [95.02628285496985, 16.529138361146522], [95.02778191600265, 16.529602354664974], [95.02935235982363, 16.530209118256266], [95.03092280364456, 16.5305660366933], [95.03213632902845, 16.53028050194365], [95.03306431876337, 16.52974512293912], [95.0338138488301, 16.528952762659912], [95.0344991340279, 16.52655426626643], [95.03404227842844, 16.52484105417136], [95.03324277933086, 16.52335626987599], [95.0331869233379, 16.52328341489772], [95.03226421711997, 16.522079884579057], [95.0319293158853, 16.52164305778092], [95.03095849593791, 16.519701417886154], [95.03015899684027, 16.517131599743607], [95.02889521104521, 16.514603341071393], [95.0279008558399, 16.51403513861078], [95.02580693014579, 16.51413031656091], [95.02323711200319, 16.515367636207486], [95.02035799722387, 16.516365414232553], [95.01908046978792, 16.5177412132864], [95.01998656372899, 16.518396072620703], [95.02073495975065, 16.51893695997279], [95.02040519994006, 16.524710100290918], [95.0199101995961, 16.5308131802841], [95.0241770321444, 16.5308131802841]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
