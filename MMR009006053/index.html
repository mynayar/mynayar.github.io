
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Htauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Htauk</div><div class="name-mm">တောင်ထောင့်</div></div>
        <span class="pcode-badge">MMR009006053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35840550560965, 20.596718431710315], [95.36898461035156, 20.595883239420004], [95.39762270972034, 20.59240022718876], [95.41194176030405, 20.582725193812678], [95.41852078310774, 20.575372167691455], [95.4189309378126, 20.57550447595088], [95.4196817871848, 20.567245140051227], [95.42193008060877, 20.56050025887987], [95.41929478462669, 20.559892113929948], [95.39143068767618, 20.5540870944439], [95.38678667226719, 20.549443078135596], [95.37943364704523, 20.535124027551888], [95.37633763557346, 20.533963024374145], [95.36224726280102, 20.536247948983714], [95.36201858588907, 20.53628503162895], [95.36008357939374, 20.540155044619667], [95.35823431516155, 20.546011047571824], [95.35892257531668, 20.54557306424556], [95.36395359328378, 20.550991082972132], [95.36279258920666, 20.564923131897046], [95.35853557365783, 20.585434202726333], [95.35776157123956, 20.594722235342942], [95.35840550560965, 20.596718431710315]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
