
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Shar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Shar</div><div class="name-mm">ကြက်လျှာ</div></div>
        <span class="pcode-badge">MMR009004062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55176278972101, 19.800334073059048], [95.5492841430488, 19.806840522372283], [95.549666998833, 19.811434798976848], [95.54736986143001, 19.81794335809957], [95.54736986143001, 19.822920491387606], [95.56153554792724, 19.822920491387606], [95.56421554291302, 19.814880506430256], [95.57761551784193, 19.815263363113786], [95.59063263608732, 19.817177644732567], [95.60326689764929, 19.814880506430256], [95.60556403685086, 19.814497649746784], [95.60822056312855, 19.81363139127575], [95.60563440970031, 19.806303958960598], [95.60758039242126, 19.800855211298995], [95.6017354718146, 19.80377766980365], [95.59369548775663, 19.802246244868343], [95.58718692773459, 19.804926239854126], [95.58220979534582, 19.800331962350242], [95.58067836861187, 19.79612054242915], [95.57225552787037, 19.79535482906215], [95.56076983456029, 19.798417679832085], [95.55176278972101, 19.800334073059048]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
