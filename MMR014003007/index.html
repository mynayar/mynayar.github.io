
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopong</div><div class="name-mm">ဟိုပုံး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Tan</div><div class="name-mm">ကျောက်တန်း</div></div>
        <span class="pcode-badge">MMR014003007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.34306072387335, 20.813421163755777], [97.33205956999325, 20.81525468985211], [97.31141955616766, 20.80686968538771], [97.31141955616766, 20.808893335359187], [97.31304464189674, 20.828394364108647], [97.30491921325114, 20.8424784398282], [97.28704327023081, 20.850603869373117], [97.27404258439782, 20.85114556431637], [97.24587443205945, 20.853312344988808], [97.23341544116971, 20.90369000169227], [97.21878966960765, 20.930233069200824], [97.2074140704031, 20.941066974361433], [97.19495507861404, 20.97898564107453], [97.19436880427696, 20.982034270864972], [97.21590443044516, 20.9861581139059], [97.24401841301943, 20.99207684726872], [97.26917302891223, 20.98171906388376], [97.2709710758545, 20.981179649621197], [97.2702507179963, 20.968693430857172], [97.27837614574258, 20.917232383367832], [97.28541818360236, 20.90856525977898], [97.32875380424474, 20.912898821123747], [97.34229618502098, 20.90856525977898], [97.35150500355314, 20.89556457394599], [97.362880603657, 20.8424784398282], [97.34662974726507, 20.821352325349608], [97.34306072387335, 20.813421163755777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
