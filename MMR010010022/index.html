
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Thay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Thay</div><div class="name-mm">ဆင်သေ</div></div>
        <span class="pcode-badge">MMR010010022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01104806501627, 22.39759800104696], [96.01613472493767, 22.401158663441606], [96.01766072336375, 22.406499656134258], [96.01766072336375, 22.409966173899875], [96.02026986526215, 22.4127492581718], [96.02139004011832, 22.41947031000683], [96.02510162314144, 22.427216558397504], [96.02464295990472, 22.422629922433032], [96.030146923242, 22.41345664960477], [96.03198157708817, 22.40520070594789], [96.0356508856799, 22.399696742610615], [96.03668837416922, 22.398412233737645], [96.0295560120004, 22.395209950279025], [96.02537387130718, 22.393202522278614], [96.02085715763178, 22.38918766627785], [96.01634044575502, 22.385172811176346], [96.01399844657112, 22.381994384033646], [96.01266016183706, 22.385005524685255], [96.00948173469436, 22.387849380644468], [96.0078088778775, 22.390693236603624], [96.00814344906098, 22.393871663746324], [96.01104806501627, 22.39759800104696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
