
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dawng Shar Lar (Dawng Ga)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Machanbaw</div><div class="name-mm">မချမ်းဘော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dawng Shar Lar (Dawng Ga)</div><div class="name-mm">ဒေါင်ရှာလာ (ဒေါင်ဂါး)</div></div>
        <span class="pcode-badge">MMR001016011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.91235797773857, 27.13188290357317], [97.9343585830822, 27.132406728088085], [97.94745418066594, 27.120882602250333], [97.96316889812618, 27.104644061174554], [97.97626449570998, 27.082643455830862], [97.98255038269406, 27.074262274384523], [98.01072046857485, 27.061457689320946], [97.98097891094807, 27.060642852285866], [97.93907299832028, 27.059595204155414], [97.90869121063093, 27.06273814764745], [97.88564295895543, 27.072690801739157], [97.88040472010181, 27.09573905431398], [97.87254736137169, 27.12664466471955], [97.89873855743855, 27.128739960980454], [97.91235797773857, 27.13188290357317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
