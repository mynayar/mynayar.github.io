
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baw Kar Ward (Baw Ga Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Baw Kar Ward (Baw Ga Ward)</div><div class="name-mm">ဘော်ကာရပ်ကွက် (ဘောဂရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR013038701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12224753269754, 16.800745705949623], [96.122232437577, 16.801591873566167], [96.12224006742525, 16.80252138765195], [96.1222591402472, 16.80349032082171], [96.12226113044687, 16.803801577980494], [96.12311077124514, 16.803869246568524], [96.1235332475614, 16.803869246568524], [96.12420082061146, 16.803869246568524], [96.12466812183641, 16.803869246568524], [96.12506294310043, 16.80386161761959], [96.12539863573852, 16.803855896132745], [96.1258020401321, 16.803842544797646], [96.12629985805205, 16.803872108211294], [96.12624168360685, 16.803201675317098], [96.12624168360685, 16.80265426698088], [96.12624931255579, 16.802209854401326], [96.12626075732817, 16.80174064661361], [96.12627220120117, 16.8012828826989], [96.12624203074517, 16.800810554263705], [96.12542152438391, 16.800730705257877], [96.12476349044277, 16.800741195849582], [96.12415313765723, 16.800760269570844], [96.12355422964401, 16.80079078716517], [96.1231880194116, 16.800821304759438], [96.12285041841216, 16.800840377581437], [96.12252616874775, 16.80085868867758], [96.12224753269754, 16.800745705949623]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
