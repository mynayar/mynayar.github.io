
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Gyi</div><div class="name-mm">ကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR007010019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.34589313615936, 19.216183431919887], [96.35301087355305, 19.21770866142566], [96.35606133256448, 19.21542081671737], [96.35785135935282, 19.2094752727657], [96.35428189889058, 19.206777849817968], [96.34665575136188, 19.20220216130076], [96.34157165270966, 19.19991431659247], [96.33572493885492, 19.19788067785106], [96.32860720236056, 19.19559283314277], [96.32352310280902, 19.195338628075262], [96.31869321012363, 19.195084423007756], [96.31386331563954, 19.193813398569546], [96.30750819344843, 19.19279657919884], [96.3021698897287, 19.192033963996266], [96.29819538720739, 19.19174842025342], [96.29505215233502, 19.197118062648542], [96.29251010255922, 19.19864329215426], [96.2894596444471, 19.20169375116575], [96.28640918543562, 19.202456366368267], [96.28277534430674, 19.206638058299802], [96.2894596444471, 19.208811488559377], [96.29505215233502, 19.209828308829458], [96.3014072754255, 19.21033671896447], [96.3057287588752, 19.211861947570867], [96.31513434097712, 19.21237035770588], [96.3227604876065, 19.21414979317848], [96.32886140742806, 19.213895588110972], [96.33470812038348, 19.215166611649863], [96.34055483333896, 19.216183431919887], [96.34589313615936, 19.216183431919887]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
