
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Si</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Si</div><div class="name-mm">ပြင်စည်</div></div>
        <span class="pcode-badge">MMR010019034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83305288318405, 21.360199952965502], [95.82543101013306, 21.360812153857864], [95.82048208318167, 21.36287420667935], [95.82336895731157, 21.374421704098438], [95.82625583144153, 21.38308232738757], [95.82625583144153, 21.392155359981928], [95.83986538078278, 21.392155359981928], [95.84275225491268, 21.402053213884756], [95.84481430773417, 21.406589730631595], [95.84893841427646, 21.410713837173887], [95.8571866255624, 21.41112624827781], [95.86131073210464, 21.41401312240771], [95.86254796361766, 21.41854963825523], [95.86338170799951, 21.419716879130704], [95.86461001733846, 21.421436513284505], [95.87038376559838, 21.423086155002125], [95.87821956667972, 21.423086155002125], [95.88358090473503, 21.4226737438982], [95.8863105611835, 21.4226737438982], [95.88534284209857, 21.41686743028771], [95.87883794681386, 21.404322276252117], [95.874656228802, 21.394100298589933], [95.87186841679409, 21.380161239449706], [95.86954524131988, 21.37086853215709], [95.86854468438975, 21.357720176744806], [95.86482502005867, 21.358960064855182], [95.86048541077315, 21.35927003688272], [95.85459594224898, 21.360044967401393], [95.84715661178825, 21.359580008910314], [95.84328196099375, 21.359889980937908], [95.83894235170823, 21.3597349953738], [95.83891112275018, 21.359737460415488], [95.83305288318405, 21.360199952965502]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
