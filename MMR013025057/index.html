
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hay Ma Za Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hay Ma Za Lar</div><div class="name-mm">ဟေမဇလာ</div></div>
        <span class="pcode-badge">MMR013025057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71892659958297, 16.729936650256263], [96.71848524020174, 16.727365529895337], [96.7183757999033, 16.72510293005621], [96.7151696403667, 16.72135389026988], [96.7127097598476, 16.719040170267704], [96.71194439991416, 16.716600629715344], [96.71165028023631, 16.714907549843588], [96.71079707992135, 16.714671209808557], [96.70166171981259, 16.714835280323996], [96.6993678001839, 16.710976169814444], [96.69544991987794, 16.71092055034319], [96.69135491989368, 16.711811550063032], [96.69206915966407, 16.715006999573404], [96.69417084021217, 16.71905835006288], [96.69478247992754, 16.723702440115574], [96.69534479992262, 16.725768299767253], [96.69602520000302, 16.727202990026], [96.69763007976445, 16.72918722001424], [96.70237020032454, 16.731241019757306], [96.7049560803589, 16.73366742031527], [96.70508243960296, 16.733810520439192], [96.7072330801426, 16.73624898000645], [96.70874796025021, 16.736617979935886], [96.70910579959303, 16.736216939859958], [96.70938371978292, 16.735905269912337], [96.7100198399437, 16.735192380024387], [96.71163659974934, 16.73440838973545], [96.71538492007807, 16.7324537699256], [96.71892659958297, 16.729936650256263]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
