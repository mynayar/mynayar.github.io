
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baw Bin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Baw Bin</div><div class="name-mm">ဘော်ဘင်</div></div>
        <span class="pcode-badge">MMR008011016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78651540716038, 18.365105919002986], [95.78600277470832, 18.362607801109164], [95.7841773551009, 18.361330004775937], [95.77870109358065, 18.35950458426919], [95.77924871775417, 18.356766454408387], [95.7779709241189, 18.356218826637587], [95.77267720608825, 18.35767916376244], [95.77256735839694, 18.357590238798537], [95.77204719322344, 18.35859055560968], [95.7714787911134, 18.367684994766762], [95.7700577849389, 18.373937423373434], [95.76698723057626, 18.378682823853296], [95.7697735829845, 18.380474051236547], [95.77432080256307, 18.383884465695587], [95.77943642515095, 18.385305471870083], [95.78512044984893, 18.38615807593453], [95.79279388373078, 18.390421093558643], [95.79560909628282, 18.3905253609567], [95.78782819521507, 18.384512843592915], [95.78198684761497, 18.379949294124685], [95.7843598949932, 18.376663537392403], [95.78381226812172, 18.37392540573296], [95.78381226812172, 18.37173490184432], [95.78649272176176, 18.37052665997743], [95.78472498107305, 18.368084061730087], [95.78651540716038, 18.365105919002986]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
