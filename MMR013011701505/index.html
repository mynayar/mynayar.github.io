
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (7) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">South Okkalapa</div><div class="name-mm">တောင်ဥက္ကလာပ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (7) Ward</div><div class="name-mm">အမှတ် (၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013011701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18628525725887, 16.851973294831737], [96.18537139857125, 16.85112571707822], [96.18502235369874, 16.8508129121862], [96.18432299321165, 16.85017204270565], [96.18408393902263, 16.849943161647616], [96.18381309559794, 16.849712372228225], [96.18351173367961, 16.84944343536631], [96.18271064727861, 16.8486995701291], [96.18248176622058, 16.848482132044808], [96.18162345865574, 16.847745895756532], [96.18083190956503, 16.84705352659904], [96.17998356289115, 16.84629631002673], [96.17659299557033, 16.85113426333561], [96.17614555407414, 16.851772785585638], [96.18204463275367, 16.856647221691958], [96.18236223912612, 16.85632133526144], [96.18278884872643, 16.85581779495533], [96.18306159961321, 16.85548210141792], [96.18338966420168, 16.855073928818797], [96.18398729967419, 16.85434786476219], [96.18442344658484, 16.853841781173287], [96.18491935704276, 16.85333251938033], [96.18524360670716, 16.853019713588935], [96.18548965402437, 16.85277366627173], [96.18573188821614, 16.8525104526953], [96.18595123286315, 16.852293014611007], [96.18628525725887, 16.851973294831737]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
