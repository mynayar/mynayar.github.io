
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku</div><div class="name-mm">ကူ</div></div>
        <span class="pcode-badge">MMR017015033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.18598683992076, 16.759123829800956], [95.18728931994622, 16.75982061013309], [95.1887764802504, 16.762609170376948], [95.19045803980674, 16.765395660381444], [95.18867028020935, 16.770275460044502], [95.1885568801959, 16.771591349860955], [95.18812344024462, 16.776627750270507], [95.18876855992119, 16.780278149716878], [95.1898114803156, 16.779555719820678], [95.19085439981075, 16.77883328992442], [95.1910984803107, 16.77847131010293], [95.19134220018248, 16.77810933028144], [95.19286104000503, 16.775855550093638], [95.19356123955964, 16.774816950042236], [95.1942945602458, 16.774268850127385], [95.1964750798611, 16.772638860395148], [95.19763103964084, 16.77214547973017], [95.19878663969172, 16.771652099964513], [95.20042211978506, 16.77095405968214], [95.20270308018308, 16.769191140258954], [95.20629256764795, 16.763399265263956], [95.20663904135876, 16.762840207109946], [95.2065529951247, 16.762483786897292], [95.20609600642564, 16.761943708935064], [95.20550603227764, 16.761246468150034], [95.20308940824964, 16.760222123252447], [95.20227156118364, 16.759619499240557], [95.19550604686663, 16.75632816761089], [95.19318010687647, 16.75423482197948], [95.1931274398795, 16.754325569869195], [95.1916917603665, 16.75624301979957], [95.18598683992076, 16.759123829800956]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
