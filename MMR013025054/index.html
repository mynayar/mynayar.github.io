
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aw Bar Nyunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aw Bar Nyunt</div><div class="name-mm">သြဘာညွန့်</div></div>
        <span class="pcode-badge">MMR013025054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75950095710357, 16.74862250742285], [96.75987799427406, 16.742452043926733], [96.75920860009688, 16.737179659613673], [96.75902708003576, 16.72740619543964], [96.7389602473176, 16.734925392892592], [96.73234811957013, 16.739771309698256], [96.73202879998917, 16.740098279811832], [96.73052400038239, 16.741865339713684], [96.72901919987623, 16.74363230968339], [96.726684239686, 16.74532871974469], [96.71922756040362, 16.752136590331418], [96.72172235979912, 16.752846419826483], [96.72362100040891, 16.752855059613353], [96.72471899978206, 16.752860010381198], [96.72803675978867, 16.753974569870536], [96.7297431604186, 16.75421693985993], [96.73159896002403, 16.754480460105185], [96.73567379990601, 16.753950270188852], [96.74323992038609, 16.7533566304042], [96.74759052028634, 16.753293269568758], [96.75066708032153, 16.751760299598175], [96.7525514576837, 16.750821062941725], [96.75950095710357, 16.74862250742285]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
