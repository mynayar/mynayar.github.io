
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (10) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungdon</div><div class="name-mm">ညောင်တုန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (10) Ward</div><div class="name-mm">အမှတ် (၁၀) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017021701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65373776728421, 17.041139940555865], [95.65237498591694, 17.036871489227906], [95.64597284716922, 17.038898873184507], [95.6460701583112, 17.039788234339596], [95.6460905549352, 17.04016851716341], [95.64619254075319, 17.040885201291076], [95.64631492319523, 17.042060980330007], [95.6464143594352, 17.042867852069776], [95.64647045105056, 17.04295032619666], [95.64651345573145, 17.043369796079276], [95.64786680231111, 17.042960077545615], [95.65086177674965, 17.04205488652383], [95.65184168704428, 17.041732299705927], [95.65314625169822, 17.041345519280355], [95.65363918180287, 17.041185444452765], [95.65373776728421, 17.041139940555865]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
