
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hput Hlaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hput Hlaing</div><div class="name-mm">ဖွတ်လှိုင်း</div></div>
        <span class="pcode-badge">MMR005006016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73759647959389, 22.47763076984421], [95.73713927955419, 22.477580010309282], [95.72998283983623, 22.477159079927674], [95.72958071967452, 22.477611420031053], [95.72324760029659, 22.484736270162784], [95.72296716020634, 22.489221690128943], [95.72414867961794, 22.489227360354448], [95.72414867961794, 22.49166991633365], [95.72492544115624, 22.49192183892177], [95.72906600079534, 22.49271051737651], [95.73143203705894, 22.495273721005447], [95.73399524428515, 22.49783692643308], [95.73800787626254, 22.501935351935003], [95.73897279216067, 22.503293757201163], [95.74383261608244, 22.503316644947233], [95.74481008561702, 22.501966374048948], [95.74724737876357, 22.500623539644664], [95.74627860027726, 22.50016973994161], [95.74802545690937, 22.499851650633218], [95.74555823972105, 22.498206930005892], [95.74134875963762, 22.493997359990203], [95.7375601200036, 22.487682960000654], [95.73798132018186, 22.48263153012107], [95.73759647959389, 22.47763076984421]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
