
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Ywar Kyet Ti</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Ywar Kyet Ti</div><div class="name-mm">ဆည်ရွာကြက်တည်</div></div>
        <span class="pcode-badge">MMR010024023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12737671886055, 20.647150266271808], [96.12793371217111, 20.644179632883777], [96.12793371217111, 20.63638172203889], [96.12836692998991, 20.629017029012743], [96.12793371217111, 20.623818422382328], [96.12836692998991, 20.619486248691487], [96.12798516328473, 20.613759754409216], [96.12423846713159, 20.613759754409216], [96.11840293274923, 20.613421208222235], [96.10757250077035, 20.617753380114436], [96.09674206969083, 20.62338520456359], [96.08938359097999, 20.6278002921498], [96.08591163771194, 20.6298834637509], [96.0785469446858, 20.632915983985527], [96.07258899098917, 20.638129193807288], [96.0768140761088, 20.64114711174983], [96.08244589965858, 20.647212154017723], [96.08807772500705, 20.651111108990563], [96.09587563495268, 20.65197754372872], [96.10410676271698, 20.653710413205033], [96.10973858806545, 20.652843977567557], [96.11363754303824, 20.65197754372872], [96.11796971493044, 20.648511805675355], [96.12533440885596, 20.646778937098304], [96.12737671886055, 20.647150266271808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
