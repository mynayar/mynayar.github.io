
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Toke Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Toke Gyi</div><div class="name-mm">တုပ်ကြီး</div></div>
        <span class="pcode-badge">MMR005020020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.48992916030255, 24.302673359887706], [96.48931896040176, 24.300292949759864], [96.48089603962057, 24.30108639012485], [96.47528075999912, 24.289917029747187], [96.47448731963414, 24.273681659680904], [96.47412120023324, 24.26708987999399], [96.47387711973334, 24.264099090100956], [96.47387711973334, 24.264892620398143], [96.46990955997825, 24.26428223973363], [96.45788592009922, 24.26428223973363], [96.45727535957025, 24.267517110126562], [96.4550782798388, 24.274108889813476], [96.45391836034412, 24.28271487029508], [96.44952384025311, 24.289917029747187], [96.44409180019647, 24.29290772970802], [96.43591295991524, 24.294494610437994], [96.43609620037938, 24.29608158020079], [96.43609620037938, 24.312316860334874], [96.43829328011083, 24.331115700229418], [96.43950431976862, 24.338865869664232], [96.4459227596277, 24.33868406991394], [96.46887204001268, 24.33532715972069], [96.46972668014223, 24.337097190083284], [96.48150624042074, 24.331726079994667], [96.48992916030255, 24.325500509640847], [96.49792476011964, 24.321105990449155], [96.49789488014466, 24.321053700268124], [96.49127195963331, 24.309509310006717], [96.48992916030255, 24.302673359887706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
