
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Ban Pa Loet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Demoso</div><div class="name-mm">ဒီးမော့ဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Ban Pa Loet</div><div class="name-mm">ဝါဘန်းပလို့</div></div>
        <span class="pcode-badge">MMR002002015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.06134470069742, 19.547482317954632], [97.06076366401197, 19.5422529868859], [97.05379122288667, 19.536442620030925], [97.04449463501948, 19.533537435704147], [97.03341862337084, 19.52803574405442], [97.02492095993443, 19.52509424600271], [97.00138897192357, 19.51757708281616], [96.99622256282106, 19.522776750646585], [96.98980239536434, 19.532510553819066], [96.9817254087007, 19.54369407312305], [96.97654785340075, 19.550321343655128], [96.97861887606035, 19.55177105978663], [96.98648875874926, 19.55425628589893], [96.9945657454129, 19.555706001131114], [97.00388534513263, 19.552392366314677], [97.01672568094546, 19.550114242378413], [97.02894471202887, 19.547421913190817], [97.04176203688854, 19.548077736598316], [97.05133476069074, 19.550655009221373], [97.06134470069742, 19.547482317954632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
