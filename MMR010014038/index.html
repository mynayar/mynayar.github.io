
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Taw</div><div class="name-mm">ထန်းတော</div></div>
        <span class="pcode-badge">MMR010014038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0299051081343, 21.763858701817696], [96.0319210059497, 21.760887903853757], [96.03517863908297, 21.753829697982212], [96.04042704926894, 21.744961696425207], [96.04111637422136, 21.743648696130492], [96.03973546072297, 21.743214694102903], [96.03538571338004, 21.741841090294145], [96.03160830088245, 21.741154287940105], [96.02542708059536, 21.741154287940105], [96.02107733325238, 21.741154287940105], [96.01523951369268, 21.741497688667437], [96.01233553535673, 21.741497688667437], [96.01191539098255, 21.743104133249176], [96.01125099074068, 21.745798312342288], [96.01236646843785, 21.747218859862528], [96.01314346110189, 21.748208900120687], [96.01385266826611, 21.751412964236977], [96.0134375969676, 21.75239535216383], [96.01297950659898, 21.75348091121515], [96.01330331019966, 21.75435194058963], [96.01336097742723, 21.754507064649374], [96.01589775088058, 21.75700569155947], [96.02033830906578, 21.757630270720483], [96.02232908521916, 21.75853516856324], [96.02431986137259, 21.76016398468022], [96.02739651493727, 21.761792801696515], [96.0299051081343, 21.763858701817696]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
