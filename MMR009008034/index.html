
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pa Nwe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pa Nwe</div><div class="name-mm">လက်ပနွယ်</div></div>
        <span class="pcode-badge">MMR009008034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6814686973226, 20.42468713190567], [94.68520937970919, 20.428097755007457], [94.69556067808287, 20.430685579376018], [94.69928806938896, 20.431960738897033], [94.70013913741133, 20.430088389067976], [94.70332415208799, 20.411973616689124], [94.70372227836054, 20.409982982628605], [94.70415965734236, 20.41002223533792], [94.70392134239609, 20.409783920391646], [94.70431946866859, 20.40261763579531], [94.70446439621497, 20.39957415912022], [94.70451853180487, 20.39843730543737], [94.70431946866859, 20.393858846108913], [94.70352321522427, 20.388086007063634], [94.70253662566478, 20.384304082667313], [94.70232883370875, 20.383507547735178], [94.70152310141009, 20.38366869455467], [94.70033819964823, 20.383905674907], [94.69890894309333, 20.384180532005985], [94.69516255091105, 20.384900992386918], [94.69389743411932, 20.38569168981968], [94.69197753623439, 20.386891626447436], [94.68958877500205, 20.394256973280733], [94.6897802028941, 20.396841240830668], [94.68998690217387, 20.39963168515419], [94.68700095063343, 20.409982982628605], [94.68646210923902, 20.411415165577466], [94.6814686973226, 20.42468713190567]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
