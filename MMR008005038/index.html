
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yat Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yat Thar</div><div class="name-mm">ရပ်သာ</div></div>
        <span class="pcode-badge">MMR008005038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41012798421917, 18.5311450468065], [95.4056773572243, 18.530289158417986], [95.39900141628237, 18.530460336275553], [95.3935237221421, 18.530973868948934], [95.3834541301041, 18.531940611370146], [95.38392567522976, 18.533512430254518], [95.38451919810257, 18.538379316552266], [95.38333215235701, 18.53861672588124], [95.37941490157652, 18.539803770727474], [95.3796523109055, 18.540872112258228], [95.37941490157652, 18.54419584016597], [95.38021370909547, 18.551290440701337], [95.3866582086095, 18.551290440701337], [95.39310270902286, 18.551827482552312], [95.39918918123578, 18.552364524403345], [95.40151636139103, 18.553080579904872], [95.40187438869214, 18.550753398850304], [95.40849790185672, 18.548068191393952], [95.41058116428934, 18.547519963775358], [95.41081269564944, 18.543983395117664], [95.41081269564944, 18.538163344362886], [95.41012798421917, 18.5311450468065]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
