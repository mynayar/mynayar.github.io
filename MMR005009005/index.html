
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Nge</div><div class="name-mm">ရွာငယ်</div></div>
        <span class="pcode-badge">MMR005009005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1255140396413, 22.965214320384632], [95.12787203956304, 22.963773510239378], [95.1376402795753, 22.953462659774004], [95.14415231997367, 22.93392626968165], [95.13492659958297, 22.920359400366067], [95.11593299980814, 22.905707220212093], [95.10562224017428, 22.892682959550996], [95.10210504021552, 22.878112140163182], [95.0925981602769, 22.870433250094493], [95.07740327973761, 22.88996964018679], [95.06817756024628, 22.904079119955497], [95.05840967996284, 22.91493266990682], [95.05244016008538, 22.920359400366067], [95.045928119687, 22.927956839736396], [95.05081187996433, 22.935554369938245], [95.05786679971311, 22.940438400012226], [95.05244016008538, 22.948578539767823], [95.04321443969468, 22.95400527022707], [95.03778780006695, 22.963230809854053], [95.05406807957826, 22.963230809854053], [95.06654963985403, 22.9550906700984], [95.07197628038108, 22.957804080294125], [95.07631787986634, 22.959974700172324], [95.09422607976984, 22.959974700172324], [95.10725015966722, 22.96160280042892], [95.1181037995508, 22.969742940184574], [95.1255140396413, 22.965214320384632]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
