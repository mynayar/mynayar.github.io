
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dala</div><div class="name-mm">ဒလ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma (1) Ward</div><div class="name-mm">မြို့မအပိုင်း (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013030701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1656990049052, 16.753785451437466], [96.1653499600327, 16.753870010192884], [96.1649608611549, 16.753900527787152], [96.16444998507882, 16.753916960199604], [96.16446318622712, 16.755285956781506], [96.16498565726232, 16.755333582179105], [96.16496658444038, 16.7560831707018], [96.16448974590509, 16.756106694268567], [96.16437212627267, 16.757752736000043], [96.16490236924898, 16.7582480124359], [96.16528129589517, 16.757810592984526], [96.16571044877827, 16.757309436781156], [96.16617465004015, 16.75660228726582], [96.16637992839105, 16.756162643791015], [96.16668891925826, 16.755510966258157], [96.16676998144953, 16.755121231559656], [96.16677665711711, 16.75478276361372], [96.16661559213594, 16.75445789791371], [96.16625213742628, 16.754083633353048], [96.16602058358313, 16.753885268990018], [96.1656990049052, 16.753785451437466]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
