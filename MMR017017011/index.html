
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah La Man Kyaung Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah La Man Kyaung Su</div><div class="name-mm">အလမန်းကျောင်းစု</div></div>
        <span class="pcode-badge">MMR017017011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.27167835976854, 16.594948799647455], [95.2666055997687, 16.594175340419667], [95.26505615961412, 16.593766739743273], [95.26174667966558, 16.593802739604826], [95.25856788020354, 16.59241880978027], [95.25479003962869, 16.590119309858324], [95.25322260044271, 16.58815046996824], [95.25210731969713, 16.5870986399903], [95.25128435998528, 16.585901820412744], [95.2506357023758, 16.5851698846825], [95.2501895999701, 16.58999205039288], [95.24969496025426, 16.595406450247538], [95.25025547980658, 16.60429898980658], [95.25041675972574, 16.60804298979218], [95.25027815980928, 16.61062617006172], [95.2502176804017, 16.61175306015565], [95.25029471992542, 16.615553759698287], [95.2529169604494, 16.61637672030946], [95.2572265197881, 16.61665365034571], [95.25985883991359, 16.616164590023857], [95.26249116003908, 16.615675529702003], [95.26464935938048, 16.61492663815386], [95.26544820017438, 16.614649440119592], [95.27302224008434, 16.6116203103291], [95.27596775990423, 16.611145919748424], [95.2743193196809, 16.606281779980236], [95.27375412005665, 16.603083539873523], [95.27280659974485, 16.597725389914842], [95.27167835976854, 16.594948799647455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
