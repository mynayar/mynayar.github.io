
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Taw</div><div class="name-mm">ရင်းတော</div></div>
        <span class="pcode-badge">MMR005006019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72070671963945, 22.461401880292613], [95.7227796002984, 22.45966055988697], [95.72777028007442, 22.456907190114805], [95.73276095985045, 22.456390949582726], [95.73826752042976, 22.455358380385007], [95.74188156028583, 22.455358380385007], [95.74597943989932, 22.45374845992353], [95.74597943989932, 22.451901569901565], [95.7497680804326, 22.445587169912017], [95.7497680804326, 22.441798530277993], [95.74850520025484, 22.433800319729016], [95.74724232007708, 22.42580220001156], [95.74605719978001, 22.425303239952598], [95.73924420035962, 22.42243448985988], [95.7320877597424, 22.41948780002201], [95.73082487956458, 22.419372960193982], [95.72745708038002, 22.419066869640346], [95.72493132002444, 22.424539319833798], [95.71861692003489, 22.424539319833798], [95.71230287977414, 22.427064990257122], [95.70809303996191, 22.430432700408858], [95.70660264029965, 22.43149721982087], [95.70514644005624, 22.432537530382774], [95.70767220041176, 22.44053565010023], [95.70514644005624, 22.447691999885933], [95.70809303996191, 22.45400630994328], [95.70867011963037, 22.459488300144983], [95.70977712031788, 22.45863690027278], [95.71609152030749, 22.459478760136733], [95.72070671963945, 22.461401880292613]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
