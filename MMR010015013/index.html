
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dar Yei Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dar Yei Kaung</div><div class="name-mm">ဒါးရယ်ကောင်း</div></div>
        <span class="pcode-badge">MMR010015013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06067705410283, 21.497825237244967], [96.07262601158124, 21.499339893421393], [96.07303603498508, 21.49400959096988], [96.07508615200436, 21.48990935783064], [96.07857134868885, 21.486219148994564], [96.08308160523194, 21.482323928006906], [96.08226155932357, 21.477403648959296], [96.07857134868885, 21.47063826594325], [96.07781216709787, 21.466115342449143], [96.0750157090078, 21.461405519149423], [96.06971715891979, 21.46405479509275], [96.06721506602253, 21.466556887990066], [96.06721506602253, 21.469058980887326], [96.06603760974792, 21.47185543807808], [96.06368269899741, 21.47185543807808], [96.0598559676788, 21.47185543807808], [96.0552933274252, 21.471561073784585], [96.0523496880877, 21.47288571220588], [96.04955323089695, 21.473180075600055], [96.04616804601858, 21.473032894352627], [96.0418997691591, 21.473032894352627], [96.03874634496793, 21.47417204040738], [96.04254965164517, 21.48017726337008], [96.04495174172956, 21.486783007729684], [96.04335034863976, 21.489785619211034], [96.04655313392004, 21.497392235263476], [96.05807018658987, 21.497494788553695], [96.06067705410283, 21.497825237244967]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
