
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Zar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Zar</div><div class="name-mm">မြင်းဇာ</div></div>
        <span class="pcode-badge">MMR009023010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14576748458182, 22.288146650847295], [94.1421411177185, 22.304959807449222], [94.14411913608933, 22.314849899303454], [94.15203120957273, 22.30957518304831], [94.15522721936077, 22.309631750405003], [94.18928388784121, 22.310234521905727], [94.23840467813346, 22.31649824689663], [94.26271344387038, 22.317608625437742], [94.25825060138419, 22.314930689899484], [94.2531184087876, 22.308682269571136], [94.24508536479783, 22.300425410404443], [94.24497582827189, 22.298233657357457], [94.24486231494393, 22.295962317007366], [94.24843272778821, 22.292391875384794], [94.24884277367511, 22.291754032122924], [94.25244960006904, 22.286143619632412], [94.25275914761664, 22.283253580788198], [94.25311901493063, 22.279895347692218], [94.25267283158598, 22.27476278817221], [94.25401178991223, 22.270522877728695], [94.23708599861999, 22.26671811864628], [94.21649573978664, 22.266539072620162], [94.19917397969544, 22.26638844876794], [94.16004214822664, 22.26905047799721], [94.15071253095857, 22.26968514575293], [94.14477847584607, 22.27627854062223], [94.14576748458182, 22.288146650847295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
