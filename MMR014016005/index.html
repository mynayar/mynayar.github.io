
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongkaing</div><div class="name-mm">မိုင်းကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Long</div><div class="name-mm">ဝမ်လုံ</div></div>
        <span class="pcode-badge">MMR014016005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.60229779410798, 21.61004477984278], [97.60091987265406, 21.612160873825303], [97.5917799322981, 21.626197210832686], [97.5771300526099, 21.648735487552756], [97.577049069559, 21.65043610913915], [97.57702010059722, 21.651044462731818], [97.57833604797031, 21.649991705552793], [97.61421476270118, 21.6602427672899], [97.62638789778333, 21.67241590237205], [97.649452785118, 21.6762600499614], [97.67315836476678, 21.676900741376187], [97.68305965407984, 21.67718363481697], [97.68597219126366, 21.671134520441797], [97.69430117785714, 21.651913779797155], [97.689816338853, 21.643584792304353], [97.68084665994547, 21.629489582977897], [97.68276873418978, 21.610268843232575], [97.68084665994547, 21.594251559661814], [97.67383447058438, 21.5815021246234], [97.64432725469908, 21.584641190238813], [97.62762601332992, 21.583404062147793], [97.62523636626537, 21.596248414332933], [97.62483607082805, 21.598400003657275], [97.62544075698543, 21.601524217868416], [97.62708989778059, 21.61004477984278], [97.62521170865347, 21.617557539049244], [97.61882586382262, 21.622440831679114], [97.61356693336734, 21.618684453424862], [97.607932363288, 21.609293504191896], [97.60450909661756, 21.609749939807898], [97.60229779410798, 21.61004477984278]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
