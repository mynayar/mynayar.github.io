
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Gyi</div><div class="name-mm">ကူကြီး</div></div>
        <span class="pcode-badge">MMR010029021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70228909336703, 21.0893203620451], [95.7042769116502, 21.092728051558367], [95.7042769116502, 21.099259457957658], [95.70484486140128, 21.102951121896808], [95.71080831804949, 21.10664278583596], [95.7134697986923, 21.110235785153407], [95.71762369797534, 21.106358812309395], [95.72273523314453, 21.105506889031744], [95.72727882036133, 21.105919943150923], [95.72727882036133, 21.10153125066671], [95.73011856192215, 21.096419716396838], [95.7329583043823, 21.089604335571664], [95.73409420028719, 21.083072930071694], [95.73750188980046, 21.0748376789158], [95.73750188980046, 21.072281910881543], [95.73750188980046, 21.069087202412504], [95.73664996832144, 21.06915819489484], [95.73153843315225, 21.070862039651445], [95.7247230532264, 21.070862039651445], [95.7201794660096, 21.070862039651445], [95.70910447329288, 21.068874221368276], [95.7011531956635, 21.06773832456406], [95.69985322564588, 21.067088339555255], [95.69888140295444, 21.069726143746607], [95.69744449316886, 21.075196394198258], [95.6963055737433, 21.080036802656366], [95.69829868273808, 21.086585592051506], [95.70228909336703, 21.0893203620451]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
