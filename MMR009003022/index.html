
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Sun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Sun</div><div class="name-mm">မြေစွန်း</div></div>
        <span class="pcode-badge">MMR009003022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.86249041619982, 20.572637148585613], [94.86025325368479, 20.578453769326018], [94.86073337564483, 20.585655592431692], [94.86121349670555, 20.593817656759484], [94.85929301066398, 20.60053935790512], [94.8589958557742, 20.60509574067595], [94.87321653491523, 20.610141788113083], [94.90184724905134, 20.614615337028226], [94.90346418872139, 20.612062274154653], [94.89866297361738, 20.606300816029886], [94.89866297361738, 20.59909899382353], [94.93371184432624, 20.60197972288597], [94.93901514643193, 20.601571776016726], [94.93851305763155, 20.60101947986516], [94.93371184432624, 20.58901644165553], [94.91930819901421, 20.57941401234683], [94.90538467476301, 20.565970610055672], [94.90106358161904, 20.5582886667886], [94.89122926481878, 20.55536495103172], [94.89194127337112, 20.556848301807747], [94.88329908618397, 20.565970610055672], [94.87849787107996, 20.576533283284448], [94.87369665597595, 20.58901644165553], [94.86937556283203, 20.58901644165553], [94.8674550767904, 20.58421522655152], [94.86889544087194, 20.57605316222373], [94.86249041619982, 20.572637148585613]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
