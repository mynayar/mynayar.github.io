
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Kan</div><div class="name-mm">ဥက္ကံ</div></div>
        <span class="pcode-badge">MMR005024010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42590920024946, 23.660293049784457], [95.42932128025296, 23.66931149982588], [95.43609611964024, 23.677673309875388], [95.44671647988167, 23.681701619734042], [95.45507819999898, 23.682678209731648], [95.4578858402594, 23.686706519590246], [95.4456786001873, 23.6934814498091], [95.45007312027832, 23.701904279758764], [95.4613036804206, 23.711914080370548], [95.46771240040704, 23.715881370329043], [95.46972660030241, 23.701904279758764], [95.4736938003287, 23.686706519590246], [95.47149671969794, 23.6845092599944], [95.47308360042786, 23.677124039942555], [95.46350111988085, 23.677124039942555], [95.45910659978983, 23.66931149982588], [95.45227055973862, 23.661926279774036], [95.45227055973862, 23.657714820282763], [95.44067388019545, 23.65472412032193], [95.43609611964024, 23.658081029615857], [95.42932128025296, 23.658691410280426], [95.42590920024946, 23.660293049784457]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
