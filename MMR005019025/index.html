
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Nei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Nei</div><div class="name-mm">တနယ်</div></div>
        <span class="pcode-badge">MMR005019025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80245976040965, 21.863602439800786], [94.80245976040965, 21.860269650324142], [94.8066955195826, 21.85635960041526], [94.80767291986939, 21.854078729949492], [94.80830292014372, 21.852867690291703], [94.80232331976543, 21.851054010434268], [94.80074867970785, 21.850576470427825], [94.78820873904215, 21.847737963636177], [94.788032186836, 21.847224553270564], [94.78782359987929, 21.84662034015662], [94.78777675239525, 21.84648448137375], [94.78774074983579, 21.846380219371667], [94.78754964030372, 21.846377880235025], [94.78706143703573, 21.846372148855608], [94.78677532132406, 21.846368789887777], [94.78200822739785, 21.841552015613104], [94.78134252403834, 21.840879375782606], [94.77956511563764, 21.840032913188452], [94.77782815244734, 21.839205712273838], [94.77561743899366, 21.84024185807533], [94.77570888026065, 21.840546419781504], [94.77565524019724, 21.84053210976913], [94.77527363986667, 21.845302290168604], [94.77730079989203, 21.849067530342325], [94.77845927957213, 21.85630830038781], [94.78135584029985, 21.861232020241573], [94.78222451974585, 21.867314309707695], [94.78222451974585, 21.871193399555807], [94.78616795968367, 21.870207630178015], [94.79480256019008, 21.8684155502375], [94.79838672007111, 21.867438060018515], [94.80157344076173, 21.866883845613017], [94.80245976040965, 21.864668399926757], [94.80245976040965, 21.863602439800786]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
