
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Hku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Hku</div><div class="name-mm">အင်ခူး</div></div>
        <span class="pcode-badge">MMR001003051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.08399508040867, 25.839074468012313], [98.07998839744664, 25.836993074370923], [98.0723855639427, 25.83015052412742], [98.06858414404309, 25.823054543132685], [98.06250187706001, 25.813424287001283], [98.05870045985841, 25.810636581113386], [98.05854808502619, 25.80987470515356], [98.04540585039973, 25.81530950612887], [98.029491239729, 25.834968730122853], [97.99672586640565, 25.878031794132028], [97.97800279529281, 25.895818710565095], [97.96864125928676, 25.913605627897482], [97.9668821143182, 25.931197084777693], [97.97144971972887, 25.930456392348674], [98.01678890938075, 25.925990459791933], [98.02084726019297, 25.912946573225838], [98.02289832419837, 25.90445005822363], [98.03022271860362, 25.902106355723788], [98.03039987605348, 25.901515874358154], [98.03198073312439, 25.896246698826133], [98.03461759482622, 25.89273094317855], [98.0422350180317, 25.88862933857314], [98.04241385541513, 25.888471137033378], [98.04985251678028, 25.881890867769357], [98.05629812515843, 25.875152369985926], [98.05541939668785, 25.868706677071543], [98.0618649529053, 25.86372608858818], [98.06567389113724, 25.85405767512168], [98.07153363077248, 25.844682296750648], [98.08120183919357, 25.841459696707716], [98.08217184255653, 25.840631382432377], [98.08219431841314, 25.840612190899947], [98.08399508040867, 25.839074468012313]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
