
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Thit No (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanmyathazi</div><div class="name-mm">ချမ်းမြသာစည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Thit No (1) Ward</div><div class="name-mm">မြို့သစ်အမှတ် (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010004701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09174288856212, 21.94350374369901], [96.09203805937688, 21.949910884724886], [96.09221280889608, 21.952642092817825], [96.09398333679405, 21.952529083945365], [96.09417143182463, 21.95253241377793], [96.09668376629253, 21.952297450641538], [96.10020284934683, 21.952030083622674], [96.10089793606835, 21.95198626171623], [96.1052192617143, 21.951713822720762], [96.10814387822774, 21.951522769131827], [96.11140995069013, 21.95130940958103], [96.11585733514835, 21.95102665568851], [96.11593053037956, 21.951022002113575], [96.11591144129085, 21.950604530461874], [96.11555560690277, 21.945024175209312], [96.11542322168424, 21.941690282808565], [96.11528139138937, 21.939138368625493], [96.10607826217813, 21.939343941321624], [96.10438458159018, 21.939381773506284], [96.09089127438187, 21.93979382621967], [96.09174288856212, 21.94350374369901]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
