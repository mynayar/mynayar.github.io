
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Han Thar Wa Di</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tada-U</div><div class="name-mm">တံတားဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Han Thar Wa Di</div><div class="name-mm">ဟံသာဝတီ</div></div>
        <span class="pcode-badge">MMR010016009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.988693242799, 21.83234494266503], [95.98471831309973, 21.829844582761325], [95.9839424248031, 21.829844582761325], [95.9761736771735, 21.829844582761325], [95.97279556456374, 21.829248445559358], [95.9682251784493, 21.829844582761325], [95.96444964103819, 21.830639433263286], [95.95987925492375, 21.83322269537115], [95.95729599281589, 21.834812394576375], [95.96082272468908, 21.837545669896826], [95.9647859658997, 21.840428027631447], [95.96874920800963, 21.840428027631447], [95.97253230242387, 21.840428027631447], [95.97559480695486, 21.842049354194387], [95.9793779013691, 21.845472153217372], [95.9817198169161, 21.850696425599608], [95.98421093898372, 21.850629098753927], [95.98402214070927, 21.849916457978225], [95.98429488440144, 21.847912702809026], [95.98430831397758, 21.84781424413211], [95.98468971286002, 21.846235274738206], [95.98495662894533, 21.84498877661082], [95.98507118188957, 21.844453812193706], [95.98507027087635, 21.844210937684693], [95.98506339555934, 21.84242052598654], [95.98536835926245, 21.839986383165126], [95.9856889163105, 21.838144273939122], [95.98597488633197, 21.836274997093483], [95.98699021102948, 21.83325728239771], [95.988693242799, 21.83234494266503]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
