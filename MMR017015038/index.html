
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Ta Mi Thet Kei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Ta Mi Thet Kei</div><div class="name-mm">အင်းတမိသက္ကယ်</div></div>
        <span class="pcode-badge">MMR017015038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15595873580708, 16.814942423554044], [95.15647583968831, 16.813411289999067], [95.15735927970707, 16.81119206985818], [95.15762639993847, 16.81056360023001], [95.15800188038253, 16.80908255981234], [95.15829456024579, 16.807912290020226], [95.15847923962525, 16.80741171028228], [95.15893572020735, 16.805967839744085], [95.15936483981557, 16.8037315198938], [95.15949084023015, 16.802496900011988], [95.16019752029939, 16.800845580159432], [95.16114467998307, 16.79785784976002], [95.1617300397096, 16.79248160993842], [95.16146652036366, 16.78855950012087], [95.16086063990667, 16.786345409712965], [95.16057803964486, 16.785444959917015], [95.1544598402495, 16.78634001018338], [95.15019959973182, 16.787531879892413], [95.14681164044492, 16.790084100101183], [95.14512000038775, 16.79416722004123], [95.14286423989279, 16.79983136972197], [95.14379880007465, 16.803033029950427], [95.1458957996515, 16.806213899651823], [95.14707912040512, 16.808230620346876], [95.14887335961794, 16.81128855002663], [95.14898496008789, 16.813794779805278], [95.1528643197326, 16.814155770372565], [95.15595873580708, 16.814942423554044]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
