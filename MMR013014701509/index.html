
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Chan Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawbon</div><div class="name-mm">ဒေါပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung Chan Thar Ward</div><div class="name-mm">အောင်ချမ်းသာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013014701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18243789729121, 16.78061389901228], [96.18274765078354, 16.780401230032794], [96.18159506076353, 16.77873844562282], [96.18122291590493, 16.77881526930929], [96.18079948540799, 16.778972624587027], [96.18044662471203, 16.77914047225505], [96.18009376581472, 16.779331207669145], [96.17984199521197, 16.779471397586974], [96.17960166938161, 16.779640197637036], [96.17935718058948, 16.779839776084827], [96.17962116668355, 16.780119366315773], [96.17938272313421, 16.78037652475689], [96.17928635538107, 16.780519293030977], [96.17926850923436, 16.78060138404669], [96.17928945534413, 16.780760638692584], [96.17982482895275, 16.781093597391646], [96.18036842326416, 16.78064918481209], [96.18073272693385, 16.780352592897884], [96.18101234414445, 16.7806255344409], [96.18194961578223, 16.77994410193878], [96.18243789729121, 16.78061389901228]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
