
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Poke Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Poke Ka Lay</div><div class="name-mm">ရေပုတ်ကလေး</div></div>
        <span class="pcode-badge">MMR009008009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.56549631620209, 20.41105725428889], [94.5717574862191, 20.409539393828027], [94.60435103327364, 20.400394442449624], [94.61368739006105, 20.39720641774204], [94.61373047118434, 20.397111639090895], [94.61162009778934, 20.38749771464785], [94.61115112562402, 20.379994163599804], [94.60974421002732, 20.372725099983427], [94.61302701428536, 20.37038024005608], [94.61563274775318, 20.3685887977349], [94.6123235555877, 20.367800895395078], [94.60599243540264, 20.362876689907353], [94.60317860420929, 20.360531829980005], [94.60053603810775, 20.35947480371925], [94.59731645529024, 20.358186970951976], [94.59325669793833, 20.357780995396695], [94.59262673633486, 20.357717998786654], [94.5860611287182, 20.360766315613034], [94.5811369241298, 20.364283606403376], [94.57574374737612, 20.380932107930505], [94.56894365412637, 20.40133238588095], [94.5656608507677, 20.40977388036032], [94.56549631620209, 20.41105725428889]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
