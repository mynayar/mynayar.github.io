
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi An</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi An</div><div class="name-mm">လွယ်အံ</div></div>
        <span class="pcode-badge">MMR015012046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.80847652397244, 22.414936297871918], [96.80781641799337, 22.41906151597624], [96.80469106074389, 22.43195284065115], [96.80312825936176, 22.443672253371858], [96.80000296686347, 22.453829040977496], [96.79844014569625, 22.466329748718977], [96.79258050498635, 22.473361295987047], [96.78359582089047, 22.480002130993626], [96.77709913731542, 22.48856590629157], [96.77864418158379, 22.502085048586196], [96.78415702662556, 22.503839135767578], [96.8515398137115, 22.543476068765585], [96.85620402969226, 22.54518825023763], [96.85802585740743, 22.536990025968976], [96.86667391536895, 22.518252565703392], [96.87352029492575, 22.510325180362827], [96.8818080170264, 22.50347879990676], [96.89550077613995, 22.48185865455332], [96.90559017664538, 22.473210596591798], [96.9230537427361, 22.464634605802473], [96.92216562084678, 22.452671458820816], [96.92181754184617, 22.44221045934529], [96.91752207488389, 22.42681837007177], [96.9040061341758, 22.424941156709053], [96.88636032227112, 22.4178077432328], [96.86420919559794, 22.418183185905377], [96.8529459118244, 22.411800657774165], [96.81802973068756, 22.40429180162539], [96.81073778562035, 22.404615889411843], [96.80937917440946, 22.409295344404654], [96.80847652397244, 22.414936297871918]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
