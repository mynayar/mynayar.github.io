
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Myaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Myaung</div><div class="name-mm">လက်မြောင်</div></div>
        <span class="pcode-badge">MMR009016021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24652368811775, 19.169109852937424], [95.24710511870632, 19.169384416857383], [95.25340453239329, 19.18058337392364], [95.25737082860093, 19.181049997059745], [95.27276939569111, 19.1721841556743], [95.28567697471266, 19.164439608800933], [95.28676809157423, 19.163784938324284], [95.28826452298938, 19.1600832406491], [95.29120101271661, 19.152819293275797], [95.29283419414281, 19.14605325555334], [95.29311724856223, 19.142535289372177], [95.29283419414281, 19.142786893600316], [95.28816796188198, 19.142786893600316], [95.26973634485648, 19.141387024191886], [95.26483680057794, 19.13905390761181], [95.26448107913853, 19.138075672754155], [95.26087050257172, 19.13998715388408], [95.24803836497864, 19.142553581582547], [95.24057239300157, 19.14628656757111], [95.23940583471153, 19.148153061015023], [95.24197226330938, 19.152585981258085], [95.24197226330938, 19.15771883665502], [95.24290550958165, 19.163784938324284], [95.24733842982471, 19.16915110483967], [95.24652368811775, 19.169109852937424]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
