
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htein Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htein Taw</div><div class="name-mm">ထိန်တော</div></div>
        <span class="pcode-badge">MMR005007047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52819996035993, 23.0656096801427], [95.52864636044126, 23.077659330213976], [95.53327127964587, 23.090609969674404], [95.53743431963818, 23.09847290959715], [95.54622227973448, 23.103098190329263], [95.55362244022348, 23.106335850419214], [95.55528491976332, 23.106335850419214], [95.56009776040338, 23.106335850419214], [95.56981091963831, 23.10217308022351], [95.57906148020322, 23.101248060049954], [95.59386216001076, 23.09616026968075], [95.59795212019424, 23.095299239868098], [95.5966161602077, 23.094249480129463], [95.5966161602077, 23.08835231970386], [95.5983506403698, 23.081761350306124], [95.59626947965285, 23.07517038000907], [95.59470132010989, 23.069212019818906], [95.58692424026151, 23.067483750374834], [95.5776736796966, 23.064246090284882], [95.55917292009423, 23.056383150362137], [95.54622227973448, 23.051757869630023], [95.54622227973448, 23.052269160293577], [95.54622227973448, 23.060545919658523], [95.54252184021084, 23.065633620095525], [95.53650911960023, 23.067946260011922], [95.52910860028175, 23.067946260011922], [95.52819996035993, 23.0656096801427]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
