
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan Cho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan Cho</div><div class="name-mm">သဖန်းချို</div></div>
        <span class="pcode-badge">MMR008005008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46680883535953, 18.64444920866407], [95.46320567460225, 18.640588679923667], [95.46424604272073, 18.633566193325237], [95.46424604272073, 18.627323982815597], [95.46320567460225, 18.620561589146064], [95.45774374108083, 18.6208216811757], [95.45358226770753, 18.61327901141732], [95.44213821570617, 18.61431937863648], [95.43595825357062, 18.614391811832718], [95.4329173624464, 18.620169506317723], [95.4329173624464, 18.625947199903408], [95.43294225118399, 18.62596234988257], [95.43991141338108, 18.630204449275936], [95.44386457229223, 18.629596270151808], [95.44599319742815, 18.635678054198877], [95.44183602641152, 18.639373316325532], [95.44051959070663, 18.64054348089695], [95.44166601587398, 18.641783530885277], [95.44298037324569, 18.643205227739145], [95.44409154229089, 18.64616834639213], [95.44447904487208, 18.648131349682103], [95.44916070230465, 18.651772638996135], [95.4509813474113, 18.65099236290729], [95.46268549144236, 18.65255291508504], [95.46502631880963, 18.649691901859853], [95.46680883535953, 18.64444920866407]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
