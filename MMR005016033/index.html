
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sone Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sone Kyin</div><div class="name-mm">စုန်းကျင်း</div></div>
        <span class="pcode-badge">MMR005016033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06981381015925, 22.137549458141052], [95.06706902081874, 22.13942090595009], [95.06628034326332, 22.143561468287203], [95.06292845938094, 22.14632184377814], [95.06124188340624, 22.147120750222484], [95.0583912366663, 22.149134506752148], [95.05553459774353, 22.151152497289957], [95.04956612467697, 22.15071038877346], [95.05035792018191, 22.157042759915498], [95.05394747959258, 22.166273789903528], [95.05780056014777, 22.173594659865728], [95.06163996021604, 22.171914899852823], [95.07240972033236, 22.171914899852823], [95.08053831279295, 22.176348807551506], [95.08067372371346, 22.17215106272141], [95.08126523300416, 22.162095411074404], [95.083039759977, 22.151842592961373], [95.08736530116778, 22.148222179609945], [95.08560296360594, 22.14829353991496], [95.08284259081296, 22.149082216571117], [95.0817156854306, 22.14534548940287], [95.07869567026904, 22.14246753744692], [95.0765331640743, 22.140406755367508], [95.07396995684809, 22.13764637897725], [95.07140675231983, 22.136463361295114], [95.06981381015925, 22.137549458141052]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
