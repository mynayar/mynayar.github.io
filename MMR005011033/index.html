
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taze</div><div class="name-mm">တန့်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Kone</div><div class="name-mm">ပေကုန်း</div></div>
        <span class="pcode-badge">MMR005011033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34069827990174, 23.04632564970899], [95.34051504033692, 23.0416870500174], [95.34051504033692, 23.038330049891954], [95.34307860009739, 23.0343017400333], [95.3474731201884, 23.030273430174702], [95.34851064015396, 23.030273430174702], [95.34832776031794, 23.028320340111634], [95.34811428014996, 23.02823492969827], [95.34527603955763, 23.02709957968193], [95.33972159997194, 23.024475089953512], [95.33630375981073, 23.01971435963003], [95.3356917603665, 23.013671670011604], [95.33111580025405, 23.013122579943172], [95.31951911981162, 23.01452640007335], [95.31011951999989, 23.01647949013642], [95.3002929598523, 23.01593022020353], [95.29150391967022, 23.015502900138756], [95.2816773604219, 23.015319840438337], [95.27656428021743, 23.018447880365443], [95.2799072401271, 23.02087401022743], [95.28387444015334, 23.02331544025543], [95.29547111969646, 23.02728273021387], [95.30291735964846, 23.028686550344048], [95.3132932796612, 23.030273430174702], [95.31872568034595, 23.033081070435117], [95.32031256017655, 23.03692622976172], [95.32348631983785, 23.038696260124368], [95.32345932039141, 23.038724429588797], [95.32373040033775, 23.038879409756987], [95.32910160035863, 23.042297339850393], [95.33587643974596, 23.04492192041033], [95.33911140007109, 23.045898419576474], [95.34069827990174, 23.04632564970899]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
