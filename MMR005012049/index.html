
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sit Pon (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sit Pon (North)</div><div class="name-mm">ကျောက်စစ်ပုံ (မြောက်)</div></div>
        <span class="pcode-badge">MMR005012049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15776859984106, 22.207881869552693], [95.16447648020545, 22.209814709581224], [95.17431959956991, 22.213466100080495], [95.1745575601833, 22.2137617504045], [95.17468083115551, 22.213682096551565], [95.1833685600111, 22.208068440206375], [95.19067116024593, 22.202829540351047], [95.19479891983434, 22.201876980238524], [95.19795539992185, 22.20345522028225], [95.19781536019076, 22.202194500275994], [95.19718032011576, 22.200448140069682], [95.19297695991884, 22.196627009728786], [95.19194124039598, 22.195685520270615], [95.185432440255, 22.195685520270615], [95.18035211965469, 22.19489172017677], [95.17416083955118, 22.192034129771343], [95.16923927986892, 22.185683909784643], [95.16574656035556, 22.182350040222218], [95.15574503980179, 22.17790493956136], [95.14854324007854, 22.173472889862012], [95.14748988035376, 22.172824709792565], [95.14733112033497, 22.18028624991058], [95.14907747964202, 22.18647770987843], [95.15304612038221, 22.193462969940185], [95.15653883989563, 22.20124194016347], [95.15776859984106, 22.207881869552693]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
