
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hpan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hpan</div><div class="name-mm">သဖန်း</div></div>
        <span class="pcode-badge">MMR010031069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.83218099585633, 21.032321996263192], [95.83783807416785, 21.03434237989694], [95.8418788432341, 21.031917919176692], [95.8475359206463, 21.028281226297622], [95.85198076769831, 21.02747307212462], [95.85521338259161, 21.032726073349636], [95.85544551290013, 21.033161314642996], [95.85965822964363, 21.028685303384066], [95.86733569338759, 21.022624147986107], [95.87066803769983, 21.021747214562367], [95.86491123086864, 21.015350763127287], [95.86208269216257, 21.010501838988716], [95.8641030766957, 21.006056991936703], [95.8628181352488, 21.001428073446903], [95.85227127030294, 20.99992137627055], [95.8431688190858, 21.001377768069574], [95.83770734961456, 20.997372692196052], [95.83076027206897, 20.999109460233456], [95.83096876459689, 21.002420299956952], [95.83096876459689, 21.00888553064277], [95.83177691876983, 21.016967070573912], [95.83177691876983, 21.024240456332052], [95.83218099585633, 21.032321996263192]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
