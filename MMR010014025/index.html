
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Ga Ton</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Ga Ton</div><div class="name-mm">သင်္ဂတုံ</div></div>
        <span class="pcode-badge">MMR010014025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07188459969456, 21.743859365017727], [96.06992672973485, 21.742247001098292], [96.06793595358147, 21.741342103255533], [96.06540223872241, 21.742247001098292], [96.06214460468982, 21.74441875682021], [96.0603348090043, 21.74441875682021], [96.06087774770992, 21.747495411284262], [96.0590679520244, 21.751838921828835], [96.05780109414525, 21.756182433272727], [96.05689619630249, 21.76052594471662], [96.05544835885473, 21.76432651655557], [96.0539508671389, 21.768943785227577], [96.05436248144343, 21.769031988035863], [96.05653423716535, 21.769031988035863], [96.05961089073008, 21.769031988035863], [96.0641353808432, 21.769212966705084], [96.06703105573871, 21.767041211882486], [96.06865987185569, 21.76432651655557], [96.07101260804546, 21.762697700438594], [96.07372730157374, 21.761430842559378], [96.07626101733211, 21.761068884321617], [96.07825179258623, 21.755820474135646], [96.07825179258623, 21.752743819671593], [96.07716591517493, 21.75021010481254], [96.07535611859004, 21.746952471679265], [96.0730033841989, 21.744780715957347], [96.07188459969456, 21.743859365017727]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
