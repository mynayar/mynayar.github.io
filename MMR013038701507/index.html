
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Tan (South/East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Gyi Tan (South/East) Ward</div><div class="name-mm">မကျည်းတန်း (တောင်/အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701507</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12613369841154, 16.811843139449365], [96.12630496260402, 16.81142818236475], [96.12636756890822, 16.810613632213403], [96.12641438761398, 16.80948140464318], [96.12642335925068, 16.809192180874504], [96.1260118483682, 16.809220314366087], [96.1257305143518, 16.809221267647445], [96.12527275043715, 16.809221267647445], [96.1248226163707, 16.809221267647445], [96.12421226538379, 16.809202193926183], [96.12328910860555, 16.80920982377438], [96.12253189113392, 16.809222221828122], [96.12192367064097, 16.809291951662317], [96.12191200283672, 16.809810638350314], [96.12191200283672, 16.810529709278683], [96.12190151224507, 16.811201094554917], [96.12195610199257, 16.81190087412608], [96.12246132043367, 16.811861038656048], [96.12289810226565, 16.811841964934786], [96.1233482363321, 16.81181144734046], [96.1238231674053, 16.8117923736192], [96.12412071260087, 16.8117923736192], [96.12452125535174, 16.811800002568134], [96.12488555902138, 16.81181144734046], [96.12532234175274, 16.811830521061722], [96.12613369841154, 16.811843139449365]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
