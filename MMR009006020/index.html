
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Ka Toe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Ka Toe</div><div class="name-mm">လင်းကတိုး</div></div>
        <span class="pcode-badge">MMR009006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30500391539846, 20.57877959370336], [95.3043553845934, 20.578081178403693], [95.29622835695318, 20.57769417584558], [95.293906348799, 20.57343716119607], [95.29158434064487, 20.555248097621643], [95.28577932025951, 20.55292609036684], [95.27042410588786, 20.551902409168918], [95.26836426000267, 20.551765086289777], [95.26604225184849, 20.5676321408107], [95.2661226503401, 20.56839592423256], [95.26759025668508, 20.582338192153884], [95.26797725834388, 20.60478427037782], [95.26679348972783, 20.614846306312018], [95.27533028356578, 20.614846306312018], [95.28488444266299, 20.616040575412285], [95.28500531784118, 20.61572327660798], [95.28732732599536, 20.61146626285779], [95.28763671616156, 20.611862282018762], [95.2908103382266, 20.60904128502733], [95.30048537160269, 20.59859224923298], [95.30319438141561, 20.580790187317348], [95.30500391539846, 20.57877959370336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
