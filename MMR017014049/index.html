
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Ein Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Ein Tan</div><div class="name-mm">လေးအိမ်တန်း</div></div>
        <span class="pcode-badge">MMR017014049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93859124019366, 16.720502490397678], [94.94997264002535, 16.72347149961007], [94.95887976029275, 16.720502490397678], [94.96795175956612, 16.718358149608946], [94.9747147198085, 16.718028209934005], [94.97273543968885, 16.713244799607878], [94.97092104037375, 16.710605640138226], [94.97042604002979, 16.706976749777255], [94.96927152006464, 16.703347950247746], [94.96679723960096, 16.699884029724217], [94.96349819988205, 16.695925289620448], [94.96052927970254, 16.693121250245554], [94.95920952010334, 16.689162510141784], [94.95426131980412, 16.68998718036414], [94.94700336011704, 16.69114188019364], [94.94205515981781, 16.69114188019364], [94.9389210000042, 16.689162510141784], [94.93562232001409, 16.686523349772813], [94.93281792001108, 16.69773968983486], [94.9300138797368, 16.705987109717398], [94.92935400038687, 16.710605640138226], [94.93248816020048, 16.71637877955709], [94.93529219957543, 16.718852970088562], [94.93859124019366, 16.720502490397678]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
