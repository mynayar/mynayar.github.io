
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyat Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyat Pyin</div><div class="name-mm">ကျပ်ပြင်</div></div>
        <span class="pcode-badge">MMR010011016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.41954898679637, 22.91595882513974], [96.42280543822045, 22.91595882513974], [96.4260734935969, 22.915305214064404], [96.43021303070685, 22.913780121255627], [96.43544192020852, 22.91160141737157], [96.43979932797669, 22.910076324562795], [96.44132442078546, 22.908551231754018], [96.44393886508664, 22.905718916794626], [96.44677118004597, 22.903104471594133], [96.44851414261365, 22.901579379684676], [96.45003923632174, 22.899836417117], [96.45221794020586, 22.896786230600128], [96.45766469856704, 22.896786230600128], [96.46245784765159, 22.89526113869067], [96.46222806907019, 22.890428345691646], [96.45939022777685, 22.887074534562146], [96.45545331062186, 22.882012784962114], [96.44814189433299, 22.875263783996502], [96.44308014383364, 22.870764450618935], [96.43914322667865, 22.864015449653323], [96.43183181038978, 22.864577866775164], [96.42620764276853, 22.86795236680831], [96.4188962255804, 22.87470136777398], [96.41614663296082, 22.875732464781493], [96.41720897601351, 22.88370003542832], [96.41495930932473, 22.88988661927209], [96.41495930932473, 22.892698702183395], [96.41102239216974, 22.898322868905325], [96.40877272458164, 22.902259786060313], [96.41327205885847, 22.905071868971618], [96.41833380935788, 22.909571203248504], [96.42002105892476, 22.914070536626014], [96.41954898679637, 22.91595882513974]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
