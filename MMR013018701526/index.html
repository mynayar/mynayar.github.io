
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (106) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (106) Ward</div><div class="name-mm">အမှတ် (၁၀၆) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701526</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25893211442559, 16.890470504410303], [96.26181413761242, 16.88811246311974], [96.26230459458145, 16.88773479102781], [96.26675904009767, 16.884047144360295], [96.26651107002994, 16.88376725465514], [96.26241031438457, 16.879138646431443], [96.26157188543425, 16.879833221625915], [96.26038932820501, 16.880792616586064], [96.25963974058163, 16.881393432960635], [96.25828743002091, 16.882505416791616], [96.25746663407796, 16.883178076407148], [96.25580024698388, 16.88455009471113], [96.25457440538457, 16.885535604184838], [96.25533954318541, 16.88639818892534], [96.25646264893214, 16.887749723371087], [96.25726214802978, 16.888663436368518], [96.25829007492706, 16.889767506165526], [96.25893211442559, 16.890470504410303]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
