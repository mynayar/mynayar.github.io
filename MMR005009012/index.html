
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moke Si</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moke Si</div><div class="name-mm">မုတ်စီ</div></div>
        <span class="pcode-badge">MMR005009012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41425275985705, 22.73072508019834], [95.41088027970119, 22.728557160084904], [95.40678527971693, 22.730243309780974], [95.39979983979083, 22.73048415002353], [95.38992360019404, 22.724703000343254], [95.38918812023564, 22.724351369919816], [95.38915356018873, 22.724364060253208], [95.37884316028368, 22.720126319873827], [95.37306191977183, 22.71964455035578], [95.36928551991087, 22.723420860284534], [95.36677704002841, 22.729131629920857], [95.3728210804286, 22.73554268994326], [95.37603912000947, 22.736532779664117], [95.37908399962691, 22.737469769814084], [95.38486524013877, 22.739878530170074], [95.3940186001783, 22.739878530170074], [95.39721503984225, 22.739878530170074], [95.40341316018925, 22.739878530170074], [95.40749915975846, 22.73954427015201], [95.40991691963018, 22.739155920409473], [95.41304819981463, 22.736024460360625], [95.41425275985705, 22.73072508019834]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
