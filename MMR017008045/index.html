
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Di</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Di</div><div class="name-mm">လယ်တီ</div></div>
        <span class="pcode-badge">MMR017008045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40545472015924, 17.67724352956526], [95.40017711977833, 17.677983239934633], [95.39799335990568, 17.67787632043587], [95.39743510844357, 17.67776028271095], [95.39754371956707, 17.678519459805273], [95.39672976027026, 17.680249259895504], [95.39591544034533, 17.68197914991788], [95.39550215959707, 17.682857819932508], [95.39526311979722, 17.68361147968608], [95.39436779973425, 17.686435049637907], [95.39384328004337, 17.688089429883348], [95.39384328004337, 17.69038614010833], [95.39448119974764, 17.69217254982334], [95.39691012020592, 17.691486209720836], [95.40035064036982, 17.690513760201895], [95.40194580025855, 17.690449949705453], [95.40354060041841, 17.69038614010833], [95.4047235596446, 17.690555159592975], [95.40711359971294, 17.690896529651184], [95.40830700006808, 17.69124131983108], [95.40876384037898, 17.689108410324934], [95.40966564005731, 17.684899379902504], [95.41011204013859, 17.68355964006537], [95.41055879994872, 17.682219810296033], [95.40649476002523, 17.67825738027392], [95.40557692543484, 17.677362658260108], [95.40545472015924, 17.67724352956526]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
