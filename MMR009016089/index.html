
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tin Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tin Taw</div><div class="name-mm">တင်းတော</div></div>
        <span class="pcode-badge">MMR009016089</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70820232917418, 19.246142586811004], [95.70559745276029, 19.25750931870016], [95.70416282365545, 19.266834409680314], [95.70021759316745, 19.27149695562008], [95.69232713129213, 19.27149695562008], [95.67833949437221, 19.26647575285375], [95.67044903339621, 19.262889179192314], [95.66913072440349, 19.264483412779327], [95.65514713443275, 19.281393801382876], [95.65502676737145, 19.281539361152625], [95.65517858282539, 19.281765320313355], [95.67044903339621, 19.30449343222614], [95.6766696988476, 19.309547722849175], [95.68192606803365, 19.31381852320635], [95.68838189990481, 19.31668778231534], [95.70559745276029, 19.315253152311186], [95.72137837561161, 19.31632912369014], [95.74040308563394, 19.31998033072773], [95.74146318757613, 19.31776375369435], [95.74397378895924, 19.308080004988312], [95.74182184530196, 19.299113571733983], [95.74720170489485, 19.291223109858663], [95.7576027690526, 19.291223109858663], [95.76441725775032, 19.285484591640625], [95.7715904050732, 19.283332647983343], [95.7776875801178, 19.279387416596023], [95.77836944969039, 19.273250592241084], [95.77302503507735, 19.27149695562008], [95.74397378895924, 19.262889179192314], [95.71312925690972, 19.24854288544583], [95.70820232917418, 19.246142586811004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
