
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Kei Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Kei Kyin</div><div class="name-mm">သက္ကယ်ကျင်း</div></div>
        <span class="pcode-badge">MMR005021004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15832524041758, 24.266113289996383], [96.14083565244346, 24.263478208952222], [96.13012152169091, 24.266084348913637], [96.11663873808737, 24.270328928637184], [96.10898283289146, 24.258845071742712], [96.10685451082708, 24.247710732764176], [96.10753497835663, 24.238864668369786], [96.11064539966554, 24.21682857038229], [96.10192692029119, 24.219206369778192], [96.09201971973431, 24.220395269925802], [96.08369760036402, 24.222376710217077], [96.08465886321602, 24.23510024388122], [96.08987114223947, 24.2504475109439], [96.09717168032887, 24.26319522018332], [96.10374833791553, 24.275962293625014], [96.10390835968309, 24.27627294014411], [96.11143811967355, 24.287765489885487], [96.12649727992562, 24.292124729572663], [96.1435382401977, 24.282613710054704], [96.15832524041758, 24.266113289996383]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
