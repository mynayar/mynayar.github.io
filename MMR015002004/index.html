
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Yin Hmu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Yin Hmu</div><div class="name-mm">ဥယျာဉ်မှူး</div></div>
        <span class="pcode-badge">MMR015002004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.87235878073318, 23.284607700584957], [97.87747812741372, 23.285777838176728], [97.88195151355154, 23.28787176387084], [97.88490204529319, 23.289013905567344], [97.89118382237558, 23.290631938812965], [97.89756077830731, 23.292154794108512], [97.90298594934217, 23.294058362103783], [97.90572304857989, 23.29484039097133], [97.90637839534674, 23.293529699236274], [97.90732692469788, 23.293070733827335], [97.91050504607108, 23.292630685657684], [97.91297968536423, 23.291869257560222], [97.91583503825649, 23.291012652412007], [97.92030842529363, 23.28958497596591], [97.92544806067951, 23.289299440316995], [97.93163465981178, 23.28958497596591], [97.93601286799952, 23.289489797116516], [97.94039107618727, 23.289204262366866], [97.94476928437501, 23.288252476570563], [97.9484812433148, 23.288918726717895], [97.9524787379035, 23.288728369918374], [97.95407795193597, 23.287886679126984], [97.94740718299516, 23.28452166694143], [97.9387699483745, 23.28016468904923], [97.92725691297619, 23.277563773249597], [97.91388811844195, 23.267340577006053], [97.90688826508142, 23.27007339457157], [97.90003541760052, 23.27026375227041], [97.8895657891299, 23.271025180367815], [97.88023830055721, 23.273309462861448], [97.8735758107751, 23.274737139307604], [97.87039875869584, 23.27527663810639], [97.870352716105, 23.276335624889214], [97.87239962973916, 23.284523279425855], [97.87235878073318, 23.284607700584957]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
