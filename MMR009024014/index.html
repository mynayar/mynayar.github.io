
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yin Chaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yin Chaing</div><div class="name-mm">ဝါးရင်းချိုင်</div></div>
        <span class="pcode-badge">MMR009024014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.11474327428272, 21.69215473705151], [94.11512074762447, 21.697942670318014], [94.1152288344432, 21.698187666327783], [94.11565667341682, 21.699157433169034], [94.11876503617754, 21.706203058424478], [94.12046570362935, 21.712519825429638], [94.1218031223163, 21.713666183147893], [94.12386704033173, 21.71543525483321], [94.12565363800508, 21.72030779516865], [94.12653951788451, 21.722723831939334], [94.12684444831268, 21.72379108798839], [94.12725102191717, 21.72521409605372], [94.1279972343849, 21.72782583609353], [94.1309126646878, 21.729283551694607], [94.13577171609188, 21.72733993059336], [94.13844419364466, 21.723695642939617], [94.13747238444307, 21.714706398381622], [94.13798812495207, 21.71461262697119], [94.13625762069267, 21.71300573003049], [94.13674352619284, 21.707903725876292], [94.13795828904387, 21.697942670318014], [94.13528581059177, 21.687981614759735], [94.1275113288848, 21.681907801403952], [94.12421847110562, 21.680684738709772], [94.12372923271795, 21.68239707396583], [94.12323999433033, 21.68410940832257], [94.11912725701734, 21.685206137853015], [94.11447786815916, 21.686300111860703], [94.11439189027357, 21.686766851908715], [94.11474327428272, 21.69215473705151]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
