
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mut Layt Lai Kwar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mut Layt Lai Kwar</div><div class="name-mm">မွတ်လေ့လိုင်ကွာ</div></div>
        <span class="pcode-badge">MMR015008027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.03535403236276, 22.826564047293004], [99.03458264966963, 22.823735649780474], [99.03571357682017, 22.821699982168468], [99.035487392829, 22.81627153400416], [99.03390409409872, 22.81287875525038], [99.03118987181517, 22.80745030798539], [99.02983275887476, 22.80179567582985], [99.0327731678475, 22.79817671128626], [99.03322553762854, 22.795236303212846], [99.03322553762854, 22.790712598207904], [99.02779709306145, 22.78664126298395], [99.02710657380942, 22.782498159162742], [99.02535070956765, 22.781717437909492], [99.02209240464083, 22.779002968312398], [99.02201047370448, 22.778768345982428], [99.02191627511604, 22.77849859163672], [99.01897586704268, 22.773974884833137], [99.00630948889187, 22.767641697106683], [98.99672031828811, 22.77089839764301], [98.99658405391102, 22.77084538440704], [98.99457724734214, 22.76883821990799], [98.99138126093652, 22.769903549609182], [98.9879884803841, 22.772617774590685], [98.98423979493066, 22.77382702819483], [98.98613527082614, 22.77482117295881], [98.99512111504748, 22.78583607927169], [98.99946910421585, 22.798010448223636], [99.00004883598507, 22.808445620968655], [99.01425226702855, 22.825547710858245], [99.02318483541188, 22.83199843098288], [99.03535403236276, 22.826564047293004]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
