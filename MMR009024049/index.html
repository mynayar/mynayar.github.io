
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan</div><div class="name-mm">လက်ပန်</div></div>
        <span class="pcode-badge">MMR009024049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.16404414302286, 21.757107060442536], [94.16371126076615, 21.756737191768025], [94.16492602361717, 21.753092904114283], [94.16808440756944, 21.749934520162014], [94.17610184202647, 21.74143118020487], [94.17974613057953, 21.736086224199937], [94.18023203607964, 21.732441934747555], [94.17991380198043, 21.731381155615907], [94.17950317782947, 21.731956030146705], [94.17415822182454, 21.728797647093813], [94.16735555021853, 21.725882215891602], [94.16225354606433, 21.725882215891602], [94.15617973180923, 21.72661107414183], [94.152049537756, 21.729283551694607], [94.15202827958149, 21.729092227224555], [94.15034887030419, 21.733170792997726], [94.1481622973522, 21.737300987050958], [94.14913410655384, 21.741188228354133], [94.14451800789982, 21.743617753156855], [94.14152829899189, 21.74553970869067], [94.14111667209681, 21.74580432700816], [94.1420884830971, 21.74701908895986], [94.14743343910197, 21.751878141263262], [94.15496496895821, 21.755279477066267], [94.1605528777132, 21.75770900186899], [94.16404414302286, 21.757107060442536]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
