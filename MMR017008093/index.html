
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yon Tha Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yon Tha Lin</div><div class="name-mm">ယုံသလင်း</div></div>
        <span class="pcode-badge">MMR017008093</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.30726759981991, 17.543200950063863], [95.3045877604169, 17.537267609912305], [95.30433287995851, 17.532418860242274], [95.30433287995851, 17.52323175044495], [95.3048429997047, 17.522466209747847], [95.29795295986128, 17.52297660019002], [95.29361459973404, 17.523104220283585], [95.29052579992577, 17.52194142026036], [95.28276851955161, 17.519021010411336], [95.28200352024635, 17.518770450296074], [95.2761639595991, 17.516857499673904], [95.27332860043464, 17.51727951014135], [95.27228568004017, 17.517317760106607], [95.26590499102258, 17.517784480369528], [95.26933389284494, 17.520233699425717], [95.26786436195079, 17.524397368943482], [95.26835420738081, 17.528805958927933], [95.27375963559876, 17.52864095761413], [95.27611161995537, 17.529106947627554], [95.27649695966699, 17.53005645004521], [95.2793233202151, 17.529803100232925], [95.28251328026374, 17.531717130041557], [95.28697944034894, 17.53401384026654], [95.28889320036097, 17.53554509972662], [95.29642151963748, 17.541669779636663], [95.29833564027763, 17.543711430438236], [95.29986671987331, 17.54269055962169], [95.30318447987992, 17.54269055962169], [95.30726759981991, 17.543200950063863]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
