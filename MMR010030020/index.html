
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Gyi</div><div class="name-mm">ရွာကြီး</div></div>
        <span class="pcode-badge">MMR010030020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.019001915606, 20.88112428575721], [96.01627378620634, 20.879911783801845], [96.01051440011952, 20.879608659212295], [96.00738685571889, 20.879789958040192], [96.00298154825992, 20.8851392595692], [95.99889090639027, 20.890488561997586], [95.99875117782466, 20.890762195119237], [95.99230302976105, 20.903389818785172], [95.99322693927189, 20.903389818785172], [95.99385626865194, 20.908424455624186], [95.99417093424125, 20.914088422742566], [95.99511492831135, 20.91943772517095], [95.9968897772415, 20.922987422131882], [95.99960187982293, 20.9193181063456], [96.00263313561078, 20.91537747319188], [96.00627064327563, 20.91022433898212], [96.00839252079828, 20.905071204772355], [96.01172690207494, 20.900524322439594], [96.0150612833516, 20.892643057031535], [96.01839566462826, 20.885368044399797], [96.019001915606, 20.88112428575721]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
