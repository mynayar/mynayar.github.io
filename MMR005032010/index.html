
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mauk Sa Hpar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mauk Sa Hpar</div><div class="name-mm">မောက်စဖာ</div></div>
        <span class="pcode-badge">MMR005032010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.79285459985994, 24.156342089615805], [94.77401148004583, 24.147895049916656], [94.7382739202053, 24.14074760971448], [94.71293315993745, 24.138798300401277], [94.68044459973856, 24.1316508601991], [94.6636297200356, 24.1283812498948], [94.65954371956707, 24.140639340333337], [94.65694451967391, 24.15276836996435], [94.65629220002506, 24.1651623596552], [94.66907364013645, 24.16922919017503], [94.67773740026087, 24.17442732016474], [94.68899999965032, 24.185690010385713], [94.68899999965032, 24.198685380326083], [94.68684180030891, 24.21091530040087], [94.69603907963989, 24.207024059812568], [94.70968416029581, 24.20182592982286], [94.73892371995379, 24.19272918030748], [94.73894675968529, 24.192732690361424], [94.75386840010663, 24.18038352018334], [94.77855972035485, 24.166088639778934], [94.78765655980243, 24.160240710040796], [94.79285459985994, 24.156342089615805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
