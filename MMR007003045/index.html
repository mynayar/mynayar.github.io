
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Hne</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Hne</div><div class="name-mm">အုန်းနှဲ</div></div>
        <span class="pcode-badge">MMR007003045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.59198964090928, 17.076353792793327], [96.5856067053852, 17.074530115172706], [96.58013566532873, 17.073162356057935], [96.57557646408259, 17.071794596943164], [96.57374506668157, 17.07590866255481], [96.57181070500008, 17.079208458603546], [96.57135556081056, 17.081484178651976], [96.56463612235922, 17.0848438992266], [96.56494117959181, 17.085016265088598], [96.56903937936391, 17.086384023304106], [96.57347920460165, 17.087751782418877], [96.5717670537066, 17.091855057964608], [96.57005089183525, 17.10006160995539], [96.57023354504213, 17.10255576633557], [96.57564470463944, 17.102113247728255], [96.58350932719378, 17.09869385084062], [96.58795455196105, 17.10006160995539], [96.5961611228376, 17.10416488640044], [96.60375220220243, 17.10874687826589], [96.60881290768958, 17.100745488613484], [96.60915484162268, 17.09595833440966], [96.60676125372896, 17.090487298849837], [96.60450264058443, 17.08638072998673], [96.60110799034152, 17.085928103898937], [96.59518103087993, 17.085928103898937], [96.58970999082345, 17.08456034478411], [96.59198964090928, 17.076353792793327]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
