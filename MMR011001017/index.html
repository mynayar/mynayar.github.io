
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawt Kha Mei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mawlamyine</div><div class="name-mm">မော်လမြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawt Kha Mei</div><div class="name-mm">ကော့ခမယ်</div></div>
        <span class="pcode-badge">MMR011001017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.66737564127288, 16.365062788816715], [97.65422796844604, 16.365427811044697], [97.65030137460883, 16.36567839364301], [97.65059493400906, 16.367244256317406], [97.65205976144887, 16.370174163906597], [97.65205970838889, 16.373397038242786], [97.6519757728637, 16.3736488367245], [97.65419074910386, 16.374820135340997], [97.65545347010163, 16.37536130238226], [97.6561389477543, 16.375875412420385], [97.65761813466924, 16.376984799908655], [97.65990571407752, 16.37804060668867], [97.65996318795084, 16.378067132192427], [97.66288826168397, 16.378206422788253], [97.66350406795846, 16.37823574608285], [97.66455317838654, 16.373923914157388], [97.66737564127288, 16.365062788816715]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
