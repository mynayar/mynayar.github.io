
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pauk Kan</div><div class="name-mm">ပေါက်ကန်</div></div>
        <span class="pcode-badge">MMR007003060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70072649323316, 17.083990446202165], [96.73186471238665, 17.084412329865188], [96.73232178382335, 17.056122361657742], [96.73232178292398, 17.04962550811075], [96.73266372225305, 17.04381253412123], [96.7319641432307, 17.040081467285916], [96.72773978026669, 17.039025379018085], [96.71748159140236, 17.03834149856135], [96.71572275490126, 17.030773208916514], [96.71292892283157, 17.032103605696875], [96.70973597163783, 17.032369685412675], [96.70827253634855, 17.033034883353253], [96.70813949604099, 17.034764398358334], [96.70108839571293, 17.037957348652753], [96.70255183190159, 17.04234765721867], [96.69867491571483, 17.044667382893465], [96.70667605985233, 17.056050737851308], [96.70627694072829, 17.056982016407005], [96.70614390221937, 17.059376729352607], [96.70867165457327, 17.062303600830546], [96.70960293222959, 17.063767037019204], [96.71000205135363, 17.066161749964863], [96.71106636841824, 17.06908862234212], [96.7130619622398, 17.07254765235234], [96.7115985260512, 17.074410206765663], [96.70920381310555, 17.074809325889703], [96.704813505439, 17.07813531739106], [96.70072649323316, 17.083990446202165]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
