
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Nei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Nei</div><div class="name-mm">တနယ်</div></div>
        <span class="pcode-badge">MMR005010003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38067627988647, 22.65130611038876], [95.38452144011245, 22.64367671990476], [95.38592544010703, 22.639526370245846], [95.38452144011245, 22.639099140113274], [95.38207992015225, 22.628112750403147], [95.38452144011245, 22.61791989009089], [95.38610831994305, 22.60711673994564], [95.38549812004226, 22.59930419982902], [95.38531487957806, 22.59930419982902], [95.37792984028994, 22.593505859607774], [95.37188723970439, 22.597717319998367], [95.3640748803515, 22.597717319998367], [95.35827636026585, 22.59570312010294], [95.35791023996563, 22.600097640194008], [95.35827636026585, 22.607482950178053], [95.36492915985292, 22.6132812903993], [95.3632810802577, 22.621887180049384], [95.35327164027404, 22.628112750403147], [95.35791023996563, 22.63287356975951], [95.36187743999193, 22.644470250201948], [95.37347412043437, 22.649108849893537], [95.3773808401537, 22.650162209618316], [95.37731280014566, 22.65027992997483], [95.38067627988647, 22.65130611038876]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
