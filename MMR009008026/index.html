
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Nauk Lay Ein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Nauk Lay Ein</div><div class="name-mm">အနောက်လေးအိမ်</div></div>
        <span class="pcode-badge">MMR009008026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.55020053802446, 20.324376840818616], [94.5501181664203, 20.32415718230817], [94.55113925397347, 20.321207371822823], [94.55261415921615, 20.317349927756993], [94.55352179189725, 20.313605937663965], [94.553748700742, 20.311450307685618], [94.5537331712489, 20.31136955126385], [94.55107689408345, 20.31025562759521], [94.53800628865935, 20.309652368661943], [94.53553269707635, 20.309298998949714], [94.53276475738772, 20.312897321354342], [94.52992889370353, 20.317682839691372], [94.5299628404128, 20.317695818707136], [94.53030636344795, 20.318726386013964], [94.5349899957917, 20.32413057766405], [94.53961497884825, 20.32433166517427], [94.54383778958237, 20.32413057766405], [94.54413942039798, 20.32399652112258], [94.544843220838, 20.32493492320816], [94.55007146282782, 20.32433166517427], [94.55020053802446, 20.324376840818616]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
