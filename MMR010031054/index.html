
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpo Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpo Kone</div><div class="name-mm">ဖိုကုန်း</div></div>
        <span class="pcode-badge">MMR010031054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.86652753921464, 21.193144629920766], [95.87380092407346, 21.197993554059337], [95.87622538569303, 21.206883247264102], [95.87582130860659, 21.21375255593574], [95.89117623429581, 21.211732171402616], [95.89870550325645, 21.211732171402616], [95.89828832844364, 21.204431620722744], [95.89828832844364, 21.19509723884653], [95.89828832844364, 21.191623398800857], [95.89400477300194, 21.179406012577488], [95.89077215720937, 21.169708166099042], [95.88471100181135, 21.16122254998072], [95.88228654109105, 21.163242933614526], [95.8780198677228, 21.161895563929193], [95.87561497355227, 21.16464401440976], [95.87154525620866, 21.16844241798327], [95.87154525620866, 21.177124482908596], [95.87197495318162, 21.17981008966393], [95.86773976957477, 21.17981008966393], [95.86652753921464, 21.185871245061946], [95.86652753921464, 21.193144629920766]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
