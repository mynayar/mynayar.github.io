
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Beik Theik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Beik Theik</div><div class="name-mm">ဘိတ်သိတ်</div></div>
        <span class="pcode-badge">MMR013025055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75202268689753, 16.666045814662652], [96.75158538435807, 16.665168014292476], [96.7487901538426, 16.66054563027666], [96.74790231883702, 16.65834210420479], [96.74631763784879, 16.655938907954294], [96.74554987582616, 16.655286673741045], [96.74339915884417, 16.65135363266404], [96.7433718824065, 16.651337100426872], [96.7277311440771, 16.66160128237334], [96.71037119967121, 16.671606750051524], [96.706097640194, 16.676542349949557], [96.69937067981306, 16.680631050182853], [96.69312467956036, 16.684326449905768], [96.68593943995324, 16.688637449958378], [96.68869236006441, 16.69337451012558], [96.69200111965603, 16.698256380027942], [96.70263408029865, 16.691915340320747], [96.709473720336, 16.687393649797173], [96.71497127960095, 16.6827274202343], [96.71754672030494, 16.68081320966195], [96.72001754467402, 16.679699973075344], [96.75200354842508, 16.666062632884234], [96.75202268689753, 16.666045814662652]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
