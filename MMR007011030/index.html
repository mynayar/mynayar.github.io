
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pin Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Pin Seik</div><div class="name-mm">ကျွန်းပင်ဆိပ်</div></div>
        <span class="pcode-badge">MMR007011030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.71640929105598, 18.430660108277436], [96.72140923834576, 18.41747067543139], [96.71224897960678, 18.414853457621007], [96.70745075025201, 18.414853457621007], [96.69349226215826, 18.41441725495241], [96.68389580165001, 18.414853457621007], [96.67822516605861, 18.41616206562685], [96.66732009844384, 18.41965168787516], [96.65815983970492, 18.42183270211757], [96.65859604327284, 18.429030046599394], [96.65728743436767, 18.43513688575871], [96.65859604327284, 18.440807521350052], [96.65728743436767, 18.44822296761589], [96.65728743436767, 18.452148793432116], [96.6546452918468, 18.459084417212125], [96.65772363703627, 18.462399556594335], [96.66034085394733, 18.463271962830845], [96.66339427262761, 18.470251207327408], [96.66463153291897, 18.47184197043066], [96.6693745987588, 18.465424879554575], [96.68471199935937, 18.452132468038997], [96.70260563204437, 18.440885041111812], [96.71640929105598, 18.430660108277436]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
