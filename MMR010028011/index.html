
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aint Gyi Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aint Gyi Lel</div><div class="name-mm">အိုင့်ကြီးလည်</div></div>
        <span class="pcode-badge">MMR010028011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.75461689305524, 20.82272454510172], [95.75310866883007, 20.822100451574613], [95.7478191596266, 20.821108669329703], [95.73856251874531, 20.815819160126182], [95.73162003943332, 20.81614975540691], [95.72566934056766, 20.81912510304113], [95.71938805001855, 20.82342282910031], [95.71971864439996, 20.82937352706665], [95.72401636955988, 20.833340658744476], [95.72864469000052, 20.835654819414458], [95.73558717111109, 20.835654819414458], [95.7408766794153, 20.83201828121878], [95.74649678300017, 20.831357093355223], [95.75145569692296, 20.831357093355223], [95.758728772415, 20.833671253125885], [95.76401828071914, 20.83499362975226], [95.77096076093045, 20.836316007277958], [95.7788950251853, 20.836316007277958], [95.78054184572966, 20.83644268578138], [95.77463487100255, 20.828689782407594], [95.76878479817998, 20.828039774016418], [95.76336806368528, 20.82695642729732], [95.75730132169872, 20.824573063795924], [95.75461689305524, 20.82272454510172]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
