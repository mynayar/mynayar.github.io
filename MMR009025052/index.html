
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Soke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Soke</div><div class="name-mm">ပဆုပ်</div></div>
        <span class="pcode-badge">MMR009025052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.21017990268041, 21.392096017317385], [94.20497985983275, 21.387242644232686], [94.20484413504886, 21.386922717609366], [94.20125545157788, 21.378463680954155], [94.20418177267072, 21.37287706812225], [94.2044315180002, 21.36263753569375], [94.20192879198021, 21.36128738170737], [94.19530513762209, 21.356058181040282], [94.19025024355398, 21.35135190017013], [94.18972732375704, 21.345599779706106], [94.18763564277077, 21.342462259126023], [94.1524256917923, 21.33461845767573], [94.14534683568797, 21.33093155384819], [94.14405897144445, 21.330260790902855], [94.14395605572747, 21.330439539253405], [94.14442271303784, 21.330501759748472], [94.14791199444306, 21.336608001757952], [94.15292783635061, 21.350128966978275], [94.1579436773589, 21.36212337079695], [94.16034255776287, 21.37433585571523], [94.16357574462495, 21.38415977005741], [94.16601264027116, 21.39156418164174], [94.16642832670595, 21.391520881083864], [94.17648048358751, 21.39047378243913], [94.18040592629251, 21.39112802214055], [94.18324096709699, 21.39287266194384], [94.18934720910647, 21.394399223345545], [94.19370881041334, 21.39330882324367], [94.19872465232089, 21.392436502442706], [94.20265009412662, 21.39330882324367], [94.20919249563724, 21.392436502442706], [94.21017990268041, 21.392096017317385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
