
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hin Khwet Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hin Khwet Aing</div><div class="name-mm">ဟင်းခွက်အိုင်</div></div>
        <span class="pcode-badge">MMR010020067</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09672526425959, 20.72174850389041], [95.09981863801977, 20.72587300433571], [95.10359942927028, 20.729653793787577], [95.10359942927028, 20.734122001629146], [95.10084976290631, 20.738933916866813], [95.096179373979, 20.742269908829257], [95.09844380483776, 20.743402124708325], [95.1025683043838, 20.745464373582024], [95.107723927917, 20.74718291505951], [95.11700405099623, 20.74718291505951], [95.12215967542875, 20.74718291505951], [95.12559675658508, 20.746495499367825], [95.12559675658508, 20.739277625162345], [95.1269715897671, 20.733090876742608], [95.13453317226816, 20.728622669800416], [95.14243846216533, 20.724154461958904], [95.14450071103903, 20.718998838425705], [95.14106362898337, 20.711437256824013], [95.13968879580136, 20.708343883063776], [95.13522058795985, 20.7049068001088], [95.12903384043943, 20.697688926802584], [95.11769146668792, 20.702157133744777], [95.10841134360868, 20.7049068001088], [95.10188088689347, 20.70765646557345], [95.10050605371146, 20.715561756369993], [95.09672526425959, 20.72174850389041]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
