
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Oe Bo Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Oe Bo Ward</div><div class="name-mm">မြို့မအိုးဘိုရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009001701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.91995689709319, 20.152069610124443], [94.92036892508588, 20.15214265126241], [94.92059811910798, 20.15186775189528], [94.92064006798483, 20.151206420140227], [94.92084279226111, 20.15123020181244], [94.92093561398747, 20.151311210044355], [94.92298048436191, 20.151435915435172], [94.92331595486746, 20.15013587347181], [94.92013092310367, 20.149976845455114], [94.91995689709319, 20.148668637647575], [94.91848173194643, 20.148625864991743], [94.9184822157817, 20.148332974687094], [94.91646291942823, 20.148301850949736], [94.91638403989157, 20.148621621990287], [94.91633509788653, 20.1489084157908], [94.91620422764305, 20.14950328135143], [94.91613284395567, 20.150026763224616], [94.91606146026822, 20.150371784530307], [94.91600197371218, 20.150859574110086], [94.91601170347741, 20.151058932223975], [94.91593531776078, 20.151284278047058], [94.91702147935786, 20.15148899612035], [94.91702356668429, 20.151679021969358], [94.91995689709319, 20.152069610124443]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
