
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oe Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oe Bo</div><div class="name-mm">အိုးဘို</div></div>
        <span class="pcode-badge">MMR017009063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54307299961931, 17.538196589800805], [95.54505264036715, 17.541647009701762], [95.54966100035494, 17.54302958964388], [95.55396227963553, 17.54233829967285], [95.55726492023996, 17.539880490292433], [95.55803315980256, 17.537422590080496], [95.55787943958455, 17.53557921011253], [95.55780275978958, 17.53411986044324], [95.55764903957157, 17.532199709848783], [95.55749532025288, 17.529204149951624], [95.55680412021405, 17.526669480012515], [95.5567947600702, 17.524397969690597], [95.54905187964061, 17.522195219733646], [95.54508215971396, 17.52118532963931], [95.53862520009295, 17.5195428303374], [95.53465800006671, 17.51826023971836], [95.53462647703037, 17.518764878096704], [95.53450931964943, 17.520640380049542], [95.53151497473635, 17.521659663562673], [95.53021056026921, 17.522103690333097], [95.52995630394031, 17.52225808324397], [95.52949379969914, 17.522538929827817], [95.52764988013791, 17.5236586199494], [95.52614076018801, 17.524641780393893], [95.52655223959425, 17.525121930232956], [95.5315184398242, 17.52734727026035], [95.54343947964833, 17.533659060417335], [95.54307299961931, 17.538196589800805]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
