
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mya Yeik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yinmarbin</div><div class="name-mm">ယင်းမာပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mya Yeik</div><div class="name-mm">မြရိပ်</div></div>
        <span class="pcode-badge">MMR005016008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9973367602833, 22.185597689981478], [95.00061276027071, 22.18576148980094], [95.0077926003483, 22.18371012002609], [95.012920799955, 22.17499191044834], [95.012920799955, 22.16473523963964], [95.0134402798451, 22.164670349956737], [95.01189516003365, 22.162683959796937], [95.01651071999379, 22.15447856973026], [95.02471619999267, 22.152427289887555], [95.03138303979551, 22.148324640270005], [95.03100963678537, 22.143096302052754], [95.02556481916116, 22.1403738923413], [95.02030696069772, 22.1359047141313], [95.01894935672749, 22.134909137646616], [95.01804936018988, 22.134990959765048], [95.00727960007356, 22.13755506001803], [94.98830508031529, 22.13755506001803], [94.9848861600683, 22.136871329748146], [94.98420216000176, 22.138580789871583], [94.97497139981033, 22.13755506001803], [94.97312496034868, 22.13909361028192], [94.97189412031747, 22.14011925020327], [94.97343275961424, 22.14781172992747], [94.98009960031635, 22.147298910416453], [94.98779208004049, 22.148324640270005], [94.98779208004049, 22.152427289887555], [94.98727907976576, 22.161658229943384], [94.99035636015793, 22.16832506974623], [94.99497192011808, 22.17755609973426], [94.9973367602833, 22.185597689981478]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
