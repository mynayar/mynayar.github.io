
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR005019005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.80696371989984, 21.894535350026445], [94.8177342777148, 21.892601767157885], [94.82446680579852, 21.88738948813443], [94.82989626300218, 21.88152567277166], [94.83272639980356, 21.873690990446903], [94.8324758396883, 21.87358362038782], [94.82676551971304, 21.874136310442395], [94.82407667989492, 21.8724251398084], [94.81509791963333, 21.87474219000012], [94.81220172043311, 21.8724251398084], [94.81191192019901, 21.869818470146356], [94.80872591986537, 21.864605039990636], [94.80245976040965, 21.863602439800786], [94.80245976040965, 21.864668399926757], [94.80157344076173, 21.866883845613017], [94.80213396031405, 21.866786369895124], [94.80425184035022, 21.878353530091374], [94.80571812019514, 21.886010730311], [94.8066955195826, 21.8939936397947], [94.8060522003488, 21.894189479760712], [94.80696371989984, 21.894535350026445]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
