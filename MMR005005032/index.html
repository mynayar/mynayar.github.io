
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saw Gyi</div><div class="name-mm">စောကြီး</div></div>
        <span class="pcode-badge">MMR005005032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.61428563597337, 22.85574411589829], [95.61423544570931, 22.855325869093633], [95.61546050309983, 22.853400780321806], [95.61815805914716, 22.853502496343197], [95.62319974217439, 22.85648286579169], [95.62631099265826, 22.855549489117664], [95.62986964866542, 22.85040799123584], [95.6320862571751, 22.844825392078235], [95.63313297540657, 22.843786781234996], [95.63567109064837, 22.84312466257319], [95.63610924034924, 22.83806034001276], [95.63647464029248, 22.83190920024947], [95.63208012020146, 22.828674329856483], [95.6276856001104, 22.82171633993721], [95.61932387999315, 22.815307619950772], [95.61188592009921, 22.814667270278335], [95.61187728031229, 22.814697240185524], [95.6101075197463, 22.814514179585785], [95.60009772003383, 22.82250978030214], [95.59588607977884, 22.8275146801584], [95.58111563967509, 22.825927710395547], [95.57391348022298, 22.82312016006739], [95.57891855994365, 22.828674329856483], [95.57989488014465, 22.83532713034282], [95.58832572035578, 22.842241110139184], [95.59832759973898, 22.848876989881205], [95.61132828017605, 22.85491940970303], [95.61428563597337, 22.85574411589829]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
