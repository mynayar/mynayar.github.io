
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Huong</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Huong</div><div class="name-mm">ပန်ဟုန်း</div></div>
        <span class="pcode-badge">MMR015001029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.79520968987532, 22.909967571346385], [97.80579588307359, 22.910055828114025], [97.8177445419771, 22.908917860171186], [97.82571031487919, 22.906641925184772], [97.83253811983843, 22.90180556277653], [97.83737448224662, 22.896400217296218], [97.83965041723303, 22.888434445293456], [97.84262124937123, 22.87913111520885], [97.84107287671196, 22.877054768562743], [97.83538303879624, 22.874209849604938], [97.83310710380988, 22.870511456038912], [97.82741726589416, 22.861407716093254], [97.82519823011427, 22.85682739696682], [97.82400336386422, 22.853726434727207], [97.82172742887781, 22.85059702423331], [97.81524664081985, 22.843841123668994], [97.80039053759327, 22.84689862976802], [97.78927207794408, 22.85139678413435], [97.78389000781766, 22.857140336757197], [97.77791567926522, 22.863399158644313], [97.77051889033459, 22.868804505023945], [97.76141514859029, 22.873071882561362], [97.75857023143112, 22.876485784591353], [97.75771675502426, 22.881322146999537], [97.75617386643086, 22.881084779938703], [97.75970819757532, 22.88871893593017], [97.76653600343388, 22.894977757817344], [97.76824295534817, 22.898676152282633], [97.77222584134955, 22.903228022255462], [97.77763118682986, 22.90635743274936], [97.78844187779049, 22.908633367735774], [97.79520968987532, 22.909967571346385]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
