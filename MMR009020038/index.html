
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gyoke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gyoke</div><div class="name-mm">ဂျုတ်</div></div>
        <span class="pcode-badge">MMR009020038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76182070386244, 21.721346670412572], [94.76062193005811, 21.714667784190965], [94.75965231790019, 21.706587686772366], [94.75828893758444, 21.70495163111292], [94.75642027857305, 21.70270923993951], [94.75254183263951, 21.69818438560094], [94.74801697920032, 21.688165065665316], [94.74575455203103, 21.682024192562494], [94.74575455203103, 21.677499339123244], [94.74564681684717, 21.67747779226636], [94.739290474276, 21.6762065232125], [94.73314960117324, 21.678468950381784], [94.72862474593535, 21.68040817289892], [94.72765513467681, 21.68234739721464], [94.72491523405085, 21.68632025307727], [94.72894794968818, 21.69592195933103], [94.73864406587103, 21.706587686772366], [94.7518954251338, 21.71983904603519], [94.75803629913594, 21.725979919138013], [94.76126833666444, 21.721131861046615], [94.76182070386244, 21.721346670412572]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
