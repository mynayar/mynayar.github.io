
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yin Taik Hmaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yin Taik Hmaw</div><div class="name-mm">ရင်းတိုက်မှော်</div></div>
        <span class="pcode-badge">MMR008005024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44107842942606, 18.5391174971748], [95.44841799809222, 18.539654539025832], [95.45593658130826, 18.541086650028944], [95.46005390066705, 18.541086650028944], [95.46056729934145, 18.54110269393425], [95.4657823446795, 18.541265663679496], [95.46630975569076, 18.541255291798336], [95.46448684609112, 18.53598910291481], [95.46359273381768, 18.528612662944113], [95.4649339026775, 18.519224463837986], [95.46541241575045, 18.517097746164097], [95.4643536232212, 18.516755676433377], [95.4629418800638, 18.515393491316615], [95.46200768500671, 18.513128320315786], [95.45394954183797, 18.51454078472949], [95.44521946570586, 18.518820233866734], [95.43563350028586, 18.521216725671422], [95.43717410190334, 18.526009709280686], [95.43837234780568, 18.527892665713978], [95.4387147026215, 18.529775623945966], [95.43717410190334, 18.532172114851278], [95.4368317461882, 18.53405507308321], [95.44107842942606, 18.5391174971748]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
