
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lone Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lone Yan</div><div class="name-mm">လုံးရမ်း</div></div>
        <span class="pcode-badge">MMR007010036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17135339244516, 19.20954998034739], [96.1551001033871, 19.208948007444633], [96.13461306873819, 19.209550565806012], [96.11894651357079, 19.211960806446086], [96.10448507872349, 19.214973605447597], [96.09363900213827, 19.21858896370975], [96.09363900213827, 19.228229920874185], [96.0978569205605, 19.235460638297866], [96.10147227882265, 19.246909275043038], [96.09921268002125, 19.24675863500306], [96.10237611906268, 19.250825914284576], [96.10870299714566, 19.261220070749744], [96.11277027642717, 19.26890270829341], [96.11954907373081, 19.279296864758578], [96.12316443289234, 19.287431423321607], [96.1236632175835, 19.290424135965168], [96.12903939085527, 19.28969102212301], [96.13988546833974, 19.285623742841494], [96.14982770468487, 19.283816064160078], [96.15615458276784, 19.27613342571709], [96.16248146085081, 19.269354628413396], [96.16926025905377, 19.256248952127464], [96.1697121782745, 19.24811439536313], [96.17106793773519, 19.233201038597088], [96.17197177797522, 19.22190304279127], [96.17106793773519, 19.214672325367587], [96.17135339244516, 19.20954998034739]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
