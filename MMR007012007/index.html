
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Paung Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Paung Chaung</div><div class="name-mm">ကြက်ပေါင်ချောင်း</div></div>
        <span class="pcode-badge">MMR007012007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.39160177090508, 18.509854880698242], [96.3883714088135, 18.512195396900097], [96.3883714088135, 18.515012059159233], [96.39140473663934, 18.518478719917027], [96.39205473603732, 18.52107871481087], [96.3888047417455, 18.523245377672083], [96.38273808519455, 18.525195374966643], [96.38057142233333, 18.527145371361826], [96.37905475797078, 18.532345362048886], [96.37927142533607, 18.539062017098445], [96.38035475586736, 18.543395342820872], [96.38403808309113, 18.543178677254218], [96.38750474384892, 18.541012014393004], [96.39075473814069, 18.539062017098445], [96.39422139889848, 18.53754535273589], [96.39617139529372, 18.539712015597104], [96.39682139379232, 18.543612009286846], [96.40137138598072, 18.546428670646662], [96.40284592070276, 18.547797882166606], [96.40736461018867, 18.547132344282318], [96.40726470989853, 18.54577867214806], [96.40878137426108, 18.54209534492429], [96.40769804193116, 18.537978685667838], [96.40553137906994, 18.53429535934339], [96.40714306310196, 18.53383487767752], [96.4054880461365, 18.532345362048886], [96.40397138177389, 18.526062039931276], [96.40527137967047, 18.521728714208848], [96.40488221694079, 18.5174479232831], [96.40310471680931, 18.5173953875871], [96.39898805665354, 18.515228724725887], [96.39357140039988, 18.51176206486747], [96.39160177090508, 18.509854880698242]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
