
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thaik Hmyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thaik Hmyaung</div><div class="name-mm">သိုက်မျှောင်</div></div>
        <span class="pcode-badge">MMR010023054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.93208632672264, 20.389931823295058], [95.92399945291248, 20.386697073411256], [95.90944307933472, 20.37739716704567], [95.90286346837445, 20.37008648820091], [95.89933448639749, 20.37133201056389], [95.8880128609049, 20.373758073876047], [95.8823148931179, 20.374794067692108], [95.88194770532237, 20.381036261114616], [95.88194770532237, 20.38871879073963], [95.8835650802643, 20.397210009634307], [95.88599114267714, 20.408531634227586], [95.88599114267714, 20.42227932123376], [95.88316073697848, 20.444922568621678], [95.90176054791101, 20.444922568621678], [95.91550823491718, 20.44411388205009], [95.92723420279628, 20.4396661014095], [95.92804289026725, 20.429961850858774], [95.93208632672264, 20.41500113399519], [95.93127764015105, 20.40165779117416], [95.93208632672264, 20.389931823295058]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
