
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Laing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Laing</div><div class="name-mm">တလိုင်း</div></div>
        <span class="pcode-badge">MMR005001079</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92289315999142, 22.17428846973712], [95.92510427993864, 22.17609765028641], [95.92364232043678, 22.183042049650908], [95.92766279989837, 22.184869589859716], [95.93168328025922, 22.183773030301154], [95.93424180021896, 22.185600569610642], [95.93606915966404, 22.18852449041293], [95.94191700036936, 22.18779350976274], [95.94264815998463, 22.182676559775473], [95.95105451975036, 22.179387149997012], [95.95836431995747, 22.17829068037065], [95.96238480031832, 22.176463140161843], [95.96530872022134, 22.17609765028641], [95.96713644029455, 22.173539220258874], [95.96677067972314, 22.171346190174575], [95.96275020026161, 22.170249719648893], [95.95946088041535, 22.16769128962136], [95.95799892001423, 22.16476727978619], [95.9587297199007, 22.161112380132295], [95.96070972037734, 22.159726470000635], [95.95763352007094, 22.158188370297125], [95.95032336013503, 22.14832005013028], [95.94337895987115, 22.13991369036455], [95.93716572012193, 22.13964350974021], [95.93716572012193, 22.14503055041962], [95.94118619958351, 22.154898959619345], [95.94155160042607, 22.162939830408902], [95.93570375972081, 22.166229330119563], [95.92510427993864, 22.1720772598577], [95.92289315999142, 22.17428846973712]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
