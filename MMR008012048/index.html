
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Khat War Yon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Khat War Yon</div><div class="name-mm">ကျခတ်ဝါးရုံ</div></div>
        <span class="pcode-badge">MMR008012048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58366914591443, 18.367683430845716], [95.5819393260391, 18.369988869890506], [95.57622703474993, 18.375701160280357], [95.5824878342462, 18.379364470394023], [95.59033694979047, 18.37999240042899], [95.59253470221478, 18.38062032866526], [95.59567434879222, 18.38407394026018], [95.59598831291038, 18.387841515973207], [95.5997558886234, 18.392550984940044], [95.60697707593135, 18.39631856065313], [95.610113626143, 18.388775344106875], [95.60601629331734, 18.3894883832823], [95.60152503315379, 18.38737484877032], [95.60019123064086, 18.382928841592843], [95.59914730660296, 18.37944909659859], [95.59571281459478, 18.37442945415603], [95.59122155533055, 18.37337268690004], [95.58884382967904, 18.371259153287326], [95.58857963764024, 18.36835304355816], [95.58366914591443, 18.367683430845716]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
