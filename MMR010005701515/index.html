
<!DOCTYPE html>
<html>
<head>
    <title>Map View - (Za Gwe) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyigyitagon</div><div class="name-mm">ပြည်ကြီးတံခွန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">(Za Gwe) Ward</div><div class="name-mm">(ဇ) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010005701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13590049044046, 21.889009624801304], [96.13444426375116, 21.889085085586487], [96.13440475630603, 21.889084885933755], [96.13415023046741, 21.88908359967536], [96.13291794345099, 21.889077372254462], [96.13264161834473, 21.889080531062575], [96.12152079420349, 21.8893162311075], [96.10818815947414, 21.889598288160926], [96.09679090756617, 21.889841773643923], [96.09435011716084, 21.890940541229668], [96.09471272226199, 21.8915731429546], [96.09501455386402, 21.892413855353652], [96.09507668758135, 21.893241567409575], [96.09497204627934, 21.893696808447487], [96.09488016830215, 21.89409652275714], [96.0961154642045, 21.895327097098914], [96.0985488691091, 21.893381059120202], [96.12418633488522, 21.89282007995854], [96.12909003987147, 21.892704312991725], [96.1313704018516, 21.892650668912495], [96.13459337319472, 21.892574850542076], [96.13460805453587, 21.89267215225152], [96.13588613843626, 21.892557315072622], [96.13720492527688, 21.892469347933798], [96.1372124772725, 21.892468725447202], [96.13709816960323, 21.889081637156153], [96.13590049044046, 21.889009624801304]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
