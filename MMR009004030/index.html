
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kin Pun Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kin Pun Taung</div><div class="name-mm">ကင်ပွန်းတောင်</div></div>
        <span class="pcode-badge">MMR009004030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68446145563172, 19.907375968626127], [95.6722540006217, 19.907590134976772], [95.66484686139358, 19.906873315051484], [95.65935124106699, 19.90448391530049], [95.65194410093955, 19.900421934824465], [95.64501484076237, 19.8994661749241], [95.63712982068472, 19.906634375076408], [95.63091738133215, 19.906873315051484], [95.62327690760327, 19.90914480738701], [95.62207660135414, 19.909501654777614], [95.62446600110513, 19.913802575228715], [95.62494388105534, 19.92001501458128], [95.62494388105534, 19.924554875007516], [95.63808558058514, 19.924554875007516], [95.65528926059096, 19.922404415231654], [95.6669973211695, 19.92168759530631], [95.67583810204684, 19.92312123515694], [95.68013902159862, 19.92359911510715], [95.68005682626159, 19.923742957171783], [95.68037796157375, 19.92359911510715], [95.68372312212443, 19.92168759530631], [95.68682934180072, 19.918103494780496], [95.68897980157664, 19.91666985492992], [95.69017450235145, 19.91189105542793], [95.69017450235145, 19.907829074951906], [95.68587358190035, 19.907351195001695], [95.68446145563172, 19.907375968626127]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
