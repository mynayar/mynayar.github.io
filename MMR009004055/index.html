
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Thar (2)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Thar (2)</div><div class="name-mm">လယ်သာ (၂)</div></div>
        <span class="pcode-badge">MMR009004055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.62159926819174, 19.856580224297943], [95.61615206196814, 19.860989867388525], [95.60925138494355, 19.866322208603094], [95.60172337323513, 19.873850221210773], [95.59794443009145, 19.877629162555877], [95.59827303427318, 19.877614225716002], [95.60454637661405, 19.88137823201987], [95.60862405025978, 19.882005566703583], [95.60879581537466, 19.8820880129515], [95.60895627601138, 19.881618973337027], [95.6232580470213, 19.881936790150803], [95.63374601176906, 19.881777880844595], [95.63867217777886, 19.882572423778413], [95.64312161766856, 19.88432041805288], [95.64671527618913, 19.886393681822994], [95.64940078132105, 19.88357390161434], [95.64940078132105, 19.87855522774163], [95.64908711397919, 19.87259555184329], [95.64845977929542, 19.865694874818644], [95.63904976533445, 19.863185536982996], [95.6318269421597, 19.858370323032034], [95.63058075070114, 19.85753952842657], [95.62273907165087, 19.855657525274637], [95.62159926819174, 19.856580224297943]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
