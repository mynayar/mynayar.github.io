
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myet Thauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myet Thauk</div><div class="name-mm">မြက်သောက်</div></div>
        <span class="pcode-badge">MMR012002055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.06478031855693, 20.510032598026044], [93.06295204000469, 20.50552678233521], [93.0627627947672, 20.505060384928868], [93.06029291828361, 20.500157046410607], [93.05864713375826, 20.49526959171834], [93.05715671790824, 20.490843534201815], [93.05637625835772, 20.48926076157494], [93.05500034958652, 20.485591317185595], [93.0520086837538, 20.47644916989333], [93.0488415565926, 20.472050030884247], [93.04861484380007, 20.471635155637955], [93.04845667013927, 20.471515422598713], [93.04602517312333, 20.46813807531197], [93.04553736915432, 20.467492013145943], [93.04339275856898, 20.464651628569868], [93.04253343566955, 20.463513516735475], [93.042506310318, 20.463537772350378], [93.03598779210296, 20.469366586998433], [93.0312965496961, 20.47356089641829], [93.02970530095894, 20.482004775000405], [93.02916691642014, 20.48848807306615], [93.02891061413362, 20.491574310705914], [93.02711937775712, 20.4970160211725], [93.02649368523544, 20.49873191684452], [93.02658478386076, 20.498785057784232], [93.03380877255688, 20.504088746598427], [93.03865524694214, 20.50728924760074], [93.04341027826177, 20.514879008559433], [93.04281817721716, 20.519402076844415], [93.06464054862249, 20.510092226675], [93.06478031855693, 20.510032598026044]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
