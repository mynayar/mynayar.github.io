
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Mone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Mone Gyi</div><div class="name-mm">ရွာမုန်းကြီး</div></div>
        <span class="pcode-badge">MMR010015019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09481976072345, 21.509814130917448], [96.09395488091309, 21.51074346064223], [96.08718183837118, 21.50918045061735], [96.07939139639586, 21.508975440264408], [96.07098591886512, 21.51041052082894], [96.0668856866252, 21.516150845784978], [96.06672284098636, 21.517331481162955], [96.06606563981751, 21.522096182892597], [96.06550067221832, 21.52689841423046], [96.06745444306813, 21.52750315164917], [96.0711409341069, 21.525455101271973], [96.07298111338775, 21.526275419674903], [96.0761511894259, 21.525590597628025], [96.07812957022355, 21.525438990816838], [96.08002665320754, 21.52529361271013], [96.07964034672466, 21.522485426561218], [96.08346337643371, 21.52084698679903], [96.08865177306092, 21.521120059643067], [96.09670413358896, 21.518199972650677], [96.09853559034525, 21.517008164994877], [96.09712923322758, 21.514579000820277], [96.09674568226745, 21.511127031387446], [96.09482791757438, 21.509848522791117], [96.09481976072345, 21.509814130917448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
