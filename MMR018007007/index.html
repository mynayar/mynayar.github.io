
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Ta Lone Kyaung Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Ta Lone Kyaung Su</div><div class="name-mm">ကျောက်တလုံးကျောင်းစု</div></div>
        <span class="pcode-badge">MMR018007007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9331023304083, 19.70138484833211], [95.93570823564664, 19.694544344046278], [95.93354764320924, 19.682120933034696], [95.93354764320924, 19.6691573730144], [95.9292264574351, 19.66159529588623], [95.91950378697027, 19.656193812994104], [95.90437963361325, 19.652952923438704], [95.89033577737428, 19.65187262632071], [95.8762919211353, 19.652952923438704], [95.88007295880004, 19.675099004015863], [95.88007295880004, 19.68968300926349], [95.88061310690944, 19.69886553071973], [95.87359117878992, 19.701026124056455], [95.89303651882034, 19.70048597504774], [95.90383948460459, 19.704267013611855], [95.91086141362342, 19.70642760694858], [95.91842348985222, 19.701566272165792], [95.92166438030699, 19.707507904066574], [95.92868630842645, 19.702646569283786], [95.9331023304083, 19.70138484833211]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
