
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Thei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Thei</div><div class="name-mm">မဲသည်</div></div>
        <span class="pcode-badge">MMR005007048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59655819980117, 23.055253740367846], [95.59210680028866, 23.048459550268092], [95.58898451961994, 23.038399619646782], [95.5844751597009, 23.030421120438405], [95.57719019966805, 23.029033499796242], [95.57198676008096, 23.029033499796242], [95.57014788032046, 23.027194530103543], [95.56564824027413, 23.03094429024685], [95.56056035997267, 23.03464445997389], [95.55038495999798, 23.03464445997389], [95.54405399989224, 23.034311280041607], [95.54159699990169, 23.0341819503368], [95.5354874402932, 23.04105525019969], [95.53419647968383, 23.042507399896635], [95.5411344003324, 23.048520210439392], [95.54622227973448, 23.052269160293577], [95.54622227973448, 23.051757869630023], [95.55917292009423, 23.056383150362137], [95.5776736796966, 23.064246090284882], [95.58692424026151, 23.067483750374834], [95.59470132010989, 23.069212019818906], [95.59453500039001, 23.068579409712015], [95.59522872032926, 23.059907099732925], [95.59655819980117, 23.055253740367846]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
