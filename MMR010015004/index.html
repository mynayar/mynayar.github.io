
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yit Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yit Kan</div><div class="name-mm">ရစ်ကန်</div></div>
        <span class="pcode-badge">MMR010015004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01673635429938, 21.43108861214978], [96.01364458313105, 21.429899470084536], [96.01412023995715, 21.422051127957218], [96.01174195402803, 21.41967284292741], [96.00888801217206, 21.415867585620617], [96.00594408415225, 21.407665270335997], [96.00143438069216, 21.406845323353025], [95.99637804680947, 21.40670866597219], [95.9933715781359, 21.406572007692034], [95.99036510856297, 21.4064353503112], [95.98380554079313, 21.40903184594299], [95.98084395188692, 21.410374454617454], [95.98147003741235, 21.41477769543434], [95.98047792781415, 21.417573577958308], [95.9766916399073, 21.416805986806878], [95.96904558408647, 21.421175163103328], [95.95812264424467, 21.42363282499491], [95.95783251126147, 21.423827705384326], [95.95238304144425, 21.42748832742444], [95.95318031292118, 21.428144454802805], [95.95456504763888, 21.427865982429182], [95.95604896498781, 21.42654609692488], [95.95947074867615, 21.426515579330555], [95.96855454435678, 21.42884720933131], [95.97183432869139, 21.429065862399682], [95.98962389992312, 21.43061295532368], [96.00508275486533, 21.43251558442671], [96.01673635429938, 21.43108861214978]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
