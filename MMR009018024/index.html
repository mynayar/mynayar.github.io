
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin</div><div class="name-mm">ညောင်ပင်</div></div>
        <span class="pcode-badge">MMR009018024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.89355984800864, 21.28990083175802], [94.8951820271289, 21.288865398219627], [94.8951820271289, 21.292216228096493], [94.89885793764375, 21.294141706274786], [94.90714927771705, 21.288865398219627], [94.90950901692764, 21.287921502175607], [94.90810665819578, 21.28599325768272], [94.91480831794956, 21.274504697333953], [94.92150997860267, 21.265888276622718], [94.91815914782649, 21.257750546150817], [94.92055259902327, 21.250570196157696], [94.91480831794956, 21.244347224844603], [94.90331975670148, 21.244347224844603], [94.90039419913302, 21.241196623625342], [94.89752282122129, 21.245579253779567], [94.89776336288895, 21.252314422272832], [94.89848498789195, 21.259771215769035], [94.89463632030998, 21.272519928651832], [94.89632011198364, 21.2802172638157], [94.89583902864831, 21.285028098967643], [94.89355984800864, 21.28990083175802]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
