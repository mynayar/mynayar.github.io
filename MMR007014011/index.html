
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pwe Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pwe Thar</div><div class="name-mm">ပွဲသာ</div></div>
        <span class="pcode-badge">MMR007014011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.47606439865314, 18.808381917391614], [96.4775543720367, 18.809330080718723], [96.48013084336378, 18.801600665838123], [96.48174113794323, 18.79612566426806], [96.48406797006083, 18.791153678699345], [96.47691025420494, 18.787108013723923], [96.4698249571561, 18.78227712908631], [96.46048524679674, 18.775835949869247], [96.45468818631082, 18.77132712504681], [96.44976574709159, 18.768956611058798], [96.4464127588418, 18.767378354827258], [96.44312427176777, 18.77392356402129], [96.44264812930777, 18.77527807971967], [96.44183432559373, 18.775667487964256], [96.44170117916616, 18.77573120043462], [96.441694365003, 18.775856708020683], [96.4416413391765, 18.77592839567899], [96.43884089529115, 18.779714418285835], [96.43788767687482, 18.78100310810703], [96.43828590387142, 18.78657828066315], [96.43800439718524, 18.787913517594802], [96.44101142163987, 18.788434100953054], [96.44921318384144, 18.790972720714535], [96.46177348335965, 18.79515948662106], [96.46757054384557, 18.798380076679223], [96.47046907498788, 18.804821255896286], [96.47606439865314, 18.808381917391614]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
