
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Wa</div><div class="name-mm">အင်းဝ</div></div>
        <span class="pcode-badge">MMR007003021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.43934788359803, 16.996567869011983], [96.43788894132166, 17.001127064862203], [96.43880078013194, 17.008421778042646], [96.43880078013194, 17.020275687073365], [96.4442718147925, 17.026658559644886], [96.44409876544574, 17.028994732121248], [96.44609549331244, 17.02939407787443], [96.45384612589805, 17.028026318759657], [96.45840532084895, 17.02483488202421], [96.46478819521911, 17.028482239064147], [96.47255616583442, 17.030071857330427], [96.47345066661501, 17.017996089148255], [96.47253882780473, 17.013436893298035], [96.46980330957513, 17.007509939232364], [96.47025922987962, 17.003406662787313], [96.47091115202812, 16.998843205949242], [96.46752371344866, 16.998391548431243], [96.46683813687059, 16.99283431734989], [96.45612572382316, 16.992464592566932], [96.44563957390727, 16.996567869011983], [96.43934788359803, 16.996567869011983]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
