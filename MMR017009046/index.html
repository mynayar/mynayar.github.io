
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Auk Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Auk Ywar</div><div class="name-mm">အောက်ရွာ</div></div>
        <span class="pcode-badge">MMR017009046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58995003986252, 17.359350929901552], [95.59381390418838, 17.35693683476717], [95.59470995989682, 17.356376969921257], [95.60188403981664, 17.351693819614127], [95.60388312030983, 17.352305460228877], [95.60900484030122, 17.349927480069198], [95.61099780000853, 17.348646150299658], [95.61156588016132, 17.348281110085225], [95.61446219807203, 17.34733807289382], [95.61179444375864, 17.346610423332436], [95.60080101505486, 17.34361188488066], [95.5826812127678, 17.336049998408726], [95.58321717992897, 17.33869665822425], [95.58359730806939, 17.340573769064235], [95.58359330788488, 17.34148882474949], [95.58357756435316, 17.345090573571156], [95.58351497063944, 17.345179755741185], [95.58168180696987, 17.34779160459891], [95.58164836298164, 17.347901946018055], [95.58072449483961, 17.350950063194887], [95.57955602369162, 17.35094393701314], [95.57931308263272, 17.350942662673788], [95.57845189364002, 17.35203515999467], [95.58056088028047, 17.35378622995063], [95.58504467966827, 17.356376969921257], [95.58942912015783, 17.358569099784177], [95.58995003986252, 17.359350929901552]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
