
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tet Ka Tho Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tet Ka Tho Ward</div><div class="name-mm">တက္ကသိုလ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09440430061477, 21.95901696365911], [96.09636263019786, 21.95898576452322], [96.09636899728963, 21.95905035823597], [96.10125075641525, 21.958912596435994], [96.10204635999065, 21.95889518084948], [96.10178665005333, 21.95193023253364], [96.10089793606846, 21.951986261716513], [96.10020284934711, 21.952030083622958], [96.09668376629281, 21.952297450641822], [96.09417143182492, 21.952532413778215], [96.09398333679434, 21.95252908394565], [96.0922832208247, 21.952637598580623], [96.09221280889614, 21.95264209281794], [96.0925144243813, 21.955653847758867], [96.09269904400611, 21.958062369497497], [96.08965809284075, 21.95821941392387], [96.08966580974788, 21.958875351033498], [96.08966626299969, 21.95891387745411], [96.08966648396569, 21.958913930277788], [96.08966978702222, 21.959102933607085], [96.09019744828072, 21.95909051547369], [96.09103834390442, 21.95907058841283], [96.09440430061477, 21.95901696365911]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
