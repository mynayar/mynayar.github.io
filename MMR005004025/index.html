
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Gun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Gun</div><div class="name-mm">ရွှေဂွန်</div></div>
        <span class="pcode-badge">MMR005004025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96593629592337, 22.576801381578548], [95.96303221956134, 22.574602587739264], [95.96197732559318, 22.57316697927274], [95.9605893065513, 22.57232623636679], [95.95912197270093, 22.57238175781191], [95.95807500985387, 22.573000417635228], [95.95763877570897, 22.573777707974898], [95.9488189067672, 22.5754591937868], [95.94322717319557, 22.5778981407866], [95.9405106216679, 22.58083280938672], [95.93906974857009, 22.58209103017697], [95.94694378972417, 22.586023602707144], [95.94892350061912, 22.587127673403472], [95.94983721361655, 22.588345956200953], [95.95120778311275, 22.58918352629877], [95.95352077556339, 22.59076497962019], [95.95461436466127, 22.589235419878776], [95.95781888833108, 22.585740835171464], [95.95796259909474, 22.58558257157847], [95.96445861267489, 22.578428757880943], [95.96562561972661, 22.57714351965774], [95.96593629592337, 22.576801381578548]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
