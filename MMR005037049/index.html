
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yan Naw San Ri</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yan Naw San Ri</div><div class="name-mm">ရန်နောဆန်ရီ</div></div>
        <span class="pcode-badge">MMR005037049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6090538740371, 26.67889554099645], [95.61021526392335, 26.684992835650917], [95.6141547927096, 26.688932365336427], [95.61848827581332, 26.698387235682446], [95.61770036987622, 26.70902396628304], [95.6149426986467, 26.71769093069196], [95.60824549863094, 26.729115566330393], [95.60824549863094, 26.74014624855056], [95.61100316986045, 26.751964836707884], [95.61346524562464, 26.76212090215796], [95.6234739598554, 26.758300770064523], [95.6368742396545, 26.75610809970908], [95.63690196035725, 26.756103509569357], [95.63232419980204, 26.739074700037406], [95.63452164016161, 26.72930906985772], [95.65728768008245, 26.72113041034021], [95.66298452641485, 26.71903058869077], [95.65834044715399, 26.710903450433932], [95.65321905811311, 26.70105462577044], [95.65199533981314, 26.69004115927214], [95.64587388037535, 26.689514129573467], [95.61791987999851, 26.680908239923383], [95.6090538740371, 26.67889554099645]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
