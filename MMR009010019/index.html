
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Tha Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyet Tha Kaing</div><div class="name-mm">ကြက်သကိုင်</div></div>
        <span class="pcode-badge">MMR009010019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70617979456193, 20.601921627581078], [94.70593150973144, 20.601650771565915], [94.70673847590001, 20.595598531147346], [94.69759917316338, 20.59431582181776], [94.68696037861866, 20.590991199084613], [94.68378582575531, 20.589981113837382], [94.68330329361214, 20.58982758067833], [94.68328818230384, 20.590643624603615], [94.6831370629252, 20.598804062957186], [94.68280460065188, 20.60179622431633], [94.67898128405909, 20.602793611136292], [94.67682027883285, 20.604455923402213], [94.67666987891187, 20.60505752128762], [94.67947997701935, 20.605619540909117], [94.69477324428988, 20.612268787274786], [94.69798532496281, 20.61510297732059], [94.69826409771002, 20.61476225387497], [94.70092379679585, 20.61393109864133], [94.70577510863444, 20.614073785077153], [94.70458088180231, 20.610938938181505], [94.70541203793528, 20.605453309322797], [94.70617979456193, 20.601921627581078]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
