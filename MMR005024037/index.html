
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawlin</div><div class="name-mm">ကောလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Thar</div><div class="name-mm">ညောင်ပင်သာ</div></div>
        <span class="pcode-badge">MMR005024037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88507084034705, 23.801330610119635], [95.88031019995583, 23.801513669820054], [95.86108403999651, 23.803894079947895], [95.84887679992443, 23.804321310080468], [95.8363038001803, 23.801879880052468], [95.8328856002903, 23.82189939044457], [95.831488800268, 23.829313049757502], [95.83156007963402, 23.829313319554103], [95.8321925998087, 23.83034166013954], [95.83972164034151, 23.830505370026856], [95.85028079991906, 23.830505370026856], [95.86547856008752, 23.830505370026856], [95.87548835980004, 23.830505370026856], [95.89208976023428, 23.831726039625096], [95.90112288001694, 23.831481960024462], [95.91070572029281, 23.82952878002925], [95.90368643977746, 23.822326619677824], [95.89288319969995, 23.81188967976493], [95.89427279974996, 23.807963249604313], [95.89428719969459, 23.807922389806492], [95.88507084034705, 23.801330610119635]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
