
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gway Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gway Pyin</div><div class="name-mm">မဂွေးပြင်</div></div>
        <span class="pcode-badge">MMR005013009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15037312032331, 22.316801490196667], [95.1531310802352, 22.318771590036874], [95.15813615995586, 22.32258488998076], [95.16314123967652, 22.325444910354406], [95.1695762396518, 22.324968269669967], [95.17815612000896, 22.325206590012158], [95.18244587987351, 22.32663660019898], [95.1848132399391, 22.327376309669035], [95.18809608017, 22.324503869657917], [95.19028883955838, 22.319144010088053], [95.18894352032726, 22.31645354969163], [95.1867806400146, 22.30888337956435], [95.18046948028234, 22.306284720163774], [95.1715717201588, 22.303742489624256], [95.1652162796077, 22.29526844957934], [95.15185632001322, 22.29107282984728], [95.15206836036657, 22.291408800375905], [95.15384604036251, 22.29422345984483], [95.15432303987643, 22.297321799661404], [95.1576595201708, 22.301611740289616], [95.1576595201708, 22.306140000360756], [95.1576595201708, 22.310191709679714], [95.15527632034599, 22.314243329965734], [95.15037312032331, 22.316801490196667]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
