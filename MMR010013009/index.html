
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Pan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Pan Kone</div><div class="name-mm">ကြောင်ပန်းကုန်း</div></div>
        <span class="pcode-badge">MMR010013009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02987761675865, 21.641107518896945], [96.03240023758099, 21.645480064053743], [96.03701895865805, 21.649251722688916], [96.03885078413646, 21.64855384788183], [96.04012671527573, 21.649281445282497], [96.04115791930258, 21.64986987529454], [96.04236204587176, 21.65123575842358], [96.04282569944655, 21.651762009309323], [96.04394048826299, 21.65284464106736], [96.04480865959204, 21.653687991107972], [96.04656723798769, 21.655813382281792], [96.04759888717894, 21.65769422530832], [96.04771995481212, 21.6579151149906], [96.04940986637229, 21.658811569098702], [96.05105018571754, 21.657861709650206], [96.05241584761336, 21.65648078895731], [96.05344200104759, 21.65723228494204], [96.05565833976061, 21.657609939946838], [96.05682468311272, 21.65699413726969], [96.05831718359121, 21.656206130608496], [96.0596062933958, 21.653676378162345], [96.05983944713284, 21.65321910887485], [96.06267354095121, 21.652391352179222], [96.06578195317468, 21.651746489708785], [96.06745296997866, 21.650811916037128], [96.06990321695997, 21.643966489761738], [96.06483383211571, 21.641359377633194], [96.06401709930975, 21.640939343875687], [96.05779463161701, 21.639257596361006], [96.04602239721589, 21.64043481971123], [96.03509103522316, 21.63959394640358], [96.02987761675865, 21.641107518896945]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
