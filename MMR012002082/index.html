
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Met Ka Lar Kya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Met Ka Lar Kya</div><div class="name-mm">မက္ကလာကျ</div></div>
        <span class="pcode-badge">MMR012002082</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.87374567122583, 20.317653430061796], [92.8743257402408, 20.31777958875705], [92.87800430375569, 20.319377121057357], [92.88168294371292, 20.320974576915262], [92.88426657993875, 20.3239785229905], [92.88605270906532, 20.32960885186708], [92.88754334974584, 20.331392381952924], [92.88903402639926, 20.333175900347555], [92.89092397955807, 20.33298945110232], [92.8928139291196, 20.332802982071996], [92.89370987511069, 20.33167769816731], [92.89386199903208, 20.331486630903328], [92.89607387890646, 20.33171071857487], [92.89767439515725, 20.328624009690373], [92.89779567862774, 20.32873252728433], [92.89817436875217, 20.327871866193732], [92.90455390304027, 20.31787726322517], [92.90240789221053, 20.31671474468976], [92.90049053311168, 20.315022827641428], [92.89936268344115, 20.313556507327007], [92.89721976358129, 20.310962245611222], [92.89606018223168, 20.310360469659997], [92.89372343958513, 20.30757840431994], [92.89022706972355, 20.304984121020425], [92.88582837677825, 20.303630542415647], [92.88267027970971, 20.30611192842281], [92.87849708817015, 20.309044468327613], [92.87714361118879, 20.310510749971172], [92.87533900728943, 20.31062351416392], [92.87308325668698, 20.3105106861193], [92.87244204456476, 20.311392358970238], [92.87347801409913, 20.3144439178526], [92.87378258569782, 20.317413484644646], [92.87374567122583, 20.317653430061796]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
