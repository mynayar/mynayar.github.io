
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ya Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ya Thit</div><div class="name-mm">ရသစ်</div></div>
        <span class="pcode-badge">MMR009003007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76243119064696, 20.813915002175634], [94.76261696360206, 20.81388642172101], [94.76949054944936, 20.818716508659975], [94.77320600135596, 20.819273826625874], [94.77970804219245, 20.81574414677499], [94.78528121915298, 20.814629511742623], [94.78878912102118, 20.814887446298656], [94.78873847929742, 20.81463423498201], [94.79256728265403, 20.812417559023174], [94.8177567868463, 20.802341757166403], [94.81811407040806, 20.793052387257887], [94.81519060556207, 20.791407938225802], [94.80367270483151, 20.79085062115928], [94.79587025690688, 20.787135169252736], [94.78788203602721, 20.786020533320993], [94.77450640934336, 20.787506714263486], [94.76915820408789, 20.788398081806065], [94.76670396141873, 20.788807122250944], [94.76280273565777, 20.791407938225802], [94.76238798811522, 20.792807713205434], [94.7613165556146, 20.79642379811986], [94.76224541769193, 20.804597791954563], [94.76243119064696, 20.810728287780307], [94.76243119064696, 20.813915002175634]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
