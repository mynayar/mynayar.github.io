
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Wee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Wee</div><div class="name-mm">နားဝီး</div></div>
        <span class="pcode-badge">MMR015021027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.6852551705897, 23.13176999898633], [98.69155109490714, 23.13365474057389], [98.70358322078908, 23.142678835659808], [98.72436598310372, 23.159086280207703], [98.72682710019058, 23.157445534583815], [98.7399161210322, 23.140996185225845], [98.73776539595633, 23.13474857069002], [98.73505771893866, 23.125542469909135], [98.7306555042482, 23.11916149940373], [98.7249128977121, 23.112598521404664], [98.71534188891712, 23.108496659593243], [98.70112210370218, 23.096464534610618], [98.6948825093204, 23.08873085424557], [98.6866288616327, 23.100566396422096], [98.68744923399504, 23.106855915767937], [98.68963689332804, 23.11177814904238], [98.68799614860342, 23.113692350621534], [98.68088625689529, 23.114786180737724], [98.66748684404268, 23.109590489709376], [98.65649893088101, 23.10717222441866], [98.65053248488636, 23.112325063650815], [98.64232876306204, 23.1131454360131], [98.62701514863028, 23.112325063650815], [98.61912585857158, 23.116746690207663], [98.62400711693493, 23.120255328620544], [98.63111701044176, 23.13092016663245], [98.63946735233651, 23.142147047648166], [98.64096147609132, 23.14131154868909], [98.64971211342333, 23.139397347109934], [98.65709546288537, 23.13748314463146], [98.66065040918909, 23.132560912256338], [98.66174423840596, 23.125997934257327], [98.6663930139265, 23.12572447740274], [98.6852551705897, 23.13176999898633]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
