
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Keng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tangyan</div><div class="name-mm">တန့်ယန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Keng</div><div class="name-mm">မိုင်းကျိုင်</div></div>
        <span class="pcode-badge">MMR015004012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.37249933207858, 22.691486043246357], [98.37789266531433, 22.68786830807602], [98.39023214979392, 22.67579707337626], [98.404181132953, 22.66453058621761], [98.41678886811184, 22.66023859063847], [98.4323473499503, 22.660506841317726], [98.43985834108963, 22.66211633909785], [98.45488032336829, 22.663457587098037], [98.46316748519132, 22.66001064667404], [98.4789101589767, 22.64650895032787], [98.47365779986762, 22.637973867899746], [98.43958084088314, 22.57938443774168], [98.43529809573062, 22.571447946765375], [98.42510460769154, 22.56447345608518], [98.41356987165233, 22.56232745784598], [98.40337638361325, 22.566351203645183], [98.39479239515299, 22.574398694344325], [98.38245290887471, 22.588615927283286], [98.38122153374684, 22.590945557191787], [98.37252767061557, 22.607393403782623], [98.36850392571569, 22.62724388120023], [98.36662617815568, 22.653532348838894], [98.36796742705519, 22.67257807691675], [98.37118642261538, 22.684112812956016], [98.37249933207858, 22.691486043246357]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
