
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe That</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe That</div><div class="name-mm">ကျွဲသတ်</div></div>
        <span class="pcode-badge">MMR008007022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.84838755344288, 17.71298628209132], [95.83750136889313, 17.711957367738364], [95.79618811309098, 17.702407893209738], [95.79467257737758, 17.7075056057991], [95.78783258660462, 17.71057180834231], [95.78122845832672, 17.710335946746568], [95.77674708530981, 17.70797732899058], [95.7750960532403, 17.71481731976354], [95.77250157388858, 17.71882696868971], [95.76731261608444, 17.720478000759158], [95.75875479969432, 17.722566943309857], [95.75935878078315, 17.72558684605616], [95.76171616107206, 17.733002919149442], [95.76644400408759, 17.732122799427714], [95.77331352320061, 17.72893337987165], [95.77599767305423, 17.72720785515844], [95.78018304231364, 17.724517259863717], [95.7833724618697, 17.722554539860198], [95.79416742098977, 17.72353589986193], [95.80349033920783, 17.724762600313795], [95.81551199788044, 17.728197360319996], [95.82459771990892, 17.730620219347713], [95.83391249476585, 17.733104159429445], [95.84249939433164, 17.735557559433857], [95.84544347433695, 17.736784258986404], [95.8481422129928, 17.732122799427714], [95.84789687344204, 17.72598929986634], [95.84838755344288, 17.71298628209132]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
