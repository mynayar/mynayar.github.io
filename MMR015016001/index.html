
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngun Hseng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhsan</div><div class="name-mm">နမ့်ဆန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngun Hseng</div><div class="name-mm">ငွန်ဆိုင်း</div></div>
        <span class="pcode-badge">MMR015016001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.2097117024332, 22.95980394769407], [97.20459486486118, 22.95600915669729], [97.19051781014889, 22.95657223931744], [97.17753244426694, 22.95269961289688], [97.17645094835262, 22.954162039146865], [97.1760005660733, 22.954771057338462], [97.17517678707912, 22.954712551942748], [97.17448661856264, 22.954663536193266], [97.17456169936298, 22.95571793823234], [97.17188528098097, 22.962545086686475], [97.16885265822367, 22.96396086690055], [97.16829339322555, 22.96418949075246], [97.16843030421524, 22.9642999400902], [97.1686325581461, 22.964811523932724], [97.16865635330811, 22.96517439228444], [97.1688046029501, 22.965978727935976], [97.16648530535264, 22.967161951562844], [97.16855760415018, 22.966989260146306], [97.17156781760076, 22.96647025779623], [97.17140508707519, 22.96760937417332], [97.17080993193287, 22.971775459270077], [97.17425060678016, 22.979574319799042], [97.17503304933581, 22.981347856618356], [97.18207157714164, 22.983881726160803], [97.19108089186972, 22.980221692277325], [97.20234253617917, 22.96839696624704], [97.21166882685492, 22.96733716018184], [97.21055731067139, 22.961585131448714], [97.2097117024332, 22.95980394769407]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
