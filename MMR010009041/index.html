
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Madaya</div><div class="name-mm">မတ္တရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Kan</div><div class="name-mm">တောင်ကန်</div></div>
        <span class="pcode-badge">MMR010009041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24689865484908, 22.221824230104176], [96.2477877228252, 22.215329954014237], [96.2477877228252, 22.205819805039994], [96.2508645346706, 22.190156030576418], [96.25114424630999, 22.181485013822396], [96.25094032323739, 22.170511246097192], [96.24879670280563, 22.164134232608774], [96.24413953031512, 22.159610122009553], [96.23698225872431, 22.157820802987715], [96.23317995928772, 22.15312384269123], [96.22266771374404, 22.157149808017266], [96.21322943229251, 22.158474479713504], [96.21213722185536, 22.161451340007375], [96.20975842780928, 22.167418366064794], [96.2034511621415, 22.172937223973747], [96.20260643793682, 22.174626670584416], [96.20010042579406, 22.179638694869936], [96.20010042579406, 22.18634016486675], [96.1979323042325, 22.19185902277576], [96.20640769326047, 22.19402714613591], [96.21527728571823, 22.19954600404492], [96.21981063415348, 22.20526196366876], [96.22040194019746, 22.21393445531089], [96.22138744967111, 22.216102577771778], [96.22548609280898, 22.218701563626325], [96.23306970870016, 22.21959375404856], [96.24689865484908, 22.221824230104176]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
