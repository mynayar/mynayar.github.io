
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung San Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung San Ward</div><div class="name-mm">အောင်ဆန်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017006701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11429650000014, 17.338862699999993], [95.11480516150078, 17.33966419968533], [95.11527153585791, 17.34062550193181], [95.11561417824277, 17.341225126105257], [95.11614717750808, 17.342195946195545], [95.11660403402107, 17.343090623533783], [95.11702281915814, 17.343890122431787], [95.11755581842345, 17.344860942522246], [95.11792701434035, 17.345612852200077], [95.11846001360567, 17.346583672290308], [95.11864683811103, 17.346952065506343], [95.11914999657654, 17.346742887267737], [95.12040635198753, 17.34626064983729], [95.12190022171569, 17.345786594816786], [95.12141920922238, 17.34484288765458], [95.12098614731929, 17.34392441570634], [95.12041983559999, 17.342739444125357], [95.1195251582617, 17.34092629483905], [95.11915396234485, 17.34021721545929], [95.1185590970934, 17.338994172502225], [95.11781135639029, 17.337541456164274], [95.11767070000008, 17.337608100000125], [95.11690360000006, 17.33798710000002], [95.11626519999999, 17.338279000000057], [95.11583609999997, 17.338488900000016], [95.11551960000008, 17.33859640000003], [95.11519229999999, 17.33867840000005], [95.11429650000014, 17.338862699999993]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
