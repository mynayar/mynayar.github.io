
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Mo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Mo</div><div class="name-mm">နောင်မို</div></div>
        <span class="pcode-badge">MMR015021001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.82545147810328, 23.44915768777713], [98.82554522163474, 23.435278254587843], [98.82688124996974, 23.43224719125493], [98.82171681757711, 23.428441819734246], [98.81214580878213, 23.419144267793797], [98.80331393299167, 23.41360269930516], [98.800847169961, 23.41205492559442], [98.79819948222041, 23.410393631361046], [98.78534698397618, 23.41258129069405], [98.77711433635761, 23.414093409883037], [98.77749889635703, 23.414894577223038], [98.77796363361483, 23.415862780143243], [98.77800124056483, 23.416186200632694], [98.77800397090658, 23.41620967833404], [98.77933092058555, 23.42762144827128], [98.77919569672406, 23.430100559892992], [98.7791538440747, 23.430867873153886], [98.77863902627013, 23.440306194175548], [98.78124512306402, 23.4380128294286], [98.78835501477215, 23.437465913920846], [98.79519144962575, 23.4399270310077], [98.80175442762481, 23.443481977311478], [98.80640320404467, 23.445669635745162], [98.81187235192755, 23.44758383822358], [98.82089644611415, 23.448130752832014], [98.82545147810328, 23.44915768777713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
