
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Taik Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Sar Taik Ward</div><div class="name-mm">စာတိုက် ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007006701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60354334454979, 18.170441447814596], [96.60426273833474, 18.169055859640252], [96.60580485710852, 18.16969038979971], [96.60629778271658, 18.1685440653564], [96.60507673720173, 18.167851572092445], [96.60799093993, 18.1625623335849], [96.60857780062508, 18.162703058599334], [96.6090608049123, 18.162878517229842], [96.60897710950604, 18.16328584806348], [96.61211829212556, 18.16391093534145], [96.61229679675984, 18.163222042063637], [96.6123075823291, 18.163222631119595], [96.61321864592384, 18.15999681689965], [96.61344547382959, 18.159343290360596], [96.61389174890513, 18.158460200178126], [96.61446639410889, 18.157244164786448], [96.61444322397568, 18.157234658952405], [96.61353543121521, 18.156862264082292], [96.61248436296302, 18.156402866998747], [96.61157523381007, 18.155957456171734], [96.61212531762936, 18.155067483477637], [96.61263070424366, 18.154269253323434], [96.61256990647604, 18.15408720446095], [96.6122435784784, 18.1538657005417], [96.6078914191537, 18.160580459820437], [96.60197817795063, 18.16970374563141], [96.60354334454979, 18.170441447814596]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
