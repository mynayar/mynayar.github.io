
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Gyi Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Gyi Taung</div><div class="name-mm">လယ်ကြီးတောင်</div></div>
        <span class="pcode-badge">MMR010020095</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.21071347204918, 20.70395595680202], [95.20911786339872, 20.708343883063776], [95.20816138314137, 20.711093764365785], [95.20636819703475, 20.71624917206168], [95.20293111497904, 20.722092213085205], [95.21186752886342, 20.720717379903192], [95.22217877682914, 20.720029963312186], [95.22763047966299, 20.720029963312186], [95.2342085662724, 20.720029963312186], [95.24280127186125, 20.720029963312186], [95.24504442116319, 20.720029963312186], [95.24314498015679, 20.714874338879667], [95.24142643867924, 20.708343883063776], [95.23764564832805, 20.69493926133788], [95.23592710685057, 20.69081476089258], [95.23008406672636, 20.69390813555208], [95.22527215058932, 20.698720050789746], [95.22149136023813, 20.70456309181327], [95.21977281876065, 20.705250508404276], [95.21427348693192, 20.705250508404276], [95.21071347204918, 20.70395595680202]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
