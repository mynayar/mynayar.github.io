
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Bu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Bu</div><div class="name-mm">ကံဘူး</div></div>
        <span class="pcode-badge">MMR012002016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.90662616406627, 20.409556067258734], [92.90664407766212, 20.409440748092095], [92.90954701997907, 20.402397543811674], [92.91482942363905, 20.392070682715882], [92.91654263573412, 20.387692475427457], [92.91725647440683, 20.385122656385533], [92.91697093875786, 20.3828383738919], [92.91567603012476, 20.381839444734624], [92.91530531608754, 20.38155346482057], [92.91268790941956, 20.38155346482057], [92.90978496620329, 20.382600427667626], [92.90740550486021, 20.38383774731426], [92.90545434744024, 20.384123282963174], [92.8995185629314, 20.386701171621837], [92.89352232059866, 20.388176436593312], [92.88666947311776, 20.389556525413354], [92.88535765812946, 20.38964000408299], [92.88361612908113, 20.395655731127135], [92.88366571140352, 20.396779575217295], [92.88460390664505, 20.405413508426705], [92.89216475439997, 20.408232901926908], [92.89694309884499, 20.40560887804736], [92.90655310674055, 20.409527901391584], [92.90662616406627, 20.409556067258734]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
