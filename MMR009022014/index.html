
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit Gyi</div><div class="name-mm">ရွာသစ်ကြီး</div></div>
        <span class="pcode-badge">MMR009022014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.72394975607642, 21.042270625888705], [94.72331527987632, 21.039415485236532], [94.72130404684435, 21.03489021091457], [94.7185386009757, 21.028102298981935], [94.71376192297441, 21.025336853113345], [94.71325911381712, 21.02332562008138], [94.7147675385911, 21.0200573659547], [94.7185386009757, 21.01729192008611], [94.72180685510233, 21.01704051640678], [94.72658353400294, 21.00723575402685], [94.72682849224117, 21.00258155379572], [94.72054983490699, 20.99944222557832], [94.7114992853638, 20.996173972351016], [94.70697401104184, 20.99466554667771], [94.70475564975351, 20.99318664035121], [94.70162055734289, 20.993634509924732], [94.69268967069183, 20.996515441334623], [94.68721590209225, 21.0011249308709], [94.68299020993032, 21.01605571200156], [94.68293848991942, 21.016238456039957], [94.68289450587679, 21.016393865184796], [94.6854873439658, 21.017834330889684], [94.69355394975503, 21.021003354721074], [94.7068062326216, 21.02474856519416], [94.70824669922587, 21.02676521664148], [94.70968716403144, 21.034543730908524], [94.70968716403144, 21.040881778571247], [94.70984197962372, 21.04102313311114], [94.70997525735231, 21.040593686149748], [94.72394975607642, 21.042270625888705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
