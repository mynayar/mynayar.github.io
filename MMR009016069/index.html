
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Mya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Mya</div><div class="name-mm">စမြ</div></div>
        <span class="pcode-badge">MMR009016069</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.31478470904716, 19.251048493793007], [95.31515671001421, 19.250840173035613], [95.32384472215625, 19.25337417657704], [95.32408472243208, 19.253444177107156], [95.32185271932758, 19.24488816475707], [95.31813271415348, 19.23149614702959], [95.31679163162858, 19.21741478186675], [95.31664471208387, 19.215872126197723], [95.3006486902849, 19.214756124195844], [95.29804468621336, 19.2084321149502], [95.2960066201095, 19.201206243973047], [95.29506868207409, 19.202108106603873], [95.28651267062332, 19.21736012826733], [95.28056066324405, 19.225172137784], [95.27609665613585, 19.23224014806442], [95.27349265296363, 19.236704154273355], [95.27135056497667, 19.24241638890527], [95.27758465820546, 19.242656161652576], [95.28353666738337, 19.24005215937973], [95.29209267793482, 19.243772163654455], [95.29990468925007, 19.25121217400266], [95.31478470904716, 19.250840173035613], [95.31478470904716, 19.251048493793007]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
