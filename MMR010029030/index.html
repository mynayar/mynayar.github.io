
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Be Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahlaing</div><div class="name-mm">မလှိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Be Lu</div><div class="name-mm">ဝမ္ဘဲလူး</div></div>
        <span class="pcode-badge">MMR010029030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65117374167488, 21.16883313024482], [95.64805002568818, 21.171388897379757], [95.64350644027007, 21.17309274213642], [95.64208656903998, 21.178488251731494], [95.64066669780993, 21.182179915670645], [95.64521028502668, 21.18473568280558], [95.64776605216161, 21.187859398792284], [95.65202566495253, 21.192970933961476], [95.65344553618263, 21.198082469130668], [95.65571732889168, 21.20177413396914], [95.66168078733853, 21.20262605634747], [95.66622437275663, 21.202910029874033], [95.66991603669578, 21.20432990110413], [95.6869544878594, 21.20432990110413], [95.68715620579434, 21.20449934416945], [95.68752243581184, 21.195526701995732], [95.68780641023773, 21.18388376132657], [95.68212692711603, 21.182179915670645], [95.67190385677765, 21.18104401886643], [95.66594039923012, 21.17536453574479], [95.65827309602662, 21.171388897379757], [95.65117374167488, 21.16883313024482]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
