
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koke Ko Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koke Ko Gwa</div><div class="name-mm">ကုက္ကိုခွ</div></div>
        <span class="pcode-badge">MMR009002013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01657805313471, 20.544222734891378], [95.01693579535072, 20.542925919695506], [95.02586527006622, 20.546360168886736], [95.02558541003873, 20.544768153027917], [95.02828036884398, 20.545362513169493], [95.02909088193871, 20.542675062803937], [95.03207057779497, 20.5448034154453], [95.03464731801938, 20.5456030926087], [95.03911937136195, 20.536455711262136], [95.04867869526561, 20.53558668108053], [95.04928684291355, 20.528136869920672], [95.04928684291355, 20.51458024028591], [95.0484041628219, 20.515021579882045], [95.0462057907647, 20.516120766360302], [95.04158421344073, 20.514888346220232], [95.03757884528756, 20.507801925918216], [95.03942747639695, 20.492088559239676], [95.03449779313871, 20.490548033165226], [95.02032495343389, 20.484385928867596], [95.01811678416232, 20.484052135597608], [94.99531065965925, 20.480604698747925], [94.99382790423448, 20.480380560714366], [94.99167116719065, 20.495785822357846], [94.97811453755594, 20.49116424413461], [94.97318485429764, 20.494553401318456], [94.97027542607009, 20.504639420372996], [94.97934695859533, 20.511191083102062], [94.98889822007686, 20.52259097569305], [95.0061521128298, 20.53676381629714], [95.01385474320188, 20.542925919695506], [95.01657805313471, 20.544222734891378]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
