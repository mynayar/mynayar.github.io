
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myoma Pang Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsu</div><div class="name-mm">မိုင်းရှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myoma Pang Swea</div><div class="name-mm">မြို့မပန်စွဲ</div></div>
        <span class="pcode-badge">MMR014017001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.34615718480632, 21.72787544539551], [98.34457717939335, 21.72652115362837], [98.32817863093914, 21.737297342998033], [98.32255627185452, 21.74619941177349], [98.3158189296999, 21.755042172957985], [98.31599685337216, 21.755101481448264], [98.31646538217171, 21.769157378710133], [98.31740244156947, 21.790709757449406], [98.31740244156947, 21.794489232092417], [98.31927656216368, 21.79398946714025], [98.32005812967901, 21.801805148588812], [98.32644832093331, 21.804772022810653], [98.33017264375258, 21.806501172691014], [98.33978551868682, 21.815004870578377], [98.33989187970656, 21.81413625408493], [98.34536020740768, 21.796889995676793], [98.34598276938937, 21.794926527437326], [98.35175089328914, 21.7865365281383], [98.35629042816078, 21.77993356807974], [98.35722748755859, 21.755101481448264], [98.35254218787173, 21.73776587269691], [98.3478568890842, 21.729332333620334], [98.34615718480632, 21.72787544539551]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
