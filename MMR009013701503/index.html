
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Ward (No-3 Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Taung Ward (No-3 Ward)</div><div class="name-mm">တောင်ရပ်ကွက် (အမှတ် (၃) ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR009013701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.04154971634637, 19.966956897742705], [95.04142163669923, 19.96728087761045], [95.04199506691884, 19.967505115468782], [95.04567458461446, 19.969023142304252], [95.04609016402992, 19.968757808126384], [95.04610506849417, 19.96865032924933], [95.04637632200973, 19.96834545997507], [95.04669874425173, 19.967923933342888], [95.04817753456564, 19.965660685092587], [95.04832310872456, 19.965191847825565], [95.04827792678498, 19.96510901307056], [95.04845640084227, 19.964869372523594], [95.04861504484848, 19.96425163000879], [95.04874960950696, 19.963446164808715], [95.04831617135426, 19.963422200574144], [95.0479663036021, 19.963410218906517], [95.04779774457029, 19.963374272105], [95.04768719810579, 19.963550408824347], [95.04699744147882, 19.96434482405442], [95.0468920247472, 19.964391148133018], [95.04672070389745, 19.96456246898282], [95.04642565072328, 19.964838487106533], [95.04608300812441, 19.965228718230833], [95.04560930552509, 19.965568323819127], [95.04547049246929, 19.96577867434638], [95.04520278048398, 19.96616742248858], [95.04494639995647, 19.966534868389488], [95.04467160581004, 19.96685904610814], [95.04452146039716, 19.96710201144873], [95.0437684193771, 19.96786613211634], [95.04154971634637, 19.966956897742705]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
