
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pe Yin Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalaw</div><div class="name-mm">ကလော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pe Yin Taung</div><div class="name-mm">ပဲရင်းတောင်</div></div>
        <span class="pcode-badge">MMR014005025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7174620770133, 20.78082274867097], [96.72220200421918, 20.781905277906276], [96.72810710026255, 20.783253913837086], [96.73192757769561, 20.784200885562484], [96.73943064580772, 20.784192197212178], [96.74620148770856, 20.781600567812006], [96.74657633862716, 20.7806634409651], [96.74755346372143, 20.763075190167967], [96.74999627600738, 20.7484183137542], [96.75048483900417, 20.70689049859766], [96.75074289406939, 20.706918856919742], [96.73924790087, 20.699562060840492], [96.73904746536829, 20.69974579413315], [96.73338515030451, 20.704936249308503], [96.70260571118467, 20.718615999728627], [96.68843739776776, 20.750861126939526], [96.68838784782099, 20.75175302328347], [96.6922265931828, 20.75333383628754], [96.69925789763391, 20.756849807772483], [96.69691396310895, 20.763490796563076], [96.7039452010103, 20.77013196072147], [96.70394506071602, 20.776716622274364], [96.70244775336118, 20.77861704893769], [96.70333330768608, 20.780609541896865], [96.70785127411705, 20.781851502944562], [96.71683583860312, 20.78067972498934], [96.7174620770133, 20.78082274867097]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
