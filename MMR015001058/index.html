
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Len</div><div class="name-mm">လွယ်လင်</div></div>
        <span class="pcode-badge">MMR015001058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.04560877522488, 22.94000777583824], [98.03139794725752, 22.945617313288437], [98.01432843440978, 22.948177739810887], [97.99782790463416, 22.945901804824473], [97.97592203027756, 22.94447934624486], [97.9628354034312, 22.942203410359127], [97.94946428504875, 22.936798064878815], [97.93752097261483, 22.92976705090871], [97.93125680425817, 22.923995929568548], [97.92414450686357, 22.915461172695018], [97.91020440540905, 22.906641925184772], [97.89910922111375, 22.90237454674798], [97.89597980972053, 22.90123657880514], [97.88772954618167, 22.90180556277653], [97.88004826481563, 22.90237454674798], [97.87626194003656, 22.90516447126339], [97.87464291933532, 22.90635743274936], [97.85671993008077, 22.933668654384917], [97.84745362328613, 22.9521064371624], [97.85472848663039, 22.95557452874158], [97.85785789802361, 22.956712496684418], [97.86952206539104, 22.956428005148382], [97.88659157823878, 22.95500554477013], [97.91105788001721, 22.954152070161967], [97.92158408034112, 22.954152070161967], [97.94405893866912, 22.953298593755164], [97.95230920310729, 22.953298593755164], [97.95799904102296, 22.95500554477013], [97.97051668389793, 22.957281479756546], [97.98189635882994, 22.9606953826858], [97.99612095271988, 22.966385220601524], [98.00892308803014, 22.974919976575734], [98.01227957014612, 22.980700584864167], [98.01546640055398, 22.97975633898392], [98.0581401840223, 22.97776489643286], [98.06466417371269, 22.976861543625375], [98.06866638434622, 22.96666971213756], [98.06866638434622, 22.95557452874158], [98.05501077262909, 22.94903121621769], [98.0490364440767, 22.94362586983806], [98.04560877522488, 22.94000777583824]]]]};

            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
