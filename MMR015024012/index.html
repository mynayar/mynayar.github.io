
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Matman</div><div class="name-mm">မက်မန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Yang</div><div class="name-mm">ပန်ယန်း</div></div>
        <span class="pcode-badge">MMR015024012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.84686854664619, 22.206808939680855], [98.84870201698453, 22.18786768314709], [98.84912235920956, 22.186160938076853], [98.82506563656995, 22.153258201404924], [98.82184111197779, 22.133746512091932], [98.81969959685898, 22.117566176937544], [98.81922370441049, 22.106858602242767], [98.81541656662131, 22.10019611156133], [98.81181006218469, 22.092334853370858], [98.78649259705577, 22.088413501681828], [98.77252040059608, 22.084149507393875], [98.77252444394799, 22.08420710177637], [98.7725262264043, 22.084232491436353], [98.7732818295928, 22.094999848564214], [98.76814219330765, 22.11041875741978], [98.77226066559729, 22.123246278792806], [98.77309147279328, 22.135507793849683], [98.77122144141646, 22.157532125107537], [98.76926465334111, 22.184945224642433], [98.7670758833454, 22.215608201557302], [98.79924749907286, 22.213443370615096], [98.80106958939012, 22.21332076244329], [98.8111691459394, 22.21493697006514], [98.8220768260847, 22.209685182924886], [98.83662028539788, 22.20766547737992], [98.84686854664619, 22.206808939680855]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
