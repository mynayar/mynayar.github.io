
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Dat Pa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Dat Pa</div><div class="name-mm">ဒါပ္ပ</div></div>
        <span class="pcode-badge">MMR012002007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.91039840276414, 20.54033859175263], [92.91060555710084, 20.526641404377358], [92.91064229890304, 20.524211628663807], [92.91081266827007, 20.512944193619717], [92.9115950379807, 20.509669059679425], [92.91220279892008, 20.5071247678938], [92.91520430423532, 20.494558181215154], [92.9067880771081, 20.492497599684555], [92.89742431527998, 20.488316962657734], [92.89538532107576, 20.490463292746824], [92.89382413757397, 20.491851025804237], [92.89239875889564, 20.4932850964301], [92.89163754573622, 20.493636424681313], [92.88942919120427, 20.494655665026983], [92.88908123631006, 20.49456287657557], [92.88840765488942, 20.495024762083176], [92.88776418636814, 20.495629354711014], [92.88686729339094, 20.49591472668334], [92.8874779933148, 20.499168183365043], [92.8871663737292, 20.503323095284657], [92.8872346628495, 20.503937701863492], [92.88711767274248, 20.504227494003715], [92.890900402032, 20.50767904974839], [92.89189438941457, 20.510212739426436], [92.89288841007215, 20.512746421909867], [92.89388246310523, 20.515280098997437], [92.89487654761461, 20.51781376978971], [92.88889858580114, 20.52193800133773], [92.88789958739608, 20.52625294671617], [92.88690053143443, 20.530567884899995], [92.88530091630429, 20.538822732283336], [92.88457184401545, 20.54165910498375], [92.89748517689947, 20.540999329955184], [92.91039840276414, 20.54033859175263]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
