
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zaung Yar Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zaung Yar Pin</div><div class="name-mm">ဇောင်းယားပင်</div></div>
        <span class="pcode-badge">MMR009021041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.45352600272292, 21.656192832333375], [94.44877561190503, 21.660943223151264], [94.44495464524073, 21.68059391078043], [94.4405004893062, 21.687027692174297], [94.44550049685051, 21.693694370099138], [94.44877561190503, 21.6986070417816], [94.46678874200688, 21.692056812571877], [94.4780513036248, 21.690805416736623], [94.48152675795359, 21.686598288380367], [94.50827352820085, 21.671860272433662], [94.50903629898608, 21.672415014741205], [94.50827352820085, 21.657668108996063], [94.50827352820085, 21.642930093049415], [94.51022427912721, 21.630250208880113], [94.511073988274, 21.629910325401227], [94.51045693823716, 21.628737928712496], [94.48534772461784, 21.62109599538394], [94.48409818408396, 21.622470491320144], [94.47988920132565, 21.627100372084556], [94.46187607032442, 21.634196453803327], [94.45641754613291, 21.644567649677356], [94.45641754613291, 21.653301288923387], [94.45352600272292, 21.656192832333375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
