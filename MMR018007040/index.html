
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Pyin</div><div class="name-mm">မင်းပြင်</div></div>
        <span class="pcode-badge">MMR018007040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87899266258137, 19.5254779192706], [95.87197073356259, 19.522777176925217], [95.85900717534093, 19.523857474043268], [95.84010198341986, 19.527638511708005], [95.82983916484562, 19.528718808826], [95.82281723672617, 19.528718808826], [95.80823323237786, 19.529258956935337], [95.79707016725445, 19.5296190562745], [95.79959085903096, 19.535740736945513], [95.80391204570441, 19.55788681842199], [95.80337189669575, 19.574631416107025], [95.8055324909318, 19.60974105670448], [95.80499234192308, 19.63620832485435], [95.8055324909318, 19.652952923438704], [95.8055324909318, 19.664337587809484], [95.81417486427864, 19.66267559300428], [95.82497783006289, 19.660514999667555], [95.83524064773775, 19.66267559300428], [95.84658376342998, 19.66591648255968], [95.85738673011355, 19.6723982625698], [95.86872984400713, 19.68320122925337], [95.88007295880004, 19.675099004015863], [95.8762919211353, 19.652952923438704], [95.87683206924464, 19.640529512427122], [95.87641657076819, 19.62972654484423], [95.8762919211353, 19.626485655288832], [95.8762919211353, 19.607040316157736], [95.88007295880004, 19.584354085672544], [95.88223355213677, 19.57355111988835], [95.88223355213677, 19.55356563174854], [95.8795328106907, 19.535740736945513], [95.87899266258137, 19.5254779192706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
