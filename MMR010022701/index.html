
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR010022701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9444661019291, 21.185170737939245], [94.9341208568921, 21.17775271241777], [94.92599228421659, 21.1724699876998], [94.92195113563645, 21.172758641298287], [94.92078082537483, 21.17254585810491], [94.91242557408106, 21.171026720606733], [94.90636385211013, 21.170160760710587], [94.90492058501707, 21.17420190839141], [94.90492058501707, 21.179686323165356], [94.90347731792394, 21.184882085240076], [94.90347731792394, 21.19369228916787], [94.89885886304614, 21.190077846415534], [94.89308579467377, 21.184593430742268], [94.88904464699294, 21.181995550154568], [94.88403943237398, 21.190122219864577], [94.87759658941116, 21.206369389036126], [94.89896050981974, 21.211612700965418], [94.90252738922771, 21.212488113635573], [94.91885579326032, 21.216071816661042], [94.93125054917357, 21.218791883638573], [94.93549695182293, 21.219350718760722], [94.9457057867927, 21.222363491681847], [94.94570181538654, 21.222192166335446], [94.94533206182524, 21.206242437138826], [94.94475475462826, 21.199892061569415], [94.94475475462826, 21.19180976620777], [94.9444661019291, 21.185170737939245]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
