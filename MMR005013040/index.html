
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kin San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kin San</div><div class="name-mm">ကင်းစမ်း</div></div>
        <span class="pcode-badge">MMR005013040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13137195994807, 22.501391309761175], [95.12893691960323, 22.512044520438337], [95.12893691960323, 22.52030661006205], [95.12925480026888, 22.52793329988191], [95.1286190398369, 22.537784339575637], [95.12385264018724, 22.54191543025297], [95.1199498801829, 22.54368942033051], [95.12293895956537, 22.548813750154522], [95.12436887982, 22.55524875012975], [95.1267520796448, 22.558823729731387], [95.13485567994576, 22.56025373991821], [95.14248227983342, 22.56025373991821], [95.14628243978285, 22.56326234987762], [95.14572623967427, 22.558810499804792], [95.15038679991096, 22.54906539035551], [95.1614031604276, 22.54143869963633], [95.16141827982983, 22.53793211977154], [95.16513275956925, 22.533687090386934], [95.16619403962329, 22.52917674031437], [95.16301020036053, 22.524666390241748], [95.16088764025244, 22.518829440326442], [95.16035699977579, 22.514319090253878], [95.16619403962329, 22.512461939866682], [95.16858192041934, 22.511400659812637], [95.16911255999673, 22.506890309740072], [95.16911255999673, 22.500522810179575], [95.16834108017679, 22.4948845798595], [95.16103236005546, 22.495520160427134], [95.15086343969602, 22.49170685958393], [95.14514339984811, 22.4913890697498], [95.13910583996261, 22.4948845798595], [95.13147924007495, 22.5009223196094], [95.13137195994807, 22.501391309761175]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
