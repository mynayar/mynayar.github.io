
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mi Chaung Kan 3 Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thingangyun</div><div class="name-mm">သင်္ဃန်းကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Mi Chaung Kan 3 Ward</div><div class="name-mm">မိချောင်းကန်အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013009701534</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17426840456329, 16.833811124583804], [96.1745586391699, 16.833810806223767], [96.17547035207514, 16.83379936235076], [96.17677879370643, 16.833791733401824], [96.17711448634452, 16.833791733401824], [96.17756080638617, 16.833791733401824], [96.17788772613773, 16.83379859972564], [96.1781620454421, 16.833751254916535], [96.17858123833355, 16.832803727410123], [96.17883714042176, 16.832175573444033], [96.17899131659607, 16.831762314279445], [96.17918014544739, 16.831222534892106], [96.17928727628686, 16.8308712740901], [96.1793084148515, 16.83080196333998], [96.17876624956284, 16.830854416298337], [96.17849159301267, 16.83085060137421], [96.17819023199365, 16.830831527652947], [96.1776027678535, 16.830770491564977], [96.1767749787823, 16.83065223701118], [96.17650794938243, 16.830610276443167], [96.17578766526862, 16.830491153144237], [96.1757481904267, 16.83090210015183], [96.17556571978218, 16.8312892915676], [96.17529106143337, 16.83183288587901], [96.17426840456329, 16.833811124583804]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
