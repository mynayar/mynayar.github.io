
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Da Ne Ri</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Da Ne Ri</div><div class="name-mm">ဓနဲရိ</div></div>
        <span class="pcode-badge">MMR013006051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9835307466467, 16.994739489735707], [95.98214295063673, 16.99168633995265], [95.98103271418847, 16.987522951922756], [95.97908979995435, 16.98169421011977], [95.97770200394439, 16.975865467417464], [95.97603664927203, 16.971146962062676], [95.97020790656967, 16.968371370042746], [95.9660445194391, 16.968371370042746], [95.95993821807434, 16.96975916605271], [95.95327679758623, 16.970314284276867], [95.95272168026139, 16.97697570386572], [95.9518890015762, 16.983082006129735], [95.95299923892378, 16.98641271637382], [95.9543870349338, 16.992241458176807], [95.95577483004445, 16.996127285745672], [95.95521971182029, 16.999735554652148], [95.95583296491947, 16.999653787392447], [95.97727356062637, 17.015394424213355], [95.97853671329875, 17.013807637912237], [95.98047589624565, 17.01137161370906], [95.98057032506051, 17.011252990433206], [95.9789599738238, 17.00892693173256], [95.9808345368844, 17.007569941999293], [95.98208258184576, 17.009835810873994], [95.9823023842477, 17.0102348697435], [95.98552813641442, 17.008542253022597], [95.98555035326626, 17.008528094096334], [95.98483222572668, 17.0072074747452], [95.98517091400652, 17.006883728701155], [95.9891594405558, 17.00307116530206], [95.98690115476455, 17.000945719269566], [95.98636657166003, 16.999961343840994], [95.9835307466467, 16.994739489735707]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
