
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sint Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sint Kaing</div><div class="name-mm">စဉ့်ကိုင်</div></div>
        <span class="pcode-badge">MMR005001077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.99135351025637, 22.19316648684395], [95.9902298811042, 22.187972322864482], [95.988667319841, 22.18074992956565], [95.98866763370438, 22.17428413860216], [95.98866765528811, 22.173327597190905], [95.99374604774198, 22.165124087606614], [95.9976524500006, 22.161217684448616], [95.99648075028648, 22.152232760233744], [95.99511240031705, 22.148811540420297], [95.9861419201136, 22.145761620102746], [95.97557087959245, 22.142439180024212], [95.97590820000346, 22.150878480157758], [95.97384935956035, 22.159628729882], [95.97408083965911, 22.159650419731122], [95.97444623960234, 22.16878776014704], [95.97444623960234, 22.175366669636162], [95.97517704038819, 22.18340754042572], [95.97883211990649, 22.191083010372665], [95.98129017929841, 22.193541068865272], [95.98359489169098, 22.19268980119341], [95.99135351025637, 22.19316648684395]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
