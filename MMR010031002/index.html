
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung To</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung To</div><div class="name-mm">ညောင်တို</div></div>
        <span class="pcode-badge">MMR010031002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87582130860659, 21.21375255593574], [95.86127453798957, 21.21375255593574], [95.8512352171316, 21.21339400882647], [95.84915222899224, 21.218601480074312], [95.84915222899224, 21.224258556587188], [95.85076853733818, 21.229915634898703], [95.85602153676456, 21.23234009741759], [95.86208269216257, 21.235168635224397], [95.86571938504164, 21.242442020982537], [95.87541723241941, 21.245674636775107], [95.88228654109105, 21.246886868034608], [95.8927925417425, 21.249715405841357], [95.89925777332763, 21.250119482927857], [95.90168223494726, 21.246886868034608], [95.90168223494726, 21.24682914235109], [95.90612708199927, 21.248099098394732], [95.91178416031079, 21.250119482927857], [95.91905754516961, 21.253756175806927], [95.92449594613106, 21.258700177171477], [95.9247146225818, 21.25860509994544], [95.92504088942559, 21.252569174128155], [95.9255227767548, 21.24365425224198], [95.91744123682366, 21.238805328103467], [95.9085515436189, 21.231531943244647], [95.90572300491283, 21.223450403313507], [95.90127815786076, 21.211732171402616], [95.89870550325645, 21.211732171402616], [95.89117623429581, 21.211732171402616], [95.87582130860659, 21.21375255593574]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
