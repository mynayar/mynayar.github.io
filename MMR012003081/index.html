
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Shey Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mrauk-U</div><div class="name-mm">မြောက်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Shey Pyin</div><div class="name-mm">ရှာရှည်ပြင်</div></div>
        <span class="pcode-badge">MMR012003081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.06888290522198, 20.747646610902393], [93.07006129319416, 20.747937802387696], [93.07123968476373, 20.74822898577912], [93.07211174655993, 20.756395314692043], [93.07223597441077, 20.756803597907776], [93.07236020316088, 20.757211880224133], [93.07707410308745, 20.75837649957583], [93.0912157462098, 20.76105291525988], [93.09332094670441, 20.755451772980962], [93.09307188216167, 20.753818570870408], [93.09096069308157, 20.749386353897137], [93.09046374840335, 20.74798661219245], [93.08922122168207, 20.744137246736614], [93.08723510311756, 20.74110492075556], [93.08586961838824, 20.738888930979442], [93.08580737810809, 20.738480627079355], [93.08574513782793, 20.73807232317921], [93.0859926492414, 20.73713886196896], [93.08623995830749, 20.735855399007505], [93.08475168913918, 20.735739470999818], [93.07755828998313, 20.734926194288505], [93.07495526887061, 20.73761069487773], [93.07284807188108, 20.739944943704245], [93.06912836078527, 20.741929822103657], [93.06846559730951, 20.742179514373163], [93.06875671684907, 20.742863309394238], [93.06879978987848, 20.744221282985848], [93.06888253470129, 20.746829941048986], [93.06888290522198, 20.747646610902393]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
