
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Win Kyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayin</div><div class="name-mm">ကရင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hpa-An</div><div class="name-mm">ဘားအံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Win Kyan</div><div class="name-mm">ဝင်းကျန်</div></div>
        <span class="pcode-badge">MMR003001083</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.6453430002793, 16.760848000135127], [97.64342900014827, 16.76084700008903], [97.6405569999057, 16.76084700008903], [97.63768499966307, 16.760608999905457], [97.63529992924839, 16.75796401103031], [97.63117908364785, 16.75474774131527], [97.62826434042705, 16.750023845424153], [97.62273637508372, 16.747008591273527], [97.6189170550781, 16.749018760407523], [97.61566899972462, 16.755628999578732], [97.61255800015164, 16.75586599971615], [97.60944699967934, 16.75657600008236], [97.60609699987668, 16.75728600044863], [97.60083199989691, 16.755390000248383], [97.59843900015977, 16.749229000318167], [97.59804688855314, 16.75434596739251], [97.59953405155528, 16.764161242847138], [97.60146736462724, 16.773381655439096], [97.60310324401956, 16.780073889398523], [97.603332039642, 16.78080603557015], [97.60448804438778, 16.784505246619858], [97.60942887294419, 16.784710285751146], [97.61662699983623, 16.785009000065372], [97.62332700034085, 16.786669000174243], [97.62739499997934, 16.786906000311717], [97.62954900038613, 16.786433000082923], [97.63098500005776, 16.784775000066247], [97.63361700002457, 16.78382799956256], [97.63645848896817, 16.776582769779054], [97.63878772407429, 16.770643682959644], [97.6453430002793, 16.760848000135127]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
