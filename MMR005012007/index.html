
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bon Ma Noe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bon Ma Noe</div><div class="name-mm">ဘုမ္မနိုး</div></div>
        <span class="pcode-badge">MMR005012007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15164956227756, 21.94562374094295], [95.14863744586148, 21.937322779023077], [95.14472920179128, 21.93468490918127], [95.14243547731547, 21.935296742250898], [95.13986121921994, 21.93812707240653], [95.1392577480467, 21.940008487401826], [95.13471454394113, 21.945388597006172], [95.13406893683202, 21.946153132261315], [95.13324470457951, 21.949968557303123], [95.13362725099688, 21.951785652785702], [95.13363841158349, 21.951838665122352], [95.13349053516015, 21.955831349237428], [95.13376665940388, 21.95873063760888], [95.13534193528216, 21.961275317002332], [95.13539422456387, 21.961395157060906], [95.13748322107386, 21.966182753731175], [95.13777897392055, 21.969583931253453], [95.13725923592506, 21.971610907817194], [95.14483199969709, 21.967970040285195], [95.1550405199041, 21.96531594037839], [95.15789891969945, 21.963070079620536], [95.16135488122285, 21.961415504222202], [95.1612523333286, 21.959237548574038], [95.15619639604688, 21.95333895642773], [95.15316641909504, 21.949803983167328], [95.15164956227756, 21.94562374094295]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
