
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Chaint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Chaint</div><div class="name-mm">အလယ်ချိုင့်</div></div>
        <span class="pcode-badge">MMR010018010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49779236392652, 21.26971360859619], [95.48422607017704, 21.271632123323855], [95.47834262621132, 21.272220467900297], [95.47351007962652, 21.274187065780495], [95.46992097797084, 21.280109085266133], [95.4687274966767, 21.281686185868807], [95.46575012376928, 21.285620571432275], [95.47393004323698, 21.29016497073684], [95.4821503440632, 21.29580913298514], [95.49397407634262, 21.304972525861444], [95.50106831624987, 21.3037901529932], [95.51259645486255, 21.307632866163885], [95.51909950833573, 21.307337271597873], [95.5241245943746, 21.30881523903213], [95.52449027670497, 21.3094734681261], [95.52611602883172, 21.30742360471561], [95.52611602883172, 21.30149539609573], [95.52315192542108, 21.29918998223195], [95.52117585498178, 21.296390550083856], [95.5195291297656, 21.29161504839584], [95.52002314804992, 21.289638977956542], [95.5219992175899, 21.28601618409965], [95.52331659668363, 21.28354609717468], [95.51607100807064, 21.28041731980352], [95.50849607513379, 21.27745321459423], [95.50404991776952, 21.27432443812239], [95.50240319255334, 21.272842385967408], [95.49779236392652, 21.26971360859619]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
