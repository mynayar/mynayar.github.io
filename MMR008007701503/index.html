
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Paing Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ah Lel Paing Ward</div><div class="name-mm">အလယ်ပိုင်းရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR008007701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78614071642056, 17.656194225050285], [95.78828223132587, 17.655251958491988], [95.78946878921408, 17.654741960683054], [95.79028120250149, 17.65440955778155], [95.79100398611365, 17.65227493004494], [95.79144815216802, 17.652409766168716], [95.7918685236125, 17.652385971558715], [95.79227303198348, 17.651204172592486], [95.79115468531057, 17.650878979588015], [95.79117054838395, 17.6505855127308], [95.79110709609057, 17.650363429703646], [95.79109916455388, 17.650077894382946], [95.78904911896495, 17.650252295309144], [95.78801643288858, 17.650323679139376], [95.7879117366042, 17.650713910744457], [95.78772137972373, 17.6511993207896], [95.78750448580348, 17.651658787743486], [95.78718785983682, 17.6525900405872], [95.78702954685326, 17.65303704195219], [95.78680604617097, 17.653158104821784], [95.78556747988893, 17.653670293885796], [95.78499962421245, 17.653915861878204], [95.78508101026858, 17.6540524741867], [95.78529998911984, 17.654433921217617], [95.78554015947259, 17.655006091763937], [95.78589335116766, 17.655634772981443], [95.78614071642056, 17.656194225050285]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
