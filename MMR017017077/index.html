
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Laing Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Laing Su</div><div class="name-mm">တလိုင်းစု</div></div>
        <span class="pcode-badge">MMR017017077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15071871989306, 16.612606620199415], [95.15376899993947, 16.61216472032561], [95.1548317198081, 16.611995969738246], [95.15709071966103, 16.60922018975998], [95.15942351967976, 16.60813496975311], [95.16175595996964, 16.60704974974618], [95.16395411978687, 16.60651092004298], [95.16114863969801, 16.605618119880376], [95.15973635964536, 16.604285130354526], [95.16036167984771, 16.601015969711284], [95.16173292023814, 16.598661120114627], [95.16179231955994, 16.59738383999229], [95.16071375993215, 16.59584331032056], [95.15883851968198, 16.59635055043759], [95.15830680001886, 16.596603000028495], [95.15756628025969, 16.596769680376497], [95.15361023992068, 16.596397440189776], [95.1508583998953, 16.59642209960026], [95.14889280026256, 16.595818380214098], [95.14796939976804, 16.595534789798762], [95.14544291995486, 16.59460995038893], [95.14556064031137, 16.595704800336307], [95.14567835976857, 16.596799650283685], [95.14694483993247, 16.599951810028074], [95.1473401198507, 16.601398380331034], [95.14861631988731, 16.606070010322753], [95.15074428042425, 16.611705539978743], [95.15071871989306, 16.612606620199415]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
