
<!DOCTYPE html>
<html>
<head>
    <title>Map View - To Tet Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">To Tet Kone</div><div class="name-mm">တိုတက်ကုန်း</div></div>
        <span class="pcode-badge">MMR010007050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1652944080106, 21.948683403616258], [96.16535224520999, 21.946427757335186], [96.16535224520999, 21.9404414012497], [96.16535224520999, 21.93528074960693], [96.1641136889956, 21.933835768406027], [96.16086755369469, 21.93191759811873], [96.15507376494236, 21.93848127758895], [96.14976297687991, 21.945333908333225], [96.14102587434468, 21.945333908333225], [96.13443412973135, 21.945180610796626], [96.13365929633949, 21.94516259198008], [96.13302336323767, 21.945083567652603], [96.13170707771951, 21.944876409718574], [96.130575190093, 21.94578804887942], [96.12996670340073, 21.94676853384084], [96.12941379211287, 21.94816793020584], [96.12916628609531, 21.94965625243418], [96.12919053271696, 21.950197226121134], [96.12923699079454, 21.95123372625551], [96.1296741377513, 21.952411607010106], [96.12975676026633, 21.952929516683923], [96.12996769715159, 21.954251747620106], [96.13014025636778, 21.955333409908974], [96.13102050828991, 21.962169906815802], [96.13164708124788, 21.962108277175275], [96.13282174242954, 21.961992736775414], [96.13996184236521, 21.96129043190797], [96.14305823155223, 21.961909709565475], [96.14718675286639, 21.95922617125086], [96.15350440300585, 21.960542347951048], [96.15709520258162, 21.96129043190797], [96.16225585422433, 21.961084005122814], [96.16242787564602, 21.960690813430347], [96.16514581932415, 21.954478372279084], [96.1652944080106, 21.948683403616258]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
