
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Te</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Te</div><div class="name-mm">မင်းတဲ</div></div>
        <span class="pcode-badge">MMR009012040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09356061203266, 19.340954831200577], [95.0980488648633, 19.34060958056773], [95.10762174604679, 19.340248339988932], [95.11936207160238, 19.33844213619568], [95.12261323861014, 19.337900274877825], [95.12622564709602, 19.334829728609122], [95.12712874899262, 19.327424291797684], [95.13037991600038, 19.323811884211125], [95.1326842956438, 19.32239380443059], [95.13056053584012, 19.318212652092257], [95.13037991600038, 19.312794039813127], [95.13128301789703, 19.30845915106903], [95.1372434905947, 19.302137436893247], [95.1388346853725, 19.301052533447717], [95.1386223509408, 19.301060115631856], [95.14805421123293, 19.282015015280763], [95.14374582461016, 19.281546712211025], [95.12785123015021, 19.276489341410013], [95.11322097906498, 19.271251349869942], [95.0946170780158, 19.261497848846716], [95.09381574879785, 19.26191960120866], [95.09118529026898, 19.263304051740647], [95.08161240998481, 19.27378003482079], [95.08112530928565, 19.27467658335769], [95.0691496023723, 19.296718824614118], [95.0660790561036, 19.31225217939459], [95.0660964319049, 19.31235354018378], [95.06716277784, 19.318573892671054], [95.07167828822247, 19.323631264371386], [95.0738452415647, 19.32528227575648], [95.08305737319927, 19.332301042758957], [95.09299149406223, 19.340248339988932], [95.09356061203266, 19.340954831200577]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
