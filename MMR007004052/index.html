
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Bar</div><div class="name-mm">အဘား</div></div>
        <span class="pcode-badge">MMR007004052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.65036666558922, 17.57403146887725], [96.61687348622246, 17.589325761374823], [96.61687565988387, 17.589777185968387], [96.61505470001447, 17.59029215306049], [96.6151555104185, 17.590353478730094], [96.65099299483091, 17.612154616242606], [96.67052771758017, 17.621921979415845], [96.68186318004177, 17.627168807694375], [96.68239715970122, 17.62767978089721], [96.68380947572678, 17.628130033674154], [96.68569721925132, 17.62993729686883], [96.68899698921973, 17.631288324996262], [96.69041217857927, 17.632642489059663], [96.69242559786312, 17.632854553694756], [96.69465395601532, 17.63308925696367], [96.69748036063021, 17.631731161064295], [96.69894833299924, 17.62084574003893], [96.69745718240313, 17.61244107549527], [96.69284817310478, 17.60430752866955], [96.68295235886433, 17.598478487392356], [96.6612629018615, 17.585871490576892], [96.65036666558922, 17.57403146887725]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
