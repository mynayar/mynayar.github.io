
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Taung</div><div class="name-mm">ဆားတောင်</div></div>
        <span class="pcode-badge">MMR010019049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80359347435939, 21.335184723895964], [95.80913436026259, 21.33480259386465], [95.80903004789843, 21.334472271977802], [95.8098049784171, 21.329047761045388], [95.81026993600881, 21.323003305158466], [95.81212976907364, 21.31602893408808], [95.81104486742674, 21.313549157867385], [95.8105799080364, 21.30719472995287], [95.80825511827913, 21.30208019104805], [95.80376052342945, 21.292781029321077], [95.80299104280243, 21.288626190246532], [95.80170637834675, 21.286628199731695], [95.7960241217159, 21.291401295733237], [95.7930693487715, 21.292083166205202], [95.78920541609716, 21.292765039375126], [95.78647793331004, 21.290264845846025], [95.77852277420675, 21.293446908947715], [95.76943116431681, 21.298447292408696], [95.76335682036103, 21.306455291178793], [95.76363946558894, 21.309292257431764], [95.76367378191958, 21.309637070094766], [95.76370762340815, 21.309812954104586], [95.76396369906553, 21.311143875189714], [95.76690483109314, 21.314195632822248], [95.77165794415885, 21.317308425643375], [95.77651405298121, 21.3195896153685], [95.77998161306107, 21.3238430021529], [95.78139686627242, 21.32987403925557], [95.78421592702347, 21.332994461025578], [95.78721046439148, 21.330995560396843], [95.79152488726379, 21.328611374015736], [95.79645729097126, 21.329534530794035], [95.80234718307611, 21.331792830974393], [95.80359347435939, 21.335184723895964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
