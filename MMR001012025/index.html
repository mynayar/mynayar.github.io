
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Mu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Mu</div><div class="name-mm">ပန်မူ</div></div>
        <span class="pcode-badge">MMR001012025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.60329993114698, 24.276973235026844], [97.60396729735294, 24.27363640939285], [97.60697650716014, 24.2687464428941], [97.61337107811283, 24.263856477294667], [97.61487568256678, 24.257461906341973], [97.60706964185056, 24.253256594616175], [97.60157973221891, 24.25675017388147], [97.58710633369043, 24.263238249145957], [97.57413018406078, 24.26822907641082], [97.56714302642956, 24.253256594616175], [97.56115403263254, 24.23778503135418], [97.5476787997369, 24.239282279353745], [97.52921273957634, 24.241777692986204], [97.51473934194712, 24.24626943698496], [97.5107466803151, 24.257748338614988], [97.50875034904942, 24.261741001146333], [97.49844188988135, 24.26361526563204], [97.50203030895165, 24.270251048247303], [97.50391106474387, 24.276645619199996], [97.50503951875885, 24.281911737037092], [97.50315876296662, 24.28567324862155], [97.49902109914444, 24.289058609767096], [97.49375498220672, 24.292067819574243], [97.49375498220672, 24.296581634734707], [97.4926705239256, 24.30344986871654], [97.49977340182107, 24.30372850926335], [97.52187228777592, 24.30372850926335], [97.5230947794006, 24.296957786972314], [97.529113199015, 24.288682459328072], [97.54039773556713, 24.283416342390353], [97.5539391810484, 24.283416342390353], [97.58026976843513, 24.28228788837538], [97.60329993114698, 24.276973235026844]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
