
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Yin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Yin</div><div class="name-mm">ဥယျာဉ်</div></div>
        <span class="pcode-badge">MMR009003005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76569868664512, 20.769525314941404], [94.7497986548841, 20.768186364709038], [94.73103562419476, 20.77004409066228], [94.71635958862419, 20.77227336162639], [94.71073077330658, 20.7720250318298], [94.71184414029489, 20.76973778696936], [94.71210693478724, 20.769658430791992], [94.7092713921611, 20.76828639360224], [94.70777603633508, 20.76942417088884], [94.70112338603548, 20.776076862557204], [94.69760872396353, 20.782353035064546], [94.68882218479604, 20.79214380489276], [94.68651370334481, 20.796201133175828], [94.70131631309744, 20.79850531227038], [94.70129511967411, 20.79880385661272], [94.71105561832218, 20.79880385661272], [94.72798915907248, 20.795142551087906], [94.73047830622892, 20.78899289520598], [94.74812670188584, 20.788807122250944], [94.75871573874042, 20.7901075302384], [94.76238798811522, 20.792807713205434], [94.76280273565777, 20.791407938225802], [94.76670396141873, 20.788807122250944], [94.76915820408789, 20.788398081806065], [94.76819014056258, 20.784162808267013], [94.76800436940619, 20.77914694837301], [94.76744705144034, 20.76967254565153], [94.76569868664512, 20.769525314941404]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
