
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Bet Kar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Bet Kar</div><div class="name-mm">တဘက္ကာ</div></div>
        <span class="pcode-badge">MMR010023027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08415113566645, 20.54443403869999], [96.09160033888458, 20.54505350971175], [96.09054374699639, 20.541738509724496], [96.09870144511564, 20.54043211764815], [96.10634399178184, 20.54088167884646], [96.09285714504125, 20.531440887387078], [96.07892073710241, 20.522000094129112], [96.07560811312396, 20.52333414665361], [96.07061129907225, 20.52250134476128], [96.06886003486278, 20.521587641656367], [96.0674466504426, 20.523001026975862], [96.05728646070168, 20.524333510183396], [96.05076408439504, 20.527704239359196], [96.0478839866567, 20.529043197685496], [96.0444011578872, 20.532097078617312], [96.04143805632128, 20.53494908962881], [96.04925055237118, 20.541980911190137], [96.05258057103657, 20.543091033424503], [96.05745376877644, 20.544715602043425], [96.0650149258982, 20.543819828722178], [96.06582455405999, 20.543723912428675], [96.06870804763832, 20.543382449740307], [96.08284485780399, 20.544325414086643], [96.08415113566645, 20.54443403869999]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
