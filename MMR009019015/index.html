
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Taw</div><div class="name-mm">ဇီးတော</div></div>
        <span class="pcode-badge">MMR009019015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1730804309172, 21.711583429731547], [95.1746821297765, 21.709180881892223], [95.18134430659455, 21.711504898232533], [95.1821017632858, 21.706707670722494], [95.18408033204173, 21.69632018362961], [95.18704818562531, 21.688900550120366], [95.21143166973582, 21.693104599197966], [95.20930708705248, 21.68642733895058], [95.20485530712676, 21.679996990268933], [95.19298389279248, 21.67851306302748], [95.19199460796483, 21.673071998274168], [95.19663582558292, 21.672556308127184], [95.1825964056996, 21.671588071932035], [95.16825178109485, 21.66862021834845], [95.15424960033886, 21.663952825062893], [95.15192858683486, 21.663179153595138], [95.15148458614482, 21.684491193014196], [95.1573696506889, 21.686921981364378], [95.15885358062832, 21.69619654213676], [95.15934822034416, 21.699288037213194], [95.16403259013197, 21.70505341458346], [95.1657785690258, 21.707202313136293], [95.1730804309172, 21.711583429731547]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
