
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Pon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Pon</div><div class="name-mm">အုပ်ပုံ</div></div>
        <span class="pcode-badge">MMR005006037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63434704038366, 22.470866099990587], [95.63063688008799, 22.467897990100198], [95.62474331964853, 22.467897990100198], [95.61590316020272, 22.466214089608627], [95.61506148020322, 22.459899779551222], [95.61674519993107, 22.457374020095017], [95.61169368011929, 22.4552691901211], [95.60077464873109, 22.45607557083099], [95.6003605693848, 22.456799340717055], [95.59818009023905, 22.460610601897827], [95.59843445178859, 22.474600479028936], [95.59849121609682, 22.477722489001735], [95.5991134660137, 22.480833740384867], [95.60409146804687, 22.48238936697578], [95.60693893568339, 22.47958940872428], [95.60904989723502, 22.480385898690315], [95.60936469682338, 22.480504773776318], [95.6122599499368, 22.483682077665776], [95.61905856020445, 22.484170889774816], [95.62156757068692, 22.483310801552307], [95.62295335941008, 22.48283599908217], [95.62344361583024, 22.48274814880807], [95.62510361683849, 22.482450689048108], [95.62538661460064, 22.482399978076558], [95.626547303915, 22.481600096767124], [95.62965965606833, 22.476246854408828], [95.63202568873459, 22.472829247172058], [95.63609872367721, 22.47377041467297], [95.63484636017142, 22.471265610319733], [95.63434704038366, 22.470866099990587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
