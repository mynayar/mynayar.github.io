
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ye Mun (South) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ye Mun (South) Ward</div><div class="name-mm">ရဲမွန်တောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701518</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1159305303796, 21.951022002113596], [96.11585733514833, 21.95102665568847], [96.11606825940797, 21.955890463836795], [96.11622779917658, 21.961682306848314], [96.11652087065698, 21.96656658431747], [96.11655569611284, 21.967406616513273], [96.11868572422502, 21.967327149060733], [96.12370269439297, 21.967138146780705], [96.12880678774158, 21.9669457375543], [96.13159916845495, 21.966866076532337], [96.13132073361751, 21.964709649146872], [96.13014025608199, 21.95533340979576], [96.12967413769933, 21.952411607356954], [96.12923699066428, 21.951233725865624], [96.12919053332082, 21.950197226409312], [96.12910295256594, 21.950204757317], [96.12339392162643, 21.950528731076275], [96.12162313382069, 21.950646452645163], [96.1169275345884, 21.950958615009675], [96.1159305303796, 21.951022002113596]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
