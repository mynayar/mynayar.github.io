
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Kyun (Ku Kyun)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Kyun (Ku Kyun)</div><div class="name-mm">လက်ပံကျွန်း (ကူကျွန်း)</div></div>
        <span class="pcode-badge">MMR009018054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93268707674724, 21.250005801426653], [94.93682805996707, 21.252963645555838], [94.93485770202142, 21.25887472029217], [94.9375269123372, 21.25957103567481], [94.9461214624356, 21.25957103567481], [94.95560510299316, 21.262534673236644], [94.95916146842711, 21.266683765643336], [94.96066204481758, 21.26641443218034], [94.960283870904, 21.265888276622718], [94.9645920821589, 21.257271855911483], [94.9660281519777, 21.25104888639703], [94.96794291203582, 21.242432464786475], [94.96363470168018, 21.23381604407524], [94.96437896981365, 21.231434385688374], [94.9649519629628, 21.22755218688394], [94.9457057867927, 21.222363491681847], [94.93549695182293, 21.219350718760722], [94.93452749704642, 21.22111390798051], [94.93060508865398, 21.22615700384273], [94.92773294901644, 21.237166874851425], [94.93012639931396, 21.24817674496086], [94.93268707674724, 21.250005801426653]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
