
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyin Ywar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zalun</div><div class="name-mm">ဇလွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyin Ywar</div><div class="name-mm">ပြင်ရွာ</div></div>
        <span class="pcode-badge">MMR017009028</span>

    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4625096802776, 17.400568229839962], [95.46669467991558, 17.399372490348185], [95.47347060028801, 17.396881469903974], [95.47533863966657, 17.396831609691105], [95.47464131974118, 17.390255310034604], [95.47468377133902, 17.389601977749123], [95.47419216683511, 17.389283139305462], [95.47365318784438, 17.388235294223477], [95.47279531195414, 17.386564398828], [95.47138740800256, 17.386106376807902], [95.47009554267521, 17.38485371382791], [95.46951461480768, 17.384290411773122], [95.46666165321278, 17.383931902435393], [95.46575328308762, 17.383817753286735], [95.46486268626404, 17.385084239745936], [95.46480367095273, 17.385168149190804], [95.46252126804217, 17.38515625295878], [95.45821892396424, 17.385133830162204], [95.45537772010573, 17.38783053005494], [95.45493337497533, 17.389912589194694], [95.4549631146561, 17.389893787068672], [95.45527763995119, 17.389531169627844], [95.45563440010756, 17.390087369736364], [95.45599114587475, 17.390643578838137], [95.45762735981486, 17.39319470996793], [95.45668087192473, 17.394191053574332], [95.45573411963397, 17.395187579743038], [95.4538408803524, 17.397180359586002], [95.45952059999576, 17.399571840368196], [95.4625096802776, 17.400568229839962]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
