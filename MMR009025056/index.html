
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay</div><div class="name-mm">လေး</div></div>
        <span class="pcode-badge">MMR009025056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.14395605572747, 21.330439539253405], [94.13788030972859, 21.329629439846826], [94.13372412616752, 21.328128596357658], [94.13394152917829, 21.330139573982194], [94.1408591071621, 21.35998398077612], [94.14244026730455, 21.36729684857073], [94.13453446389445, 21.37441207235929], [94.13255801304194, 21.37994613420676], [94.13170966007283, 21.38032318037051], [94.13868501140422, 21.37994613420676], [94.1408591071621, 21.386666067285205], [94.14066146225673, 21.392200129132732], [94.14187660372232, 21.395237985045014], [94.14608714770378, 21.392237257643387], [94.16021553661778, 21.386136363002777], [94.16357574462495, 21.38415977005741], [94.16034255776287, 21.37433585571523], [94.1579436773589, 21.36212337079695], [94.15292783635061, 21.350128966978275], [94.14791199444306, 21.336608001757952], [94.14442271303784, 21.330501759748472], [94.14395605572747, 21.330439539253405]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
