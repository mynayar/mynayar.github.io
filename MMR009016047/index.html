
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Maung Ma Hloke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Maung Ma Hloke</div><div class="name-mm">မောင်းမလှုပ်</div></div>
        <span class="pcode-badge">MMR009016047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48044893557, 19.30577224928993], [95.48739294462877, 19.30403624567623], [95.49297295283958, 19.309616253887043], [95.49892496111812, 19.312220257059266], [95.5059929713986, 19.310732254989603], [95.52137784900856, 19.310732254989603], [95.52133967728435, 19.310197840957642], [95.52124499216274, 19.30887225285221], [95.52088746578397, 19.30744214733727], [95.51901298905824, 19.29994424133372], [95.51268897981265, 19.293248231121026], [95.50413296836189, 19.28990022691397], [95.49408895484146, 19.291016228016588], [95.49404024666012, 19.289165325219642], [95.49222895180475, 19.290272226981756], [95.47883693407732, 19.28804022387726], [95.4713969228298, 19.286552221807653], [95.46321291234608, 19.288784224912092], [95.46188491675554, 19.289133697861928], [95.46321291234608, 19.2928762310533], [95.4713969228298, 19.30106024243628], [95.47995293517988, 19.30589624871294], [95.48044893557, 19.30577224928993]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
