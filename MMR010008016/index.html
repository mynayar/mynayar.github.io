
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pin Lein (East)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pin Lein (East)</div><div class="name-mm">ပင်လိန် (အရှေ့)</div></div>
        <span class="pcode-badge">MMR010008016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60226384939722, 22.11318379589551], [96.6023954588834, 22.1130383323532], [96.60523373814658, 22.109901288413766], [96.60610868676656, 22.107422265824937], [96.6060624679086, 22.1074024582569], [96.60454908966881, 22.106753868096575], [96.60040479964186, 22.10343843643477], [96.58838635964287, 22.088518993057107], [96.57719677800895, 22.086446848043636], [96.5643494787455, 22.086446848043636], [96.55771861632115, 22.085203561395303], [96.55150218128068, 22.089347851422247], [96.5465290328886, 22.09390656883312], [96.5418933092289, 22.09528426635586], [96.54627841611608, 22.104054479230854], [96.55309969289658, 22.114773628200453], [96.55752869479346, 22.128713413992898], [96.55795699332066, 22.128896971018435], [96.55801241314242, 22.128923752828996], [96.55813405004642, 22.12800392713956], [96.5580614828512, 22.127412589619382], [96.55798891835394, 22.12682126738764], [96.55762656711244, 22.125475008365015], [96.55762683421108, 22.124021320827353], [96.55872399721477, 22.1145168231929], [96.55842577482969, 22.110341746674294], [96.56439017126945, 22.11362216413164], [96.5790029323395, 22.11302572565677], [96.59093171982306, 22.11272750686902], [96.60226384939722, 22.11318379589551]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
