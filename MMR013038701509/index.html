
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Gyi (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Gyi (East) Ward</div><div class="name-mm">ဈေးကြီး (အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013038701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12642335925068, 16.809192180874504], [96.12648916264482, 16.808571815936602], [96.1264705655642, 16.807411194071392], [96.12645981506847, 16.806667502403343], [96.12583033280367, 16.806533177863912], [96.12526321402618, 16.806531906222517], [96.12461853142014, 16.80652046234951], [96.12393188644745, 16.806531906222517], [96.12313270570985, 16.806550026662478], [96.12220223744339, 16.80648167908629], [96.12211036719975, 16.80696296656771], [96.12203025828984, 16.807453156438044], [96.12195396430405, 16.807888666628685], [96.12191677104221, 16.808278083866526], [96.12191963178566, 16.80882326727999], [96.12192367064097, 16.809291951662317], [96.12253189113392, 16.809222221828122], [96.12328910860555, 16.80920982377438], [96.12421226538379, 16.809202193926183], [96.1248226163707, 16.809221267647445], [96.12527275043715, 16.809221267647445], [96.1257305143518, 16.809221267647445], [96.1260118483682, 16.809220314366087], [96.12642335925068, 16.809192180874504]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
