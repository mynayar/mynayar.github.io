
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Son</div><div class="name-mm">ဆုံ</div></div>
        <span class="pcode-badge">MMR010020065</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15309341662794, 20.77880407464835], [95.15274970923173, 20.771929909637663], [95.15240600093625, 20.763337203149433], [95.15206229264078, 20.759212703603453], [95.14587554422104, 20.754057080070254], [95.13728283773281, 20.74924516483253], [95.13178350590414, 20.745464373582024], [95.1308815821194, 20.74561469526202], [95.13121906260972, 20.752533056555365], [95.13058398116584, 20.764387911672827], [95.13291261282689, 20.77772462289306], [95.1334412109432, 20.783671350352563], [95.13418946307331, 20.783272281590598], [95.13762654602834, 20.78224115670406], [95.14243846216533, 20.7812100327169], [95.15103116775424, 20.7812100327169], [95.15309341662794, 20.77880407464835]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
