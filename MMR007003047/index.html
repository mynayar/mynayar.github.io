
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Du</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Du</div><div class="name-mm">အဒူး</div></div>
        <span class="pcode-badge">MMR007003047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6978090484489, 17.16777117739798], [96.69799102536558, 17.16024299212046], [96.70004266313845, 17.156823596132085], [96.70448787981184, 17.152378380358016], [96.69395608300687, 17.143829888138896], [96.68677533731204, 17.143146008581482], [96.67446548729248, 17.14212018969505], [96.67035530765139, 17.140625583004294], [96.66591698068419, 17.142462129923388], [96.65736848127045, 17.14759122525487], [96.65676862357316, 17.158620643028314], [96.65561240478871, 17.16135060344766], [96.65450938719852, 17.16322093789603], [96.65153603515995, 17.16485148520792], [96.64851472587395, 17.16672181965629], [96.65259128705833, 17.16825671057876], [96.6568246783163, 17.16923364681537], [96.66561710534518, 17.17010203488104], [96.67506082319846, 17.169450744056633], [96.6865669625953, 17.16847380782002], [96.69141951909558, 17.16817052315116], [96.6978090484489, 17.16777117739798]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
