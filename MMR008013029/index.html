
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Gaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Gaung</div><div class="name-mm">ဆင်ခေါင်း</div></div>
        <span class="pcode-badge">MMR008013029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38846924176215, 18.29448179539861], [95.38602920568337, 18.298500677664208], [95.38155306042546, 18.302417305214533], [95.37651739656064, 18.307452968179973], [95.36905715506373, 18.3106235712209], [95.36672924375966, 18.31095612972166], [95.36252944307938, 18.311556100733526], [95.3462075393465, 18.320318386984013], [95.35152558583718, 18.327409115937996], [95.35749377921462, 18.339345503592142], [95.36208862868733, 18.346611778410875], [95.36825049916126, 18.341789446325947], [95.36961683464926, 18.33942940943973], [95.3715099759047, 18.33615943670867], [95.37447313682588, 18.3370483859743], [95.38188104227635, 18.339715231972434], [95.39069185684377, 18.34051621405206], [95.39069185684377, 18.335988394648723], [95.39181089315827, 18.329087670859394], [95.39330294217712, 18.324798030604654], [95.39740607473061, 18.314540197871906], [95.39964414825891, 18.30614742596299], [95.40094968957658, 18.296449110937772], [95.40181610902624, 18.29081738901135], [95.39237041176517, 18.288056339028856], [95.38808077240975, 18.29066742256356], [95.38919980872424, 18.293278507896844], [95.38846924176215, 18.29448179539861]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
