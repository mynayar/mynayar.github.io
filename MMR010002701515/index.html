
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Ri Hay Mar (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanayethazan</div><div class="name-mm">ချမ်းအေးသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thi Ri Hay Mar (East) Ward</div><div class="name-mm">သီရိဟေမာ (အရှေ့) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010002701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07472114826379, 21.979258155194312], [96.07299101311685, 21.97943821138153], [96.07204986355657, 21.979545600087818], [96.07134784003284, 21.979530252668095], [96.07133698253551, 21.979112157941305], [96.0711357797465, 21.979141298258643], [96.07111489367088, 21.97902724161077], [96.0702413172778, 21.979102829128518], [96.07017477204732, 21.978820496563575], [96.06993928031898, 21.97883878064482], [96.06992873991186, 21.978911689663736], [96.06879392722783, 21.978981375560977], [96.06876860279749, 21.97898604207688], [96.06897606830535, 21.98391343029766], [96.06898963542665, 21.983912854382194], [96.0710280859268, 21.98386140713415], [96.07164887824956, 21.983845739323275], [96.07618948021616, 21.983704390394283], [96.0757095697432, 21.98214281438192], [96.07521615066094, 21.98065959602542], [96.07472114826379, 21.979258155194312]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
