
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aint Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aint Ma</div><div class="name-mm">အိုင့်မ</div></div>
        <span class="pcode-badge">MMR010017031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42793724610709, 21.533955131723985], [95.42665129562084, 21.534212321641405], [95.4199949419131, 21.534212321641405], [95.4159535837909, 21.535400957388333], [95.41286313372672, 21.535400957388333], [95.40929723008315, 21.53587641096766], [95.40240314778708, 21.53777822618423], [95.39983811763506, 21.538132023074468], [95.40026360578082, 21.541819584306438], [95.39955042541186, 21.551804115767368], [95.40097678704916, 21.55869819716412], [95.4012145138388, 21.56535455087186], [95.4012145138388, 21.569395908994068], [95.40311632905542, 21.57034681705204], [95.40691996038794, 21.569633635783703], [95.40977268366248, 21.56749409377744], [95.41381404088531, 21.566305458929833], [95.4185685802758, 21.565830005350506], [95.42284766518765, 21.565830005350506], [95.42736447688918, 21.564879097292533], [95.430930381432, 21.563928190133936], [95.43211901627961, 21.562977282075963], [95.43211901627961, 21.56094174486566], [95.43211901627961, 21.558460470374484], [95.43069265374305, 21.554894565831603], [95.42997947337403, 21.551804115767368], [95.42712675009949, 21.549902299651478], [95.42760220367882, 21.54586094242859], [95.42807765815746, 21.542295037885765], [95.42736447688918, 21.538966861031838], [95.42793724610709, 21.533955131723985]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
