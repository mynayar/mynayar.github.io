
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Swei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Swei</div><div class="name-mm">ကံဆွယ်</div></div>
        <span class="pcode-badge">MMR010014048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04111637422136, 21.743648696130492], [96.04042704926894, 21.744961696425207], [96.03517863908297, 21.753829697982212], [96.0319210059497, 21.760887903853757], [96.0299051081343, 21.763858701817696], [96.03044494327958, 21.7643032717786], [96.03047316940132, 21.76432651655557], [96.03391178210313, 21.76468847569265], [96.03626451739365, 21.76541239486619], [96.0391601922891, 21.76595533357181], [96.04386566197076, 21.766498273176808], [96.04639937682981, 21.767222190551706], [96.0482091734147, 21.768308068862325], [96.05182876568506, 21.768489049330185], [96.0539508671389, 21.768943785227577], [96.05544835885473, 21.76432651655557], [96.05689619630249, 21.76052594471662], [96.05780109414525, 21.756182433272727], [96.0590679520244, 21.751838921828835], [96.06087774770992, 21.747495411284262], [96.0603348090043, 21.74441875682021], [96.05816305328233, 21.74441875682021], [96.05508639971765, 21.742789939803913], [96.05237170529, 21.742066022429015], [96.05038092913662, 21.740618184981315], [96.05038092913662, 21.736274672638103], [96.05038092913662, 21.73301704040415], [96.04893309168887, 21.729035488097338], [96.04802819384611, 21.72704471194396], [96.04477055981357, 21.73319801997269], [96.0442276211079, 21.737722510085803], [96.04111637422136, 21.743648696130492]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
