
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Thay Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Thay Kan</div><div class="name-mm">ဆင်သေကန်</div></div>
        <span class="pcode-badge">MMR009006039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35053409856982, 20.629582464259386], [95.33260648320271, 20.63236433534587], [95.31906143593659, 20.635847347577055], [95.3097734042193, 20.63004232719169], [95.29700235937145, 20.623850306046847], [95.28763671616156, 20.611862282018762], [95.28732732599536, 20.61146626285779], [95.28500531784118, 20.61572327660798], [95.28488444266299, 20.616040575412285], [95.28190930726879, 20.623850306046847], [95.2811353039512, 20.633138337764137], [95.2812060320328, 20.633435396426478], [95.28307031134585, 20.641265366303685], [95.28074830319167, 20.655584415988073], [95.2803613024322, 20.66138943637344], [95.28080397392432, 20.66470947706074], [95.30164637567975, 20.660615433955172], [95.32641446205781, 20.65945442987811], [95.33907093867293, 20.656407499806335], [95.34924754104122, 20.637008351654174], [95.34929426981478, 20.637018547268212], [95.34924754104122, 20.63662134999538], [95.35505256232597, 20.628881323114626], [95.35053409856982, 20.629582464259386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
