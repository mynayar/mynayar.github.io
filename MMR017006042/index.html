
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Lar</div><div class="name-mm">ဝက်လာ</div></div>
        <span class="pcode-badge">MMR017006042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06345106801245, 17.136154679894616], [95.06250563682573, 17.135936504366214], [95.05429286062707, 17.134508195696696], [95.05134385413561, 17.13144904473768], [95.05219536012783, 17.132958269908272], [95.05230516015507, 17.135155890132296], [95.05241531991112, 17.137353420424063], [95.05290959989816, 17.147241180336266], [95.05298412042089, 17.156183580108177], [95.05304748035701, 17.163762030293526], [95.05359792030782, 17.167203810407557], [95.05967651985554, 17.16562449027805], [95.06089476038494, 17.16527636990861], [95.0629597198153, 17.164037339751474], [95.06608271994162, 17.16275141984221], [95.06764079988307, 17.162109900151847], [95.06956824038207, 17.160457859942312], [95.0714956799817, 17.158805729800633], [95.07229740040475, 17.1587723397717], [95.07080735957203, 17.15605227009621], [95.0697806395649, 17.15387094019178], [95.06750292032359, 17.14903092024082], [95.06720952010335, 17.148264570153856], [95.06534688025437, 17.143400790114413], [95.06502503987377, 17.142560280132898], [95.06401560033976, 17.138451599661664], [95.06345106801245, 17.136154679894616]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
