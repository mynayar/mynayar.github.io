
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thi Ri Zay Yar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye</div><div class="name-mm">ရေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Thi Ri Zay Yar Ward</div><div class="name-mm">သီရိဇေယျာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011006701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.85904225299765, 15.259455125953366], [97.85882129226889, 15.259380967857453], [97.85813499443452, 15.259210142534073], [97.85777236530248, 15.259129225133677], [97.85754160196342, 15.259063293136535], [97.85722092980211, 15.258943415306419], [97.85701114494844, 15.258808552972368], [97.85683432564366, 15.258598768118702], [97.85653163452736, 15.258296078801038], [97.85621995468722, 15.257993387684735], [97.85599818097131, 15.257780605390678], [97.85588130058164, 15.257666722441343], [97.85588074569989, 15.257666180150125], [97.85576741763225, 15.258167210448448], [97.85556961984213, 15.259515829292127], [97.8555456439164, 15.259995339713214], [97.85548570590066, 15.260678640107187], [97.85548570590066, 15.261098210713897], [97.8555456439164, 15.261577720235664], [97.85571646923972, 15.262572702268471], [97.85577640815478, 15.26298927633411], [97.85581536858444, 15.263714533698817], [97.85581557632787, 15.263716959170381], [97.85779856075504, 15.263915201225586], [97.85800494167478, 15.262972088491153], [97.85813528761349, 15.262112804262529], [97.85827649646319, 15.261494535644374], [97.85834166943255, 15.261138244934102], [97.8587544321714, 15.260069370105384], [97.85904225299765, 15.259455125953366]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
