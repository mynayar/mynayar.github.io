
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bwi Lat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bwi Lat</div><div class="name-mm">ဗွီလပ်</div></div>
        <span class="pcode-badge">MMR001005028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.42947895778775, 26.013076313720944], [98.42107431302918, 26.005722248882705], [98.41687198975058, 25.994165861665238], [98.41687198975058, 25.989438248876127], [98.41004321622154, 25.97893244337763], [98.39691095777454, 25.97052779682042], [98.35909005456244, 25.958446120092447], [98.34858424816457, 25.951092055254207], [98.34385663537546, 25.953718507303336], [98.34070489291656, 25.96580018493063], [98.34280605365649, 25.976831280839008], [98.3474767528499, 26.009101560288855], [98.34858424816457, 26.016753345690404], [98.35009985312576, 26.026265075672768], [98.35029505007657, 26.027490105184256], [98.353856552438, 26.027490193317817], [98.364989529843, 26.027490467611017], [98.36693878519685, 26.03008973405406], [98.36954304557514, 26.029401392060663], [98.38535457055707, 26.02568328175812], [98.39848682900401, 26.023582120118817], [98.42947895778775, 26.013076313720944]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
