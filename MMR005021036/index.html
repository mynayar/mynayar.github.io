
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gwayt Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Indaw</div><div class="name-mm">အင်းတော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gwayt Gyi</div><div class="name-mm">ဂွေ့ကြီး</div></div>
        <span class="pcode-badge">MMR005021036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12110735961699, 24.508967039996946], [96.13323431990801, 24.507313380108428], [96.1451233195856, 24.50533184988501], [96.16137155984967, 24.5041429497374], [96.17365655980245, 24.503350409593793], [96.17365655980245, 24.495424470363048], [96.17048604039849, 24.48155412032645], [96.16612679981205, 24.48274301957474], [96.16057883984166, 24.48274301957474], [96.15186035956799, 24.48274301957474], [96.14274552018969, 24.48274301957474], [96.13283795990401, 24.48512081987002], [96.12332712025045, 24.486705990089433], [96.11386019988839, 24.48788930994374], [96.11381556023997, 24.487894890237044], [96.11450008371196, 24.489497257292612], [96.11767578141223, 24.498107909752264], [96.12127685484302, 24.508728027176744], [96.12119181764831, 24.50884797425465], [96.12110735961699, 24.508967039996946]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
