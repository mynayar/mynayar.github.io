
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Kan</div><div class="name-mm">သပြေကန်</div></div>
        <span class="pcode-badge">MMR007004026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.84738812496204, 17.47181602608879], [96.84956810678278, 17.478335289841823], [96.85226319329178, 17.48552218600014], [96.8621451741605, 17.48821727160987], [96.86888288773514, 17.490463176434503], [96.87407548959226, 17.49027009828643], [96.87854925974062, 17.48993840223551], [96.87711124468825, 17.474839240138863], [96.87717533487387, 17.471250187945884], [96.87734016711511, 17.462019576142552], [96.8753336384367, 17.454851007268246], [96.87534844757283, 17.453495281082382], [96.8753529315926, 17.4530847999236], [96.87532750775836, 17.450961839617264], [96.86708616459487, 17.451384432845373], [96.85810254529628, 17.451384432845373], [96.84866974521265, 17.450486071275236], [96.84265680516751, 17.45019973972626], [96.84283039230883, 17.452282794415453], [96.84642384038796, 17.457672965634913], [96.84911892599769, 17.465758223363366], [96.84738812496204, 17.47181602608879]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
