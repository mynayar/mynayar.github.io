
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shar Khe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyonpyaw</div><div class="name-mm">ကျုံပျော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shar Khe</div><div class="name-mm">ရှားခဲ</div></div>
        <span class="pcode-badge">MMR017005031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35370593907788, 17.416812423154852], [95.35591761300748, 17.412915663427157], [95.35906634903284, 17.409976841757896], [95.36436326235474, 17.411261177061704], [95.36442368420575, 17.411275827017846], [95.36630006029958, 17.41218984308682], [95.36678366983057, 17.40928671820751], [95.36727722406471, 17.40632403932301], [95.36822280184089, 17.405877722878643], [95.36871446570007, 17.4022653629562], [95.3675098606916, 17.40202682138073], [95.36636463072318, 17.401799765946464], [95.36242499761562, 17.39906122959212], [95.36347457479184, 17.39465300113517], [95.35990601185301, 17.388775363192508], [95.35983638634019, 17.38759173397142], [95.35827312000856, 17.38694042965716], [95.35580892004566, 17.38420227011875], [95.3543030403531, 17.38748798997881], [95.35348151955657, 17.38967859009489], [95.3526599996593, 17.395702470392735], [95.3514277198135, 17.40227408997731], [95.35101695986486, 17.409940920137387], [95.35166964014184, 17.41623326964975], [95.3529325203196, 17.41654188010375], [95.35370593907788, 17.416812423154852]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
