
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Seik Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Seik Kyun</div><div class="name-mm">ရုံးဆိပ်ကျွန်း</div></div>
        <span class="pcode-badge">MMR009002025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.90772714069504, 20.356467069699534], [94.89950919429396, 20.34961878088211], [94.89950919429396, 20.335657762995424], [94.90022815460571, 20.332747126079028], [94.89825414990918, 20.326210493719373], [94.89225036136514, 20.329265052740027], [94.89264069321348, 20.331572773364826], [94.89276939159419, 20.33517634870958], [94.88939949069402, 20.347693122839416], [94.88843666302165, 20.362616970197053], [94.88747383355064, 20.3741709157552], [94.87736413085003, 20.379947888084644], [94.86737405596796, 20.385971316023472], [94.86763431796948, 20.38613845502573], [94.86369058035604, 20.387711333311415], [94.8657332959549, 20.390337895977154], [94.864415422234, 20.39527975875393], [94.86414612384459, 20.401874716644897], [94.88301516571738, 20.39317701071053], [94.89084373535019, 20.388131932742567], [94.89565787910789, 20.38331778898481], [94.89979493678698, 20.384352054303918], [94.89999060768048, 20.38331778898481], [94.90432333805165, 20.371763843426663], [94.91010031128042, 20.36117272733952], [94.90817465323772, 20.356839996968347], [94.90772714069504, 20.356467069699534]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
