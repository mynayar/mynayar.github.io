
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Hkun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bhamo</div><div class="name-mm">ဗန်းမော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Hkun</div><div class="name-mm">မံခွန်</div></div>
        <span class="pcode-badge">MMR001010004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.30911679170663, 24.215079450156566], [97.30579817734406, 24.21490257419447], [97.29975631330325, 24.215435679712925], [97.29553847402144, 24.219917133668844], [97.29105702006547, 24.223871358276597], [97.28473026159236, 24.22808919665914], [97.2829776924666, 24.229403624177962], [97.27945796271484, 24.23204342126695], [97.27286758956768, 24.23652487522287], [97.26944059610668, 24.239951868683818], [97.26944059610668, 24.242588018122603], [97.27030897427977, 24.24302220720915], [97.27102228505049, 24.243378863044143], [97.2739220500626, 24.248123931674172], [97.27972157828827, 24.247333086752576], [97.28604833676138, 24.245487783134706], [97.29184786498706, 24.24206078787512], [97.2958020886955, 24.239688254009764], [97.30239246274203, 24.23652487522287], [97.30531946012502, 24.23661096282575], [97.3065700681542, 24.236605027300243], [97.30803595859265, 24.226783558214663], [97.30934238574258, 24.217203083155823], [97.30911679170663, 24.215079450156566]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
