
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Tan</div><div class="name-mm">သရက်တန်း</div></div>
        <span class="pcode-badge">MMR007014019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.58221991072037, 18.669264739676066], [96.58086766041424, 18.669447477419226], [96.57840974401455, 18.670341265037393], [96.57908008517785, 18.67793845799349], [96.57930353163272, 18.687099778831794], [96.58064421306005, 18.693132844805007], [96.58064421306005, 18.69753072296453], [96.58288318501104, 18.697610686184248], [96.584595475301, 18.697671840083387], [96.58641029729745, 18.697736655122583], [96.58855235740543, 18.69787945936963], [96.59114621622496, 18.69559076030538], [96.59159310913475, 18.691345269568558], [96.59427447198937, 18.688440461158393], [96.59561515341665, 18.685088758039797], [96.59695583394466, 18.6817370549212], [96.59788936080542, 18.68132215359458], [96.59896685563592, 18.680843267302976], [96.59851996182681, 18.67749156418438], [96.59851996182681, 18.674810202229082], [96.59986064325415, 18.67168194556541], [96.60075443087237, 18.669447477419226], [96.59539170606246, 18.66810679599189], [96.58913519363432, 18.668330243346077], [96.58221991072037, 18.669264739676066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
