
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myay Nu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myay Nu</div><div class="name-mm">မြေနု</div></div>
        <span class="pcode-badge">MMR009001023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.99073925281431, 20.048599637363452], [94.9964169921505, 20.0450755234167], [95.00411693984495, 20.041575547273737], [95.01251688204854, 20.041575547273737], [95.01986683158907, 20.040525553711404], [95.02309087594324, 20.037946318767638], [95.02266681322288, 20.03317560507014], [95.021266822406, 20.031775614253263], [95.01496686462917, 20.030025626181725], [95.00901690590553, 20.01847570508977], [95.00026696644738, 20.007625780305546], [95.00008804902433, 20.007536321144357], [95.00005219395365, 20.0068086571938], [94.99315995796576, 20.011279297701492], [94.99403829343254, 20.014499860780006], [94.9936733881164, 20.015420810621947], [94.98894190374591, 20.027362174225004], [94.98788994516491, 20.030017117695877], [94.98658165461973, 20.03822366069346], [94.98450624236926, 20.04280155704629], [94.98681476428999, 20.044945801607525], [94.99073925281431, 20.048599637363452]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
