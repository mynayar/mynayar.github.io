
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Hlaing Chon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Hlaing Chon</div><div class="name-mm">ငလှိုင်ခြုံ</div></div>
        <span class="pcode-badge">MMR009012049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11289350443172, 19.404770281123604], [95.11322097906498, 19.401659274356064], [95.11285973758686, 19.38450033742066], [95.11268124194584, 19.384470587847375], [95.11253652214282, 19.38444646803015], [95.10852484794344, 19.383777855363803], [95.09877134692016, 19.386667781792767], [95.08847598457908, 19.385042197839198], [95.07673565902348, 19.380526688356042], [95.06842712121471, 19.37926234498127], [95.06478295856675, 19.378351304768955], [95.06192478719925, 19.37763676192708], [95.04334886226025, 19.37834441596209], [95.05747348481356, 19.39031963904017], [95.0566706429359, 19.390542651122473], [95.05610668437606, 19.390699305828377], [95.0567352268493, 19.3909153679499], [95.05684129469006, 19.390951829163612], [95.0764391759273, 19.410233614889478], [95.08270839127931, 19.416502830241484], [95.08402545201307, 19.416871607139], [95.09698534100073, 19.418452081098735], [95.10520380720999, 19.418768175710795], [95.1065222618929, 19.419698849922042], [95.10816360826396, 19.41827635087293], [95.11213725642932, 19.411954636697203], [95.11289350443172, 19.404770281123604]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
