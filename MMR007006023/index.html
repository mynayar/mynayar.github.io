
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Pat Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Pat Lel</div><div class="name-mm">အင်းပတ်လည်</div></div>
        <span class="pcode-badge">MMR007006023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.5166078428777, 18.14234044515547], [96.51458063069163, 18.13873651367919], [96.5112424012159, 18.131032905744064], [96.50725035112288, 18.126620639331065], [96.50328200625967, 18.124099657972863], [96.49634875938779, 18.124613232015122], [96.48299583788764, 18.12641074116283], [96.47068923621936, 18.131751341751055], [96.469129344144, 18.134627923140215], [96.46553432674784, 18.140534021927635], [96.462709670415, 18.146440121614376], [96.4596282270611, 18.15337336938552], [96.45472012573327, 18.16315864975195], [96.45834429285492, 18.164158419775276], [96.46579111376894, 18.166469502965242], [96.4701564922284, 18.16826701121363], [96.47400829574633, 18.170064520361393], [96.48145511666036, 18.171091668445797], [96.48607728214091, 18.17211881473156], [96.4942944641183, 18.17391632387927], [96.50276843221741, 18.175713832127713], [96.50559308944958, 18.17545704510661], [96.51432384456984, 18.174429897921527], [96.51728315729196, 18.174594303884078], [96.51771074805265, 18.174618058576584], [96.51894600915108, 18.17468668494263], [96.52331138671121, 18.164928780838636], [96.52767676517061, 18.15902268205116], [96.53203557767984, 18.154140812148796], [96.52973106133948, 18.15311658236442], [96.51689171388153, 18.142845105117544], [96.5166078428777, 18.14234044515547]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
