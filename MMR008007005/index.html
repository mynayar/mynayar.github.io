
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpoe Khaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpoe Khaung</div><div class="name-mm">ဖိုးခေါင်</div></div>
        <span class="pcode-badge">MMR008007005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.73280610761583, 17.597730782050007], [95.72944596435985, 17.591850528878865], [95.72595301372064, 17.59660882473753], [95.72446650632429, 17.600325094127868], [95.72069066584163, 17.60274163182089], [95.71938348865712, 17.601818259205345], [95.71819375933461, 17.60152082642503], [95.71652813576492, 17.60223466419842], [95.71545737865517, 17.60336490786426], [95.71504097276272, 17.60479258520968], [95.71517583329813, 17.60627112461276], [95.71480302743782, 17.608480749886724], [95.71438662064611, 17.611455075891115], [95.71367278287266, 17.614369916238672], [95.71307791821141, 17.61645194390212], [95.71224510642656, 17.618414999352808], [95.71069845686833, 17.620021136366404], [95.70880089004908, 17.62145343982445], [95.71184906208458, 17.62157536720946], [95.71782738722419, 17.624334594266145], [95.7263658313181, 17.618451671907167], [95.7294023031738, 17.61560498038557], [95.73532621663168, 17.610051310619554], [95.7305660124116, 17.6064111553506], [95.73280610761583, 17.597730782050007]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
