
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Ta Lone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mudon</div><div class="name-mm">မုဒုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Ta Lone</div><div class="name-mm">ကျောက်တလုံး</div></div>
        <span class="pcode-badge">MMR011005004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.71622594517129, 16.341702601893587], [97.72070417415836, 16.333492517365812], [97.72592105501275, 16.3303044216118], [97.73026845782312, 16.329145114555445], [97.7320074184077, 16.327406154870175], [97.73230486737577, 16.326910407189587], [97.72996496001497, 16.32496381023168], [97.72785055136194, 16.323204807356035], [97.72039155542598, 16.3212979082719], [97.71578548601144, 16.320420561160006], [97.70998497302816, 16.319260459102964], [97.70372041976162, 16.319028439411], [97.70279233829581, 16.329237340031284], [97.699564999725, 16.334542000113288], [97.70311999998808, 16.33695100058827], [97.7060219998155, 16.33846200012124], [97.7090269998962, 16.340348999906496], [97.71140099965646, 16.340600000689506], [97.71402506940149, 16.34139154708231], [97.71622594517129, 16.341702601893587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
