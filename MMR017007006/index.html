
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Moe Ma Kha</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Moe Ma Kha</div><div class="name-mm">မိုးမခ</div></div>
        <span class="pcode-badge">MMR017007006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24136636036928, 17.11545281969194], [95.23920527960001, 17.1135102597907], [95.2367554795818, 17.110766340094585], [95.23318644000227, 17.107677269590397], [95.23000224011133, 17.105656500147404], [95.22542159992696, 17.10347219978223], [95.22020736038144, 17.10272501964397], [95.21565227982893, 17.10268550972853], [95.21110475987683, 17.10327149987984], [95.20526844038625, 17.104944149852656], [95.20371575997439, 17.10728513999726], [95.20226964023175, 17.110786949857925], [95.20138872011341, 17.114908409695374], [95.20133256014958, 17.11803752970826], [95.20325891966348, 17.12049776995616], [95.20369199988596, 17.121051090435515], [95.20689240016418, 17.124412859665767], [95.21045388004256, 17.12687678983201], [95.2135318798924, 17.12773701025486], [95.21705556036585, 17.12698334960197], [95.22075564016075, 17.125423200320483], [95.22307439996365, 17.123015070389215], [95.22406152012309, 17.121990149925523], [95.22664596034286, 17.120442149585585], [95.23202076034988, 17.11904211020527], [95.23695311999057, 17.119523969655518], [95.24113775989974, 17.119656449685465], [95.24136636036928, 17.11545281969194]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
