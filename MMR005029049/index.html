
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Than Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Than Pauk</div><div class="name-mm">သံပေါက်</div></div>
        <span class="pcode-badge">MMR005029049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7672416795599, 22.975983309781952], [94.7672416795599, 22.960976849801852], [94.76659547979762, 22.934488679608933], [94.77887075987775, 22.91575310971831], [94.79631420004034, 22.90089392991098], [94.79941739979324, 22.897945620394125], [94.79927052521464, 22.897829294886094], [94.79869509130549, 22.8973737046328], [94.79757944903241, 22.89358005937231], [94.79629195800749, 22.888214524181024], [94.79545739973929, 22.88473695104949], [94.79518127999216, 22.884648750039844], [94.79400048003816, 22.88427129018794], [94.7933535599189, 22.88240009958497], [94.79211984025847, 22.87883205015902], [94.7919723226646, 22.87762666813626], [94.79188992498013, 22.876953682966132], [94.79182067988052, 22.876389180316494], [94.76853372025505, 22.88151234012247], [94.73946156040273, 22.887326789899475], [94.71516227981544, 22.88958713963484], [94.71412943992175, 22.889683260074435], [94.71749543956292, 22.902186059639007], [94.71749543956292, 22.92092153959743], [94.71878783998687, 22.937072850032052], [94.72201812024014, 22.95387027029676], [94.7209381405828, 22.95905412085102], [94.7287175721583, 22.965748049133197], [94.74944424105894, 22.970929717032845], [94.7672416795599, 22.975983309781952]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
