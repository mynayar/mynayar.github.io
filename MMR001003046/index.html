
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawt Hkum Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawt Hkum Gar</div><div class="name-mm">နော့ခွမ်ဂါး</div></div>
        <span class="pcode-badge">MMR001003046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.05757584594858, 26.4902762118777], [98.04446969661927, 26.494956979880783], [98.03206369468381, 26.495609928155716], [98.03042739261014, 26.50338236210638], [98.03510816061316, 26.510871589652197], [98.04166123617716, 26.519296971877793], [98.03417200773202, 26.52678620122225], [98.02293816506432, 26.538956196771096], [98.02073611118266, 26.54812416809591], [98.02083343491518, 26.548403975063422], [98.02088168084498, 26.54847110765553], [98.02292338920313, 26.551312068697086], [98.02397874722146, 26.554396962749706], [98.02804947000709, 26.554389276244137], [98.04259738995762, 26.553934653661372], [98.06038430729001, 26.54738157899675], [98.08378814640588, 26.544573117655318], [98.10344737039986, 26.553934653661372], [98.12872351617739, 26.573593877655355], [98.13769692817078, 26.581221277939676], [98.14948587467342, 26.572570257611346], [98.13902120506464, 26.55861542076508], [98.12217044061339, 26.54082850433207], [98.09876660239684, 26.518360818996655], [98.07536276418028, 26.497765441222214], [98.0673479746294, 26.488414853562688], [98.05757584594858, 26.4902762118777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
