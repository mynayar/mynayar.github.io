
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (4) Ward (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaketa</div><div class="name-mm">သာကေတ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (4) Ward (South)</div><div class="name-mm">အမှတ် (၄) ရပ်ကွက် (တောင်)</div></div>
        <span class="pcode-badge">MMR013013701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19552116427036, 16.777631505189845], [96.19580841042983, 16.778362273600123], [96.19656181297734, 16.779901504650752], [96.1967105869241, 16.780189514334666], [96.19718170217385, 16.781141281245198], [96.19744173664691, 16.781672795862903], [96.1977596281044, 16.782318751009598], [96.19845008890053, 16.78199577298659], [96.1996517180524, 16.781440734802118], [96.20294003065794, 16.78016808259099], [96.20285224873237, 16.77981376679196], [96.20265388526866, 16.7790851585533], [96.20243644718437, 16.77826881425443], [96.20201174414672, 16.776723861716903], [96.20191955644242, 16.776338577763227], [96.20170020999677, 16.775482450154982], [96.20148793402097, 16.774902231852593], [96.20111923176717, 16.77477645896647], [96.20082452573132, 16.77479532044771], [96.2005062106931, 16.774903705841382], [96.20011138942914, 16.77510261519359], [96.19925975843114, 16.775562286570334], [96.19880104033581, 16.77580197658], [96.1978931423547, 16.776300430320646], [96.19759178133569, 16.7764584672845], [96.19729995762702, 16.776632308933983], [96.19669914215177, 16.776952743674258], [96.19594001811743, 16.77736282373536], [96.19552116427036, 16.777631505189845]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
