
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zan Yu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tsawlaw</div><div class="name-mm">ဆော့လော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zan Yu</div><div class="name-mm">ဇန်ယူ</div></div>
        <span class="pcode-badge">MMR001006015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.30088040540642, 26.34952720441703], [98.29381326117311, 26.339809882220322], [98.284384430697, 26.323309428887057], [98.27908071400378, 26.31329129605649], [98.27141978879229, 26.30091595740555], [98.27120959384774, 26.294820305812493], [98.26758932708583, 26.295612239813067], [98.25580328899065, 26.29826409770999], [98.2381242318479, 26.300621306228322], [98.22457028938743, 26.296790842723283], [98.20423937434771, 26.294433636003532], [98.18096194933457, 26.28854061695597], [98.16411781288679, 26.28851890642244], [98.1634787951104, 26.288667261285127], [98.16467072327532, 26.290513196227096], [98.16615736826799, 26.29259699105836], [98.16693289143984, 26.293684023199148], [98.16625298059063, 26.29588245910827], [98.1682611667195, 26.299731484620395], [98.17043670319134, 26.30173967074927], [98.17311428799405, 26.30525400007207], [98.17646126607463, 26.311111211713126], [98.17796740567127, 26.314792888680927], [98.17930619762296, 26.319143960725285], [98.18081233811898, 26.320650101221247], [98.18100717624026, 26.320813406413606], [98.1848913958213, 26.324069000783823], [98.18664306562505, 26.33244339684535], [98.19690528075415, 26.333087842030352], [98.20072259796956, 26.333327560818304], [98.24462558919964, 26.338336627233616], [98.27615323998009, 26.34305104157238], [98.28457778133958, 26.34525746885714], [98.30088040540642, 26.34952720441703]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());

</body>
</html>
