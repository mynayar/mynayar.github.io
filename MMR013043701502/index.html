
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Wi Sa Ra Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon</div><div class="name-mm">ဒဂုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">U Wi Sa Ra Ward</div><div class="name-mm">ဦးဝိစာရရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013043701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14797231876753, 16.781563653240028], [96.14793332416366, 16.781866708581788], [96.14793968237052, 16.78237342799133], [96.14797019996479, 16.783170700367577], [96.14797019996479, 16.78345871005149], [96.14801216143218, 16.78425979555317], [96.14801979038106, 16.784650802792385], [96.14801216143218, 16.785043716594316], [96.14799118024882, 16.785398483852987], [96.14795112624353, 16.785842896432598], [96.14792278860585, 16.786211014127048], [96.14795875519246, 16.786556244075427], [96.14851188681416, 16.78687286389163], [96.149099350055, 16.787179947296806], [96.14996180259516, 16.787556606752048], [96.15012931841335, 16.787310599904288], [96.15044975315362, 16.786661148193502], [96.15072059657831, 16.786123276268256], [96.15098094941135, 16.785584450162276], [96.15116882318273, 16.785291672272933], [96.15130233743298, 16.785060882853486], [96.15163993843248, 16.78459358342718], [96.15245437616858, 16.783437728868137], [96.15342458097967, 16.782120386646568], [96.15342648844177, 16.781525930277496], [96.15326425793921, 16.781488524775625], [96.15293979603484, 16.78141371377194], [96.1520291434303, 16.781445715247628], [96.15157381667836, 16.781461715985472], [96.15032768457502, 16.78149613843607], [96.14797231876753, 16.781563653240028]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
