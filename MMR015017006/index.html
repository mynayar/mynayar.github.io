
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmit</div><div class="name-mm">မိုးမိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Gyi</div><div class="name-mm">လယ်ကြီး</div></div>
        <span class="pcode-badge">MMR015017006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75602322838932, 23.09653075708883], [96.75674131186213, 23.087195654855634], [96.75416995497949, 23.061910638165443], [96.75802699075308, 23.048625289025892], [96.76574106499822, 23.037054179007214], [96.76574106499822, 23.033686924811775], [96.76402682587735, 23.034911380555798], [96.75416995497949, 23.032768583003758], [96.74626954570306, 23.031252076022554], [96.7395989278483, 23.033625701664846], [96.73536520114317, 23.033625701664846], [96.72802781782957, 23.033625701664846], [96.71388535002893, 23.028911547230166], [96.70531415802202, 23.022054593444807], [96.69545728622484, 23.01991179409407], [96.68602897465752, 23.019054675432983], [96.68079218461168, 23.024636403147554], [96.67960058020265, 23.03191146434267], [96.6791720208721, 23.052482325698804], [96.67960058020265, 23.069196151281403], [96.67850285422338, 23.086889370048425], [96.6971171577307, 23.102290862633254], [96.71616330759065, 23.1068017936679], [96.73119974287391, 23.10529814968993], [96.73220217219256, 23.096777504078602], [96.7472386065765, 23.096777504078602], [96.75602322838932, 23.09653075708883]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
