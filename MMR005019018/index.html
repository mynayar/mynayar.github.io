
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Kan</div><div class="name-mm">အင်းကန်</div></div>
        <span class="pcode-badge">MMR005019018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.77350063994265, 21.92221925971114], [94.77150839969295, 21.91510367979106], [94.76484659969088, 21.913076249969038], [94.76281943966546, 21.907573200342995], [94.7618478004357, 21.90329793035528], [94.75731612024282, 21.904097579639654], [94.75210295988376, 21.903807960169274], [94.74515172027571, 21.898015380105733], [94.73906951984253, 21.897595890438026], [94.73906951984253, 21.900911670137532], [94.73820047976841, 21.906704340133217], [94.73356656014869, 21.910759199777317], [94.73095979965507, 21.91713110961308], [94.72922208013495, 21.921475589626823], [94.72682952016629, 21.924825209915582], [94.73211828023449, 21.927847500361906], [94.73646276024823, 21.92958521988203], [94.7428347600162, 21.929295600411706], [94.74775847987001, 21.929005980042007], [94.75355123979796, 21.929295600411706], [94.76166060025656, 21.930164549654307], [94.7674533601845, 21.930164549654307], [94.76871479964836, 21.928903110190447], [94.77121860035817, 21.926399310379907], [94.77353555971837, 21.922344449836544], [94.77350063994265, 21.92221925971114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
