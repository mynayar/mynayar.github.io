
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Pauk Khon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wuntho</div><div class="name-mm">ဝန်းသို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Pauk Khon</div><div class="name-mm">ကျောက်ပေါက်ခုံ</div></div>
        <span class="pcode-badge">MMR005025012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71262305640897, 23.825279718084573], [95.71201047330476, 23.822706869226693], [95.71239247293431, 23.818313883379062], [95.71239247293431, 23.812048371435253], [95.7114229776883, 23.81204337300329], [95.69722924403442, 23.807989306561296], [95.69248953266583, 23.813726851712886], [95.69227360364397, 23.813749064068077], [95.69031656825507, 23.812836866428313], [95.68942216190328, 23.812830659307508], [95.68933584767132, 23.812830060359033], [95.68787505009357, 23.81101779693381], [95.68640340039667, 23.810560200293082], [95.68100558943644, 23.810529689893315], [95.68050948022841, 23.811429959824864], [95.67887206389469, 23.811118807886714], [95.67874748440892, 23.811095153918245], [95.67852191465471, 23.812583902425217], [95.67489292806624, 23.811819904964693], [95.67352421926739, 23.810556481596393], [95.6715928397378, 23.81454034516088], [95.67985856801857, 23.81808279988138], [95.69095854929765, 23.82207879260227], [95.69924296818851, 23.824103873395075], [95.70672052163485, 23.824742788648848], [95.71262305640897, 23.825279718084573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
