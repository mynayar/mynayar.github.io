
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegu</div><div class="name-mm">ရွှေကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Hla</div><div class="name-mm">သပြေလှ</div></div>
        <span class="pcode-badge">MMR001011021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.62726876324291, 24.319486514690936], [96.62968621464717, 24.309816703677996], [96.63716594085554, 24.307515250428537], [96.64464566616465, 24.302336978368885], [96.65212539237302, 24.29600797968459], [96.64752248407547, 24.290829707624937], [96.63831666837962, 24.28852825437548], [96.62105576271335, 24.28450070983996], [96.60906424931574, 24.282988455752673], [96.60518725218998, 24.2806319693899], [96.60130728910019, 24.278562853293067], [96.59946765300981, 24.27747552527535], [96.59601233000507, 24.276947220338002], [96.59591798932382, 24.285180800553576], [96.59669909908422, 24.291040524001005], [96.59792395142927, 24.293302017674023], [96.60177705806484, 24.30041616497408], [96.60178089727066, 24.300457764014652], [96.6030792817835, 24.31452729140142], [96.60649837919692, 24.3147032590482], [96.60856095362516, 24.31456483090227], [96.61184699184525, 24.314379915900474], [96.62726876324291, 24.319486514690936]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
