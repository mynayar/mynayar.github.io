
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nant Chaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Homalin</div><div class="name-mm">ဟုမ္မလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nant Chaw</div><div class="name-mm">နန့်ချော</div></div>
        <span class="pcode-badge">MMR005034060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11895481721109, 24.721132007935864], [95.15730503439988, 24.732411484002853], [95.16740486074576, 24.73538202116339], [95.1988137461575, 24.73252666827119], [95.2311744155669, 24.7306230993766], [95.24545118182664, 24.734430237165782], [95.26639043876781, 24.717298118013787], [95.27305293034851, 24.707780272641514], [95.2711493605546, 24.68398566280814], [95.28923326460352, 24.658287484979496], [95.32064215001526, 24.61450540220261], [95.3320635633828, 24.599276851945206], [95.352051035427, 24.570723320325044], [95.31207609043929, 24.56406082874429], [95.28542612681434, 24.562157259849698], [95.23974047604219, 24.547880493589957], [95.2311744155669, 24.60022863594287], [95.20452445284127, 24.664949974761555], [95.1892959016846, 24.68779280059732], [95.15217631138773, 24.713490980224606], [95.11886385708141, 24.721105254903648], [95.11895481721109, 24.721132007935864]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
