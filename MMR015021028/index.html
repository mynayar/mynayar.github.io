
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Kan</div><div class="name-mm">ပန်ကမ်း</div></div>
        <span class="pcode-badge">MMR015021028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.61912585857158, 23.116746690207663], [98.62701514863028, 23.112325063650815], [98.64232876306204, 23.1131454360131], [98.65053248488636, 23.112325063650815], [98.65649893088101, 23.10717222441866], [98.65381397433549, 23.103300970363534], [98.64670408082873, 23.097011450118373], [98.6338515843832, 23.082518207149576], [98.62045217063121, 23.063923104167998], [98.61916913574709, 23.060054117303707], [98.61635030971905, 23.064196561022527], [98.60595892856179, 23.072126825992257], [98.58982494176769, 23.076502143759], [98.57314404036521, 23.080877463324327], [98.5578727498276, 23.079099133118575], [98.55787796859346, 23.079313391200117], [98.55793945614107, 23.081925803932734], [98.55711118503325, 23.090341614673832], [98.55653582396917, 23.092013615336157], [98.55638423334574, 23.092051152138993], [98.5558898049706, 23.093213874820492], [98.55783042593345, 23.095644163147654], [98.5709563810322, 23.109317032854847], [98.57533169969827, 23.110957776680095], [98.58435579388487, 23.11150469218785], [98.59638791976676, 23.11177814904238], [98.61197499105305, 23.113418893767005], [98.61912585857158, 23.116746690207663]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
