
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Gyi</div><div class="name-mm">ကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR005005055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.81292719973055, 22.791687029832588], [95.81488019986142, 22.780883789755137], [95.81549076039033, 22.770873990042674], [95.81610096029112, 22.76287839022558], [95.81829839975143, 22.75012206008506], [95.81927507968123, 22.740478559637893], [95.81988527958202, 22.731689430422932], [95.82171623991258, 22.72552487996927], [95.82171623991258, 22.714294409759248], [95.82592788016757, 22.710074760142106], [95.82594480001256, 22.70687292004925], [95.82600383960556, 22.706605080360248], [95.8267065617585, 22.703420550418116], [95.82418662811045, 22.70356050111627], [95.82465331779645, 22.69586015412284], [95.82508147692869, 22.694575677625494], [95.82171623991258, 22.6956787203967], [95.81207292022913, 22.69628910016189], [95.80310063958291, 22.703491169681797], [95.79687516006067, 22.708679220069996], [95.79388428023543, 22.716918990319186], [95.79187008034, 22.7376709202768], [95.79187008034, 22.751708939915716], [95.79809555986225, 22.756286609639346], [95.7958984801308, 22.761291510394926], [95.81292719973055, 22.791687029832588]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
