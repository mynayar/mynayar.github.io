
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyar Tu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyar Tu</div><div class="name-mm">ပျားတု</div></div>
        <span class="pcode-badge">MMR009004006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35344137471975, 20.0106805974317], [95.35518773942272, 20.0096695427153], [95.35625003301266, 20.008607249125305], [95.35879953906755, 20.006057743969734], [95.35713255482358, 19.99994546840867], [95.35746443793352, 19.99496721636399], [95.35807152707935, 19.991983883649368], [95.35397813688155, 19.995888347869027], [95.35230051815444, 19.996194554435192], [95.35133532706374, 19.997544360383984], [95.34798549723297, 19.99842565641893], [95.3460598158079, 20.00021891806864], [95.34266375992462, 20.004063366031573], [95.3386198908953, 20.0055532117114], [95.33839960375877, 20.00242741109622], [95.33505448008026, 20.002404831817557], [95.3331349293336, 20.00374742160625], [95.3326164809659, 20.009164014907412], [95.32926765387919, 20.0095920211549], [95.32593712170086, 20.00776435234303], [95.32379659763495, 20.01213210860999], [95.32351084974596, 20.01271517956195], [95.31861337390814, 20.014492293884302], [95.31597462003276, 20.014565591329017], [95.32469488096405, 20.014992089413454], [95.32629334316334, 20.014392666088725], [95.3312942967944, 20.014114834931718], [95.33573958811155, 20.012725681844813], [95.34407451023054, 20.013003512102443], [95.34990895643324, 20.012725681844813], [95.35344137471975, 20.0106805974317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
