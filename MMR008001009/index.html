
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Zin</div><div class="name-mm">ကုန်းဇင်း</div></div>
        <span class="pcode-badge">MMR008001009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3168734357605, 18.88156647920971], [95.31928060881313, 18.888973163380854], [95.3198361101484, 18.891935836869436], [95.32150261415438, 18.895454011693346], [95.32409495311964, 18.898416686081248], [95.32687245979622, 18.900453523711178], [95.33187197181411, 18.904527199870415], [95.33520497982602, 18.90767504107032], [95.33705665064394, 18.90915637736498], [95.3385379869386, 18.90841570921765], [95.34131549361518, 18.90489753439374], [95.34501883615042, 18.89934252104058], [95.34705989429875, 18.896621111375225], [95.34580146576508, 18.893931140209986], [95.34440454613298, 18.890299145389292], [95.34049316702607, 18.888343456285554], [95.33630240543175, 18.889181609143975], [95.3309941048941, 18.888343456285554], [95.32708272668657, 18.883314540933384], [95.32317134757966, 18.88135885182959], [95.31953935365829, 18.881638236115748], [95.3168734357605, 18.88156647920971]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
