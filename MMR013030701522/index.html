
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yar Za Thin Gyan Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dala</div><div class="name-mm">ဒလ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Yar Za Thin Gyan Ward</div><div class="name-mm">ရာဇသင်္ကြင်္န်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013030701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15752948429832, 16.753007888603236], [96.15780448978546, 16.752851486606858], [96.15805664080142, 16.752688217387345], [96.1567077638523, 16.75117683384383], [96.1531174975745, 16.74723784105356], [96.15199851971596, 16.7478427889136], [96.1491680150919, 16.74939346293803], [96.1484317779043, 16.749851226852684], [96.14812469359981, 16.750083160209726], [96.14858055095175, 16.7506206040577], [96.1494274137442, 16.751424790421765], [96.1497332264073, 16.75171915741322], [96.15013456325954, 16.75192069998036], [96.15057182443019, 16.752058664975436], [96.15096282987076, 16.752049446924502], [96.15146827673965, 16.751962661447692], [96.15175724060424, 16.751878739412348], [96.15202236164271, 16.751915931774874], [96.15232213355966, 16.751924514904488], [96.15270423930923, 16.752066421628115], [96.15296999616845, 16.75224876366957], [96.15327644375293, 16.752383804069325], [96.15356330859987, 16.752666091367075], [96.15371322558497, 16.75297737100891], [96.15389289843858, 16.753197479180358], [96.15425946120524, 16.754248545633914], [96.15511226671782, 16.753971100286094], [96.15632247989856, 16.753530502630667], [96.15722236671888, 16.75315208410143], [96.15752948429832, 16.753007888603236]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
