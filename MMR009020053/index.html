
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Thar Kya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Thar Kya</div><div class="name-mm">မင်းသားကျ</div></div>
        <span class="pcode-badge">MMR009020053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.81992984028994, 21.65729909737547], [94.81976823841353, 21.657137494599738], [94.80199202481214, 21.666510407029705], [94.80065176696553, 21.66726430240567], [94.79682076296791, 21.669419241704702], [94.79552794795649, 21.671358465121102], [94.79576256578986, 21.672000578364077], [94.79585115081, 21.671681668873987], [94.80102241265428, 21.67329768763824], [94.8065168791507, 21.67491370820113], [94.81039532598356, 21.6762065232125], [94.8162129953335, 21.678145745729637], [94.82041464591924, 21.68331700757392], [94.82493950025781, 21.683640212226067], [94.82138425717778, 21.691073901239577], [94.81944503376138, 21.69786118184811], [94.81775875276429, 21.700952697608955], [94.8191218300085, 21.70367885209737], [94.82035732942728, 21.70707647280102], [94.82041464591924, 21.70691089142457], [94.85591063436834, 21.709219573424605], [94.85596707132333, 21.70820370643594], [94.85435105165976, 21.704002055850253], [94.85629027507622, 21.694629144319606], [94.8575830909869, 21.687841861912432], [94.85402784790693, 21.68073137665175], [94.85172646480459, 21.678539584034638], [94.8472405672984, 21.6742672997961], [94.83269639302415, 21.66683361078259], [94.82429309185278, 21.661662348938307], [94.81992984028994, 21.65729909737547]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
