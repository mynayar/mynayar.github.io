
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Pying</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Pying</div><div class="name-mm">မန်ပြိန်း</div></div>
        <span class="pcode-badge">MMR015011049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.13873619102247, 23.514289756866845], [98.1385126186625, 23.51465091201004], [98.14096789015605, 23.516436563596585], [98.14811049920024, 23.517999009746575], [98.14817056042307, 23.51847949593207], [98.15624395699308, 23.51905616640903], [98.16852137656036, 23.519348487442812], [98.18138343459788, 23.51905616640903], [98.18571749776436, 23.51971284327317], [98.18532398771191, 23.512629653335864], [98.18691123356666, 23.50707429104574], [98.19643471229222, 23.504296609900678], [98.22698920578728, 23.505487044291726], [98.26099638817283, 23.50837444632367], [98.26529392537441, 23.50192814007164], [98.26395468556035, 23.489651781704424], [98.26378601141533, 23.487838523629023], [98.25125184259849, 23.48307554140314], [98.23200977093427, 23.474234587856017], [98.23102997755149, 23.473254795372554], [98.22199185933692, 23.47514335728016], [98.20859946659215, 23.476036184422412], [98.19676952179606, 23.47871466135257], [98.18739484759419, 23.483178791667967], [98.16641343403279, 23.493223085776833], [98.14498560779964, 23.502374553642767], [98.14141430372717, 23.509963575358768], [98.13873619102247, 23.514289756866845]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
