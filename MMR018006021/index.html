
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mei Za Li Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mei Za Li Kone</div><div class="name-mm">မယ်ဇလီကုန်း</div></div>
        <span class="pcode-badge">MMR018006021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17492797994237, 19.70524272317317], [96.1749928012768, 19.70552052914917], [96.17512152483857, 19.706072202969835], [96.17509654976601, 19.70694632871016], [96.1789291500603, 19.707090652811416], [96.18377279697705, 19.70725092009394], [96.1881520456804, 19.707446277124063], [96.18901218696294, 19.705525933175352], [96.19033510767912, 19.704643986031158], [96.19047164275219, 19.704552962049604], [96.18740553193982, 19.70126759202583], [96.18564258733562, 19.699415609143102], [96.18453852023657, 19.700466252915305], [96.18437825295405, 19.700608712721987], [96.18412150190585, 19.70085097659137], [96.18371937454958, 19.701107323843985], [96.18309611109669, 19.701374436880826], [96.18252627007138, 19.70157031911498], [96.18209888975201, 19.701801817200135], [96.18158247115417, 19.70222919841882], [96.18026960216048, 19.703363039372846], [96.1791784556213, 19.704366100914854], [96.17880449683014, 19.704722251330907], [96.17850176974093, 19.705024979319376], [96.17816342590146, 19.705114016698587], [96.17681005414073, 19.705167440025377], [96.17492797994237, 19.70524272317317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
