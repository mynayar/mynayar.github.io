
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR009004007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37037081366219, 20.01722353493824], [95.36657879887252, 20.014948326604042], [95.35574340083735, 20.01189218927317], [95.35344137471975, 20.0106805974317], [95.34990895643324, 20.012725681844813], [95.34407451023054, 20.013003512102443], [95.33573958811155, 20.012725681844813], [95.3312942967944, 20.014114834931718], [95.32629334316334, 20.014392666088725], [95.32469488096405, 20.014992089413454], [95.31597462003276, 20.014565591329017], [95.31903904371694, 20.017046316334472], [95.32129762808313, 20.018040093275715], [95.32435992487069, 20.019387504329927], [95.3263140482548, 20.021314006836008], [95.32821202336623, 20.023133561065038], [95.32866768376664, 20.024456289326338], [95.32867994962004, 20.024492019391232], [95.33010303322845, 20.02585721723682], [95.34716324169034, 20.02338923832275], [95.35255736722877, 20.02645478256221], [95.35604654071534, 20.031870425279976], [95.35881998065764, 20.024465833831243], [95.35991086189682, 20.021338434221434], [95.36185567729774, 20.01911578766351], [95.37037081366219, 20.01722353493824]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
