
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Saung Du Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Demoso</div><div class="name-mm">ဒီးမော့ဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Saung Du Lar</div><div class="name-mm">ဆောင်ဒူလာ</div></div>
        <span class="pcode-badge">MMR002002017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.13513636784916, 19.548063354640135], [97.13629844122016, 19.5422529868859], [97.13804155127661, 19.536442620030925], [97.14662570970881, 19.534947318164257], [97.14780235299628, 19.534742354576053], [97.1492404939537, 19.532514571989964], [97.14973161192444, 19.530729402440045], [97.14456923987859, 19.528282357045214], [97.14163964165618, 19.520957621796867], [97.13841705060645, 19.514511845245522], [97.13431555481907, 19.507187089312765], [97.1287491560488, 19.501327242658192], [97.11996003222976, 19.495760326777713], [97.11380757855699, 19.49517424219755], [97.10501838369152, 19.49312317279623], [97.09593620319328, 19.49165807286181], [97.08919786009324, 19.4881421049742], [97.0836315080877, 19.479938361566155], [97.07777212908053, 19.47437149784639], [97.07610869895734, 19.473373354696605], [97.06871660538707, 19.48652793161881], [97.05400911243066, 19.504176922626925], [97.0419162850086, 19.518884415583386], [97.03341862337084, 19.52803574405442], [97.04449463501948, 19.533537435704147], [97.05379122288667, 19.536442620030925], [97.06076366401197, 19.5422529868859], [97.06134470069742, 19.547482317954632], [97.06889817940754, 19.5422529868859], [97.08574824418616, 19.53760469340193], [97.09620690632374, 19.53934780435776], [97.11073282436041, 19.543415061156225], [97.12293459565512, 19.545158171212677], [97.13513636784916, 19.548063354640135]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
