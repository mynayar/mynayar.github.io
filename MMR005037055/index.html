
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pun Shein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pun Shein</div><div class="name-mm">ပွန်ရှိန်</div></div>
        <span class="pcode-badge">MMR005037055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63287355966713, 26.614074690394716], [95.63287355966713, 26.610473609769315], [95.63287355966713, 26.600280750356376], [95.63287355966713, 26.590698269809366], [95.62486336475251, 26.590253244791484], [95.6218870800248, 26.590087890044117], [95.61390582709231, 26.58787619992671], [95.60668931985629, 26.58587642965358], [95.59832759973898, 26.57952882039882], [95.57550036005364, 26.58728024978376], [95.55310044043301, 26.588073690148747], [95.52662568003115, 26.59366016988099], [95.5321045199077, 26.60168456958729], [95.53387464020255, 26.616088890290087], [95.5524902396329, 26.616088890290087], [95.57489016015285, 26.616088890290087], [95.59448244041238, 26.616088890290087], [95.60247804022941, 26.615478509625575], [95.62048343975897, 26.614074690394716], [95.63287355966713, 26.614074690394716]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
