
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Shin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Shin</div><div class="name-mm">ရေရှင်</div></div>
        <span class="pcode-badge">MMR009024057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13332751884997, 21.84993782766867], [94.13285628488967, 21.850030979446217], [94.12848313898576, 21.85367526709996], [94.12769230305742, 21.854602452840993], [94.12848313898576, 21.85489002995098], [94.13455695324086, 21.860720892355346], [94.14257438769789, 21.870196042413454], [94.15642268365997, 21.877484618620315], [94.17200526732927, 21.88281550293317], [94.17294345897352, 21.876998714019464], [94.17537298467556, 21.87359737821646], [94.17828841587777, 21.872625568115552], [94.17828841587777, 21.869224232312547], [94.1765877484259, 21.864365180009088], [94.1765877484259, 21.861449748806933], [94.17828841587777, 21.8476014528448], [94.17917715739998, 21.84751257914229], [94.17804546312766, 21.843228306940887], [94.17749344306799, 21.84334540226854], [94.17002802777131, 21.84492897529202], [94.15375020610719, 21.845900785392985], [94.13332751884997, 21.84993782766867]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
