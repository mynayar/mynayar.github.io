
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gway Pin Yoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyawbwe</div><div class="name-mm">ပျော်ဘွယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gway Pin Yoe</div><div class="name-mm">ဂွေးပင်ရိုး</div></div>
        <span class="pcode-badge">MMR010024014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14592362897235, 20.642013547387364], [96.14439596769984, 20.642013547387364], [96.13963057798884, 20.647212154017723], [96.13659805775421, 20.65154432590998], [96.13833092723058, 20.65804258509729], [96.13876414415, 20.66540727902276], [96.13844894616199, 20.666457938083454], [96.14136344656589, 20.668439799257385], [96.14526240333731, 20.672338755129488], [96.15089422688715, 20.673205188968325], [96.15695926915498, 20.67407162370654], [96.1647571791006, 20.672338755129488], [96.16865613497271, 20.665840495942177], [96.17354530107485, 20.657733143669702], [96.17038900444908, 20.654576847043927], [96.16778970023455, 20.648945022594773], [96.16389074526177, 20.646345719279566], [96.15739248607446, 20.644179632883777], [96.15046100996767, 20.642013547387364], [96.14592362897235, 20.642013547387364]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
