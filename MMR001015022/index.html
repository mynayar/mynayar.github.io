
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sumprabum</div><div class="name-mm">ဆွမ်ပရာဘွမ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Htu</div><div class="name-mm">ဆန်ထူ</div></div>
        <span class="pcode-badge">MMR001015022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.8711519867748, 26.517112961094313], [97.86364415855115, 26.522934409395532], [97.8614134135982, 26.526652317350624], [97.85962881781575, 26.530667658085974], [97.85591090986065, 26.534236849650938], [97.85219300190556, 26.538847055047597], [97.85174685273512, 26.54256496300269], [97.84639306628702, 26.54256496300269], [97.84222900916149, 26.54583672178734], [97.83984954781846, 26.547323884789478], [97.83895725037684, 26.55089307635444], [97.83732137098457, 26.553272537697524], [97.83583420798237, 26.555800714531415], [97.83404961219992, 26.55803145948431], [97.83167015085684, 26.560410920827394], [97.82899325763282, 26.563087814051414], [97.82688654178054, 26.566187218665277], [97.85221539232657, 26.582228822602133], [97.86221211859447, 26.59008339523257], [97.87338712041935, 26.58273775704191], [97.87216567380688, 26.574798357658153], [97.87949434898508, 26.556476670162226], [97.8786422494403, 26.554452932057245], [97.87460856613251, 26.544872933639], [97.87155495139996, 26.52960485997636], [97.8711519867748, 26.517112961094313]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
