
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Hpyin Gar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Hpyin Gar</div><div class="name-mm">အင်ဖျင်ဂါး</div></div>
        <span class="pcode-badge">MMR001003012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.72898595174036, 25.882712561235735], [97.75332594373737, 25.88364871501625], [97.781410549957, 25.886457174558984], [97.79919746818865, 25.892074097241846], [97.80481438907287, 25.88364871501625], [97.8094951570759, 25.86960641190643], [97.81698438462172, 25.858372569238725], [97.82447361306686, 25.848074880351476], [97.84226053129856, 25.847138726571018], [97.85723898728946, 25.85275564835456], [97.85688459774605, 25.84708541386084], [97.85630283440832, 25.837777190564964], [97.862855909073, 25.820926427013035], [97.86660052329557, 25.80782027768373], [97.86762939538033, 25.804476445431646], [97.85536667972855, 25.80594797102208], [97.81698438462172, 25.80782027768373], [97.78421901129838, 25.81530950612887], [97.77223571770429, 25.818447988084245], [97.76537959489247, 25.820243639232615], [97.75784515033348, 25.82482284859566], [97.75291942679019, 25.82814622756638], [97.74508574720954, 25.832300453303333], [97.73743010461567, 25.83467429478293], [97.73262307359602, 25.836335984717948], [97.73119876780896, 25.837107484322985], [97.72907333886354, 25.83810163628152], [97.7284170621977, 25.842695571143736], [97.72824258472758, 25.84391691343484], [97.72804979795984, 25.845266419010102], [97.72898595174036, 25.866797950565], [97.72898595174036, 25.882712561235735]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
