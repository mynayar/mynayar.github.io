
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Si Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Si Gyi</div><div class="name-mm">ရုံးစည်ကြီး</div></div>
        <span class="pcode-badge">MMR010018020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.57968494420487, 21.187351791751837], [95.57321315566264, 21.188822652743283], [95.56321130235978, 21.18823430816684], [95.55673951381755, 21.184998414345387], [95.55388746413524, 21.185656579587544], [95.5529152754197, 21.18588093076039], [95.54085421564957, 21.194117752132627], [95.538795010981, 21.199118678784032], [95.538795010981, 21.207355500156268], [95.53908918281957, 21.212944772283493], [95.54438428220891, 21.220299077240668], [95.54673765961536, 21.228241725875023], [95.54608132719153, 21.231898436763515], [95.55749507563729, 21.22878492088745], [95.56521164640043, 21.224657452679367], [95.57059530023298, 21.21442851066729], [95.57956805572127, 21.202763928712386], [95.59095327497374, 21.191062453869222], [95.58457357521041, 21.184614159216153], [95.57968494420487, 21.187351791751837]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
