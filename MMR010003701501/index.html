
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Har Nwe Sin Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mahaaungmyay</div><div class="name-mm">မဟာအောင်မြေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ma Har Nwe Sin Ward</div><div class="name-mm">မဟာနွယ်စဉ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010003701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10139672593704, 21.962350762239225], [96.10125075641508, 21.958912596435823], [96.0963689972894, 21.9590503582358], [96.09636263019769, 21.95898576452305], [96.09440430061477, 21.95901696365911], [96.09481003683038, 21.964864581646452], [96.09486457369451, 21.965650586776576], [96.0950307267513, 21.968570209356187], [96.09722863890403, 21.96841048388262], [96.0999680590744, 21.96820130873823], [96.10135985140607, 21.968095035021804], [96.10126351731958, 21.967413651250183], [96.10125162001458, 21.96702104018425], [96.10140628497987, 21.966521353373025], [96.10155466379257, 21.96623223932403], [96.10151352744617, 21.963785742071252], [96.10139672593704, 21.962350762239225]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
