
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpa Yar Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpa Yar Kone</div><div class="name-mm">ဘုရားကုန်း</div></div>
        <span class="pcode-badge">MMR017006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07403439956795, 17.31169620001964], [95.07597012012502, 17.313344009818252], [95.07844799967552, 17.31719879998468], [95.08257432034867, 17.323083899602352], [95.0840279997924, 17.32328540979387], [95.08940027989905, 17.32302954008128], [95.09185944006117, 17.323193519765198], [95.09500331974749, 17.31520260002003], [95.09807263394498, 17.30190256944809], [95.09913360013559, 17.29730502021056], [95.10230015982455, 17.29482695989634], [95.10013152025351, 17.29345023004413], [95.09971860013337, 17.290283760287366], [95.09971860013337, 17.28739259998855], [95.09806655992384, 17.28656657988381], [95.0946245999454, 17.284776750047], [95.08815395983743, 17.280646559591105], [95.07741552041, 17.275690349929732], [95.07235747871471, 17.273217503884723], [95.07122027969223, 17.272661579868043], [95.07066948001255, 17.27548388986969], [95.06860451968288, 17.277273629774243], [95.06874204041287, 17.279200980341045], [95.07300983973238, 17.28801207010099], [95.07479976040071, 17.29503341995644], [95.07461478874154, 17.29789938394947], [95.07452436011118, 17.29930131010741], [95.07479976040071, 17.307699389815014], [95.07403439956795, 17.31169620001964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
