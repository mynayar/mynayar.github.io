
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Len</div><div class="name-mm">ပန်လင်</div></div>
        <span class="pcode-badge">MMR015012033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.88345746359113, 22.65116301656002], [96.88036667358318, 22.64076672330566], [96.8738806298872, 22.632479000305693], [96.87027727307776, 22.626353293369846], [96.85370182797703, 22.616263891965104], [96.84914463131975, 22.614393858789583], [96.84072974058512, 22.60869684068672], [96.83388336192769, 22.6094175124083], [96.82516143455263, 22.61290628299861], [96.82235261707967, 22.622029263939453], [96.82127568972135, 22.655772986334284], [96.82811798995334, 22.658423175089524], [96.84145041230676, 22.670674589860482], [96.85117947785068, 22.685808692417254], [96.85058132976462, 22.686646099737743], [96.85119505680649, 22.68645563232161], [96.8623968233548, 22.68517543030191], [96.87135823569406, 22.68517543030191], [96.87839934455417, 22.686775683051394], [96.88122558729106, 22.686775683051394], [96.88000633772236, 22.685808692417254], [96.88433036715276, 22.668512575594946], [96.88433036715276, 22.654099145659075], [96.88345746359113, 22.65116301656002]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
