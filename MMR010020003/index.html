
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Thar Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Thar Taung</div><div class="name-mm">မြင်သာတောင်</div></div>
        <span class="pcode-badge">MMR010020003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.35974649190712, 21.0519661530156], [95.3593383570796, 21.047476660919244], [95.3574565400873, 21.041622120264662], [95.35557472309506, 21.03534939755673], [95.35222927116399, 21.03242212677975], [95.35013836359468, 21.029494856902147], [95.34983474797531, 21.02835629810471], [95.34608560296829, 21.027820705960835], [95.33921143795754, 21.02438362300586], [95.3334091757929, 21.021482492822827], [95.32821277430014, 21.01888429117713], [95.32625060288308, 21.017995760995632], [95.32443198304964, 21.019915416063668], [95.31858894202611, 21.023696207314174], [95.31549556826593, 21.027133289369885], [95.30827769495971, 21.034351162676046], [95.304153196313, 21.03881936961824], [95.30140352994903, 21.043287576560488], [95.30312207142651, 21.051536574753186], [95.30312207142651, 21.059098157254198], [95.30037240506249, 21.065284905673934], [95.30086871481939, 21.06576855027845], [95.3052473663729, 21.06114662131955], [95.32253272370627, 21.06554172686924], [95.33073596888994, 21.066420833954396], [95.34128309463915, 21.062905188923366], [95.34802166436839, 21.05440870809548], [95.35974649190712, 21.0519661530156]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
