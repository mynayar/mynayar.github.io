
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gangaw</div><div class="name-mm">ဂန့်ဂေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pyar</div><div class="name-mm">ပျား</div></div>
        <span class="pcode-badge">MMR009023012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.16430754275893, 22.12587445484229], [94.17840092376366, 22.117715128950067], [94.19694484632765, 22.102385486800813], [94.2023576795633, 22.099470883874233], [94.20642285083397, 22.080847064640352], [94.20123055294772, 22.078869047168837], [94.1836756400188, 22.068731702905836], [94.17576356563609, 22.061808638158197], [94.15024268824953, 22.06217584483943], [94.14139549790394, 22.062303142975736], [94.12309882774878, 22.063539405019583], [94.12235707142179, 22.072440487238737], [94.11939004341582, 22.092467923356025], [94.12186256570493, 22.10755031309651], [94.11790652986252, 22.12065468356684], [94.11221972715873, 22.132028289873745], [94.11263181360738, 22.146890899695336], [94.11708235516664, 22.14961067529248], [94.12647794220334, 22.14886891806617], [94.13231309707186, 22.15178649595009], [94.13809880001969, 22.141698601809082], [94.15145042379805, 22.133539275916917], [94.16430754275893, 22.12587445484229]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
