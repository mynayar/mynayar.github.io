
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Zay Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaw</div><div class="name-mm">ကျောက်တော်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aung Zay Ya</div><div class="name-mm">အောင်ဇေယျ</div></div>
        <span class="pcode-badge">MMR012004060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.98612515195424, 20.652084367899306], [92.98944707132534, 20.634887686417642], [92.98783893242086, 20.634219368728907], [92.98601150642594, 20.63344842400562], [92.98515489857976, 20.632477603158918], [92.98452672123125, 20.63153533668651], [92.98453484840456, 20.630868914768655], [92.98455527470622, 20.629193947242925], [92.98455527470622, 20.627623503422], [92.98440233599905, 20.627374977573197], [92.98409841820751, 20.626881111274315], [92.9827278487113, 20.62631004087575], [92.98140465909779, 20.62624778440778], [92.97346668783746, 20.62978136102106], [92.96789093701722, 20.634000848760195], [92.96367144927802, 20.640782168662213], [92.96141100871114, 20.646659311977714], [92.97105555237192, 20.64831696755408], [92.97859035216305, 20.64982392823174], [92.98612515195424, 20.652084367899306]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
