
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Ku</div><div class="name-mm">ကျွဲကူး</div></div>
        <span class="pcode-badge">MMR005028010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.33642140032742, 23.303298059757708], [94.3364869204351, 23.30352783024523], [94.34252916039247, 23.305297859708503], [94.34790036041335, 23.30847171020133], [94.35369887959968, 23.3104858201645], [94.3574828400611, 23.311523430062323], [94.36230468021688, 23.311523430062323], [94.3659057599429, 23.310913050297074], [94.36712652037266, 23.310119609932087], [94.36853015973912, 23.309082000034323], [94.36853015973912, 23.303100600112657], [94.36871340020332, 23.297729490023983], [94.36511231957792, 23.292297360035207], [94.36047371988633, 23.284728990350686], [94.3574828400611, 23.278320270364247], [94.35449231996466, 23.272521930143], [94.35131819967523, 23.26672358992181], [94.348510920043, 23.26171877999775], [94.34747304034858, 23.26171877999775], [94.34271239995735, 23.26110840023256], [94.33947743963222, 23.262084990230164], [94.33227528018011, 23.26232906983074], [94.32788076008904, 23.263488810360343], [94.3256836803576, 23.264709479958583], [94.32727056018825, 23.272277849643103], [94.32928476008368, 23.280883830124708], [94.33227528018011, 23.288085899644614], [94.33447271964036, 23.29589843976123], [94.33551023960592, 23.300109900151824], [94.3364869204351, 23.303283659813076], [94.33642140032742, 23.303298059757708]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
