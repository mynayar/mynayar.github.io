
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Lel Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Lel Gyi</div><div class="name-mm">အင်းလယ်ကြီး</div></div>
        <span class="pcode-badge">MMR005007028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55528491976332, 23.106335850419214], [95.56023672004864, 23.11565705992541], [95.56052696544714, 23.116203458323014], [95.56241040031978, 23.119749090348307], [95.57212355955471, 23.12807453990814], [95.58322415956735, 23.14056266973148], [95.59478736004871, 23.145187949564274], [95.60773800040846, 23.14750059037999], [95.61051323989415, 23.13871254035149], [95.61190067977259, 23.12992458025525], [95.61513851972694, 23.12159912979604], [95.6160633600361, 23.11234866006265], [95.61710699988822, 23.103999089786214], [95.61534839990878, 23.104309409851453], [95.61049199970608, 23.09841225032517], [95.6014729201392, 23.098065389905855], [95.59795212019424, 23.095299239868098], [95.59386216001076, 23.09616026968075], [95.57906148020322, 23.101248060049954], [95.56981091963831, 23.10217308022351], [95.56009776040338, 23.106335850419214], [95.55528491976332, 23.106335850419214]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
