
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Yet Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thaton</div><div class="name-mm">သထုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Yet Taw</div><div class="name-mm">သရက်တော</div></div>
        <span class="pcode-badge">MMR011007033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.31394898305916, 16.852554006861965], [97.32644783100267, 16.855396753957052], [97.342714960627, 16.858733601174777], [97.35731366709211, 16.859984918769044], [97.36899263190452, 16.85956781320408], [97.38231399979134, 16.861171000441345], [97.38400100024603, 16.85954700019397], [97.38553599998647, 16.857380000087005], [97.38522299994156, 16.856471000436386], [97.38643600012136, 16.853569999755734], [97.38669999970529, 16.85182500022364], [97.38752299988658, 16.849598000047706], [97.38748199979449, 16.846767999943268], [97.38806699979227, 16.84575700008554], [97.38705900007284, 16.844435000275098], [97.38357799962506, 16.842549999682774], [97.37763699994764, 16.843460000278867], [97.37193499960063, 16.84315399965743], [97.36500500018064, 16.842390000398268], [97.35666799972847, 16.841154000057088], [97.3493379998489, 16.841240000425728], [97.34100100029599, 16.840004000084605], [97.33640899987552, 16.838907999904336], [97.33235099979885, 16.837858000046708], [97.32970800022412, 16.83710400034937], [97.32670900042007, 16.836320000167916], [97.3245820003591, 16.83596299989256], [97.31963391966974, 16.834837036100396], [97.3188699752692, 16.839543011201044], [97.31716397483763, 16.84522901081027], [97.31704397469974, 16.847692011077527], [97.31568696787934, 16.849874017272157], [97.31384798289815, 16.850955005968785], [97.31394898305916, 16.852554006861965]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
