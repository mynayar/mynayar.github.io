
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Soe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myo Soe</div><div class="name-mm">မြို့ဆိုး</div></div>
        <span class="pcode-badge">MMR007014025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.47972115720569, 18.70494201166457], [96.483351433422, 18.705305040095595], [96.48979261173969, 18.709169747086207], [96.49362611585263, 18.708570761731323], [96.4920470241509, 18.707720482414402], [96.49430143656213, 18.703855775423733], [96.49526761420907, 18.69838077295435], [96.4935981397424, 18.694833140836806], [96.49269114198268, 18.69290576958565], [96.48657202168152, 18.689363122410214], [96.47819848896916, 18.68517635560437], [96.47079113390379, 18.680989588798525], [96.46628230818203, 18.67615870506023], [96.46496319519537, 18.673188345066137], [96.46143283185978, 18.67801172486128], [96.45635544035133, 18.67681704477087], [96.4484319805515, 18.67323262408638], [96.44381129805305, 18.671142314566225], [96.43709122378101, 18.67666771234508], [96.43709122378101, 18.68383579198826], [96.4408543640377, 18.68634455155984], [96.44784334369541, 18.691003871631438], [96.44903802378582, 18.697375498180747], [96.44226817023991, 18.70255244823693], [96.44599267562154, 18.70435465634239], [96.45082347932015, 18.705305040095595], [96.46370583685496, 18.704660922263827], [96.47368966414672, 18.704338863347914], [96.47972115720569, 18.70494201166457]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
