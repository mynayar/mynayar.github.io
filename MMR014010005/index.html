
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Hee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pekon</div><div class="name-mm">ဖယ်ခုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Hee</div><div class="name-mm">နားဟီး</div></div>
        <span class="pcode-badge">MMR014010005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.0834966772299, 19.986774935714777], [97.0840433652092, 19.986711437283077], [97.08785745205984, 19.987000678138827], [97.08979987076748, 19.986684570936234], [97.09093253360959, 19.986219577371628], [97.09205023443081, 19.983614145176716], [97.09203136035904, 19.98086287981812], [97.09234458433514, 19.979330214717663], [97.094285635174, 19.978403279887516], [97.09894730967068, 19.977794572861285], [97.10036216538168, 19.977609826032676], [97.11690662613995, 19.978143748135494], [97.1331275063294, 19.978986136800813], [97.13912786216116, 19.978956345858705], [97.14252585608347, 19.97756390664904], [97.1465698564138, 19.976167904325393], [97.1473809010078, 19.976087677604312], [97.14974655865683, 19.972539191130807], [97.15458087061074, 19.966665145080412], [97.15705455392458, 19.955791699427436], [97.15492305455541, 19.948483704159685], [97.14548355991843, 19.938130708765243], [97.14574240998428, 19.929847548925295], [97.12721402500733, 19.93949775022105], [97.1048234673292, 19.956962384706344], [97.0864632097094, 19.980248564619615], [97.0834966772299, 19.986774935714777]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
