
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thu Htay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thu Htay</div><div class="name-mm">သူဌေး</div></div>
        <span class="pcode-badge">MMR008001023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33678461921488, 18.859570077297292], [95.33509169042924, 18.86343745797234], [95.33418520618238, 18.86716411633097], [95.33478952901362, 18.869279247139616], [95.33569601326047, 18.870991495161434], [95.33781114406912, 18.87270374318325], [95.34274644809017, 18.87562463776686], [95.34647310644874, 18.877538326732463], [95.35130768999795, 18.880257781271666], [95.35573939165965, 18.883178674955957], [95.35883937273894, 18.884839379233995], [95.36396143806996, 18.878844394153532], [95.3660994530274, 18.875250760814026], [95.3660994530274, 18.87245112991576], [95.36454410162906, 18.869651499017493], [95.36112233143052, 18.86700740316917], [95.35754502528277, 18.864052236321697], [95.3549009294344, 18.860630465223835], [95.3516520529999, 18.856506891979507], [95.3476297883841, 18.85658846408637], [95.342187032006, 18.85892107434813], [95.33881770667188, 18.860216967738893], [95.33678461921488, 18.859570077297292]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
