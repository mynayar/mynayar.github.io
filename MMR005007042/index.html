
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywet Kyan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywet Kyan</div><div class="name-mm">ရွက်ကြမ်း</div></div>
        <span class="pcode-badge">MMR005007042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45975939338138, 23.018622768825765], [95.45978339988403, 23.018624640314954], [95.46544764039635, 23.019654509747852], [95.47169184020635, 23.02347042042362], [95.47967016044959, 23.026245569977107], [95.48480664011441, 23.028360479552532], [95.48933148006381, 23.023081350324105], [95.49210672044887, 23.013830879691398], [95.49129347971041, 23.009492700327883], [95.49122039990158, 23.009102640074843], [95.49105371955358, 23.008213349966184], [95.49071927967105, 23.00643045030506], [95.48794404018537, 23.00134274986806], [95.48239356031462, 22.99532985029242], [95.47499339982562, 22.99209219020247], [95.46713028003848, 22.990704660391827], [95.46033096020568, 22.990279680363017], [95.45379026470903, 22.99047860500366], [95.45409331825209, 23.000782427267268], [95.45651774839541, 23.005025179568406], [95.45864896178023, 23.006750447974866], [95.45859282340012, 23.01416990072039], [95.45975939338138, 23.018622768825765]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
