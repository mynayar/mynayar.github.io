
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Paw Ba Lon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Paw Ba Lon</div><div class="name-mm">တောင်ပေါ်ဗလုံ</div></div>
        <span class="pcode-badge">MMR010020104</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4003961073945, 20.788859005039114], [95.40228190298751, 20.789459030909597], [95.40571898504317, 20.79186498897809], [95.40846865140719, 20.793583529556315], [95.41259315005391, 20.79392723785179], [95.41534281641788, 20.79598948762481], [95.41981102425945, 20.796676904215815], [95.42462293859779, 20.796676904215815], [95.43012227132584, 20.796333195920283], [95.43562160315452, 20.796676904215815], [95.44266762321229, 20.796161341772574], [95.43923054025731, 20.791005718239376], [95.43648087389329, 20.78378784493316], [95.43510604071128, 20.777601095614102], [95.43606800773244, 20.775292375842525], [95.43093939443759, 20.773666229812704], [95.41939954665179, 20.77095097240948], [95.41175758364562, 20.77038322320726], [95.41156202516737, 20.772273617933195], [95.40846865140719, 20.77708553407018], [95.40631318510549, 20.780070025111627], [95.40400044356568, 20.783272281590598], [95.4003961073945, 20.788859005039114]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
