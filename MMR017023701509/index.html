
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward (Kwet Thit (North) Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyapon</div><div class="name-mm">ဖျာပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward (Kwet Thit (North) Ward)</div><div class="name-mm">ရပ်ကွက် (၉)ကွက်သစ်မြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017023701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6797081618023, 16.28701017697813], [95.67996057631962, 16.28615606115335], [95.67925517598565, 16.28596761631252], [95.67776108910306, 16.285534438963225], [95.67704973975373, 16.285341099112486], [95.67637748573242, 16.285162035099916], [95.6744682322232, 16.284636264452104], [95.67411642283469, 16.284608317120217], [95.67409768456054, 16.284883445814444], [95.67403224359322, 16.285565438594176], [95.67401014725056, 16.28570167329366], [95.67395749374339, 16.28586624113416], [95.67394725586121, 16.285969247682658], [95.67396935310325, 16.285983931813064], [95.67396255422858, 16.286052457455014], [95.67393514828854, 16.286073815454245], [95.67392005946323, 16.286213981090384], [95.67387076672259, 16.28650439736009], [95.67941374085154, 16.288016771057187], [95.67964866985028, 16.28722554032646], [95.6797081618023, 16.28701017697813]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
