
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nat Lar Poet Myauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kani</div><div class="name-mm">ကနီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nat Lar Poet Myauk</div><div class="name-mm">နတ်လာပို့မြောက်</div></div>
        <span class="pcode-badge">MMR005017032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02231021944112, 22.316549233960018], [95.02611296943803, 22.312442264898664], [95.03031925333096, 22.30350390937798], [95.03171413330068, 22.293391024875973], [95.03213425339317, 22.290345155104887], [95.03156160018779, 22.290219449667916], [95.00937120012082, 22.288832550281995], [94.99141188005427, 22.28958090043824], [94.99141188005427, 22.29314031007732], [94.9894113597465, 22.305143969718472], [94.98413494377269, 22.314048052075975], [94.98300948000355, 22.315947299728123], [94.98180887967612, 22.323549599934154], [94.98581028002047, 22.329951569609307], [94.98841164008519, 22.335479189612954], [94.99196051956238, 22.335512129980884], [94.9933988017134, 22.336877790977326], [94.99461635875804, 22.33688872133746], [94.99679742336247, 22.336908298679077], [94.99875356482522, 22.335573015882005], [94.99925329830114, 22.33422283131864], [94.99977218194073, 22.33106785939424], [95.00123304966559, 22.330629417413718], [95.00416306966997, 22.32885139567543], [95.00928782757126, 22.32479822495816], [95.0195406483823, 22.319540369192737], [95.02231021944112, 22.316549233960018]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
