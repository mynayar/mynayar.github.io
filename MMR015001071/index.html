
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Hpeint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Hpeint</div><div class="name-mm">ဖာဖိန့်</div></div>
        <span class="pcode-badge">MMR015001071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.38979802635788, 23.035739661556192], [98.39544222817636, 23.034103782163868], [98.41732009134921, 23.036759731076756], [98.42664633526022, 23.00925210739888], [98.42379098236802, 22.999020425152537], [98.41831822190846, 22.993785610917257], [98.41141778500281, 22.987599012684313], [98.38454686604507, 22.980631138316426], [98.38431721157013, 22.983004230660754], [98.38133033822459, 22.993084931124713], [98.37722338625031, 23.00204555385926], [98.37186478663068, 23.011004691813127], [98.35464747290263, 23.01905596865805], [98.34592278281025, 23.02619435178798], [98.339180976421, 23.031349850315394], [98.32557936179819, 23.038943907335522], [98.3596959179323, 23.040446503603334], [98.37572994867827, 23.03863476538214], [98.38543729019887, 23.037141326910785], [98.38979802635788, 23.035739661556192]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
