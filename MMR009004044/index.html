
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyar Ga Moe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyar Ga Moe</div><div class="name-mm">ညာဂမိုး</div></div>
        <span class="pcode-badge">MMR009004044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.53093216818507, 19.916102131807975], [95.5368117846362, 19.909904697643753], [95.55174919107236, 19.90799779496234], [95.56303169875395, 19.908792337896102], [95.57484740908075, 19.911370311091048], [95.57510875026867, 19.91006360605064], [95.5757443847956, 19.905931983873984], [95.5766978361363, 19.896715287280756], [95.57851393427069, 19.88945089474305], [95.5765389268301, 19.889246584062676], [95.56907022541066, 19.890041126996437], [95.56280760029057, 19.89039561456599], [95.56064806995255, 19.890517852217158], [95.55047792201856, 19.891471303557864], [95.54816354910855, 19.89152775220407], [95.5439626710405, 19.891630211964753], [95.54030777408457, 19.89306039032482], [95.53665287622931, 19.895444018226897], [95.53671386555249, 19.8955659968733], [95.53760632757002, 19.89735092090831], [95.53967213865832, 19.89925782358972], [95.53840087140316, 19.90211817761184], [95.53665287622931, 19.903707264378795], [95.52934308231744, 19.90481962412639], [95.5256881853615, 19.905137440940223], [95.52950199072433, 19.913559594599633], [95.53093216818507, 19.916102131807975]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
