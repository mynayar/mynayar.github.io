
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Htoke Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Htoke Taw</div><div class="name-mm">လက်ထုတ္တော</div></div>
        <span class="pcode-badge">MMR005002013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41448009677913, 21.920846169415256], [95.41752191960097, 21.91759280986031], [95.42139660007308, 21.91581711017153], [95.43085524037713, 21.909140369732313], [95.43134087967792, 21.904771230308086], [95.43141180021445, 21.90413277011129], [95.42890800040396, 21.899403359577434], [95.42473487991083, 21.898290599631537], [95.41833624042522, 21.897177749753382], [95.41193760004029, 21.896343179793973], [95.4047044796281, 21.896343179793973], [95.39941895981718, 21.895786799820996], [95.39886239997986, 21.890222820226995], [95.39580240006075, 21.88549340969314], [95.39560620036593, 21.884807250354356], [95.3921023202659, 21.88513566028257], [95.38660836008779, 21.88605132031222], [95.37084478605811, 21.888178021798296], [95.36804465873405, 21.90521212743778], [95.36711128475804, 21.910812382085794], [95.36898181166134, 21.914383387583314], [95.36967806768871, 21.915712603553857], [95.37177816273208, 21.918512731777184], [95.37989802007763, 21.919054056199798], [95.38011343738526, 21.920099215906134], [95.40499266108247, 21.920639962963946], [95.40585662268506, 21.920460043696096], [95.41448009677913, 21.920846169415256]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
