
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Su Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ah Lel Su Ward</div><div class="name-mm">အလယ်စုရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012002701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.01025912635765, 20.333383711189356], [93.00999902533482, 20.333334719721563], [93.00984707678123, 20.333202715433004], [93.00980459460641, 20.33310334394423], [93.00959345627302, 20.33303090085542], [93.00941469263404, 20.332882134103272], [93.00932712834435, 20.33272220676446], [93.00915939668886, 20.33301937604341], [93.0089560527797, 20.332918802161032], [93.00848669660382, 20.334627316197725], [93.00787609020944, 20.334578166449262], [93.00775706403732, 20.335136531226], [93.00721813810662, 20.335229906934728], [93.00708406627672, 20.336063823986365], [93.00775219420848, 20.336269159893845], [93.00743296815699, 20.337188396527324], [93.00792519139452, 20.33773693621066], [93.0086046444888, 20.338158618425553], [93.00983335222747, 20.33862295278709], [93.00998830181874, 20.336999225933596], [93.01014985693041, 20.33706116673949], [93.01031297866109, 20.335885726744948], [93.01029957156805, 20.335692962460314], [93.01019454784017, 20.33515657261779], [93.01010516602065, 20.334471416023064], [93.01008505538107, 20.333979022813708], [93.01011969097101, 20.333613394442636], [93.01025912635765, 20.333383711189356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
