
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Hmone Kone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Hmone Kone Gyi</div><div class="name-mm">သမှုန်းကုန်းကြီး</div></div>
        <span class="pcode-badge">MMR009006070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51615547419584, 20.441847237959735], [95.54262136998028, 20.450575351771136], [95.55152155737403, 20.45403653655694], [95.55053264756367, 20.44464189380841], [95.54657700922166, 20.434258341249517], [95.54608255386682, 20.422391424424745], [95.55597165107088, 20.41596351110718], [95.57723321064424, 20.414974601296876], [95.57929685256778, 20.415135403676004], [95.58069439543004, 20.413491236131676], [95.60349917274868, 20.392111758351007], [95.60286269375837, 20.391189960448344], [95.59948368092716, 20.386296217696326], [95.59256131225482, 20.383823943620143], [95.58217775969592, 20.38036275883428], [95.58190648459663, 20.379630315886402], [95.5818071445841, 20.37936209758277], [95.57673875618872, 20.378879394568457], [95.56926872467199, 20.376432314999363], [95.54806037258817, 20.36948475181987], [95.5469456835965, 20.36931754806642], [95.54498818056015, 20.369023923015675], [95.53817127628344, 20.368001386654726], [95.52503705821374, 20.374794948128397], [95.52383208358384, 20.375418210681914], [95.5203708996973, 20.39717422471074], [95.51641526135529, 20.412007871865853], [95.5203708996973, 20.422391424424745], [95.51615547419584, 20.441847237959735]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
