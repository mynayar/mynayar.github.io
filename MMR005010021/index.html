
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Te Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Te Kone</div><div class="name-mm">မင်းတဲကုန်း</div></div>
        <span class="pcode-badge">MMR005010021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23132307979637, 22.600280789826627], [95.22888191956497, 22.592712420142107], [95.2271118001695, 22.587707520285903], [95.22772200007029, 22.57971191956949], [95.21588124002727, 22.57971191956949], [95.20812971981076, 22.57348635011499], [95.19933492037035, 22.571280900393276], [95.1912283136358, 22.56950442458958], [95.18998381020475, 22.57448242932071], [95.18282793166378, 22.580082683968726], [95.18303454191062, 22.5891735339315], [95.18123441123913, 22.591794762718166], [95.17879642561462, 22.592676297972844], [95.17803763882603, 22.59336829301236], [95.17193855002415, 22.595016693665514], [95.16414051057615, 22.599779120110327], [95.16377463579084, 22.6010897318057], [95.16363732010632, 22.601583449716486], [95.16501791974127, 22.609720260181916], [95.1637735143363, 22.61420384373247], [95.1660766798949, 22.614318810364864], [95.16967775962098, 22.614318810364864], [95.1765137996722, 22.6132812903993], [95.18450940038855, 22.612487760102113], [95.19689952029671, 22.60888668037603], [95.20947252004083, 22.60449216028502], [95.22027576011828, 22.603515660219614], [95.23132307979637, 22.600280789826627]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
