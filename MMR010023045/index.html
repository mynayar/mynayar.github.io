
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae U</div><div class="name-mm">ရေဦး</div></div>
        <span class="pcode-badge">MMR010023045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21957471590048, 20.394783947221413], [96.23332240290665, 20.395188291406555], [96.2410049343303, 20.395592634692377], [96.25111352726753, 20.39033616568156], [96.26000908944798, 20.388314448353185], [96.2624351509615, 20.392762228993718], [96.26251257899241, 20.392848259039965], [96.26445687008857, 20.389931823295058], [96.26850030744328, 20.379418886172687], [96.27173505732708, 20.36122341762666], [96.2701176823852, 20.349093105562417], [96.27082683918735, 20.346876991679892], [96.26647858831626, 20.348688763175915], [96.25717868285, 20.351519168874574], [96.2494961523256, 20.351519168874574], [96.2410049343303, 20.351519168874574], [96.22887462226606, 20.351114824689432], [96.21917037261466, 20.351923512160397], [96.21868651397148, 20.35218743530197], [96.21027481133353, 20.35677563698613], [96.20259227990982, 20.366075543351712], [96.19854884255511, 20.375375447918657], [96.19450540520035, 20.38265363605649], [96.19528735942419, 20.38271378631225], [96.19976187421116, 20.38305797934231], [96.20663571726459, 20.38548404175515], [96.21148784209032, 20.38588838504097], [96.21553127944503, 20.390740509866703], [96.21957471590048, 20.394783947221413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
