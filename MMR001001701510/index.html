
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pin Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myitkyina</div><div class="name-mm">မြစ်ကြီးနား</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyun Pin Thar Ward</div><div class="name-mm">ကျွန်းပင်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR001001701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.40497190432995, 25.36991633187324], [97.40698646935016, 25.36875489432299], [97.40974007744268, 25.36727468847613], [97.41041891899795, 25.366950715802943], [97.41154175494808, 25.366821194542524], [97.41158478031343, 25.36643890533128], [97.41205805663407, 25.365473457933774], [97.41229469524404, 25.365026368971826], [97.41255814893947, 25.364437491996682], [97.4097696579434, 25.364139475556385], [97.40824764351402, 25.363716679980826], [97.40807733620017, 25.364000163376886], [97.40754669212618, 25.363906209404092], [97.40665033514489, 25.363928887608154], [97.40599420237061, 25.36381549389], [97.40516406606883, 25.3636978841501], [97.4047742603239, 25.365447539472427], [97.40522423161303, 25.36546940828663], [97.40507543608254, 25.36763274455558], [97.40502528179138, 25.36873545817491], [97.40497190432995, 25.36991633187324]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
