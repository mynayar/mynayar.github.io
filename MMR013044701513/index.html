
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Gon Taing (East) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bahan</div><div class="name-mm">ဗဟန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Shwe Gon Taing (East) Ward</div><div class="name-mm">အရှေ့ရွှေဂုံတိုင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013044701513</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17101732838705, 16.81154855122469], [96.17116889922539, 16.811275100665398], [96.17117404964273, 16.81096649201004], [96.17114067040569, 16.810550689562717], [96.17111969012166, 16.810219765130114], [96.17102084473623, 16.809686661410353], [96.17052173628917, 16.80961036742457], [96.17014217382234, 16.80956077610898], [96.16966247544292, 16.80947971301839], [96.16926193269211, 16.809379578005178], [96.16896947226337, 16.80926895240026], [96.16873931866468, 16.808973312868147], [96.16853141789068, 16.80866050707681], [96.16824619610514, 16.808276102660045], [96.16687202482416, 16.809873581001], [96.16581535379561, 16.811246871845697], [96.16631126425352, 16.81141853443785], [96.16664886525297, 16.811531066605482], [96.16711235065452, 16.811660766830983], [96.16734120473285, 16.811713113669327], [96.16744740657259, 16.811737069809965], [96.16777324713769, 16.811738968278803], [96.16851997401767, 16.811689376963216], [96.16917800975739, 16.811647414596564], [96.16999244659422, 16.811601639104424], [96.17034721385289, 16.811586380307233], [96.17101732838705, 16.81154855122469]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
