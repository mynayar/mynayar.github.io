
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tu Chaung Kyaung Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tu Chaung Kyaung Su</div><div class="name-mm">တူးချောင်းကျောင်းစု</div></div>
        <span class="pcode-badge">MMR017014088</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92836436032701, 16.485947460307102], [94.92918911958225, 16.489741319606253], [94.93215840038994, 16.491720689658166], [94.93529219957543, 16.492875299555465], [94.9374367202285, 16.495679429761935], [94.93925112044292, 16.499308230190707], [94.94090063985271, 16.503266970294476], [94.94436419974807, 16.505411310183888], [94.94865288042615, 16.506235980406245], [94.95277668029962, 16.506400950243687], [94.95383255992476, 16.50368546980866], [94.95261180039432, 16.503761789874773], [94.9511271599905, 16.500462840088062], [94.95145691980105, 16.496339130146794], [94.95475596041928, 16.493700059710022], [94.95459107961472, 16.488091800196457], [94.95360143955486, 16.481493899723716], [94.95327167974426, 16.474071329927995], [94.95178704023976, 16.46862804025193], [94.9479933599057, 16.466978609875014], [94.94304479987767, 16.465988879882957], [94.93793135994434, 16.466978609875014], [94.93925112044292, 16.469452800406486], [94.9387561200989, 16.474071329927995], [94.93694171988454, 16.47901971009162], [94.93347780026033, 16.481164049980976], [94.93100351979666, 16.48314342003283], [94.92836436032701, 16.485947460307102]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
