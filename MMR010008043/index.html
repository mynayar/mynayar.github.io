
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pay Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinoolwin</div><div class="name-mm">ပြင်ဦးလွင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pay Pin</div><div class="name-mm">ပေပင်</div></div>
        <span class="pcode-badge">MMR010008043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32518272160536, 21.842355498707377], [96.32702308614654, 21.841435316886418], [96.33919457097272, 21.83004466842675], [96.3382294689149, 21.82779276332542], [96.33238265973205, 21.827305528627278], [96.32507414915273, 21.826818294828513], [96.31435500018318, 21.82584382723087], [96.30119968042095, 21.82827999712424], [96.29145499904905, 21.82779276332542], [96.27878691308564, 21.82974169941997], [96.27065883233928, 21.83188066765871], [96.26952946641183, 21.832177870212604], [96.27976138068323, 21.837050209999234], [96.28901882825636, 21.842897019182146], [96.29291670134472, 21.845820422874283], [96.29925074432646, 21.851179998258374], [96.30091959376432, 21.854378626872176], [96.30461031881123, 21.851179998258374], [96.31289329788746, 21.846307657572368], [96.31922734086913, 21.843871486779733], [96.32215074456127, 21.843871486779733], [96.32518272160536, 21.842355498707377]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
