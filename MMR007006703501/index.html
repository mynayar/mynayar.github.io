
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boe Paik San (1) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Boe Paik San (1) Ward</div><div class="name-mm">ဘိုးပိုက်ဆံ (၁) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007006703501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.55424479065614, 18.040050413039356], [96.55464490274022, 18.041647112213674], [96.55515716745394, 18.041592352012685], [96.55528485571159, 18.042281527170815], [96.55743500342271, 18.0421863609119], [96.5575212421117, 18.04144487707947], [96.56099426377432, 18.041061738908184], [96.56092716265852, 18.040234854554967], [96.56078970667966, 18.038780855851883], [96.5609014438466, 18.037719870775447], [96.56072740254763, 18.037491249621496], [96.56058985933458, 18.036217025395445], [96.56049852688557, 18.035370915335534], [96.55682327467446, 18.035746384987704], [96.55646586739566, 18.03464271184413], [96.55532766976255, 18.034864643424697], [96.55414627821123, 18.035111073618026], [96.55469679352228, 18.037318925128318], [96.55434178752503, 18.037395940642945], [96.55442362863315, 18.038557457379824], [96.55456306163214, 18.039413458602937], [96.55380830474625, 18.039615209126467], [96.55382042935484, 18.03991783447794], [96.55424479065614, 18.040050413039356]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
