
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Nan Thu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Nan Thu</div><div class="name-mm">မင်းနန်သူ</div></div>
        <span class="pcode-badge">MMR010022052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.92078082537483, 21.17254585810491], [94.91993056224572, 21.167274227423718], [94.91960734860032, 21.162749239086168], [94.91935325504875, 21.159191931162752], [94.9184872951526, 21.149377715109495], [94.91819864155411, 21.139563499056294], [94.90838442640023, 21.146779835421114], [94.90686759836103, 21.149661808245924], [94.90549789221399, 21.15226424929574], [94.90203405083082, 21.154284822686463], [94.89424040906766, 21.15255290289423], [94.8861581128067, 21.15197559569725], [94.8841375403153, 21.151344167299555], [94.88106019067533, 21.155804375671437], [94.87678748015816, 21.158390491328134], [94.8803813760997, 21.163497607228862], [94.88445426265417, 21.170285752085817], [94.88904464699294, 21.174755335890097], [94.88904464699294, 21.177665748875256], [94.88904464699294, 21.181995550154568], [94.89308579467377, 21.184593430742268], [94.89885886304614, 21.190077846415534], [94.90347731792394, 21.19369228916787], [94.90347731792394, 21.184882085240076], [94.90492058501707, 21.179686323165356], [94.90492058501707, 21.17420190839141], [94.90636385211013, 21.170160760710587], [94.91242557408106, 21.171026720606733], [94.92078082537483, 21.17254585810491]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
