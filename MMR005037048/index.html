
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ke San Sar Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ke San Sar Lin</div><div class="name-mm">ကဲဆန်ဆာလင်</div></div>
        <span class="pcode-badge">MMR005037048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60008036042035, 26.63940953582147], [95.59967039996906, 26.643493619834715], [95.5980835201384, 26.664123509992066], [95.59667952014382, 26.6760863997676], [95.6090538740371, 26.67889554099645], [95.61791987999851, 26.680908239923383], [95.64587388037535, 26.689514129573467], [95.65199533981314, 26.69004115927214], [95.66430659996968, 26.69110110023564], [95.67587124026556, 26.690681699600816], [95.67608651997699, 26.69067387010307], [95.67468251998235, 26.690124510238036], [95.68609631968945, 26.677124009665363], [95.69788164012567, 26.664309540153226], [95.68754494494334, 26.65718632319033], [95.68045379240863, 26.653049816795658], [95.67395356820265, 26.64802691700868], [95.67040799193535, 26.64477680490569], [95.66839786327085, 26.642766677140514], [95.6600667272977, 26.647140522716995], [95.64588442132901, 26.650390634819985], [95.63524769072842, 26.65245888756766], [95.62904293158607, 26.650390634819985], [95.61574701990912, 26.65068609988367], [95.60540575527142, 26.644481340741322], [95.60008036042035, 26.63940953582147]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
