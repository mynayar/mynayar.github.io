
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogaung</div><div class="name-mm">မိုးကောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kone</div><div class="name-mm">ညောင်ကုန်း</div></div>
        <span class="pcode-badge">MMR001008009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.89813883214146, 25.44977421670677], [96.89563996511237, 25.433281696293307], [96.89135936933945, 25.420439907176046], [96.8920728006193, 25.409738417294193], [96.89135936933945, 25.396896628176876], [96.89849369562762, 25.386195137395703], [96.89992056088522, 25.37406678135693], [96.90705488807271, 25.359798126982014], [96.89862144072697, 25.35282041043365], [96.87281011829236, 25.344816040427986], [96.85925489609662, 25.364078722754925], [96.84498624172176, 25.3940428967623], [96.83071758824616, 25.410451848573985], [96.83687342426919, 25.428919356643064], [96.84304237420628, 25.4289035798364], [96.84453391960477, 25.429803847969254], [96.84801673938108, 25.430246353086773], [96.85199928274079, 25.432043076227046], [96.8544864648785, 25.433393478426353], [96.85623169014042, 25.434289933433718], [96.85797309867962, 25.43519020066725], [96.86146354740487, 25.43834114093096], [96.86296272265162, 25.44104576115302], [96.86470413209008, 25.441942215261065], [96.86669921869407, 25.443292618359692], [96.87391090376525, 25.44417762769541], [96.87639808680234, 25.445074080904135], [96.8838558200901, 25.445505142148647], [96.88783836434908, 25.44639778133262], [96.88932990974757, 25.447298050364793], [96.89380836536384, 25.44818687462464], [96.8967952728836, 25.449083327833364], [96.89813883214146, 25.44977421670677]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
