
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kwayt Tet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kwayt Tet</div><div class="name-mm">ကွေ့တက်</div></div>
        <span class="pcode-badge">MMR008005042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42085357413322, 18.73866048379432], [95.42546754319261, 18.72943254837344], [95.4323884954328, 18.72337671426402], [95.43763074436345, 18.724516333362146], [95.43763074436345, 18.714308862663927], [95.43686101912078, 18.710588522042713], [95.43429526591387, 18.709818795900787], [95.42351910622182, 18.71161482296577], [95.41389753394412, 18.712512835598943], [95.40876603022815, 18.709049069758805], [95.40324966164263, 18.704559002995666], [95.39952932102142, 18.702634689439435], [95.39734843088542, 18.7096905076109], [95.39542411732918, 18.715335163586985], [95.38977946225242, 18.716361463610724], [95.38278833501369, 18.714725523064487], [95.38105809695367, 18.723953460284008], [95.37846273896429, 18.729144175363444], [95.38048135003436, 18.73318139660421], [95.38105809695367, 18.7369302457343], [95.40182095457345, 18.74269770683378], [95.40268607360349, 18.743562825863762], [95.40585817671354, 18.74154421479375], [95.41047214487367, 18.740102349743722], [95.41393262189303, 18.737218618744294], [95.42085357413322, 18.73866048379432]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
