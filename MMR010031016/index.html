
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byin Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byin Gyi</div><div class="name-mm">ဗြင်ကြီး</div></div>
        <span class="pcode-badge">MMR010031016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.045542848124, 21.371633811151526], [96.04595330320245, 21.37192295128324], [96.05011427565336, 21.371168578367246], [96.05277674285247, 21.37587909684288], [96.05400668805828, 21.3865186036507], [96.05803002736394, 21.389776733209715], [96.05933050729715, 21.390829869902632], [96.06404102487346, 21.3906250645951], [96.07182361756594, 21.389396235447975], [96.07639731498415, 21.390920801254026], [96.07341494814142, 21.383464883697457], [96.07341494814142, 21.375383344665693], [96.07583940976099, 21.372554805959567], [96.07705164102049, 21.366897727648052], [96.07583940976099, 21.363261034768982], [96.07139456270897, 21.358412112429107], [96.0649293320231, 21.353967265377037], [96.06694971655622, 21.351138725771648], [96.06014735161904, 21.350088349997407], [96.05590758776503, 21.351299711612455], [96.0528791846267, 21.353722433943233], [96.0501536218922, 21.35402527434701], [96.04651953794638, 21.35190539241995], [96.04470249642316, 21.34948267008923], [96.03834284974278, 21.350694030804902], [96.0345701415988, 21.350954218162713], [96.03743432943082, 21.35735651788906], [96.0440968156156, 21.36613888690016], [96.045542848124, 21.371633811151526]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
