
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Kei Pyin (Than Ba Yar Taing)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ingapu</div><div class="name-mm">အင်္ဂပူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Kei Pyin (Than Ba Yar Taing)</div><div class="name-mm">သက္ကယ်ပြင် (သမ္ဘရာတိုင်း)</div></div>
        <span class="pcode-badge">MMR017013013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.32156608021052, 17.80553438970037], [95.32203213767309, 17.80575593408912], [95.32384164017964, 17.806616099653354], [95.32727748027156, 17.808906689991773], [95.32880424042344, 17.806997879848325], [95.33367180031337, 17.802416700070694], [95.33663063999211, 17.795163239691817], [95.33803347266667, 17.790924331992358], [95.33806938079732, 17.79082762699346], [95.32539760761358, 17.78933948732754], [95.32154443442818, 17.783559263948916], [95.32054475973291, 17.785329389639685], [95.32059011973831, 17.789529239782667], [95.32059660025294, 17.790104969568745], [95.32071187805082, 17.79362074590074], [95.32074059969898, 17.794496699962792], [95.32074567457329, 17.79465177455978], [95.32078740041823, 17.795926800081816], [95.32136015974362, 17.79797871034924], [95.32193256023953, 17.800030709649604], [95.32198044014524, 17.80146234041473], [95.32202796032215, 17.802893970280536], [95.32179102043932, 17.80424848238158], [95.32156608021052, 17.80553438970037]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
