
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Keng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kunhing</div><div class="name-mm">ကွန်ဟိန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Keng</div><div class="name-mm">လွိုင်ကျိုင်း</div></div>
        <span class="pcode-badge">MMR014014011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.45126806327056, 21.094733980388924], [98.45131051666709, 21.094446236904332], [98.44978217460772, 21.081200609020925], [98.44417825612169, 21.060822720592114], [98.44324105103374, 21.04817045730084], [98.44297576901658, 21.048642068976335], [98.4292970204412, 21.038003042406558], [98.41409840861473, 21.01748491819444], [98.3835949039817, 20.97210165456778], [98.37610188309549, 20.987087697239474], [98.37078236891125, 20.995446933429264], [98.37458202164305, 21.015965056742004], [98.39054056329644, 21.056241375339255], [98.38897987172373, 21.05601016233919], [98.391195744588, 21.05725659031941], [98.41310197597545, 21.061841614698835], [98.42278147268689, 21.07152111230954], [98.43093262823828, 21.0827289510803], [98.44927272755439, 21.09495568395772], [98.45126806327056, 21.094733980388924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
