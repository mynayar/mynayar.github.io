
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Naung Ka Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Naung Ka Lu</div><div class="name-mm">နောင်ကလူး</div></div>
        <span class="pcode-badge">MMR005037062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2710974002249, 27.034129439921742], [96.26568587999941, 27.036926280223724], [96.2489012400003, 27.06011964020928], [96.23889144028777, 27.071716319752397], [96.23370347983177, 27.087707520285903], [96.23327652039518, 27.091491659712403], [96.2316892799364, 27.10211184008938], [96.23449692019676, 27.118713420388076], [96.23669435965701, 27.13171383012923], [96.23309327993098, 27.141906780373688], [96.23030256041488, 27.14368482009843], [96.25268556019051, 27.154296900281793], [96.28088364016793, 27.1665038696579], [96.29748540033103, 27.1716919200461], [96.31848131995702, 27.17230220987915], [96.32788091976869, 27.1716919200461], [96.33807360021655, 27.16229250009883], [96.35247792002008, 27.148498560060546], [96.36187751983175, 27.1427002198393], [96.36987311964879, 27.137878379683514], [96.36492923969274, 27.128906279801015], [96.3560789997461, 27.11151126003665], [96.35028084028863, 27.097717319998367], [96.35028084028863, 27.092102040376915], [96.33947760021113, 27.08612063955593], [96.32647691977411, 27.073913580247563], [96.31416127092598, 27.066110527079218], [96.30249012032283, 27.0587158200791], [96.29325393542086, 27.053009053325184], [96.2778931200715, 27.043518059910582], [96.2710974002249, 27.034129439921742]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
