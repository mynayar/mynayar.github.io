
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Toke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Toke</div><div class="name-mm">ကန်တုတ်</div></div>
        <span class="pcode-badge">MMR009013041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.63590334256526, 19.828590840994593], [94.63688467468802, 19.830389950036192], [94.63384089044479, 19.839521306363224], [94.63202808292976, 19.844959725311128], [94.63177000268354, 19.845155865650725], [94.64066202423311, 19.84657858863102], [94.65415255639545, 19.846038966625088], [94.66278649679947, 19.84657858863102], [94.6714204372035, 19.859529499686687], [94.67843551428763, 19.8665445758715], [94.68275248403995, 19.8665445758715], [94.68221286293334, 19.852514422602553], [94.68599021157905, 19.841182375766095], [94.71480629037808, 19.854369394831735], [94.71595850717944, 19.849299640366155], [94.70381765236283, 19.842594988567896], [94.69461439343956, 19.836639938782184], [94.68876686839633, 19.827741531146785], [94.68838865940916, 19.82716599561428], [94.68172289609481, 19.79976230388729], [94.67681665006842, 19.800171158172475], [94.66691445783601, 19.800490582974078], [94.65954876926037, 19.80826547657051], [94.63688467468802, 19.82877108581698], [94.63590334256526, 19.828590840994593]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
