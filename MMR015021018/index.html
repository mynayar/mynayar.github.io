
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Hkun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Hkun</div><div class="name-mm">ပန်ခွန်</div></div>
        <span class="pcode-badge">MMR015021018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.81303249175613, 23.300913846396952], [98.81802807283736, 23.30050702098231], [98.81952915914343, 23.299369927180464], [98.82472485017178, 23.293080406035983], [98.82472485017178, 23.291062733858155], [98.82472485017178, 23.284876684211667], [98.82827979557618, 23.27421184619982], [98.82999984341808, 23.272491798357862], [98.8289006560405, 23.267181353836463], [98.82745942411321, 23.26272663492631], [98.83043220957887, 23.25191650064602], [98.82855325333003, 23.25206179601514], [98.82332896296134, 23.24990002096922], [98.8229406626815, 23.249739345394516], [98.82199027623034, 23.25342908298586], [98.81788841531818, 23.270930356750625], [98.81406001126055, 23.277493333850316], [98.80796595686348, 23.28035854870808], [98.81023160720298, 23.2859705143278], [98.81050506495683, 23.291713119065264], [98.8115988941737, 23.298002640209745], [98.81303249175613, 23.300913846396952]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
