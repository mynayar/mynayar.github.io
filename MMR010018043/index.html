
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Dat Sar Kone (Sa Lin Ga Thu)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Dat Sar Kone (Sa Lin Ga Thu)</div><div class="name-mm">ပဒပ်စာကုန်း (စလင်္ဂသူ)</div></div>
        <span class="pcode-badge">MMR010018043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37433827629047, 21.23502795337737], [95.38079866142914, 21.234130677288988], [95.38707958955149, 21.2301826651979], [95.39120705775957, 21.22731138261429], [95.39263736831992, 21.223837770996397], [95.39156596819493, 21.223004460087793], [95.3881563208576, 21.216185165413094], [95.38456721830255, 21.2082891403316], [95.38413462281466, 21.205801716276255], [95.37543211180258, 21.20616432112655], [95.36499029486629, 21.205004119244734], [95.35841581723622, 21.202683714581838], [95.34913420218174, 21.19804290705457], [95.35298311707726, 21.203982216905843], [95.35513657879017, 21.207571318561577], [95.3572900396037, 21.214031703700243], [95.35926404609893, 21.21977426796815], [95.36069968694108, 21.22444010092994], [95.36536551990287, 21.2301826651979], [95.37003135376403, 21.233412857317546], [95.37433827629047, 21.23502795337737]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
