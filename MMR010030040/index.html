
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Thar</div><div class="name-mm">ဝမ်းသာ</div></div>
        <span class="pcode-badge">MMR010030040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04658054795397, 21.009257742051204], [96.04609062877955, 21.008487869319765], [96.0350773601321, 21.00345323158143], [96.0218614377552, 21.001879908131286], [96.0196587840257, 21.00125057785192], [96.01950333800869, 20.998141660209512], [96.01399481690731, 21.002823902201385], [96.0124214925579, 21.010375858359225], [96.0124214925579, 21.018871807687844], [96.01336548842659, 21.02579443356632], [96.01588280594677, 21.032087730964065], [96.01745613029624, 21.04310099871219], [96.01830033559207, 21.046598418981887], [96.01840311910871, 21.04649874172361], [96.019259453561, 21.04589217778181], [96.02071952808382, 21.04485893229395], [96.0237865454128, 21.043703078634223], [96.02667045627658, 21.04331397975642], [96.02909776784776, 21.04402511506703], [96.03005693887667, 21.044306125327466], [96.03040197457153, 21.044407210924078], [96.0311756127644, 21.04463386526072], [96.0320433461236, 21.044703033018607], [96.03433428719768, 21.044884955076668], [96.03748517799863, 21.044767219431662], [96.0401735591625, 21.0439301502563], [96.04079184037118, 21.043737606305513], [96.04173431098974, 21.042505375023097], [96.04997647433487, 21.041792644315137], [96.04414954376648, 21.01466941336281], [96.0434227098902, 21.009023828387], [96.04658054795397, 21.009257742051204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
