
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Boe Min Gyi Kin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Boe Min Gyi Kin</div><div class="name-mm">ဘိုးမင်းကြီးကင်း</div></div>
        <span class="pcode-badge">MMR005002007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.466697199816, 21.950830169876497], [95.4701571597252, 21.949792200249874], [95.47460856013697, 21.94478459972953], [95.47544304016424, 21.936995010311534], [95.47683408002882, 21.92920550992642], [95.48045063978526, 21.921694109595535], [95.48045063978526, 21.91446090015046], [95.47882380037817, 21.914280179586683], [95.47544304016424, 21.91390452017754], [95.46793163983335, 21.91362633019105], [95.45875091971925, 21.913069950218073], [95.45429987993555, 21.912235290326464], [95.45185007991734, 21.912060329920337], [95.45318711998965, 21.919190309784994], [95.45596919971888, 21.92976188989934], [95.45596919971888, 21.933656639642265], [95.45520924021434, 21.935682629649705], [95.45579064022593, 21.935794409984112], [95.45624711990871, 21.935882250365637], [95.46431508007691, 21.945619169688996], [95.466697199816, 21.950830169876497]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
