
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min</div><div class="name-mm">မင်း</div></div>
        <span class="pcode-badge">MMR005001032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.70637907963089, 22.180442759825553], [95.70155616028865, 22.18080005957512], [95.69607372042594, 22.182718860287196], [95.69489898460051, 22.187418110257624], [95.69470320039244, 22.188201300149956], [95.69342807774365, 22.188626349426556], [95.68976904030905, 22.18984604955557], [95.68428660044628, 22.189023630336294], [95.68377150205322, 22.188933490388308], [95.67332171982156, 22.187104829624218], [95.67053578559808, 22.18699338383766], [95.66646875992541, 22.18683069018425], [95.66290511987546, 22.192861409826264], [95.66482391968822, 22.19642495994401], [95.66642988043469, 22.198994459726578], [95.672225160263, 22.19944032021465], [95.69388096013824, 22.199166179875363], [95.70237839964346, 22.199988510061758], [95.70813515970991, 22.19779556990966], [95.715262080081, 22.192861409826264], [95.72184108040159, 22.18874957992921], [95.72696892027949, 22.18758417007342], [95.72637239996635, 22.185623880038065], [95.72565491993868, 22.183267140066505], [95.72211539970601, 22.183267140066505], [95.71553640028469, 22.182718860287196], [95.70594203969341, 22.181622389761515], [95.70637907963089, 22.180442759825553]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
