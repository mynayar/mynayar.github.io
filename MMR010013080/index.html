
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Tha Yauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Tha Yauk</div><div class="name-mm">ရေသရောက်</div></div>
        <span class="pcode-badge">MMR010013080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32733791631182, 21.536326938937123], [96.32729878860829, 21.536325469444932], [96.32634290190344, 21.535990114951915], [96.32510127810156, 21.53555463623752], [96.32244742640768, 21.535502133816465], [96.3233146012879, 21.543939861035824], [96.3233146012879, 21.552610205996245], [96.3233146012879, 21.564270324615848], [96.32214250137542, 21.575991323740652], [96.32757502886454, 21.57555672186527], [96.33277481180818, 21.57584559939494], [96.33833821583607, 21.57615467659707], [96.34162696731073, 21.582134224814695], [96.34850344717643, 21.583031157362086], [96.35560416130306, 21.579817150341285], [96.35859393496219, 21.573538624308128], [96.3624806411687, 21.56606418881131], [96.36457348317975, 21.562177482604795], [96.36457348317975, 21.55948668586194], [96.36367655063236, 21.555002024923567], [96.36457348317975, 21.552012251264443], [96.36598320106395, 21.54798025508478], [96.36228321839587, 21.546312610738426], [96.36050496463247, 21.548828483947432], [96.358200908745, 21.548828483947432], [96.35144233989212, 21.548521278234432], [96.34299998386223, 21.548433329934255], [96.3408436739964, 21.550825335920592], [96.33285627509707, 21.546678032265447], [96.33316348081007, 21.541916311788384], [96.33070582161645, 21.538383424055837], [96.32733791631182, 21.536326938937123]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
