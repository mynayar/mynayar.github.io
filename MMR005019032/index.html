
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chin Pyit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pale</div><div class="name-mm">ပုလဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chin Pyit</div><div class="name-mm">ချင်ပြစ်</div></div>
        <span class="pcode-badge">MMR005019032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.65249564006177, 21.995972460160942], [94.64522867995964, 21.996779939842384], [94.63624991969812, 21.999676229874183], [94.62785075990473, 22.002282900435546], [94.62712499981893, 22.002110100201037], [94.62587147978502, 22.005034469765008], [94.62316824002232, 22.010054759719424], [94.62587147978502, 22.01275800038144], [94.63668443973518, 22.01546124014419], [94.64363568024248, 22.017778290335855], [94.64402195974571, 22.022412389819976], [94.63475375987815, 22.02511562958267], [94.63359491956993, 22.02936354039514], [94.63977395990037, 22.034383830349555], [94.64672520040773, 22.036314690070924], [94.65676559955284, 22.036314690070924], [94.66294463988328, 22.04017650034524], [94.66989551976246, 22.046355269979756], [94.67993628043507, 22.04905850974251], [94.68843228012571, 22.045196790299656], [94.69576944040739, 22.03940412030397], [94.70156220033533, 22.03283916019916], [94.70156220033533, 22.02820505981572], [94.69576944040739, 22.020481530098607], [94.69495835984048, 22.020351659901223], [94.68611496013733, 22.018936770015955], [94.67491608041286, 22.01275800038144], [94.6637168400602, 22.008123810065854], [94.65522084036957, 22.002331230002312], [94.65249564006177, 21.995972460160942]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
