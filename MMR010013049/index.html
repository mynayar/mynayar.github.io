
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Bai Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukse</div><div class="name-mm">ကျောက်ဆည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Bai Taw</div><div class="name-mm">စပါယ်တော</div></div>
        <span class="pcode-badge">MMR010013049</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13137302184754, 21.498739566278005], [96.13010979273281, 21.485545835571884], [96.12929741264554, 21.47823442018239], [96.12924940863337, 21.47701482527401], [96.12718073500298, 21.477402701073856], [96.12679116038379, 21.477237427265493], [96.12211180791365, 21.475252247593176], [96.11873252438653, 21.47156575385651], [96.11658207180523, 21.47233377398453], [96.11535031266686, 21.475209519004125], [96.11550806004897, 21.476366666788294], [96.11570930494054, 21.477834702109874], [96.11855244773733, 21.483396936119732], [96.11944938028472, 21.49348742300623], [96.11675858264255, 21.500887114049135], [96.11115275669442, 21.502008279058884], [96.10032463057729, 21.503114699683692], [96.09937816876754, 21.505925889568175], [96.0943095150721, 21.507662655806996], [96.09481976072345, 21.509814130917448], [96.09482791757438, 21.509848522791117], [96.09674568226745, 21.511127031387446], [96.09712923322758, 21.514579000820277], [96.09853559034525, 21.517008164994877], [96.09670413358896, 21.518199972650677], [96.09672737117131, 21.519350051763524], [96.1050517487393, 21.514471899658474], [96.12086017915402, 21.514471899658474], [96.13179154114675, 21.516153648072475], [96.13170599763373, 21.508625875583732], [96.1316233661255, 21.501354265986663], [96.13137302184754, 21.498739566278005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
