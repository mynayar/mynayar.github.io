
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Poet Thar Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Poet Thar Yar</div><div class="name-mm">တောင်ပို့သာယာ</div></div>
        <span class="pcode-badge">MMR008011006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58536200725086, 18.30427695841496], [95.58617958272163, 18.305444924143956], [95.58987419913507, 18.309992143722525], [95.58930579612564, 18.31311835712654], [95.58845319296057, 18.317097174595006], [95.58788478995115, 18.32192859612786], [95.58820499536432, 18.323609672748262], [95.59498982082363, 18.322212797182885], [95.60380005892563, 18.319654985888917], [95.6091565568297, 18.318272664052245], [95.61261029792695, 18.31738137565003], [95.61458933433039, 18.31496255277966], [95.61317870003705, 18.314539363301037], [95.61261029792695, 18.312834156071517], [95.61005248663304, 18.31027634477755], [95.60578946810955, 18.308002735437924], [95.60237905275113, 18.303739716015116], [95.60237905275113, 18.3006135026111], [95.60237905275113, 18.299664011884715], [95.60209485169611, 18.299760899446028], [95.59300041163976, 18.301750307730572], [95.58574697104592, 18.304149618909832], [95.58536200725086, 18.30427695841496]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
