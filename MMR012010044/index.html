
<!DOCTYPE html>
<html>
<head>
    <title>Map View - U Hla Hpay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">U Hla Hpay</div><div class="name-mm">ဦးလှဖေ</div></div>
        <span class="pcode-badge">MMR012010044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.5516438936508, 20.830027725399248], [92.55183624604598, 20.831422274418458], [92.55337670736918, 20.831119618375737], [92.56034725092496, 20.83086430984008], [92.56179049373634, 20.83081098184141], [92.57704935474396, 20.83025125369244], [92.57841354624821, 20.830604648585734], [92.58041588858248, 20.82460064960037], [92.58241533689835, 20.81958837710198], [92.58343248272297, 20.810723313630092], [92.5814502627195, 20.809551705646754], [92.57611965180052, 20.807671764640304], [92.5689335263612, 20.80380348014654], [92.5650034692348, 20.80415062385225], [92.56285790896538, 20.80635227213969], [92.56260835069492, 20.806614627762883], [92.56063073342165, 20.808693661583277], [92.55955615059594, 20.80918962330253], [92.5576611666296, 20.810064231079423], [92.55503424243642, 20.811491908424898], [92.55292127989321, 20.81269115617198], [92.55006592700101, 20.81377619001921], [92.54892378530451, 20.815375188214432], [92.54886667835456, 20.81691707856038], [92.54915221400353, 20.81982953930185], [92.55000882005106, 20.82302753479297], [92.55092253304849, 20.8265681728829], [92.55160781734696, 20.82976616837402], [92.5516438936508, 20.830027725399248]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
