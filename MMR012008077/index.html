
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpyu Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpyu Chaung</div><div class="name-mm">ဖြူချောင်း</div></div>
        <span class="pcode-badge">MMR012008077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.86468645671465, 20.33177957516733], [92.86443497569365, 20.33121229271319], [92.86275656736177, 20.3318802182975], [92.86077190659825, 20.332281782678194], [92.85574300023933, 20.333299193802816], [92.85341010039588, 20.333991950568134], [92.84911440140854, 20.333409381437832], [92.84481873569615, 20.332826706187575], [92.84113661086593, 20.332476049729962], [92.83721667111251, 20.339155932400388], [92.83658674638127, 20.34022931013459], [92.83117646722025, 20.348560527046743], [92.82993909181567, 20.35747459187894], [92.82808756398993, 20.366503815798524], [92.82768051284546, 20.367301394843537], [92.83459172362922, 20.369288878578914], [92.83543861969662, 20.369556159789], [92.83758373929817, 20.37023310287543], [92.8383169619583, 20.370359133866998], [92.83884442423084, 20.369037446121297], [92.84315863216523, 20.36267580564396], [92.84683789355398, 20.358501818204388], [92.84785003285282, 20.356580637886168], [92.85234651178217, 20.351730864787612], [92.85390260691986, 20.349277684217782], [92.85534670138924, 20.347971703131634], [92.8578497448699, 20.343749744954835], [92.85934392078536, 20.34196892092899], [92.86468645671465, 20.33177957516733]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
