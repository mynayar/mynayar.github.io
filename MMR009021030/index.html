
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wun Tin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wun Tin</div><div class="name-mm">ဝန်တင်</div></div>
        <span class="pcode-badge">MMR009021030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.51270809420322, 21.582728620029854], [94.50554426565537, 21.58725314431723], [94.49681062730866, 21.593803372627576], [94.49135210221777, 21.6003536018373], [94.49681062730866, 21.607449683556126], [94.50499841314632, 21.618366732838524], [94.51045693823716, 21.628737928712496], [94.511073988274, 21.629910325401227], [94.51536960991962, 21.62819207710271], [94.5268325108118, 21.62491696204819], [94.52737836422017, 21.617275027820313], [94.52574080579359, 21.606357979437234], [94.53884126511235, 21.600899455245724], [94.55412513266879, 21.588344848436066], [94.56154872589303, 21.582313179109974], [94.55794610023241, 21.579611209189977], [94.54266223177666, 21.577427800052988], [94.53938711672214, 21.572515128370526], [94.53720370668577, 21.572515128370526], [94.52901592084811, 21.572515128370526], [94.52137398662023, 21.574698536608253], [94.51997514513693, 21.576237263139205], [94.51591546242872, 21.58070291420819], [94.51270809420322, 21.582728620029854]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
