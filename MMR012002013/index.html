
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Di Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zay Di Pyin</div><div class="name-mm">စေတီပြင်</div></div>
        <span class="pcode-badge">MMR012002013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.90776994612617, 20.429267739714476], [92.90752070891364, 20.429214776840524], [92.9038087499739, 20.426873387396938], [92.90334637343642, 20.426179821241817], [92.90312346567543, 20.42584545960034], [92.90283693987294, 20.424050639425502], [92.9032175392581, 20.423473178444453], [92.90421702779366, 20.42195671283207], [92.90588264956466, 20.41434243725371], [92.90611991230418, 20.412815061066283], [92.90662616406627, 20.409556067258734], [92.90655310674055, 20.409527901391584], [92.89694309884499, 20.40560887804736], [92.89216475439997, 20.408232901926908], [92.8903696788177, 20.41367324812194], [92.88966939112953, 20.418832813383688], [92.88896905487803, 20.423992372350142], [92.88995987844567, 20.430185001436712], [92.89254391756782, 20.43544043083125], [92.90329538097711, 20.43188164532171], [92.90761665668344, 20.429471717645697], [92.90776994612617, 20.429267739714476]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
