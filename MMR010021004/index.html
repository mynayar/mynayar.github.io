
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngazun</div><div class="name-mm">ငါန်းဇွန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan</div><div class="name-mm">ပန်း</div></div>
        <span class="pcode-badge">MMR010021004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69557247069304, 21.833601759613543], [95.6979178369387, 21.83067005158165], [95.6996768622974, 21.827445172656667], [95.70524710836742, 21.823927122838484], [95.71199003711058, 21.822461269272196], [95.71535359059578, 21.82207316594389], [95.71521491603562, 21.820409073020357], [95.7184397949606, 21.816304681415943], [95.72283735835748, 21.81190711891844], [95.72723491995566, 21.806923214634708], [95.72752809084875, 21.80340516481658], [95.72723491995566, 21.7998871149984], [95.72342369924439, 21.79461003982152], [95.71404223336242, 21.78874662375773], [95.70817881639931, 21.782883206794622], [95.70524710836742, 21.77848564519644], [95.70120177164449, 21.779641454789385], [95.69909052141048, 21.784055890367085], [95.69527929979989, 21.7881602819715], [95.69146807908862, 21.793144186255233], [95.68853637105673, 21.79959394410531], [95.68736368838358, 21.80428467659658], [95.6841388076599, 21.806043701955332], [95.6806207587411, 21.807216386427115], [95.6762231962436, 21.808975410886546], [95.67079664025283, 21.809468733994947], [95.67097907042779, 21.81266125621204], [95.66980247930104, 21.82050519525859], [95.66954101490597, 21.82508082621922], [95.6703254089905, 21.830179385969927], [95.66977343839352, 21.835360784972295], [95.67065295017358, 21.83946517657671], [95.67446417088485, 21.83946517657671], [95.67915490427549, 21.839758348369116], [95.68296612498676, 21.83829249300419], [95.68560466302483, 21.834774444085383], [95.68765685837735, 21.833308588720456], [95.69176124998177, 21.833308588720456], [95.69557247069304, 21.833601759613543]]]]};

        map.fitBounds(layer.getBounds());

</body>
</html>
