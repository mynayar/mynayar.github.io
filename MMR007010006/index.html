
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pi Tu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pi Tu</div><div class="name-mm">ပီတူး</div></div>
        <span class="pcode-badge">MMR007010006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.3870718956515, 19.17584775536966], [96.39368366187153, 19.17733244613555], [96.4001235199845, 19.178349266405576], [96.40415994442594, 19.177861710649495], [96.402835038906, 19.17428198712406], [96.403173978996, 19.167842129011092], [96.40215715872597, 19.16174121098817], [96.402835038906, 19.153945594313768], [96.40351291908598, 19.148183614582194], [96.40285131933297, 19.14276057673925], [96.40285945909682, 19.13733753889636], [96.40285945909682, 19.127169341591866], [96.40189566375392, 19.12045696371797], [96.39842882043376, 19.120729484378273], [96.39436154115225, 19.123779943389707], [96.39300578169156, 19.128186160962628], [96.3919889623208, 19.133609199704836], [96.38961638259002, 19.139710117727816], [96.38859956321932, 19.14547209566075], [96.38724380375862, 19.15225089386371], [96.38690486366858, 19.15699605332526], [96.38622698438786, 19.162758031258193], [96.3845322839378, 19.167503188921103], [96.38178003382154, 19.171006052787163], [96.38317652537643, 19.17292622766331], [96.3870718956515, 19.17584775536966]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
