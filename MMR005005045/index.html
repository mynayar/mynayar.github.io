
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel Sho</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel Sho</div><div class="name-mm">အလယ်ရှို</div></div>
        <span class="pcode-badge">MMR005005045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71173323480099, 22.861015001041494], [95.71467055460249, 22.862083117741747], [95.72190304728787, 22.85856003981405], [95.72199050725618, 22.85880704400995], [95.72286358978289, 22.86127279170603], [95.72529814988974, 22.86128438216855], [95.72551306807367, 22.860892222897803], [95.72559803961792, 22.860737460365556], [95.72628600029873, 22.859483759567922], [95.72666114979228, 22.859528949601383], [95.73017998291994, 22.859953210172534], [95.7306481681785, 22.860835826412313], [95.73132312016594, 22.85491940970303], [95.72467031967955, 22.849914509846826], [95.7135009602012, 22.849304220013778], [95.7094725604104, 22.841125469664746], [95.70269772012375, 22.83709715980615], [95.69647223970213, 22.838684039636746], [95.68487556015901, 22.83251949008246], [95.67132551985691, 22.824707039898044], [95.65789787998324, 22.831481970116897], [95.67132551985691, 22.838684039636746], [95.67490751956643, 22.84706231987019], [95.67661667392042, 22.853896799597692], [95.68293578186092, 22.855549489117664], [95.68853603560962, 22.856793989850814], [95.69444741701471, 22.85803848968459], [95.69818091831479, 22.86021636709171], [95.71124817826086, 22.860838617008596], [95.71173323480099, 22.861015001041494]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
