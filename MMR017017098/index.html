
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Deik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Deik</div><div class="name-mm">ကျွန်းဒိပ်</div></div>
        <span class="pcode-badge">MMR017017098</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17222080044962, 16.487230770383803], [95.17458527998673, 16.487792010293106], [95.17742784002286, 16.491555000363007], [95.18298335969433, 16.499296530010895], [95.19121727985362, 16.49641779024887], [95.19945047965598, 16.493538779790924], [95.1985544176523, 16.49154281364997], [95.19772160676678, 16.489460785087203], [95.19694828243735, 16.487438243080476], [95.1961154706525, 16.485891594421616], [95.19474727986312, 16.483750078403432], [95.19361703619734, 16.48184651040816], [95.19320063030489, 16.480299859950605], [95.19320411967442, 16.47875925023925], [95.19152327957573, 16.481504789614405], [95.19107976002294, 16.482228840088965], [95.18992055998592, 16.482623850210587], [95.18830523999486, 16.483174110297], [95.18761728021337, 16.48319408963556], [95.18479091966526, 16.48327616985938], [95.18284115979174, 16.483332599619814], [95.17916303964262, 16.483438889593117], [95.17809923968821, 16.48319598001052], [95.1778216801265, 16.4831326200744], [95.17643351989108, 16.483410450332087], [95.1722676002696, 16.484244030137916], [95.17173156026337, 16.4843513102648], [95.17222080044962, 16.487230770383803]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
