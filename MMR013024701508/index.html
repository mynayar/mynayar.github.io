
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pyi Thar Yar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktan</div><div class="name-mm">ကျောက်တန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Shwe Pyi Thar Yar Ward</div><div class="name-mm">ရွှေပြည်သာယာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013024701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.30394759597431, 16.636213924405492], [96.298320738381, 16.632468330672584], [96.2983207361434, 16.632468329205906], [96.29591293127754, 16.636009025294513], [96.29594348133342, 16.636770078031685], [96.29139152300709, 16.63653590828043], [96.29129987283946, 16.63858488390711], [96.28934466926304, 16.644146278791446], [96.29374387730996, 16.645580507088294], [96.29548523049516, 16.640750920045093], [96.29582128110985, 16.639580092739237], [96.2995636629554, 16.639799623403775], [96.30011356396126, 16.639419103425478], [96.30026631424067, 16.638014100039932], [96.30066346496713, 16.637194509976908], [96.3013661162524, 16.637604305446345], [96.30237426809649, 16.637926286986467], [96.30292416910235, 16.63874587392138], [96.30351989519195, 16.63776529628399], [96.30394759597431, 16.636213924405492]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
