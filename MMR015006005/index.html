
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yawng Lawng</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yawng Lawng</div><div class="name-mm">ယောင်လောင်</div></div>
        <span class="pcode-badge">MMR015006005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.0245471671181, 22.63409753986963], [99.02344743115407, 22.632291676919408], [99.01793556097743, 22.627781966264763], [99.01092045421564, 22.618010923965016], [99.00941721673121, 22.602226934425516], [99.01192261193904, 22.589449418955553], [99.01611329709107, 22.57986302365964], [99.00616020323088, 22.583185929587046], [98.98010409342925, 22.59045157667896], [98.96557280014468, 22.594961288232923], [98.95788625774463, 22.59396947631035], [98.95379744329745, 22.59972153921774], [98.93807986509375, 22.62233354415781], [98.93550250523651, 22.63337855707482], [98.95376934128211, 22.638343694306116], [98.96171284697039, 22.641114685394484], [98.97889298902027, 22.650536053296264], [98.99958305191637, 22.66753146110807], [99.01436166775682, 22.67676809657047], [99.02004553687209, 22.679694864626356], [99.02044095618521, 22.676136094405308], [99.0236979696856, 22.663108038605174], [99.02620336489343, 22.645319732719543], [99.0264539052236, 22.63955732401132], [99.0245471671181, 22.63409753986963]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
