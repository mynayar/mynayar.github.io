
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwar Bu Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwar Bu Kyin</div><div class="name-mm">နွားဘူးကျင်း</div></div>
        <span class="pcode-badge">MMR010023031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.09182818572225, 20.317520962622382], [96.09827159885526, 20.32038470169266], [96.10635847266542, 20.32200207663459], [96.11484969066078, 20.324023794862285], [96.1233409095554, 20.322810764105554], [96.13223647173584, 20.318362982565645], [96.13991900226023, 20.31351085773997], [96.14638850202783, 20.312702171168326], [96.14760153278456, 20.304615295559472], [96.15164497013933, 20.298954484162152], [96.15433374160892, 20.295287977857924], [96.15285800179538, 20.2945067026223], [96.1447711270859, 20.288845891224923], [96.1388648043673, 20.279002019127915], [96.1382522509407, 20.278147208127223], [96.13195585537846, 20.280960491633437], [96.12695698727521, 20.281897777660333], [96.12070840596823, 20.280960491633437], [96.11164796118453, 20.281272919709522], [96.10108614860695, 20.287278657084414], [96.09864935638274, 20.286519539345306], [96.09672258767733, 20.287061539158742], [96.09526635595762, 20.286859350878387], [96.09503684897146, 20.293698016050655], [96.09503684897146, 20.300571859104082], [96.09422816060118, 20.307850046342594], [96.09301512984445, 20.31351085773997], [96.09099341071737, 20.317149951808858], [96.09182818572225, 20.317520962622382]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
