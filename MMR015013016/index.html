
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ong Ma Hkar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nawnghkio</div><div class="name-mm">နောင်ချို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ong Ma Hkar</div><div class="name-mm">အုမ္မခါး</div></div>
        <span class="pcode-badge">MMR015013016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7508481687081, 22.307652481077184], [96.75008807340595, 22.30252183261655], [96.74260051500181, 22.28790326732195], [96.73784134230414, 22.280415708018552], [96.7336867550398, 22.280415708018552], [96.70587582331063, 22.26829299522558], [96.69589241240499, 22.262944738708768], [96.68650717656499, 22.261728134046223], [96.67663869092291, 22.2604488862072], [96.65782089871556, 22.260293914132887], [96.65025396075174, 22.26579714182469], [96.6491843098081, 22.280772258632908], [96.65310636386766, 22.294321173883134], [96.65774151915582, 22.303234933845147], [96.67414283842129, 22.312148693807217], [96.68020419526744, 22.324984507828844], [96.68203788234246, 22.334658387374702], [96.68662210182862, 22.337820322749735], [96.715146133887, 22.34744718394046], [96.72346049930263, 22.349740802296253], [96.73047780130952, 22.344594779925217], [96.74616601934639, 22.328550012173366], [96.75151427496388, 22.312148693807217], [96.7508481687081, 22.307652481077184]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
