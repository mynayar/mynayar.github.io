
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyan Kaing Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yenangyaung</div><div class="name-mm">ရေနံချောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyan Kaing Kyun</div><div class="name-mm">ကျန်းကိုင်ကျွန်း</div></div>
        <span class="pcode-badge">MMR009002004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85004038615494, 20.48967837076026], [94.84896068169019, 20.48441481419235], [94.84896068169019, 20.480082083821173], [94.85033512906301, 20.47741909321661], [94.84896068169019, 20.472379454348413], [94.8508863388335, 20.455048534662183], [94.85063202674672, 20.45370791079148], [94.84679962340397, 20.453671525120853], [94.8458914574249, 20.449148092610415], [94.84426704528795, 20.450920900978872], [94.84422170686634, 20.45097038077853], [94.83962014215592, 20.453153236832463], [94.83443111420462, 20.454861483770514], [94.83066551070482, 20.45611666665087], [94.82568652391399, 20.4565433688814], [94.82420304723291, 20.461580540009948], [94.82007581734513, 20.46900955344819], [94.81285460125889, 20.47430511059241], [94.81092894411552, 20.480082083821173], [94.82200147538782, 20.47960067043465], [94.82777844771726, 20.484896227578872], [94.8349996638035, 20.489228957950104], [94.8460721950758, 20.49019178742111], [94.84629899510259, 20.491665984897338], [94.85004038615494, 20.48967837076026]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
