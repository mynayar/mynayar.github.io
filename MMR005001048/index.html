
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Se</div><div class="name-mm">မြင်းဆည်</div></div>
        <span class="pcode-badge">MMR005001048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68882168727112, 21.922384374339458], [95.68730153443835, 21.921888688712045], [95.6863994397824, 21.92159465986572], [95.68415855407409, 21.921011278647654], [95.68307304178751, 21.92072868198312], [95.68225619926426, 21.920607669208607], [95.68209348042984, 21.92531904024156], [95.68209348042984, 21.929704919646383], [95.68236779973421, 21.937928580339758], [95.68212047987629, 21.94435214993183], [95.6853831600049, 21.944507489828823], [95.68647935983466, 21.94436133021128], [95.69360663993456, 21.94341102020246], [95.6996535599639, 21.94341102020246], [95.70045959983071, 21.94341102020246], [95.70045959983071, 21.937928580339758], [95.7021044400679, 21.931349669951373], [95.70255444013537, 21.92774813966497], [95.70170402412145, 21.927293780583568], [95.69941006042603, 21.926464702783846], [95.69857955630152, 21.92616460441303], [95.6969098048437, 21.925276034661294], [95.69590568479958, 21.924741744735798], [95.69386622924316, 21.92435973161639], [95.69338011689894, 21.924268715728715], [95.69111038813395, 21.92367327909858], [95.68882168727112, 21.922384374339458]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
