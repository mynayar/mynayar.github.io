
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kaing</div><div class="name-mm">ညောင်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009016045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52137784900856, 19.310732254989603], [95.52198899319751, 19.319288267339743], [95.52433259587264, 19.322413070606785], [95.52645299940644, 19.325240274718965], [95.53017300368123, 19.330448281962674], [95.5428210212732, 19.33788829231088], [95.5498890306543, 19.33974829534759], [95.55122080339743, 19.34422789220349], [95.55316808024276, 19.341793796146817], [95.55673355670831, 19.342356766351713], [95.55807304203734, 19.33974829534759], [95.55918904403921, 19.330076281894947], [95.5580937723098, 19.325558285786315], [95.55284284132415, 19.324290819965427], [95.54580946303633, 19.322415253261397], [95.53643162501953, 19.3219463611357], [95.53314938193847, 19.320070792633032], [95.52939824673177, 19.31725744167767], [95.52658489487703, 19.312099630993202], [95.52142708509194, 19.310224064289173], [95.52133967728435, 19.310197840957642], [95.52137784900856, 19.310732254989603]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
