
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat Ma Daw San Pya Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingaladon</div><div class="name-mm">မင်္ဂလာဒုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tat Ma Daw San Pya Ward</div><div class="name-mm">တပ်မတော်စံပြ ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013002701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13700151700647, 16.938908732651953], [96.13668725431341, 16.938709236042484], [96.13648500038249, 16.938673543749076], [96.13631248883036, 16.938614058092355], [96.13618161858687, 16.93860216006169], [96.13600910793406, 16.938608109076995], [96.13584849441253, 16.93853672538961], [96.13577710982582, 16.938072730072463], [96.13560459917295, 16.938048935809775], [96.13516439901787, 16.937959705975686], [96.13497999123365, 16.937894271303605], [96.13469445468542, 16.937799091554893], [96.13448625263851, 16.93772175975147], [96.13423640928295, 16.937614683770676], [96.13404010436739, 16.937531402951947], [96.13380215814317, 16.937454070249203], [96.13366533888433, 16.937400532708466], [96.13346350133958, 16.93738004885023], [96.13302503867465, 16.938808373707502], [96.13299236810337, 16.93891480217644], [96.13252837278623, 16.940321063066676], [96.13208348266664, 16.941700149142605], [96.13305430261403, 16.941871469992407], [96.13363964975008, 16.941857194154238], [96.13418216667372, 16.941700149142605], [96.13463902407176, 16.941514550656052], [96.1349816657713, 16.941214739168913], [96.13572405791899, 16.94042951680882], [96.13603221331607, 16.94006266625911], [96.13700151700647, 16.938908732651953]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
