
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Din</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Din</div><div class="name-mm">အင်းဒင်</div></div>
        <span class="pcode-badge">MMR012009086</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.59428106481937, 20.48763641418924], [92.59388906742657, 20.488518408997436], [92.58924436043895, 20.491868689388582], [92.58677011864614, 20.494632089299557], [92.58591217440738, 20.495182606592095], [92.58383822355523, 20.49651339727552], [92.58117322656324, 20.499863678565987], [92.57522061304093, 20.506053695121977], [92.57212758012378, 20.508834199238947], [92.57348393583504, 20.51003346497248], [92.58345791375177, 20.519072382684385], [92.60774446083826, 20.529886100763008], [92.61941321474814, 20.5400328429414], [92.61957685988426, 20.538249439659978], [92.61958938114509, 20.538112955848305], [92.61970723729922, 20.53682858097426], [92.62071020711045, 20.535047390924376], [92.6208504878598, 20.533660797308016], [92.62134738307532, 20.528749328918423], [92.62235807356632, 20.527244898932963], [92.62283901660737, 20.526529004410065], [92.62821712701884, 20.522138713830657], [92.6287285435875, 20.520799306742674], [92.6308638470889, 20.517230415551296], [92.63008099264374, 20.516767819579286], [92.61731726018348, 20.507017745872304], [92.61182176396329, 20.502054072737337], [92.60313533462806, 20.502054072737337], [92.59958985368888, 20.49744494742646], [92.59817166059372, 20.491417629020418], [92.59541728088288, 20.48735854076409], [92.59538373886852, 20.487309111326454], [92.59428106481937, 20.48763641418924]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
