
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mun Zaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sidoktaya</div><div class="name-mm">စေတုတ္ထရာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mun Zaw</div><div class="name-mm">မွန်ဇော်</div></div>
        <span class="pcode-badge">MMR009011036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.26338757117952, 20.415496929339895], [94.26046734029558, 20.397210086076655], [94.26365304655093, 20.383192975675342], [94.29614725719023, 20.36885729392901], [94.3082529440182, 20.36280445096469], [94.30092581837187, 20.350698765036043], [94.29073155601657, 20.34209735580839], [94.24708737078561, 20.334770230162064], [94.16234756658696, 20.309284574723392], [94.11071315408884, 20.295549630211326], [94.10491562325745, 20.29348338475046], [94.1047723936311, 20.293578871167995], [94.1047723936311, 20.30184241769348], [94.10123087420556, 20.30597419275483], [94.09355757881929, 20.313057235203303], [94.09149169128858, 20.32250129030234], [94.08861161963063, 20.32936915286416], [94.09092118116763, 20.32974443995397], [94.12210146880778, 20.336610860902567], [94.1874084614314, 20.36432651125955], [94.21130126284305, 20.374202203169204], [94.23806120096373, 20.390130737143863], [94.25080402868304, 20.40223642397183], [94.26338757117952, 20.415496929339895]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
