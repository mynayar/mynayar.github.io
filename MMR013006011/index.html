
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pet Inn Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pet Inn Ka Lay</div><div class="name-mm">ပက်အင်းကလေး</div></div>
        <span class="pcode-badge">MMR013006011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.90109567462576, 17.00833988937444], [95.90276103019744, 17.00833988937444], [95.91025512757216, 17.009727685384405], [95.91941457961923, 17.011115481394427], [95.92579844144495, 17.01278083606678], [95.92829647300391, 17.01527886942432], [95.92864296919771, 17.014932373230465], [95.93769616904302, 17.015271484191715], [95.93171666219428, 17.009083088214027], [95.93218230237142, 17.00861744893615], [95.93079450636145, 17.002511146672134], [95.92968426901388, 16.997515081755694], [95.92885159212733, 16.993351694625062], [95.92885159212733, 16.98891074793272], [95.9285740316663, 16.978363499875684], [95.92330040808741, 16.978363499875684], [95.91719410672272, 16.98197176878216], [95.91608387027446, 16.98224932834387], [95.91053268713387, 16.98446980124038], [95.90553662221743, 16.987522951922756], [95.9019283533109, 16.990853662166842], [95.90220591197334, 16.99362925418677], [95.90276103019744, 16.998347760440822], [95.90220591197334, 17.00112335066217], [95.90165079374918, 17.002511146672134], [95.90165079374918, 17.004731619568645], [95.90109567462576, 17.00833988937444]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
