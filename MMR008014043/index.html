
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hman Pin Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hman Pin Htu</div><div class="name-mm">မှန်ပင်ထူး</div></div>
        <span class="pcode-badge">MMR008014043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.71612795993747, 18.271413208253023], [95.7192644238142, 18.275333787424415], [95.72004854000818, 18.28003848278979], [95.7188723661668, 18.28591935199654], [95.71848030762015, 18.28905581497395], [95.71965648236085, 18.29258433739733], [95.72083265530284, 18.296112858022013], [95.72632146686226, 18.299249321898742], [95.72984998838632, 18.302777843422803], [95.73494674139903, 18.302777843422803], [95.73808320527576, 18.296112858022013], [95.73847526292309, 18.293760511238645], [95.74317995828852, 18.28827169967923], [95.74710053835923, 18.287095525837913], [95.75023700133659, 18.28003848278979], [95.75082508780764, 18.270923136193858], [95.74906082659595, 18.268570787611793], [95.74259187091815, 18.265924396693606], [95.73200630724534, 18.26327800577542], [95.7234790471204, 18.25739713566935], [95.72083265530284, 18.252986485338056], [95.71730413377878, 18.258867353645485], [95.71612795993747, 18.263572049010918], [95.71612795993747, 18.268276744376294], [95.71612795993747, 18.271413208253023]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
