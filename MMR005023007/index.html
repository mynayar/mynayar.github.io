
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Thi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Thi</div><div class="name-mm">လေးသီ</div></div>
        <span class="pcode-badge">MMR005023007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.92767467994258, 24.458679540328546], [95.92852788025755, 24.45770267963502], [95.92150896037026, 24.45147702024832], [95.9152831202199, 24.448120110055072], [95.9237060401017, 24.43988033980588], [95.9237060401017, 24.43231197012136], [95.9237060401017, 24.421325670343435], [95.92431624000255, 24.410095200133412], [95.91607655968556, 24.41333006962708], [95.90228280041094, 24.41333006962708], [95.90226551993783, 24.413089230283788], [95.88751236030726, 24.41589354035466], [95.88269052015147, 24.41589354035466], [95.87127672044437, 24.41589354035466], [95.85308844017942, 24.41589354035466], [95.84851067962421, 24.41607668998728], [95.8400877597424, 24.41650392011985], [95.8276976398343, 24.41650392011985], [95.82409656010822, 24.41729735958552], [95.82507324003808, 24.421081499911338], [95.82592788016757, 24.42730716019736], [95.82550056010285, 24.43688963984505], [95.82849108019923, 24.446106000091902], [95.82910163982888, 24.456726089637357], [95.8276976398343, 24.46710200965009], [95.82910163982888, 24.477111810261874], [95.82605100005367, 24.48353943040047], [95.86108403999651, 24.48107910022037], [95.87969964032618, 24.478881839725148], [95.890922639868, 24.478271909620958], [95.90710463966747, 24.468688980312265], [95.92431624000255, 24.462524429858604], [95.92767467994258, 24.458679540328546]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
