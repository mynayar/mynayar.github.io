
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oe Bo Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Gyobingauk</div><div class="name-mm">ကြို့ပင်ကောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oe Bo Kone</div><div class="name-mm">အိုးဘိုကုန်း</div></div>
        <span class="pcode-badge">MMR008014009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60772327760725, 18.212312240117853], [95.6032541263769, 18.205823951714024], [95.59863071893261, 18.202521517953755], [95.59444763574987, 18.197898109610094], [95.58828309159145, 18.195036000111372], [95.58175161144777, 18.193935188558157], [95.57499996827397, 18.191586791597217], [95.57177092189062, 18.18894484422924], [95.56736767567776, 18.1845415989157], [95.56501927871682, 18.183954499001004], [95.56531282822448, 18.185422248338114], [95.56648702715466, 18.190999691682464], [95.5647257292091, 18.195402937895324], [95.57000424060328, 18.200242147557105], [95.57553636621037, 18.204265512043776], [95.57729658766743, 18.20854033596777], [95.57729658766743, 18.211557859107984], [95.5780509686773, 18.216084143368562], [95.57880534968717, 18.2175929053883], [95.58433747529432, 18.220861887965782], [95.58634915708797, 18.222370649985578], [95.58785791820844, 18.220861887965782], [95.58961813966545, 18.216084143368562], [95.59364150415217, 18.213821001238273], [95.60043093144242, 18.21356954090163], [95.60772327760725, 18.212312240117853]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
