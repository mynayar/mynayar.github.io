
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tone Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tone Gyi</div><div class="name-mm">တုံးကြီး</div></div>
        <span class="pcode-badge">MMR007011004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74103836203085, 18.359891912381897], [96.74606159726494, 18.36061931732769], [96.75429892495549, 18.359891912381897], [96.7521179116124, 18.355529883897077], [96.7569161418665, 18.35247646521674], [96.76433158903166, 18.34942304563708], [96.77218323796615, 18.348986842968486], [96.78047108956918, 18.35029545097433], [96.78599599721758, 18.349939005580666], [96.77916248156333, 18.345497220720233], [96.7756728602144, 18.339826586028153], [96.76825741304924, 18.336773166448495], [96.76825741304924, 18.334319526325146], [96.76345918279509, 18.333719746868894], [96.7608419667834, 18.329357720182713], [96.75473512762409, 18.330230124620584], [96.7503731009379, 18.3319749361944], [96.74862829026347, 18.33851797712299], [96.74252145110415, 18.3406989913654], [96.73859562618725, 18.346369626956744], [96.73124997180884, 18.34889523982349], [96.731005698854, 18.355529883897077], [96.73449532110226, 18.35901950614533], [96.74103836203085, 18.359891912381897]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
