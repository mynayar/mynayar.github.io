
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Lon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Lon</div><div class="name-mm">နန်းလုံ</div></div>
        <span class="pcode-badge">MMR010023032</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25597370642146, 20.537598665945723], [96.26292638044816, 20.53807830856715], [96.27425455660256, 20.545500846886625], [96.28441090264113, 20.54979817094886], [96.28754373055875, 20.55009194258912], [96.28912183660356, 20.545199813220847], [96.29356961814341, 20.53266515787078], [96.29397396232855, 20.522152220748467], [96.29963477372587, 20.508808877927436], [96.30286952360967, 20.504361097286846], [96.30489124183742, 20.50233937815983], [96.29599567965693, 20.50233937815983], [96.28022627532243, 20.498295940805065], [96.26405252590342, 20.49627422167805], [96.24707008991277, 20.49465684763544], [96.23210937214986, 20.49061341028073], [96.21714865438696, 20.49061341028073], [96.20663571726459, 20.487378660396928], [96.20420965485175, 20.489804722809765], [96.20057056078281, 20.498295940805065], [96.20097490496795, 20.50516978385849], [96.20461399813757, 20.51527837769504], [96.20582702979362, 20.522960908219375], [96.20097490496795, 20.533069501156604], [96.20259227990982, 20.54398678156474], [96.20178910078641, 20.55606940078229], [96.2246442338444, 20.547843831727505], [96.24066027814939, 20.541593742257476], [96.25159806489881, 20.53729680400437], [96.25597370642146, 20.537598665945723]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
