
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man San (Mut Ngar)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man San (Mut Ngar)</div><div class="name-mm">မန်စန် (မွတ်ငါး)</div></div>
        <span class="pcode-badge">MMR015005024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.68913583515075, 22.605438580725945], [98.68549066256406, 22.60339372923727], [98.67413949074495, 22.590715796596783], [98.66588409387589, 22.579217207008526], [98.66116672256624, 22.569929883957002], [98.65938957766696, 22.567808775354763], [98.65261649015895, 22.56698152767541], [98.63315733834054, 22.5649176780085], [98.6197423159552, 22.569782466187917], [98.60014812103901, 22.56898780904021], [98.59894365992204, 22.568710911379526], [98.59741843221491, 22.571156016037378], [98.59456307842339, 22.57686672272115], [98.5910224403334, 22.5852043535981], [98.58405537895266, 22.59811055036164], [98.58194241730877, 22.60034914729539], [98.5812000260604, 22.60257632283907], [98.58072793414692, 22.606117032874806], [98.58091814795421, 22.605814206860202], [98.60555821224176, 22.61684356887565], [98.62445968726479, 22.60796368097914], [98.6300615642898, 22.609437859569596], [98.63713761900596, 22.609880112876965], [98.65143714710672, 22.60545757800486], [98.65851320272219, 22.602804058160814], [98.66529442190011, 22.60545757800486], [98.67487657959055, 22.609585277338738], [98.68785819979615, 22.619742468740014], [98.6894709441288, 22.61091203816011], [98.68913583515075, 22.605438580725945]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
