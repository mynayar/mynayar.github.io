
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Laung Tei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Laung Tei</div><div class="name-mm">လောင်းတည်</div></div>
        <span class="pcode-badge">MMR005029023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.63542681699408, 22.777715891874948], [94.63537719420219, 22.77664900005135], [94.63369159938787, 22.768431721846525], [94.62952475975993, 22.770283589616042], [94.6088510402434, 22.783204709729603], [94.58990027967423, 22.797848519893307], [94.56922656015769, 22.80129416979014], [94.5451072797772, 22.80129416979014], [94.52443356026066, 22.80129416979014], [94.52168532022142, 22.80129416979014], [94.51840356007631, 22.81507659041239], [94.51840356007631, 22.82541345017063], [94.51840356007631, 22.837870530001], [94.52184947976974, 22.839195869893558], [94.52908944042537, 22.856089770326662], [94.55372135955315, 22.85211699000712], [94.55728680004586, 22.852354679924588], [94.57956324005153, 22.853839769989463], [94.59110483971665, 22.854727530351283], [94.59151523993643, 22.853086020303635], [94.59603755998546, 22.838872860394247], [94.60314432025422, 22.82465969958554], [94.6115431203188, 22.810446539676093], [94.62123359955103, 22.7904189299897], [94.62963239961562, 22.782020219857316], [94.63542681699408, 22.777715891874948]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
