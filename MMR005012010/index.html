
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kya Paing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kya Paing</div><div class="name-mm">ကျပိုင်</div></div>
        <span class="pcode-badge">MMR005012010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.20596395986894, 22.01511932959346], [95.20480996690651, 22.015811710442108], [95.200734240293, 22.018257090292536], [95.19650100012115, 22.020373800310665], [95.19426720017123, 22.023351899870306], [95.19396083982093, 22.02376058957958], [95.19459587989599, 22.029264089766002], [95.19332579974594, 22.035614309752646], [95.19508763998266, 22.038497189993393], [95.19565428032087, 22.039424460270652], [95.20136928036806, 22.03900109992088], [95.20348608031838, 22.04196452973929], [95.20644960006905, 22.046833079782857], [95.2074050398108, 22.05066123023164], [95.2104513601422, 22.046270759787774], [95.217476399916, 22.040793720353975], [95.21830979985742, 22.03722171031376], [95.21961947985517, 22.033411649727896], [95.22021671962597, 22.0322174399829], [95.21742671956753, 22.030188389582577], [95.21155296040087, 22.023361980371135], [95.20599635974429, 22.016217960290703], [95.20596395986894, 22.01511932959346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
