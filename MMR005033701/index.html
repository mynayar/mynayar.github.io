
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Urban</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hkamti</div><div class="name-mm">ခန္တီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Urban</div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR005033701</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.69271382808074, 25.98193528328676], [95.68188468033378, 25.97509763974432], [95.66393926918198, 25.967851915333654], [95.66104168772375, 25.977236396642468], [95.65961401217697, 25.984136834447384], [95.65913811972848, 25.98949062089548], [95.65509303571508, 26.000198195590315], [95.65473007473321, 26.007122457335583], [95.66587758518244, 26.0175127170383], [95.66844670455185, 26.017917107088863], [95.67005284066613, 26.018274026425217], [95.6716589767804, 26.018452486093395], [95.67362203313036, 26.018214539869177], [95.67594200701808, 26.017619675207868], [95.67784557591267, 26.01666789031094], [95.67879735991028, 26.016013538194272], [95.6800465766882, 26.01482380797239], [95.68117682125336, 26.013277158414155], [95.68284244392373, 26.012325374416548], [95.68480549937436, 26.01101667018321], [95.68748239259838, 26.009826939961386], [95.6893859623923, 26.008518235728047], [95.69152747661184, 26.006852613057674], [95.69319309928215, 26.00500853071918], [95.69456129007153, 26.003283422392087], [95.69592947996159, 26.000963446705725], [95.69700023707134, 25.999000392154414], [95.69789253541222, 25.997572715708316], [95.69902277907806, 25.996204524918937], [95.70045045642348, 25.993944037587312], [95.70134275296573, 25.991743035912407], [95.70146172607787, 25.98936357456938], [95.70175875416322, 25.98833387870559], [95.7009275998289, 25.98712155031933], [95.69271382808074, 25.98193528328676]]]]};
        const layer = L.geoJSON(geojsonData, {

</body>
</html>
