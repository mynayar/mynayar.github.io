
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Swea</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyay</div><div class="name-mm">ပြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Swea</div><div class="name-mm">အုတ်ဆွဲ</div></div>
        <span class="pcode-badge">MMR008001040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39077638592153, 18.913110625355102], [95.39071206191221, 18.912596032381032], [95.38892004132691, 18.90632396168155], [95.38892004132691, 18.901843911567312], [95.38862137107947, 18.897363860553753], [95.38981605116987, 18.888105090977206], [95.39232868502086, 18.885819036819157], [95.39036292171153, 18.88458286380819], [95.38694115061367, 18.883805188558654], [95.38460812486511, 18.883338584308262], [95.38118635286793, 18.882249838059636], [95.3789006908143, 18.881730368961428], [95.37776458177007, 18.8814721628101], [95.37449834572215, 18.880694487560618], [95.37138764472411, 18.879294672111484], [95.36781033767699, 18.877272715563436], [95.3660994530274, 18.875250760814026], [95.36396143806996, 18.878844394153532], [95.35883937273894, 18.884839379233995], [95.36419991399487, 18.887711097089493], [95.37044458415028, 18.891034873560614], [95.37558133001443, 18.89355288625677], [95.37638709378939, 18.894358650031734], [95.37638709378939, 18.895164413806697], [95.37638709378939, 18.89889107216527], [95.37654377007897, 18.902718450995792], [95.37582753471304, 18.906538369050566], [95.37582753471304, 18.91035828710534], [95.37988619759, 18.912984481049023], [95.38513858637674, 18.911074521571948], [95.39077638592153, 18.913110625355102]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
