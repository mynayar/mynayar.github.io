
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Be</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Be</div><div class="name-mm">အင်းဘဲ</div></div>
        <span class="pcode-badge">MMR009015050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.13904066879189, 19.081572874788378], [95.13799734999776, 19.080261168618108], [95.13383473268681, 19.073477079703537], [95.13161587227472, 19.075826462321402], [95.12741626315011, 19.075826462321402], [95.1207723794418, 19.076863236749034], [95.12073979160817, 19.07706855107284], [95.12071646229498, 19.077215537167376], [95.1127006664027, 19.078166563935838], [95.10315562643109, 19.08425914344474], [95.09999331244148, 19.08627764120024], [95.08506052042674, 19.094147624613242], [95.0799859878631, 19.09682204110436], [95.07890451083455, 19.104662747987504], [95.07863414225193, 19.11250345576991], [95.07706580734117, 19.117905500738345], [95.08674521861701, 19.11980342458844], [95.09107112673115, 19.11980342458844], [95.09728961942045, 19.116829363884108], [95.09755998890245, 19.111692348223357], [95.09999331244148, 19.106555332562607], [95.11486361956048, 19.096551670723102], [95.12447254467224, 19.090000131201123], [95.12470530180826, 19.090337745690476], [95.13904066879189, 19.081572874788378]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
