
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Hla</div><div class="name-mm">ကံလှ</div></div>
        <span class="pcode-badge">MMR018003021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15779699303687, 20.030896886682], [96.15305711079708, 20.034800319379258], [96.1493195121858, 20.036980585385777], [96.14567138532624, 20.04017269661273], [96.14868927898709, 20.042436116633553], [96.16083647582275, 20.04710811624659], [96.1736066060601, 20.055829180272497], [96.18295060258828, 20.05676358037499], [96.19229460091515, 20.06236997829194], [96.20413033105001, 20.068599309610477], [96.21503166108238, 20.070779575616996], [96.2165889936872, 20.07109104321711], [96.21732381264388, 20.059070829755058], [96.21890589998736, 20.047600700112298], [96.21890589998736, 20.04008578702951], [96.21890589998736, 20.03346159307813], [96.22263635708225, 20.032939328886982], [96.2203338929948, 20.025456321951765], [96.21972219032688, 20.01933928627909], [96.21874460298108, 20.01904097036453], [96.21168379357226, 20.01942355365412], [96.2074746381441, 20.019829907824032], [96.20447079998746, 20.020119901412386], [96.19952101238488, 20.02079286769674], [96.19807786310298, 20.023577690358195], [96.19085659125875, 20.02517878397373], [96.18841135979648, 20.02697194669804], [96.18618609081551, 20.032585660599807], [96.17982049601915, 20.03210590106653], [96.1692260713262, 20.031201308993275], [96.1613829956288, 20.03094613175864], [96.15779699303687, 20.030896886682]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
