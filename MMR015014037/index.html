
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Son</div><div class="name-mm">ကုန်းစုံ</div></div>
        <span class="pcode-badge">MMR015014037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.54024079217885, 22.288730942179313], [97.53551814544613, 22.27198779779866], [97.52843870837972, 22.243670047734554], [97.51529118124307, 22.206755838311324], [97.51352132175168, 22.19664235576016], [97.51176704301469, 22.18630555086054], [97.49304152034995, 22.197653704554853], [97.4768599486278, 22.197653704554853], [97.46927483716405, 22.203216120227808], [97.45107056965111, 22.22546578022161], [97.44512500501503, 22.23013729510012], [97.44399113168544, 22.231028194995247], [97.45709332219911, 22.28844557200557], [97.46168972570035, 22.29120341410635], [97.47635427512978, 22.29120341410635], [97.47806116139355, 22.292412458168485], [97.4780183518655, 22.290357638594173], [97.4870447474172, 22.29336643741118], [97.50108580496601, 22.298381101206928], [97.51679841801263, 22.296040924948784], [97.52682774560401, 22.28968901693463], [97.54024079217885, 22.288730942179313]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
