
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Minhla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR009013903</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.84513612313361, 19.64757720612323], [94.84353977344188, 19.645980856431436], [94.82776214660583, 19.640721648085616], [94.81353404086337, 19.636571784060664], [94.80841653329645, 19.635079176562783], [94.80834353082935, 19.635057885113383], [94.79175679563969, 19.635462438840534], [94.77517006134929, 19.634248775860385], [94.76262887242456, 19.6245394684218], [94.75736966317947, 19.628989566615246], [94.7356874448198, 19.643195158729668], [94.73390550203737, 19.64436263792544], [94.72581441220541, 19.66054481758931], [94.72662352055909, 19.669445016674217], [94.73519027171375, 19.68086735184687], [94.74118748261628, 19.688863634249344], [94.75575144467348, 19.697763833334307], [94.77112451598367, 19.70787769539936], [94.77840649656264, 19.722846212083084], [94.78294239727387, 19.73311167016749], [94.79338352173221, 19.72738589174554], [94.79542841189175, 19.72812205159147], [94.7966114502583, 19.71313690374518], [94.80146610397759, 19.700191160193924], [94.81198452066917, 19.69088640558323], [94.81558800338371, 19.68800361977128], [94.82209838363354, 19.682795315751264], [94.82960135012229, 19.674639918097796], [94.83140313734498, 19.67268145278689], [94.83908967344973, 19.6662085805616], [94.84677620865517, 19.65528561014287], [94.84758531790817, 19.65002640089773], [94.84513612313361, 19.64757720612323]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
