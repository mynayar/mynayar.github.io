
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bin Gwa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bin Gwa</div><div class="name-mm">ဘင်ဂွ</div></div>
        <span class="pcode-badge">MMR010020062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03677186203186, 20.777982542160657], [95.03659275665046, 20.779236278031874], [95.03808493876898, 20.785951084075293], [95.03995015967217, 20.79378502356002], [95.03840954186694, 20.8044988503417], [95.04173194327461, 20.803894776622712], [95.05376173181855, 20.802176236044488], [95.06097960512471, 20.802176236044488], [95.06751006183993, 20.802176236044488], [95.07300939366866, 20.802176236044488], [95.07644647662363, 20.799770277975995], [95.07676727109276, 20.799481563223594], [95.07949762271716, 20.797024245772377], [95.07766052271501, 20.795295211005225], [95.07300325939298, 20.79021455855508], [95.07046293271821, 20.785768989347446], [95.06898107571612, 20.782381887114468], [95.06601736261126, 20.776666154119766], [95.06326534272142, 20.771797195784018], [95.06275487223962, 20.7691138553202], [95.05685510557873, 20.768492826682632], [95.05101206635385, 20.767117994399996], [95.04173194327461, 20.767117994399996], [95.03834811097659, 20.76694880314477], [95.03677186203186, 20.777982542160657]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
