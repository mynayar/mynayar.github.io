
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mar Teit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mar Teit</div><div class="name-mm">မာတဲ့</div></div>
        <span class="pcode-badge">MMR015005017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.68590271663714, 22.802592716180982], [98.69659110519541, 22.795994945210623], [98.71386163810416, 22.79468088371584], [98.73845337642223, 22.7988107935833], [98.74688833912563, 22.799419875626825], [98.74697610486339, 22.798966590335908], [98.74829304598734, 22.79263527589734], [98.74840838403975, 22.792193311272342], [98.7498759031505, 22.78656989188704], [98.74995151814812, 22.786309396961144], [98.74995789883803, 22.78628741932897], [98.737596905273, 22.769993190433468], [98.72589085467928, 22.75020439211903], [98.72747314167219, 22.746050889437072], [98.72338241616563, 22.74379393644108], [98.7108402200002, 22.739891920176035], [98.70610205726422, 22.740728065747703], [98.69885545511522, 22.743515221250505], [98.68910041355332, 22.748532099177112], [98.68408353562671, 22.752712830632674], [98.67858810865437, 22.75071449387883], [98.67488592534522, 22.753548978002982], [98.66599464843432, 22.75979690190553], [98.66457345340223, 22.760795580151978], [98.66317987565083, 22.774452637079605], [98.66523924129802, 22.784937166417137], [98.66768173432462, 22.787735124576386], [98.67481521525002, 22.794117712962134], [98.67950829497187, 22.79674583775028], [98.68401365110918, 22.80106347120227], [98.68590271663714, 22.802592716180982]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
