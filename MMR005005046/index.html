
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yauk Thwar Aing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yauk Thwar Aing</div><div class="name-mm">ယောက်သွားအိုင်</div></div>
        <span class="pcode-badge">MMR005005046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.7554550000483, 22.8277022400664], [95.74371324007404, 22.823486370299804], [95.73370344036152, 22.824096660132795], [95.72528088020852, 22.824096660132795], [95.71508784003186, 22.83087159035165], [95.7094725604104, 22.841125469664746], [95.7135009602012, 22.849304220013778], [95.72467031967955, 22.849914509846826], [95.73132312016594, 22.85491940970303], [95.7306481681785, 22.860835826412313], [95.73066112920782, 22.860860260092977], [95.73240469162329, 22.863327621172857], [95.74547195067004, 22.864260995148868], [95.75542795743434, 22.864883245065755], [95.75885033377597, 22.864883245065755], [95.76198251508106, 22.867791698428164], [95.76378108003286, 22.86327483006943], [95.76491040009495, 22.86094742958028], [95.76690551997382, 22.85650170029328], [95.76820656018464, 22.846005540023725], [95.758967879664, 22.836030750019177], [95.75840447958313, 22.83542253042549], [95.75653860037619, 22.830538229655644], [95.7554550000483, 22.8277022400664]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
