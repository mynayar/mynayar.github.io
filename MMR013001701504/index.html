
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pauk Taw Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Insein</div><div class="name-mm">အင်းစိန်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pauk Taw Ward</div><div class="name-mm">ပေါက်တောရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013001701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10173564078724, 16.883066555077505], [96.10146517867514, 16.882976400740347], [96.10102986363734, 16.882859799140476], [96.10079893032645, 16.88279794197149], [96.10007319542171, 16.882571892878616], [96.09933556158694, 16.882464816897823], [96.09891891467623, 16.88227128998807], [96.09875697195673, 16.88266690535346], [96.09870052331058, 16.8830018047895], [96.09859085098702, 16.883302689167806], [96.09845161435061, 16.88363838180595], [96.09828186011981, 16.883943557749035], [96.0981362661758, 16.884229659970856], [96.09786987259662, 16.884862899603206], [96.0977668633501, 16.885257492439393], [96.09803962682736, 16.885358810061064], [96.09907531757193, 16.885746002376152], [96.09991455141545, 16.88603544288145], [96.10052995209566, 16.8862632123774], [96.10073624668053, 16.885705019371187], [96.10108126888554, 16.884919797011094], [96.10115096724343, 16.8843679244402], [96.10125459612277, 16.883954067226455], [96.1013693442199, 16.883730610879013], [96.10151428885342, 16.88350715363231], [96.10173564078724, 16.883066555077505]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
