
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Deit Pyar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Deit Pyar</div><div class="name-mm">ဒဲ့ပြား</div></div>
        <span class="pcode-badge">MMR009018028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.76254961876992, 21.22499516519474], [94.75574789415003, 21.224541717126613], [94.72990844991511, 21.22747801799619], [94.71816324733607, 21.226890758002128], [94.70700530475108, 21.224541717126613], [94.69237533425434, 21.221929221656296], [94.69215689162729, 21.222693746119546], [94.69042996577036, 21.222405883025147], [94.6871361286295, 21.2218568307282], [94.68626911382859, 21.223134538028546], [94.68395621490743, 21.22654302524046], [94.68228254240546, 21.230727148938797], [94.68328655722888, 21.237589176699203], [94.68278435871122, 21.243614348423478], [94.6819474667023, 21.248467949936014], [94.68039231675209, 21.250245270203095], [94.6826766388159, 21.251280129974077], [94.68249123368355, 21.251474211765526], [94.68880024223745, 21.256253763100744], [94.70406900478082, 21.265649924804222], [94.71992502821752, 21.26741170478641], [94.75516063415603, 21.261539103946518], [94.7560809805529, 21.261982234092898], [94.75632481913516, 21.25856850833003], [94.75812973509926, 21.25754833808537], [94.75776806914115, 21.256644174089388], [94.7582491533758, 21.245819795447233], [94.76017348671712, 21.23331162513142], [94.76254961876992, 21.22499516519474]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
