
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tat Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tat Gyi</div><div class="name-mm">တပ်ကြီး</div></div>
        <span class="pcode-badge">MMR010014041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07000590784645, 21.72306315963715], [96.07354632290452, 21.72306315963715], [96.07879473219117, 21.72233924136293], [96.08223334489298, 21.718900627761798], [96.08585293806271, 21.713471238906607], [96.08784371421609, 21.709127728362034], [96.08639841195719, 21.707953419714613], [96.08483547387806, 21.70990478577727], [96.08277506681594, 21.711278391384724], [96.08117252888917, 21.71242306107547], [96.07693724815556, 21.712651995193482], [96.07098496198648, 21.712651995193482], [96.06388800612666, 21.711392857994042], [96.06011059362908, 21.710934989758016], [96.05873698892094, 21.709332450931925], [96.05713445099417, 21.708073313732484], [96.05507430203744, 21.70747520611593], [96.0547244396812, 21.71202340235817], [96.05273366442714, 21.715642994628524], [96.05216669673575, 21.71734389590415], [96.05182876568506, 21.718357689056177], [96.05001896999954, 21.721072384383092], [96.05671521583463, 21.721434342620853], [96.0619636260206, 21.72288218006861], [96.06793595358147, 21.72306315963715], [96.07000590784645, 21.72306315963715]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
