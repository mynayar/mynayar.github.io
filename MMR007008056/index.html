
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htee Hpa Lo (Yae Pu)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htee Hpa Lo (Yae Pu)</div><div class="name-mm">ထီးဖလို (ရေပူ)</div></div>
        <span class="pcode-badge">MMR007008056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.0676738621591, 17.860667959958448], [97.07875676171523, 17.862076786614466], [97.09044421612771, 17.862076786614466], [97.09451480761231, 17.86658296293342], [97.09677624732603, 17.868995165894262], [97.1029575161765, 17.869447453836983], [97.11019412326021, 17.869145928242062], [97.11200327503116, 17.868392114704363], [97.11235536410885, 17.867655929677483], [97.11366166355498, 17.864924574409656], [97.11530382291318, 17.86144874056697], [97.11380229593925, 17.854111892349977], [97.11198174885868, 17.844098882957155], [97.1070529919021, 17.833793299820968], [97.09969305539028, 17.834313440712776], [97.08603895093688, 17.834768577707734], [97.06828861532739, 17.833403167622123], [97.05930724883052, 17.833028944430282], [97.06100642610573, 17.83840967276825], [97.06555779425685, 17.848877819156087], [97.0676738621591, 17.860667959958448]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
