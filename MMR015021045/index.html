
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mone Hit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mone Hit</div><div class="name-mm">မုန်းဟစ်</div></div>
        <span class="pcode-badge">MMR015021045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.79373134272737, 23.144974452309157], [98.80148097077023, 23.13748314463146], [98.80886432023226, 23.13119362528562], [98.81249912903166, 23.12710078187564], [98.80981330643903, 23.126002036964508], [98.8077225265734, 23.12029991161171], [98.80354096774153, 23.116118352779836], [98.80411118198555, 23.110986439872363], [98.80513993805778, 23.10810592035199], [98.80452919856373, 23.106397390127484], [98.80537925844607, 23.100252175997184], [98.80658210078337, 23.094450273561336], [98.80383032101258, 23.092669709439576], [98.80325881444281, 23.089872025573584], [98.80114138586634, 23.086481025678836], [98.79979087844634, 23.085622158735703], [98.79422749510286, 23.08418644684707], [98.79023435862882, 23.07961444015433], [98.78643459078381, 23.08019495883036], [98.78446806125208, 23.079539450185507], [98.75330659732168, 23.095120183050085], [98.75909507287935, 23.099472566305963], [98.76347039244473, 23.10111331103053], [98.7708537419067, 23.105488628797218], [98.77463271113078, 23.10899767190506], [98.77468214506501, 23.11287197915857], [98.77659634664417, 23.11779421243301], [98.78425315386005, 23.123810274924324], [98.78698772780143, 23.128732508198766], [98.78698772780143, 23.133107826864773], [98.79190996197525, 23.141858463297467], [98.79373134272737, 23.144974452309157]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
