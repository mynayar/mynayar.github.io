
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Taung</div><div class="name-mm">သပြေတောင်</div></div>
        <span class="pcode-badge">MMR008002028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4467007183635, 18.84642214366704], [95.4421996187175, 18.840517096187114], [95.4421996187175, 18.83614880662219], [95.4392874268733, 18.833236614778002], [95.42715329089174, 18.824500037446796], [95.40919477032247, 18.81964638287434], [95.39753450331472, 18.818559437068416], [95.39101171242066, 18.817733336923993], [95.39011472141732, 18.822397683306463], [95.38844888920494, 18.829346909332457], [95.38384265071784, 18.833747144615074], [95.389218713373, 18.835539166099693], [95.3886772297704, 18.837705096013394], [95.38888459904507, 18.837931107334782], [95.38909449811268, 18.838094362165123], [95.38942100687404, 18.838490838181713], [95.39023728102575, 18.839400399908584], [95.39210304871676, 18.841616000278236], [95.39354169689187, 18.843177959895], [95.3986388528009, 18.84181900154573], [95.40141148245402, 18.839183291875486], [95.40445795297222, 18.838122162008233], [95.40925015237269, 18.839662511815504], [95.4115435620858, 18.845584301973986], [95.41455580260828, 18.852240341818344], [95.41677855978276, 18.852240341818344], [95.42758378376465, 18.85099358468625], [95.43631108009231, 18.847668900799192], [95.4467007183635, 18.84642214366704]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
