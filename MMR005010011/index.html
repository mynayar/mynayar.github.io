
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Taing Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tabayin</div><div class="name-mm">ဒီပဲယင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Taing Lay</div><div class="name-mm">အင်တိုင်းလေး</div></div>
        <span class="pcode-badge">MMR005010011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26678272034633, 22.677307109735352], [95.25891095987294, 22.677307109735352], [95.25347891981636, 22.67810055010034], [95.24871828032445, 22.686706529682624], [95.24407967973349, 22.692871080136285], [95.24648088038839, 22.698814859618153], [95.25653063967735, 22.699890179887916], [95.26208508016236, 22.703674320213736], [95.26365791977724, 22.708453320264596], [95.26428215989381, 22.708496070437377], [95.2701893045928, 22.71297115629386], [95.27158096678824, 22.7117018261784], [95.27652847371013, 22.706593972833616], [95.28399547900818, 22.705893940552983], [95.28885625621132, 22.707697133416048], [95.28927904459232, 22.707674171026213], [95.28851303984499, 22.70288087984875], [95.28387444015334, 22.69128420030563], [95.28271488038746, 22.683898890321586], [95.28088392005691, 22.682495160123608], [95.2747192796711, 22.680297809696185], [95.26788323961989, 22.68072512976096], [95.2668136804071, 22.67733636018494], [95.26679207959086, 22.677336270252738], [95.26678272034633, 22.677307109735352]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
