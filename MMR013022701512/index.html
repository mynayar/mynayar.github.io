
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Taw Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingalartaungnyunt</div><div class="name-mm">မင်္ဂလာတောင်ညွန့်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyee Taw Ward</div><div class="name-mm">ကျီတော်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013022701512</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.17425170325356, 16.7829441656408], [96.17380332916036, 16.782850265627303], [96.17235088358649, 16.782589912794265], [96.17199587980605, 16.78247523484424], [96.17167186756268, 16.782370567247938], [96.17148904888057, 16.78229179383129], [96.17082328796442, 16.78200492898435], [96.17105388672758, 16.782371998069323], [96.17140388488144, 16.782752989558844], [96.17181301166124, 16.78316307141864], [96.17214727437727, 16.783476829592075], [96.17236010343606, 16.783671697390957], [96.17314338685787, 16.784473419612652], [96.17358207705126, 16.784902571596433], [96.17404937737695, 16.785320282405166], [96.17453002993699, 16.78574180633933], [96.17476081755774, 16.785951614575424], [96.17550086966946, 16.7866878508637], [96.1762307486502, 16.787464523369124], [96.17650195540097, 16.787154878694764], [96.17680168055318, 16.786906051573055], [96.176433563758, 16.786632538061212], [96.17610359170743, 16.786287308112833], [96.17575073281012, 16.78587245984619], [96.1755208975714, 16.78563880968335], [96.17527656526136, 16.785329056191017], [96.17483139005668, 16.784372330418762], [96.17453956634796, 16.783708572292824], [96.17434501690906, 16.783276748423248], [96.17425170325356, 16.7829441656408]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
