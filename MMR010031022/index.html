
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daing Kaung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daing Kaung Kone</div><div class="name-mm">ဒိုင်ကောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010031022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01351103020994, 21.199243235786753], [96.01078301772213, 21.201630246938407], [96.00876263318901, 21.208095477624227], [96.01037894063563, 21.21738924881481], [96.01159117189513, 21.222238172054062], [96.02209717344584, 21.226683019106076], [96.03058278866484, 21.227895250365577], [96.03098686575129, 21.23234009741759], [96.03058278866484, 21.23961348227641], [96.02730436500451, 21.246422516585938], [96.02735017287222, 21.246482790948107], [96.03421948244323, 21.248503174581913], [96.03906840568243, 21.248503174581913], [96.04108879021555, 21.246886868034608], [96.04108879021555, 21.240825712636592], [96.04270509766218, 21.233552327777772], [96.04189694438855, 21.227087096192577], [96.04189694438855, 21.22143001788106], [96.04189694438855, 21.214964787195242], [96.04593771435407, 21.209307708883728], [96.04578725957441, 21.20614817110129], [96.04512956018112, 21.2060750930911], [96.04397505460514, 21.205382390285138], [96.0370480211493, 21.201226169851907], [96.03219909701079, 21.197589476972837], [96.02492571215197, 21.19476093826671], [96.02459490463121, 21.194813170891166], [96.01724824930733, 21.195973168626892], [96.01351103020994, 21.199243235786753]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
