
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (107) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dagon Myothit (South)</div><div class="name-mm">ဒဂုံမြို့သစ် (တောင်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (107) Ward</div><div class="name-mm">အမှတ် (၁၀၇) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013018701527</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25377029186552, 16.878045024958], [96.25359548524352, 16.878199968253966], [96.25262466529614, 16.879013743189773], [96.25165384534876, 16.87977041207489], [96.25039798527888, 16.880837558406654], [96.25457440538457, 16.885535604184838], [96.25580024698388, 16.88455009471113], [96.25746663407796, 16.883178076407148], [96.25828743002091, 16.882505416791616], [96.25963974058163, 16.881393432960635], [96.26038932820501, 16.880792616586064], [96.26157188543425, 16.879833221625915], [96.26241031438457, 16.879138646431443], [96.25885266561806, 16.875128260960537], [96.25821418743487, 16.8744085308291], [96.25792134479428, 16.87465933016398], [96.25656505203557, 16.875715809636972], [96.25572272272552, 16.876401094834705], [96.25492322362794, 16.877129210244902], [96.25422366169272, 16.87764317369357], [96.25377029186552, 16.878045024958]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
