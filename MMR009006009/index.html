
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mei Za Li Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mei Za Li Pin</div><div class="name-mm">မယ်ဇလီပင်</div></div>
        <span class="pcode-badge">MMR009006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.34766541232898, 20.438310734952495], [95.33396140989123, 20.431291611818494], [95.33050022600469, 20.42783042793195], [95.3230834019775, 20.42634706276681], [95.31881547585357, 20.42634706276681], [95.30182184330346, 20.42634706276681], [95.30033847813831, 20.433269432338477], [95.29489947373179, 20.441180709921866], [95.2899549246801, 20.45453099101246], [95.2899549246801, 20.463908584413673], [95.2899549246801, 20.464914543571354], [95.29885511297317, 20.46442008911589], [95.30182184330346, 20.466892363192073], [95.30083293259383, 20.486670559398874], [95.30231629685966, 20.492109562006704], [95.3039387268908, 20.493948316761475], [95.30627193610104, 20.49161510755124], [95.33346695543571, 20.487659468309857], [95.33099467956089, 20.468375728357216], [95.33099467956089, 20.458981084709364], [95.33940041339844, 20.448597533049735], [95.34640175243896, 20.448058967747215], [95.34766541232898, 20.438310734952495]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
