
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pwint Hlet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pwint Hlet</div><div class="name-mm">ပွင့်လျက်</div></div>
        <span class="pcode-badge">MMR005029025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.51668095995842, 22.868109089862685], [94.51668095995842, 22.86331515027399], [94.52059632036395, 22.86331515027399], [94.53017628011128, 22.86331515027399], [94.52960208007198, 22.85728532995404], [94.52908944042537, 22.856089770326662], [94.52184947976974, 22.839195869893558], [94.51840356007631, 22.837870530001], [94.51065095977401, 22.834888920387414], [94.50692819997653, 22.835326859646898], [94.49600724044183, 22.8366117003697], [94.48480908017495, 22.8358651497569], [94.48480908017495, 22.84436429977268], [94.48713647976479, 22.850182530299605], [94.4872772398528, 22.85053470031619], [94.48732692020127, 22.85065917008467], [94.48567055964867, 22.85728532995404], [94.48507152033443, 22.86327518979823], [94.48567055964867, 22.86331515027399], [94.48567055964867, 22.864176629747703], [94.49859132003343, 22.864176629747703], [94.50081491267815, 22.864660010850855], [94.51668095995842, 22.868109089862685]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
