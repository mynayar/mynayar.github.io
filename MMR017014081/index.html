
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Beit Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Beit Ka Lay</div><div class="name-mm">ကံဘဲ့ကလေး</div></div>
        <span class="pcode-badge">MMR017014081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.04663156039823, 16.467638400192072], [95.04349776031347, 16.472586780355698], [95.0421779998149, 16.47901971009162], [95.04333251978, 16.484133060092688], [95.04531215962851, 16.488421739871455], [95.05042559956183, 16.492050540300227], [95.05242660910079, 16.492366594442842], [95.05189208265352, 16.489753355233233], [95.05103547660605, 16.485851038594603], [95.04989333490954, 16.48175836605577], [95.04998851375899, 16.47833194186569], [95.05074994095708, 16.475476588973436], [95.05141619020509, 16.47490551857487], [95.05259064004605, 16.47506898024926], [95.05550886274386, 16.475381410124044], [95.05864975128503, 16.475666945772957], [95.06207617457585, 16.475952481421928], [95.06551686201362, 16.476498621714086], [95.06520921563288, 16.475643809814017], [95.06081699960492, 16.46879301008937], [95.05256975958679, 16.467473430354573], [95.04663156039823, 16.467638400192072]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
