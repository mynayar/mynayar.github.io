
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Einme</div><div class="name-mm">အိမ်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Kwin</div><div class="name-mm">သပြေကွင်း</div></div>
        <span class="pcode-badge">MMR017015031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17441031958066, 16.797870090432355], [95.17605047974592, 16.801625429969647], [95.17758372041243, 16.805364210290122], [95.179873319698, 16.805331269922192], [95.1819728400746, 16.806184200440555], [95.18560595994717, 16.806058110093772], [95.18912819970672, 16.8041826899792], [95.19140267959006, 16.80442101032139], [95.1938305199626, 16.80220709977789], [95.19737795962521, 16.80251931021803], [95.19911208005851, 16.80320097024861], [95.20019712020098, 16.802751689638797], [95.20100676005399, 16.80204294022957], [95.20226352034524, 16.800716610183485], [95.20270847971261, 16.799899050001216], [95.20413228008073, 16.797283289991867], [95.2025310003055, 16.793194140097512], [95.19841692030468, 16.79253218960889], [95.19396335972135, 16.791905880152285], [95.19006635987466, 16.791418710205335], [95.18665571968575, 16.791609870099478], [95.18401223987303, 16.792462529921863], [95.18220288035872, 16.792880130113986], [95.18101992023321, 16.79357601022474], [95.17934988009296, 16.794828540105073], [95.17599287996751, 16.796985750192277], [95.17441031958066, 16.797870090432355]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
