
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Ta Chan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Ta Chan</div><div class="name-mm">ညောင်တခြမ်း</div></div>
        <span class="pcode-badge">MMR013004028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.30417681320944, 17.104636334399345], [96.29462525764956, 17.100908897227896], [96.28700717614032, 17.09768586281234], [96.28349113900492, 17.095634841075082], [96.27792407923295, 17.094755831116743], [96.27294302490071, 17.095634841075082], [96.27001299410443, 17.099150878210537], [96.26678995878962, 17.101201899947796], [96.26542388230638, 17.101429580410866], [96.26691463090555, 17.10349369267982], [96.26704830523516, 17.106300841910354], [96.26704830523516, 17.10991003262194], [96.2681176953754, 17.112850855282772], [96.26317176586434, 17.11298452871307], [96.25889420710206, 17.1140539188533], [96.25595338534055, 17.115925351373903], [96.25581971101093, 17.118999846565714], [96.25795849129139, 17.121673322366007], [96.25889420710206, 17.12474781665844], [96.26156768200298, 17.127688640218594], [96.2626370721432, 17.13116415660062], [96.2611666599135, 17.134773348211525], [96.25969624858305, 17.137179475352582], [96.26349357386943, 17.138055781049502], [96.27236554863123, 17.13330293688108], [96.27363297398261, 17.12886694905052], [96.283455517758, 17.121579255078586], [96.29201063708132, 17.10953871693829], [96.29644662491188, 17.108271291586902], [96.30183318175597, 17.106687009897655], [96.30417681320944, 17.104636334399345]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
