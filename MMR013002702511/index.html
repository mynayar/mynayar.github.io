
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zay Paing Ward (Htauk Kyant Zay)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingaladon</div><div class="name-mm">မင်္ဂလာဒုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Zay Paing Ward (Htauk Kyant Zay)</div><div class="name-mm">ဈေးပိုင်းရပ်ကွက် (ထောက်ကြံ့ဈေး)</div></div>
        <span class="pcode-badge">MMR013002702511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13891640926494, 17.041428770421476], [96.13801650535748, 17.04124011334062], [96.13725507726008, 17.041097345965795], [96.135915440845, 17.04061550540132], [96.13540742641163, 17.04041087096499], [96.13495532822589, 17.040208617034125], [96.13455082036415, 17.040089643921988], [96.13414631160305, 17.039923082284474], [96.13358199871033, 17.039677633016424], [96.13345877989883, 17.039957442681896], [96.13315896841175, 17.040585620030413], [96.1325621603155, 17.041880838929615], [96.13265730319205, 17.041948387907837], [96.13590621020347, 17.044317382940903], [96.13606537941376, 17.044433444048252], [96.13643796494017, 17.04470512114449], [96.13735340463597, 17.045372630342683], [96.13891640926494, 17.041428770421476]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
