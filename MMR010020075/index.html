
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Shan Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Shan Taung</div><div class="name-mm">ငါးရှန်တောင်</div></div>
        <span class="pcode-badge">MMR010020075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.06372927058942, 20.67912868064417], [95.06957231071362, 20.673285639620644], [95.07575906003268, 20.670879683350734], [95.07816501810117, 20.66744260039576], [95.08400805822538, 20.664692934031734], [95.08778884857657, 20.656443935839036], [95.09319635512776, 20.64934658427751], [95.09122593243092, 20.647507521055275], [95.08744514118035, 20.641664480931126], [95.08435176562153, 20.636852564794083], [95.08297693333884, 20.630665817273723], [95.07953985128319, 20.626541317727686], [95.07472793514614, 20.626541317727686], [95.06854118672646, 20.626541317727686], [95.06269814570294, 20.626541317727686], [95.06166702171572, 20.632728066147365], [95.05994848023823, 20.638227397976095], [95.05651139818252, 20.642695605817607], [95.0534180226237, 20.6471638127598], [95.05307431522755, 20.652319437192318], [95.050668357159, 20.657475060725517], [95.0534180226237, 20.661599560271554], [95.05685510557873, 20.669161140973927], [95.06166702171572, 20.676035306883932], [95.06372927058942, 20.67912868064417]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
