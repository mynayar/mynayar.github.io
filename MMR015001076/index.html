
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mong Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mong Lin</div><div class="name-mm">မိုင်းလင်း</div></div>
        <span class="pcode-badge">MMR015001076</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.04887214513343, 23.19171933358041], [98.0494188771795, 23.191701121409665], [98.05801263587449, 23.19717038440575], [98.0646531848966, 23.20459284358492], [98.0702333226098, 23.20778179729217], [98.07559071533927, 23.210843452863116], [98.07608554211413, 23.211272342244854], [98.09272360790823, 23.152509347428463], [98.10056415291336, 23.124507400596087], [98.10362851724233, 23.099154191912476], [98.10168423064277, 23.100239046794627], [98.0860031406325, 23.099865687851263], [98.077789236684, 23.10173248436672], [98.06024135015826, 23.11405334118882], [98.05650775712735, 23.116293495748266], [98.05501431955526, 23.121147167407912], [98.05464096061189, 23.12674755695423], [98.05688111697003, 23.135334819846094], [98.05576103924062, 23.14018849060642], [98.05277416499575, 23.157736377132153], [98.04887214513343, 23.19171933358041]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
