
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Na</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Na</div><div class="name-mm">သန</div></div>
        <span class="pcode-badge">MMR005006046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68132020016714, 22.42879091966529], [95.67652139974285, 22.421592540063727], [95.67315359965897, 22.41233154016851], [95.66515547994152, 22.411489590372355], [95.65421039969027, 22.416120089870276], [95.64705431970117, 22.416120089870276], [95.64316595964141, 22.4187123595878], [95.64200279988938, 22.41948780002201], [95.64073991971156, 22.42832787043494], [95.63842979969559, 22.43294756997443], [95.63989787998321, 22.433379390246728], [95.64159455984111, 22.437832680134136], [95.644949399795, 22.435484220220644], [95.65336871969072, 22.42874888984943], [95.65926192040138, 22.429169820231095], [95.66726004011883, 22.433379390246728], [95.6710486797528, 22.43464227042449], [95.67652139974285, 22.435484220220644], [95.67995111994827, 22.43423699993764], [95.68073087982629, 22.429169820231095], [95.68132020016714, 22.42879091966529]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
