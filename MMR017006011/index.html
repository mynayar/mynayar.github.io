
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Ngu</div><div class="name-mm">ညောင်ငူ</div></div>
        <span class="pcode-badge">MMR017006011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08257432034867, 17.323083899602352], [95.0803066798095, 17.32325643004026], [95.0776221603345, 17.324426699832372], [95.07555684027602, 17.32607874004185], [95.07390480006654, 17.32793733024363], [95.07080735957203, 17.33014017013278], [95.06819159956274, 17.331241499695523], [95.06516255970445, 17.333581950246867], [95.06234052039878, 17.335578240143718], [95.06227140030495, 17.33736798004827], [95.06179296007713, 17.33706176358959], [95.06382047983135, 17.342943749754284], [95.07249360009962, 17.339914889760394], [95.08047875968708, 17.335784700203817], [95.08064148032014, 17.33722227009173], [95.0854244517771, 17.33474405329548], [95.09022361732616, 17.33225745211979], [95.09288724015408, 17.330877359702413], [95.0941771197783, 17.330208929598484], [95.09541623986763, 17.325528120226636], [95.0916992402278, 17.323600679727633], [95.09185944006117, 17.323193519765198], [95.08940027989905, 17.32302954008128], [95.0840279997924, 17.32328540979387], [95.08257432034867, 17.323083899602352]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
