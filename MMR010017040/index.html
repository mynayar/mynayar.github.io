
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Pin Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee Pin Kan</div><div class="name-mm">ကျီးပင်ကန်</div></div>
        <span class="pcode-badge">MMR010017040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.47669281721977, 21.511033946159728], [95.47871349583124, 21.51353007835047], [95.4808530378375, 21.51638280162507], [95.48156621910579, 21.51828461684164], [95.48323030843204, 21.52280142944244], [95.48323030843204, 21.5249409714487], [95.48988666213978, 21.52755596793361], [95.49678074263721, 21.52898232867159], [95.50248619008568, 21.52898232867159], [95.50676527499752, 21.52898232867159], [95.51056890633004, 21.528269149201947], [95.51365935639421, 21.52565415181772], [95.5165120787695, 21.523514609811457], [95.51746298682741, 21.521850521384522], [95.52007798331232, 21.52161279369551], [95.51556117161084, 21.519948706167895], [95.51151981438801, 21.52089961332655], [95.50914254379342, 21.519235524899614], [95.50866709021409, 21.513767805140162], [95.50724072857685, 21.507586905011692], [95.50652754820783, 21.503783273679176], [95.50585631941368, 21.502105200794404], [95.49975233020592, 21.504139863863657], [95.49380915686714, 21.50437759065335], [95.48834143710769, 21.50437759065335], [95.48311144413788, 21.50437759065335], [95.4771682707991, 21.504615318342303], [95.47645509043014, 21.507705768406538], [95.47669281721977, 21.511033946159728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
