
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Pin Lel Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Pin Lel Kyin</div><div class="name-mm">ညောင်ပင်လယ်ကျင်း</div></div>
        <span class="pcode-badge">MMR009010054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.62405560558182, 20.674102599955063], [94.61965443860151, 20.66891550914346], [94.6179278329032, 20.669107354321], [94.60000844723209, 20.67499865926078], [94.58724395214671, 20.69046333461523], [94.58086170460405, 20.70200047364301], [94.57865246603853, 20.70592800996974], [94.5705519207346, 20.71108290235412], [94.55336894761888, 20.71427402612545], [94.55091423820159, 20.716728736442064], [94.55214159335992, 20.71991986021345], [94.55705101399315, 20.722374569630745], [94.56466061579482, 20.721392686223567], [94.56957003732742, 20.72090174362063], [94.57030644988282, 20.724829280846677], [94.56490608664666, 20.736611890726238], [94.57398851625709, 20.738084716736353], [94.58184358891054, 20.71771062074862], [94.59239884363177, 20.698318408168063], [94.59902656292559, 20.68997239291167], [94.60565428132008, 20.68432655882367], [94.61498217998366, 20.67843525298457], [94.62259178268471, 20.674753188408943], [94.62405560558182, 20.674102599955063]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
