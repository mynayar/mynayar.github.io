
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyo Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyo Chaung</div><div class="name-mm">ကြိုချောင်း</div></div>
        <span class="pcode-badge">MMR013005046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88516267102051, 17.557526809414753], [95.88671433969506, 17.555328610926722], [95.88824542019006, 17.54843875094764], [95.88703888523645, 17.54861111321236], [95.88005381313303, 17.54702359576237], [95.8752912643804, 17.547341099612083], [95.8699109659184, 17.54924018808424], [95.86380553869469, 17.556871971664236], [95.86227918233845, 17.559543096636673], [95.86266077097787, 17.565648524759638], [95.86380553869469, 17.570227595627102], [95.86205482487031, 17.573179245226015], [95.86232610806348, 17.573256204710106], [95.8631305687208, 17.573484421169155], [95.86420250484178, 17.574239731178693], [95.86421308716427, 17.57446121531291], [95.86660554820753, 17.574350331602545], [95.86726953116397, 17.576445673728927], [95.87040276557525, 17.576445673728927], [95.87275269498093, 17.572920780969298], [95.87521567816106, 17.571943234992375], [95.8763294219653, 17.57158470227222], [95.87725639276834, 17.571302414075205], [95.87909507827533, 17.57133293166953], [95.88335238970109, 17.56282834615132], [95.88516267102051, 17.557526809414753]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
