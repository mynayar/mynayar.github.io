
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Le Zee Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pakokku</div><div class="name-mm">ပခုက္ကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Le Zee Taw</div><div class="name-mm">ရေလဲဇီးတော</div></div>
        <span class="pcode-badge">MMR009018023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.9655008560797, 21.273146689568136], [94.97464457178961, 21.269717796738973], [94.9796480057509, 21.26995605592731], [94.98373968274024, 21.257271855911483], [94.98565444279836, 21.24626198490273], [94.99136610726009, 21.244834070136278], [94.99225557093791, 21.244188425255686], [94.99969872981256, 21.243798402774132], [94.99708463264972, 21.239268397118906], [94.99482418938487, 21.237369469625378], [94.9929007301846, 21.235753633423485], [94.98554372456329, 21.233438449325035], [94.98142451842682, 21.23226095078229], [94.97196806077744, 21.2295578818908], [94.9649519629628, 21.22755218688394], [94.96437896981365, 21.231434385688374], [94.96363470168018, 21.23381604407524], [94.96794291203582, 21.242432464786475], [94.9660281519777, 21.25104888639703], [94.9645920821589, 21.257271855911483], [94.960283870904, 21.265888276622718], [94.96066204481758, 21.26641443218034], [94.9655008560797, 21.273146689568136]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
