
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htein Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chauk</div><div class="name-mm">ချောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htein Kan</div><div class="name-mm">ထိန်ကန်</div></div>
        <span class="pcode-badge">MMR009003039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.90401722861225, 20.838435331625305], [94.90541625805395, 20.83539038635729], [94.9044086783179, 20.828538841094712], [94.90380412975685, 20.82732974487186], [94.89937077693986, 20.825113068013707], [94.88848891183386, 20.822493359980626], [94.87780856321467, 20.81926910428581], [94.86712821279684, 20.81644787886654], [94.86350092502772, 20.813223623171723], [94.86269486087917, 20.805364498173105], [94.8638635469652, 20.802693214020678], [94.86309789295348, 20.80214024067959], [94.85866454013649, 20.803349336902443], [94.8528205746099, 20.80677510998339], [94.84576751375982, 20.81362665524597], [94.84435690194954, 20.817656975089392], [94.84469890063383, 20.82301495867347], [94.85268531567482, 20.825267538266303], [94.86052640656845, 20.828698014801603], [94.86640722541318, 20.826247674290812], [94.87865892886651, 20.82918808326349], [94.8958113142408, 20.833598696722504], [94.90120206372433, 20.838009310181576], [94.90051824801878, 20.83829423339222], [94.90267226910998, 20.838499377744142], [94.90401722861225, 20.838435331625305]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
