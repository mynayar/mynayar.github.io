
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Gar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Gar Ma</div><div class="name-mm">တံခါးမ</div></div>
        <span class="pcode-badge">MMR010020061</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11197610241527, 20.810425234237243], [95.10841134360868, 20.810425234237243], [95.10222459608832, 20.808019277068013], [95.09741267995128, 20.80595702729505], [95.09225705641808, 20.80458219411304], [95.08435176562153, 20.80251994434002], [95.08125839186135, 20.802176236044488], [95.07676727109276, 20.799481563223594], [95.07644647662363, 20.799770277975995], [95.07300939366866, 20.802176236044488], [95.06751006183993, 20.802176236044488], [95.06854118672646, 20.808019277068013], [95.06854118672646, 20.81420602458843], [95.06854118672646, 20.82008535505514], [95.07542053183215, 20.822191276806052], [95.08265072764902, 20.82339630899253], [95.08706918139768, 20.823998825985086], [95.09329518342605, 20.826208051960066], [95.0981153139706, 20.826810568952624], [95.10052537924292, 20.823998825985086], [95.10393963920302, 20.819178695440485], [95.10755473666183, 20.815161919387094], [95.11137067431724, 20.813956887200618], [95.11217402880845, 20.811546821029026], [95.11197610241527, 20.810425234237243]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
