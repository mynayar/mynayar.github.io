
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (13) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlaingtharya (West)</div><div class="name-mm">လှိုင်သာယာ (အနောက်ပိုင်း)</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (13) Ward</div><div class="name-mm">အမှတ် (၁၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013047701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05099267227405, 16.876861247348756], [96.0502160393388, 16.87694676658009], [96.04981041002247, 16.876916885705782], [96.04950618736069, 16.87690162690859], [96.04924297378426, 16.876921653911268], [96.04885215720134, 16.877006149714077], [96.04834461221412, 16.877221584108895], [96.04797077213351, 16.877455711811706], [96.04768435155165, 16.877574284725483], [96.04724502643688, 16.8775424945905], [96.04621251389648, 16.884469985801275], [96.04623031597635, 16.88631312025433], [96.04636605604873, 16.886531511620035], [96.04834175057141, 16.885751723862995], [96.04992603765658, 16.885130161028144], [96.05099267227405, 16.876861247348756]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
