
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Na Gar Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Na Gar Pauk</div><div class="name-mm">နဂါးပေါက်</div></div>
        <span class="pcode-badge">MMR005003006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.37443717203791, 21.71038239413224], [95.36913684039291, 21.712601789640928], [95.35862052002102, 21.71717405983503], [95.35450571966328, 21.718774350356057], [95.3599921201403, 21.72334661965084], [95.36410728022685, 21.725861400183533], [95.36519844025588, 21.727845360375113], [95.36707943976438, 21.726089999753754], [95.37279480043975, 21.724261109662507], [95.37988176033502, 21.724261109662507], [95.3824593234391, 21.72220049575634], [95.38150726065163, 21.721080194995068], [95.38113959981274, 21.72064779016341], [95.3800866573734, 21.719789265862005], [95.37779774427054, 21.717023619444547], [95.37697002984305, 21.716054671885672], [95.37651986969627, 21.71476550632309], [95.3763596608697, 21.71374687212051], [95.37556635540307, 21.712396465424604], [95.37534493602004, 21.711877518832466], [95.37443717203791, 21.71038239413224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
