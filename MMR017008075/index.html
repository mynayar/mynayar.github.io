
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Waing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Waing</div><div class="name-mm">ညောင်ဝိုင်း</div></div>
        <span class="pcode-badge">MMR017008075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.39384328004337, 17.638772490258248], [95.39569332039048, 17.638644870164683], [95.40118007969699, 17.636092919752514], [95.40896364006, 17.632520100322438], [95.41051739965832, 17.631324990356063], [95.41433016000894, 17.628370110392325], [95.41541359755956, 17.627406896011507], [95.41604556015454, 17.62684505985169], [95.41611756797147, 17.626413388866865], [95.41623636031983, 17.625701249912822], [95.41594015241617, 17.62430612442813], [95.41290023975432, 17.6225557496482], [95.40822959991618, 17.620077510368844], [95.40403559986311, 17.617599270190226], [95.40108071989937, 17.61855245982821], [95.39709695975694, 17.618484239955762], [95.39594855967835, 17.62052579992576], [95.39480015959975, 17.62397100016159], [95.3927585996297, 17.62588502997022], [95.39109972007606, 17.62690580995519], [95.38739964028122, 17.627926589940216], [95.38650648038981, 17.630606160446007], [95.38739964028122, 17.632647720416003], [95.38931340029325, 17.634178889943882], [95.39263116029986, 17.635327290022474], [95.39363843966231, 17.638190459821885], [95.39384328004337, 17.638772490258248]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
