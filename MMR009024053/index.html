
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Ma</div><div class="name-mm">တောမ</div></div>
        <span class="pcode-badge">MMR009024053</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.13410020196278, 21.92655779790408], [94.13625762069267, 21.926318085411367], [94.14160257759693, 21.927532848262388], [94.14719048725124, 21.92874761111341], [94.15180658590526, 21.92996237396443], [94.15763744741031, 21.929233515714202], [94.1605528777132, 21.931905994166357], [94.16201059331428, 21.93603618821959], [94.16516897726655, 21.935793234570156], [94.17051393327148, 21.930934184065393], [94.17460446092718, 21.929911552376268], [94.17415822182454, 21.92728989641165], [94.17148574427176, 21.91805769820428], [94.17099983787227, 21.912955694050083], [94.17030301886928, 21.898787020904365], [94.17027098142074, 21.898135587087722], [94.16030992496314, 21.899350349938743], [94.15132068040515, 21.904938258693733], [94.14524686614999, 21.909068452746965], [94.13771533719313, 21.912712741300027], [94.13018380733689, 21.913441598650934], [94.13018189357956, 21.91347029421877], [94.12994085368751, 21.917085888103315], [94.13115561743786, 21.920730175757058], [94.13309923763978, 21.923888559709326], [94.13410020196278, 21.92655779790408]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
