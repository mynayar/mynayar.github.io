
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Thein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Thein</div><div class="name-mm">စသိန်း</div></div>
        <span class="pcode-badge">MMR009021028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.40781005199239, 21.589077089036493], [94.41220349829285, 21.594349225136682], [94.41602446495716, 21.611270651119696], [94.41655114661819, 21.616713031581185], [94.41711616997532, 21.616183322802158], [94.43294589094018, 21.602537011873665], [94.44004197265895, 21.61017894610154], [94.4504131694323, 21.602537011873665], [94.45559671961297, 21.60435125470667], [94.45532584111476, 21.591619962591267], [94.45455351773074, 21.58428289314105], [94.45423413609655, 21.581248766717238], [94.45477998860565, 21.561598079088128], [94.45532755162526, 21.55228949786209], [94.45259657856928, 21.552864439842097], [94.44277123520442, 21.562689784106283], [94.43294589094018, 21.56323563571607], [94.42312054667593, 21.559960520661548], [94.41657031836559, 21.57906535668093], [94.41274935080196, 21.583432175854284], [94.40781005199239, 21.589077089036493]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
