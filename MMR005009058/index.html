
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htan Gyi</div><div class="name-mm">ထန်းကြီး</div></div>
        <span class="pcode-badge">MMR005009058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.26401318526035, 22.72205621911928], [95.26277809233517, 22.723192505329905], [95.26421628005733, 22.73145875971403], [95.26521996033296, 22.736879460218972], [95.26369355990994, 22.741763580225097], [95.26827239965161, 22.74542667000486], [95.27224104039175, 22.74603713970231], [95.27468292008075, 22.750921259708434], [95.2749882003452, 22.75519482008491], [95.27520239997085, 22.758191909728907], [95.27824439995914, 22.756110570046815], [95.28434928039502, 22.750310700078785], [95.28469271979327, 22.75047332988032], [95.28557039965426, 22.74542667000486], [95.28709644034848, 22.735353239660355], [95.28820631976589, 22.73518881031538], [95.28618096018323, 22.731690149880535], [95.28337847663545, 22.730055426117076], [95.27885459985998, 22.72741659040338], [95.27100407957465, 22.724668889957343], [95.26401318526035, 22.72205621911928]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
