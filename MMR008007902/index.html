
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thayarwady</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayarwady</div><div class="name-mm">သာယာဝတီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name"></div><div class="name-mm"></div></div>
        <span class="pcode-badge">MMR008007902</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96020662703427, 17.671075601258053], [95.96077530613553, 17.670129574720136], [95.96124993863384, 17.669072177938688], [95.96144301228526, 17.66864204659322], [95.96118420358818, 17.66769763074109], [95.96106142094789, 17.667249584001127], [95.96042408580297, 17.66573882458715], [95.96004347202864, 17.665474653232707], [95.95343354042564, 17.666526227803217], [95.94775454833382, 17.666917882554287], [95.94599210285332, 17.665351264449328], [95.94560044810225, 17.658301480728824], [95.94187972976579, 17.65458076329162], [95.94232810206034, 17.64819146056749], [95.94064665761721, 17.63855806040624], [95.92793415144001, 17.63432014735696], [95.92728576992238, 17.634103998900457], [95.92955589259043, 17.647829056266005], [95.9310006588534, 17.656795333038247], [95.93257307129028, 17.677236683026536], [95.9360323755937, 17.69013045835402], [95.93697582287598, 17.6923318341469], [95.94766822241058, 17.69296079930149], [95.95404505063863, 17.695548272035182], [95.95427234978916, 17.693275281429123], [95.9586751031735, 17.681953917639248], [95.96020662703427, 17.671075601258053]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
