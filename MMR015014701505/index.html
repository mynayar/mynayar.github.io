
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Tein (North) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Pan Tein (North) Ward</div><div class="name-mm">ပန်းတိမ်မြောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR015014701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.29999001764423, 22.61539721200012], [97.29999905400007, 22.616309902000125], [97.29999905400007, 22.6165982870001], [97.2999958850001, 22.61722259200019], [97.2999958850001, 22.61754266800017], [97.30002123800011, 22.61796732200014], [97.30008301283425, 22.618180954803506], [97.30077547500008, 22.618182818000037], [97.30163112200012, 22.618195495000123], [97.30310790500016, 22.61822084700009], [97.30429230892656, 22.618242679763227], [97.30447060200004, 22.61799901300003], [97.30453081400003, 22.617888096000172], [97.30458151900007, 22.617764502000057], [97.3046322240001, 22.617640909000045], [97.30479384600011, 22.617419074000054], [97.3050758930001, 22.61711167500016], [97.30517096500017, 22.61693103900012], [97.30532941800004, 22.61668702100019], [97.30544350400004, 22.616452510000045], [97.30557026700018, 22.616214830000104], [97.30576041100011, 22.615859895000142], [97.30609612849338, 22.615314386497232], [97.30381460600012, 22.615305309000064], [97.30294945200012, 22.615298971000072], [97.30215381900013, 22.615315212999974], [97.30175768600009, 22.615315212999974], [97.30146058600019, 22.61533006800005], [97.30101493699999, 22.615344923000123], [97.30059899700007, 22.615374632000055], [97.30037122100003, 22.61538948700013], [97.30006243500009, 22.61539721200012], [97.29999001764423, 22.61539721200012]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
