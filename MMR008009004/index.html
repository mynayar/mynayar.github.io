
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Yae Kyaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Yae Kyaw</div><div class="name-mm">လက်ပံရေကျော်</div></div>
        <span class="pcode-badge">MMR008009004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.6700300446509, 18.040593055425234], [95.66251475295354, 18.03444418015482], [95.65593243233593, 18.03444418015482], [95.64752168837526, 18.032250072682757], [95.64093936685833, 18.032250072682757], [95.63764820609987, 18.030055966110012], [95.63362567618407, 18.02383932872209], [95.63116500965754, 18.021043206978447], [95.62798551771755, 18.01653892732969], [95.62666073000872, 18.012034646781558], [95.6248060257775, 18.00779532359536], [95.61871200015872, 18.00488078991657], [95.61102822677128, 18.002231212700337], [95.60549184827022, 18.003373236585674], [95.60599403239871, 18.008060281856558], [95.60758377836873, 18.01176968941968], [95.60572907413751, 18.02157312260158], [95.60519915761512, 18.03270134529089], [95.60409400683301, 18.038275039361622], [95.60736045781891, 18.036062261064558], [95.61585677766823, 18.03254654588642], [95.62199346082963, 18.032546642113914], [95.62435303726289, 18.03254667898608], [95.6319703579457, 18.033425761789545], [95.64222437755302, 18.03840671000171], [95.64660025469806, 18.04650597467105], [95.65509918168198, 18.04699451968139], [95.6641974078841, 18.04162991888569], [95.6700300446509, 18.040593055425234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
