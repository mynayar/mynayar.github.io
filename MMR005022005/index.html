
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tigyaing</div><div class="name-mm">ထီးချိုင့်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pauk</div><div class="name-mm">ကံပေါက်</div></div>
        <span class="pcode-badge">MMR005022005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.10728840043942, 23.85738080987653], [96.11849196023581, 23.85471339011093], [96.1264944002964, 23.85738080987653], [96.1440998398358, 23.855780340390424], [96.1574371203269, 23.856847379702856], [96.16597307959398, 23.855780340390424], [96.1822699201208, 23.853311099727534], [96.18411204013859, 23.848311420435778], [96.17984388019096, 23.835507480186095], [96.17900255542366, 23.825829330659133], [96.17877719970807, 23.823237060042345], [96.1778286002098, 23.823237060042345], [96.16543956038748, 23.823237060042345], [96.1542359996917, 23.824837530427715], [96.14196576031162, 23.824837530427715], [96.13129571972172, 23.82643799991382], [96.12169272024289, 23.82377049021602], [96.11155656038699, 23.82270353993647], [96.10782191964591, 23.830172459891173], [96.10622136022766, 23.83870842005757], [96.09715187995533, 23.835507480186095], [96.09075000021238, 23.839775460269323], [96.08541515978186, 23.837641469778077], [96.07982616014925, 23.834084759903817], [96.08007995962248, 23.837641469778077], [96.0763456804089, 23.849378369815952], [96.0765469199045, 23.849814600363572], [96.07954644041592, 23.85631385959698], [96.09128352031826, 23.85738080987653], [96.10302060022059, 23.85738080987653], [96.10728840043942, 23.85738080987653]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
