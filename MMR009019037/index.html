
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Htaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yesagyo</div><div class="name-mm">ရေစကြို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Htaung</div><div class="name-mm">ရွာထောင်</div></div>
        <span class="pcode-badge">MMR009019037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.12835521382215, 21.738803522164858], [95.12812695779292, 21.736738613995897], [95.12376749687252, 21.707857186859712], [95.12227475987231, 21.697967803671247], [95.12225005189845, 21.69780411087106], [95.11235720721942, 21.692857687632227], [95.0999911513706, 21.689395193433484], [95.09924195944893, 21.68950222085084], [95.0971442098375, 21.689801898339], [95.09059294820605, 21.701266605969124], [95.08986341996092, 21.702847250800062], [95.09009830579225, 21.702750533210576], [95.09821236520855, 21.738452390865177], [95.0992828732061, 21.73779882205804], [95.09986239992986, 21.737695623054606], [95.10170308462972, 21.73736784624913], [95.10268552022063, 21.736475386929612], [95.1168793384108, 21.738512852286362], [95.12296832063157, 21.73878962584064], [95.12523856380875, 21.73765450515134], [95.12835521382215, 21.738803522164858]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
