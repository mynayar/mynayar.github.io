
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Soe Yein</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paukkhaung</div><div class="name-mm">ပေါက်ခေါင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Soe Yein</div><div class="name-mm">မစိုးရိမ်</div></div>
        <span class="pcode-badge">MMR008002038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40734452582927, 18.923106467589434], [95.41262270537362, 18.921227540118934], [95.4180253169149, 18.916656099099725], [95.42135000080197, 18.913331415212667], [95.42135000080197, 18.907097632249986], [95.42135000080197, 18.904604117985684], [95.41262270537362, 18.90044826267723], [95.39890838231605, 18.8987859207337], [95.3968304537625, 18.892967724381037], [95.39233641469383, 18.887565602070936], [95.39234754470351, 18.88583089707828], [95.39232868502086, 18.885819036819157], [95.38981605116987, 18.888105090977206], [95.38862137107947, 18.897363860553753], [95.38892004132691, 18.901843911567312], [95.38892004132691, 18.90632396168155], [95.39071206191221, 18.912596032381032], [95.39077638592153, 18.913110625355102], [95.39130940330637, 18.917374750944077], [95.39728280285914, 18.918270761686358], [95.39877615229767, 18.91797209323755], [95.40081463838493, 18.915269912876226], [95.40326408676827, 18.915920639825742], [95.40236019166957, 18.918270761686358], [95.40116551157917, 18.920361453418366], [95.40176285387264, 18.922153474003665], [95.40534689414392, 18.91916677332796], [95.40608942928378, 18.918823348318938], [95.40635036307884, 18.92204786571648], [95.40683441417696, 18.92251426402214], [95.40734452582927, 18.923106467589434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
