
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doe Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doe Tan</div><div class="name-mm">ဒိုးတန်း</div></div>
        <span class="pcode-badge">MMR012009028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.29700123761705, 21.04501514723131], [92.29856638263249, 21.04456299418689], [92.30250385466923, 21.05007545611744], [92.30817381576907, 21.056375412095633], [92.3082754283684, 21.05639573407592], [92.30817381576907, 21.0562179129264], [92.3144737717472, 21.04834296795366], [92.31767999873301, 21.04831484255601], [92.32864867179882, 21.04283050602311], [92.32990866335422, 21.03731804499182], [92.32912116930657, 21.03227807966971], [92.32535427527966, 21.0280403249011], [92.32486869893137, 21.028025610193822], [92.31746625056707, 21.02834060763297], [92.30974880476361, 21.03338057295514], [92.30722882165287, 21.037948040769493], [92.29888138097101, 21.036845548383383], [92.29641017888673, 21.038979768201784], [92.29541640464339, 21.039838027203245], [92.29700123761705, 21.04501514723131]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
