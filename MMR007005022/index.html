
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnget Pyaw Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaunglebin</div><div class="name-mm">ညောင်လေးပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnget Pyaw Taw</div><div class="name-mm">ငှက်ပျောတော</div></div>
        <span class="pcode-badge">MMR007005022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70655080587505, 17.96261724029347], [96.70381927523943, 17.963392085376483], [96.6972099857523, 17.963259899424884], [96.6929800406964, 17.961673668904723], [96.69086506906774, 17.96088055499365], [96.68753398830296, 17.96056330924938], [96.68536614103465, 17.96273115471905], [96.68457302622426, 17.96563924205742], [96.68457302622426, 17.96748984268214], [96.68483739812746, 17.971191044830903], [96.68615925584504, 17.975685360890736], [96.68695236975611, 17.979386563039498], [96.6885385993769, 17.98123716366422], [96.69271566969246, 17.98507055086526], [96.69694561474836, 17.984541807958124], [96.70196867371538, 17.984277436954187], [96.70595175127238, 17.98427145106666], [96.70830933211005, 17.980742515854445], [96.70733154511476, 17.9763424748254], [96.70733154511476, 17.9734091147389], [96.70659820464351, 17.971209095123697], [96.70659820464351, 17.969009073709856], [96.70684265116745, 17.96509792662806], [96.70655080587505, 17.96261724029347]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
