
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ohn Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpyu</div><div class="name-mm">ကျောက်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ohn Taw</div><div class="name-mm">အုန်းတော</div></div>
        <span class="pcode-badge">MMR012011007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.53741560064952, 19.374779422432425], [93.53495161112801, 19.379196826672285], [93.53311286086989, 19.385376423683056], [93.53312769518703, 19.389933525911545], [93.53313391579763, 19.39184456817236], [93.53268017005388, 19.39522700382321], [93.53222640722299, 19.398609436776155], [93.53331469122008, 19.399782284025264], [93.53410897604846, 19.405807132892903], [93.5350476821049, 19.40859745490866], [93.53815742712362, 19.41196936939093], [93.5386982443286, 19.4115267536568], [93.53923905793624, 19.41108413702335], [93.54032067885629, 19.410198898360534], [93.54502916216614, 19.406656158554938], [93.5454207063006, 19.40636155414245], [93.5466562066187, 19.40518180819396], [93.54676632500593, 19.405256764887838], [93.55195526392436, 19.39869716294379], [93.56168110989535, 19.391351046313787], [93.56406083833707, 19.387626254048428], [93.56429625656705, 19.38731592858727], [93.56393114710482, 19.38620286197255], [93.56362988770923, 19.385284423937037], [93.56082795004994, 19.381323969725486], [93.55539532183667, 19.378106538985662], [93.5466552038746, 19.373426586667676], [93.54484684260774, 19.37358128714675], [93.53741560064952, 19.374779422432425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
