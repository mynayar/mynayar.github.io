
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Ae Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Ae Pin</div><div class="name-mm">သစ်အယ်ပင်</div></div>
        <span class="pcode-badge">MMR014006002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.70728064438629, 20.94059954093609], [96.71137979743975, 20.93786677193401], [96.72202619665171, 20.933664246307956], [96.72112959415551, 20.931079631619752], [96.71800488082067, 20.915062968581196], [96.72659900643907, 20.904906260115865], [96.73402122729789, 20.8951401793758], [96.73675578595083, 20.88888984798814], [96.73684851324833, 20.8882779087985], [96.72987421322443, 20.88771242498848], [96.7149451453023, 20.888375939398145], [96.70166239160613, 20.888966284066782], [96.67501789495992, 20.892727860402488], [96.67504787206173, 20.893777059863453], [96.67533135995438, 20.903699122616445], [96.67513601191746, 20.90413865457532], [96.6772127848422, 20.917378079834577], [96.67752561311659, 20.9193723570487], [96.68160065264806, 20.933791732402597], [96.68190561095525, 20.937451230290094], [96.6994681393432, 20.939434096006778], [96.70699129201455, 20.94006102509627], [96.70728064438629, 20.94059954093609]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
