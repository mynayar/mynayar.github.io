
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Lu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Lu</div><div class="name-mm">ဝက်လူး</div></div>
        <span class="pcode-badge">MMR010019051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.76398183119659, 21.541035586822943], [95.75008304999284, 21.537783628411773], [95.7425417463046, 21.537783628411773], [95.73838102656316, 21.53284277377503], [95.73031963324456, 21.524781379557055], [95.71913770034467, 21.521400794710985], [95.71315666464841, 21.51593985134309], [95.71185644102201, 21.50891863728532], [95.71055621559691, 21.503197647753268], [95.70335747266927, 21.496082831357626], [95.69923336702635, 21.49979452679605], [95.6901603326333, 21.505155863951984], [95.68521140568191, 21.51340407613725], [95.68322013040478, 21.518653804729354], [95.68809827981181, 21.539385944206003], [95.6922223863541, 21.54763415639127], [95.69593408179247, 21.55711960008955], [95.7029450615654, 21.562893349248725], [95.70624434679922, 21.564542990966288], [95.71284291636755, 21.555057547268063], [95.7186166646274, 21.552583084241974], [95.728102109225, 21.551345851829637], [95.73758755202397, 21.55175826203424], [95.74294889007928, 21.555057547268063], [95.74520356599186, 21.55874701686139], [95.74666058641697, 21.556707189884946], [95.75119710226454, 21.552583084241974], [95.75614602921593, 21.545572102670462], [95.76191977837516, 21.54227281923528], [95.76398183119659, 21.541035586822943]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
