
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (14) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (14) Ward</div><div class="name-mm">အမှတ် (၁၄) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701514</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58807568094795, 17.250429117609713], [95.58788144177515, 17.25275003308758], [95.58890346372391, 17.252773146563527], [95.59109542541358, 17.25292566618657], [95.5912576046548, 17.25290776158397], [95.59241176399178, 17.25296144751286], [95.59245935791307, 17.25206214974844], [95.59313416151241, 17.25223259465855], [95.59317495565972, 17.251687170226774], [95.59246955622513, 17.251713142647475], [95.59248060439643, 17.25117421042154], [95.59249505290444, 17.250802476553076], [95.59308316905305, 17.250808969658294], [95.59311121531039, 17.250344706343185], [95.59288004817574, 17.250351199448346], [95.59214915206178, 17.250344706343185], [95.5917932516573, 17.250476582028682], [95.59134941554316, 17.250526515985996], [95.58992586788457, 17.250468077140113], [95.58977628904455, 17.25043561071493], [95.58807568094795, 17.250429117609713]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
