
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nattalin</div><div class="name-mm">နတ်တလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo Su</div><div class="name-mm">အုတ်ဖိုစု</div></div>
        <span class="pcode-badge">MMR008012030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.52877339057954, 18.319424959094647], [95.53220879899692, 18.312529951396186], [95.52683252590043, 18.30480155904479], [95.52801380879032, 18.2916382047394], [95.52813113794173, 18.290330771248136], [95.52779782670842, 18.29095975259054], [95.52765393518104, 18.291231287593916], [95.5262316061038, 18.291676996995875], [95.52385908033233, 18.2930198691717], [95.51763554694298, 18.29229869023243], [95.51675149538528, 18.291934668949864], [95.5157439633133, 18.298753251361518], [95.51439989503916, 18.302449438890562], [95.50801557006258, 18.302785456183926], [95.491886750773, 18.300769354222382], [95.48673095007337, 18.302935665448672], [95.4913407228961, 18.306481643712914], [95.50566345080767, 18.315890121631867], [95.50801557006258, 18.31689817261264], [95.51137574119758, 18.31521808794446], [95.51540794601993, 18.313874018771003], [95.52011218542907, 18.31521808794446], [95.52877339057954, 18.319424959094647]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
