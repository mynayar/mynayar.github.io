
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kawng Mu Lon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Machanbaw</div><div class="name-mm">မချမ်းဘော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kawng Mu Lon</div><div class="name-mm">ကောင်းမူလုံ</div></div>
        <span class="pcode-badge">MMR001016004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.58150427230436, 27.459281950601564], [97.57809284430937, 27.454558435123715], [97.5596280512936, 27.427450546605485], [97.54430620176987, 27.408985753589718], [97.53409163542068, 27.39444964083833], [97.53186223675289, 27.386064217289857], [97.53109109867535, 27.381822203332092], [97.5260834127194, 27.383140014100434], [97.52052874200791, 27.383880636382287], [97.51349282943062, 27.3827697038588], [97.50775300539692, 27.383695480362178], [97.50053193500088, 27.3875837486911], [97.49849522417531, 27.393508729644225], [97.49849522417531, 27.396112877607266], [97.49849522417531, 27.3990633976577], [97.49942100337665, 27.405729000892734], [97.49886553441695, 27.411468824926374], [97.49532834432767, 27.414777808449173], [97.50383202242995, 27.416951908703652], [97.51680544621445, 27.423521868139744], [97.53094869192864, 27.433343565653104], [97.54077039034132, 27.44827254813964], [97.55059208785462, 27.457701377716432], [97.56591393827767, 27.464380132637075], [97.57856989778264, 27.46691132489775], [97.58150427230436, 27.459281950601564]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
