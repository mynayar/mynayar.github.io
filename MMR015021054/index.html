
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Shaung Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hopang</div><div class="name-mm">ဟိုပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Shaung Len</div><div class="name-mm">ရှန်ရှောင်လင်</div></div>
        <span class="pcode-badge">MMR015021054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.93605073285511, 23.31744009138714], [98.93802117983364, 23.315883773217593], [98.94390301491228, 23.312783184196633], [98.94505999272457, 23.309560685777058], [98.939500839792, 23.30606933413253], [98.93715578830904, 23.302011603852463], [98.93671848576957, 23.29494348655271], [98.93246052323462, 23.293668979939525], [98.92599220337752, 23.293357124731585], [98.92562876755363, 23.289027789301088], [98.92849877040197, 23.275496428817178], [98.9300848939028, 23.269755219827573], [98.92601007020863, 23.265966786138335], [98.91840015364426, 23.25997551255989], [98.91548015838265, 23.256783991288216], [98.91544292195334, 23.25682596804404], [98.90512132638816, 23.263547007288594], [98.88327999187817, 23.283590462130178], [98.88003242485661, 23.29215222744341], [98.8943047889349, 23.298978141128373], [98.91185789602514, 23.306082969653403], [98.93045583007256, 23.314232626034936], [98.93491726961634, 23.31673103261113], [98.93605073285511, 23.31744009138714]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
