
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tar Lan Thit Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawhmu</div><div class="name-mm">ကော့မှူး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Tar Lan Thit Ward</div><div class="name-mm">တာလမ်းသစ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013028701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07105785050868, 16.548691914781955], [96.07026262728328, 16.548415029716466], [96.06924897689458, 16.548050972182523], [96.06849230829482, 16.547769006053272], [96.06796763714294, 16.54757270052039], [96.06733232105432, 16.54735497983836], [96.06675054283852, 16.547147966730734], [96.06655780649697, 16.548050972182523], [96.06630439389994, 16.548008141884452], [96.06584039900372, 16.54789392775615], [96.06561910913018, 16.547847528266573], [96.0655655712576, 16.54792961967115], [96.0654870490443, 16.548036695416613], [96.06538354249057, 16.548065248948603], [96.06521222129817, 16.5480973716721], [96.06507659202072, 16.548172324693837], [96.06495523950957, 16.54828653882214], [96.06488385567934, 16.548757672101374], [96.06494810112656, 16.548893301378598], [96.06489099406241, 16.54935015789175], [96.06471253448694, 16.550156795172768], [96.06457690520949, 16.550706450665132], [96.06445495730958, 16.55163719435984], [96.06469706799038, 16.551998497991292], [96.06528717431974, 16.553054978678063], [96.06574184966047, 16.55394664203226], [96.06689588824838, 16.553708695931732], [96.06799044031101, 16.55356592827127], [96.068347359462, 16.553482647136036], [96.06895412201845, 16.552495170818645], [96.07001298216608, 16.550401245133514], [96.07066733394277, 16.5492353092406], [96.07105785050868, 16.548691914781955]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
