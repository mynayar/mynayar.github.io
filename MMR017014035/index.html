
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Dee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Dee</div><div class="name-mm">တောင်ဒီး</div></div>
        <span class="pcode-badge">MMR017014035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.86980819968875, 16.529658479555223], [94.86667439960394, 16.519266809715532], [94.86420012003958, 16.514153459714464], [94.86139607976531, 16.50904010971334], [94.8571073999866, 16.50458655002933], [94.85331335992367, 16.502277240302476], [94.84539587971614, 16.499143260353208], [94.83665399998216, 16.49782367971909], [94.83022080044964, 16.498648439873648], [94.83236532020345, 16.503596820037274], [94.83285995991929, 16.507720529978542], [94.83055091998904, 16.51184423991981], [94.82675687992611, 16.515308069611763], [94.82444783999586, 16.51910192981029], [94.82609736030497, 16.525534860445475], [94.82989103973978, 16.53345233975375], [94.83483924003895, 16.539225480071877], [94.84094232003213, 16.543019250338205], [94.84589088006015, 16.5454934399703], [94.8506741995547, 16.547637779859713], [94.85529299977219, 16.54912233033133], [94.86304524034563, 16.549287210236628], [94.86815868027895, 16.551596519963482], [94.87360188002282, 16.55637993028961], [94.87789055980153, 16.56017378958876], [94.8821792395803, 16.56297782986303], [94.87657115993113, 16.55209134044304], [94.87277711986826, 16.540050150294235], [94.86980819968875, 16.529658479555223]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
