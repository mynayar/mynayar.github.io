
<!DOCTYPE html>
<html>
<head>
    <title>Map View - (Ga) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">North Okkalapa</div><div class="name-mm">မြောက်ဥက္ကလာပ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">(Ga) Ward</div><div class="name-mm">ဂ-ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013012701505</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15490695419265, 16.899339130996168], [96.1538715359427, 16.89906501763653], [96.15290069621022, 16.898820876881985], [96.15211410508192, 16.89860725372182], [96.15111530542708, 16.898120319397265], [96.148921251015, 16.904238223815014], [96.14948717729146, 16.904450098693133], [96.15037059842444, 16.904467583312396], [96.1517181398803, 16.904640198286586], [96.152467728403, 16.904720306297122], [96.15310096803529, 16.90476036030242], [96.15458400494794, 16.90488067070646], [96.15458106956078, 16.903699875249117], [96.15458106956078, 16.90330886890922], [96.15460014328204, 16.90257835410779], [96.15464210474937, 16.901372910031796], [96.15466213265137, 16.900928496552922], [96.15479087869613, 16.899911880428988], [96.15490695419265, 16.899339130996168]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
