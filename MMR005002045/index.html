
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan</div><div class="name-mm">လက်ပန်</div></div>
        <span class="pcode-badge">MMR005002045</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42696615996039, 21.98935728011446], [95.4259491598259, 21.98888784030163], [95.42109816005211, 21.988574910403827], [95.41468224009338, 21.988418399589534], [95.41045692025074, 21.98810546969173], [95.40825408036159, 21.98810546969173], [95.40764027957528, 21.99123513019714], [95.405762159696, 21.997494630173094], [95.40482328007039, 22.003441200251245], [95.39918999961884, 22.00516254041895], [95.39167860018733, 22.00641443987456], [95.38604496000698, 22.00844870994007], [95.38604496000698, 22.012830359833288], [95.38604496000698, 22.01768145043866], [95.38707276009984, 22.021221869993383], [95.39246087996571, 22.020654690061974], [95.40059831995654, 22.018933349894212], [95.40638820025532, 22.01908985980924], [95.41530792002453, 22.01862041999641], [95.4191188799324, 22.01907770996837], [95.42066615991541, 22.01661611983809], [95.42231568022453, 22.014039060354378], [95.42427407988492, 22.011049620343726], [95.42582064041028, 22.008163230049092], [95.42973780035925, 22.004864550058983], [95.43283020015366, 22.00269978027069], [95.43581964016431, 22.001462730420712], [95.4375177598368, 22.00055310034537], [95.43690323959288, 21.999528990170802], [95.43424283993517, 21.996242729818164], [95.42923524031414, 21.99248702965275], [95.42798351982361, 21.989826809859437], [95.42696615996039, 21.98935728011446]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
