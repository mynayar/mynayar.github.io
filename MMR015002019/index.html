
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kone Nyaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kone Nyaung</div><div class="name-mm">ကုန်းညောင်</div></div>
        <span class="pcode-badge">MMR015002019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.21647021982483, 23.313666107105234], [98.22201246190565, 23.302536118147373], [98.229761150157, 23.286840079606066], [98.20809344955313, 23.282476365791695], [98.18557740137601, 23.271423033246435], [98.1848633873355, 23.271117386957883], [98.1453761051232, 23.254214147065284], [98.13539105115615, 23.25936234129904], [98.1286732036055, 23.262825995623245], [98.1196667846944, 23.268557354338498], [98.10350537037658, 23.273443362920887], [98.10206332816011, 23.273879329067825], [98.11106974797053, 23.280838835244083], [98.11364560596002, 23.29060716698723], [98.13276703087382, 23.299261057052206], [98.13299316899963, 23.301160614970456], [98.14683321368193, 23.301876478916427], [98.17198091828482, 23.30293905759146], [98.19110734073126, 23.300459706750132], [98.20775441323565, 23.311085497098077], [98.21647021982483, 23.313666107105234]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
