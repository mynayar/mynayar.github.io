
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyun Pyat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyun Pyat</div><div class="name-mm">ကျွန်းပြတ်</div></div>
        <span class="pcode-badge">MMR009001013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.02309087594324, 20.037946318767638], [95.01986683158907, 20.040525553711404], [95.01251688204854, 20.041575547273737], [95.00411693984495, 20.041575547273737], [94.9964169921505, 20.0450755234167], [94.99073925281431, 20.048599637363452], [94.99221702059907, 20.049975490376653], [95.00621692517103, 20.061875407823834], [95.01286688020241, 20.070625348181352], [95.01496686462917, 20.076925305058808], [95.01470436691307, 20.07771280000577], [95.01706685085452, 20.080075283947224], [95.02581679121198, 20.080425281201826], [95.02856720671127, 20.08174955539772], [95.03106675542648, 20.077625299567956], [95.03561672423251, 20.069575354618962], [95.03526672607859, 20.057675437171724], [95.03071675727261, 20.04367553259982], [95.03172613565272, 20.04305437715783], [95.02896676920108, 20.041925545427603], [95.02336680773203, 20.037725573876173], [95.02309087594324, 20.037946318767638]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
