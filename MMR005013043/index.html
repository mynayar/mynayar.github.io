
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Taw</div><div class="name-mm">ဇီးတော</div></div>
        <span class="pcode-badge">MMR005013043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14279548042714, 22.284252269826425], [95.14372715018789, 22.28201642481821], [95.14325601155576, 22.2820163996372], [95.1400064849114, 22.28088601207986], [95.13997805464356, 22.280876122235327], [95.1342716116456, 22.278891064870777], [95.13040510601087, 22.277745304302414], [95.1237244796011, 22.275765720211893], [95.11749873118157, 22.27161472304107], [95.11748123936775, 22.27160305973348], [95.11434962913216, 22.269515142409944], [95.1085656393928, 22.268414452265233], [95.10451742663798, 22.267644099295808], [95.10354083933834, 22.26776617327033], [95.10505091976421, 22.27154120975905], [95.10505091976421, 22.277473020163825], [95.10801659968638, 22.282557480343485], [95.1097895996104, 22.282114229687977], [95.1164906397313, 22.280438969882596], [95.1218643623505, 22.282588435008336], [95.12284608028244, 22.282981109590594], [95.13047303989896, 22.282981109590594], [95.13682847955073, 22.284252269826425], [95.14279548042714, 22.284252269826425]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
