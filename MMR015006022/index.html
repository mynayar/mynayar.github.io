
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bin Ngin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bin Ngin</div><div class="name-mm">ဗင်းငင်း</div></div>
        <span class="pcode-badge">MMR015006022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.27436195394108, 22.599754504766622], [99.25644918907886, 22.598719380595014], [99.23891142172477, 22.597466683440757], [99.22463066877043, 22.59771722287161], [99.2058402051614, 22.59821830173331], [99.20160966565362, 22.59821830173331], [99.19932617726136, 22.60122477580279], [99.1995767166922, 22.61325067387952], [99.20158103303828, 22.621769017226427], [99.21210369273132, 22.639807863442172], [99.2183671812005, 22.647324049065674], [99.21872748918236, 22.654082590938856], [99.22710956365552, 22.66538057055692], [99.23308518992962, 22.65644749855329], [99.24841800398775, 22.64868872620383], [99.2735416517259, 22.63945208984211], [99.27769958266964, 22.639133094017097], [99.28795080268748, 22.633725377024575], [99.29497064617846, 22.63003072194033], [99.30771720158765, 22.61672996831345], [99.31584544061468, 22.60195135067437], [99.3239099788625, 22.592273906215837], [99.32093235594351, 22.591515908132692], [99.31031518739604, 22.59245589302509], [99.29377957776535, 22.595462367094626], [99.27436195394108, 22.599754504766622]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
