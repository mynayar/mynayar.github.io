
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lin Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myothit</div><div class="name-mm">မြို့သစ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lin Lel</div><div class="name-mm">လင်းလည်</div></div>
        <span class="pcode-badge">MMR009005037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43619623486842, 20.07881414215899], [95.43551255855778, 20.07881414215899], [95.43374006675072, 20.07349666493917], [95.42877708879166, 20.066052197550903], [95.42381410993329, 20.06250721393684], [95.41849663361279, 20.057898734339176], [95.4082161793333, 20.052581257119357], [95.40749417301771, 20.05137791385971], [95.40502569318124, 20.05541724490996], [95.4014807086678, 20.05860773106201], [95.39616323234736, 20.05931672778479], [95.39013675930408, 20.058253231801245], [95.38517378044565, 20.060025725406945], [95.38340128773928, 20.06640669681167], [95.37808381231815, 20.070306178787177], [95.37712293437596, 20.07414968875719], [95.37914730740238, 20.07704165035193], [95.38694627315203, 20.08094113322676], [95.39651773070875, 20.08094113322676], [95.40218970628996, 20.085904111185812], [95.40734557983473, 20.102059184383904], [95.40750718171114, 20.102565537769408], [95.4128246589309, 20.099375051617415], [95.41885113197424, 20.096184566364684], [95.42594110100106, 20.097957058171744], [95.4264407301556, 20.09754070084273], [95.43019508223733, 20.094412072758985], [95.43374006675072, 20.088031101354318], [95.434803561835, 20.08271362503382], [95.43619623486842, 20.07881414215899]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
