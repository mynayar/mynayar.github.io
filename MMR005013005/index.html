
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Naung Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Naung Kone</div><div class="name-mm">ထနောင်းကုန်း</div></div>
        <span class="pcode-badge">MMR005013005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.14979459994089, 22.31638830027987], [95.15037312032331, 22.316801490196667], [95.15527632034599, 22.314243329965734], [95.1576595201708, 22.310191709679714], [95.1576595201708, 22.306140000360756], [95.1576595201708, 22.301611740289616], [95.15432303987643, 22.297321799661404], [95.15384604036251, 22.29422345984483], [95.15206836036657, 22.291408800375905], [95.15185632001322, 22.29107282984728], [95.14191275986605, 22.286370780287314], [95.14279548042714, 22.284252269826425], [95.13682847955073, 22.284252269826425], [95.13047303989896, 22.282981109590594], [95.12284608028244, 22.282981109590594], [95.1218643623505, 22.282588435008336], [95.1192882003902, 22.287311820084483], [95.1192882003902, 22.289599799691075], [95.1192882003902, 22.28969510984149], [95.12548488002324, 22.291840170087823], [95.13191952026972, 22.297560120003595], [95.13573300007795, 22.301135099605233], [95.13525636029283, 22.307093369863196], [95.13644796020526, 22.311860040208728], [95.1396685196865, 22.313430269991045], [95.14444391975115, 22.315818149887775], [95.14979459994089, 22.31638830027987]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
