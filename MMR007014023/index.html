
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Thit</div><div class="name-mm">လေးသစ်</div></div>
        <span class="pcode-badge">MMR007014023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.53021823398439, 18.792174818413173], [96.53101615657044, 18.79354919294093], [96.53745733668677, 18.790972720714535], [96.5448646917522, 18.789684485050998], [96.54905145855804, 18.78743007263978], [96.55613675560687, 18.785497719144473], [96.55919528963096, 18.785352073939123], [96.55935734476571, 18.78292124691808], [96.56289999373979, 18.776158008785103], [96.56547646506687, 18.769394770652184], [96.56599010026298, 18.764943267717683], [96.56289999373979, 18.765852122577428], [96.55323822536388, 18.765530063661572], [96.54454263283628, 18.76520800474566], [96.54026152714783, 18.763831934995835], [96.54035586692976, 18.765530063661572], [96.5323043931333, 18.76520800474566], [96.529627865034, 18.76423922176275], [96.53262645204916, 18.76842859390456], [96.53359262879684, 18.774869773121566], [96.53101615657044, 18.77970065775918], [96.52650733174801, 18.781955070170397], [96.52425291933685, 18.785497719144473], [96.52832509722549, 18.789158756671327], [96.53021823398439, 18.792174818413173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
