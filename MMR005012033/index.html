
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Lin Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Lin Kone</div><div class="name-mm">ပလ္လင်ကုန်း</div></div>
        <span class="pcode-badge">MMR005012033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.17983515966495, 22.242651030420745], [95.18384484006737, 22.238390699970864], [95.19067116024593, 22.23204047998422], [95.19224724011809, 22.23137690981656], [95.18971860013335, 22.222673909573302], [95.17468083115551, 22.213682096551565], [95.1745575601833, 22.2137617504045], [95.17431959956991, 22.213466100080495], [95.16496993101754, 22.223030712897128], [95.16034908034584, 22.222832669592094], [95.15399867959542, 22.222832669592094], [95.14907747964202, 22.220610120160984], [95.14240955975345, 22.21870508986808], [95.13288432015531, 22.215688740343126], [95.13053208039128, 22.214643300048294], [95.13002663981763, 22.214418660193076], [95.127803999555, 22.219181279992142], [95.12493371971544, 22.221499859930645], [95.12621640026674, 22.224579029798463], [95.12732772039806, 22.23188171996543], [95.12859779964879, 22.241248290376348], [95.1336781202491, 22.24585224008888], [95.14002816037134, 22.24807479041931], [95.14844243956696, 22.249027349632513], [95.15510999972679, 22.24950362968883], [95.1563653202034, 22.249731870429514], [95.15606255983931, 22.246804710269203], [95.15828520010194, 22.242042089570816], [95.1601903203271, 22.23775565989581], [95.16622284041182, 22.23775565989581], [95.17685940014127, 22.24093077033882], [95.17983515966495, 22.242651030420745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
