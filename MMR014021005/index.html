
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Hee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongpan</div><div class="name-mm">မိုင်းပန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Hee</div><div class="name-mm">နောင်ဟီး</div></div>
        <span class="pcode-badge">MMR014021005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.36415678280935, 20.286713747941178], [98.37508563659293, 20.28140544740353], [98.37797489572489, 20.280002093122164], [98.38442193582375, 20.279378186654014], [98.39740307938865, 20.278121947070247], [98.40932920128165, 20.281600399738693], [98.42748542701088, 20.28689596497685], [98.43152182267403, 20.287996800811754], [98.43263072542771, 20.288299228426695], [98.42769433322695, 20.257858143038902], [98.43521492013252, 20.158419268934153], [98.44189988577119, 20.14170685438785], [98.4432620618947, 20.13398785365655], [98.43939302376907, 20.13418626568364], [98.40179008834195, 20.13669312858508], [98.37588584435628, 20.14254247385611], [98.34413225420025, 20.161761752203176], [98.33577604602777, 20.175131685279098], [98.33418706268287, 20.17845410467322], [98.3483103578368, 20.205214032901324], [98.36084466964587, 20.265378729944473], [98.36084466964587, 20.27488391556028], [98.36163208185513, 20.27527762166494], [98.3623070059636, 20.275615084168862], [98.36262593344014, 20.277528641833385], [98.36415678280935, 20.286713747941178]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
