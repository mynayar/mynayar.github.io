
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paung</div><div class="name-mm">ပေါင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Kyun</div><div class="name-mm">လက်ပံကျွန်း</div></div>
        <span class="pcode-badge">MMR011008048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.60508294861927, 16.66197473934278], [97.61223913203037, 16.653386334311904], [97.60922757409332, 16.652011382419403], [97.60851834804339, 16.65145548358373], [97.61006355329039, 16.649312972915425], [97.61185646060721, 16.644853591919798], [97.61466407658594, 16.639413833881406], [97.61564826855283, 16.63638877891907], [97.61598014806543, 16.634309767581783], [97.61589462793478, 16.63335308767489], [97.59305812972895, 16.631030637054323], [97.59285833274589, 16.634826774336204], [97.59219242524028, 16.6370464666212], [97.59108257909782, 16.641707822757837], [97.59041667069283, 16.645481301620805], [97.59041667069283, 16.648144934341303], [97.59041667069283, 16.653916135721147], [97.58956800026306, 16.658752999951048], [97.60167979528637, 16.661268061072235], [97.60508294861927, 16.66197473934278]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
