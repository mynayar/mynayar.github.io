
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chan Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chan Gyi</div><div class="name-mm">ခြံကြီး</div></div>
        <span class="pcode-badge">MMR007014003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.53648646727669, 18.844124767044434], [96.5416441025933, 18.844756565962825], [96.54615292831505, 18.844434507046913], [96.5525941066328, 18.844434507046913], [96.55581469669096, 18.84346833029923], [96.56000146259748, 18.844112448131], [96.5636640352671, 18.84433442239572], [96.56511115955243, 18.840478896583875], [96.56651115396664, 18.835836410921672], [96.56720161386346, 18.832399368436143], [96.56453514108398, 18.828119278082283], [96.56429863017769, 18.822282791317832], [96.5669422152111, 18.815057754911493], [96.56644264181455, 18.812550670776886], [96.55935734476571, 18.81512714210396], [96.55420440211151, 18.8164153777675], [96.54888316572556, 18.813285239722063], [96.54615292831505, 18.817703614330412], [96.54422057392043, 18.82446685156401], [96.54099998476153, 18.83219626734393], [96.53971174909799, 18.836060974334544], [96.53663429693529, 18.839162282813163], [96.53648646727669, 18.844124767044434]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
