
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Ma Kauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Muse</div><div class="name-mm">မူဆယ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Ma Kauk</div><div class="name-mm">လွယ်မကောက်</div></div>
        <span class="pcode-badge">MMR015009059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.20337015081185, 23.967845545835303], [98.20840041514708, 23.96770265255543], [98.23308206318671, 23.967001527598484], [98.23197551485816, 23.9641561176108], [98.23368872605391, 23.956161128433394], [98.24420927593741, 23.950778522310998], [98.24596674456967, 23.949879352250377], [98.25424726939605, 23.941884363072973], [98.25424726939605, 23.935031514692696], [98.25022031391643, 23.93052132469944], [98.24965699207661, 23.9298904044187], [98.2330901346021, 23.927179481747714], [98.22978942664076, 23.92663936961128], [98.22836409112995, 23.932198176304837], [98.21829955058388, 23.938762006861168], [98.21268827924075, 23.9435419790791], [98.20967089639481, 23.9461123431102], [98.2064846568415, 23.948826547407293], [98.20429671332272, 23.967642860229887], [98.20337015081185, 23.967845545835303]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
