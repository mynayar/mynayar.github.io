
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Long</div><div class="name-mm">နောင်လုံ</div></div>
        <span class="pcode-badge">MMR015011059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.2497721673517, 23.638915516338045], [98.24968108041759, 23.64292335043234], [98.25042359757106, 23.644284631730443], [98.25205287773815, 23.64727164537021], [98.259484394889, 23.649210302213703], [98.26890451543107, 23.65195783718451], [98.28067966543426, 23.64999531143451], [98.28080828467466, 23.649949008939643], [98.28293964105166, 23.646751973924495], [98.28651094602338, 23.639609365779677], [98.28730456895073, 23.636434872271593], [98.29008225009585, 23.63206994527178], [98.29365355416826, 23.62175284361888], [98.29643123531332, 23.613419800183692], [98.29524080092227, 23.607864436994248], [98.29383847006937, 23.606646186572277], [98.2858103453712, 23.60421342241159], [98.27226187078878, 23.602923090428305], [98.2606488928322, 23.606148918138103], [98.2548424038539, 23.613890903742288], [98.25000366273889, 23.628729709408617], [98.2497721673517, 23.638915516338045]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
