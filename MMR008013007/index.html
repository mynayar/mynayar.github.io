
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Kei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monyo</div><div class="name-mm">မိုးညို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Kei</div><div class="name-mm">ငါးကယ်</div></div>
        <span class="pcode-badge">MMR008013007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.45932608473106, 18.100244741401752], [95.45410391586307, 18.104161368952077], [95.44850873429073, 18.10695895928859], [95.44503949697526, 18.11242967918639], [95.44962776970584, 18.11497872029173], [95.44869524019322, 18.119081852845284], [95.44608415485993, 18.126542095241575], [95.44384608313027, 18.133069807225866], [95.44076178802618, 18.14062632924174], [95.44347307132523, 18.14519270078256], [95.44776270978127, 18.15265294317885], [95.4516793373316, 18.15918065516314], [95.4566657075564, 18.163884777660428], [95.461191145555, 18.157315594339252], [95.46622680941977, 18.15078788235496], [95.47126247328458, 18.144446676273162], [95.47834970297646, 18.136799927974323], [95.48413139135067, 18.133256313128413], [95.48854500764605, 18.13239277870383], [95.48748850029409, 18.126355589339028], [95.48692898078787, 18.123744504005685], [95.48525042676584, 18.118708841040245], [95.48189331782243, 18.113859683077976], [95.47611163034753, 18.10845100830744], [95.47032994197332, 18.104347874854568], [95.45932608473106, 18.100244741401752]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
