
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khu Lar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegyin</div><div class="name-mm">ရွှေကျင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khu Lar</div><div class="name-mm">ခူလာ</div></div>
        <span class="pcode-badge">MMR007008030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.94220546311169, 18.046932934107645], [96.93789725905134, 18.03135712143404], [96.92965406058647, 18.01747384094506], [96.91863963271294, 18.01158922786061], [96.9113574443906, 18.01932655407728], [96.90407525516895, 18.027063879394575], [96.88905573973068, 18.03252552063634], [96.8848693398482, 18.0303485929133], [96.88905573973068, 18.038442298873065], [96.88404923458455, 18.042993667923497], [96.87267081510612, 18.048000172170248], [96.86174753172327, 18.043903941014094], [96.84763829117423, 18.03753202578241], [96.8421766490332, 18.03753202578241], [96.83295960440228, 18.035003045853955], [96.83112123185941, 18.045785692355878], [96.82428875312354, 18.05859658976084], [96.82588275108816, 18.05915102360092], [96.8349854882897, 18.05915102360092], [96.84073548635365, 18.063209846557243], [96.84954986493437, 18.057785614414627], [96.86365910638273, 18.055965067334057], [96.8692327509907, 18.05778251804884], [96.88513919761596, 18.05914090083195], [96.8968840926268, 18.058240751409585], [96.91190360806513, 18.05915102360092], [96.92146148136231, 18.061426707676446], [96.93192962775021, 18.06370239175203], [96.9460388691985, 18.068253759903143], [96.94353734197483, 18.05174818942743], [96.94220546311169, 18.046932934107645]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
