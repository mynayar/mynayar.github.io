
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Tan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Bago</div><div class="name-mm">ပဲခူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Tan</div><div class="name-mm">ရွှေတန်</div></div>
        <span class="pcode-badge">MMR007001023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.52878047523882, 17.436339034918603], [96.52137607264768, 17.44532661483146], [96.51202814338416, 17.447403931846054], [96.50216088441732, 17.45051990916653], [96.49489027216839, 17.45000058036254], [96.48138770617777, 17.45051990916653], [96.47595327212588, 17.45095425473511], [96.47489790511429, 17.457035651174408], [96.47523743156228, 17.460770457390765], [96.48132099266974, 17.463458738729855], [96.48738724182783, 17.469168151289182], [96.4902419481075, 17.474877562049926], [96.49408909313718, 17.479020641589386], [96.49541610307074, 17.48005171611385], [96.50023341783805, 17.47630491474007], [96.50558599110065, 17.473450209359726], [96.50986805007051, 17.46809763609707], [96.51522062333316, 17.465956606612167], [96.5205731956965, 17.463101901231823], [96.52521209306371, 17.46131771014427], [96.52913731363617, 17.45989035655475], [96.53225148781598, 17.458662170422883], [96.53270569581127, 17.453110430601953], [96.53020782792896, 17.445973667151065], [96.52949415203352, 17.44204844567929], [96.52878047523882, 17.436339034918603]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
