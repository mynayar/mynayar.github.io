
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Hin Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwedaung</div><div class="name-mm">ရွှေတောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Hin Thar</div><div class="name-mm">ရွှေဟင်္သာ</div></div>
        <span class="pcode-badge">MMR008006028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.09883084966401, 18.574208677388583], [95.09996736969839, 18.570244768881025], [95.10223772169354, 18.562582329211182], [95.10762981026761, 18.55350091943194], [95.1115717213579, 18.54228045507898], [95.10791360392972, 18.54016259842524], [95.10394048726374, 18.53704086274564], [95.09514287114666, 18.53477050985117], [95.09206886698468, 18.531061087898934], [95.08968533531004, 18.532850102949965], [95.08919326495726, 18.535104626877057], [95.08823934866706, 18.53600099015364], [95.08678578163858, 18.54005567892648], [95.08583941515695, 18.540048229842], [95.08442867294497, 18.5386826156103], [95.08304811377951, 18.54315759534677], [95.08072080592052, 18.541888154614696], [95.07309883124611, 18.534532315414083], [95.07166032966052, 18.536779348887876], [95.06974229427152, 18.539475813158276], [95.06965168397807, 18.54004844028333], [95.06506436632748, 18.547389065652908], [95.06303513696207, 18.55640785473878], [95.06125604143324, 18.564314945978026], [95.06373068162571, 18.5720688197203], [95.06805938932939, 18.5710773819157], [95.07284040026434, 18.57007383204177], [95.0822914727733, 18.571255216555073], [95.08701700902782, 18.574208677388583], [95.09085650712217, 18.573913331035442], [95.09883084966401, 18.574208677388583]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
