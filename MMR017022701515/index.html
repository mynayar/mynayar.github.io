
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (15) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (15) Ward</div><div class="name-mm">အမှတ် (၁၅) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58925530009208, 17.26885307331071], [95.58753090852468, 17.268544247918783], [95.58589342204385, 17.268189930321057], [95.5836180653215, 17.26783168808197], [95.58366846962423, 17.27005306569646], [95.58386198034617, 17.27022053834719], [95.5841333157, 17.270421981089612], [95.5854759009921, 17.27137498186994], [95.58693304462435, 17.272285491482307], [95.58787638398798, 17.270989897565755], [95.58794097509599, 17.270636057508113], [95.58808375506129, 17.27033091034326], [95.58826052939997, 17.26998031503956], [95.58839990992794, 17.269756323595516], [95.5885528882053, 17.26943169711518], [95.58856988539196, 17.26933430953079], [95.5887160647946, 17.269210951324396], [95.58886564363462, 17.269207704771816], [95.58901862191192, 17.269100578429004], [95.58918179850127, 17.26896423491155], [95.58925530009208, 17.26885307331071]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
