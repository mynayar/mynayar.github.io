
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Kyun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Kyun</div><div class="name-mm">ဇီးကျွန်း</div></div>
        <span class="pcode-badge">MMR010010021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.01399844657112, 22.381994384033646], [96.01299473302055, 22.379317812766885], [96.01031816265316, 22.375637528848927], [96.00847802114384, 22.372960959380805], [96.00964902028613, 22.369949816930557], [96.01180037938406, 22.36713162762254], [96.00904839816508, 22.365296973776367], [96.00308577069183, 22.36025167367586], [95.99712314501721, 22.35887568396572], [95.99519815517078, 22.358153813447757], [95.99248175742724, 22.36250004893816], [95.9901927597881, 22.37140170312614], [95.98815809581953, 22.378268694244866], [95.98688643106402, 22.383864019708767], [95.98586909907971, 22.389459345172668], [95.98764943027703, 22.39505467063657], [95.9889210950326, 22.397852333818207], [95.99324475574093, 22.3965806690627], [95.99884008210415, 22.396835001833892], [96.00240074359948, 22.396835001833892], [96.00748740442026, 22.39734366827571], [96.01104806501627, 22.39759800104696], [96.00814344906098, 22.393871663746324], [96.0078088778775, 22.390693236603624], [96.00948173469436, 22.387849380644468], [96.01266016183706, 22.385005524685255], [96.01399844657112, 22.381994384033646]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
