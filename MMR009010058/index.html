
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Shey Kan Baung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Shey Kan Baung</div><div class="name-mm">အရှေ့ကန်ဘောင်</div></div>
        <span class="pcode-badge">MMR009010058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.75088559889133, 20.597529745201655], [94.75102171218231, 20.59167690156778], [94.75104725562642, 20.591300130596608], [94.74977497843258, 20.590845747233516], [94.7421807235616, 20.590845747233516], [94.74084005292616, 20.590845747233516], [94.73626869644323, 20.588560068092704], [94.7308661838274, 20.58689775672616], [94.72297020371201, 20.58648217910934], [94.71673653496316, 20.58668996836741], [94.71665294207969, 20.586709871263622], [94.71584837620168, 20.58690143405397], [94.71548980211276, 20.590845747233516], [94.71452011980773, 20.595417102817066], [94.71668461080623, 20.595417102817066], [94.71735990183805, 20.595417102817066], [94.7339830182018, 20.596663836566847], [94.74084005292616, 20.597494992699808], [94.7501905560494, 20.597494992699808], [94.75088559889133, 20.597529745201655]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
