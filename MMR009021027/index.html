
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wet Poke (Than Taw Aint)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wet Poke (Than Taw Aint)</div><div class="name-mm">ဝက်ပုတ် (သန်းတောအိုင့်)</div></div>

        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.45455351773074, 21.58428289314105], [94.4569633977427, 21.58452388087244], [94.46733459541531, 21.57360683159004], [94.47115556207956, 21.570877569943946], [94.47440173695065, 21.56048980765854], [94.50789579135773, 21.57898039233129], [94.51270809420322, 21.582728620029854], [94.51591546242872, 21.58070291420819], [94.51997514513693, 21.576237263139205], [94.52137398662023, 21.574698536608253], [94.52901592084811, 21.572515128370526], [94.53720370668577, 21.572515128370526], [94.53556615005783, 21.56869415990758], [94.53283688841174, 21.561052225679703], [94.52191983912934, 21.558868815643393], [94.5120944948651, 21.555047848979086], [94.51100278984694, 21.545222504714843], [94.51264034827352, 21.53157619378635], [94.50891658663124, 21.532196821326295], [94.50609011816448, 21.53266789880456], [94.49748703439917, 21.53354576482525], [94.48726831677948, 21.534588490966144], [94.48916869308079, 21.53648886636813], [94.47934334881654, 21.547951768159635], [94.46296777534263, 21.55068102980573], [94.45532755162526, 21.55228949786209], [94.45477998860565, 21.561598079088128], [94.45423413609655, 21.581248766717238], [94.45455351773074, 21.58428289314105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
