
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kutkai</div><div class="name-mm">ကွတ်ခိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Kan</div><div class="name-mm">လွယ်ကန်</div></div>
        <span class="pcode-badge">MMR015011006</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.99130719117397, 23.49974719327838], [97.99200391664749, 23.499717333088483], [98.00084486929535, 23.485935847761198], [98.00104956758355, 23.485620272057986], [98.00708554196427, 23.476314810580106], [98.00836099466426, 23.470192784569406], [98.0061734720282, 23.471047056876216], [98.00424826634446, 23.472747558852802], [97.99997003129198, 23.475363673195034], [97.99526397255437, 23.47588688976822], [97.98948835460396, 23.476410103643445], [97.98558973957489, 23.47615046936869], [97.98523282113786, 23.478886849148807], [97.98449286885085, 23.479884176613496], [97.98394304943224, 23.47969517599165], [97.97406198407339, 23.478395036002155], [97.96236072416815, 23.481255344158853], [97.9477991552069, 23.483595595960026], [97.94691720356616, 23.484351554380794], [97.94147851931825, 23.489013283736085], [97.93687797893563, 23.49295660406409], [97.9290771380995, 23.49815716492128], [97.93947825891456, 23.503617753056915], [97.95091949244068, 23.50413780941244], [97.97380195589562, 23.500497416722453], [97.99130719117397, 23.49974719327838]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
