
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nawng Aw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lashio</div><div class="name-mm">လားရှိုး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nawng Aw</div><div class="name-mm">နောင်အော်</div></div>
        <span class="pcode-badge">MMR015001060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.37142197844162, 23.183853053575604], [98.36527588927095, 23.17789777895939], [98.35295503244885, 23.17453754487184], [98.33578050486648, 23.167070359709385], [98.3174858995547, 23.15549622167333], [98.31151215106496, 23.152882707271147], [98.30991976198749, 23.151869368276778], [98.284630281962, 23.161096611219705], [98.27347702214689, 23.16246106982254], [98.27454958239736, 23.165203563193927], [98.28687043832014, 23.18909855805208], [98.30116895828087, 23.23868703987506], [98.30410958309085, 23.23975647767935], [98.31035984613004, 23.233896893626763], [98.3162195686782, 23.224521467591728], [98.32598551901657, 23.218661962679505], [98.33525460381696, 23.21585326031976], [98.33887647496942, 23.214755767264876], [98.34551738102238, 23.208505544695186], [98.35606469562924, 23.198739572773093], [98.36700259389465, 23.190926851892755], [98.37414221539098, 23.189979285715538], [98.37142197844162, 23.183853053575604]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
