
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Baw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mingin</div><div class="name-mm">မင်းကင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Baw</div><div class="name-mm">သင်္ဘော</div></div>
        <span class="pcode-badge">MMR005029035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.36551372028202, 22.891525290160075], [94.36485744001891, 22.892787270116457], [94.3648416002597, 22.892817870448425], [94.35829031974254, 22.905416249960012], [94.35727079970769, 22.90949532025286], [94.3550600403886, 22.91833737007363], [94.35092075958545, 22.92373628989793], [94.34119139996318, 22.936426830134167], [94.34407715983309, 22.936426830134167], [94.34601540029053, 22.95387027029676], [94.3537679996935, 22.96033073997171], [94.36539708001129, 22.96291500032703], [94.3769645999364, 22.96230615030862], [94.38413255996971, 22.95257813966947], [94.3972455603344, 22.93845651005995], [94.40092980037002, 22.934488679608933], [94.41385091958432, 22.927382100103898], [94.42806408039303, 22.925443949578664], [94.4391545999049, 22.925061449926034], [94.4391545999049, 22.915860840405514], [94.44087755975164, 22.89863276988649], [94.44190787974492, 22.897988730295708], [94.43140199960266, 22.895187119989657], [94.42237715987807, 22.894685729962532], [94.41589679989744, 22.894325730448145], [94.40039160019228, 22.890880079651993], [94.3805793601494, 22.890018690110537], [94.36551372028202, 22.891525290160075]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
