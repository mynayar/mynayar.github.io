
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ha San Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ha San Kaing</div><div class="name-mm">ဟဆန်းကိုင်</div></div>
        <span class="pcode-badge">MMR005037038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.87832785764459, 27.020773163950423], [95.8792383267874, 27.020143613337154], [95.88250727968727, 27.017883269897027], [95.90148936004601, 27.006530759886687], [95.92749036029193, 26.986328099861964], [95.93248997932915, 26.97447523494418], [95.93247024010958, 26.974428390158153], [95.9282837997576, 26.96447754010643], [95.92468272003157, 26.950073220302897], [95.92089839984135, 26.939880359990696], [95.91992171991149, 26.93011472981101], [95.89990248021536, 26.936279280264614], [95.88269052015147, 26.944274880081707], [95.86950695987838, 26.95428467979417], [95.8327027195549, 26.977478039779783], [95.81091299983512, 26.992675799948245], [95.80249007995326, 26.99987796029967], [95.79855724392172, 27.002508888274633], [95.80017446058292, 27.013512536874146], [95.80844483116408, 27.012760685657156], [95.82536149343821, 27.00824957475811], [95.83212815708885, 27.007873649149644], [95.84190223100319, 27.01238476094801], [95.85430778327765, 27.01238476094801], [95.86558555692795, 27.012760685657156], [95.87460777782672, 27.012760685657156], [95.87832785764459, 27.020773163950423]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
