
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Kauk Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chanayethazan</div><div class="name-mm">ချမ်းအေးသာစံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kan Kauk Ward</div><div class="name-mm">ကံကောက်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR010002701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12867932473637, 21.98135309662093], [96.12927741074152, 21.980130571891287], [96.1301793351901, 21.978545658528677], [96.13066653336215, 21.977754881958486], [96.13082429650999, 21.97760545312557], [96.13146816816614, 21.97710716520422], [96.13180570002243, 21.977004934223743], [96.13237109096461, 21.9769170181712], [96.13264980647175, 21.97675216691229], [96.1328180848231, 21.976491331493314], [96.13282182757622, 21.976031616066628], [96.13265903517976, 21.975074552351224], [96.13159916845495, 21.966866076532337], [96.12880678774158, 21.9669457375543], [96.12370269439297, 21.967138146780705], [96.11868572422502, 21.967327149060733], [96.11655569611284, 21.967406616513273], [96.11569046833526, 21.967438896578937], [96.11589451246283, 21.971541905720578], [96.1161875302207, 21.97528700119855], [96.11625782973539, 21.976620507220783], [96.11645405873064, 21.98034275975829], [96.11651856410224, 21.98166994410266], [96.11974636741752, 21.981480777595078], [96.12367442814012, 21.981349114751463], [96.12833767029106, 21.981330538690226], [96.12867932473637, 21.98135309662093]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
