
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Pon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taikkyi</div><div class="name-mm">တိုက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Pon</div><div class="name-mm">အုပ်ပုံ</div></div>
        <span class="pcode-badge">MMR013005009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.90999767685139, 17.418621667555954], [95.915336415843, 17.417020046038317], [95.91752045990137, 17.416364833270507], [95.91800887990593, 17.4152752812293], [95.91996536490973, 17.41091081468238], [95.91789660044782, 17.400378918952015], [95.92165799062383, 17.39323227464979], [95.92579552224561, 17.383076516767858], [95.91789660044782, 17.38138389105376], [95.91169030256549, 17.380631612658874], [95.90435559023837, 17.37592987336501], [95.88890461335728, 17.376335017946758], [95.88833846674692, 17.378599601690325], [95.88645131407696, 17.38633692970558], [95.8830544389113, 17.398980856281526], [95.88041242409417, 17.400868009850797], [95.87984627838313, 17.404642316090076], [95.87946884730951, 17.411247351783913], [95.87852527142422, 17.412568358742817], [95.88234839106548, 17.412726636724926], [95.88835842090447, 17.414229143959858], [95.89544167199563, 17.41659022765691], [95.90999767685139, 17.418621667555954]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
