
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel U</div><div class="name-mm">လယ်ဦး</div></div>
        <span class="pcode-badge">MMR005032039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.95531468042822, 24.455815199611834], [94.94999063995613, 24.45469434037159], [94.93526231960044, 24.45469434037159], [94.91370264016479, 24.451899570308967], [94.88847887989647, 24.448629780140266], [94.87028555983079, 24.450362549791862], [94.8545409596976, 24.450362549791862], [94.85620704012285, 24.452528399665937], [94.83194915982591, 24.452528399665937], [94.81462200020519, 24.45079571994654], [94.79660184010288, 24.45079571994654], [94.80076020002326, 24.457726619587902], [94.80682476025453, 24.47072199042759], [94.81029011969332, 24.485450040087358], [94.82415191987525, 24.49324728003802], [94.82416200037608, 24.493340430016872], [94.84581096000784, 24.494113620347377], [94.87786608025544, 24.49324728003802], [94.91685228000875, 24.494979959757416], [94.95464723957849, 24.488967150113922], [94.95464723957849, 24.47797770001091], [94.95464723957849, 24.47018046006025], [94.9552970402263, 24.455885579655842], [94.95531468042822, 24.455815199611834]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
