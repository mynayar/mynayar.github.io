
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Paw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Paw Gyi</div><div class="name-mm">တောင်ပေါ်ကြီး</div></div>
        <span class="pcode-badge">MMR014006003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.62351749403717, 20.96993236388755], [96.62360968893603, 20.96984016898864], [96.63175977069693, 20.969526703994234], [96.64085024564235, 20.968586309910336], [96.64900032740326, 20.96764591582638], [96.6559658329569, 20.966871970964746], [96.65025418558224, 20.955734258629207], [96.6424175688158, 20.935985983766216], [96.64210410472072, 20.935985983766216], [96.63175977069693, 20.935985983766216], [96.61671346625354, 20.934105195598363], [96.61331942665026, 20.933620334211128], [96.61044902540226, 20.937222894221236], [96.6094725271355, 20.94405899992296], [96.60947979635557, 20.946545607393944], [96.60899490888801, 20.950894866405008], [96.60882776808711, 20.95089494644469], [96.60651917781786, 20.954782017775926], [96.60671347094996, 20.95548404835023], [96.60780922921259, 20.95944330376551], [96.60802568074064, 20.96021757957766], [96.60754161165613, 20.96549804519867], [96.60664046308693, 20.967538303849665], [96.61201149583394, 20.968586309910336], [96.62360968893603, 20.96827284581525], [96.62351749403717, 20.96993236388755]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
