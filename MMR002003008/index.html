
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Doe Pa Rei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kayah</div><div class="name-mm">ကယားပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hpruso</div><div class="name-mm">ဖရူဆို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Doe Pa Rei</div><div class="name-mm">ဒိုးပရယ်</div></div>
        <span class="pcode-badge">MMR002003008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.14695728704919, 19.283769001738108], [97.13938803602912, 19.28996633967489], [97.1263632933314, 19.29358432395742], [97.11478574326748, 19.29937309898935], [97.10658497931342, 19.30636786758305], [97.10127860242562, 19.31312143890335], [97.0921130421832, 19.32325179543409], [97.08584186900708, 19.325422585284116], [97.07969073194181, 19.32925400566785], [97.08865960595608, 19.340144782156017], [97.10403481765275, 19.35744189632652], [97.11108179099193, 19.37025457259051], [97.11492559414091, 19.38498915222766], [97.11748812867427, 19.37730154592964], [97.1264570026886, 19.37217647506435], [97.13222270831142, 19.36577013558332], [97.13798841303492, 19.358082530184674], [97.14119158232575, 19.355519994752], [97.14503538457541, 19.347446081071837], [97.14823855476556, 19.339117840915662], [97.15528552720536, 19.32822706532687], [97.15848869559687, 19.317336288838703], [97.16169186578702, 19.30644551414923], [97.16873883822689, 19.295554737661064], [97.17258264137587, 19.284663962072216], [97.17386390909218, 19.27159695933227], [97.15912933035435, 19.279284564730915], [97.14695728704919, 19.283769001738108]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
