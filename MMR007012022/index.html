
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Leik Paw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Phyu</div><div class="name-mm">ဖြူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Leik Paw</div><div class="name-mm">လိပ်ပေါ</div></div>
        <span class="pcode-badge">MMR007012022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.51435858807844, 18.446371536916956], [96.51529452242431, 18.44004552218314], [96.51594452092297, 18.43506219706279], [96.5168111858876, 18.429428874343103], [96.5176778517515, 18.42552888065336], [96.51740386699493, 18.422681098254145], [96.51507785595834, 18.424337215989794], [96.51117786316792, 18.42542054831972], [96.50662787097951, 18.429320541110144], [96.50214345375747, 18.433784339575652], [96.5009945473605, 18.434628865030163], [96.49904455096532, 18.437228859924005], [96.49622788870613, 18.441128853613748], [96.49384456027832, 18.445245512870144], [96.49146123005181, 18.449145505660624], [96.49004987720014, 18.451766589656415], [96.49189456298376, 18.45261216731774], [96.49384456027832, 18.454345497246948], [96.49882788360003, 18.454778830178896], [96.50186121232514, 18.456078828075533], [96.50684453744549, 18.457595492438088], [96.51096119670194, 18.458028823571397], [96.5124778610645, 18.458678822969375], [96.51291119309712, 18.45564549514353], [96.51399452542705, 18.45001217242384], [96.51435858807844, 18.446371536916956]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
