
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pe Nan Toke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pe Nan Toke</div><div class="name-mm">ပဲနန်းတုတ်</div></div>
        <span class="pcode-badge">MMR013004016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25595338534055, 17.115925351373903], [96.25127480358935, 17.114722286904055], [96.24833398182784, 17.114722286904055], [96.24662303242707, 17.115428841068194], [96.24662303242707, 17.119811144768562], [96.24881418382756, 17.12492383286866], [96.2484489916277, 17.12930613656897], [96.24552745582747, 17.130401713168567], [96.2451622636276, 17.132227673268574], [96.2411451521271, 17.135514401268665], [96.2425274658699, 17.1384387150747], [96.24462697275663, 17.141063097783785], [96.24602664431427, 17.141937892619694], [96.24830110980844, 17.142462770240684], [96.25092549431616, 17.141762934012263], [96.25319995891101, 17.142462770240684], [96.25442467186116, 17.145612029671497], [96.25529946579775, 17.148411372786654], [96.25662175339124, 17.146670309587194], [96.25929522829222, 17.14493255229553], [96.25942890172252, 17.14292744634463], [96.25969624858305, 17.1398529502535], [96.25969624858305, 17.137179475352582], [96.2611666599135, 17.134773348211525], [96.2626370721432, 17.13116415660062], [96.26156768200298, 17.127688640218594], [96.25889420710206, 17.12474781665844], [96.25795849129139, 17.121673322366007], [96.25581971101093, 17.118999846565714], [96.25595338534055, 17.115925351373903]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
