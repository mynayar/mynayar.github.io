
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pan Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pan Yan</div><div class="name-mm">ပန်းရံ</div></div>
        <span class="pcode-badge">MMR005004063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59908131435122, 22.62134824692413], [95.60341980038356, 22.621554810406224], [95.60851271958637, 22.624433370303848], [95.61360527995976, 22.62288338965675], [95.6173697997765, 22.623326279684136], [95.61869820006194, 22.6277548202288], [95.62290551997381, 22.628640510351318], [95.6299910400545, 22.627311930201472], [95.63088384021711, 22.627386359892625], [95.630269679702, 22.62262572040072], [95.62698000012699, 22.616457929689773], [95.62492404021236, 22.610701350387046], [95.63006411986328, 22.605355889862494], [95.63170860037167, 22.598571329703134], [95.63126328037617, 22.598335530160625], [95.62821371978742, 22.596720929627224], [95.62728627594095, 22.595587426818327], [95.62240948900677, 22.60068095935884], [95.61518050997262, 22.606437368689683], [95.6099595803704, 22.611926038156184], [95.60380156079344, 22.617414707622686], [95.59908131435122, 22.62134824692413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
