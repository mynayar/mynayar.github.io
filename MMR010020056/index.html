
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Taw Kyei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Taw Kyei</div><div class="name-mm">အင်တောကျယ်</div></div>
        <span class="pcode-badge">MMR010020056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15457359009918, 20.810115433980172], [95.16050799504796, 20.81469908779269], [95.16752658488406, 20.82063789492298], [95.17292550111102, 20.822257570330635], [95.1745451747201, 20.826576702053217], [95.18480311537155, 20.826576702053217], [95.19614083693011, 20.83143572557833], [95.20369931856874, 20.83305540098604], [95.21017801840088, 20.83035594287253], [95.21017801840088, 20.822797461233904], [95.21287747471575, 20.81631876230108], [95.21719660823692, 20.808760280662455], [95.2215157399595, 20.802281581729687], [95.21773649914019, 20.797422558204573], [95.215037041926, 20.797422558204573], [95.20369931856874, 20.797422558204573], [95.18696268078315, 20.797422558204573], [95.17292550111102, 20.796882667301304], [95.15824904106046, 20.795645779329277], [95.15653049958297, 20.802176236044488], [95.15444617505102, 20.80577643443496], [95.15444617505102, 20.807409087059796], [95.15457359009918, 20.810115433980172]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
