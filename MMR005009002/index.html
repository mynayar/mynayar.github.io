
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Oe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Oe</div><div class="name-mm">မဲအိုး</div></div>
        <span class="pcode-badge">MMR005009002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3784288003489, 22.819023630336346], [95.37470495956632, 22.817161530080625], [95.3640208796599, 22.815940499854207], [95.36524199981852, 22.811972219742188], [95.36829444003644, 22.803730290220756], [95.36812775968843, 22.8034250998885], [95.36463144018887, 22.797014760223078], [95.36218919987175, 22.79121489025505], [95.35730507986563, 22.789993860028687], [95.35255668014673, 22.790672189869724], [95.35089492006455, 22.790909609990536], [95.3515054796942, 22.80159351003249], [95.35181075995865, 22.807698660265032], [95.35394736028252, 22.815330030156815], [95.35455791991211, 22.822656119784142], [95.35455791991211, 22.82488982980186], [95.35476888017973, 22.824932040381384], [95.35657536006488, 22.828364550283823], [95.35946615973552, 22.83161652038615], [95.35969944027698, 22.832252369851062], [95.36371560029477, 22.82998230024299], [95.37165215961954, 22.82418243027496], [95.37684155989012, 22.82021406023074], [95.3784288003489, 22.819023630336346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
