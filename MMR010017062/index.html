
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Naung Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Naung Taing</div><div class="name-mm">ထနောင်းတိုင်</div></div>
        <span class="pcode-badge">MMR010017062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3266098172893, 21.397659942052712], [95.3266098172893, 21.39510242393777], [95.32705460218818, 21.3894314052352], [95.32719925813933, 21.388088176028532], [95.32281900489323, 21.389291506697703], [95.31344381897713, 21.390756265789094], [95.30611953338979, 21.388119256598486], [95.30069162391936, 21.37598561344538], [95.29293595333166, 21.376985541749377], [95.28767174835258, 21.38429763163043], [95.28718351990358, 21.38705265795386], [95.28590422619914, 21.394271596057365], [95.28950625021332, 21.393707168051435], [95.29505601782103, 21.394968478912233], [95.30123644220811, 21.39824788822949], [95.30678620981581, 21.40064437823554], [95.31258823995535, 21.40430218000165], [95.32060520766424, 21.398660710323554], [95.32227315508209, 21.397993532075873], [95.32516426322024, 21.396547978006822], [95.3266098172893, 21.397659942052712]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
