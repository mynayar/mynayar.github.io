
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Byin Nyar Law</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Byin Nyar Law</div><div class="name-mm">ဗျင်္ညားလော</div></div>
        <span class="pcode-badge">MMR010014042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.07390828204166, 21.79726481062255], [96.07205586298772, 21.800357604320027], [96.0703887726238, 21.804247479737455], [96.07131493403705, 21.806655498152793], [96.07224109455092, 21.809248749030587], [96.07409341737736, 21.812768161321628], [96.07298202440097, 21.81387955429807], [96.07187062962589, 21.816472804276543], [96.06983307613564, 21.81888082269188], [96.06964784367312, 21.82128884110716], [96.06964784367312, 21.82149539199878], [96.07314850779744, 21.822370557355384], [96.07624794388755, 21.82746248640467], [96.07616593471016, 21.831162986182903], [96.07846182655209, 21.835653849745427], [96.08244681606777, 21.834989686025267], [96.08510347274711, 21.832554417252595], [96.09462316802484, 21.826355545072374], [96.10134649784266, 21.822400744898516], [96.10281453316423, 21.819492509171994], [96.10212905281361, 21.818464289995063], [96.10104342631314, 21.81683585159334], [96.0941803922114, 21.812186700156133], [96.08776013212446, 21.809530039879462], [96.08266820397449, 21.805987827975912], [96.07853888496163, 21.797895436825], [96.07860043726043, 21.79724272956838], [96.07752787521133, 21.79708383105401], [96.07390828204166, 21.79726481062255]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
