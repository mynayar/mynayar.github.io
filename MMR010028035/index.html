
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Hpyu</div><div class="name-mm">ကဖြူ</div></div>
        <span class="pcode-badge">MMR010028035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.94522230116831, 20.882466185765907], [95.940771103104, 20.881052017136938], [95.94023752274353, 20.882054300765446], [95.93592732038957, 20.881607426741425], [95.92972378972115, 20.88252646912133], [95.92700127388974, 20.88292980516644], [95.9236953309748, 20.885905152800603], [95.92038938805985, 20.88987228537769], [95.91543047323779, 20.89317822829264], [95.91275472575006, 20.891266980087096], [95.91080215279715, 20.895822983344033], [95.90981036965292, 20.900120709403268], [95.91080215279715, 20.904418434563127], [95.91245512470431, 20.907063188715256], [95.91543047323779, 20.910369131630148], [95.92071998244131, 20.910369131630148], [95.92534830288196, 20.911030321292344], [95.92964602894114, 20.911030321292344], [95.9307439662611, 20.91073088392318], [95.93162853942562, 20.907340161019647], [95.93895294102549, 20.904703417129042], [95.94224749942259, 20.89859952324946], [95.9430549143529, 20.88771028100473], [95.94522230116831, 20.882466185765907]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
