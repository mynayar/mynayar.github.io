
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zoke Ka Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wakema</div><div class="name-mm">ဝါးခယ်မ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zoke Ka Ni</div><div class="name-mm">ဇုက္ကနိ</div></div>
        <span class="pcode-badge">MMR017017071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.1686474396277, 16.633502369738608], [95.16937752005657, 16.633063979918802], [95.17265064041476, 16.63109730020028], [95.17285836042504, 16.630689509813067], [95.17306608043532, 16.63028163039297], [95.17782024031192, 16.631124389578986], [95.18004395976101, 16.631793450107693], [95.18039224020976, 16.63183905023203], [95.1806786356106, 16.629851519731915], [95.18092019980742, 16.627939109602266], [95.17978943993074, 16.625403900069955], [95.17919184043114, 16.624063980368476], [95.1764799599822, 16.61955957031796], [95.17552092025431, 16.615884509662465], [95.1746939999282, 16.616171159571422], [95.17086215956107, 16.617499739721268], [95.16733236010037, 16.618528350103304], [95.16515255994273, 16.61916357004276], [95.16095352008892, 16.620369929628623], [95.15992247973873, 16.620728760024292], [95.1608753995801, 16.622697509982174], [95.16416256015407, 16.627836329682907], [95.16551292008523, 16.629947550239308], [95.1686474396277, 16.633502369738608]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
