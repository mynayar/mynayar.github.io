
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Manton (Kachin)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Manton (Kachin)</div><div class="name-mm">မန်တုံ (ကချင်)</div></div>
        <span class="pcode-badge">MMR015019015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.15055600515558, 23.259989030269594], [97.15500418959175, 23.264159203684358], [97.15531030622572, 23.27089377143045], [97.15560146623471, 23.274970007959553], [97.15592254039296, 23.27946503718175], [97.16602439021352, 23.283444554322784], [97.16724885674938, 23.288648537999677], [97.16694274011542, 23.300893204258045], [97.17020664062403, 23.306809025616076], [97.18071799044299, 23.304566604765057], [97.21151910502272, 23.303353961616097], [97.21837034091857, 23.282526204420833], [97.21756449980188, 23.27640181139452], [97.21683975684937, 23.27089377143045], [97.20196089088245, 23.25729756533042], [97.19908499117946, 23.254669587131787], [97.1954283315523, 23.253322397310853], [97.18745255728976, 23.250383954256108], [97.17920894873407, 23.243553535867022], [97.17673847330195, 23.241506570072204], [97.17330915869076, 23.23453920112331], [97.16183257101642, 23.241895988209365], [97.15124645965642, 23.25810597131357], [97.15055600515558, 23.259989030269594]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
