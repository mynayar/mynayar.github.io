
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Gyi Inn</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukkyi</div><div class="name-mm">ကျောက်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Gyi Inn</div><div class="name-mm">ရွာကြီးအင်း</div></div>
        <span class="pcode-badge">MMR007011020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74186825821363, 18.31548572168873], [96.73798494335051, 18.313218217846554], [96.7375487397826, 18.305366568012744], [96.73798494335051, 18.302749352001058], [96.7331867121971, 18.302313149332406], [96.72577126593126, 18.29969593332072], [96.7170472107602, 18.296206311072467], [96.7126851831747, 18.297078716409658], [96.70134391199201, 18.297951121746905], [96.69480087106342, 18.297951121746905], [96.6903465694387, 18.299435888955145], [96.69305606038893, 18.301004541326563], [96.6952370728327, 18.304494162675496], [96.70090770932336, 18.307547582255154], [96.70526973690892, 18.310601000935492], [96.7096317635951, 18.317144042763402], [96.7096317635951, 18.321942273017555], [96.71137657516886, 18.325868097934404], [96.71434950992199, 18.330732901402314], [96.7183558187661, 18.325868097934404], [96.72228164368295, 18.32237847568615], [96.72969708994879, 18.316271637426155], [96.73449532110226, 18.316707840094807], [96.73929355135635, 18.317580245432055], [96.74186825821363, 18.31548572168873]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
