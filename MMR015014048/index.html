
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nam Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hsipaw</div><div class="name-mm">သီပေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nam Yang</div><div class="name-mm">နမ့်ရမ်း</div></div>
        <span class="pcode-badge">MMR015014048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.40576537167465, 22.511863652385728], [97.40767273570822, 22.5125376645816], [97.42686878186885, 22.515014573763608], [97.431214824005, 22.49328436488156], [97.43589517742055, 22.476903130175344], [97.44559019283321, 22.464199315046415], [97.45528521004445, 22.458516029591124], [97.46865764593366, 22.455841542053577], [97.4705824496204, 22.45323467903728], [97.45896262962174, 22.441131861945905], [97.44291570619492, 22.429096669375838], [97.43380049809457, 22.424254214960115], [97.43188344566454, 22.42508493761983], [97.4215198067937, 22.42508493761983], [97.4118247913811, 22.420404585103597], [97.40547288336694, 22.418064408845453], [97.40079252995133, 22.413718366709304], [97.39109751363941, 22.41538992220717], [97.37605352315165, 22.414386989268166], [97.35866935460712, 22.417395787185853], [97.35532624630929, 22.423747694300687], [97.35666348962843, 22.43444564355167], [97.36100953176452, 22.45283274413589], [97.36288475762552, 22.466364415785222], [97.38106818604803, 22.48058054975263], [97.40576537167465, 22.511863652385728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
