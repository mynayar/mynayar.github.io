
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aint Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aint Kaing</div><div class="name-mm">အိုင့်ကိုင်း</div></div>
        <span class="pcode-badge">MMR009021002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.54090856997459, 21.41823845484089], [94.54036344321838, 21.416693927682672], [94.53550188720237, 21.410031795830776], [94.53366016198697, 21.407507951031164], [94.52571553394478, 21.411480264602574], [94.51230897238122, 21.41421123226263], [94.51168296060018, 21.41582097375897], [94.5075297807748, 21.426500580437505], [94.51057108468785, 21.42736952338487], [94.51207068081732, 21.431637605990772], [94.51350066582313, 21.43082047208719], [94.51787021174096, 21.434594170384685], [94.51846606026055, 21.440552642090836], [94.51647990212587, 21.450086196820564], [94.51608267067877, 21.45942113627649], [94.51632069424471, 21.464895661205844], [94.52355739575728, 21.469349015844443], [94.53556615005783, 21.47699095007232], [94.53571266490763, 21.477004579297954], [94.53502029844805, 21.4737158350178], [94.53661219469711, 21.471655732825866], [94.53539804968028, 21.470320173936955], [94.53490151059628, 21.46212727455412], [94.53465324105429, 21.444996668961153], [94.53092919612556, 21.43878992771306], [94.53068092658356, 21.431590108296916], [94.53564632012166, 21.421411051678717], [94.54185306136975, 21.4209145116954], [94.54090856997459, 21.41823845484089]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
