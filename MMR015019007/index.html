
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Loi Kyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Manton</div><div class="name-mm">မန်တုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Loi Kyu</div><div class="name-mm">လွယ်ကြူ</div></div>
        <span class="pcode-badge">MMR015019007</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.28090072888557, 23.44221587306413], [97.28816494155888, 23.43313560722254], [97.29275669196784, 23.42609492284248], [97.30438912585754, 23.420584823430886], [97.31571544311328, 23.408340156273255], [97.32642952620171, 23.393340439409826], [97.33653137602226, 23.37711625601048], [97.34693934337605, 23.356912554570783], [97.35122497625173, 23.342525071874604], [97.35098105043517, 23.326707822707874], [97.33123262898272, 23.322854875252347], [97.3282214163853, 23.32812449774741], [97.30752833176717, 23.33985057894114], [97.28062732239306, 23.350197120800544], [97.26200354722596, 23.363302741328482], [97.25053542756797, 23.367889988831962], [97.25165700536655, 23.37433905330471], [97.25441608223645, 23.39089351992004], [97.25165700536655, 23.399170754127056], [97.25027746603229, 23.408827525869697], [97.2433797711596, 23.41365591308994], [97.24200023182527, 23.426761532718615], [97.24613884892881, 23.442626231015822], [97.25234677368474, 23.453662542092673], [97.25092028434369, 23.455881526611222], [97.26183890833903, 23.453033190229576], [97.28090072888557, 23.44221587306413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
