
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Par Me</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lawksawk</div><div class="name-mm">ရပ်စောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Par Me</div><div class="name-mm">ပါမဲ</div></div>
        <span class="pcode-badge">MMR014008011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.83883985307682, 21.43593760733478], [96.83997815556751, 21.436506757680775], [96.8439407798432, 21.436378930743103], [96.85477608794616, 21.43602940473329], [96.87768901503608, 21.446053811234435], [96.89432178831993, 21.45130626567169], [96.89582841624849, 21.451782043006915], [96.89703299337799, 21.444855727210097], [96.89773782713905, 21.44080293240944], [96.89821517918722, 21.424095589140165], [96.89678312124408, 21.39593178322525], [96.90107929507349, 21.388771492610374], [96.91253575861845, 21.37970179200414], [96.93688074365144, 21.361085038743568], [96.94069956543268, 21.356311511966737], [96.93988022908934, 21.356114871604063], [96.92876574894024, 21.353447396080526], [96.91683193334711, 21.352492691084876], [96.90728487979345, 21.344377696373613], [96.89726047419157, 21.328147706051823], [96.8805531309223, 21.320987416336266], [96.86391845017641, 21.317244613348294], [96.86145902471429, 21.316691241607543], [96.84244222333001, 21.315000859701968], [96.84474969574194, 21.321538699851146], [96.84809315117803, 21.33101182193809], [96.85238932500738, 21.341036228439236], [96.85047991411682, 21.360130333747975], [96.84618374028742, 21.39020355055345], [96.84574372179537, 21.4082442799496], [96.84570638733999, 21.409775008809675], [96.84570638733999, 21.42170882620144], [96.8409328605631, 21.435552052685125], [96.84059527844943, 21.435614239005986], [96.83883985307682, 21.43593760733478]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
