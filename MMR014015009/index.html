
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Wan Wa</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyethi</div><div class="name-mm">ကျေးသီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Wan Wa</div><div class="name-mm">ဝမ်ဝ</div></div>
        <span class="pcode-badge">MMR014015009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.05701061035143, 22.00100814920677], [98.08036399480255, 21.983316191289248], [98.09211042495622, 21.968633152697862], [98.0994519451512, 21.953215962446734], [98.1031227043494, 21.954089953288758], [98.1031227043494, 21.952481809887672], [98.11927404626027, 21.937064619636544], [98.1263836933528, 21.92413798937673], [98.12518969764648, 21.92351888079179], [98.10931618689256, 21.921038645017518], [98.09310768407244, 21.935816985665383], [98.04819286380967, 21.972711302984294], [98.03497415173575, 21.987096371000746], [98.0428458609478, 21.991425810752617], [98.05353986577222, 21.999446314595787], [98.05701061035143, 22.00100814920677]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
