
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Me Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Me Kone</div><div class="name-mm">မဲကုန်း</div></div>
        <span class="pcode-badge">MMR005006034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.63366772038904, 22.352134499907322], [95.63989787998321, 22.352134499907322], [95.64663312042222, 22.353397380085084], [95.65757819977415, 22.353397380085084], [95.66683919966937, 22.34960873955174], [95.67189072038047, 22.351713570424977], [95.67820512037008, 22.351713570424977], [95.68494035990972, 22.348766789755587], [95.68704527981589, 22.345399170435428], [95.69302956026604, 22.34307194981068], [95.69167560034873, 22.336980030404106], [95.69148083956912, 22.33620045039055], [95.69041307989977, 22.331928509693], [95.68494035990972, 22.324772249839498], [95.67694224019232, 22.321825470069427], [95.66768124029704, 22.32266741986558], [95.66362043973157, 22.32266741986558], [95.66347176021361, 22.325193180221163], [95.66347176021361, 22.332349440074665], [95.6630505600354, 22.339084770445822], [95.65842024040182, 22.341189600419796], [95.64789599970067, 22.338663840064214], [95.64158159971112, 22.338242909682606], [95.63653043962813, 22.338242909682606], [95.6323205998159, 22.338242909682606], [95.6323205998159, 22.341610529902084], [95.6323205998159, 22.34708298009548], [95.63366772038904, 22.352134499907322]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
