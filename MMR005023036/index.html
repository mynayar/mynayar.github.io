
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Si Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Si Gyi</div><div class="name-mm">မံစီကြီး</div></div>
        <span class="pcode-badge">MMR005023036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72884668043002, 24.63934716014336], [95.72882147962764, 24.63935030956918], [95.71845023968689, 24.640646669708076], [95.70805415957187, 24.64649460034559], [95.69180987992206, 24.654291840296253], [95.67587592033749, 24.66200178035791], [95.6892106800289, 24.670536119946007], [95.7041553601818, 24.67768356014824], [95.71455180002562, 24.700425480251738], [95.72559767988906, 24.722517599707487], [95.73014627992694, 24.731614350122186], [95.73599411973288, 24.740061389821335], [95.74574075982827, 24.751757250196988], [95.75938583958487, 24.75565577979046], [95.77433051973776, 24.758254889751413], [95.79967163973447, 24.756305580438266], [95.8101573597744, 24.758927099705943], [95.81071751959792, 24.75500606997423], [95.81071751959792, 24.732264149870673], [95.81006771984943, 24.719918489746533], [95.80292027964725, 24.71147153997964], [95.79252420043156, 24.70367430002898], [95.79374063961887, 24.70301072986132], [95.78212775968842, 24.688079820127655], [95.7665332797871, 24.669886320197577], [95.74509096007978, 24.6516928202675], [95.72884668043002, 24.63934716014336]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
