
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thongwa</div><div class="name-mm">သုံးခွ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se</div><div class="name-mm">ဆယ်</div></div>
        <span class="pcode-badge">MMR013025019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.56357231071365, 16.68834861739481], [96.56363231977582, 16.688514240140137], [96.56582004026268, 16.69107834039312], [96.56800199969257, 16.693276230413744], [96.56949311971175, 16.696689750231826], [96.56800596030689, 16.703078130251583], [96.56547227962204, 16.70595929998177], [96.56425691962119, 16.7077859399692], [96.56412803957744, 16.710453630430777], [96.56552915994286, 16.71623325036427], [96.56578188022962, 16.717819499770144], [96.56629992030514, 16.721679780297677], [96.57064655959113, 16.72031492959036], [96.57643140008912, 16.719526889654276], [96.57805716030975, 16.715801520024172], [96.57977687989916, 16.712332469767716], [96.58184688002956, 16.70851331973398], [96.58975787972241, 16.704549899558288], [96.58996091966077, 16.703471609727046], [96.59152259958836, 16.701122969949154], [96.59210076024198, 16.70102694034108], [96.59284344017266, 16.69959863976544], [96.59239920026295, 16.698310469752414], [96.59555820025082, 16.696473660231277], [96.59806343987589, 16.69562010018751], [96.59918815361044, 16.69470659403413], [96.59450187995787, 16.68943453527561], [96.59034266028561, 16.688558910365487], [96.5876561218326, 16.68395002697224], [96.5844321862964, 16.686150941412848], [96.58136749731221, 16.686369846291427], [96.5778649949736, 16.685932032937046], [96.5783436501394, 16.68245117188411], [96.57480030598941, 16.683305158206508], [96.57348686682548, 16.682429529699107], [96.56998436538623, 16.684180783116688], [96.56357231071365, 16.68834861739481]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
