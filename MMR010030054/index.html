
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Toke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Toke Kone</div><div class="name-mm">ရွှေတုတ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010030054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13356744857896, 20.741337436873266], [96.134196777959, 20.74920405682184], [96.13388211416827, 20.75298003490076], [96.13482610823837, 20.758329337329087], [96.13514077292837, 20.764622633827514], [96.13514077292837, 20.76577023530814], [96.13923141569734, 20.7633639741681], [96.14332205756699, 20.7605319910586], [96.14772736592528, 20.759273332298505], [96.1530766683536, 20.756126682700312], [96.16220194706227, 20.75486802394022], [96.16660725542056, 20.750777381171247], [96.17132722667026, 20.75046271738057], [96.17478854005913, 20.751721376140665], [96.18485781373715, 20.75046271738057], [96.18800446333535, 20.74920405682184], [96.18926312209544, 20.74731606778238], [96.18737513305598, 20.7407081065939], [96.18076717186756, 20.738190789073712], [96.17227122163962, 20.738190789073712], [96.16251661175227, 20.73882011755444], [96.15905529926272, 20.739134783143754], [96.15590865056384, 20.74165210156326], [96.15118867931415, 20.741022772183214], [96.14583937688582, 20.741022772183214], [96.14269272908626, 20.741022772183214], [96.14191307802616, 20.738527891848776], [96.13938506756688, 20.739159894013937], [96.136438112429, 20.740878951702314], [96.13356744857896, 20.741337436873266]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
