
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Khaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pwintbyu</div><div class="name-mm">ပွင့်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Khaing</div><div class="name-mm">ရွာခိုင်</div></div>
        <span class="pcode-badge">MMR009008031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.70689296683702, 20.43681292667526], [94.71009230771386, 20.432875276572815], [94.71566608362292, 20.434666848396375], [94.72422581107236, 20.431083705648575], [94.73139209387011, 20.42829681814368], [94.73213209112316, 20.428491553742276], [94.73238741135003, 20.426704311255037], [94.7331040397197, 20.425987681985987], [94.73218834821375, 20.422324915062802], [94.73019771415323, 20.42272304223468], [94.72800801605717, 20.42073240817416], [94.72516145223926, 20.41519742182362], [94.72442487420864, 20.413765187613365], [94.7212398604313, 20.412172680724666], [94.71924922457214, 20.411376427280345], [94.70415965734236, 20.41002223533792], [94.70372227836054, 20.409982982628605], [94.70332415208799, 20.411973616689124], [94.70013913741133, 20.430088389067976], [94.69928806938896, 20.431960738897033], [94.70312508805245, 20.433273403744636], [94.70689296683702, 20.43681292667526]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
