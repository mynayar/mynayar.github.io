
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Wun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Wun</div><div class="name-mm">ညောင်ဝန်း</div></div>
        <span class="pcode-badge">MMR014006014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.60729634674908, 21.084179703230745], [96.62078850668428, 21.080806662797272], [96.64022331655286, 21.075477763288177], [96.6571504091641, 21.07171618695253], [96.67313710679213, 21.065760358353884], [96.68993225087274, 21.056429723053327], [96.68975073530822, 21.056356418414055], [96.70134892841037, 21.04757940666434], [96.70448357385789, 21.040996648976204], [96.70448357385789, 21.033160033109084], [96.7038566447684, 21.03347349720417], [96.68630262306766, 21.04350436713287], [96.67156978361868, 21.048833265742644], [96.64586568105642, 21.055102559335694], [96.63113284070812, 21.05761027659304], [96.61953464760597, 21.05666988340846], [96.6115530313474, 21.055529651872007], [96.6109652983099, 21.057131612434034], [96.60945285266706, 21.06125402285494], [96.60917446662842, 21.061509424020755], [96.60845287220235, 21.06379873372464], [96.60775866123328, 21.065999188611727], [96.60775508283086, 21.066384618255597], [96.60842658861623, 21.068704043556806], [96.60869781964874, 21.06921950257805], [96.61074660297339, 21.071935510915125], [96.61088348968138, 21.072194512067142], [96.61154680713952, 21.075670226299962], [96.61046420865637, 21.08131970264219], [96.60945235624132, 21.082249996440225], [96.60754496972464, 21.083997595013045], [96.60729634674908, 21.084179703230745]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
