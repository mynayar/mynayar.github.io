
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Min Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Oke Ta Ra Thi Ri</div><div class="name-mm">ဥတ္တရသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Min Kone</div><div class="name-mm">မင်းကုန်း</div></div>
        <span class="pcode-badge">MMR018008005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.06528955187139, 19.834761735265943], [96.05989914682823, 19.833355542724178], [96.05322531209856, 19.832328799334675], [96.04757822075834, 19.828735194773458], [96.04218781571518, 19.8233447897303], [96.03577066728252, 19.821034615754968], [96.02601659968639, 19.821034615754968], [96.0221663106268, 19.82154798834904], [96.0211395672373, 19.82437153401912], [96.01882939326197, 19.827195078789885], [96.01703259098133, 19.82924856736753], [96.01472241790532, 19.828735194773458], [96.01312375875455, 19.83001412155454], [96.01087212794641, 19.831815426740604], [96.00625178089501, 19.839259320361407], [96.00419829321675, 19.85029681584541], [96.00625178089501, 19.854147105804316], [96.01215555763292, 19.855173850093138], [96.01651921928658, 19.855430534591562], [96.0183160206679, 19.857740708566894], [96.02652997228046, 19.857740708566894], [96.03294712071312, 19.859537510847474], [96.03448723669669, 19.86082094143336], [96.0367974097727, 19.852863676117806], [96.0419311303175, 19.845676468794068], [96.04655147736884, 19.84259623682692], [96.04988839473367, 19.84028606375091], [96.05630554406565, 19.84336629481868], [96.06272269339763, 19.845676468794068], [96.06580292356614, 19.84156949343742], [96.06580292356614, 19.83489565780843], [96.06528955187139, 19.834761735265943]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
