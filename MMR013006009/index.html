
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Daunt Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Daunt Gyi</div><div class="name-mm">ဒေါင့်ကြီး</div></div>
        <span class="pcode-badge">MMR013006009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.88027873807334, 16.993074135063353], [95.8782788347005, 16.99998462009421], [95.88111141585921, 17.00140091022388], [95.88349510311656, 17.00412627960418], [95.88379253589687, 17.00680317372752], [95.88364382040606, 17.0091826350706], [95.88249921096985, 17.01250327740439], [95.8872177172239, 17.01305839472917], [95.89249134080279, 17.01056036317027], [95.89387913681276, 17.009727685384405], [95.89832008440442, 17.009450125822696], [95.89970787861574, 17.009450125822696], [95.90109567462576, 17.00833988937444], [95.90165079374918, 17.004731619568645], [95.90165079374918, 17.002511146672134], [95.90220591197334, 17.00112335066217], [95.90276103019744, 16.998347760440822], [95.90220591197334, 16.99362925418677], [95.9019283533109, 16.990853662166842], [95.90109567462576, 16.990020985280296], [95.89693228839445, 16.987245393260366], [95.89360157815037, 16.98419224167867], [95.89249134080279, 16.98474736080209], [95.88860551323393, 16.98835562970862], [95.88444212520398, 16.99168633995265], [95.88027873807334, 16.993074135063353]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
