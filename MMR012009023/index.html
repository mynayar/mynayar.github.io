
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Done Paik (Aung Seik Pyin)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Maungdaw</div><div class="name-mm">မောင်တော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Done Paik (Aung Seik Pyin)</div><div class="name-mm">ဒုံးပိုက် (အောင်ဆိပ်ပြင်)</div></div>
        <span class="pcode-badge">MMR012009023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.38929000143247, 21.12275734277722], [92.38919612660004, 21.118063590362453], [92.38778850683417, 21.113997133960595], [92.3866936928597, 21.112120310903663], [92.38825771282325, 21.10852306318884], [92.38831975075595, 21.10666192970433], [92.38030831028033, 21.106145063244128], [92.3686533924402, 21.102522587747274], [92.35621097875372, 21.098270118271387], [92.34250857531055, 21.09512014028229], [92.33297828871713, 21.092699749893598], [92.33258614473488, 21.092600158070866], [92.33243693731487, 21.093066431370744], [92.33132615317948, 21.096537630107605], [92.32833367435967, 21.0996876080967], [92.32799788009817, 21.100247265199187], [92.32822507133005, 21.100300100369395], [92.32672563168262, 21.108734443439857], [92.32701940512152, 21.109114620143657], [92.33441025582869, 21.109484162364254], [92.34584347639537, 21.11698135610476], [92.36739790738756, 21.121667101855337], [92.38295458428672, 21.122229391273436], [92.38929000143247, 21.12275734277722]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
