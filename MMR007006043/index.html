
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thu Htay Gyi Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyauktaga</div><div class="name-mm">ကျောက်တံခါး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thu Htay Gyi Ywar Thit</div><div class="name-mm">သူဌေးကြီးရွာသစ်</div></div>
        <span class="pcode-badge">MMR007006043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.54170732313452, 18.190338849158593], [96.5447840378531, 18.19212532902077], [96.54749400904132, 18.193110772843966], [96.54863297972827, 18.19352494392109], [96.55027401583322, 18.18675567133721], [96.5507875889761, 18.182390292877756], [96.55155795003941, 18.17545704510661], [96.55155795003941, 18.164158419775276], [96.55139431929246, 18.159904020354304], [96.54411112912538, 18.157738746945654], [96.53435322592071, 18.155170877633964], [96.53203557767984, 18.154140812148796], [96.52767676517061, 18.15902268205116], [96.52331138671121, 18.164928780838636], [96.51894600915108, 18.17468668494263], [96.52342241970894, 18.17468668494263], [96.52375698639588, 18.174965490065347], [96.52403419791995, 18.17519649981864], [96.52617254562654, 18.177518766078265], [96.52659551297262, 18.177978112799735], [96.52679863025264, 18.1782124788229], [96.52861784543728, 18.18031157202148], [96.5338631115934, 18.185307064969095], [96.5351464999111, 18.186529338957882], [96.54170732313452, 18.190338849158593]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
