
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Daung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Daung</div><div class="name-mm">အင်ဒေါင်း</div></div>
        <span class="pcode-badge">MMR005006050</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.00771837820065, 22.319994692301236], [96.00896124306695, 22.319106918449563], [96.01014916295355, 22.31825840090454], [96.00967113101797, 22.31323765139655], [96.0093678643355, 22.310052782410025], [96.00899416634775, 22.30668867224449], [96.00184944029951, 22.308779790255187], [95.99434451958399, 22.30919676002253], [95.98887216022206, 22.310038709818627], [95.9821369197831, 22.310459640200293], [95.97245471970962, 22.30793387984471], [95.97239351994506, 22.308484950220304], [95.97161303971006, 22.31551116001208], [95.97161303971006, 22.32308835024719], [95.97161303971006, 22.331086559896846], [95.97268007992182, 22.335355440201454], [95.97919031987743, 22.335717150226344], [95.98634639986653, 22.33613807970869], [95.99139791967832, 22.336980030404106], [95.9933215902193, 22.33756548186153], [95.99446655398833, 22.335275553424083], [95.99735072925279, 22.3348201547264], [95.99725800015665, 22.32841499965258], [95.99908417339594, 22.32674108972958], [96.00194577028111, 22.32411795887674], [96.0053615420016, 22.32167812964201], [96.00771837820065, 22.319994692301236]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
