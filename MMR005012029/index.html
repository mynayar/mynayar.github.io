
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Yoe Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monywa</div><div class="name-mm">မုံရွာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Yoe Taw</div><div class="name-mm">မရိုးတော</div></div>
        <span class="pcode-badge">MMR005012029</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0833770462138, 22.26630615090818], [95.09104749434647, 22.269327843305348], [95.097913384695, 22.268469604988354], [95.09758667988143, 22.266480870295993], [95.09716439961738, 22.262680259786237], [95.0965293604417, 22.2537899703309], [95.09716439961738, 22.24632852014514], [95.09701139975635, 22.245257250421844], [95.093790479647, 22.24563615008833], [95.0876654400081, 22.247065349985974], [95.0835823200681, 22.251352859746703], [95.0778655195781, 22.251352859746703], [95.07480299975867, 22.248494549883617], [95.07071987981868, 22.24645281004922], [95.06738519996708, 22.249152180029114], [95.0670939149523, 22.249058937420102], [95.07054185632165, 22.256446092813007], [95.07317078240573, 22.260652376705877], [95.07658838874323, 22.262229735413996], [95.08237203224354, 22.265910236068578], [95.0833770462138, 22.26630615090818]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
