
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Det Khi Na Thi Ri</div><div class="name-mm">ဒက္ခိဏသီရိ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Ma</div><div class="name-mm">ရွာမ</div></div>
        <span class="pcode-badge">MMR018004008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14941310283251, 19.7019953692909], [96.15253123312999, 19.701368559811215], [96.1572425663914, 19.70070231056326], [96.16143041777963, 19.70051195376368], [96.1653327344182, 19.70108302506162], [96.16971094170663, 19.70060713261313], [96.17476460640154, 19.699409712288457], [96.17437579710543, 19.69839880955749], [96.17418499064485, 19.69790271204056], [96.17416974084091, 19.69786306273022], [96.17238514505846, 19.691557491385197], [96.16584162658984, 19.685727811589288], [96.16084475857883, 19.675615101555763], [96.15756779541749, 19.673581017649894], [96.15548175857634, 19.67228616837201], [96.15538626496419, 19.67225162631155], [96.15440299839969, 19.671895962428778], [96.15372087881559, 19.676010560439067], [96.14941310283251, 19.7019953692909]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
