
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lein Tone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lein Tone</div><div class="name-mm">လိန်တုန်း</div></div>
        <span class="pcode-badge">MMR009015025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.08409414492888, 18.90867748477814], [95.0843118959773, 18.90864505432586], [95.08025635824441, 18.894585853854096], [95.07809340418731, 18.884852562395906], [95.07809340418731, 18.87944517725316], [95.08268968088413, 18.869711884895594], [95.08570394757919, 18.864852148208115], [95.08163011313928, 18.864081422919355], [95.08132863161114, 18.86264938566069], [95.07863414225193, 18.865385976781454], [95.07079343357015, 18.870793361024823], [95.05943792701879, 18.869171145931716], [95.04564909602902, 18.85970822305609], [95.04231430376217, 18.856920933554306], [95.04044968090813, 18.855185661089422], [95.03068639436168, 18.86285681429058], [95.02862926982499, 18.86435290306406], [95.02529811711446, 18.866775559744326], [95.02578796164516, 18.86897985833383], [95.02284890075623, 18.87436813468173], [95.02211413575884, 18.87951149056289], [95.0201547612333, 18.884409925977366], [95.01941999623591, 18.890532970020615], [95.01888718389648, 18.895861097911393], [95.02119236303719, 18.895441163079283], [95.02256042612282, 18.888807942632525], [95.02942694239954, 18.894045115789538], [95.04267503442537, 18.895396962300026], [95.05132684975439, 18.899182130550912], [95.06565641880871, 18.90783394587993], [95.07160454201608, 18.910537638900962], [95.08409414492888, 18.90867748477814]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
