
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Ta Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Ta Yar</div><div class="name-mm">သင်းတရား</div></div>
        <span class="pcode-badge">MMR010019024</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60539367557772, 21.384211029615358], [95.60107964391051, 21.377308578228337], [95.60107964391051, 21.373184471686045], [95.60107964391051, 21.368647955838526], [95.59901759108902, 21.36287420667935], [95.59943000129357, 21.356275638010345], [95.59406866413758, 21.356275638010345], [95.58334598802696, 21.358750101036378], [95.57592259715022, 21.361636976065654], [95.56602474324734, 21.36741072432551], [95.5626701011443, 21.369786929223437], [95.56313786911744, 21.372359651276952], [95.56313786911744, 21.379370631049824], [95.56396269042585, 21.384319558900586], [95.56519992193893, 21.388031254338955], [95.56849920627343, 21.39091812756959], [95.5689645083055, 21.39096244256274], [95.57715982866324, 21.39174294887806], [95.58788250477386, 21.391330538673458], [95.59365625303371, 21.392155359981928], [95.59819276978055, 21.392980181290397], [95.59901759108902, 21.39174294887806], [95.59901759108902, 21.38844366544288], [95.60231687632285, 21.38596920061815], [95.60539367557772, 21.384211029615358]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
