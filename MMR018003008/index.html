
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Sa Yit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tatkon</div><div class="name-mm">တပ်ကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Sa Yit Kone</div><div class="name-mm">ကျောက်စရစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR018003008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.29561211160973, 20.227524306301746], [96.28021176925779, 20.218861612773253], [96.26755507320814, 20.217675047265686], [96.25924911735297, 20.218861612773253], [96.25410733438605, 20.220443699217412], [96.24580137763155, 20.220443699217412], [96.23512229076118, 20.220839221053268], [96.23235363880946, 20.22479443941188], [96.230300823824, 20.230089866154458], [96.23839895534758, 20.237253597575545], [96.24244801976039, 20.240368263684445], [96.2480544185766, 20.24722052840474], [96.25584108339933, 20.251892527118457], [96.2617589489164, 20.253761327323446], [96.2623818823181, 20.25064666121449], [96.26580801422853, 20.244728795697426], [96.26829974693584, 20.241925597188583], [96.27359467905126, 20.239122396881157], [96.27982401036985, 20.23787653097719], [96.2857418749876, 20.236630665073164], [96.2891680077974, 20.232893065562564], [96.29165973960534, 20.22853253265032], [96.295397339116, 20.227598134346465], [96.29561211160973, 20.227524306301746]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
