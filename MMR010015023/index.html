
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ka Thea Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ka Thea Kone</div><div class="name-mm">ကသဲကုန်း</div></div>
        <span class="pcode-badge">MMR010015023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.15482942633702, 21.46496079100774], [96.15702589003286, 21.464700068553384], [96.1563654638951, 21.462656733321637], [96.15953863809773, 21.461976766714486], [96.15953788356654, 21.46048383096405], [96.15953788356654, 21.45731460118793], [96.16050243164199, 21.452216274361604], [96.1603646393167, 21.449047043686164], [96.1592622980167, 21.447117948434595], [96.15526631338969, 21.445877813910045], [96.14575862316201, 21.445464436934287], [96.14162484441113, 21.445051059059153], [96.14148705208584, 21.453043030111814], [96.14052250311107, 21.463239682865094], [96.14024691756123, 21.470680483717388], [96.13956664068797, 21.472855822338374], [96.14182493637179, 21.471509003038136], [96.1416194970422, 21.469415302174525], [96.1451523847748, 21.466957640282942], [96.14745644336023, 21.468186470329385], [96.14957949000154, 21.467862148719234], [96.15016295395719, 21.465761028448753], [96.15221816023995, 21.462963939034637], [96.15482942633702, 21.46496079100774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
