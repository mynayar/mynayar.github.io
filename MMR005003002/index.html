
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Yet Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaung</div><div class="name-mm">မြောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Yet Ma</div><div class="name-mm">လက်ယက်မ</div></div>
        <span class="pcode-badge">MMR005003002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38566299994756, 21.826682909988335], [95.37233760039999, 21.826908719861592], [95.36730804023392, 21.829652099964505], [95.36040612034623, 21.831808950322852], [95.3599921201403, 21.831938280027657], [95.35404815989472, 21.835367459740553], [95.34901896035677, 21.841768620025846], [95.34913128028444, 21.8436831003948], [95.34684563981449, 21.844465290240976], [95.34198887988293, 21.847139370385662], [95.34834675669754, 21.852304635550524], [95.34859087406966, 21.852502970235946], [95.35134676733952, 21.85468145288678], [95.35386901674178, 21.85378896299028], [95.3569675184363, 21.85069046399377], [95.35806920682847, 21.85098883566627], [95.36226939781454, 21.84748867965891], [95.36349445160772, 21.846963655448405], [95.37206984075061, 21.852388900227595], [95.37732007925831, 21.855189026652283], [95.381170254104, 21.853263940578472], [95.38549235988455, 21.850599330294926], [95.38648811983091, 21.84699437988678], [95.38844507967673, 21.844297439874993], [95.38880567274367, 21.843307194571423], [95.38893710956, 21.842946921663156], [95.39002190238892, 21.842091634021756], [95.39148636020741, 21.840937200391522], [95.39016948023738, 21.837424950301283], [95.38811171988004, 21.829652099964505], [95.38582571968129, 21.82668012029137], [95.38566299994756, 21.826682909988335]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
