
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Kaing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Waw</div><div class="name-mm">ဝေါ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Kaing</div><div class="name-mm">ညောင်ကိုင်း</div></div>
        <span class="pcode-badge">MMR007004013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.74799536539388, 17.362461307143633], [96.74407124199428, 17.35979850899406], [96.73841055920002, 17.356223343232728], [96.73185608608958, 17.35324403588362], [96.71785334325722, 17.354137827998386], [96.71129887014678, 17.35652127243884], [96.70664938775911, 17.357951883372778], [96.7022367499261, 17.370307267866167], [96.69999084600079, 17.379290888064077], [96.69729576039111, 17.3905204121873], [96.69460067388206, 17.400402393056027], [96.69145640658797, 17.409835193139713], [96.6896596834477, 17.412530278749387], [96.69999084600079, 17.41702208929803], [96.71077118933897, 17.422412259618113], [96.71661054134347, 17.42555652691226], [96.71772707664331, 17.42322195343047], [96.72155153177783, 17.415225365258436], [96.72604334232642, 17.40489420270535], [96.73278105590106, 17.39321549779703], [96.73682368476528, 17.385130240068577], [96.74221385598474, 17.376595801555027], [96.74799536539388, 17.362461307143633]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
