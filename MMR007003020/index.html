
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Kan</div><div class="name-mm">သပြေကန်</div></div>
        <span class="pcode-badge">MMR007003020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4591740631326, 17.061013255357523], [96.45861630629753, 17.057540398270817], [96.45827366369866, 17.05460890157957], [96.4579310210998, 17.05137283508833], [96.4574360936009, 17.047717983098494], [96.45737217158853, 17.04471299111168], [96.45455376914117, 17.045558978863824], [96.44974285035232, 17.0426157451206], [96.44228722417614, 17.0426157451206], [96.44108037805705, 17.04671902066633], [96.4399180933454, 17.05174070456991], [96.43712943417609, 17.051290922138378], [96.43236172691223, 17.052460359158317], [96.42577526491658, 17.056169976263448], [96.41979976634622, 17.05955846165375], [96.41995936992902, 17.06050237208683], [96.42170706742729, 17.061920564282673], [96.42268859470295, 17.062396456731165], [96.42441225332288, 17.062890058629364], [96.42578189381942, 17.063734903343175], [96.42691213838452, 17.064478485293932], [96.42753674722314, 17.06540052601349], [96.42774494927005, 17.066501027300603], [96.42751436219811, 17.067447904597145], [96.42784198521952, 17.067939340028545], [96.42939315387099, 17.067573092024645], [96.44063774703443, 17.06532417267249], [96.44783428572379, 17.063794908808063], [96.4518823392986, 17.06244555791619], [96.4591740631326, 17.061013255357523]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
