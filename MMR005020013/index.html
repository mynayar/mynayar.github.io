
<!DOCTYPE html>
<html>
<head>
    <title>Map View - He Nar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Katha</div><div class="name-mm">ကသာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">He Nar</div><div class="name-mm">ဟဲနား</div></div>
        <span class="pcode-badge">MMR005020013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4716796802731, 24.361083990433883], [96.47387711973334, 24.346496610030556], [96.46972668014223, 24.337097190083284], [96.46887204001268, 24.33532715972069], [96.4459227596277, 24.33868406991394], [96.43950431976862, 24.338865869664232], [96.43951403964127, 24.338928240346092], [96.41790756038569, 24.339477510278925], [96.39428724006416, 24.339477510278925], [96.37707528000021, 24.34167476987477], [96.3760986000704, 24.3436889697702], [96.37469495980463, 24.357727080240636], [96.37530515970542, 24.37731935960079], [96.3767091597, 24.391906740004117], [96.37652592013518, 24.3967284902277], [96.3856810797181, 24.39752192969337], [96.40527335997763, 24.39611820039471], [96.4187009998513, 24.389099099743703], [96.43328856011902, 24.37927244966386], [96.44451912026125, 24.373718279874765], [96.46130376026036, 24.36889643971898], [96.47027604000732, 24.361083990433883], [96.4716796802731, 24.361083990433883]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
