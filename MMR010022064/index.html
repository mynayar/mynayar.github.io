
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sin Thar Mway</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaung-U</div><div class="name-mm">ညောင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sin Thar Mway</div><div class="name-mm">ဆင်သားမွေး</div></div>
        <span class="pcode-badge">MMR010022064</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11258373475164, 21.222343736274468], [95.11448295902142, 21.225870869245284], [95.1147716126199, 21.230489323223765], [95.11423480189467, 21.236260037171007], [95.1147716126199, 21.235973737997654], [95.11910141389922, 21.2348191236037], [95.12371986787764, 21.233087203811465], [95.12862697635393, 21.233664511008442], [95.1286808097716, 21.233750643577366], [95.13145893698044, 21.230809096962332], [95.14029985005811, 21.2239328311353], [95.14553890909343, 21.22120852115637], [95.14553890909343, 21.220658419350627], [95.14553890909343, 21.215419360315252], [95.14553890909343, 21.210507741738923], [95.14128217323378, 21.203304034553582], [95.13538823058241, 21.1951180050919], [95.13145893698044, 21.190533827873935], [95.12818452519576, 21.186931974730896], [95.12392778933605, 21.18267523887124], [95.11815028640666, 21.178722211261118], [95.11770640622575, 21.178418503011528], [95.10591852272171, 21.174161768051192], [95.1091929354057, 21.181365474337213], [95.11148502311539, 21.191188709691232], [95.11181246357438, 21.201666828661246], [95.11410455308271, 21.210507741738923], [95.11410455308271, 21.218693772099925], [95.11258373475164, 21.222343736274468]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
