
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Hpo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Hpo</div><div class="name-mm">အုပ်ဖို</div></div>
        <span class="pcode-badge">MMR005007033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.49219023958796, 23.079579120180313], [95.50109952002691, 23.070669749809156], [95.51847600026724, 23.05763756971811], [95.5218376795653, 23.053758300005597], [95.5147705200435, 23.04713267972943], [95.50829519986365, 23.041119870085993], [95.50621799976096, 23.039042759915503], [95.50043208007651, 23.033256930163247], [95.49719459985096, 23.023081350324105], [95.49534456040323, 23.011518239775], [95.49129347971041, 23.009492700327883], [95.49210672044887, 23.013830879691398], [95.48933148006381, 23.023081350324105], [95.48480664011441, 23.028360479552532], [95.48556767970473, 23.028673770078456], [95.48556767970473, 23.038039889929053], [95.48626139964392, 23.04775296013105], [95.48487360003668, 23.05469078994804], [95.48487360003668, 23.06024108995439], [95.4823888802427, 23.065831710165355], [95.48730215986683, 23.07238236025779], [95.49181151978587, 23.07897332965547], [95.49219023958796, 23.079579120180313]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
