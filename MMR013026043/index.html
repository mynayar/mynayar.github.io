
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Kaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kayan</div><div class="name-mm">ခရမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Kaung</div><div class="name-mm">ကံကောင်း</div></div>
        <span class="pcode-badge">MMR013026043</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.67575935990658, 16.91182484973706], [96.67916136030857, 16.91204201982339], [96.69017844028286, 16.91224991969807], [96.69468996037341, 16.91224991969807], [96.6947594401961, 16.912125449929647], [96.69502584007051, 16.911483299814506], [96.69482748020408, 16.910735939811843], [96.69442319987081, 16.909936379560293], [96.69435515986282, 16.90911621044478], [96.69428711985478, 16.908296040429946], [96.69428892029748, 16.90814709021612], [96.69439475971046, 16.90794981043547], [96.69429431982707, 16.907700330405987], [96.69398903956261, 16.907249520049334], [96.69383424015814, 16.907235120104758], [96.69551579971443, 16.90626509965466], [96.69236112006968, 16.903415520409965], [96.68518956005022, 16.903623420284646], [96.67864188041852, 16.903519470347305], [96.67799783992842, 16.903924919799238], [96.67819259980871, 16.90446411013062], [96.6781353597591, 16.905011040027546], [96.67807811970954, 16.905557969924416], [96.67761335996863, 16.905502440385362], [96.67740491960143, 16.905648689935163], [96.67744883979219, 16.90629479976525], [96.67775195988509, 16.90689447040353], [96.67800000009998, 16.907791410145535], [96.67792584020543, 16.908191370135683], [96.67772388035286, 16.909277490363934], [96.67745711985026, 16.909969319928223], [96.67625255980784, 16.911244890439377], [96.67583351980113, 16.911686519617263], [96.67575935990658, 16.91182484973706]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
