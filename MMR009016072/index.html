
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pan Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pan Taw Gyi</div><div class="name-mm">ရွှေပန်းတောကြီး</div></div>
        <span class="pcode-badge">MMR009016072</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56799599062253, 19.237527083408224], [95.56960505762737, 19.23224014806442], [95.57518506493886, 19.22740414088844], [95.57853307004518, 19.22331213564661], [95.58225307521928, 19.218476129369947], [95.5844433129086, 19.21608677908165], [95.584113078256, 19.215872126197723], [95.58113707411673, 19.21215212102362], [95.58448507832378, 19.20620011184576], [95.58980091068355, 19.20276045593033], [95.58522907935861, 19.198760102396875], [95.57146505976476, 19.196156099224652], [95.53091700471606, 19.202108106603873], [95.53168994323636, 19.211937326046836], [95.53277700685345, 19.217732128335115], [95.5372410139617, 19.225172137784], [95.54244902120541, 19.227776141855486], [95.54914502961947, 19.22926414392515], [95.551173192389, 19.23361020674571], [95.55174903279169, 19.234844152135963], [95.54951702968725, 19.24302816261968], [95.54802902761759, 19.250468172967885], [95.54914502961947, 19.253444177107156], [95.5505802001162, 19.25272659185879], [95.55584103893284, 19.25009617200078], [95.56067704610882, 19.243400162687408], [95.56551305238554, 19.23819215634302], [95.56799599062253, 19.237527083408224]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
