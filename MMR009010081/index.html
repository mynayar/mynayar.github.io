
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Khauk Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Khauk Taung</div><div class="name-mm">သစ်ခေါက်တောင်</div></div>
        <span class="pcode-badge">MMR009010081</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.4668371048486, 20.560171177158168], [94.4670213912243, 20.558623169623615], [94.4663370871869, 20.54881480366032], [94.46200315712008, 20.53604111840292], [94.45831375677449, 20.532187744668704], [94.45744112660674, 20.536725423339647], [94.45424770506759, 20.54356846910963], [94.4489793263349, 20.54725921574027], [94.44873514421158, 20.5538521357675], [94.44873514421158, 20.56337524217372], [94.44556077480996, 20.567526340068582], [94.43799112628949, 20.56996816220095], [94.43688053011243, 20.571263856841597], [94.43736819198853, 20.571396855780335], [94.44189804116172, 20.579002904360607], [94.44375503506689, 20.586907759885264], [94.44259219727212, 20.593594078104275], [94.45110630840946, 20.594066920951718], [94.4526149912889, 20.58906940902608], [94.45470390775921, 20.589188776041226], [94.46063454814595, 20.583030034308706], [94.46588088269664, 20.568203435140447], [94.4668371048486, 20.560171177158168]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
