
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taw Gyi</div><div class="name-mm">တောကြီး</div></div>
        <span class="pcode-badge">MMR009010060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.7518357407269, 20.579669965696382], [94.76029243195023, 20.581784137827754], [94.770418800887, 20.587409899047657], [94.77236812279068, 20.58809216162399], [94.7743899273533, 20.58879979317595], [94.77791981584687, 20.590035253923872], [94.78504578023865, 20.588535051651377], [94.7870584737696, 20.588157670939836], [94.78654598341046, 20.58778494961581], [94.78804618568296, 20.576533428075322], [94.79029648999108, 20.569407463683547], [94.79101397811263, 20.567524056689933], [94.77154395439004, 20.562656550759243], [94.76399311429083, 20.56134336160693], [94.76254273625835, 20.561906449622995], [94.75316646755851, 20.56678210880733], [94.75288224132242, 20.567171051203104], [94.74725191604313, 20.574875706848445], [94.74604050406606, 20.576533428075322], [94.75129121381855, 20.579533834418953], [94.7518357407269, 20.579669965696382]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
