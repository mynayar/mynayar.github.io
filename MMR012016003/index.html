
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kin Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Toungup</div><div class="name-mm">တောင်ကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kin Taung</div><div class="name-mm">ကင်းတောင်</div></div>
        <span class="pcode-badge">MMR012016003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.21064352298026, 18.977881722763357], [94.20898086177743, 18.973237120996373], [94.20757132375763, 18.969175520034298], [94.20557204631297, 18.9598650933994], [94.20181753055465, 18.95594998660266], [94.19711401689841, 18.954404624873575], [94.1925653862836, 18.955221846910774], [94.19009055903211, 18.95655092168772], [94.19003266517541, 18.967844539593898], [94.1897175031603, 18.96946971615455], [94.18883426189171, 18.974024121316177], [94.18886779401356, 18.978751306028016], [94.18953397311441, 18.98744024806905], [94.1922741453356, 18.989083293259398], [94.19351397139275, 18.991354255894237], [94.1957273783159, 18.991700916664], [94.19786560461404, 18.99100750968887], [94.20000603155319, 18.989671812304323], [94.20216675619088, 18.98788401223743], [94.20386028032772, 18.986567310333157], [94.20644925133195, 18.984497506254968], [94.20930460422414, 18.982237018024023], [94.21052159379656, 18.97811775882758], [94.21064352298026, 18.977881722763357]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
