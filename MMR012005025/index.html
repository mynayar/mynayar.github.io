
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Ma Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Ma Taung</div><div class="name-mm">ကုလားမတောင်</div></div>
        <span class="pcode-badge">MMR012005025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.38849848271889, 20.444871836066454], [93.3870082925987, 20.443878375686552], [93.36576052772625, 20.443878375686552], [93.35185766899627, 20.445189965844293], [93.34755735019161, 20.446145592645053], [93.34726995744262, 20.447945618095844], [93.34698442089439, 20.449658830190913], [93.34612781484685, 20.45180034530972], [93.3446049595513, 20.454037038378658], [93.34332005137935, 20.455274358025235], [93.34217790968285, 20.456368910297044], [93.34098817856164, 20.457558641418245], [93.33984603776452, 20.45893872843959], [93.33898943171698, 20.460366404885747], [93.3385109869925, 20.461682128327595], [93.35080839669024, 20.466175412865084], [93.36366198311407, 20.470897137792747], [93.37887643200179, 20.475356545768022], [93.38123729536494, 20.481652179604453], [93.38228656677171, 20.490046358952327], [93.38281120337439, 20.49450576602834], [93.37861411415008, 20.49948980970703], [93.37677788738966, 20.505523125691752], [93.37441702402651, 20.51234339613086], [93.38097497661391, 20.51470425859469], [93.38779524705308, 20.520475256727764], [93.3951401531956, 20.518901347818996], [93.39959956117087, 20.508933261360994], [93.40353433164415, 20.49476808387999], [93.4058951950073, 20.479028999288914], [93.4030096959408, 20.464601503956317], [93.39487783534389, 20.44912473721689], [93.38861568866315, 20.444949972763084], [93.38849848271889, 20.444871836066454]]]]};
        const layer = L.geoJSON(geojsonData, {

</body>
</html>
