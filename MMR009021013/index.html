
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kaing Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pauk</div><div class="name-mm">ပေါက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kaing Lel</div><div class="name-mm">ကိုင်းလယ်</div></div>
        <span class="pcode-badge">MMR009021013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.4961325996398, 21.221107560565542], [94.48179752133859, 21.229969245284508], [94.48203261761125, 21.237022160444383], [94.47621899790846, 21.246860594341], [94.47219418371469, 21.26251264883973], [94.47129978096018, 21.269220672196298], [94.45654212921596, 21.29426395921439], [94.44893970310488, 21.3027607889793], [94.44938690538146, 21.315729634315232], [94.44491488891106, 21.32556806821185], [94.43641805914615, 21.32601526958905], [94.43149884219787, 21.339878517679495], [94.4294898745581, 21.341050416143844], [94.43328764770683, 21.345692138281606], [94.43910126920827, 21.352847363015428], [94.44536209118763, 21.356872177209254], [94.44795186438711, 21.357004986391075], [94.44849250082831, 21.35597777355548], [94.45430612232974, 21.346586541036118], [94.45743653286974, 21.32825127827391], [94.46503895898081, 21.31349362563037], [94.47666620018504, 21.301419183948212], [94.49679027025485, 21.284425525317772], [94.51110071882317, 21.269220672196298], [94.51368806475244, 21.257930439338338], [94.51601993667077, 21.247754997095512], [94.51635510410483, 21.234683456376445], [94.51438060927774, 21.234446470628143], [94.5093599092325, 21.231057219015497], [94.50295848364715, 21.2284210911605], [94.4973102267856, 21.22314895955691], [94.4961325996398, 21.221107560565542]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
