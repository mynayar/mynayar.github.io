
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Maw Zut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Maw Zut</div><div class="name-mm">နာမော်ဇွပ်</div></div>
        <span class="pcode-badge">MMR001005011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.08646437593029, 25.773018636001325], [98.08488850470081, 25.76408869993361], [98.07648385994224, 25.751481731896433], [98.0718780333446, 25.739857501622453], [98.06842531387719, 25.731143498173935], [98.06298138208518, 25.73398380990494], [98.05869201882166, 25.736396576740674], [98.05418079191008, 25.735945454319335], [98.05333031474231, 25.735860406332733], [98.05217303116052, 25.736231284945916], [98.04993389373425, 25.736948870194283], [98.04706760238798, 25.741501215908443], [98.03831391725356, 25.752147589939398], [98.02763185992245, 25.76513928075326], [98.01967040556485, 25.775465253318828], [98.0185281811307, 25.777055932785117], [98.02575484441059, 25.77971838829302], [98.03234396660082, 25.78504037291492], [98.03342829088297, 25.78263477277659], [98.03547925326501, 25.78085727174573], [98.03977780490186, 25.77727514523184], [98.0473002713905, 25.776200506648138], [98.05446452441834, 25.780499059184308], [98.05804665093223, 25.786230461966284], [98.06306162769204, 25.78873794989653], [98.06662081160124, 25.790106867338125], [98.07175624715313, 25.784575023218792], [98.08646437593029, 25.773018636001325]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
