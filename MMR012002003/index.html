
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aw Ra Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aw Ra Ma</div><div class="name-mm">သြရမ</div></div>
        <span class="pcode-badge">MMR012002003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.88937740014694, 20.633086098844444], [92.88683028269145, 20.625885458347284], [92.88659433206283, 20.624610906767998], [92.88471359965297, 20.614450897790732], [92.88405135778402, 20.61087303766061], [92.88339130756287, 20.607519106921302], [92.8717547197046, 20.60109891967943], [92.83290878811016, 20.58822064866405], [92.81821678417731, 20.586432058093067], [92.81407286916766, 20.58467588358519], [92.80988920592216, 20.592171615927384], [92.80620409983942, 20.598774098445915], [92.80620409983942, 20.605401609996363], [92.80581814589078, 20.60661093104966], [92.80517518908374, 20.60862552934475], [92.80789331262633, 20.60925008961999], [92.81517477519577, 20.610810402578068], [92.8605654015721, 20.618410693698593], [92.87529777607159, 20.634405843155207], [92.88089730496671, 20.63430847355727], [92.88937740014694, 20.633086098844444]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
