
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Nat Pin Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pyinmana</div><div class="name-mm">ပျဉ်းမနား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Nat Pin Seik</div><div class="name-mm">သနပ်ပင်ဆိပ်</div></div>
        <span class="pcode-badge">MMR018006020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.24398481994353, 19.72528709172593], [96.24517833361324, 19.726679524640417], [96.24893096439257, 19.729854826638984], [96.25499290399938, 19.73014349102931], [96.25620026363134, 19.734500534572078], [96.25879853812211, 19.733335792013236], [96.26031239480125, 19.73151916417811], [96.26414749790877, 19.730106231217633], [96.26737705780505, 19.729399765187054], [96.27090938975658, 19.72768406107059], [96.27234014458207, 19.727101160989832], [96.27266653013629, 19.726968189030742], [96.27363433105961, 19.72657390016542], [96.2760301195944, 19.72695218199766], [96.2761314947727, 19.726968189030742], [96.27673853895249, 19.727064037875095], [96.27664269010813, 19.726968189030742], [96.27519937085435, 19.721772239897007], [96.27346738810951, 19.717442283034984], [96.26798277638409, 19.71628762727221], [96.26192083587796, 19.71513297240881], [96.2574132862942, 19.7146321336661], [96.25672488674417, 19.714555645426742], [96.24950829137458, 19.718885602288765], [96.24662165286702, 19.723792887032175], [96.24398481994353, 19.72528709172593]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
