
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aung Min Ga Lar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mon</div><div class="name-mm">မွန်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanbyuzayat</div><div class="name-mm">သံဖြူဇရပ်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Aung Min Ga Lar Ward</div><div class="name-mm">အောင်မင်္ဂလာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR011004701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.72969390345094, 15.970503393017225], [97.730147705852, 15.970231864309142], [97.73077055921402, 15.970267885754367], [97.73100408616972, 15.9697733098904], [97.73147447296861, 15.967576326386393], [97.73248800531724, 15.966042832111043], [97.73251247317216, 15.965981903042461], [97.7330547427822, 15.965023991064413], [97.73402417867294, 15.963393209029448], [97.73416778601455, 15.963254547959082], [97.73488262743138, 15.962356385139117], [97.73529838221464, 15.962095593436914], [97.73510778529612, 15.961626971107876], [97.73473036681304, 15.960849883115657], [97.73452576025568, 15.96094487670473], [97.73018649001455, 15.9635748433044], [97.73008957997018, 15.96363357982591], [97.72912753650667, 15.96499090230833], [97.72881837386893, 15.965968479761557], [97.7287349401654, 15.967043214572755], [97.72868650987459, 15.968062413549603], [97.72851226892612, 15.96925535884776], [97.72853619808711, 15.969262131642097], [97.7289153135909, 15.969567199666585], [97.72969390345094, 15.970503393017225]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
