
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit</div><div class="name-mm">ရွာသစ်</div></div>
        <span class="pcode-badge">MMR005009015</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.33080548018881, 22.763377170420142], [95.33105315977554, 22.76343665967414], [95.33593727978172, 22.764962970165016], [95.33945447974048, 22.764962970165016], [95.33807423983438, 22.76099460012074], [95.3386848003633, 22.752142289934795], [95.342653079576, 22.747868639626063], [95.34803255965494, 22.746199139978387], [95.34814776011109, 22.743900360413363], [95.35211604022311, 22.73840576981047], [95.3524213195883, 22.732911180106953], [95.35161527972144, 22.727070089712925], [95.35138272043628, 22.727834460392103], [95.34632399975283, 22.733615610072377], [95.33692980037006, 22.733615610072377], [95.3358926401333, 22.732208369820455], [95.3331901198282, 22.736574269886717], [95.32800071955762, 22.74237404992249], [95.32922183971618, 22.753363230228956], [95.33105315977554, 22.759163100196986], [95.33080548018881, 22.763377170420142]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
