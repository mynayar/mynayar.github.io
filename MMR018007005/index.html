
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Yae</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Yae</div><div class="name-mm">ကြောင်ရေ</div></div>
        <span class="pcode-badge">MMR018007005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18921784932434, 19.612891923223742], [96.19571899623475, 19.614809044901563], [96.19903506011997, 19.61038762698746], [96.19866660787773, 19.604123949660618], [96.19756125384885, 19.599702531746516], [96.20087731773407, 19.593807306661915], [96.20161422131929, 19.590859694119615], [96.20345647803407, 19.58606982396327], [96.19909931937815, 19.575223619674375], [96.1952448089009, 19.57063491796714], [96.19175739628685, 19.568432340680033], [96.18459902122788, 19.568799436744655], [96.17733458642209, 19.570040155828565], [96.17697448708299, 19.58120322095192], [96.17638195706172, 19.587424786624638], [96.17625428930404, 19.58876529718077], [96.17697448708299, 19.59848796674629], [96.17265330130886, 19.604609648316682], [96.17481389374626, 19.610371229648592], [96.18021537663839, 19.612171725444796], [96.18921784932434, 19.612891923223742]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
