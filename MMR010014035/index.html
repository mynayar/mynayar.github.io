
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myaung Son Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sintgaing</div><div class="name-mm">စဉ့်ကိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myaung Son Nge</div><div class="name-mm">မြောင်းဆုံငယ်</div></div>
        <span class="pcode-badge">MMR010014035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.08027380129494, 21.70158904709689], [96.079112121827, 21.701892093445394], [96.07636491331016, 21.701892093445394], [96.0712138961045, 21.703494632271486], [96.06800881935158, 21.704181433726262], [96.06468927509002, 21.703723566389556], [96.06274333643591, 21.703494632271486], [96.05988166041038, 21.703265698153473], [96.05736338511218, 21.703265698153473], [96.05579443326656, 21.701522419024457], [96.05544835885473, 21.704060297744604], [96.05508639971765, 21.707317930877878], [96.05507430203744, 21.70747520611593], [96.05713445099417, 21.708073313732484], [96.05873698892094, 21.709332450931925], [96.06011059362908, 21.710934989758016], [96.06388800612666, 21.711392857994042], [96.07098496198648, 21.712651995193482], [96.07693724815556, 21.712651995193482], [96.08117252888917, 21.71242306107547], [96.08277506681594, 21.711278391384724], [96.08483547387806, 21.70990478577727], [96.08639841195719, 21.707953419714613], [96.08494804021996, 21.7067749921722], [96.08169040618736, 21.704422256881685], [96.08027380129494, 21.70158904709689]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
