
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shwe Pyi Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shwe Pyi Taw</div><div class="name-mm">ရွှေပြည်တော်</div></div>
        <span class="pcode-badge">MMR010018023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5725163051834, 21.160758313645317], [95.57046697327223, 21.160851465422866], [95.56586434376453, 21.160510530636543], [95.56160265443901, 21.160851465422866], [95.55631815535867, 21.159146787893974], [95.55531883229833, 21.16093635602806], [95.54260030066342, 21.16669344884366], [95.5332580416254, 21.170181225683052], [95.53944490695693, 21.17265597199554], [95.54494464797716, 21.17650579070971], [95.54920722493353, 21.180867497237273], [95.55388746413524, 21.185656579587544], [95.55673951381755, 21.184998414345387], [95.56321130235978, 21.18823430816684], [95.57321315566264, 21.188822652743283], [95.57968494420487, 21.187351791751837], [95.5797583837425, 21.18248797124295], [95.57921670768496, 21.174362828581707], [95.57763280820757, 21.16870604165058], [95.57333364862905, 21.163049253820077], [95.57278899221825, 21.16186916433054], [95.5725163051834, 21.160758313645317]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
