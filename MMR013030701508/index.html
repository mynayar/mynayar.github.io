
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma (2) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dala</div><div class="name-mm">ဒလ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma (2) Ward</div><div class="name-mm">မြို့မအပိုင်း (၂) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013030701508</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16490236924898, 16.7582480124359], [96.16437212627267, 16.757752736000043], [96.16448974590509, 16.756106694268567], [96.16496658444038, 16.7560831707018], [96.16498565726232, 16.755333582179105], [96.16446318622712, 16.755285956781506], [96.16444998507882, 16.753916960199604], [96.16386318194037, 16.753870010192884], [96.16350030909206, 16.75383281693098], [96.16318538359866, 16.753851341166524], [96.16322274683233, 16.754783803229998], [96.16354838325134, 16.754822644949172], [96.16355917241793, 16.75547684597973], [96.16330604563757, 16.75551033043746], [96.1633917492299, 16.756342358013455], [96.1635865297946, 16.75669774130779], [96.16383838673221, 16.756779670445496], [96.1637812725877, 16.758011076150297], [96.16349182129056, 16.758258438276357], [96.1634248119056, 16.758549306905024], [96.16414239715397, 16.758566326574737], [96.16432304397335, 16.758353041559644], [96.16457481367678, 16.758591334022924], [96.16490236924898, 16.7582480124359]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
