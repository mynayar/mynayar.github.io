
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Momauk</div><div class="name-mm">မိုးမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar Long</div><div class="name-mm">နားလုံ</div></div>
        <span class="pcode-badge">MMR001012048</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.45839676539845, 24.807395026259485], [97.46575619828997, 24.805471699259556], [97.47170485029864, 24.798333316129685], [97.47955707210127, 24.791194933899135], [97.48740929300453, 24.787863688558446], [97.50073427526667, 24.77715611386361], [97.5142972028537, 24.76954183828525], [97.52191147753274, 24.76430702404997], [97.52798563892617, 24.7579918209658], [97.52474324840227, 24.752701603995888], [97.52229782898166, 24.748711711376416], [97.51211964200792, 24.737336089688824], [97.50673119119159, 24.72775662187064], [97.50391106474387, 24.726146356968854], [97.49225037685346, 24.72652250920646], [97.48134199074036, 24.73066017212932], [97.47532357112595, 24.73404553417413], [97.46591979036612, 24.73404553417413], [97.46102982296799, 24.732540928820868], [97.45613985736856, 24.729155566776058], [97.45350679800038, 24.732164776583204], [97.4512498908698, 24.73743089531962], [97.44635992527037, 24.737807045758586], [97.4431274353829, 24.73757615381652], [97.44184611010996, 24.74833928143272], [97.44410301724054, 24.751724641678948], [97.44974528641592, 24.76075227199982], [97.45877291583747, 24.768651448305718], [97.46215827698296, 24.781064438872818], [97.4606536716297, 24.795734338369073], [97.45839676539845, 24.807395026259485]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
