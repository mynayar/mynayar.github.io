
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Chaung Kyoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Nay Pyi Taw</div><div class="name-mm">နေပြည်တော်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Lewe</div><div class="name-mm">လယ်ဝေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Chaung Kyoe</div><div class="name-mm">ချောင်းကြိုး</div></div>
        <span class="pcode-badge">MMR018007011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.0430177029047, 19.59272638541438], [96.0426576035656, 19.612171725444796], [96.04013691178909, 19.61505251566109], [96.03869651713063, 19.61757320833692], [96.0358157251157, 19.618653504555652], [96.04409800002276, 19.620453998553216], [96.0451963006688, 19.623199752866356], [96.04985958225399, 19.621534295671268], [96.057061560043, 19.621894395010372], [96.06642413026947, 19.621894395010372], [96.06354333915385, 19.613252020764207], [96.06321692482129, 19.61113032670329], [96.06292808866044, 19.60925289120803], [96.06863561264345, 19.60693340565217], [96.07155045299106, 19.605029836757637], [96.07660680665884, 19.604613431764506], [96.08190110834954, 19.60419702587211], [96.08808770658243, 19.603840107435076], [96.0913594662664, 19.603840107435076], [96.09317127013804, 19.60355384243593], [96.09273957756949, 19.603492171426637], [96.08703858716115, 19.600404134243433], [96.08181267711342, 19.5999290511848], [96.07567504516726, 19.59890374671062], [96.0755107893915, 19.59887630839495], [96.07450476458325, 19.598564776043645], [96.06030244869913, 19.594166780972216], [96.05832404991503, 19.593580589372777], [96.05057978003288, 19.5912859898566], [96.0430177029047, 19.59272638541438]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
