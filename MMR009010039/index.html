
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nwe Ta Mei</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Salin</div><div class="name-mm">စလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nwe Ta Mei</div><div class="name-mm">နွယ်တမယ်</div></div>
        <span class="pcode-badge">MMR009010039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.67900455581565, 20.659621394411886], [94.68204959281451, 20.66962046071575], [94.6875436932869, 20.67566397141519], [94.69468602264192, 20.676488085856533], [94.6973572798147, 20.67661103127415], [94.69677077884842, 20.674105071292047], [94.6952255619102, 20.673556881444995], [94.6944700783315, 20.672952494761887], [94.69386569074908, 20.67193259071655], [94.6934690618478, 20.671611510263062], [94.69297799693709, 20.671139332913924], [94.69205252890117, 20.67032718844905], [94.69171256088606, 20.669836122639026], [94.69135370620864, 20.669156186608802], [94.69093818974574, 20.667852976333847], [94.6903904639488, 20.6656431855846], [94.69001272170982, 20.663773362850463], [94.69013527322431, 20.662552287658002], [94.68925271903782, 20.660535021074395], [94.68880646284805, 20.659515006412448], [94.68815391926802, 20.659515006412448], [94.68538783308207, 20.659408618413067], [94.67900455581565, 20.659621394411886]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
