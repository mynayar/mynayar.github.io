
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Li Shaw Lel U</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mogoke</div><div class="name-mm">မိုးကုတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Li Shaw Lel U</div><div class="name-mm">လီရှောလယ်ဦး</div></div>
        <span class="pcode-badge">MMR010011009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.49088556321823, 22.98887195807447], [96.48638622984072, 22.981560540886278], [96.4835741460301, 22.97931087419755], [96.47963722887505, 22.973686706576302], [96.47738756308564, 22.969749790320634], [96.47401306215318, 22.962438373132443], [96.46670164496499, 22.957939038855613], [96.46051506202053, 22.95681420641057], [96.45432847817676, 22.95681420641057], [96.44645464386679, 22.96300079025434], [96.43801839333423, 22.970312207442475], [96.43183181038978, 22.97818604085313], [96.43745597711171, 22.980998123764437], [96.43801839333423, 22.986059874263844], [96.43464389330109, 22.992246458107616], [96.43408147707856, 22.998433041951387], [96.43408147707856, 23.002369959106375], [96.4397056438005, 23.006306876261363], [96.44645464386679, 23.00124512486269], [96.45264122771056, 22.997870624829545], [96.45995264489869, 22.996745792384445], [96.46613922874246, 22.99505854191824], [96.46838889543125, 22.9944961247964], [96.48188689556383, 22.98887195807447], [96.49088556321823, 22.98887195807447]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
