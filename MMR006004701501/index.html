
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma (Ka Gyi) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yebyu</div><div class="name-mm">ရေဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma (Ka Gyi) Ward</div><div class="name-mm">မြို့မ (က) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR006004701501</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.19518501328065, 14.259405669845194], [98.19561599584085, 14.259478768067936], [98.19592307091483, 14.259630185739752], [98.19617627316882, 14.259771160722039], [98.19642947542303, 14.259823373656104], [98.19674732506104, 14.259781603309818], [98.1973183769532, 14.259833816241382], [98.19773319766733, 14.25995912722783], [98.19816956750947, 14.260120987149037], [98.19857900094149, 14.260120987149037], [98.19944412575472, 14.259119274364707], [98.19944471180185, 14.259113215789], [98.20004972894242, 14.255072273174505], [98.20004972894242, 14.248822820055068], [98.20021273021263, 14.246977751356553], [98.19881604112169, 14.246863752239733], [98.19830963654135, 14.24679587172642], [98.1972375673185, 14.246790650214507], [98.19682274687983, 14.246727991192529], [98.19565370721693, 14.246884639150267], [98.18664516500428, 14.246729406081329], [98.18643787348378, 14.259729120202849], [98.19420928018258, 14.259797983347596], [98.1944805387372, 14.259769429815435], [98.19483745788818, 14.259612385389062], [98.19518501328065, 14.259405669845194]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
