
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lay Pin (South)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukpadaung</div><div class="name-mm">ကျောက်ပန်းတောင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lay Pin (South)</div><div class="name-mm">လေးပင် (တောင်)</div></div>
        <span class="pcode-badge">MMR010020005</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.40443059379692, 21.026637279087197], [95.40572104269205, 21.02061518124566], [95.41174314143291, 21.014162933172884], [95.42421748734722, 21.012012183815273], [95.43239033364705, 21.008570984663265], [95.43583153279906, 21.003409187284205], [95.43583153279906, 20.99609663964827], [95.43583153279906, 20.98663334265467], [95.4384124323879, 20.97286854784528], [95.42980943495752, 20.969427348693216], [95.42378733711598, 20.96598615044053], [95.41173388021446, 20.962859846204992], [95.40520342259993, 20.964234679387005], [95.40107892395326, 20.96664063565686], [95.39867296588471, 20.971796260089377], [95.39764184099823, 20.978670425100063], [95.3966107161117, 20.985544590110806], [95.39489217463421, 20.991731339429805], [95.39351734235152, 21.000324045018715], [95.3914550925785, 21.008916752406265], [95.3890464221547, 21.015139149951835], [95.39008025939654, 21.015103499926624], [95.3966107161117, 21.016478333108637], [95.39076767598749, 21.023008789823848], [95.39019230233293, 21.023743990093124], [95.39539744703461, 21.02319607993519], [95.40443059379692, 21.026637279087197]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
