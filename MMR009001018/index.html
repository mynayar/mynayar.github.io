
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Yar</div><div class="name-mm">လယ်ယား</div></div>
        <span class="pcode-badge">MMR009001018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.23677539506849, 20.083729284279116], [95.24220405727146, 20.08260852306495], [95.24622743704663, 20.08238233187916], [95.24960185704015, 20.07788308393725], [95.25418605494252, 20.07862698424799], [95.258678406883, 20.078659132313135], [95.26422241523233, 20.078698079253], [95.2595630465974, 20.072316518792377], [95.25223884015043, 20.064991726886717], [95.24696543870408, 20.058252944018193], [95.24637959244427, 20.05297917384985], [95.25149265466234, 20.044457394193444], [95.23651534800496, 20.03387559957929], [95.2228654406876, 20.019525697752783], [95.21096552324036, 20.00972576473231], [95.20041292601576, 20.003451247876853], [95.19801561223079, 20.00202581793718], [95.19801561223079, 20.005875792234065], [95.1994156021484, 20.01672571701829], [95.19976560030227, 20.021975681232732], [95.20256558013745, 20.026525650038764], [95.20151558837375, 20.03247560966173], [95.2023978727637, 20.039533894673525], [95.2102655278319, 20.04437552800829], [95.21131552139428, 20.05242547295728], [95.20956553332275, 20.06327539864077], [95.21516549389247, 20.069575354618962], [95.2166525192984, 20.07109401907377], [95.22319239821064, 20.068922258855196], [95.22674989139443, 20.075538813065805], [95.23085141326214, 20.081398615653654], [95.23671084622862, 20.08374261043315], [95.23677539506849, 20.083729284279116]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
