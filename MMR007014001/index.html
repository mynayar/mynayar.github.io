
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Kyaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Htantabin</div><div class="name-mm">ထန်းတပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Kyaw</div><div class="name-mm">ရေကျော်</div></div>
        <span class="pcode-badge">MMR007014001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50649110478071, 18.83668531877248], [96.50485041131748, 18.84277932460617], [96.5001009782776, 18.843373003961005], [96.50010720698208, 18.8434978001834], [96.50853869470507, 18.842625578307832], [96.51425075756646, 18.84800163916435], [96.5120667341925, 18.8503536657891], [96.50769868384725, 18.84833764386724], [96.50051325718113, 18.851633020647455], [96.501462844135, 18.85298758041256], [96.50063468724107, 18.856270569930928], [96.5018148909445, 18.85650459870834], [96.50557350041674, 18.856994805665806], [96.51459115096088, 18.858605101144576], [96.52167644800971, 18.858927160060432], [96.530372039638, 18.858605101144576], [96.53327056988093, 18.8550624521705], [96.53391468771275, 18.850875686263976], [96.53648646727669, 18.844124767044434], [96.53663429693529, 18.839162282813163], [96.530372039638, 18.837671268913994], [96.52328674258916, 18.836705092166312], [96.51774157591308, 18.837154088590353], [96.50649110478071, 18.83668531877248]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
