
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tar Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tar Taing</div><div class="name-mm">တာတိုင်</div></div>
        <span class="pcode-badge">MMR005009038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.15542235405843, 22.76850797356417], [95.15565179989073, 22.775165550349925], [95.15179764014903, 22.784479649816035], [95.14633788028902, 22.79250900029018], [95.14116144014838, 22.801135950263927], [95.14408968039447, 22.80150197973262], [95.15693663971422, 22.803750179627116], [95.16978359993323, 22.805998380420988], [95.18391539997577, 22.80631959037686], [95.19001739988317, 22.80631959037686], [95.191944479754, 22.802144309712162], [95.19483528032401, 22.79764781999097], [95.19960419987399, 22.796130419982944], [95.199331680113, 22.791224340331098], [95.199331680113, 22.78255256994521], [95.199331680113, 22.77709263022075], [95.19945623981368, 22.774855140352486], [95.19945983979983, 22.7747879097343], [95.19976775237996, 22.772686930657358], [95.18669107023675, 22.77286364384213], [95.17948063522317, 22.773622634776814], [95.1793375108175, 22.77363770111907], [95.17525721924534, 22.771463580180125], [95.17269043361665, 22.768196765868083], [95.16475674222994, 22.767263389194113], [95.15542235405843, 22.76850797356417]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
