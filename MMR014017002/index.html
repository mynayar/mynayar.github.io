
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nar San</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Monghsu</div><div class="name-mm">မိုင်းရှူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nar San</div><div class="name-mm">နားစံ</div></div>
        <span class="pcode-badge">MMR014017002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.32255627185452, 21.837317002877455], [98.3273814242134, 21.83826311125364], [98.33306891309991, 21.839378304764978], [98.33642559306674, 21.84020597962234], [98.34676807718506, 21.842756180853087], [98.35230792437125, 21.84412217100146], [98.36364049191525, 21.840432498161306], [98.36467651630824, 21.842168537747852], [98.36758840957748, 21.840658666864044], [98.37175191631792, 21.838499811916847], [98.37867638131002, 21.83262450771491], [98.38721340537444, 21.825380973153415], [98.38721340537444, 21.81788449437397], [98.38670683974891, 21.817251287117244], [98.37784280600073, 21.80617124470723], [98.3652076631032, 21.796120563613158], [98.35722748755859, 21.78977269715233], [98.35175089328914, 21.7865365281383], [98.34598276938937, 21.794926527437326], [98.34536020740768, 21.796889995676793], [98.33989187970656, 21.81413625408493], [98.33978551868682, 21.815004870578377], [98.33017264375258, 21.806501172691014], [98.32644832093331, 21.804772022810653], [98.32005812967901, 21.801805148588812], [98.32234213967809, 21.82464524588147], [98.32255627185452, 21.826786563149426], [98.32255627185452, 21.837317002877455]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
