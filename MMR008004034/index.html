
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyaung Taw Yar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungde</div><div class="name-mm">ပေါင်းတည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyaung Taw Yar</div><div class="name-mm">ကျောင်းတော်ရာ</div></div>
        <span class="pcode-badge">MMR008004034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.55045097203481, 18.479188201274496], [95.54779741262058, 18.47771400199963], [95.54484901497011, 18.47653464186027], [95.54278513562559, 18.474765602550576], [95.53276057983697, 18.472406884070494], [95.52715862277228, 18.47034300472592], [95.51494178873264, 18.48223526984185], [95.51426515231498, 18.482893930610487], [95.5168270447324, 18.483090999050432], [95.51890310719273, 18.481252079719752], [95.52214634577729, 18.482431439859113], [95.52509474432702, 18.48508499837402], [95.5298121821865, 18.486559197648887], [95.53629865935568, 18.488328236958637], [95.53895221787064, 18.488328236958637], [95.54278513562559, 18.48891791612897], [95.54573353417533, 18.49068695633804], [95.54868193272506, 18.484790158339194], [95.54868193272506, 18.48272627899462], [95.55045097203481, 18.479188201274496]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
