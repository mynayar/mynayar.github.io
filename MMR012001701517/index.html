
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Baung Dut Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Sittwe</div><div class="name-mm">စစ်တွေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Baung Dut Ward</div><div class="name-mm">ဘောင်းဒွတ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012001701517</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.89791191870017, 20.15235867201517], [92.89804350930058, 20.15230721730427], [92.89816474061035, 20.15226027089483], [92.89806017823469, 20.15198855063113], [92.89760707730483, 20.151116482539692], [92.89743432293574, 20.15088032596634], [92.89630784023467, 20.147967298651963], [92.89592239620168, 20.146975566769015], [92.89421687061213, 20.147510372905458], [92.89425790307985, 20.148654234105663], [92.89439035523077, 20.149961736844716], [92.8952742395146, 20.149615070679033], [92.8956486515641, 20.150501938913408], [92.89615691331096, 20.151616571247814], [92.89688666728591, 20.151331750559905], [92.89736200665135, 20.152551527131322], [92.89780862436857, 20.152459436553784], [92.89782377794506, 20.15238261556533], [92.89791191870017, 20.15235867201517]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
