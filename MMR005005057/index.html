
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hta Naung Kaing Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hta Naung Kaing Gyi</div><div class="name-mm">ထနောင်းကိုင်းကြီး</div></div>
        <span class="pcode-badge">MMR005005057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.9187013201099, 22.830322229587296], [95.9187013201099, 22.824707039898044], [95.9193115200107, 22.817321819846143], [95.91589367984949, 22.80792239989887], [95.91192612009445, 22.804504379873265], [95.90069591968103, 22.789306619704803], [95.88610836031262, 22.789306619704803], [95.87207015991004, 22.785888689611397], [95.86712663968274, 22.789917000369314], [95.85131831988463, 22.789917000369314], [95.83569323965133, 22.79327390966324], [95.81292719973055, 22.791687029832588], [95.81109408012776, 22.793599709758837], [95.81566319999672, 22.79828897995253], [95.81963040002302, 22.804514550306294], [95.82146172008237, 22.813730909653827], [95.82365879981381, 22.821726510370183], [95.8244522401788, 22.83008832041969], [95.82803604033103, 22.836466350142018], [95.84307863956764, 22.83587649020791], [95.85467532001007, 22.834289520445054], [95.86871352041271, 22.83447267007773], [95.8820799596225, 22.832885700314876], [95.90332032037657, 22.83068843981971], [95.91510024038382, 22.830322229587296], [95.9187013201099, 22.830322229587296]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
