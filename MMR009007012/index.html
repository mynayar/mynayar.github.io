
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kyoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbu</div><div class="name-mm">မင်းဘူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kyoe</div><div class="name-mm">မန်းကြိုး</div></div>
        <span class="pcode-badge">MMR009007012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.86203534305668, 20.24509931638039], [94.8613535436312, 20.245704292119456], [94.85828054401196, 20.247860782749], [94.85823269018658, 20.248435040344873], [94.85979311735855, 20.250385573635356], [94.86154859758977, 20.252921267902252], [94.85959806429929, 20.255847069186927], [94.85940301034071, 20.25877286957234], [94.86057333139416, 20.261503616898437], [94.86505955895154, 20.264039312064654], [94.86896062733115, 20.26423436512391], [94.86979734127436, 20.264847956368158], [94.86993589442602, 20.26423436512391], [94.87656770923246, 20.26423436512391], [94.88051316904756, 20.264140426439553], [94.88046877671275, 20.264039312064654], [94.8816390977662, 20.25565201612767], [94.88451974678895, 20.247010066361497], [94.88397973807452, 20.246094399137235], [94.8816390977662, 20.242583437775465], [94.87617760221463, 20.23614667602834], [94.87405830484693, 20.2344310537502], [94.86203534305668, 20.24509931638039]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
