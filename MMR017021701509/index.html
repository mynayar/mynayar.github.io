
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (9) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungdon</div><div class="name-mm">ညောင်တုန်း</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (9) Ward</div><div class="name-mm">အမှတ် (၉) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017021701509</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.65504785647346, 17.045368074377166], [95.65495691882683, 17.04502680414373], [95.65491782439813, 17.044772476768458], [95.65481413976079, 17.044414141899153], [95.65468368320546, 17.04399567835793], [95.65455620070816, 17.043593463767365], [95.65439982299347, 17.043103086838016], [95.65436625310014, 17.042991766956504], [95.65424599485681, 17.04269680821119], [95.65414868371482, 17.04237666035465], [95.65410449013018, 17.04221475810465], [95.65407899435019, 17.042102421089908], [95.65405005056942, 17.04203796757821], [95.6538949948582, 17.041625854149913], [95.65386779935949, 17.041505595007266], [95.65373776728421, 17.041139940555865], [95.65363918180287, 17.041185444452765], [95.65314625169822, 17.041345519280355], [95.65184168704428, 17.041732299705927], [95.65086177674965, 17.04205488652383], [95.64786680231111, 17.042960077545615], [95.64651345573145, 17.043369796079276], [95.64658858419585, 17.04386485667783], [95.6466667730532, 17.044457613328234], [95.64673986275454, 17.04484194939647], [95.64697364152039, 17.046437874608273], [95.64895719701707, 17.046289187895752], [95.6492584797951, 17.04719466939855], [95.65010665919505, 17.046904593072554], [95.65331155338555, 17.045934417939065], [95.65504785647346, 17.045368074377166]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
