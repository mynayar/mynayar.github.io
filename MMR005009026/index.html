
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koke Ko Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ye-U</div><div class="name-mm">ရေဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koke Ko Su</div><div class="name-mm">ကုက္ကိုစု</div></div>
        <span class="pcode-badge">MMR005009026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42439073094755, 22.71212076636033], [95.42439073094755, 22.70714276522648], [95.42580441214398, 22.700922570120554], [95.42441015990102, 22.700922570120554], [95.40324576038358, 22.700922570120554], [95.39800596030688, 22.70587139994518], [95.39800596030688, 22.713069599682342], [95.39495352008896, 22.722227280065], [95.38918812023564, 22.724351369919816], [95.38992360019404, 22.724703000343254], [95.39979983979083, 22.73048415002353], [95.40678527971693, 22.730243309780974], [95.41088027970119, 22.728557160084904], [95.41425275985705, 22.73072508019834], [95.42122712643078, 22.73043922529007], [95.42659629578247, 22.728691123996214], [95.43132676931504, 22.728005423311686], [95.43030211055401, 22.723321274757097], [95.42812423404621, 22.718965520842175], [95.42439073094755, 22.71212076636033]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
