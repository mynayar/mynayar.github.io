
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Ku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Ku</div><div class="name-mm">ပန်ကူ</div></div>
        <span class="pcode-badge">MMR015005068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.87339131915411, 22.436388370726775], [98.8713281889448, 22.434642488959753], [98.86468743667592, 22.43464234326956], [98.8553122588537, 22.43464213822415], [98.84593702077694, 22.436985825435556], [98.84300417869997, 22.436985760684365], [98.8424257842226, 22.441441345641636], [98.84014276167915, 22.446156967769923], [98.83805403586513, 22.452005401128417], [98.83618402427334, 22.457241433045738], [98.83163147621173, 22.465158908756678], [98.82591561101668, 22.470450633889698], [98.82688099006572, 22.477233059058506], [98.82648511659494, 22.48435878692851], [98.83124555104143, 22.491800350405924], [98.83821318708897, 22.492671304237376], [98.84367473390193, 22.49626505988465], [98.85214896010649, 22.483473693955887], [98.85615008076167, 22.482841938204956], [98.85773751277605, 22.483252761106087], [98.86132200900357, 22.4798062388669], [98.87237871400652, 22.47408682224909], [98.8672601146626, 22.462387791763206], [98.8648848729386, 22.454074442581486], [98.8669581942653, 22.44599841189722], [98.87339131915411, 22.436388370726775]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
