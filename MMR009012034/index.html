
<!DOCTYPE html>
<html>
<head>
    <title>Map View - San Aint</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thayet</div><div class="name-mm">သရက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">San Aint</div><div class="name-mm">စမ်းအိုင့်</div></div>
        <span class="pcode-badge">MMR009012034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.20478669155261, 19.365061600212755], [95.20582169521509, 19.360404289226608], [95.20596225115702, 19.359771813118755], [95.20793321524576, 19.352092948231018], [95.2078624529899, 19.35048208258212], [95.20763352786508, 19.34527069838407], [95.20056319463578, 19.34635733122593], [95.19866831139353, 19.34657265770204], [95.19499358798373, 19.347062620943234], [95.19293143533753, 19.347337575169036], [95.18604718532941, 19.34657265770204], [95.1860214979938, 19.346803846420414], [95.18528226876174, 19.353456908609473], [95.18757701936403, 19.361297305226515], [95.1906366847353, 19.364356970597782], [95.1912103730603, 19.36875524176105], [95.19195166623649, 19.370432907252905], [95.19732970560148, 19.366269262916205], [95.20421395560965, 19.36512188806472], [95.20478669155261, 19.365061600212755]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
