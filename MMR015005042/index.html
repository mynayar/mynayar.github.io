
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Htan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Htan</div><div class="name-mm">မန်ထန်</div></div>
        <span class="pcode-badge">MMR015005042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.6450679451296, 22.43962056203935], [98.6455404354428, 22.433420983891324], [98.64545763755996, 22.429727461053517], [98.63831696205818, 22.425607840329633], [98.63468315870085, 22.42140877979142], [98.63168315975008, 22.417942113637707], [98.62578644718684, 22.411897983305323], [98.62165874785302, 22.410718640253094], [98.61682735329975, 22.413008115432206], [98.61660640516152, 22.415836224262364], [98.61651661055322, 22.41772191823202], [98.61649219126167, 22.418234720655903], [98.61803033683066, 22.42298749018056], [98.61911911635417, 22.425715744586], [98.61963307980284, 22.428114242778122], [98.62003602824018, 22.4313881941099], [98.62008993630155, 22.43182620171791], [98.6208458893264, 22.432178979676223], [98.62180314839662, 22.432625700815493], [98.62391611004051, 22.43313966426416], [98.62649734867375, 22.433670759797792], [98.6291813807162, 22.434413151945478], [98.63232226925737, 22.436183470990443], [98.63329309010408, 22.437554039587326], [98.635120516099, 22.438639074333878], [98.63814718984099, 22.440123857729873], [98.64128807838216, 22.440809142927662], [98.64205901231361, 22.44295674465809], [98.6450679451296, 22.43962056203935]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
