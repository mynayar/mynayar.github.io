
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ban Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ban Kone</div><div class="name-mm">ဘန်းကုန်း</div></div>
        <span class="pcode-badge">MMR009006047</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.46572776662322, 20.69313934290642], [95.46766995420506, 20.688866531665155], [95.46728295164695, 20.669516464912988], [95.46987234263457, 20.668278059784654], [95.46805695496454, 20.65829342580099], [95.46031692808384, 20.65313340818028], [95.45876892324725, 20.65210140375683], [95.44096686133162, 20.647457388347846], [95.43283983279213, 20.64900539318438], [95.41581177329476, 20.649392394843176], [95.40363097508947, 20.645564143670356], [95.40226672602864, 20.645135380193665], [95.39390939640157, 20.650881044424693], [95.39800971137913, 20.65945442987811], [95.39840444181158, 20.664980664925793], [95.41813378144889, 20.666807455100013], [95.41387676590011, 20.677256491793685], [95.42432580259378, 20.67803049421201], [95.42664781074791, 20.674160481221293], [95.4332268335516, 20.6675814584176], [95.43980585725456, 20.669903465672462], [95.44212786540874, 20.675321485298355], [95.43825785061938, 20.6811265047844], [95.43980585725456, 20.689640534982743], [95.43996284560887, 20.69009187863736], [95.46572776662322, 20.69313934290642]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
