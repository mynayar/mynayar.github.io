
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Khin-U</div><div class="name-mm">ခင်ဦး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit</div><div class="name-mm">ရွာသစ်</div></div>
        <span class="pcode-badge">MMR005005052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.77008072034903, 22.692871080136285], [95.76947015982006, 22.68951416994304], [95.76452627986396, 22.683898890321586], [95.75927748027158, 22.674926790439088], [95.7601235165871, 22.670070649241097], [95.76001705304463, 22.670192322117998], [95.75488348808256, 22.66645882081798], [95.7504499527032, 22.66482541276264], [95.74158288374315, 22.664358725774605], [95.73994947928509, 22.662725316819945], [95.73294916097507, 22.661791942843934], [95.7303299637569, 22.659482937987264], [95.72221534136497, 22.658991816419245], [95.71264824102354, 22.662491975124624], [95.70471454603955, 22.665292102448632], [95.70284779628884, 22.66809222707468], [95.70564792271352, 22.673459139128], [95.70728133166818, 22.683259582064125], [95.71114475982284, 22.696135739672684], [95.71112064000562, 22.70288087984875], [95.71173083990641, 22.71032711980081], [95.71569839966145, 22.711914089563606], [95.72851547990552, 22.711914089563606], [95.73931871998298, 22.711914089563606], [95.74432379970364, 22.714294409759248], [95.74591068043361, 22.70532230987675], [95.75372303978651, 22.699707030255297], [95.76110843970281, 22.69628910016189], [95.77008072034903, 22.692871080136285]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
