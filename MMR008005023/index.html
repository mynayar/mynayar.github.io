
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Thit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Thit</div><div class="name-mm">ရွာသစ်</div></div>
        <span class="pcode-badge">MMR008005023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.44107842942606, 18.5391174971748], [95.4368317461882, 18.53405507308321], [95.43717410190334, 18.532172114851278], [95.4387147026215, 18.529775623945966], [95.43837234780568, 18.527892665713978], [95.43717410190334, 18.526009709280686], [95.43563350028586, 18.521216725671422], [95.43409289866838, 18.51984730191151], [95.4304981609614, 18.515396674916644], [95.42707460201132, 18.516252565103855], [95.42517847680534, 18.51614722481463], [95.42347986520366, 18.51933376833881], [95.42347986520366, 18.522928505146467], [95.42159690697173, 18.52446910676389], [95.41474978907155, 18.528406200186055], [95.41012798421917, 18.5311450468065], [95.41081269564944, 18.538163344362886], [95.41081269564944, 18.543983395117664], [95.41058116428934, 18.547519963775358], [95.41189916571398, 18.547173122241873], [95.41780662427635, 18.547531148643657], [95.42156591633403, 18.54896325964677], [95.42363826459427, 18.548790564632895], [95.42371408193941, 18.548784246895536], [95.42598099043045, 18.548007021307058], [95.42997956780289, 18.54663608039084], [95.4355289990641, 18.543771858384616], [95.43768324408649, 18.541965071830646], [95.44107842942606, 18.5391174971748]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
