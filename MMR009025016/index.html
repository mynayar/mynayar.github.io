
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Laung Shey</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Saw</div><div class="name-mm">ဆော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Laung Shey</div><div class="name-mm">လောင်းရှည်</div></div>
        <span class="pcode-badge">MMR009025016</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.12383474657634, 21.0198265468577], [94.12884779159236, 21.023377453406795], [94.13944708701354, 21.028907519566417], [94.14705092775819, 21.03075087615207], [94.14903777837083, 21.030833661444376], [94.15258099481713, 21.030981295050765], [94.15472544262514, 21.032345944309952], [94.1567285448865, 21.029368359162504], [94.15995441666308, 21.022686194912012], [94.16387154783371, 21.012086901289535], [94.16367891664873, 21.010353217027387], [94.16318029023824, 21.005865574836434], [94.15972399776433, 21.0007963482729], [94.15538050070961, 20.997176766794382], [94.15419393070539, 20.996187958607436], [94.15073764003012, 20.99434460292116], [94.13944708701354, 20.993883764224393], [94.13488720677924, 20.992743794390663], [94.13453454393414, 20.993214012116994], [94.1290782122897, 21.011856480592144], [94.12383474657634, 21.0198265468577]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
