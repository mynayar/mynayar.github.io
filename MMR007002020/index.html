
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kha Yan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kha Yan</div><div class="name-mm">ခရမ်း</div></div>
        <span class="pcode-badge">MMR007002020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.63643594586227, 17.329314339785014], [96.63537180956143, 17.32749010638338], [96.62549735332027, 17.321009993716302], [96.6211772782089, 17.316381342325144], [96.61778293283612, 17.312061267213778], [96.61643329056398, 17.310542919320312], [96.61284570426591, 17.30650688518466], [96.60698274505768, 17.30465542390874], [96.60496147109507, 17.30457120419777], [96.60765691373564, 17.312363702023276], [96.60850136814366, 17.31630448536373], [96.60636559159883, 17.31977568679855], [96.6088342063336, 17.32347860755175], [96.60790847569564, 17.32749010638338], [96.6088342063336, 17.33026729739788], [96.6106856667102, 17.33211875777448], [96.61099424388931, 17.3339702190504], [96.61500574182156, 17.33489594878904], [96.61963439411204, 17.334587371609985], [96.62704023741708, 17.333353064692233], [96.63043458099116, 17.336438832885904], [96.6347764898432, 17.337205052571164], [96.6345962378262, 17.333179431685494], [96.63643594586227, 17.329314339785014]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
