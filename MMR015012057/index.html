
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Taung Hteik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Taung Hteik</div><div class="name-mm">တောင်ထိပ်</div></div>
        <span class="pcode-badge">MMR015012057</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.3438235872888, 22.29949141859413], [97.34590639466444, 22.295388729406397], [97.34415720339229, 22.275704593292403], [97.34103246397711, 22.262422482611555], [97.33556382061391, 22.253828105182947], [97.33165656579791, 22.246273333247757], [97.3297046106793, 22.242499179893287], [97.32384512285421, 22.242889707793836], [97.31095424064574, 22.244061388622242], [97.30236048734668, 22.237810836900678], [97.29689183409096, 22.229607108781067], [97.2882980340271, 22.225309800007324], [97.27696972657168, 22.224528270263534], [97.26954783126746, 22.219840337361745], [97.25821965331443, 22.213589730781507], [97.24767264717497, 22.211245620888747], [97.23790692256648, 22.208120233961665], [97.22189111568252, 22.20382277410181], [97.20626583130314, 22.204213103252187], [97.204159928438, 22.204824168300775], [97.2068308672508, 22.21521019669325], [97.21223590426365, 22.230704634211577], [97.21259624012447, 22.25628847313459], [97.21202745939979, 22.25970115928112], [97.21908228292108, 22.259891829944024], [97.2356577280218, 22.256648808995408], [97.26304324534954, 22.258450487400125], [97.27421365433673, 22.259171159121763], [97.30484219261314, 22.27214324561436], [97.33114670325779, 22.290880704980623], [97.3438235872888, 22.29949141859413]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
