
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lel Ma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lel Ma</div><div class="name-mm">လယ်မ</div></div>
        <span class="pcode-badge">MMR008011012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.626749309633, 18.373369020364066], [95.62596775560752, 18.372232215244594], [95.62625195666254, 18.36825339777613], [95.62511515244239, 18.361432567958673], [95.62340994521287, 18.35688534838016], [95.62170473798335, 18.35063292067281], [95.6214265947616, 18.34940909265555], [95.61715751840484, 18.34978031660836], [95.61317870003705, 18.347790909223136], [95.6127997661963, 18.346654104103663], [95.60976828467864, 18.346654104103663], [95.6021723615653, 18.345930683154563], [95.60294745576056, 18.348643512388264], [95.60408426087997, 18.350917121727832], [95.60607366916457, 18.35518014115064], [95.60749467623839, 18.358306353655337], [95.60891568241288, 18.36313777518825], [95.61204189491758, 18.37194801418957], [95.61744171856054, 18.372232215244594], [95.62198893903837, 18.373369020364066], [95.626749309633, 18.373369020364066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
