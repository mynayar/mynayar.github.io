
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thet Ka La Ah Thin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thet Ka La Ah Thin</div><div class="name-mm">သက္ကလအသင်း</div></div>
        <span class="pcode-badge">MMR007003092</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.7319641432307, 17.040081467285916], [96.73266372225305, 17.04381253412123], [96.73232178292398, 17.04962550811075], [96.73232178382335, 17.056122361657742], [96.73440991788345, 17.05598315379956], [96.73745088994667, 17.055780423227986], [96.74189610572074, 17.055438482999648], [96.7504445970406, 17.055438482999648], [96.75796727037329, 17.057148181443495], [96.76172860659, 17.056122361657742], [96.77041715922456, 17.063295465813155], [96.77625404708664, 17.06785553490505], [96.78175640693269, 17.069252959956202], [96.78429661129962, 17.065696672763295], [96.78805794661702, 17.06056757833113], [96.79284511071336, 17.05646430188608], [96.79212834564669, 17.050743616324894], [96.78429662478948, 17.046548050552133], [96.77745783191347, 17.040735076562555], [96.77198679725296, 17.040393137233536], [96.76685770192148, 17.039709257676122], [96.75899308925972, 17.039025379018085], [96.75147041592703, 17.03834149856135], [96.74428968282268, 17.037657619903314], [96.73852865996975, 17.03678404005143], [96.73334760091109, 17.03731567967492], [96.73163790336662, 17.03834149856135], [96.7319641432307, 17.040081467285916]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
