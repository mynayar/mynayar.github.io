
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myauk Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Budalin</div><div class="name-mm">ဘုတလင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myauk Taw</div><div class="name-mm">မြောက်တော</div></div>
        <span class="pcode-badge">MMR005013052</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.03464788009563, 22.405349520364098], [95.03464788009563, 22.40930268017462], [95.0375660398409, 22.415404949878564], [95.04074988000303, 22.42203777012702], [95.0455256397965, 22.429466549741505], [95.0451346802214, 22.42949454024091], [95.04924012043529, 22.434772860079477], [95.05640340039668, 22.440875039851278], [95.06489363992961, 22.45095702005051], [95.07495888014824, 22.456241279911183], [95.0778939597385, 22.45493672964642], [95.08293504021998, 22.45254893968189], [95.08850639965067, 22.448569230085923], [95.08930235991602, 22.443793560224663], [95.08930235991602, 22.438487249886748], [95.08877172033868, 22.431854429638292], [95.08346567979737, 22.429466549741505], [95.07683267968446, 22.427874720042325], [95.07405131671493, 22.424800631344112], [95.0717916001023, 22.422303089915715], [95.07099563983695, 22.414343669824575], [95.06568960019496, 22.411425240282654], [95.0590566000821, 22.409037360385923], [95.05268891975788, 22.410894599806], [95.04340307968846, 22.409567999963258], [95.0383620001063, 22.406649570421393], [95.03464788009563, 22.405349520364098]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
