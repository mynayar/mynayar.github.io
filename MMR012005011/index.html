
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pwint Htee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minbya</div><div class="name-mm">မင်းပြား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pwint Htee</div><div class="name-mm">ပွင့်ထီး</div></div>
        <span class="pcode-badge">MMR012005011</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.27847418433618, 20.41697437696598], [93.2825319173142, 20.416125942158544], [93.28651587260947, 20.414244628786662], [93.29415178857425, 20.410703335090886], [93.30200903488912, 20.406166052121648], [93.29846774119335, 20.403731411975116], [93.29470511624817, 20.400632779878947], [93.28950384042997, 20.395099507636246], [93.28673720385893, 20.39111555234092], [93.28395173098767, 20.388330078570334], [93.28320679915453, 20.388881880094743], [93.28153592804068, 20.390119563067458], [93.276666648647, 20.3920008746407], [93.27190803532761, 20.394878177286103], [93.2657107702359, 20.398419470981878], [93.2610628211923, 20.398419470981878], [93.2613948176168, 20.40030078255512], [93.26183747921635, 20.404506069999172], [93.26194814529072, 20.40727270567089], [93.26272280331477, 20.412141985963956], [93.26281657742317, 20.41608049401964], [93.26342368365613, 20.416236607333587], [93.26873562464942, 20.416089052867562], [93.2743426736755, 20.416089052867562], [93.27847418433618, 20.41697437696598]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
