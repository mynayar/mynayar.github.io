
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lan Ma Kye Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Lan Ma Kye Ward</div><div class="name-mm">လမ်းမကျယ်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007009701515</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.4378077379368, 18.94346303938778], [96.43781699016205, 18.943013522256308], [96.43784661922615, 18.942502078708003], [96.43788365510665, 18.94200464659724], [96.4379151358749, 18.941605299045364], [96.43792624609944, 18.941346073062846], [96.43792809870286, 18.94083987975671], [96.43790772815919, 18.940566639638746], [96.43790772815919, 18.940566639638746], [96.43602259266856, 18.940647210800194], [96.43486891896549, 18.940328429913166], [96.43447263270588, 18.940251362510423], [96.43421574460478, 18.940216036153863], [96.43415597421887, 18.94103955443194], [96.43414856740253, 18.941459921837975], [96.43408930927427, 18.94240924888777], [96.43405968110943, 18.94291018205928], [96.43404486657738, 18.943512702649173], [96.43591333583186, 18.94346716277937], [96.4378077379368, 18.94346303938778]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
