
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Gyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Gyi Kone</div><div class="name-mm">မကြီးကုန်း</div></div>
        <span class="pcode-badge">MMR010019063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60545818484741, 21.54377508365326], [95.60871292935826, 21.54757228303447], [95.60708555755252, 21.55326808255603], [95.60572941587992, 21.55923511400937], [95.60463207840775, 21.560789675802937], [95.6024746731677, 21.563846000192825], [95.60328835637262, 21.566287057002114], [95.61034030206332, 21.567100742904984], [95.6175403589005, 21.567743301312362], [95.62788633328773, 21.568254686404714], [95.63448490195674, 21.565367812274758], [95.64190829283353, 21.567429865096244], [95.65056891612267, 21.566192632683908], [95.6604667700255, 21.566192632683908], [95.66500328677233, 21.566192632683908], [95.66376605525932, 21.558356831602566], [95.66211641264238, 21.548871387904285], [95.65634266438252, 21.548046566595815], [95.65469302176558, 21.546396924878252], [95.65428061066171, 21.541860408131356], [95.65386820135649, 21.53526183766371], [95.65551784307405, 21.52742603658237], [95.64933168371027, 21.529900499608402], [95.63984624001205, 21.53113773202074], [95.63407249175214, 21.535674248767634], [95.62664910087534, 21.537323891384517], [95.61963812110247, 21.54062317571902], [95.61043172264596, 21.54152191230645], [95.60545818484741, 21.54377508365326]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
