
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Si Ka Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Banmauk</div><div class="name-mm">ဗန်းမောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Si Ka Taung</div><div class="name-mm">စီကတောင်</div></div>
        <span class="pcode-badge">MMR005023021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.58930636000059, 24.447430800391203], [95.60510244002563, 24.45007320011814], [95.62091075982374, 24.45709229986977], [95.63610851999226, 24.45770267963502], [95.64910883980116, 24.45831297036733], [95.67468251998235, 24.45770267963502], [95.67845999992909, 24.4583022603411], [95.67852768020833, 24.457885740234758], [95.68151856003357, 24.436279260079857], [95.68292220029934, 24.4171142998851], [95.68627920042479, 24.400512719586402], [95.68988028015087, 24.386901840147857], [95.66711424023003, 24.387878430145463], [95.66607672026447, 24.391906740004117], [95.6638792799049, 24.3967284902277], [95.65710443961825, 24.397277850092735], [95.64971940033013, 24.400329569953726], [95.65887455991304, 24.405273449909828], [95.65130628016078, 24.412902840393826], [95.64093000041925, 24.410278349766088], [95.62652604034457, 24.40191653971658], [95.61547836003837, 24.406677270040007], [95.60510244002563, 24.422485320041517], [95.59551996037794, 24.439086900340214], [95.58930636000059, 24.447430800391203]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
