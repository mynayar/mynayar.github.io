
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sun Pi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thanatpin</div><div class="name-mm">သနပ်ပင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sun Pi</div><div class="name-mm">စွန်ပိ</div></div>
        <span class="pcode-badge">MMR007002004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.57615228020364, 17.30200976324005], [96.57505826212918, 17.307901924334374], [96.57443960230586, 17.311740788406723], [96.57342810602233, 17.31746810466933], [96.5736843003902, 17.317476879354558], [96.58343716469346, 17.31606820828125], [96.58877671487357, 17.31977568679855], [96.59186248306719, 17.3228614540929], [96.59618255817855, 17.325947222286516], [96.59957690265202, 17.32347860755175], [96.60266266994631, 17.321318570895357], [96.60636559159883, 17.31977568679855], [96.60850136814366, 17.31630448536373], [96.60765691373564, 17.312363702023276], [96.60496147109507, 17.30457120419777], [96.59543846091628, 17.305370938018427], [96.58661667731786, 17.302803962632822], [96.58271454773825, 17.301551915688435], [96.57941971055124, 17.300282542405455], [96.5776285263355, 17.301241691850635], [96.57615228020364, 17.30200976324005]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
