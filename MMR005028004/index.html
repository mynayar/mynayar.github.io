
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Se Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Se Gyi</div><div class="name-mm">ဆယ်ကြီး</div></div>
        <span class="pcode-badge">MMR005028004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.4108888396483, 23.397094709653175], [94.40789795982306, 23.391906750096496], [94.40588375992763, 23.386474620107663], [94.4063110799924, 23.380676279886472], [94.40728775992227, 23.380676279886472], [94.40429688009698, 23.378906250423142], [94.40332020016717, 23.37591554956299], [94.40325251988793, 23.375933459561566], [94.39892568007616, 23.37707520016039], [94.39428708038452, 23.378906250423142], [94.3914794401241, 23.378723189823404], [94.38787836039808, 23.378723189823404], [94.38452136027263, 23.381286659651664], [94.38110352011142, 23.384277359612497], [94.38113159964365, 23.38433154016849], [94.38269039994208, 23.387329080372808], [94.38049332021063, 23.393310570226674], [94.38049332021063, 23.39788815001816], [94.38105816010608, 23.399948340343656], [94.38886151994325, 23.399948340343656], [94.40048555956099, 23.40037889976645], [94.4108888396483, 23.397094709653175]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
