
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nang Pang Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Nang Pang Ward</div><div class="name-mm">နန်းပန်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR014002701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.92342891490364, 20.656344434284676], [96.92343959509225, 20.65759401634648], [96.92466483669324, 20.657517488731685], [96.92802463563345, 20.657598390405838], [96.92892407189368, 20.657555560107767], [96.92894926443722, 20.654935793369305], [96.92895304317028, 20.654889500235186], [96.92873032562011, 20.654879982391037], [96.92776711980491, 20.65485713956548], [96.92692003168668, 20.654828586033318], [96.92553042645932, 20.654782900382145], [96.92451963142412, 20.65476576826279], [96.92451426536877, 20.65493927522482], [96.92449107789196, 20.655045592877116], [96.92435973164447, 20.655260696152027], [96.92423790324091, 20.655390138830796], [96.92410655699342, 20.655487220839746], [96.92349987406982, 20.655612551674892], [96.92348599356313, 20.655685191995474], [96.92345259408222, 20.65589452988968], [96.92342891490364, 20.656344434284676]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
