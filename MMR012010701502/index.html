
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myo Ma Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Buthidaung</div><div class="name-mm">ဘူးသီးတောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myo Ma Ward</div><div class="name-mm">မြို့မရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR012010701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.53480140386176, 20.875739661556167], [92.53463294778304, 20.875485797640888], [92.53434110164714, 20.87554658805539], [92.5336886303497, 20.875595220369284], [92.53245246678048, 20.875537903711965], [92.53142449918083, 20.875527482499194], [92.53041372633766, 20.875598694105392], [92.53052926531342, 20.876611081236433], [92.53065133658998, 20.877898833964082], [92.53071114915127, 20.879022021991112], [92.53075204478814, 20.879259967300538], [92.53096674688175, 20.879711541303855], [92.53125058005031, 20.880188310042513], [92.53131157145629, 20.88064160579072], [92.53132040119604, 20.880939468363053], [92.53161649800302, 20.881059260276686], [92.53205280487464, 20.881201725882313], [92.53247093668443, 20.881406998434272], [92.53300744433812, 20.881585834019063], [92.5333651173064, 20.88168518662212], [92.53358018927435, 20.881712642924185], [92.53368304743475, 20.881238096760796], [92.53374265989589, 20.880810877420117], [92.534037079048, 20.880161023712333], [92.53418189777642, 20.87960733630956], [92.53403345028357, 20.87914514952905], [92.53371268729074, 20.878881630183116], [92.53340507868148, 20.87780942696355], [92.53461683599824, 20.877466275348354], [92.53452032435354, 20.877155293382145], [92.53513347043338, 20.876994931670822], [92.53505144869456, 20.87659420366857], [92.53480140386176, 20.875739661556167]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
