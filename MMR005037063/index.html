
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Lit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nanyun</div><div class="name-mm">နန်းယွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Lit</div><div class="name-mm">နန်လစ်</div></div>
        <span class="pcode-badge">MMR005037063</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.18512335565839, 27.029786389830065], [96.17805740482544, 27.029600444205187], [96.16151138194476, 27.0293049791415], [96.14466989310114, 27.033146019573223], [96.13287172674887, 27.04016873819677], [96.15771467988861, 27.059326199844293], [96.18170183996801, 27.06951906015655], [96.19121450524528, 27.072237002935367], [96.20690904012014, 27.076721219608658], [96.22070316002288, 27.08551025979068], [96.23318075968439, 27.0914461198426], [96.23327652039518, 27.091491659712403], [96.23370347983177, 27.087707520285903], [96.23889144028777, 27.071716319752397], [96.2489012400003, 27.06011964020928], [96.26568587999941, 27.036926280223724], [96.2710974002249, 27.034129439921742], [96.25694648419295, 27.03403241386485], [96.23803674170233, 27.034918809055853], [96.22326350740502, 27.034623343992166], [96.20021725941905, 27.031077766825547], [96.18512335565839, 27.029786389830065]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
