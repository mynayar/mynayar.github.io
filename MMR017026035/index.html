
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Se Ka Lay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dedaye</div><div class="name-mm">ဒေးဒရဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Se Ka Lay</div><div class="name-mm">အစဲကလေး</div></div>
        <span class="pcode-badge">MMR017026035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.96758003808833, 16.35572541219807], [95.96562866123378, 16.354849283667534], [95.96304311574727, 16.350943462370935], [95.96188787632451, 16.349128080096875], [95.96078396031157, 16.34863397098104], [95.95933488809465, 16.34947879590976], [95.95832533704476, 16.35121536789495], [95.95599011964833, 16.361294143809744], [95.95476112412666, 16.36375213395388], [95.95016596708575, 16.367880183123987], [95.94634703918456, 16.374936578660254], [95.9469533845911, 16.37512563863737], [95.94897839973345, 16.37575704005542], [95.95296792003353, 16.37927334069218], [95.95732571990612, 16.379733780089907], [95.9595332398672, 16.37918639963266], [95.96061684019509, 16.375040189553147], [95.96144015963574, 16.36883226030062], [95.9641830001454, 16.363261079835013], [95.96468627964816, 16.361188559804248], [95.96758003808833, 16.35572541219807]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
