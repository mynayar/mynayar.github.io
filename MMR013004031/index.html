
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sar Ta Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hlegu</div><div class="name-mm">လှည်းကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sar Ta Lin</div><div class="name-mm">ဆားတလင်း</div></div>
        <span class="pcode-badge">MMR013004031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.32158154834985, 17.075710626444277], [96.32187455106975, 17.0733666010878], [96.32626959816349, 17.064576506900323], [96.33037164343665, 17.056372419051968], [96.33037164343665, 17.053735390076213], [96.32890662713919, 17.049340342982475], [96.32568359182437, 17.0443592886503], [96.32346919025099, 17.041729687175348], [96.31996257441335, 17.041889079417558], [96.31718650125606, 17.04201526419314], [96.30829524592889, 17.044116833225303], [96.30107132827925, 17.045824304947757], [96.29814129568433, 17.047582323965116], [96.29374624859054, 17.050805359279934], [96.29052321417504, 17.05490740275451], [96.28847219243778, 17.057251428110987], [96.28261212904658, 17.063111490602864], [96.285722269767, 17.065294841283958], [96.28833565466681, 17.06790822618376], [96.29235624834223, 17.06790822618376], [96.29697992918045, 17.06790822618376], [96.30039743299517, 17.06911440410653], [96.30240772893359, 17.071526759052745], [96.30421699581774, 17.06891337415294], [96.30783552868678, 17.06891337415294], [96.30964479467161, 17.06891337415294], [96.310247883633, 17.070722641037094], [96.31326332933924, 17.075346321875315], [96.31547465433187, 17.076351469844496], [96.31627877324684, 17.077155588759467], [96.31989730611582, 17.077155588759467], [96.32158154834985, 17.075710626444277]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
