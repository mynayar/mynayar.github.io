
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mya Wa Di</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mya Wa Di</div><div class="name-mm">မြဝတီ</div></div>
        <span class="pcode-badge">MMR009015020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.11502026797103, 18.999615410223043], [95.11699550833612, 18.99738524982945], [95.12158110738227, 18.99220784201833], [95.12195320997273, 18.991513657129644], [95.12338791462065, 18.99016785316394], [95.12475670705646, 18.987193073901267], [95.12483772697959, 18.987016992939914], [95.13077670677967, 18.96705136992483], [95.13056885636769, 18.96702932484351], [95.12040559274396, 18.96702932484351], [95.11525031544977, 18.96806038138152], [95.11466113989974, 18.973952126989104], [95.10906398071819, 18.97542506361583], [95.09919530621846, 18.975277769953152], [95.09021039189611, 18.974983182627852], [95.08770639963069, 18.97439400797714], [95.0849173816319, 18.974322494787373], [95.08591627931293, 18.97848456531051], [95.0894917598369, 18.98340085136823], [95.09396111071675, 18.98652939671433], [95.10245287819782, 18.990551813315562], [95.10870996889003, 18.995021164195407], [95.11073181841874, 18.99704301372418], [95.11094464388026, 18.997255839185698], [95.11207568164747, 18.997910650855886], [95.11502026797103, 18.999615410223043]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
