
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Kan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wundwin</div><div class="name-mm">ဝမ်းတွင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Kan Kone</div><div class="name-mm">အင်းကန်းကုန်း</div></div>
        <span class="pcode-badge">MMR010031021</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04593771435407, 21.209307708883728], [96.04189694438855, 21.214964787195242], [96.04189694438855, 21.22143001788106], [96.04189694438855, 21.227087096192577], [96.04270509766218, 21.233552327777772], [96.04391732892168, 21.230723789071646], [96.04714994471425, 21.233148250691272], [96.0487662530602, 21.238401251016967], [96.05401925428521, 21.244866482602163], [96.05482740755889, 21.248099098394732], [96.06371710076365, 21.2513317141873], [96.07179863979547, 21.248503174581913], [96.07251171674238, 21.248265482865804], [96.07664756393399, 21.246886868034608], [96.07705164102049, 21.242846098069037], [96.07583940976099, 21.235572712310898], [96.07543533267454, 21.2282993265527], [96.07381902522786, 21.223854480400007], [96.07583940976099, 21.220217786621618], [96.0661415632826, 21.219005557160813], [96.06210079331703, 21.214964787195242], [96.05644371500551, 21.211328094316173], [96.0491703301467, 21.211328094316173], [96.04593771435407, 21.209307708883728]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
