
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Shit Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Shit Kone</div><div class="name-mm">အုပ်ရှစ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010030062</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.04692432190001, 20.766172513750575], [96.05238392527798, 20.769342605976533], [96.06119454019591, 20.774377242815547], [96.06937582573386, 20.77941187965456], [96.07283713912273, 20.78224386276412], [96.06654384172498, 20.786649171122406], [96.06119454019591, 20.791054477682053], [96.05575359864974, 20.797237366211505], [96.05899188556714, 20.79955042880931], [96.06489195080297, 20.79883364305823], [96.0701386064116, 20.798458882071827], [96.07315180291346, 20.79955042880931], [96.0835357421808, 20.80206774722882], [96.0822770834207, 20.796718444800433], [96.08133308935066, 20.789166490441232], [96.0810184237613, 20.782873193043486], [96.08479440184021, 20.776265231855007], [96.08888504370987, 20.7775238906151], [96.08326453183275, 20.772908464653995], [96.07417076626791, 20.768058455933044], [96.06841138018109, 20.760783443301307], [96.05930655115645, 20.75581201890958], [96.05458657900749, 20.757385343259045], [96.04577596408956, 20.75675601297968], [96.04692432190001, 20.76089369478825], [96.04692432190001, 20.766172513750575]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
