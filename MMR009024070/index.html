
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hnyit Shauk</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hnyit Shauk</div><div class="name-mm">ညှစ်ရှောက်</div></div>
        <span class="pcode-badge">MMR009024070</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.26033122160862, 21.83765158395346], [94.26526650584464, 21.834635577070287], [94.27541125692403, 21.83134538668031], [94.27687509331099, 21.828972963431568], [94.27541125692403, 21.825313372913854], [94.27157270311784, 21.812152614951287], [94.26579147159919, 21.7943062083649], [94.26389559370676, 21.795153303182474], [94.25868612686332, 21.798717675280557], [94.25457339044965, 21.798991856988664], [94.251283200959, 21.795975850105435], [94.24634791672304, 21.792137296299245], [94.24196099680262, 21.792137296299245], [94.23782361536763, 21.79311079802494], [94.23867080821128, 21.797346763142627], [94.24124619225802, 21.801561026720037], [94.2414341047002, 21.80186852201473], [94.24168681509451, 21.80228204737864], [94.24881555929068, 21.809684973282913], [94.2556701199801, 21.823119912953644], [94.26033122160862, 21.83765158395346]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
