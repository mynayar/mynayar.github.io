
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Ton Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hseni</div><div class="name-mm">သိန္နီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Ton Nge</div><div class="name-mm">ရှန်တုံငယ်</div></div>
        <span class="pcode-badge">MMR015002027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.229761150157, 23.286840079606066], [98.24370974480894, 23.285751426886918], [98.24960262176364, 23.28322590844897], [98.24778289396545, 23.2779183687378], [98.2462600386699, 23.269542665961296], [98.24054933198613, 23.264022316976423], [98.2342675549038, 23.26116696318485], [98.22646292342523, 23.258882680691215], [98.22379792643324, 23.253171974906763], [98.22341721283419, 23.244034844032853], [98.22551113942762, 23.23661092615339], [98.22773252333735, 23.228201398975443], [98.22324908637631, 23.228035239334872], [98.21504594821198, 23.222956631043758], [98.20762399265323, 23.221003226217988], [98.20479295113387, 23.217377865695994], [98.20287335092445, 23.22601606528923], [98.19502112912187, 23.23386828619249], [98.18859658466471, 23.246003537333422], [98.18895350400106, 23.251714244017194], [98.18895350400106, 23.25992338425681], [98.1848633873355, 23.271117386957883], [98.18557740137601, 23.271423033246435], [98.20809344955313, 23.282476365791695], [98.229761150157, 23.286840079606066]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
