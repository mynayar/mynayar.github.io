
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon Seik/Aye Ywar (West) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyeemyindaing</div><div class="name-mm">ကြည့်မြင်တိုင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">War Yon Seik/Aye Ywar (West) Ward</div><div class="name-mm">ဝါးရုံဆိပ်/အေးရွာ (အနောက်ရပ်ကွက်)</div></div>
        <span class="pcode-badge">MMR013038701522</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.12628459925492, 16.794008969938034], [96.12589263963366, 16.79400825497703], [96.12560462994975, 16.794000626028094], [96.1250276564013, 16.793989181255768], [96.1246245254016, 16.793985912220137], [96.12455940279426, 16.795118968065992], [96.12446117434376, 16.79548168173426], [96.12432003024526, 16.795930863418675], [96.1241493227331, 16.79636192376381], [96.12400054968566, 16.79671287519909], [96.12379264801234, 16.797151565392483], [96.12350540185287, 16.797716522199778], [96.12346034581839, 16.797991222816734], [96.12395159419077, 16.797960281641735], [96.12442398108192, 16.797941207920474], [96.12483024621895, 16.79792976404741], [96.12531089787967, 16.797910690326148], [96.12580888936878, 16.797889882711956], [96.12623596212, 16.797784805924096], [96.12621116601258, 16.79673385638239], [96.12622261078491, 16.795602798830146], [96.12621116601258, 16.795103073448104], [96.1262335096688, 16.794731412424767], [96.1263037593111, 16.794370651184636], [96.12628459925492, 16.794008969938034]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
