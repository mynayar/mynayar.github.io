
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tha Pyay Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Nyaungshwe</div><div class="name-mm">ညောင်ရွှေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tha Pyay Pin</div><div class="name-mm">သပြေပင်</div></div>
        <span class="pcode-badge">MMR014002014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.8319474156408, 20.554584227979774], [96.83238217219957, 20.5539320935913], [96.83573815429247, 20.546101469007624], [96.83610194624788, 20.54619241744615], [96.83760258828886, 20.543491259613972], [96.83987205535112, 20.543491259613972], [96.84207723077964, 20.525219801952346], [96.84841630906544, 20.513660307577197], [96.86295889783491, 20.50657545659209], [96.87139420497863, 20.504942816557787], [96.87078952331791, 20.50433813489707], [96.85251806475696, 20.498744832008413], [96.8495357932423, 20.497458361714052], [96.83538748614365, 20.502006030953623], [96.81290435944868, 20.513376808892644], [96.81278362276606, 20.513483613278197], [96.8156714043119, 20.515821534935924], [96.81098364318063, 20.52402507779516], [96.80824894603211, 20.53691644833549], [96.81020193357244, 20.54512011530113], [96.81723327489578, 20.547073493147252], [96.82179178636193, 20.549805632623872], [96.82268711182081, 20.549457451100523], [96.82716175521091, 20.55169477189628], [96.8319474156408, 20.554584227979774]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
