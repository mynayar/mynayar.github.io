
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Hla</div><div class="name-mm">ကန်လှ</div></div>
        <span class="pcode-badge">MMR007003077</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.75245896870649, 17.020216506286772], [96.74668324373675, 17.019876756806923], [96.74018639198846, 17.020902575693356], [96.73180728707672, 17.02102823166763], [96.73266371955509, 17.024663911910068], [96.73539923778463, 17.03013494657057], [96.73676699689946, 17.033554344357583], [96.73852865996975, 17.03678404005143], [96.74428968282268, 17.037657619903314], [96.75147041592703, 17.03834149856135], [96.75899308925972, 17.039025379018085], [96.76685770192148, 17.039709257676122], [96.77198679725296, 17.040393137233536], [96.77745783191347, 17.040735076562555], [96.78429662478948, 17.046548050552133], [96.79011665485979, 17.034111028301368], [96.79387093589503, 17.022612274137202], [96.78506328963914, 17.022270334808127], [96.77950946968633, 17.022270334808127], [96.77662361808558, 17.021629033653028], [96.77335455636774, 17.020902575693356], [96.76574682695457, 17.02064915843198], [96.76104470904613, 17.02021869703526], [96.75249621772633, 17.02021869703526], [96.75245896870649, 17.020216506286772]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
