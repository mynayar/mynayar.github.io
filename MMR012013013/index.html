
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kon Baung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ramree</div><div class="name-mm">ရမ်းဗြဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kon Baung</div><div class="name-mm">ကုန်ဘောင်</div></div>
        <span class="pcode-badge">MMR012013013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.8040197552076, 19.1514786514187], [93.81150674434082, 19.157144589850986], [93.81293259696184, 19.15822355507305], [93.81974195322863, 19.16199901334386], [93.82565792657209, 19.161145186201452], [93.83015356373602, 19.15483722805567], [93.83178772812124, 19.15085866059877], [93.83183069772855, 19.15075403886783], [93.83342181696332, 19.14688008055134], [93.83564353092424, 19.13859670667273], [93.83560544823291, 19.138595926960534], [93.82902708013569, 19.138461193229546], [93.82465744068838, 19.135006052787162], [93.82369542240588, 19.134100299689123], [93.81888548837463, 19.129571452360665], [93.81736897240023, 19.129227978788265], [93.81243700036731, 19.12811084723785], [93.80476762422654, 19.126158955971107], [93.80301330861738, 19.126259283439254], [93.79850220131561, 19.1265171919149], [93.79840395937526, 19.134962137092998], [93.79837900138983, 19.137107622718645], [93.80084266535675, 19.142557318265688], [93.8040197552076, 19.1514786514187]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
