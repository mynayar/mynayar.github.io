
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nay Rit Sa Ya</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nay Rit Sa Ya</div><div class="name-mm">နေရဉ္စယျ</div></div>
        <span class="pcode-badge">MMR010007009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14698032698055, 22.029617451384297], [96.14140682356611, 22.03023672904186], [96.14008224360072, 22.03023672904186], [96.14079031402184, 22.038497552420154], [96.14068271193764, 22.04549172116606], [96.13727830315122, 22.04571868217147], [96.13273693006533, 22.044892977728807], [96.12798913109356, 22.04468655184297], [96.12179635002161, 22.043860848299573], [96.116842125164, 22.043035143856855], [96.11787425459323, 22.04633795982903], [96.11931923759278, 22.050053629371575], [96.1199241710637, 22.052019660678866], [96.13231018466735, 22.053145048904923], [96.14708616819217, 22.05340202208572], [96.14925101442282, 22.053318759253386], [96.14925101442282, 22.050466481143246], [96.14904458763766, 22.046957239285234], [96.14883816175183, 22.044892977728807], [96.14842530908084, 22.041177309085583], [96.14780603142327, 22.037874493113407], [96.14780603142327, 22.03539737978531], [96.14780603142327, 22.033126694141686], [96.14698032698055, 22.029617451384297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
