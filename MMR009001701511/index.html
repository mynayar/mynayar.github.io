
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Thar Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Magway</div><div class="name-mm">မကွေး</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Myin Thar Ward</div><div class="name-mm">မြင်သာရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR009001701511</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.93950867008914, 20.151152122672386], [94.93821868524418, 20.150814670061038], [94.93751211669087, 20.15062983599819], [94.93516846904964, 20.149965140778647], [94.93514641137784, 20.15004414082449], [94.93438438972788, 20.152498556163494], [94.93141077688591, 20.151713305025055], [94.9310059443689, 20.153214887756917], [94.9302547082882, 20.152982745757186], [94.92981796152975, 20.15431137357109], [94.92924054011888, 20.154401060260795], [94.92908194557538, 20.15464789268617], [94.92894630622709, 20.155031852837794], [94.92854602427968, 20.156673653366454], [94.92944602171661, 20.15726946951048], [94.93030116007054, 20.157815808552755], [94.93745460414675, 20.161380726539335], [94.94016210579662, 20.162049511875523], [94.94248070462089, 20.162772908542934], [94.94473513142123, 20.155237115000887], [94.93871963640214, 20.153651128197055], [94.93950867008914, 20.151152122672386]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
