
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ga Lon Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ga Lon Kone</div><div class="name-mm">ဂဠုံကုန်း</div></div>
        <span class="pcode-badge">MMR010028030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.80071424896346, 20.89979011412254], [95.8050119750227, 20.897806547833966], [95.80964029456402, 20.897806547833966], [95.81625218129318, 20.897806547833966], [95.81988871858954, 20.897475954351876], [95.82617001093729, 20.89615357682618], [95.83112892486008, 20.894831200199803], [95.83641843406355, 20.89317822829264], [95.84170794326701, 20.89317822829264], [95.83476546305576, 20.888880502233462], [95.83145952014081, 20.88689693594489], [95.82716179408158, 20.884252181792817], [95.82451703903018, 20.881607426741425], [95.82054990735242, 20.879623862251492], [95.81823574668243, 20.881607426741425], [95.81426861590398, 20.88292980516644], [95.80964029456402, 20.88292980516644], [95.80567316378551, 20.882268616403564], [95.80236722087062, 20.882268616403564], [95.80236722087062, 20.88326039864853], [95.80137543772634, 20.886235748081333], [95.79939187233708, 20.88987228537769], [95.79939187233708, 20.894170011436927], [95.80005306020064, 20.89714535997041], [95.80071424896346, 20.89979011412254]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
