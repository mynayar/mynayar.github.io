
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sa Aut</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Narphan</div><div class="name-mm">နားဖန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sa Aut</div><div class="name-mm">စအွတ်</div></div>
        <span class="pcode-badge">MMR015006019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[99.27436195394108, 22.599754504766622], [99.29377957776535, 22.595462367094626], [99.31031518739604, 22.59245589302509], [99.32093235594351, 22.591515908132692], [99.31584544061468, 22.57516510918248], [99.31307445132495, 22.56463534484533], [99.30309888520543, 22.5493025307872], [99.29607904171445, 22.538218568232367], [99.29441644796077, 22.53378498339032], [99.29275385330772, 22.530644528322398], [99.29275385330772, 22.525369922683808], [99.29146072443297, 22.526210942580974], [99.28177963502219, 22.52579246015398], [99.27949882481096, 22.526563998429822], [99.26683879587381, 22.524043258989252], [99.26647076991014, 22.527065077291525], [99.26822454682542, 22.539592053330637], [99.26997832284138, 22.553622266854177], [99.27047940170308, 22.560136293854953], [99.27022886317155, 22.572162191032362], [99.27223317861836, 22.58193323333211], [99.27323533724109, 22.596464524818032], [99.27436195394108, 22.599754504766622]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
