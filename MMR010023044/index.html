
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ywar Tan Lel Thar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ywar Tan Lel Thar</div><div class="name-mm">ရွာတန်းလယ်သာ</div></div>
        <span class="pcode-badge">MMR010023044</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.02340571490186, 20.487960099978693], [96.02224861568112, 20.483794542783983], [96.0182511651592, 20.479463970785673], [96.0129212296311, 20.478298048316333], [96.01168444957773, 20.477251542324893], [96.00486819820884, 20.47888744240157], [95.99233354195945, 20.480909160629324], [95.98633003220527, 20.486917496145566], [95.9799422583286, 20.493954731625593], [95.97353223612384, 20.49540181993808], [95.9764617668971, 20.505656406118305], [95.9846649149539, 20.51180927257991], [95.98807023925019, 20.51975581168142], [95.99409989679287, 20.51477478972481], [96.00276104168876, 20.505447403674793], [96.00882148662237, 20.497900008878332], [96.01408715299976, 20.495953456886582], [96.01675212121347, 20.494620973679048], [96.01925052778967, 20.493954731625593], [96.01991676984312, 20.491289764311205], [96.02058440764438, 20.488841759339778], [96.02340571490186, 20.487960099978693]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
