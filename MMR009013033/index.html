
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Twin Myaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Minhla</div><div class="name-mm">မင်းလှ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Twin Myaung</div><div class="name-mm">ရေတွင်းမြောင်</div></div>
        <span class="pcode-badge">MMR009013033</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01987650469698, 19.78947818037375], [95.02235286259457, 19.7904068140233], [95.02680296258671, 19.793643250135915], [95.02788924918957, 19.79456860485726], [95.02865040029582, 19.793889006072845], [95.02835662775624, 19.79239440208005], [95.03778737198968, 19.780498031558977], [95.03884777610403, 19.77696343691315], [95.04042430203998, 19.771708475166065], [95.04247964681832, 19.76090941963406], [95.04269300198052, 19.75618710565044], [95.04306151088008, 19.747976596642673], [95.04101088034793, 19.738015014980988], [95.04000374038037, 19.736337641768785], [95.03632324512171, 19.736738046923392], [95.03631838518538, 19.736867069959374], [95.02518474498004, 19.73741017414028], [95.00819345606322, 19.742669383385362], [95.00382352433621, 19.74769480397208], [95.00237492606203, 19.749360691942456], [95.00366333439541, 19.751739290835644], [95.00864484738185, 19.75877201621563], [95.0137728761174, 19.766097771295165], [95.01714272305827, 19.77576776756848], [95.01875438910383, 19.781481856602454], [95.01987650469698, 19.78947818037375]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
