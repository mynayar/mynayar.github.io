
<!DOCTYPE html>
<html>
<head>
    <title>Map View - War Yon La Har</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">War Yon La Har</div><div class="name-mm">ဝါးရုံလဟာ</div></div>
        <span class="pcode-badge">MMR017006030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.01894221431178, 17.27448246869102], [95.02104275991547, 17.271755100117844], [95.02124471976805, 17.27066528997119], [95.02069427981723, 17.267498820214428], [95.02193339990652, 17.26281792001106], [95.02234632002671, 17.26102818010645], [95.02441128035639, 17.259238440201898], [95.02688951963569, 17.257035600312747], [95.03101980002378, 17.25593426985074], [95.0358560401242, 17.255888099556216], [95.03928000017191, 17.255521259798343], [95.0442120000838, 17.252155709818226], [95.04189576018126, 17.24891291999529], [95.03762795996244, 17.243405999687184], [95.03363556003313, 17.243819009739582], [95.02771535987603, 17.24409432009685], [95.02386084040552, 17.245333440186187], [95.02262172031618, 17.24671017003834], [95.0209696801067, 17.252630100398846], [95.0194551597279, 17.256209580208008], [95.01890436004823, 17.25538356010327], [95.01835356036855, 17.25455753999853], [95.01717239978649, 17.25405129003508], [95.01528863935926, 17.253146071134324], [95.01287190381538, 17.255200297156023], [95.01251482709768, 17.25894960763833], [95.01483582621245, 17.264484304407176], [95.01501436592031, 17.268412154597286], [95.01894221431178, 17.27448246869102]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
