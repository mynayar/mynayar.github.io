
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zwe Kaik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kawa</div><div class="name-mm">ကဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zwe Kaik</div><div class="name-mm">ဇွဲကိုက်</div></div>
        <span class="pcode-badge">MMR007003008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.50193340810034, 17.041893103883694], [96.50254808212833, 17.043298075146083], [96.50333837936279, 17.044351803592917], [96.50790453416698, 17.046547071190446], [96.5107144757925, 17.047952041553515], [96.5146659565687, 17.04909358070421], [96.5151928207921, 17.047952041553515], [96.51896868105985, 17.040136890705014], [96.51940773368, 17.036273219733346], [96.51993459790344, 17.03355108881175], [96.51650998135062, 17.03337546830329], [96.5191443015683, 17.031092390001845], [96.51984678809885, 17.02916055541533], [96.52028584071905, 17.026614045002248], [96.52028584071905, 17.025193730406386], [96.52021928729033, 17.02518594317678], [96.51721894479851, 17.02483488202421], [96.51449419684974, 17.026736159446273], [96.51186728434777, 17.02649734897352], [96.50673286413041, 17.025064487036502], [96.50595378413988, 17.025114750145633], [96.50527021394925, 17.025999370074942], [96.50447991761416, 17.027140909225636], [96.50518240324539, 17.03003866155501], [96.50658737360845, 17.031268011409622], [96.50518240324539, 17.037063516967805], [96.50193340810034, 17.041893103883694]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
