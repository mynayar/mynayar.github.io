
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Poke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Seikphyu</div><div class="name-mm">ဆိပ်ဖြူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Poke</div><div class="name-mm">ရေပုတ်</div></div>
        <span class="pcode-badge">MMR009022020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.6408638635765, 21.041525425158284], [94.64544240294458, 21.042034150955374], [94.65178045060736, 21.04261033759707], [94.66906603726784, 21.042322244276193], [94.67713264395644, 21.03944131286636], [94.67739379988404, 21.039632827992648], [94.67742073727726, 21.038865127123984], [94.67742073727726, 21.034831824229343], [94.67684455063556, 21.031374707077134], [94.68001357536627, 21.02762949570473], [94.68077631017866, 21.02568028441766], [94.67779525814473, 21.024950230069123], [94.6715263521595, 21.024212712246936], [94.66341364982014, 21.02273767480392], [94.65788226255643, 21.02550336888544], [94.65722114124276, 21.02619203823201], [94.65345715292534, 21.030112859321036], [94.6481101446675, 21.03380045112999], [94.64552882959185, 21.038041180855885], [94.64110371996077, 21.041175633848468], [94.6408638635765, 21.041525425158284]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
