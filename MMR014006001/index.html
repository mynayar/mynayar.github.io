
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Htwet Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Htwet Ni</div><div class="name-mm">ထွက်နီ</div></div>
        <span class="pcode-badge">MMR014006001</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.61331942665026, 20.933620334211128], [96.61671346625354, 20.934105195598363], [96.63175977069693, 20.935985983766216], [96.64210410472072, 20.935985983766216], [96.64273103381021, 20.935359054676667], [96.64994072058784, 20.934249872233863], [96.64994072058784, 20.929089761982993], [96.64845387144908, 20.917690577158453], [96.6480599333193, 20.914670386629098], [96.64586568105642, 20.9046395167004], [96.64487496001146, 20.904563308150216], [96.64179063972631, 20.904326052605313], [96.6286251243501, 20.905893375778703], [96.62792150917039, 20.905893375778703], [96.6088668849988, 20.91071736981081], [96.61716896117866, 20.91509777414302], [96.61942572801502, 20.917999329705367], [96.61839705827765, 20.927755876732363], [96.61863158707814, 20.92775153390619], [96.6188919300186, 20.927734177890045], [96.61821899790851, 20.92944469471695], [96.61821913370613, 20.929600744179027], [96.61391956403673, 20.932867117823264], [96.61331942665026, 20.933620334211128]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
