
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oe Bo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaing</div><div class="name-mm">မြိုင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oe Bo</div><div class="name-mm">အိုးဘို</div></div>
        <span class="pcode-badge">MMR009020051</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})

            attribution: '&copy; OSM'

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.85591063436834, 21.709219573424605], [94.86016872190902, 21.709496522346683], [94.86618677819729, 21.716464796912874], [94.8760057111947, 21.709496522346683], [94.88216088261868, 21.707365885427294], [94.87795335226548, 21.70306050613749], [94.87772726270305, 21.69876481524409], [94.87840552959159, 21.690173434356552], [94.88337948827285, 21.679321163241127], [94.88337948827285, 21.672175136773205], [94.88337948827285, 21.671181959679757], [94.87930988604245, 21.663947112569247], [94.87704899671388, 21.6549035543556], [94.87690374361296, 21.655010915421485], [94.87184895026888, 21.65874706702357], [94.86425595984474, 21.666972806050182], [94.85435105165976, 21.660369533027563], [94.85467425631197, 21.655198272082657], [94.8520886253898, 21.650027010238375], [94.84400852797125, 21.645502155000486], [94.83528202394632, 21.645178952146978], [94.82817153778632, 21.649057398080515], [94.81992984028994, 21.65729909737547], [94.82429309185278, 21.661662348938307], [94.83269639302415, 21.66683361078259], [94.8472405672984, 21.6742672997961], [94.85172646480459, 21.678539584034638], [94.85402784790693, 21.68073137665175], [94.8575830909869, 21.687841861912432], [94.85629027507622, 21.694629144319606], [94.85435105165976, 21.704002055850253], [94.85596707132333, 21.70820370643594], [94.85591063436834, 21.709219573424605]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
