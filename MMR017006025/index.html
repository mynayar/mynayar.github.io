
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Thoe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yegyi</div><div class="name-mm">ရေကြည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Thoe</div><div class="name-mm">ရေသိုး</div></div>
        <span class="pcode-badge">MMR017006025</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.07403439956795, 17.31169620001964], [95.07479976040071, 17.307699389815014], [95.07452436011118, 17.29930131010741], [95.07461478874154, 17.29789938394947], [95.07479976040071, 17.29503341995644], [95.07300983973238, 17.28801207010099], [95.06874204041287, 17.279200980341045], [95.06860451968288, 17.277273629774243], [95.0670900002034, 17.277273629774243], [95.06571336028338, 17.27672292002677], [95.06433672036343, 17.276172210279356], [95.06282219998462, 17.278787970288647], [95.06185848018475, 17.280233550438027], [95.06089476038494, 17.281679129688143], [95.05580076019697, 17.285258610396625], [95.0556632403663, 17.29489581019351], [95.05731527967646, 17.30370689995351], [95.05993752559641, 17.311823277822043], [95.06020643997527, 17.312655600375706], [95.06364839995376, 17.316097470421994], [95.06557583865407, 17.316648183766745], [95.06750292032359, 17.31719879998468], [95.07080735957203, 17.316235170117068], [95.0728777338204, 17.31468223879432], [95.07356064031137, 17.31417002992299], [95.07403439956795, 17.31169620001964]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
