
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Loke Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yedashe</div><div class="name-mm">ရေတာရှည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Loke Gyi</div><div class="name-mm">ဇလုပ်ကြီး</div></div>
        <span class="pcode-badge">MMR007010012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.25863255744662, 19.146713119614844], [96.2557275916551, 19.158332981881642], [96.2557275916551, 19.16737137888606], [96.25562363092587, 19.168958846873352], [96.26124289724197, 19.169663930645925], [96.26505597055666, 19.17068075091595], [96.26810642956815, 19.17296859472492], [96.27115688857958, 19.174748030197463], [96.27446155265858, 19.174748030197463], [96.27929144714261, 19.173985414994945], [96.2826188649687, 19.1744607597563], [96.28615498036811, 19.173985414994945], [96.2942895371325, 19.17246018458991], [96.30166147959369, 19.17246018458991], [96.3057287588752, 19.172205980421722], [96.31030444739241, 19.171443366118524], [96.3127383240145, 19.170372459721307], [96.3097960372574, 19.168901316342726], [96.30471193860512, 19.168138702039528], [96.29556056157071, 19.164579832893025], [96.2894596444471, 19.162037784016547], [96.2823419061541, 19.16051255361151], [96.27802042180508, 19.157207890431835], [96.2734447341872, 19.15314061115032], [96.26963165997319, 19.150852767341405], [96.26225971661268, 19.14805651339742], [96.25863255744662, 19.146713119614844]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
