
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Singu</div><div class="name-mm">စဉ့်ကူး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Zin</div><div class="name-mm">လက်ပန်ဇင်</div></div>
        <span class="pcode-badge">MMR010010020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.05306191787326, 22.368036325815808], [96.04366893797118, 22.36568807994098], [96.0392241511737, 22.362859579905717], [96.03714495997201, 22.358470176057835], [96.03152291385146, 22.359793011338468], [96.0237256334313, 22.361627665184642], [96.01684567858524, 22.363003655794103], [96.01180037938406, 22.36713162762254], [96.00964902028613, 22.369949816930557], [96.00847802114384, 22.372960959380805], [96.01031816265316, 22.375637528848927], [96.01299473302055, 22.379317812766885], [96.01399844657112, 22.381994384033646], [96.02135901530636, 22.381492527258388], [96.0263775848577, 22.381325240767296], [96.02989058318394, 22.380154241625007], [96.03256715355133, 22.379485099257977], [96.03775300869444, 22.377310385665794], [96.04477900624619, 22.375804815340018], [96.04829200367311, 22.373128244073257], [96.05306191787326, 22.368036325815808]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
