
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Thee Pin (Lay Ein Tan)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myingyan</div><div class="name-mm">မြင်းခြံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Thee Pin (Lay Ein Tan)</div><div class="name-mm">ကွမ်းသီးပင် (လေးအိမ်တန်း)</div></div>
        <span class="pcode-badge">MMR010017056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.32538289110761, 21.466286528400587], [95.33072747209525, 21.476308537309194], [95.33796908930208, 21.477562014175646], [95.34534868319525, 21.478821944577135], [95.35580866823551, 21.480010580324063], [95.36389138358055, 21.47050150244246], [95.36912137744969, 21.46432060231399], [95.37026525843498, 21.46281925790248], [95.37292500788288, 21.459328336133865], [95.3691872069241, 21.45738705237062], [95.36716911026627, 21.451108527236784], [95.36648146165021, 21.445951166213376], [95.36335714761435, 21.445951166213376], [95.3570786215812, 21.443708836193878], [95.34900623315121, 21.443933068656236], [95.34581890002227, 21.443715939938727], [95.34032189114242, 21.44458388823591], [95.33344497510558, 21.447429508664925], [95.33193172007287, 21.44805568322323], [95.3297672272758, 21.45058631880363], [95.31900898837415, 21.45433436214114], [95.32538289110761, 21.466286528400587]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
