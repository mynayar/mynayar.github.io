
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Khun Taung Nge</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Khun Taung Nge</div><div class="name-mm">ခွန်တောင်းငယ်</div></div>
        <span class="pcode-badge">MMR005004020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.67914832033875, 22.63727627997639], [95.6826914396583, 22.63151907024894], [95.68459295989726, 22.628580030044418], [95.68512683973194, 22.6277548202288], [95.68778400003163, 22.624211969806595], [95.68977695973894, 22.61823335958195], [95.68379844034581, 22.617347670358754], [95.67626976044113, 22.6171262698615], [95.67477611962227, 22.609017000234417], [95.67471995965849, 22.60871189983436], [95.67073404024381, 22.607383319684516], [95.66320536033919, 22.608490500236428], [95.65722684004669, 22.609376190358944], [95.65257707976849, 22.60871189983436], [95.64814836025869, 22.61026197041366], [95.64798995996875, 22.61057903989081], [95.64526980036106, 22.61601909020891], [95.64327683975444, 22.62133340990897], [95.64371963984956, 22.625983350051627], [95.64836975985656, 22.627311930201472], [95.65124831975419, 22.62886199988145], [95.65080551965906, 22.632626249901534], [95.65235568017056, 22.63683338994906], [95.65257707976849, 22.640376240371268], [95.66032680044157, 22.63506200970403], [95.67095543984175, 22.634397720078766], [95.67914832033875, 22.63727627997639]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
