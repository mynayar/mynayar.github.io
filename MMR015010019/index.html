
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Hpar Len</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Namhkan</div><div class="name-mm">နမ့်ခမ်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Hpar Len</div><div class="name-mm">ဖာလင်</div></div>
        <span class="pcode-badge">MMR015010019</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.70322657144919, 23.76340603306204], [97.70592611140097, 23.762732053241734], [97.71509098995728, 23.758267112637213], [97.7036688247565, 23.753792180564744], [97.69957615131841, 23.74960432917652], [97.69614972802759, 23.74589237023673], [97.6922057583891, 23.741536765609283], [97.69236318381394, 23.739175389632578], [97.68951177444887, 23.73648304875377], [97.6872473426908, 23.73852103841523], [97.68397558390615, 23.73971076773779], [97.6780269309981, 23.73971076773779], [97.67481465876955, 23.73971076773779], [97.67481465876955, 23.74170550720345], [97.67481465876955, 23.742625608085405], [97.67362492944699, 23.748336313869856], [97.67243519742647, 23.755712643223944], [97.67243519742647, 23.760709511235007], [97.67099917796975, 23.76336062359394], [97.67338698232345, 23.76380281035148], [97.67569332158956, 23.76345686004612], [97.67578157026333, 23.763265785587578], [97.67623749686305, 23.7633752339799], [97.68290482589708, 23.76237513390538], [97.69004320902695, 23.76308897257809], [97.69718159215682, 23.76308897257809], [97.70317195741995, 23.76334301666691], [97.70322657144919, 23.76340603306204]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
