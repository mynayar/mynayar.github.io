
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nga Me Kan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nga Me Kan</div><div class="name-mm">ငမဲကန်</div></div>
        <span class="pcode-badge">MMR009016035</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24611612795701, 19.005344945113166], [95.24010576986547, 19.004899733036325], [95.23217317565161, 19.001866682201694], [95.22657369711851, 18.99696713792315], [95.22502976890877, 18.995604849384335], [95.22424058143775, 18.9983670082309], [95.22158666139535, 18.999504402406274], [95.2212075297038, 19.00140005906553], [95.21654129834229, 19.005832979308593], [95.21187506608152, 19.013298951285606], [95.20557565239449, 19.02239810289018], [95.20417578298606, 19.02986407486719], [95.20377772955862, 19.02989469498425], [95.20440909410445, 19.033130436820272], [95.20388039256613, 19.036126408606947], [95.20464240612222, 19.036396799672616], [95.20954195040076, 19.043629459631916], [95.21514142803454, 19.056228287005865], [95.21862814097597, 19.059714999947346], [95.22167415283997, 19.059261337840496], [95.2359061607408, 19.055994974988153], [95.23805695416519, 19.054650728648255], [95.2396391467293, 19.053661859307397], [95.24570524929788, 19.04409608276808], [95.24547193728012, 19.035930177435773], [95.24150564017322, 19.03009738688496], [95.24267219756393, 19.025197842606417], [95.24407206787168, 19.0167986252564], [95.24477200212624, 19.01096583470553], [95.24611612795701, 19.005344945113166]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
