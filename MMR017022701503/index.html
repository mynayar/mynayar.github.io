
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (3) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Danubyu</div><div class="name-mm">ဓနုဖြူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (3) Ward</div><div class="name-mm">အမှတ် (၃) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR017022701503</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.59089473000785, 17.262480908966836], [95.59079784424517, 17.26196473318595], [95.59073665257449, 17.26152971582377], [95.5907264542625, 17.26121806116464], [95.59072305482516, 17.26086095566859], [95.59072300895974, 17.260597349088414], [95.59132646844182, 17.260575270732204], [95.59134686596514, 17.260370746013166], [95.59060716009242, 17.260245198856865], [95.59033890941322, 17.260226279818994], [95.58965560632123, 17.26018407643403], [95.58847257424998, 17.260232772924155], [95.58849436662177, 17.259681984935696], [95.58771196993155, 17.259729564467875], [95.58738727870002, 17.26007045159014], [95.58735668286471, 17.260482747580795], [95.587596773972, 17.260458399335732], [95.58755300576667, 17.26140797549772], [95.58750966114201, 17.261931457370906], [95.5873583834827, 17.2627227654433], [95.58734682629506, 17.262896205995162], [95.58881082635861, 17.262763344652683], [95.5896369094159, 17.262682185334654], [95.59054797930588, 17.262610764775047], [95.59089473000785, 17.262480908966836]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
