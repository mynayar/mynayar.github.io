
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Khun Taing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Khun Taing</div><div class="name-mm">တံခွန်တိုင်</div></div>
        <span class="pcode-badge">MMR005004039</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.72815367994843, 22.55723541008615], [95.7352532402449, 22.55225328016479], [95.73998651966224, 22.548267539715255], [95.7470860799587, 22.55175503956349], [95.75231724024849, 22.553249669636614], [95.75866943964297, 22.55200415986411], [95.76178344025362, 22.552876079567454], [95.76178344025362, 22.548641219716558], [95.76178344025362, 22.54390821009588], [95.76377604023213, 22.53606128979675], [95.7661426799408, 22.529335410400904], [95.76240623965629, 22.526844300024493], [95.75914067989851, 22.523578830198915], [95.75729928023765, 22.524228629947345], [95.75406107965517, 22.524602309948705], [95.74833167966335, 22.527716219727836], [95.74359840024601, 22.527591660027156], [95.74148123966751, 22.532324669647835], [95.7407338796649, 22.53631041009737], [95.73761987995357, 22.537805040170497], [95.73027120025574, 22.53680855986721], [95.72092955995129, 22.53593673009607], [95.71980887967612, 22.542039900021393], [95.71856327997148, 22.547146589643432], [95.7230470802586, 22.552876079567454], [95.72815367994843, 22.55723541008615]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
