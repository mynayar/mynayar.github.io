
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Aum Long</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pangsang</div><div class="name-mm">ပန်ဆန်း (ပန်ခမ်း)</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Aum Long</div><div class="name-mm">အွမ်လုံ</div></div>
        <span class="pcode-badge">MMR015005058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.71101742781212, 22.552754272691573], [98.71257390875894, 22.553948310666044], [98.71969159668987, 22.549881061062194], [98.73207469379213, 22.536318621807027], [98.73515259921317, 22.531346620949876], [98.73443337899732, 22.527031298755503], [98.73014232320969, 22.510565200423684], [98.72883150197231, 22.502117687681164], [98.72971600858699, 22.48752332404223], [98.72971600858699, 22.481626610579667], [98.72794699535763, 22.478088583221563], [98.72556244295242, 22.47621500671721], [98.72396671379289, 22.481626610579667], [98.71600615156268, 22.487375906273087], [98.70730849958767, 22.48958717280982], [98.69743150725833, 22.491356186938503], [98.69659801019009, 22.492979313044884], [98.6946305678465, 22.496810646194433], [98.69487958922173, 22.510074322571995], [98.69610474643696, 22.513174023962108], [98.69698925305164, 22.52555712106431], [98.69684183528256, 22.539561813626847], [98.70273854784574, 22.54516369065186], [98.71101742781212, 22.552754272691573]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
