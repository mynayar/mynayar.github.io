
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Tan Bet Hlan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ponnagyun</div><div class="name-mm">ပုဏ္ဏားကျွန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Tan Bet Hlan</div><div class="name-mm">တံဘက်လှမ်း</div></div>
        <span class="pcode-badge">MMR012002075</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.93879566728629, 20.32252821690372], [92.93912882293688, 20.32175527838342], [92.94041331202482, 20.30963196933999], [92.93997115764284, 20.303741504366997], [92.932692332785, 20.30659197483982], [92.92007286237276, 20.30745801657423], [92.90745339196053, 20.30869522020828], [92.90083955729978, 20.30905989799595], [92.9000409979937, 20.309061603110536], [92.9007162152812, 20.310285537247807], [92.9031975068595, 20.312315841303075], [92.90725782898568, 20.314120584597333], [92.91233326716662, 20.314346248780396], [92.91549132556429, 20.314007921128734], [92.9174087368238, 20.312767232621752], [92.9194389383564, 20.31141375474101], [92.92293535857999, 20.311075431585948], [92.9277852243087, 20.311188300999333], [92.92936422517892, 20.31265462760905], [92.93071764460365, 20.314459330433806], [92.93046118223782, 20.316822300009164], [92.93038417059307, 20.3170093266192], [92.93110455812894, 20.317987967071076], [92.93304650469247, 20.319600490170558], [92.93505944643636, 20.320774706187763], [92.93681557058216, 20.321799112239262], [92.93879566728629, 20.32252821690372]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
