
<!DOCTYPE html>
<html>
<head>
    <title>Map View - In Doke</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">In Doke</div><div class="name-mm">အင်ဒုတ်</div></div>
        <span class="pcode-badge">MMR005028023</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.42309571999152, 23.40747071959811], [94.42482084000983, 23.405975370067324], [94.42388916035651, 23.40448001963722], [94.42688004018174, 23.39990234991359], [94.43125404044167, 23.39646939035015], [94.42852776004815, 23.394470219924756], [94.42651356015273, 23.393920860059723], [94.4193113998013, 23.390075699833744], [94.41729719990593, 23.383911150279403], [94.41845856011452, 23.38208010001665], [94.4204713201953, 23.378906250423142], [94.42150272027436, 23.378653260339718], [94.42089827963196, 23.371887239704392], [94.41827387983574, 23.36248781975712], [94.417318440094, 23.36018319010219], [94.41426204016108, 23.361201899847856], [94.4043598803043, 23.36292396037254], [94.3966940402978, 23.365598130449428], [94.40112312043573, 23.369873039808965], [94.40332020016717, 23.37591554956299], [94.40429688009698, 23.378906250423142], [94.40728775992227, 23.380676279886472], [94.4063110799924, 23.380676279886472], [94.40588375992763, 23.386474620107663], [94.40789795982306, 23.391906750096496], [94.4108888396483, 23.397094709653175], [94.41607680010429, 23.39990234991359], [94.41827387983574, 23.404907249769792], [94.42309571999152, 23.40747071959811]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
