
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Zee Ngu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Zee Ngu</div><div class="name-mm">ဇီးငူ</div></div>
        <span class="pcode-badge">MMR017007055</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.20690967973798, 17.19727074005266], [95.20734456040321, 17.196652799687], [95.20875791964232, 17.196210090423392], [95.20942917002026, 17.195787561047155], [95.20913825642543, 17.190914686163865], [95.21591502755655, 17.182553734067596], [95.21486090700529, 17.18059608084451], [95.21078725063114, 17.179342648044837], [95.21015580334773, 17.174501548008095], [95.21002799979243, 17.174473919935508], [95.20626168043225, 17.173314540034028], [95.20262495967421, 17.17246034956554], [95.19770375972081, 17.17305039026337], [95.19261443960477, 17.175161609920394], [95.1895483197992, 17.175373740206], [95.19118452024946, 17.180093519900083], [95.19226811967803, 17.185266180190126], [95.19342912015782, 17.189097210268073], [95.19340392025475, 17.189637209989314], [95.19330384010021, 17.191753920007443], [95.19292691984151, 17.192126519923022], [95.19315113431747, 17.19207439072062], [95.19327720397985, 17.1920450800165], [95.19605562706562, 17.195474960301226], [95.19973588400393, 17.200018128433953], [95.20084624815587, 17.20193603162261], [95.20130891157709, 17.202735178185947], [95.20231709116086, 17.204476577731953], [95.20442898800746, 17.20471123333681], [95.20588837095164, 17.20342022776134], [95.20639582960393, 17.198003145228995], [95.20690967973798, 17.19727074005266]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }

        map.fitBounds(layer.getBounds());

</body>
</html>
