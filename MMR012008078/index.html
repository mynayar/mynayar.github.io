
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Paik Son</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Paik Son</div><div class="name-mm">ရေပိုက်ဆုံ</div></div>
        <span class="pcode-badge">MMR012008078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.82993909181567, 20.35747459187894], [92.83117646722025, 20.348560527046743], [92.83658674638127, 20.34022931013459], [92.83721667111251, 20.339155932400388], [92.83192405385205, 20.33837236299422], [92.82969950073141, 20.338186598133063], [92.82210469367675, 20.337552164201043], [92.81670370271377, 20.337430800690925], [92.81698147541482, 20.33815149759357], [92.81718706043455, 20.33879109723142], [92.81695863263485, 20.339567754448353], [92.81551953389942, 20.34002461004775], [92.81442307866223, 20.339750495788792], [92.81383900406684, 20.33948092310618], [92.81353220844471, 20.339339324850016], [92.81120224039114, 20.339293639290076], [92.81017431259448, 20.3398190241287], [92.80932912883628, 20.341189593624904], [92.80820982991975, 20.343017019619822], [92.80800424490002, 20.343656619257615], [92.80846110139879, 20.34434190355603], [92.8098545136749, 20.345050032433107], [92.81124792595108, 20.34582668695208], [92.81184493909274, 20.346352627571775], [92.8107995932267, 20.3472660392963], [92.81128669842246, 20.35050847928295], [92.81729841359095, 20.35364099963249], [92.81967656372251, 20.354447205873896], [92.82552059040296, 20.356428190208874], [92.82993909181567, 20.35747459187894]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
