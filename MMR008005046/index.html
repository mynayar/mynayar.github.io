
<!DOCTYPE html>
<html>
<head>
    <title>Map View - But Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thegon</div><div class="name-mm">သဲကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">But Taw</div><div class="name-mm">ဘွတ္တော</div></div>
        <span class="pcode-badge">MMR008005046</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.36894642873477, 18.686176593275206], [95.37125341371416, 18.685888220265213], [95.36981154776475, 18.678678895015025], [95.36144873137391, 18.67666028394501], [95.35395103221441, 18.675795164015653], [95.34904869014497, 18.675795164015653], [95.33982075382477, 18.681274252105084], [95.33809051486543, 18.68271611715511], [95.3331881736953, 18.683581236185148], [95.32626722055585, 18.680697506085096], [95.32107650727505, 18.67925564103507], [95.31704875679475, 18.679831033575397], [95.31763218837483, 18.684352627871533], [95.31790454086195, 18.689890472267507], [95.32713233958589, 18.688771951264584], [95.33751376884544, 18.688195205244597], [95.3444347219849, 18.685311474245168], [95.35164404813435, 18.684157982205193], [95.35596964328448, 18.68559984725522], [95.36289059642394, 18.68733008621456], [95.36894642873477, 18.686176593275206]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
