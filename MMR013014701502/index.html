
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bamar Aye Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dawbon</div><div class="name-mm">ဒေါပုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Bamar Aye Ward</div><div class="name-mm">ဗမာအေးရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013014701502</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.19427769326097, 16.800388588762416], [96.19431495666998, 16.801202773789043], [96.1944040821827, 16.801986868399297], [96.19489588094024, 16.80201748491902], [96.19551277179704, 16.80214118936442], [96.19670178256126, 16.802298472696407], [96.19685030020128, 16.801801205161553], [96.19692039516019, 16.801382065330074], [96.19695472677927, 16.801092148184125], [96.19696998557646, 16.800676345736804], [96.19694073962347, 16.800312677887803], [96.19690132143887, 16.79993915616717], [96.19682598163382, 16.799529076106012], [96.19670009633245, 16.799052715110747], [96.19654464761743, 16.798680305851462], [96.19621276900415, 16.797983169387805], [96.19567918774436, 16.796955586031515], [96.1938510899559, 16.797752762180266], [96.19397640238913, 16.79804992696262], [96.19418830874349, 16.79843254082914], [96.19426803634087, 16.79869651793001], [96.19428062415153, 16.799192428387926], [96.19428062415153, 16.799950281680196], [96.19427769326097, 16.800388588762416]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
