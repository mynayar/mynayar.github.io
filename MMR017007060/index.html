
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Let Pan Chaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaunggon</div><div class="name-mm">ကျောင်းကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Let Pan Chaung</div><div class="name-mm">လက်ပံချောင်</div></div>
        <span class="pcode-badge">MMR017007060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.0432133596089, 17.025104430425188], [95.04054719979348, 17.027723699589103], [95.03629056016126, 17.02937547000198], [95.0295741839015, 17.031810347569547], [95.02863084004127, 17.03236175968749], [95.0286029430714, 17.03244027409943], [95.02465251809929, 17.034571189808617], [95.02089221970022, 17.04021163515887], [95.02089221970022, 17.044598650407465], [95.02903953334783, 17.051179172380955], [95.03624676857356, 17.059953199280756], [95.03718745133989, 17.062043603229768], [95.04129852041046, 17.05994747959255], [95.04170639983056, 17.059742550178612], [95.04349236438117, 17.058883959327318], [95.0445662403398, 17.05836770980204], [95.04751032034505, 17.057117250161014], [95.04888012002158, 17.056624859649617], [95.0503463998665, 17.056168649763435], [95.05189043959217, 17.055837090409455], [95.05507716028279, 17.05548212979653], [95.05787255987082, 17.05508667001385], [95.0597787601817, 17.05476627034716], [95.06072699995116, 17.054606789971444], [95.06351483983804, 17.05457852967544], [95.06222891992877, 17.051730929838584], [95.05751652007143, 17.052337709617632], [95.05404503984676, 17.04747771032811], [95.05068911980709, 17.0421547499418], [95.04744911968118, 17.038451879550678], [95.04420911955526, 17.034980400225322], [95.0432133596089, 17.025104430425188]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
