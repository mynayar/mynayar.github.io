
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Laing Shey (North)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Patheingyi</div><div class="name-mm">ပုသိမ်ကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Laing Shey (North)</div><div class="name-mm">တလိုင်းရှည် (မြောက်)</div></div>
        <span class="pcode-badge">MMR010007042</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.21449016398992, 21.888728921302743], [96.21421489230352, 21.88570093095325], [96.21539936239071, 21.882147523389563], [96.2152309355593, 21.878442143889856], [96.21907121786245, 21.87681740979565], [96.22191394427318, 21.872079531245447], [96.21480712734711, 21.870895062057514], [96.21249151966794, 21.87023345960654], [96.20977173777555, 21.878392555272285], [96.209058335274, 21.881123180290615], [96.19327717590102, 21.879592171741365], [96.19327717590102, 21.882803659761123], [96.19159152442938, 21.895768922198044], [96.19182841844679, 21.899559224678512], [96.19193759974047, 21.90174285504878], [96.19239405604094, 21.901633305932364], [96.1954177548256, 21.89997027061156], [96.1965225773551, 21.89936261938942], [96.20044467188416, 21.896472655188916], [96.2047796190842, 21.893582690089147], [96.20952741805598, 21.89069272498932], [96.21097240015621, 21.891105577660312], [96.21449016398992, 21.888728921302743]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
