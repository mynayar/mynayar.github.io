
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yoe Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hmawbi</div><div class="name-mm">မှော်ဘီ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yoe Gyi</div><div class="name-mm">ရိုးကြီး</div></div>
        <span class="pcode-badge">MMR013003030</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03465830573629, 17.035664661095268], [96.03695232608902, 17.03413531359388], [96.03746731116752, 17.033791991107535], [96.0402763165988, 17.033791991107535], [96.04355349020148, 17.033791991107535], [96.0468161442497, 17.034307147057234], [96.0473262163319, 17.034387684943738], [96.04800108198441, 17.034494242015683], [96.05057600377961, 17.036132829266705], [96.05068840464622, 17.03605254319035], [96.05322665838366, 17.034239503650213], [96.05408726101837, 17.030280733868835], [96.05432134375508, 17.02630130935802], [96.05529567105845, 17.02181940484172], [96.05549176283466, 17.02091738213153], [96.05549176283466, 17.016235705813244], [96.05529924586358, 17.01517686022396], [96.05502359556255, 17.01529937126901], [96.0517464228592, 17.01459712036086], [96.04729883107626, 17.013426701281276], [96.04331940566613, 17.01202219766634], [96.04051040113416, 17.013894867654074], [96.03816956297499, 17.017172041256742], [96.03536055664443, 17.019746963051944], [96.03419013756485, 17.022790052119262], [96.03255155211252, 17.027237644801517], [96.03138113303294, 17.03145115294842], [96.03114704939685, 17.036835080174853], [96.03255155211252, 17.036600995639503], [96.03465830573629, 17.035664661095268]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
