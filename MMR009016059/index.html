
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thit Khaung Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thit Khaung Tee</div><div class="name-mm">သစ်ခေါင်းတီး</div></div>
        <span class="pcode-badge">MMR009016059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54786458298418, 19.47050712990017], [95.54814687657716, 19.468169832371927], [95.54814687657716, 19.464454608893163], [95.54850553430305, 19.45118428832427], [95.55460270934759, 19.432175447738757], [95.55496136617415, 19.419263783097165], [95.55410058907097, 19.417470497165766], [95.55065747796027, 19.410297349842892], [95.54133238698012, 19.41101466439528], [95.54003315980253, 19.41071834857297], [95.52088891818909, 19.406352119354892], [95.51397887472535, 19.405883640917352], [95.50008679167217, 19.404941805220176], [95.50008679167217, 19.423567672210368], [95.50331470760773, 19.441141881892406], [95.50223873622878, 19.44616308465868], [95.49219632979685, 19.457998777022], [95.48717512703053, 19.466247895723882], [95.48598532576221, 19.471641746069793], [95.48748219874454, 19.471295886595954], [95.49319668437954, 19.471326844858027], [95.49476655803028, 19.47059349269557], [95.49510760613117, 19.470434175996502], [95.50757972892143, 19.470583431080513], [95.51280607603962, 19.470205971228665], [95.52531427063712, 19.471105840062535], [95.52802371212465, 19.47130076272009], [95.54786458298418, 19.47050712990017]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
