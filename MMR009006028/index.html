
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bone Taw Pyayt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bone Taw Pyayt</div><div class="name-mm">ဘုန်းတော်ပြည့်</div></div>
        <span class="pcode-badge">MMR009006028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.4656862242399, 20.29350767004297], [95.46548672673111, 20.29352097011673], [95.46438041312564, 20.29359472531638], [95.46375158017133, 20.293301269338144], [95.46118788371393, 20.292104876039275], [95.45717401516873, 20.2914359297244], [95.45354076129718, 20.290830676094856], [95.44538953739732, 20.293039485683778], [95.44011719085574, 20.292743383000754], [95.4361163103195, 20.29415960478201], [95.43436626019479, 20.294779082988327], [95.43181661744302, 20.289125182880923], [95.42949742596551, 20.291514702241784], [95.42147992405933, 20.30026106869343], [95.41694170939246, 20.309337498027162], [95.4160409196528, 20.311139075707842], [95.4166497426915, 20.313650472091638], [95.41850367530441, 20.32129794344536], [95.42497988221584, 20.318631635241843], [95.42790783737684, 20.322017082722255], [95.44867494159536, 20.33635627542185], [95.45955295040841, 20.33536736471217], [95.46993650206798, 20.33635627542185], [95.47234195921408, 20.33625604777842], [95.47188091277394, 20.335564478118215], [95.47141986723312, 20.33487291025665], [95.47131964318703, 20.3341713401353], [95.46845313690278, 20.314105805138865], [95.4656862242399, 20.29350767004297]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
