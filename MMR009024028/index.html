
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Tilin</div><div class="name-mm">ထီးလင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyin</div><div class="name-mm">ကျင်း</div></div>
        <span class="pcode-badge">MMR009024028</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.28656134393094, 21.60916620335763], [94.28583018971153, 21.61282196995802], [94.28555600800343, 21.616112159448676], [94.28226581941209, 21.619950713254866], [94.2808949063749, 21.62269253842993], [94.28445927757366, 21.62406344966854], [94.28830563839455, 21.626841377227834], [94.28939456180962, 21.627627821766623], [94.29432984694495, 21.629821281726834], [94.29789421904303, 21.6309180121566], [94.30200695455738, 21.628176186981477], [94.30420041541691, 21.623789267960376], [94.30831315183053, 21.62132162629206], [94.31708698987273, 21.620773261077204], [94.31896756939784, 21.62007265323041], [94.31692646988074, 21.613495028872535], [94.31635633297844, 21.61038470918703], [94.31324843606654, 21.610902691705917], [94.30666805708523, 21.61227360474311], [94.30063604331878, 21.61227360474311], [94.29542657557607, 21.614467063804], [94.28829783317849, 21.610902691705917], [94.28656134393094, 21.60916620335763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
