
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Za Yat Hla</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Zigon</div><div class="name-mm">ဇီးကုန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Za Yat Hla</div><div class="name-mm">ဇရပ်လှ</div></div>
        <span class="pcode-badge">MMR008011003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.56240752428789, 18.29778065795108], [95.56372768498471, 18.29464527685809], [95.56458028814984, 18.29009805727958], [95.56600129522366, 18.285550836801747], [95.56994120262448, 18.280401381718434], [95.57120928538029, 18.279066559374257], [95.56859520170724, 18.27681303909054], [95.56726651993398, 18.273783647597327], [95.56194545082195, 18.268693534279237], [95.55403529559248, 18.25990378723003], [95.54719188379846, 18.257679458040627], [95.54478024741053, 18.25689559905271], [95.5446862017069, 18.257130713311824], [95.5446862017069, 18.259120121596368], [95.5446862017069, 18.264235744184305], [95.54582300682637, 18.266509354423192], [95.54724401300086, 18.26991976888229], [95.55093862941425, 18.27276178123128], [95.54923342128541, 18.275603793580274], [95.54980182429483, 18.277593201864818], [95.55122282957001, 18.280719416168154], [95.55378064086392, 18.282993026407098], [95.5556753163628, 18.284177197919405], [95.55690685516731, 18.287256044031267], [95.55747525727736, 18.290666459389627], [95.55695502465471, 18.294828322169394], [95.5591804654062, 18.295782081977563], [95.56145407474582, 18.29635048408761], [95.56240752428789, 18.29778065795108]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
