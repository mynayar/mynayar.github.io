
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kat Hi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Mongmao</div><div class="name-mm">မိုင်းမော</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kat Hi</div><div class="name-mm">ကတ်ဟီ</div></div>
        <span class="pcode-badge">MMR015008003</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.8620286926701, 23.002194486086694], [98.86228841058175, 23.002085472066938], [98.87888487733528, 22.995119281229904], [98.88196169817388, 22.99452399478656], [98.88584165856577, 22.98787263231617], [98.889689718206, 22.973937426770874], [98.88584165856577, 22.96961107888825], [98.85047801614758, 22.944392743330468], [98.85167261529904, 22.943198144179064], [98.83074828800312, 22.941054020126955], [98.81395490839236, 22.94497247509969], [98.77975547703369, 22.952359552251608], [98.77772166742108, 22.95279885488327], [98.77972836966859, 22.963119037613524], [98.79105549991147, 22.970190810657414], [98.79782693356617, 22.979872474734975], [98.81540423781536, 22.975408396580292], [98.8365644509887, 22.970770542426635], [98.83664281971045, 22.97081641594491], [98.84844895405604, 22.97772732455644], [98.85917399358499, 22.99106115794615], [98.8620286926701, 23.002194486086694]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
