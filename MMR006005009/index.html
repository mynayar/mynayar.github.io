
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pa Thaung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Tanintharyi</div><div class="name-mm">တနင်္သာရီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myeik</div><div class="name-mm">မြိတ်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pa Thaung</div><div class="name-mm">ပသောင်း</div></div>
        <span class="pcode-badge">MMR006005009</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.75134152019507, 12.37550696997073], [98.75318759992786, 12.37934222956028], [98.75634156011495, 12.38613614986349], [98.76216455974668, 12.38977584018295], [98.76798756027773, 12.39026120968714], [98.77308300028028, 12.392687610245048], [98.78012111439796, 12.394857473793422], [98.78108975978466, 12.38807762967889], [98.78375844039977, 12.383710109933702], [98.78885388040231, 12.378129480291307], [98.7893391599743, 12.374489879904104], [98.7876406796737, 12.369879720372865], [98.7876406796737, 12.3664828497038], [98.78909652018831, 12.362115329958556], [98.78898218577933, 12.35752281512589], [98.78594256000122, 12.357990449999306], [98.78206067955676, 12.357990360067106], [98.77356863958113, 12.35774763034891], [98.76701771969209, 12.357504899731396], [98.76108430309819, 12.363521220328096], [98.7602238002882, 12.364784009674338], [98.7565845596298, 12.369636719958692], [98.75134152019507, 12.37550696997073]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
