
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yone Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Meiktila</div><div class="name-mm">မိတ္ထီလာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yone Taw Gyi</div><div class="name-mm">ရုန်းတောကြီး</div></div>
        <span class="pcode-badge">MMR010028037</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.94656318134582, 20.86546582358892], [95.94963877011321, 20.869731963659262], [95.95016096865385, 20.869170382007553], [95.9506251033659, 20.869393853643487], [95.95116258588467, 20.868093387200133], [95.95181508629724, 20.86639091930556], [95.95290565457236, 20.86354637086839], [95.95668602044356, 20.86015891969845], [95.96149253795033, 20.858358383432687], [95.96343150505999, 20.858300341187828], [95.96557069183405, 20.858236618824947], [95.9672084337223, 20.858271349743063], [95.97056388881248, 20.858343123736233], [95.97166926262645, 20.858184316053382], [95.96832556167539, 20.85383750589625], [95.96270545898977, 20.848878591074197], [95.95774654506704, 20.84458086501496], [95.95669660366536, 20.843773218059596], [95.94915109294863, 20.837968979185064], [95.9485143099875, 20.837468650358005], [95.94683693317796, 20.840613733337193], [95.94658837765155, 20.844093501713758], [95.94650633789723, 20.845242053777838], [95.94716752666011, 20.85218453398909], [95.94584515003373, 20.856482260048324], [95.94485336688945, 20.863094145878165], [95.94656318134582, 20.86546582358892]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
