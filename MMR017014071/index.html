
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nyaung Taw Su</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myaungmya</div><div class="name-mm">မြောင်းမြ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nyaung Taw Su</div><div class="name-mm">ညောင်တောစု</div></div>
        <span class="pcode-badge">MMR017014071</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.97982815974183, 16.569410759598952], [94.98279707992134, 16.567596360283858], [94.99054968022364, 16.564462380334646], [94.99747752037132, 16.561328400385435], [95.00407524008034, 16.557039719707348], [95.0093535599189, 16.553245950340397], [95.0062194001053, 16.55176139986878], [95.00242571977122, 16.54862741991957], [94.99813703999246, 16.546483169962357], [94.99384836021369, 16.54499862039006], [94.9884051595705, 16.543844009593442], [94.97982815974183, 16.539885270388993], [94.97586923977366, 16.538235750079878], [94.9722404402442, 16.539060510234435], [94.96811664037074, 16.54631820012486], [94.97075579984033, 16.551596519963482], [94.97537460005782, 16.55621505038431], [94.97735388017747, 16.558359300341465], [94.97933316029719, 16.561658250128175], [94.97982815974183, 16.569410759598952]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
