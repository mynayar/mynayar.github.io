
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyee Nyo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Munaung</div><div class="name-mm">မာန်အောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyee Nyo</div><div class="name-mm">ကျီးညို</div></div>
        <span class="pcode-badge">MMR012012017</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[93.69503513696208, 18.77600140444133], [93.69132399910336, 18.77843201922235], [93.69065373797969, 18.77996508362179], [93.68998347056078, 18.78149814802117], [93.68919997759696, 18.78453375472907], [93.68898451532317, 18.78536854682102], [93.68899978671084, 18.789074039635295], [93.6870083360659, 18.79842590163412], [93.68752975399502, 18.801807280581556], [93.68905425864716, 18.802284915016855], [93.69987121698313, 18.802542741654236], [93.70038650063657, 18.801758843096195], [93.70307487730378, 18.797398624946652], [93.70509192085552, 18.794329823362716], [93.70661163571845, 18.793679561362694], [93.70440577770455, 18.792076902027475], [93.70186570643727, 18.791442149735474], [93.70084806238822, 18.79080158062851], [93.69948604814266, 18.78871231791919], [93.70352406618275, 18.783541414904448], [93.70520197359224, 18.78031279479967], [93.70215126187128, 18.778874440702907], [93.69859316973907, 18.777437957196014], [93.69503513696208, 18.77600140444133]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
