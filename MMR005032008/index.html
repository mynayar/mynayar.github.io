
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Nan Bone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Paungbyin</div><div class="name-mm">ဖောင်းပြင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Nan Bone</div><div class="name-mm">နန်းဘုန်း</div></div>
        <span class="pcode-badge">MMR005032008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.78024200026817, 24.019480800098904], [94.76361504020201, 24.017941259681436], [94.71423276033369, 24.01079382037858], [94.6877425199014, 24.008586300417505], [94.68759203994074, 24.01144362012701], [94.68529523978356, 24.01137980963057], [94.68304379963172, 24.02443899006738], [94.68369360027947, 24.0458813097747], [94.67829215965548, 24.057764009701316], [94.67719595982572, 24.060176280111307], [94.71488256008212, 24.065374410101015], [94.75191935969076, 24.07187213958764], [94.77531108044207, 24.08096889000234], [94.7961036004009, 24.08941583976923], [94.84678547976614, 24.1024112097096], [94.8496445999184, 24.102983069712934], [94.85653211986153, 24.104360519922125], [94.88122308038089, 24.092014949730185], [94.89096971957696, 24.083567910031093], [94.89096971957696, 24.074471159616394], [94.89145716021983, 24.070085280211572], [94.89161952022476, 24.0686232298782], [94.86692819997648, 24.070572540090723], [94.84678547976614, 24.069922830274436], [94.83638903992232, 24.061475789676024], [94.8269764799806, 24.048533069645487], [94.81364711981877, 24.058226969898783], [94.7961036004009, 24.060176280111307], [94.78830635955092, 24.047830619987167], [94.78440756016084, 24.030936629621806], [94.78024200026817, 24.019480800098904]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
