
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ma Htu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kalewa</div><div class="name-mm">ကလေးဝ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ma Htu</div><div class="name-mm">မထု</div></div>
        <span class="pcode-badge">MMR005028031</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.33911132023132, 23.33911131013889], [94.33551023960592, 23.329895039824294], [94.32952883968426, 23.318725590413692], [94.32489096034959, 23.319077850362532], [94.3247070004278, 23.319091799746786], [94.31890884007095, 23.32427976020284], [94.31207280001979, 23.327270550095875], [94.30468740010349, 23.330505329657285], [94.29528816002062, 23.335510230412865], [94.28527836030815, 23.340698279901744], [94.28027327968817, 23.34167477996715], [94.27392576036561, 23.343505830229958], [94.2835082400133, 23.36248781975712], [94.28991695999974, 23.374877939665225], [94.29412823962662, 23.388122519838475], [94.29730235991605, 23.397094709653175], [94.30249032037204, 23.395874040054935], [94.31671139971138, 23.394287070292137], [94.32268272003154, 23.393449709736387], [94.32171648033136, 23.389282260368077], [94.32269279963305, 23.380126920021382], [94.32550043989346, 23.372070300304188], [94.33129895997905, 23.365905749850526], [94.34008800016113, 23.358886740031096], [94.34448252025214, 23.351501430046994], [94.34527595971781, 23.349914550216397], [94.33911132023132, 23.33911131013889]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
