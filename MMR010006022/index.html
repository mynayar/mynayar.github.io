
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Leik San Khun</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Leik San Khun</div><div class="name-mm">လိပ်ဆံခွန်</div></div>
        <span class="pcode-badge">MMR010006022</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.03731706592993, 21.835630398124408], [96.03839865807169, 21.831466324811117], [96.04405282797569, 21.827787198320607], [96.04761252629709, 21.825065078190846], [96.04433564317543, 21.820354558815893], [96.0363482442761, 21.815439235932047], [96.03294704966669, 21.814492068154493], [96.03270444135694, 21.818835779247877], [96.03270444135694, 21.819878747306404], [96.03249568802562, 21.824053806737822], [96.03040815830991, 21.825201948711026], [96.02675497995841, 21.827393856441347], [96.02341493205353, 21.830212022366993], [96.01558669337123, 21.833969576035145], [96.01642170489782, 21.835013340893], [96.01976175280271, 21.83824901258191], [96.02299742539094, 21.842841579575293], [96.02811187526288, 21.848477912325848], [96.03249568802562, 21.84712101702138], [96.03270444135694, 21.842110944264732], [96.0345832186407, 21.839188402123114], [96.03632926858091, 21.837888718089914], [96.03731706592993, 21.835630398124408]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
