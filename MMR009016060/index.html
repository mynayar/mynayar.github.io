
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyauk Pa Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Aunglan</div><div class="name-mm">အောင်လံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyauk Pa Taung</div><div class="name-mm">ကျောက်ပတောင်း</div></div>
        <span class="pcode-badge">MMR009016060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.41649860262845, 19.30376993663333], [95.4196888531581, 19.299572240366672], [95.42675686163989, 19.288784224912092], [95.42844554922277, 19.287022117576726], [95.42303685736516, 19.2832042176006], [95.41745685005367, 19.28171621643031], [95.41187684184285, 19.281344214563887], [95.40938558937353, 19.279787182332655], [95.40927283867063, 19.2798562133936], [95.40923150582938, 19.279690880229964], [95.40896187019422, 19.278612335890614], [95.40778483570165, 19.273904205115002], [95.39513681900905, 19.26832419690419], [95.38918481073051, 19.2701841999409], [95.38397680438607, 19.266464194766797], [95.37690879410565, 19.261628187590816], [95.37504879196825, 19.25307217614005], [95.37244478789671, 19.249724171933053], [95.36240077437628, 19.24935217096595], [95.35347276195847, 19.252700176072324], [95.35112501610666, 19.253618858723428], [95.35644876609774, 19.26497619269719], [95.36016877127184, 19.273904205115002], [95.36016877127184, 19.28580822077282], [95.35849547108916, 19.29417472258541], [95.36351677637816, 19.296224236159617], [95.38062879927975, 19.297340237262176], [95.39067281280012, 19.29882823933184], [95.39997282618504, 19.30478024671106], [95.40592483356426, 19.306640249747772], [95.4141088449473, 19.30292024457367], [95.41649860262845, 19.30376993663333]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
