
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Pang Hkun Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwegu</div><div class="name-mm">ရွှေကူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Pang Hkun Yang</div><div class="name-mm">ပန်ခွန်ယန်</div></div>
        <span class="pcode-badge">MMR001011034</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.9211447347418, 24.601385282804586], [96.92715642382996, 24.60035144016689], [96.93505666133592, 24.600328604581478], [96.93530263490874, 24.599876410168235], [96.93554846459006, 24.599424480155676], [96.9379691922245, 24.599418079680675], [96.93995663728901, 24.59591082532438], [96.93175204941758, 24.590594088246633], [96.92024477867363, 24.57333318258037], [96.91736796166214, 24.554346188326008], [96.91794332542418, 24.536509919797027], [96.92254623282247, 24.52212583204158], [96.93865641096465, 24.49738520196553], [96.94210859173819, 24.48472720459688], [96.94325326232826, 24.48014852313588], [96.9340535026671, 24.481275023823343], [96.89607951235968, 24.488754750031717], [96.81552862344728, 24.507166381423417], [96.80632280685211, 24.528454830725934], [96.79884308244237, 24.54341428134404], [96.79838955973048, 24.54976358672019], [96.79826771868034, 24.55146937041519], [96.80747353437619, 24.56470273064656], [96.8132271692985, 24.565278094408598], [96.82185762213163, 24.5664288210333], [96.84774897883239, 24.5819636354135], [96.86846206527213, 24.586566542811738], [96.88423988006645, 24.591683672663407], [96.88975051367532, 24.59347090525813], [96.9211447347418, 24.601385282804586]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
