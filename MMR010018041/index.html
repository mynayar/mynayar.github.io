
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Mye</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Mye</div><div class="name-mm">ကန်မြဲ</div></div>
        <span class="pcode-badge">MMR010018041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3143632147906, 21.255898707159645], [95.32226109877075, 21.25423599469542], [95.32828843066659, 21.255690868438876], [95.3374333487701, 21.255483028818787], [95.34020480300933, 21.255483028818787], [95.34020480300933, 21.24810794142843], [95.33513992466783, 21.237134038804925], [95.3269798451438, 21.225034608560406], [95.3236032595828, 21.218281439237103], [95.31685009025949, 21.205619244732418], [95.31232414594263, 21.200363310818204], [95.3104608046225, 21.200363310818204], [95.301952657789, 21.196495970612602], [95.28648329876529, 21.189148025660927], [95.27526801360801, 21.186827621897294], [95.2655996648927, 21.185280686354645], [95.26095885826476, 21.186827621897294], [95.25295973760188, 21.18571569202561], [95.24326916124284, 21.183382775994346], [95.24380752689592, 21.190560980205134], [95.24734871267299, 21.198866075409114], [95.25550879399572, 21.203649570271523], [95.26057367143784, 21.209558593654208], [95.2647944029394, 21.214623471995708], [95.27379863020269, 21.220251113697998], [95.27970765268606, 21.224753226879955], [95.2861794421276, 21.228973959280836], [95.29349537571107, 21.23403883582364], [95.30418789485554, 21.24079200604632], [95.30869000893682, 21.246138266068158], [95.31094106597749, 21.251203144409658], [95.3143632147906, 21.255898707159645]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
