
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shaung Ti Lin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kunlong</div><div class="name-mm">ကွမ်းလုံ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shaung Ti Lin</div><div class="name-mm">ရှောင်တိလင်</div></div>
        <span class="pcode-badge">MMR015020008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.65529936927055, 23.45937688473549], [98.65524180366634, 23.461564346217642], [98.65592084487116, 23.469486486712015], [98.66769088312782, 23.485104421831636], [98.66816861019328, 23.486632414954045], [98.66856266613422, 23.486654317043133], [98.67598448409672, 23.493686152993632], [98.68379701881742, 23.49759281155906], [98.6931721435796, 23.49915561923649], [98.69914360509335, 23.502141649017915], [98.70843332303946, 23.494158297967147], [98.72061200873725, 23.482946173926848], [98.71024409808672, 23.479672096689967], [98.69213634671507, 23.471976302964038], [98.69146891395928, 23.470140862211053], [98.69009922489937, 23.469712834379834], [98.67832918664271, 23.463375121264903], [98.66588010808056, 23.457716449354677], [98.65773161991837, 23.45930087673412], [98.65529936927055, 23.45937688473549]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
