
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Shan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Shan Kone</div><div class="name-mm">ရှမ်းကုန်း</div></div>
        <span class="pcode-badge">MMR009006040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.3641264052095, 20.6147027007691], [95.36265385259327, 20.60999053383614], [95.35853557365783, 20.611363293181512], [95.34769953620469, 20.611750294840306], [95.3357024937751, 20.61639431114861], [95.32989747428906, 20.616781311908085], [95.32254444816783, 20.613685301335636], [95.32602746129834, 20.606332276113676], [95.32409245390369, 20.600914257387103], [95.31635242702293, 20.597044244396386], [95.31519142294587, 20.587369210120983], [95.31557842370535, 20.58001618399976], [95.31546785205978, 20.579795040708632], [95.31480442128708, 20.580403185658554], [95.30667739274753, 20.57692017342731], [95.30500391539846, 20.57877959370336], [95.30319438141561, 20.580790187317348], [95.30048537160269, 20.59859224923298], [95.2908103382266, 20.60904128502733], [95.28763671616156, 20.611862282018762], [95.29700235937145, 20.623850306046847], [95.3097734042193, 20.63004232719169], [95.31906143593659, 20.635847347577055], [95.33260648320271, 20.63236433534587], [95.35053409856982, 20.629582464259386], [95.35582656384491, 20.624134338029307], [95.3641264052095, 20.6147027007691]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
