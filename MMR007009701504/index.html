
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyet Ti Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (East)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အရှေ့)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungoo</div><div class="name-mm">တောင်ငူ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Kyet Ti Ward</div><div class="name-mm">ကြက်တည်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR007009701504</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.43404486657738, 18.943512702649173], [96.43404486657738, 18.943512702649173], [96.43297267235101, 18.9435162055085], [96.43168381705459, 18.94346716277937], [96.43019311147033, 18.943465412322603], [96.43017830068811, 18.944236074135574], [96.43018200409625, 18.94565478344157], [96.430163486156, 18.9463588788592], [96.4301540378786, 18.946703824621864], [96.43048384805121, 18.946672393316362], [96.43116716373368, 18.94666538759759], [96.43145604486062, 18.946688156633172], [96.43197640158974, 18.94667064143698], [96.43285786040201, 18.946642618562066], [96.43321340647361, 18.94663386096397], [96.43364302520553, 18.946646121421395], [96.43391336860714, 18.946648123312286], [96.43394486916043, 18.946234524203987], [96.43396507376721, 18.94588917355237], [96.43396338710068, 18.945572463098756], [96.43398931185732, 18.945082046599225], [96.43400042298117, 18.944497047500818], [96.43400042298117, 18.943978602730397], [96.43404486657738, 18.943512702649173], [96.43404486657738, 18.943512702649173]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
