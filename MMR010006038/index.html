
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ta Moke Soe</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Amarapura</div><div class="name-mm">အမရပူရ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ta Moke Soe</div><div class="name-mm">တမုတ်ဆိုး</div></div>
        <span class="pcode-badge">MMR010006038</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16471332456035, 21.858801294843943], [96.17027268793424, 21.858498056939823], [96.17208048892348, 21.858498056939823], [96.17225584143398, 21.85661927965606], [96.17246459386598, 21.84931292385238], [96.17559589023818, 21.84628600459547], [96.17361273583913, 21.843572214885853], [96.16808078110324, 21.841067179406878], [96.16411447320445, 21.838770896359847], [96.15628623542148, 21.837205247724057], [96.15242430373871, 21.836265859082175], [96.14866674917118, 21.833865199819172], [96.1480404900766, 21.834804587561734], [96.14574420702957, 21.836161482866203], [96.14209102867807, 21.83730962483935], [96.1404210038263, 21.839188402123114], [96.13958599229977, 21.842528450028], [96.13969036941506, 21.84649475792679], [96.13958599229977, 21.84785165323126], [96.14939738538106, 21.849521677183702], [96.1576431289273, 21.849626053399675], [96.16474073229904, 21.85077419537288], [96.16494948473098, 21.855888644345498], [96.16471332456035, 21.858801294843943]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
