
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ngar Pin Sin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungtha</div><div class="name-mm">တောင်သာ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ngar Pin Sin</div><div class="name-mm">ငါးပင်စင်</div></div>
        <span class="pcode-badge">MMR010018054</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.24781748788683, 21.400423621652862], [95.24970120244859, 21.397746768898344], [95.25895084210771, 21.38460256475662], [95.25599730123452, 21.376247288281775], [95.25365671668419, 21.36734271399513], [95.25367421389393, 21.364390689378865], [95.24646905340416, 21.3589868178874], [95.2453606533715, 21.358155517862883], [95.23968295900141, 21.355203117330063], [95.23496870024536, 21.35275170212941], [95.22623945958344, 21.346724370233574], [95.21917293318438, 21.34069703833768], [95.20732610721416, 21.332591314737442], [95.20192229237995, 21.331136441893307], [95.18709266969103, 21.32682531773429], [95.17435878033348, 21.325327212680747], [95.18453635576827, 21.34504808430171], [95.18701580643437, 21.347101938004073], [95.21354024988267, 21.369073472762636], [95.22789568164046, 21.381965126589364], [95.23355273836825, 21.389806838015204], [95.23384068240165, 21.390253513289053], [95.23756354472187, 21.396028630317062], [95.24781748788683, 21.400423621652862]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
