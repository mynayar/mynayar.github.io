
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyay Thee Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyay Thee Kone</div><div class="name-mm">ကျေးသီးကုန်း</div></div>
        <span class="pcode-badge">MMR005006018</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.68132020016714, 22.42879091966529], [95.68073087982629, 22.429169820231095], [95.67995111994827, 22.43423699993764], [95.67988884009793, 22.43464227042449], [95.68409867991022, 22.43800997967685], [95.68578239963807, 22.441377599896384], [95.68241459955419, 22.44811293026754], [95.68157291955464, 22.453164450079385], [95.68367747973195, 22.45863690027278], [95.68451952035963, 22.464109349566854], [95.68536156008798, 22.467056040304044], [95.68662444026575, 22.466214089608627], [95.69251764007709, 22.466214089608627], [95.69588544016102, 22.464951300262328], [95.70346272032833, 22.46284647028841], [95.70430440032789, 22.462939979996122], [95.70430440032789, 22.46284647028841], [95.70867011963037, 22.459488300144983], [95.70809303996191, 22.45400630994328], [95.70514644005624, 22.447691999885933], [95.70767220041176, 22.44053565010023], [95.70514644005624, 22.432537530382774], [95.70660264029965, 22.43149721982087], [95.70304152015007, 22.43127465020501], [95.69883204006663, 22.429169820231095], [95.69546423998275, 22.424539319833798], [95.69488895985768, 22.424594039982992], [95.68662444026575, 22.42538117969775], [95.68132020016714, 22.42879091966529]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
