
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyi Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kanbalu</div><div class="name-mm">ကန့်ဘလူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyi Kone</div><div class="name-mm">ကျီကုန်း</div></div>
        <span class="pcode-badge">MMR005007059</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.5101679202134, 22.962417120353848], [95.51069999960538, 22.962417120353848], [95.5108483202938, 22.962314880027748], [95.5202569196212, 22.95582615005685], [95.52546036010762, 22.949582040179052], [95.5270900800432, 22.947300360323425], [95.52892932043187, 22.944725550044154], [95.5310860799587, 22.93917957038093], [95.52476664016837, 22.934665620322164], [95.52174156002502, 22.93239689969721], [95.51921616029762, 22.93050285012646], [95.51470643975046, 22.92391187982946], [95.51089079977066, 22.917320910431727], [95.50742184034573, 22.909689269843966], [95.50152467992012, 22.90309830044623], [95.49770868021147, 22.905179640128324], [95.49636263972411, 22.90921802958843], [95.49501615497161, 22.912796528237266], [95.49637386775987, 22.917798098803246], [95.49440874206982, 22.920041794892995], [95.4934133796238, 22.922745751415334], [95.49194097809374, 22.924089307975237], [95.4894695017162, 22.928589928282634], [95.48945740583468, 22.93039478489146], [95.4864990805682, 22.934071691855138], [95.48804304025418, 22.93468137014918], [95.49423971988722, 22.936746960004257], [95.50187135957566, 22.939869059909256], [95.50776887973007, 22.94750069959764], [95.50950335989222, 22.95443853031395], [95.5101679202134, 22.962417120353848]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
