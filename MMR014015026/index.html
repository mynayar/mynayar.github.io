
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Long Yang</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyethi</div><div class="name-mm">ကျေးသီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Long Yang</div><div class="name-mm">လုံယန်း</div></div>
        <span class="pcode-badge">MMR014015026</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.17190180132712, 21.47489503327921], [98.17170861885774, 21.474370681761627], [98.17197872483837, 21.47367612275491], [98.16582691597944, 21.482391184705477], [98.15941051308477, 21.481856484689047], [98.13695310340307, 21.475974781810805], [98.1310714014241, 21.463141976920724], [98.13160610144047, 21.454052073044807], [98.13001971803561, 21.411219748992266], [98.10433638891328, 21.40165144895525], [98.08080957829947, 21.398977947973947], [98.04926226384248, 21.407533151833547], [98.04353548897171, 21.411575581947602], [98.0446790596909, 21.412618040090535], [98.0457300488028, 21.41464088696739], [98.05140106480735, 21.415018954761024], [98.07813607731816, 21.428921160583172], [98.08722598119414, 21.441753967271836], [98.09524648503731, 21.4663501779184], [98.09524648503731, 21.4765094827265], [98.08883008214264, 21.50057099335669], [98.08776068121051, 21.516612000143766], [98.09631588507011, 21.53318770784648], [98.09788629471677, 21.531709674761714], [98.10540578894609, 21.524632503986936], [98.13214080055758, 21.520354902057136], [98.16475751594669, 21.521959003005634], [98.16689631691156, 21.520313770664018], [98.16689631691156, 21.515007900094588], [98.17063921792561, 21.48078708375698], [98.17190180132712, 21.47489503327921]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
