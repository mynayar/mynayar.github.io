
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Lu Lin Kyaw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Lu Lin Kyaw</div><div class="name-mm">လုလင်ကျော်</div></div>
        <span class="pcode-badge">MMR008008041</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.51424210359028, 17.759537941323003], [95.51456149421762, 17.75889916186685], [95.5103029642105, 17.75570526368699], [95.50444748556305, 17.75038210185255], [95.49772638336594, 17.744614529237197], [95.49394740784663, 17.7474487597525], [95.49055179083251, 17.74575095124544], [95.4867065253859, 17.744286087832734], [95.48262252141228, 17.74984978593892], [95.4807594139159, 17.75304368321946], [95.4807594139159, 17.753842157989254], [95.4772993577792, 17.758633003910063], [95.4725085118584, 17.763423849830872], [95.467237561964, 17.769816129310982], [95.47344760822062, 17.7737157713658], [95.48594772780547, 17.78113831508125], [95.48769217065723, 17.783956490899413], [95.49992279759908, 17.777530229636454], [95.50444748556305, 17.775400965082497], [95.51216607080755, 17.76369000778766], [95.51424210359028, 17.759537941323003]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
