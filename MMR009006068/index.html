
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ku Lar Shin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natmauk</div><div class="name-mm">နတ်မောက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ku Lar Shin</div><div class="name-mm">ကုလားရှင်</div></div>
        <span class="pcode-badge">MMR009006068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.50775824794482, 20.36961174328735], [95.50800952841706, 20.37195702589605], [95.52503705821374, 20.374794948128397], [95.53817127628344, 20.368001386654726], [95.54498818056015, 20.369023923015675], [95.54657700922166, 20.36355129295788], [95.54361027889132, 20.358112290349993], [95.54106395733584, 20.35693706439406], [95.53718236557376, 20.35514556001965], [95.53679847197196, 20.35053883859655], [95.53668791111824, 20.349212102056924], [95.54014909500478, 20.340311913763856], [95.54216517268463, 20.337287795895122], [95.53929843257669, 20.337225954913947], [95.53759574974413, 20.333607756592755], [95.53248770304509, 20.33041522718105], [95.5301465150497, 20.32615852189832], [95.52993368059492, 20.323178828740026], [95.53139614641509, 20.318376370772967], [95.53054425911034, 20.317867536157905], [95.52758149479018, 20.31609846357327], [95.51886624488134, 20.31445258102184], [95.51993042075236, 20.308706030059284], [95.51801490256577, 20.30487499458536], [95.5182277397185, 20.300618289302633], [95.51812746081373, 20.300583908220858], [95.51592080600045, 20.309655711441962], [95.5099873471384, 20.322511538077094], [95.50306497936538, 20.324983813052597], [95.5005927052892, 20.35514556001965], [95.50652616325192, 20.358112290349993], [95.50775824794482, 20.36961174328735]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
