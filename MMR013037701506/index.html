
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Super Pin (North) Ward (Saw Yan Paing_North Ward)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ahlone</div><div class="name-mm">အလုံ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Super Pin (North) Ward (Saw Yan Paing_North Ward)</div><div class="name-mm">ဆူပါပင် (မြောက်) ရပ်ကွက် (စောရန်ပိုင်(မြောက်))</div></div>
        <span class="pcode-badge">MMR013037701506</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.1258522924494, 16.789988737790054], [96.12583446518846, 16.790364743438204], [96.12589073217163, 16.790862083818183], [96.12595081317954, 16.791219710920984], [96.12606143968378, 16.791620254571114], [96.12616348305835, 16.7918910979958], [96.12633132982705, 16.792203903787197], [96.12649154674756, 16.792470932287756], [96.12671089139457, 16.79277610823084], [96.12690883217692, 16.79302109614673], [96.12708139409114, 16.792757987790935], [96.12732696566701, 16.7922554016655], [96.12780189494157, 16.79125022941463], [96.12791681301059, 16.79098653829817], [96.12739372234245, 16.790742874184332], [96.12713050876602, 16.790620803807087], [96.12667083738927, 16.79041099557105], [96.1258522924494, 16.789988737790054]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
