
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Thin Tee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Thin Tee</div><div class="name-mm">သင်းတီး</div></div>
        <span class="pcode-badge">MMR010019058</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.78295271769383, 21.511342023315763], [95.77504736574338, 21.501897423227547], [95.75554399426, 21.487334904582212], [95.74540224062099, 21.487334904582212], [95.72875936255457, 21.491495625222967], [95.72043792397108, 21.496176433695496], [95.71055621559691, 21.503197647753268], [95.71185644102201, 21.50891863728532], [95.71315666464841, 21.51593985134309], [95.71913770034467, 21.521400794710985], [95.73031963324456, 21.524781379557055], [95.73838102656316, 21.53284277377503], [95.7425417463046, 21.537783628411773], [95.75008304999284, 21.537783628411773], [95.76398183119659, 21.541035586822943], [95.76563147291421, 21.53608665897218], [95.76851834704416, 21.529488090303175], [95.77223004338185, 21.524539163351733], [95.77552932771636, 21.52288951983553], [95.77759138143716, 21.519177825296424], [95.77882861205086, 21.51422889834504], [95.78295271769383, 21.511342023315763]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
