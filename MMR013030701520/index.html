
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ba Yint Naung Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Dala</div><div class="name-mm">ဒလ</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">Ba Yint Naung Ward</div><div class="name-mm">ဘုရင့်နောင်ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013030701520</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.14640318615818, 16.75679587532943], [96.14704895064864, 16.756641387989703], [96.1473636630027, 16.75656700056669], [96.1478852356152, 16.756426550744777], [96.14759063659864, 16.755829810997056], [96.14732170063604, 16.75512313902169], [96.14708391808841, 16.75439135257892], [96.1470708851133, 16.753911971660216], [96.14711316404134, 16.753619512130854], [96.14722061144215, 16.753133773904608], [96.14732265481672, 16.75271034340767], [96.14763259896534, 16.751789093192144], [96.14779090842376, 16.751350402998753], [96.14791882799159, 16.751028569812718], [96.14624010399768, 16.749896933996354], [96.14604123421566, 16.750299452557726], [96.14562034610213, 16.75135230956147], [96.1450252530131, 16.752883275842578], [96.14484786983337, 16.753421783588465], [96.14482584903374, 16.753833598441872], [96.14495277395139, 16.75462913512655], [96.14529345602824, 16.756915019312714], [96.14597320589877, 16.75683021504244], [96.14640318615818, 16.75679587532943]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
