
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kan Pyin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Rakhine</div><div class="name-mm">ရခိုင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Rathedaung</div><div class="name-mm">ရသေ့တောင်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kan Pyin</div><div class="name-mm">ကံပြင်</div></div>
        <span class="pcode-badge">MMR012008080</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[92.76562543636487, 20.35528476158254], [92.76575973212601, 20.36152952167015], [92.7668391434118, 20.3683437441685], [92.76693400569985, 20.372736647278487], [92.76732477282007, 20.37623638510115], [92.76779019985787, 20.376159718796032], [92.76923188774151, 20.376044449092092], [92.77491245724417, 20.375590141272028], [92.77822858138398, 20.374899693965745], [92.77970426723817, 20.37328061390923], [92.78228315234566, 20.372936503616813], [92.78756224290322, 20.373290356264988], [92.78830390300277, 20.3733529742604], [92.78854969491255, 20.36947074218108], [92.7895839422452, 20.361748422951393], [92.78985679655398, 20.35971098187639], [92.78988541837742, 20.35949726518669], [92.78288817934606, 20.359104197600686], [92.78217986520866, 20.359042506806304], [92.77653396367157, 20.35799333162703], [92.77395666316954, 20.357411104239134], [92.77137938335193, 20.356828837281057], [92.76562543636487, 20.35528476158254]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
