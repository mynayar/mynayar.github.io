
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sat Pan Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myinmu</div><div class="name-mm">မြင်းမူ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sat Pan Kone</div><div class="name-mm">ဆပ်ပန်းကုန်း</div></div>
        <span class="pcode-badge">MMR005002002</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.48465687961135, 21.902292179840288], [95.49018647992216, 21.905140769830723], [95.50041012043079, 21.91035698968335], [95.50833912005442, 21.917659769782574], [95.51543292019318, 21.924545129554133], [95.52377916028007, 21.928092210387263], [95.53024727958837, 21.92892678034667], [95.53137948017894, 21.92968161011828], [95.53181544003058, 21.92645538041154], [95.53207355984699, 21.924545129554133], [95.53295951976611, 21.924545129554133], [95.53859315994646, 21.924545129554133], [95.54422680012681, 21.922667280370717], [95.54457747726883, 21.92252381242406], [95.54534391908663, 21.911140474553292], [95.54208032434752, 21.910948498974108], [95.53575996634942, 21.907847945026674], [95.53508953795188, 21.90791490674758], [95.53238102996062, 21.907675170872494], [95.53164454006355, 21.907609982614645], [95.53115962291832, 21.90760320982031], [95.52889428644221, 21.907571571670758], [95.5270797423363, 21.907228043239627], [95.526296340204, 21.90707972884644], [95.52580571686042, 21.90702588014028], [95.52372136175148, 21.906797110598234], [95.51501243137864, 21.902548117002027], [95.50381192478056, 21.89601448927732], [95.49464972440529, 21.8867475475613], [95.48490635964083, 21.90190374016555], [95.48465687961135, 21.902292179840288]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
