
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Oke Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Thazi</div><div class="name-mm">သာစည်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Oke Kone</div><div class="name-mm">အုပ်ကုန်း</div></div>
        <span class="pcode-badge">MMR010030056</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.11655524772658, 20.746798393730955], [96.11689021281313, 20.74668673930165], [96.11783420778255, 20.755182688630214], [96.11689021281313, 20.759902660779233], [96.11783420778255, 20.762734644788054], [96.11814887337187, 20.77028660004663], [96.11972219682201, 20.774377242815547], [96.12412750428098, 20.78035587462398], [96.12418303292071, 20.78129986869402], [96.1279034823599, 20.78129986869402], [96.13199412512881, 20.78129986869402], [96.13545543761842, 20.780041209933927], [96.13954608038733, 20.780041209933927], [96.13765809134787, 20.77595056716501], [96.13765809134787, 20.773433248745505], [96.13514077292837, 20.769027941286538], [96.13514077292837, 20.76577023530814], [96.13514077292837, 20.764622633827514], [96.13482610823837, 20.758329337329087], [96.13388211416827, 20.75298003490076], [96.134196777959, 20.74920405682184], [96.13356744857896, 20.741337436873266], [96.13199412512881, 20.741966767152633], [96.12853281173994, 20.74354009060272], [96.12475683366102, 20.74354009060272], [96.12192484965215, 20.741966767152633], [96.1172048784025, 20.743225425912726], [96.11655524772658, 20.746798393730955]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
