
<!DOCTYPE html>
<html>
<head>
    <title>Map View - No (10) Ward</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Yangon</div><div class="name-mm">ရန်ကုန်တိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Botahtaung</div><div class="name-mm">ဗိုလ်တထောင်</div></div><div class="label-group"><div class="lvl">Ward</div><div class="name">No (10) Ward</div><div class="name-mm">အမှတ် (၁၀) ရပ်ကွက်</div></div>
        <span class="pcode-badge">MMR013017701510</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: wd_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.16746388934706, 16.779315801383177], [96.16744110862032, 16.77899117939944], [96.16787338305022, 16.778959274151248], [96.16852378894174, 16.778921127607987], [96.16934013324061, 16.77889061001372], [96.17014980367054, 16.77885150928978], [96.17008018535233, 16.77692985502881], [96.17006450297447, 16.776542451373075], [96.16935157801299, 16.776559829872326], [96.1689510343628, 16.776571273745333], [96.16842460631057, 16.776590346567275], [96.16783905143114, 16.776601791339658], [96.16732215889056, 16.776601791339658], [96.16573333742366, 16.776632308933983], [96.16458771175354, 16.776691159669326], [96.16468646360948, 16.779093855896804], [96.16512794439916, 16.779663467595014], [96.16591199224473, 16.78016916897201], [96.16693019926936, 16.780598958575126], [96.16747908159442, 16.780703805136568], [96.16748237581106, 16.780208588055928], [96.16746388934706, 16.779315801383177]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
