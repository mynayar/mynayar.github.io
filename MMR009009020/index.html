
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Goke Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Ngape</div><div class="name-mm">ငဖဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Goke Gyi</div><div class="name-mm">ဂုတ်ကြီး</div></div>
        <span class="pcode-badge">MMR009009020</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[94.47838049686248, 19.859357383836254], [94.47188369187893, 19.857408341621692], [94.44193000486587, 19.85171714123311], [94.44213962514362, 19.852267392326326], [94.42818561657299, 19.861447660081524], [94.41937255999568, 19.870995138115177], [94.4148403851757, 19.875191596914703], [94.41529152918076, 19.875383888155966], [94.41533324243522, 19.87540166685352], [94.41570045271379, 19.87540166685352], [94.4168649983211, 19.87610923905021], [94.41716929562654, 19.876136089209183], [94.43920193931808, 19.879440985313295], [94.45315594609008, 19.881644248783118], [94.45829689628482, 19.88201145996095], [94.46417226703653, 19.88384751405158], [94.47004763868762, 19.888621253068436], [94.47629022061727, 19.895231046175866], [94.47827315917903, 19.895892025396677], [94.4829000137247, 19.894129414440954], [94.48280367564917, 19.893223839408734], [94.47922790734214, 19.859611605990892], [94.47838049686248, 19.859357383836254]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
