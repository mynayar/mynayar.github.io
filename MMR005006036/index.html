
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kywe Zin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Wetlet</div><div class="name-mm">ဝက်လက်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kywe Zin</div><div class="name-mm">ကျွဲဇင်</div></div>
        <span class="pcode-badge">MMR005006036</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.64159455984111, 22.437832680134136], [95.63989787998321, 22.433379390246728], [95.63842979969559, 22.43294756997443], [95.63274179999411, 22.43127465020501], [95.62390163964903, 22.430011770027193], [95.61506148020322, 22.43464227042449], [95.60790503958594, 22.436747100398406], [95.6018963533341, 22.43274124930923], [95.60192828736064, 22.43290081062395], [95.60202406965516, 22.433379390246728], [95.59697254984337, 22.437168029880752], [95.59697254984337, 22.44685005008978], [95.59574524414774, 22.45329333372041], [95.59546810996534, 22.454748270416417], [95.59725725182079, 22.454967811115637], [95.59883700002757, 22.455160109551457], [95.59923897629778, 22.455350028381133], [95.5994520823478, 22.455450711980802], [95.60077464873109, 22.45607557083099], [95.61169368011929, 22.4552691901211], [95.61674519993107, 22.457374020095017], [95.61506148020322, 22.459899779551222], [95.61590316020272, 22.466214089608627], [95.62474331964853, 22.467897990100198], [95.63063688008799, 22.467897990100198], [95.63434704038366, 22.470866099990587], [95.63905584025485, 22.465372229744673], [95.64663312042222, 22.463162189883235], [95.64663312042222, 22.457374020095017], [95.64663312042222, 22.44937581044536], [95.64326568006715, 22.44221954969254], [95.64159455984111, 22.437832680134136]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
