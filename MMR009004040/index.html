
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Koe Pin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Taungdwingyi</div><div class="name-mm">တောင်တွင်းကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Koe Pin</div><div class="name-mm">ကိုးပင်</div></div>
        <span class="pcode-badge">MMR009004040</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.43489547974264, 19.958996144856258], [95.43685829507433, 19.95805399439638], [95.4452804487338, 19.958530719617045], [95.44766407843451, 19.957259452361882], [95.45100115767735, 19.94994965665137], [95.45513277985395, 19.949314023023817], [95.45668006523289, 19.950271865754075], [95.45735750024852, 19.948837296903775], [95.46037676267753, 19.944705674727174], [95.4642988356228, 19.941873066588812], [95.46482620256728, 19.938826058275993], [95.46323711669964, 19.93072171963172], [95.46301216657827, 19.930153423641627], [95.4611880572831, 19.932060448630864], [95.45306568723174, 19.93348186309754], [95.44474025835632, 19.93348186309754], [95.43154140780979, 19.932263508354254], [95.4287533314012, 19.931551658082583], [95.43193212906459, 19.93803151534223], [95.43399794105221, 19.942798772045762], [95.43431575786599, 19.94836057168311], [95.43336230562596, 19.952333286352143], [95.43272667199835, 19.95535254878115], [95.43489547974264, 19.958996144856258]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
