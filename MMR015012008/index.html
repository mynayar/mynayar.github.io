
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Man Kyawng (Kyaukme Gyi)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (North)</div><div class="name-mm">ရှမ်းပြည်နယ် (မြောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kyaukme</div><div class="name-mm">ကျောက်မဲ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Man Kyawng (Kyaukme Gyi)</div><div class="name-mm">မန်ကျောင်း (ကျောက်မဲကြီး)</div></div>
        <span class="pcode-badge">MMR015012008</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.93269391479237, 22.5671813804164], [96.96000087633945, 22.569420242650153], [96.9736936336543, 22.570140915271054], [96.98059690882036, 22.570671936160977], [96.98162102079351, 22.564015207435943], [96.99135008633749, 22.538431369412194], [96.99783613003342, 22.51861290156421], [97.00001068624425, 22.51625713286046], [97.00193690006796, 22.514170400843398], [97.00019561563522, 22.505391632717703], [96.99852563215228, 22.50632207670253], [96.99749943824855, 22.506893828787213], [96.98810706538882, 22.512126857868225], [96.97153162028809, 22.51392853717232], [96.95243382506106, 22.522216260172343], [96.94198408779545, 22.530143646412228], [96.93117401466912, 22.531945324816945], [96.91315722792376, 22.540593382778468], [96.9048695049238, 22.549601776600753], [96.89821676379268, 22.560154400805004], [96.92108461416365, 22.564015207435943], [96.93269391479237, 22.5671813804164]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
