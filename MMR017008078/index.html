
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Gant Gaw Taw</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Gant Gaw Taw</div><div class="name-mm">ဂန့်ဂေါ်တော</div></div>
        <span class="pcode-badge">MMR017008078</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.38897572015344, 17.591101020395797], [95.38838964006987, 17.587659330213967], [95.38821288012036, 17.586621089891423], [95.38344719992841, 17.585953919737676], [95.38305443991055, 17.58594419986497], [95.37572628004386, 17.58576321040391], [95.37279443981163, 17.58538817962085], [95.37132204008014, 17.586584550436726], [95.36974631993678, 17.587267289653767], [95.36749416032728, 17.58824334005817], [95.36445161984642, 17.590438440381774], [95.36484671990024, 17.590530600207103], [95.36679972003111, 17.590986360432225], [95.36721083970855, 17.591082210175898], [95.36762159965718, 17.59117814985177], [95.37144984003817, 17.5946232601554], [95.37313644029456, 17.596446839749888], [95.37617087968243, 17.59972725001262], [95.37885036025597, 17.604831239869895], [95.38048079964926, 17.608121280073078], [95.38116443998695, 17.60950026002905], [95.38293348019602, 17.607127950094878], [95.38354944025451, 17.605659779874998], [95.38525800015663, 17.601585930146598], [95.38640207989215, 17.597487330176193], [95.38783164041791, 17.593388640273588], [95.38897572015344, 17.591101020395797]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
