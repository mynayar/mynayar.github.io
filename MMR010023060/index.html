
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Inn Kone</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Yamethin</div><div class="name-mm">ရမည်းသင်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Inn Kone</div><div class="name-mm">အင်းကုန်း</div></div>
        <span class="pcode-badge">MMR010023060</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.13991900226023, 20.368097260680088], [96.13223647173584, 20.36647988573816], [96.12536262778309, 20.362032105996946], [96.11848878472966, 20.359201699398966], [96.10999756673436, 20.357584325356356], [96.10433675443772, 20.354349574573234], [96.09544119225728, 20.35273219963136], [96.08573694260588, 20.351923512160397], [96.07845875626663, 20.350710481403667], [96.07118056902812, 20.347475730620545], [96.06794581914431, 20.345858355678615], [96.06268935103276, 20.347071388234042], [96.05581550708007, 20.347071388234042], [96.05541116379425, 20.34685958889895], [96.05541116379425, 20.350306137218524], [96.05541116379425, 20.35798866774286], [96.05419813213814, 20.36647988573816], [96.06309369431858, 20.36971463562196], [96.07037188065783, 20.375375447918657], [96.07401097472678, 20.379418886172687], [96.07684138132475, 20.379418886172687], [96.08290653690722, 20.379418886172687], [96.09382381821467, 20.379418886172687], [96.10595412937965, 20.379418886172687], [96.12374525284122, 20.382249291871346], [96.13223647173584, 20.387101416697078], [96.13649181634429, 20.377899503159597], [96.13991900226023, 20.368097260680088]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
