
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mai Taung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Injangyang</div><div class="name-mm">အင်ဂျန်းယန်</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mai Taung</div><div class="name-mm">မိုင်တောင်</div></div>
        <span class="pcode-badge">MMR001003013</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[97.91996127529268, 25.894882556784637], [97.91528050728965, 25.855564107897294], [97.90979603585845, 25.856342132983116], [97.90321413612355, 25.856497001635375], [97.89941986493488, 25.857193908771933], [97.8939220430679, 25.85549035809362], [97.88563659355401, 25.853631939662364], [97.87557015903565, 25.850069970552738], [97.86581346182186, 25.848521288526683], [97.85874473927834, 25.847446184993487], [97.85688459774605, 25.84708541386084], [97.85723898728946, 25.85275564835456], [97.84226053129856, 25.847138726571018], [97.82447361306686, 25.848074880351476], [97.81698438462172, 25.858372569238725], [97.8094951570759, 25.86960641190643], [97.80481438907287, 25.88364871501625], [97.79919746818865, 25.892074097241846], [97.80294208241122, 25.896754864345553], [97.81043130995704, 25.906116400351664], [97.84413283796016, 25.898627171906526], [97.88813205395121, 25.894882556784637], [97.91996127529268, 25.894882556784637]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
