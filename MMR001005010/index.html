
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Bant Li</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Kachin</div><div class="name-mm">ကချင်ပြည်နယ်</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Chipwi</div><div class="name-mm">ချီ​ဖွေ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Bant Li</div><div class="name-mm">ဘန့်လီ</div></div>
        <span class="pcode-badge">MMR001005010</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[98.09171104412945, 25.857583999601957], [98.10747598872598, 25.845508699966558], [98.12743702160134, 25.830800571189457], [98.13803863907202, 25.820640688117294], [98.14004398873914, 25.818718893562163], [98.14056928004828, 25.810314248803593], [98.16420734399378, 25.80926366798394], [98.15895444079484, 25.804010764785005], [98.13741753758933, 25.7872014743686], [98.12481056955221, 25.77354392641115], [98.1095771512646, 25.773018636001325], [98.08646437593029, 25.773018636001325], [98.07175624715313, 25.784575023218792], [98.06662081160124, 25.790106867338125], [98.0585176591627, 25.79883551174953], [98.05614447059088, 25.801480612140608], [98.05717989513613, 25.80303374760939], [98.05854808502619, 25.80987470515356], [98.05870045985841, 25.810636581113386], [98.06250187706001, 25.813424287001283], [98.06858414404309, 25.823054543132685], [98.0723855639427, 25.83015052412742], [98.07998839744664, 25.836993074370923], [98.08399508040867, 25.839074468012313], [98.08571815536862, 25.839307785426], [98.08511161840653, 25.84116172793142], [98.08425712576582, 25.84440040605392], [98.08377647410504, 25.84856605497953], [98.0843944549402, 25.85088157722305], [98.08611869811949, 25.85365486068332], [98.08894920274355, 25.85608100943108], [98.09171104412945, 25.857583999601957]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
