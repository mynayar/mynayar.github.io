
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Mon Taw Gyi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Myittha</div><div class="name-mm">မြစ်သား</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Mon Taw Gyi</div><div class="name-mm">မုန္တောကြီး</div></div>
        <span class="pcode-badge">MMR010015068</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.2114951922494, 21.434067893418614], [96.21502505286395, 21.434381047247598], [96.21872862292764, 21.43377921014246], [96.22052020014718, 21.43030802669415], [96.22226151066025, 21.428095869828553], [96.22625521190855, 21.42671343377799], [96.22855926779602, 21.428095869828553], [96.2316313456102, 21.429478303181213], [96.23332098827302, 21.429017493262734], [96.23439621411404, 21.428710283053192], [96.23470342432364, 21.431167944944775], [96.2353178366489, 21.43301119091376], [96.23792910184665, 21.43393281434794], [96.23858977979455, 21.43376231727717], [96.23646544082749, 21.430473099054325], [96.23450890995827, 21.427375260160204], [96.23287846786707, 21.42346219932108], [96.23271542437737, 21.42036435862832], [96.23450890995827, 21.41808173988045], [96.23124802577581, 21.416777386567162], [96.22668278917945, 21.4177556520018], [96.21885666660194, 21.421994800719517], [96.21592187209677, 21.42166871284087], [96.2100522812878, 21.420690447406287], [96.2035305129229, 21.421994800719517], [96.20450877835748, 21.430147011175677], [96.20548981010671, 21.433375274249556], [96.20604591578643, 21.435205241728568], [96.20644031706706, 21.43500804288692], [96.20997320479961, 21.43393281434794], [96.2114951922494, 21.434067893418614]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
