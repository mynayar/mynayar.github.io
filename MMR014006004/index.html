
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Yae Hpyu</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Shan (South)</div><div class="name-mm">ရှမ်းပြည်နယ် (တောင်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Pindaya</div><div class="name-mm">ပင်းတယ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Yae Hpyu</div><div class="name-mm">ရေဖြူ</div></div>
        <span class="pcode-badge">MMR014006004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[96.6697889128281, 20.94926692712704], [96.66919025932305, 20.95065164295903], [96.66874710759299, 20.951578232449492], [96.66725650738198, 20.951940811219515], [96.66516161042006, 20.95113508071944], [96.6630667116595, 20.951336512669968], [96.66081066787808, 20.95145737255973], [96.65811147236661, 20.951860238259428], [96.6559762875757, 20.95238396205025], [96.65504969808518, 20.952101957139632], [96.65468712021448, 20.949201328778372], [96.65408282166493, 20.945333824896124], [96.65376052982464, 20.941627466934108], [96.65460654725439, 20.93852540662226], [96.65412310859466, 20.936027643960642], [96.65428827808165, 20.93387021893551], [96.65088111467179, 20.934105195598363], [96.64994072058784, 20.934249872233863], [96.64273103381021, 20.935359054676667], [96.64210410472072, 20.935985983766216], [96.6424175688158, 20.935985983766216], [96.65025418558224, 20.955734258629207], [96.6559658329569, 20.966871970964746], [96.65746387415851, 20.966705521742483], [96.65804286218838, 20.96822536520847], [96.66655434910399, 20.967959380820844], [96.67971986537952, 20.970153633983045], [96.68777388515673, 20.975522979601863], [96.68254104673196, 20.967332451731295], [96.6697889128281, 20.94926692712704]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
