
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kyoet Pin Sa Khan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Bago (West)</div><div class="name-mm">ပဲခူးတိုင်းဒေသကြီး (အနောက်)</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Letpadan</div><div class="name-mm">လက်ပံတန်း</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kyoet Pin Sa Khan</div><div class="name-mm">ကြို့ပင်စခန်း</div></div>
        <span class="pcode-badge">MMR008008012</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.8049106699915, 17.79075329173105], [95.80600716389955, 17.78856030301563], [95.80637266276824, 17.78563631836147], [95.80783465464566, 17.78332149579046], [95.80990581220351, 17.780641176149402], [95.80990581220351, 17.778326353578393], [95.81075864109846, 17.775524200981124], [95.81063342039607, 17.76998668124037], [95.80919071987586, 17.76976914243204], [95.80376254870271, 17.770707111943693], [95.80017289126596, 17.769614608327572], [95.79471036868864, 17.767429596598674], [95.79018427598362, 17.767585669443122], [95.78550211403137, 17.76664923687281], [95.78316103125667, 17.761030643249626], [95.78378532173525, 17.757753128803927], [95.78391715515266, 17.757655317638864], [95.78378045100709, 17.756574908105563], [95.78472294231, 17.756578598023907], [95.78526593767293, 17.754531615141957], [95.78054319561204, 17.752814253574968], [95.77806440324969, 17.769917277860145], [95.77780600824076, 17.77999470119454], [95.77932579684813, 17.78880396892805], [95.78651392777562, 17.78977862987989], [95.79869720091517, 17.79063145967416], [95.8049106699915, 17.79075329173105]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
