
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Sit Kwin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Ayeyarwady</div><div class="name-mm">ဧရာဝတီတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Hinthada</div><div class="name-mm">ဟင်္သာတ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Sit Kwin</div><div class="name-mm">စစ်ကွင်း</div></div>
        <span class="pcode-badge">MMR017008102</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.42824631971195, 17.62207919979528], [95.42519603966554, 17.619410250282897], [95.42205072016469, 17.61597891039844], [95.42071619999268, 17.612261460198283], [95.42033496029023, 17.608258170378292], [95.4148064400652, 17.606161169902123], [95.41446083959613, 17.606753820432516], [95.41347227962206, 17.608448789779857], [95.41147032039902, 17.61168960019495], [95.41104155962034, 17.61316703972716], [95.41061244001213, 17.614644390226488], [95.41213776034942, 17.618361840426644], [95.41325375965334, 17.62051923037825], [95.41356731997587, 17.621126010157298], [95.41375812014121, 17.62207919979528], [95.41290023975432, 17.6225557496482], [95.41594015241617, 17.62430612442813], [95.41795212019423, 17.62207919979528], [95.42310577691012, 17.62232854762442], [95.4238618801217, 17.622365130246635], [95.42448349062067, 17.622324592406073], [95.42824631971195, 17.62207919979528]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
