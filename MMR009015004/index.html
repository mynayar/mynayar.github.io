
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Ah Lel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Magway</div><div class="name-mm">မကွေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Kamma</div><div class="name-mm">ကံမ</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Ah Lel</div><div class="name-mm">အလယ်</div></div>
        <span class="pcode-badge">MMR009015004</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.00615779114918, 19.072060422650452], [95.00617518763488, 19.0716777017646], [95.00590481815289, 19.063566625399517], [95.00779740272799, 19.052211117049467], [95.0105010948497, 19.045722255777548], [95.0105010948497, 19.0384222860597], [95.00996035678509, 19.032744532334334], [95.00833814169192, 19.02679640912703], [95.00948540232952, 19.02556089891641], [95.00859650792256, 19.025412749998452], [94.99652925991745, 19.025859685176385], [94.99054206836183, 19.025574581202022], [94.98982523404737, 19.032563711046464], [94.98580281834546, 19.050888049743776], [94.979098791576, 19.059826752402728], [94.96792541482608, 19.062508362570952], [94.95956757978001, 19.066431428367764], [94.95988536511754, 19.067472449394074], [94.96333395040153, 19.087474237745937], [94.96519834392848, 19.092637178163272], [94.96589017169413, 19.091144287378995], [94.96940497226171, 19.088710963839958], [94.98049011112977, 19.083844316761883], [94.9899530340054, 19.078166563935838], [95.00615779114918, 19.072060422650452]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
