
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Kun Seik</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Sagaing</div><div class="name-mm">စစ်ကိုင်းတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Shwebo</div><div class="name-mm">ရွှေဘို</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Kun Seik</div><div class="name-mm">ကွန်ဆိပ်</div></div>
        <span class="pcode-badge">MMR005004014</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.60077464873109, 22.45607557083099], [95.5994520823478, 22.455450711980802], [95.59923897629778, 22.455350028381133], [95.59883700002757, 22.455160109551457], [95.59725725182079, 22.454967811115637], [95.59546810996534, 22.454748270416417], [95.59527269358, 22.4547260346788], [95.59495415281197, 22.454687228033208], [95.59467213621019, 22.454153932757833], [95.58355720370207, 22.450654596032848], [95.58137932899291, 22.44754334285102], [95.57959363603754, 22.445036211951674], [95.57847248271895, 22.446397656926365], [95.57792028009692, 22.44706821032969], [95.57667642327834, 22.449556186568827], [95.57622431969668, 22.45046048995971], [95.5768524008177, 22.452434607970815], [95.57730359968144, 22.453852769589673], [95.57720607719875, 22.456487874915524], [95.57714951973463, 22.458016080277957], [95.57622431969668, 22.462641899703954], [95.57483514682463, 22.465583448117684], [95.57360280042894, 22.46819292006728], [95.57298612001347, 22.47204780016591], [95.57307581030045, 22.47492003872884], [95.57314019996033, 22.476982050181505], [95.58485927993189, 22.477290479871783], [95.5894849203928, 22.477290479871783], [95.59082207108179, 22.47690419767065], [95.59642392022778, 22.475285909916863], [95.59843445178859, 22.474600479028936], [95.59818009023905, 22.460610601897827], [95.6003605693848, 22.456799340717055], [95.60077464873109, 22.45607557083099]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
