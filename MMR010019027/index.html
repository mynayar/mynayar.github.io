
<!DOCTYPE html>
<html>
<head>
    <title>Map View - Myin Ni</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 260px;
        }
        .label-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label-group:last-child { border-bottom: none; }
        .lvl { font-size: 0.75em; color: #888; text-transform: uppercase; font-weight: bold; }
        .name { font-size: 1em; color: #333; }
        .name-mm { font-size: 0.9em; color: #666; }
        .pcode-badge { 
            display: block; margin-top: 10px; background: #333; color: white; 
            padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8em; text-align: center;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="label-group"><div class="lvl">State/Region</div><div class="name">Mandalay</div><div class="name-mm">မန္တလေးတိုင်းဒေသကြီး</div></div><div class="label-group"><div class="lvl">Township</div><div class="name">Natogyi</div><div class="name-mm">နွားထိုးကြီး</div></div><div class="label-group"><div class="lvl">Village Tract</div><div class="name">Myin Ni</div><div class="name-mm">မြင်းနီ</div></div>
        <span class="pcode-badge">MMR010019027</span>
        <p style="margin-top:10px; font-size:0.7em; color:#bbb;">Table: vt_table</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map');
        // FIXED: Corrected the braces here ({s}, {z}, {x}, {y})
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);
        
        const geojsonData = {"type": "MultiPolygon", "coordinates": [[[[95.54516536498966, 21.422476296843683], [95.5454042132339, 21.422261333693655], [95.54645110233656, 21.417724816946816], [95.54664144474691, 21.416899995638346], [95.542517339104, 21.413600711303843], [95.53591876863635, 21.408239373248534], [95.53261948430179, 21.403290446297092], [95.53261948430179, 21.398753930449573], [95.53385671581486, 21.39462982390728], [95.53385671581486, 21.39170545794059], [95.52519609342505, 21.39091812756959], [95.5148858284183, 21.388856074748105], [95.51344213504655, 21.39527898873439], [95.50798118988007, 21.399699752841343], [95.50369448591186, 21.407252519288363], [95.50705002733696, 21.409889015865417], [95.51323618580142, 21.414425531712993], [95.51900993406127, 21.41483794281686], [95.52478368322045, 21.418137228050682], [95.53261948430179, 21.422261333693655], [95.5383932325617, 21.42432338741446], [95.54012794564824, 21.4253146516499], [95.5412801066916, 21.425973029132024], [95.54516536498966, 21.422476296843683]]]]};
        const layer = L.geoJSON(geojsonData, {
            style: { color: "#0066ff", weight: 3, opacity: 0.6, fillOpacity: 0.2 }
        }).addTo(map);
        
        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
